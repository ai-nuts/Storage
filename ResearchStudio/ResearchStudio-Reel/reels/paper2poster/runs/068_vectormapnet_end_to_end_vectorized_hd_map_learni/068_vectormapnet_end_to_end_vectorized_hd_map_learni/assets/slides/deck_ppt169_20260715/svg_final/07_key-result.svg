<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="cue_s07_c1_vectormapnet_sets_new_state_art" data-cue-label="VectorMapNet sets a new state of the art">
    <title>VectorMapNet sets a new state of the art</title>
    <desc>Header: new state of the art on both benchmarks</desc>
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">KEY RESULT</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">A new state of the art</text>
  </g>

  <g id="cue_s07_c2_beats_hdmapnet_14_2_map_nuscenes" data-cue-label="beats HDMapNet by 14.2 mAP nuScenes 14.6 Argoverse2">
    <title>Beats HDMapNet by 14.2 mAP on nuScenes and 14.6 on Argoverse2</title>
    <desc>Headline margin over prior best method HDMapNet on both benchmarks</desc>
    <rect x="80" y="184" width="1092" height="72" rx="4" fill="#E8EEFC"/>
    <rect x="80" y="184" width="6" height="72" fill="#1857D6"/>
    <text x="112" y="230" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#111418">Beats HDMapNet by <tspan font-weight="900" fill="#1857D6">+14.2 mAP</tspan> on nuScenes and <tspan font-weight="900" fill="#1857D6">+14.6</tspan> on Argoverse2.</text>
  </g>

  <g id="cue_s07_c3_gains_hold_across_sensors_nearly" data-cue-label="gains hold across sensors camera LiDAR fusion">
    <title>Gains hold across every sensor setting</title>
    <desc>Improvement over HDMapNet on nuScenes: camera +17.9, LiDAR +9.9, fusion +14.2 mAP</desc>
    <rect x="80" y="286" width="560" height="370" rx="4" fill="#F4F6F9"/>
    <text x="108" y="326" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#111418">Gains across sensors (Δ mAP)</text>
    <line x1="132" y1="600" x2="612" y2="600" stroke="#DBE0E6" stroke-width="2"/>
    <rect x="163" y="360" width="90" height="240" fill="#1857D6"/>
    <text x="208" y="348" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#111418">+17.9</text>
    <text x="208" y="628" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#5C636E">Camera</text>
    <rect x="323" y="467" width="90" height="133" fill="#1857D6"/>
    <text x="368" y="455" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#111418">+9.9</text>
    <text x="368" y="628" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#5C636E">LiDAR</text>
    <rect x="483" y="410" width="90" height="190" fill="#1857D6"/>
    <text x="528" y="398" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="900" fill="#111418">+14.2</text>
    <text x="528" y="628" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#5C636E">Fusion</text>
  </g>

  <g id="cue_s07_c4_two_stage_fine_tuning_pushes_fusion" data-cue-label="two-stage fine-tuning pushes fusion to 53.7 mAP versus 31.0">
    <title>Two-stage fine-tuning pushes fusion to 53.7 mAP versus 31.0</title>
    <desc>Best configuration fusion with fine-tuning reaches 53.7 mAP where HDMapNet reaches 31.0</desc>
    <rect x="672" y="286" width="500" height="370" rx="4" fill="#F4F6F9"/>
    <text x="700" y="326" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#111418">Fusion + fine-tuning (mAP)</text>
    <line x1="724" y1="600" x2="1140" y2="600" stroke="#DBE0E6" stroke-width="2"/>
    <rect x="772" y="370" width="120" height="230" fill="#1857D6"/>
    <text x="832" y="358" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="30" font-weight="900" fill="#111418">53.7</text>
    <text x="832" y="628" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#1857D6">VectorMapNet</text>
    <rect x="972" y="466" width="120" height="134" fill="#9AA1AB"/>
    <text x="1032" y="454" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#5C636E">31.0</text>
    <text x="1032" y="628" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#9AA1AB">HDMapNet</text>
  </g>
</svg>
