<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="cue_s05_c1_vectormapnet_three_stages" data-cue-label="VectorMapNet has three stages">
    <title>VectorMapNet has three stages</title>
    <desc>Header: the model is a three-stage pipeline</desc>
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">METHOD</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">A three-stage pipeline</text>
  </g>

  <g id="cue_s05_c2_bird_s_eye_view_extractor_maps_modal" data-cue-label="bird's-eye-view extractor maps each modality into shared space">
    <title>BEV feature extractor maps each modality into a shared top-down space</title>
    <desc>Camera through ResNet and inverse perspective mapping, LiDAR through PointPillars, fused by concatenation</desc>
    <rect x="80" y="196" width="440" height="140" rx="4" fill="#F4F6F9"/>
    <rect x="80" y="196" width="6" height="140" fill="#1857D6"/>
    <text x="104" y="284" font-family="Arial, Segoe UI, sans-serif" font-size="40" font-weight="900" fill="#1857D6">1</text>
    <text x="156" y="240" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="800" fill="#111418">BEV feature extractor</text>
    <text x="156" y="272" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#5C636E">Camera (ResNet + IPM) and LiDAR<tspan x="156" dy="24">(PointPillars), fused into a shared BEV.</tspan></text>
  </g>

  <g id="cue_s05_c3_detection_transformer_element_querie" data-cue-label="detection transformer with element queries locates each element">
    <title>A detection transformer with element queries locates each element</title>
    <desc>DETR-style element queries and deformable attention predict keypoints and class labels</desc>
    <rect x="80" y="352" width="440" height="140" rx="4" fill="#F4F6F9"/>
    <rect x="80" y="352" width="6" height="140" fill="#1857D6"/>
    <text x="104" y="440" font-family="Arial, Segoe UI, sans-serif" font-size="40" font-weight="900" fill="#1857D6">2</text>
    <text x="156" y="396" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="800" fill="#111418">Map element detector</text>
    <text x="156" y="428" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#5C636E">DETR-style element queries and<tspan x="156" dy="24">deformable attention predict each</tspan><tspan x="156" dy="24">element's keypoints and class.</tspan></text>
  </g>

  <g id="cue_s05_c4_autoregressive_polyline_generator_em" data-cue-label="autoregressive polyline generator emits ordered vertices">
    <title>An autoregressive polyline generator emits ordered vertices</title>
    <desc>Autoregressive Transformer decodes each element into ordered polyline vertices, trained with detection and generation loss</desc>
    <rect x="80" y="508" width="440" height="140" rx="4" fill="#F4F6F9"/>
    <rect x="80" y="508" width="6" height="140" fill="#1857D6"/>
    <text x="104" y="596" font-family="Arial, Segoe UI, sans-serif" font-size="40" font-weight="900" fill="#1857D6">3</text>
    <text x="156" y="552" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="800" fill="#111418">Polyline generator</text>
    <text x="156" y="584" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#5C636E">An autoregressive Transformer decodes<tspan x="156" dy="24">each element into ordered vertices,</tspan><tspan x="156" dy="24">one coordinate at a time.</tspan></text>
  </g>

  <g id="architecture-figure">
    <text x="556" y="212" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#111418">Figure 2 · Network architecture</text>
    <rect x="556" y="224" width="120" height="3" fill="#1857D6"/>
    <rect x="556" y="240" width="616" height="268" rx="4" fill="#F4F6F9"/>
    <image href="../images/figure2.png" x="572" y="252" width="584" height="244" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="loss-card">
    <rect x="556" y="528" width="616" height="120" rx="4" fill="#E8EEFC"/>
    <rect x="556" y="528" width="6" height="120" fill="#1857D6"/>
    <text x="588" y="572" font-family="Arial, Segoe UI, sans-serif" font-size="34" font-weight="900" fill="#111418">ℒ = ℒ<tspan font-size="20" font-weight="700">det</tspan> + ℒ<tspan font-size="20" font-weight="700">gen</tspan></text>
    <text x="588" y="616" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#5C636E">Bipartite-matching detection loss + polyline generation loss,</text>
    <text x="588" y="640" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#5C636E">trained end to end.</text>
  </g>
</svg>
