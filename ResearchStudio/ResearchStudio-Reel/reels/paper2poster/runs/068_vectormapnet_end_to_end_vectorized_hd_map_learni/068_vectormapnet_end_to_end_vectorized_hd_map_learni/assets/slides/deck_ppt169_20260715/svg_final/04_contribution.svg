<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6" /></g>

  <g id="cue_s04_c1_vectormapnet_makes_three_contributio" data-cue-label="VectorMapNet makes three contributions">
    <title>VectorMapNet makes three contributions</title>
    <desc>Header: the paper makes three main contributions</desc>
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">CONTRIBUTION</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">Three contributions</text>
    <text x="82" y="184" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#5C636E">One end-to-end system, one flexible primitive, one detector adapted to BEV.</text>
  </g>

  <g id="cue_s04_c2_predicts_vectorized_outputs_directly" data-cue-label="predicts vectorized outputs directly from sensors no rasterization">
    <title>Predicts vectorized outputs directly from sensors</title>
    <desc>End-to-end mapping with no rasterization and no post-processing</desc>
    <rect x="80" y="228" width="346" height="428" rx="4" fill="#F4F6F9" />
    <rect x="80" y="228" width="346" height="6" fill="#1857D6" />
    <text x="108" y="312" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">01</text>
    <text x="108" y="360" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#111418">Direct vector output</text>
    <text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="108" y="408">Predicts vectorized outputs</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="108" y="438">directly from sensor data —</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="108" y="468">no rasterization and no</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="108" y="498">post-processing step.</text></g>

  <g id="cue_s04_c3_polyline_one_flexible_primitive_poin" data-cue-label="polyline one flexible primitive points lines curves polygons">
    <title>The polyline is one flexible primitive for points, lines, curves, polygons</title>
    <desc>A single primitive whose vertex order encodes direction</desc>
    <rect x="453" y="228" width="346" height="428" rx="4" fill="#F4F6F9" />
    <rect x="453" y="228" width="346" height="6" fill="#1857D6" />
    <text x="481" y="312" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">02</text>
    <text x="481" y="360" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#111418">Polyline primitive</text>
    <text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="481" y="408">One polyline represents</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="481" y="438">points, lines, curves, and</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="481" y="468">polygons, and its vertex</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="481" y="498">order encodes direction.</text></g>

  <g id="cue_s04_c4_adapts_detection_transformers_locate" data-cue-label="adapts detection transformers to locate elements in bird's-eye view">
    <title>Adapts detection transformers to locate elements in bird's-eye view</title>
    <desc>DETR-style detector localizes deformable map elements in BEV space, trainable end to end</desc>
    <rect x="826" y="228" width="346" height="428" rx="4" fill="#F4F6F9" />
    <rect x="826" y="228" width="346" height="6" fill="#1857D6" />
    <text x="854" y="312" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">03</text>
    <text x="854" y="360" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#111418">Detection in BEV</text>
    <text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="854" y="408">Adapts detection transformers</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="854" y="438">to locate deformable map</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="854" y="468">elements of varying size in</text><text font-weight="400" fill="#5C636E" font-size="20" font-family="Arial, Segoe UI, sans-serif" x="854" y="498">bird's-eye-view space.</text></g>
</svg>