<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="cue_s08_c1_two_ablations_stand_out" data-cue-label="two ablations stand out">
    <title>Two ablations stand out</title>
    <desc>Header: two key ablations — keypoint representation and two-stage training</desc>
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">ABLATION STUDY</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">Two ablations stand out</text>
  </g>

  <g id="cue_s08_c2_representing_element_bounding_box_tw" data-cue-label="representing element by bounding box with two keypoints beats alternatives">
    <title>Bounding box with two keypoints beats the alternatives</title>
    <desc>Keypoint representations: bounding box k=2 beats SME and extreme points by 2.0 Frechet and 7.3 Chamfer mAP</desc>
    <text x="80" y="196" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" letter-spacing="1" fill="#111418">Figure 3 · Keypoint representations — Bounding Box (k=2), SME (k=3), Extreme (k=4)</text>
    <rect x="80" y="210" width="1092" height="150" rx="4" fill="#F4F6F9"/>
    <image href="../images/figure3.png" x="96" y="222" width="1060" height="126" preserveAspectRatio="xMidYMid meet"/>
    <rect x="80" y="376" width="1092" height="72" rx="4" fill="#E8EEFC"/>
    <rect x="80" y="376" width="6" height="72" fill="#1857D6"/>
    <text x="112" y="421" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#111418">Bounding box (k=2) wins — <tspan font-weight="900" fill="#1857D6">+2.0 Fréchet</tspan> and <tspan font-weight="900" fill="#1857D6">+7.3 Chamfer mAP</tspan> over SME and Extreme.</text>
  </g>

  <g id="cue_s08_c3_two_stage_teacher_forcing_fine_tunin" data-cue-label="two-stage teacher forcing then fine-tuning on predicted keypoints">
    <title>Two-stage training: teacher forcing then fine-tuning on predicted keypoints</title>
    <desc>Two-stage training adds about 6.9 mAP for camera and over 8.5 mAP for fusion</desc>
    <rect x="80" y="472" width="1092" height="184" rx="4" fill="#F4F6F9"/>
    <rect x="80" y="472" width="6" height="184" fill="#1857D6"/>
    <text x="116" y="520" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#111418">Two-stage training</text>
    <text x="116" y="558" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#5C636E">Teacher forcing, then fine-tuning on the model's own</text>
    <text x="116" y="586" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="400" fill="#5C636E">predicted keypoints, cuts exposure bias.</text>
    <rect x="700" y="500" width="216" height="128" rx="4" fill="#E8EEFC"/>
    <text x="808" y="576" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">+6.9</text>
    <text x="808" y="608" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#5C636E">mAP · camera</text>
    <rect x="940" y="500" width="216" height="128" rx="4" fill="#E8EEFC"/>
    <text x="1048" y="576" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">+8.5</text>
    <text x="1048" y="608" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#5C636E">mAP · fusion</text>
  </g>
</svg>
