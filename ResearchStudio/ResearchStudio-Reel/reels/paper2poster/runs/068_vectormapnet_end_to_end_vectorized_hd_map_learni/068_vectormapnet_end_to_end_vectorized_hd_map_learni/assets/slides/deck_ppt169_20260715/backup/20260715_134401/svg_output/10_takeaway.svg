<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="ending">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="header">
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">TAKEAWAY</text>
    <text x="80" y="150" font-family="Arial, Segoe UI, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#111418">No detour needed</text>
  </g>

  <g id="cue_s10_c1_takeaway_mapping_needs_rasterize_the" data-cue-label="HD mapping needs no rasterize-then-vectorize detour">
    <title>HD mapping needs no rasterize-then-vectorize detour</title>
    <desc>Takeaway: mapping does not need the rasterize-then-vectorize detour</desc>
    <text x="80" y="256" font-family="Arial, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#111418">HD mapping needs <tspan fill="#1857D6">no</tspan></text>
    <text x="80" y="302" font-family="Arial, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#1857D6">rasterize-then-vectorize detour.</text>
  </g>

  <g id="cue_s10_c2_treating_mapping_detection_plus_auto" data-cue-label="treating mapping as detection plus autoregressive polyline generation">
    <title>Treating mapping as detection plus autoregressive polyline generation</title>
    <desc>Detection plus autoregressive polyline generation gives clean directional vector maps from sensors, extends to centerlines</desc>
    <text x="80" y="376" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="400" fill="#5C636E">Treating map construction as detection plus<tspan x="80" dy="32">autoregressive polyline generation yields clean,</tspan><tspan x="80" dy="32">directional vector maps straight from cameras and</tspan><tspan x="80" dy="32">LiDAR — beating rasterized pipelines by double</tspan><tspan x="80" dy="32">digits, and even extending to centerlines unchanged.</tspan></text>
  </g>

  <g id="closing-link">
    <rect x="80" y="596" width="132" height="3" fill="#1857D6"/>
    <text x="80" y="636" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="400" fill="#5C636E">arxiv.org/abs/2206.08920 · github.com/Mrmoore98/VectorMapNet_code</text>
  </g>

  <g id="qualitative-figure">
