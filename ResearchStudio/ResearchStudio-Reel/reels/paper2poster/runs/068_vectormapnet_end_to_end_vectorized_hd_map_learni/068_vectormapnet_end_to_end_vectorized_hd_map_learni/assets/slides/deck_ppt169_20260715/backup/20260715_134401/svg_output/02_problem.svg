<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="header">
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">PROBLEM</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">Rasterized maps are not what a planner wants</text>
  </g>

  <g id="cue_s02_c1_self_driving_cars_need_maps_marking" data-cue-label="self-driving cars need maps marking lanes boundaries crossings">
    <title>Self-driving cars need HD maps marking lanes, boundaries, and crossings</title>
    <desc>What autonomous driving needs: vectorized HD semantic maps of lanes, road boundaries, pedestrian crossings</desc>
    <rect x="80" y="204" width="346" height="452" rx="4" fill="#F4F6F9"/>
    <rect x="80" y="204" width="346" height="6" fill="#1857D6"/>
    <text x="108" y="286" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">01</text>
    <text x="108" y="336" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#111418">What driving needs</text>
    <text x="108" y="384" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#5C636E">Self-driving cars need HD<tspan x="108" dy="30">semantic maps that mark</tspan><tspan x="108" dy="30">lanes, road boundaries, and</tspan><tspan x="108" dy="30">pedestrian crossings.</tspan></text>
  </g>

  <g id="cue_s02_c2_today_these_annotated_hand_which" data-cue-label="today these annotated by hand which is costly">
    <title>Today these maps are annotated by hand, which does not scale</title>
    <desc>Manual annotation is expensive and impossible to scale across cities</desc>
    <rect x="453" y="204" width="346" height="452" rx="4" fill="#F4F6F9"/>
    <rect x="453" y="204" width="346" height="6" fill="#1857D6"/>
    <text x="481" y="286" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">02</text>
    <text x="481" y="336" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#111418">Annotated by hand</text>
    <text x="481" y="384" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#5C636E">Today these maps are mostly<tspan x="481" dy="30">built manually — expensive</tspan><tspan x="481" dy="30">and impossible to scale</tspan><tspan x="481" dy="30">across the world's cities.</tspan></text>
  </g>

  <g id="cue_s02_c3_learning_methods_instead_predict_den" data-cue-label="learning methods instead predict dense pixel grid">
    <title>Learning methods instead predict a dense pixel grid</title>
    <desc>Dense BEV pixel grid has no individual elements and needs brittle post-processing to vectorize</desc>
    <rect x="826" y="204" width="346" height="452" rx="4" fill="#F4F6F9"/>
    <rect x="826" y="204" width="346" height="6" fill="#1857D6"/>
    <text x="854" y="286" font-family="Arial, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#1857D6">03</text>
    <text x="854" y="336" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#111418">Dense pixel grids</text>
    <text x="854" y="384" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#5C636E">A BEV pixel grid carries no<tspan x="854" dy="30">individual elements, is hard</tspan><tspan x="854" dy="30">to keep consistent, and needs</tspan><tspan x="854" dy="30">brittle post-processing before</tspan><tspan x="854" dy="30">a planner can use it.</tspan></text>
  </g>
</svg>
