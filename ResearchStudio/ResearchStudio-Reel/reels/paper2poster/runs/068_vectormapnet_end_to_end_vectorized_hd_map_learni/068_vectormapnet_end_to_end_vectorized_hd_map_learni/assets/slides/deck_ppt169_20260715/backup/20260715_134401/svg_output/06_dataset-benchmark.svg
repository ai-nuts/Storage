<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="header">
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">DATASET · BENCHMARK</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">Two datasets, order-aware metrics</text>
  </g>

  <g id="cue_s06_c1_vectormapnet_evaluated_nuscenes_argo" data-cue-label="VectorMapNet evaluated on nuScenes and Argoverse2">
    <title>Evaluated on nuScenes and Argoverse2</title>
    <desc>Two public autonomous-driving datasets; Argoverse2 adds height for 3D evaluation</desc>
    <rect x="80" y="204" width="346" height="452" rx="4" fill="#F4F6F9"/>
    <rect x="80" y="204" width="346" height="6" fill="#1857D6"/>
    <text x="108" y="262" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#111418">Datasets</text>
    <rect x="108" y="288" width="290" height="60" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="108" y="288" width="5" height="60" fill="#1857D6"/>
    <text x="132" y="325" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#111418">nuScenes</text>
    <rect x="108" y="364" width="290" height="86" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="108" y="364" width="5" height="86" fill="#1857D6"/>
    <text x="132" y="399" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#111418">Argoverse2</text>
    <text x="132" y="426" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#5C636E">includes height → 2D and 3D eval</text>
    <text x="108" y="504" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#5C636E">Two public autonomous-<tspan x="108" dy="26">driving datasets.</tspan></text>
  </g>

  <g id="cue_s06_c2_following_hdmapnet_predicted_polylin" data-cue-label="following HDMapNet predicted polylines compared to ground truth">
    <title>Predicted polylines compared to ground truth for three element types</title>
    <desc>Following HDMapNet: pedestrian crossings, lane dividers, road boundaries</desc>
    <rect x="453" y="204" width="346" height="452" rx="4" fill="#F4F6F9"/>
    <rect x="453" y="204" width="346" height="6" fill="#1857D6"/>
    <text x="481" y="262" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#111418">Elements evaluated</text>
    <rect x="481" y="288" width="290" height="56" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="481" y="288" width="5" height="56" fill="#1857D6"/>
    <text x="505" y="323" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111418">Pedestrian crossings</text>
    <rect x="481" y="358" width="290" height="56" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="481" y="358" width="5" height="56" fill="#1857D6"/>
    <text x="505" y="393" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111418">Lane dividers</text>
    <rect x="481" y="428" width="290" height="56" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="481" y="428" width="5" height="56" fill="#1857D6"/>
    <text x="505" y="463" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111418">Road boundaries</text>
    <text x="481" y="536" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#5C636E">Predicted polylines compared<tspan x="481" dy="26">to ground truth, following</tspan><tspan x="481" dy="26">HDMapNet.</tspan></text>
  </g>

  <g id="cue_s06_c3_reports_chamfer_distance_average_pre" data-cue-label="reports Chamfer-distance AP and new Fréchet-distance AP respecting order">
    <title>Reports Chamfer-distance AP and a new Fréchet-distance AP</title>
    <desc>Fréchet-distance AP respects vertex order; 3D evaluation on Argoverse2</desc>
    <rect x="826" y="204" width="346" height="452" rx="4" fill="#F4F6F9"/>
    <rect x="826" y="204" width="346" height="6" fill="#1857D6"/>
    <text x="854" y="262" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#111418">Metrics</text>
    <rect x="854" y="288" width="290" height="56" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="854" y="288" width="5" height="56" fill="#1857D6"/>
    <text x="878" y="323" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111418">Chamfer-distance AP</text>
    <rect x="854" y="358" width="290" height="86" rx="4" fill="#E8EEFC" stroke="#1857D6" stroke-width="2"/>
    <rect x="854" y="358" width="5" height="86" fill="#1857D6"/>
    <text x="878" y="393" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="800" fill="#111418">Fréchet-distance AP</text>
    <text x="878" y="420" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#5C636E">new — respects vertex order</text>
    <rect x="854" y="458" width="290" height="56" rx="4" fill="#FFFFFF" stroke="#DBE0E6" stroke-width="1.5"/>
    <rect x="854" y="458" width="5" height="56" fill="#1857D6"/>
    <text x="878" y="493" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#111418">3D eval (Argoverse2)</text>
    <text x="854" y="566" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#5C636E">AP at 0.5 / 1.0 / 1.5 m<tspan x="854" dy="26">matching thresholds.</tspan></text>
  </g>
</svg>
