<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <defs>
    <marker id="arrowGrey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9AA1AB"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1857D6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="background"><rect x="0" y="0" width="12" height="720" fill="#1857D6"/></g>

  <g id="header">
    <text x="80" y="92" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#1857D6">MOTIVATION</text>
    <text x="80" y="146" font-family="Arial, Segoe UI, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#111418">Predict geometry, end to end</text>
  </g>

  <g id="cue_s03_c1_authors_argue_mapping_should_happen" data-cue-label="authors argue mapping should happen online output final representation directly">
    <title>Mapping should happen online and output the final representation directly</title>
    <desc>Online mapping from onboard cameras and LiDAR avoids annotation and localization errors; output vectors directly</desc>
    <text x="80" y="238" font-family="Arial, Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#111418">Mapping should happen <tspan font-weight="800" fill="#1857D6">online</tspan> — from the car's own</text>
    <text x="80" y="282" font-family="Arial, Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#111418">cameras and LiDAR — and the model should output</text>
    <text x="80" y="326" font-family="Arial, Segoe UI, sans-serif" font-size="30" font-weight="600" fill="#111418">the final <tspan font-weight="800" fill="#1857D6">vector map directly</tspan>.</text>
  </g>

  <g id="cue_s03_c2_prior_methods_rasterize_vectorize_ha" data-cue-label="prior methods rasterize then vectorize with a hand-designed step">
    <title>Prior methods rasterize then vectorize with a hand-designed step</title>
    <desc>HDMapNet detour: sensors to rasterized map to hand-designed post-processing to vectors; VectorMapNet goes direct</desc>

    <text x="80" y="452" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#9AA1AB">PRIOR · HDMapNet</text>
    <rect x="80" y="472" width="150" height="56" rx="4" fill="#F4F6F9" stroke="#DBE0E6" stroke-width="1.5"/>
    <text x="155" y="506" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5C636E">Sensors</text>
    <rect x="286" y="472" width="176" height="56" rx="4" fill="#F4F6F9" stroke="#DBE0E6" stroke-width="1.5"/>
    <text x="374" y="506" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5C636E">Rasterized map</text>
    <rect x="518" y="472" width="210" height="56" rx="4" fill="#F4F6F9" stroke="#DBE0E6" stroke-width="1.5"/>
    <text x="623" y="500" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5C636E">Hand-designed</text>
    <text x="623" y="519" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="15" font-weight="400" fill="#9AA1AB">post-processing</text>
    <rect x="784" y="472" width="150" height="56" rx="4" fill="#F4F6F9" stroke="#DBE0E6" stroke-width="1.5"/>
    <text x="859" y="506" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5C636E">Vectors</text>
    <line x1="234" y1="500" x2="282" y2="500" stroke="#9AA1AB" stroke-width="2" marker-end="url(#arrowGrey)"/>
    <line x1="466" y1="500" x2="514" y2="500" stroke="#9AA1AB" stroke-width="2" marker-end="url(#arrowGrey)"/>
    <line x1="732" y1="500" x2="780" y2="500" stroke="#9AA1AB" stroke-width="2" marker-end="url(#arrowGrey)"/>
    <text x="980" y="506" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#9AA1AB">the detour</text>

    <text x="80" y="588" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#1857D6">VECTORMAPNET</text>
    <rect x="80" y="608" width="150" height="56" rx="4" fill="#F4F6F9" stroke="#DBE0E6" stroke-width="1.5"/>
    <text x="155" y="642" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#5C636E">Sensors</text>
    <rect x="784" y="608" width="150" height="56" rx="4" fill="#E8EEFC" stroke="#1857D6" stroke-width="2"/>
    <text x="859" y="642" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#111418">Vectors</text>
    <line x1="234" y1="636" x2="780" y2="636" stroke="#1857D6" stroke-width="2.5" marker-end="url(#arrowAccent)"/>
    <text x="507" y="626" text-anchor="middle" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1857D6">direct — no rasterization</text>
  </g>
</svg>
