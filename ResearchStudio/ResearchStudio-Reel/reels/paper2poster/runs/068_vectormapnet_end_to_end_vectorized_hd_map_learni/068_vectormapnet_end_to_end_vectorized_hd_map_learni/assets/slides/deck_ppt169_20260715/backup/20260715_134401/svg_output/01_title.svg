  </g>

  <g id="cue_s01_c2_skips_rasterization_entirely_sets_ne" data-cue-label="skips rasterization entirely, sets new state of the art">
    <title>skips rasterization entirely and sets a new state of the art</title>
    <desc>New state of the art headline: +14.2 mAP nuScenes, +14.6 mAP Argoverse2</desc>
    <rect x="900" y="70" width="310" height="176" rx="4" fill="#E8EEFC"/>
