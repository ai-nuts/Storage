    <text x="1064" y="170" font-family="Arial, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#5C636E">/ +14.6</text>
    <text x="928" y="204" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="400" fill="#5C636E">mAP over HDMapNet</text>
    <text x="928" y="228" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="#9AA1AB">nuScenes · Argoverse2</text>
