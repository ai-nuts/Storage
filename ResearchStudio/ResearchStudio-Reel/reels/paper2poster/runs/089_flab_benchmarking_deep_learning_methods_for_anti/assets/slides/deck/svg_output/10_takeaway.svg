<text x="96" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="800" fill="#EAF1FB" text-anchor="start">No current model reliably predicts antibody fitness across all properties</text>
<text x="96" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">so we cannot yet trust deep learning to filter therapeutic candidates on its own</text>
</g>
