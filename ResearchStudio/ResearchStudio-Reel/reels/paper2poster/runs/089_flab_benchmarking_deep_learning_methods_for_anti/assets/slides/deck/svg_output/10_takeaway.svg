<g id="cue_s10_c1_takeaway_honest_useful_current_deep">
  <title>takeaway honest useful current deep learning reliably predicts antibody fitness</title>
  <desc>Takeaway honest useful no current deep learning reliably predicts antibody fitness across all properties.</desc>
