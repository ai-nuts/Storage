<text x="871.3333333333334" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">No additional fine-tuning. Three</text>
<text x="871.3333333333334" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">architecture families are compared</text>
<text x="871.3333333333334" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">exactly as published:</text>
