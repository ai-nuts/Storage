<g id="cue_s05_c1_core_idea_simple_every_antibody">
  <title>core idea simple every antibody sequence its structure fed reports</title>
  <desc>Core idea simple every antibody sequence or structure fed model reports perplexity averaged residues.</desc>
<rect x="56" y="160" width="1168" height="116" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="76" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start">Score each antibody by model perplexity, averaged over all heavy- and light-chain residues</text>
<text x="76" y="240" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="26" font-weight="700" fill="#EAF1FB" text-anchor="start">PPL(s) = exp( - 1/N  Sum_i  log p(x_i | x_&lt;i) )</text>
</g>
<g id="cue_s05_c2_perplexity_measures_how_surprised_se">
  <title>perplexity measures how surprised sequence well-behaved should confident meaning low</title>
  <desc>Perplexity measures how surprised well-behaved model should be confident low perplexity high fitness.</desc>
<rect x="56" y="298" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="78" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4F9DF7" text-anchor="start">1  Low perplexity = confidence</text>
<text x="78" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Perplexity measures how surprised a</text>
<text x="78" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">model is. A well-behaved model</text>
<text x="78" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">should be confident about</text>
<text x="78" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">high-fitness antibodies.</text>
<rect x="78" y="460" width="330.6666666666667" height="34" rx="9" ry="9" fill="#0E1A30" />
<text x="92" y="482" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#37DCC0" text-anchor="start">low PPL  &lt;-&gt;  high fitness</text>
</g>
<g id="cue_s05_c3_authors_correlate_these_scores_again">
  <title>authors correlate these scores against real experimental fitness three coefficients</title>
  <desc>Authors correlate these scores against real experimental fitness three coefficients Pearson Spearman Kendall.</desc>
