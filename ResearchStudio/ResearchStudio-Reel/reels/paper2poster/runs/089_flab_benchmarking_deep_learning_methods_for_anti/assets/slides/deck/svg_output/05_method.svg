<text x="474.6666666666667" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4F9DF7" text-anchor="start">2  Correlate with fitness</text>
<text x="474.6666666666667" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Correlate model scores against real</text>
<text x="474.6666666666667" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">experimental fitness using three</text>
<text x="474.6666666666667" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">coefficients:</text>
<rect x="474.6666666666667" y="438" width="330.6666666666667" height="56" rx="9" ry="9" fill="#0E1A30" />
<text x="488.6666666666667" y="462" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#EAF1FB" text-anchor="start">Pearson r  ·  Spearman rho</text>
<text x="488.6666666666667" y="482" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#EAF1FB" text-anchor="start">Kendall tau</text>
</g>
<g id="cue_s05_c4_crucially_models_used_exactly_releas">
