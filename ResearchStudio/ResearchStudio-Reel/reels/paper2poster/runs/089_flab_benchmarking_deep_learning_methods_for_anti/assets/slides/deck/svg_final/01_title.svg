<rect x="92" y="432" width="5" height="22" rx="2.5" fill="#F7B84B" />
<text x="114" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="600" fill="#EAF1FB" text-anchor="start">Headline finding: no single model correlates well with all six properties, and performance swings sharply across datasets.</text>
</g>
