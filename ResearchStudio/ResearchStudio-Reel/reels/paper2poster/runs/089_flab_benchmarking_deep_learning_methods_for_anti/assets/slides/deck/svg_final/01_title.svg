<rect x="92" y="292" width="6" height="80" rx="2.5" fill="#37DCC0" />
<text x="112" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="800" fill="#37DCC0" text-anchor="start">FLAb</text>
<text x="200" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1FB" text-anchor="start">Fitness Landscape for Antibodies</text>
<text x="112" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">The largest therapeutic antibody design benchmark</text>
<text x="112" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">assembled to date, released openly for the community.</text>
</g>
<g id="cue_s01_c3_gathers_experimental_measurements_si">
  <title>gathers experimental measurements six developability properties them stress-test six widely</title>
  <desc>Gathers experimental measurements for six developability properties stress-tests six models against Rosetta.</desc>
<rect x="712" y="268" width="496" height="128" rx="16" ry="16" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.4" />
<text x="736" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="52" font-weight="800" fill="url(#warmg)" text-anchor="start">13,384</text>
<text x="902" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">experimental</text>
<text x="902" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="600" fill="#EAF1FB" text-anchor="start">fitness measurements</text>
<text x="736" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="500" fill="#EAF1FB" text-anchor="start">6 developability properties  ·  6 models  vs  Rosetta</text>
</g>
<g id="cue_s01_c4_headline_finding_sobering_single_cor">
  <title>headline finding sobering single correlates well all six properties performance</title>
  <desc>Headline finding sobering no single model correlates well all six properties performance swings.</desc>
