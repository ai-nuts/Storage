<text x="72" y="612" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="1.2">NeurIPS 2023  ·  Machine Learning for Structural Biology Workshop</text>
<text x="72" y="638" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="500" fill="#6E85AC" text-anchor="start">biorxiv.org/content/10.1101/2024.01.13.575504    ·    github.com/Graylab/FLAb</text>
