<g id="cue_s01_c1_machine_learning_promises_accelerate">
  <title>machine learning promises accelerate therapeutic antibody design but only models</title>
  <desc>Machine learning promises to accelerate therapeutic antibody design if models read fitness.</desc>
<rect x="72" y="82" width="6" height="30" rx="2.5" fill="#4F9DF7" />
<text x="92" y="94" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="2.5">MACHINE LEARNING  ·  THERAPEUTIC ANTIBODY DESIGN</text>
<text x="92" y="124" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#A6BADB" text-anchor="start">Machine learning can accelerate antibody design only if models can read the fitness landscape.</text>
</g>
<text x="72" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="66" font-weight="800" fill="#EAF1FB" text-anchor="start">FLAb</text>
<text x="250" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="500" fill="#A6BADB" text-anchor="start">The Fitness Landscape for Antibodies</text>
<text x="72" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="500" fill="#6E85AC" text-anchor="start">Benchmarking deep learning methods for antibody fitness prediction</text>
<g id="cue_s01_c2_introduces_flab_fitness_landscape_an">
  <title>introduces flab fitness landscape antibodies largest therapeutic antibody benchmark date</title>
  <desc>Introduces FLAb the fitness landscape for antibodies largest therapeutic antibody benchmark to date.</desc>
