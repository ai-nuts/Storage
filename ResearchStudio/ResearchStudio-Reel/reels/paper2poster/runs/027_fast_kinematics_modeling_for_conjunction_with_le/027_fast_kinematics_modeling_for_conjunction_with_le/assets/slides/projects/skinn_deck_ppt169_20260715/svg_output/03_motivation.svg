<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A1E12"/>
      <stop offset="1" stop-color="#2A1810"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">03</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">MOTIVATION</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">Richer data needs axisymmetric physics</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s03_c1_recently_spatially_resolved_kinemati" data-cue-label="recently spatially resolved kinematics lensing galaxies JWST available">
    <title>spatially resolved kinematics now available from JWST</title>
    <rect x="80" y="180" width="357" height="238" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="180" width="357" height="5" rx="2.5" fill="#4F9DFF"/>
    <circle cx="118" cy="224" r="16" fill="none" stroke="#4F9DFF" stroke-width="2.5"/>
    <circle cx="118" cy="224" r="4" fill="#4F9DFF"/>
    <text x="150" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">New data</text>
    <text x="104" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Spatially resolved kinematics</text>
    <text x="104" y="304" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">of lensing galaxies are now</text>
    <text x="104" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">available from instruments</text>
    <text x="104" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">like the James Webb Space</text>
    <text x="104" y="382" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Telescope.</text>
  </g>

  <g id="cue_s03_c2_traditional_spherical_jeans_models_t" data-cue-label="traditional spherical jeans models too simplistic not self-consistent elliptical">
    <title>spherical Jeans models are too simplistic and inconsistent</title>
    <rect x="461" y="180" width="357" height="238" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="461" y="180" width="357" height="5" rx="2.5" fill="#4F9DFF"/>
    <circle cx="499" cy="224" r="16" fill="none" stroke="#4F9DFF" stroke-width="2.5"/>
    <line x1="489" y1="214" x2="509" y2="234" stroke="#4F9DFF" stroke-width="2.5"/>
    <text x="531" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Old models fail</text>
    <text x="485" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Simple spherical Jeans models</text>
    <text x="485" y="304" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">are too crude for this richer</text>
    <text x="485" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">data and are not self-consistent</text>
    <text x="485" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">with the elliptical mass models</text>
    <text x="485" y="382" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">used in lensing.</text>
  </g>

  <g id="cue_s03_c3_natural_next_step_axisymmetric_model" data-cue-label="natural next step axisymmetric modeling JAM expensive too slow">
    <title>axisymmetric JAM is the next step but too expensive</title>
    <rect x="842" y="180" width="358" height="238" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="842" y="180" width="358" height="5" rx="2.5" fill="#FF7A3D"/>
    <ellipse cx="880" cy="224" rx="17" ry="10" fill="none" stroke="#FF7A3D" stroke-width="2.5"/>
    <circle cx="880" cy="224" r="3.5" fill="#FF7A3D"/>
    <text x="912" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">JAM — but slow</text>
    <text x="866" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Axisymmetric modeling with</text>
    <text x="866" y="304" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">software such as JAM is the</text>
    <text x="866" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">natural next step, yet it stays</text>
    <text x="866" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">far too expensive for full joint</text>
    <text x="866" y="382" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">parameter exploration.</text>
  </g>

  <g id="cue_s03_c4_key_insight_work_jam_slow" data-cue-label="key insight JAM slow physics emulated neural network keep physics remove bottleneck">
    <title>key insight: emulate JAM slow physics with a neural network</title>
    <rect x="80" y="440" width="1120" height="172" rx="16" fill="url(#highlight)" stroke="#FF7A3D" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="440" width="6" height="172" rx="3" fill="#FF7A3D"/>
    <text x="118" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#FF9B66">KEY INSIGHT</text>
    <text x="118" y="528" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="bold" fill="#EAF1FB">Emulate JAM's slow physics with a neural network.</text>
    <text x="118" y="566" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#C9D6E8">Keep the physics of the overall model intact — just remove the computational bottleneck that</text>
    <text x="118" y="592" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#C9D6E8">makes joint lensing-plus-kinematics modeling impractical.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">03 / 10</text>
  </g>
</svg>
