<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="skinnText" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9B66"/>
      <stop offset="1" stop-color="#FF7A3D"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
  </g>

  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1150" cy="120" r="240" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.7"/>
    <circle cx="1150" cy="120" r="160" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.5"/>
    <circle cx="1150" cy="120" r="95" fill="none" stroke="#2A3B57" stroke-width="1.5" opacity="0.5"/>
    <circle cx="1245" cy="120" r="5" fill="#FF7A3D"/>
    <circle cx="990" cy="120" r="4" fill="#4F9DFF"/>
    <circle cx="150" cy="640" r="3" fill="#4F9DFF" opacity="0.7"/>
    <circle cx="70" cy="470" r="2.5" fill="#6B7E9C" opacity="0.7"/>
  </g>

  <g id="hero-title">
    <rect x="80" y="70" width="384" height="34" rx="17" fill="#16233B" stroke="#2A3B57" stroke-width="1"/>
    <circle cx="103" cy="87" r="4" fill="#FF7A3D"/>
    <text x="120" y="93" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#9DB0CC">NEURIPS 2022  ·  ML4PS WORKSHOP</text>
    <text x="78" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="120" font-weight="bold" fill="url(#skinnText)">SKiNN</text>
    <text x="84" y="284" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="bold" fill="#EAF1FB">Stellar Kinematics Neural Network</text>
    <rect x="84" y="304" width="70" height="4" rx="2" fill="url(#accentBar)"/>
    <text x="84" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#9DB0CC">Fast kinematics modeling for conjunction with lens</text>
    <text x="84" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#9DB0CC">image modeling — toward a precise Hubble constant.</text>
    <text x="84" y="418" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#7B8EAC">M. R. Gomer, L. Biggio, S. Ertl, H. Wang, A. Galan, L. Van de Vyvere,</text>
    <text x="84" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#7B8EAC">D. Sluse, G. Vernardos, S. Suyu</text>
    <text x="84" y="466" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">Uni Liège · ETH Zürich · MPA · TU München · EPFL · ASIAA</text>
  </g>

  <g id="utility-cluster">
    <rect x="880" y="236" width="320" height="230" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1" filter="url(#cardShadow)"/>
    <rect x="904" y="260" width="204" height="204" rx="8" fill="#FFFFFF"/>
    <image href="../images/qr_code.png" x="908" y="264" width="196" height="196" preserveAspectRatio="xMidYMid meet"/>
    <text x="1128" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="bold" letter-spacing="1.5" fill="#9DB0CC">SCAN</text>
    <text x="1128" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#EAF1FB">Code &amp;</text>
    <text x="1128" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#EAF1FB">paper</text>
    <rect x="1128" y="344" width="56" height="56" rx="6" fill="#FFFFFF"/>
    <image href="../images/qr_project.png" x="1131" y="347" width="50" height="50" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/logo_eth.png" x="1128" y="416" width="56" height="16" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/logo_mpa.png" x="1128" y="440" width="56" height="16" preserveAspectRatio="xMidYMid meet"/>
    <text x="1005" y="484" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7E9C" text-anchor="middle">github.com/mattgomer/SKiNN</text>
  </g>

  <g id="cue_s01_c1_galaxy_kinematics_modeling_computati" data-cue-label="galaxy kinematics modeling computational bottleneck JAM">
    <title>galaxy kinematics modeling computational bottleneck</title>
    <rect x="80" y="500" width="265" height="150" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="500" width="265" height="4" rx="2" fill="#4F9DFF"/>
    <text x="102" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">THE BOTTLENECK</text>
    <text x="102" y="573" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="bold" fill="#EAF1FB">Kinematics is slow</text>
    <text x="102" y="606" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">JAM recomputed at every</text>
    <text x="102" y="628" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">MCMC likelihood step.</text>
  </g>

  <g id="cue_s01_c2_introduces_skinn_stellar_kinematics" data-cue-label="introduces SKiNN stellar kinematics neural network emulator">
    <title>introduces SKiNN stellar kinematics neural network</title>
    <rect x="365" y="500" width="265" height="150" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="365" y="500" width="265" height="4" rx="2" fill="#FF7A3D"/>
    <text x="387" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">THE IDEA</text>
    <text x="387" y="573" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="bold" fill="#EAF1FB">Emulate the physics</text>
    <text x="387" y="606" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">A neural network replaces</text>
    <text x="387" y="628" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">the JAM kinematics code.</text>
  </g>

  <g id="cue_s01_c3_after_one_time_phase_skinn_generates" data-cue-label="after one-time training phase SKiNN generates velocity dispersion images accurate one percent">
    <title>after training SKiNN generates accurate velocity images</title>
    <rect x="650" y="500" width="265" height="150" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="650" y="500" width="265" height="4" rx="2" fill="#35D0A5"/>
    <text x="672" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#35D0A5">ACCURACY</text>
    <text x="672" y="576" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">±1%</text>
    <text x="672" y="606" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">error in the innermost</text>
    <text x="672" y="628" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">two-arcsecond region.</text>
  </g>

  <g id="cue_s01_c4_speedup_finally_makes_feasible_spati" data-cue-label="speedup makes feasible spatially resolved joint lensing kinematics modeling">
    <title>speedup makes joint lensing plus kinematics modeling feasible</title>
    <rect x="935" y="500" width="265" height="150" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="935" y="500" width="265" height="4" rx="2" fill="#FF7A3D"/>
    <text x="957" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">SPEED</text>
    <text x="957" y="576" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">~300×</text>
    <text x="957" y="606" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">faster — joint modeling</text>
    <text x="957" y="628" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DB0CC">now becomes feasible.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="682" x2="1200" y2="682" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="704" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="704" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">01 / 10</text>
  </g>
</svg>
