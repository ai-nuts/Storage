<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">02</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">PROBLEM</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">Kinematics is the speed bottleneck</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s02_c1_gravitational_lensing_measures_hubbl" data-cue-label="gravitational lensing measures hubble constant time delays">
    <title>gravitational lensing measures the Hubble constant</title>
    <rect x="80" y="178" width="545" height="205" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="178" width="6" height="205" rx="3" fill="#4F9DFF"/>
    <text x="112" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">LENSING → H₀</text>
    <text x="112" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Time delays constrain the mass</text>
    <text x="112" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Time delays between the multiple images of a</text>
    <text x="112" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">distant source are compared to a model of the</text>
    <text x="112" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">lens galaxy's mass to infer the Hubble constant.</text>
  </g>

  <g id="cue_s02_c2_but_lensing_degeneracies_allow_many" data-cue-label="lensing degeneracies allow many mass distributions kinematic constraints break">
    <title>lensing degeneracies need kinematic constraints to break</title>
    <rect x="655" y="178" width="545" height="205" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="655" y="178" width="6" height="205" rx="3" fill="#4F9DFF"/>
    <text x="687" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">DEGENERACIES</text>
    <text x="687" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Kinematics breaks the tie</text>
    <text x="687" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Many different mass distributions reproduce the</text>
    <text x="687" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">same lensed image, so independent kinematic</text>
    <text x="687" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">constraints are required to break the degeneracy.</text>
  </g>

  <g id="cue_s02_c3_modeling_galaxy_kinematics_physics_c" data-cue-label="modeling galaxy kinematics physics code JAM slow recomputed likelihood">
    <title>JAM physics is slow and recomputed every likelihood step</title>
    <rect x="80" y="407" width="545" height="205" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="407" width="6" height="205" rx="3" fill="#FF7A3D"/>
    <text x="112" y="449" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">THE COST</text>
    <text x="112" y="481" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">JAM must run every step</text>
    <text x="112" y="519" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Modeling kinematics with a physics code like</text>
    <text x="112" y="545" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">JAM is slow — and it is recomputed for every</text>
    <text x="112" y="571" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">single likelihood evaluation inside the MCMC.</text>
  </g>

  <g id="cue_s02_c4_makes_jointly_exploring_full_lensing" data-cue-label="jointly exploring full lensing kinematics parameter space prohibitive separately">
    <title>jointly exploring the full parameter space is prohibitive</title>
    <rect x="655" y="407" width="545" height="205" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="655" y="407" width="6" height="205" rx="3" fill="#FF7A3D"/>
    <text x="687" y="449" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">THE CONSEQUENCE</text>
    <text x="687" y="481" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Joint sampling is prohibitive</text>
    <text x="687" y="519" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Exploring the full lensing and kinematics</text>
    <text x="687" y="545" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">parameter space together is too costly, forcing</text>
    <text x="687" y="571" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">modelers to fit the two components separately.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">02 / 10</text>
  </g>
</svg>
