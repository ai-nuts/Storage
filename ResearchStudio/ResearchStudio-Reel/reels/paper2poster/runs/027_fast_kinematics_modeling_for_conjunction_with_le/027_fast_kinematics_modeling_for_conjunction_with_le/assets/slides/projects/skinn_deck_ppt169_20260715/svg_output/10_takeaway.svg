<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A1E12"/>
      <stop offset="1" stop-color="#2A1810"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1150" cy="120" r="230" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.55"/>
    <circle cx="1150" cy="120" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.4"/>
    <circle cx="1245" cy="120" r="5" fill="#FF7A3D"/>
    <circle cx="1000" cy="120" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">10</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">TAKEAWAY</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">Swap slow physics for a fast emulator</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s10_c1_takeaway_simple" data-cue-label="takeaway simple neural network emulate slow kinematics physics JAM">
    <title>the takeaway is simple: emulate JAM with a neural network</title>
    <rect x="80" y="176" width="1120" height="128" rx="16" fill="url(#highlight)" stroke="#FF7A3D" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="176" width="6" height="128" rx="3" fill="#FF7A3D"/>
    <text x="118" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#FF9B66">THE TAKEAWAY</text>
    <text x="118" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="bold" fill="#EAF1FB">Train a neural network to emulate JAM's slow kinematics physics.</text>
    <text x="118" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#C9D6E8">SKiNN achieves a ~300× speedup at sub-percent accuracy in the region that matters.</text>
  </g>

  <g id="cue_s10_c2_neural_network_emulate_slow_kinemati" data-cue-label="neural network emulate slow kinematics 300 fold speedup sub-percent accuracy">
    <title>the result: ~300x faster at sub-percent accuracy where it matters</title>
    <rect x="80" y="328" width="357" height="272" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="328" width="357" height="5" rx="2.5" fill="#35D0A5"/>
    <text x="104" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#35D0A5">THE RESULT</text>
    <text x="104" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Fast and accurate</text>
    <text x="104" y="452" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">A neural network emulates the</text>
    <text x="104" y="478" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">slow JAM physics at roughly</text>
    <text x="104" y="504" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">300× speed and sub-percent</text>
    <text x="104" y="530" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">accuracy where it matters.</text>
  </g>

  <g id="cue_s10_c3_removes_main_computational_bottlenec" data-cue-label="removes main computational bottleneck joint lensing spatially resolved kinematics feasible hubble constant">
    <title>removes the bottleneck: joint lensing plus resolved kinematics for a precise H0</title>
    <rect x="461" y="328" width="357" height="272" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="461" y="328" width="357" height="5" rx="2.5" fill="#FF7A3D"/>
    <text x="485" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">WHY IT MATTERS</text>
    <text x="485" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Joint modeling for H₀</text>
    <text x="485" y="452" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Removing the main bottleneck</text>
    <text x="485" y="478" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">makes joint lensing + spatially</text>
    <text x="485" y="504" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">resolved kinematics feasible —</text>
    <text x="485" y="530" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">correcting the largest source of</text>
    <text x="485" y="556" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">uncertainty in measuring H₀.</text>
  </g>

  <g id="cue_s10_c4_more_broadly_strategy_swapping_expen" data-cue-label="more broadly strategy swapping expensive calculable model piece trained neural network transfers">
    <title>broader lesson: swap an expensive-but-calculable piece for a trained network</title>
    <rect x="842" y="328" width="358" height="272" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="842" y="328" width="358" height="5" rx="2.5" fill="#4F9DFF"/>
    <text x="866" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">THE BROADER LESSON</text>
    <text x="866" y="410" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">A transferable recipe</text>
    <text x="866" y="452" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Swap an expensive-but-</text>
    <text x="866" y="478" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">calculable model piece for a</text>
    <text x="866" y="504" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">trained neural network, keep</text>
    <text x="866" y="530" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">the surrounding physics — a</text>
    <text x="866" y="556" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">recipe that likely transfers</text>
    <text x="866" y="582" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">to many modeling problems.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network · github.com/mattgomer/SKiNN</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">10 / 10</text>
  </g>
</svg>
