<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">07</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">KEY RESULT</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">Within ±1% where the data constrains</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="figure-accuracy">
    <rect x="80" y="176" width="770" height="436" rx="16" fill="#0E1A2E" stroke="#2A3B57" stroke-width="1"/>
    <rect x="96" y="192" width="738" height="356" rx="8" fill="#FFFFFF"/>
    <image href="../images/fig2_accuracy.png" x="102" y="198" width="726" height="344" preserveAspectRatio="xMidYMid meet"/>
    <text x="112" y="576" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9DB0CC">Figure 2 — SKiNN prediction vs JAM truth, the relative error, and its histogram</text>
    <text x="112" y="596" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9DB0CC">inside the black 2″ circle where real data is most constraining.</text>
  </g>

  <g id="cue_s07_c1_once_trained_skinn_produces_velocity" data-cue-label="once trained SKiNN produces velocity image fifty milliseconds GPU 300 times faster">
    <title>a trained forward pass takes ~50 ms, ~300x faster than JAM</title>
    <rect x="870" y="176" width="330" height="102" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="870" y="176" width="6" height="102" rx="3" fill="#FF7A3D"/>
    <text x="898" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="bold" fill="#FF9B66">~50 ms</text>
    <text x="898" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">per image on a GPU —</text>
    <text x="898" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">about 300× faster than JAM.</text>
  </g>

  <g id="cue_s07_c2_accuracy_assessed_five_hundred_held" data-cue-label="accuracy assessed five hundred held-out test images relative error per pixel">
    <title>accuracy assessed on 500 held-out images, per-pixel relative error</title>
    <rect x="870" y="288" width="330" height="102" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="870" y="288" width="6" height="102" rx="3" fill="#4F9DFF"/>
    <text x="898" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">500 test images</text>
    <text x="898" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">Accuracy is assessed by the</text>
    <text x="898" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">relative error at each pixel.</text>
  </g>

  <g id="cue_s07_c3_while_some_outer_regions_show" data-cue-label="outer regions few percent innermost two-arcsecond region within one percent">
    <title>outer regions reach a few percent; the innermost 2 arcsec stays within 1 percent</title>
    <rect x="870" y="400" width="330" height="102" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="870" y="400" width="6" height="102" rx="3" fill="#35D0A5"/>
    <text x="898" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="bold" fill="#35D0A5">±1% inside 2″</text>
    <text x="898" y="470" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">Outer regions reach a few %,</text>
    <text x="898" y="492" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">but the constrained core holds.</text>
  </g>

  <g id="cue_s07_c4_averaged_over_entire_images_median" data-cue-label="averaged over entire images median 0.47 percent ninetieth percentile 1.1 percent below systematic">
    <title>median 0.47% and 90th percentile 1.1%, below the 2% systematic floor</title>
    <rect x="870" y="512" width="330" height="100" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="870" y="512" width="6" height="100" rx="3" fill="#4F9DFF"/>
    <text x="898" y="548" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#EAF1FB">median 0.47% · p90 1.1%</text>
    <text x="898" y="578" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">Both are well below the typical</text>
    <text x="898" y="600" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">≥2% systematic uncertainty.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">07 / 10</text>
  </g>
</svg>
