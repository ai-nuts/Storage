<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">09</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">HEADLINE NUMBERS</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">The numbers at a glance</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s09_c1_headline_numbers_skinn_runs_about" data-cue-label="SKiNN runs about three hundred times faster JAM fifty milliseconds fifteen seconds">
    <title>~300x faster: 50 ms per image vs ~15 s for JAM</title>
    <rect x="80" y="176" width="272" height="270" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="176" width="272" height="5" rx="2.5" fill="#FF7A3D"/>
    <text x="104" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">SPEED</text>
    <text x="216" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="bold" fill="#FF9B66" text-anchor="middle">~300×</text>
    <text x="216" y="336" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#EAF1FB" text-anchor="middle">faster than JAM</text>
    <text x="216" y="392" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC" text-anchor="middle">≈ 50 ms per image on GPU</text>
    <text x="216" y="416" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC" text-anchor="middle">vs ≈ 15 s for JAM</text>
  </g>

  <g id="cue_s09_c2_its_error_under_one_percent" data-cue-label="error under one percent median 0.47 ninetieth percentile 1.1 within region">
    <title>under 1% error: median 0.47%, 90th percentile 1.1%</title>
    <rect x="362" y="176" width="272" height="270" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="362" y="176" width="272" height="5" rx="2.5" fill="#35D0A5"/>
    <text x="386" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#35D0A5">ACCURACY</text>
    <text x="498" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="bold" fill="#35D0A5" text-anchor="middle">&lt; 1%</text>
    <text x="498" y="336" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#EAF1FB" text-anchor="middle">within inner 2″</text>
    <text x="498" y="392" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC" text-anchor="middle">median 0.47%</text>
    <text x="498" y="416" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC" text-anchor="middle">90th percentile ≈ 1.1%</text>
  </g>

  <g id="cue_s09_c3_network_maps_eight_dimensional_param" data-cue-label="network maps eight-dimensional parameter vector velocity image seven million parameters">
    <title>maps an 8-D vector to a velocity image; ~7.07M parameters</title>
    <rect x="644" y="176" width="272" height="270" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="644" y="176" width="272" height="5" rx="2.5" fill="#4F9DFF"/>
    <text x="668" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">MODEL</text>
    <text x="780" y="296" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="bold" fill="#7DBBFF" text-anchor="middle">8 → d×d</text>
    <text x="780" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#EAF1FB" text-anchor="middle">params → image</text>
    <text x="780" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="bold" fill="#EAF1FB" text-anchor="middle">~7.07M</text>
    <text x="780" y="416" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC" text-anchor="middle">trainable parameters</text>
  </g>

  <g id="cue_s09_c4_trained_five_thousand_samples_split" data-cue-label="trained five thousand samples split four thousand training one day five P100 GPUs">
    <title>trained on 5000 samples over ~1 day on 5 Tesla P100 GPUs</title>
    <rect x="926" y="176" width="274" height="270" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="926" y="176" width="274" height="5" rx="2.5" fill="#FF7A3D"/>
    <text x="950" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">TRAINING</text>
    <text x="1063" y="296" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="56" font-weight="bold" fill="#FF9B66" text-anchor="middle">5000</text>
    <text x="1063" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#EAF1FB" text-anchor="middle">samples (4000/500/500)</text>
    <text x="1063" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB" text-anchor="middle">~1 day</text>
    <text x="1063" y="416" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC" text-anchor="middle">on 5 × Tesla P100</text>
  </g>

  <g id="speed-bar">
    <rect x="80" y="472" width="1120" height="140" rx="16" fill="#0E1A2E" stroke="#2A3B57" stroke-width="1"/>
    <text x="110" y="508" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="1.5" fill="#9DB0CC">TIME PER v_rms IMAGE  (log-scale intuition)</text>
    <text x="110" y="548" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#7DBBFF">SKiNN</text>
    <rect x="240" y="534" width="70" height="22" rx="6" fill="#35D0A5"/>
    <text x="322" y="551" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="bold" fill="#35D0A5">≈ 50 ms</text>
    <text x="110" y="592" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#FF9B66">JAM</text>
    <rect x="240" y="578" width="820" height="22" rx="6" fill="#FF7A3D"/>
    <text x="1072" y="595" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="bold" fill="#FF9B66">≈ 15 s</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">09 / 10</text>
  </g>
</svg>
