<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A1E12"/>
      <stop offset="1" stop-color="#2A1810"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">04</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">CONTRIBUTION</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">A neural emulator inside lens modeling</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s04_c1_core_contribution_skinn_stellar_kine" data-cue-label="core contribution SKiNN stellar kinematics neural network learned emulator JAM">
    <title>the core contribution is SKiNN, a learned emulator of JAM</title>
    <rect x="80" y="176" width="490" height="120" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="176" width="6" height="120" rx="3" fill="#FF7A3D"/>
    <text x="110" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">What SKiNN is</text>
    <text x="110" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">The Stellar Kinematics Neural Network — a</text>
    <text x="110" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">learned emulator of the JAM calculation.</text>
  </g>

  <g id="cue_s04_c2_first_time_strategy_replacing_expens" data-cue-label="first time strategy replacing expensive component neural network kinematics lens modeling">
    <title>first NN emulation of the kinematics piece of lens modeling</title>
    <rect x="80" y="308" width="490" height="120" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="308" width="6" height="120" rx="3" fill="#4F9DFF"/>
    <text x="110" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">A first</text>
    <text x="110" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">First application of NN emulation to the</text>
    <text x="110" y="404" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">kinematics piece of a lens-modeling framework.</text>
  </g>

  <g id="cue_s04_c3_crucially_skinn_emulates_only_jam" data-cue-label="crucially SKiNN emulates only JAM physics not observations keeps physics intact">
    <title>SKiNN emulates only JAM, keeping the physics intact</title>
    <rect x="80" y="440" width="490" height="120" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="440" width="6" height="120" rx="3" fill="#4F9DFF"/>
    <text x="110" y="476" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Emulate JAM only</text>
    <text x="110" y="510" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">It emulates the JAM physics, not the</text>
    <text x="110" y="536" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">observations — so the model's physics stays intact.</text>
  </g>

  <g id="figure-framework">
    <rect x="596" y="176" width="604" height="300" rx="16" fill="#0E1A2E" stroke="#2A3B57" stroke-width="1"/>
    <rect x="612" y="192" width="572" height="238" rx="8" fill="#FFFFFF"/>
    <image href="../images/fig1_framework.png" x="618" y="198" width="560" height="226" preserveAspectRatio="xMidYMid meet"/>
    <text x="628" y="456" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9DB0CC">Figure 1 — SKiNN (orange) slots into the joint lens-modeling framework;</text>
    <text x="628" y="475" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9DB0CC">the combined χ²ₜₒₜ is minimized to jointly optimize the model.</text>
  </g>

  <g id="cue_s04_c4_result_roughly_300_fold_speedup" data-cue-label="result roughly 300 fold speedup sub-percent accuracy joint modeling feasible">
    <title>result: ~300x speedup at sub-percent accuracy</title>
    <rect x="596" y="492" width="604" height="120" rx="16" fill="url(#highlight)" stroke="#FF7A3D" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="628" y="536" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="bold" fill="#FF9B66">~300×</text>
    <text x="792" y="524" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#EAF1FB">speedup at sub-percent accuracy</text>
    <text x="792" y="554" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#C9D6E8">makes joint lensing + kinematics modeling</text>
    <text x="792" y="578" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#C9D6E8">computationally feasible.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">04 / 10</text>
  </g>
</svg>
