<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">08</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">ABLATION / ANALYSIS</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">Characterized by its error distribution</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s08_c1_proof_of_concept_workshop_work_does" data-cue-label="proof-of-concept workshop paper does not present formal ablation table">
    <title>as a proof-of-concept workshop paper, no formal ablation table</title>
    <rect x="80" y="180" width="357" height="420" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="180" width="357" height="5" rx="2.5" fill="#4F9DFF"/>
    <circle cx="128" cy="234" r="20" fill="none" stroke="#7DBBFF" stroke-width="2.5"/>
    <text x="128" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#7DBBFF" text-anchor="middle">i</text>
    <text x="164" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">No formal ablation</text>
    <text x="104" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">This is a proof-of-concept</text>
    <text x="104" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">workshop paper, so it does</text>
    <text x="104" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">not present a formal ablation</text>
    <text x="104" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">table.</text>
    <text x="104" y="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Instead, performance is</text>
    <text x="104" y="446" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">reported through the behavior</text>
    <text x="104" y="472" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">of the emulation error itself.</text>
  </g>

  <g id="cue_s08_c2_instead_performance_characterized_di" data-cue-label="performance characterized distribution per-pixel error 500 test images median 0.47 percent">
    <title>performance is characterized by the per-pixel error distribution</title>
    <rect x="461" y="180" width="357" height="420" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="461" y="180" width="357" height="5" rx="2.5" fill="#FF7A3D"/>
    <text x="485" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">PER-PIXEL ERROR</text>
    <text x="485" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Error distribution</text>
    <g id="mini-hist">
      <line x1="500" y1="410" x2="790" y2="410" stroke="#2A3B57" stroke-width="1.5"/>
      <rect x="512" y="394" width="26" height="16" fill="#345680"/>
      <rect x="544" y="380" width="26" height="30" fill="#3E6BA0"/>
      <rect x="576" y="352" width="26" height="58" fill="#4F9DFF"/>
      <rect x="608" y="322" width="26" height="88" fill="#7DBBFF"/>
      <rect x="640" y="340" width="26" height="70" fill="#4F9DFF"/>
      <rect x="672" y="372" width="26" height="38" fill="#3E6BA0"/>
      <rect x="704" y="392" width="26" height="18" fill="#345680"/>
      <line x1="627" y1="316" x2="627" y2="418" stroke="#35D0A5" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="627" y="436" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#35D0A5" text-anchor="middle">0</text>
      <text x="512" y="436" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7E9C">−1%</text>
      <text x="720" y="436" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#6B7E9C">+1%</text>
    </g>
    <text x="485" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Across the 500 test images:</text>
    <text x="485" y="522" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="bold" fill="#35D0A5">median 0.47%</text>
    <text x="485" y="556" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#EAF1FB">90th percentile ≈ 1.1%</text>
  </g>

  <g id="cue_s08_c3_analysis_also_distinguishes_innermos" data-cue-label="analysis distinguishes innermost two-arcsecond region one percent outer few percent GPU CPU ten times">
    <title>the innermost 2 arcsec holds within 1 percent; GPU ~10x faster than CPU</title>
    <rect x="842" y="180" width="358" height="420" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="842" y="180" width="358" height="5" rx="2.5" fill="#35D0A5"/>
    <text x="866" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#35D0A5">WHERE IT HOLDS</text>
    <text x="866" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Core vs outskirts</text>
    <text x="866" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">The innermost two-arcsecond</text>
    <text x="866" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">region stays within 1%; outer</text>
    <text x="866" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">parts relax to a few %, where</text>
    <text x="866" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">data barely constrains anyway.</text>
    <line x1="866" y1="410" x2="1176" y2="410" stroke="#2A3B57" stroke-width="1"/>
    <text x="866" y="452" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">GPU vs CPU inference:</text>
    <text x="866" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FF9B66">~10×</text>
    <text x="972" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">faster on GPU</text>
    <text x="866" y="540" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7E9C">than the same forward pass on CPU.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">08 / 10</text>
  </g>
</svg>
