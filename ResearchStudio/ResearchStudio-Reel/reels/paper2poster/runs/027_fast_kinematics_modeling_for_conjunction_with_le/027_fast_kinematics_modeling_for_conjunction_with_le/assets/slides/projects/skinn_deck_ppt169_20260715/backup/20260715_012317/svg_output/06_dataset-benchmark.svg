<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">06</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">DATASET &amp; BENCHMARK</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">5000 JAM images to learn from</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s06_c1_set_constructed_entirely_jam_physics" data-cue-label="training set constructed entirely JAM physics code SKiNN imitate">
    <title>the training set is built entirely with JAM</title>
    <rect x="80" y="178" width="545" height="200" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="178" width="6" height="200" rx="3" fill="#FF7A3D"/>
    <text x="112" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">GROUND TRUTH</text>
    <text x="112" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">Built entirely from JAM</text>
    <text x="112" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">The training set is generated entirely by JAM —</text>
    <text x="112" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">the very physics code SKiNN is meant to imitate.</text>
    <text x="112" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Parameter ranges are physically motivated.</text>
  </g>

  <g id="cue_s06_c2_authors_created_five_thousand_input" data-cue-label="authors created five thousand input-output pairs four thousand training five hundred validation test split">
    <title>5000 pairs split into 4000 train, 500 val, 500 test</title>
    <rect x="655" y="178" width="545" height="200" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="655" y="178" width="6" height="200" rx="3" fill="#4F9DFF"/>
    <text x="687" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">DATA SPLIT</text>
    <text x="687" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">5000</text>
    <text x="800" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="20" fill="#9DB0CC">input–output pairs</text>
    <rect x="687" y="286" width="330" height="20" rx="6" fill="#0E1A2E"/>
    <rect x="687" y="286" width="264" height="20" rx="6" fill="#4F9DFF"/>
    <rect x="951" y="286" width="33" height="20" fill="#FF7A3D"/>
    <rect x="984" y="286" width="33" height="20" rx="6" fill="#35D0A5"/>
    <text x="687" y="336" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#7DBBFF">■ 4000 train</text>
    <text x="847" y="336" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#FF9B66">■ 500 val</text>
    <text x="967" y="336" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#35D0A5">■ 500 test</text>
    <text x="687" y="364" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6B7E9C">500 test images are held out for evaluation.</text>
  </g>

  <g id="cue_s06_c3_velocity_image_551_551_pixels" data-cue-label="each velocity image 551 551 pixels single JAM image fifteen seconds create">
    <title>each vrms image is 551 by 551 pixels; JAM takes ~15s each</title>
    <rect x="80" y="402" width="545" height="200" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="402" width="6" height="200" rx="3" fill="#4F9DFF"/>
    <text x="112" y="444" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">IMAGE SIZE</text>
    <text x="112" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="bold" fill="#EAF1FB">551 × 551 px</text>
    <text x="112" y="524" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Each v_rms image is rendered at higher resolution</text>
    <text x="112" y="550" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">than real data. A single JAM image takes about</text>
    <text x="112" y="576" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">15 seconds to create — hence the case for emulation.</text>
  </g>

  <g id="cue_s06_c4_network_implemented_pytorch_pytorch" data-cue-label="network implemented pytorch pytorch lightning five tesla P100 GPUs one day">
    <title>implemented in PyTorch Lightning, trained on 5 Tesla P100 GPUs</title>
    <rect x="655" y="402" width="545" height="200" rx="16" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="655" y="402" width="6" height="200" rx="3" fill="#FF7A3D"/>
    <text x="687" y="444" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">TRAINING SETUP</text>
    <text x="687" y="476" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="bold" fill="#EAF1FB">PyTorch Lightning</text>
    <text x="687" y="514" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">Implemented in PyTorch with PyTorch Lightning.</text>
    <text x="687" y="546" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="bold" fill="#35D0A5">5 × Tesla P100</text>
    <text x="687" y="578" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#9DB0CC">16 GB each, trained over roughly one day.</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">06 / 10</text>
  </g>
</svg>
