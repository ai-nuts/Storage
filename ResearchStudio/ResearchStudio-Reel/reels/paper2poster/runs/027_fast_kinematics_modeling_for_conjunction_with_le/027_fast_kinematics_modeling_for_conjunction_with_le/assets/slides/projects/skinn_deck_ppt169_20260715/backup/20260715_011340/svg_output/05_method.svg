<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10203A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2C48"/>
      <stop offset="1" stop-color="#14223A"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <linearGradient id="netBlock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF9B66"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0 0 10 5 0 10" fill="#7DBBFF"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0 0 10 5 0 10" fill="#FF7A3D"/>
    </marker>
  </defs>

  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/></g>
  <g id="decoration" data-pptx-role="decoration">
    <circle cx="1210" cy="40" r="150" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.6"/>
    <circle cx="1210" cy="40" r="95" fill="none" stroke="#213556" stroke-width="1.5" opacity="0.45"/>
    <circle cx="1115" cy="40" r="4" fill="#4F9DFF"/>
  </g>

  <g id="header">
    <rect x="80" y="54" width="46" height="46" rx="12" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <text x="103" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#FF7A3D" text-anchor="middle">05</text>
    <text x="142" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#9DB0CC">METHOD</text>
    <text x="142" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="bold" fill="#EAF1FB">A convolutional emulator of JAM</text>
    <rect x="142" y="128" width="64" height="4" rx="2" fill="url(#accentBar)"/>
  </g>

  <g id="cue_s05_c1_skinn_precalculates_jam_lensing_appl" data-cue-label="SKiNN precalculates JAM maps eight-dimensional vector vrms image">
    <title>SKiNN maps an 8-D parameter vector to a vrms image</title>
    <rect x="80" y="176" width="272" height="212" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="80" y="176" width="272" height="5" rx="2.5" fill="#FF7A3D"/>
    <text x="104" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">MAPPING</text>
    <text x="104" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="bold" fill="#EAF1FB">Input → output</text>
    <text x="104" y="288" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="bold" fill="#7DBBFF">Ψθ : ℝ⁸ → d×d</text>
    <text x="104" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">An 8-D galaxy-parameter</text>
    <text x="104" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">vector maps to a d×d image</text>
    <text x="104" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">of v_rms.</text>
  </g>

  <g id="cue_s05_c2_eight_inputs_describe_power_law_elli" data-cue-label="eight inputs power-law elliptical mass Sersic light inclination anisotropy">
    <title>the 8 inputs: PEMD mass, Sersic light, inclination, anisotropy</title>
    <rect x="362" y="176" width="272" height="212" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="362" y="176" width="272" height="5" rx="2.5" fill="#4F9DFF"/>
    <text x="386" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">THE 8 INPUTS</text>
    <text x="386" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="bold" fill="#EAF1FB">Galaxy parameters</text>
    <text x="386" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">Power-law elliptical mass +</text>
    <text x="386" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">elliptical Sérsic light (6 shape</text>
    <text x="386" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">params), plus inclination i</text>
    <text x="386" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">and anisotropy β.</text>
  </g>

  <g id="cue_s05_c3_architecture_consists_five_blocks_tw" data-cue-label="architecture five blocks two convolutional layers upsampling relu seven million parameters">
    <title>architecture: five conv blocks, ~7 million parameters</title>
    <rect x="644" y="176" width="272" height="212" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="644" y="176" width="272" height="5" rx="2.5" fill="#FF7A3D"/>
    <text x="668" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#FF9B66">ARCHITECTURE</text>
    <text x="668" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="bold" fill="#EAF1FB">5 conv blocks</text>
    <text x="668" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">Each block: two 2-D conv</text>
    <text x="668" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">layers → upsampling → ReLU.</text>
    <text x="668" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="bold" fill="#35D0A5">~7.07M</text>
    <text x="768" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">parameters</text>
  </g>

  <g id="cue_s05_c4_trained_minimizing_standard_mean_squ" data-cue-label="trained minimizing mean-squared-error loss adam optimizer GLEE JAM dataset">
    <title>trained with MSE loss and Adam on JAM data via GLEE</title>
    <rect x="926" y="176" width="274" height="212" rx="14" fill="url(#card)" stroke="#2A3B57" stroke-width="1"/>
    <rect x="926" y="176" width="274" height="5" rx="2.5" fill="#4F9DFF"/>
    <text x="950" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="1.5" fill="#7DBBFF">TRAINING</text>
    <text x="950" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="bold" fill="#EAF1FB">MSE + Adam</text>
    <text x="950" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">Minimize a mean-squared-</text>
    <text x="950" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">error loss with the Adam</text>
    <text x="950" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">optimizer, on JAM data</text>
    <text x="950" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#9DB0CC">generated via GLEE.</text>
  </g>

  <g id="architecture-strip">
    <rect x="80" y="410" width="1120" height="202" rx="16" fill="#0E1A2E" stroke="#2A3B57" stroke-width="1"/>
    <text x="110" y="446" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="1.5" fill="#9DB0CC">THE EMULATION PIPELINE</text>

    <rect x="120" y="470" width="180" height="110" rx="12" fill="url(#card)" stroke="#4F9DFF" stroke-width="1.5"/>
    <text x="210" y="512" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="bold" fill="#7DBBFF" text-anchor="middle">x ∈ ℝ⁸</text>
    <text x="210" y="546" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9DB0CC" text-anchor="middle">8 galaxy</text>
    <text x="210" y="567" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9DB0CC" text-anchor="middle">parameters</text>

    <line x1="308" y1="525" x2="392" y2="525" stroke="#7DBBFF" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

    <rect x="400" y="470" width="480" height="110" rx="12" fill="#1B2C48" stroke="#FF7A3D" stroke-width="1.5"/>
    <text x="640" y="500" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="bold" fill="#FF9B66" text-anchor="middle">Ψθ — convolutional network</text>
    <rect x="424" y="516" width="70" height="46" rx="8" fill="url(#netBlock)"/>
    <rect x="512" y="516" width="70" height="46" rx="8" fill="url(#netBlock)"/>
    <rect x="600" y="516" width="70" height="46" rx="8" fill="url(#netBlock)"/>
    <rect x="688" y="516" width="70" height="46" rx="8" fill="url(#netBlock)"/>
    <rect x="776" y="516" width="70" height="46" rx="8" fill="url(#netBlock)"/>
    <text x="640" y="590" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#9DB0CC" text-anchor="middle">5 blocks × (2 conv → upsample → ReLU)</text>

    <line x1="888" y1="525" x2="972" y2="525" stroke="#FF7A3D" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

    <rect x="980" y="470" width="200" height="110" rx="12" fill="url(#card)" stroke="#35D0A5" stroke-width="1.5"/>
    <text x="1080" y="512" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="bold" fill="#35D0A5" text-anchor="middle">v_rms</text>
    <text x="1080" y="546" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9DB0CC" text-anchor="middle">d×d velocity</text>
    <text x="1080" y="567" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#9DB0CC" text-anchor="middle">image</text>
  </g>

  <g id="footer">
    <line x1="80" y1="680" x2="1200" y2="680" stroke="#2A3B57" stroke-width="1"/>
    <text x="80" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C">SKiNN · Stellar Kinematics Neural Network</text>
    <text x="1200" y="702" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#6B7E9C" text-anchor="end">05 / 10</text>
  </g>
</svg>
