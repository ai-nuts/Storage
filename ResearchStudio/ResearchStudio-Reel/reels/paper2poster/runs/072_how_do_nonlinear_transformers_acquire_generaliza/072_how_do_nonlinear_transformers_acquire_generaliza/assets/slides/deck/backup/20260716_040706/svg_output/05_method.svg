<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One nonlinear layer, tracked through training</text><g id="cue_s05_c1_deliberately_minimal_but_nonlinear_o"><title>deliberately minimal but nonlinear one self-attention head softmax followed two-layer</title><rect x="64" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="198" rx="6" fill="#4C9BE8"/><text x="92" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">The model  ·  minimal but nonlinear</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">One self-attention head with a softmax, followed by a</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">two-layer perceptron with ReLU activation.</text><rect x="92" y="264" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="281.0" r="5" fill="#34D3C0"/><text x="126" y="286.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">softmax self-attention  (nonlinear)</text><rect x="92" y="306" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="323.0" r="5" fill="#F2C14E"/><text x="126" y="328.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">two-layer ReLU MLP  (nonlinear)</text></g><g id="cue_s05_c2_augments_query_length_l_context_exam"><title>augments query length-l context example pairs embeds them prompt minimizes</title><rect x="648" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="152" width="6" height="198" rx="6" fill="#34D3C0"/><text x="676" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Training  ·  hinge loss over prompts</text><text x="676" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Augment each query with a length-l context of example pairs;</text><text x="676" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">minimize hinge loss over a small subset of binary tasks.</text><rect x="676" y="270" width="512" height="58" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="294" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">F = a^T ReLU( W_O sum_i W_V p_i attn(i) )</text><text x="932.0" y="316" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#9DB3C8" font-weight="700" text-anchor="middle">attn(i) = softmax( (W_K p_i)^T W_Q p_query )</text></g><g id="cue_s05_c3_authors_follow_gradient_descent_dyna"><title>authors follow gradient-descent dynamics query key value mlp weights evaluate</title><rect x="64" y="362" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="362" width="6" height="198" rx="6" fill="#F2C14E"/><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Analysis  ·  follow the GD trajectory</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Track gradient descent on the query, key, value and MLP</text><text x="92" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">weights, then evaluate in-domain and under a distribution</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">shift.</text><rect x="92" y="480" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="496.0" r="5" fill="#4C9BE8"/><text x="126" y="501.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">in-domain  -&gt;  same task distribution</text><rect x="92" y="518" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="534.0" r="5" fill="#34D3C0"/><text x="126" y="539.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">out-of-domain  -&gt;  patterns = linear combos</text></g><g id="cue_s05_c4_two_quantities_drive_guarantees_alph"><title>two quantities drive guarantees alpha fraction context examples share query</title><rect x="648" y="362" width="568" height="198" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="648" y="362" width="6" height="198" rx="6" fill="#48C78E"/><text x="676" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Two quantities drive the guarantees</text><rect x="676" y="424" width="258" height="108" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="805" y="466" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="26" fill="#4C9BE8" font-weight="800" text-anchor="middle">alpha</text><text x="805" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">fraction of context sharing</text><text x="805" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">the query's relevant pattern</text><rect x="950" y="424" width="258" height="108" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1079" y="466" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="26" fill="#34D3C0" font-weight="800" text-anchor="middle">beta</text><text x="1079" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">magnitude of the</text><text x="1079" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">relevant features</text></g></svg>