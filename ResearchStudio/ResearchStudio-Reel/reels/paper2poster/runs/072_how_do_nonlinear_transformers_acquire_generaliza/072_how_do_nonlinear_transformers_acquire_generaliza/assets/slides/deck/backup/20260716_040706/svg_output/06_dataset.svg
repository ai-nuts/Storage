ll="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="734" cy="522.0" r="5" fill="#F2C14E"/><text x="750" y="527.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">OOD: relevant patterns = linear combos</text></g></svg>