<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The message in four numbers</text><g id="cue_s09_c1_few_numbers_capture_message_cost"><title>few numbers capture message cost both iterations samples scales alpha</title><rect x="64" y="152" width="1152" height="74" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="74" rx="6" fill="#4C9BE8"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Training cost is governed by the relevant fraction alpha</text><rect x="92" y="192" width="470" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="207.0" r="5" fill="#34D3C0"/><text x="126" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">iterations &amp; samples  ~  alpha^(-2/3)</text><rect x="576" y="192" width="470" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="594" cy="207.0" r="5" fill="#F2C14E"/><text x="610" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">required context length  ~  1 / alpha</text></g><g id="cue_s09_c2_needs_trained_only_vanishing_fractio"><title>needs trained only vanishing fraction order one over square root</title><rect x="64" y="246" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="246" width="368" height="6" rx="6" fill="#34D3C0"/><text x="248.0" y="338" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="32" fill="#34D3C0" font-weight="800" text-anchor="middle">1 / sqrt(M1)</text><text x="248.0" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">vanishing fraction of tasks trained on</text><text x="248.0" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">yet it generalizes to all the rest</text></g><g id="cue_s09_c3_out_of_domain_error_drops_below_one"><title>out-of-domain error drops below one percent once combination strength reaches</title><rect x="456" y="246" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="246" width="368" height="6" rx="6" fill="#48C78E"/><text x="640.0" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#48C78E" font-weight="800" text-anchor="middle">&lt; 0.01</text><text x="640.0" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">out-of-domain error</text><text x="640.0" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">once combination strength S1 &gt;= 1</text></g><g id="cue_s09_c4_pruning_removing_low_magnitude_neuro"><title>pruning removing low-magnitude neurons keeps error order epsilon plus one</title><rect x="848" y="246" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="246" width="368" height="6" rx="6" fill="#F2C14E"/><text x="1032.0" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#F2C14E" font-weight="800" text-anchor="middle">~15%</text><text x="1032.0" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">of output neurons pruned, lossless</text><text x="1032.0" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">small-magnitude neurons only</text></g><rect x="64" y="466" width="1152" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="92" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#48C78E" font-weight="700" text-anchor="start">Prune LOW-magnitude neurons  -&gt;  error stays O( epsilon + 1 / sqrt(M1) ), essentially lossless</text><text x="92" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#F2685C" font-weight="700" text-anchor="start">Prune LARGE-magnitude neurons  -&gt;  error grows at least linearly in the pruning rate</text></svg>