<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Relevant fraction sets the cost</text><g id="cue_s08_c1_ablations_vary_fraction_context_exam"><title>ablations vary fraction context examples share query relevant pattern</title><rect x="64" y="152" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">Vary alpha, the fraction of context examples that share the query's relevant pattern.</text></g><g id="cue_s08_c2_predicted_needed_context_length_grow"><title>predicted needed context length grows like one over alpha needed</title><rect x="64" y="230" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="230" width="6" height="180" rx="6" fill="#34D3C0"/><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">As predicted by the theory</text><rect x="92" y="286" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="303.0" r="5" fill="#34D3C0"/><text x="126" y="308.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">context length  ~  1 / alpha</text><rect x="92" y="328" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="345.0" r="5" fill="#F2C14E"/><text x="126" y="350.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">iterations &amp; samples  ~  alpha^(-2/3)</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Richer contexts converge faster and need shorter prompts.</text></g><g id="cue_s08_c3_second_comparison_pits_in_context_le"><title>second comparison pits in-context learning against logistic regression kernel linear</title><rect x="656" y="230" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="230" width="6" height="180" rx="6" fill="#F2C14E"/><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">ICL vs. classical baselines</text><rect x="684" y="286" width="246" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="302.0" r="5" fill="#9DB3C8"/><text x="718" y="307.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">logistic regression</text><rect x="940" y="286" width="246" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="958" cy="302.0" r="5" fill="#9DB3C8"/><text x="974" y="307.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">kernel SVM</text><rect x="684" y="326" width="246" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="342.0" r="5" fill="#9DB3C8"/><text x="718" y="347.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">linear SVM</text><rect x="940" y="326" width="246" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="958" cy="342.0" r="5" fill="#9DB3C8"/><text x="974" y="347.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">nearest neighbor</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Compared on sample efficiency across relevant fractions.</text></g><g id="cue_s08_c4_when_relevant_fraction_high_gap"><title>when relevant fraction high gap small but harder low-fraction regime</title><rect x="64" y="430" width="1152" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="430" width="6" height="120" rx="6" fill="#48C78E"/><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Hard low-fraction regime  ·  samples needed for the same accuracy (lower is better)</text><rect x="380" y="478" width="540" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="380" y="478" width="90" height="20" rx="6" fill="#48C78E"/><text x="368" y="492.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">In-context learning</text><text x="480" y="492.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">most efficient</text><rect x="380" y="504" width="540" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="380" y="504" width="306" height="20" rx="6" fill="#9DB3C8"/><text x="368" y="518.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">kernel SVM / LogReg</text><text x="696" y="518.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start"></text><rect x="380" y="528" width="540" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="380" y="528" width="522" height="20" rx="6" fill="#6E869C"/><text x="368" y="542.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">nearest neighbor</text><text x="912" y="542.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="800" text-anchor="start"></text><text x="950" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#48C78E" font-weight="800" text-anchor="start">ICL removes irrelevant data</text><text x="950" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">and tolerates label noise best</text></g></svg>