<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Prior theory keeps only part of the picture</text><g id="cue_s03_c1_recent_works_began_explain_in_contex"><title>recent works began explain in-context learning but keeps only part</title><rect x="64" y="152" width="1152" height="92" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="92" rx="6" fill="#34D3C0"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">Recent works began to explain ICL</text><text x="92" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">Each existing analysis simplifies away one of the hard parts, so none captures a genuinely nonlinear</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">Transformer trained end to end.</text></g><g id="cue_s03_c2_some_ignore_nonlinear_self_attention"><title>some ignore nonlinear self-attention others replace nonlinear mlp linear one</title><rect x="64" y="262" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="262" width="368" height="6" rx="6" fill="#F2685C"/><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Simplified models</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Prior work ignores nonlinear</text><text x="92" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">self-attention, or replaces the</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">nonlinear MLP with a linear one.</text><rect x="92" y="402" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="418.0" r="5" fill="#F2685C"/><text x="126" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">drops softmax / linear MLP</text></g><g id="cue_s03_c3_none_characterize_how_train_generali"><title>none characterize how train generalizes under distribution shift between test</title><rect x="456" y="262" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="262" width="368" height="6" rx="6" fill="#F2C14E"/><text x="484" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">No shift, no pruning</text><text x="484" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Most study linear regression, none</text><text x="484" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">characterize training under distribution</text><text x="484" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">shift, and none analyze how pruning</text><text x="484" y="405" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">changes ICL.</text><rect x="484" y="402" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="502" cy="418.0" r="5" fill="#F2C14E"/><text x="518" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">shift + pruning unexplained</text></g><g id="cue_s03_c4_since_practitioners_routinely_prune"><title>since practitioners routinely prune large language models save compute while</title><rect x="848" y="262" width="368" height="200" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="848" y="262" width="368" height="6" rx="6" fill="#48C78E"/><text x="876" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Why it matters</text><text x="876" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Practitioners routinely prune large</text><text x="876" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">language models to save compute while</text><text x="876" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">hoping to keep their in-context skills.</text><rect x="876" y="402" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="894" cy="418.0" r="5" fill="#48C78E"/><text x="910" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">close the theory-practice gap</text></g><rect x="64" y="486" width="1152" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="92" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">This paper keeps BOTH nonlinearities, trains by gradient descent, and covers distribution shift and pruning.</text></svg>