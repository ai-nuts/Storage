<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three firsts for ICL theory</text><g id="cue_s04_c1_work_makes_three_contributions"><title>work makes three contributions</title><rect x="64" y="152" width="1152" height="64" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="64" rx="6" fill="#4C9BE8"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">A training theory for genuinely nonlinear Transformers, a mechanism, and the first analysis of pruning for ICL.</text></g><g id="cue_s04_c2_first_first_theoretical_characteriza"><title>first first theoretical characterization how train transformer keeps both nonlinear</title><rect x="64" y="240" width="368" height="310" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="310" r="27" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Train + generalize</text><text x="92" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">First characterization of how to train a</text><text x="92" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Transformer with both nonlinear</text><text x="92" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">self-attention and a nonlinear MLP,</text><text x="92" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">proving it generalizes in-context and</text><text x="92" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">quantifying the data, iterations, and</text><text x="92" y="535" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">context length required.</text></g><g id="cue_s04_c3_second_expands_our_understanding_mec"><title>second expands our understanding mechanism in-context learning showing how attention</title><rect x="456" y="240" width="368" height="310" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="240" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="508" cy="310" r="27" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="508" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="484" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">The mechanism</text><text x="484" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Explains how the ability arises: the</text><text x="484" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">attention layer and the MLP layer</text><text x="484" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">cooperate to make correct predictions on</text><text x="484" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">unseen tasks.</text></g><g id="cue_s04_c4_third_provides_first_theoretical_ana"><title>third provides first theoretical analysis magnitude-based pruning in-context learning proving</title><rect x="848" y="240" width="368" height="310" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="240" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="310" r="27" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Pruning theory</text><text x="876" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">First theoretical analysis of</text><text x="876" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">magnitude-based pruning for ICL, proving</text><text x="876" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">that removing the low-magnitude neurons</text><text x="876" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">is essentially harmless.</text></g></svg>