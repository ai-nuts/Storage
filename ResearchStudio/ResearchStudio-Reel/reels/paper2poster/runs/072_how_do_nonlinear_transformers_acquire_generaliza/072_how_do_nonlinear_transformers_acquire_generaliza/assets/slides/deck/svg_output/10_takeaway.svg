<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">ICL in a nonlinear Transformer is not a black box</text><g id="cue_s10_c1_lasting_message_in_context_learning"><title>lasting message in-context learning nonlinear transformer not black box both</title><rect x="64" y="168" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="118" rx="6" fill="#4C9BE8"/><circle cx="112" cy="227" r="10" fill="#4C9BE8"/><text x="150" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Provably trainable</text><text x="150" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">With both nonlinear attention and a nonlinear MLP, a one-layer model can be provably trained to</text><text x="150" y="271" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">generalize in-context, in-domain and under distribution shift, with effort set by how much of</text><text x="150" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">the context shares the query's relevant pattern.</text></g><g id="cue_s10_c2_trained_works_having_attention_focus"><title>trained works having attention focus context examples match query relevant</title><rect x="64" y="304" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="304" width="6" height="118" rx="6" fill="#34D3C0"/><circle cx="112" cy="363" r="10" fill="#34D3C0"/><text x="150" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">How it works</text><text x="150" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Attention focuses on the context examples that match the query's relevant pattern, while the</text><text x="150" y="407" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">ReLU MLP amplifies their labels to make the prediction.</text></g><g id="cue_s10_c3_because_only_large_magnitude_neurons"><title>because only large-magnitude neurons carry signal pruning small ones essentially</title><rect x="64" y="440" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="118" rx="6" fill="#48C78E"/><circle cx="112" cy="499" r="10" fill="#48C78E"/><text x="150" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Pruning is essentially free</text><text x="150" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Because only the large-magnitude neurons carry this signal, pruning the small ones barely hurts,</text><text x="150" y="543" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">giving a principled reason why magnitude-based pruning preserves ICL.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">How Do Nonlinear Transformers Learn and Generalize in In-Context Learning?</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICML 2024  ·  arXiv:2402.15607  ·  Rensselaer Polytechnic Institute · IBM Watson</text></svg>