<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A powerful ability we cannot explain</text><g id="cue_s02_c1_in_context_learning_lets_pretrained"><title>in-context learning lets pretrained transformer handle new tasks simply padding</title><rect x="64" y="152" width="1152" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">In-context learning: no fine-tuning required</text><text x="92" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">A pretrained Transformer handles a new task by simply padding the query with a handful of example</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">input-output pairs. No weights are updated; the answer comes from the prompt alone.</text><rect x="92" y="262" width="260" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="277.0" r="5" fill="#34D3C0"/><text x="126" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">example 1  (x1, y1)</text><rect x="364" y="262" width="260" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="382" cy="277.0" r="5" fill="#34D3C0"/><text x="398" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">example 2  (x2, y2)</text><rect x="636" y="262" width="150" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="654" cy="277.0" r="5" fill="#9DB3C8"/><text x="670" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">...</text><rect x="800" y="262" width="240" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="818" cy="277.0" r="5" fill="#F2C14E"/><text x="834" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">query  x  -&gt;  ?</text></g><g id="cue_s02_c2_despite_its_empirical_success_mechan"><title>despite its empirical success mechanics how transformer actually trained acquire</title><rect x="64" y="320" width="560" height="230" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="320" width="6" height="230" rx="6" fill="#F2C14E"/><text x="92" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">The puzzle</text><text x="92" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Despite its empirical success, how a Transformer is</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">actually trained to acquire in-context learning, and how</text><text x="92" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">far that ability generalizes, remains elusive.</text><rect x="92" y="470" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="486.0" r="5" fill="#4C9BE8"/><text x="126" y="491.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">How is ICL acquired during training?</text><rect x="92" y="510" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="526.0" r="5" fill="#34D3C0"/><text x="126" y="531.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Does it generalize under distribution shift?</text></g><g id="cue_s02_c3_core_difficulty_technical_self_atten"><title>core difficulty technical self-attention layer nonlinear through softmax mlp nonlinear</title><rect x="656" y="320" width="560" height="230" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="320" width="6" height="230" rx="6" fill="#F2685C"/><text x="684" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Why it is hard  ·  two nonlinearities</text><text x="684" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The training objective is nonconvex and resists the tools</text><text x="684" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">used for simpler models, because two layers are nonlinear:</text><rect x="684" y="452" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="468.0" r="5" fill="#F2685C"/><text x="718" y="473.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">softmax self-attention  -&gt;  nonlinear</text><rect x="684" y="492" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="508.0" r="5" fill="#F2C14E"/><text x="718" y="513.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">ReLU two-layer MLP  -&gt;  nonlinear</text></g></svg>