<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Provable ICL, in-domain and under shift</text><g id="cue_s07_c1_main_theorem_shows_number_iterations"><title>main theorem shows number iterations matching number samples grow only</title><rect x="64" y="152" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="96" rx="6" fill="#48C78E"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Main theorem  ·  polynomial cost is enough</text><text x="92" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Iterations and a matching number of samples that grow only polynomially in the problem parameters drive</text><text x="92" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the in-domain generalization error down to order epsilon.</text><rect x="880" y="168" width="320" height="64" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1040" y="196" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">T = Theta( M1 alpha^-2/3</text><text x="1040" y="216" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">beta^-2/3 sqrt(log M1) / eta )</text></g><g id="cue_s07_c2_crucially_same_trained_also_generali"><title>crucially same trained also generalizes out domain shifted tasks long</title><rect x="64" y="266" width="560" height="284" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="266" width="6" height="284" rx="6" fill="#34D3C0"/><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Generalizes out of domain, too</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The same trained model handles shifted tasks whenever the</text><text x="92" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">new relevant patterns are linear combinations of the</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">training patterns.</text><rect x="92" y="414" width="504" height="60" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344" y="451" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="middle">combination strength  S1  &gt;=  1</text><text x="92" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A single trained Transformer covers a whole family of shifted</text><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">tasks, not just the ones it saw.</text></g><g id="cue_s07_c3_experiments_confirm_sharply_out_of_d"><title>experiments confirm sharply out-of-domain classification error falls below one percent</title><rect x="656" y="266" width="560" height="284" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="266" width="6" height="284" rx="6" fill="#4C9BE8"/><text x="684" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Out-of-domain error collapses at S1 = 1</text><rect x="700" y="326" width="486" height="196" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="752" y1="340" x2="752" y2="488" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="752" y1="488" x2="1154" y2="488" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><text x="742" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">0</text><text x="742" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">err</text><text x="752.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="middle">0</text><text x="953.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="middle">1</text><text x="1154.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="middle">2</text><text x="943.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">combination strength  S1</text><line x1="953.0" y1="340" x2="953.0" y2="488" stroke="#F2C14E" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="752" y1="480.08" x2="1154" y2="480.08" stroke="#F2685C" stroke-width="1" stroke-linecap="round