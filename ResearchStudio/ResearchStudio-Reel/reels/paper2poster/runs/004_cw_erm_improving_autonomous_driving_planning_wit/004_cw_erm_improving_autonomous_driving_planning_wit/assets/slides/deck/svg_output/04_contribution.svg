<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three contributions, one simple idea</text><g id="cue_s04_c1_makes_three_contributions"><title>makes three contributions</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#3E9BFF"/><circle cx="114" cy="246" r="26" fill="none" stroke="#3E9BFF" stroke-width="2.5"/><text x="114" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#3E9BFF" font-weight="800" text-anchor="middle">3</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Three</text><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">contributions</text><text x="88" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A method, an empirical study,</text><text x="88" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and a theoretical connection</text><text x="88" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">tie the paper together.</text></g><g id="cue_s04_c2_first_proposes_closed_loop_weighted"><title>first proposes closed-loop weighted empirical risk minimization technique leverages closed-loop</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#33D6C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#33D6C0" stroke-width="2.5"/><text x="410" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#33D6C0" font-weight="800" text-anchor="middle">1</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">1 CW-ERM</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Closed-loop Weighted ERM</text><text x="384" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">leverages metrics from policy</text><text x="384" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rollouts to debias the network</text><text x="384" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and shrink the open-loop to</text><text x="384" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">closed-loop gap.</text></g><g id="cue_s04_c3_second_evaluates_method_experimental"><title>second evaluates method experimentally challenging urban driving dataset shows significant</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#46C98B"/><circle cx="706" cy="246" r="26" fill="none" stroke="#46C98B" stroke-width="2.5"/><text x="706" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#46C98B" font-weight="800" text-anchor="middle">2</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">2 Real gains,</text><text x="680" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">cheaply</text><text x="680" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Evaluated on a challenging</text><text x="680" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">urban driving dataset, it</text><text x="680" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">shows significant closed-loop</text><text x="680" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">improvements with no expensive</text><text x="680" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">closed-loop training.</text></g><g id="cue_s04_c4_third_establishes_important_theoreti"><title>third establishes important theoretical connection between reweighting scheme classic family</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#F4C24C"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#F4C24C" stroke-width="2.5"/><text x="1002" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F4C24C" font-weight="800" text-anchor="middle">3</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">3 A theoretical</text><text x="976" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">link</text><text x="976" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">It connects this reweighting</text><text x="976" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">to the classic family that</text><text x="976" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">corrects covariate shift</text><text x="976" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">through density-ratio</text><text x="976" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">estimation.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="700" text-anchor="start">Use the simulator to reweight the training data, and leave the loss and the network untouched.</text></svg>