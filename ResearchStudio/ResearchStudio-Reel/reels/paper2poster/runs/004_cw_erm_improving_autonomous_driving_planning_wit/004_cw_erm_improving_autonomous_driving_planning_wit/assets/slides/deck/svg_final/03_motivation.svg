<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Closed-loop benefits, without the cost</text><g id="cue_s03_c1_been_attempts_close_gap_methods"><title>been attempts close gap methods like urban driver run differentiable</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#3E9BFF" font-weight="800" text-anchor="start">Prior work puts the sim in the loop</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Methods like Urban Driver run a differentiable simulator</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">directly inside the training loop, using backpropagation</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">through time.</text><rect x="92" y="300" width="504" height="44" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="344.0" y="328.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">grad flows through unrolled sim  (BPTT)</text></g><g id="cue_s03_c2_works_but_expensive_requires_differe"><title>works but expensive requires differentiable simulator does not scale well</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#F4C24C"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">But it is expensive</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">It needs a differentiable simulator, it does not scale</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">well, and it carries the heavy memory cost of unrolling</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">policies during training.</text><rect x="92" y="516" width="468" height="28" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="110" cy="530.0" r="5" fill="#F4C24C"/><text x="126" y="536.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">differentiable sim  ·  poor scaling  ·  memory heavy</text></g><g id="cue_s03_c3_other_approaches_collect_on_policy_a"><title>other approaches collect on-policy add extra human oracles which slow</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#F2685C"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">On-policy data and oracles cost more</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Other approaches collect on-policy data or add extra</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">human oracles to label behavior, which are slow and</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">costly to run.</text><rect x="676" y="300" width="512" height="30" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="694" cy="315.0" r="5" fill="#F2685C"/><text x="710" y="321.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">on-policy rollouts  ·  human oracles  ·  slow</text></g><g id="cue_s03_c4_authors_ask_simpler_question_get"><title>authors ask simpler question get closed-loop benefits only simulator decide</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#46C98B"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">A simpler question -&gt; CW-ERM</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Can we get closed-loop benefits by using a simulator only</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">to decide which training scenes matter, with no loss</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">change and no differentiability?</text><text x="676" y="524" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#46C98B" font-weight="800" text-anchor="start">simulator picks scenes, not gradients</text></g></svg>