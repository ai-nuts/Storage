<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">How to target the right scenes</text><g id="cue_s08_c1_ablations_reveal_how_method_well"><title>ablations reveal how method well targeting single metric isolation gives</title><rect x="64" y="158" width="560" height="204" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="204" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#3E9BFF" font-weight="800" text-anchor="start">Single metric vs a Pareto balance</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Targeting one metric alone gives the</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">biggest gain on it; combining metrics</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">trades off, tracing a Pareto front.</text><rect x="400" y="206" width="204" height="140" rx="8" fill="#0E2334" stroke="#284A66" stroke-width="1.5"/><line x1="430" y1="322" x2="590" y2="322" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><line x1="430" y1="322" x2="430" y2="222" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><text x="424" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">side</text><text x="590" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">front -&gt;</text><polyline points="449.2,232.0 484.4,252.0 526.0,274.0 567.6,302.0" fill="none" stroke="#46C98B" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><circle cx="449.2" cy="232.0" r="4.5" fill="#46C98B"/><circle cx="484.4" cy="252.0" r="4.5" fill="#46C98B"/><circle cx="526.0" cy="274.0" r="4.5" fill="#46C98B"/><circle cx="567.6" cy="302.0" r="4.5" fill="#46C98B"/><circle cx="518.0" cy="246.0" r="5" fill="#F2685C"/><text x="527.0" y="249.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F2685C" font-weight="800" text-anchor="start">+rear</text></g><g id="cue_s08_c2_combining_front_side_distance_to_ref"><title>combining front side distance-to-reference works nicely but adding rear collisions</title><rect x="64" y="378" width="560" height="172" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#F4C24C"/><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F4C24C" font-weight="800" text-anchor="start">Front + side + distance works; +rear hurts</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Adding rear collisions causes a clear regression, traced</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">to false positives from log-replayed agents that do not</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">react in the sim.</text><rect x="92" y="512" width="468" height="28" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="110" cy="526.0" r="5" fill="#F2685C"/><text x="126" y="532.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">rear metric -&gt; non-reacting replay agents</text></g><g id="cue_s08_c3_early_stopping_budget_identification"><title>early-stopping budget identification policy ten epochs works best single-metric error</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#33D6C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Early-stopping budget K</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The identification policy is stopped early. The budget K</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">controls how full the error set stays.</text><rect x="684" y="286" width="250" height="60" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="809.0" y="317.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20.400000000000002" fill="#33D6C0" font-weight="800" text-anchor="middle">K = 10</text><text x="809.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">best, single metric</text><rect x="958" y="286" width="250" height="60" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="1083.0" y="317.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20.400000000000002" fill="#3E9BFF" font-weight="800" text-anchor="middle">K = 20</text><text x="1083.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">best, multi-metric</text></g><g id="cue_s08_c4_upsampling_factor_performance_improv"><title>upsampling factor performance improves about factor fifty after which side</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#F4C24C"/><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Upsampling factor peaks near 50</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Gains improve up to w around fifty, then</text><text x="684" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">side collisions rise again, echoing</text><text x="684" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">saturation in Just Train Twice.</text><rect x="984" y="392" width="220" height="146" rx="8" fill="#0E2334" stroke="#284A66" stroke-width="1.5"/><line x1="1014" y1="516" x2="1190" y2="516" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><line x1="1014" y1="516" x2="1014" y2="408" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><polyline points="1014.0,416.64 1021.04,426.76392 1028.08,437.77128 1035.12,447.88008 1042.16,457.09032 1049.2,465.402 1056.24,472.81512 1063.28,479.32968 1070.32,484.94568 1077.36,489.66312 1084.4,493.48199999999997 1091.44,496.40232 1098.48,498.42408 1105.52,499.54728 1112.56,499.77192 1119.6,499.098 1126.64,497.52552000000003 1133.68,495.05448 1140.72,491.68488 1147.76,487.41672 1154.8,482.25 1161.84,476.18472 1168.88,469.22088 1175.92,461.35848 1182.96,452.59752000000003 1190.0,442.938" fill="none" stroke="#3E9BFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="1110.8" y1="499.8" x2="1110.8" y2="516" stroke="#F4C24C" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="1110.8" cy="499.8" r="5" fill="#F4C24C"/><text x="1110.8" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F4C24C" font-weight="800" text-anchor="middle">w ~ 50</text><text x="1010" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">side coll.</text><text x="1190" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">upsampling w -&gt;</text></g></svg>