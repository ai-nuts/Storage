<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="800" text-anchor="start" letter-spacing="2">NeurIPS 2022  ·  ML4AD Workshop</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">Woven Planet  ·  Autonomous Driving Planning</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#284A66" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">CW-ERM</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">Improving Autonomous Driving Planning with Closed-loop</text><text x="64" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">Weighted Empirical Risk Minimization</text><rect x="1091.0" y="142.0" width="38" height="68" rx="12" fill="#173049" stroke="#3E9BFF" stroke-width="2.2"/><rect x="1097.0" y="151.0" width="26" height="15" rx="4" fill="#3E9BFF" opacity="0.6"/><rect x="1097.0" y="190.0" width="26" height="11" rx="4" fill="#3E9BFF" opacity="0.32"/><line x1="1094.0" y1="174" x2="1126.0" y2="174" stroke="#3E9BFF" stroke-width="1.2" stroke-linecap="butt"/><circle cx="1110" cy="112" r="7" fill="#F2685C"/><circle cx="1046" cy="182" r="7" fill="#F4C24C"/><circle cx="1174" cy="182" r="7" fill="#F4C24C"/><circle cx="1110" cy="248" r="7" fill="#33D6C0"/><text x="1110" y="98" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2685C" font-weight="800" text-anchor="middle">front</text><text x="1046" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F4C24C" font-weight="800" text-anchor="middle">side</text><text x="1174" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F4C24C" font-weight="800" text-anchor="middle">side</text><text x="1110" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33D6C0" font-weight="800" text-anchor="middle">rear</text><text x="64" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Eesha Kumar · Yiming Zhang · Stefano Pini · Simon Stent · Ana Ferreira · Sergey Zagoruyko · Christian S. Perone</text><g id="cue_s01_c1_self_driving_policies_learned_behavi"><title>self-driving policies learned behavioral cloning usually trained open-loop matching expert</title><rect x="64" y="290" width="276" height="244" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="290" width="276" height="6" rx="6" fill="#3E9BFF"/><circle cx="90" cy="332" r="7" fill="#3E9BFF"/><text x="108" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Trained open, driven</text><text x="108" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">closed</text><text x="88" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Behavioral cloning matches expert</text><text x="88" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">actions one step at a time, yet</text><text x="88" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">the policy is deployed closed-loop</text><text x="88" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">where every action shapes future</text><text x="88" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">states.</text></g><g id="cue_s01_c2_mismatch_quietly_hurts_real_world_sa"><title>mismatch quietly hurts real-world safety</title><rect x="356" y="290" width="276" height="244" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="356" y="290" width="276" height="6" rx="6" fill="#F2685C"/><circle cx="382" cy="332" r="7" fill="#F2685C"/><text x="400" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">The mismatch hurts</text><text x="400" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">safety</text><text x="380" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">This open-loop versus closed-loop</text><text x="380" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">gap quietly hurts real-world</text><text x="380" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">driving safety.</text></g><g id="cue_s01_c3_introduces_c_w_e_r_m_closed_loop_wei"><title>introduces c-w-e-r-m closed-loop weighted empirical risk minimization simple two-stage recipe</title><rect x="648" y="290" width="276" height="244" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="648" y="290" width="276" height="6" rx="6" fill="#F4C24C"/><circle cx="674" cy="332" r="7" fill="#F4C24C"/><text x="692" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">A two-stage recipe</text><text x="672" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Run a policy in a simulator to</text><text x="672" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">find the scenes where it fails,</text><text x="672" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">then upsample exactly those scenes</text><text x="672" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">when training the final policy.</text></g><g id="cue_s01_c4_challenging_urban_driving_dataset_cu"><title>challenging urban driving dataset cuts collisions substantially improvements around thirty-five</title><rect x="940" y="290" width="276" height="244" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="940" y="290" width="276" height="6" rx="6" fill="#46C98B"/><circle cx="966" cy="332" r="7" fill="#46C98B"/><text x="984" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">~35% fewer collisions</text><text x="964" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">On a challenging urban dataset it</text><text x="964" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">cuts collisions substantially,</text><text x="964" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">with no differentiable simulator</text><text x="964" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">or costly closed-loop training.</text></g><line x1="64" y1="556" x2="1216" y2="556" stroke="#284A66" stroke-width="1" stroke-linecap="round"/><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="700" text-anchor="start">arXiv:2210.02174</text><text x="300" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/wp-research-uk/cw-erm</text><text x="1216" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Closed-loop benefits, without closed-loop training.</text></svg>