<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Simpler, and safer, planners</text><g id="cue_s10_c1_takeaway_refreshingly_practical_you"><title>takeaway refreshingly practical you not need differentiable simulator human loop</title><rect x="64" y="176" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="176" width="6" height="180" rx="6" fill="#3E9BFF"/><circle cx="98" cy="216" r="10" fill="#3E9BFF"/><text x="122" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">No diff sim, no human, no CL training</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">You do not need a differentiable simulator, a human in the</text><text x="92" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">loop, or expensive closed-loop training to get closed-loop</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">benefits.</text></g><g id="cue_s10_c2_you_just_need_run_your"><title>you just need run your policy once simulator note where</title><rect x="656" y="176" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="176" width="6" height="180" rx="6" fill="#F4C24C"/><circle cx="690" cy="216" r="10" fill="#F4C24C"/><text x="714" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Run once, note failures, upsample,</text><text x="714" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">retrain</text><text x="684" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Just run the policy once in a simulator, mark the scenes where</text><text x="684" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">it fails, upsample those scenes, and retrain the final policy.</text></g><g id="cue_s10_c3_simple_recipe_delivers_significant_r"><title>simple recipe delivers significant reductions collisions other non-differentiable metrics works</title><rect x="64" y="374" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="374" width="6" height="180" rx="6" fill="#46C98B"/><circle cx="98" cy="414" r="10" fill="#46C98B"/><text x="122" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Significant, latency-free, any metric</text><text x="92" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The recipe delivers significant collision reductions, works</text><text x="92" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">with any closed-loop metric, and adds no inference latency.</text></g><g id="cue_s10_c4_comes_clean_theoretical_story_weight"><title>comes clean theoretical story weighting scenes failure closely connected correcting</title><rect x="656" y="374" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="374" width="6" height="180" rx="6" fill="#33D6C0"/><circle cx="690" cy="414" r="10" fill="#33D6C0"/><text x="714" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">A clean theoretical story</text><text x="684" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Weighting scenes by failure is closely connected to correcting</text><text x="684" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">covariate shift through density-ratio estimation.</text></g><line x1="64" y1="584" x2="1216" y2="584" stroke="#284A66" stroke-width="1" stroke-linecap="round"/><rect x="82.0" y="607.0" width="28" height="50" rx="12" fill="#173049" stroke="#3E9BFF" stroke-width="2.2"/><rect x="88.0" y="616.0" width="16" height="15" rx="4" fill="#3E9BFF" opacity="0.6"/><rect x="88.0" y="637.0" width="16" height="11" rx="4" fill="#3E9BFF" opacity="0.32"/><line x1="85.0" y1="630" x2="107.0" y2="630" stroke="#3E9BFF" stroke-width="1.2" stroke-linecap="butt"/><circle cx="126" cy="632" r="6" fill="#F2685C"/><text x="139" y="637" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">front</text><circle cx="222" cy="632" r="6" fill="#F4C24C"/><text x="235" y="637" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">side</text><circle cx="318" cy="632" r="6" fill="#33D6C0"/><text x="331" y="637" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">rear</text><text x="1216" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">CW-ERM  ·  Closed-loop Weighted ERM  ·  Woven Planet  ·  NeurIPS 2022</text></svg>