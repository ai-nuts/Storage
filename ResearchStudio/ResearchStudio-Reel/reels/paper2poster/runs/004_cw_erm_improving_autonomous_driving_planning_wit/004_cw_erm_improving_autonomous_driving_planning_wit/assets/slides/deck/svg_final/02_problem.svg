<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Trained open-loop, deployed closed-loop</text><g id="cue_s02_c1_imitation_learning_self_driving_cars"><title>imitation learning self-driving cars usually done through behavioral cloning where</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#3E9BFF"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Cloning the expert's next action</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Imitation learning for self-driving is</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">usually behavioral cloning: the network is</text><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">trained to reproduce an expert's next</text><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">action.</text><rect x="92" y="346" width="344" height="152" rx="10" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="112" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">one-step supervised matching</text><rect x="112" y="392" width="304" height="40" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="264.0" y="418.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">min  E || pi(s) - a_expert ||</text><text x="112" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">open-loop: no feedback from its own acts</text></g><g id="cue_s02_c2_catch_done_open_loop_never_sees"><title>catch done open-loop never sees consequences its own actions but</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">It never sees its own consequences</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Training is open-loop, so the model never sees the effects</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">of its actions. But when it drives, every action changes</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the future state it will see.</text><rect x="930" y="220" width="272" height="74" rx="8" fill="#0E2334" stroke="#284A66" stroke-width="1.5"/><line x1="942" y1="234" x2="1190" y2="234" stroke="#284A66" stroke-width="1.1" stroke-linecap="round"/><line x1="942" y1="282" x2="1190" y2="282" stroke="#284A66" stroke-width="1.1" stroke-linecap="round"/><line x1="942" y1="264.4" x2="1190" y2="264.4" stroke="#6E869C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="9 9"/><polyline points="944.0,264.4 968.4,264.4 992.8,264.4 1017.2,264.4 1041.6,264.4 1066.0,264.4 1090.4,264.4 1114.8,264.4 1139.2,264.4 1163.6,264.4 1188.0,264.4" fill="none" stroke="#46C98B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="944.0,264.4 968.4,264.0892 992.8,263.1568 1017.2,261.6028 1041.6,259.42719999999997 1066.0,256.63 1090.4,253.2112 1114.8,249.17079999999999 1139.2,244.50879999999998 1163.6,239.22519999999997 1188.0,233.32" fill="none" stroke="#F2685C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><circle cx="1188.0" cy="233.32" r="4.5" fill="#F2685C"/><text x="1188" y="280.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#46C98B" font-weight="800" text-anchor="end">expert (open-loop)</text><text x="1188" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#F2685C" font-weight="800" text-anchor="end">policy drift -&gt; OOD</text></g><g id="cue_s02_c3_small_prediction_errors_accumulate_p"><title>small prediction errors accumulate pushing car out-of-distribution situations never trained</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F4C24C"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">Small errors compound into OOD</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Small prediction errors accumulate, pushing the car into</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">out-of-distribution situations it was never trained on.</text></g><g id="cue_s02_c4_metrics_truly_matter_like_collisions"><title>metrics truly matter like collisions non-differentiable they effectively invisible standard</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#F2685C"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">The metrics that matter are invisible</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Collisions are non-differentiable, invisible to the loss, so the policy</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">looks great open-loop but drives poorly closed-loop.</text></g></svg>