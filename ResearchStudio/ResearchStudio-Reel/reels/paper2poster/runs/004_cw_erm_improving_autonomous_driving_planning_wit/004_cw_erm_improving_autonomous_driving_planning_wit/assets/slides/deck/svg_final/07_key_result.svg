, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">perturbation, the strongest baseline.</text><rect x="776" y="214" width="440" height="80" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="796" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Collisions cut across all zones at once:</text><circle cx="796" cy="270" r="6" fill="#F2685C"/><text x="809" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">front</text><circle cx="892" cy="270" r="6" fill="#F4C24C"/><text x="905" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">side</text><circle cx="988" cy="270" r="6" fill="#33D6C0"/><text x="1001" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="start">rear</text></g><g id="cue_s07_c2_when_upsamples_front_collision_scene"><title>when upsamples front-collision scenes front collisions fall fourteen nine</title><rect x="64" y="324" width="368" height="224" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="324" width="6" height="224" rx="6" fill="#F2685C"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Front collisions</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Upsampling front-collision scenes.</text><rect x="92" y="420" width="150" height="104" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="167.0" y="474.08" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill=