<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Train, simulate, then upsample failures</text><g id="cue_s05_c1_method_three_stages_strikingly_simpl"><title>method three stages strikingly simple stage one you train identification</title><rect x="64" y="158" width="1152" height="168" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="168" rx="6" fill="#3E9BFF"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Three stages, and strikingly simple</text><rect x="96.0" y="206" width="329.3333333333333" height="102" rx="10" fill="#173049" stroke="#3E9BFF" stroke-width="1.6"/><rect x="96.0" y="206" width="329.3333333333333" height="5" rx="3" fill="#3E9BFF"/><circle cx="126.0" cy="244" r="15" fill="none" stroke="#3E9BFF" stroke-width="2.2"/><text x="126.0" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#3E9BFF" font-weight="800" text-anchor="middle">1</text><text x="152.0" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">Train identification</text><text x="152.0" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">policy</text><text x="112.0" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">standard ERM behavioral</text><text x="112.0" y="293" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">cloning</text><text x="451.3333333333333" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#9DB3C8" font-weight="800" text-anchor="middle">&gt;</text><rect x="477.3333333333333" y="206" width="329.3333333333333" height="102" rx="10" fill="#173049" stroke="#F4C24C" stroke-width="1.6"/><rect x="477.3333333333333" y="206" width="329.3333333333333" height="5" rx="3" fill="#F4C24C"/><circle cx="507.3333333333333" cy="244" r="15" fill="none" stroke="#F4C24C" stroke-width="2.2"/><text x="507.3333333333333" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F4C24C" font-weight="800" text-anchor="middle">2</text><text x="533.3333333333333" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">Roll out in the</text><text x="533.3333333333333" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">simulator</text><text x="493.3333333333333" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">collect closed-loop costs</text><text x="493.3333333333333" y="293" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">(collisions)</text><text x="832.6666666666666" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#9DB3C8" font-weight="800" text-anchor="middle">&gt;</text><rect x="858.6666666666666" y="206" width="329.3333333333333" height="102" rx="10" fill="#173049" stroke="#46C98B" stroke-width="1.6"/><rect x="858.6666666666666" y="206" width="329.3333333333333" height="5" rx="3" fill="#46C98B"/><circle cx="888.6666666666666" cy="244" r="15" fill="none" stroke="#46C98B" stroke-width="2.2"/><text x="888.6666666666666" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#46C98B" font-weight="800" text-anchor="middle">3</text><text x="914.6666666666666" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">Retrain, upsample</text><text x="914.6666666666666" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">failures</text><text x="874.6666666666666" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">weighted ERM on the error set</text></g><g id="cue_s05_c2_every_scene_where_cost_positive"><title>every scene where cost positive meaning policy failed goes error</title><rect x="64" y="342" width="560" height="208" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="342" width="6" height="208" rx="6" fill="#46C98B"/><text x="92" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#46C98B" font-weight="800" text-anchor="start">Failing scenes -&gt; upsample by w</text><text x="92" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Every scene with a positive cost, meaning the policy</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">failed, goes into an error set. The final policy is</text><text x="92" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">retrained with weighted ERM, upsampling those scenes by a</text><text x="92" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">factor w.</text><rect x="92" y="508" width="504" height="44" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="344.0" y="536.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">cost(scene) &gt; 0  -&gt;  error set,  x w</text></g><g id="cue_s05_c3_nearly_identical_original_behavioral"><title>nearly identical original behavioral-cloning objective single addition weighting term driven</title><rect x="656" y="342" width="560" height="102" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="342" width="6" height="102" rx="6" fill="#33D6C0"/><text x="684" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Almost the same objective</text><text x="684" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Nearly identical to behavioral cloning, with a single</text><text x="684" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">weighting term driven by closed-loop failures.</text></g><g id="cue_s05_c4_two_practical_tricks_matter_identifi"><title>two practical tricks matter identification policy stopped early error set</title><rect x="656" y="460" width="560" height="90" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="460" width="6" height="90" rx="6" fill="#F4C24C"/><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Two tricks, no differentiable sim</text><text x="684" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Early-stop the ID policy so the error set is not depleted; upsample (not</text><text x="684" y="535" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reweight) for stability; any non-differentiable metric works.</text></g></svg>