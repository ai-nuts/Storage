<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Real urban driving, at fleet scale</text><g id="cue_s06_c1_method_evaluated_proprietary_real_wo"><title>method evaluated proprietary real-world dataset collected company self-driving vehicles challenging</title><rect x="64" y="158" width="1152" height="132" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="132" rx="6" fill="#3E9BFF"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">A proprietary real-world fleet dataset</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Collected from the company's self-driving vehicles on challenging urban</text><text x="92" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">missions in San Francisco and Palo Alto.</text><rect x="700" y="214" width="230" height="32" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="718" cy="230.0" r="5" fill="#3E9BFF"/><text x="734" y="236.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">San Francisco</text><rect x="946" y="214" width="200" height="32" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="964" cy="230.0" r="5" fill="#33D6C0"/><text x="980" y="236.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Palo Alto</text></g><g id="cue_s06_c2_includes_recorded_trajectories_ego_v"><title>includes recorded trajectories ego vehicle surrounding agents together high-definition maps</title><rect x="64" y="306" width="560" height="140" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="306" width="6" height="140" rx="6" fill="#33D6C0"/><text x="92" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Trajectories plus HD maps</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Recorded trajectories of the ego vehicle and surrounding</text><text x="92" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">agents, together with high-definition maps.</text></g><g id="cue_s06_c3_scenarios_diverse_difficult_stopping"><title>scenarios diverse difficult stopping behind lead vehicle stopping intersections navigating</title><rect x="656" y="306" width="560" height="140" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="306" width="6" height="140" rx="6" fill="#F2685C"/><text x="684" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Diverse, difficult scenarios</text><text x="684" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Stopping behind a lead car, intersections, dense traffic</text><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">with pedestrians and cyclists; most scenes 11-13 s, up to 30</text><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">s.</text></g><g id="cue_s06_c4_total_authors_train_one_hundred"><title>total authors train one hundred eighty hours driving validate test</title><rect x="64" y="462" width="1152" height="88" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="462" width="6" height="88" rx="6" fill="#46C98B"/><text x="92" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Trained at scale, simulator open-sourced</text><rect x="560" y="472" width="168" height="68" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="644.0" y="507.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.12" fill="#46C98B" font-weight="800" text-anchor="middle">180 h</text><text x="644.0" y="526.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">training</text><rect x="742" y="472" width="168" height="68" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="826.0" y="507.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.12" fill="#33D6C0" font-weight="800" text-anchor="middle">60 h</text><text x="826.0" y="526.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">validation</text><rect x="924" y="472" width="168" height="68" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="1008.0" y="507.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.12" fill="#3E9BFF" font-weight="800" 