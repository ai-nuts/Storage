<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Stable approximation forces exponential memory</text><g id="cue_s07_c1_headline_theoretical_result_clean_in"><title>headline theoretical result clean inverse statement nonlinear rnn stably approximate</title><rect x="64" y="152" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="96" rx="6" fill="#48C78E"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">The headline  ·  a clean inverse statement</text><text x="92" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">If a nonlinear RNN can stably approximate a target sequence relationship, then that target's memory must</text><text x="92" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">decay exponentially.</text><rect x="872" y="168" width="328" height="64" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1036" y="196" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">stably approximable</text><text x="1036" y="216" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="middle">=&gt;  memory ~ exp(-t)</text></g><g id="cue_s07_c2_extends_linear_curse_memory_nonlinea"><title>extends linear curse memory nonlinear regime proves failure long-term dependencies</title><rect x="64" y="266" width="560" height="284" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="266" width="6" height="284" rx="6" fill="#34D3C0"/><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">An intrinsic limit, not a training artifact</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">This extends the linear curse of memory to the nonlinear</text><text x="92" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">regime, so the long-term-dependency failure lives in the</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RNN hypothesis space itself.</text><rect x="92" y="440" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="457.0" r="5" fill="#48C78E"/><text x="126" y="462.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">teacher filter: only survivors decay exp.</text><text x="92" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Keeping only teachers that are both approximable AND stable leaves</text><text x="92" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">exactly the exponential-memory ones.</text></g><g id="cue_s07_c3_polynomial_memory_targets_perturbati"><title>polynomial-memory targets perturbation-error curves different hidden dimensions keep intersecting further</title><rect x="656" y="266" width="560" height="284" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="266" width="6" height="284" rx="6" fill="#4C9BE8"/><text x="684" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Poly-memory: curves intersect further left</text><rect x="700" y="326" width="486" height="196" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="746" y1="340" x2="746" y2="484" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="746" y1="484" x2="1160" y2="484" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><text x="736" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">E_m</text><text x="736" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">0</text><text x="746" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="middle">0</text><text x="1160.0" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">beta</text><text x="943.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">perturbation radius  beta</text><polyline points="746.0,473.42160762224734 750.14,473.41884426998087 754.28,473.41566583278995 758.42,473.4120099906577 762.56,473.4078050767062 766.7,473.4029686784851 770.84,473.3974060309664 774.98,473.39100817055646 779.12,473.3836498150182 783.26,473.37518692918553 787.4,473.