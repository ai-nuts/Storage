<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The curse of memory, and its cure</text><g id="cue_s10_c1_one_line_takeaway_matter_how_you"><title>one-line takeaway matter how you train them plain nonlinear rnns</title><rect x="64" y="168" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="118" rx="6" fill="#4C9BE8"/><circle cx="112" cy="227" r="10" fill="#4C9BE8"/><text x="150" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A limit baked into the architecture</text><text x="150" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">No matter how they are trained, plain nonlinear RNNs can only stably approximate sequence</text><text x="150" y="271" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">relationships whose memory fades exponentially, so the long-term-dependency struggle is</text><text x="150" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">intrinsic, not just an optimizer issue.</text></g><g id="cue_s10_c2_but_same_analysis_points_cure"><title>but same analysis points cure</title><rect x="64" y="304" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="304" width="6" height="118" rx="6" fill="#34D3C0"/><circle cx="112" cy="363" r="10" fill="#34D3C0"/><text x="150" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">But the analysis points to a cure</text><text x="150" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">The same stability argument that exposes the limit also shows how to relax it.</text></g><g id="cue_s10_c3_reparameterizing_recurrent_weights_s"><title>reparameterizing recurrent weights stable map like exponential softplus network keep</title><rect x="64" y="440" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="118" rx="6" fill="#48C78E"/><circle cx="112" cy="499" r="10" fill="#48C78E"/><text x="150" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Reparameterize the recurrent weights</text><text x="150" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">With a stable map like exponential or softplus, the network keeps eigenvalues near the edge of</text><text x="150" y="543" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">stability, provably relaxing the curse and, on MNIST, training faster and generalizing better.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">Inverse Approximation Theory for Nonlinear Recurrent Neural Networks</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICLR 2024  ·  arXiv:2305.19190  ·  Microsoft Research Asia · NUS · IFIM</text></svg>