<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two tools, one theorem, one cure</text><g id="cue_s04_c1_makes_three_main_contributions_first"><title>makes three main contributions first extends concept memory function linear</title><rect x="64" y="168" width="274" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="274" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="240" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="90" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Memory function</text><text x="90" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Extends the memory function</text><text x="90" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">from linear to general</text><text x="90" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">nonlinear functional</text><text x="90" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sequences, and it can be</text><text x="90" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">numerically quantified by</text><text x="90" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">querying a trained model.</text></g><g id="cue_s04_c2_second_introduces_framework_stable_a"><title>second introduces framework stable approximation mild requirement approximant behaves continuously</title><rect x="356" y="168" width="274" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="168" width="274" height="6" rx="6" fill="#34D3C0"/><circle cx="406" cy="240" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="406" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="382" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Stable approximation</text><text x="382" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A mild framework requiring the</text><text x="382" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">approximant to behave</text><text x="382" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">continuously under small</text><text x="382" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">parameter perturbations,</text><text x="382" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">exactly what gradient descent</text><text x="382" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">needs.</text></g><g id="cue_s04_c3_third_these_two_ingredients_proves"><title>third these two ingredients proves what authors believe first bernstein-type</title><rect x="648" y="168" width="274" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="168" width="274" height="6" rx="6" fill="#F2C14E"/><circle cx="698" cy="240" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="698" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="674" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Bernstein theorem</text><text x="674" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Using both tools, the first</text><text x="674" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Bernstein-type approximation</text><text x="674" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">theorem for nonlinear RNNs,</text><text x="674" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">believed to be new to the</text><text x="674" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">literature.</text></g><g id="cue_s04_c4_top_theory_proposes_principled_repar"><title>top theory proposes principled reparameterization method overcome identified limitation confirms</title><rect x="940" y="168" width="274" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="168" width="274" height="6" rx="6" fill="#48C78E"/><circle cx="990" cy="240" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="990" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">+</text><text x="966" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Principled cure</text><text x="966" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">On top of the theory, a</text><text x="966" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reparameterization method that</text><text x="966" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">overcomes the limitation,</text><text x="966" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">confirmed by numerical</text><text x="966" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">experiments.</text></g><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Memory + stability are the ingredients; the theorem is the result; the reparameterization is the fix.</text></svg>