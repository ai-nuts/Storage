<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Why do RNNs fail on long memory?</text><g id="cue_s02_c1_recurrent_neural_networks_among_most"><title>recurrent neural networks among most basic models learning sequential temporal</title><rect x="64" y="152" width="1152" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">RNNs: a basic model for sequential and temporal data</text><text x="92" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Recurrent networks are among the most fundamental architectures for learning from sequences,</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">spanning a wide range of everyday tasks.</text><rect x="92" y="262" width="258" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="277.0" r="5" fill="#34D3C0"/><text x="126" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">time series</text><rect x="362" y="262" width="190" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="380" cy="277.0" r="5" fill="#34D3C0"/><text x="396" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">speech</text><rect x="564" y="262" width="170" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="582" cy="277.0" r="5" fill="#34D3C0"/><text x="598" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">text</text><rect x="746" y="262" width="290" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="764" cy="277.0" r="5" fill="#F2C14E"/><text x="780" y="282.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">sentiment analysis</text></g><g id="cue_s02_c2_but_long_standing_empirical_observat"><title>but long-standing empirical observation they falter when long-term dependencies</title><rect x="64" y="320" width="560" height="230" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="320" width="6" height="230" rx="6" fill="#F2C14E"/><text x="92" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">The long-standing observation</text><text x="92" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Empirically, RNNs falter whenever the data has long-term</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">dependencies: distant inputs stop influencing the output.</text><rect x="92" y="470" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="486.0" r="5" fill="#48C78E"/><text x="126" y="491.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">short memory  -&gt;  learns fine</text><rect x="92" y="510" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="526.0" r="5" fill="#F2685C"/><text x="126" y="531.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">long memory  -&gt;  training breaks down</text></g><g id="cue_s02_c3_open_question_confronts_whether_fail"><title>open question confronts whether failure only about dynamics like exploding</title><rect x="656" y="320" width="560" height="230" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="320" width="6" height="230" rx="6" fill="#F2685C"/><text x="684" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">The open question</text><text x="684" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Is this failure only about training dynamics, or a deeper</text><text x="684" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">limit on what RNNs can represent at all?</text><rect x="684" y="452" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="468.0" r="5" fill="#F2C14E"/><text x="718" y="473.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">just exploding / vanishing gradients?</text><rect x="684" y="492" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="508.0" r="5" fill="#F2685C"/><text x="718" y="513.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">or a structural limitation of the model?</text></g></svg>