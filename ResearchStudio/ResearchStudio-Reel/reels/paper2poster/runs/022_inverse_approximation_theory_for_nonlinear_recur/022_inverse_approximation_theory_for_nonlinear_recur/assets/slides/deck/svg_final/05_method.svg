<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">From a memory function to a stable fix</text><g id="cue_s05_c1_method_three_pieces_first_memory"><title>method three pieces first memory function nonlinear functionals measures over</title><rect x="64" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="198" rx="6" fill="#4C9BE8"/><text x="92" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">1 · Memory function for nonlinear maps</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Over Heaviside step inputs, measure how strongly the</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">output at time t still depends on the input.</text><rect x="92" y="264" width="512" height="58" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="290" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">M(t) = | d y(t) / d (step input) |</text><text x="348.0" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">task-independent  ·  numerically queryable</text></g><g id="cue_s05_c2_second_stability_framework_perturbat"><title>second stability framework perturbation error hidden dimension worst-case output error</title><rect x="648" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="152" width="6" height="198" rx="6" fill="#34D3C0"/><text x="676" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">2 · Stable approximation</text><text x="676" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Perturbation error at width m: the worst output error when</text><text x="676" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">parameters move inside a ball of radius beta.</text><rect x="676" y="270" width="512" height="58" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="294" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">E_m(beta) = max_{||dW|| &lt;= beta} || y - y_perturbed ||</text><text x="932.0" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">stable if E_m stays continuous up to some beta &gt; 0</text></g><g id="cue_s05_c3_central_theorem_says_target_decaying"><title>central theorem says target decaying memory stably approximated rnns whose</title><rect x="64" y="362" width="568" height="198" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="362" width="6" height="198" rx="6" fill="#48C78E"/><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">3 · The central theorem</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">If a target is stably approximated by RNNs with controlled</text><text x="92" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">weights, its memory MUST decay exponentially.</text><rect x="92" y="480" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="496.0" r="5" fill="#48C78E"/><text x="126" y="501.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">stability  -&gt;  hidden-state derivatives -&gt; 0</text><rect x="92" y="518" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="534.0" r="5" fill="#34D3C0"/><text x="126" y="539.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">Hartman-Grobman bounds the eigenvalues</text></g><g id="cue_s05_c4_finally_overcome_curse_they_substitu"><title>finally overcome curse they substitute recurrent weight matrix continuous function</title><rect x="648" y="362" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="362" width="6" height="198" rx="6" fill="#F2C14E"/><text x="676" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">4 · Stable reparameterization</text><text x="676" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Replace the recurrent weight with a map that always lands in</text><text x="676" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">stable, negative-real-part matrices.</text><rect x="676" y="480" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="496.0" r="5" fill="#F2C14E"/><text x="710" y="501.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">W  =  f(theta),   Re(eig) &lt; 0  always</text><rect x="676" y="518" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="534.0" r="5" fill="#34D3C0"/><text x="710" y="539.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">exponential / softplus maps stay stable</text></g></svg>