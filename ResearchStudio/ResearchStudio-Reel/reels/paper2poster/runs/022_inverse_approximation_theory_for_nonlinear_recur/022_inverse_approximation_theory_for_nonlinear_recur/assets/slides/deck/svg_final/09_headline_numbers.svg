<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The message in four numbers</text><g id="cue_s09_c1_few_numbers_capture_impact"><title>few numbers capture impact</title><rect x="64" y="152" width="1152" height="74" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="74" rx="6" fill="#4C9BE8"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">MNIST, 10 epochs, averaged over 3 runs  ·  stable vs direct parameterization</text><rect x="92" y="192" width="470" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="207.0" r="5" fill="#48C78E"/><text x="126" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">stable maps  -&gt;  faster + higher accuracy</text><rect x="576" y="192" width="470" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="594" cy="207.0" r="5" fill="#F2685C"/><text x="610" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">direct map  -&gt;  unstable baseline</text></g><g id="cue_s09_c2_mnist_trained_ten_epochs_averaged"><title>mnist trained ten epochs averaged over three runs softplus stable</title><rect x="64" y="246" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="246" width="368" height="6" rx="6" fill="#48C78E"/><text x="248.0" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#48C78E" font-weight="800" text-anchor="middle">71.36%</text><text x="248.0" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">softplus stable reparameterization</text><text x="248.0" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">best MNIST test accuracy</text></g><g id="cue_s09_c3_exponential_inverse_stable_maps_also"><title>exponential inverse stable maps also land above seventy percent all</title><rect x="456" y="246" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="246" width="368" height="6" rx="6" fill="#F2685C"/><text x="640.0" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#F2685C" font-weight="800" text-anchor="middle">68.47%</text><text x="640.0" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">direct, unstable baseline</text><text x="640.0" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">exp. &amp; inverse maps also &gt; 70%</text></g><g id="cue_s09_c4_synthetic_side_exponential_memory_ta"><title>synthetic side exponential-memory targets fit roughly ten epochs while polynomial-memory</title><rect x="848" y="246" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="246" width="368" height="6" rx="6" fill="#F2C14E"/><text x="1032.0" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#F2C14E" font-weight="800" text-anchor="middle">10 vs 1000</text><text x="1032.0" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">epochs to fit exp. vs poly. memory</text><text x="1032.0" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">poly. targets still fail the stability test</text></g><rect x="64" y="466" width="1152" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="92" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#48C78E" font-weight="700" text-anchor="start">Stable reparameterization  -&gt;  nearly +3 points over the unstable baseline, and it converges far sooner</text><text x="92" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="700" text-anchor="start">Teacher-filtering experiment uses hidden dimension 256; only exponential-memory teachers survive</text></svg>