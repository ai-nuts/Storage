<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Only the parameterization changes</text><g id="cue_s08_c1_key_ablation_varies_only_how"><title>key ablation varies only how recurrent weight parameterized holding initialization</title><rect x="64" y="152" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">Vary ONLY how the recurrent weight is parameterized; hold the initialization fixed.</text></g><g id="cue_s08_c2_mnist_three_stable_reparameterizatio"><title>mnist three stable reparameterizations softplus exponential inverse all speed optimization</title><rect x="64" y="230" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="230" width="6" height="180" rx="6" fill="#34D3C0"/><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">MNIST: stable maps train faster</text><rect x="92" y="286" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="303.0" r="5" fill="#48C78E"/><text x="126" y="308.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">softplus / exponential / inverse  -&gt;  stable</text><rect x="92" y="328" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="345.0" r="5" fill="#F2685C"/><text x="126" y="350.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">direct (weight used as-is)  -&gt;  unstable</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">All three stable maps beat the direct baseline on accuracy.</text></g><g id="cue_s08_c3_importantly_since_reparameterization"><title>importantly since reparameterization does not change inherent capacity final performance</title><rect x="656" y="230" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="230" width="6" height="180" rx="6" fill="#F2C14E"/><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Capacity is unchanged</text><text x="684" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Reparameterization does not alter the model's inherent</text><text x="684" y="323" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">capacity, so final accuracy across stable variants is</text><text x="684" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">comparable.</text><rect x="684" y="368" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="384.0" r="5" fill="#F2C14E"/><text x="718" y="389.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">isolates an OPTIMIZATION &amp; stability gain</text></g><g id="cue_s08_c4_synthetic_side_applying_exponential"><title>synthetic side applying exponential softplus reparameterizations linear rnns approximating polynomial-decay</title><rect x="64" y="430" width="1152" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="430" width="6" height="120" rx="6" fill="#48C78E"/><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Synthetic  ·  reparameterization restores the continuous limiting-error curve</text><rect x="92" y="486" width="540" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="503.0" r="5" fill="#F2685C"/><text x="126" y="508.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">linear RNN + poly-decay target  -&gt;  unstable curve</text><rect x="648" y="486" width="540" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="666" cy="503.0" r="5" fill="#48C78E"/><text x="682" y="508.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">+ exponential / softplus map  -&gt;  stability recovered</text><text x="92" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">Confirms that the stability the theory predicts is exactly what the fix brings back.</text></g></svg>