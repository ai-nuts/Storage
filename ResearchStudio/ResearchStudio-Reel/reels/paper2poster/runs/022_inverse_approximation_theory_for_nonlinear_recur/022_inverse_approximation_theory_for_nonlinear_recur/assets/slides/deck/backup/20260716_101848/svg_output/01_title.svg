<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MSR Asia · NUS · IFIM</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#FFFFFF" font-weight="800" text-anchor="start">Inverse Approximation Theory for</text><text x="64" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#4C9BE8" font-weight="800" text-anchor="start">Nonlinear Recurrent Neural Networks</text><rect x="64" y="216" width="232" height="30" rx="15" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="180" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="middle">Bernstein-type theorem</text><text x="312" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="600" text-anchor="start">efficient stable approximation forces exponentially decaying memory</text><text x="64" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6E869C" font-weight="500" text-anchor="start">Zhong Li · Shida Wang · Qianxiao Li</text><g id="cue_s01_c1_recurrent_neural_networks_workhorse"><title>recurrent neural networks workhorse sequence yet they famously struggle when</title><rect x="64" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="300" width="274" height="6" rx="6" fill="#4C9BE8"/><circle cx="92" cy="348" r="7" fill="#4C9BE8"/><text x="110" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">RNNs, but memory fades</text><text x="86" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The workhorse for sequence</text><text x="86" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">data, yet RNNs famously</text><text x="86" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">struggle the moment the signal</text><text x="86" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">carries long-term dependencies.</text></g><g id="cue_s01_c2_authors_prove_inverse_bernstein_type"><title>authors prove inverse bernstein-type theorem nonlinear rnns any sequence relationship</title><rect x="356" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="300" width="274" height="6" rx="6" fill="#F2C14E"/><circle cx="384" cy="348" r="7" fill="#F2C14E"/><text x="402" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">An inverse theorem</text><text x="378" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A Bernstein-type result:</text><text x="378" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">whatever an RNN can stably</text><text x="378" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">approximate must have a memory</text><text x="378" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">that decays exponentially in</text><text x="378" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">time.</text></g><g id="cue_s01_c3_other_words_difficulty_not_just"><title>other words difficulty not just optimization artifact fundamental limitation rnn</title><rect x="648" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="300" width="274" height="6" rx="6" fill="#34D3C0"/><circle cx="676" cy="348" r="7" fill="#34D3C0"/><text x="694" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Not just optimization</text><text x="670" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">So the failure is a fundamental</text><text x="670" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">limit of the RNN hypothesis</text><text x="670" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">space, extending the curse of</text><text x="670" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">memory from linear to</text><text x="670" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">nonlinear.</text></g><g id="cue_s01_c4_building_analysis_they_propose_princ"><title>building analysis they propose principled stable reparameterization lets rnns escape</title><rect x="940" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="300" width="274" height="6" rx="6" fill="#48C78E"/><circle cx="968" cy="348" r="7" fill="#48C78E"/><text x="986" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">A principled cure</text><text x="962" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A stable reparameterization of</text><text x="962" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the recurrent weights lets RNNs</text><text x="962" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">escape the limit, confirmed</text><text x="962" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">with numerical experiments.</text></g><line x1="64" y1="570" x2="1216" y2="570" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2305.19190</text><text x="300" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Extends the curse of memory to nonlinear RNNs</text><text x="1216" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="700" text-anchor="end">Stable reparameterization provably relaxes it</text></svg>