<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two directions of approximation theory</text><g id="cue_s03_c1_approximation_theory_offers_two_comp"><title>approximation theory offers two complementary kinds statements forward jackson-type theorems</title><rect x="64" y="152" width="1152" height="92" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="92" rx="6" fill="#34D3C0"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">Forward  ·  Jackson-type theorems</text><text x="92" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">Assume the target is regular, then bound how well the model can approximate it. They tell you what</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">an architecture CAN do.</text></g><g id="cue_s03_c2_inverse_bernstein_type_theorems_run"><title>inverse bernstein-type theorems run other direction they assume target efficiently</title><rect x="64" y="262" width="368" height="200" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="64" y="262" width="368" height="6" rx="6" fill="#F2685C"/><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Inverse  ·  Bernstein-type</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Run the other way: assume the target is</text><text x="92" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">efficiently approximable, then deduce</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">what regularity it MUST have.</text><rect x="92" y="402" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="418.0" r="5" fill="#F2685C"/><text x="126" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">approximable  -&gt;  regularity</text></g><g id="cue_s03_c3_inverse_theorems_precisely_tool_expo"><title>inverse theorems precisely tool exposing fundamental limitations architecture earlier work</title><rect x="456" y="262" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="262" width="368" height="6" rx="6" fill="#F2C14E"/><text x="484" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Exposes hard limits</text><text x="484" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Inverse theorems are the tool for</text><text x="484" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">fundamental limitations. Prior work</text><text x="484" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">proved one for LINEAR RNNs.</text><rect x="484" y="402" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="502" cy="418.0" r="5" fill="#F2C14E"/><text x="518" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">linear: memory decays exp.</text></g><g id="cue_s03_c4_pressing_question_whether_adding_non"><title>pressing question whether adding nonlinearity which greatly increases capacity would</title><rect x="848" y="262" width="368" height="200" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="848" y="262" width="368" height="6" rx="6" fill="#48C78E"/><text x="876" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">The pressing question</text><text x="876" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Nonlinearity greatly increases capacity.</text><text x="876" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Would adding it BREAK this curse of</text><text x="876" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">memory?</text><rect x="876" y="402" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="894" cy="418.0" r="5" fill="#48C78E"/><text x="910" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">does nonlinearity escape it?</text></g><rect x="64" y="486" width="1152" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="92" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">This paper settles it: the curse of memory survives the jump from linear to nonlinear RNNs.</text></svg>