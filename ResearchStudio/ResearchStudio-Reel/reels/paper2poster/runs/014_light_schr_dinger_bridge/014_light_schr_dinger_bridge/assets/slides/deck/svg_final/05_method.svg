<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Minimize a KL you can actually compute</text><g id="cue_s05_c1_lightsb_starts_goal_minimizing_kullb"><title>lightsb starts goal minimizing kullback-leibler divergence between true entropic optimal</title><rect x="64" y="158" width="568" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="196" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Start from a KL objective</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Minimize the KL between the true entropic OT plan and a</text><text x="92" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">parameterized plan. We cannot see the true plan, so</text><text x="92" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">parameterize only the adjusted potential.</text><rect x="92" y="306" width="512" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="333.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">KL( pi* || pi_theta )  -&gt;  min over theta</text></g><g id="cue_s05_c2_authors_choose_unnormalized_gaussian"><title>authors choose unnormalized gaussian mixture potential under choice two things</title><rect x="64" y="370" width="568" height="180" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="370" width="6" height="180" rx="6" fill="#34D3C0"/><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Pick a Gaussian mixture</text><text x="92" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Choose an unnormalized Gaussian mixture for the potential.</text><text x="92" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Then the conditional plan and its normalization become</text><text x="92" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">closed-form.</text><rect x="92" y="506" width="512" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="533.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">v_theta(x1) = sum_k a_k N(x1 | r_k, eps S_k)</text></g><g id="cue_s05_c3_proposition_3_1_rewrites_objective_s"><title>proposition 3.1 rewrites objective simple difference two expectations log normalization</title><rect x="656" y="158" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="196" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Proposition 3.1: a simple loss</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The KL becomes a difference of two expectations:</text><text x="684" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">log-normalization under the source minus log-potential</text><text x="684" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">under the target. Estimate by Monte Carlo, optimize with</text><text x="684" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">plain SGD.</text><rect x="684" y="306" width="504" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="333.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">L = E_p0[ log c_theta ] - E_p1[ log v_theta ]</text></g><g id="cue_s05_c4_min_max_iterative_proportional_fitti"><title>min-max iterative proportional fitting simulation trajectories during once trained same</title><rect x="656" y="370" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="370" width="6" height="180" rx="6" fill="#48C78E"/><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">No min-max, no simulation</text><text x="684" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">No adversarial game, no iterative proportional fitting, no</text><text x="684" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">trajectory simulation during training. The trained</text><text x="684" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">potential yields a closed-form drift.</text><rect x="684" y="506" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="521.0" r="5" fill="#48C78E"/><text x="718" y="527.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">closed-form plan  +  closed-form drift g_theta(x, t)</text></g></svg>