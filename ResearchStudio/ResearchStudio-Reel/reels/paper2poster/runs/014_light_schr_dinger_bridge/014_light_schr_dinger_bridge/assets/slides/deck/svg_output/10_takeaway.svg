and one objective</text><text x="150" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Parameterize the transport potential as a Gaussian mixture and optimize a single,</text><text x="150" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">straightforward objective, no adversarial training or process simulation.</text></g><g id="cue_s10_c3_matches_outperforms_much_heavier_gpu"><title>matches outperforms much heavier gpu-based solvers comes universal-approximation guarantee easy</title><rect x="64" y="394" width="1152" height="98" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="394" width="6" height="98" rx="6" fill="#48C78E"/><circle cx="112" cy="443.0" r="10" fill="#48C78E"/><text x="150" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Matches heavy GPU solvers</text><text x="150" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It matches or outperforms much heavier GPU solvers, carries a universal-approximation guarantee,</text><text x="150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and is easy to use.</text></g><g id="cue_s10_c4_short_lightsb_positioned_simple_reli"><title>short lightsb positioned simple reliable baseline schr dinger bridge field</title><rect x="64" y="506" width="1152" height="98" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="506" width="6" height="98" rx="6" fill="#F2C14E"/><circle cx="112" cy="555.0" r="10" fill="#F2C14E"/><text x="150" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The simple, reliable baseline</text><text x="150" y="576" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">LightSB is positioned to be the go-to Schrödinger Bridge baseline the field has been missing.</text></g><line x1="64" y1="624" x2="1216" y2="624" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="700" text-anchor="start">Light Schrödinger Bridge  ·  ICLR 2024  ·  Korotin, Gushchin &amp; Burnaev</text><text x="1216" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="end">github.com/ngushchin/LightSB</text></svg>