<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Sharper plans, on a CPU, in minutes</text><g id="cue_s07_c1_results_show_both_accuracy_speed"><title>results show both accuracy speed</title><rect x="64" y="150" width="1152" height="48" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="48" rx="6" fill="#48C78E"/><text x="92" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Across the board LightSB delivers both accuracy and speed, without a GPU.</text></g><g id="cue_s07_c2_entropic_optimal_transport_benchmark"><title>entropic optimal transport benchmark where ground truth known lightsb reduces</title><rect x="64" y="212" width="560" height="266" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="212" width="6" height="266" rx="6" fill="#34D3C0"/><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">EOT benchmark error  ·  lower is better</text><text x="92" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">conditional Bures-Wasserstein UVP (%)</text><rect x="300" y="292" width="236" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="292" width="3" height="30" rx="6" fill="#48C78E"/><text x="288" y="313.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">LightSB</text><text x="313" y="313.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">≈0.03–0.62%</text><rect x="300" y="340" width="236" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="340" width="236" height="30" rx="6" fill="#F2685C"/><text x="288" y="361.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">best baseline</text><text x="546" y="361.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">1.04–18.05%</text><rect x="92" y="396" width="504" height="64" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Error well under one percent, often a few hundredths, where the</text><text x="112" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">best prior sits between about one and eighteen.</text></g><g id="cue_s07_c3_msci_single_cell_task_lightsb_reache"><title>msci single-cell task lightsb reaches energy distance comparable strong gpu</title><rect x="656" y="212" width="560" height="266" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="212" width="6" height="266" rx="6" fill="#F2C14E"/><text x="684" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">MSCI single-cell  ·  same accuracy, far faster</text><rect x="684" y="272" width="250" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="809.0" y="328.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">1–2.5 min</text><text x="809.0" y="354.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">LightSB, 4 CPU cores</text><rect x="962" y="272" width="250" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1087.0" y="328.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2685C" font-weight="800" text-anchor="middle">10 min – 1 hr+</text><text x="1087.0" y="354.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">GPU baselines, V100</text><rect x="684" y="388" width="528" height="72" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="704" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Energy distance comparable to strong GPU solvers, but trained on</text><text x="704" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">just four CPU cores.</text></g><g id="cue_s07_c4_ffhq_faces_performs_realistic_male_t"><title>ffhq faces performs realistic male-to-female child-to-adult translation five-hundred-twelve-dimensional latent space</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#B08CE8"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#B08CE8" font-weight="800" text-anchor="start">FFHQ face translation</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Realistic male-to-female and child-to-adult translation in the</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">512-dimensional ALAE latent space, converging in under a minute on</text><text x="92" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">CPU.</text><rect x="760" y="520" width="430" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="778" cy="536.0" r="5" fill="#B08CE8"/><text x="794" y="542.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">male ↔ female   ·   child ↔ adult</text><rect x="760" y="560" width="430" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="778" cy="576.0" r="5" fill="#B08CE8"/><text x="794" y="582.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">512-dim latent   ·   &lt; 1 min on CPU</text></g><text x="64" y="646" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Accurate where it matters, cheap where it counts.</text></svg>