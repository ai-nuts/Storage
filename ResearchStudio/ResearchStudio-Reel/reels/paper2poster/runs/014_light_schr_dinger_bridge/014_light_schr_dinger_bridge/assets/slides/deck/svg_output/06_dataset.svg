<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Four testbeds of rising difficulty</text><g id="cue_s06_c1_solver_tested_across_four_kinds"><title>solver tested across four kinds first two-dimensional gaussian swiss-roll toy</title><rect x="64" y="158" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="176" rx="6" fill="#4C9BE8"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#4C9BE8" font-weight="800" text-anchor="start">1 · Gaussian → Swiss-roll toy</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A two-dimensional toy that visualizes how the noise level</text><text x="92" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">epsilon shapes the bridge trajectories.</text><rect x="92" y="270" width="150" height="44" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><ellipse cx="114" cy="292.0" rx="7" ry="16" fill="#4C9BE8" opacity="0.5"/><ellipse cx="220" cy="292.0" rx="16" ry="10" fill="#F2C14E" opacity="0.4"/><path d="M 114 286.8 Q 167.0 276.0 220 279.0 " fill="none" stroke="#4C9BE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 114 292.0 Q 167.0 289.0 220 292.0 " fill="none" stroke="#4C9BE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 114 297.2 Q 167.0 302.0 220 305.0 " fill="none" stroke="#4C9BE8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="167.0" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle"></text><rect x="260" y="276" width="336" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="278" cy="293.0" r="5" fill="#4C9BE8"/><text x="294" y="299.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">2-D  ·  visualizes epsilon</text></g><g id="cue_s06_c2_second_recent_high_dimensional_entro"><title>second recent high-dimensional entropic optimal transport benchmark known ground-truth plans</title><rect x="656" y="158" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="176" rx="6" fill="#34D3C0"/><text x="684" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#34D3C0" font-weight="800" text-anchor="start">2 · High-dim EOT benchmark</text><text x="684" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A recent benchmark with known ground-truth plans, so</text><text x="684" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">accuracy can be measured exactly.</text><rect x="684" y="276" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="293.0" r="5" fill="#34D3C0"/><text x="718" y="299.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">dims 2 → 128    ·    epsilon = 0.1, 1, 10</text></g><g id="cue_s06_c3_third_msci_single_cell_dataset_kaggl"><title>third msci single-cell dataset kaggle competition cells four human donors</title><rect x="64" y="352" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="352" width="6" height="176" rx="6" fill="#F2C14E"/><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#F2C14E" font-weight="800" text-anchor="start">3 · MSCI single-cell (Kaggle)</text><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Cells from four human donors at four time points,</text><text x="92" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">projected by PCA to increasing dimension.</text><rect x="92" y="470" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="487.0" r="5" fill="#F2C14E"/><text x="126" y="493.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">4 donors · days 2/3/4/7    ·    PCA 50 / 100 / 1000</text></g><g id="cue_s06_c4_fourth_unpaired_image_translation_ff"><title>fourth unpaired image translation ffhq faces performed five-hundred-twelve-dimensional latent space</title><rect x="656" y="352" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="352" width="6" height="176" rx="6" fill="#B08CE8"/><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#B08CE8" font-weight="800" text-anchor="start">4 · FFHQ face translation</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Unpaired image translation on FFHQ faces, run in the</text><text x="684" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">latent space of a pretrained ALAE autoencoder.</text><rect x="684" y="470" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="487.0" r="5" fill="#B08CE8"/><text x="718" y="493.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">512-dim ALAE latent  ·  unpaired faces</text></g></svg>