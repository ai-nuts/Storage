 fill="#6E869C" font-weight="700" text-anchor="middle">closest to a Wiener reference</text><text x="92" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">The dynamic form of entropic optimal transport.</text></g><g id="cue_s02_c2_dynamic_version_entropic_optimal_tra"><title>dynamic version entropic optimal transport underpins applications single-cell biology image</title><rect x="656" y="158" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="120" rx="6" fill="#34D3C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Dynamic entropic optimal transport</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">It underpins real applications across science and vision.</text><rect x="684" y="242" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="257.0" r="5" fill="#34D3C0"/><text x="718" y="263.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">single-cell biology   ·   image translation</text></g><g id="cue_s02_c3_trouble_almost_all_existing_solvers"><title>trouble almost all existing solvers heavy-weighted they parameterize solution several</title><rect x="656" y="290" width="560" height="132" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="290" width="6" height="132" rx="6" fill="#F2685C"/><text x="684" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">The trouble: solvers are heavy</text><text x="684" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Almost all existing solvers stack several large neural</text><text x="684" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">networks and require complex, often adversarial</text><text x="684" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">optimization.</text><text x="684" y="414" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2685C" font-weight="800" text-anchor="start">several networks  +  min-max training  =  slow, fragile</text></g><g id="cue_s02_c4_result_field_lacks_simple_principled"><title>result field lacks simple principled baseline kind go-to method k-means</title><rect x="656" y="434" width="560" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="434" width="6" height="116" rx="6" fill="#F2C14E"/><text x="684" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">A missing baseline</text><text x="684" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The field has no go-to method the way k-means is for</text><text x="684" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">clustering or Sinkhorn is for discrete OT.</text></g></svg>