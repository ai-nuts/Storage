<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One light solver, three results</text><g id="cue_s04_c1_makes_three_contributions_first_intr"><title>makes three contributions first introduces lightsb lightweight solver combines two</title><rect x="64" y="176" width="272" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="88" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">LightSB, a light</text><text x="88" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">solver</text><text x="88" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Combine two ideas:</text><text x="88" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">parameterize the Schrödinger</text><text x="88" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">potential with sum-exp</text><text x="88" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">quadratic (Gaussian mixture)</text><text x="88" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">functions, and view the</text><text x="88" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">log-potential as an energy</text><text x="88" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">function.</text></g><g id="cue_s04_c2_together_these_yield_single_non_mini"><title>together these yield single non-minimax simulation-free optimization objective closed-form expressions</title><rect x="360" y="176" width="272" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="176" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="410" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="384" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">One clean</text><text x="384" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">objective</text><text x="384" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Together they give a single,</text><text x="384" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">non-minimax, simulation-free</text><text x="384" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">objective, with closed-form</text><text x="384" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">expressions for both the plan</text><text x="384" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and the drift.</text></g><g id="cue_s04_c3_second_authors_prove_gaussian_mixtur"><title>second authors prove gaussian-mixture solver universal approximator schr dinger bridges</title><rect x="656" y="176" width="272" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="176" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="706" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="706" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="680" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Universal</text><text x="680" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">approximator</text><text x="680" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Prove the Gaussian-mixture</text><text x="680" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">solver is a universal</text><text x="680" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">approximator of Schrödinger</text><text x="680" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Bridges, the first such</text><text x="680" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">result.</text></g><g id="cue_s04_c4_third_they_analyze_generalization_er"><title>third they analyze generalization error show converges standard parametric rate</title><rect x="952" y="176" width="272" height="380" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="176" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="1002" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">4</text><text x="976" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Generalization</text><text x="976" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">bound</text><text x="976" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Analyze the generalization</text><text x="976" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">error and show it converges</text><text x="976" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">at the standard parametric</text><text x="976" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rate as sample size grows.</text></g><text x="64" y="590" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Fast and simple, yet backed by a universal-approximation guarantee.</text></svg>