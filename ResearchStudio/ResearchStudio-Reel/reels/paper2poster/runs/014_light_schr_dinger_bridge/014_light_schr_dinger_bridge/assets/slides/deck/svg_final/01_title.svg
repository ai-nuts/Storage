<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Skoltech  ·  AIRI</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="162" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">Light Schrödinger Bridge</text><text x="64" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#4C9BE8" font-weight="700" text-anchor="start">A simple, fast, simulation-free Schrödinger Bridge solver</text><text x="64" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Alexander Korotin   ·   Nikita Gushchin   ·   Evgeny Burnaev      —   Skoltech &amp; AIRI</text><g id="cue_s01_c1_schr_dinger_bridges_connect_two"><title>schr dinger bridges connect two probability distributions diffusion process but</title><rect x="64" y="290" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="290" width="6" height="120" rx="6" fill="#4C9BE8"/><text x="92" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Bridges are useful, but heavy</text><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A Schrödinger Bridge links two distributions by diffusion, yet</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">solvers stack neural nets, use adversarial min-max training, and</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">take GPU-hours.</text></g><g id="cue_s01_c2_introduces_lightsb_lightweight_schr"><title>introduces lightsb lightweight schr dinger bridge solver</title><rect x="656" y="290" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="290" width="6" height="120" rx="6" fill="#34D3C0"/><text x="684" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">LightSB</text><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A lightweight Schrödinger Bridge solver, meant to be the simple</text><text x="684" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">go-to baseline the field has lacked.</text></g><g id="cue_s01_c3_parameterizing_schr_dinger_potential"><title>parameterizing schr dinger potential gaussian mixture treating its logarithm energy</title><rect x="64" y="432" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="432" width="6" height="120" rx="6" fill="#F2C14E"/><text x="92" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">One simple objective</text><text x="92" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Parameterize the Schrödinger potential as a Gaussian mixture and</text><text x="92" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">read its log as an energy; the problem becomes a single</text><text x="92" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">non-minimax objective with closed forms.</text></g><g id="cue_s01_c4_result_solves_schr_dinger_bridges"><title>result solves schr dinger bridges moderate dimensions minutes cpu painful</title><rect x="656" y="432" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="432" width="6" height="120" rx="6" fill="#48C78E"/><text x="684" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Minutes on a CPU</text><text x="684" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Solves bridges in moderate dimensions in minutes on a CPU, needs</text><text x="684" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">no painful tuning, and is provably a universal approximator.</text></g><line x1="64" y1="616" x2="1216" y2="616" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2310.01174</text><text x="300" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">A Schrödinger Bridge solver does not have to be heavy.</text><text x="1216" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="end">github.com/ngushchin/LightSB</text></svg>