en the target aligns with its sum-exp Gaussian-mixture inductive bias, while accuracy</text><text x="92" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">holds across dimensions 2–128 and noise levels 0.1–10.</text></g></svg>