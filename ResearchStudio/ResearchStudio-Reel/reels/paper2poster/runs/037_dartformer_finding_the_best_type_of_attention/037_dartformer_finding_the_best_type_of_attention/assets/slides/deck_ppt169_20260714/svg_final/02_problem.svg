<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  
  <text x="72" y="88" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">02 · PROBLEM</text>
  <rect x="72" y="100" width="44" height="4" fill="#2440D9" />

  
  <text x="72" y="156" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">No single efficient attention wins everywhere</text>

  
  <g id="cue_s02_c1_transformer_original_dot_product_att">
    <title>Quadratic cost spawns a family of efficient attention variants</title>
    <desc>transformer original dot-product attention scales quadratically sequence length large family</desc>
    <rect x="72" y="220" width="360" height="392" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1" />
    <text x="104" y="268" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="52" font-weight="700" fill="#2440D9">O(n²)</text>
    <text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="330">Quadratic cost →</text><text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="360">a family of efficient</text><text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="390">variants</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="452">Dot-product attention scales</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="479">O(n²) with sequence length, so</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="506">many efficient alternatives</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="533">appeared: Longformer, Bigbird,</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="560">Performer, Reformer,</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="587">Synthesizer, …</text></g>

  
  <g id="cue_s02_c2_catch_single_one_wins_everywhere">
    <title>But none is best everywhere — the task decides</title>
    <desc>catch single one wins everywhere earlier long-range benchmarking showed best</desc>
    <rect x="460" y="220" width="360" height="392" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1" />
    <text x="492" y="272" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#D8402A">✕</text>
    <text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="330">But none is best</text><text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="360">everywhere</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="416">Long Range Arena benchmarking</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="443">showed the best attention</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="470">depends heavily on the task</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="497">when training from scratch</text><text font-size="19" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="492" y="524">(no pretraining).</text></g>

  
  <g id="cue_s02_c3_leaves_practitioners_awkward_questio">
    <title>The awkward question — which attention, discovered efficiently</title>
    <desc>leaves practitioners awkward question namely how efficiently discover which attention</desc>
    <rect x="848" y="220" width="360" height="392" rx="14" fill="#2440D9" stroke="#2440D9" stroke-width="1" />
    <rect x="848" y="220" width="8" height="392" fill="#14171F" opacity="0.25" />
    <text x="884" y="272" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">?</text>
    <text font-size="24" font-weight="700" fill="#FFFFFF" font-family="Arial, 'Helvetica Neue', sans-serif" x="884" y="330">The awkward</text><text font-size="24" font-weight="700" fill="#FFFFFF" font-family="Arial, 'Helvetica Neue', sans-serif" x="884" y="360">question</text><text font-size="19" fill="#FFFFFF" opacity="0.92" font-family="Arial, 'Helvetica Neue', sans-serif" x="884" y="416">How do you efficiently discover</text><text font-size="19" fill="#FFFFFF" opacity="0.92" font-family="Arial, 'Helvetica Neue', sans-serif" x="884" y="443">the right attention for a given</text><text font-size="19" fill="#FFFFFF" opacity="0.92" font-family="Arial, 'Helvetica Neue', sans-serif" x="884" y="470">long-range task — without</text><text font-size="19" fill="#FFFFFF" opacity="0.92" font-family="Arial, 'Helvetica Neue', sans-serif" x="884" y="497">simply training them all?</text></g>
</svg>