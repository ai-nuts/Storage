<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="ending">
  
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  
  <text x="72" y="84" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">10 · TAKEAWAY</text>
  <rect x="72" y="98" width="44" height="4" fill="#2440D9" />
  <text x="72" y="144" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">A cheap recipe — and a cautionary lesson</text>

  
  <g id="cue_s10_c1_given_task_often_unclear_which">
    <title>The recipe — cheap reliable DARTFormer procedure</title>
    <desc>given task often unclear which attention will best dartformer offers recipe single-layer mixed-attention validation accuracy drop</desc>
    <rect x="72" y="176" width="560" height="456" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1" />
    <text x="104" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="700" fill="#2440D9">The recipe</text>
    <text font-size="22" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="270">
      <tspan>For a given task it's often unclear which</tspan>
      </text><text font-size="22" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="302"><tspan>attention will do best. DARTFormer offers</tspan>
      </text><text font-size="22" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="334"><tspan>a cheap, reliable recipe: train a single-</tspan>
      </text><text font-size="22" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="366"><tspan>layer mixed-attention Transformer and</tspan>
      </text><text font-size="22" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="398"><tspan>rank by masked validation accuracy drop.</tspan>
    </text><rect x="104" y="470" width="424" height="1" fill="#DBDBD6" />
    <text font-size="22" font-weight="700" fill="#D8402A" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="514">
      <tspan>⚠ Very low drop scores warn the pick</tspan>
      </text><text font-size="22" font-weight="700" fill="#D8402A" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="546"><tspan>may be unreliable.</tspan>
    </text></g>

  
  <g id="cue_s10_c2_deeper_lesson_cautionary_one_field">
    <title>The deeper lesson — cautionary for the field</title>
    <desc>deeper lesson cautionary one field</desc>
    <rect x="656" y="176" width="552" height="148" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1" />
    <text x="688" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">THE DEEPER LESSON</text>
    <text font-size="26" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="266">
      <tspan>The deeper lesson is a cautionary</tspan>
      </text><text font-size="26" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="300"><tspan>one for the field.</tspan>
    </text></g>

  
  <g id="cue_s10_c3_combining_diverse_attention_mechanis">
    <title>Closing statement — beats the average, never the best</title>
    <desc>combining diverse attention mechanisms does beat average single choice but never best complementary biases</desc>
    <rect x="656" y="344" width="552" height="288" rx="14" fill="#F5F4F1" stroke="#2440D9" stroke-width="1.5" />
    <text x="688" y="390" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#2440D9">THE FINDING</text>
    <text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="434">
      <tspan>Combining diverse attention</tspan>
      </text><text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="467"><tspan>mechanisms beats the <tspan fill="#2440D9">AVERAGE</tspan> single</tspan>
      </text><text font-size="24" font-weight="700" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="500"><tspan>choice — but <tspan fill="#D8402A">never the BEST one.</tspan></tspan>
    </text><text font-size="20" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="558">
      <tspan>The different attentions don't simply add</tspan>
      </text><text font-size="20" fill="#6E7178" font-family="Arial, 'Helvetica Neue', sans-serif" x="688" y="586"><tspan>complementary biases the way intuition assumes.</tspan>
    </text></g>

  
  <text id="footer" data-pptx-role="footer" x="72" y="658" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">DARTFormer · arXiv:2210.00641 · University of Cambridge · Imperial College London · University of Oxford</text>
</svg>