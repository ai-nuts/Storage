<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Kicker + title -->
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">07 · KEY RESULT</text>
  <rect x="72" y="92" width="44" height="4" fill="#2440D9"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">Beat the <tspan fill="#2440D9">average</tspan> — not the <tspan fill="#D8402A">best</tspan></text>

  <!-- Cue 1: lead card near the title -->
  <g id="cue_s07_c1_headline_finding_splits_two">
    <title>Headline finding splits in two</title>
    <desc>headline finding splits two lead statement</desc>
    <rect x="812" y="60" width="396" height="92" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <rect x="812" y="60" width="6" height="92" rx="3" fill="#2440D9"/>
    <text x="840" y="98" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">The headline finding</text>
    <text x="840" y="128" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">splits in two.</text>
  </g>

  <!-- Cue 2: positive / green column -->
  <g id="cue_s07_c2_positive_side_masked_validation_drop">
    <title>Homogeneous selection works</title>
    <desc>positive side masked-validation-drop search genuinely effective homogeneous selection correctly identifies</desc>
    <rect x="72" y="184" width="548" height="308" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <rect x="72" y="184" width="8" height="308" rx="4" fill="#12805C"/>
    <text x="104" y="234" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#12805C">&#10003; Homogeneous selection works</text>
    <text x="104" y="284" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">The masked-validation-drop search correctly</text>
    <text x="104" y="313" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">identifies the best attention for text</text>
    <text x="104" y="342" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">classification and ListOps — Reformer stands</text>
    <text x="104" y="371" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">out with a drop &#8776; 12 while every other</text>
    <text x="104" y="400" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">attention scores below 0.5.</text>
    <text x="104" y="452" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#12805C">Reformer drop &#8776; 12   ·   others &lt; 0.5</text>
  </g>

  <!-- Cue 3: negative / red column -->
  <g id="cue_s07_c3_negative_side_when_authors_assemble">
    <title>Mixtures never win</title>
    <desc>negative side when authors assemble heterogeneous transformers mix several attention</desc>
    <rect x="660" y="184" width="548" height="308" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <rect x="660" y="184" width="8" height="308" rx="4" fill="#D8402A"/>
    <text x="692" y="234" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#D8402A">&#10007; Mixtures never win</text>
    <text x="692" y="284" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">When the authors assemble heterogeneous</text>
    <text x="692" y="313" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">Transformers that mix several attention</text>
    <text x="692" y="342" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">types, none beats the best single-attention</text>
    <text x="692" y="371" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#14171F">model on any of the three tasks.</text>
    <text x="692" y="452" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#D8402A">0 of 3 tasks improved by mixing</text>
  </g>

  <!-- Cue 4: full-width takeaway banner -->
  <g id="cue_s07_c4_mixing_attention_helps_you_beat">
    <title>Mixing beats the average, not the best</title>
    <desc>mixing attention helps you beat average choice but not best takeaway</desc>
    <rect x="72" y="516" width="1136" height="120" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="640" y="566" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#14171F">Mixing attention helps you beat the <tspan fill="#2440D9">AVERAGE</tspan> choice —</text>
    <text x="640" y="604" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#14171F">but not the <tspan fill="#D8402A">BEST</tspan> one.</text>
  </g>
</svg>
