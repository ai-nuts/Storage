<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Kicker + rule + title -->
  <text x="72" y="84" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#6E7178" letter-spacing="2">04 · CONTRIBUTIONS</text>
  <rect x="72" y="96" width="44" height="4" fill="#2440D9"/>
  <text x="72" y="146" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">Three contributions</text>

  <!-- ============ Left column: four cue cards ============ -->

  <!-- Card 1: lead "3 contributions" -->
  <g id="cue_s04_c1_makes_three_contributions">
    <title>Makes three contributions</title>
    <desc>makes three contributions</desc>
    <rect x="72" y="188" width="800" height="86" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="112" y="256" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="62" font-weight="700" fill="#2440D9">3</text>
    <text x="176" y="228" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">contributions</text>
    <text x="176" y="254" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">This paper makes three, in sequence.</text>
  </g>

  <!-- Card 2: DARTFormer -->
  <g id="cue_s04_c2_first_proposes_dartformer_differenti">
    <title>First proposes DARTFormer</title>
    <desc>first proposes dartformer differentiable-architecture-search-style method efficiently finds best attention task</desc>
    <rect x="72" y="286" width="800" height="94" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="100" y="326" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#2440D9">①</text>
    <text x="140" y="322" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">DARTFormer — a DARTS-style search</text>
    <text x="140" y="352" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">Differentiable architecture search that efficiently finds</text>
    <text x="140" y="374" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">the best attention for a task.</text>
  </g>

  <!-- Card 3: heterogeneous Transformers -->
  <g id="cue_s04_c3_second_extends_framework_build_searc">
    <title>Second extends to heterogeneous Transformers</title>
    <desc>second extends framework build search heterogeneous transformers combine multiple attention</desc>
    <rect x="72" y="392" width="800" height="118" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="100" y="432" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#2440D9">②</text>
    <text x="140" y="428" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">Extends it to heterogeneous Transformers</text>
    <text x="140" y="458" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">Build &amp; search multi-attention models that combine several</text>
    <text x="140" y="480" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">attention types — via NAS Prune (expensive iterative pruning)</text>
    <text x="140" y="502" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">and NAS One-shot (cheap single pass).</text>
  </g>

  <!-- Card 4: negative result (red accent) -->
  <g id="cue_s04_c4_third_most_importantly_shows_empiric">
    <title>Third empirically shows they cannot outperform</title>
    <desc>third most importantly shows empirically these heterogeneous transformers cannot outperform</desc>
    <rect x="72" y="522" width="800" height="118" rx="14" fill="#F5F4F1" stroke="#D8402A" stroke-width="1.5"/>
    <rect x="72" y="522" width="6" height="118" rx="3" fill="#D8402A"/>
    <text x="100" y="562" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" font-weight="700" fill="#D8402A">③</text>
    <text x="140" y="558" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#D8402A">Most importantly — a negative result</text>
    <text x="140" y="588" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">Empirically, these heterogeneous Transformers CANNOT beat</text>
    <text x="140" y="610" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">the best homogeneous Transformer on the long-range NLP</text>
    <text x="140" y="632" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">tasks studied.</text>
  </g>

  <!-- ============ Right side: supporting figure ============ -->
  <g id="fig_mha_search_space">
    <image x="925" y="188" width="250" height="423" xlink:href="../images/page10_figure4.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="925" y="632" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">Fig. 4 — multi-head attention search space</text>
  </g>
</svg>
