<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  
  <text x="72" y="92" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">03 · MOTIVATION</text>
  <rect x="72" y="104" width="44" height="4" fill="#2440D9" />

  
  <text x="72" y="164" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">Could a mixture of attentions be optimal?</text>

  
  <g id="cue_s03_c1_long_standing_intuition_attention_he">
    <title>Heads specialize — long-standing intuition</title>
    <desc>long-standing intuition attention head specialize learning different kind relationship much</desc>
    <rect x="72" y="256" width="352" height="356" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1" />
    <text x="104" y="312" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#6E7178">01</text>
    <text x="104" y="352" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="700" fill="#14171F">Heads specialize</text>
    <text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="404">
      <tspan>A long-standing intuition:</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="438"><tspan>each attention head learns a</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="472"><tspan>different kind of relationship</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="506"><tspan>— much as convolutional</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="540"><tspan>kernels learn different</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="104" y="574"><tspan>features.</tspan>
    </text></g>

  
  <g id="cue_s03_c2_true_transformer_mixing_several_atte">
    <title>So mixing could be richer</title>
    <desc>true transformer mixing several attention types could learn richer set</desc>
    <rect x="464" y="256" width="352" height="356" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1" />
    <text x="496" y="312" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#6E7178">02</text>
    <text x="496" y="352" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="700" fill="#14171F">Mixing is richer</text>
    <text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="496" y="404">
      <tspan>If that holds, a Transformer</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="496" y="438"><tspan>mixing several attention types</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="496" y="472"><tspan>could learn a richer set of</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="496" y="506"><tspan>relations and outperform any</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="496" y="540"><tspan>single-attention model.</tspan>
    </text></g>

  
  <g id="cue_s03_c3_takes_intuition_seriously_asks_direc">
    <title>The direct question</title>
    <desc>takes intuition seriously asks directly whether optimal attention task actually</desc>
    <rect x="856" y="256" width="352" height="356" rx="14" fill="#F5F4F1" stroke="#2440D9" stroke-width="2" />
    <rect x="856" y="256" width="6" height="356" rx="3" fill="#2440D9" />
    <text x="888" y="312" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#2440D9">03</text>
    <text x="888" y="352" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="700" fill="#2440D9">The direct question</text>
    <text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="888" y="404">
      <tspan>This paper takes that intuition</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="888" y="438"><tspan>seriously and asks directly:</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="888" y="472"><tspan>is the optimal attention for a</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="888" y="506"><tspan>task actually a mixture —</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="888" y="540"><tspan>rather than assuming the</tspan>
      </text><text font-size="24" fill="#14171F" font-family="Arial, 'Helvetica Neue', sans-serif" x="888" y="574"><tspan>answer?</tspan>
    </text></g>
</svg>