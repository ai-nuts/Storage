<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Kicker + rule + title -->
  <text x="72" y="74" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">08 · ABLATION</text>
  <rect x="72" y="86" width="44" height="4" fill="#2440D9"/>
  <text x="72" y="134" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">The cheap search is <tspan fill="#2440D9">good enough</tspan></text>

  <!-- LEFT COLUMN: three cue cards -->

  <!-- Cue 1: lead card -->
  <g id="cue_s08_c1_useful_practical_takeaway_comes_comp">
    <title>Useful practical takeaway comes from comparing two search procedures</title>
    <desc>useful practical takeaway comes comparing two heterogeneous search procedures</desc>
    <rect x="72" y="178" width="540" height="110" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="96" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">A practical takeaway comes from comparing</text>
    <text x="96" y="254" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">the two heterogeneous search procedures.</text>
  </g>

  <!-- Cue 2: NAS Prune expensive -->
  <g id="cue_s08_c2_expensive_nas_prune_method_which">
    <title>Expensive NAS Prune method repeatedly removes worst block and fine-tunes</title>
    <desc>expensive nas prune method which repeatedly removes worst block fine-tunes no consistent advantage</desc>
    <rect x="72" y="304" width="540" height="196" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="96" y="342" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#D8402A">NAS PRUNE (EXPENSIVE)</text>
    <text x="96" y="374" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">Repeatedly remove the worst block and fine-</text>
    <text x="96" y="402" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">tune. It offers NO consistent advantage over</text>
    <text x="96" y="430" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">NAS One-shot, the cheap single-pass top-</text>
    <text x="96" y="458" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">scoring selection, when good attentions are</text>
    <text x="96" y="486" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">correctly identified.</text>
  </g>

  <!-- Cue 3: tilting mixture -->
  <g id="cue_s08_c3_attempts_tilt_mixture_toward_stronge">
    <title>Attempts to tilt the mixture toward strongest attentions or give them more heads</title>
    <desc>attempts tilt mixture toward strongest attentions give them more heads failed consistent gains</desc>
    <rect x="72" y="516" width="540" height="148" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="96" y="554" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">Tilting the mixture toward the strongest</text>
    <text x="96" y="582" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">attentions, or giving them more heads, also</text>
    <text x="96" y="610" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">failed to give consistent gains, reinforcing</text>
    <text x="96" y="638" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" fill="#14171F">that the cheap method is <tspan font-weight="700" fill="#12805C">good enough</tspan>.</text>
  </g>

  <!-- RIGHT COLUMN: supporting figure (not a cue group) -->
  <g id="fig_nas_prune">
    <rect x="656" y="178" width="552" height="486" rx="14" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <image x="672" y="198" width="520" height="388" xlink:href="../images/page9_figure3.png" preserveAspectRatio="xMidYMid meet"/>
    <text x="932" y="618" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">Fig. 3 — NAS Prune removes the worst block,</text>
    <text x="932" y="642" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">worst-first.</text>
  </g>
</svg>
