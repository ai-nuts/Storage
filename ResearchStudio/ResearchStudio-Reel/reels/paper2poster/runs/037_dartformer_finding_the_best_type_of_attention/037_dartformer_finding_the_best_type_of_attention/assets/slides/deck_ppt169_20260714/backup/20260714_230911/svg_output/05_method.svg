<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <!-- background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- header -->
  <text x="72" y="72" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">05 · METHOD</text>
  <rect x="72" y="82" width="44" height="4" fill="#2440D9"/>
  <text x="72" y="120" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">Supernetwork + <tspan fill="#2440D9">masked-validation-drop</tspan></text>

  <!-- c1: supernetwork figure across the top -->
  <g id="cue_s05_c1_dartformer_builds_single_layer_super">
    <title>DARTFormer single-layer supernetwork holds one candidate block per efficient attention</title>
    <desc>dartformer builds single-layer supernetwork holds one candidate block every efficient attention in parallel figure one</desc>
    <rect x="270" y="132" width="740" height="322" rx="14" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <image xlink:href="../images/page2_figure1.png" x="290" y="139" width="700" height="308" preserveAspectRatio="xMidYMid meet"/>
    <text x="640" y="474" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">Single-layer supernetwork: one candidate block per efficient attention, in parallel (Fig. 1).</text>
  </g>

  <!-- c2: fixed-alpha averaging -->
  <g id="cue_s05_c2_borrowing_fixed_alpha_trick_differen">
    <title>Fixed-alpha averaging trick from differentiable architecture search, no learned softmax</title>
    <desc>borrowing fixed-alpha trick differentiable architecture search does not learn softmax edge weights average outputs</desc>
    <rect x="72" y="490" width="362" height="170" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="94" y="518" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#2440D9">Fixed-α averaging</text>
    <image xlink:href="../images/formula_avg.png" x="94" y="526" width="100" height="54" preserveAspectRatio="xMidYMid meet"/>
    <text x="94" y="600" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13.5" fill="#14171F">
      <tspan x="94" dy="0">Simply AVERAGE candidate outputs, no</tspan>
      <tspan x="94" dy="16">learned softmax edge weights, no bi-level</tspan>
      <tspan x="94" dy="16">optimization → supernetwork trains</tspan>
      <tspan x="94" dy="16">straight to convergence.</tspan>
    </text>
  </g>

  <!-- c3: masked validation-accuracy drop score -->
  <g id="cue_s05_c3_rank_attentions_masked_validation_ac">
    <title>Rank attentions by masked validation-accuracy drop metric</title>
    <desc>rank attentions masked validation accuracy drop metric mask out one block biggest drop best</desc>
    <rect x="458" y="490" width="362" height="170" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="480" y="518" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#2440D9">Masked-drop score</text>
    <image xlink:href="../images/formula_score.png" x="480" y="528" width="318" height="47" preserveAspectRatio="xMidYMid meet"/>
    <text x="480" y="600" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13.5" fill="#14171F">
      <tspan x="480" dy="0">Score = masked validation-accuracy drop:</tspan>
      <tspan x="480" dy="16">mask a block, measure how far val-</tspan>
      <tspan x="480" dy="16">accuracy falls; the biggest drop =</tspan>
      <tspan x="480" dy="16">the best attention.</tspan>
    </text>
  </g>

  <!-- c4: pick or prune to build the model -->
  <g id="cue_s05_c4_homogeneous_models_top_scoring_block">
    <title>Homogeneous take top-scoring block, heterogeneous prune worst-first or stack top-4</title>
    <desc>homogeneous models top-scoring block chosen heterogeneous ones blocks either pruned fine-tuning stack transformer</desc>
    <rect x="844" y="490" width="362" height="170" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="866" y="518" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#2440D9">Build the model</text>
    <text x="866" y="552" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13.5" fill="#14171F">
      <tspan x="866" dy="0"><tspan font-weight="700" fill="#12805C">Homogeneous →</tspan> take the top-scoring</tspan>
      <tspan x="866" dy="17">block.</tspan>
      <tspan x="866" dy="20"><tspan font-weight="700" fill="#2440D9">Heterogeneous →</tspan> prune worst-first with</tspan>
      <tspan x="866" dy="17">fine-tuning, or take the top-4 and stack</tspan>
      <tspan x="866" dy="17">into a full Transformer.</tspan>
    </text>
  </g>
</svg>
