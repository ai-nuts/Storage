<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Kicker + rule -->
  <text x="72" y="88" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">02 · PROBLEM</text>
  <rect x="72" y="100" width="44" height="4" fill="#2440D9"/>

  <!-- Title -->
  <text x="72" y="156" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">No single efficient attention wins everywhere</text>

  <!-- Card 1 -->
  <g id="cue_s02_c1_transformer_original_dot_product_att">
    <title>Quadratic cost spawns a family of efficient attention variants</title>
    <desc>transformer original dot-product attention scales quadratically sequence length large family</desc>
    <rect x="72" y="220" width="360" height="392" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="104" y="268" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="52" font-weight="700" fill="#2440D9">O(n²)</text>
    <text x="104" y="330" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F"><tspan x="104" dy="0">Quadratic cost →</tspan><tspan x="104" dy="30">a family of efficient</tspan><tspan x="104" dy="30">variants</tspan></text>
    <text x="104" y="452" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#6E7178"><tspan x="104" dy="0">Dot-product attention scales</tspan><tspan x="104" dy="27">O(n²) with sequence length, so</tspan><tspan x="104" dy="27">many efficient alternatives</tspan><tspan x="104" dy="27">appeared: Longformer, Bigbird,</tspan><tspan x="104" dy="27">Performer, Reformer,</tspan><tspan x="104" dy="27">Synthesizer, …</tspan></text>
  </g>

  <!-- Card 2 -->
  <g id="cue_s02_c2_catch_single_one_wins_everywhere">
    <title>But none is best everywhere — the task decides</title>
    <desc>catch single one wins everywhere earlier long-range benchmarking showed best</desc>
    <rect x="460" y="220" width="360" height="392" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="492" y="272" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#D8402A">✕</text>
    <text x="492" y="330" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F"><tspan x="492" dy="0">But none is best</tspan><tspan x="492" dy="30">everywhere</tspan></text>
    <text x="492" y="416" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#6E7178"><tspan x="492" dy="0">Long Range Arena benchmarking</tspan><tspan x="492" dy="27">showed the best attention</tspan><tspan x="492" dy="27">depends heavily on the task</tspan><tspan x="492" dy="27">when training from scratch</tspan><tspan x="492" dy="27">(no pretraining).</tspan></text>
  </g>

  <!-- Card 3 — driving question, indigo -->
  <g id="cue_s02_c3_leaves_practitioners_awkward_questio">
    <title>The awkward question — which attention, discovered efficiently</title>
    <desc>leaves practitioners awkward question namely how efficiently discover which attention</desc>
    <rect x="848" y="220" width="360" height="392" rx="14" fill="#2440D9" stroke="#2440D9" stroke-width="1"/>
    <rect x="848" y="220" width="8" height="392" fill="#14171F" opacity="0.25"/>
    <text x="884" y="272" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">?</text>
    <text x="884" y="330" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF"><tspan x="884" dy="0">The awkward</tspan><tspan x="884" dy="30">question</tspan></text>
    <text x="884" y="416" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#FFFFFF" opacity="0.92"><tspan x="884" dy="0">How do you efficiently discover</tspan><tspan x="884" dy="27">the right attention for a given</tspan><tspan x="884" dy="27">long-range task — without</tspan><tspan x="884" dy="27">simply training them all?</tspan></text>
  </g>
</svg>
