<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="cover">
  <!-- background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- thin left accent rule (decorative, no cue) -->
  <rect x="72" y="96" width="4" height="470" fill="#2440D9"/>

  <!-- kicker -->
  <text x="100" y="112" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">PAPER EXPLAINER · arXiv:2210.00641</text>

  <!-- display title -->
  <text x="98" y="214" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="72" font-weight="700" fill="#2440D9">DARTFormer</text>

  <!-- subtitle -->
  <text x="100" y="266" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="700" fill="#14171F">Finding the Best Type of Attention</text>

  <!-- one-line hook -->
  <text x="100" y="322" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" fill="#6E7178">Search for the best attention, and test whether</text>
  <text x="100" y="356" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="28" fill="#6E7178">mixing several is even better.</text>

  <!-- authors + institutes (lower-left) -->
  <text x="100" y="600" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#14171F">Jason Ross Brown¹ · Yiren Zhao²¹ · Ilia Shumailov³ · Robert D. Mullins¹</text>
  <text x="100" y="628" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">¹University of Cambridge    ²Imperial College London    ³University of Oxford</text>

  <!-- right-side section header -->
  <text x="704" y="196" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">INSIDE THIS PAPER</text>
  <rect x="704" y="208" width="44" height="4" fill="#2440D9"/>

  <!-- 2x2 chip grid -->
  <g id="cue_s01_c1_how_you_pick_right_attention">
    <title>The question: which attention for a long-range task, could mixing help</title>
    <desc>how you pick right attention mechanism long-range transformer task could</desc>
    <rect x="704" y="230" width="244" height="168" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="722" y="266" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#2440D9">01</text>
    <text x="722" y="300" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">The question: which</text>
    <text x="722" y="324" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">attention for a long-range</text>
    <text x="722" y="348" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">task? Could mixing help?</text>
  </g>

  <g id="cue_s01_c2_dartformer_adapts_differentiable_neu">
    <title>DARTFormer adapts differentiable neural architecture search</title>
    <desc>dartformer adapts differentiable neural architecture search answer both questions</desc>
    <rect x="960" y="230" width="244" height="168" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="978" y="266" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#2440D9">02</text>
    <text x="978" y="300" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">DARTFormer =</text>
    <text x="978" y="324" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">differentiable NAS,</text>
    <text x="978" y="348" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">applied to attention.</text>
  </g>

  <g id="cue_s01_c3_authors_build_supernetwork_contains">
    <title>Authors build a supernetwork of many efficient attentions in parallel</title>
    <desc>authors build supernetwork contains many efficient attention types parallel masked</desc>
    <rect x="704" y="420" width="244" height="168" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="722" y="456" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#2440D9">03</text>
    <text x="722" y="486" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">A supernetwork of many</text>
    <text x="722" y="510" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">efficient attentions in</text>
    <text x="722" y="534" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">parallel, ranked by</text>
    <text x="722" y="558" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">masked-validation-drop.</text>
  </g>

  <g id="cue_s01_c4_their_search_reliably_finds_best">
    <title>Their search reliably finds the best single attention for a task</title>
    <desc>their search reliably finds best single attention task but surprising</desc>
    <rect x="960" y="420" width="244" height="168" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="978" y="456" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#2440D9">04</text>
    <text x="978" y="486" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">Finds the best single</text>
    <text x="978" y="510" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">attention; mixing beats</text>
    <text x="978" y="534" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">the average, never</text>
    <text x="978" y="558" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F">the best.</text>
