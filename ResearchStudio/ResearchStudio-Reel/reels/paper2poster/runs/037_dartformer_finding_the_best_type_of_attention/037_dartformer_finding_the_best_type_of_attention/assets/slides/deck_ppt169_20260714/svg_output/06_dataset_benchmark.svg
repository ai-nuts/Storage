<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <!-- background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- kicker -->
  <text x="72" y="82" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">06 · DATA &amp; SEARCH SPACE</text>
  <rect x="72" y="94" width="44" height="4" fill="#2440D9"/>

  <!-- title -->
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">Three <tspan fill="#2440D9">LRA tasks</tspan> · nine candidate attentions</text>

  <!-- CUE 1: lead card -->
  <g id="cue_s06_c1_all_experiments_run_three_tasks">
    <title>All experiments run three Long Range Arena tasks</title>
    <desc>all experiments run three tasks drawn long range arena benchmark stress long sequence modeling</desc>
    <rect x="72" y="162" width="1136" height="78" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <rect x="72" y="162" width="6" height="78" rx="3" fill="#2440D9"/>
    <text x="104" y="196" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" fill="#14171F">All experiments use <tspan font-weight="700">three tasks from the Long Range Arena (LRA)</tspan> benchmark —</text>
    <text x="104" y="224" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" fill="#14171F">chosen to stress long-sequence modeling.</text>
  </g>

  <!-- CUE 2: three task chips -->
  <g id="cue_s06_c2_these_byte_level_binary_text_classif">
    <title>Three LRA task chips with sequence lengths</title>
    <desc>these byte-level binary text classification imdb sequences one thousand tokens listops document matching sequence length</desc>

    <!-- chip 1: IMDb -->
    <rect x="72" y="262" width="360" height="118" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="96" y="298" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">IMDb</text>
    <text x="96" y="322" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">byte-level binary</text>
    <text x="96" y="342" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">text classification</text>
    <text x="408" y="358" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#2440D9">1k</text>
    <text x="408" y="322" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">tokens</text>

    <!-- chip 2: ListOps -->
    <rect x="460" y="262" width="360" height="118" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="484" y="298" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">ListOps</text>
    <text x="484" y="322" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">10-way</text>
    <text x="484" y="342" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">classification</text>
    <text x="796" y="358" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#2440D9">2k</text>
    <text x="796" y="322" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">tokens</text>

    <!-- chip 3: Document matching -->
    <rect x="848" y="262" width="360" height="118" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="872" y="298" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">Document matching</text>
    <text x="872" y="322" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">byte-level</text>
    <text x="872" y="342" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#6E7178">document retrieval</text>
    <text x="1184" y="358" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#2440D9">4k</text>
    <text x="1184" y="322" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">tokens</text>
  </g>

  <!-- CUE 3: 3x3 grid of nine attention mechanisms -->
  <g id="cue_s06_c3_search_considers_nine_candidate_atte">
    <title>Nine candidate attention mechanisms in the search space</title>
    <desc>search considers nine candidate attention mechanisms including bigbird linear transformer linformer local longformer performer reformer sparse synthesizer</desc>
    <rect x="72" y="402" width="1136" height="242" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="96" y="436" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#14171F">NINE CANDIDATE ATTENTION MECHANISMS</text>

    <!-- row 1 -->
    <rect x="96" y="452" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="116" y="482" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Bigbird</text>
    <rect x="464" y="452" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="484" y="482" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Linear Transformer</text>
    <rect x="832" y="452" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="852" y="482" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Linformer</text>

    <!-- row 2 -->
    <rect x="96" y="510" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="116" y="540" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Local</text>
    <rect x="464" y="510" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="484" y="540" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Longformer</text>
    <rect x="832" y="510" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="852" y="540" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Performer</text>

    <!-- row 3 -->
    <rect x="96" y="568" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="116" y="598" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Reformer</text>
    <rect x="464" y="568" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="484" y="598" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Sparse Transformer</text>
    <rect x="832" y="568" width="352" height="48" rx="10" fill="#FFFFFF" stroke="#DBDBD6" stroke-width="1"/>
    <text x="852" y="598" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#14171F">Synthesizer</text>

    <!-- note -->
    <text x="96" y="634" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#6E7178">Hyperparameters largely follow the original LRA setup.</text>
  </g>
</svg>
