    <text x="100" y="228" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">ListOps — selection signal</text>
    <text x="100" y="336" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="96" font-weight="700" fill="#2440D9">11.85</text>
    <text x="100" y="376" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">Reformer masked-validation-drop score</text>
    <text x="100" y="426" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#14171F"><tspan x="100" dy="0">vs &lt; 0.5 for every other attention —</tspan><tspan x="100" dy="26">a strikingly clean signal.</tspan></text>
  </g>

  <!-- c2: Document matching stat card -->
  <g id="cue_s09_c2_document_matching_best_homogeneous_s">
    <title>Document matching (4k) — Synthesizer 71.1%</title>
