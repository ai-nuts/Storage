    <rect x="460" y="188" width="360" height="284" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <text x="488" y="228" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#14171F">Document matching (4k)</text>
    <text x="488" y="336" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="96" font-weight="700" fill="#2440D9">71.1%</text>
    <text x="488" y="376" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178">Synthesizer — best homogeneous</text>
    <text x="488" y="426" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#6E7178"><tspan x="488" dy="0">NAS Prune 67.0%  ·  NAS One-shot 64.7%</tspan><tspan x="488" dy="26">(heterogeneous trails)</tspan></text>
  </g>

  <!-- c3: Text classification stat card -->
  <g id="cue_s09_c3_text_classification_best_homogeneous">
