<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Kicker + rule + title -->
  <text x="72" y="84" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#6E7178">09 · HEADLINE NUMBERS</text>
  <rect x="72" y="96" width="44" height="4" fill="#2440D9"/>
  <text x="72" y="146" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="44" font-weight="700" fill="#14171F">The pattern is <tspan fill="#2440D9">consistent</tspan></text>

  <!-- c1: ListOps stat card -->
  <g id="cue_s09_c1_put_concrete_numbers_listops_reforme">
    <title>ListOps — Reformer masked-validation-drop score 11.85</title>
