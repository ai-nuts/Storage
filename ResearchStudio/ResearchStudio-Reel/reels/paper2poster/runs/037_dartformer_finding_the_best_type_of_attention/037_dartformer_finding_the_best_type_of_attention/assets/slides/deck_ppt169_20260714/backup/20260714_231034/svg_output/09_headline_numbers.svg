    <rect x="72" y="500" width="1136" height="104" rx="14" fill="#F5F4F1" stroke="#DBDBD6" stroke-width="1"/>
    <rect x="72" y="500" width="6" height="104" rx="3" fill="#2440D9"/>
    <text x="112" y="546" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#14171F">Across 9 attention mechanisms and 3 tasks — the pattern is consistent:</text>
