<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">Ablation: the right amount of diversity</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">DISTINCT TABLES SAMPLED PER ITERATION</text>
  </g>

  <g id="cue_s07_c1_four_acquisition_functions_effective">
    <desc>the four acquisition functions effectively ablate the role of diversity the right amount matters enormously</desc>
    <rect x="60" y="156" width="430" height="196" rx="12" fill="#16324F"/>
    <rect x="60" y="156" width="6" height="196" rx="3" fill="#1F9E8F"/>
    <text x="86" y="190" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#5FB0A6" letter-spacing="1.5">THE ABLATION</text>
    <text x="86" y="228" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#FFFFFF">Four functions =</text>
    <text x="86" y="258" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#FFFFFF">a diversity dial</text>
    <text x="86" y="298" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#CBD5E1">The methods differ mainly in how much</text>
    <text x="86" y="320" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#CBD5E1">diversity they force — and the right</text>
    <text x="86" y="342" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#CBD5E1">amount matters enormously.</text>
  </g>

  <g id="cue_s07_c2_badge_built_in_batch_diversity_helps">
    <desc>BADGE built-in batch diversity helps but MNLP-plus forced maximum table diversity hurts falling below even random sampling</desc>
    <rect x="60" y="368" width="430" height="170" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="368" width="6" height="170" rx="3" fill="#1F9E8F"/>
    <text x="86" y="400" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">HELPS vs. HURTS</text>
    <text x="86" y="434" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">· <tspan font-weight="700" fill="#2E9E5B">BADGE</tspan>'s built-in batch diversity helps.</text>
    <text x="86" y="466" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">· <tspan font-weight="700" fill="#9B59B6">MNLP+</tspan>'s forced maximum diversity</text>
    <text x="108" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">hurts — dropping below random.</text>
  </g>

  <g id="cue_s07_c3_tracking_how_many_distinct_tables">
    <desc>tracking how many distinct tables each method draws from MNLP fixates few tables MNLP-plus spreads across maximum BADGE strikes balance middle</desc>
    <rect x="520" y="156" width="696" height="382" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="546" y="190" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">TABLES DRAWN FROM · PER ITERATION</text>

    <line x1="560" y1="470" x2="1180" y2="470" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="546" y="230" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">many</text>
    <text x="546" y="466" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">few</text>

    <g id="bar-mnlp">
      <rect x="600" y="378" width="130" height="92" fill="#3B7DD8"/>
      <text x="665" y="360" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" font-weight="700" fill="#16324F">MNLP</text>
      <text x="665" y="494" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568">fixates on a few</text>
    </g>
    <g id="bar-badge">
      <rect x="805" y="300" width="130" height="170" fill="#2E9E5B"/>
      <rect x="805" y="300" width="130" height="170" fill="none" stroke="#16324F" stroke-width="2"/>
      <text x="870" y="360" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" font-weight="700" fill="#FFFFFF">BADGE</text>
      <text x="870" y="494" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2E9E5B">balanced ✓</text>
    </g>
    <g id="bar-mnlpplus">
      <rect x="1010" y="210" width="130" height="260" fill="#9B59B6"/>
      <text x="1075" y="360" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="15" font-weight="700" fill="#FFFFFF">MNLP+</text>
      <text x="1075" y="494" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568">spreads too far</text>
    </g>
    <text x="870" y="286" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#16324F">sweet spot</text>
  </g>

  <g id="cue_s07_c4_goal_isn_maximum_diversity_but">
    <desc>the goal is not maximum diversity but a careful trade-off between diversity and per-cell uncertainty</desc>
    <rect x="60" y="556" width="1156" height="112" rx="12" fill="#E7F4F1" stroke="#5FB0A6" stroke-width="1"/>
    <rect x="60" y="556" width="6" height="112" rx="3" fill="#2E9E5B"/>
    <text x="92" y="592" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">THE LESSON</text>
    <text x="92" y="628" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#16324F">Not maximum diversity — a careful trade-off with per-cell uncertainty.</text>
    <text x="92" y="656" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">BADGE sits in the middle of the dial, and that is exactly why it wins.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">07</text>
  </g>
</svg>
