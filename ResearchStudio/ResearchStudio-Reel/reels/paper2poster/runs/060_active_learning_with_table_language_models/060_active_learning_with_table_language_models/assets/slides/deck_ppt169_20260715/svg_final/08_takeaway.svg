<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">Takeaway: balance beats maximizing</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">WHAT TO REMEMBER — AND WHAT IS STILL OPEN</text>
  </g>

  <g id="cue_s08_c1_lasting_message_active_learning_real">
    <desc>lasting message active learning really can slash the expert-labeling cost of tabular language models only if diversity handled with care</desc>
    <rect x="60" y="150" width="1156" height="132" rx="12" fill="#16324F"/>
    <rect x="60" y="150" width="6" height="132" rx="3" fill="#1F9E8F"/>
    <text x="92" y="188" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#5FB0A6" letter-spacing="2">THE LASTING MESSAGE</text>
    <text x="92" y="228" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="28" font-weight="700" fill="#FFFFFF">Active learning can slash the expert-labeling cost of tabular</text>
    <text x="92" y="262" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="28" font-weight="700" fill="#FFFFFF">language models — but only if diversity is handled with care.</text>
  </g>

  <g id="cue_s08_c2_cell_level_acquisition_built_in_batc">
    <desc>cell-level acquisition with built-in batch diversity like BADGE reaches full-training performance using a fraction of the labels</desc>
    <rect x="60" y="298" width="566" height="196" rx="12" fill="#E7F4F1" stroke="#2E9E5B" stroke-width="2"/>
    <rect x="60" y="298" width="6" height="196" rx="3" fill="#2E9E5B"/>
    <text x="90" y="332" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#2E9E5B" letter-spacing="1.5">WHAT WORKS</text>
    <text x="90" y="368" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">Cell-level + batch diversity</text>
    <text x="90" y="408" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">BADGE reaches full-training F1 with only</text>
    <text x="90" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">a fraction of the labels — while bluntly</text>
    <text x="90" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">maximizing table diversity backfires.</text>
  </g>

  <g id="cue_s08_c3_balance_diversity_against_uncertaint">
    <desc>balance diversity against uncertainty rather than maximize either alone the winning recipe</desc>
    <rect x="650" y="298" width="566" height="196" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="650" y="298" width="6" height="196" rx="3" fill="#1F9E8F"/>
    <text x="680" y="332" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">THE RECIPE</text>
    <text x="680" y="368" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">Balance, don't maximize</text>
    <text x="680" y="408" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">Trade diversity off against per-cell</text>
    <text x="680" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">uncertainty, rather than pushing either</text>
    <text x="680" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">one to its extreme.</text>
  </g>

  <g id="cue_s08_c4_first_work_flags_two_frontiers">
    <desc>as the first work on this problem flags two open frontiers computational cost of table-diverse acquisition annotator cognitive load</desc>
    <rect x="60" y="510" width="1156" height="158" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="90" y="544" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#E08A1E" letter-spacing="1.5">FIRST WORK HERE · TWO OPEN FRONTIERS</text>
    <g transform="translate(90,560)">
      <rect x="0" y="0" width="540" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="#E08A1E"/>
      <text x="26" y="36" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="19" font-weight="700" fill="#16324F">1 · Acquisition compute cost</text>
      <text x="26" y="66" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">Table-diverse selection is computationally heavy.</text>
    </g>
    <g transform="translate(646,560)">
      <rect x="0" y="0" width="540" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="6" height="88" rx="3" fill="#E08A1E"/>
      <text x="26" y="36" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="19" font-weight="700" fill="#16324F">2 · Annotator cognitive load</text>
      <text x="26" y="66" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">Every new table demands fresh human interpretation.</text>
    </g>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva · arXiv:2211.04128</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">08</text>
  </g>
</svg>
