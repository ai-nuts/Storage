<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">Method: a table-aware model in an AL loop</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">TABULAR LM · IO DECODER · POOL-BASED ACQUISITION</text>
  </g>

  <g id="pipeline-label">
    <text x="60" y="150" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">THE PIPELINE</text>
  </g>

  <g id="cue_s04_c1_tabular_language_transformer_encoder">
    <desc>tabular language model transformer encoder swaps vanilla attention row-column visibility matrix within-cell positional encoding whole table aware</desc>
    <rect x="60" y="162" width="556" height="132" rx="12" fill="#16324F"/>
    <text x="84" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#5FB0A6" letter-spacing="1.5">ENCODER · TABULAR LANGUAGE MODEL</text>
    <text x="84" y="228" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-weight="700" fill="#FFFFFF">Row–column visibility attention</text>
    <text x="84" y="256" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#CBD5E1">Replaces vanilla attention with a row/column mask and</text>
    <text x="84" y="278" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#CBD5E1">within-cell positions — every token sees the whole table.</text>
  </g>

  <g id="arrow1">
    <line x1="338" y1="294" x2="338" y2="316" stroke="#94A3B8" stroke-width="2"/>
    <path d="M 332 310 L 338 320 L 344 310 Z" fill="#94A3B8"/>
  </g>

  <g id="cue_s04_c2_decoder_tags_token_over_four">
    <desc>classification decoder tags each token IO tags over four entity types equipment tags equipment names physical quantities units of measurement</desc>
    <rect x="60" y="322" width="556" height="120" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="322" width="6" height="120" rx="3" fill="#1F9E8F"/>
    <text x="84" y="352" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">DECODER · IO TOKEN TAGGING</text>
    <text x="84" y="382" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" font-weight="700" fill="#16324F">Four entity types</text>
    <g transform="translate(84,398)">
      <rect x="0" y="0" width="118" height="30" rx="5" fill="none" stroke="#E08A1E" stroke-width="2"/>
      <text x="59" y="20" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#16324F">EQ tag</text>
      <rect x="128" y="0" width="118" height="30" rx="5" fill="none" stroke="#2E9E5B" stroke-width="2"/>
      <text x="187" y="20" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#16324F">EQ name</text>
      <rect x="256" y="0" width="118" height="30" rx="5" fill="none" stroke="#3B7DD8" stroke-width="2"/>
      <text x="315" y="20" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#16324F">Quantity</text>
      <rect x="384" y="0" width="118" height="30" rx="5" fill="none" stroke="#9B59B6" stroke-width="2"/>
      <text x="443" y="20" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#16324F">Unit</text>
    </g>
  </g>

  <g id="arrow2">
    <line x1="338" y1="442" x2="338" y2="464" stroke="#94A3B8" stroke-width="2"/>
    <path d="M 332 458 L 338 468 L 344 458 Z" fill="#94A3B8"/>
  </g>

  <g id="cue_s04_c3_top_sits_pool_based_active_learning">
    <desc>on top sits pool-based active learning repeatedly picks batch most informative cells expert oracle to label</desc>
    <rect x="60" y="470" width="556" height="120" rx="12" fill="#E7F4F1" stroke="#5FB0A6" stroke-width="1"/>
    <rect x="60" y="470" width="6" height="120" rx="3" fill="#2E9E5B"/>
    <text x="84" y="500" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">POOL-BASED ACTIVE LEARNING</text>
    <text x="84" y="532" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" font-weight="700" fill="#16324F">Pick the most informative cells</text>
    <text x="84" y="562" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">Each round, an acquisition function selects a batch of cells</text>
    <text x="84" y="582" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">for the expert oracle to label, then the model retrains.</text>
  </g>

  <g id="cue_s04_c4_four_acquisition_functions_compete_m">
    <desc>four acquisition functions compete MNLP normalized log-probability uncertainty MNLP-plus round-robin table diversity BADGE gradient embeddings k-means Rand uniform</desc>
    <rect x="650" y="162" width="566" height="428" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="674" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">FOUR ACQUISITION FUNCTIONS COMPETE</text>

    <g id="fn-mnlp" transform="translate(674,214)">
      <rect x="0" y="0" width="260" height="176" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#3B7DD8"/>
      <rect x="0" y="20" width="260" height="20" fill="#3B7DD8"/>
      <text x="16" y="27" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">MNLP</text>
      <text x="16" y="72" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#16324F">Uncertainty</text>
      <text x="16" y="100" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">Score cells by normalized</text>
      <text x="16" y="122" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">log-probability — pick the</text>
      <text x="16" y="144" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">least confident cells.</text>
    </g>

    <g id="fn-mnlpplus" transform="translate(942,214)">
      <rect x="0" y="0" width="260" height="176" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#9B59B6"/>
      <rect x="0" y="20" width="260" height="20" fill="#9B59B6"/>
      <text x="16" y="27" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">MNLP+</text>
      <text x="16" y="72" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#16324F">Forced diversity</text>
      <text x="16" y="100" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">MNLP plus a round-robin</text>
      <text x="16" y="122" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">across tables to maximize</text>
      <text x="16" y="144" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">table diversity.</text>
    </g>

    <g id="fn-badge" transform="translate(674,404)">
      <rect x="0" y="0" width="260" height="170" rx="10" fill="#FFFFFF" stroke="#2E9E5B" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#2E9E5B"/>
      <rect x="0" y="20" width="260" height="20" fill="#2E9E5B"/>
      <text x="16" y="27" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">BADGE</text>
      <text x="16" y="72" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#16324F">Uncertain + diverse</text>
      <text x="16" y="100" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">k-means++ on per-cell</text>
      <text x="16" y="122" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">gradient embeddings for a</text>
      <text x="16" y="144" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">balanced batch.</text>
    </g>

    <g id="fn-rand" transform="translate(942,404)">
      <rect x="0" y="0" width="260" height="170" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#E23B3B"/>
      <rect x="0" y="20" width="260" height="20" fill="#E23B3B"/>
      <text x="16" y="27" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#FFFFFF">Rand</text>
      <text x="16" y="72" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#16324F">Baseline</text>
      <text x="16" y="100" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">Sample cells uniformly</text>
      <text x="16" y="122" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">at random — the control</text>
      <text x="16" y="144" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#1A202C">to beat.</text>
    </g>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">04</text>
  </g>
</svg>
