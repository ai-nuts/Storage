<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">A real industrial dataset — and it is sparse</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">EXPERT-ANNOTATED PLANT SPREADSHEETS</text>
  </g>

  <g id="figure1">
    <rect x="60" y="150" width="624" height="470" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <image href="../images/figure1_overview.png" x="80" y="168" width="584" height="386" preserveAspectRatio="xMidYMid meet"/>
    <text x="80" y="586" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#16324F">Figure 1 · Sub-cell NER over a plant table</text>
    <text x="80" y="606" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#4A5568">Color-coded spans feed the table NER model; an oracle labels the chosen cells.</text>
  </g>

  <g id="cue_s05_c1_evaluation_real_industrial_dataset_n">
    <desc>evaluation uses a real industrial dataset not an academic benchmark</desc>
    <rect x="704" y="150" width="516" height="80" rx="10" fill="#16324F"/>
    <rect x="704" y="150" width="6" height="80" rx="3" fill="#1F9E8F"/>
    <text x="732" y="184" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#5FB0A6" letter-spacing="1.5">THE DATA</text>
    <text x="732" y="212" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-weight="700" fill="#FFFFFF">Real plants, not an academic benchmark</text>
  </g>

  <g id="cue_s05_c2_spreadsheets_several_plants_downsamp">
    <desc>spreadsheets several plants downsampled at most five rows expert annotators labeled every cell prodigy span-based annotation tool</desc>
    <rect x="704" y="244" width="516" height="122" rx="10" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="704" y="244" width="6" height="122" rx="3" fill="#1F9E8F"/>
    <text x="732" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">ANNOTATION</text>
    <text x="732" y="306" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">Spreadsheets from several plants,</text>
    <text x="732" y="330" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">downsampled to at most five rows each,</text>
    <text x="732" y="354" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">labeled cell-by-cell with the Prodigy tool.</text>
  </g>

  <g id="cue_s05_c3_random_split_gives_55_tables">
    <desc>random train test split gives 55 tables for training and 24 for testing</desc>
    <rect x="704" y="380" width="250" height="240" rx="10" fill="#E7F4F1" stroke="#5FB0A6" stroke-width="1"/>
    <text x="732" y="412" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">THE SPLIT</text>
    <text x="732" y="480" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="52" font-weight="800" fill="#16324F">55</text>
    <text x="732" y="506" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">training tables</text>
    <text x="732" y="560" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="40" font-weight="800" fill="#1F9E8F">24</text>
    <text x="732" y="586" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">test tables</text>
  </g>

  <g id="cue_s05_c4_set_holds_4_774_cells">
    <desc>training set holds 4774 cells but only about 1100 entity labels just 0.23 labels per cell 77 percent of cells empty extreme class imbalance</desc>
    <rect x="970" y="380" width="250" height="240" rx="10" fill="#FBEEEC" stroke="#E7B6AE" stroke-width="1"/>
    <text x="998" y="412" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#C0392B" letter-spacing="1.5">EXTREME SPARSITY</text>
    <text x="998" y="452" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="30" font-weight="800" fill="#16324F">4,774 cells</text>
    <text x="998" y="480" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">≈ 1,100 entity labels</text>
    <text x="998" y="524" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="30" font-weight="800" fill="#C0392B">0.23</text>
    <text x="998" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">labels per cell</text>
    <text x="998" y="592" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#C0392B">77% of cells are empty</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">05</text>
  </g>
</svg>
