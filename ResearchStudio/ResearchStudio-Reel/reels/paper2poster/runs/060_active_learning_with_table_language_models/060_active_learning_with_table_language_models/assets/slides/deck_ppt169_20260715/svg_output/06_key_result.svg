<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">Key result: BADGE beats the full-data ceiling</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">FIGURE 2 · MICRO-F1 PER ITERATION, AVERAGED OVER 5 SEEDS</text>
  </g>

  <g id="figure2">
    <rect x="60" y="150" width="686" height="470" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <image href="../images/figure2_f1_curve.png" x="78" y="166" width="650" height="422" preserveAspectRatio="xMidYMid meet"/>
    <text x="78" y="608" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#4A5568">Green = BADGE · Blue = MNLP · Red = Rand · Purple = MNLP+ · Orange dashed = full-training ceiling</text>
  </g>

  <g id="cue_s06_c1_performance_micro_averaged_1_held_ou">
    <desc>performance micro-averaged F1 on held-out test set across active learning iterations x axis labels</desc>
    <rect x="766" y="150" width="454" height="78" rx="10" fill="#16324F"/>
    <rect x="766" y="150" width="6" height="78" rx="3" fill="#1F9E8F"/>
    <text x="792" y="182" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#5FB0A6" letter-spacing="1.5">HOW TO READ IT</text>
    <text x="792" y="210" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#FFFFFF">Micro-F1 on held-out tables vs. labels spent.</text>
  </g>

  <g id="cue_s06_c2_badge_standout_beats_random_selectio">
    <desc>BADGE standout beats random selection even surpasses ceiling full dataset far fewer labels best method</desc>
    <rect x="766" y="242" width="454" height="130" rx="10" fill="#E7F4F1" stroke="#2E9E5B" stroke-width="2"/>
    <rect x="766" y="242" width="6" height="130" rx="3" fill="#2E9E5B"/>
    <text x="792" y="272" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#2E9E5B" letter-spacing="1.5">WINNER · BADGE</text>
    <text x="792" y="302" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" font-weight="700" fill="#16324F">Passes the full-data ceiling</text>
    <text x="792" y="332" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">Beats random and even the full-training</text>
    <text x="792" y="356" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">F1 — using far fewer labels.</text>
  </g>

  <g id="cue_s06_c3_pure_uncertainty_sampling_mnlp_disap">
    <desc>pure uncertainty sampling MNLP disappoints edging past random only after around 500 labels noticeably higher variance</desc>
    <rect x="766" y="386" width="454" height="106" rx="10" fill="#F4F6F9" stroke="#3B7DD8" stroke-width="1.5"/>
    <rect x="766" y="386" width="6" height="106" rx="3" fill="#3B7DD8"/>
    <text x="792" y="416" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#3B7DD8" letter-spacing="1.5">MNLP · UNCERTAINTY ONLY</text>
    <text x="792" y="446" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">Only edges past random after ~500 labels,</text>
    <text x="792" y="470" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">with noticeably higher variance.</text>
  </g>

  <g id="cue_s06_c4_most_striking_mnlp_plus_which_forces">
    <desc>most striking MNLP-plus which forces maximum table diversity is the worst of all pushing diversity too hard hurts</desc>
    <rect x="766" y="506" width="454" height="114" rx="10" fill="#FBEEEC" stroke="#9B59B6" stroke-width="1.5"/>
    <rect x="766" y="506" width="6" height="114" rx="3" fill="#9B59B6"/>
    <text x="792" y="536" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#9B59B6" letter-spacing="1.5">MNLP+ · FORCED DIVERSITY</text>
    <text x="792" y="566" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" font-weight="700" fill="#C0392B">Worst of all</text>
    <text x="792" y="596" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">Maximizing table diversity drops it below</text>
    <text x="792" y="616" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">even random sampling.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">06</text>
  </g>
</svg>
