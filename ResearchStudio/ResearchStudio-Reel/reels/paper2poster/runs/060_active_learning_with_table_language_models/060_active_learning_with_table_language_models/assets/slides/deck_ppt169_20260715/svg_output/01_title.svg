  </g>

  <g id="cue_s01_c1_tabular_language_models_could_unlock">
    <desc>tabular language models could unlock spreadsheets industrial companies labeled data experts annotate</desc>
    <line x1="82" y1="352" x2="182" y2="352" stroke="#16324F" stroke-width="2"/>
    <text x="80" y="392" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-style="italic" fill="#1A202C">Reading the mountains of industrial spreadsheets —</text>
    <text x="80" y="420" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-style="italic" fill="#1A202C">without paying for a mountain of expert labels.</text>
  </g>

  <g id="cue_s01_c2_presented_neurips_2022_ringsquandl_k">
    <desc>presented neurips 2022 ringsquandl koleva siemens lmu munich authors</desc>
    <rect x="80" y="452" width="6" height="52" fill="#1F9E8F"/>
    <text x="102" y="476" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="700" fill="#16324F">Martin Ringsquandl · Aneta Koleva</text>
    <text x="102" y="500" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#4A5568">Siemens AG · LMU Munich</text>
  </g>

  <g id="cue_s01_c3_their_headline_finding_batch_diverse">
    <desc>headline finding batch-diverse gradient method BADGE full-training performance fewer labels maximum diversity hurts</desc>
    <rect x="80" y="556" width="740" height="96" rx="10" fill="#E7F4F1" stroke="#5FB0A6" stroke-width="1"/>
    <rect x="80" y="556" width="6" height="96" rx="3" fill="#2E9E5B"/>
    <text x="104" y="586" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">HEADLINE FINDING</text>
    <text x="104" y="614" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C"><tspan font-weight="700" fill="#2E9E5B">BADGE</tspan> matches full-training F1 with far fewer labels —</text>
    <text x="104" y="638" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">while forcing <tspan font-weight="700" fill="#C0392B">maximum table diversity</tspan> actually hurts.</text>
  </g>

