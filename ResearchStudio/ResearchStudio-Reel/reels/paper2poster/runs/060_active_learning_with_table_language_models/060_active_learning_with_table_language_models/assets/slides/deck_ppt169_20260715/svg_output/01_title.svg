    <text x="80" y="142" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="500" fill="#4A5568" letter-spacing="1.5">TABLE REPRESENTATION LEARNING WORKSHOP · NeurIPS 2022 · arXiv:2211.04128</text>
