<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">Why active learning — and why it is hard here</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">SPEND EVERY ANNOTATION WHERE IT COUNTS</text>
  </g>

  <g id="cue_s03_c1_active_learning_built_setting_plenti">
    <desc>active learning built for setting plentiful unlabeled data expensive labels squeeze most performance every annotation</desc>
    <rect x="60" y="156" width="372" height="330" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="98" cy="200" r="18" fill="#E7F4F1"/>
    <text x="98" y="206" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#1F9E8F">1</text>
    <text x="130" y="206" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">THE RIGHT FIT</text>
    <text x="88" y="252" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">Plenty of data,</text>
    <text x="88" y="282" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">costly labels</text>
    <text x="88" y="330" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">Active learning is built for</text>
    <text x="88" y="356" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">exactly this: squeeze the most</text>
    <text x="88" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">model performance out of</text>
    <text x="88" y="408" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">every single annotation.</text>
  </g>

  <g id="cue_s03_c2_but_big_transformer_models_learn">
    <desc>but big transformer models cannot learn one example at a time train batches several epochs acquisition function whole batch</desc>
    <rect x="452" y="156" width="372" height="330" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="490" cy="200" r="18" fill="#E7F4F1"/>
    <text x="490" y="206" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#1F9E8F">2</text>
    <text x="522" y="206" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">BATCH MODE</text>
    <text x="480" y="252" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">Pick a whole</text>
    <text x="480" y="282" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">batch at once</text>
    <text x="480" y="330" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">Big transformers can't learn</text>
    <text x="480" y="356" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">one example at a time. They</text>
    <text x="480" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">train in batches over epochs,</text>
    <text x="480" y="408" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">so acquisition is batch-level.</text>
  </g>

  <g id="cue_s03_c3_pure_uncertainty_sampling_grabs_very">
    <desc>pure uncertainty sampling grabs very similar correlated cells same table same row wasting annotation budget</desc>
    <rect x="844" y="156" width="372" height="330" rx="12" fill="#FBEEEC" stroke="#E7B6AE" stroke-width="1"/>
    <circle cx="882" cy="200" r="18" fill="#F6D9D4"/>
    <text x="882" y="206" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#C0392B">!</text>
    <text x="914" y="206" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#C0392B" letter-spacing="1.5">THE PITFALL</text>
    <text x="872" y="252" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">Correlated</text>
    <text x="872" y="282" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" font-weight="700" fill="#16324F">picks waste budget</text>
    <text x="872" y="330" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">Pure uncertainty sampling</text>
    <text x="872" y="356" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">grabs near-identical cells —</text>
    <text x="872" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">often from the same table —</text>
    <text x="872" y="408" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">burning the annotation budget.</text>
  </g>

  <g id="cue_s03_c4_yet_one_had_studied_active">
    <desc>yet no one had studied active learning together with tabular language models the research gap this work fills</desc>
    <rect x="60" y="516" width="1156" height="152" rx="12" fill="#16324F"/>
    <rect x="60" y="516" width="6" height="152" rx="3" fill="#1F9E8F"/>
    <text x="92" y="556" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#5FB0A6" letter-spacing="2">THE GAP THIS WORK FILLS</text>
    <text x="92" y="600" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="27" font-weight="700" fill="#FFFFFF">No one had studied active learning together with tabular language models.</text>
    <text x="92" y="636" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#CBD5E1">Despite the obvious fit, the pairing was unexplored — this paper is the first to close it.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">03</text>
  </g>
</svg>
