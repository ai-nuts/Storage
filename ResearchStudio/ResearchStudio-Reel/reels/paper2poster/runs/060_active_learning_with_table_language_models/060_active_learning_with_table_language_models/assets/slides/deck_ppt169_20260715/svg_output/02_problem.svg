<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/>
    <text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#16324F">The problem: cheap tables, expensive labels</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#4A5568" letter-spacing="1.5">EXTRACTING STRUCTURE FROM INDUSTRIAL SPREADSHEETS</text>
  </g>

  <g id="cue_s02_c1_industry_runs_spreadsheets">
    <desc>industry runs on spreadsheets loosely structured tables everywhere in plants</desc>
    <rect x="60" y="152" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="152" width="6" height="216" rx="3" fill="#16324F"/>
    <text x="90" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">THE SETTING</text>
    <text x="90" y="234" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="27" font-weight="700" fill="#16324F">Industry runs on spreadsheets</text>
    <text x="90" y="278" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Plant records live in loosely structured</text>
    <text x="90" y="304" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">tables — the raw material for automation,</text>
    <text x="90" y="330" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">if a model can read them.</text>
  </g>

  <g id="cue_s02_c2_operators_track_equipment_sensors_ve">
    <desc>operators track equipment sensors vessels loosely structured tables fine-tuning tabular language models labeled examples</desc>
    <rect x="650" y="152" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="650" y="152" width="6" height="216" rx="3" fill="#1F9E8F"/>
    <text x="680" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">WHAT IS TRACKED</text>
    <text x="680" y="234" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="27" font-weight="700" fill="#16324F">Equipment · sensors · vessels</text>
    <text x="680" y="278" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Reading them automatically means</text>
    <text x="680" y="304" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">fine-tuning tabular language models</text>
    <text x="680" y="330" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">on labeled examples.</text>
  </g>

  <g id="cue_s02_c3_but_these_tables_highly_technical">
    <desc>but these tables highly technical domain-specific language few experts annotate labeling expensive prohibitive</desc>
    <rect x="60" y="392" width="570" height="216" rx="12" fill="#FBEEEC" stroke="#E7B6AE" stroke-width="1"/>
    <rect x="60" y="392" width="6" height="216" rx="3" fill="#C0392B"/>
    <text x="90" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#C0392B" letter-spacing="1.5">THE CATCH · COST</text>
    <text x="90" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="27" font-weight="700" fill="#16324F">Only experts can annotate</text>
    <text x="90" y="518" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Highly technical, domain-specific</text>
    <text x="90" y="544" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">language means a handful of experts —</text>
    <text x="90" y="570" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">so labeling gets expensive fast.</text>
  </g>

  <g id="cue_s02_c4_frames_sub_cell_named_entity_recogni">
    <desc>frames sub-cell named entity recognition genuinely new active learning problem each cell multiple token-level labels</desc>
    <rect x="650" y="392" width="570" height="216" rx="12" fill="#E7F4F1" stroke="#5FB0A6" stroke-width="1"/>
    <rect x="650" y="392" width="6" height="216" rx="3" fill="#2E9E5B"/>
    <text x="680" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#1F9E8F" letter-spacing="1.5">A NEW KIND OF PROBLEM</text>
    <text x="680" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="27" font-weight="700" fill="#16324F">Sub-cell NER</text>
    <text x="680" y="518" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">A genuinely new active-learning problem:</text>
    <text x="680" y="544" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">each table holds many cells, and each cell</text>
    <text x="680" y="570" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">carries several token-level labels at once.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">Active Learning with Tabular Language Models · Ringsquandl &amp; Koleva</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">02</text>
  </g>
</svg>
