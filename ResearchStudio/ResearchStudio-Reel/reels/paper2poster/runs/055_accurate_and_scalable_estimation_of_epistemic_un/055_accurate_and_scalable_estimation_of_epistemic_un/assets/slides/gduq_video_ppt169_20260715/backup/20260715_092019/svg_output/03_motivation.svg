<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">03 · MOTIVATION</text>
    <text x="80" y="120" font-size="34" font-weight="bold" fill="#12172A">More expressive models do not calibrate better</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s03_c1_common_expectation_adopting_more_adv">
    <title>common expectation adopting more advanced expressive architectures inherently improve calibration</title>
    <desc>There is a common expectation that adopting more advanced or expressive architectures will inherently improve calibration.</desc>
    <rect x="80" y="176" width="360" height="252" rx="12" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <rect x="80" y="176" width="6" height="252" rx="3" fill="#E4572E"/>
    <text x="108" y="214" font-size="14" font-weight="bold" letter-spacing="1" fill="#C4562F">THE COMMON ASSUMPTION</text>
    <text x="108" y="252" font-size="19" font-weight="bold" fill="#12172A">"Bigger, fancier models</text>
    <text x="108" y="278" font-size="19" font-weight="bold" fill="#12172A">will be better calibrated."</text>
    <text x="108" y="318" font-size="15" fill="#5A6675">The intuition: graph transformers,</text>
    <text x="108" y="340" font-size="15" fill="#5A6675">positional encodings, and more</text>
    <text x="108" y="362" font-size="15" fill="#5A6675">depth or width should tighten</text>
    <text x="108" y="384" font-size="15" fill="#5A6675">confidence — for free.</text>
    <text x="108" y="416" font-size="15" font-weight="bold" fill="#E4572E">The paper tests this directly.</text>
  </g>

  <g id="cue_s03_c2_through_controlled_case_study_struct">
    <title>through controlled case study structural distortion benchmark demonstrate expectation false graph transformers positional encodings do not improve calibration vanilla message-passing increasing model size worse</title>
    <desc>Through a controlled case study on a structural distortion benchmark, the authors demonstrate this expectation is false: graph transformers and positional encodings do not meaningfully improve calibration over vanilla message-passing networks, and increasing model size can even make calibration worse.</desc>
    <rect x="460" y="176" width="740" height="252" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <text x="488" y="206" font-size="14" font-weight="bold" letter-spacing="1" fill="#5A6675">CONTROLLED CASE STUDY: STRUCTURAL DISTORTION  (Figure 1)</text>
    <rect x="486" y="220" width="688" height="150" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <image xlink:href="../images/figure1.png" x="492" y="226" width="676" height="138" preserveAspectRatio="xMidYMid meet"/>
    <text x="488" y="398" font-size="15" fill="#5A6675">As rotation grows, accuracy drops as expected — but expected calibration error grows sharply too. Transformers (GPS),</text>
    <text x="488" y="418" font-size="15" fill="#5A6675">deeper and wider models do not fix it; only G-&#916;UQ cuts ECE while keeping accuracy close to the vanilla model.</text>
  </g>

  <g id="cue_s03_c3_finding_motivates_different_path">
    <title>finding motivates different path</title>
    <desc>This finding motivates a different path.</desc>
    <rect x="80" y="448" width="360" height="196" rx="12" fill="#12172A"/>
    <text x="108" y="490" font-size="14" font-weight="bold" letter-spacing="1" fill="#7CA0EC">SO WHAT NOW?</text>
    <text x="108" y="530" font-size="22" font-weight="bold" fill="#FFFFFF">Expressivity is not</text>
    <text x="108" y="558" font-size="22" font-weight="bold" fill="#FFFFFF">the answer.</text>
    <text x="108" y="600" font-size="15" fill="#C7CFDA">This finding motivates a different</text>
    <text x="108" y="622" font-size="15" fill="#C7CFDA">path to trustworthy confidence.</text>
  </g>

  <g id="cue_s03_c4_rather_chasing_expressivity_advocate">
    <title>rather chasing expressivity paper advocates epistemic uncertainty quantification directly modulate confidence indicators</title>
    <desc>Rather than chasing expressivity, the paper advocates for epistemic uncertainty quantification to directly modulate confidence indicators.</desc>
    <rect x="460" y="448" width="740" height="196" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="460" y="448" width="6" height="196" rx="3" fill="#0E9E8F"/>
    <text x="488" y="490" font-size="14" font-weight="bold" letter-spacing="1" fill="#0E9E8F">THE PROPOSED DIRECTION</text>
    <text x="488" y="528" font-size="21" font-weight="bold" fill="#12172A">Model epistemic uncertainty directly</text>
    <text x="488" y="566" font-size="16" fill="#5A6675">Instead of chasing more expressive architectures, use epistemic uncertainty</text>
    <text x="488" y="588" font-size="16" fill="#5A6675">quantification to directly modulate the confidence indicators the model reports —</text>
    <text x="488" y="610" font-size="16" fill="#5A6675">so calibration improves without redesigning the backbone.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-&#916;UQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">03 / 10</text>
  </g>
</svg>
