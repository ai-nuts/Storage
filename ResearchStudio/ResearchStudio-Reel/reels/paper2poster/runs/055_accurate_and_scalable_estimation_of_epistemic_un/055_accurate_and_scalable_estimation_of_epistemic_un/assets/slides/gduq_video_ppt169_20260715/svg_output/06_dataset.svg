<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">06 · DATASET / BENCHMARK</text>
    <text x="80" y="120" font-size="34" font-weight="bold" fill="#12172A">A deliberately broad evaluation</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s06_c1_evaluation_deliberately_broad_struct">
    <title>evaluation deliberately broad structural shift authors build rotated super-pixel mnist benchmark increasing rotation induces controlled distortion</title>
    <desc>The evaluation is deliberately broad. For structural shift, the authors build a Rotated Super-pixel MNIST benchmark where increasing rotation induces controlled distortion.</desc>
    <rect x="80" y="176" width="360" height="290" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="176" width="6" height="290" rx="3" fill="#2453D6"/>
    <text x="108" y="212" font-size="14" font-weight="bold" letter-spacing="1" fill="#2453D6">SHIFT 1 · STRUCTURAL</text>
    <text x="108" y="248" font-size="19" font-weight="bold" fill="#12172A">Rotated Super-pixel</text>
    <text x="108" y="274" font-size="19" font-weight="bold" fill="#12172A">MNIST</text>
    <text x="108" y="312" font-size="15" fill="#5A6675">A controlled benchmark the</text>
    <text x="108" y="334" font-size="15" fill="#5A6675">authors build: super-pixel k-NN</text>
    <text x="108" y="356" font-size="15" fill="#5A6675">graphs from rotated MNIST digits.</text>
    <text x="108" y="398" font-size="15" fill="#5A6675">Increasing the rotation angle</text>
    <text x="108" y="420" font-size="15" fill="#5A6675">induces a controlled, escalating</text>
    <text x="108" y="442" font-size="15" fill="#5A6675">structural distortion shift.</text>
  </g>

  <g id="cue_s06_c2_size_shift_they_standard_graph">
    <title>size shift they use standard graph classification datasets D and D NCI1 NCI109 PROTEINS GCN GIN PNA backbones</title>
    <desc>For size shift, they use standard graph classification datasets including D and D, NCI1, NCI109, and PROTEINS with GCN, GIN, and PNA backbones.</desc>
    <rect x="460" y="176" width="360" height="290" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="460" y="176" width="6" height="290" rx="3" fill="#0E9E8F"/>
    <text x="488" y="212" font-size="14" font-weight="bold" letter-spacing="1" fill="#0E9E8F">SHIFT 2 · GRAPH SIZE</text>
    <text x="488" y="248" font-size="19" font-weight="bold" fill="#12172A">Standard graph</text>
    <text x="488" y="274" font-size="19" font-weight="bold" fill="#12172A">classification sets</text>
    <text x="488" y="312" font-size="15" fill="#5A6675">Train on small graphs, test on</text>
    <text x="488" y="334" font-size="15" fill="#5A6675">larger ones. Datasets:</text>
    <text x="500" y="366" font-size="15" font-weight="bold" fill="#12172A">D&amp;D · NCI1 · NCI109 · PROTEINS</text>
    <text x="488" y="404" font-size="15" fill="#5A6675">Evaluated across three GNN</text>
    <text x="488" y="426" font-size="15" fill="#5A6675">backbones:</text>
    <text x="500" y="452" font-size="15" font-weight="bold" fill="#12172A">GCN · GIN · PNA</text>
  </g>

  <g id="cue_s06_c3_concept_covariate_shifts_they_good">
    <title>concept covariate shifts they use good benchmark suite covering colored mnist motif sst2 datasets</title>
    <desc>For concept and covariate shifts, they use the GOOD benchmark suite covering colored MNIST, motif, and SST2 datasets.</desc>
    <rect x="840" y="176" width="360" height="290" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="840" y="176" width="6" height="290" rx="3" fill="#E4572E"/>
    <text x="868" y="212" font-size="14" font-weight="bold" letter-spacing="1" fill="#C4562F">SHIFT 3 · CONCEPT &amp; COVARIATE</text>
    <text x="868" y="248" font-size="19" font-weight="bold" fill="#12172A">The GOOD</text>
    <text x="868" y="274" font-size="19" font-weight="bold" fill="#12172A">benchmark suite</text>
    <text x="868" y="312" font-size="15" fill="#5A6675">A dedicated suite for graph</text>
    <text x="868" y="334" font-size="15" fill="#5A6675">out-of-distribution shifts, with</text>
    <text x="868" y="356" font-size="15" fill="#5A6675">both concept and covariate splits.</text>
    <text x="868" y="398" font-size="15" fill="#5A6675">Datasets used:</text>
    <text x="880" y="430" font-size="15" font-weight="bold" fill="#12172A">•  Colored MNIST</text>
    <text x="880" y="452" font-size="15" font-weight="bold" fill="#12172A">•  Motif   ·   SST2</text>
  </g>

  <g id="cue_s06_c4_across_all_these_they_compare">
    <title>across all these they compare against strong uncertainty baselines deep ensembles temperature scaling monte carlo dropout measuring calibration error out-of-distribution detection auroc generalization gap mean absolute error</title>
    <desc>Across all of these they compare against strong uncertainty baselines including deep ensembles, temperature scaling, and Monte Carlo dropout, measuring calibration error, out-of-distribution detection AUROC, and generalization gap mean absolute error.</desc>
    <rect x="80" y="486" width="1120" height="158" rx="12" fill="#F3F5FA"/>
    <text x="108" y="522" font-size="14" font-weight="bold" letter-spacing="1" fill="#5A6675">COMPARED AGAINST STRONG BASELINES — MEASURED ON THREE SAFETY METRICS</text>
    <rect x="108" y="540" width="330" height="80" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="128" y="570" font-size="15" font-weight="bold" fill="#12172A">Baselines</text>
    <text x="128" y="596" font-size="14" fill="#5A6675">Deep Ensembles · Temp. Scaling · MC Dropout</text>
    <rect x="458" y="540" width="330" height="80" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="478" y="570" font-size="15" font-weight="bold" fill="#12172A">Metrics</text>
    <text x="478" y="596" font-size="14" fill="#5A6675">Calibration ECE · OOD AUROC · Gen-gap MAE</text>
    <rect x="808" y="540" width="372" height="80" rx="8" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <text x="828" y="570" font-size="15" font-weight="bold" fill="#2453D6">Coverage</text>
    <text x="828" y="596" font-size="14" fill="#5A6675">3 shift types × 3 downstream safety tasks</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-&#916;UQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">06 / 10</text>
  </g>
</svg>
