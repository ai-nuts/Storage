<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- header / kicker -->
  <g id="deco_header">
    <rect x="80" y="82" width="46" height="4" fill="#2453D6"/>
    <text x="138" y="90" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">ICLR 2024  ·  GRAPH UNCERTAINTY</text>
  </g>

  <!-- logos top-right -->
  <g id="deco_logos">
    <image xlink:href="../images/logo_umich.png" x="900" y="70" width="150" height="30" preserveAspectRatio="xMidYMid meet"/>
    <image xlink:href="../images/logo_llnl.png" x="1064" y="68" width="132" height="34" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- title block = chunk 1 -->
  <g id="cue_s01_c1_graph_neural_networks_increasingly_d">
    <title>graph neural networks increasingly deployed safety-critical settings confidence estimates unreliable test data shifts training</title>
    <desc>Graph neural networks are increasingly deployed in safety-critical settings, but their confidence estimates often become unreliable when the test data shifts away from training.</desc>
    <text x="78" y="196" font-size="76" font-weight="bold" fill="#12172A">G-&#916;UQ</text>
    <text x="82" y="240" font-size="24" fill="#5A6675">Accurate, scalable epistemic uncertainty</text>
    <text x="82" y="272" font-size="24" fill="#5A6675">for graph neural networks under shift</text>
    <text x="82" y="322" font-size="16" fill="#8A97A8">GNN confidence turns unreliable exactly when the test graph drifts from training.</text>
  </g>

  <!-- authorship -->
  <g id="deco_authors">
    <text x="82" y="372" font-size="14" fill="#8A97A8">Puja Trivedi · Mark Heimann · Rushil Anirudh · Danai Koutra · Jayaraman J. Thiagarajan</text>
    <text x="82" y="396" font-size="14" fill="#8A97A8">University of Michigan  ·  Lawrence Livermore National Laboratory</text>
  </g>

  <!-- QR utility cluster -->
  <g id="deco_qr">
    <rect x="82" y="452" width="150" height="150" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <image xlink:href="../images/qr_code.png" x="88" y="458" width="138" height="138" preserveAspectRatio="xMidYMid meet"/>
    <text x="82" y="624" font-size="13" font-weight="bold" fill="#12172A">Code</text>
    <text x="82" y="642" font-size="12" fill="#8A97A8">github.com/pujacomputes/gduq</text>
    <rect x="262" y="472" width="130" height="130" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <image xlink:href="../images/qr_paper.png" x="267" y="477" width="120" height="120" preserveAspectRatio="xMidYMid meet"/>
    <text x="262" y="624" font-size="13" font-weight="bold" fill="#12172A">Paper</text>
    <text x="262" y="642" font-size="12" fill="#8A97A8">arxiv.org/abs/2309.10976</text>
  </g>

  <!-- right panel: at a glance -->
  <g id="deco_panel">
    <rect x="700" y="150" width="500" height="452" rx="14" fill="#F3F5FA"/>
    <text x="732" y="196" font-size="14" font-weight="bold" letter-spacing="2" fill="#5A6675">AT A GLANCE</text>
  </g>

  <g id="cue_s01_c2_university_michigan_lawrence_livermo">
    <title>university michigan lawrence livermore national laboratory introduces g-delta-uq single-model method estimating epistemic uncertainty graph neural networks</title>
    <desc>This paper, from the University of Michigan and Lawrence Livermore National Laboratory, introduces G-Delta-UQ, a single-model method for estimating epistemic uncertainty in graph neural networks.</desc>
    <rect x="732" y="216" width="436" height="168" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="732" y="216" width="6" height="168" rx="3" fill="#2453D6"/>
    <text x="760" y="252" font-size="19" font-weight="bold" fill="#12172A">G-&#916;UQ — a single-model method</text>
    <text x="760" y="284" font-size="15" fill="#5A6675">One trained model estimates epistemic</text>
    <text x="760" y="306" font-size="15" fill="#5A6675">uncertainty for GNNs — no ensemble of</text>
    <text x="760" y="328" font-size="15" fill="#5A6675">networks required.</text>
    <text x="760" y="362" font-size="15" font-weight="bold" fill="#2453D6">Stochastic centering, adapted to graphs</text>
  </g>

  <g id="cue_s01_c3_adapting_stochastic_centering_partia">
    <title>adapting stochastic centering partial stochasticity structured graph data better-calibrated confidence indicators size concept covariate distribution shifts downstream out-of-distribution detection generalization gap prediction</title>
    <desc>By adapting stochastic centering and partial stochasticity to structured graph data, G-Delta-UQ produces better-calibrated confidence indicators across size, concept, and covariate distribution shifts, and improves downstream tasks like out-of-distribution detection and generalization gap prediction.</desc>
    <rect x="732" y="400" width="436" height="184" rx="10" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="732" y="400" width="6" height="184" rx="3" fill="#0E9E8F"/>
    <text x="760" y="436" font-size="19" font-weight="bold" fill="#12172A">Better calibration under shift</text>
    <text x="760" y="468" font-size="15" fill="#5A6675">Well-calibrated confidence across size,</text>
    <text x="760" y="490" font-size="15" fill="#5A6675">concept and covariate distribution shifts.</text>
    <text x="760" y="522" font-size="15" fill="#5A6675">Lifts downstream OOD detection and</text>
    <text x="760" y="544" font-size="15" fill="#5A6675">generalization-gap prediction, and its</text>
    <text x="760" y="566" font-size="15" fill="#5A6675">pretrained variant is cheap to add.</text>
  </g>

  <!-- footer -->
  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-&#916;UQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">01 / 10</text>
  </g>
</svg>
