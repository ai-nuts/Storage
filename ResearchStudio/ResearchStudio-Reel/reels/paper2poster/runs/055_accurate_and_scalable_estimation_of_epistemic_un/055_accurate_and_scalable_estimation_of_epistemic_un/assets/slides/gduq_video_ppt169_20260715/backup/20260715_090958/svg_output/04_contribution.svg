<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">04 · CONTRIBUTION</text>
    <text x="80" y="120" font-size="34" font-weight="bold" fill="#12172A">Three contributions</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s04_c1_makes_three_contributions">
    <title>paper makes three contributions</title>
    <desc>The paper makes three contributions.</desc>
    <rect x="80" y="176" width="1120" height="78" rx="12" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <rect x="80" y="176" width="6" height="78" rx="3" fill="#2453D6"/>
    <text x="112" y="210" font-size="19" font-weight="bold" fill="#12172A">One diagnosis, one method, one broad evaluation</text>
    <text x="112" y="238" font-size="16" fill="#5A6675">The paper contributes a case study, a new single-model uncertainty method, and an extensive empirical study.</text>
  </g>

  <g id="cue_s04_c2_first_rigorous_case_study_establishi">
    <title>first rigorous case study establishing improving graph neural network expressivity does not mitigate poor calibration under distribution shift</title>
    <desc>First, a rigorous case study establishing that improving graph neural network expressivity does not mitigate poor calibration under distribution shift.</desc>
    <rect x="80" y="274" width="360" height="370" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="274" width="6" height="370" rx="3" fill="#E4572E"/>
    <text x="112" y="330" font-size="46" font-weight="bold" fill="#F2A488">01</text>
    <text x="112" y="372" font-size="20" font-weight="bold" fill="#12172A">A rigorous</text>
    <text x="112" y="398" font-size="20" font-weight="bold" fill="#12172A">case study</text>
    <text x="112" y="440" font-size="15" fill="#5A6675">Shows that improving GNN</text>
    <text x="112" y="462" font-size="15" fill="#5A6675">expressivity does not mitigate</text>
    <text x="112" y="484" font-size="15" fill="#5A6675">poor calibration under</text>
    <text x="112" y="506" font-size="15" fill="#5A6675">distribution shift.</text>
    <text x="112" y="548" font-size="15" fill="#5A6675">Transformers, positional</text>
    <text x="112" y="570" font-size="15" fill="#5A6675">encodings and larger models</text>
    <text x="112" y="592" font-size="15" fill="#5A6675">all leave calibration poor.</text>
  </g>

  <g id="cue_s04_c3_second_g_delta_uq_novel_single_model">
    <title>second g-delta-uq novel single-model uncertainty method extends stochastic centering framework structured graph data supports partial stochasticity only part network stochastic</title>
    <desc>Second, G-Delta-UQ, a novel single-model uncertainty method that extends the stochastic centering framework to structured graph data and, crucially, supports partial stochasticity so that only part of the network is made stochastic.</desc>
    <rect x="460" y="274" width="360" height="370" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="460" y="274" width="6" height="370" rx="3" fill="#0E9E8F"/>
    <text x="492" y="330" font-size="46" font-weight="bold" fill="#7FCFC1">02</text>
    <text x="492" y="372" font-size="20" font-weight="bold" fill="#12172A">G-&#916;UQ, a new</text>
    <text x="492" y="398" font-size="20" font-weight="bold" fill="#12172A">single-model method</text>
    <text x="492" y="440" font-size="15" fill="#5A6675">Extends the stochastic centering</text>
    <text x="492" y="462" font-size="15" fill="#5A6675">framework to structured graph</text>
    <text x="492" y="484" font-size="15" fill="#5A6675">data.</text>
    <text x="492" y="526" font-size="15" fill="#5A6675">Crucially, supports partial</text>
    <text x="492" y="548" font-size="15" fill="#5A6675">stochasticity — only part of the</text>
    <text x="492" y="570" font-size="15" fill="#5A6675">network is made stochastic, so it</text>
    <text x="492" y="592" font-size="15" fill="#5A6675">stays cheap and scalable.</text>
  </g>

  <g id="cue_s04_c4_third_extensive_empirical_evaluation">
    <title>third extensive empirical evaluation spanning covariate concept graph size shifts safety-critical tasks calibration generalization gap prediction out-of-distribution detection</title>
    <desc>Third, an extensive empirical evaluation spanning covariate, concept, and graph size shifts, across the safety-critical tasks of calibration, generalization gap prediction, and out-of-distribution detection.</desc>
    <rect x="840" y="274" width="360" height="370" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="840" y="274" width="6" height="370" rx="3" fill="#2453D6"/>
    <text x="872" y="330" font-size="46" font-weight="bold" fill="#7CA0EC">03</text>
    <text x="872" y="372" font-size="20" font-weight="bold" fill="#12172A">An extensive</text>
    <text x="872" y="398" font-size="20" font-weight="bold" fill="#12172A">empirical study</text>
    <text x="872" y="440" font-size="15" fill="#5A6675">Spanning three shift types:</text>
    <text x="884" y="468" font-size="15" fill="#12172A">•  covariate  ·  concept  ·  size</text>
    <text x="872" y="510" font-size="15" fill="#5A6675">Across three safety-critical tasks:</text>
    <text x="884" y="538" font-size="15" fill="#12172A">•  calibration</text>
    <text x="884" y="566" font-size="15" fill="#12172A">•  generalization-gap prediction</text>
    <text x="884" y="594" font-size="15" fill="#12172A">•  out-of-distribution detection</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-&#916;UQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">04 / 10</text>
  </g>
</svg>
