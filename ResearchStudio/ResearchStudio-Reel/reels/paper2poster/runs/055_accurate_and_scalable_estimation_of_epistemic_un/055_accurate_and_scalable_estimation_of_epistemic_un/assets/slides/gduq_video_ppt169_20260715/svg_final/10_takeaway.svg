<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6" />
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">10 · TAKEAWAY</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s10_c1_core_message_simple">
    <title>core message simple</title>
    <desc>The core message is simple.</desc>
    <text x="80" y="122" font-size="34" font-weight="bold" fill="#12172A">The core message is simple</text>
  </g>

  <g id="cue_s10_c2_not_expect_larger_more_expressive">
    <title>do not expect larger more expressive graph neural networks automatically give trustworthy confidence estimates under distribution shift</title>
    <desc>Do not expect larger or more expressive graph neural networks to automatically give trustworthy confidence estimates under distribution shift.</desc>
    <rect x="80" y="182" width="555" height="212" rx="12" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1" />
    <rect x="80" y="182" width="6" height="212" rx="3" fill="#E4572E" />
    <text x="112" y="222" font-size="15" font-weight="bold" letter-spacing="1" fill="#C4562F">DON'T</text>
    <text x="112" y="262" font-size="24" font-weight="bold" fill="#12172A">Don't rely on scale</text>
    <text x="112" y="304" font-size="16" fill="#5A6675">Larger or more expressive GNNs do not</text>
    <text x="112" y="326" font-size="16" fill="#5A6675">automatically give trustworthy confidence</text>
    <text x="112" y="348" font-size="16" fill="#5A6675">estimates under distribution shift.</text>
    <text x="112" y="380" font-size="16" font-weight="bold" fill="#E4572E">Expressivity is not calibration.</text>
  </g>

  <g id="cue_s10_c3_instead_adapt_principle_stochastic_a">
    <title>instead adapt principle stochastic anchoring graphs</title>
    <desc>Instead, adapt the principle of stochastic anchoring to graphs.</desc>
    <rect x="655" y="182" width="545" height="212" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1" />
    <rect x="655" y="182" width="6" height="212" rx="3" fill="#0E9E8F" />
    <text x="687" y="222" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E9E8F">DO</text>
    <text x="687" y="262" font-size="24" font-weight="bold" fill="#12172A">Anchor stochastically</text>
    <text x="687" y="304" font-size="16" fill="#5A6675">Adapt the principle of stochastic anchoring</text>
    <text x="687" y="326" font-size="16" fill="#5A6675">to graphs: anchor in feature or hidden space,</text>
    <text x="687" y="348" font-size="16" fill="#5A6675">vary anchors, and read uncertainty from the</text>
    <text x="687" y="370" font-size="16" fill="#5A6675">variance of predictions.</text>
  </g>

  <g id="cue_s10_c4_g_delta_uq_flexible_scalable_single">
    <title>g-delta-uq flexible scalable single-model framework produces reliable well-calibrated uncertainty structural size concept covariate shifts pretrained variant inexpensive add models already have</title>
    <desc>G-Delta-UQ is a flexible, scalable, single-model framework that produces reliable, well-calibrated uncertainty across structural, size, concept, and covariate shifts, and its pretrained variant makes it inexpensive to add to models you already have.</desc>
    <rect x="80" y="410" width="1120" height="234" rx="12" fill="#12172A" />
    <text x="112" y="452" font-size="14" font-weight="bold" letter-spacing="2" fill="#7CA0EC">G-ΔUQ</text>
    <text x="112" y="496" font-size="27" font-weight="bold" fill="#FFFFFF">A flexible, scalable, single-model uncertainty framework</text>
    <text x="112" y="532" font-size="16" fill="#C7CFDA">Reliable, well-calibrated uncertainty across structural, size, concept, and covariate shifts —</text>
    <text x="112" y="554" font-size="16" fill="#C7CFDA">and its pretrained variant is inexpensive to add to the models you already have.</text>
    <rect x="112" y="576" width="250" height="48" rx="8" fill="#1D2740" />
    <text x="132" y="605" font-size="15" font-weight="bold" fill="#FFFFFF">Structural · Size shifts</text>
    <rect x="378" y="576" width="250" height="48" rx="8" fill="#1D2740" />
    <text x="398" y="605" font-size="15" font-weight="bold" fill="#FFFFFF">Concept · Covariate shifts</text>
    <rect x="644" y="576" width="290" height="48" rx="8" fill="#0E9E8F" />
    <text x="664" y="605" font-size="15" font-weight="bold" fill="#FFFFFF">Pretrained = cheap to adopt</text>
    <rect x="978" y="576" width="150" height="48" rx="8" fill="#FFFFFF" />
    <image xlink:href="data:image/jpeg;base64," x="984" y="580" width="40" height="40" />
    <text x="1034" y="596" font-size="13" font-weight="bold" fill="#12172A">Code</text>
    <text x="1034" y="614" font-size="11" fill="#5A6675">/pujacomputes/gduq</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-ΔUQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">10 / 10</text>
  </g>
</svg>