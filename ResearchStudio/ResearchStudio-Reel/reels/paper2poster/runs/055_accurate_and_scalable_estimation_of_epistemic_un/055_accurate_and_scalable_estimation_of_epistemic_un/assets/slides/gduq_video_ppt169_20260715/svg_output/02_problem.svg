<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">02 · PROBLEM</text>
    <text x="80" y="120" font-size="34" font-weight="bold" fill="#12172A">Trustworthy GNN confidence — exactly when data shifts</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s02_c1_graph_neural_networks_being_deployed">
    <title>graph neural networks being deployed high-stakes applications test-time data rarely matches training conditions</title>
    <desc>Graph neural networks are being deployed in high-stakes applications where the test-time data rarely matches training conditions.</desc>
    <rect x="80" y="176" width="1120" height="96" rx="12" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <rect x="80" y="176" width="6" height="96" rx="3" fill="#E4572E"/>
    <text x="112" y="214" font-size="20" font-weight="bold" fill="#12172A">High-stakes deployment, shifted test data</text>
    <text x="112" y="246" font-size="16" fill="#5A6675">GNNs increasingly power high-stakes applications, yet the test-time graphs they meet rarely match training conditions.</text>
  </g>

  <g id="cue_s02_c2_these_shifted_settings_downstream_sa">
    <title>these shifted settings downstream safety metrics calibration error out-of-distribution rejection generalization gap prediction rely model confidence indicators</title>
    <desc>In these shifted settings, downstream safety metrics such as calibration error, out-of-distribution rejection, and generalization gap prediction all rely on the model's confidence indicators.</desc>
    <rect x="80" y="292" width="360" height="352" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="292" width="6" height="352" rx="3" fill="#2453D6"/>
    <text x="108" y="330" font-size="19" font-weight="bold" fill="#12172A">Safety rides on confidence</text>
    <text x="108" y="362" font-size="15" fill="#5A6675">Under shift, key safety metrics all</text>
    <text x="108" y="384" font-size="15" fill="#5A6675">read the model's confidence:</text>
    <text x="120" y="424" font-size="15" fill="#12172A">•  Calibration error (ECE)</text>
    <text x="120" y="456" font-size="15" fill="#12172A">•  Out-of-distribution rejection</text>
    <text x="120" y="488" font-size="15" fill="#12172A">•  Generalization-gap prediction</text>
    <text x="108" y="536" font-size="15" fill="#5A6675">If confidence is wrong, every one</text>
    <text x="108" y="558" font-size="15" fill="#5A6675">of these downstream checks fails.</text>
  </g>

  <g id="cue_s02_c3_while_computer_vision_community_long">
    <title>while computer vision community long known confidence quality deteriorates under distribution shift behavior under-explored graph neural networks</title>
    <desc>While the computer vision community has long known that confidence quality deteriorates under distribution shift, this behavior has remained under-explored for graph neural networks.</desc>
    <rect x="460" y="292" width="360" height="352" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="460" y="292" width="6" height="352" rx="3" fill="#8A97A8"/>
    <text x="488" y="330" font-size="19" font-weight="bold" fill="#12172A">Known in vision, open for graphs</text>
    <text x="488" y="366" font-size="15" fill="#5A6675">Computer vision has long shown</text>
    <text x="488" y="388" font-size="15" fill="#5A6675">that confidence quality degrades</text>
    <text x="488" y="410" font-size="15" fill="#5A6675">under distribution shift.</text>
    <text x="488" y="452" font-size="15" fill="#5A6675">For graph neural networks, this</text>
    <text x="488" y="474" font-size="15" fill="#5A6675">behavior has stayed largely</text>
    <text x="488" y="496" font-size="15" fill="#5A6675">under-explored — until now.</text>
  </g>

  <g id="cue_s02_c4_asks_whether_gnn_confidence_indicato">
    <title>asks whether gnn confidence indicators made reliable realistic structural size concept covariate shifts</title>
    <desc>This paper asks whether GNN confidence indicators can be made reliable under realistic structural, size, concept, and covariate shifts.</desc>
    <rect x="840" y="292" width="360" height="352" rx="12" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <rect x="840" y="292" width="6" height="352" rx="3" fill="#2453D6"/>
    <text x="868" y="330" font-size="19" font-weight="bold" fill="#12172A">The question</text>
    <text x="868" y="366" font-size="15" fill="#5A6675">Can GNN confidence indicators be</text>
    <text x="868" y="388" font-size="15" fill="#5A6675">made reliable under realistic shift?</text>
    <text x="868" y="432" font-size="15" font-weight="bold" fill="#2453D6">Four shift types studied</text>
    <text x="880" y="464" font-size="15" fill="#12172A">•  Structural distortion</text>
    <text x="880" y="492" font-size="15" fill="#12172A">•  Graph size</text>
    <text x="880" y="520" font-size="15" fill="#12172A">•  Concept</text>
    <text x="880" y="548" font-size="15" fill="#12172A">•  Covariate</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-&#916;UQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">02 / 10</text>
  </g>
</svg>
