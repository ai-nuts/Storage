<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">09 · BY THE NUMBERS</text>
    <text x="80" y="120" font-size="34" font-weight="bold" fill="#12172A">One model, broad coverage, strong results</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s09_c1_numbers_g_delta_uq_single_model_meth">
    <title>numbers g-delta-uq single-model method offering three anchoring variants plus pretrained partial-stochasticity option</title>
    <desc>In numbers, G-Delta-UQ is a single-model method offering three anchoring variants plus a pretrained partial-stochasticity option.</desc>
    <rect x="80" y="176" width="560" height="196" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="176" width="6" height="196" rx="3" fill="#2453D6"/>
    <text x="108" y="210" font-size="14" font-weight="bold" letter-spacing="1" fill="#2453D6">THE METHOD</text>
    <text x="112" y="292" font-size="72" font-weight="bold" fill="#2453D6">1</text>
    <text x="210" y="264" font-size="19" font-weight="bold" fill="#12172A">single trained model</text>
    <text x="210" y="292" font-size="15" fill="#5A6675">no ensemble of networks required</text>
    <line x1="108" y1="316" x2="612" y2="316" stroke="#E2E7EF" stroke-width="1"/>
    <text x="112" y="344" font-size="16" fill="#12172A"><tspan font-weight="bold" fill="#0E9E8F">3</tspan> anchoring variants</text>
    <text x="112" y="368" font-size="16" fill="#12172A"><tspan font-weight="bold" fill="#0E9E8F">+ 1</tspan> pretrained partial-stochasticity option</text>
  </g>

  <g id="cue_s09_c2_evaluated_across_three_distinct_type">
    <title>evaluated across three distinct types distribution shift three safety-critical downstream tasks compared against four established uncertainty baselines including deep ensembles</title>
    <desc>It is evaluated across three distinct types of distribution shift and three safety-critical downstream tasks, and compared against four established uncertainty baselines including deep ensembles.</desc>
    <rect x="660" y="176" width="540" height="196" rx="12" fill="#F3F5FA"/>
    <text x="688" y="210" font-size="14" font-weight="bold" letter-spacing="1" fill="#5A6675">THE EVALUATION</text>
    <rect x="688" y="226" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="763" y="292" font-size="46" font-weight="bold" fill="#2453D6" text-anchor="middle">3</text>
    <text x="763" y="320" font-size="14" fill="#5A6675" text-anchor="middle">shift types</text>
    <rect x="853" y="226" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="928" y="292" font-size="46" font-weight="bold" fill="#0E9E8F" text-anchor="middle">3</text>
    <text x="928" y="320" font-size="14" fill="#5A6675" text-anchor="middle">downstream tasks</text>
    <rect x="1018" y="226" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="1093" y="292" font-size="46" font-weight="bold" fill="#E4572E" text-anchor="middle">4</text>
    <text x="1093" y="320" font-size="14" fill="#5A6675" text-anchor="middle">baselines (incl. DeepEns)</text>
  </g>

  <g id="cue_s09_c3_despite_requiring_only_single_consis">
    <title>despite requiring only single model consistently matches outperforms baselines calibration out-of-distribution detection generalization gap prediction</title>
    <desc>Despite requiring only a single model, it consistently matches or outperforms these baselines on calibration, out-of-distribution detection, and generalization gap prediction.</desc>
    <rect x="80" y="392" width="1120" height="252" rx="12" fill="#12172A"/>
    <text x="112" y="436" font-size="14" font-weight="bold" letter-spacing="2" fill="#7CA0EC">THE BOTTOM LINE</text>
    <text x="112" y="486" font-size="30" font-weight="bold" fill="#FFFFFF">Single-model cost, ensemble-level reliability</text>
    <text x="112" y="524" font-size="17" fill="#C7CFDA">Despite requiring only one model, G-&#916;UQ consistently matches or outperforms these baselines on all three metrics:</text>
    <rect x="112" y="548" width="340" height="72" rx="8" fill="#1D2740"/>
    <text x="132" y="580" font-size="16" font-weight="bold" fill="#FFFFFF">Calibration (ECE)</text>
    <text x="132" y="606" font-size="14" fill="#9FB2D6">Lower error under every shift</text>
    <rect x="470" y="548" width="340" height="72" rx="8" fill="#1D2740"/>
    <text x="490" y="580" font-size="16" font-weight="bold" fill="#FFFFFF">OOD detection (AUROC)</text>
    <text x="490" y="606" font-size="14" fill="#9FB2D6">Highly competitive vs. baselines</text>
    <rect x="828" y="548" width="340" height="72" rx="8" fill="#1D2740"/>
    <text x="848" y="580" font-size="16" font-weight="bold" fill="#FFFFFF">Gen-gap prediction (MAE)</text>
    <text x="848" y="606" font-size="14" fill="#9FB2D6">Among best single-model estimators</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">G-&#916;UQ · ICLR 2024</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">09 / 10</text>
  </g>
</svg>
