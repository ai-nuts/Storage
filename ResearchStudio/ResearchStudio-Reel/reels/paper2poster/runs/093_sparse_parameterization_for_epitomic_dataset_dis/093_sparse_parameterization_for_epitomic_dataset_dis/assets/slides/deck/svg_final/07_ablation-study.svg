<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="16%" cy="6%" r="100%">
    <stop offset="0%" stop-color="#141232" stop-opacity="0.95"/>
    <stop offset="62%" stop-color="#0B1020" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
  <linearGradient id="accg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C6CF0"/>
    <stop offset="100%" stop-color="#5B4BD6"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1020" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#7C6CF0" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#7C6CF0" text-anchor="start" letter-spacing="3">ABLATION</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="800" fill="#EEF0FB" text-anchor="start">Sparsification is essentially free</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#7C7AA6" text-anchor="end" letter-spacing="1">07 / 08</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#332F5E" stroke-width="1.2" />
<g id="cue_s07_c1_ablations_show_sparsification_essent">
  <title>ablations show sparsification essentially free</title>
  <desc>Ablations show sparsification essentially free pruning meets storage budget keeping ConvNet accuracy.</desc>
<rect x="56" y="160" width="596" height="296" rx="14" ry="14" fill="#181634" stroke="#332F5E" stroke-width="1.2" />
<rect x="78" y="184" width="5" height="28" rx="2.5" fill="#7C6CF0" />
<text x="96" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EEF0FB" text-anchor="start">Pruning the codes barely moves accuracy</text>
<text x="80" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#B4B2D6" text-anchor="start">Pruning each sparse coding matrix to just 48 non-zero</text>
<text x="80" y="257" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#B4B2D6" text-anchor="start">elements meets the storage budget with almost no loss.</text>
<rect x="80" y="308" width="254.0" height="116" rx="12" ry="12" fill="#211E44" stroke="#37DCC0" stroke-width="1.2" />
<text x="207.0" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#EEF0FB" text-anchor="middle">k = 48 non-zeros</text>
<text x="207.0" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="800" fill="#37DCC0" text-anchor="middle">73.5%</text>
<text x="207.0" y="400" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#B4B2D6" text-anchor="middle">307K params</text>
<text x="354.0" y="372.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="800" fill="#F7B84B" text-anchor="middle">≈</text>
<rect x="374.0" y="308" width="254.0" height="116" rx="12" ry="12" fill="#211E44" stroke="#332F5E" stroke-width="1.2" />
<text x="501.0" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#EEF0FB" text-anchor="middle">full model</text>
<text x="501.0" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="800" fill="#EEF0FB" text-anchor="middle">74.0%</text>
<text x="501.0" y="400" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="400" fill="#B4B2D6" text-anchor="middle">15M params</text>
</g>
<g id="cue_s07_c2_pruning_sparse_coding_matrix_just">
  <title>pruning sparse coding matrix just forty-eight non-zero elements about three</title>
  <desc>Pruning sparse coding matrix just forty-eight non-zero elements about three hundred thousand parameters meets storage budget.</desc>
<rect x="676" y="160" width="548" height="90.66666666666667" rx="14" ry="14" fill="#181634" stroke="#332F5E" stroke-width="1.2" />
<text x="696" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#7C6CF0" text-anchor="start">About 50x smaller codes</text>
<text x="696" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#B4B2D6" text-anchor="start">Roughly 307K parameters versus a 15M-parameter</text>
<text x="696" y="237" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#B4B2D6" text-anchor="start">full model, at ~0.3% density.</text>
</g>
<g id="cue_s07_c3_push_too_low_down_twelve">
  <title>push too low down twelve accuracy collapses moderate value best</title>
  <desc>Push k too low down twelve accuracy collapses moderate value best improves cross-architecture generalization.</desc>
<rect x="676" y="262.6666666666667" width="548" height="90.66666666666667" rx="14" ry="14" fill="#211E44" stroke="#F2708A" stroke-width="1.2" />
<text x="696" y="294.6666666666667" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#F2708A" text-anchor="start">Do not push k too far</text>
<text x="696" y="318.6666666666667" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#B4B2D6" text-anchor="start">At k=12 accuracy collapses to 57.8%. A</text>
<text x="696" y="339.6666666666667" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#B4B2D6" text-anchor="start">moderate k is best for generalization.</text>
</g>
<g id="cue_s07_c4_qualitatively_synthetic_images_befor">
  <title>qualitatively synthetic images before after sparsification zero point three percent</title>
  <desc>Qualitatively synthetic images before after sparsification zero point three percent density look almost identical two recurrent blocks three heads.</desc>
<rect x="676" y="365.33333333333337" width="548" height="90.66666666666667" rx="14" ry="14" fill="#181634" stroke="#F7B84B" stroke-width="1.2" />
<rect x="696" y="387.33333333333337" width="5" height="24" rx="2.5" fill="#F7B84B" />
<text x="714" y="405.33333333333337" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F7B84B" text-anchor="start">R=2 blocks, H=3 heads</text>
<text x="696" y="429.33333333333337" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#B4B2D6" text-anchor="start">Samples before and after sparsifying to 0.3%</text>
<text x="696" y="450.33333333333337" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#B4B2D6" text-anchor="start">density look almost identical.</text>
</g>
</svg>
