<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three contributions</text><g id="cue_s04_c1_makes_three_main_contributions"><title>makes three main contributions</title><rect x="64" y="158" width="1152" height="54" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="54" rx="6" fill="#4C9BE8"/><text x="92" y="191" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The paper makes three main contributions for training vision transformers without labels.</text></g><g id="cue_s04_c2_first_introduces_patchrot_self_super"><title>first introduces patchrot self-supervised technique crafted vision transformers predicts rotation</title><rect x="64" y="236" width="368" height="314" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="236" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="116" cy="304" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="116" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">1</text><text x="92" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">PatchRot, built for ViTs</text><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A self-supervised task that predicts</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rotation at two levels: the class token</text><text x="92" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">predicts the whole-image rotation for</text><text x="92" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">global context, and new per-patch heads</text><text x="92" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">predict each patch's rotation for local</text><text x="92" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">detail.</text></g><g id="cue_s04_c3_second_introduces_buffer_gap_between"><title>second introduces buffer gap between patches during network cannot cheat</title><rect x="456" y="236" width="368" height="314" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="236" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="508" cy="304" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="508" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">2</text><text x="484" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">A buffer gap between</text><text x="484" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">patches</text><text x="484" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A gap inserted between patches during</text><text x="484" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">training so the network cannot cheat by</text><text x="484" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">matching continuous edges, forcing it to</text><text x="484" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">learn genuine content.</text></g><g id="cue_s04_c4_third_demonstrates_through_extensive"><title>third demonstrates through extensive experiments patchrot beats both supervised scratch</title><rect x="848" y="236" width="368" height="314" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="236" width="368" height="6" rx="6" fill="#48C78E"/><circle cx="900" cy="304" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="900" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">3</text><text x="876" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Extensive gains</text><text x="876" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">PatchRot beats supervised-from-scratch</text><text x="876" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and RotNet across multiple datasets, and</text><text x="876" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">its features transfer well and help in</text><text x="876" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">semi-supervised settings.</text></g><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="700" text-anchor="start">Global and local rotation together — a self-supervised task made for transformers.</text></svg>