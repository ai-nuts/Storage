<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">PatchRot beats supervised and RotNet everywhere</text><g id="cue_s07_c1_headline_result_patchrot_pretraining"><title>headline result patchrot pretraining consistently outperforms both supervised scratch rotnet</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">On every dataset tested, PatchRot pretraining tops both supervised-from-scratch and the RotNet baseline.</text></g><g id="cue_s07_c2_cifar_10_full_fine_tuning_patchrot_r"><title>cifar-10 full fine-tuning patchrot reaches ninety-two point six percent top-one</title><rect x="64" y="214" width="560" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="190" rx="6" fill="#34D3C0"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">CIFAR-10 top-1  ·  higher is better</text><rect x="300" y="278" width="250" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="278" width="209" height="30" rx="6" fill="#F2685C"/><text x="288" y="299.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Supervised</text><text x="519" y="299.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">83.9%</text><rect x="300" y="326" width="250" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="326" width="231" height="30" rx="6" fill="#48C78E"/><text x="288" y="347.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">PatchRot</text><text x="541" y="347.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">92.6%</text><rect x="92" y="364" width="504" height="28" rx="8" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">+8.7 points over training from scratch</text></g><g id="cue_s07_c3_cifar_100_gap_even_larger_seventy"><title>cifar-100 gap even larger seventy point six percent top-one versus</title><rect x="656" y="214" width="560" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="190" rx="6" fill="#F2C14E"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">CIFAR-100 &amp; FashionMNIST top-1</text><rect x="892" y="278" width="250" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="278" width="125" height="26" rx="6" fill="#F2685C"/><text x="880" y="296.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">C100 Supervised</text><text x="1027" y="296.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">50.2%</text><rect x="892" y="320" width="250" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="320" width="176" height="26" rx="6" fill="#48C78E"/><text x="880" y="338.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">C100 PatchRot</text><text x="1078" y="338.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">70.6%</text><rect x="892" y="362" width="250" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="362" width="235" height="26" rx="6" fill="#4C9BE8"/><text x="880" y="380.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">FMNIST PatchRot</text><text x="1137" y="380.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">94.1%</text></g><g id="cue_s07_c4_remarkably_even_linear_probing_where"><title>remarkably even linear probing where entire network frozen only final</title><rect x="64" y="418" width="1152" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="418" width="6" height="190" rx="6" fill="#4C9BE8"/><text x="92" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Even a frozen network learns useful features</text><text x="92" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">With linear probing the whole network is frozen and only the final layer is trained,</text><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">yet accuracy gets close to full supervised performance.</text><rect x="92" y="540" width="1080" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="560.0" r="5" fill="#4C9BE8"/><text x="126" y="566.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Fine-tuning just a single encoder block already beats training from scratch</text></g><text x="64" y="648" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Strong features whether you fine-tune everything, one block, or nothing at all.</text></svg>