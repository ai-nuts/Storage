<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Four datasets, transfer and semi-supervised</text><g id="cue_s06_c1_authors_test_patchrot_four_standard"><title>authors test patchrot four standard image classification datasets cifar-10 cifar-100</title><rect x="64" y="158" width="1152" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="120" rx="6" fill="#4C9BE8"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Four standard image-classification datasets</text><rect x="92" y="206" width="256" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="220.0" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#4C9BE8" font-weight="800" text-anchor="middle">CIFAR-10</text><text x="220.0" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">32 x 32</text><rect x="368" y="206" width="256" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="496.0" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#4C9BE8" font-weight="800" text-anchor="middle">CIFAR-100</text><text x="496.0" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">32 x 32</text><rect x="644" y="206" width="256" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="772.0" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#4C9BE8" font-weight="800" text-anchor="middle">FashionMNIST</text><text x="772.0" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">32 x 32</text><rect x="920" y="206" width="280" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1060.0" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#F2C14E" font-weight="800" text-anchor="middle">Tiny-ImageNet</text><text x="1060.0" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">64 x 64</text></g><g id="cue_s06_c2_they_also_study_svhn_mnist"><title>they also study svhn mnist probe rotation-invariant objects like digits</title><rect x="64" y="296" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="296" width="6" height="120" rx="6" fill="#34D3C0"/><text x="92" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Backbone and extra probes</text><text x="92" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A compact ViT with six encoder blocks. SVHN and MNIST also</text><text x="92" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">probe rotation-invariant objects like digits.</text></g><g id="cue_s06_c3_patch_sizes_four_pixels_small"><title>patch sizes four pixels small datasets eight tiny-imagenet buffer gap</title><rect x="656" y="296" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="296" width="6" height="120" rx="6" fill="#F2C14E"/><text x="684" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Patch sizes and buffer gap</text><text x="684" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Patch size 4 pixels for the small datasets, 8 for</text><text x="684" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Tiny-ImageNet, with a buffer gap set to a quarter of the</text><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">patch size.</text></g><g id="cue_s06_c4_beyond_plain_classification_they_eva"><title>beyond plain classification they evaluate transfer learning between cifar-10 cifar-100</title><rect x="64" y="434" width="1152" height="116" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="434" width="6" height="116" rx="6" fill="#48C78E"/><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Beyond plain classification</text><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Transfer learning between CIFAR-10 and CIFAR-100, plus a semi-supervised setting on CIFAR-10 with only a</text><text x="92" y="525" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">handful of labels, from 250 up to 10,000.</text></g></svg>