<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Every component earns its place</text><g id="cue_s08_c1_ablation_study_cifar_10_confirms_eve"><title>ablation study cifar-10 confirms every component patchrot matters patch rotations</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">CIFAR-10: drop one piece at a time</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Training on patch rotations alone, without whole-image</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rotation, drops accuracy to 91.8% because the model</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">loses global context.</text></g><g id="cue_s08_c2_only_image_rotation_essentially_rotn"><title>only image rotation essentially rotnet approach adapted transformer drops ninety-one</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">CIFAR-10 top-1  ·  variants vs full</text><rect x="330" y="388" width="180" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="330" y="388" width="176" height="28" rx="6" fill="#F2C14E"/><text x="318" y="408.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Image only (RotNet)</text><text x="516" y="408.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">91.0%</text><rect x="330" y="432" width="180" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="330" y="432" width="177" height="28" rx="6" fill="#4C9BE8"/><text x="318" y="452.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Patch only</text><text x="517" y="452.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">91.8%</text><rect x="330" y="476" width="180" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="330" y="476" width="179" height="28" rx="6" fill="#48C78E"/><text x="318" y="496.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Full PatchRot</text><text x="519" y="496.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">92.6%</text><rect x="92" y="510" width="504" height="28" rx="8" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">Global + local rotation beats either alone</text></g><g id="cue_s08_c3_rotating_image_its_patches_together"><title>rotating image its patches together single pass rather separate passes</title><rect x="656" y="158" width="560" height="244" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="244" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Other design choices that matter</text><rect x="684" y="222" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="244.0" r="5" fill="#F2685C"/><text x="718" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Rotate image + patches together (one pass) -&gt; hurts</text><rect x="684" y="278" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="300.0" r="5" fill="#F2685C"/><text x="718" y="306.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Train at original instead of reduced resolution -&gt; hurts</text><rect x="684" y="334" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="356.0" r="5" fill="#F2685C"/><text x="718" y="362.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Reuse existing head instead of dedicated patch heads -&gt; hurts</text></g><g id="cue_s08_c4_these_lands_below_full_method"><title>these lands below full method ninety-two point six percent showing</title><rect x="656" y="418" width="560" height="132" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="418" width="6" height="132" rx="6" fill="#48C78E"/><text x="684" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">All variants land below the full method</text><text x="684" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Each falls under the full 92.6%, showing every design</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">decision contributes.</text></g></svg>