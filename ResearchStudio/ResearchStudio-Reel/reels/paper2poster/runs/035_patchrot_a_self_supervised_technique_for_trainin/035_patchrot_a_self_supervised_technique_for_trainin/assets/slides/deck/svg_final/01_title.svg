<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">NeurIPS 2022</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Arizona State University  ·  Georgia State University</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">PatchRot</text><text x="64" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27" fill="#4C9BE8" font-weight="800" text-anchor="start">A Self-Supervised Technique for Vision Transformers</text><text x="64" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#34D3C0" font-weight="700" text-anchor="start">Predict the rotation of the whole image and of every patch</text><text x="64" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Sachin Chhabra  ·  Prabal Bijoy Dutta  ·  Hemanth Venkateswara  ·  Baoxin Li</text><g transform="rotate(0 1046.0 146.0)"><rect x="1020" y="120" width="52" height="52" rx="3" fill="none" stroke="#4C9BE8" stroke-width="2"/><polygon points="1040.0,124 1052.0,124 1046.0,114" fill="#4C9BE8"/></g><text x="1046.0" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">0</text><g transform="rotate(90 1122.0 146.0)"><rect x="1096" y="120" width="52" height="52" rx="3" fill="none" stroke="#34D3C0" stroke-width="2"/><polygon points="1116.0,124 1128.0,124 1122.0,114" fill="#34D3C0"/></g><text x="1122.0" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">90</text><g transform="rotate(180 1046.0 222.0)"><rect x="1020" y="196" width="52" height="52" rx="3" fill="none" stroke="#F2C14E" stroke-width="2"/><polygon points="1040.0,200 1052.0,200 1046.0,190" fill="#F2C14E"/></g><text x="1046.0" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">180</text><g transform="rotate(270 1122.0 222.0)"><rect x="1096" y="196" width="52" height="52" rx="3" fill="none" stroke="#48C78E" stroke-width="2"/><polygon points="1116.0,200 1128.0,200 1122.0,190" fill="#48C78E"/></g><text x="1122.0" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">270</text><text x="1094" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="700" text-anchor="middle">predict the angle</text><g id="cue_s01_c1_vision_transformers_powerful_but_dat"><title>vision transformers powerful but data-hungry they only beat convolutional networks</title><rect x="64" y="316" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="316" width="6" height="118" rx="6" fill="#4C9BE8"/><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">ViTs are data-hungry</text><text x="92" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Vision transformers beat ConvNets only with huge labeled datasets.</text><text x="92" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">PatchRot is a self-supervised fix built for transformers.</text></g><g id="cue_s01_c2_rotate_whole_image_its_individual"><title>rotate whole image its individual patches multiples ninety degrees train</title><rect x="656" y="316" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="316" width="6" height="118" rx="6" fill="#F2C14E"/><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The idea: predict rotations</text><text x="684" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Rotate the whole image or each patch by 0 / 90 / 180 / 270 degrees,</text><text x="684" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">then train the ViT to predict every angle.</text></g><g id="cue_s01_c3_class_token_predicts_image_rotation"><title>class token predicts image rotation capturing global structure while new</title><rect x="64" y="456" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="456" width="6" height="118" rx="6" fill="#34D3C0"/><text x="92" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Two levels of rotation</text><text x="92" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The class token predicts the image rotation for global structure;</text><text x="92" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">new per-patch heads predict each patch's rotation for local detail.</text></g><g id="cue_s01_c4_after_pretraining_patchrot_features"><title>after pretraining patchrot features consistently beat both supervised scratch rotnet</title><rect x="656" y="456" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="456" width="6" height="118" rx="6" fill="#48C78E"/><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Beats supervised and RotNet</text><text x="684" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">After pretraining, features beat training-from-scratch and RotNet on</text><text x="684" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CIFAR-10, CIFAR-100, FashionMNIST and Tiny-ImageNet.</text></g><line x1="64" y1="616" x2="1216" y2="616" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2210.15722</text><text x="300" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">A simple rotation task, crafted for the patch-token structure of ViTs.</text></svg>