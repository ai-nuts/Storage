<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Vision transformers need too many labels</text><g id="cue_s02_c1_vision_transformers_overtaken_convol"><title>vision transformers overtaken convolutional networks many vision tasks but only</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">ViTs overtook ConvNets</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">On many vision tasks vision transformers</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">now lead, but only when trained on very</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">large labeled datasets.</text><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">Accuracy vs labeled data (illustrative)</text><rect x="240" y="372" width="180" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="372" width="99" height="26" rx="6" fill="#F2685C"/><text x="228" y="390.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">few labels</text><text x="349" y="390.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">ViT low</text><rect x="240" y="412" width="180" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="412" width="171" height="26" rx="6" fill="#48C78E"/><text x="228" y="430.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">many labels</text><text x="421" y="430.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">ViT high</text><rect x="92" y="468" width="344" height="64" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="400" text-anchor="start">The win depends on a mountain of labels.</text></g><g id="cue_s02_c2_limited_labels_their_performance_fal"><title>limited labels their performance falls behind convnets because they lack</title><rect x="500" y="158" width="716" height="120" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="158" width="6" height="120" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">With few labels, ViTs fall behind ConvNets</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">They lack built-in inductive biases such as locality and translation</text><text x="528" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">equivariance that ConvNets get for free.</text></g><g id="cue_s02_c3_labeling_scale_vits_need_expensive"><title>labeling scale vits need expensive slow</title><rect x="500" y="290" width="716" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="290" width="6" height="96" rx="6" fill="#F2C14E"/><text x="528" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Labels at ViT scale are costly</text><text x="528" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Annotating data at the scale vision transformers demand is expensive and</text><text x="528" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">slow.</text></g><g id="cue_s02_c4_self_supervised_learning_help_learni"><title>self-supervised learning help learning useful features without labels but popular</title><rect x="500" y="398" width="716" height="152" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="398" width="6" height="152" rx="6" fill="#34D3C0"/><text x="528" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Self-supervision could help, but...</text><text x="528" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">SSL learns features without labels, yet popular pretext tasks were all</text><text x="528" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">designed for ConvNets.</text><text x="528" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#34D3C0" font-weight="800" text-anchor="start">They ignore the patch-token structure that makes transformers special.</text></g></svg>