<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Push rotation prediction to the patch level</text><g id="cue_s03_c1_vision_transformer_splits_image_patc"><title>vision transformer splits image patches applies self-attention unlike convolutional network</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#4C9BE8" font-weight="800" text-anchor="start">A ViT outputs one token per patch</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It splits an image into patches and applies</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">self-attention, so unlike a ConvNet it produces a</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">separate output for every patch, not just one for</text><text x="92" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the whole image.</text><rect x="150" y="336" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="212" y="336" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="274" y="336" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="150" y="398" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="212" y="398" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="274" y="398" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="150" y="460" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="212" y="460" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><rect x="274" y="460" width="52" height="52" rx="2" fill="#16324A" stroke="#4C9BE8" stroke-width="1.4"/><text x="360" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="408" y="336" width="150" height="180" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="483" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#34D3C0" font-weight="700" text-anchor="middle">per-patch</text><text x="483" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#34D3C0" font-weight="700" text-anchor="middle">tokens</text><circle cx="432" cy="404" r="7" fill="#34D3C0"/><circle cx="468" cy="404" r="7" fill="#34D3C0"/><circle cx="504" cy="404" r="7" fill="#34D3C0"/><circle cx="432" cy="444" r="7" fill="#34D3C0"/><circle cx="468" cy="444" r="7" fill="#34D3C0"/><circle cx="504" cy="444" r="7" fill="#34D3C0"/><circle cx="432" cy="484" r="7" fill="#34D3C0"/><circle cx="468" cy="484" r="7" fill="#34D3C0"/><circle cx="504" cy="484" r="7" fill="#34D3C0"/><text x="92" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">One output per patch, ready to supervise locally.</text></g><g id="cue_s03_c2_prior_work_called_rotnet_showed"><title>prior work called rotnet showed simply predicting rotation angle image</title><rect x="648" y="158" width="568" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="116" rx="6" fill="#F2C14E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">RotNet: rotation is a rich signal</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Prior work showed that simply predicting an image's rotation</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">angle teaches a ConvNet surprisingly rich features.</text></g><g id="cue_s03_c3_natural_question_push_rotation_predi"><title>natural question push rotation prediction down patch level transformer learns</title><rect x="648" y="286" width="568" height="150" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="648" y="286" width="6" height="150" rx="6" fill="#34D3C0"/><text x="676" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The natural question</text><text x="676" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Can we push rotation prediction down to the patch level, so</text><text x="676" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">the transformer learns local features per patch as well as</text><text x="676" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">global structure for the whole image?</text></g><g id="cue_s03_c4_patch_level_signal_exactly_what_toke"><title>patch-level signal exactly what token-based built exploit</title><rect x="648" y="448" width="568" height="102" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="448" width="6" height="102" rx="6" fill="#48C78E"/><text x="676" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">A perfect fit for token models</text><text x="676" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">That patch-level signal is exactly what a token-based model</text><text x="676" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">is built to exploit.</text></g></svg>