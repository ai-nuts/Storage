<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Rotate, predict at two levels, then fine-tune</text><g id="cue_s05_c1_patchrot_works_follows_take_input"><title>patchrot works follows take input image either rotate whole image</title><rect x="64" y="158" width="568" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="200" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Step 1  ·  rotate</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Take an input image and either rotate the whole image, or</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rotate each patch independently, by a random multiple of</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">ninety degrees.</text><g transform="rotate(0 124.0 320.0)"><rect x="104" y="300" width="40" height="40" rx="3" fill="none" stroke="#4C9BE8" stroke-width="2"/><polygon points="118.0,304 130.0,304 124.0,294" fill="#4C9BE8"/></g><text x="124.0" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">0</text><g transform="rotate(90 234.0 320.0)"><rect x="214" y="300" width="40" height="40" rx="3" fill="none" stroke="#34D3C0" stroke-width="2"/><polygon points="228.0,304 240.0,304 234.0,294" fill="#34D3C0"/></g><text x="234.0" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">90</text><g transform="rotate(180 344.0 320.0)"><rect x="324" y="300" width="40" height="40" rx="3" fill="none" stroke="#F2C14E" stroke-width="2"/><polygon points="338.0,304 350.0,304 344.0,294" fill="#F2C14E"/></g><text x="344.0" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">180</text><g transform="rotate(270 454.0 320.0)"><rect x="434" y="300" width="40" height="40" rx="3" fill="none" stroke="#48C78E" stroke-width="2"/><polygon points="448.0,304 460.0,304 454.0,294" fill="#48C78E"/></g><text x="454.0" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">270</text><text x="534" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="middle">4-way</text><text x="534" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="middle">label</text></g><g id="cue_s05_c2_vision_transformer_trained_predict_t"><title>vision transformer trained predict these rotation angles simple four-way classification</title><rect x="64" y="374" width="568" height="176" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="374" width="6" height="176" rx="6" fill="#34D3C0"/><text x="92" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Step 2  ·  class token -&gt; image rotation</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The ViT predicts these angles as a simple four-way</text><text x="92" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">classification. The class token, which normally predicts</text><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the object class, is repurposed to predict the whole-image</text><text x="92" y="505" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rotation for global structure.</text></g><g id="cue_s05_c3_new_multilayer_perceptron_heads_atta"><title>new multilayer-perceptron heads attached patch token predict individual patch rotation</title><rect x="656" y="158" width="560" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="200" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Step 3  ·  patch heads + buffer gap</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">New MLP heads on each patch token predict that patch's</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rotation for local detail. Patches are cropped from a</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">larger grid so a buffer gap sits between them, and edge</text><text x="684" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">continuity can't leak the answer.</text><rect x="1046" y="300" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1086" y="300" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1126" y="300" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1046" y="340" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1086" y="340" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1126" y="340" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1046" y="380" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1086" y="380" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><rect x="1126" y="380" width="30" height="30" rx="2" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><text x="1091" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="middle">gap</text></g><g id="cue_s05_c4_happens_reduced_resolution_extra_pat"><title>happens reduced resolution extra patch heads removed network fine-tuned full</title><rect x="656" y="374" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="374" width="6" height="176" rx="6" fill="#48C78E"/><text x="684" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">Step 4  ·  reduced -&gt; full resolution</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Pretrain at reduced resolution; then remove the extra</text><text x="684" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">patch heads and fine-tune at full resolution on the real</text><text x="684" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">task, with positional embeddings interpolated to the</text><text x="684" y="505" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">larger patch count.</text></g></svg>