<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A simple rotation task, made for ViTs</text><g id="cue_s10_c1_takeaway_very_simple_idea_predicting"><title>takeaway very simple idea predicting rotation both whole image individual</title><rect x="64" y="176" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="116" rx="6" fill="#4C9BE8"/><circle cx="112" cy="234" r="10" fill="#4C9BE8"/><text x="150" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A very simple idea</text><text x="150" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Predicting the rotation of both the whole image and each individual patch turns out to</text><text x="150" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">be a self-supervised task perfectly suited to vision transformers.</text></g><g id="cue_s10_c2_because_class_token_learns_global"><title>because class token learns global structure patch heads learn local</title><rect x="64" y="308" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="116" rx="6" fill="#34D3C0"/><circle cx="112" cy="366" r="10" fill="#34D3C0"/><text x="150" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Global and local, no labels</text><text x="150" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The class token learns global structure and the patch heads learn local detail, so</text><text x="150" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">PatchRot builds rich features without any labels and reliably beats</text><text x="150" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">supervised-from-scratch and RotNet across four datasets, in transfer, and when labels</text><text x="150" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">are scarce.</text></g><g id="cue_s10_c3_lightweight_practical_recipe_pretrai"><title>lightweight practical recipe pretraining vision transformers limited</title><rect x="64" y="440" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="116" rx="6" fill="#48C78E"/><circle cx="112" cy="498" r="10" fill="#48C78E"/><text x="150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A practical recipe</text><text x="150" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It is a lightweight, practical recipe for pretraining vision transformers on limited</text><text x="150" y="542" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">data.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">PatchRot: A Self-Supervised Technique for Training Vision Transformers</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">NeurIPS 2022  ·  Chhabra, Dutta, Venkateswara, Li  ·  arXiv:2210.15722  ·  github.com/s-chh/PatchRot</text></svg>