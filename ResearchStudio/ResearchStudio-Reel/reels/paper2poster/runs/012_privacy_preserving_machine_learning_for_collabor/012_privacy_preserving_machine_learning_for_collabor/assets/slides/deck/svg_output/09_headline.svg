<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact in one place</text><g id="cue_s09_c1_few_numbers_capture_impact_across"><title>few numbers capture impact across all cases replacing raw features</title><rect x="64" y="166" width="1152" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="166" width="6" height="132" rx="6" fill="#48C78E"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Predictive power kept, data obfuscated</text><rect x="92" y="220" width="250" height="66" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="217.0" y="254.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.759999999999998" fill="#48C78E" font-weight="800" text-anchor="middle">&lt; 10 pp</text><text x="217.0" y="274.12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">performance drop vs raw</text><rect x="360" y="220" width="250" height="66" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="485.0" y="254.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.759999999999998" fill="#34D3C0" font-weight="800" text-anchor="middle">5-11%</text><text x="485.0" y="274.12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">autoencoder recon. error</text><rect x="630" y="220" width="586" height="66" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="650" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Across every use case, swapping raw features for shared latent codes cost</text><text x="650" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">under ten points of performance.</text></g><g id="cue_s09_c2_house_pricing_test_r_squared_fell"><title>house pricing test r-squared fell only ninety point two nine</title><rect x="64" y="314" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="314" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">House Pricing R-squared</text><rect x="92" y="368" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="202.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.799999999999997" fill="#9DB3C8" font-weight="800" text-anchor="middle">90.29%</text><text x="202.0" y="433.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">raw baseline</text><text x="324" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="370" y="368" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="480.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.799999999999997" fill="#34D3C0" font-weight="800" text-anchor="middle">89.33%</text><text x="480.0" y="433.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">two individual AEs</text></g><g id="cue_s09_c3_buzz_social_media_non_naive_shared"><title>buzz social media non-naive shared autoencoder reached ninety-four percent r-squared</title><rect x="656" y="314" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="314" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Buzz in Social Media R-squared</text><rect x="684" y="368" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="794.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.799999999999997" fill="#9DB3C8" font-weight="800" text-anchor="middle">96.19%</text><text x="794.0" y="433.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">raw baseline</text><text x="916" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="962" y="368" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1072.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.799999999999997" fill="#48C78E" font-weight="800" text-anchor="middle">94.03%</text><text x="1072.0" y="433.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">non-naive shared AE</text></g><g id="cue_s09_c4_shared_autoencoders_correctly_estima"><title>shared autoencoders correctly estimated between ninety-six ninety-eight percent observations per</title><rect x="64" y="480" width="1152" height="70" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="480" width="6" height="70" rx="6" fill="#34D3C0"/><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Faithful reconstructions</text><text x="92" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Shared autoencoders correctly estimate 96-98% of observations per feature, so the embeddings retain the data's core structure.</text></g></svg>