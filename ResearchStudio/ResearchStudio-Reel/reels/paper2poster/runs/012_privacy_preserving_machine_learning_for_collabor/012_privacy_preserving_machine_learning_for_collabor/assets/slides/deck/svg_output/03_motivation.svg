<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Existing privacy tools each fall short</text><g id="cue_s03_c1_academia_industry_built_several_priv"><title>academia industry built several privacy-preserving strategies but limits encryption approaches</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Encryption: strong but heavy</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Encryption approaches like homomorphic encryption offer</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">strong security, yet are hard to deploy in real settings</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">because of their technology requirements.</text><rect x="92" y="308" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344.0" y="329.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">strong security  vs  hard, costly deployment</text></g><g id="cue_s03_c2_federated_learning_decentralizes_acr"><title>federated learning decentralizes across devices but assumes every peer holds</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#F2685C"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Federated learning: same features only</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Federated learning decentralizes training across devices,</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">but assumes every peer holds the same kind of information,</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">so it cannot handle peers with different features.</text><text x="92" y="528" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2685C" font-weight="800" text-anchor="start">different feature sets  -&gt;  federated setup breaks</text></g><g id="cue_s03_c3_differential_privacy_masks_individua"><title>differential privacy masks individual values adding noise which significantly reduce</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#F2C14E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Noise and linear projection distort</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Differential privacy masks values by adding noise, which</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">can significantly reduce data utility.</text><rect x="676" y="272" width="512" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="287.0" r="5" fill="#F2C14E"/><text x="710" y="293.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">Differential privacy: noise cuts utility</text><rect x="676" y="308" width="512" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="323.0" r="5" fill="#F2C14E"/><text x="710" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">PCA: linear, loses nonlinear relationships</text></g><g id="cue_s03_c4_these_gaps_motivate_new_approach"><title>these gaps motivate new approach deep representation learning encode while</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#34D3C0"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The opening: deep representations</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">These gaps motivate a new approach: use deep</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">representation learning to encode the data while keeping</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">its predictive structure intact.</text><polygon points="676,506 743.0,521.0 743.0,531.0 676,546" fill="#123049" stroke="#34D3C0" stroke-width="1.6"/><polygon points="826,506 759.0,521.0 759.0,531.0 826,546" fill="#123049" stroke="#34D3C0" stroke-width="1.6"/><rect x="743.0" y="521.0" width="16" height="10" rx="3" fill="#34D3C0"/><text x="844" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="start">nonlinear encoder preserves structure</text></g></svg>