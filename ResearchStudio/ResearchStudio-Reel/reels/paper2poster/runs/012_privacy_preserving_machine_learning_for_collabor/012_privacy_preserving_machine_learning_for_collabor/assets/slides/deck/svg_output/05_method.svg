<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Encode, share the code, then join and train</text><g id="cue_s05_c1_framework_inserts_one_extra_step"><title>framework inserts one extra step usual data-sharing pipeline instead merging</title><rect x="64" y="158" width="568" height="204" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="204" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">One extra step before sharing</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of merging raw datasets, each peer first passes its</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">features through an autoencoder to obtain an obfuscated</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">latent representation, ready to share.</text><polygon points="92,300 174.0,321.0 174.0,331.0 92,352" fill="#123049" stroke="#4C9BE8" stroke-width="1.6"/><polygon points="272,300 190.0,321.0 190.0,331.0 272,352" fill="#123049" stroke="#4C9BE8" stroke-width="1.6"/><rect x="174.0" y="321.0" width="16" height="10" rx="3" fill="#34D3C0"/><path d="M 177.6 303.3 v -3.5999999999999996 a 3.9000000000000004 3.9000000000000004 0 0 1 7.800000000000001 0 v 3.5999999999999996" fill="none" stroke="#34D3C0" stroke-width="2.2"/><rect x="174.0" y="303.3" width="15" height="9.3" rx="2.5" fill="#34D3C0"/><circle cx="181.5" cy="307.95" r="1.65" fill="#0B1B2B"/><text x="92" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">N</text><text x="272" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">N</text><text x="182.0" y="346.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#34D3C0" font-weight="800" text-anchor="middle">z (M)</text><text x="140.6" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="middle">encoder f</text><text x="223.4" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="middle">decoder g</text><rect x="304" y="306" width="300" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="454.0" y="332.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">z = f(x)   share z, not x</text></g><g id="cue_s05_c2_peers_join_these_representations_sha"><title>peers join these representations shared observation train single supervised combined</title><rect x="64" y="378" width="568" height="172" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#34D3C0"/><text x="92" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Join by a shared ID, train once</text><text x="92" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Peers join their representations by a shared observation ID</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">and train a single supervised model on the combined</text><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">embeddings to predict the target.</text><rect x="92" y="506" width="512" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="530.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">[ z_A | z_B ]  -&gt;  one shared predictor</text></g><g id="cue_s05_c3_autoencoder_fixed_across_all_experim"><title>autoencoder fixed across all experiments conclusions reflect framework not network</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">A single fixed autoencoder</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The same autoencoder is used across every experiment, so</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">conclusions reflect the framework, not network tuning: a</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">four-layer encoder down to size M, mirrored back to N.</text><rect x="684" y="312" width="504" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="337.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">N -&gt; 128 -&gt; 64 -&gt; 40 -&gt; M  -&gt;  40 -&gt; 64 -&gt; 128 -&gt; N</text></g><g id="cue_s05_c4_every_layer_relu_loss_mean"><title>every layer relu loss mean absolute error adam optimizer learning</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#48C78E"/><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#48C78E" font-weight="800" text-anchor="start">Training recipe, and a non-naive twist</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">ReLU layers, Mean Absolute Error loss, Adam. In non-naive</text><text x="684" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">scenarios the autoencoder is multitask, also predicting the</text><text x="684" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">target, so encoding is task-guided.</text><rect x="684" y="510" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="533.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#EAF2FB" font-weight="800" text-anchor="middle">min (1/n) sum ||x - g(f(x))||_1   ReLU · MAE · Adam 1e-4</text></g></svg>