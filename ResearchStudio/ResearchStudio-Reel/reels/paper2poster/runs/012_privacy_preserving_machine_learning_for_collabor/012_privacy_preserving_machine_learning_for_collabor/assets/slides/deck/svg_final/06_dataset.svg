<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three public sets, two task types</text><g id="cue_s06_c1_test_framework_under_realistic_varie"><title>test framework under realistic varied conditions authors chose three public</title><rect x="64" y="158" width="560" height="212" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="212" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Three public datasets</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Chosen to test the framework under realistic and varied</text><text x="92" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">conditions. First, House Pricing predicts house price in</text><text x="92" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">US dollars.</text><rect x="92" y="286" width="504" height="70" rx="10" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><rect x="92" y="286" width="5" height="70" rx="2" fill="#4C9BE8"/><text x="110" y="311" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">House Pricing</text><text x="110" y="331" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">21,613 observations</text><text x="110" y="349" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">12 features</text><text x="580" y="311" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#4C9BE8" font-weight="800" text-anchor="end">regression</text></g><g id="cue_s06_c2_mnist_numbers_thirty_five_thousand_o"><title>mnist numbers thirty-five thousand observations seven hundred eighty-four features treated</title><rect x="656" y="158" width="560" height="212" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="212" rx="6" fill="#34D3C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">A large-feature and a large-sample set</text><rect x="684" y="214" width="504" height="70" rx="10" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><rect x="684" y="214" width="5" height="70" rx="2" fill="#34D3C0"/><text x="702" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">MNIST Numbers</text><text x="702" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">35,000 observations</text><text x="702" y="277" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">784 features (tabular)</text><text x="1172" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#34D3C0" font-weight="800" text-anchor="end">10-class</text><rect x="684" y="292" width="504" height="70" rx="10" fill="#16324A" stroke="#F2C14E" stroke-width="1.5"/><rect x="684" y="292" width="5" height="70" rx="2" fill="#F2C14E"/><text x="702" y="317" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">Buzz in Social Media</text><text x="702" y="337" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">87,488 observations</text><text x="702" y="355" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">77 features</text><text x="1172" y="317" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="end">regression</text></g><g id="cue_s06_c3_together_they_cover_regression_class"><title>together they cover regression classification small large feature sets different</title><rect x="64" y="388" width="1152" height="74" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="388" width="6" height="74" rx="6" fill="#34D3C0"/><text x="92" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Deliberately varied</text><text x="238" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Together they cover regression and classification, small and large feature sets, and different</text><text x="238" y="433" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">feature types, probing how robust and scalable the encoding is.</text></g><g id="cue_s06_c4_all_experiments_ran_modest_setup"><title>all experiments ran modest setup two-core intel xeon cpu 2.3</title>