<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Obfuscate the data, keep the accuracy</text><g id="cue_s07_c1_central_finding_sharing_encoded_repr"><title>central finding sharing encoded representations instead raw features barely hurts</title><rect x="64" y="158" width="1152" height="110" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="110" rx="6" fill="#48C78E"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Encoded representations barely hurt performance</text><rect x="92" y="204" width="240" height="52" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="212.0" y="231.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.72" fill="#48C78E" font-weight="800" text-anchor="middle">&lt; 10 pp</text><text x="212.0" y="246.64" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="middle">drop vs raw features</text><rect x="352" y="204" width="864" height="52" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="372" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">The central finding: sharing encoded representations instead of raw features barely changes</text><text x="372" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">downstream accuracy, while the data stays obfuscated.</text></g><g id="cue_s07_c2_house_pricing_raw_data_baseline_reac"><title>house pricing raw-data baseline reaches test r-squared about ninety percent</title><rect x="64" y="284" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="284" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#4C9BE8" font-weight="800" text-anchor="start">House Pricing: an almost negligible drop</text><rect x="300" y="346" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="346" width="225" height="22" rx="6" fill="#48C78E"/><text x="288" y="363.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">raw baseline</text><text x="535" y="363.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#48C78E" font-weight="800" text-anchor="start">90.29% R2</text><rect x="300" y="378" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="378" width="223" height="22" rx="6" fill="#34D3C0"/><text x="288" y="395.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">two AEs (Sc. 2)</text><text x="533" y="395.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="start">89.33% R2</text><text x="300" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="start">obfuscated data, near-identical R-squared</text></g><g id="cue_s07_c3_buzz_social_media_baseline_r_squared"><title>buzz social media baseline r-squared around ninety-six percent encoded scenarios</title><rect x="656" y="284" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="284" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F2C14E" font-weight="800" text-anchor="start">Buzz and MNIST hold up too</text><rect x="864" y="338" width="300" height="18" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="864" y="338" width="288" height="18" rx="6" fill="#9DB3C8"/><text x="852" y="352.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">Buzz raw R2</text><text x="1162" y="352.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="800" text-anchor="start">96.19%</text><rect x="864" y="362" width="300" height="18" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="864" y="362" width="273" height="18" rx="6" fill="#34D3C0"/><text x="852" y="376.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">Buzz encoded</text><text x="1147" y="376.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="start">~89-91%</text><rect x="864" y="386" width="300" height="18" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="864" y="386" width="276" height="18" rx="6" fill="#9DB3C8"/><text x="852" y="400.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">MNIST raw acc</text><text x="1150" y="400.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="800" text-anchor="start">92%</text><rect x="864" y="410" width="300" height="18" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="864" y="410" width="255" height="18" rx="6" fill="#F2C14E"/><text x="852" y="424.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">MNIST encoded</text><text x="1129" y="424.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#F2C14E" font-weight="800" text-anchor="start">mid-80s</text></g><g id="cue_s07_c4_importantly_non_naive_multitask_scen"><title>importantly non-naive multitask scenarios where autoencoder guided target variable recover</title><rect x="64" y="450" width="1152" height="100" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="450" width="6" height="100" rx="6" fill="#F2C14E"/><text x="92" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Guiding the latent space recovers much of the gap</text><text x="92" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">The non-naive multitask scenarios, where the autoencoder is guided by the target variable, recover most of the</text><text x="92" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">small loss, showing task-shaped codes help.</text></g></svg>