<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Complementary data that cannot be combined</text><g id="cue_s02_c1_common_real_world_situation_two_comp"><title>common real-world situation two companies hold different set variables about</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Two peers, one user base</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Two companies each hold a different set of</text><text x="92" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">variables about the same users. Combining</text><text x="92" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">features would predict a shared target far</text><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">more accurately.</text><rect x="92" y="350" width="168" height="110" rx="10" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><rect x="92" y="350" width="5" height="110" rx="2" fill="#34D3C0"/><text x="108" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Peer A</text><text x="108" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="start">age, income,</text><text x="108" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="start">spend history,</text><text x="108" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="start">location ...</text><rect x="268" y="350" width="168" height="110" rx="10" fill="#16324A" stroke="#F2C14E" stroke-width="1.5"/><rect x="268" y="350" width="5" height="110" rx="2" fill="#F2C14E"/><text x="284" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Peer B</text><text x="284" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="start">app usage,</text><text x="284" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="start">device, tenure,</text><text x="284" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="start">credit ...</text><text x="264" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">same users  -&gt;  richer target prediction</text></g><g id="cue_s02_c2_but_sensitive_privacy_policies_intel"><title>but sensitive privacy policies intellectual property laws forbid handing over</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">But the raw data is sensitive</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Privacy policies and intellectual property laws forbid handing</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">over the raw features, even when the channel between peers is</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">secure.</text><text x="528" y="296" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2685C" font-weight="800" text-anchor="start">secure channel is not enough  -&gt;  raw features stay locked away</text></g><g id="cue_s02_c3_collaboration_cancelled_potential_bo"><title>collaboration cancelled potential boost performance lost</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F2C14E"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">So the collaboration is cancelled</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Without a way to share, the partnership stops and the potential boost in</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">model performance is lost.</text></g><g id="cue_s02_c4_core_problem_tackles_how_let"><title>core problem tackles how let such peers share their information</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#34D3C0"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The core question</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">How can peers share their information and keep the predictive power of the</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">original features, without ever exposing the raw data?</text></g></svg>