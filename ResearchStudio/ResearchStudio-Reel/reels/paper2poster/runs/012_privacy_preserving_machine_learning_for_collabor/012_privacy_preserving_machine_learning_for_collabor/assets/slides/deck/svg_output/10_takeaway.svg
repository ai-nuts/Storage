<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Share the code, keep the data private</text><g id="cue_s10_c1_takeaway_simple_instead_exchanging_r"><title>takeaway simple instead exchanging raw sensitive collaborating organizations share latent-space</title><rect x="64" y="170" width="1152" height="90" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="170" width="6" height="90" rx="6" fill="#4C9BE8"/><circle cx="112" cy="215" r="10" fill="#4C9BE8"/><text x="150" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Share codes, not raw data</text><text x="150" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of exchanging raw sensitive data, collaborating organizations can share the latent-space</text><text x="150" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">embeddings produced by autoencoders.</text></g><g id="cue_s10_c2_keeps_original_features_private_yet"><title>keeps original features private yet preserves most predictive power performance</title><rect x="64" y="272" width="1152" height="90" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="272" width="6" height="90" rx="6" fill="#34D3C0"/><circle cx="112" cy="317" r="10" fill="#34D3C0"/><text x="150" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Private, yet still accurate</text><text x="150" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">This keeps the original features private while preserving most of the predictive power, dropping</text><text x="150" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">under ten points across three benchmarks.</text></g><g id="cue_s10_c3_making_autoencoder_aware_downstream"><title>making autoencoder aware downstream task narrows gap even further</title><rect x="64" y="374" width="1152" height="90" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="374" width="6" height="90" rx="6" fill="#48C78E"/><circle cx="112" cy="419" r="10" fill="#48C78E"/><text x="150" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Make the encoder task-aware</text><text x="150" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Making the autoencoder aware of the downstream task, the non-naive variant, narrows the small</text><text x="150" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">remaining gap even further.</text></g><g id="cue_s10_c4_authors_point_custom_per_dataset_aut"><title>authors point custom per-dataset autoencoders formal measures privacy strength next</title><rect x="64" y="476" width="1152" height="90" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="476" width="6" height="90" rx="6" fill="#F2C14E"/><circle cx="112" cy="521" r="10" fill="#F2C14E"/><text x="150" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">What comes next</text><text x="150" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Custom per-dataset autoencoders and formal measures of privacy strength are the next steps</text><text x="150" y="560" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">toward real organizational deployment.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><polygon points="84,612 146.0,629.0 146.0,639.0 84,656" fill="#123049" stroke="#34D3C0" stroke-width="1.6"/><polygon points="224,612 162.0,629.0 162.0,639.0 224,656" fill="#123049" stroke="#34D3C0" stroke-width="1.6"/><rect x="146.0" y="629.0" width="16" height="10" rx="3" fill="#34D3C0"/><path d="M 149.6 611.3 v -3.5999999999999996 a 3.9000000000000004 3.9000000000000004 0 0 1 7.800000000000001 0 v 3.5999999999999996" fill="none" stroke="#34D3C0" stroke-width="2.2"/><rect x="146.0" y="611.3" width="15" height="9.3" rx="2.5" fill="#34D3C0"/><circle cx="153.5" cy="615.9499999999999" r="1.65" fill="#0B1B2B"/><text x="1216" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Privacy-Preserving ML via Auto-encoder Latent Embeddings  ·  NeurIPS 2022</text></svg>