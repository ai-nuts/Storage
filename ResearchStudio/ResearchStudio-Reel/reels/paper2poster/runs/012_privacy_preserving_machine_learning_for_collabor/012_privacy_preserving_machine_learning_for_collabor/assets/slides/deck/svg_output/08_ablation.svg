<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Five scenarios isolate each choice</text><g id="cue_s08_c1_experiments_organized_ablation_acros"><title>experiments organized ablation across five scenarios isolate design decision</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">An ablation over five scenarios</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The experiments are organized as an ablation across five</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">scenarios that isolate each design decision, from no</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">privacy to task-guided encoding.</text><rect x="92" y="272" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="286.0" r="5" fill="#4C9BE8"/><text x="126" y="292.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">Scenario 0  -&gt;  Scenario 4</text></g><g id="cue_s08_c2_scenario_zero_raw_data_baseline_priv"><title>scenario zero raw-data baseline privacy protection scenario one single shared</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Naive scenarios 0 to 2</text><rect x="92" y="384" width="504" height="30" rx="7" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="384" width="34" height="30" rx="7" fill="#9DB3C8"/><text x="109" y="404.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0B1B2B" font-weight="800" text-anchor="middle">S0</text><text x="136" y="404.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Raw-data baseline, no privacy protection</text><rect x="92" y="422" width="504" height="30" rx="7" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="422" width="34" height="30" rx="7" fill="#4C9BE8"/><text x="109" y="442.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0B1B2B" font-weight="800" text-anchor="middle">S1</text><text x="136" y="442.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Single shared autoencoder on one combined set</text><rect x="92" y="460" width="504" height="30" rx="7" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="460" width="34" height="30" rx="7" fill="#34D3C0"/><text x="109" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0B1B2B" font-weight="800" text-anchor="middle">S2</text><text x="136" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Two peers, individual AEs, embeddings joined</text><text x="92" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="start">each step adds obfuscation while sharing latent codes</text></g><g id="cue_s08_c3_scenarios_three_four_repeat_one"><title>scenarios three four repeat one two but make autoencoder non-naive</title><rect x="656" y="158" width="560" height="150" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Non-naive scenarios 3 and 4</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Scenarios 3 and 4 repeat 1 and 2 but make the autoencoder</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">multitask, also predicting the objective. The non-naive</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">variants beat their naive counterparts.</text></g><g id="cue_s08_c4_buzz_social_media_test_r_squared"><title>buzz social media test r-squared rises about ninety-one half percent</title><rect x="656" y="324" width="560" height="226" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="324" width="6" height="226" rx="6" fill="#48C78E"/><text x="684" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">Task-guided codes lift the numbers</text><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Guiding the latent space with the target clearly helps</text><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">across datasets.</text><rect x="892" y="436" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="436" width="274" height="20" rx="6" fill="#9DB3C8"/><text x="880" y="452.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">Buzz R2 (S1)</text><text x="1176" y="452.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="800" text-anchor="start">91.55%</text><rect x="892" y="466" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="466" width="282" height="20" rx="6" fill="#48C78E"/><text x="880" y="482.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">Buzz R2 (S3)</text><text x="1184" y="482.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#48C78E" font-weight="800" text-anchor="start">94.03%</text><rect x="892" y="496" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="496" width="273" height="20" rx="6" fill="#34D3C0"/><text x="880" y="512.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="end">MNIST acc S1-&gt;S3</text><text x="1175" y="512.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="start">88% -&gt; 91%</text></g></svg>