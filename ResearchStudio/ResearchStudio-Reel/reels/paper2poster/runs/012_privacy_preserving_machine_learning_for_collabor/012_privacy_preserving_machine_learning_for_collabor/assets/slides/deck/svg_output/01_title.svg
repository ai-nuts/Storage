<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">NeurIPS 2022</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">Los Andes University  ·  Rappi  ·  Amazon</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">Privacy-Preserving Machine Learning</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">for Collaborative Data Sharing</text><text x="64" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#4C9BE8" font-weight="800" text-anchor="start">via Auto-encoder Latent Space Embeddings</text><polygon points="958,132 1062.0,172.32 1062.0,187.68 958,228" fill="#123049" stroke="#4C9BE8" stroke-width="1.6"/><polygon points="1182,132 1078.0,172.32 1078.0,187.68 1182,228" fill="#123049" stroke="#4C9BE8" stroke-width="1.6"/><rect x="1062.0" y="172.32" width="16" height="15.36" rx="3" fill="#34D3C0"/><path d="M 1065.6 154.62 v -3.5999999999999996 a 3.9000000000000004 3.9000000000000004 0 0 1 7.800000000000001 0 v 3.5999999999999996" fill="none" stroke="#34D3C0" stroke-width="2.2"/><rect x="1062.0" y="154.62" width="15" height="9.3" rx="2.5" fill="#34D3C0"/><circle cx="1069.5" cy="159.27" r="1.65" fill="#0B1B2B"/><text x="958" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">N</text><text x="1182" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">N</text><text x="1070.0" y="202.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#34D3C0" font-weight="800" text-anchor="middle">z (M)</text><text x="1018.48" y="126" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="middle">encoder f</text><text x="1121.52" y="126" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="middle">decoder g</text><text x="64" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Ana Maria Quintero Ossa  ·  Jesus Solano  ·  Hernan Garcia  ·  David Zarruk  ·  Alejandro Correa-Bahnsen  ·  Carlos Valencia</text><g id="cue_s01_c1_organizations_increasingly_want_pool"><title>organizations increasingly want pool their build better machine learning models</title><rect x="64" y="300" width="276" height="228" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="300" width="276" height="6" rx="6" fill="#F2C14E"/><text x="88" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F2C14E" font-weight="800" text-anchor="start">raw  ✕</text><text x="88" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Pooling data is blocked</text><text x="88" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Organizations want to pool data</text><text x="88" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">for better models, but privacy and</text><text x="88" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">IP laws make raw sharing</text><text x="88" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">impossible.</text></g><g id="cue_s01_c2_introduces_privacy_preserving_framew"><title>introduces privacy-preserving framework autoencoders turn sensitive tabular obfuscated latent-space embeddings</title><rect x="356" y="300" width="276" height="228" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="300" width="276" height="6" rx="6" fill="#4C9BE8"/><path d="M 388.24 348.92 v -6.24 a 6.76 6.76 0 0 1 13.52 0 v 6.24" fill="none" stroke="#4C9BE8" stroke-width="2.2"/><rect x="382" y="348.92" width="26" height="16.12" rx="2.5" fill="#4C9BE8"/><circle cx="395.0" cy="356.98" r="2.86" fill="#0B1B2B"/><text x="380" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Autoencoder embeddings</text><text x="380" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A framework uses autoencoders to</text><text x="380" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">turn sensitive tabular data into</text><text x="380" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">obfuscated latent-space</text><text x="380" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">embeddings.</text></g><g id="cue_s01_c3_instead_exchanging_raw_features_coll"><title>instead exchanging raw features collaborating peers share only these encoded</title><rect x="648" y="300" width="276" height="228" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="300" width="276" height="6" rx="6" fill="#34D3C0"/><polygon points="674,334 726.0,355.0 726.0,365.0 674,386" fill="#123049" stroke="#34D3C0" stroke-width="1.6"/><polygon points="794,334 742.0,355.0 742.0,365.0 794,386" fill="#123049" stroke="#34D3C0" stroke-width="1.6"/><rect x="726.0" y="355.0" width="16" height="10" rx="3" fill="#34D3C0"/><path d="M 729.6 337.3 v -3.5999999999999996 a 3.9000000000000004 3.9000000000000004 0 0 1 7.800000000000001 0 v 3.5999999999999996" fill="none" stroke="#34D3C0" stroke-width="2.2"/><rect x="726.0" y="337.3" width="15" height="9.3" rx="2.5" fill="#34D3C0"/><circle cx="733.5" cy="341.95" r="1.65" fill="#0B1B2B"/><text x="672" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Share codes, not features</text><text x="672" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Peers share only these encoded</text><text x="672" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">representations, then join them to</text><text x="672" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">train a shared downstream model.</text></g><g id="cue_s01_c4_across_three_public_benchmarks_encod"><title>across three public benchmarks encoded preserves predictive power performance dropping</title><rect x="940" y="300" width="276" height="228" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="300" width="276" height="6" rx="6" fill="#48C78E"/><text x="964" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="start">&lt; 10 pp</text><text x="964" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Under 10 pp drop</text><text x="964" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Across three public benchmarks,</text><text x="964" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">encoded data preserves predictive</text><text x="964" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">power while the raw features stay</text><text x="964" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">hidden.</text></g><line x1="64" y1="562" x2="1216" y2="562" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="598" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2211.05717</text><text x="1216" y="598" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Share the latent embedding, keep the raw data private.</text></svg>