<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One survey, one framework, broad tests</text><g id="cue_s04_c1_makes_three_main_contributions"><title>makes three main contributions</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#4C9BE8" font-weight="800" text-anchor="middle">3</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Three</text><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">contributions</text><text x="88" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The paper makes three main</text><text x="88" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">contributions toward practical</text><text x="88" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">privacy-preserving</text><text x="88" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">collaboration.</text></g><g id="cue_s04_c2_first_reviews_existing_privacy_prese"><title>first reviews existing privacy-preserving machine learning approaches expose their limitations</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="410" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="410" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F2C14E" font-weight="800" text-anchor="middle">1</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Survey the gaps</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Reviews existing</text><text x="384" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">privacy-preserving machine</text><text x="384" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">learning approaches to expose</text><text x="384" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">their limitations and the room</text><text x="384" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">to improve.</text></g><g id="cue_s04_c3_second_proposes_concrete_framework_w"><title>second proposes concrete framework which peer trains autoencoder shares only</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="706" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="706" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The framework</text><text x="680" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Each peer trains an</text><text x="680" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">autoencoder, shares only the</text><text x="680" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">latent representation, and</text><text x="680" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">joins the embeddings to train a</text><text x="680" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">shared supervised model.</text></g><g id="cue_s04_c4_third_validates_framework_three_publ"><title>third validates framework three public datasets spanning regression classification across</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="1002" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#48C78E" font-weight="800" text-anchor="middle">3</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Broad validation</text><text x="976" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Validated on three public</text><text x="976" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">datasets, spanning regression</text><text x="976" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and classification, across five</text><text x="976" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">scenarios up to non-naive</text><text x="976" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">multitask autoencoders.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Encode with an autoencoder, share only the code, then join and train, no raw features ever leave a peer.</text></svg>