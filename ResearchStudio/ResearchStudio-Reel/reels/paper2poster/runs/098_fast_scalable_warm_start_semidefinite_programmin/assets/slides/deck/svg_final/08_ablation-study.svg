<g id="cue_s08_c3_second_parameters_number_current_eig">
  <title>second parameters number current eigenvectors matters lot larger values give</title>
  <desc>Second parameters number current eigenvectors kc matters larger better convergence fixed one.</desc>
<rect x="676" y="240" width="548" height="138" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="698" y="278" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="16" font-weight="700" fill="#4F9DF7" text-anchor="start">k_c  current eigenvectors</text>
<text x="698" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Matters a lot — larger values give</text>
<text x="698" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">better convergence.</text>
<text x="698" y="360" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#6E85AC" text-anchor="start">vs. original method fixed at k_c = 1</text>
</g>
<g id="cue_s08_c4_number_past_spectral_vectors_turns">
  <title>number past spectral vectors turns out much less helpful sometimes</title>
  <desc>Number past spectral vectors kp less helpful can even harm keep kc large kp small.</desc>
