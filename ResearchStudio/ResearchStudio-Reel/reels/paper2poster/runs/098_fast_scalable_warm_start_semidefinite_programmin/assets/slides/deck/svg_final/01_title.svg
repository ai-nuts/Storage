<text x="72" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="1.5">ICML 2024</text>
<text x="72" y="660" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="500" fill="#6E85AC" text-anchor="start">arXiv:2312.11801    ·    github.com/rangell/usbs</text>
