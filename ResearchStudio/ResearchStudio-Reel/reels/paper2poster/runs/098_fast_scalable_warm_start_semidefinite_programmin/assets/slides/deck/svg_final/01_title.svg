  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<g id="cue_s01_c1_semidefinite_programming_powerful_to">
  <title>semidefinite programming powerful tool combinatorial optimization but long been considered</title>
  <desc>SDP is a powerful tool for combinatorial optimization but considered too expensive.</desc>
<rect x="72" y="96" width="6" height="30" rx="2.5" fill="#4F9DF7" />
<text x="92" y="108" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="2.5">SEMIDEFINITE PROGRAMMING · COMBINATORIAL OPTIMIZATION</text>
<text x="92" y="138" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#A6BADB" text-anchor="start">Powerful in theory, long dismissed as too expensive at real-world scale.</text>
</g>
<text x="72" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="800" fill="#EAF1FB" text-anchor="start">Fast, Scalable, Warm-Start</text>
<text x="72" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="800" fill="#EAF1FB" text-anchor="start">Semidefinite Programming</text>
<text x="72" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="500" fill="#A6BADB" text-anchor="start">with Spectral Bundling and Sketching</text>
<g id="cue_s01_c2_introduces_usbs_unified_spectral_bun">
  <title>introduces usbs unified spectral bundling sketching provably correct solver fast</title>
  <desc>USBS: unified spectral bundling with sketching, provably correct, warm-start.</desc>
<rect x="72" y="356" width="620" height="128" rx="16" ry="16" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="92" y="380" width="6" height="80" rx="2.5" fill="#37DCC0" />
<text x="112" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="800" fill="#37DCC0" text-anchor="start">USBS</text>
<text x="210" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FB" text-anchor="start">Unified Spectral Bundling with Sketching</text>
<text x="112" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">A provably correct solver that is fast, scales to billions of</text>
<text x="112" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">decision variables, and reuses a previous solution as a warm start.</text>
</g>
<g id="cue_s01_c3_maxcut_instance_over_two_billion">
  <title>maxcut instance over two billion variables usbs delivers five-hundred-times speedup</title>
  <desc>MaxCut instance over two billion variables 500x speedup warm start.</desc>
<rect x="736" y="356" width="472" height="128" rx="16" ry="16" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.4" />
<text x="772" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="62" font-weight="800" fill="url(#warmg)" text-anchor="start">500</text>
<text x="902" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="700" fill="#F7B84B" text-anchor="start">×</text>
<text x="940" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">faster than the prior</text>
<text x="940" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">state of the art (CGAL)</text>
<text x="772" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="500" fill="#EAF1FB" text-anchor="start">on a MaxCut instance with over 2 billion decision variables</text>
</g>
<line x1="72" y1="536" x2="1208" y2="536" stroke="#2B4068" stroke-width="1.2" />
