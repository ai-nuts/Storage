<text x="700" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="1.5">2-BILLION-VARIABLE INSTANCE</text>
<text x="700" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="56" font-weight="800" fill="url(#warmg)" text-anchor="start">500×</text>
