<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">METHOD</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="800" fill="#EAF1FB" text-anchor="start">A proximal spectral bundle method</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">05 / 10</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s05_c1_how_usbs_works_starts_dual">
  <title>how usbs works starts dual semidefinite program rewrites single unconstrained</title>
  <desc>How USBS works starts from dual semidefinite program rewrites penalized objective largest eigenvalue.</desc>
<rect x="56" y="160" width="1168" height="116" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="76" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start">Rewrite the dual SDP as one unconstrained penalized objective</text>
<text x="76" y="238" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="27" font-weight="700" fill="#EAF1FB" text-anchor="start">f(y) = α·[ λₘₐₓ(C − 𝒜*y) ]₊ + ⟨ b, y ⟩ + ι_Y(y)</text>
</g>
<g id="cue_s05_c2_penalized_objective_minimized_proxim">
  <title>penalized objective minimized proximal bundle method iteration instead full objective</title>
  <desc>Penalized objective minimized proximal bundle method low-dimensional subspace eigenvectors.</desc>
<rect x="56" y="298" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="78" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4F9DF7" text-anchor="start">1  Build a cheap model</text>
<text x="78" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Minimize with a proximal bundle</text>
<text x="78" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">method: build a lower model over a</text>
<text x="78" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">low-dimensional subspace of current</text>
<text x="78" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">and past eigenvectors.</text>
<rect x="78" y="460" width="330.6666666666667" height="34" rx="9" ry="9" fill="#0E1A30" />
<text x="92" y="482" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5" font-weight="600" fill="#37DCC0" text-anchor="start">Vₜ = k_c current ⊕ k_p past</text>
</g>
<g id="cue_s05_c3_proposes_candidate_iterate_taking_pr">
  <title>proposes candidate iterate taking proximal step against solving small minimax</title>
  <desc>Proposes candidate iterate taking proximal step model small minimax problem.</desc>
<rect x="452.6666666666667" y="298" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="474.6666666666667" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4F9DF7" text-anchor="start">2  Propose a step</text>
<text x="474.6666666666667" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Take a proximal step against the</text>
<text x="474.6666666666667" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">model, solving a small minimax</text>
<text x="474.6666666666667" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">problem for the candidate iterate.</text>
<rect x="474.6666666666667" y="450" width="330.6666666666667" height="44" rx="9" ry="9" fill="#0E1A30" />
<text x="488.6666666666667" y="478" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13" font-weight="600" fill="#EAF1FB" text-anchor="start">ỹₜ₊₁ = argmin f̂ₜ(y) + ½ρ‖y−yₜ‖²</text>
</g>
<g id="cue_s05_c4_because_only_small_set_eigenvectors">
  <title>because only small set eigenvectors optionally low-rank sketch primal matrix</title>
  <desc>Because only small set eigenvectors optionally low-rank sketch primal matrix scales enormous.</desc>
<rect x="849.3333333333334" y="298" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="871.3333333333334" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4F9DF7" text-anchor="start">3  Accept or refine</text>
<text x="871.3333333333334" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Descent step if the true decrease</text>
<text x="871.3333333333334" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">clears a fraction of the model&#x27;s;</text>
<text x="871.3333333333334" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">else a null step that still refines</text>
<text x="871.3333333333334" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">it.</text>
<rect x="871.3333333333334" y="450" width="330.6666666666667" height="44" rx="9" ry="9" fill="#14261F" stroke="#57D9A3" stroke-width="1.1" />
<text x="885.3333333333334" y="478" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#57D9A3" text-anchor="start">few eigenvectors + sketch → scale</text>
</g>
</svg>
