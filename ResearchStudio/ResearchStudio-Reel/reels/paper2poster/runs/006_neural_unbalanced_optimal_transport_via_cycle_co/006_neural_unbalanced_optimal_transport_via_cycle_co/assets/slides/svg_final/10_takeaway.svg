<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#12172A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="deco_head">
  <rect x="80" y="62" width="40" height="4" fill="#2453D6" />
  <text x="132" y="72" font-size="14" fill="#2453D6" font-weight="bold" letter-spacing="2">10 · TAKEAWAY</text>
  <text x="80" y="120" font-size="32" fill="#12172A" font-weight="bold">Model cell birth and death, don't assume mass is fixed</text>
  <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s10_c1_takeaway_unbalanced_optimal_transpor">
    <title>takeaway unbalanced optimal transport made both practical biologically faithful</title>
    <desc>The takeaway is that unbalanced optimal transport can be made both practical and biologically faithful.</desc>
  <rect x="80" y="182" width="1120" height="120" fill="#E7EEFF" rx="12" stroke="#C6D6FB" stroke-width="1" />
  <rect x="80" y="182" width="6" height="120" fill="#2453D6" rx="3" />
  <text x="108" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">BOTTOM LINE</text>
  <text x="108" y="268" font-size="26" fill="#2453D6" font-weight="bold">Unbalanced OT can be both practical and biologically faithful</text>
  <text x="108" y="296" font-size="15" fill="#5A6675">learnable semi-couplings + cycle-consistent training</text>
  </g>

  <g id="cue_s10_c2_reformulating_through_learnable_semi">
    <title>reformulating through learnable semi-couplings maps reweighting functions cycle-consistent alternating scheme</title>
    <desc>By reformulating it through learnable semi-couplings, and training the maps and reweighting functions with a cycle-consistent alternating scheme, NubOT simultaneously predicts the movement and the creation or destruction of mass at the level of individual cells.</desc>
  <rect x="80" y="320" width="552" height="318" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="80" y="320" width="6" height="318" fill="#0E9E8F" rx="3" />
  <text x="108" y="358" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">HOW</text>
  <text x="108" y="392" font-size="18" fill="#0E9E8F" font-weight="bold">Move and reweight, together</text>
  <text x="108" y="424" font-size="15" fill="#5A6675">By reformulating OT through learnable semi-</text>
  <text x="108" y="446" font-size="15" fill="#5A6675">couplings and training the maps and reweighting</text>
  <text x="108" y="468" font-size="15" fill="#5A6675">functions with a cycle-consistent alternating</text>
  <text x="108" y="490" font-size="15" fill="#5A6675">scheme, NubOT predicts, per single cell, both</text>
  <text x="108" y="512" font-size="15" fill="#5A6675">the movement and the creation or destruction</text>
  <text x="108" y="534" font-size="15" fill="#5A6675">of mass.</text>
  <rect x="108" y="556" width="496" height="60" fill="#E1F3F0" rx="10" stroke="#B7E2DA" stroke-width="1" />
  <text x="132" y="582" font-size="16" fill="#0E9E8F" font-weight="bold">where cells move   +   how mass rescales</text>
  <text x="132" y="604" font-size="14" fill="#5A6675">jointly, at single-cell resolution</text>
  </g>

  <g id="cue_s10_c3_outperforms_previous_neural_optimal">
    <title>outperforms previous neural optimal transport methods challenging task forecasting how</title>
    <desc>It outperforms previous neural optimal transport methods on the challenging task of forecasting how cancer cell lines respond to drugs, and it does so while producing predictions that align with known proliferation and death markers.</desc>
  <rect x="660" y="320" width="540" height="150" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="660" y="320" width="6" height="150" fill="#2453D6" rx="3" />
  <text x="688" y="358" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">WHAT IT DELIVERS</text>
  <text x="688" y="392" font-size="18" fill="#2453D6" font-weight="bold">Outperforms prior neural OT</text>
  <text x="688" y="424" font-size="15" fill="#5A6675">On forecasting drug response of cancer cell</text>
  <text x="688" y="446" font-size="15" fill="#5A6675">lines, with predictions that align with known</text>
  <text x="688" y="468" font-size="15" fill="#5A6675">proliferation and death markers.</text>
  </g>

  <g id="cue_s10_c4_explicitly_modeling_cell_birth_death">
    <title>explicitly modeling cell birth death rather assuming mass conserved what</title>
    <desc>Explicitly modeling cell birth and death, rather than assuming mass is conserved, is what makes this possible.</desc>
  <rect x="660" y="486" width="540" height="152" fill="#12172A" rx="12" />
  <text x="688" y="524" font-size="14" fill="#7CA0EC" font-weight="bold" letter-spacing="1">WHY IT WORKS</text>
  <text x="688" y="564" font-size="20" fill="#FFFFFF" font-weight="bold">Explicit cell birth &amp; death</text>
  <text x="688" y="596" font-size="15" fill="#C7CFDA">Modeling mass creation and destruction —</text>
  <text x="688" y="618" font-size="15" fill="#C7CFDA">rather than assuming it is conserved.</text>
  </g>

  <g id="deco_footer">
  <text x="80" y="700" font-size="12" fill="#8A97A8">NubOT · Neural Unbalanced Optimal Transport · NeurIPS 2022</text>
  <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">10 / 10</text>
  </g>
</svg>
