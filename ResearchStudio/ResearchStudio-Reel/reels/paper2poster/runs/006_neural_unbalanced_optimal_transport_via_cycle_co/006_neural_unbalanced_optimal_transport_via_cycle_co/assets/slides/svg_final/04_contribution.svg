<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#12172A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="deco_head">
  <rect x="80" y="62" width="40" height="4" fill="#2453D6" />
  <text x="132" y="72" font-size="14" fill="#2453D6" font-weight="bold" letter-spacing="2">04 · CONTRIBUTION</text>
  <text x="80" y="120" font-size="32" fill="#12172A" font-weight="bold">Three contributions, one neural semi-coupling estimator</text>
  <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s04_c1_makes_three_main_contributions_first">
    <title>makes three main contributions first introduces novel formulation unbalanced optimal</title>
    <desc>The paper makes three main contributions. First, it introduces a novel formulation of the unbalanced optimal transport problem that connects the rigorous theory of semi-couplings, which allow mass to vary, with a practical and scalable optimal-transport mapping estimator.</desc>
  <rect x="80" y="182" width="552" height="166" fill="#E7EEFF" rx="12" stroke="#C6D6FB" stroke-width="1" />
  <rect x="80" y="182" width="6" height="166" fill="#2453D6" rx="3" />
  <text x="108" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">NEW FORMULATION</text>
  <text x="108" y="252" font-size="30" fill="#2453D6" font-weight="bold">1</text>
  <text x="150" y="252" font-size="18" fill="#12172A" font-weight="bold">Semi-couplings meet neural OT</text>
  <text x="150" y="286" font-size="15" fill="#5A6675">Connects the rigorous theory of semi-couplings,</text>
  <text x="150" y="308" font-size="15" fill="#5A6675">which let mass vary, with a scalable optimal-</text>
  <text x="150" y="330" font-size="15" fill="#5A6675">transport mapping estimator.</text>
  </g>

  <g id="cue_s04_c2_second_derives_computationally_feasi">
    <title>second derives computationally feasible implementation based dual potentials parameterized input</title>
    <desc>Second, it derives a computationally feasible implementation based on dual potentials parameterized by input convex neural networks, together with learned reweighting functions that predict mass changes.</desc>
  <rect x="80" y="368" width="552" height="270" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="80" y="368" width="6" height="270" fill="#0E9E8F" rx="3" />
  <text x="108" y="406" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">FEASIBLE IMPLEMENTATION</text>
  <text x="108" y="438" font-size="30" fill="#0E9E8F" font-weight="bold">2</text>
  <text x="150" y="438" font-size="18" fill="#12172A" font-weight="bold">ICNN duals + reweighting nets</text>
  <text x="150" y="472" font-size="15" fill="#5A6675">Dual potentials are parameterized by input</text>
  <text x="150" y="494" font-size="15" fill="#5A6675">convex neural networks, paired with learned</text>
  <text x="150" y="516" font-size="15" fill="#5A6675">reweighting functions that predict mass change.</text>
  <rect x="150" y="540" width="452" height="80" fill="#E1F3F0" rx="10" stroke="#B7E2DA" stroke-width="1" />
  <text x="176" y="572" font-size="16" fill="#0E9E8F" font-weight="bold">∇f, ∇g  →  Monge maps        η, ζ  →  mass</text>
  <text x="176" y="600" font-size="14" fill="#5A6675">convex potentials + scalar reweighting fields</text>
  </g>

  <g id="cue_s04_c3_third_proposes_new_cycle_consistent">
    <title>third proposes new cycle-consistent procedure alternates between updating these maps</title>
    <desc>Third, it proposes a new cycle-consistent training procedure that alternates between updating these maps and rescaling functions, and crucially generalizes to new, out-of-sample cells.</desc>
  <rect x="660" y="182" width="540" height="244" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="660" y="182" width="6" height="244" fill="#E4572E" rx="3" />
  <text x="688" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">CYCLE-CONSISTENT TRAINING</text>
  <text x="688" y="252" font-size="30" fill="#E4572E" font-weight="bold">3</text>
  <text x="730" y="252" font-size="18" fill="#12172A" font-weight="bold">Alternate maps ⇄ rescaling</text>
  <text x="688" y="290" font-size="15" fill="#5A6675">A new cycle-consistent procedure alternates</text>
  <text x="688" y="312" font-size="15" fill="#5A6675">between updating the transport maps and the</text>
  <text x="688" y="334" font-size="15" fill="#5A6675">rescaling functions — and crucially it</text>
  <text x="688" y="356" font-size="15" fill="#5A6675">generalizes to new, out-of-sample cells.</text>
  <rect x="688" y="378" width="484" height="34" fill="#FBE9E2" rx="8" stroke="#F2C6B4" stroke-width="1" />
  <text x="712" y="400" font-size="15" fill="#E4572E" font-weight="bold">train-time alternation  →  test-time prediction</text>
  </g>

  <g id="cue_s04_c4_together_these_give_first_neural">
    <title>together these give first neural method estimates semi-couplings unbalanced single-cell</title>
    <desc>Together these give the first neural method that estimates semi-couplings for unbalanced OT at single-cell scale.</desc>
  <rect x="660" y="446" width="540" height="192" fill="#12172A" rx="12" />
  <text x="688" y="484" font-size="14" fill="#7CA0EC" font-weight="bold" letter-spacing="1">THE UPSHOT</text>
  <text x="688" y="528" font-size="22" fill="#FFFFFF" font-weight="bold">First neural semi-couplings</text>
  <text x="688" y="562" font-size="15" fill="#C7CFDA">The first neural method to estimate semi-</text>
  <text x="688" y="584" font-size="15" fill="#C7CFDA">couplings for unbalanced OT at single-cell</text>
  <text x="688" y="606" font-size="15" fill="#C7CFDA">scale.</text>
  <text x="1172" y="528" font-size="14" fill="#8BE0D4" font-weight="bold" text-anchor="end">unbalanced · scalable</text>
  </g>

  <g id="deco_footer">
  <text x="80" y="700" font-size="12" fill="#8A97A8">NubOT · Neural Unbalanced Optimal Transport · NeurIPS 2022</text>
  <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">04 / 10</text>
  </g>
</svg>
