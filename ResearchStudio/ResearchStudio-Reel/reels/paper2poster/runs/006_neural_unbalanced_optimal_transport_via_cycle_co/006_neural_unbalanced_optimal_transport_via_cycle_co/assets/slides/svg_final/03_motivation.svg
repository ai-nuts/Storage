<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#12172A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="deco_head">
  <rect x="80" y="62" width="40" height="4" fill="#2453D6" />
  <text x="132" y="72" font-size="14" fill="#2453D6" font-weight="bold" letter-spacing="2">03 · MOTIVATION</text>
  <text x="80" y="120" font-size="32" fill="#12172A" font-weight="bold">Heterogeneous responses need faithful reweighting</text>
  <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s03_c1_cellular_responses_drugs_highly_hete">
    <title>cellular responses drugs highly heterogeneous different cell types states respond</title>
    <desc>Cellular responses to drugs are highly heterogeneous: different cell types and states can respond in opposite ways, some proliferating while others die.</desc>
  <rect x="80" y="182" width="552" height="214" fill="#FBE9E2" rx="12" stroke="#F2C6B4" stroke-width="1" />
  <rect x="80" y="182" width="6" height="214" fill="#E4572E" rx="3" />
  <text x="108" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">RESPONSES ARE HETEROGENEOUS</text>
  <text x="108" y="258" font-size="19" fill="#12172A" font-weight="bold">Opposite fates, same drug</text>
  <text x="108" y="290" font-size="15" fill="#5A6675">Different cell types and states respond in</text>
  <text x="108" y="312" font-size="15" fill="#5A6675">opposite ways — some proliferate while</text>
  <text x="108" y="334" font-size="15" fill="#5A6675">others die under the same perturbation.</text>
  <text x="108" y="372" font-size="16" fill="#E4572E" font-weight="bold">proliferation  ↑        cell death  ↓</text>
  </g>

  <g id="cue_s03_c2_capturing_requires_nonlinear_maps_le">
    <title>capturing requires nonlinear maps level single cells not aggregate averages</title>
    <desc>Capturing this requires nonlinear maps at the level of single cells, not aggregate averages.</desc>
  <rect x="80" y="416" width="552" height="222" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="80" y="416" width="6" height="222" fill="#0E9E8F" rx="3" />
  <text x="108" y="454" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">WHAT IS REQUIRED</text>
  <text x="108" y="492" font-size="18" fill="#0E9E8F" font-weight="bold">Nonlinear maps per single cell</text>
  <text x="108" y="524" font-size="15" fill="#5A6675">Capturing this needs nonlinear maps at the</text>
  <text x="108" y="546" font-size="15" fill="#5A6675">level of individual cells — not aggregate</text>
  <text x="108" y="568" font-size="15" fill="#5A6675">averages that wash out the heterogeneity.</text>
  <rect x="108" y="588" width="496" height="34" fill="#E1F3F0" rx="8" stroke="#B7E2DA" stroke-width="1" />
  <text x="128" y="610" font-size="15" fill="#0E9E8F" font-weight="bold">single-cell resolution, not population means</text>
  </g>

  <g id="cue_s03_c3_prior_neural_optimal_transport_metho">
    <title>prior neural optimal transport methods learn such maps but they</title>
    <desc>Prior neural optimal transport methods can learn such maps, but they either assume the balanced setting where mass is conserved, or, like the state-of-the-art unbalanced GAN approach, they only capture the general trend of growth and shrinkage without recovering the exact reweighting each subpopulation needs.</desc>
  <rect x="660" y="182" width="540" height="268" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="660" y="182" width="6" height="268" fill="#2453D6" rx="3" />
  <text x="688" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">WHERE PRIOR METHODS FALL SHORT</text>
  <rect x="688" y="240" width="484" height="90" fill="#F7F9FC" rx="10" stroke="#E2E7EF" stroke-width="1" />
  <text x="710" y="272" font-size="16" fill="#2453D6" font-weight="bold">Balanced neural OT</text>
  <text x="710" y="300" font-size="15" fill="#5A6675">assumes mass is conserved — cannot grow</text>
  <text x="710" y="320" font-size="15" fill="#5A6675">or shrink subpopulations.</text>
  <rect x="688" y="342" width="484" height="96" fill="#F7F9FC" rx="10" stroke="#E2E7EF" stroke-width="1" />
  <text x="710" y="374" font-size="16" fill="#E4572E" font-weight="bold">State-of-the-art unbalanced GAN</text>
  <text x="710" y="402" font-size="15" fill="#5A6675">captures only the general trend of growth,</text>
  <text x="710" y="422" font-size="15" fill="#5A6675">not the exact per-cluster reweighting.</text>
  </g>

  <g id="cue_s03_c4_what_been_missing_method_jointly">
    <title>what been missing method jointly accurately models where mass moves</title>
    <desc>What has been missing is a method that jointly and accurately models where mass moves and how much of it is created or destroyed, in a way that stays faithful to the biology.</desc>
  <rect x="660" y="470" width="540" height="168" fill="#E7EEFF" rx="12" stroke="#C6D6FB" stroke-width="1" />
  <rect x="660" y="470" width="6" height="168" fill="#2453D6" rx="3" />
  <text x="688" y="508" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">THE MISSING PIECE</text>
  <text x="688" y="548" font-size="19" fill="#2453D6" font-weight="bold">Jointly map AND reweight</text>
  <text x="688" y="580" font-size="15" fill="#5A6675">A method that accurately models where mass</text>
  <text x="688" y="602" font-size="15" fill="#5A6675">moves and how much is created or destroyed —</text>
  <text x="688" y="624" font-size="15" fill="#5A6675">staying faithful to the biology.</text>
  </g>

  <g id="deco_footer">
  <text x="80" y="700" font-size="12" fill="#8A97A8">NubOT · Neural Unbalanced Optimal Transport · NeurIPS 2022</text>
  <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">03 / 10</text>
  </g>
</svg>
