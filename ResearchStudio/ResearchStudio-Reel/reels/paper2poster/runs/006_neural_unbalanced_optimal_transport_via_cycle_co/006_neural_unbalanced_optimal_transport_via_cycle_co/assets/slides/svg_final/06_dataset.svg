<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#12172A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="deco_head">
  <rect x="80" y="62" width="40" height="4" fill="#2453D6" />
  <text x="132" y="72" font-size="14" fill="#2453D6" font-weight="bold" letter-spacing="2">06 · DATASET / BENCHMARK</text>
  <text x="80" y="120" font-size="32" fill="#12172A" font-weight="bold">One synthetic testbed, one real single-cell atlas</text>
  <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s06_c1_method_evaluated_two_settings_first">
    <title>method evaluated two settings first synthetic benchmark two-dimensional mixture three</title>
    <desc>The method is evaluated on two settings. The first is a synthetic benchmark: a two-dimensional mixture of three Gaussian clusters, where the target keeps the same clusters but changes their proportions and shifts them in space, across three scenarios of increasing imbalance.</desc>
  <rect x="80" y="182" width="552" height="240" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="80" y="182" width="6" height="240" fill="#2453D6" rx="3" />
  <text x="108" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">SETTING 1 · SYNTHETIC</text>
  <text x="108" y="254" font-size="17" fill="#2453D6" font-weight="bold">Three Gaussian clusters, reshaped</text>
  <text x="108" y="286" font-size="15" fill="#5A6675">A 2-D mixture of three clusters; the target</text>
  <text x="108" y="308" font-size="15" fill="#5A6675">keeps the clusters but changes proportions and</text>
  <text x="108" y="330" font-size="15" fill="#5A6675">shifts them — three scenarios of imbalance.</text>
  <rect x="108" y="350" width="496" height="60" fill="#F7F9FC" rx="8" stroke="#E2E7EF" stroke-width="1" />
  <circle cx="150" cy="371" r="3" fill="#2453D6" />
  <circle cx="154" cy="378" r="3" fill="#2453D6" />
  <circle cx="158" cy="385" r="3" fill="#2453D6" />
  <circle cx="162" cy="374" r="3" fill="#2453D6" />
  <circle cx="166" cy="381" r="3" fill="#2453D6" />
  <circle cx="170" cy="388" r="3" fill="#2453D6" />
  <circle cx="174" cy="377" r="3" fill="#2453D6" />
  <circle cx="178" cy="384" r="3" fill="#2453D6" />
  <circle cx="182" cy="373" r="3" fill="#2453D6" />
  <circle cx="300" cy="364" r="3" fill="#8A97A8" />
  <circle cx="304" cy="369" r="3" fill="#8A97A8" />
  <circle cx="308" cy="374" r="3" fill="#8A97A8" />
  <circle cx="312" cy="379" r="3" fill="#8A97A8" />
  <circle cx="316" cy="368" r="3" fill="#8A97A8" />
  <circle cx="320" cy="373" r="3" fill="#8A97A8" />
  <circle cx="324" cy="378" r="3" fill="#8A97A8" />
  <circle cx="328" cy="367" r="3" fill="#8A97A8" />
  <circle cx="332" cy="372" r="3" fill="#8A97A8" />
  <circle cx="470" cy="381" r="3" fill="#0E9E8F" />
  <circle cx="474" cy="390" r="3" fill="#0E9E8F" />
  <circle cx="478" cy="385" r="3" fill="#0E9E8F" />
  <circle cx="482" cy="394" r="3" fill="#0E9E8F" />
  <circle cx="486" cy="389" r="3" fill="#0E9E8F" />
  <circle cx="490" cy="384" r="3" fill="#0E9E8F" />
  <circle cx="494" cy="393" r="3" fill="#0E9E8F" />
  <circle cx="498" cy="388" r="3" fill="#0E9E8F" />
  <circle cx="502" cy="383" r="3" fill="#0E9E8F" />
  <text x="108" y="388" font-size="13" fill="#5A6675" font-weight="bold">a</text>
  </g>

  <g id="cue_s06_c2_second_real_single_cell_perturbation">
    <title>second real single-cell perturbation dataset generated imaging technology called 4</title>
    <desc>The second is a real single-cell perturbation dataset, generated with the imaging technology called 4i, that tracks two co-cultured melanoma cell lines responding to twenty-five different drugs.</desc>
  <rect x="80" y="442" width="552" height="196" fill="#FBE9E2" rx="12" stroke="#F2C6B4" stroke-width="1" />
  <rect x="80" y="442" width="6" height="196" fill="#E4572E" rx="3" />
  <text x="108" y="480" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">SETTING 2 · REAL 4i IMAGING</text>
  <text x="108" y="514" font-size="17" fill="#E4572E" font-weight="bold">Melanoma cells under 25 drugs</text>
  <text x="108" y="546" font-size="15" fill="#5A6675">A single-cell perturbation atlas from 4i imaging</text>
  <text x="108" y="568" font-size="15" fill="#5A6675">tracks two co-cultured melanoma cell lines</text>
  <text x="108" y="590" font-size="15" fill="#5A6675">responding to twenty-five different drugs.</text>
  <text x="108" y="624" font-size="15" fill="#E4572E" font-weight="bold">4i multiplexed imaging  ·  25 perturbations</text>
  </g>

  <g id="cue_s06_c3_cells_measured_zero_eight_twenty_fou">
    <title>cells measured zero eight twenty-four hours control cells exposed only</title>
    <desc>Cells are measured at zero, eight, and twenty-four hours, with control cells exposed only to a vehicle serving as the source and the perturbed populations serving as targets.</desc>
  <rect x="660" y="182" width="540" height="214" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="660" y="182" width="6" height="214" fill="#0E9E8F" rx="3" />
  <text x="688" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">TIME COURSE &amp; CONTROLS</text>
  <text x="688" y="254" font-size="17" fill="#0E9E8F" font-weight="bold">Source = vehicle control</text>
  <text x="688" y="286" font-size="15" fill="#5A6675">Cells are measured at 0, 8, and 24 hours.</text>
  <text x="688" y="308" font-size="15" fill="#5A6675">Control (vehicle-only) cells are the source;</text>
  <text x="688" y="330" font-size="15" fill="#5A6675">perturbed populations are the targets.</text>
  <line x1="712" y1="368" x2="1140" y2="368" stroke="#E2E7EF" stroke-width="2" />
  <circle cx="712" cy="368" r="6" fill="#8A97A8" />
  <circle cx="926" cy="368" r="6" fill="#2453D6" />
  <circle cx="1140" cy="368" r="6" fill="#0E9E8F" />
  <text x="712" y="392" font-size="13" fill="#5A6675" font-weight="bold">0h</text>
  <text x="910" y="392" font-size="13" fill="#5A6675" font-weight="bold">8h</text>
  <text x="1124" y="392" font-size="13" fill="#5A6675" font-weight="bold">24h</text>
  </g>

  <g id="cue_s06_c4_two_cell_lines_distinguished_mutuall">
    <title>two cell lines distinguished mutually exclusive protein markers mela sox9</title>
    <desc>The two cell lines are distinguished by mutually exclusive protein markers, MelA and Sox9, and additional markers for proliferation and cell death allow the predicted mass changes to be checked against biology.</desc>
  <rect x="660" y="416" width="540" height="222" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="660" y="416" width="6" height="222" fill="#2453D6" rx="3" />
  <text x="688" y="454" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">MARKERS ENABLE VALIDATION</text>
  <text x="688" y="488" font-size="17" fill="#12172A" font-weight="bold">MelA / Sox9 split the two lines</text>
  <text x="688" y="520" font-size="15" fill="#5A6675">The two cell lines are distinguished by mutually</text>
  <text x="688" y="542" font-size="15" fill="#5A6675">exclusive markers MelA and Sox9; proliferation</text>
  <text x="688" y="564" font-size="15" fill="#5A6675">and death markers let predicted mass changes</text>
  <text x="688" y="586" font-size="15" fill="#5A6675">be checked against biology.</text>
  <rect x="688" y="606" width="484" height="20" fill="#E7EEFF" rx="6" stroke="#C6D6FB" stroke-width="1" />
  <text x="700" y="620" font-size="13" fill="#2453D6" font-weight="bold">MelA · Sox9 · Ki67 (proliferation) · apoptosis marker</text>
  </g>

  <g id="deco_footer">
  <text x="80" y="700" font-size="12" fill="#8A97A8">NubOT · Neural Unbalanced Optimal Transport · NeurIPS 2022</text>
  <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">06 / 10</text>
  </g>
</svg>
