<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#12172A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <g id="deco_head">
  <rect x="80" y="62" width="40" height="4" fill="#2453D6" />
  <text x="132" y="72" font-size="14" fill="#2453D6" font-weight="bold" letter-spacing="2">02 · PROBLEM</text>
  <text x="80" y="120" font-size="32" fill="#12172A" font-weight="bold">Unpaired snapshots, and mass that will not stay put</text>
  <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s02_c1_recurring_problem_natural_sciences_m">
    <title>recurring problem natural sciences modeling how population changes after intervention</title>
    <desc>A recurring problem in the natural sciences is modeling how a population changes after an intervention, when you can only observe unpaired snapshots rather than track individuals.</desc>
  <rect x="80" y="182" width="552" height="150" fill="#E7EEFF" rx="12" stroke="#C6D6FB" stroke-width="1" />
  <rect x="80" y="182" width="6" height="150" fill="#2453D6" rx="3" />
  <text x="108" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">THE MEASUREMENT PROBLEM</text>
  <text x="108" y="258" font-size="19" fill="#12172A" font-weight="bold">Model how a population responds</text>
  <text x="108" y="290" font-size="15" fill="#5A6675">We want how a population changes after an</text>
  <text x="108" y="312" font-size="15" fill="#5A6675">intervention — from unpaired snapshots only.</text>
  </g>

  <g id="cue_s02_c2_single_cell_biology_unavoidable_beca">
    <title>single-cell biology unavoidable because profiling cell destroys same cell never</title>
    <desc>In single-cell biology this is unavoidable, because profiling a cell destroys it, so the same cell can never be measured twice.</desc>
  <rect x="80" y="352" width="552" height="286" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="80" y="352" width="6" height="286" fill="#E4572E" rx="3" />
  <text x="108" y="390" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">WHY UNPAIRED · SINGLE-CELL</text>
  <text x="108" y="424" font-size="18" fill="#E4572E" font-weight="bold">Profiling a cell destroys it</text>
  <text x="108" y="452" font-size="15" fill="#5A6675">The same cell can never be measured twice, so</text>
  <text x="108" y="474" font-size="15" fill="#5A6675">individuals cannot be tracked over time.</text>
  <rect x="108" y="496" width="496" height="124" fill="#F7F9FC" rx="10" stroke="#E2E7EF" stroke-width="1" />
  <text x="132" y="522" font-size="14" fill="#5A6675" font-weight="bold">t = 0  (control)</text>
  <text x="468" y="522" font-size="14" fill="#5A6675" font-weight="bold">t = later (perturbed)</text>
  <circle cx="150" cy="560" r="7" fill="#2453D6" />
  <circle cx="176" cy="560" r="7" fill="#2453D6" />
  <circle cx="202" cy="560" r="7" fill="#2453D6" />
  <circle cx="228" cy="560" r="7" fill="#2453D6" />
  <circle cx="254" cy="560" r="7" fill="#2453D6" />
  <circle cx="470" cy="556" r="7" fill="#0E9E8F" />
  <circle cx="496" cy="556" r="7" fill="#0E9E8F" />
  <circle cx="522" cy="556" r="7" fill="#0E9E8F" />
  <circle cx="548" cy="556" r="7" fill="#0E9E8F" />
  <text x="132" y="600" font-size="13" fill="#8A97A8">snapshot A</text>
  <text x="468" y="600" font-size="13" fill="#8A97A8">snapshot B — no pairing</text>
  <line x1="300" y1="560" x2="430" y2="560" stroke="#E2E7EF" stroke-width="1" />
  </g>

  <g id="cue_s02_c3_optimal_transport_offers_principled">
    <title>optimal transport offers principled way infer these correspondences learning optimal</title>
    <desc>Optimal transport offers a principled way to infer these correspondences by learning an optimal coupling between distributions. But the standard formulation assumes conservation of mass, meaning every unit of source mass must be transported somewhere.</desc>
  <rect x="660" y="182" width="540" height="232" fill="#FFFFFF" rx="12" stroke="#E2E7EF" stroke-width="1" />
  <rect x="660" y="182" width="6" height="232" fill="#2453D6" rx="3" />
  <text x="688" y="220" font-size="14" fill="#5A6675" font-weight="bold" letter-spacing="1">OPTIMAL TRANSPORT AS THE TOOL</text>
  <text x="688" y="256" font-size="18" fill="#12172A" font-weight="bold">OT infers the correspondence</text>
  <text x="688" y="288" font-size="15" fill="#5A6675">Optimal transport learns an optimal coupling</text>
  <text x="688" y="310" font-size="15" fill="#5A6675">between the source and target distributions.</text>
  <rect x="688" y="332" width="484" height="66" fill="#E7EEFF" rx="10" stroke="#C6D6FB" stroke-width="1" />
  <text x="712" y="362" font-size="16" fill="#2453D6" font-weight="bold">But standard OT conserves mass —</text>
  <text x="712" y="384" font-size="15" fill="#5A6675">every unit must be transported somewhere.</text>
  </g>

  <g id="cue_s02_c4_assumption_violated_exactly_when_mat">
    <title>assumption violated exactly when matters most unbalanced settings where cells</title>
    <desc>That assumption is violated exactly when it matters most, in unbalanced settings where cells proliferate or die, and the total population size shifts between measurements.</desc>
  <rect x="660" y="434" width="540" height="204" fill="#12172A" rx="12" />
  <text x="688" y="472" font-size="14" fill="#7CA0EC" font-weight="bold" letter-spacing="1">WHERE THE ASSUMPTION BREAKS</text>
  <text x="688" y="512" font-size="20" fill="#FFFFFF" font-weight="bold">Cells proliferate and die</text>
  <text x="688" y="544" font-size="15" fill="#C7CFDA">In unbalanced settings the total population</text>
  <text x="688" y="566" font-size="15" fill="#C7CFDA">size shifts between measurements — exactly</text>
  <text x="688" y="588" font-size="15" fill="#C7CFDA">when conservation of mass is violated.</text>
  <text x="688" y="620" font-size="15" fill="#8BE0D4" font-weight="bold">balanced OT  ✗   ·   unbalanced reality  ✓</text>
  </g>

  <g id="deco_footer">
  <text x="80" y="700" font-size="12" fill="#8A97A8">NubOT · Neural Unbalanced Optimal Transport · NeurIPS 2022</text>
  <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">02 / 10</text>
  </g>
</svg>
