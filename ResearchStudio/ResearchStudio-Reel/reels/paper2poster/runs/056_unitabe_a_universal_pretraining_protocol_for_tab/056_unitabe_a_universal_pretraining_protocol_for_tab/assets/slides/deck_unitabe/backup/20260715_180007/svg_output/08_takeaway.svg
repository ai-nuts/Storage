  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
<g id="header"><rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/><text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" fill="#16324F" font-weight="700">Takeaway: a foundation model for tables</text><text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568" font-weight="700" letter-spacing="1.5">RESPECT STRUCTURE, PRETRAIN AT SCALE, TRANSFER</text></g><g id="cue_s08_c1_pretraining_paradigm_reshaped_langua"><desc>the pretraining paradigm that reshaped language and vision can extend to structured tabular data</desc><rect x="60" y="152" width="1160" height="150" rx="14" fill="#16324F"/><rect x="60" y="152" width="6" height="150" rx="3" fill="#1F9E8F"/><text x="96" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5FB0A6" font-weight="700" letter-spacing="2">THE BIG PICTURE</text><text x="96" y="242" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#FFFFFF" font-weight="700">The pretraining paradigm that reshaped language and</text><text x="96" y="278" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#FFFFFF" font-weight="700">vision can extend to structured tabular data.</text></g><g id="cue_s08_c2_key_respect_table_structure_rather"><desc>the key is to respect table structure rather than flatten it into text represent each cell by its column name value and data type refine with a Transformer adapt through free-form prompts</desc><rect x="60" y="324" width="570" height="296" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="324" width="6" height="296" rx="3" fill="#16324F"/><text x="90" y="364" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">THE PRINCIPLE</text><text x="90" y="406" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Respect the structure</text><text x="90" y="448" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Don't flatten tables into text.</text><text x="90" y="474" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Represent each cell by its</text><text x="90" y="500" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">column name, value, and data type,</text><text x="90" y="526" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">refine with a Transformer, and</text><text x="90" y="552" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">adapt through free-form prompts.</text></g><g id="cue_s08_c3_pretrained_billions_unitabe_becomes"><desc>pretrained on billions UniTabE becomes a general tabular model that transfers across tasks beats the XGBoost baseline and handles missing values and tables that gain columns</desc><rect x="650" y="324" width="570" height="296" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="650" y="324" width="6" height="296" rx="3" fill="#2E9E5B"/><text x="680" y="364" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">THE OUTCOME</text><text x="680" y="406" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">A general tabular model</text><text x="680" y="448" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Pretrained on billions of examples,</text><text x="680" y="474" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">UniTabE transfers across tasks,</text><text x="680" y="500" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">beats the long-standing XGBoost</text><text x="680" y="526" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">baseline, and gracefully handles</text><text x="680" y="552" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">missing values and new columns.</text></g><g id="footer"><text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">UniTabE: A Universal Pretraining Protocol for Tabular Foundation Models · Yang et al. · ICLR 2024</text><text x="1220" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">08</text></g>
</svg>
