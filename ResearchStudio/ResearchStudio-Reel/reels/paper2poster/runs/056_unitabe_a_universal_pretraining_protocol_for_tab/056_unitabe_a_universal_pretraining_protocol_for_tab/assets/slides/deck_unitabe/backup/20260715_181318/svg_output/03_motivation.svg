<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
<g id="header"><rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/><text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" fill="#16324F" font-weight="700">Can the pretraining recipe work for tables?</text><text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568" font-weight="700" letter-spacing="1.5">LEARN ONCE, TRANSFER TO MANY TASKS</text></g><g id="cue_s03_c1_promise_pretraining_learns_general_k"><desc>promise of pretraining model learns general knowledge once from huge unlabeled data then transfers cheaply to many tasks</desc><rect x="60" y="152" width="570" height="216" rx="12" fill="#16324F"/><text x="90" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5FB0A6" font-weight="700" letter-spacing="1.5">THE PROMISE OF PRETRAINING</text><text x="90" y="232" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" fill="#FFFFFF" font-weight="700">Learn once, transfer widely</text><text x="90" y="274" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#CBD5E1">A model absorbs general knowledge from</text><text x="90" y="300" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#CBD5E1">huge unlabeled data, then transfers it</text><text x="90" y="326" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#CBD5E1">cheaply to many downstream tasks.</text></g><g id="cue_s03_c2_authors_ask_whether_recipe_work"><desc>the authors ask whether this recipe can work for tables</desc><rect x="650" y="152" width="570" height="216" rx="12" fill="#E7F4F1" stroke="#5FB0A6" stroke-width="1"/><rect x="650" y="152" width="6" height="216" rx="3" fill="#1F9E8F"/><text x="680" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">THE QUESTION</text><text x="680" y="234" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Does it work for tables?</text><text x="680" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">The authors ask whether this same</text><text x="680" y="302" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">pretrain-then-transfer recipe can</text><text x="680" y="328" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">carry over to structured tables.</text></g><g id="cue_s03_c3_three_ingredients_needed_way_represe"><desc>three ingredients needed a way to represent any table regardless of schema training framework flexible for many objectives data source large enough to pretrain at scale</desc><rect x="60" y="392" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="392" width="6" height="216" rx="3" fill="#16324F"/><text x="90" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">THREE INGREDIENTS</text><text x="90" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">What it takes</text><text x="90" y="516" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">1  Represent any table, any schema</text><text x="90" y="542" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">2  A framework for many objectives</text><text x="90" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1A202C">3  Data large enough to pretrain</text></g><g id="cue_s03_c4_together_one_tabular_could_handle"><desc>together one tabular model could handle classification regression missing-value imputation zero-shot prediction tables that grow new columns without redesigning per task</desc><rect x="650" y="392" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="650" y="392" width="6" height="216" rx="3" fill="#2E9E5B"/><text x="680" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">THE PAYOFF</text><text x="680" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">One model, many tasks</text><text x="680" y="516" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Classification · regression · imputation</text><text x="680" y="542" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">zero-shot · tables that gain columns,</text><text x="680" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">all without redesigning per task.</text></g><g id="footer"><text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">UniTabE: A Universal Pretraining Protocol for Tabular Foundation Models · Yang et al. · ICLR 2024</text><text x="1220" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">03</text></g>
</svg>
