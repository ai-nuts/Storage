<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
<g id="header"><rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/><text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" fill="#16324F" font-weight="700">The problem: tables resist pretraining</text><text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568" font-weight="700" letter-spacing="1.5">NO FOUNDATION MODEL FOR TABULAR DATA</text></g><g id="cue_s02_c1_tabular_underpins_applications_like"><desc>tabular data underpins applications like stock prediction real-estate forecasting credit scoring</desc><rect x="60" y="152" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="152" width="6" height="216" rx="3" fill="#16324F"/><text x="90" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">WHERE TABLES MATTER</text><text x="90" y="234" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Tables run the real world</text><text x="90" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Stock prediction, real-estate</text><text x="90" y="302" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">forecasting, and credit scoring all</text><text x="90" y="328" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">rest on rows-and-columns data.</text></g><g id="cue_s02_c2_yet_unlike_text_images_widely"><desc>yet unlike text and images tabular has no widely adopted foundation model</desc><rect x="650" y="152" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="650" y="152" width="6" height="216" rx="3" fill="#1F9E8F"/><text x="680" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">THE MISSING PIECE</text><text x="680" y="234" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">No foundation model yet</text><text x="680" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Unlike text and images, tabular</text><text x="680" y="302" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">data still has no widely adopted</text><text x="680" y="328" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">pretrained foundation model.</text></g><g id="cue_s02_c3_reason_tables_come_endless_schemas"><desc>the reason tables come in endless schemas different column names data types counts model trained on one cannot be reused</desc><rect x="60" y="392" width="570" height="216" rx="12" fill="#FBEEEC" stroke="#E7B6AE" stroke-width="1"/><rect x="60" y="392" width="6" height="216" rx="3" fill="#C0392B"/><text x="90" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#C0392B" font-weight="700" letter-spacing="1.5">THE ROOT CAUSE</text><text x="90" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Endless, mismatched schemas</text><text x="90" y="516" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Different column names, data types,</text><text x="90" y="542" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">and counts mean a model trained on</text><text x="90" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">one table can't be reused on another.</text></g><g id="cue_s02_c4_existing_methods_either_flatten_tabl"><desc>existing methods either flatten tables into text losing numerical meaning or assume train and test share fixed structure both block knowledge transfer</desc><rect x="650" y="392" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="650" y="392" width="6" height="216" rx="3" fill="#2E9E5B"/><text x="680" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">WHY WORKAROUNDS FAIL</text><text x="680" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Two flawed workarounds</text><text x="680" y="516" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Flatten to text → lose numeric meaning.</text><text x="680" y="542" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Assume a fixed schema → no transfer.</text><text x="680" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Both block knowledge transfer.</text></g><g id="footer"><text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">UniTabE: A Universal Pretraining Protocol for Tabular Foundation Models · Yang et al. · ICLR 2024</text><text x="1220" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">02</text></g>
</svg>
