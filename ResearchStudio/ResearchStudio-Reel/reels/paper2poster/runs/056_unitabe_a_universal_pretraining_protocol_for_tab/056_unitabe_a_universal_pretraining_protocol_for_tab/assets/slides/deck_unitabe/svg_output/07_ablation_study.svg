<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
<g id="header"><rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/><text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" fill="#16324F" font-weight="700">Ablation: every component earns its place</text><text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568" font-weight="700" letter-spacing="1.5">LINKING LAYER, FUSE GATE, OBJECTIVES, DECODER DEPTH</text></g><g id="cue_s07_c1_ablations_confirm_part_earns_its"><desc>ablations confirm each part earns its place removing the linking layer which ties names to values causes the largest drop from AUC zero point eight three down to zero point seven five</desc><rect x="60" y="152" width="570" height="216" rx="12" fill="#FBEEEC" stroke="#E7B6AE" stroke-width="1"/><rect x="60" y="152" width="6" height="216" rx="3" fill="#C0392B"/><text x="90" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#C0392B" font-weight="700" letter-spacing="1.5">BIGGEST DROP · LINKING LAYER</text><text x="90" y="236" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="23" fill="#16324F" font-weight="700">Removing column–value links</text><text x="96" y="306" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="40" fill="#2E9E5B" font-weight="700">0.83</text><text x="214" y="300" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#94A3B8">→</text><text x="250" y="306" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="40" fill="#C0392B" font-weight="700">0.75</text><text x="96" y="344" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1A202C">average AUC falls when the linking layer is ablated</text></g><g id="cue_s07_c2_removing_fuse_layer_injects_data_typ"><desc>removing the fuse layer that injects data-type information also hurts and removing both is worse</desc><rect x="650" y="152" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="650" y="152" width="6" height="216" rx="3" fill="#1F9E8F"/><text x="680" y="192" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">FUSE GATE</text><text x="680" y="234" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Data-type fusion matters</text><text x="680" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Dropping the fuse layer that injects</text><text x="680" y="302" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">data-type information also hurts,</text><text x="680" y="328" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">and removing both is worse still.</text></g><g id="cue_s07_c3_dropping_either_pretraining_objectiv"><desc>dropping either pretraining objective multi-cell masking or contrastive learning reduces performance too</desc><rect x="60" y="392" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="392" width="6" height="216" rx="3" fill="#2E9E5B"/><text x="90" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">PRETRAINING OBJECTIVES</text><text x="90" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Two signals, complementary</text><text x="90" y="516" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Dropping either objective, multi-cell</text><text x="90" y="542" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">masking or contrastive learning,</text><text x="90" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">reduces performance too.</text></g><g id="cue_s07_c4_notably_one_layer_decoder_beats_thre"><desc>notably a one-layer decoder beats three or six layer ones supporting the choice to keep the decoder shallow</desc><rect x="650" y="392" width="570" height="216" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="650" y="392" width="6" height="216" rx="3" fill="#3B7DD8"/><text x="680" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">DECODER DEPTH</text><text x="680" y="474" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Shallow decoder wins</text><text x="680" y="516" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">A 1-layer decoder beats 3- and</text><text x="680" y="542" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">6-layer ones, confirming the choice</text><text x="680" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">to keep knowledge in the encoder.</text></g><g id="footer"><text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">UniTabE: A Universal Pretraining Protocol for Tabular Foundation Models · Yang et al. · ICLR 2024</text><text x="1220" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">07</text></g>
</svg>
