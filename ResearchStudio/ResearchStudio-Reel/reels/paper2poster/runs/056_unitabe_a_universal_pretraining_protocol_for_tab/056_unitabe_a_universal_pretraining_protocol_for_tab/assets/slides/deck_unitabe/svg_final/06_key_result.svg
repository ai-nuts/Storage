<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>
<g id="header"><rect x="60" y="56" width="6" height="40" fill="#1F9E8F"/><text x="84" y="88" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" fill="#16324F" font-weight="700">Key result: pretraining beats XGBoost</text><text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568" font-weight="700" letter-spacing="1.5">AVERAGE AUC OVER 7 PUBLIC TABULAR BENCHMARKS</text></g><g id="cue_s06_c2_seven_standard_public_benchmarks_uni"><desc>on seven standard public benchmarks UniTabE reaches average area-under-curve about zero point eight three beating Tapas FT-Transformer industry favorite XGBoost</desc><rect x="60" y="150" width="612" height="470" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><text x="90" y="190" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.2">AVERAGE AUC · 7 BENCHMARKS</text><line x1="160" y1="550.0" x2="642" y2="550.0" stroke="#E2E8F0" stroke-width="1"/><text x="100" y="554.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#94A3B8">0.70</text><line x1="160" y1="450.0" x2="642" y2="450.0" stroke="#E2E8F0" stroke-width="1"/><text x="100" y="453.99999999999994" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#94A3B8">0.75</text><line x1="160" y1="350.0" x2="642" y2="350.0" stroke="#E2E8F0" stroke-width="1"/><text x="100" y="353.9999999999999" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#94A3B8">0.80</text><line x1="160" y1="250.0" x2="642" y2="250.0" stroke="#E2E8F0" stroke-width="1"/><text x="100" y="254.0" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#94A3B8">0.85</text><rect x="180" y="290.0" width="110" height="260.0" rx="6" fill="#2E9E5B"/><text x="235.0" y="278.0" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" fill="#16324F" font-weight="700" text-anchor="middle">0.83</text><text x="235.0" y="574" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1A202C" font-weight="700" text-anchor="middle">UniTabE</text><rect x="350" y="330.0" width="110" height="220.0" rx="6" fill="#3B7DD8"/><text x="405.0" y="317.9999999999999" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" fill="#16324F" font-weight="700" text-anchor="middle">0.81</text><text x="405.0" y="574" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1A202C" font-weight="700" text-anchor="middle">Best baseline</text><rect x="520" y="370.0" width="110" height="180.0" rx="6" fill="#E08A1E"/><text x="575.0" y="357.9999999999999" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" fill="#16324F" font-weight="700" text-anchor="middle">0.79</text><text x="575.0" y="574" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1A202C" font-weight="700" text-anchor="middle">XGBoost</text><text x="90" y="602" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#4A5568">Beats Tapas, FT-Transformer and the industry-favorite XGBoost.</text></g><g id="cue_s06_c1_experiments_show_pretraining_pays_of"><desc>the experiments show pretraining pays off</desc><rect x="696" y="150" width="524" height="82" rx="12" fill="#16324F"/><text x="720" y="186" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#5FB0A6" font-weight="700" letter-spacing="1.5">THE VERDICT</text><text x="720" y="216" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" fill="#FFFFFF" font-weight="700">Pretraining pays off.</text></g><g id="cue_s06_c3_twelve_held_out_kaggle_tasks_spannin"><desc>on twelve held-out Kaggle tasks spanning classification and regression UniTabE again outperforms XGBoost and a strong TransTab variant</desc><rect x="696" y="248" width="524" height="178" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="696" y="248" width="6" height="178" rx="3" fill="#2E9E5B"/><text x="726" y="288" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">12 HELD-OUT KAGGLE TASKS</text><text x="726" y="330" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Wins on unseen tasks</text><text x="726" y="372" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">Across classification and regression,</text><text x="726" y="398" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">UniTabE again beats XGBoost and</text><text x="726" y="424" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">a strong TransTab variant.</text></g><g id="cue_s06_c4_also_performs_well_zero_shot_mode"><desc>it also performs well in zero-shot mode making accurate predictions on some datasets with no task-specific finetuning evidence of genuine transferable reasoning about tables</desc><rect x="696" y="442" width="524" height="178" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/><rect x="696" y="442" width="6" height="178" rx="3" fill="#3B7DD8"/><text x="726" y="482" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#1F9E8F" font-weight="700" letter-spacing="1.5">ZERO-SHOT</text><text x="726" y="524" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" fill="#16324F" font-weight="700">Predicts with no finetuning</text><text x="726" y="566" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">On some datasets it predicts</text><text x="726" y="592" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">accurately with zero task-specific</text><text x="726" y="618" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#1A202C">finetuning, real transfer.</text></g><g id="footer"><text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8">UniTabE: A Universal Pretraining Protocol for Tabular Foundation Models · Yang et al. · ICLR 2024</text><text x="1220" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">06</text></g>
