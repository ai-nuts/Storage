<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2F5BEA"/>
  <rect x="0" y="0" width="12" height="720" fill="#F3F5F9"/>

  <!-- header -->
  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">02 · PROBLEM</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Rich data outpaces the tools</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- left: big-data era -->
  <g id="cue_s02_c1_modern_neuroscience_records_thousand">
    <title>Modern neuroscience records thousands of neurons cellular resolution stimuli behavior</title>
    <desc>modern neuroscience records thousands of neurons at cellular resolution alongside visual stimuli and behavior</desc>
    <rect x="72" y="196" width="548" height="424" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="104" y="248" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1">A BIG-DATA ERA</text>
    <text x="104" y="288" font-size="24" fill="#12161D" font-weight="700">Experiments now co-record three</text>
    <text x="104" y="318" font-size="24" fill="#12161D" font-weight="700">modalities at once</text>

    <g transform="translate(104,352)">
      <rect x="0" y="0" width="484" height="72" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <circle cx="40" cy="36" r="20" fill="#EAF0FB"/><text x="40" y="43" text-anchor="middle" font-size="18" font-weight="800" fill="#2F5BEA">N</text>
      <text x="76" y="32" font-size="19" fill="#12161D" font-weight="700">Neural activity</text>
      <text x="76" y="55" font-size="15" fill="#444B55">thousands of neurons, cellular resolution</text>
    </g>
    <g transform="translate(104,436)">
      <rect x="0" y="0" width="484" height="72" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <circle cx="40" cy="36" r="20" fill="#E4F5F2"/><text x="40" y="43" text-anchor="middle" font-size="18" font-weight="800" fill="#12A594">V</text>
      <text x="76" y="32" font-size="19" fill="#12161D" font-weight="700">Visual stimuli</text>
      <text x="76" y="55" font-size="15" fill="#444B55">gratings and naturalistic videos</text>
    </g>
    <g transform="translate(104,520)">
      <rect x="0" y="0" width="484" height="72" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <circle cx="40" cy="36" r="20" fill="#FBE9E2"/><text x="40" y="43" text-anchor="middle" font-size="18" font-weight="800" fill="#E8663D">B</text>
      <text x="76" y="32" font-size="19" fill="#12161D" font-weight="700">Behavior</text>
      <text x="76" y="55" font-size="15" fill="#444B55">eye position, running speed, movement</text>
    </g>
  </g>

  <!-- right: the gap -->
  <g id="cue_s02_c2_these_datasets_large_multimodal_mess">
    <title>Datasets large multimodal messy traditional statistical tools single-modality widening gap</title>
    <desc>these datasets large multimodal messy field traditional statistical tools built far smaller single-modality recordings widening data-analysis gap</desc>
    <rect x="660" y="196" width="548" height="424" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="692" y="248" font-size="15" fill="#E8663D" font-weight="700" letter-spacing="1">THE ANALYSIS GAP</text>
    <text x="692" y="288" font-size="24" fill="#12161D" font-weight="700">Classical tools were built for</text>
    <text x="692" y="318" font-size="24" fill="#12161D" font-weight="700">smaller, single-modality data</text>

    <!-- bars comparison -->
    <g transform="translate(692,360)">
      <rect x="0" y="24" width="150" height="196" rx="10" fill="#2F5BEA"/>
      <text x="75" y="250" text-anchor="middle" font-size="16" fill="#12161D" font-weight="700">Data richness</text>
      <text x="75" y="14" text-anchor="middle" font-size="14" fill="#2F5BEA" font-weight="700">large · multimodal</text>

      <rect x="334" y="150" width="150" height="70" rx="10" fill="#C9D0DB"/>
      <text x="409" y="250" text-anchor="middle" font-size="16" fill="#12161D" font-weight="700">Classical tools</text>
      <text x="409" y="140" text-anchor="middle" font-size="14" fill="#7A828E" font-weight="700">single-modality</text>

      <!-- gap arrow -->
      <line x1="160" y1="60" x2="326" y2="60" stroke="#E8663D" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="243" y="50" text-anchor="middle" font-size="15" fill="#E8663D" font-weight="700">widening gap</text>
    </g>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">02 / 10</text>
</svg>
