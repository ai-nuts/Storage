<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- QR utility cluster (top-right) -->
  <g>
    <rect x="958" y="52" width="250" height="254" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <image href="../images/qr_code.png" x="991" y="72" width="184" height="184" preserveAspectRatio="xMidYMid meet"/>
    <text x="1083" y="286" text-anchor="middle" font-size="16" fill="#12161D" font-weight="700">Scan for code</text>
  </g>

  <!-- eyebrow / venue -->
  <g>
    <rect x="72" y="66" width="128" height="30" rx="15" fill="#EAF0FB"/>
    <text x="136" y="86" text-anchor="middle" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">ICLR 2024</text>
  </g>

  <!-- title block -->
  <text x="72" y="196" font-size="88" fill="#12161D" font-weight="800" letter-spacing="-1">Neuroformer</text>
  <text x="74" y="246" font-size="27" fill="#3A4048" font-weight="600">Multimodal &amp; Multitask Generative Pretraining</text>
  <text x="74" y="282" font-size="27" fill="#3A4048" font-weight="600">for Brain Data</text>

  <!-- authors + institute -->
  <text x="74" y="336" font-size="17" fill="#444B55">Antonis Antoniades · Yiyi Yu · Joseph Canzano · William Wang · Spencer LaVere Smith</text>
  <g transform="translate(74,360)">
    <image href="../images/logo_ucsb.png" x="0" y="0" width="235" height="19" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- three concept cards = cue anchors -->
  <g id="cue_s01_c1_neuroformer_multimodal_multitask_gen">
    <title>Neuroformer multimodal multitask generative pretrained transformer brain</title>
    <desc>neuroformer multimodal multitask generative pretrained transformer for brain data built santa barbara</desc>
    <rect x="72" y="452" width="360" height="196" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="72" y="452" width="8" height="196" rx="4" fill="#2F5BEA"/>
    <text x="104" y="496" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1">WHAT IT IS</text>
    <text x="104" y="534" font-size="23" fill="#12161D" font-weight="700">Generative pretrained</text>
    <text x="104" y="564" font-size="23" fill="#12161D" font-weight="700">transformer for the brain</text>
    <text x="104" y="600" font-size="16" fill="#444B55">Multimodal · multitask ·</text>
    <text x="104" y="624" font-size="16" fill="#444B55">fully self-supervised</text>
  </g>

  <g id="cue_s01_c2_reframes_cellular_resolution_spike_a">
    <title>Reframes cellular-resolution spike analysis as autoregressive spatiotemporal generation</title>
    <desc>reframes cellular-resolution spike analysis autoregressive spatiotemporal generation borrowing recipe vision language models</desc>
    <rect x="460" y="452" width="360" height="196" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="460" y="452" width="8" height="196" rx="4" fill="#12A594"/>
    <text x="492" y="496" font-size="15" fill="#12A594" font-weight="700" letter-spacing="1">KEY IDEA</text>
    <text x="492" y="534" font-size="19" fill="#12161D" font-weight="700">Spikes as a generation</text>
    <text x="492" y="558" font-size="19" fill="#12161D" font-weight="700">problem</text>
    <g transform="translate(492,584)" font-size="15" fill="#444B55">
      <text x="0" y="0">cellular-resolution spikes</text>
      <text x="0" y="26" font-weight="700" fill="#12A594">→ autoregressive spatiotemporal</text>
    </g>
  </g>

  <g id="cue_s01_c3_trained_self_supervised_recovers_cir">
    <title>Trained self-supervised recovers circuit connectivity decodes mouse behavior</title>
    <desc>trained self-supervised recovers circuit connectivity decodes mouse behavior few-shot fine-tuning</desc>
    <rect x="848" y="452" width="360" height="196" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="848" y="452" width="8" height="196" rx="4" fill="#E8663D"/>
    <text x="880" y="496" font-size="15" fill="#E8663D" font-weight="700" letter-spacing="1">WHAT IT DOES</text>
    <text x="880" y="534" font-size="17" fill="#12161D" font-weight="600">✓ Recovers circuit connectivity</text>
    <text x="880" y="566" font-size="17" fill="#12161D" font-weight="600">✓ Decodes mouse behavior</text>
    <text x="880" y="598" font-size="15" fill="#444B55">from only a few examples,</text>
    <text x="880" y="620" font-size="15" fill="#444B55">via few-shot fine-tuning</text>
  </g>

  <!-- footer -->
  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">01 / 10</text>
</svg>
