<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2F5BEA"/>
  <rect x="0" y="0" width="12" height="720" fill="#F3F5F9"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">08 · ABLATION STUDY</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Every component pulls its weight</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- c1 left panel -->
  <g id="cue_s08_c1_ablation_removes_components_one_time">
    <title>Ablation removes components one at a time Current State Past State video behavior contrastive add predictive power</title>
    <desc>an ablation removes components one at a time the current state past state video stream behavior stream contrastive objective each add measurable predictive power</desc>
    <rect x="72" y="192" width="596" height="428" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="104" y="228" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">REMOVE COMPONENTS ONE AT A TIME (FIG. 6)</text>
    <rect x="104" y="240" width="532" height="248" rx="10" fill="#FFFFFF" stroke="#E3E7EE"/>
    <image href="../images/figure6.png" x="114" y="250" width="512" height="228" preserveAspectRatio="xMidYMid meet"/>
    <text x="104" y="516" font-size="16" fill="#12161D" font-weight="700">Each part adds measurable predictive power:</text>
    <g transform="translate(104,532)" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="0" y="0" width="100" height="40" rx="8" fill="#EAF0FB"/><text x="50" y="25" fill="#2F5BEA">Current St.</text>
      <rect x="108" y="0" width="100" height="40" rx="8" fill="#EAF0FB"/><text x="158" y="25" fill="#2F5BEA">Past St.</text>
      <rect x="216" y="0" width="100" height="40" rx="8" fill="#E4F5F2"/><text x="266" y="25" fill="#12A594">Video</text>
      <rect x="324" y="0" width="100" height="40" rx="8" fill="#FBE9E2"/><text x="374" y="25" fill="#E8663D">Behavior</text>
      <rect x="432" y="0" width="100" height="40" rx="8" fill="#EAF0FB"/><text x="482" y="25" fill="#2F5BEA">Contrastive</text>
    </g>
  </g>

  <!-- c2 strip -->
  <g id="cue_s08_c2_two_findings_stand_out">
    <title>Two findings stand out</title>
    <desc>two findings stand out</desc>
    <rect x="700" y="192" width="508" height="52" rx="12" fill="#12161D"/>
    <text x="724" y="224" font-size="19" fill="#FFFFFF" font-weight="700">Two findings stand out</text>
  </g>

  <!-- c3 two findings -->
  <g id="cue_s08_c3_jointly_neural_responses_behavior_be">
    <title>Jointly training neural responses behavior beats either alone contrastive objective helps most data scarce</title>
    <desc>jointly training on neural responses and behavior beats either alone contrastive objective helps most when data is scarce</desc>
    <rect x="700" y="260" width="508" height="172" rx="16" fill="#EAF0FB" stroke="#CBD9F7"/>
    <text x="724" y="296" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1">FINDING 1 · JOINT TRAINING</text>
    <text x="724" y="332" font-size="22" fill="#12161D" font-weight="700">Neural + behavior together</text>
    <text x="724" y="360" font-size="22" fill="#12161D" font-weight="700">beats either signal alone</text>
    <text x="724" y="398" font-size="15" fill="#444B55">the model links neural and behavioral</text>
    <text x="724" y="418" font-size="15" fill="#444B55">representations without supervision</text>

    <rect x="700" y="448" width="508" height="172" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="724" y="484" font-size="15" fill="#12A594" font-weight="700" letter-spacing="1">FINDING 2 · CONTRASTIVE OBJECTIVE</text>
    <text x="724" y="520" font-size="22" fill="#12161D" font-weight="700">Helps most when data is</text>
    <text x="724" y="548" font-size="22" fill="#12161D" font-weight="700">scarce</text>
    <text x="724" y="586" font-size="15" fill="#444B55">guards against over-fitting to noisy,</text>
    <text x="724" y="606" font-size="15" fill="#444B55">variable neural signals</text>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">08 / 10</text>
</svg>
