<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2F5BEA"/>
  <rect x="0" y="0" width="12" height="720" fill="#F3F5F9"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">04 · CONTRIBUTION</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Four contributions</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- card 1 -->
  <g id="cue_s04_c1_neuroformer_makes_four_contributions">
    <title>Neuroformer four contributions reframes spike analysis self-supervised autoregressive generation no labels</title>
    <desc>neuroformer makes four contributions reframes spike analysis self-supervised autoregressive generation needing no labels</desc>
    <rect x="72" y="196" width="548" height="200" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="72" y="196" width="8" height="200" rx="4" fill="#2F5BEA"/>
    <text x="104" y="248" font-size="34" fill="#2F5BEA" font-weight="800">1</text>
    <text x="150" y="248" font-size="21" fill="#12161D" font-weight="700">Spikes as generation</text>
    <text x="104" y="292" font-size="17" fill="#444B55">Reframes spike analysis as autoregressive</text>
    <text x="104" y="316" font-size="17" fill="#444B55">spatiotemporal generation —</text>
    <text x="104" y="340" font-size="17" fill="#12161D" font-weight="700">trained fully self-supervised, no labels.</text>
  </g>

  <!-- card 2 -->
  <g id="cue_s04_c2_its_cross_attention_scales_linearly">
    <title>Cross-attention scales linearly with feature size fuses many modalities</title>
    <desc>its cross-attention scales linearly with feature size fuses arbitrary many modalities</desc>
    <rect x="660" y="196" width="548" height="200" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="660" y="196" width="8" height="200" rx="4" fill="#12A594"/>
    <text x="692" y="248" font-size="34" fill="#12A594" font-weight="800">2</text>
    <text x="738" y="248" font-size="21" fill="#12161D" font-weight="700">Linear-scaling fusion</text>
    <text x="692" y="292" font-size="17" fill="#444B55">Cross-attention design scales</text>
    <text x="692" y="316" font-size="17" fill="#12161D" font-weight="700">linearly with feature size</text>
    <text x="692" y="340" font-size="17" fill="#444B55">and fuses an arbitrary number of modalities.</text>
  </g>

  <!-- card 3 -->
  <g id="cue_s04_c3_simulated_its_attention_maps_recover">
    <title>On simulated data attention maps recover directed connectivity hub neurons correlation misses</title>
    <desc>on simulated data its attention maps recover directed connectivity including hub neurons correlation misses</desc>
    <rect x="72" y="420" width="548" height="200" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="72" y="420" width="8" height="200" rx="4" fill="#2F5BEA"/>
    <text x="104" y="472" font-size="34" fill="#2F5BEA" font-weight="800">3</text>
    <text x="150" y="472" font-size="21" fill="#12161D" font-weight="700">Recovers connectivity</text>
    <text x="104" y="516" font-size="17" fill="#444B55">On a network with known ground truth,</text>
    <text x="104" y="540" font-size="17" fill="#444B55">attention maps recover the directed circuit,</text>
    <text x="104" y="564" font-size="17" fill="#12161D" font-weight="700">including hub neurons correlation misses.</text>
  </g>

  <!-- card 4 -->
  <g id="cue_s04_c4_pretrained_decodes_behavior_few_shot">
    <title>Pretrained decodes behavior few-shot fine-tuning</title>
    <desc>pretrained it decodes mouse behavior with few-shot fine-tuning</desc>
    <rect x="660" y="420" width="548" height="200" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="660" y="420" width="8" height="200" rx="4" fill="#E8663D"/>
    <text x="692" y="472" font-size="34" fill="#E8663D" font-weight="800">4</text>
    <text x="738" y="472" font-size="21" fill="#12161D" font-weight="700">Transfers to behavior</text>
    <text x="692" y="516" font-size="17" fill="#444B55">Once pretrained on neural responses,</text>
    <text x="692" y="540" font-size="17" fill="#12161D" font-weight="700">decodes mouse behavior with few-shot</text>
    <text x="692" y="564" font-size="17" fill="#12161D" font-weight="700">fine-tuning</text><text x="812" y="564" font-size="17" fill="#444B55"> — no explicit supervision.</text>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">04 / 10</text>
</svg>
