<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2F5BEA"/>
  <rect x="0" y="0" width="12" height="720" fill="#F3F5F9"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">06 · DATASET / BENCHMARK</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Validated at two levels</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- c1 strip -->
  <g id="cue_s06_c1_validation_spans_two_levels">
    <title>Validation spans two levels</title>
    <desc>validation spans two levels simulated ground truth and real data</desc>
    <rect x="72" y="188" width="1136" height="52" rx="12" fill="#EAF0FB" stroke="#CBD9F7"/>
    <text x="96" y="220" font-size="19" fill="#12161D" font-weight="700">Validation spans two levels: <tspan fill="#2F5BEA">ground-truth simulation</tspan> and <tspan fill="#12A594">real mouse cortex</tspan>.</text>
  </g>

  <!-- c2 panel -->
  <g id="cue_s06_c2_first_simulated_spiking_network_thre">
    <title>First simulated spiking network three hub neurons ground-truth connectivity matrix</title>
    <desc>first a simulated spiking network with three hub neurons gives a ground-truth connectivity matrix</desc>
    <rect x="72" y="258" width="548" height="362" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="72" y="258" width="8" height="362" rx="4" fill="#2F5BEA"/>
    <text x="104" y="294" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">LEVEL 1 · GROUND-TRUTH SIMULATION</text>
    <rect x="104" y="308" width="484" height="230" rx="10" fill="#FFFFFF" stroke="#E3E7EE"/>
    <image href="../images/figure2.png" x="114" y="316" width="464" height="214" preserveAspectRatio="xMidYMid meet"/>
    <text x="104" y="566" font-size="16" fill="#12161D" font-weight="700">3 strongly connected hub neurons</text>
    <text x="104" y="592" font-size="15" fill="#444B55">give a known connectivity matrix to check against</text>
  </g>

  <!-- c3 panel -->
  <g id="cue_s06_c3_second_two_photon_calcium_imaging_mo">
    <title>Second two-photon calcium imaging mouse visual cortex 386 neurons V1 AL gratings videos virtual navigation running speed</title>
    <desc>second two-photon calcium imaging of mouse visual cortex records 386 neurons across v1 and al viewing gratings natural videos plus virtual-navigation dataset pairing activity running speed</desc>
    <rect x="660" y="258" width="548" height="362" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="660" y="258" width="8" height="362" rx="4" fill="#12A594"/>
    <text x="692" y="294" font-size="14" fill="#12A594" font-weight="700" letter-spacing="1">LEVEL 2 · REAL MOUSE CORTEX</text>
    <rect x="692" y="308" width="484" height="196" rx="10" fill="#FFFFFF" stroke="#E3E7EE"/>
    <image href="../images/figure3.png" x="702" y="316" width="464" height="180" preserveAspectRatio="xMidYMid meet"/>
    <g transform="translate(692,520)">
      <rect x="0" y="0" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="75" y="20" text-anchor="middle" font-size="16" fill="#12161D" font-weight="800">386</text>
      <text x="75" y="37" text-anchor="middle" font-size="12" fill="#7A828E">reliable neurons</text>
      <rect x="167" y="0" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="242" y="20" text-anchor="middle" font-size="16" fill="#12161D" font-weight="800">V1 + AL</text>
      <text x="242" y="37" text-anchor="middle" font-size="12" fill="#7A828E">visual areas</text>
      <rect x="334" y="0" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="409" y="20" text-anchor="middle" font-size="16" fill="#12161D" font-weight="800">+ Visnav</text>
      <text x="409" y="37" text-anchor="middle" font-size="12" fill="#7A828E">speed / behavior</text>
    </g>
    <text x="692" y="602" font-size="15" fill="#444B55">gratings &amp; naturalistic videos · models ~40–100M params</text>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">06 / 10</text>
</svg>
