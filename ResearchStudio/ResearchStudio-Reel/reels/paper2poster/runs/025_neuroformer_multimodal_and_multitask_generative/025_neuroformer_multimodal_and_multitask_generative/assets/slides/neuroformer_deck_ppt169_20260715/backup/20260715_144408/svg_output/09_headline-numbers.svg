<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">09 · HEADLINE NUMBERS</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">By the numbers</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- c1: behavior prediction bars -->
  <g id="cue_s09_c1_behavior_prediction_neuroformer_reac">
    <title>Behavior prediction Neuroformer reaches Pearson correlation 0.97 versus 0.73 Lasso</title>
    <desc>for behavior prediction neuroformer reaches pearson correlation up to 0.97 versus about 0.73 for lasso</desc>
    <rect x="72" y="192" width="548" height="304" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="104" y="228" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">BEHAVIOR PREDICTION · PEAK PEARSON r</text>
    <line x1="104" y1="466" x2="588" y2="466" stroke="#D5DBE4" stroke-width="2"/>
    <!-- Neuroformer bar -->
    <rect x="150" y="288" width="150" height="178" rx="6" fill="#2F5BEA"/>
    <text x="225" y="278" text-anchor="middle" font-size="34" fill="#2F5BEA" font-weight="800">0.97</text>
    <text x="225" y="488" text-anchor="middle" font-size="16" fill="#12161D" font-weight="700">Neuroformer</text>
    <!-- Lasso bar -->
    <rect x="390" y="332" width="150" height="134" rx="6" fill="#C9D0DB"/>
    <text x="465" y="322" text-anchor="middle" font-size="34" fill="#7A828E" font-weight="800">0.73</text>
    <text x="465" y="488" text-anchor="middle" font-size="16" fill="#444B55" font-weight="700">Lasso</text>
  </g>

  <!-- c2: few-shot transfer -->
  <g id="cue_s09_c2_few_shot_pretrained_fine_tuned_just">
    <title>Few-shot pretrained fine-tuned 1% behavior data 0.51 beats non-pretrained 10% 0.33</title>
    <desc>few-shot a model pretrained and fine-tuned on just 1 percent of behavior data hits 0.51 beating a non-pretrained model given 10 percent which reaches only 0.33</desc>
    <rect x="660" y="192" width="548" height="304" rx="16" fill="#EAF0FB" stroke="#CBD9F7"/>
    <text x="692" y="228" font-size="14" fill="#12A594" font-weight="700" letter-spacing="1">FEW-SHOT TRANSFER · LESS DATA, HIGHER r</text>

    <g transform="translate(692,252)">
      <rect x="0" y="0" width="484" height="94" rx="12" fill="#FFFFFF" stroke="#12A594"/>
      <text x="20" y="38" font-size="17" fill="#12161D" font-weight="700">Pretrained · fine-tuned on 1% data</text>
      <text x="20" y="72" font-size="15" fill="#444B55">learns transferable structure first</text>
      <text x="464" y="60" text-anchor="end" font-size="44" fill="#12A594" font-weight="800">0.51</text>
    </g>
    <text x="912" y="372" text-anchor="middle" font-size="15" fill="#E8663D" font-weight="700">beats ↓ (10× more data)</text>
    <g transform="translate(692,382)">
      <rect x="0" y="0" width="484" height="94" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="20" y="38" font-size="17" fill="#12161D" font-weight="700">Non-pretrained · given 10% data</text>
      <text x="20" y="72" font-size="15" fill="#444B55">trained from scratch</text>
      <text x="464" y="60" text-anchor="end" font-size="44" fill="#7A828E" font-weight="800">0.33</text>
    </g>
  </g>

  <!-- c3: scale strip -->
  <g id="cue_s09_c3_its_largest_models_scale_roughly">
    <title>Its largest models scale to roughly 100 million parameters</title>
    <desc>its largest models scale to roughly 100 million parameters plus beats glm p 0.02</desc>
    <rect x="72" y="520" width="1136" height="100" rx="16" fill="#12161D"/>
    <text x="112" y="566" font-size="52" fill="#FFFFFF" font-weight="800">~100M</text>
    <text x="300" y="558" font-size="18" fill="#C9D2E6" font-weight="700">parameters in the largest models</text>
    <text x="300" y="588" font-size="16" fill="#9AA6C4">scales linearly with feature size</text>
    <line x1="740" y1="546" x2="740" y2="596" stroke="#3A4356" stroke-width="2"/>
    <text x="780" y="562" font-size="26" fill="#12A594" font-weight="800">p ≈ 0.02</text>
    <text x="780" y="590" font-size="16" fill="#9AA6C4">population responses beat a GLM</text>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">09 / 10</text>
</svg>
