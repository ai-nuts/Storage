<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">05 · METHOD</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Tokenize · align · fuse · decode</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- left column: 4 pipeline steps -->
  <g id="cue_s05_c1_neuroformer_treats_spike_token_split">
    <title>Neuroformer treats each spike as a token splitting activity into Current and Past States</title>
    <desc>neuroformer treats each spike as a token splitting activity into current and past states</desc>
    <rect x="72" y="198" width="512" height="94" rx="12" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="96" y="228" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">STEP 1 · TOKENIZE</text>
    <text x="96" y="256" font-size="18" fill="#12161D" font-weight="700">Each spike is a token</text>
    <text x="96" y="280" font-size="15" fill="#444B55">activity split into Current + Past State windows</text>
  </g>
  <g id="cue_s05_c2_video_becomes_patches_via_3">
    <title>Video becomes patches via 3D convolutional encoder behavior separate stream contrastive aligns</title>
    <desc>video becomes patches via a 3d-convolutional encoder behavior forms separate stream contrastive module aligns neural visual behavioral features</desc>
    <rect x="72" y="306" width="512" height="94" rx="12" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="96" y="336" font-size="14" fill="#12A594" font-weight="700" letter-spacing="1">STEP 2 · ENCODE + ALIGN</text>
    <text x="96" y="364" font-size="18" fill="#12161D" font-weight="700">3D-conv video patches · behavior stream</text>
    <text x="96" y="388" font-size="15" fill="#444B55">contrastive module aligns the three modalities</text>
  </g>
  <g id="cue_s05_c3_cross_attention_fuses_current_state">
    <title>Cross-attention fuses Current State with larger feature arrays cutting attention cost quadratic to linear</title>
    <desc>cross-attention fuses the current state with larger feature arrays cutting attention cost from quadratic to linear</desc>
    <rect x="72" y="414" width="512" height="94" rx="12" fill="#EAF0FB" stroke="#CBD9F7"/>
    <text x="96" y="444" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">STEP 3 · FUSE</text>
    <text x="96" y="472" font-size="18" fill="#12161D" font-weight="700">Cross-attention: Current State × features</text>
    <text x="96" y="496" font-size="15" fill="#12161D" font-weight="700">attention cost quadratic <tspan fill="#2F5BEA">→ linear</tspan></text>
  </g>
  <g id="cue_s05_c4_causally_masked_decoder_predicts_whi">
    <title>Causally masked decoder predicts which neuron fires and its time bin</title>
    <desc>a causally masked decoder predicts which neuron fires and its sub-interval time bin</desc>
    <rect x="72" y="522" width="512" height="94" rx="12" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="96" y="552" font-size="14" fill="#E8663D" font-weight="700" letter-spacing="1">STEP 4 · DECODE</text>
    <text x="96" y="580" font-size="18" fill="#12161D" font-weight="700">Causally masked transformer decoder</text>
    <text x="96" y="604" font-size="15" fill="#444B55">predicts which neuron fires + its time bin</text>
  </g>

  <!-- right column: architecture figure + equation -->
  <g>
    <rect x="612" y="198" width="596" height="272" rx="16" fill="#FFFFFF" stroke="#E3E7EE"/>
    <text x="632" y="226" font-size="14" fill="#7A828E" font-weight="700" letter-spacing="1">ARCHITECTURE (FIG. 1)</text>
    <image href="../images/figure1.png" x="632" y="238" width="556" height="212" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g>
    <rect x="612" y="486" width="596" height="130" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="632" y="516" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">JOINT OBJECTIVE</text>
    <text x="632" y="552" font-size="19" fill="#12161D" font-weight="700">ℒ = γ·ℒ_vnc + μ·ℒ_ce(I) + (1−γ−μ)·ℒ_ce(dt)</text>
    <text x="632" y="588" font-size="15" fill="#444B55">one contrastive loss + two spike cross-entropy losses,</text>
    <text x="632" y="608" font-size="15" fill="#444B55">optimized jointly end-to-end.</text>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">05 / 10</text>
</svg>
