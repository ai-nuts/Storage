<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">07 · KEY RESULT</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Connectivity recovered, behavior decoded</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- c1 -->
  <g id="cue_s07_c1_simulated_network_neuroformer_attent">
    <title>Simulated network Neuroformer attention reveals directed connectivity identifies hub neurons correlation misses directionality</title>
    <desc>on the simulated network neuroformer attention reveals directed connectivity identifies hub neurons plain correlation misses lack of directionality</desc>
    <rect x="72" y="192" width="548" height="196" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="72" y="192" width="8" height="196" rx="4" fill="#2F5BEA"/>
    <text x="104" y="230" font-size="14" fill="#2F5BEA" font-weight="700" letter-spacing="1">SIMULATED NETWORK</text>
    <text x="104" y="266" font-size="21" fill="#12161D" font-weight="700">Attention reveals directed</text>
    <text x="104" y="292" font-size="21" fill="#12161D" font-weight="700">connectivity + hub neurons</text>
    <text x="104" y="330" font-size="16" fill="#444B55">Plain Pearson correlation cannot —</text>
    <text x="104" y="354" font-size="16" fill="#444B55">it has no sense of direction.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s07_c2_real_cortex_reproduces_responses_gra">
    <title>Real cortex reproduces responses gratings natural videos population predictions significantly beating GLM p 0.02</title>
    <desc>on real cortex reproduces responses to gratings natural videos population predictions significantly beating a glm p around 0.02</desc>
    <rect x="660" y="192" width="548" height="196" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <rect x="660" y="192" width="8" height="196" rx="4" fill="#12A594"/>
    <text x="692" y="230" font-size="14" fill="#12A594" font-weight="700" letter-spacing="1">REAL CORTEX</text>
    <text x="692" y="266" font-size="21" fill="#12161D" font-weight="700">Reproduces responses to</text>
    <text x="692" y="292" font-size="21" fill="#12161D" font-weight="700">gratings &amp; natural videos</text>
    <text x="692" y="330" font-size="16" fill="#444B55">Population predictions beat a GLM,</text>
    <text x="692" y="354" font-size="16" fill="#12161D" font-weight="700">significantly (p ≈ 0.02).</text>
  </g>

  <!-- c3 -->
  <g id="cue_s07_c3_fine_tuned_decode_running_reaches_pe">
    <title>Fine-tuned decode running reaches Pearson correlations up to 0.97</title>
    <desc>fine-tuned to decode running behavior reaches pearson correlations up to 0.97</desc>
    <rect x="72" y="408" width="1136" height="212" rx="16" fill="#EAF0FB" stroke="#CBD9F7"/>
    <text x="104" y="444" font-size="14" fill="#E8663D" font-weight="700" letter-spacing="1">FINE-TUNED TO DECODE RUNNING BEHAVIOR</text>
    <rect x="104" y="456" width="700" height="148" rx="10" fill="#FFFFFF" stroke="#E3E7EE"/>
    <image href="../images/figure5.png" x="118" y="466" width="672" height="128" preserveAspectRatio="xMidYMid meet"/>
    <g transform="translate(836,456)">
      <rect x="0" y="0" width="336" height="148" rx="12" fill="#FFFFFF" stroke="#E8663D"/>
      <text x="168" y="66" text-anchor="middle" font-size="64" fill="#E8663D" font-weight="800">0.97</text>
      <text x="168" y="98" text-anchor="middle" font-size="17" fill="#12161D" font-weight="700">peak Pearson r</text>
      <text x="168" y="124" text-anchor="middle" font-size="14" fill="#444B55">predicted vs. true running speed</text>
    </g>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">07 / 10</text>
</svg>
