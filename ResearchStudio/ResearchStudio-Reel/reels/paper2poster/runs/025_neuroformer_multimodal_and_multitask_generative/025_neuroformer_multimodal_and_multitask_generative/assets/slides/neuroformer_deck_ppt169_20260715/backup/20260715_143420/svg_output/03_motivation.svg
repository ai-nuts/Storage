<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2F5BEA"/>
  <rect x="0" y="0" width="12" height="720" fill="#F3F5F9"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">03 · MOTIVATION</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Borrow the pretraining playbook</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- left: the recipe -->
  <g id="cue_s03_c1_large_pretrained_models_vision_langu">
    <title>Large pretrained models vision language learn general representations self-supervised transfer</title>
    <desc>large pretrained models in vision and language point a way forward learn general representations self-supervised from raw data transfer little labeling</desc>
    <rect x="72" y="196" width="520" height="424" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <text x="104" y="248" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1">WHAT WORKED IN VISION &amp; LANGUAGE</text>
    <g transform="translate(104,282)">
      <rect x="0" y="0" width="456" height="88" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="20" y="34" font-size="30" fill="#2F5BEA" font-weight="800">1</text>
      <text x="66" y="30" font-size="19" fill="#12161D" font-weight="700">Learn from raw data</text>
      <text x="66" y="58" font-size="15" fill="#444B55">no task labels — self-supervised prediction</text>
      <text x="66" y="78" font-size="15" fill="#444B55">of the next token</text>
    </g>
    <g transform="translate(104,382)">
      <rect x="0" y="0" width="456" height="72" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="20" y="46" font-size="30" fill="#2F5BEA" font-weight="800">2</text>
      <text x="66" y="34" font-size="19" fill="#12161D" font-weight="700">General representations</text>
      <text x="66" y="57" font-size="15" fill="#444B55">powerful features emerge directly from data</text>
    </g>
    <g transform="translate(104,466)">
      <rect x="0" y="0" width="456" height="72" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <text x="20" y="46" font-size="30" fill="#2F5BEA" font-weight="800">3</text>
      <text x="66" y="34" font-size="19" fill="#12161D" font-weight="700">Transfer with few labels</text>
      <text x="66" y="57" font-size="15" fill="#444B55">adapt to many downstream tasks cheaply</text>
    </g>
    <text x="104" y="580" font-size="15" fill="#7A828E" font-style="italic">A general-purpose recipe, proven at scale.</text>
  </g>

  <!-- bridge -->
  <text x="626" y="416" text-anchor="middle" font-size="40" fill="#12A594" font-weight="800">→</text>

  <!-- right: the question -->
  <g id="cue_s03_c2_authors_ask_whether_reframing_spike">
    <title>Authors ask whether reframing spike analysis generative prediction scale fuse modalities transfer</title>
    <desc>authors ask whether reframing spike analysis as generative prediction can likewise scale fuse modalities transfer behavior decoding</desc>
    <rect x="660" y="196" width="548" height="424" rx="16" fill="#EAF0FB" stroke="#CBD9F7"/>
    <text x="692" y="248" font-size="15" fill="#12A594" font-weight="700" letter-spacing="1">THE QUESTION FOR THE BRAIN</text>
    <text x="692" y="292" font-size="26" fill="#12161D" font-weight="700">Reframe spike analysis as a</text>
    <text x="692" y="324" font-size="26" fill="#12161D" font-weight="700">generative prediction problem?</text>
    <text x="692" y="360" font-size="17" fill="#444B55">If yes, one self-supervised model could:</text>

    <g transform="translate(692,384)">
      <rect x="0" y="0" width="484" height="56" rx="10" fill="#FFFFFF" stroke="#CBD9F7"/>
      <text x="20" y="35" font-size="18" fill="#12161D" font-weight="600"><tspan fill="#12A594" font-weight="800">Scale</tspan> to large, high-neuron recordings</text>
    </g>
    <g transform="translate(692,452)">
      <rect x="0" y="0" width="484" height="56" rx="10" fill="#FFFFFF" stroke="#CBD9F7"/>
      <text x="20" y="35" font-size="18" fill="#12161D" font-weight="600"><tspan fill="#12A594" font-weight="800">Fuse</tspan> an arbitrary number of modalities</text>
    </g>
    <g transform="translate(692,520)">
      <rect x="0" y="0" width="484" height="56" rx="10" fill="#FFFFFF" stroke="#CBD9F7"/>
      <text x="20" y="35" font-size="18" fill="#12161D" font-weight="600"><tspan fill="#12A594" font-weight="800">Transfer</tspan> to behavior decoding</text>
    </g>
  </g>

  <text x="72" y="694" font-size="13" fill="#9AA1AC">Neuroformer · ICLR 2024</text>
  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">03 / 10</text>
</svg>
