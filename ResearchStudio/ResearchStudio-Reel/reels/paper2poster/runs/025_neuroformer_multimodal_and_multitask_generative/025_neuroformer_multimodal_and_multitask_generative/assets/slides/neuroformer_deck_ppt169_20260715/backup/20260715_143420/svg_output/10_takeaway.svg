<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Inter, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2F5BEA"/>
  <rect x="0" y="0" width="12" height="720" fill="#F3F5F9"/>

  <text x="72" y="84" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1.5">10 · TAKEAWAY</text>
  <text x="72" y="130" font-size="40" fill="#12161D" font-weight="800">Pretraining, now for the brain</text>
  <rect x="72" y="148" width="64" height="4" rx="2" fill="#2F5BEA"/>

  <!-- c1 hero statement -->
  <g id="cue_s10_c1_takeaway_pretraining_paradigm_reshap">
    <title>Takeaway pretraining paradigm reshaped vision language can also work for the brain</title>
    <desc>the takeaway the pretraining paradigm that reshaped vision and language can also work for the brain</desc>
    <rect x="72" y="192" width="1136" height="180" rx="16" fill="#2F5BEA"/>
    <text x="112" y="268" font-size="34" fill="#FFFFFF" font-weight="800">The pretraining paradigm that reshaped vision and</text>
    <text x="112" y="316" font-size="34" fill="#FFFFFF" font-weight="800">language can also work for the brain.</text>
    <text x="112" y="352" font-size="17" fill="#C9D9FF">one self-supervised, multimodal, generative recipe</text>
  </g>

  <!-- c2 summary arc -->
  <g id="cue_s10_c2_treating_spikes_autoregressive_multi">
    <title>Treating spikes autoregressive multimodal generation one transformer recovers connectivity decodes behavior scalable neuroscience foundation models</title>
    <desc>treating spikes as autoregressive multimodal generation one self-supervised transformer recovers circuit directed connectivity decodes behavior few examples pointing toward scalable neuroscience foundation models</desc>
    <rect x="72" y="392" width="1136" height="216" rx="16" fill="#F3F5F9" stroke="#E3E7EE"/>
    <g transform="translate(104,424)">
      <rect x="0" y="0" width="344" height="152" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <rect x="0" y="0" width="8" height="152" rx="4" fill="#2F5BEA"/>
      <text x="28" y="42" font-size="15" fill="#2F5BEA" font-weight="700" letter-spacing="1">ONE FORMULATION</text>
      <text x="28" y="78" font-size="19" fill="#12161D" font-weight="700">Spikes as autoregressive,</text>
      <text x="28" y="104" font-size="19" fill="#12161D" font-weight="700">multimodal generation</text>
      <text x="28" y="134" font-size="14" fill="#444B55">a single self-supervised transformer</text>
    </g>
    <g transform="translate(468,424)">
      <rect x="0" y="0" width="344" height="152" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <rect x="0" y="0" width="8" height="152" rx="4" fill="#12A594"/>
      <text x="28" y="42" font-size="15" fill="#12A594" font-weight="700" letter-spacing="1">TWO OUTCOMES</text>
      <text x="28" y="78" font-size="19" fill="#12161D" font-weight="700">Recovers directed</text>
      <text x="28" y="104" font-size="19" fill="#12161D" font-weight="700">connectivity + decodes</text>
      <text x="28" y="130" font-size="19" fill="#12161D" font-weight="700">behavior from few examples</text>
    </g>
    <g transform="translate(832,424)">
      <rect x="0" y="0" width="344" height="152" rx="12" fill="#FFFFFF" stroke="#E3E7EE"/>
      <rect x="0" y="0" width="8" height="152" rx="4" fill="#E8663D"/>
      <text x="28" y="42" font-size="15" fill="#E8663D" font-weight="700" letter-spacing="1">WHERE IT POINTS</text>
      <text x="28" y="78" font-size="19" fill="#12161D" font-weight="700">Scalable neuroscience</text>
      <text x="28" y="104" font-size="19" fill="#12161D" font-weight="700">foundation models</text>
      <text x="28" y="134" font-size="14" fill="#444B55">and a future link to LLMs</text>
    </g>
  </g>

  <!-- links -->
  <g transform="translate(72,632)">
    <image href="../images/qr_code.png" x="0" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    <text x="50" y="17" font-size="14" fill="#444B55" font-weight="700">Code</text>
    <text x="50" y="35" font-size="13" fill="#7A828E">github.com/a-antoniades/Neuroformer</text>
    <image href="../images/qr_paper.png" x="470" y="0" width="40" height="40" preserveAspectRatio="xMidYMid meet"/>
    <text x="520" y="17" font-size="14" fill="#444B55" font-weight="700">Paper</text>
    <text x="520" y="35" font-size="13" fill="#7A828E">arxiv.org/abs/2311.00136 · ICLR 2024</text>
  </g>

  <text x="1208" y="694" text-anchor="end" font-size="13" fill="#9AA1AC">10 / 10</text>
</svg>
