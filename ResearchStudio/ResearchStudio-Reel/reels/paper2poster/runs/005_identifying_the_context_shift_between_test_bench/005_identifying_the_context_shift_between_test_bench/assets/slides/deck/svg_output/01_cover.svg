<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
    <rect x="0" y="0" width="14" height="720" fill="#14233B" />
  </g>

  <g id="cover-marks">
    <rect x="72" y="80" width="46" height="4" fill="#2563EB" />
    <text x="72" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="2.5">PERSPECTIVE · MACHINE LEARNING ROBUSTNESS</text>
  </g>

  <g id="cover-title">
    <text x="72" y="176" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#14233B">Identifying the</text>
    <text x="72" y="234" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#14233B">Context Shift</text>
    <text x="72" y="292" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#55617A">between test benchmarks</text>
    <text x="72" y="330" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#55617A">and production data</text>
  </g>

  <g id="cue_s01_c2_matthew_groh_mit_media_lab">
    <title>Matthew Groh MIT Media Lab author argues distribution shift wrong frame</title>
    <rect x="72" y="392" width="556" height="128" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="72" y="392" width="6" height="128" rx="3" fill="#2563EB" />
    <text x="100" y="426" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">AUTHOR</text>
    <text x="100" y="458" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#14233B">Matthew Groh</text>
    <text x="100" y="486" font-family="Arial, sans-serif" font-size="15" fill="#55617A">MIT Media Lab · groh@mit.edu</text>
    <text x="100" y="508" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">arXiv:2207.01059 · 2022</text>
  </g>

  <g id="cover-thesis-label">
    <text x="72" y="576" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#14233B" letter-spacing="1.5">THE ARGUMENT</text>
    <text x="72" y="606" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#1F2937">Distribution shift names the symptom.</text>
    <text x="72" y="632" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#1F2937">Context shift names the cause.</text>
  </g>

  <g id="cue_s01_c1_machine_learning_models_often_look">
    <title>machine learning models often look excellent benchmark datasets break production data</title>
    <rect x="680" y="80" width="528" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="680" y="80" width="6" height="150" rx="3" fill="#C2410C" />
    <text x="708" y="116" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.5">THE GAP</text>
    <text x="708" y="150" font-family="Arial, sans-serif" font-size="17" fill="#1F2937">Models look excellent on benchmark</text>
    <text x="708" y="176" font-family="Arial, sans-serif" font-size="17" fill="#1F2937">datasets, then break the moment they</text>
    <text x="708" y="202" font-family="Arial, sans-serif" font-size="17" fill="#1F2937">hit real production data.</text>
  </g>

  <g id="cue_s01_c3_distribution_shift_only_measures_two">
    <title>distribution shift only measures two datasets differ never tells you why</title>
    <rect x="680" y="248" width="528" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="680" y="248" width="6" height="150" rx="3" fill="#94A3B8" />
    <text x="708" y="284" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">WHY THE OLD FRAME FAILS</text>
    <text x="708" y="318" font-family="Arial, sans-serif" font-size="17" fill="#1F2937">Distribution shift only measures that</text>
    <text x="708" y="344" font-family="Arial, sans-serif" font-size="17" fill="#1F2937">two datasets differ. It never tells</text>
    <text x="708" y="370" font-family="Arial, sans-serif" font-size="17" fill="#1F2937">you why.</text>
  </g>

  <g id="cue_s01_c4_groh_introduces_context_shift_semant">
    <title>Groh introduces context shift semantically meaningful changes how data created collected curated</title>
    <rect x="680" y="416" width="528" height="224" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="680" y="416" width="6" height="224" rx="3" fill="#2563EB" />
    <text x="708" y="452" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE NEW LENS</text>
    <text x="708" y="506" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#FFFFFF">Context Shift</text>
    <text x="708" y="548" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">The semantically meaningful changes in</text>
    <text x="708" y="572" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">how data are created, collected,</text>
    <text x="708" y="596" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">and curated: the upstream cause of</text>
    <text x="708" y="620" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">the shifts we measure.</text>
  </g>

  <g id="footer">
    <text x="1208" y="702" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">01</text>
  </g>
</svg>
