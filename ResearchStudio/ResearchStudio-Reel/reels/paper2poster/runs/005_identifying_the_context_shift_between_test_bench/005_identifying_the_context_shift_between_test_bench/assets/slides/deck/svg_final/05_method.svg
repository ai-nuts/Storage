  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="64" y="58" width="6" height="42" fill="#2563EB" />
    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">Reason about the process, not just the gap</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">METHOD · THREE DRIVERS AND THREE RESPONSES</text>
  </g>

  <g id="cue_s05_c1_context_refers_semantically_meaningf">
    <title>context refers semantically meaningful upstream factors drive distribution shift</title>
    <rect x="64" y="150" width="1152" height="84" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="84" rx="3" fill="#2563EB" />
    <text x="92" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">DEFINITION</text>
    <text x="92" y="214" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF">Context = the semantically meaningful upstream factors that drive a distribution shift.</text>
  </g>

  <g id="cue_s05_c2_rather_fixating_difference_between_t">
    <title>rather fixating difference between two distributions reason three processes sample selection bias adversarial perturbations non-stationarity smartphones flip phones</title>
    <rect x="64" y="250" width="560" height="386" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="250" width="6" height="386" rx="3" fill="#C2410C" />
    <text x="92" y="286" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.5">THREE PROCESSES BEHIND THE DIFFERENCE</text>

    <rect x="92" y="304" width="504" height="100" rx="8" fill="#F4F7FB" />
    <text x="108" y="332" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#14233B">Sample selection bias</text>
    <text x="108" y="358" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">A new dataset drawn from a demographic</text>
    <text x="108" y="380" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">absent from the old one.</text>

    <rect x="92" y="414" width="504" height="100" rx="8" fill="#F4F7FB" />
    <text x="108" y="442" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#14233B">Adversarial perturbations</text>
    <text x="108" y="468" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">Imperceptible noise injections that</text>
    <text x="108" y="490" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">change model behavior.</text>

    <rect x="92" y="524" width="504" height="100" rx="8" fill="#F4F7FB" />
    <text x="108" y="552" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#14233B">Non-stationarity</text>
    <text x="108" y="578" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">The world moves on: smartphones after</text>
    <text x="108" y="600" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">2018 versus flip phones before 2010.</text>
  </g>

  <g id="cue_s05_c3_three_methods_follow_first_human">
    <title>three methods follow first human intuition expert knowledge identify semantically meaningful features models likely fail</title>
    <rect x="648" y="250" width="568" height="182" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="648" y="250" width="6" height="182" rx="3" fill="#2563EB" />
    <text x="676" y="286" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">METHOD 1 · HUMAN INTUITION</text>
    <text x="676" y="320" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Expert knowledge finds failure features</text>
    <text x="676" y="354" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Human intuition and expert knowledge can</text>
    <text x="676" y="378" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">identify the semantically meaningful</text>
    <text x="676" y="402" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">features on which models are likely to fail.</text>
  </g>

  <g id="cue_s05_c4_second_dynamic_benchmarking_replaces">
    <title>second dynamic benchmarking replaces single static test set continual evaluation corroborated accuracy third clarify limitations</title>
    <rect x="648" y="454" width="568" height="182" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="648" y="454" width="6" height="182" rx="3" fill="#0E9F9A" />
    <text x="676" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9F9A" letter-spacing="1.5">METHODS 2 &amp; 3 · DYNAMIC + HONEST</text>
    <text x="676" y="524" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Test the process, state the limits</text>
    <text x="676" y="558" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Dynamic benchmarking runs continual</text>
    <text x="676" y="582" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">evaluation against a quality-controlled</text>
    <text x="676" y="606" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">process (corroborated accuracy), and</text>
    <text x="676" y="628" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">authors clarify where behavior is unknown.</text>
  </g>

  <g id="footer">
