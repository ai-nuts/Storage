<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="64" y="58" width="6" height="42" fill="#2563EB" />
    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">A booming vocabulary that misses the cause</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">MOTIVATION · THE DIFFERENCE IS A SYMPTOM, NOT THE DISEASE</text>
  </g>

  <g id="cue_s03_c1_prior_work_treats_robustness_differe">
    <title>prior work treats robustness difference between two distributions disregarding reasons behind difference</title>
    <rect x="64" y="150" width="520" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="150" rx="3" fill="#94A3B8" />
    <text x="92" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">PRIOR WORK</text>
    <text x="92" y="216" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Robustness is treated as a difference</text>
    <text x="92" y="240" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">between two distributions, while the</text>
    <text x="92" y="264" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">reasons behind that difference are</text>
    <text x="92" y="288" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">disregarded.</text>
  </g>

  <g id="cue_s03_c2_but_difference_merely_symptom_diseas">
    <title>but difference merely symptom disease how data created collected curated</title>
    <rect x="64" y="318" width="520" height="150" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="64" y="318" width="6" height="150" rx="3" fill="#C2410C" />
    <text x="92" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">SYMPTOM VS DISEASE</text>
    <text x="92" y="384" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">The difference is merely a symptom.</text>
    <text x="92" y="408" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">The disease is in how data are created,</text>
    <text x="92" y="432" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">collected, and curated: the upstream</text>
    <text x="92" y="456" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">process that produced the gap.</text>
  </g>

  <g id="cue_s03_c4_despite_volume_vocabulary_stays_tang">
    <title>despite volume vocabulary stays tangled rarely points practitioners upstream semantically meaningful factors intervene</title>
    <rect x="64" y="486" width="520" height="150" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="486" width="6" height="150" rx="3" fill="#2563EB" />
    <text x="92" y="520" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">DESPITE THE VOLUME</text>
    <text x="92" y="552" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">The vocabulary stays tangled and rarely</text>
    <text x="92" y="576" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">points practitioners toward the upstream,</text>
    <text x="92" y="600" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">semantically meaningful factors they can</text>
    <text x="92" y="624" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">actually intervene on.</text>
  </g>

  <g id="cue_s03_c3_figure_1_shows_interest_distribution">
    <title>figure 1 shows interest distribution shift terminology grown covariate shift papers nine thousand per year 2021</title>
    <rect x="608" y="150" width="608" height="486" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="608" y="150" width="6" height="486" rx="3" fill="#2563EB" />
    <text x="636" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">FIGURE 1 · GOOGLE SCHOLAR PAPERS PER YEAR</text>
    <text x="636" y="216" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Interest in distribution shift has exploded</text>

    <line x1="680" y1="240" x2="680" y2="560" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="680" y1="560" x2="1180" y2="560" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="680" y1="300" x2="1180" y2="300" stroke="#E2E8F0" stroke-width="1" />
    <line x1="680" y1="420" x2="1180" y2="420" stroke="#E2E8F0" stroke-width="1" />

    <text x="672" y="245" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">9k</text>
    <text x="672" y="424" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">3k</text>
    <text x="672" y="565" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">0</text>
    <text x="680" y="584" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">2012</text>
    <text x="1180" y="584" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">2021</text>

    <polygon points="680,553 736,546 791,535 847,521 902,500 958,468 1013,421 1069,361 1124,300 1180,240 1180,560 680,560" fill="#2563EB" fill-opacity="0.10" />
    <polyline points="680,553 736,546 791,535 847,521 902,500 958,468 1013,421 1069,361 1124,300 1180,240" fill="none" stroke="#2563EB" stroke-width="3" />
    <circle cx="1180" cy="240" r="6" fill="#C2410C" />
    <text x="1168" y="228" text-anchor="end" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#C2410C">covariate shift ≈ 9,000 / yr</text>
    <text x="636" y="620" font-family="Arial, sans-serif" font-size="14" fill="#55617A">Covariate-shift papers alone climbed toward nine thousand per year by 2021.</text>
  </g>

  <g id="footer">
    <text x="64" y="702" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Groh 2022 · Figure 1</text>
    <text x="1216" y="702" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">03</text>
  </g>
</svg>
