<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="64" y="58" width="6" height="42" fill="#2563EB" />
    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">Dissecting existing benchmarks, not building a new one</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">BENCHMARKS · THREE DOMAINS UNDER THE LENS</text>
  </g>

  <g id="cue_s06_c1_rather_introducing_new_dataset_disse">
    <title>rather introducing new dataset dissects existing benchmarks facial expression recognition seven benchmarks SFEW MMI CK+ MultiPie</title>
    <rect x="64" y="150" width="369" height="344" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="344" rx="3" fill="#2563EB" />
    <text x="90" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.2">FACIAL EXPRESSION</text>
    <text x="90" y="228" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#14233B">7</text>
    <text x="128" y="228" font-family="Arial, sans-serif" font-size="16" fill="#55617A">benchmarks examined</text>
    <text x="90" y="266" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">The paper dissects existing sets</text>
    <text x="90" y="288" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">rather than adding a new one.</text>
    <rect x="90" y="308" width="317" height="34" rx="8" fill="#F4F7FB" />
    <text x="104" y="331" font-family="Arial, sans-serif" font-size="15" fill="#14233B">SFEW · MMI</text>
    <rect x="90" y="350" width="317" height="34" rx="8" fill="#F4F7FB" />
    <text x="104" y="373" font-family="Arial, sans-serif" font-size="15" fill="#14233B">CK+ · MultiPie</text>
    <text x="90" y="416" font-family="Arial, sans-serif" font-size="15" fill="#55617A">Accuracy swings wildly from</text>
    <text x="90" y="438" font-family="Arial, sans-serif" font-size="15" fill="#55617A">one benchmark to the next,</text>
    <text x="90" y="460" font-family="Arial, sans-serif" font-size="15" fill="#55617A">as the next slides show.</text>
  </g>

  <g id="cue_s06_c2_deepfake_detection_centers_dfdc_data">
    <title>deepfake detection centers DFDC dataset largest 128154 videos 960 consenting actors</title>
    <rect x="455" y="150" width="369" height="344" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="455" y="150" width="6" height="344" rx="3" fill="#C2410C" />
    <text x="481" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.2">DEEPFAKE DETECTION</text>
    <text x="481" y="224" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFFFFF">DFDC</text>
    <text x="481" y="250" font-family="Arial, sans-serif" font-size="15" fill="#EEF2F9">The largest dataset to date</text>
    <rect x="481" y="272" width="317" height="86" rx="8" fill="#1F3350" />
    <text x="497" y="316" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF">128,154</text>
    <text x="497" y="342" font-family="Arial, sans-serif" font-size="15" fill="#EEF2F9">videos</text>
    <rect x="481" y="366" width="317" height="86" rx="8" fill="#1F3350" />
    <text x="497" y="410" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#FFFFFF">960</text>
    <text x="497" y="436" font-family="Arial, sans-serif" font-size="15" fill="#EEF2F9">consenting actors</text>
    <text x="481" y="480" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">A high-context real-world target.</text>
  </g>

  <g id="cue_s06_c3_medical_diagnosis_looks_store_and_fo">
    <title>medical diagnosis looks store-and-forward teledermatology Diverse Dermatology Images dataset</title>
    <rect x="846" y="150" width="370" height="344" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="846" y="150" width="6" height="344" rx="3" fill="#0E9F9A" />
    <text x="872" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9F9A" letter-spacing="1.2">MEDICAL DIAGNOSIS</text>
    <text x="872" y="224" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#14233B">Teledermatology</text>
    <text x="872" y="252" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">Store-and-forward diagnosis</text>
    <text x="872" y="274" font-family="Arial, sans-serif" font-size="15" fill="#1F2937">from submitted skin images.</text>
    <rect x="872" y="296" width="318" height="70" rx="8" fill="#F4F7FB" />
    <text x="888" y="324" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#14233B">Diverse Dermatology</text>
    <text x="888" y="348" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#14233B">Images (DDI)</text>
    <text x="872" y="400" font-family="Arial, sans-serif" font-size="15" fill="#55617A">Skin-tone coverage is thin,</text>
    <text x="872" y="422" font-family="Arial, sans-serif" font-size="15" fill="#55617A">so systematic errors can</text>
    <text x="872" y="444" font-family="Arial, sans-serif" font-size="15" fill="#55617A">hide in plain sight.</text>
  </g>

  <g id="cue_s06_c4_throughout_holds_context_aware_bench">
    <title>throughout holds context-aware benchmarks like BREEDS WILDS Dynabench models capturing data-generation process single static snapshot</title>
    <rect x="64" y="512" width="1152" height="124" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="512" width="6" height="124" rx="3" fill="#2563EB" />
    <text x="92" y="546" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">CONTEXT-AWARE BENCHMARKS AS MODELS</text>
    <text x="92" y="580" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">BREEDS · WILDS · Dynabench capture the data-generation process,</text>
    <text x="92" y="608" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">holding it up as a model for evaluation instead of a single static snapshot.</text>
  </g>

  <g id="footer">
    <text x="64" y="702" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Groh 2022 · Benchmarks</text>
    <text x="1216" y="702" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">06</text>
  </g>
</svg>
