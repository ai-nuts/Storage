<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
    <rect x="0" y="0" width="14" height="720" fill="#14233B" />
  </g>

  <g id="header">
    <rect x="72" y="58" width="46" height="4" fill="#2563EB" />
    <text x="72" y="98" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">Stop measuring distance. Start naming context.</text>
    <text x="72" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">TAKEAWAY · A SHIFT IN PERSPECTIVE</text>
  </g>

  <g id="cue_s09_c1_lasting_message_shift_perspective_st">
    <title>lasting message shift perspective stop treating benchmark production gap statistical distance start treating context shift semantically meaningful changes data generated</title>
    <rect x="72" y="158" width="1136" height="150" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="72" y="158" width="6" height="150" rx="3" fill="#2563EB" />
    <text x="100" y="192" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE LASTING MESSAGE</text>
    <text x="100" y="228" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFFFFF">Stop treating the benchmark-to-production gap as a statistical distance</text>
    <text x="100" y="258" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FFFFFF">between two datasets.</text>
    <text x="100" y="290" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">Treat it as context shift: the semantically meaningful changes in how data are generated.</text>
  </g>

  <g id="cue_s09_c2_address_pairing_machine_learning_hum">
    <title>address pairing machine learning human intuition expertise moving static dynamic benchmarks evaluate data-generation process clarifying model limitations</title>
    <rect x="72" y="326" width="1136" height="160" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="72" y="326" width="6" height="160" rx="3" fill="#2563EB" />
    <text x="100" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">THREE WAYS TO ADDRESS IT</text>
    <rect x="100" y="378" width="352" height="90" rx="8" fill="#F4F7FB" />
    <text x="118" y="406" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#14233B">1 · Human intuition</text>
    <text x="118" y="430" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">Pair machine learning with</text>
    <text x="118" y="450" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">expert knowledge.</text>
    <rect x="464" y="378" width="352" height="90" rx="8" fill="#F4F7FB" />
    <text x="482" y="406" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#14233B">2 · Dynamic benchmarks</text>
    <text x="482" y="430" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">Evaluate the data-generation</text>
    <text x="482" y="450" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">process, not one static set.</text>
    <rect x="828" y="378" width="360" height="90" rx="8" fill="#F4F7FB" />
    <text x="846" y="406" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#14233B">3 · Clarify limitations</text>
    <text x="846" y="430" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">State where behavior is</text>
    <text x="846" y="450" font-family="Arial, sans-serif" font-size="14" fill="#1F2937">known and unknown.</text>
  </g>

  <g id="cue_s09_c3_simplest_most_immediately_effective">
    <title>simplest most immediately effective step honesty state plainly contexts model evaluated contexts behavior remains unknown</title>
    <rect x="72" y="504" width="1136" height="132" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="72" y="504" width="6" height="132" rx="3" fill="#0E9F9A" />
    <text x="100" y="538" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9F9A" letter-spacing="1.5">THE SIMPLEST FIRST STEP: HONESTY</text>
    <text x="100" y="572" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#14233B">State plainly the contexts in which a model has been evaluated,</text>
    <text x="100" y="600" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#14233B">and the contexts in which its behavior remains unknown.</text>
    <text x="100" y="626" font-family="Arial, sans-serif" font-size="14" fill="#55617A">The simplest and most immediately effective step toward closing the gap.</text>
  </g>

  <g id="footer">
    <text x="72" y="702" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Matthew Groh · MIT Media Lab · arXiv:2207.01059</text>
    <text x="1208" y="702" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">09</text>
  </g>
</svg>
