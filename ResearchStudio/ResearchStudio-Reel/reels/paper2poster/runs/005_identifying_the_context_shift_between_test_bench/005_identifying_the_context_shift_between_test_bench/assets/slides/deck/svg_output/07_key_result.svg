<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="64" y="58" width="6" height="42" fill="#2563EB" />
    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">The benchmark you pick decides the story you tell</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">KEY RESULT · ACCURACY SWINGS WITH THE TEST SET</text>
  </g>

  <g id="cue_s07_c1_headline_evidence_how_wildly_perform">
    <title>headline evidence how wildly performance swings benchmark AlexNet 48.6 SFEW 94.8 MultiPie random baseline 14.2</title>
    <rect x="64" y="150" width="560" height="486" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="486" rx="3" fill="#2563EB" />
    <text x="92" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.2">ONE FACIAL-EXPRESSION MODEL (ALEXNET)</text>
    <text x="92" y="216" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Same model, 48.6% to 94.8% accuracy</text>

    <line x1="100" y1="580" x2="596" y2="580" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="120" y="537" width="96" height="43" fill="#94A3B8" />
    <text x="168" y="527" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#55617A">14.2%</text>
    <text x="168" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#55617A">Random</text>

    <rect x="260" y="434" width="96" height="146" fill="#C2410C" />
    <text x="308" y="424" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#C2410C">48.6%</text>
    <text x="308" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#55617A">SFEW (worst)</text>

    <rect x="400" y="296" width="96" height="284" fill="#2563EB" />
    <text x="448" y="286" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#2563EB">94.8%</text>
    <text x="448" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#55617A">MultiPie (best)</text>

    <text x="92" y="628" font-family="Arial, sans-serif" font-size="14" fill="#55617A">A 46-point swing across seven benchmarks for a single trained model.</text>
  </g>

  <g id="cue_s07_c2_pattern_generalizes_when_researchers">
    <title>pattern generalizes when researchers faithfully recreated ImageNet CIFAR-10 test sets state-of-the-art accuracy fell three fifteen percent</title>
    <rect x="648" y="150" width="568" height="150" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="648" y="150" width="6" height="150" rx="3" fill="#C2410C" />
    <text x="676" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.2">THE PATTERN GENERALIZES</text>
    <text x="676" y="216" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Faithfully recreating the ImageNet and</text>
    <text x="676" y="240" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">CIFAR-10 test sets cut state-of-the-art</text>
    <text x="676" y="264" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">accuracy by 3 to 15 percent.</text>
  </g>

  <g id="cue_s07_c3_leading_dfdc_deepfake_detector_assig">
    <title>leading DFDC deepfake detector assigned only two eight percent likelihood genuine deepfakes Kim Jong-un Vladimir Putin high-context</title>
    <rect x="648" y="318" width="568" height="150" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="648" y="318" width="6" height="150" rx="3" fill="#2563EB" />
    <text x="676" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.2">DEEPFAKE DETECTION FAILS WHERE IT MATTERS</text>
    <text x="676" y="384" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">A leading DFDC detector gave only 2% and</text>
    <text x="676" y="408" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">8% likelihood to genuine deepfakes of</text>
    <text x="676" y="432" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Kim Jong-un and Vladimir Putin: exactly</text>
    <text x="676" y="456" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">the high-context videos that matter.</text>
  </g>

  <g id="cue_s07_c4_dermatology_benchmarks_barely_includ">
    <title>dermatology benchmarks barely include dark skin systematic errors hide plain sight</title>
    <rect x="648" y="486" width="568" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="648" y="486" width="6" height="150" rx="3" fill="#0E9F9A" />
    <text x="676" y="520" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9F9A" letter-spacing="1.2">DERMATOLOGY</text>
    <text x="676" y="552" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Benchmarks that barely include dark skin</text>
    <text x="676" y="576" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">let systematic errors hide in plain sight,</text>
    <text x="676" y="600" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">unmeasured by the test set that is</text>
    <text x="676" y="624" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">supposed to catch them.</text>
  </g>

  <g id="footer">
    <text x="64" y="702" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Groh 2022 · Key Result</text>
