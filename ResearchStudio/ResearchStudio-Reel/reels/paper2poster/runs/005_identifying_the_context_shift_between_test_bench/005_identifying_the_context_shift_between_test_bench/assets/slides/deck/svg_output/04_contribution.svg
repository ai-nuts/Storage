<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="64" y="58" width="6" height="42" fill="#2563EB" />
    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">Reframing the problem, then acting on it</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">CONTRIBUTION · ONE CONCEPT, THREE METHODS, THREE DOMAINS</text>
  </g>

  <g id="cue_s04_c1_perspective_reframes_robustness_prob">
    <title>perspective paper reframes robustness problem</title>
    <rect x="64" y="150" width="1152" height="104" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="104" rx="3" fill="#94A3B8" />
    <text x="92" y="184" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">A PERSPECTIVE PAPER</text>
    <text x="92" y="216" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#14233B">This paper reframes the robustness problem rather than proposing a new model.</text>
    <text x="92" y="242" font-family="Arial, sans-serif" font-size="15" fill="#55617A">It changes the question from how far two distributions differ to why the data-generating process changed.</text>
  </g>

  <g id="cue_s04_c2_its_central_contribution_concept_con">
    <title>its central contribution concept context shift semantically meaningful upstream sample selection bias adversarial perturbation non-stationarity drive distribution shifts</title>
    <rect x="64" y="270" width="560" height="366" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="64" y="270" width="6" height="366" rx="3" fill="#2563EB" />
    <text x="92" y="306" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">CENTRAL CONTRIBUTION</text>
    <text x="92" y="352" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#FFFFFF">Context Shift</text>
    <text x="92" y="388" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">The semantically meaningful upstream</text>
    <text x="92" y="412" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">factors that drive the distribution</text>
    <text x="92" y="436" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">shifts we observe:</text>
    <rect x="92" y="458" width="440" height="46" rx="8" fill="#1F3350" />
    <text x="108" y="487" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1 · Sample selection bias</text>
    <rect x="92" y="514" width="440" height="46" rx="8" fill="#1F3350" />
    <text x="108" y="543" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2 · Adversarial perturbation</text>
    <rect x="92" y="570" width="440" height="46" rx="8" fill="#1F3350" />
    <text x="108" y="599" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3 · Non-stationarity</text>
  </g>

  <g id="cue_s04_c3_top_framing_groh_identifies_three">
    <title>on top framing groh identifies three practical methods closing benchmark production gap three recurring case-study domains facial expression deepfake medical</title>
    <rect x="648" y="270" width="568" height="366" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="648" y="270" width="6" height="366" rx="3" fill="#0E9F9A" />
    <text x="676" y="306" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9F9A" letter-spacing="1.5">ON TOP OF THE FRAMING</text>
    <text x="676" y="340" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Three methods to close the gap</text>
    <text x="676" y="372" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">1 · Human intuition and expert knowledge</text>
    <text x="676" y="398" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">2 · Dynamic benchmarking</text>
    <text x="676" y="424" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">3 · Clarifying model limitations</text>
    <line x1="676" y1="446" x2="1188" y2="446" stroke="#E2E8F0" stroke-width="1" />
    <text x="676" y="478" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Illustrated in three domains</text>
    <rect x="676" y="496" width="512" height="40" rx="8" fill="#EEF2F9" />
    <text x="692" y="521" font-family="Arial, sans-serif" font-size="15" fill="#14233B">Facial expression recognition</text>
    <rect x="676" y="544" width="512" height="40" rx="8" fill="#EEF2F9" />
    <text x="692" y="569" font-family="Arial, sans-serif" font-size="15" fill="#14233B">Deepfake detection</text>
    <rect x="676" y="592" width="512" height="40" rx="8" fill="#EEF2F9" />
    <text x="692" y="617" font-family="Arial, sans-serif" font-size="15" fill="#14233B">Medical diagnosis</text>
  </g>

