    <rect x="652" y="364" width="6" height="200" rx="3" fill="#0E9F9A" />
    <text x="680" y="400" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0E9F9A" letter-spacing="1.2">DERMATOLOGY COVERAGE</text>
    <text x="680" y="470" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#14233B">2.7%</text>
    <text x="680" y="506" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Share of the second-darkest skin type in one</text>
    <text x="680" y="530" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">benchmark, with a single person of the darkest.</text>
  </g>

  <g id="dfdc-strip">
