    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">Five numbers that anchor the argument</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">HEADLINE NUMBERS · CONTEXT DECIDES THE SCORE</text>
  </g>

  <g id="cue_s08_c1_few_numbers_anchor_argument_single">
    <title>few numbers anchor argument single facial expression model spans 48.6 94.8 percent seven benchmarks 14.2 random baseline</title>
    <rect x="64" y="150" width="564" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="200" rx="3" fill="#2563EB" />
    <text x="92" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.2">ONE MODEL, SEVEN BENCHMARKS</text>
    <text x="92" y="256" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#14233B">48.6 → 94.8%</text>
    <text x="92" y="292" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Accuracy range for a single facial-expression</text>
    <text x="92" y="316" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">model, against a 14.2% random baseline.</text>
  </g>

  <g id="cue_s08_c2_faithfully_recreated_imagenet_cifar">
    <title>faithfully recreated imagenet cifar-10 test sets cut state-of-the-art accuracy three fifteen percent</title>
    <rect x="652" y="150" width="564" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="652" y="150" width="6" height="200" rx="3" fill="#C2410C" />
    <text x="680" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.2">RECREATED TEST SETS</text>
    <text x="680" y="256" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#14233B">3 to 15%</text>
    <text x="680" y="292" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Drop in state-of-the-art accuracy on faithfully</text>
    <text x="680" y="316" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">recreated ImageNet and CIFAR-10 test sets.</text>
  </g>

  <g id="cue_s08_c3_leading_deepfake_detector_gave_only">
    <title>leading deepfake detector gave only two eight percent likelihood real deepfakes world leaders</title>
    <rect x="64" y="364" width="564" height="200" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="64" y="364" width="6" height="200" rx="3" fill="#2563EB" />
    <text x="92" y="400" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.2">DEEPFAKE DETECTOR ON REAL DEEPFAKES</text>
    <text x="92" y="470" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#FFFFFF">2% &amp; 8%</text>
    <text x="92" y="506" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">Likelihood a leading detector assigned to real</text>
    <text x="92" y="530" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">deepfakes of two world leaders.</text>
  </g>

  <g id="cue_s08_c4_one_dermatology_benchmark_included_j">
    <title>one dermatology benchmark included just 2.7 percent second-darkest skin type single person darkest</title>
