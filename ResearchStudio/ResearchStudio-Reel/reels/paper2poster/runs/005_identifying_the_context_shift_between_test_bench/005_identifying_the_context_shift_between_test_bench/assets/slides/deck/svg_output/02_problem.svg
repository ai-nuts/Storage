<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="64" y="58" width="6" height="42" fill="#2563EB" />
    <text x="88" y="90" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#14233B">A static benchmark cannot stand in for a dynamic world</text>
    <text x="88" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">THE PROBLEM · WHY STRONG SCORES DO NOT TRANSFER</text>
  </g>

  <g id="cue_s02_c1_benchmark_datasets_play_two_roles">
    <title>benchmark datasets play two roles compare methods stand in imperfect model real world</title>
    <rect x="64" y="150" width="564" height="233" rx="12" fill="#F4F7FB" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="150" width="6" height="233" rx="3" fill="#2563EB" />
    <text x="92" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">TWO ROLES OF A BENCHMARK</text>
    <text x="92" y="222" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Compare methods, model the world</text>
    <text x="92" y="256" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">A benchmark lets researchers compare</text>
    <text x="92" y="280" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">methods, and also stands in as an</text>
    <text x="92" y="304" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">imperfect model of the real world.</text>
    <text x="92" y="344" font-family="Arial, sans-serif" font-size="15" fill="#55617A">One static set cannot capture a dynamic,</text>
    <text x="92" y="366" font-family="Arial, sans-serif" font-size="15" fill="#55617A">high-dimensional real task.</text>
  </g>

  <g id="cue_s02_c2_models_appear_match_beat_human_level">
    <title>models appear match beat human-level accuracy benchmark err out-of-distribution adversarial production</title>
    <rect x="652" y="150" width="564" height="233" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="652" y="150" width="6" height="233" rx="3" fill="#C2410C" />
    <text x="680" y="186" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.5">HUMAN-LEVEL ON PAPER</text>
    <text x="680" y="222" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Errors in the wild</text>
    <text x="680" y="256" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">Models that match or beat human-level</text>
    <text x="680" y="280" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">accuracy on a benchmark routinely err</text>
    <text x="680" y="304" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">on out-of-distribution and adversarially</text>
    <text x="680" y="328" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">perturbed production data.</text>
  </g>

  <g id="cue_s02_c3_field_describes_gap_distribution_shi">
    <title>field describes gap distribution shift subcategories covariate shift prior probability shift concept shift</title>
    <rect x="64" y="403" width="564" height="233" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="403" width="6" height="233" rx="3" fill="#94A3B8" />
    <text x="92" y="439" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">THE FIELD'S NAME FOR THE GAP</text>
    <text x="92" y="475" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#14233B">Distribution shift</text>
    <text x="92" y="509" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">The field describes this gap as</text>
    <text x="92" y="533" font-family="Arial, sans-serif" font-size="16" fill="#1F2937">distribution shift, with subcategories:</text>
    <rect x="92" y="552" width="150" height="30" rx="15" fill="#EEF2F9" />
    <text x="104" y="572" font-family="Arial, sans-serif" font-size="14" fill="#14233B">covariate shift</text>
    <rect x="256" y="552" width="140" height="30" rx="15" fill="#EEF2F9" />
    <text x="268" y="572" font-family="Arial, sans-serif" font-size="14" fill="#14233B">prior probability</text>
    <rect x="410" y="552" width="120" height="30" rx="15" fill="#EEF2F9" />
    <text x="422" y="572" font-family="Arial, sans-serif" font-size="14" fill="#14233B">concept shift</text>
  </g>

  <g id="cue_s02_c4_but_these_definitions_over_specified">
    <title>but these definitions over-specified comparing two data samples under-specified evaluating data-generating process</title>
    <rect x="652" y="403" width="564" height="233" rx="12" fill="#14233B" stroke="#14233B" stroke-width="1.5" />
    <rect x="652" y="403" width="6" height="233" rx="3" fill="#2563EB" />
    <text x="680" y="439" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE MISMATCH</text>
    <text x="680" y="475" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#FFFFFF">Over- and under-specified</text>
    <text x="680" y="509" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">These definitions are over-specified for</text>
    <text x="680" y="533" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">comparing two data samples, and</text>
    <text x="680" y="557" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">under-specified for evaluating the</text>
    <text x="680" y="581" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">data-generating process that actually</text>
    <text x="680" y="605" font-family="Arial, sans-serif" font-size="16" fill="#EEF2F9">drives the mismatch.</text>
  </g>

  <g id="footer">
    <text x="64" y="702" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Groh 2022 · Identifying the Context Shift</text>
    <text x="1216" y="702" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">02</text>
  </g>
</svg>
