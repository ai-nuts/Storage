<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">PROBLEM</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="38" font-weight="800" fill="#EAF1FB" text-anchor="start">Fitting the lasso path is expensive</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">02 / 09</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s02_c1_sparse_regression_lasso_workhorse_hi">
  <title>sparse regression lasso workhorse high-dimensional but fitting expensive</title>
  <desc>Sparse regression lasso workhorse high-dimensional data fitting expensive.</desc>
<rect x="56" y="160" width="1168" height="84" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="76" y="180" width="5" height="44" rx="2.5" fill="#4F9DF7" />
<text x="96" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#EAF1FB" text-anchor="start">The lasso is a workhorse for high-dimensional sparse regression</text>
<text x="96" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">but actually fitting it is computationally expensive</text>
</g>
<g id="cue_s02_c2_best_penalty_strength_never_known">
  <title>best penalty strength never known advance practitioners fit entire path</title>
  <desc>Best penalty strength never known fit entire path cross-validation refitting again.</desc>
<rect x="56" y="264" width="373.3333333333333" height="306" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="78" y="290" width="5" height="30" rx="2.5" fill="#F2708A" />
<text x="78" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EAF1FB" text-anchor="start">The penalty is unknown</text>
<text x="78" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">The best penalty strength is never</text>
<text x="78" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">known in advance, so you fit an</text>
<text x="78" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">entire path of models and tune by</text>
<text x="78" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">cross-validation.</text>
<rect x="78" y="478" width="329.3333333333333" height="68" rx="12" ry="12" fill="#301B27" stroke="#F2708A" stroke-width="1.2" />
<text x="94" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="800" fill="#F2708A" text-anchor="start">refit again and again</text>
<text x="94" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#A6BADB" text-anchor="start">many penalty values x CV folds</text>
</g>
<g id="cue_s02_c3_screening_rules_help_discarding_pred">
  <title>screening rules help discarding predictors before solver even runs shrinking</title>
  <desc>Screening rules help discarding predictors before solver runs shrinking subproblem.</desc>
<rect x="453.3333333333333" y="264" width="373.3333333333333" height="306" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="475.3333333333333" y="290" width="5" height="30" rx="2.5" fill="#37DCC0" />
<text x="475.3333333333333" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EAF1FB" text-anchor="start">Screening rules help</text>
<text x="475.3333333333333" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">They discard predictors before the</text>
<text x="475.3333333333333" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">solver even runs, shrinking each</text>
<text x="475.3333333333333" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">subproblem it has to solve.</text>
<rect x="475.3333333333333" y="478" width="329.3333333333333" height="68" rx="12" ry="12" fill="#12312B" stroke="#37DCC0" stroke-width="1.2" />
<text x="491.3333333333333" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="800" fill="#37DCC0" text-anchor="start">fewer predictors</text>
<text x="491.3333333333333" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#A6BADB" text-anchor="start">smaller problem per solve</text>
</g>
<g id="cue_s02_c4_trouble_widely_used_rules_become">
  <title>trouble widely used rules become conservative inefficient precisely when predictors</title>
  <desc>Trouble widely used rules become conservative inefficient predictors strongly correlated speed matters.</desc>
<rect x="850.6666666666666" y="264" width="373.3333333333333" height="306" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="872.6666666666666" y="290" width="5" height="30" rx="2.5" fill="#F7B84B" />
<text x="872.6666666666666" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EAF1FB" text-anchor="start">But they break down</text>
<text x="872.6666666666666" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">The widely used rules turn</text>
<text x="872.6666666666666" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">conservative and inefficient</text>
<text x="872.6666666666666" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">exactly when predictors are</text>
<text x="872.6666666666666" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">strongly correlated.</text>
<rect x="872.6666666666666" y="478" width="329.3333333333333" height="68" rx="12" ry="12" fill="#332A18" stroke="#F7B84B" stroke-width="1.2" />
<text x="888.6666666666666" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="800" fill="#F7B84B" text-anchor="start">high correlation</text>
<text x="888.6666666666666" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="400" fill="#A6BADB" text-anchor="start">the regime where speed matters most</text>
</g>
</svg>
