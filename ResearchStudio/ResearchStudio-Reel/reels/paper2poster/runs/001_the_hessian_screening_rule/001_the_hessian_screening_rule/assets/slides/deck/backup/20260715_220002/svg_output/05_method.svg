<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">METHOD</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="38" font-weight="800" fill="#EAF1FB" text-anchor="start">Linearity in lambda unlocks the Hessian</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">05 / 09</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s05_c1_method_rests_simple_fact_any">
  <title>method rests simple fact any interval where active set nonzero</title>
  <desc>Method rests simple fact any interval active set nonzero coefficients unchanged lasso solution linear function penalty lambda.</desc>
<rect x="56" y="160" width="1168" height="122" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="76" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#4F9DF7" text-anchor="start">On any interval where the active set is fixed, the lasso solution is linear in the penalty lambda</text>
<text x="76" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="600" fill="#EAF1FB" text-anchor="start">beta(lambda) is piecewise-linear   -&gt;   the same slope drives both screening and the warm start</text>
<text x="76" y="262" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5" font-weight="500" fill="#A6BADB" text-anchor="start">active set A = { j : beta_j != 0 }   fixed on the interval</text>
</g>
<g id="cue_s05_c2_linearity_lets_authors_write_down">
  <title>linearity lets authors write down second-order estimate correlation next penalty</title>
  <desc>That linearity lets authors write second-order estimate correlation next penalty value Hessian active predictors.</desc>
<rect x="56" y="302" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="78" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#57D9A3" text-anchor="start">1  Second-order screen</text>
<text x="78" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Write a second-order estimate of the</text>
<text x="78" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">next-step correlation using the</text>
<text x="78" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Hessian of the active predictors.</text>
<rect x="78" y="452" width="330.6666666666667" height="46" rx="9" ry="9" fill="#0E1A30" />
<text x="92" y="474" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#37DCC0" text-anchor="start">c_H = c + dl · X^T X_A</text>
<text x="92" y="492" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="600" fill="#37DCC0" text-anchor="start">         (X_A^T X_A)^-1 sign(b_A)</text>
</g>
<g id="cue_s05_c3_keep_cheap_they_restrict_expensive">
  <title>keep cheap they restrict expensive inner products strong-rule set add</title>
  <desc>Keep cheap restrict expensive inner products strong-rule set unit bound margin Hessian inverse warm start exact single pass.</desc>
<rect x="452.6666666666667" y="302" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="474.6666666666667" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4F9DF7" text-anchor="start">2  Keep it cheap</text>
<text x="474.6666666666667" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Restrict the expensive inner</text>
<text x="474.6666666666667" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">products to the strong-rule set,</text>
<text x="474.6666666666667" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">plus a small unit-bound safety</text>
<text x="474.6666666666667" y="435" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">margin. The Hessian inverse also</text>
<text x="474.6666666666667" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">gives the warm start.</text>
<rect x="474.6666666666667" y="480" width="330.6666666666667" height="24" rx="8" ry="8" fill="#14261F" stroke="#57D9A3" stroke-width="1.1" />
<text x="488.6666666666667" y="497" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="12.5" font-weight="700" fill="#57D9A3" text-anchor="start">exact -&gt; often one solver pass</text>
</g>
<g id="cue_s05_c4_efficient_low_rank_updates_keep_hess">
  <title>efficient low-rank updates keep hessian its inverse current predictors enter</title>
  <desc>Efficient low-rank updates keep Hessian inverse current predictors enter leave approximate-homotopy scheme penalty grid.</desc>
<rect x="849.3333333333334" y="302" width="374.6666666666667" height="214" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="871.3333333333334" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F7B84B" text-anchor="start">3  Stay current</text>
<text x="871.3333333333334" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Efficient low-rank updates keep the</text>
<text x="871.3333333333334" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Hessian and its inverse current as</text>
<text x="871.3333333333334" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">predictors enter and leave.</text>
<rect x="871.3333333333334" y="452" width="330.6666666666667" height="46" rx="9" ry="9" fill="#0E1A30" />
<text x="885.3333333333334" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#F7B84B" text-anchor="start">approximate homotopy</text>
<text x="885.3333333333334" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#A6BADB" text-anchor="start">adaptively places the lambda grid</text>
</g>
</svg>
