<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<g id="cue_s01_c1_work_presented_neurips_2022_johan">
  <title>work presented neurips 2022 johan larsson jonas wallin lund university</title>
  <desc>This work NeurIPS 2022 Johan Larsson Jonas Wallin Lund introduces Hessian Screening Rule speed lasso path.</desc>
<rect x="72" y="92" width="6" height="30" rx="2.5" fill="#4F9DF7" />
<text x="92" y="104" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="2.5">LASSO  ·  REGULARIZATION PATH  ·  SCREENING RULES</text>
<text x="92" y="134" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#A6BADB" text-anchor="start">NeurIPS 2022  ·  a faster way to fit the whole lasso path</text>
<text x="72" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="60" font-weight="800" fill="#EAF1FB" text-anchor="start">The Hessian Screening Rule</text>
<text x="72" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="500" fill="#A6BADB" text-anchor="start">Second-order screening and warm starts for sparse regression</text>
</g>
<g id="cue_s01_c2_screening_rules_discard_predictors_b">
  <title>screening rules discard predictors before fit shrinking problem</title>
  <desc>Screening rules discard predictors before model fit shrinking problem.</desc>
<rect x="72" y="300" width="560" height="118" rx="16" ry="16" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="92" y="324" width="6" height="70" rx="2.5" fill="#37DCC0" />
<text x="112" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="800" fill="#37DCC0" text-anchor="start">What a screening rule does</text>
<text x="112" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Discards predictors before the model is fit,</text>
<text x="112" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">shrinking each subproblem the solver has to touch.</text>
</g>
<g id="cue_s01_c3_authors_show_second_order_hessian_in">
  <title>authors show second-order hessian information yields both far tighter screening</title>
  <desc>Authors show second-order Hessian information tighter screening accurate warm starts highly correlated struggle.</desc>
<rect x="660" y="300" width="548" height="118" rx="16" ry="16" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.4" />
<text x="684" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="1.5">SECOND-ORDER HESSIAN INFORMATION</text>
<text x="684" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#57D9A3" text-anchor="start">Far tighter screening</text>
<text x="684" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1FB" text-anchor="start">+ much more accurate warm starts</text>
<text x="1184" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A6BADB" text-anchor="end">even under</text>
<text x="1184" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F7B84B" text-anchor="end">high correlation</text>
</g>
<g id="cue_s01_c4_result_method_fastest_across_nearly">
  <title>result method fastest across nearly every simulated real benchmark they</title>
  <desc>Result method fastest across nearly every simulated real benchmark tested.</desc>
<rect x="72" y="440" width="1136" height="96" rx="16" ry="16" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="92" y="462" width="6" height="52" rx="2.5" fill="#F7B84B" />
<text x="112" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="800" fill="url(#warmg)" text-anchor="start">Fastest</text>
<text x="250" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="600" fill="#EAF1FB" text-anchor="start">across nearly every simulated and real benchmark tested</text>
<text x="112" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">lasso and l1-regularized logistic regression paths</text>
</g>
<line x1="72" y1="566" x2="1208" y2="566" stroke="#2B4068" stroke-width="1.2" />
<text x="72" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="700" fill="#EAF1FB" text-anchor="start">Johan Larsson   ·   Jonas Wallin</text>
<text x="72" y="628" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Department of Statistics, Lund University</text>
<text x="1208" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4F9DF7" text-anchor="end" letter-spacing="1.5">NeurIPS 2022</text>
<text x="1208" y="628" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="13.5" font-weight="500" fill="#6E85AC" text-anchor="end">arXiv:2104.13026   ·   github.com/jolars/HessianScreening</text>
</svg>
