<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="figFrame7" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" />
      <feFlood flood-color="#12243B" flood-opacity="0.10" />
      <feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#7C3AED" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">MD recovers CCS's probe direction</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">KEY RESULT · COSINE SIMILARITY TO CCS</text>
  </g>

  <g id="chart-frame">
    <rect x="64" y="160" width="704" height="478" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="92" y="200" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">AVG. COSINE SIMILARITY OF LEARNED PROBE DIRECTIONS TO CCS</text>
    <line x1="150" y1="272" x2="740" y2="272" stroke="#E2E8F0" stroke-width="1" />
    <line x1="150" y1="347" x2="740" y2="347" stroke="#E2E8F0" stroke-width="1" />
    <line x1="150" y1="422" x2="740" y2="422" stroke="#E2E8F0" stroke-width="1" />
    <line x1="150" y1="497" x2="740" y2="497" stroke="#E2E8F0" stroke-width="1" />
    <line x1="150" y1="572" x2="740" y2="572" stroke="#94A3B8" stroke-width="1.5" />
    <text x="140" y="277" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">1.0</text>
    <text x="140" y="352" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">0.75</text>
    <text x="140" y="427" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">0.5</text>
    <text x="140" y="502" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">0.25</text>
    <text x="140" y="577" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">0</text>
  </g>

  <g id="cue_s07_c1_headline_midpoint_displacement_tuned" data-cue-label="Midpoint-Displacement tuned to imitate CCS cosine similarity 0.63 CCS self similarity 0.78">
    <title>Midpoint-Displacement tuned to imitate CCS reaches cosine similarity about 0.63 while CCS agrees with itself only at 0.78</title>
    <desc>MD tuned to imitate CCS gives probe directions averaging cosine similarity about 0.63 to real CCS probes; CCS self-similarity is only 0.78.</desc>
    <rect x="180" y="338" width="118" height="234" fill="#12243B" />
    <text x="239" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#12243B">0.78</text>
    <text x="239" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">CCS ↔ CCS</text>
    <text x="239" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">self-similarity</text>

    <rect x="360" y="383" width="118" height="189" fill="#7C3AED" />
    <text x="419" y="371" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#7C3AED">0.63</text>
    <text x="419" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED">MD-CCS</text>
    <text x="419" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">tuned to imitate CCS</text>
  </g>

  <g id="cue_s07_c2_other_accurate_losses_like_pca" data-cue-label="other accurate losses like PCA sit near 0.15 resemblance specific to Midpoint-Displacement">
    <title>Other accurate losses like PCA sit near 0.15 so the resemblance is specific to Midpoint-Displacement</title>
    <desc>Other accurate losses such as PCA, MA and SMR sit near 0.15, so the resemblance to CCS is specific to Midpoint-Displacement.</desc>
    <rect x="560" y="527" width="118" height="45" fill="#94A3B8" />
    <text x="619" y="515" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#475569">~0.15</text>
    <text x="619" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">PCA / MA / SMR</text>
    <text x="619" y="616" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">other accurate losses</text>
  </g>

  <g id="cue-figure">
    <rect x="788" y="160" width="428" height="478" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#figFrame7)" />
    <text x="812" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1.5">FIGURE 1 · CCS GEOMETRY</text>
    <image href="../images/fig1_geometry.png" x="812" y="212" width="380" height="303" preserveAspectRatio="xMidYMid meet" />
    <text x="812" y="546" font-family="Arial, sans-serif" font-size="14" fill="#475569">Datapoints projected onto PC1 (x) and the</text>
    <text x="812" y="568" font-family="Arial, sans-serif" font-size="14" fill="#475569">probe direction θ̂ (y); colour = truth label.</text>
    <text x="812" y="606" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#7C3AED">Chance of 0.63 at random ≈ 10⁻²³⁷.</text>
  </g>

  <g id="footer">
