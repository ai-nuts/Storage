<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#2563EB" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">Why understanding CCS matters</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">MOTIVATION</text>
  </g>

  <g id="cue_s03_c1_safely_deploying_capable_models_mean" data-cue-label="safely deploying models catch confident falsehoods probes read truth help if understood">
    <title>Safely deploying capable models means catching confident falsehoods and probes that read a model's truth could help only if we understand them</title>
    <desc>Capable models state confident falsehoods; probes that read a model's own truth could catch this, but only if we understand how they work.</desc>
    <rect x="64" y="160" width="1152" height="120" rx="14" fill="#EEF2FF" />
    <rect x="64" y="160" width="6" height="120" rx="3" fill="#2563EB" />
    <text x="96" y="200" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">WHY IT MATTERS</text>
    <text x="96" y="234" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#12243B">Capable models state falsehoods with confidence. Probes that read a model's <tspan font-weight="700">own representation of truth</tspan></text>
    <text x="96" y="262" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#12243B">could help us catch this — but <tspan font-weight="700">only if we actually understand how they work.</tspan></text>
  </g>

  <g id="cue_s03_c2_ccs_explained_through_clustering_act" data-cue-label="CCS explained through clustering activations and learning truth probabilities">
    <title>CCS was explained through clustering activations and learning truth probabilities</title>
    <desc>The original CCS was explained in terms of clustering activations and learning calibrated truth probabilities.</desc>
    <rect x="64" y="304" width="742" height="334" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="92" y="346" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">THE TWO ORIGINAL EXPLANATIONS</text>

    <rect x="92" y="366" width="343" height="248" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="112" y="404" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">Clustering</text>
    <text x="112" y="428" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">activations</text>
    <text x="112" y="466" font-family="Arial, sans-serif" font-size="15" fill="#475569">CCS is said to split the</text>
    <text x="112" y="488" font-family="Arial, sans-serif" font-size="15" fill="#475569">activations into two clusters</text>
    <text x="112" y="510" font-family="Arial, sans-serif" font-size="15" fill="#475569">with a separating hyperplane.</text>
    <rect x="112" y="540" width="300" height="52" rx="8" fill="#FEF2F2" />
    <text x="128" y="572" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626">✕  Misleading</text>

    <rect x="463" y="366" width="315" height="248" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="483" y="404" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">Learning truth</text>
    <text x="483" y="428" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">probabilities</text>
    <text x="483" y="466" font-family="Arial, sans-serif" font-size="15" fill="#475569">CCS is said to output</text>
    <text x="483" y="488" font-family="Arial, sans-serif" font-size="15" fill="#475569">calibrated probabilities of</text>
    <text x="483" y="510" font-family="Arial, sans-serif" font-size="15" fill="#475569">a statement being true.</text>
    <rect x="483" y="540" width="272" height="52" rx="8" fill="#FEF2F2" />
    <text x="499" y="572" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626">✕  Misleading</text>
  </g>

  <g id="cue_s03_c3_authors_argue_both_pictures_mislead" data-cue-label="both pictures mislead motivating cleaner account of CCS true target">
    <title>The authors argue both pictures mislead motivating a cleaner account of what CCS truly optimizes</title>
    <desc>The authors argue both framings are misleading, motivating a cleaner account of CCS's true optimization target.</desc>
    <rect x="828" y="304" width="388" height="334" rx="14" fill="#12243B" />
    <rect x="828" y="304" width="388" height="6" rx="3" fill="#7C3AED" />
    <text x="856" y="352" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#B79CF6" letter-spacing="1.5">THE AUTHORS' CLAIM</text>
    <text x="856" y="398" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="700" fill="#FFFFFF">Both pictures</text>
    <text x="856" y="430" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="700" fill="#FFFFFF">mislead.</text>
    <text x="856" y="480" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E2E8F0">Neither clustering nor</text>
    <text x="856" y="504" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E2E8F0">probabilities capture what</text>
    <text x="856" y="528" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#E2E8F0">CCS truly optimizes.</text>
    <rect x="856" y="556" width="332" height="58" rx="10" fill="#7C3AED" />
    <text x="872" y="582" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#F3EEFE" letter-spacing="1">GOAL</text>
    <text x="872" y="602" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">A cleaner account of its target.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Source: §1 Introduction &amp; Motivation</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">03</text>
  </g>
</svg>
