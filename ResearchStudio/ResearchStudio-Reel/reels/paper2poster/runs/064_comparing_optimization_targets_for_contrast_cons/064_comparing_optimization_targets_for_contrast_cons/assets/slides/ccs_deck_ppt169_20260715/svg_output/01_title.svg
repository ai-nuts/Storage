<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" />
      <feFlood flood-color="#12243B" flood-opacity="0.10" />
      <feComposite in2="SourceAlpha" operator="in" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
    <rect x="0" y="0" width="14" height="720" fill="url(#coverBand)" />
    <rect x="812" y="150" width="404" height="470" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <g id="eyebrow">
    <text x="64" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB" letter-spacing="2.5">NEURIPS 2023 · LATENT KNOWLEDGE / INTERPRETABILITY</text>
  </g>

  <g id="title">
    <text x="64" y="168" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#12243B">Comparing Optimization Targets</text>
    <text x="64" y="222" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#12243B">for Contrast-Consistent Search</text>
  </g>

  <g id="cue_s01_c1_contrast_consistent_search_ccs_unsup" data-cue-label="CCS unsupervised probe reads truth from activations">
    <title>Contrast-Consistent Search unsupervised probe reads a model's sense of truth from activations</title>
    <desc>CCS is an unsupervised probe that reads a language model's internal sense of truth directly from its activations.</desc>
    <rect x="64" y="256" width="700" height="52" rx="8" fill="#EEF2FF" />
    <rect x="64" y="256" width="5" height="52" fill="#2563EB" />
    <text x="86" y="288" font-family="Arial, sans-serif" font-size="18" fill="#12243B">CCS: an <tspan font-weight="700">unsupervised</tspan> probe reading a model's sense of truth from its activations.</text>
  </g>

  <g id="authors">
    <text x="64" y="352" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#12243B">Hugo Fry · Seamus Fallows · Ian Fan · Jamie Wright · Nandi Schoots</text>
    <text x="64" y="378" font-family="Arial, sans-serif" font-size="14" fill="#475569">Independent · Oxford University · King's College London</text>
  </g>

  <g id="cue_s01_c2_but_what_does_ccs_actually" data-cue-label="But what does CCS actually optimize question">
    <title>But what does CCS actually optimize</title>
    <desc>The driving question: what is CCS actually optimizing for?</desc>
    <rect x="64" y="418" width="700" height="104" rx="14" fill="#12243B" filter="url(#softShadow)" />
    <text x="88" y="456" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7CA9FF" letter-spacing="2">THE DRIVING QUESTION</text>
    <text x="88" y="494" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#FFFFFF">What does CCS actually optimize?</text>
  </g>

  <g id="cue_s01_c3_explains_its_target_derives_new" data-cue-label="derives new loss Midpoint-Displacement matches and beats CCS">
    <title>This paper explains its target and derives a new loss Midpoint-Displacement that matches and beats CCS</title>
    <desc>Explains CCS's target and derives a new Midpoint-Displacement loss that matches CCS and can beat it.</desc>
    <rect x="64" y="540" width="700" height="80" rx="14" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.5" />
    <rect x="64" y="540" width="5" height="80" fill="#7C3AED" />
    <text x="88" y="572" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1.5">CONTRIBUTION</text>
    <text x="88" y="600" font-family="Arial, sans-serif" font-size="18" fill="#12243B">A new <tspan font-weight="700" fill="#7C3AED">Midpoint-Displacement</tspan> loss that reproduces CCS — and, retuned, beats it.</text>
  </g>

