<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#2563EB" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">Three contributions</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">CONTRIBUTION</text>
  </g>

  <g id="cue_s04_c1_makes_three_contributions" data-cue-label="the paper makes three contributions overview">
    <title>The paper makes three contributions</title>
    <desc>Overview: the paper makes three contributions, spanning conceptual clarifications, a new loss, and an empirical comparison.</desc>
    <rect x="64" y="160" width="1152" height="80" rx="14" fill="#EEF2FF" />
    <rect x="64" y="160" width="6" height="80" rx="3" fill="#2563EB" />
    <text x="96" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#12243B">The paper makes <tspan font-weight="700">three contributions</tspan> — clearing up misconceptions, deriving a new loss,</text>
    <text x="96" y="224" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#12243B">and grounding both in a broad empirical comparison.</text>
  </g>

  <g id="cue_s04_c2_first_corrects_two_misconceptions_cc" data-cue-label="first corrects two misconceptions displacement not hyperplane succeeds probabilities near one half">
    <title>First it corrects two misconceptions CCS classifies by displacement needing no separating hyperplane and succeeds even when probabilities cluster near one half</title>
    <desc>Corrects two misconceptions: CCS classifies via displacement (no separating hyperplane) and can succeed even when its probabilities cluster near 0.5.</desc>
    <rect x="64" y="266" width="373" height="372" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="266" width="373" height="6" rx="3" fill="#2563EB" />
    <circle cx="100" cy="316" r="18" fill="#2563EB" />
    <text x="100" y="323" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
    <text x="132" y="312" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1">CLARIFY</text>
    <text x="132" y="332" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">Two misconceptions</text>

    <rect x="88" y="358" width="325" height="122" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="106" y="386" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#12243B">Classifies by displacement</text>
    <text x="106" y="410" font-family="Arial, sans-serif" font-size="14" fill="#475569">Uses only the statement-vs-</text>
    <text x="106" y="430" font-family="Arial, sans-serif" font-size="14" fill="#475569">negation displacement — no</text>
    <text x="106" y="450" font-family="Arial, sans-serif" font-size="14" fill="#475569">separating hyperplane needed.</text>

    <rect x="88" y="494" width="325" height="122" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="106" y="522" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#12243B">Probabilities near ½ are OK</text>
    <text x="106" y="546" font-family="Arial, sans-serif" font-size="14" fill="#475569">CCS can succeed even when its</text>
    <text x="106" y="566" font-family="Arial, sans-serif" font-size="14" fill="#475569">probability outputs pile up</text>
    <text x="106" y="586" font-family="Arial, sans-serif" font-size="14" fill="#475569">around one half.</text>
  </g>

  <g id="cue_s04_c3_second_derives_new_midpoint_displace" data-cue-label="second derives a new Midpoint-Displacement loss from CCS target">
    <title>Second it derives a new Midpoint-Displacement loss</title>
    <desc>Derives a new Midpoint-Displacement (MD) loss from a heuristic account of CCS's optimization target.</desc>
    <rect x="453" y="266" width="373" height="372" rx="14" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.5" />
    <rect x="453" y="266" width="373" height="6" rx="3" fill="#7C3AED" />
    <circle cx="489" cy="316" r="18" fill="#7C3AED" />
    <text x="489" y="323" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
    <text x="521" y="312" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" letter-spacing="1">DERIVE</text>
    <text x="521" y="332" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">A new loss</text>

    <text x="481" y="392" font-family="Arial, sans-serif" font-size="16" fill="#475569">From a heuristic account of</text>
    <text x="481" y="414" font-family="Arial, sans-serif" font-size="16" fill="#475569">what CCS optimizes, the authors</text>
    <text x="481" y="436" font-family="Arial, sans-serif" font-size="16" fill="#475569">derive a single new objective:</text>

    <rect x="481" y="466" width="317" height="86" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5" />
    <text x="639" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7C3AED">Midpoint-</text>
    <text x="639" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7C3AED">Displacement</text>
    <text x="481" y="586" font-family="Arial, sans-serif" font-size="15" fill="#475569">A single knob λ controls its</text>
    <text x="481" y="608" font-family="Arial, sans-serif" font-size="15" fill="#475569">behaviour.</text>
  </g>

  <g id="cue_s04_c4_third_comparison_shows_proxies_beat" data-cue-label="third a comparison shows it proxies and can beat CCS across models datasets">
    <title>Third a broad comparison shows Midpoint-Displacement proxies and can beat CCS</title>
    <desc>A broad empirical comparison across models and datasets shows MD is a faithful proxy for CCS and can even beat it.</desc>
    <rect x="842" y="266" width="374" height="372" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="842" y="266" width="374" height="6" rx="3" fill="#059669" />
    <circle cx="878" cy="316" r="18" fill="#059669" />
    <text x="878" y="323" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
    <text x="910" y="312" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="1">COMPARE</text>
    <text x="910" y="332" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12243B">Broad evaluation</text>

    <text x="870" y="392" font-family="Arial, sans-serif" font-size="16" fill="#475569">Many losses compared across</text>
    <text x="870" y="414" font-family="Arial, sans-serif" font-size="16" fill="#475569">models and datasets. The result:</text>

    <rect x="870" y="442" width="318" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="888" y="474" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#059669">✓  A faithful proxy for CCS</text>
    <text x="888" y="504" font-family="Arial, sans-serif" font-size="14" fill="#475569">MD tracks CCS's learned direction.</text>

    <rect x="870" y="534" width="318" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" />
    <text x="888" y="566" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#059669">✓  And can beat it</text>
    <text x="888" y="596" font-family="Arial, sans-serif" font-size="14" fill="#475569">Retuned, MD gives higher accuracy.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Source: §1 Contributions</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">04</text>
  </g>
</svg>
