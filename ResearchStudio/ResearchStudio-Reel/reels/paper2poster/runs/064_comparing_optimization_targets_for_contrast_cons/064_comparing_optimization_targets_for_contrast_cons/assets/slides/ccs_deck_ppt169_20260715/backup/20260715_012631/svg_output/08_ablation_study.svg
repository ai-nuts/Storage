<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#7C3AED" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">One knob λ decides the trade-off</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">ABLATION STUDY · MD-CCS vs MD-Acc</text>
  </g>

  <g id="cue_s08_c1_two_midpoint_displacement_variants_d" data-cue-label="two Midpoint-Displacement variants differ only in lambda natural ablation">
    <title>The two Midpoint-Displacement variants differ only in the single hyper-parameter lambda</title>
    <desc>MD-CCS and MD-Acc differ only in the single hyper-parameter lambda, forming a natural ablation.</desc>
    <rect x="64" y="160" width="1152" height="118" rx="14" fill="#F3EEFE" />
    <rect x="64" y="160" width="6" height="118" rx="3" fill="#7C3AED" />
    <text x="96" y="198" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1.5">A CLEAN, SINGLE-VARIABLE ABLATION</text>
    <text x="96" y="234" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#12243B">The two variants share everything but <tspan font-weight="700" fill="#7C3AED">one hyper-parameter, λ</tspan> — so any difference</text>
    <text x="96" y="262" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#12243B">between them isolates the displacement-vs-midpoint trade-off itself.</text>
  </g>

  <g id="cue_s08_c2_tuned_mimic_ccs_cosine_similarity" data-cue-label="tuned to mimic CCS cosine similarity 0.63 tuned for accuracy drops to 0.38 defines CCS target">
    <title>Tuned to mimic CCS cosine similarity is about 0.63 tuned for accuracy it drops to 0.38 showing the trade-off defines the CCS target</title>
    <desc>Tuned to mimic CCS the cosine similarity is about 0.63; tuned for accuracy it drops to 0.38, showing the displacement-versus-midpoint trade-off defines CCS's target.</desc>
    <rect x="64" y="302" width="560" height="336" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="302" width="560" height="6" rx="3" fill="#7C3AED" />
    <text x="92" y="342" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">COSINE SIMILARITY TO CCS</text>
    <line x1="150" y1="580" x2="596" y2="580" stroke="#94A3B8" stroke-width="1.5" />
    <rect x="200" y="423" width="120" height="157" fill="#7C3AED" />
    <text x="260" y="410" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#7C3AED">0.63</text>
    <text x="260" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7C3AED">MD-CCS</text>
    <text x="260" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">λ mimics CCS</text>
    <rect x="410" y="485" width="120" height="95" fill="#C4B0F7" />
    <text x="470" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#7C3AED">0.38</text>
    <text x="470" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#475569">MD-Acc</text>
    <text x="470" y="624" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">λ tuned for accuracy</text>
  </g>

  <g id="cue_s08_c3_retuning_lambda_raises_test_accuracy" data-cue-label="retuning lambda raises test accuracy to 0.76 CCS-matching lambda robust across datasets models">
    <title>Retuning lambda for accuracy raises average test accuracy to about 0.76</title>
    <desc>Retuning lambda for accuracy lifts average test accuracy to about 0.76; the CCS-matching value of lambda is stable across datasets and models.</desc>
    <rect x="656" y="302" width="560" height="336" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="656" y="302" width="560" height="6" rx="3" fill="#059669" />
    <text x="684" y="342" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="1.5">AVERAGE TEST ACCURACY</text>

    <rect x="684" y="366" width="228" height="150" rx="12" fill="#F1F5F9" />
    <text x="798" y="416" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#475569">0.72</text>
    <text x="798" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">MD-CCS</text>
    <text x="798" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">λ set to mimic CCS</text>

    <text x="936" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#059669">→</text>

    <rect x="960" y="366" width="228" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2" />
    <text x="1074" y="416" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#059669">0.76</text>
    <text x="1074" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">MD-Acc</text>
    <text x="1074" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">λ retuned for accuracy</text>

    <rect x="684" y="536" width="504" height="76" rx="10" fill="#12243B" />
    <text x="704" y="568" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">The CCS-matching λ is robust</text>
    <text x="704" y="594" font-family="Arial, sans-serif" font-size="15" fill="#B7C4D6">it barely changes across datasets and models.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Source: §5 Ablation · varying λ between MD-CCS and MD-Acc</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">08</text>
  </g>
</svg>
