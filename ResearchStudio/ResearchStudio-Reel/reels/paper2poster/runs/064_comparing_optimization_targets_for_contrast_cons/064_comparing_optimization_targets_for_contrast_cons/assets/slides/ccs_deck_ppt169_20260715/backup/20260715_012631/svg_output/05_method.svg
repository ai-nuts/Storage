<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#2563EB" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">Two statistics, one trade-off, one loss</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">METHOD · MIDPOINT-DISPLACEMENT</text>
  </g>

  <g id="cue_s05_c1_ccs_described_two_statistics_along" data-cue-label="CCS described by two statistics along probe direction sigma-d displacement sigma-m midpoint">
    <title>CCS is described by two statistics along the probe direction sigma-d-squared displacement and sigma-m-squared midpoint</title>
    <desc>Describe CCS with two statistics along the probe direction: sigma-d-squared (how far pair is pushed apart) and sigma-m-squared (how far their midpoint sits from origin).</desc>
    <rect x="64" y="156" width="1152" height="170" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="156" width="6" height="170" rx="3" fill="#2563EB" />
    <text x="96" y="188" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">TWO STATISTICS ALONG THE PROBE DIRECTION θ̂</text>
    <image href="../images/formula_sigma.png" x="120" y="200" width="1040" height="72" preserveAspectRatio="xMidYMid meet" />
    <rect x="120" y="282" width="512" height="34" rx="8" fill="#EEF2FF" />
    <text x="136" y="305" font-family="Arial, sans-serif" font-size="14" fill="#12243B"><tspan font-weight="700" fill="#2563EB">σ_d²</tspan>  displacement — how far the statement &amp; negation are pushed apart</text>
    <rect x="648" y="282" width="512" height="34" rx="8" fill="#F3EEFE" />
    <text x="664" y="305" font-family="Arial, sans-serif" font-size="14" fill="#12243B"><tspan font-weight="700" fill="#7C3AED">σ_m²</tspan>  midpoint — how far their midpoint sits from the origin</text>
  </g>

  <g id="cue_s05_c2_its_saturating_sigmoid_forces_trade" data-cue-label="its saturating sigmoid forces a trade-off maximize displacement minimize midpoint">
    <title>Its saturating sigmoid forces a trade-off between spreading pairs apart and keeping midpoints small</title>
    <desc>Because the CCS sigmoid saturates at both ends, it is forced into a trade-off: maximize the displacement while minimizing the midpoint.</desc>
    <rect x="64" y="344" width="560" height="294" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="344" width="560" height="6" rx="3" fill="#2563EB" />
    <text x="92" y="386" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE SIGMOID FORCES A TRADE-OFF</text>
    <text x="92" y="420" font-family="Arial, sans-serif" font-size="16" fill="#475569">CCS's double-saturating sigmoid pushes the</text>
    <text x="92" y="442" font-family="Arial, sans-serif" font-size="16" fill="#475569">probe in two competing directions at once:</text>

    <rect x="92" y="466" width="504" height="66" rx="10" fill="#EEF2FF" />
    <text x="112" y="500" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#2563EB">σ_d²  ↑</text>
    <text x="220" y="494" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">Maximize displacement</text>
    <text x="220" y="518" font-family="Arial, sans-serif" font-size="14" fill="#475569">spread the pair far apart</text>

    <rect x="92" y="544" width="504" height="66" rx="10" fill="#F3EEFE" />
    <text x="112" y="578" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#7C3AED">σ_m²  ↓</text>
    <text x="220" y="572" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">Minimize midpoint</text>
    <text x="220" y="596" font-family="Arial, sans-serif" font-size="14" fill="#475569">keep the midpoint near the origin</text>
  </g>

  <g id="cue_s05_c3_midpoint_displacement_makes_explicit" data-cue-label="Midpoint-Displacement makes trade-off explicit with one knob lambda reproduces CCS or maximizes accuracy">
    <title>Midpoint-Displacement makes this explicit with one knob lambda reproducing CCS or maximizing accuracy</title>
    <desc>The Midpoint-Displacement loss writes this trade-off explicitly with a single hyper-parameter lambda: one setting reproduces CCS, another maximizes accuracy.</desc>
    <rect x="656" y="344" width="560" height="294" rx="14" fill="#12243B" />
    <rect x="656" y="344" width="560" height="6" rx="3" fill="#7C3AED" />
    <text x="684" y="386" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#B79CF6" letter-spacing="1.5">MIDPOINT-DISPLACEMENT MAKES IT EXPLICIT</text>
    <rect x="684" y="404" width="504" height="66" rx="10" fill="#FFFFFF" />
    <image href="../images/formula_md_loss.png" x="704" y="420" width="464" height="34" preserveAspectRatio="xMidYMid meet" />
    <text x="684" y="502" font-family="Arial, sans-serif" font-size="16" fill="#E2E8F0">One knob, λ, sets the balance of the two terms:</text>

    <rect x="684" y="522" width="246" height="90" rx="10" fill="#1B3350" />
    <text x="707" y="552" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7CA9FF">λ → MD-CCS</text>
    <text x="707" y="578" font-family="Arial, sans-serif" font-size="14" fill="#B7C4D6">chosen to reproduce</text>
    <text x="707" y="598" font-family="Arial, sans-serif" font-size="14" fill="#B7C4D6">CCS's probe.</text>

    <rect x="942" y="522" width="246" height="90" rx="10" fill="#3B2A66" />
    <text x="965" y="552" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#C4B0F7">λ → MD-Acc</text>
    <text x="965" y="578" font-family="Arial, sans-serif" font-size="14" fill="#D9CCF7">tuned for maximum</text>
    <text x="965" y="598" font-family="Arial, sans-serif" font-size="14" fill="#D9CCF7">accuracy.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Source: §3 Optimization target &amp; the Midpoint-Displacement loss</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">05</text>
  </g>
</svg>
