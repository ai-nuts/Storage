<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#2563EB" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">Models, datasets &amp; contrast pairs</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">DATASET / BENCHMARK</text>
  </g>

  <g id="cue_s06_c1_experiments_hidden_state_activations" data-cue-label="experiments hidden-state activations four models five datasets including BoolQ">
    <title>Experiments use hidden-state activations from four models averaged over five datasets including BoolQ</title>
    <desc>Hidden-state activations from four models: UnifiedQA T5-Large encoder and decoder, DeBERTa, and GPT-Neo, averaged over five datasets including BoolQ.</desc>
    <rect x="64" y="164" width="560" height="474" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="164" width="560" height="6" rx="3" fill="#2563EB" />
    <text x="92" y="208" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">MODELS &amp; DATASETS</text>
    <text x="92" y="242" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#12243B">Hidden-state activations from four models</text>

    <rect x="92" y="266" width="248" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="112" y="300" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#12243B">UnifiedQA T5-Large</text>
    <text x="112" y="326" font-family="Arial, sans-serif" font-size="14" fill="#475569">encoder</text>
    <rect x="348" y="266" width="248" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="368" y="300" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#12243B">UnifiedQA T5-Large</text>
    <text x="368" y="326" font-family="Arial, sans-serif" font-size="14" fill="#475569">decoder</text>
    <rect x="92" y="366" width="248" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="112" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#12243B">DeBERTa</text>
    <text x="112" y="426" font-family="Arial, sans-serif" font-size="14" fill="#475569">encoder model</text>
    <rect x="348" y="366" width="248" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="368" y="400" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#12243B">GPT-Neo</text>
    <text x="368" y="426" font-family="Arial, sans-serif" font-size="14" fill="#475569">autoregressive model</text>

    <rect x="92" y="482" width="504" height="130" rx="10" fill="#12243B" />
    <text x="112" y="522" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">5<tspan font-size="20" font-weight="400" fill="#B7C4D6">  datasets</tspan></text>
    <text x="112" y="560" font-family="Arial, sans-serif" font-size="16" fill="#E2E8F0">Results are averaged over five datasets,</text>
    <text x="112" y="584" font-family="Arial, sans-serif" font-size="16" fill="#E2E8F0">including <tspan font-weight="700" fill="#7CA9FF">BoolQ</tspan>.</text>
  </g>

  <g id="cue_s06_c2_contrast_pairs_append_two_exclusive" data-cue-label="contrast pairs append two exclusive answers each set normalized independently probe cannot detect answer token">
    <title>Contrast pairs append two mutually exclusive answers and each activation set is normalized independently so the probe cannot detect the answer token</title>
    <desc>Each example becomes a contrast pair by appending two mutually exclusive answers; the two activation sets are normalized independently so the probe cannot cheat by detecting the answer token.</desc>
    <rect x="656" y="164" width="560" height="474" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="656" y="164" width="560" height="6" rx="3" fill="#7C3AED" />
    <text x="684" y="208" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1.5">CONTRAST-PAIR CONSTRUCTION</text>

    <rect x="684" y="230" width="504" height="66" rx="10" fill="#F1F5F9" />
    <text x="704" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">QUESTION</text>
    <text x="704" y="282" font-family="Arial, sans-serif" font-size="17" fill="#12243B">“Is the Earth flat?”  → append each answer</text>

    <rect x="684" y="316" width="244" height="120" rx="10" fill="#EEF2FF" stroke="#2563EB" stroke-width="1.5" />
    <text x="806" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#2563EB">φ⁺</text>
    <text x="806" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#12243B">“… Yes.”</text>
    <text x="806" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">activation set A</text>
    <rect x="944" y="316" width="244" height="120" rx="10" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.5" />
    <text x="1066" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#7C3AED">φ⁻</text>
    <text x="1066" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#12243B">“… No.”</text>
    <text x="1066" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">activation set B</text>

    <rect x="684" y="454" width="504" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" />
    <text x="704" y="484" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#059669">Each set normalized independently</text>
    <text x="704" y="508" font-family="Arial, sans-serif" font-size="15" fill="#475569">removes the mean of each answer set separately.</text>

    <rect x="684" y="536" width="504" height="76" rx="10" fill="#12243B" />
    <text x="704" y="568" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">So the probe can't cheat</text>
    <text x="704" y="594" font-family="Arial, sans-serif" font-size="15" fill="#B7C4D6">it cannot simply detect which answer was appended.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Source: §4 Experimental setup</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">06</text>
  </g>
</svg>
