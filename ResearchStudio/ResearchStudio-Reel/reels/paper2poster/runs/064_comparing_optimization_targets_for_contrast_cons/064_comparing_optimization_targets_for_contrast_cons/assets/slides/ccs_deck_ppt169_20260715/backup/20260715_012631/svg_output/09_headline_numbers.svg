  </g>

  <g id="cue_s09_c1_few_numbers_midpoint_displacement_ma" data-cue-label="Midpoint-Displacement matched to CCS 0.63 versus CCS self-similarity 0.78 competing losses 0.15">
    <title>Midpoint-Displacement matched to CCS reaches average cosine similarity about 0.63 versus CCS self-similarity 0.78 while competing losses reach only 0.15</title>
    <desc>MD matched to CCS reaches average cosine similarity about 0.63, versus CCS self-similarity 0.78, while competing losses reach only 0.15.</desc>
    <rect x="64" y="158" width="1152" height="214" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="158" width="6" height="214" rx="3" fill="#7C3AED" />
    <text x="96" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1.5">PROBE SIMILARITY TO CCS</text>

    <rect x="96" y="212" width="352" height="144" rx="12" fill="#F3EEFE" stroke="#7C3AED" stroke-width="2" />
    <text x="272" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#7C3AED">0.63</text>
    <text x="272" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">MD-CCS ↔ CCS</text>
    <text x="272" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">average cosine similarity</text>

    <rect x="464" y="212" width="352" height="144" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="640" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#12243B">0.78</text>
    <text x="640" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">CCS ↔ CCS</text>
    <text x="640" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">self-similarity (the ceiling)</text>

    <rect x="832" y="212" width="352" height="144" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="1008" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#94A3B8">~0.15</text>
    <text x="1008" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#12243B">PCA / MA / SMR</text>
    <text x="1008" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">competing losses</text>
  </g>

  <g id="cue_s09_c2_accuracy_tuned_variant_averages_zero" data-cue-label="accuracy-tuned variant averages 0.76 versus 0.71 winning on three of four models across five datasets">
    <title>The accuracy-tuned variant averages 0.76 test accuracy versus 0.71 for CCS winning on three of four models across five datasets</title>
    <desc>The accuracy-tuned MD variant averages 0.76 test accuracy versus 0.71 for CCS, winning on three of four models, across five datasets.</desc>
    <rect x="64" y="392" width="1152" height="214" rx="14" fill="#12243B" />
    <rect x="64" y="392" width="6" height="214" rx="3" fill="#059669" />
    <text x="96" y="430" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" letter-spacing="1.5">TEST ACCURACY &amp; COVERAGE</text>

    <rect x="96" y="446" width="352" height="144" rx="12" fill="#0E3A2E" stroke="#059669" stroke-width="2" />
    <text x="272" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#6EE7B7">0.76</text>
    <text x="272" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">MD-Acc accuracy</text>
    <text x="272" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9FB3C8">accuracy-tuned variant</text>

    <rect x="464" y="446" width="352" height="144" rx="12" fill="#1B3350" />
    <text x="640" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#B7C4D6">0.71</text>
    <text x="640" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">CCS accuracy</text>
    <text x="640" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9FB3C8">the baseline it beats</text>

    <rect x="832" y="446" width="352" height="144" rx="12" fill="#1B3350" />
    <text x="1008" y="522" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#6EE7B7">3 / 4</text>
    <text x="1008" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">models won</text>
    <text x="1008" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#9FB3C8">by roughly four percent</text>
  </g>

