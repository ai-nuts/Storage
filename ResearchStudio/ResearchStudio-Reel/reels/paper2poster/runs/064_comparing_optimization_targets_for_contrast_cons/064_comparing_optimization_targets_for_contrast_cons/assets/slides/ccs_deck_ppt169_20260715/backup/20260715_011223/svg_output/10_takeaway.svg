<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="takeBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12243B" />
      <stop offset="1" stop-color="#3B2A66" />
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#7C3AED" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">It's the data, not the loss formula</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">TAKEAWAY</text>
  </g>

  <g id="cue_s10_c1_take_home_ccs_succeeds_because_displ" data-cue-label="CCS succeeds because of displacement information in contrast-pair data not its specific loss formula">
    <title>CCS succeeds because of the displacement information in its contrast-pair data not its specific loss formula</title>
    <desc>The take-home: CCS's success comes from the displacement information in its contrast-pair training data, not from the particular shape of its loss function.</desc>
    <rect x="64" y="158" width="1152" height="200" rx="16" fill="url(#takeBand)" />
    <rect x="64" y="158" width="6" height="200" rx="3" fill="#7C3AED" />
    <text x="100" y="204" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#B79CF6" letter-spacing="2">THE TAKE-HOME MESSAGE</text>
    <text x="100" y="256" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="32" font-weight="700" fill="#FFFFFF">CCS works because of the <tspan fill="#C4B0F7">displacement information</tspan></text>
    <text x="100" y="298" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="32" font-weight="700" fill="#FFFFFF">in its contrast-pair data —</text>
    <text x="100" y="340" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="32" font-weight="700" fill="#FFFFFF">not its specific loss formula.</text>
  </g>

  <g id="cue_s10_c2_simple_midpoint_displacement_loss_re" data-cue-label="a simple Midpoint-Displacement loss reproduces CCS and retuned beats it">
    <title>A simple Midpoint-Displacement loss reproduces CCS closely and retuned outperforms it</title>
    <desc>A simple Midpoint-Displacement loss reproduces CCS closely and, when retuned, outperforms it.</desc>
    <rect x="64" y="380" width="560" height="258" rx="14" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.5" />
    <rect x="64" y="380" width="560" height="6" rx="3" fill="#7C3AED" />
    <text x="92" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1.5">A SIMPLE LOSS SUFFICES</text>
    <text x="92" y="458" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#12243B">MD reproduces CCS — then beats it</text>
    <g id="s10c2-b1">
      <text x="92" y="502" font-family="Arial, sans-serif" font-size="18" fill="#12243B">✓  Matched to CCS, it recovers the same probe</text>
      <text x="112" y="526" font-family="Arial, sans-serif" font-size="18" fill="#12243B">direction (cosine ≈ 0.63).</text>
    </g>
    <g id="s10c2-b2">
      <text x="92" y="566" font-family="Arial, sans-serif" font-size="18" fill="#12243B">✓  Retuned for accuracy, it <tspan font-weight="700" fill="#7C3AED">outperforms</tspan> CCS</text>
      <text x="112" y="590" font-family="Arial, sans-serif" font-size="18" fill="#12243B">(0.76 vs 0.71 average).</text>
    </g>
  </g>

  <g id="cue_s10_c3_exact_loss_interchangeable_real_leve" data-cue-label="exact loss interchangeable real lever is displacement versus midpoint trade-off">
    <title>The exact loss is interchangeable among accurate probes the real lever is the displacement versus midpoint trade-off</title>
    <desc>The exact loss formula is largely interchangeable among accurate probes; the real lever is the trade-off between displacement and midpoint variance.</desc>
    <rect x="656" y="380" width="560" height="258" rx="14" fill="#12243B" />
    <rect x="656" y="380" width="560" height="6" rx="3" fill="#2563EB" />
    <text x="684" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#7CA9FF" letter-spacing="1.5">THE REAL LEVER</text>
    <text x="684" y="458" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#FFFFFF">The loss formula is interchangeable</text>
    <text x="684" y="496" font-family="Arial, sans-serif" font-size="17" fill="#E2E8F0">Among high-accuracy probes, the exact loss</text>
    <text x="684" y="520" font-family="Arial, sans-serif" font-size="17" fill="#E2E8F0">barely matters. What actually defines the</text>
    <text x="684" y="544" font-family="Arial, sans-serif" font-size="17" fill="#E2E8F0">target is the balance between two quantities:</text>
    <rect x="684" y="562" width="248" height="56" rx="10" fill="#1B3350" />
    <text x="808" y="596" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#7CA9FF">σ_d²  displacement</text>
    <rect x="948" y="562" width="240" height="56" rx="10" fill="#3B2A66" />
    <text x="1068" y="596" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#C4B0F7">σ_m²  midpoint</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Fry et al. · Comparing Optimization Targets for Contrast-Consistent Search · arXiv:2311.00488</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">10</text>
  </g>
</svg>
