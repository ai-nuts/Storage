<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF" />
  </g>

  <g id="header">
    <rect x="60" y="56" width="6" height="40" fill="#2563EB" />
    <text x="84" y="88" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="700" fill="#12243B">What CCS does — and the open question</text>
    <text x="84" y="116" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.5">PROBLEM · CONTRAST-CONSISTENT SEARCH</text>
  </g>

  <g id="cue_s02_c1_ccs_recovers_direction_activations_e" data-cue-label="CCS recovers a direction encoding true false no labels negation disagree">
    <title>CCS recovers a direction in activations encoding true or false using no labels only that a statement and its negation disagree</title>
    <desc>CCS recovers a truth direction with no labels, using only the constraint that a statement and its negation must disagree.</desc>
    <rect x="64" y="164" width="560" height="474" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="64" y="164" width="560" height="6" rx="3" fill="#2563EB" />
    <text x="92" y="212" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">HOW CCS WORKS</text>
    <text x="92" y="248" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="23" font-weight="700" fill="#12243B">A truth direction, learned without labels</text>

    <g id="p2-b1">
      <circle cx="104" cy="298" r="6" fill="#2563EB" />
      <text x="124" y="292" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#12243B">Recovers a direction in activation space</text>
      <text x="124" y="316" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#475569">that should encode whether a statement is true or false.</text>
    </g>
    <g id="p2-b2">
      <circle cx="104" cy="368" r="6" fill="#2563EB" />
      <text x="124" y="362" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#12243B">Fully unsupervised — no labels</text>
      <text x="124" y="386" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#475569">the probe never sees the ground-truth answer.</text>
    </g>
    <g id="p2-b3">
      <circle cx="104" cy="438" r="6" fill="#2563EB" />
      <text x="124" y="432" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="700" fill="#12243B">One constraint: negation must disagree</text>
      <text x="124" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#475569">a statement and its negation should get opposite verdicts.</text>
    </g>

    <rect x="92" y="500" width="504" height="112" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="120" y="530" width="150" height="52" rx="8" fill="#EEF2FF" stroke="#2563EB" stroke-width="1.5" />
    <text x="195" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#2563EB">φ⁺  “true”</text>
    <text x="320" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#475569">must disagree</text>
    <rect x="418" y="530" width="150" height="52" rx="8" fill="#F3EEFE" stroke="#7C3AED" stroke-width="1.5" />
    <text x="493" y="562" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#7C3AED">φ⁻  “false”</text>
  </g>

  <g id="cue_s02_c2_yet_nobody_had_pinned_down" data-cue-label="nobody pinned down what its loss optimizes or whether target is best">
    <title>Yet nobody had pinned down what its loss really optimizes or whether that target is best</title>
    <desc>Despite CCS working well, nobody had pinned down what its loss really optimizes, or whether that target is best.</desc>
    <rect x="656" y="164" width="560" height="474" rx="14" fill="#12243B" />
    <rect x="656" y="164" width="560" height="6" rx="3" fill="#7C3AED" />
    <text x="684" y="212" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#B79CF6" letter-spacing="1.5">THE OPEN QUESTION</text>
    <text x="684" y="256" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="30" font-weight="700" fill="#FFFFFF">CCS works — but why?</text>

    <text x="684" y="316" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#E2E8F0">Despite working surprisingly well, nobody had</text>
    <text x="684" y="342" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#E2E8F0">pinned down two things:</text>

    <rect x="684" y="378" width="504" height="96" rx="10" fill="#1B3350" />
    <text x="708" y="416" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7CA9FF">1</text>
    <text x="740" y="416" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#FFFFFF">What is its loss really <tspan font-weight="700">optimizing for</tspan>?</text>
    <text x="740" y="450" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#B7C4D6">The mechanism behind its success was unexplained.</text>

    <rect x="684" y="490" width="504" height="96" rx="10" fill="#1B3350" />
    <text x="708" y="528" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7CA9FF">2</text>
    <text x="740" y="528" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#FFFFFF">Is that target even the <tspan font-weight="700">best</tspan> one?</text>
    <text x="740" y="562" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#B7C4D6">Could a different objective recover truth better?</text>

    <text x="684" y="616" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#B79CF6">This paper sets out to answer exactly that.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Source: Introduction · Contrast-Consistent Search (Burns et al. 2023) as analysed by Fry et al.</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">02</text>
  </g>
</svg>
