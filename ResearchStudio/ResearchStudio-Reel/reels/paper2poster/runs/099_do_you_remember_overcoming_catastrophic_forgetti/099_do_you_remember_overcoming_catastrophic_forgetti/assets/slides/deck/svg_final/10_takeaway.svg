<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Learn the new, keep the old, store nothing</text><g id="cue_s10_c1_takeaway_simple_you_teach_fake"><title>takeaway simple you teach fake audio detector new datasets without</title><rect x="64" y="176" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="116" rx="6" fill="#4C9BE8"/><circle cx="112" cy="234" r="10" fill="#4C9BE8"/><text x="150" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Teach new sets without forgetting</text><text x="150" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">You can teach a fake audio detector new datasets without it forgetting the old, and</text><text x="150" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">without keeping any of the old data around.</text></g><g id="cue_s10_c2_rawm_does_making_weight_update"><title>rawm does making weight update adapt how genuine-heavy batch regularizing</title><rect x="64" y="308" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="116" rx="6" fill="#34D3C0"/><circle cx="112" cy="366" r="10" fill="#34D3C0"/><text x="150" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Adapt the update, regularize the memory</text><text x="150" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RAWM makes the weight update adapt to how genuine-heavy each batch is, and regularizes</text><text x="150" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the model to remember its previous behavior.</text></g><g id="cue_s10_c3_because_underlying_regularity_some_c"><title>because underlying regularity some classes staying similar across datasets appears</title><rect x="64" y="440" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="116" rx="6" fill="#48C78E"/><circle cx="112" cy="498" r="10" fill="#48C78E"/><text x="150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A regularity that generalizes</text><text x="150" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Because some classes stay similar across datasets in many problems, the same recipe</text><text x="150" y="542" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">extends to speech emotion and image recognition.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><line x1="64.0" y1="619.9090547692248" x2="64.0" y2="628.0909452307752" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="72.64705882352942" y1="615.8714434925693" x2="72.64705882352942" y2="632.128