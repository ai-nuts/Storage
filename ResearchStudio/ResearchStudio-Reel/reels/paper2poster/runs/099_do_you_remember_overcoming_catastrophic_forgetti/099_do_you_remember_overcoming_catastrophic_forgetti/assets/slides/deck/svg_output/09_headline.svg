<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact in one place</text><g id="cue_s09_c1_numbers_forgetting_drops_about_one"><title>numbers forgetting drops about one tenth fine-tuning new-dataset error about</title><rect x="64" y="166" width="1152" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="166" width="6" height="132" rx="6" fill="#48C78E"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Forgetting and new-set error, both slashed</text><rect x="92" y="220" width="250" height="66" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="217.0" y="254.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22.44" fill="#48C78E" font-weight="800" text-anchor="middle">~1/10</text><text x="217.0" y="272.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">forgetting vs fine-tune</text><rect x="360" y="220" width="250" height="66" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="485.0" y="254.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22.44" fill="#34D3C0" font-weight="800" text-anchor="middle">~1/2</text><text x="485.0" y="272.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">error on the new set</text><rect x="630" y="220" width="586" height="66" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="650" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Old datasets stay accurate while the new one is learned, with no replay</text><text x="650" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">buffer.</text></g><g id="cue_s09_c2_few_sample_regime_only_one_hundred"><title>few-sample regime only one hundred new samples rawm scores equal</title><rect x="64" y="314" width="560" height="150" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="314" width="6" height="150" rx="6" fill="#48C78E"/><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Only 100 new samples</text><rect x="92" y="368" width="158" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="171.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#48C78E" font-weight="800" text-anchor="middle">0.92</text><text x="171.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">EER old set</text><rect x="262" y="368" width="158" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="341.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">0.31</text><text x="341.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">EER new set</text><rect x="432" y="368" width="158" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="511.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#F2685C" font-weight="800" text-anchor="middle">~8</text><text x="511.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">fine-tune EER</text></g><g id="cue_s09_c3_speech_emotion_recognition_reaches_a"><title>speech emotion recognition reaches about forty-two percent accuracy msp-podcast fifty-four</title><rect x="656" y="314" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="314" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Speech emotion recognition</text><rect x="684" y="368" width="250" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="809.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#4C9BE8" font-weight="800" text-anchor="middle">~42%</text><text x="809.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">MSP-Podcast acc</text><rect x="958" y="368" width="250" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1083.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">54%</text><text x="1083.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">IEMOCAP acc</text><text x="684" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">best of all continual learning methods tested</text></g><g id="cue_s09_c4_optimal_regularization_weight_one_ha"><title>optimal regularization weight one half</title><rect x="64" y="480" width="1152" height="70" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="480" width="6" height="70" rx="6" fill="#F2C14E"/><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Optimal regularization weight</text><text x="92" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Equal attention to old and new data works best.</text><rect x="864" y="492" width="352" height="46" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1040.0" y="521.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">lambda = 1/2</text></g></svg>