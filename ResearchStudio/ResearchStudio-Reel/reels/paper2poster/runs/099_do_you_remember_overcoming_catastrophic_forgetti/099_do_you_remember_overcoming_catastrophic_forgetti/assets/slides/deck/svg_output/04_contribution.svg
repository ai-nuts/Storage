<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One method, two essential steps</text><g id="cue_s04_c1_authors_contribute_regularized_adapt"><title>authors contribute regularized adaptive weight modification two essential steps</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#4C9BE8" font-weight="800" text-anchor="middle">RAWM</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">RAWM</text><text x="88" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Regularized Adaptive Weight</text><text x="88" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Modification: a replay-free</text><text x="88" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">continual learning method</text><text x="88" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">built from two essential</text><text x="88" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">steps.</text></g><g id="cue_s04_c2_first_adaptive_weight_modification_i"><title>first adaptive weight modification introduces extra projector adjusts update direction</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="410" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#34D3C0" font-weight="800" text-anchor="middle">1</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">1 Adaptive weights</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">An extra projector adjusts the</text><text x="384" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">update direction by the ratio</text><text x="384" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">of similar-distribution</text><text x="384" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">classes, such as genuine</text><text x="384" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">utterances, to the rest.</text></g><g id="cue_s04_c3_second_regularization_term_inspired"><title>second regularization term inspired learning without forgetting keeps new inference</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="706" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="706" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F2C14E" font-weight="800" text-anchor="middle">2</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">2 Regularization</text><text x="680" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A term inspired by learning</text><text x="680" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">without forgetting keeps the</text><text x="680" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">new inference distribution</text><text x="680" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">close to the old one.</text></g><g id="cue_s04_c4_method_needs_previous_samples_author"><title>method needs previous samples authors show transfers speech emotion recognition</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="1002" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#48C78E" font-weight="800" text-anchor="middle">+</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Replay-free,</text><text x="976" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">general</text><text x="976" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">No previous samples are</text><text x="976" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">needed, and the authors show</text><text x="976" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">it transfers to speech emotion</text><text x="976" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and image recognition.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Adapt the weights to the batch, and regularize the model to remember, with no stored data.</text></svg>