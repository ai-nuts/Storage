 on the next</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A detector performs well on its own dataset, but its Equal</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Error Rate rises dramatically on audio from another</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">dataset.</text><rect x="750" y="270" width="200" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="750" y="270" width="15" height="24" rx="6" fill="#34D3C0"/><text x="738" y="288.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">own set EER</text><text x="775" y="288.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">low</text><rect x="750" y="300" width="200" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="750" y="300" width="170" height="24" rx="6" fill="#F2685C"/><text x="738" y="318.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">new set EER</text><text x="930" y="318.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">high</text></g><g id="cue_s02_c3_obvious_fix_fine_tuning_new_causes"><title>obvious fix fine-tuning new causes network forget what learned before</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F2C14E"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">The obvious fix backfires</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Fine-tuning on the new data causes the network to forget what it had</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">learned before.</text></g><g id="cue_s02_c4_earlier_remedies_require_replaying_o"><title>earlier remedies require replaying old samples which impractical when original</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#34D3C0"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">And you can't just replay old data</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Earlier remedies replay old samples, which is impractical when the</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">original data is inaccessible.</text></g></svg>