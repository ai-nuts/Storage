<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Genuine speech is a regularity to exploit</text><g id="cue_s03_c1_existing_weight_modification_methods"><title>existing weight-modification methods like owm treat every input same when</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">OWM treats every input alike</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Existing weight-modification methods such as OWM constrain</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">every update the same way, ignoring which class an input</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">belongs to.</text><rect x="92" y="300" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344.0" y="328.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">OWM:  W &lt;- W - lr * P * g   (same P for all)</text></g><g id="cue_s03_c2_but_fake_audio_detection_genuine"><title>but fake audio detection genuine speech tends look similar one</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#34D3C0"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Genuine looks alike; fake drifts</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">In fake audio detection genuine speech stays similar from</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">one dataset to the next, while the fake speech varies a</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">lot.</text><line x1="92.0" y1="512.2237428638998" x2="92.0" y2="519.7762571361002" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="107.13333333333333" y1="508.1135377369731" x2="107.13333333333333" y2="523.8864622630269" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="122.26666666666667" y1="504.79954214121307" x2="122.26666666666667" y2="527.2004578587869" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="137.4" y1="504.0" x2="137.4" y2="528.0" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="152.53333333333333" y1="507.9408133230882" x2="152.53333333333333" y2="524.0591866769118" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="167.66666666666666" y1="512.5235773259664" x2="167.66666666666666" y2="519.4764226740336" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="182.8" y1="507.7492849132357" x2="182.8" y2="524.2507150867642" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="197.93333333333334" y1="504.35256530744255" x2="197.93333333333334" y2="527.6474346925575" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="213.06666666666666" y1="505.1131049392339" x2="213.06666666666666" y2="526.886895060766" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="228.2" y1="507.4920238550661" x2="228.2" y2="524.5079761449339" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="243.33333333333331" y1="512.1073201898661" x2="243.33333333333331" y2="519.8926798101339" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="258.4666666666667" y1="507.1264914851587" x2="258.4666666666667" y2="524.8735085148413" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="273.6" y1="504.6095353470214" x2="273.6" y2="527.3904646529786" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="288.73333333333335" y1="504.71252070369155" x2="288.73333333333335" y2="527.2874792963084" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="303.8666666666667" y1="507.5564769572132" x2="303.8666666666667" y2="524.4435230427869" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><line x1="319.0" y1="512.2237428638998" x2="319.0" y2="519.7762571361002" stroke="#34D3C0" stroke-width="3" stroke-linecap="round"/><text x="92" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">genuine: stable</text><line x1="360.0" y1="505.1473715501959" x2="360.0" y2="526.8526284498041" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="375.1333333333333" y1="507.78242287776595" x2="375.1333333333333" y2="524.217577122234" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="390.26666666666665" y1="511.2029396552676" x2="390.26666666666665" y2="520.7970603447325" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="405.4" y1="504.0" x2="405.4" y2="528.0" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="420.5333333333333" y1="510.8914623276938" x2="420.5333333333333" y2="521.1085376723062" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="435.66666666666663" y1="510.5443918673936" x2="435.66666666666663" y2="521.4556081326064" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="450.8" y1="510.94102629496183" x2="450.8" y2="521.0589737050382" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="465.93333333333334" y1="504.0" x2="465.93333333333334" y2="528.0" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="481.06666666666666" y1="508.43292998035764" x2="481.06666666666666" y2="523.5670700196423" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="496.2" y1="506.3103272479085" x2="496.2" y2="525.6896727520915" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="511.3333333333333" y1="504.0" x2="511.3333333333333" y2="528.0" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="526.4666666666667" y1="504.0" x2="526.4666666666667" y2="528.0" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="541.6" y1="507.78281735981756" x2="541.6" y2="524.2171826401825" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="556.7333333333333" y1="509.6365537798805" x2="556.7333333333333" y2="522.3634462201195" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="571.8666666666667" y1="507.47048308655593" x2="571.8666666666667" y2="524.529516913444" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><line x1="587.0" y1="505.14737155019594" x2="587.0" y2="526.852628449804" stroke="#F2685C" stroke-width="3" stroke-linecap="round"/><text x="360" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">fake: varies</text></g><g id="cue_s03_c3_regularity_opportunity_direction_wei"><title>regularity opportunity direction weight update should adapt how much batch</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#F2C14E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Let the update direction adapt</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">That regularity is an opportunity: the direction of a</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">weight update should adapt to how genuine-heavy versus</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">fake-heavy each batch is.</text><rect x="676" y="300" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="328.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">beta = #genuine / #fake  in the batch</text></g><g id="cue_s03_c4_same_time_some_datasets_collect"><title>same time some datasets collect genuine audio under acoustic conditions</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#F2C14E"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Some sets need a safeguard</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Some datasets record genuine audio under acoustic</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">conditions so different that a naive rule backfires,</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">motivating an extra safeguard.</text><text x="676" y="522" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">very different conditions  -&gt;  add regularization</text></g></svg>