<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Ten times less forgetting, best on both</text><g id="cue_s07_c1_headline_finding_rawm_cuts_catastrop"><title>headline finding rawm cuts catastrophic forgetting roughly one tenth naive</title><rect x="64" y="158" width="1152" height="150" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#48C78E"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">RAWM cuts forgetting to about one tenth of fine-tuning</text><rect x="92" y="214" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="202.0" y="255.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#48C78E" font-weight="800" text-anchor="middle">~1/10</text><text x="202.0" y="278.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">forgetting vs fine-tune</text><rect x="332" y="214" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="442.0" y="255.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">~1/2</text><text x="442.0" y="278.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">error on the new set</text><rect x="576" y="214" width="300" height="80" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="590" y1="278" x2="864" y2="278" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><line x1="590" y1="278" x2="590" y2="228" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><polyline points="590.0,233.0 603.7,233.15 617.4,233.3 631.1,233.45 644.8,233.6 658.5,233.75 672.2,233.9 685.9,234.05 699.6,234.2 713.3,234.35 727.0,234.5 740.7,234.65 754.4,234.8 768.1,234.95 781.8,235.1 795.5,235.25 809.2,235.4 822.9,235.55 836.6,235.7 850.3,235.85 864.0,236.0" fill="none" stroke="#48C78E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="590.0,230.5 603.7,235.98570560857473 617.4,240.80267863883952 631.1,245.03244064758258 644.8,248.74657534134124 658.5,252.00794004575428 672.2,254.87172949126494 685.9,257.3864099184864 699.6,259.5945393118549 713.3,261.53348764305315 727.0,263.23606931346944 740.7,264.7310984990311 754.4,266.04387679596556 768.1,267.19662142031547 781.8,268.20884120797535 795.5,269.0976667786069 809.2,269.8781404510638 822.9,270.563470816802 836.6,271.16525627962784 850.3,271.6936813449296 864.0,272.157688980355" fill="none" stroke="#F2685C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="862" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#48C78E" font-weight="800" text-anchor="end">RAWM</text><text x="862" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#F2685C" font-weight="700" text-anchor="end">fine-tune</text><text x="590" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#6E869C" font-weight="600" text-anchor="start">tasks -&gt;</text><rect x="900" y="214" width="300" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="920" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Old knowledge is retained while the new</text><text x="920" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">dataset is still learned.</text></g><g id="cue_s07_c2_across_two_dataset_four_dataset_sequ"><title>across two-dataset four-dataset sequences achieves lowest equal error rate both</title><rect x="64" y="324" width="560" height="224" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="324" width="6" height="224" rx="6" fill="#4C9BE8"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Lowest EER on old and new</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Across two- and four-dataset sequences, RAWM beats</text><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">mainstream continual learning methods on both old and new</text><text x="92" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">data.</text><rect x="300" y="452" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="452" width="100" height="22" rx="6" fill="#F2685C"/><text x="288" y="469.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">fine-tune</text><text x="410" y="469.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">high</text><rect x="300" y="480" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="480" width="68" height="22" rx="6" fill="#F2C14E"/><text x="288" y="497.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">EWC / LwF / OWM</text><text x="378" y="497.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">mid</text><rect x="300" y="508" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="508" width="20" height="22" rx="6" fill="#48C78E"/><text x="288" y="525.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">RAWM</text><text x="330" y="525.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">lowest</text><text x="300" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="start">vs EWC · LwF · OWM · DFWF</text></g><g id="cue_s07_c3_regularization_coefficient_set_one_h"><title>regularization coefficient set one half giving equal attention old new</title><rect x="656" y="324" width="560" height="224" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="324" width="6" height="224" rx="6" fill="#F2C14E"/><text x="684" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Coefficient one half is best</text><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">With the regularization coefficient at one half, giving</text><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">equal attention to old and new, error stays low across all</text><text x="684" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">four datasets even as a baseline collapses.</text><rect x="684" y="486" width="504" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="512.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">lambda = 1/2  -&gt;  equal old / new attention</text></g></svg>