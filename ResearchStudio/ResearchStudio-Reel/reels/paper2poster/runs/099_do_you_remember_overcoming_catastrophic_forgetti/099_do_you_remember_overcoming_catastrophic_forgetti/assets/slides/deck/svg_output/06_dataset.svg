width="5" height="52" rx="2" fill="#34D3C0"/><text x="364" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">ASVspoof 2015</text><text x="364" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">t2</text><text x="556" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="584" y="222" width="196" height="52" rx="10" fill="#16324A" stroke="#F2C14E" stroke-width="1.5"/><rect x="584" y="222" width="5" height="52" rx="2" fill="#F2C14E"/><text x="600" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">VCC 2020</text><text x="600" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">t3</text><text x="792" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="820" y="222" width="196" height="52" rx="10" fill="#16324A" stroke="#F2685C" stroke-width="1.5"/><rect x="820" y="222" width="5" height="52" rx="2" fill="#F2685C"/><text x="836" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">In-the-Wild</text><text x="836" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">t4</text></g><g id="cue_s06_c2_distinct_acoustic_linguistic_conditi"><title>distinct acoustic linguistic condition in-the-wild being real-world deepfakes public figures</title><rect x="64" y="306" width="560" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="306" width="6" height="140" rx="6" fill="#F2685C"/><text x="92" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Each a distinct condition</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Every set has its own acoustic and linguistic condition;</text><text x="92" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">In-the-Wild is real-world deepfakes of public figures.</text></g><g id="cue_s06_c3_detection_quality_reported_equal_err"><title>detection quality reported equal error rate</title><rect x="656" y="306" width="560" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="306" width="6" height="140" rx="6" fill="#34D3C0"/><text x="684" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Measured by Equal Error Rate</text><text x="684" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Detection quality on every dataset is reported as the</text><text x="684" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Equal Error Rate, or EER.</text><rect x="684" y="404" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="425.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">lower EER  =  better detection</text></g><g id="cue_s06_c4_show_breadth_method_also_evaluated"><title>show breadth method also evaluated speech emotion recognition clear-10 image</title><rect x="64" y="462" width="1152" height="88" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="462" width="6" height="88" rx="6" fill="#F2C14E"/><text x="92" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Beyond audio</text><text x="210" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">To show breadth, RAWM is also evaluated on speech emotion recognition and on the CLEAR-10</text><text x="210" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">image recognition benchmark.</text></g></svg>