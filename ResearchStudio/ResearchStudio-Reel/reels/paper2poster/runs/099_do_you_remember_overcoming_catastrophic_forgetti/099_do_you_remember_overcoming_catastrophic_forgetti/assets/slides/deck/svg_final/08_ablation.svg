<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Which component carries the weight</text><g id="cue_s08_c1_ablation_separates_two_components"><title>ablation separates two components</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Two components, separated</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The ablation isolates the two ingredients of RAWM:</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">adaptive weight modification and the memory</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">regularization term.</text><rect x="92" y="268" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="282.0" r="5" fill="#4C9BE8"/><text x="126" y="288.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">AWM  +  regularization</text></g><g id="cue_s08_c2_when_old_new_datasets_share"><title>when old new datasets share similar feature distribution adaptive weight</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#48C78E"/><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Similar sets: AWM carries it</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">When old and new datasets share a similar feature</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">distribution, adaptive weight modification does most of</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">the work; removing it sharply raises error.</text><rect x="300" y="472" width="250" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="472" width="37" height="24" rx="6" fill="#48C78E"/><text x="288" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">with AWM</text><text x="347" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">low</text><rect x="300" y="506" width="250" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="506" width="175" height="24" rx="6" fill="#F2685C"/><text x="288" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">AWM removed</text><text x="485" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">high</text></g><g id="cue_s08_c3_when_datasets_recorded_under_very"><title>when datasets recorded under very different conditions regularization term becomes</title><rect x="656" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Different sets: regularization is key</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">When datasets are recorded under very different</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">conditions, the regularization term becomes the key to</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">overcoming forgetting.</text></g><g id="cue_s08_c4_across_full_four_dataset_sequence_re"><title>across full four-dataset sequence removing adaptive weight modification hurts more</title><rect x="656" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="684" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">AWM is the primary driver</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Across the full four-dataset sequence, removing adaptive</text><text x="684" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">weight modification hurts more than removing</text><text x="684" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">regularization.</text><rect x="684" y="468" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="483.0" r="5" fill="#F2685C"/><text x="718" y="489.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">remove AWM  -&gt;  larger error jump</text><rect x="684" y="506" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="521.0" r="5" fill="#34D3C0"/><text x="718" y="527.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">regularization: valuable complement</text></g></svg>