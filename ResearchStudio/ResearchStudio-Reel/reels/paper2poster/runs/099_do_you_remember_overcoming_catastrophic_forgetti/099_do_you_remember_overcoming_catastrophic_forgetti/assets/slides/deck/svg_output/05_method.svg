<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two projectors that balance old and new</text><g id="cue_s05_c1_rawm_starts_orthogonal_projector_owm"><title>rawm starts orthogonal projector owm which points update away subspace</title><rect x="64" y="158" width="568" height="204" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="204" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Start from OWM's projector P</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">P points the update away from the subspace of previous</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">inputs. RAWM adds a second projector Q, orthogonal to P and</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">scaled by the genuine/fake ratio beta.</text><rect x="92" y="304" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="332.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">P g _|_ span(prev inputs);   Q _|_ P,  scale beta</text></g><g id="cue_s05_c2_two_projectors_normalized_combined_m"><title>two projectors normalized combined modified direction when batch mostly genuine</title><rect x="64" y="378" width="568" height="172" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#34D3C0"/><text x="92" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Combine into direction R</text><text x="92" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Normalized and combined, a mostly-genuine batch leans toward</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">preserving old knowledge; otherwise it leans toward learning</text><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">the new data.</text><rect x="92" y="506" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="534.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">R = norm(P) + beta * norm(Q),   Q _|_ P</text></g><g id="cue_s05_c3_datasets_recorded_under_very_differe"><title>datasets recorded under very different conditions regularization term treats frozen</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Regularize with a frozen teacher</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">For datasets recorded under very different conditions, the</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">frozen pre-trained model acts as a teacher; the fine-tuned</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">student matches its softened outputs to remember the old</text><text x="684" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">inference distribution.</text><rect x="684" y="318" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="346.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">L = L_ce + lambda * KD(student || teacher)</text></g><g id="cue_s05_c4_crucially_none_replays_past_samples"><title>crucially none replays past samples</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#48C78E"/><text x="684" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Crucially: no replay</text><text x="684" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">None of this stores or replays past samples. Old knowledge</text><text x="684" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">is kept purely through the projector and the regularizer.</text><text x="684" y="528" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">memory kept in the weights, not a buffer</text></g></svg>