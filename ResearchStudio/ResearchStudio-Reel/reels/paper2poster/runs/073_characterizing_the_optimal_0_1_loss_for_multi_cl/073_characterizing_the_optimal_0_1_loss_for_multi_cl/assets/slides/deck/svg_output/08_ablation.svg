<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Do higher-order hyperedges matter?</text><g id="cue_s08_c1_key_ablation_examines_how_much"><title>key ablation examines how much higher-order hyperedges actually matter</title><rect x="64" y="158" width="560" height="112" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="112" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">The question</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">How much do the higher-order hyperedges, the triples</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and quadruples, actually change the computed bound?</text></g><g id="cue_s08_c2_surprisingly_small_perturbation_budg"><title>surprisingly small perturbation budgets lower bound computed only edges nearly</title><rect x="64" y="286" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="286" width="6" height="264" rx="6" fill="#34D3C0"/><text x="92" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Lower bound at small budget  ·  nearly identical</text><rect x="300" y="350" width="230" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="350" width="184" height="30" rx="6" fill="#4C9BE8"/><text x="288" y="371.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">edges only</text><text x="494" y="371.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">0.482</text><rect x="300" y="398" width="230" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="398" width="185" height="30" rx="6" fill="#34D3C0"/><text x="288" y="419.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+ degree 3</text><text x="495" y="419.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">0.483</text><rect x="300" y="446" width="230" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="446" width="185" height="30" rx="6" fill="#48C78E"/><text x="288" y="467.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+ degree 4</text><text x="495" y="467.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">0.483</text><rect x="92" y="494" width="504" height="44" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">Adding millions of hyperedges moves the bound by ~0</text></g><g id="cue_s08_c3_cifar_10_budget_three_roughly_three"><title>cifar-10 budget three roughly three million degree-three ten million degree-four</title><rect x="656" y="158" width="560" height="180" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="180" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">CIFAR-10 at budget 3  ·  sheer count</text><rect x="684" y="220" width="250" height="96" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="809.0" y="269.92" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#F2C14E" font-weight="800" text-anchor="middle">~3M</text><text x="809.0" y="296.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">degree-3 hyperedges</text><rect x="962" y="220" width="250" height="96" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1087.0" y="269.92" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#F2C14E" font-weight="800" text-anchor="middle">~10M</text><text x="1087.0" y="296.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">degree-4 hyperedges</text><text x="684" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">...yet they leave the bound unchanged.</text></g><g id="cue_s08_c4_means_edge_only_bounds_both_cheap"><title>means edge-only bounds both cheap accurate practical regime aggregated binary</title><rect x="656" y="354" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="354" width="6" height="196" rx="6" fill="#48C78E"/><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Practical verdict</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Edge-only bounds are both cheap and accurate in the</text><text x="684" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">practical low-budget regime.</text><rect x="684" y="474" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="489.0" r="5" fill="#F2C14E"/><text x="718" y="495.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Aggregated binary bound: fastest, but much looser</text><rect x="684" y="510" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="525.0" r="5" fill="#4C9BE8"/><text x="718" y="531.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Scaling up model architecture: only minor gains</text></g></svg>