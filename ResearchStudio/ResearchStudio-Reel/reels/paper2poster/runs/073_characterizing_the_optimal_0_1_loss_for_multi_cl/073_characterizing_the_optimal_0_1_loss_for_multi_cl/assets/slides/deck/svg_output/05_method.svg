<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Conflict hypergraph -&gt; linear program</text><g id="cue_s05_c1_core_idea_represent_classification_p"><title>core idea represent classification problem conflict hypergraph</title><rect x="64" y="158" width="568" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="196" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Core idea  ·  a conflict hypergraph</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Represent the whole classification problem as a hypergraph</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">built from the data and the attacker's reach.</text><rect x="370" y="250" width="230" height="98" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><path d="M 402,284 C 378,254 474,238 544,256 C 584,282 554,342 504,344 C 444,354 386,320 402,284 Z" fill="#F2685C" opacity="0.14" stroke="#F2685C" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="424" cy="280" r="9" fill="#4C9BE8"/><circle cx="534" cy="272" r="9" fill="#F2C14E"/><circle cx="494" cy="328" r="9" fill="#48C78E"/><text x="590" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2685C" font-weight="700" text-anchor="end">hyperedge = conflict</text></g><g id="cue_s05_c2_vertex_point_set_points_forms"><title>vertex point set points forms hyperedge when they belong different</title><rect x="64" y="370" width="568" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="370" width="6" height="180" rx="6" fill="#34D3C0"/><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Vertices and hyperedges</text><text x="92" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Each vertex is a data point. A set of points forms a</text><text x="92" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">hyperedge when they belong to different classes yet share</text><text x="92" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">overlapping adversarial neighborhoods, so one confusing</text><text x="92" y="501" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">input could be reached from any of them.</text></g><g id="cue_s05_c3_optimal_0_1_loss_becomes"><title>optimal 0 1 loss becomes linear program maximize probability mass</title><rect x="656" y="158" width="560" height="222" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="222" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Optimal loss = a linear program</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Maximize the probability mass of correctly classified</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">points subject to the hypergraph's incidence</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">constraints; the dual is a fractional cover that yields</text><text x="684" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the optimal attack.</text><rect x="684" y="318" width="504" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="344.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">L* = 1 - max_q  p^T q ,  s.t.  B q &lt;= 1</text></g><g id="cue_s05_c4_because_computing_all_hyperedges_deg"><title>because computing all hyperedges degree ten infeasible authors truncate hypergraph</title><rect x="656" y="396" width="560" height="154" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="656" y="396" width="6" height="154" rx="6" fill="#34D3C0"/><text x="684" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Exact is infeasible -&gt; three bounds</text><rect x="684" y="446" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="461.0" r="5" fill="#4C9BE8"/><text x="718" y="467.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Truncate to low-degree hyperedges  -&gt;  lower bound</text><rect x="684" y="482" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="497.0" r="5" fill="#F2C14E"/><text x="718" y="503.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Aggregate binary one-vs-one losses  -&gt;  cheaper bound</text><rect x="684" y="518" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="533.0" r="5" fill="#48C78E"/><text x="718" y="539.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Generalized Caro-Wei  -&gt;  matching upper bound</text></g></svg>