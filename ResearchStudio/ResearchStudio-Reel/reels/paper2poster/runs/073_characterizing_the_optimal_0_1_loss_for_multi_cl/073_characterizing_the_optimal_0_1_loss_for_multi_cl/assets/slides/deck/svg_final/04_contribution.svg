<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three contributions</text><g id="cue_s04_c1_makes_three_contributions"><title>makes three contributions</title><rect x="64" y="158" width="1152" height="54" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="54" rx="6" fill="#4C9BE8"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The paper makes three contributions: a framework, efficient bounds, and the first multi-class empirical study of the gap.</text></g><g id="cue_s04_c2_first_generalizes_conflict_graph_fra"><title>first generalizes conflict-graph framework binary multi-class classification showing optimal 0</title><rect x="64" y="232" width="368" height="318" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="232" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="300" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Multi-class framework</text><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Generalize the conflict-graph framework</text><text x="92" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">from binary to multi-class: the optimal</text><text x="92" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">0-1 loss is the solution of a linear</text><text x="92" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">program on a conflict hypergraph.</text></g><g id="cue_s04_c3_second_because_exact_program_become"><title>second because exact program become computationally prohibitive develops several more</title><rect x="456" y="232" width="368" height="318" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="232" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="508" cy="300" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="508" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="484" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Efficient bounds</text><text x="484" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Because the exact program can be</text><text x="484" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">prohibitive, develop several cheaper</text><text x="484" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">lower and upper bounds that bracket the</text><text x="484" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">range the true optimum must lie in.</text></g><g id="cue_s04_c4_third_delivers_extensive_empirical_s"><title>third delivers extensive empirical study giving first analysis gap optimal</title><rect x="848" y="232" width="368" height="318" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="232" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="300" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">First empirical study</text><text x="876" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Deliver an extensive study: the first</text><text x="876" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">analysis of the gap to optimal</text><text x="876" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">robustness for multi-class classifiers</text><text x="876" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">on benchmark datasets.</text></g><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">From a binary reference point to a computable multi-class optimum, with a measured gap.</text></svg>