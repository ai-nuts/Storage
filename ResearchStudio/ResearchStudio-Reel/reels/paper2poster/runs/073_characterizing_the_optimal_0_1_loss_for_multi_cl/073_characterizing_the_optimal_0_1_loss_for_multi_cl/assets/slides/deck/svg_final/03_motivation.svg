<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The optimum is a diagnostic, not a curiosity</text><g id="cue_s03_c1_comparing_robustness_best_possible_c"><title>comparing robustness best possible classifier what state-of-the-art achieves powerful diagnostic</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">Compare best-possible vs achieved</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Measuring the best possible classifier against</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">what state-of-the-art training reaches is a</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">powerful diagnostic.</text><text x="92" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">0-1 loss at a fixed attack budget (schematic)</text><rect x="320" y="340" width="240" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="340" width="144" height="30" rx="6" fill="#F2685C"/><text x="308" y="361.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">trained defense</text><text x="474" y="361.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">0.60</text><rect x="320" y="388" width="240" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="388" width="4" height="30" rx="6" fill="#48C78E"/><text x="308" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">optimal (best possible)</text><text x="334" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">~0</text><rect x="92" y="442" width="504" height="90" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="800" text-anchor="start">The gap is the story</text><text x="112" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">How much robustness is still left on the table?</text></g><g id="cue_s03_c2_tells_you_whether_bottleneck_your"><title>tells you whether bottleneck your method fundamental limit threat</title><rect x="648" y="158" width="568" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="116" rx="6" fill="#4C9BE8"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">It localizes the bottleneck</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A large gap blames your training method; a small gap blames</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">a fundamental limit of the data and threat model.</text></g><g id="cue_s03_c3_past_work_delivered_only_two"><title>past work delivered only two classes</title><rect x="648" y="286" width="568" height="108" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="286" width="6" height="108" rx="6" fill="#F2C14E"/><text x="676" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">But only two classes were solved</text><text x="676" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Past work delivered this diagnostic for binary</text><text x="676" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">classification only.</text></g><g id="cue_s03_c4_moving_many_classes_not_trivial"><title>moving many classes not trivial extension three more classes examples</title><rect x="648" y="406" width="568" height="144" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="648" y="406" width="6" height="144" rx="6" fill="#F2C14E"/><text x="676" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Many classes is not a free extension</text><text x="676" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">With three or more classes, examples interact in</text><text x="676" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">higher-order ways that binary analysis simply cannot</text><text x="676" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">capture.</text><text x="676" y="536" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">2 classes: pairs      3+ classes: triples, quadruples, ...</text></g></svg>