<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A large, previously unquantified gap</text><g id="cue_s07_c1_headline_finding_large_previously_un"><title>headline finding large previously unquantified gap adversarially trained classifiers perform</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#F2685C"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Adversarially trained classifiers land far from the optimum, and the gap is much wider than in the binary case.</text></g><g id="cue_s07_c2_3_class_cifar_10_trades_adversarial"><title>3 class cifar-10 trades adversarial cannot achieve loss much better</title><rect x="64" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="264" rx="6" fill="#34D3C0"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">3-class CIFAR-10 0-1 loss  ·  lower is better</text><rect x="300" y="282" width="250" height="32" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="282" width="150" height="32" rx="6" fill="#F2685C"/><text x="288" y="305.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">TRADES training</text><text x="460" y="305.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">0.60</text><rect x="300" y="336" width="250" height="32" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="336" width="2" height="32" rx="6" fill="#48C78E"/><text x="288" y="359.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">optimal achievable</text><text x="312" y="359.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">~0</text><rect x="92" y="392" width="504" height="70" rx="10" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><text x="112" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">At this budget the optimum is essentially zero,</text><text x="112" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">yet TRADES cannot beat 0.60 loss.</text></g><g id="cue_s07_c3_10_class_setting_efficient_lower"><title>10 class setting efficient lower upper bounds sandwich optimal loss</title><rect x="656" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="264" rx="6" fill="#F2C14E"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">10-class  ·  bounds sandwich the optimum</text><rect x="700" y="272" width="500" height="150" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><path d="M 730,399 L 740,399 L 750,398 L 760,398 L 770,397 L 780,396 L 790,395 L 800,394 L 810,393 L 820,392 L 830,391 L 840,390 L 850,389 L 860,387 L 870,386 L 880,385 L 890,383 L 900,382 L 910,381 L 920,379 L 930,378 L 940,376 L 950,375 L 960,373 L 970,372 L 980,370 L 990,368 L 1000,367 L 1010,365 L 1020,363 L 1030,362 L 1040,360 L 1050,358 L 1060,356 L 1070,354 L 1080,352 L 1090,351 L 1100,349 L 1110,347 L 1120,345 L 1130,343 L 1140,341 L 1150,339 L 1160,337 L 1170,335 L 1180,333 L 1190,331 L 1190,321 L 1180,323 L 1170,325 L 1160,327 L 1150,330 L 1140,332 L 1130,334 L 1120,336 L 1110,338 L 1100,340 L 1090,342 L 1080,344 L 1070,346 L 1060,348 L 1050,350 L 1040,352 L 1030,354 L 1020,355 L 1010,357 L 1000,359 L 990,361 L 980,363 L 970,364 L 960,366 L 950,368 L 940,369 L 930,371 L 920,372 L 910,374 L 900,375 L 890,377 L 880,378 L 870,380 L 860,381 L 850,382 L 840,384 L 830,385 L 820,386 L 810,387 L 800,388 L 790,389 L 780,390 L 770,391 L 760,392 L 750,393 L 740,393 L 730,393 Z" fill="#F2C14E" opacity="0.16"/><polyline points="730,399 740,399 750,398 760,398 770,397 780,396 790,395 800,394 810,393 820,392 830,391 840,390 850,389 860,387 870,386 880,385 890,383 900,382 910,381 920,379 930,378 940,376 950,375 960,373 970,372 980,370 990,368 1000,367 1010,365 1020,363 1030,362 1040,360 1050,358 1060,356 1070,354 1080,352 1090,351 1100,349 1110,347 1120,345 1130,343 1140,341 1150,339 1160,337 1170,335 1180,333 1190,331" fill="none" stroke="#48C78E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="730,393 740,393 750,393 760,392 770,391 780,390 790,389 800,388 810,387 820,386 830,385 840,384 850,382 860,381 870,380 880,378 890,377 900,375 910,374 920,372 930,371 940,369 950,368 960,366 970,364 980,363 990,361 1000,359 1010,357 1020,355 1030,354 1040,352 1050,350 1060,348 1070,346 1080,344 1090,342 1100,340 1110,338 1120,336 1130,334 1140,332 1150,330 1160,327 1170,325 1180,323 1190,321" fill="none" stroke="#F2C14E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1190" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2C14E" font-weight="700" text-anchor="end">upper bound</text><text x="1190" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#48C78E" font-weight="700" text-anchor="end">lower bound</text><text x="734" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="start">attack budget -&gt;</text><text x="684" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Lower and upper bounds nearly coincide, so the gap is not an artifact of loose bounds.</text></g><g id="cue_s07_c4_suggests_current_robust_struggles_fa"><title>suggests current robust struggles far more number classes grows</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#4C9BE8"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Robust training struggles more as classes grow</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The gap widens with the number of classes: what looks tolerable in the binary case becomes</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">a large shortfall once several classes interact.</text></g><text x="64" y="648" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">The bottleneck is the training method, not a fundamental limit of the data.</text></svg>