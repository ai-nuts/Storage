<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Robustness has no yardstick for many classes</text><g id="cue_s02_c1_determining_whether_classifier_truly"><title>determining whether classifier truly robust adversarial examples requires knowing best</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">To judge robustness, you need the limit</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Knowing whether a classifier is truly</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">robust to adversarial examples requires</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">knowing the best that is even possible.</text><rect x="92" y="360" width="344" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">where does a model sit?</text><line x1="120" y1="470" x2="408" y2="470" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><text x="120" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#48C78E" font-weight="700" text-anchor="start">optimum</text><circle cx="126" cy="452" r="7" fill="#48C78E"/><text x="408" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2685C" font-weight="700" text-anchor="end">trained model</text><circle cx="372" cy="432" r="7" fill="#F2685C"/><line x1="126" y1="452" x2="372" y2="432" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><text x="250" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#F2C14E" font-weight="800" text-anchor="middle">the gap = ?</text></g><g id="cue_s02_c2_binary_classification_prior_work_cha"><title>binary classification prior work characterized optimal robust loss giving reference</title><rect x="500" y="158" width="716" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="120" rx="6" fill="#48C78E"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Binary case: already solved</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Prior work characterized the optimal robust 0-1 loss for two</text><text x="528" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">classes, giving a reference point to measure progress</text><text x="528" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">against.</text></g><g id="cue_s02_c3_but_real_problems_many_classes"><title>but real problems many classes multi-class case left open</title><rect x="500" y="290" width="716" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="290" width="6" height="96" rx="6" fill="#F2C14E"/><text x="528" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Multi-class case: left open</text><text x="528" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">But real problems have many classes, and the multi-class optimum had never</text><text x="528" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">been characterized.</text></g><g id="cue_s02_c4_way_compute_lowest_0_1"><title>way compute lowest 0 1 loss achievable any classifier against</title><rect x="500" y="398" width="716" height="152" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="398" width="6" height="152" rx="6" fill="#F2685C"/><text x="528" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">The consequence</text><text x="528" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">With no way to compute the lowest 0-1 loss achievable by any classifier</text><text x="528" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">against a test-time attacker, practitioners had no idea how far current</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">defenses sit from the theoretical limit.</text><text x="528" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#F2685C" font-weight="800" text-anchor="start">multi-class optimal loss   =   unknown</text></g></svg>