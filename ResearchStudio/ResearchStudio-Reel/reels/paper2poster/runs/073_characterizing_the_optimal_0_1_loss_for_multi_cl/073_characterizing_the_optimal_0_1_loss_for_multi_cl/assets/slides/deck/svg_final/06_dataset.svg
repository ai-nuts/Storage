<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">MNIST and CIFAR-10 under an L2 attacker</text><g id="cue_s06_c1_experiments_two_standard_vision_benc"><title>experiments two standard vision benchmarks mnist cifar-10 under l-two constrained</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">Two standard vision benchmarks, MNIST and CIFAR-10, evaluated across a sweep of L2 perturbation budgets.</text></g><g id="cue_s06_c2_3_class_studies_they_take"><title>3 class studies they take one thousand samples per class</title><rect x="64" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="6" height="150" rx="6" fill="#34D3C0"/><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">3-class studies  ·  1000 samples / class</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A tractable multi-class setting for the exact hypergraph.</text><rect x="92" y="350" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="365.0" r="5" fill="#34D3C0"/><text x="126" y="371.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">MNIST 1 / 4 / 7      CIFAR-10 plane / bird / ship</text></g><g id="cue_s06_c3_they_also_compute_bounds_full"><title>they also compute bounds full 10 class problem complete sets</title><rect x="656" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="240" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Full 10-class problem</text><text x="684" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Efficient bounds are also computed on the complete</text><text x="684" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">training sets.</text><rect x="684" y="350" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="365.0" r="5" fill="#F2C14E"/><text x="718" y="371.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">MNIST 10-class   ·   CIFAR-10 10-class  (full data)</text></g><g id="cue_s06_c4_reference_defenses_they_train_classi"><title>reference defenses they train classifiers trades adversarial small convolutional network</title><rect x="64" y="410" width="1152" height="140" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="64" y="410" width="6" height="140" rx="6" fill="#F2685C"/><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2685C" font-weight="800" text-anchor="start">Reference defenses  ·  TRADES adversarial training</text><text x="92" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A small convolutional network for MNIST and a wide residual network for CIFAR-10, both evaluated with the</text><text x="92" y="503" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">strong APGD attack from AutoAttack.</text></g></svg>