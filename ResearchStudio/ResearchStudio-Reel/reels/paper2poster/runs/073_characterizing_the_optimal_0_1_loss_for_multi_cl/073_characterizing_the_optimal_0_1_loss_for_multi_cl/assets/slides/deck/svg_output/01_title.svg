<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">NeurIPS 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Princeton  ·  Univ. of Chicago  ·  Penn State</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">Characterizing the Optimal 0-1 Loss</text><text x="64" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#4C9BE8" font-weight="800" text-anchor="start">for Multi-class Classification</text><text x="64" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#34D3C0" font-weight="800" text-anchor="start">with a Test-time Attacker</text><text x="64" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="500" text-anchor="start">Dai · Ding · Bhagoji · Cullina · Zhao · Zheng · Mittal</text><g id="cue_s01_c1_how_robust_any_classifier_possibly"><title>how robust any classifier possibly against adversary perturbs inputs test</title><rect x="64" y="308" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="118" rx="6" fill="#4C9BE8"/><text x="92" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The question</text><text x="92" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">How robust can ANY classifier possibly be against an adversary that</text><text x="92" y="391" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">perturbs inputs at test time?</text></g><g id="cue_s01_c2_authors_derive_achievable_informatio"><title>authors derive achievable information-theoretic lower bounds 0 1 loss best</title><rect x="656" y="308" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="308" width="6" height="118" rx="6" fill="#F2C14E"/><text x="684" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">What they derive</text><text x="684" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Achievable information-theoretic lower bounds on the optimal 0-1</text><text x="684" y="391" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">loss, for any discrete dataset.</text></g><g id="cue_s01_c3_their_framework_builds_conflict_hype"><title>their framework builds conflict hypergraph attacker constraints solves linear program</title><rect x="64" y="448" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="448" width="6" height="118" rx="6" fill="#34D3C0"/><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The tool</text><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Build a conflict hypergraph from data + attacker, then solve a</text><text x="92" y="531" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">linear program for the lowest loss.</text></g><g id="cue_s01_c4_because_exact_problem_often_too"><title>because exact problem often too large solve they introduce efficient</title><rect x="656" y="448" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="448" width="6" height="118" rx="6" fill="#48C78E"/><text x="684" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The payoff</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Efficient bounds bracket the optimum, exposing a striking gap</text><text x="684" y="531" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">between robust models and the limit.</text></g><line x1="64" y1="616" x2="1216" y2="616" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2302.10722</text><text x="300" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">How far do today's robust models sit from what is even theoretically possible?</text></svg>