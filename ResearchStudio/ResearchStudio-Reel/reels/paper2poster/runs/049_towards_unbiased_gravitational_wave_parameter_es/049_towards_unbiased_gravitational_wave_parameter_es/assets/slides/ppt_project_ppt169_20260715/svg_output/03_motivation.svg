<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">MOTIVATION</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">Gravitational-wave astronomy is scaling up fast</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 hero -->
  <g id="cue_s03_c1_why_now" data-cue-label="cue_s03_c1_why_now">
    <rect x="80" y="184" width="1120" height="94" rx="10" fill="#10213B" />
    <text x="112" y="242" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF">Why now?</text>
    <line x1="300" y1="205" x2="300" y2="257" stroke="#2F6FB8" stroke-width="2" />
    <text x="330" y="228" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#C9D6E6">More events, more sensitivity — and small noise errors no longer</text>
    <text x="330" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#C9D6E6">stay small. The idealized-noise shortcut is running out of road.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s03_c2_gravitational_wave_astronomy_scaling" data-cue-label="cue_s03_c2_gravitational_wave_astronomy_scaling">
    <rect x="80" y="300" width="545" height="344" rx="10" fill="#F2F6FC" />
    <rect x="80" y="300" width="6" height="344" rx="3" fill="#E8833A" />
    <text x="112" y="342" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">BIAS ACCUMULATES</text>
    <text x="112" y="376" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#10213B">Tiny departures pile up</text>
    <text x="112" y="412" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">Analyzing large catalogs makes the whole pipeline</text>
    <text x="112" y="436" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">sensitive to even tiny departures from Gaussian</text>
    <text x="112" y="460" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">noise, which quietly accumulate into systematic bias.</text>
    <!-- growing bars -->
    <g>
      <rect x="120" y="588" width="46" height="18" fill="#F3C39A" />
      <rect x="182" y="574" width="46" height="32" fill="#EEA766" />
      <rect x="244" y="556" width="46" height="50" fill="#E8933F" />
      <rect x="306" y="532" width="46" height="74" fill="#E8833A" />
      <rect x="368" y="500" width="46" height="106" fill="#DC6F27" />
      <rect x="430" y="560" width="70" height="46" rx="4" fill="none" stroke="#DC6F27" stroke-width="1.4" stroke-dasharray="3 3" />
      <text x="465" y="588" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#C9772F">bias</text>
      <line x1="120" y1="606" x2="500" y2="606" stroke="#D8E2EE" stroke-width="1" />
      <text x="120" y="626" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#93A2B6">events analyzed  →</text>
    </g>
  </g>

  <!-- c3 -->
  <g id="cue_s03_c3_authors_wanted_keep_trusted_determin" data-cue-label="cue_s03_c3_authors_wanted_keep_trusted_determin">
    <rect x="655" y="300" width="545" height="344" rx="10" fill="#EAF1FA" />
    <rect x="655" y="300" width="6" height="344" rx="3" fill="#2F6FB8" />
    <text x="687" y="342" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">THE GOAL</text>
    <text x="687" y="376" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#10213B">Keep the physics, drop the assumption</text>
    <text x="687" y="414" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">Retain the trusted deterministic waveform models,</text>
    <text x="687" y="438" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">but stop assuming idealized noise — analyzing</text>
    <text x="687" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">artifact-contaminated signals without data surgery.</text>
    <text x="687" y="516" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#53627A">Built for the next-generation detectors:</text>
    <rect x="687" y="536" width="230" height="44" rx="22" fill="#FFFFFF" stroke="#2F6FB8" stroke-width="1.2" />
    <circle cx="713" cy="558" r="9" fill="none" stroke="#2F6FB8" stroke-width="2" />
    <text x="732" y="563" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#172234">Cosmic Explorer</text>
    <rect x="933" y="536" width="234" height="44" rx="22" fill="#FFFFFF" stroke="#2F6FB8" stroke-width="1.2" />
    <path d="M 951 566 L 960 550 L 969 566 Z" fill="none" stroke="#2F6FB8" stroke-width="2" stroke-linejoin="round" />
    <text x="978" y="563" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#172234">Einstein Telescope</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">03</text>
</svg>
