<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">METHOD</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">How SLIC works</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1: inverse problem framing -->
  <g id="cue_s05_c1_how_slic_works_setting_inverse" data-cue-label="cue_s05_c1_how_slic_works_setting_inverse">
    <rect x="80" y="176" width="1120" height="74" rx="10" fill="#F2F6FC" />
    <rect x="80" y="176" width="6" height="74" rx="3" fill="#2F6FB8" />
    <text x="112" y="206" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">THE SETTING · INVERSE PROBLEM WITH ADDITIVE NOISE</text>
    <text x="112" y="234" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#53627A">An observation is a deterministic signal model plus noise:</text>
    <text x="720" y="235" font-family="'Consolas', monospace" font-size="21" font-weight="700" fill="#10213B">x</text>
    <text x="732" y="240" font-family="'Consolas', monospace" font-size="13" font-weight="700" fill="#10213B">O</text>
    <text x="744" y="235" font-family="'Consolas', monospace" font-size="21" font-weight="700" fill="#10213B"> = M(θ) + x</text>
  </g>

  <!-- c2: key equation hero -->
  <g id="cue_s05_c2_learn_score_noise_distribution_you" data-cue-label="cue_s05_c2_learn_score_noise_distribution_you">
    <rect x="80" y="262" width="1120" height="116" rx="10" fill="#10213B" />
    <text x="112" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#7FA8D6" letter-spacing="1">LEARN THE NOISE SCORE  →  BUILD THE LIKELIHOOD SCORE</text>
    <g font-family="Georgia, serif" font-size="30" fill="#FFFFFF">
      <text x="360" y="352">&#8711;</text>
      <text x="383" y="360" font-size="18">&#952;</text>
      <text x="398" y="352">log p( x</text>
      <text x="512" y="360" font-size="18">O</text>
      <text x="524" y="352">| &#952; )</text>
      <text x="596" y="352">=</text>
      <text x="628" y="352">&#8722;</text>
      <text x="656" y="352">&#8711;</text>
      <text x="679" y="360" font-size="18">x</text>
      <text x="693" y="352">log Q(x)</text>
      <text x="818" y="352">&#183;</text>
      <text x="838" y="352">&#8711;</text>
      <text x="861" y="360" font-size="18">&#952;</text>
      <text x="876" y="352">M(&#952;)</text>
    </g>
  </g>

  <!-- c3: pipeline (train + jacobian) -->
  <g id="cue_s05_c3_they_train_score_based_diffusion_rea" data-cue-label="cue_s05_c3_they_train_score_based_diffusion_rea">
    <rect x="80" y="394" width="524" height="164" rx="10" fill="#EAF1FA" />
    <text x="104" y="424" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">STEP A · LEARN NOISE</text>
    <text x="104" y="456" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#10213B">Score-based diffusion model</text>
    <text x="104" y="484" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">Trained on real LIGO noise via</text>
    <text x="104" y="506" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">denoising score matching to learn</text>
    <text x="104" y="534" font-family="'Consolas', monospace" font-size="15" font-weight="700" fill="#2F6FB8">&#8711;x log Q(x)</text>

    <rect x="676" y="394" width="524" height="164" rx="10" fill="#FBEFE6" />
    <text x="700" y="424" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">STEP B · CHAIN PHYSICS</text>
    <text x="700" y="456" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#10213B">Differentiable waveform Jacobian</text>
    <text x="700" y="484" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">IMRPhenomD from the ripple package</text>
    <text x="700" y="506" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">gives the waveform Jacobian</text>
    <text x="700" y="534" font-family="'Consolas', monospace" font-size="15" font-weight="700" fill="#C9772F">&#8711;&#952; M(&#952;)</text>

    <!-- connector -->
    <path d="M 604 476 L 676 476" fill="none" stroke="#93A2B6" stroke-width="2" />
    <path d="M 668 470 L 678 476 L 668 482 Z" fill="#93A2B6" />
  </g>

  <!-- c4: MALA -->
  <g id="cue_s05_c4_sampling_metropolis_adjusted_langevi" data-cue-label="cue_s05_c4_sampling_metropolis_adjusted_langevi">
    <rect x="80" y="572" width="1120" height="76" rx="10" fill="#F2F6FC" />
    <rect x="80" y="572" width="6" height="76" rx="3" fill="#2E8B6F" />
    <circle cx="128" cy="610" r="16" fill="#2E8B6F" />
    <path d="M 120 610 q 8 -14 16 0 q -8 14 -16 0" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <text x="160" y="605" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#10213B">Sample the posterior with MALA</text>
    <text x="160" y="630" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">The likelihood score drives a Metropolis-adjusted Langevin algorithm to draw samples of the source parameters θ.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">05</text>
</svg>
