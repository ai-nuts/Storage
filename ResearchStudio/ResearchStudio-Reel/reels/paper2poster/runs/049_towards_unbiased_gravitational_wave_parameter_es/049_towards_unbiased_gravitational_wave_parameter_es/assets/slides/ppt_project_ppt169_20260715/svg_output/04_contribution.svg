<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">CONTRIBUTION</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">Bringing SLIC to gravitational-wave inference</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 band -->
  <g id="cue_s04_c1_core_contribution_brings_score_based" data-cue-label="cue_s04_c1_core_contribution_brings_score_based">
    <rect x="80" y="182" width="1120" height="84" rx="10" fill="#EAF1FA" stroke="#2F6FB8" stroke-width="1.2" />
    <rect x="80" y="182" width="6" height="84" rx="3" fill="#2F6FB8" />
    <text x="112" y="216" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">THE CORE IDEA</text>
    <text x="112" y="248" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#10213B">Adapt Score-based Likelihood Characterization (SLIC) to learn real detector noise instead of assuming it.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s04_c2_originally_developed_astronomical_im" data-cue-label="cue_s04_c2_originally_developed_astronomical_im">
    <rect x="80" y="288" width="360" height="356" rx="10" fill="#F2F6FC" />
    <circle cx="118" cy="326" r="15" fill="#2F6FB8" />
    <text x="118" y="331" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
    <text x="150" y="331" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10213B">Learn, don't assume</text>
    <text x="108" y="382" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">Originally developed for</text>
    <text x="108" y="406" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">astronomical imaging with</text>
    <text x="108" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">Hubble and Webb, SLIC learns</text>
    <text x="108" y="454" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">the score of the noise</text>
    <text x="108" y="478" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">distribution — instead of</text>
    <text x="108" y="502" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">assuming its functional form.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s04_c3_coupled_differentiable_waveform_yiel" data-cue-label="cue_s04_c3_coupled_differentiable_waveform_yiel">
    <rect x="460" y="288" width="360" height="356" rx="10" fill="#F2F6FC" />
    <circle cx="498" cy="326" r="15" fill="#2F6FB8" />
    <text x="498" y="331" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
    <text x="530" y="331" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10213B">Unbiased likelihood</text>
    <text x="488" y="382" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">Couple that learned noise</text>
    <text x="488" y="406" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">score with a differentiable</text>
    <text x="488" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">physical waveform model to</text>
    <text x="488" y="454" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">produce an unbiased estimate</text>
    <text x="488" y="478" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">of the likelihood — no</text>
    <text x="488" y="502" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">Gaussian assumption required.</text>
  </g>

  <!-- c4 -->
  <g id="cue_s04_c4_they_show_both_generates_realistic" data-cue-label="cue_s04_c4_they_show_both_generates_realistic">
    <rect x="840" y="288" width="360" height="356" rx="10" fill="#FBEFE6" />
    <circle cx="878" cy="326" r="15" fill="#E8833A" />
    <text x="878" y="331" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
    <text x="910" y="331" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10213B">Shown end-to-end</text>
    <rect x="868" y="374" width="304" height="112" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.2" />
    <circle cx="892" cy="404" r="8" fill="#E8833A" />
    <path d="M 889 404 l 2.5 3 l 5 -6" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <text x="910" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#10213B">Generates realistic</text>
    <text x="910" y="422" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#10213B">LIGO noise</text>
    <text x="910" y="458" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">capturing even sharp</text>
    <text x="910" y="476" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">spectral lines</text>
    <rect x="868" y="500" width="304" height="112" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.2" />
    <circle cx="892" cy="530" r="8" fill="#E8833A" />
    <path d="M 889 530 l 2.5 3 l 5 -6" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" />
    <text x="910" y="526" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#10213B">Recovers the true</text>
    <text x="910" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#10213B">injected parameters</text>
    <text x="910" y="584" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">from a signal in real</text>
    <text x="910" y="602" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">LIGO detector noise</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">04</text>
</svg>
