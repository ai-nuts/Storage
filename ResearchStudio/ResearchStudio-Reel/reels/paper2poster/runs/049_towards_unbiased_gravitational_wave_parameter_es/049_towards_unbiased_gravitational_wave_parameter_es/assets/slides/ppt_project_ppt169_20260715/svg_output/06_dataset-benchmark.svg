<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">DATASET &amp; BENCHMARK</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">Trained and tested on real LIGO data</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 band -->
  <g id="cue_s06_c1_demonstration_real" data-cue-label="cue_s06_c1_demonstration_real">
    <rect x="80" y="176" width="1120" height="66" rx="10" fill="#EAF1FA" stroke="#2F6FB8" stroke-width="1.2" />
    <rect x="80" y="176" width="6" height="66" rx="3" fill="#2F6FB8" />
    <text x="112" y="216" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10213B">The demonstration uses real detector data — not simulated noise.</text>
  </g>

  <!-- c2 training -->
  <g id="cue_s06_c2_they_train_score_network_eleven" data-cue-label="cue_s06_c2_they_train_score_network_eleven">
    <rect x="80" y="260" width="545" height="384" rx="10" fill="#F2F6FC" />
    <rect x="80" y="260" width="6" height="384" rx="3" fill="#2F6FB8" />
    <text x="112" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">TRAINING DATA</text>
    <text x="112" y="330" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">Score network on LIGO-Hanford</text>
    <g font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">
      <circle cx="120" cy="364" r="3.5" fill="#2F6FB8" /><text x="136" y="370">11 hours of real LIGO-Hanford noise</text>
      <circle cx="120" cy="396" r="3.5" fill="#2F6FB8" /><text x="136" y="402">recorded around the GW150914 event</text>
      <circle cx="120" cy="428" r="3.5" fill="#2F6FB8" /><text x="136" y="434">sampled at 4096 Hz, split into 4 s segments</text>
      <circle cx="120" cy="460" r="3.5" fill="#2F6FB8" /><text x="136" y="466">the segment with the true signal is discarded</text>
    </g>
    <!-- stat chips -->
    <rect x="112" y="500" width="150" height="112" rx="8" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <text x="187" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#2F6FB8">11 h</text>
    <text x="187" y="586" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">real LIGO noise</text>
    <rect x="278" y="500" width="150" height="112" rx="8" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <text x="353" y="552" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#2F6FB8">4096 Hz</text>
    <text x="353" y="586" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">sample rate</text>
    <rect x="444" y="500" width="150" height="112" rx="8" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <text x="519" y="556" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#2F6FB8">4 s</text>
    <text x="519" y="586" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">segment length</text>
  </g>

  <!-- c3 fourier -->
  <g id="cue_s06_c3_runs_fourier_domain_after_tukey" data-cue-label="cue_s06_c3_runs_fourier_domain_after_tukey">
    <rect x="655" y="260" width="545" height="120" rx="10" fill="#F2F6FC" />
    <rect x="655" y="260" width="6" height="120" rx="3" fill="#7FA8D6" />
    <text x="687" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">PRE-PROCESSING</text>
    <text x="687" y="326" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10213B">Trained in the Fourier domain</text>
    <text x="687" y="356" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">after applying a Tukey window to each 4 s segment.</text>
  </g>

  <!-- c4 test -->
  <g id="cue_s06_c4_test_they_inject_simulated_gw150914" data-cue-label="cue_s06_c4_test_they_inject_simulated_gw150914">
    <rect x="655" y="396" width="545" height="248" rx="10" fill="#FBEFE6" />
    <rect x="655" y="396" width="6" height="248" rx="3" fill="#E8833A" />
    <text x="687" y="432" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">TEST SETUP · INJECTION</text>
    <text x="687" y="464" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">Inject a known signal into real noise</text>
    <text x="687" y="498" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">A simulated GW150914-like signal is injected into a</text>
    <text x="687" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">held-out stretch of real LIGO noise recorded after</text>
    <text x="687" y="542" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">the training window — never seen during training.</text>
    <rect x="687" y="562" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1" />
    <text x="762" y="588" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#E8833A">29 M&#8857;</text>
    <text x="762" y="608" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#53627A">chirp mass</text>
    <rect x="849" y="562" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1" />
    <text x="924" y="588" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#E8833A">400 Mpc</text>
    <text x="924" y="608" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#53627A">distance</text>
    <rect x="1011" y="562" width="150" height="58" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1" />
    <text x="1086" y="588" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#E8833A">&#967; = 0</text>
    <text x="1086" y="608" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#53627A">zero spins</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">06</text>
</svg>
