<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">THE PROBLEM</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">The Gaussian noise assumption breaks on real data</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 -->
  <g id="cue_s02_c1_extracting_astrophysics_gravitationa" data-cue-label="cue_s02_c1_extracting_astrophysics_gravitationa">
    <rect x="80" y="184" width="545" height="220" rx="10" fill="#F2F6FC" />
    <rect x="80" y="184" width="6" height="220" rx="3" fill="#2F6FB8" />
    <text x="112" y="224" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">01 · INFERENCE</text>
    <text x="112" y="258" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">Inference needs a likelihood</text>
    <text x="112" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">Extracting astrophysics from gravitational waves</text>
    <text x="112" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">means Bayesian inference over masses and spins —</text>
    <text x="112" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">and that inference requires a noise likelihood.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s02_c2_decades_field_assumed_noise_gaussian" data-cue-label="cue_s02_c2_decades_field_assumed_noise_gaussian">
    <rect x="655" y="184" width="545" height="220" rx="10" fill="#F2F6FC" />
    <rect x="655" y="184" width="6" height="220" rx="3" fill="#7FA8D6" />
    <text x="687" y="224" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">02 · THE ASSUMPTION</text>
    <text x="687" y="258" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">A convenient assumption</text>
    <path d="M 1070 250 q 30 -70 60 0" fill="none" stroke="#7FA8D6" stroke-width="2.5" />
    <text x="687" y="296" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">For decades the field assumed detector noise is</text>
    <text x="687" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">Gaussian and stationary, because it makes the</text>
    <text x="687" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">likelihood tractable and cheap to evaluate.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s02_c3_but_real_detectors_drift_over" data-cue-label="cue_s02_c3_but_real_detectors_drift_over">
    <rect x="80" y="424" width="545" height="220" rx="10" fill="#FBEFE6" />
    <rect x="80" y="424" width="6" height="220" rx="3" fill="#E8833A" />
    <text x="112" y="464" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">03 · REALITY</text>
    <text x="112" y="498" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">But real detectors are messy</text>
    <polyline points="470,452 486,452 492,436 500,468 508,444 520,452 590,452" fill="none" stroke="#E8833A" stroke-width="2.2" />
    <text x="112" y="536" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">Sensitivity drifts over time, and data carry</text>
    <text x="112" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">transient glitches and narrow, wandering spectral</text>
    <text x="112" y="584" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">lines that violate the Gaussian model.</text>
  </g>

  <!-- c4 -->
  <g id="cue_s02_c4_these_handled_segment_segment_costly" data-cue-label="cue_s02_c4_these_handled_segment_segment_costly">
    <rect x="655" y="424" width="545" height="220" rx="10" fill="#FBEFE6" />
    <rect x="655" y="424" width="6" height="220" rx="3" fill="#E8833A" />
    <text x="687" y="464" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">04 · THE COST</text>
    <text x="687" y="498" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">Costly fixes that can bias results</text>
    <text x="687" y="536" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">With no generative model, artifacts are handled</text>
    <text x="687" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">segment-by-segment with bespoke fixes. Famously,</text>
    <text x="687" y="584" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">GW170817 landed right on a loud LIGO glitch.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">02</text>
</svg>
