<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">ABLATION · HEAD-TO-HEAD</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">SLIC vs the standard Gaussian likelihood</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 band -->
  <g id="cue_s08_c1_key_comparison_against_conventional" data-cue-label="cue_s08_c1_key_comparison_against_conventional">
    <rect x="80" y="172" width="1120" height="54" rx="10" fill="#EAF1FA" stroke="#2F6FB8" stroke-width="1.2" />
    <rect x="80" y="172" width="6" height="54" rx="3" fill="#2F6FB8" />
    <text x="112" y="205" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#10213B">The key comparison is against the conventional Gaussian-likelihood approach.</text>
  </g>

  <!-- c2 setup -->
  <g id="cue_s08_c2_injected_signal_they_run_inference" data-cue-label="cue_s08_c2_injected_signal_they_run_inference">
    <rect x="80" y="242" width="400" height="402" rx="10" fill="#F2F6FC" />
    <rect x="80" y="242" width="6" height="402" rx="3" fill="#7FA8D6" />
    <text x="112" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">THE SETUP</text>
    <text x="112" y="314" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">Run inference twice</text>
    <text x="112" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">The same injected signal is</text>
    <text x="112" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">analyzed with both likelihoods,</text>
    <text x="112" y="394" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">isolating the noise model's effect.</text>
    <rect x="112" y="424" width="336" height="72" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.4" />
    <rect x="132" y="452" width="16" height="16" fill="#E8833A" />
    <text x="160" y="459" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#10213B">SLIC likelihood</text>
    <text x="160" y="481" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">learned score-based noise model</text>
    <rect x="112" y="510" width="336" height="72" rx="8" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1.4" />
    <rect x="132" y="538" width="16" height="16" fill="#7FA8D6" />
    <text x="160" y="545" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#10213B">Gaussian likelihood</text>
    <text x="160" y="567" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#53627A">standard baseline from a Welch PSD</text>
    <text x="112" y="616" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A2B6">Black lines mark the true injected values.</text>
  </g>

  <!-- c3 corner plot + verdict -->
  <g id="cue_s08_c3_they_pick_glitch_free_segment_both" data-cue-label="cue_s08_c3_they_pick_glitch_free_segment_both">
    <rect x="500" y="242" width="700" height="402" rx="10" fill="#F2F6FC" />
    <text x="524" y="274" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">FIGURE 2 · POSTERIOR COMPARISON</text>
    <rect x="524" y="286" width="368" height="330" rx="6" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <image href="../images/fig_corner.png" x="540" y="296" width="336" height="310" preserveAspectRatio="xMidYMid meet" />
    <!-- verdict -->
    <text x="916" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">GLITCH-FREE SEGMENT</text>
    <text x="916" y="360" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">Both recover</text>
    <text x="916" y="388" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#10213B">the truth</text>
    <text x="916" y="424" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">On this clean case, SLIC is</text>
    <text x="916" y="446" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">validated against the trusted</text>
    <text x="916" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">baseline.</text>
    <rect x="916" y="492" width="256" height="112" rx="8" fill="#FBEFE6" stroke="#E8833A" stroke-width="1.2" />
    <text x="936" y="528" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#E8833A">SLIC is tighter</text>
    <text x="936" y="558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">Smaller-variance posterior,</text>
    <text x="936" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">hinting at larger gains once</text>
    <text x="936" y="598" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">noise is truly non-Gaussian.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">08</text>
</svg>
