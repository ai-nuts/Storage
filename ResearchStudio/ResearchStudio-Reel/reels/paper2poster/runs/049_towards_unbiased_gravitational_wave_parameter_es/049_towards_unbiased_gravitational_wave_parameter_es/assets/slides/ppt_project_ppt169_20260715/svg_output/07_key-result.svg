<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">KEY RESULT</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">Reproduces LIGO noise, recovers the signal</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 kicker band -->
  <g id="cue_s07_c1_results_encouraging" data-cue-label="cue_s07_c1_results_encouraging">
    <rect x="80" y="172" width="1120" height="54" rx="10" fill="#EAF1FA" stroke="#2F6FB8" stroke-width="1.2" />
    <rect x="80" y="172" width="6" height="54" rx="3" fill="#2F6FB8" />
    <text x="112" y="205" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#10213B">The results are encouraging — on both the learned noise and the recovered parameters.</text>
  </g>

  <!-- c2 PSD figure -->
  <g id="cue_s07_c2_drawing_one_thousand_twenty_four_noi" data-cue-label="cue_s07_c2_drawing_one_thousand_twenty_four_noi">
    <rect x="80" y="242" width="700" height="402" rx="10" fill="#F2F6FC" />
    <text x="104" y="274" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">FIGURE 1 · LEARNED NOISE PSD</text>
    <rect x="624" y="258" width="128" height="26" rx="13" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <text x="688" y="276" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#53627A">1024 realizations</text>
    <rect x="108" y="290" width="644" height="308" rx="6" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <image href="../images/fig_psd.png" x="122" y="300" width="616" height="288" preserveAspectRatio="xMidYMid meet" />
    <text x="104" y="622" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">SLIC (blue) matches the Welch estimate (gray), resolving narrow spectral lines even more finely.</text>
  </g>

  <!-- c3 recovery card -->
  <g id="cue_s07_c3_injecting_known_signal_slic_recovers" data-cue-label="cue_s07_c3_injecting_known_signal_slic_recovers">
    <rect x="800" y="242" width="400" height="402" rx="10" fill="#FBEFE6" />
    <rect x="800" y="242" width="6" height="402" rx="3" fill="#E8833A" />
    <text x="832" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">PARAMETER RECOVERY</text>
    <text x="832" y="312" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#10213B">Recovers the injected</text>
    <text x="832" y="340" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#10213B">signal</text>
    <text x="1000" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#E8833A">5 / 5</text>
    <text x="1000" y="462" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">varied parameters recovered</text>
    <text x="1000" y="484" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">with high credibility</text>
    <rect x="832" y="512" width="336" height="104" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.2" />
    <text x="856" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#10213B">Tighter posterior</text>
    <text x="856" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">Smaller variance than the standard</text>
    <text x="856" y="598" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#53627A">Gaussian-likelihood posterior.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">SLIC · Unbiased Gravitational-Wave Parameter Estimation</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">07</text>
</svg>
