<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="takePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#16305A" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- header -->
  <rect x="80" y="60" width="46" height="5" fill="#2F6FB8" />
  <text x="80" y="88" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">TAKEAWAY</text>
  <text x="80" y="126" font-family="Georgia, serif" font-size="33" font-weight="700" fill="#10213B">Unbiased likelihoods, learned from real noise</text>
  <line x1="80" y1="148" x2="1200" y2="148" stroke="#D8E2EE" stroke-width="1" />

  <!-- c1 hero -->
  <g id="cue_s10_c1_takeaway_you_longer_assume_gaussian" data-cue-label="cue_s10_c1_takeaway_you_longer_assume_gaussian">
    <rect x="80" y="172" width="1120" height="102" rx="10" fill="url(#takePanel)" />
    <rect x="80" y="172" width="6" height="102" rx="3" fill="#2F6FB8" />
    <text x="112" y="216" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#FFFFFF">You no longer have to assume the noise is Gaussian and stationary.</text>
    <text x="112" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#C9D6E6">SLIC produces an unbiased gravitational-wave likelihood directly from detector data.</text>
  </g>

  <!-- c2 how -->
  <g id="cue_s10_c2_learning_real_noise_distribution_dif" data-cue-label="cue_s10_c2_learning_real_noise_distribution_dif">
    <rect x="80" y="290" width="520" height="322" rx="10" fill="#EAF1FA" />
    <rect x="80" y="290" width="6" height="322" rx="3" fill="#2F6FB8" />
    <text x="112" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="1">THE RECIPE, IN ONE LINE</text>
    <text x="112" y="364" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#10213B">Learn the noise, keep the physics</text>
    <text x="112" y="402" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">Learn the real noise distribution with a diffusion</text>
    <text x="112" y="426" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">model, couple it to a differentiable waveform, and</text>
    <text x="112" y="450" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">get an unbiased likelihood straight from data —</text>
    <text x="112" y="474" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#53627A">recovering true parameters on real LIGO noise.</text>
    <rect x="112" y="536" width="224" height="46" rx="23" fill="#FFFFFF" stroke="#2F6FB8" stroke-width="1.2" />
    <path d="M 133 559 l 7 7 l 12 -14" fill="none" stroke="#2E8B6F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="164" y="565" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#10213B">Assumption-free noise</text>
  </g>

  <!-- c3 whats next -->
  <g id="cue_s10_c3_proof_concept_currently_single_detec" data-cue-label="cue_s10_c3_proof_concept_currently_single_detec">
    <rect x="620" y="290" width="360" height="322" rx="10" fill="#FBEFE6" />
    <rect x="620" y="290" width="6" height="322" rx="3" fill="#E8833A" />
    <text x="652" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#C9772F" letter-spacing="1">PROOF OF CONCEPT · NEXT</text>
    <text x="652" y="364" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#10213B">Toward scalable inference</text>
    <text x="652" y="398" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#53627A">Today: single-detector, 4 s, MALA.</text>
    <rect x="652" y="416" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.2" />
    <text x="668" y="441" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#172234">Longer segments (BNS)</text>
    <rect x="652" y="464" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.2" />
    <text x="668" y="489" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#172234">Multi-detector coherent</text>
    <rect x="652" y="512" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#F3C39A" stroke-width="1.2" />
    <text x="668" y="537" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#172234">Advanced samplers (flowMC)</text>
    <text x="652" y="586" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-style="italic" fill="#53627A">Fast, scalable, unbiased inference.</text>
  </g>

  <!-- QR CTA panel -->
  <g id="take-utility">
    <rect x="1000" y="290" width="200" height="322" rx="10" fill="#F2F6FC" />
    <text x="1100" y="330" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#93A2B6" letter-spacing="1">CODE &amp; MODELS</text>
    <rect x="1005" y="344" width="190" height="190" rx="8" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <image href="../images/qr_code.png" x="1011" y="350" width="178" height="178" />
    <text x="1100" y="562" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#10213B">Scan to explore</text>
    <text x="1100" y="586" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#53627A">github.com/RonanLegin</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="688" x2="120" y2="688" stroke="#93A2B6" stroke-width="0.75" />
  <text x="80" y="702" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#93A2B6">Legin et al. · ICML 2023 ML4Astro Workshop</text>
  <text x="1200" y="702" text-anchor="end" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#93A2B6">10</text>
</svg>
