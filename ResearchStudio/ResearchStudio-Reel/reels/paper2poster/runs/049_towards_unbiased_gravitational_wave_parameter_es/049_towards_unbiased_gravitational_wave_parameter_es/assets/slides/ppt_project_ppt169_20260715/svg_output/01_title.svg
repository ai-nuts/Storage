<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="rippleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2F6FB8" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#2F6FB8" stop-opacity="0.16" />
    </radialGradient>
    <linearGradient id="coverPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#14294A" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  <!-- right cosmology panel: ripples in spacetime -->
  <g id="cover-visual">
    <rect x="760" y="0" width="520" height="720" fill="url(#coverPanel)" />
    <g transform="translate(1010,250)">
      <circle cx="0" cy="0" r="200" fill="url(#rippleGrad)" />
      <circle cx="0" cy="0" r="55" fill="none" stroke="#7FA8D6" stroke-width="1.4" stroke-opacity="0.55" />
      <circle cx="0" cy="0" r="100" fill="none" stroke="#7FA8D6" stroke-width="1.4" stroke-opacity="0.40" />
      <circle cx="0" cy="0" r="145" fill="none" stroke="#7FA8D6" stroke-width="1.4" stroke-opacity="0.26" />
      <circle cx="0" cy="0" r="185" fill="none" stroke="#7FA8D6" stroke-width="1.4" stroke-opacity="0.15" />
      <circle cx="-30" cy="0" r="14" fill="#E8833A" />
      <circle cx="30" cy="0" r="10" fill="#7FA8D6" />
      <path d="M -30 0 A 30 30 0 1 1 30 0" fill="none" stroke="#F3C39A" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="3 5" />
    </g>
    <text x="1010" y="106" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#7FA8D6" letter-spacing="1.5">RIPPLES IN SPACETIME · REAL DETECTOR NOISE</text>
    <!-- scan tile -->
    <rect x="898" y="470" width="224" height="224" rx="14" fill="#FFFFFF" />
    <image href="../images/qr_code.png" x="921" y="482" width="178" height="178" />
    <text x="1010" y="684" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#10213B" letter-spacing="0.5">Scan · Paper &amp; Code</text>
  </g>

  <!-- left title block -->
  <g id="cover-kicker">
    <rect x="80" y="86" width="46" height="5" fill="#2F6FB8" />
    <text x="80" y="128" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#2F6FB8" letter-spacing="2.5">ICML 2023 · ML4ASTRO WORKSHOP</text>
  </g>

  <g id="cover-title">
    <text x="80" y="196" font-family="Georgia, serif" font-size="50" font-weight="700" fill="#10213B">Towards Unbiased</text>
    <text x="80" y="252" font-family="Georgia, serif" font-size="50" font-weight="700" fill="#10213B">Gravitational-Wave</text>
    <text x="80" y="308" font-family="Georgia, serif" font-size="50" font-weight="700" fill="#10213B">Parameter Estimation</text>
  </g>

  <!-- c2: SLIC badge -->
  <g id="cue_s01_c2_work_introduces_slic_score_based_lik" data-cue-label="cue_s01_c2_work_introduces_slic_score_based_lik">
    <rect x="80" y="336" width="600" height="52" rx="8" fill="#EAF1FA" stroke="#2F6FB8" stroke-width="1.2" />
    <rect x="80" y="336" width="6" height="52" rx="3" fill="#2F6FB8" />
    <text x="104" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2F6FB8" letter-spacing="1">SLIC</text>
    <text x="104" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#172234">Score-based Likelihood Characterization</text>
  </g>

  <!-- c1: assumption framing -->
  <g id="cue_s01_c1_gravitational_wave_inference_usually" data-cue-label="cue_s01_c1_gravitational_wave_inference_usually">
    <text x="80" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#53627A">Standard inference assumes Gaussian, stationary noise — but real</text>
    <text x="80" y="454" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#53627A">LIGO, Virgo and KAGRA data break that with glitches and drifting lines.</text>
  </g>

  <!-- c3: one-line method chips -->
  <g id="cue_s01_c3_learns_true_noise_distribution_diffu" data-cue-label="cue_s01_c3_learns_true_noise_distribution_diffu">
    <rect x="80" y="480" width="290" height="40" rx="20" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1.2" />
    <text x="100" y="505" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#172234">Diffusion model learns noise</text>
    <text x="376" y="505" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#2F6FB8">+</text>
    <rect x="396" y="480" width="284" height="40" rx="20" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1.2" />
    <text x="416" y="505" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#172234">Differentiable waveform</text>
  </g>

  <!-- authors -->
  <g id="cover-authors">
    <line x1="80" y1="556" x2="150" y2="556" stroke="#10213B" stroke-width="1.5" />
    <text x="80" y="584" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#53627A">R. Legin, M. Isi, K. Wong, A. Adam, L. Perreault-Levasseur, Y. Hezaveh</text>
    <text x="80" y="608" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#93A2B6">Université de Montréal · Mila · Ciela · Flatiron Institute · Perimeter Institute</text>
  </g>

  <!-- utility cluster: logos -->
  <g id="cover-utility">
    <rect x="80" y="632" width="112" height="34" rx="4" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <image href="../images/logo_udem.png" x="90" y="640" width="92" height="18" preserveAspectRatio="xMidYMid meet" />
    <rect x="204" y="632" width="120" height="34" rx="4" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <image href="../images/logo_mila.png" x="214" y="640" width="100" height="18" preserveAspectRatio="xMidYMid meet" />
    <rect x="336" y="632" width="140" height="34" rx="4" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="1" />
    <image href="../images/logo_flatiron.png" x="346" y="639" width="120" height="20" preserveAspectRatio="xMidYMid meet" />
    <text x="496" y="653" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#93A2B6">github.com/RonanLegin/slicgw</text>
  </g>
</svg>
