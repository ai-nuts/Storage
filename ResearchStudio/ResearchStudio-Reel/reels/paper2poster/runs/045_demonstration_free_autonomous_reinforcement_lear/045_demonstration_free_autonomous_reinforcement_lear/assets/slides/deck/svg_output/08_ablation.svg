<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Both components earn their keep</text><g id="cue_s08_c1_ablation_study_peels_method_apart"><title>ablation study peels method apart show both pieces earn their</title><rect x="64" y="158" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="196" rx="6" fill="#34D3C0"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Remove the bidirectional curriculum</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Dropping the curriculum causes a consistent drop,</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">showing the value of guiding the agent from easy</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">initial states and goals to harder ones.</text><rect x="92" y="306" width="504" height="34" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="306" width="393" height="34" rx="8" fill="#34D3C0"/><text x="112" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="start">w/o bidirectional  -&gt;  consistent drop</text></g><g id="cue_s08_c2_further_removing_auxiliary_agent_whi"><title>further removing auxiliary agent which reduces method naive reset-free reinforcement</title><rect x="656" y="158" width="560" height="196" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="158" width="6" height="196" rx="6" fill="#F2685C"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Remove the auxiliary agent as well</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Also removing the auxiliary agent reduces IBC to naive</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">reset-free RL and causes a further, larger drop,</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">especially in object manipulation.</text><rect x="684" y="306" width="504" height="34" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="684" y="306" width="171" height="34" rx="8" fill="#F2685C"/><text x="704" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="start">naive reset-free RL  -&gt;  larger drop</text></g><g id="cue_s08_c3_gains_task_dependent_bidirectional_c"><title>gains task-dependent bidirectional curriculum matters little simple tabletop manipulation environment</title><rect x="64" y="370" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="370" width="6" height="180" rx="6" fill="#F2C14E"/><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">The gains are task-dependent</text><text x="92" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The bidirectional curriculum matters little in the</text><text x="92" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">simple Tabletop Manipulation state space, and the</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">auxiliary agent helps less in Point-U-Maze, where the</text><text x="92" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">start is already far from the goal.</text></g><g id="cue_s08_c4_authors_also_confirm_implicit_curric"><title>authors also confirm implicit curriculum behaves intended fraction episodes auxiliary</title><rect x="656" y="370" width="560" height="180" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="370" width="6" height="180" rx="6" fill="#48C78E"/><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">The implicit curriculum vanishes on cue</text><text x="684" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The fraction of episodes the auxiliary</text><text x="684" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">agent intervenes in falls toward zero</text><text x="684" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">once the forward agent is fully trained.</text><rect x="966" y="420" width="232" height="116" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="1000" y1="436" x2="1000" y2="512" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="1000" y1="512" x2="1176" y2="512" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><path d="M 1000.0 442.0 L 1004.4 447.4 L 1008.8 452.3 L 1013.2 456.9 L 1017.6 461.2 L 1022.0 465.1 L 1026.4 468.7 L 1030.8 472.0 L 1035.2 475.1 L 1039.6 477.9 L 1044.0 480.5 L 1048.4 483.0 L 1052.8 485.2 L 1057.2 487.3 L 1061.6 489.2 L 1066.0 490.9 L 1070.4 492.5 L 1074.8 494.0 L 1079.2 495.4 L 1083.6 496.7 L 1088.0 497.9 L 1092.4 499.0 L 1096.8 500.0 L 1101.2 500.9 L 1105.6 501.7 L 1110.0 502.5 L 1114.4 503.3 L 1118.8 503.9 L 1123.2 504.5 L 1127.6 505.1 L 1132.0 505.6 L 1136.4 506.1 L 1140.8 506.6 L 1145.2 507.0 L 1149.6 507.4 L 1154.0 507.7 L 1158.4 508.1 L 1162.8 508.4 L 1167.2 508.7 L 1171.6 508.9 L 1176.0 509.1" fill="none" stroke="#48C78E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="994" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#6E869C" font-weight="700" text-anchor="end">1</text><text x="994" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#6E869C" font-weight="700" text-anchor="end">0</text><text x="1176" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="end">training -&gt;</text></g></svg>