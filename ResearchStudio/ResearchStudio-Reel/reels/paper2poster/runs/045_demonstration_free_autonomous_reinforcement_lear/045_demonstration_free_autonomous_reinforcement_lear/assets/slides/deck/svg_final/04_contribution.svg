<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">IBC: two curricula, no demos, no resets</text><g id="cue_s04_c1_core_contribution_method_called_ibc"><title>core contribution method called ibc short implicit bidirectional curriculum far</title><rect x="64" y="176" width="272" height="384" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#4C9BE8" font-weight="800" text-anchor="middle">IBC</text><text x="88" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">First of its</text><text x="88" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">kind</text><text x="88" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Implicit and Bidirectional</text><text x="88" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Curriculum, to the authors'</text><text x="88" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">knowledge the first</text><text x="88" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">non-episodic RL algorithm</text><text x="88" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">that learns with no manual</text><text x="88" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">resets and no demonstrations.</text></g><g id="cue_s04_c2_first_conditionally_activated_auxili"><title>first conditionally activated auxiliary agent forms implicit curriculum helps main</title><rect x="360" y="176" width="272" height="384" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="176" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="410" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="410" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">1</text><text x="384" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Implicit</text><text x="384" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">curriculum</text><text x="384" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A conditionally activated</text><text x="384" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">auxiliary agent: it helps the</text><text x="384" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">main agent early and then</text><text x="384" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">gradually disappears as the</text><text x="384" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">main agent becomes capable.</text></g><g id="cue_s04_c3_second_bidirectional_goal_curriculum"><title>second bidirectional goal curriculum grounded optimal transport automatically proposes intermediate</title><rect x="656" y="176" width="272" height="384" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="176" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="706" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="706" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="680" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Bidirectional</text><text x="680" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">curriculum</text><text x="680" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A goal curriculum grounded in</text><text x="680" y="401" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">optimal transport that</text><text x="680" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">automatically proposes</text><text x="680" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">intermediate goals for both</text><text x="680" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the forward and the backward</text><text x="680" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">directions.</text></g><g id="cue_s04_c4_together_these_let_agent_bootstrap"><title>together these let agent bootstrap its own signal across six</title><rect x="952" y="176" width="272" height="384" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="176" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="1002" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">6</text><text x="976" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Beats</text><text x="976" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">expert-data</text><text x="976" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">methods</text><text x="976" y="405" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Bootstraps its own training</text><text x="976" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">signal; across six</text><text x="976" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sparse-reward environments it</text><text x="976" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">beats demonstration-based</text><text x="976" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">methods and approaches an</text><text x="976" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">episodic oracle.</text></g><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">An auxiliary agent that fades away plus a self-generated goal curriculum, learned purely from experience.</text></svg>