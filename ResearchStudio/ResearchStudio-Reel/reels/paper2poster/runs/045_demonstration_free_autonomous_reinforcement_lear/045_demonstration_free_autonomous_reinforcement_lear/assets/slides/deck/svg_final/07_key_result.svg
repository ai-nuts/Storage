<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">State of the art, with zero demonstrations</text><g id="cue_s07_c1_headline_result_ibc_reaches_state_of"><title>headline result ibc reaches state-of-the-art success rates across all six</title><rect x="64" y="150" width="1152" height="48" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="48" rx="6" fill="#48C78E"/><text x="92" y="180" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">IBC reaches state-of-the-art success across all six environments, without a single demonstration.</text></g><g id="cue_s07_c2_outperforms_vaprl_medal_two_strong"><title>outperforms vaprl medal two strong baselines actually near-expert demonstration many</title><rect x="64" y="212" width="560" height="266" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="212" width="6" height="266" rx="6" fill="#48C78E"/><text x="92" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Success rate  ·  higher is better</text><rect x="214" y="274" width="314" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="214" y="274" width="288" height="24" rx="6" fill="#48C78E"/><text x="202" y="291.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">IBC (ours)</text><text x="512" y="291.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">SOTA, 0 demos</text><rect x="214" y="312" width="314" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="214" y="312" width="298" height="24" rx="6" fill="#4C9BE8"/><text x="202" y="329.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Oracle (episodic)</text><text x="522" y="329.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#4C9BE8" font-weight="800" text-anchor="start">upper bound</text><rect x="214" y="350" width="314" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="214" y="350" width="207" height="24" rx="6" fill="#F2C14E"/><text x="202" y="367.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MEDAL (demos)</text><text x="431" y="367.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">uses demos</text><rect x="214" y="388" width="314" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="214" y="388" width="182" height="24" rx="6" fill="#F2685C"/><text x="202" y="405.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">VaPRL (demos)</text><text x="406" y="405.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#F2685C" font-weight="800" text-anchor="start">uses demos</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">IBC matches the episodic oracle while beating both demonstration baselines.</text></g><g id="cue_s07_c3_demonstration_based_baselines_especi"><title>demonstration-based baselines especially falter fetch environments where task-relevant interactions sparse</title><rect x="656" y="212" width="560" height="266" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="212" width="6" height="266" rx="6" fill="#F2C14E"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Where the demo baselines falter</text><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">VaPRL and MEDAL especially struggle in the Fetch</text><text x="684" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">environments, where task-relevant interactions are sparse</text><text x="684" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">and the evaluation goals are spread across a whole region</text><text x="684" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">rather than a few discrete points.</text><rect x="684" y="414" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="436.0" r="5" fill="#F2C14E"/><text x="718" y="442.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">sparse interactions  ·  region-wide goals</text></g><g id="cue_s07_c4_when_vaprl_stripped_its_demonstratio"><title>when vaprl stripped its demonstrations fair comparison its performance drops</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#F2685C"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Strip the demonstrations away</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">When VaPRL is stripped of its demonstrations for a fair comparison, its performance drops</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">noticeably, underscoring how much the prior methods depend on that extra data.</text></g><text x="64" y="644" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Same performance, none of the expert-data crutches.</text></svg>