<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Autonomy without resets or demonstrations</text><g id="cue_s10_c1_takeaway_simple_remember_ibc_shows"><title>takeaway simple remember ibc shows agent learn robotic manipulation locomotion</title><rect x="64" y="170" width="1152" height="98" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="170" width="6" height="98" rx="6" fill="#4C9BE8"/><circle cx="112" cy="219.0" r="10" fill="#4C9BE8"/><text x="150" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">An agent that learns on its own</text><text x="150" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">IBC learns robotic manipulation and locomotion tasks entirely on its own, with no environment resets</text><text x="150" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and no demonstrations, by generating its own curriculum.</text></g><g id="cue_s10_c2_does_two_cooperating_ideas_auxiliary"><title>does two cooperating ideas auxiliary agent anchors learner early fades</title><rect x="64" y="282" width="1152" height="98" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="282" width="6" height="98" rx="6" fill="#34D3C0"/><circle cx="112" cy="331.0" r="10" fill="#34D3C0"/><text x="150" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Two cooperating ideas</text><text x="150" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">An auxiliary agent that anchors the learner early and then fades away, plus a bidirectional goal</text><text x="150" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">curriculum built on optimal transport.</text></g><g id="cue_s10_c3_result_matches_methods_depend_expert"><title>result matches methods depend expert</title><rect x="64" y="394" width="1152" height="98" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="394" width="6" height="98" rx="6" fill="#48C78E"/><circle cx="112" cy="443.0" r="10" fill="#48C78E"/><text x="150" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Matches expert-data methods</text><text x="150" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The result matches approaches that depend on expert demonstration data, without ever using any.</text></g><g id="cue_s10_c4_main_caveats_assumes_reversible_envi"><title>main caveats assumes reversible environments still needs human specify sparse</title><rect x="64" y="506" width="1152" height="98" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="506" width="6" height="98" rx="6" fill="#F2C14E"/><circle cx="112" cy="555.0" r="10" fill="#F2C14E"/><text x="150" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Caveats and what comes next</text><text x="150" y="576" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It assumes reversible environments and still needs a human-specified sparse reward; a fully</text><text x="150" y="598" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reward-free variant via C-learning is the natural next step.</text></g><line x1="64" y1="624" x2="1216" y2="624" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="700" text-anchor="start">IBC  ·  ICML 2023  ·  Kim, Cho &amp; Kim  ·  Seoul National University</text><text x="1216" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="end">github.com/snu-larr/ibc_official</text></svg>