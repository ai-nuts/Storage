<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Learning from scratch is unstable</text><g id="cue_s03_c1_why_demonstration_free_autonomous_le"><title>why demonstration-free autonomous learning hard non-episodic setting untrained forward agent</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="92" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">Why is it so hard?</text><text x="92" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">In the non-episodic setting an untrained forward</text><text x="92" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">agent wanders off to arbitrary states, so every</text><text x="92" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">new attempt starts from a wildly different, often</text><text x="92" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">useless condition.</text><rect x="92" y="344" width="504" height="150" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><circle cx="150" cy="420" r="22" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><text x="150" y="425" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="middle">s0</text><path d="M 176 420 C 250 372 300 470 360 412 S 470 372 520 424" fill="none" stroke="#F2685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6"/><circle cx="520" cy="424" r="6" fill="#F2685C"/><text x="360" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2685C" font-weight="800" text-anchor="middle">agent drifts to arbitrary states</text><text x="92" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">Highly variable start states make learning collapse.</text></g><g id="cue_s03_c2_instability_makes_learning_collapse"><title>instability makes learning collapse prior work patched ways reintroduce human</title><rect x="656" y="158" width="560" height="120" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="120" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Prior patches reintroduce human effort</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Some methods still ask for occasional manual resets; others</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">only succeed when the useful interactions happen to occur by</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">chance.</text></g><g id="cue_s03_c3_two_most_directly_comparable_methods"><title>two most directly comparable methods vaprl medal both lean demonstration</title><rect x="656" y="290" width="560" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="290" width="6" height="140" rx="6" fill="#4C9BE8"/><text x="684" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">VaPRL and MEDAL lean on demonstrations</text><text x="684" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The two most directly comparable methods both use</text><text x="684" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">demonstration data, either to seed a subgoal curriculum or</text><text x="684" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">to define what the backward agent should return to.</text></g><g id="cue_s03_c4_motivation_build_agent_provides_its"><title>motivation build agent provides its own anchor its own curriculum</title><rect x="656" y="442" width="560" height="108" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="442" width="6" height="108" rx="6" fill="#48C78E"/><text x="684" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">The goal</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">An agent that provides its own anchor and its own</text><text x="684" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">curriculum, using nothing but the experience it collects.</text></g></svg>