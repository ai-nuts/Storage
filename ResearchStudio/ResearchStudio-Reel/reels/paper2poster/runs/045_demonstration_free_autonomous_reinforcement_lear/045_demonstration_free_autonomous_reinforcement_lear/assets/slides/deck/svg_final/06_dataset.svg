<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Six reset-free sparse-reward tasks</text><g id="cue_s06_c1_test_ibc_authors_assembled_six"><title>test ibc authors assembled six sparse-reward environments spanning both manipulation</title><rect x="64" y="158" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="176" rx="6" fill="#4C9BE8"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Two tasks from EARL</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Six sparse-reward environments span manipulation and</text><text x="92" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">locomotion; two come from EARL, an established</text><text x="92" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">autonomous-RL benchmark.</text><rect x="92" y="278" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="295.0" r="5" fill="#4C9BE8"/><text x="126" y="301.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Tabletop Manipulation   ·   Sawyer Door</text></g><g id="cue_s06_c2_other_four_fetch_pick_place"><title>other four fetch pick place fetch push fetch reach point-u-maze</title><rect x="656" y="158" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="176" rx="6" fill="#34D3C0"/><text x="684" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#34D3C0" font-weight="800" text-anchor="start">Four modified MuJoCo / Gym tasks</text><text x="684" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Standard OpenAI Gym tasks the authors adapted for the</text><text x="684" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reset-free, non-episodic setting.</text><rect x="684" y="278" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="295.0" r="5" fill="#34D3C0"/><text x="718" y="301.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Fetch Pick&amp;Place · Push · Reach · Point-U-Maze</text></g><g id="cue_s06_c3_evaluation_follows_earl_protocol_age"><title>evaluation follows earl protocol agent spawned once interacts continually reset</title><rect x="64" y="352" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="352" width="6" height="176" rx="6" fill="#F2C14E"/><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#F2C14E" font-weight="800" text-anchor="start">The EARL evaluation protocol</text><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The agent is spawned once, interacts continually, and is</text><text x="92" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reset only rarely, after hundreds of thousands of steps.</text><rect x="92" y="472" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="489.0" r="5" fill="#F2C14E"/><text x="126" y="495.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">spawn once  ·  continual  ·  reset every ~100k+ steps</text></g><g id="cue_s06_c4_performance_measured_deployed_policy"><title>performance measured deployed policy evaluation metric reported ten-thousand-step intervals averaged</title><rect x="656" y="352" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="352" width="6" height="176" rx="6" fill="#B08CE8"/><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#B08CE8" font-weight="800" text-anchor="start">How performance is measured</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The deployed-policy evaluation metric, reported at</text><text x="684" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">ten-thousand-step intervals.</text><rect x="684" y="472" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="489.0" r="5" fill="#B08CE8"/><text x="718" y="495.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">deployed-policy metric  ·  10k-step  ·  5 seeds</text></g></svg>