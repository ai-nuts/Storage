<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Alternate two agents, generate goals by OT</text><g id="cue_s05_c1_how_ibc_works_during_agent"><title>how ibc works during agent constantly alternates between two roles</title><rect x="64" y="158" width="568" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="214" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Two alternating roles</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The forward agent tries to accomplish the task; the</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">auxiliary agent brings it back toward target initial states</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">so it can practice again.</text><rect x="92" y="290" width="512" height="74" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><circle cx="162" cy="333.0" r="22" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><text x="162" y="338.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="middle">s0</text><text x="162" y="377.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">target init states</text><circle cx="534" cy="333.0" r="22" fill="#16324A" stroke="#F2C14E" stroke-width="2"/><polygon points="528.0,326.0 542.0,333.0 528.0,340.0" fill="#F2C14E"/><text x="534" y="377.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">task goal g*</text><path d="M 188 317.0 C 252 287.0 444 287.0 508 317.0" fill="none" stroke="#48C78E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="508.0,317.0 498.0,317.0 502.6,308.6" fill="#48C78E"/><text x="348.0" y="295.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#48C78E" font-weight="800" text-anchor="middle">forward  pi_f  (do the task)</text><path d="M 508 349.0 C 444 379.0 252 379.0 188 349.0" fill="none" stroke="#F2C14E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="188.0,349.0 193.4,340.6 198.0,349.0" fill="#F2C14E"/><text x="348.0" y="387.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#F2C14E" font-weight="800" text-anchor="middle">auxiliary  pi_a  (bring it back)</text></g><g id="cue_s05_c2_key_trick_auxiliary_agent_activated"><title>key trick auxiliary agent activated only when forward agent fails</title><rect x="64" y="388" width="568" height="162" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="388" width="6" height="162" rx="6" fill="#34D3C0"/><text x="92" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The implicit curriculum</text><text x="92" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The auxiliary agent is activated only when the forward agent</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">fails, so as the forward agent improves it steps in less and</text><text x="92" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">less.</text><rect x="92" y="514" width="512" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="541.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">activate pi_a  only if  pi_f  fails</text></g><g id="cue_s05_c3_rather_relying_demonstrations_ibc_sa"><title>rather relying demonstrations ibc samples candidate states its own replay</title><rect x="656" y="158" width="560" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="214" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Curriculum as optimal transport</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Sample candidate states from the replay buffer and frame</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">goal generation as a Wasserstein Barycenter with a value</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">bias, solved by Minimum Cost Maximum Flow.</text><line x1="726" y1="338" x2="1126" y2="338" stroke="#26455F" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 6"/><circle cx="726" cy="338" r="7" fill="#4C9BE8"/><circle cx="1126" cy="338" r="7" fill="#F2C14E"/><circle cx="806.0" cy="338" r="5.5" fill="#F2C14E"/><circle cx="886.0" cy="338" r="5.5" fill="#F2C14E"/><circle cx="966.0" cy="338" r="5.5" fill="#F2C14E"/><circle cx="1046.0" cy="338" r="5.5" fill="#F2C14E"/><text x="726" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">start</text><text x="1126" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">goal</text><text x="926.0" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="700" text-anchor="middle">K forward  +  K auxiliary goals</text></g><g id="cue_s05_c4_lipschitz_continuity_assumption_lets"><title>lipschitz-continuity assumption lets method relax true objective tractable lower bound</title><rect x="656" y="388" width="560" height="162" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="388" width="6" height="162" rx="6" fill="#48C78E"/><text x="684" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Tractable, and demonstration-free</text><text x="684" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A Lipschitz assumption relaxes the objective into a</text><text x="684" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">tractable lower bound, optimized with standard Soft</text><text x="684" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Actor-Critic.</text><rect x="684" y="514" width="504" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="541.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">defines target from ~10 states  (sometimes 1)</text></g></svg>