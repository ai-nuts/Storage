<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The results in one place</text><g id="cue_s09_c1_few_numbers_capture_impact_ibc"><title>few numbers capture impact ibc tested six sparse-reward environments two</title><rect x="64" y="168" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Evaluated broadly</text><text x="92" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Six sparse-reward environments, two from the EARL benchmark and</text><text x="92" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">four adapted MuJoCo tasks, each run over five random seeds.</text><rect x="700" y="182" width="230" height="68" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="815.0" y="218.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">6</text><text x="815.0" y="236.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">environments</text><rect x="958" y="182" width="254" height="68" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1085.0" y="218.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">5</text><text x="1085.0" y="236.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">random seeds</text></g><g id="cue_s09_c2_define_its_target_distribution_needs"><title>define its target distribution needs only about ten example states</title><rect x="64" y="280" width="560" height="270" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="280" width="6" height="270" rx="6" fill="#34D3C0"/><text x="92" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">To define the target distribution</text><rect x="92" y="338" width="250" height="96" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="217.0" y="389.84000000000003" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">~10</text><text x="217.0" y="414.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">target states (sometimes 1)</text><rect x="370" y="338" width="250" height="96" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="495.0" y="389.84000000000003" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2685C" font-weight="800" text-anchor="middle">1000s</text><text x="495.0" y="414.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">demo transitions prior methods need</text><rect x="92" y="446" width="528" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="474" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#34D3C0" font-weight="800" text-anchor="start">~10 states    vs    thousands of demos</text><text x="92" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Orders of magnitude less prior information than prior autonomous RL.</text></g><g id="cue_s09_c3_despite_zero_demonstrations_zero_man"><title>despite zero demonstrations zero manual resets reaches success rates comparable</title><rect x="656" y="280" width="560" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="280" width="6" height="132" rx="6" fill="#48C78E"/><text x="684" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">Zero crutches, oracle-level results</text><rect x="684" y="334" width="250" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="809.0" y="368.56" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">0</text><text x="809.0" y="385.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">demonstrations</text><rect x="962" y="334" width="250" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1087.0" y="368.56" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">0</text><text x="1087.0" y="385.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">manual resets</text></g><g id="cue_s09_c4_short_none_usual_crutches_roughly"><title>short none usual crutches roughly same performance</title><rect x="656" y="424" width="560" height="126" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="424" width="6" height="126" rx="6" fill="#F2C14E"/><text x="684" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">In short</text><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">None of the usual crutches, and roughly the same</text><text x="684" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">performance as an oracle trained in the far easier</text><text x="684" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">episodic setting.</text></g></svg>