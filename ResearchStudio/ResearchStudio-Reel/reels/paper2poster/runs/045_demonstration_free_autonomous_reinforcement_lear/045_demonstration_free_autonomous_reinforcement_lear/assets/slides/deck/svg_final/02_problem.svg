<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Real agents cannot reset on demand</text><g id="cue_s02_c1_standard_reinforcement_learning_quie"><title>standard reinforcement learning quietly assumes something rarely holds outside simulator</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The hidden assumption</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Standard reinforcement learning quietly assumes</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">that at the end of every episode the environment</text><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">magically resets to its starting state.</text><rect x="92" y="342" width="504" height="150" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><circle cx="170" cy="430" r="22" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><text x="170" y="435" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="middle">s0</text><circle cx="518" cy="430" r="22" fill="#16324A" stroke="#6E869C" stroke-width="2"/><text x="518" y="435" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#6E869C" font-weight="800" text-anchor="middle">s_T</text><path d="M 200 418 C 280 388 408 388 488 418" fill="none" stroke="#6E869C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="488.0,418.0 478.0,418.0 482.6,409.6" fill="#6E869C"/><text x="344" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="700" text-anchor="middle">episode ends</text><path d="M 488 452 C 408 486 280 486 200 452" fill="none" stroke="#F2685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><polygon points="200.0,452.0 205.4,443.6 210.0,452.0" fill="#F2685C"/><text x="344" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2685C" font-weight="800" text-anchor="middle">assumed free reset</text><text x="92" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#4C9BE8" font-weight="700" text-anchor="start">Outside a simulator, that reset is not free.</text></g><g id="cue_s02_c2_physical_robot_resetting_means_human"><title>physical robot resetting means human intervention scripted reset policies custom</title><rect x="656" y="158" width="560" height="120" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="158" width="6" height="120" rx="6" fill="#F2685C"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Resetting a robot is costly</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">It means human intervention, scripted reset policies, or</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">custom rigs, all slow and expensive.</text><text x="684" y="272" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2685C" font-weight="800" text-anchor="start">human  +  scripts  +  rigs  =  slow, costly</text></g><g id="cue_s02_c3_but_existing_autonomous_methods_chea"><title>but existing autonomous methods cheat different way they rely prior</title><rect x="656" y="290" width="560" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="290" width="6" height="140" rx="6" fill="#F2C14E"/><text x="684" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Existing autonomous methods cheat</text><text x="684" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">They rely on prior data, expert demonstrations or example</text><text x="684" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">states of interest, and struggle when the task-relevant</text><text x="684" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">interactions are sparse and rarely happen by chance.</text></g><g id="cue_s02_c4_what_been_missing_agent_learns"><title>what been missing agent learns truly scratch resets demonstrations</title><rect x="656" y="442" width="560" height="108" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="442" width="6" height="108" rx="6" fill="#48C78E"/><text x="684" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">What is missing</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">An agent that learns truly from scratch, with no resets</text><text x="684" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">and no demonstrations.</text></g></svg>