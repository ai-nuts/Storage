<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Seoul National University  ·  AIIS  ·  ASRI</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">Demonstration-free Autonomous</text><text x="64" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">Reinforcement Learning</text><text x="64" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#4C9BE8" font-weight="700" text-anchor="start">via an Implicit and Bidirectional Curriculum (IBC)</text><text x="64" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Jigang Kim   ·   Daesol Cho   ·   H. Jin Kim      —   Seoul National University</text><g id="cue_s01_c1_reinforcement_learning_mastered_comp"><title>reinforcement learning mastered complex skills but almost always assuming environment</title><rect x="64" y="312" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="312" width="6" height="118" rx="6" fill="#4C9BE8"/><text x="92" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">RL quietly assumes cheap resets</text><text x="92" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Reinforcement learning has mastered complex skills, but almost</text><text x="92" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">always by assuming the environment resets to a fixed initial state</text><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">after every episode.</text></g><g id="cue_s01_c2_real_world_especially_robotics_those"><title>real world especially robotics those resets expensive requiring human supervision</title><rect x="656" y="312" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="312" width="6" height="118" rx="6" fill="#F2685C"/><text x="684" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Resets are expensive in the real world</text><text x="684" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">In robotics a reset means human supervision or scripted routines,</text><text x="684" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">so an agent that never needs to be reset is far more practical.</text></g><g id="cue_s01_c3_jin_kim_seoul_national_university"><title>jin kim seoul national university tackles autonomous reinforcement learning without</title><rect x="64" y="448" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="448" width="6" height="118" rx="6" fill="#34D3C0"/><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">No resets, no demonstrations</text><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">IBC does autonomous RL without any environment resets and,</text><text x="92" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">crucially, without any demonstration data to lean on.</text></g><g id="cue_s01_c4_result_state_of_the_art_performance"><title>result state-of-the-art performance non-episodic benchmarks matching methods rely expert even</title><rect x="656" y="448" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="448" width="6" height="118" rx="6" fill="#48C78E"/><text x="684" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Matches methods that use expert data</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">State-of-the-art on non-episodic benchmarks, matching</text><text x="684" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demonstration-based methods and approaching episodic oracle RL.</text></g><line x1="64" y1="600" x2="1216" y2="600" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2305.09943</text><text x="360" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">An agent that learns robotic tasks entirely on its own.</text><text x="1216" y="636" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="end">github.com/snu-larr/ibc_official</text></svg>