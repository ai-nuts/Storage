<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">WHY IT WORKS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Do the highlights predict what people edit?</text><g id="cue_s08_c1_understand_why_authors_tracked_which"><title>understand why authors tracked which tokens survived meaning they left</title><rect x="64" y="158" width="560" height="160" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="160" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Measure: token survival</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The authors tracked which tokens survived - were left</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">unchanged by the participant.</text><rect x="92" y="286" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="300.0" r="5" fill="#4C9BE8"/><text x="126" y="306.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">survived  =  token left unchanged</text></g><g id="cue_s08_c2_under_edit_tokens_left_un_highlighte"><title>under edit tokens left un-highlighted survived far more often about</title><rect x="64" y="332" width="560" height="218" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="332" width="6" height="218" rx="6" fill="#48C78E"/><text x="92" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Edit model: highlights track edits</text><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Tokens it left un-highlighted survived far more often</text><text x="92" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">than the tokens it did highlight.</text><rect x="360" y="472" width="200" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="360" y="472" width="174" height="24" rx="6" fill="#48C78E"/><text x="348" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">un-highlighted</text><text x="544" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">87%</text><rect x="360" y="510" width="200" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="360" y="510" width="70" height="24" rx="6" fill="#F2C14E"/><text x="348" y="528.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">highlighted</text><text x="440" y="528.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">35%</text></g><g id="cue_s08_c3_compare_generation_probability_highl"><title>compare generation-probability highlighting where highlighted tokens still survived seventy-four percent</title><rect x="656" y="158" width="560" height="160" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="160" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Gen-prob: highlights barely move it</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Under generation-probability highlighting, highlighted</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">tokens still survived most of the time.</text><rect x="884" y="290" width="296" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="884" y="290" width="219" height="22" rx="6" fill="#F2C14E"/><text x="872" y="307.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">gen-prob highlighted</text><text x="1113" y="307.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">74%</text></g><g id="cue_s08_c4_other_words_edit_highlights_closely"><title>other words edit highlights closely predict what people actually change</title><rect x="656" y="332" width="560" height="218" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="332" width="6" height="218" rx="6" fill="#34D3C0"/><text x="684" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Edit highlights predict real edits</text><text x="684" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The edit model's highlights closely predict what people</text><text x="684" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">actually change; gen-prob highlights barely move the needle.</text><text x="684" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">All differences are extremely significant.</text><text x="684" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">survival if highlighted</text><rect x="884" y="504" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="884" y="504" width="105" height="20" rx="6" fill="#48C78E"/><text x="872" y="520.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">edit</text><text x="999" y="520.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">35%</text><rect x="884" y="530" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="884" y="530" width="222" height="20" rx="6" fill="#F2C14E"/><text x="872" y="546.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">gen-prob</text><text x="1116" y="546.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">74%</text></g></svg>