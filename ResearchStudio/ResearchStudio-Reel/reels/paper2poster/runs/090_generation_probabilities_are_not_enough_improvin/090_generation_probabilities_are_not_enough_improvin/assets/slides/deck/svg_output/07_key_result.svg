<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Edit highlights are fastest; gen-prob is worst</text><g id="cue_s07_c1_headline_result_about_speed"><title>headline result about speed</title><rect x="64" y="158" width="1152" height="110" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="110" rx="6" fill="#48C78E"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">The headline result is about speed</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">With edit-model highlights, people finished their tasks fastest of the</text><text x="92" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">three conditions.</text><rect x="720" y="170" width="236" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="838.0" y="213.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#48C78E" font-weight="800" text-anchor="middle">8.59 min</text><text x="838.0" y="237.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">edit model (fastest)</text><rect x="970" y="170" width="246" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1093.0" y="213.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#F2C14E" font-weight="800" text-anchor="middle">9.61 min</text><text x="1093.0" y="237.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">gen-prob (slowest)</text></g><g id="cue_s07_c2_people_finished_fastest_when_edit_mo"><title>people finished fastest when edit-model highlights about eight point six</title><rect x="64" y="284" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="284" width="6" height="264" rx="6" fill="#4C9BE8"/><text x="92" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Mean task time by condition</text><text x="92" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Edit-model fastest, generation-probability slowest,</text><text x="92" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">no-highlight in between.</text><rect x="300" y="404" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="404" width="206" height="26" rx="6" fill="#48C78E"/><text x="288" y="424.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">edit model</text><text x="516" y="424.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">8.59</text><rect x="300" y="448" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="448" width="218" height="26" rx="6" fill="#9DB3C8"/><text x="288" y="468.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">no highlight</text><text x="528" y="468.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">in between</text><rect x="300" y="492" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="492" width="230" height="26" rx="6" fill="#F2C14E"/><text x="288" y="512.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">gen-prob</text><text x="540" y="512.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">9.61</text></g><g id="cue_s07_c3_gap_between_two_highlighting_strateg"><title>gap between two highlighting strategies highly significant p-value zero point</title><rect x="656" y="284" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="284" width="6" height="120" rx="6" fill="#34D3C0"/><text x="684" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The gap is highly significant</text><text x="684" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Between the two highlighting strategies, the speed difference is</text><text x="684" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">highly significant.</text><text x="684" y="392" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">p = 0.003</text></g><g id="cue_s07_c4_what_makes_striking_generation_proba"><title>what makes striking generation-probability highlighting actually worst three slower even</title><rect x="656" y="420" width="560" height="128" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="420" width="6" height="128" rx="6" fill="#F2C14E"/><text x="684" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Gen-prob was the worst of the three</text><text x="684" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Generation-probability highlighting was slower even than</text><text x="684" y="501" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">showing no highlights at all - highlighting the wrong tokens</text><text x="684" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">can hurt, not help.</text><text x="684" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.8" fill="#F2C14E" font-weight="800" text-anchor="start">wrong tokens highlighted  -&gt;  slower</text></g></svg>