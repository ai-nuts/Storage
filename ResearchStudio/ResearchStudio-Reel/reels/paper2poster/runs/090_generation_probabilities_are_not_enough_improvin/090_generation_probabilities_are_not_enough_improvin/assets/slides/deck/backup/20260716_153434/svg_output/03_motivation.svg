<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Highlight uncertain tokens - but which signal?</text><g id="cue_s03_c1_one_natural_idea_highlight_uncertain"><title>one natural idea highlight uncertain tokens much like spell-checker underlines</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Highlight like a spell-checker</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">One natural idea: highlight uncertain tokens, much as a</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">spell-checker underlines suspect words, drawing the eye to</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">spots that most need review.</text><rect x="92" y="300" width="300" height="34" rx="8" fill="#0C1E2E" stroke="#26455F" stroke-width="1.5"/><line x1="118" y1="307" x2="118" y2="327" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="105.0" y="321.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">1</text><rect x="127" y="316.0" width="24" height="6" rx="2" fill="#3E5A74"/><rect x="155" y="313.0" width="44" height="12" rx="3" fill="#F2C14E" opacity="0.3"/><rect x="157" y="316.0" width="40" height="6" rx="2" fill="#F2C14E"/><rect x="203" y="316.0" width="16" height="6" rx="2" fill="#3E5A74"/><rect x="225" y="316.0" width="24" height="6" rx="2" fill="#3E5A74"/><polyline points="126.0,338.0 130.0,340.0 134.0,338.0 138.0,340.0 142.0,338.0 146.0,340.0 150.0,338.0 154.0,340.0 158.0,338.0 162.0,340.0 166.0,338.0 170.0,340.0 174.0,338.0 178.0,340.0 182.0,338.0 186.0,340.0 190.0,338.0 194.0,340.0 198.0,338.0 202.0,340.0 206.0,338.0 210.0,340.0 214.0,338.0 218.0,340.0 222.0,338.0 226.0,340.0 230.0,338.0 234.0,340.0 238.0,338.0 242.0,340.0" fill="none" stroke="#F2C14E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><g id="cue_s03_c2_obvious_signal_own_generation_probab"><title>obvious signal own generation probability tokens least sure about get</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#F2C14E"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">The obvious signal: generation probability</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Use the model's own generation probability - highlight</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">the tokens the model was least sure about.</text><rect x="92" y="500" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344.0" y="523.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">low generation probability  -&gt;  highlight token</text></g><g id="cue_s03_c3_existing_strategy_even_ships_openai"><title>existing strategy even ships openai playground</title><rect x="648" y="158" width="568" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="150" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Already a shipping strategy</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">This is an existing strategy - it even ships in OpenAI's</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Playground, colouring tokens by confidence.</text><rect x="676" y="282" width="512" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="297.0" r="5" fill="#34D3C0"/><text x="710" y="303.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">OpenAI Playground  ·  colour tokens by confidence</text></g><g id="cue_s03_c4_but_nobody_had_really_tested"><title>but nobody had really tested whether low probability actually lines</title><rect x="648" y="324" width="568" height="226" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="648" y="324" width="6" height="226" rx="6" fill="#48C78E"/><text x="676" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">But is low probability the right target?</text><text x="676" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Nobody had tested whether low probability actually lines</text><text x="676" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">up with where humans need to make edits. That gap is</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">exactly what this paper probes.</text><rect x="676" y="482" width="512" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="509.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">low probability  =?=  where humans edit</text></g></svg>