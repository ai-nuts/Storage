<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">What you highlight matters more than whether</text><g id="cue_s10_c1_lesson_simple_but_pointed"><title>lesson simple but pointed</title><rect x="64" y="176" width="570" height="148" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="148" rx="6" fill="#4C9BE8"/><circle cx="104" cy="216" r="10" fill="#4C9BE8"/><text x="128" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">A simple but pointed lesson</text><text x="92" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The lesson from the study is simple, but pointed - and it</text><text x="92" y="279" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">challenges an intuitive default.</text></g><g id="cue_s10_c2_what_you_highlight_matters_more"><title>what you highlight matters more whether you highlight right thing</title><rect x="646" y="176" width="570" height="148" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="646" y="176" width="6" height="148" rx="6" fill="#48C78E"/><circle cx="686" cy="216" r="10" fill="#48C78E"/><text x="710" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Highlight where people edit</text><text x="674" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">What you highlight matters more than whether you highlight.</text><text x="674" y="279" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Highlight where people are likely to edit, not where the</text><text x="674" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">model happened to be unsure.</text></g><g id="cue_s10_c3_generation_probabilities_alone_not_e"><title>generation probabilities alone not enough</title><rect x="64" y="340" width="570" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="340" width="6" height="210" rx="6" fill="#F2C14E"/><circle cx="104" cy="380" r="10" fill="#F2C14E"/><text x="128" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Generation probabilities are not enough</text><text x="92" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The model's own confidence, on its own, does not point</text><text x="92" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">programmers to the tokens that actually need their</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">attention.</text></g><g id="cue_s10_c4_encouragingly_tools_like_copilot_alr"><title>encouragingly tools like copilot already log edits people make suggestions</title><rect x="646" y="340" width="570" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="646" y="340" width="6" height="210" rx="6" fill="#34D3C0"/><circle cx="686" cy="380" r="10" fill="#34D3C0"/><text x="710" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">A signal products already collect</text><text x="674" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Tools like Copilot already log the edits people make to AI</text><text x="674" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">suggestions - that signal could train an open-world edit</text><text x="674" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">model and carry these speed, precision, and preference gains</text><text x="674" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">into everyday coding.</text></g><line x1="64" y1="576" x2="1216" y2="576" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><circle cx="84" cy="600" r="7" fill="#48C78E"/><text x="104" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Highlight human intervention, not model uncertainty</text><text x="1216" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Generation Probabilities are Not Enough · NeurIPS 2022</text></svg>