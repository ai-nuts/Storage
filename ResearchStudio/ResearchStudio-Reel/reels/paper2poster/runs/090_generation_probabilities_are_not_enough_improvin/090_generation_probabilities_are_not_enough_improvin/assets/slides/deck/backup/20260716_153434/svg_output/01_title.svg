<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="1.5">NeurIPS 2022 · HCAI Workshop</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">Stanford University · Microsoft Research</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">Generation Probabilities are Not Enough</text><text x="64" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#4C9BE8" font-weight="800" text-anchor="start">Improving Error Highlighting for AI Code Suggestions</text><rect x="966" y="104" width="250" height="92" rx="8" fill="#0C1E2E" stroke="#26455F" stroke-width="1.5"/><line x1="992" y1="111" x2="992" y2="189" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="979.0" y="128.66666666666666" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">1</text><rect x="1001" y="123.66666666666666" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="1026" y="120.66666666666666" width="32" height="12" rx="3" fill="#48C78E" opacity="0.3"/><rect x="1028" y="123.66666666666666" width="28" height="6" rx="2" fill="#48C78E"/><rect x="1062" y="123.66666666666666" width="14" height="6" rx="2" fill="#3E5A74"/><text x="979.0" y="154.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">2</text><rect x="1001" y="149.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="1019" y="146.0" width="25" height="12" rx="3" fill="#F2C14E" opacity="0.3"/><rect x="1021" y="149.0" width="21" height="6" rx="2" fill="#F2C14E"/><rect x="1048" y="149.0" width="28" height="6" rx="2" fill="#3E5A74"/><rect x="1082" y="149.0" width="14" height="6" rx="2" fill="#3E5A74"/><text x="979.0" y="179.33333333333331" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">3</text><rect x="1001" y="174.33333333333331" width="28" height="6" rx="2" fill="#3E5A74"/><rect x="1035" y="174.33333333333331" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="1053" y="171.33333333333331" width="25" height="12" rx="3" fill="#48C78E" opacity="0.3"/><rect x="1055" y="174.33333333333331" width="21" height="6" rx="2" fill="#48C78E"/><text x="966" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="700" text-anchor="start">which tokens to highlight?</text><text x="64" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Helena Vasconcelos · Gagan Bansal · Adam Fourney · Q. Vera Liao · Jennifer Wortman Vaughan</text><g id="cue_s01_c1_code_assistants_like_copilot_suggest"><title>code assistants like copilot suggest completions but they make mistakes</title><rect x="64" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="290" width="276" height="6" rx="6" fill="#4C9BE8"/><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Assistants make mistakes</text><text x="88" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">Tools like Copilot suggest code</text><text x="88" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">completions, but they err, and</text><text x="88" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">programmers have to catch those</text><text x="88" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">mistakes before they become bugs.</text></g><g id="cue_s01_c2_one_popular_idea_highlight_tokens"><title>one popular idea highlight tokens least confident about person knows</title><rect x="356" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="290" width="276" height="6" rx="6" fill="#F2C14E"/><text x="380" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Highlight low-confidence</text><text x="380" y="363" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">tokens?</text><text x="380" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">The popular idea is to highlight</text><text x="380" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">the tokens the model was least</text><text x="380" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">confident about. But are generation</text><text x="380" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">probabilities the right thing to</text><text x="380" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">highlight?</text></g><g id="cue_s01_c3_through_preregistered_study_thirty_p"><title>through preregistered study thirty programmers authors compare highlighting low-probability tokens</title><rect x="648" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="290" width="276" height="6" rx="6" fill="#34D3C0"/><text x="672" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">30 programmers,</text><text x="672" y="363" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">preregistered</text><text x="672" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">A preregistered study compares</text><text x="672" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">highlighting low-probability tokens</text><text x="672" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">against a new edit model that</text><text x="672" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">predicts which tokens a person will</text><text x="672" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">change.</text></g><g id="cue_s01_c4_edit_wins_speed_precision_edits"><title>edit wins speed precision edits user preference showing generation probabilities</title><rect x="940" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="290" width="276" height="6" rx="6" fill="#48C78E"/><text x="964" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">The edit model wins</text><text x="964" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">The edit model is faster, edits are</text><text x="964" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">more precise, and users prefer it -</text><text x="964" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">showing generation probabilities</text><text x="964" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">alone are not enough.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2302.07248</text><text x="260" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">osf.io/tymah</text><text x="1216" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">What you highlight matters more than whether you highlight.</text></svg>