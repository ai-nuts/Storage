<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Catching AI's mistakes, one token at a time</text><g id="cue_s02_c1_code_assistants_now_everywhere_but"><title>code assistants now everywhere but they imperfect wrong suggestion quietly</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#F2685C"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#F2685C" font-weight="800" text-anchor="start">A wrong suggestion plants a bug</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">AI code assistants are now everywhere, but</text><text x="92" y="261" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">they are imperfect. A wrong suggestion can</text><text x="92" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">quietly plant a bug or a security hole.</text><rect x="92" y="346" width="348" height="120" rx="8" fill="#0C1E2E" stroke="#26455F" stroke-width="1.5"/><line x1="118" y1="353" x2="118" y2="459" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="105.0" y="371.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">1</text><rect x="127" y="366.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="154" y="366.0" width="28" height="6" rx="2" fill="#3E5A74"/><rect x="188" y="366.0" width="14" height="6" rx="2" fill="#3E5A74"/><text x="105.0" y="397.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">2</text><rect x="127" y="392.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="145" y="389.0" width="39" height="12" rx="3" fill="#F2685C" opacity="0.3"/><rect x="147" y="392.0" width="35" height="6" rx="2" fill="#F2685C"/><rect x="188" y="392.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="215" y="392.0" width="14" height="6" rx="2" fill="#3E5A74"/><text x="105.0" y="423.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">3</text><rect x="127" y="418.0" width="28" height="6" rx="2" fill="#3E5A74"/><rect x="161" y="418.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="181" y="418.0" width="21" height="6" rx="2" fill="#3E5A74"/><text x="105.0" y="449.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">4</text><rect x="127" y="444.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="154" y="444.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="181" y="444.0" width="28" height="6" rx="2" fill="#3E5A74"/><rect x="215" y="444.0" width="14" height="6" rx="2" fill="#3E5A74"/><text x="92" y="494" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.8" fill="#F2685C" font-weight="700" text-anchor="start">one bad token, quietly wrong</text></g><g id="cue_s02_c2_catch_those_mistakes_programmer_firs"><title>catch those mistakes programmer first notice them hard because people</title><rect x="500" y="158" width="716" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="120" rx="6" fill="#F2C14E"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">First you have to notice</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">To catch mistakes, a programmer must first notice them - and that is hard,</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">because people tend to over-trust automation.</text></g><g id="cue_s02_c3_tricky_part_single_code_suggestion"><title>tricky part single code suggestion not one decision but hundreds</title><rect x="500" y="294" width="716" height="164" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="294" width="6" height="164" rx="6" fill="#4C9BE8"/><text x="528" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Not one decision, but hundreds</text><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A single code suggestion is not one decision but hundreds of tiny ones -</text><text x="528" y="383" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">one per token.</text><rect x="528" y="402" width="660" height="44" rx="8" fill="#0C1E2E" stroke="#26455F" stroke-width="1.5"/><line x1="554" y1="409" x2="554" y2="439" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="541.0" y="428.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#6E869C" font-weight="700" text-anchor="middle">1</text><rect x="563" y="423.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="583" y="423.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="610" y="423.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="630" y="423.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="657" y="423.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="677" y="423.0" width="28" height="6" rx="2" fill="#3E5A74"/><rect x="711" y="423.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="731" y="423.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="758" y="423.0" width="14" height="6" rx="2" fill="#3E5A74"/><rect x="778" y="423.0" width="21" height="6" rx="2" fill="#3E5A74"/><rect x="805" y="423.0" width="14" height="6" rx="2" fill="#3E5A74"/></g><g id="cue_s02_c4_earlier_research_communicating_uncer"><title>earlier research communicating uncertainty built single-shot decisions like diagnosis does</title><rect x="500" y="474" width="716" height="76" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="500" y="474" width="6" height="76" rx="6" fill="#F2C14E"/><text x="528" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Old uncertainty research does not carry over</text><text x="528" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Built for single-shot decisions like a diagnosis, not this token-by-token world.</text></g></svg>