<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">From model uncertainty to human intervention</text><g id="cue_s04_c1_authors_ran_preregistered_mixed_meth"><title>authors ran preregistered mixed-methods study thirty programmers comparing three ways</title><rect x="64" y="176" width="372" height="374" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="372" height="6" rx="6" fill="#34D3C0"/><circle cx="116" cy="246" r="28" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="116" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#34D3C0" font-weight="800" text-anchor="middle">S</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">A preregistered 3-way</text><text x="92" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">study</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A preregistered, mixed-methods study</text><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">with 30 programmers compares three</text><text x="92" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">displays of the same AI completions.</text><rect x="92" y="446" width="316" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="461.0" r="5" fill="#9DB3C8"/><text x="126" y="467.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">No highlights</text><rect x="92" y="482" width="316" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="497.0" r="5" fill="#F2C14E"/><text x="126" y="503.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Generation-probability</text><rect x="92" y="518" width="316" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="533.0" r="5" fill="#48C78E"/><text x="126" y="539.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Edit model</text></g><g id="cue_s04_c2_edit_key_idea_instead_asking"><title>edit key idea instead asking how confident predicts which tokens</title><rect x="454" y="176" width="372" height="374" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="454" y="176" width="372" height="6" rx="6" fill="#48C78E"/><circle cx="506" cy="246" r="28" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="506" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#48C78E" font-weight="800" text-anchor="middle">E</text><text x="482" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The edit model: the key</text><text x="482" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">idea</text><text x="482" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of asking how confident the</text><text x="482" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">model was, the edit model predicts which</text><text x="482" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">tokens a human is actually likely to</text><text x="482" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">change.</text></g><g id="cue_s04_c3_reframes_whole_problem_surfacing_unc"><title>reframes whole problem surfacing uncertainty surfacing human intervention authors argue</title><rect x="844" y="176" width="372" height="374" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="844" y="176" width="372" height="6" rx="6" fill="#4C9BE8"/><circle cx="896" cy="246" r="28" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="896" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#4C9BE8" font-weight="800" text-anchor="middle">R</text><text x="872" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Reframing the whole</text><text x="872" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">problem</text><text x="872" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">This shifts the goal from surfacing</text><text x="872" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">model uncertainty to surfacing human</text><text x="872" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">intervention - a recipe that could scale</text><text x="872" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">from edit telemetry products already</text><text x="872" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">collect.</text></g><text x="64" y="596" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="700" text-anchor="start">Same completions, three displays - and a new signal: predicted human edits, not model confidence.</text></svg>