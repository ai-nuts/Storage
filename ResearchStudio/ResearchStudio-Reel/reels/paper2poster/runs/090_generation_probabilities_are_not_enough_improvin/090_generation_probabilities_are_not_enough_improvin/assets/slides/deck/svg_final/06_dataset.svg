<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">STUDY DESIGN</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">30 Python programmers, LeetCode tasks</text><g id="cue_s06_c1_thirty_participants_took_part_all"><title>thirty participants took part all experienced python programmers large technology</title><rect x="64" y="158" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="96" rx="6" fill="#34D3C0"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Experienced Python programmers at a large US tech company</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Each participant was paid fifty dollars for roughly an hour of their time.</text><rect x="980" y="168" width="110" height="76" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1035.0" y="207.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.840000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">30</text><text x="1035.0" y="228.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">participants</text><rect x="1100" y="168" width="110" height="76" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1155.0" y="207.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.840000000000003" fill="#4C9BE8" font-weight="800" text-anchor="middle">$50</text><text x="1155.0" y="228.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">~1 hour</text></g><g id="cue_s06_c2_every_person_solved_three_coding"><title>every person solved three coding problems drawn leetcode easy tier</title><rect x="64" y="270" width="560" height="152" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="270" width="6" height="152" rx="6" fill="#4C9BE8"/><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Three LeetCode easy problems</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A ten-minute cap per task; participants could run their</text><text x="92" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">code and a set of provided unit tests to debug.</text><rect x="92" y="380" width="158" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="396.0" r="5" fill="#4C9BE8"/><text x="126" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">3 easy tasks</text><rect x="266" y="380" width="150" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="284" cy="396.0" r="5" fill="#9DB3C8"/><text x="300" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">10-min cap</text><rect x="432" y="380" width="158" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="450" cy="396.0" r="5" fill="#34D3C0"/><text x="466" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">run unit tests</text></g><g id="cue_s06_c3_task_order_which_tool_went"><title>task order which tool went which task randomized keep comparison</title><rect x="656" y="270" width="560" height="152" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="270" width="6" height="152" rx="6" fill="#48C78E"/><text x="684" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Randomized for a fair comparison</text><text x="684" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Both task order and which tool went with which task were</text><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">randomized across participants.</text><rect x="684" y="388" width="504" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="402.0" r="5" fill="#48C78E"/><text x="718" y="408.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">task order  +  tool-task pairing  randomized</text></g><g id="cue_s06_c4_edit_itself_trained_earlier_separate"><title>edit itself trained earlier separate group nine coders</title><rect x="64" y="438" width="1152" height="112" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="438" width="6" height="112" rx="6" fill="#F2C14E"/><text x="92" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">The edit model was trained earlier, separately</text><text x="92" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">It learned from a separate group of nine coders who had previously edited Codex output</text><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">until their tasks passed the tests.</text><rect x="980" y="452" width="230" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1095.0" y="495.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#F2C14E" font-weight="800" text-anchor="middle">9 coders</text><text x="1095.0" y="519.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">separate group</text></g></svg>