<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One demo, then the world moves</text><g id="cue_s02_c1_one_shot_imitation_learning_asks_age"><title>one-shot imitation learning asks agent carry out task after seeing</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#3E9BFF"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Act from a single demo</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">One-shot imitation learning asks an agent</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">to carry out a task after seeing just a</text><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">single demonstration. It works well when</text><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">deployment looks like the demonstration.</text><rect x="92" y="360" width="344" height="138" rx="10" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="112" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">the hidden assumption</text><rect x="112" y="406" width="304" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="264.0" y="432.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#3E9BFF" font-weight="800" text-anchor="middle">deploy  ==  demonstration</text><text x="112" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">but the real world is dynamic</text></g><g id="cue_s02_c2_after_demonstration_provided_unexpec"><title>after demonstration provided unexpected obstacle appear grasped object slip pushing</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#33D6C0"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Runtime change breaks blind replay</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">After the demonstration is provided, an unexpected</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">obstacle can appear, or a grasped object can slip,</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">pushing the agent into states the demo never</text><text x="528" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">covered.</text><rect x="1002" y="168" width="167" height="129" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><line x1="1029.8333333333333" y1="176" x2="1029.8333333333333" y2="289" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1057.6666666666667" y1="176" x2="1057.6666666666667" y2="289" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1085.5" y1="176" x2="1085.5" y2="289" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1113.3333333333333" y1="176" x2="1113.3333333333333" y2="289" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1141.1666666666667" y1="176" x2="1141.1666666666667" y2="289" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1010" y1="200.25" x2="1161" y2="200.25" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1010" y1="232.5" x2="1161" y2="232.5" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1010" y1="264.75" x2="1161" y2="264.75" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><polyline points="1019,276 1052.1,247.98000000000002 1075.48,224.76 1112.22,206.7 1151,189" fill="none" stroke="#33D6C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="1065" y="223" width="21" height="14" rx="3" fill="#F2685C"/><polyline points="1052.1,247.98000000000002 1069.48,240.76 1053.48,226.76 1061.48,204.76 1093.48,204.76 1097.48,222.76 1112.22,206.7" fill="none" stroke="#3E9BFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1019" cy="276" r="6" fill="#3E9BFF"/><rect x="1145" y="183" width="12" height="12" rx="2" fill="#46C98B"/><text x="1021" y="292" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="700" text-anchor="middle">start</text><text x="1151" y="177" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#46C98B" font-weight="800" text-anchor="middle">goal</text><text x="1085.5" y="297" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="600" text-anchor="middle"></text></g><g id="cue_s02_c3_traditional_one_shot_imitation_metho"><title>traditional one-shot imitation methods excel stationary settings yet their ability</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F4C24C"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">Prior methods excel only when stationary</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Traditional one-shot imitation methods shine in stationary settings, yet their ability</text><text x="528" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">to handle these unforeseen runtime changes is limited and rarely studied.</text></g><g id="cue_s02_c4_focuses_squarely_gap_making_one_shot"><title>focuses squarely gap making one-shot imitation robust when environment changes</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#46C98B"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">The gap: robust OSIL at runtime</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">This paper focuses squarely on that gap - making one-shot imitation robust when the</text><text x="528" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">environment changes unexpectedly at deployment time.</text></g></svg>