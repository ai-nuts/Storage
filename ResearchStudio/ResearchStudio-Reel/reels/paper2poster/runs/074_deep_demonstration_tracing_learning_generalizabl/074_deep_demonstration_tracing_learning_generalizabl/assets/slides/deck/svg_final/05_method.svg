<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Trace the demo, train with meta-RL</text><g id="cue_s05_c1_ddt_two_core_pieces_first"><title>ddt two core pieces first demonstration transformer which turns human</title><rect x="64" y="158" width="1152" height="182" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="182" rx="6" fill="#3E9BFF"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Demonstration transformer: state is the query</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">The first core piece turns the human three-stage process</text><text x="92" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">into a network: the agent's current state is the query,</text><text x="92" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">and the demonstration's states and actions are the keys</text><text x="92" y="277" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">and values.</text><rect x="92" y="286" width="536" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="360.0" y="312.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#EAF2FB" font-weight="800" text-anchor="middle">q = s_t   ;   K,V = demo   ;   a = trace(attn(q,K)*V, s_t)</text><rect x="652" y="196" width="564" height="128" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><circle cx="686" cy="260.0" r="15" fill="#3E9BFF"/><text x="686" y="265.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#0B1A2B" font-weight="800" text-anchor="middle">q</text><text x="686" y="236.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">query</text><text x="686" y="290.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">state s_t</text><line x1="702" y1="260.0" x2="815.2" y2="228.0" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><text x="805.2" y="233.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="800" text-anchor="middle">·</text><rect x="821.2" y="218.0" width="60" height="20" rx="5" fill="#173453" stroke="#33D6C0" stroke-width="1.3"/><text x="851.2" y="232.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#33D6C0" font-weight="800" text-anchor="middle">se_0</text><line x1="702" y1="260.0" x2="815.2" y2="270.0" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><text x="805.2" y="275.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="800" text-anchor="middle">·</text><rect x="821.2" y="260.0" width="60" height="20" rx="5" fill="#173453" stroke="#F4C24C" stroke-width="1.3"/><text x="851.2" y="274.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#F4C24C" font-weight="800" text-anchor="middle">se_i</text><line x1="702" y1="260.0" x2="815.2" y2="312.0" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><text x="805.2" y="317.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="800" text-anchor="middle">·</text><rect x="821.2" y="302.0" width="60" height="20" rx="5" fill="#173453" stroke="#F2685C" stroke-width="1.3"/><text x="851.2" y="316.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#F2685C" font-weight="800" text-anchor="middle">se_t</text><text x="851.2" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="700" text-anchor="middle">demo keys/values</text><text x="1010.66" y="209" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#3E9BFF" font-weight="800" text-anchor="middle">attn w (identify)</text><line x1="881.2" y1="228.0" x2="966.66" y2="228.0" stroke="#2A4D6E" stroke-width="1.0" stroke-linecap="round"/><rect x="970.66" y="220.0" width="26" height="16" rx="4" fill="#33D6C0"/><line x1="881.2" y1="270.0" x2="966.66" y2="269.0" stroke="#2A4D6E" stroke-width="1.0" stroke-linecap="round"/><rect x="970.66" y="261.0" width="61" height="16" rx="4" fill="#F4C24C"/><line x1="881.2" y1="312.0" x2="966.66" y2="310.0" stroke="#2A4D6E" stroke-width="1.0" stroke-linecap="round"/><rect x="970.66" y="302.0" width="28" height="16" rx="4" fill="#F2685C"/><line x1="1078.6599999999999" y1="260.0" x2="1150" y2="260.0" stroke="#2A4D6E" stroke-width="1.4" stroke-linecap="round"/><polygon points="1150,260.0 1136.8569220667673,263.3559787702294 1136.8569220667673,256.6440212297706" fill="#2A4D6E"/><text x="1124.33" y="252.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#46C98B" font-weight="800" text-anchor="middle">trace</text><circle cx="1170" cy="260.0" r="20" fill="none" stroke="#46C98B" stroke-width="2.4"/><text x="1170" y="266.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#46C98B" font-weight="800" text-anchor="middle">a</text><text x="1170" y="232.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#46C98B" font-weight="800" text-anchor="middle">action</text></g><g id="cue_s05_c2_attention_weighting_module_identifie"><title>attention-weighting module identifies which demonstrated states follow point-wise multiplication analyzes</title><rect x="64" y="356" width="560" height="194" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="356" width="6" height="194" rx="6" fill="#33D6C0"/><text x="92" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Identify, analyze, then trace</text><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">An attention-weighting module identifies which demonstrated</text><text x="92" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">states to follow, a point-wise product analyzes how the expert</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">behaved, and the result combines with the current state to give</text><text x="92" y="481" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">the action.</text><rect x="92" y="504" width="504" height="42" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><circle cx="112.0" cy="525.0" r="9" fill="none" stroke="#3E9BFF" stroke-width="2"/><text x="112.0" y="529.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#3E9BFF" font-weight="800" text-anchor="middle">1</text><text x="128.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="700" text-anchor="start">Identify</text><text x="254.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><circle cx="280.0" cy="525.0" r="9" fill="none" stroke="#F4C24C" stroke-width="2"/><text x="280.0" y="529.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F4C24C" font-weight="800" text-anchor="middle">2</text><text x="296.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="700" text-anchor="start">Analyze</text><text x="422.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><circle cx="448.0" cy="525.0" r="9" fill="none" stroke="#46C98B" stroke-width="2"/><text x="448.0" y="529.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#46C98B" font-weight="800" text-anchor="middle">3</text><text x="464.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="700" text-anchor="start">Trace</text></g><g id="cue_s05_c3_second_piece_rather_behavior_cloning"><title>second piece rather behavior cloning ddt frames one-shot imitation context-based</title><rect x="656" y="356" width="560" height="90" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="356" width="6" height="90" rx="6" fill="#F4C24C"/><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Training: meta-RL, not cloning</text><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Rather than behavior cloning, DDT frames one-shot imitation as context-based</text><text x="684" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">meta-RL, so the agent explores and learns to act in states the demo never visited.</text></g><g id="cue_s05_c4_carefully_designed_stationary_osil_r"><title>carefully designed stationary osil reward rewards following demonstration while large-weighted</title><rect x="656" y="462" width="560" height="88" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="656" y="462" width="6" height="88" rx="6" fill="#46C98B"/><text x="684" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#46C98B" font-weight="800" text-anchor="start">OSIL reward + task reward, via SAC</text><text x="684" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A stationary OSIL reward rewards following the demo while a large task reward</text><text x="684" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">keeps the focus on finishing; all optimized by Soft Actor-Critic.</text></g></svg>