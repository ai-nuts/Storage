s-serif" font-size="9" fill="#46C98B" font-weight="800" text-anchor="middle">goal</text><text x="140.5" y="641" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="600" text-anchor="middle"></text><text x="1216" y="614" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">DDT  ·  Deep Demonstration Tracing  ·  ICML 2024</text></svg>