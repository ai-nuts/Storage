<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Trace it, don't replay it</text><g id="cue_s10_c1_takeaway_simple"><title>takeaway simple</title><rect x="64" y="166" width="1152" height="58" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="166" width="6" height="58" rx="6" fill="#3E9BFF"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">The takeaway is simple: an imitator should trace a demonstration, not blindly replay it.</text></g><g id="cue_s10_c2_instead_blindly_replaying_demonstrat"><title>instead blindly replaying demonstration agent should learn trace figuring out</title><rect x="64" y="240" width="368" height="302" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="240" width="368" height="6" rx="6" fill="#3E9BFF"/><circle cx="98" cy="290" r="11" fill="#3E9BFF"/><text x="92" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Trace, don't replay</text><text x="92" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of blindly replaying a</text><text x="92" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demo, an agent should identify</text><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">which demonstrated states matter</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">right now, read what the expert</text><text x="92" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">did, and steer back onto the path</text><text x="92" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">after a detour.</text></g><g id="cue_s10_c3_deep_demonstration_tracing_operation"><title>deep demonstration tracing operationalizes demonstration transformer trained meta-reinforcement learning result</title><rect x="456" y="240" width="368" height="302" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="240" width="368" height="6" rx="6" fill="#33D6C0"/><circle cx="490" cy="290" r="11" fill="#33D6C0"/><text x="484" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Transformer + meta-RL</text><text x="484" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">DDT operationalizes tracing with a</text><text x="484" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demonstration transformer trained</text><text x="484" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">by meta-RL, giving one-shot</text><text x="484" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">imitation that stays robust when</text><text x="484" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the environment changes - where</text><text x="484" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">earlier methods fail.</text></g><g id="cue_s10_c4_its_clean_scaling_behavior_even"><title>its clean scaling behavior even suggests could become building block</title><rect x="848" y="240" width="368" height="302" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="240" width="368" height="6" rx="6" fill="#46C98B"/><circle cx="882" cy="290" r="11" fill="#46C98B"/><text x="876" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A generalist backbone</text><text x="876" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Its clean log-linear scaling</text><text x="876" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">behavior even suggests DDT could</text><text x="876" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">become a building block for</text><text x="876" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">larger, more general</text><text x="876" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">decision-making agents.</text></g>