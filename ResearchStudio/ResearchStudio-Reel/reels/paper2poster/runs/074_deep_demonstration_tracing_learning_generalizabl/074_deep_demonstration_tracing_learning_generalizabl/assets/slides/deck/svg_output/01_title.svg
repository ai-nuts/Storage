<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="800" text-anchor="start" letter-spacing="2">ICML 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">One-Shot Imitation  ·  Runtime Robustness  ·  Meta-RL</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">DDT</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">Deep Demonstration Tracing</text><text x="64" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">Generalizable One-Shot Imitation under Runtime Change</text><rect x="1044" y="120" width="232" height="180" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><line x1="1082.6666666666667" y1="128" x2="1082.6666666666667" y2="292" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1121.3333333333333" y1="128" x2="1121.3333333333333" y2="292" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1160.0" y1="128" x2="1160.0" y2="292" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1198.6666666666667" y1="128" x2="1198.6666666666667" y2="292" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1237.3333333333333" y1="128" x2="1237.3333333333333" y2="292" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1052" y1="165.0" x2="1268" y2="165.0" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1052" y1="210.0" x2="1268" y2="210.0" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><line x1="1052" y1="255.0" x2="1268" y2="255.0" stroke="#2A4D6E" stroke-width="0.5" stroke-linecap="round"/><polyline points="1068,270 1113.6,231.6 1146.08,199.2 1197.12,174.0 1250,150" fill="none" stroke="#33D6C0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="1132" y="197" width="30" height="20" rx="3" fill="#F2685C"/><polyline points="1113.6,231.6 1140.08,215.2 1124.08,201.2 1132.08,179.2 1164.08,179.2 1168.08,197.2 1197.12,174.0" fill="none" stroke="#3E9BFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1068" cy="270" r="6" fill="#3E9BFF"/><rect x="1244" y="144" width="12" height="12" rx="2" fill="#46C98B"/><text x="1070" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="700" text-anchor="middle">start</text><text x="1250" y="138" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#46C98B" font-weight="800" text-anchor="middle">goal</text><text x="1160.0" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="600" text-anchor="middle"></text><text x="64" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Xiong-Hui Chen, Junyin Ye, Yang Yu, Zongzhang Zhang, et al.</text><text x="64" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">Nanjing University   ·   Polixir Technologies   ·   NUDT</text><g id="cue_s01_c1_presented_icml_2024_tackles_one_shot"><title>presented icml 2024 tackles one-shot imitation learning when world changes</title><rect x="64" y="306" width="368" height="224" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="306" width="368" height="6" rx="6" fill="#3E9BFF"/><circle cx="92" cy="350" r="7" fill="#3E9BFF"/><text x="110" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The world changes after</text><text x="110" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">the demo</text><text x="90" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">One-shot imitation learning must act from</text><text x="90" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">a single demonstration, but the real world</text><text x="90" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">is dynamic: after the demo is given, the</text><text x="90" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">environment can change at runtime.</text></g><g id="cue_s01_c2_authors_introduce_deep_demonstration"><title>authors introduce deep demonstration tracing ddt method lets imitator agent</title><rect x="456" y="306" width="368" height="224" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="306" width="368" height="6" rx="6" fill="#33D6C0"/><circle cx="484" cy="350" r="7" fill="#33D6C0"/><text x="502" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Trace, do not replay</text><text x="482" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Deep Demonstration Tracing, DDT, lets an</text><text x="482" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">imitator adaptively trace the right states</text><text x="482" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">in a single demonstration while recovering</text><text x="482" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">from unforeseen obstacles.</text></g><g id="cue_s01_c3_ddt_combines_purpose_built_demonstra"><title>ddt combines purpose-built demonstration transformer meta-reinforcement-learning scheme outperforms prior one-shot</title><rect x="848" y="306" width="368" height="224" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="306" width="368" height="6" rx="6" fill="#46C98B"/><circle cx="876" cy="350" r="7" fill="#46C98B"/><text x="894" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Transformer + meta-RL</text><text x="874" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A purpose-built demonstration transformer</text><text x="874" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">trained by meta-reinforcement learning</text><text x="874" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">beats prior one-shot imitation on a new</text><text x="874" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">maze benchmark and robotics tasks.</text></g><line x1="64" y1="556" x2="1216" y2="556" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="700" text-anchor="start">arXiv:2408.05285</text><text x="320" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/xionghuichen/Deep-Demonstration-Tracing</text><text x="1216" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Robust one-shot imitation from a single demonstration.</text></svg>