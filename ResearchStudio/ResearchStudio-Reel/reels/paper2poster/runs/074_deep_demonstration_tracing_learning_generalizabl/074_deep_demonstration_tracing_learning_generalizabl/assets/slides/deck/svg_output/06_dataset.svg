 x="1110.5" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="600" text-anchor="middle"></text></g><g id="cue_s06_c2_point_agent_must_reach_target"><title>point agent must reach target maze never seen globally relying</title><rect x="64" y="324" width="560" height="140" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="324" width="6" height="140" rx="6" fill="#33D6C0"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33D6C0" font-weight="800" text-anchor="start">Point agent, local ray views</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">A point agent must reach a target in a maze</text><text x="92" y="407" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">it has never seen globally, relying only on</text><text x="92" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">short local views computed from eight rays.</text><line x1="536" y1="394" x2="582.0" y2="394.0" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="582.0" cy="394.0" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="568.5269119345812" y2="426.52691193458116" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="568.5269119345812" cy="426.52691193458116" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="536.0" y2="440.0" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="536.0" cy="440.0" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="503.47308806541884" y2="426.52691193458116" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="503.47308806541884" cy="426.52691193458116" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="490.0" y2="394.0" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="490.0" cy="394.0" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="503.4730880654188" y2="361.47308806541884" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="503.4730880654188" cy="361.47308806541884" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="536.0" y2="348.0" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="536.0" cy="348.0" r="2.4" fill="#F4C24C"/><line x1="536" y1="394" x2="568.5269119345812" y2="361.4730880654188" stroke="#F4C24C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="568.5269119345812" cy="361.4730880654188" r="2.4" fill="#F4C24C"/><circle cx="536" cy="394" r="7" fill="#3E9BFF"/><text x="536" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#9DB3C8" font-weight="700" text-anchor="middle">8 rays</text></g><g id="cue_s06_c3_crucially_rectangular_obstacles_rand"><title>crucially rectangular obstacles randomly placed path often did not exist</title><rect x="656" y="324" width="560" height="140" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="324" width="6" height="140" rx="6" fill="#F4C24C"/><text x="684" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Random obstacles, 8 variants</text><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">Rectangular obstacles are randomly dropped on the path and</text><text x="684" y="407" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">often absent from the demo, so blind replay fails. Eight</text><text x="684" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">variants vary single vs many maps, obstacles, and coordinates.</text></g><g id="cue_s06_c4_beyond_vpam_ddt_also_applied"><title>beyond vpam ddt also applied robotics benchmarks including meta-world added</title><rect x="64" y="480" width="1152" height="70" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="480" width="6" height="70" rx="6" fill="#46C98B"/><text x="92" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Beyond VPAM: robotics</text><rect x="360.0" y="486" width="203.5" height="60" rx="10" fill="#173453" stroke="#3E9BFF" stroke-width="1.5"/><rect x="360.0" y="486" width="203.5" height="5" rx="3" fill="#3E9BFF"/><text x="461.75" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Meta-World</text><text x="461.75" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">+ disturbance</text><rect x="577.5" y="486" width="203.5" height="60" rx="10" fill="#173453" stroke="#33D6C0" stroke-width="1.5"/><rect x="577.5" y="486" width="203.5" height="5" rx="3" fill="#33D6C0"/><text x="679.25" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Reacher</text><text x="679.25" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">Gymnasium</text><rect x="795.0" y="486" width="203.5" height="60" rx="10" fill="#173453" stroke="#F4C24C" stroke-width="1.5"/><rect x="795.0" y="486" width="203.5" height="5" rx="3" fill="#F4C24C"/><text x="896.75" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Pusher</text><text x="896.75" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">Gymnasium</text><rect x="1012.5" y="486" width="203.5" height="60" rx="10" fill="#173453" stroke="#F2685C" stroke-width="1.5"/><rect x="1012.5" y="486" width="203.5" height="5" rx="3" fill="#F2685C"/><text x="1114.25" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">MuJoCo manip.</text><text x="1114.25" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">grasp/stack</text></g></svg>