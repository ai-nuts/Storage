l="#EAF2FB" font-weight="400" text-anchor="start">which mostly clone demonstrated actions and have no</text><text x="676" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">principled way to behave in states the demonstration never</text><text x="676" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">showed.</text><rect x="676" y="312" width="512" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="932.0" y="338.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2685C" font-weight="800" text-anchor="middle">unseen state  =&gt;  no principled action</text></g><g id="cue_s03_c4_authors_distill_human_behavior_three"><title>authors distill human behavior three-stage decision process identify which demonstrated</title><rect x="648" y="378" width="568" height="172" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="648" y="378" width="6" height="172" rx="6" fill="#33D6C0"/><text x="676" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="800" text-anchor="start">Blueprint: identify, analyze, trace</text><rect x="676" y="428" width="512" height="110" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><rect x="690" y="446" width="154.66666666666666" height="76" rx="8" fill="#173453" stroke="#3E9BFF" stroke-width="1.4"/><circle cx="767.3333333333334" cy="470" r="10" fill="none" stroke="#3E9BFF" stroke-width="2.2"/><text x="767.3333333333334" y="475" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#3E9BFF" font-weight="800" text-anchor="middle">1</text><text x="767.3333333333334" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">Identify<