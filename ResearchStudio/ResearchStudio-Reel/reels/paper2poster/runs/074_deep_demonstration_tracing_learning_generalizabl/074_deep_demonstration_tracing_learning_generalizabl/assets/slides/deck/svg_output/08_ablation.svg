<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Both parts are necessary</text><g id="cue_s08_c1_confirm_component_matters_authors_ab"><title>confirm component matters authors ablate two pieces</title><rect x="64" y="158" width="560" height="204" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="204" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#3E9BFF" font-weight="800" text-anchor="start">Two components ablated</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">To confirm each component matters, the</text><text x="92" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">authors ablate two pieces of DDT and</text><text x="92" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">measure the effect on final performance.</text><rect x="340" y="206" width="262" height="140" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><rect x="374.8666666666667" y="252.48000000000002" width="42.93333333333334" height="65.52" rx="3" fill="#46C98B"/><text x="396.3333333333333" y="246.48000000000002" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#46C98B" font-weight="800" text-anchor="middle">0.84</text><text x="396.3333333333333" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">DDT</text><rect x="451.5333333333333" y="275.1" width="42.93333333333334" height="42.900000000000006" rx="3" fill="#F4C24C"/><text x="473.0" y="269.1" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#F4C24C" font-weight="800" text-anchor="middle">0.55</text><text x="473.0" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">std. Trans.</text><rect x="528.2" y="291.48" width="42.93333333333334" height="26.520000000000003" rx="3" fill="#F2685C"/><text x="549.6666666666667" y="285.48" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#F2685C" font-weight="800" text-anchor="middle">0.34</text><text x="549.6666666666667" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">no OSIL</text><text x="549.6666666666667" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">rew.</text><text x="354" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="800" text-anchor="start">asymptotic performance</text></g><g id="cue_s08_c2_first_they_swap_demonstration_transf"><title>first they swap demonstration transformer standard transformer significantly reduces final</title><rect x="64" y="378" width="560" height="172" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#F4C24C"/><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F4C24C" font-weight="800" text-anchor="start">Standard transformer hurts</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Swapping the demonstration transformer for a standard</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">transformer significantly reduces asymptotic performance -</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">the tailored architecture, not attention in general,</text><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">drives DDT.</text></g><g id="cue_s08_c3_second_they_remove_osil_reward"><title>second they remove osil reward train only sparse ending reward</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#F2685C"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Remove OSIL reward: slow</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Training with only the sparse ending reward</text><text x="684" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">sharply slows learning; the OSIL reward</text><text x="684" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">supplies a dense signal to follow the demo</text><text x="684" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">early.</text><rect x="972" y="206" width="232" height="140" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><line x1="1002" y1="324" x2="1190" y2="324" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><line x1="1002" y1="324" x2="1002" y2="224" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><polyline points="1002.0,324.0 1011.4,321.29575279623793 1020.8,318.77432941595225 1030.2,316.4233698388075 1039.6,314.231349658229 1049.0,312.18752358874855 1058.4,310.28187279260226 1067.8,308.50505576737663 1077.2,306.8483625539526 1086.6,305.3036720402759 1096.0,303.8634121516564 1105.4,302.52052273244914 1114.8,301.26842093716317 1124.2,300.1009689613454 1133.6,299.012443954056 1143.0,297.99750996444624 1152.4,297.05119178492157 1161.8,296.1688505626682 1171.2,295.34616105999083 1180.6,294.57909045199295 1190.0,293.86387855766424" fill="none" stroke="#F2685C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><polyline points="1002.0,324.0 1011.4,307.71024515343606 1020.8,294.5060265040949 1030.2,283.80289488659315 1039.6,275.12710501490085 1049.0,268.09464642355937 1058.4,262.3942462789803 1067.8,257.77359172605827 1077.2,254.02816193938926 1086.6,250.9921755599279 1096.0,248.53125282975645 1105.4,246.5364676341295 1114.8,244.9195261804598 1124.2,243.60885891145898 1133.6,242.54645267149812 1143.0,241.68528291056546 1152.4,240.98723226924753 1161.8,240.42140341650583 1171.2,239.962751462558 1180.6,239.59097541430447 1190.0,239.28961960656108" fill="none" stroke="#46C98B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1190" y="232.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#46C98B" font-weight="800" text-anchor="end">full OSIL</text><text x="1190" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F2685C" font-weight="800" text-anchor="end">sparse only</text><text x="1000" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#6E869C" font-weight="600" text-anchor="end">success</text><text x="1190" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#6E869C" font-weight="600" text-anchor="end">steps -&gt;</text></g><g id="cue_s08_c4_together_ablations_show_demonstratio"><title>together ablations show demonstration transformer osil reward play distinct necessary</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#46C98B"/><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Each plays a distinct role</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Together the ablations show the demonstration transformer</text><text x="684" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">and the OSIL reward each play a distinct and necessary</text><text x="684" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">role in DDT's imitation ability.</text></g></svg>