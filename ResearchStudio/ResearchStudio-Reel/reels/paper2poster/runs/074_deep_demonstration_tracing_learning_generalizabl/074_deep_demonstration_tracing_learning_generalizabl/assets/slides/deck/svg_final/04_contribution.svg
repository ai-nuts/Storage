<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A setting, an architecture, a theory</text><g id="cue_s04_c1_makes_three_main_contributions"><title>makes three main contributions</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#9C86F0"/><circle cx="114" cy="246" r="26" fill="none" stroke="#9C86F0" stroke-width="2.5"/><text x="114" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#9C86F0" font-weight="800" text-anchor="middle">≡</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Three</text><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">contributions</text><text x="88" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The paper advances one-shot</text><text x="88" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">imitation on three fronts: a</text><text x="88" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">harder setting, a tracing</text><text x="88" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">architecture, and a meta-RL</text><text x="88" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">formulation with theory.</text></g><g id="cue_s04_c2_first_advances_one_shot_imitation_se"><title>first advances one-shot imitation setting deliberately introducing large difference between</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#3E9BFF"/><circle cx="410" cy="246" r="26" fill="none" stroke="#3E9BFF" stroke-width="2.5"/><text x="410" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#3E9BFF" font-weight="800" text-anchor="middle">1</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Harder OSIL + VPAM</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Deliberately introduces a</text><text x="384" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">large gap between when the</text><text x="384" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demonstration is collected</text><text x="384" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and when the policy is</text><text x="384" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">deployed, backed by a new</text><text x="384" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demonstration-navigation</text><text x="384" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">benchmark.</text></g><g id="cue_s04_c3_second_proposes_demonstration_transf"><title>second proposes demonstration transformer architecture encourages policy trace demonstration following</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#33D6C0"/><circle cx="706" cy="246" r="26" fill="none" stroke="#33D6C0" stroke-width="2.5"/><text x="706" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#33D6C0" font-weight="800" text-anchor="middle">2</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Demonstration</text><text x="680" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">transformer</text><text x="680" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A demonstration transformer</text><text x="680" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">architecture that encourages</text><text x="680" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the policy to trace the</text><text x="680" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demonstration, following the</text><text x="680" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">identify, analyze, and trace</text><text x="680" y="483" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">process.</text></g><g id="cue_s04_c4_third_addresses_one_shot_imitation_c"><title>third addresses one-shot imitation context-based meta-reinforcement-learning problem theoretically analyzes conditions</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#46C98B"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#46C98B" stroke-width="2.5"/><text x="1002" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#46C98B" font-weight="800" text-anchor="middle">3</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Meta-RL + theory</text><text x="976" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Casts one-shot imitation as</text><text x="976" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">context-based</text><text x="976" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">meta-reinforcement learning,</text><text x="976" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and analyzes the conditions</text><text x="976" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">under which an imitator can</text><text x="976" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">succeed from a single</text><text x="976" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">trajectory.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="700" text-anchor="start">One trained imitator that traces a single demonstration and stays robust when the world changes.</text></svg>