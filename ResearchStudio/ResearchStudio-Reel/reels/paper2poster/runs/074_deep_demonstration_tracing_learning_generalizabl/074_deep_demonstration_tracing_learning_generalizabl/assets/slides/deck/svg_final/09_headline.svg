<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Four numbers that capture DDT</text><g id="cue_s09_c1_few_numbers_capture_impact_under"><title>few numbers capture impact under unforeseen obstacles ddt succeeds seventy-three</title><rect x="64" y="166" width="1152" height="120" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="166" width="6" height="120" rx="6" fill="#46C98B"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#46C98B" font-weight="800" text-anchor="start">Under unforeseen obstacles, DDT wins clearly</text><rect x="92" y="214" width="300" height="60" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="242.0" y="245.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20.400000000000002" fill="#46C98B" font-weight="800" text-anchor="middle">73% vs 57%</text><text x="242.0" y="262.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">DDT vs best baseline</text><rect x="410" y="214" width="806" height="60" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="430" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">On the hardest VPAM setting DDT succeeds 73% of the time, against 57% for the strongest</text><text x="430" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">competitor - the gap widens exactly where robustness is tested.</text></g><g id="cue_s09_c2_its_performance_degradation_unforese"><title>its performance degradation unforeseen obstacles just fifteen percent least five</title><rect x="64" y="302" width="368" height="162" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="302" width="6" height="162" rx="6" fill="#3E9BFF"/><text x="92" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#3E9BFF" font-weight="800" text-anchor="start">Degradation just -15%</text><text x="92" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="start">train -&gt; unforeseen obstacles</text><rect x="92" y="366" width="312" height="90" rx="10" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><rect x="144.0" y="405.0" width="72" height="27.0" rx="5" fill="#46C98B"/><text x="180.0" y="397.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#46C98B" font-weight="800" text-anchor="middle">-15%</text><text x="180.0" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">DDT</text><rect x="280.0" y="396.0" width="72" height="36.0" rx="5" fill="#9DB3C8"/><text x="316.0" y="388.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="middle">-20%</text><text x="316.0" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">best base</text></g><g id="cue_s09_c3_disturbed_meta_world_tasks_reaches_s"><title>disturbed meta-world tasks reaches sixty-one percent unseen demonstrations while baselines</title><rect x="456" y="302" width="368" height="162" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="302" width="6" height="162" rx="6" fill="#F4C24C"/><text x="484" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#F4C24C" font-weight="800" text-anchor="start">Meta-World, unseen demos</text><text x="484" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="start">with added disturbance</text><rect x="484" y="366" width="312" height="90" rx="10" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><rect x="536.0" y="396.0" width="72" height="36.0" rx="5" fill="#46C98B"/><text x="572.0" y="388.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#46C98B" font-weight="800" text-anchor="middle">61%</text><text x="572.0" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">DDT</text><rect x="672.0" y="424.91803278688525" width="72" height="7.081967213114754" rx="5" fill="#9DB3C8"/><text x="708.0" y="416.91803278688525" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="middle">12%</text><text x="708.0" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">best base</text></g><g id="cue_s09_c4_when_scaled_ddt_improves_roughly"><title>when scaled ddt improves roughly two-fold more parameters shows clean</title><rect x="848" y="302" width="368" height="162" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="302" width="6" height="162" rx="6" fill="#33D6C0"/><text x="876" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#33D6C0" font-weight="800" text-anchor="start">Scales log-linearly</text><text x="876" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="start">~2x with more parameters</text><rect x="876" y="366" width="312" height="90" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><line x1="910" y1="432" x2="1172" y2="432" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><line x1="910" y1="432" x2="910" y2="384" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><polyline points="910.0,423.36 962.4,416.16 1014.8,408.96 1067.2,401.76 1119.6,394.56 1172.0,387.36" fill="none" stroke="#33D6C0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="910.0" cy="423.36" r="3" fill="#33D6C0"/><circle cx="962.4" cy="416.16" r="3" fill="#33D6C0"/><circle cx="1014.8" cy="408.96" r="3" fill="#33D6C0"/><circle cx="1067.2" cy="401.76" r="3" fill="#33D6C0"/><circle cx="1119.6" cy="394.56" r="3" fill="#33D6C0"/><circle cx="1172.0" cy="387.36" r="3" fill="#33D6C0"/><text x="908" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#6E869C" font-weight="600" text-anchor="end">perf</text><text x="1172" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#6E869C" font-weight="600" text-anchor="end">log(params / data) -&gt;</text></g><rect x="64" y="480" width="1152" height="70" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Across</text><text x="180" y="510" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">VPAM (8 variants)  ·  Meta-World  ·  Reacher / Pusher  ·  MuJoCo manip.</text><text x="1192" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#46C98B" font-weight="800" text-anchor="end">robust where prior methods fail</text><text x="1192" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="end">higher success / lower drop is better</text></svg>