<text x="682.0" y="204.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">The exact binary integer program is only tractable for</text>
<text x="682.0" y="229.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">very small attack budgets, giving a reference upper</text>
<text x="682.0" y="254.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">bound to compare the relaxation against.</text>
