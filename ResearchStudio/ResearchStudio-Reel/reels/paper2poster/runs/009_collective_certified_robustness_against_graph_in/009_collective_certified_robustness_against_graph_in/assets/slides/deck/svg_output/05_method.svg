<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">METHOD</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Node-aware bi-smoothing, then a relaxed LP</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">05 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s05_c1_method_builds_randomized_smoothing_s"><title>method builds randomized smoothing specifically node-aware bi-smoothing which randomly deletes</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Node-aware bi-smoothing</text>
<text x="90.0" y="198.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Randomized smoothing that randomly deletes edges and nodes</text>
<text x="90.0" y="222.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">to blur the attacker&#x27;s influence. Locality: an injected</text>
<text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">node harms a target only if a message-passing path</text>
<text x="90.0" y="270.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">survives.</text>
<circle cx="124.0" cy="336.0" r="12.0" fill="#FF6B6B" stroke="#0B1B2B" stroke-width="2"/>
<text x="124.0" y="366.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="12" font-weight="normal" fill="#FF6B6B" text-anchor="middle">injected</text>
<circle cx="254.0" cy="336.0" r="10.0" fill="#9DB2C4" stroke="#0B1B2B" stroke-width="2"/>
<circle cx="384.0" cy="336.0" r="10.0" fill="#9DB2C4" stroke="#0B1B2B" stroke-width="2"/>
<circle cx="514.0" cy="336.0" r="12.0" fill="#35D0BA" stroke="#0B1B2B" stroke-width="2"/>
<text x="514.0" y="366.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="12" font-weight="normal" fill="#35D0BA" text-anchor="middle">target</text>
<line x1="136.0" y1="336.0" x2="244.0" y2="336.0" stroke="#F5B841" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="264.0" y1="336.0" x2="374.0" y2="336.0" stroke="#F5B841" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="394.0" y1="336.0" x2="502.0" y2="336.0" stroke="#F5B841" stroke-width="2" stroke-dasharray="4 3"/>
<text x="319.0" y="322.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="12" font-weight="normal" fill="#F5B841" text-anchor="middle">surviving message path</text>
</g>
<g id="cue_s05_c2_authors_upper_bound_probability_mess"><title>authors upper-bound probability message interference turn certifying condition worst-case attacker</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<text x="682.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Worst-case attacker as a program</text>
<text x="682.0" y="198.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Upper-bound the message-interference probability into a</text>
<text x="682.0" y="222.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">certifying condition, then model an attacker maximizing</text>
<text x="682.0" y="246.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">non-robust nodes under a budget on injected nodes and</text>
<text x="682.0" y="270.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">edges.</text>
<rect x="682.0" y="312.0" width="250.0" height="44.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#FF6B6B" stroke-width="1.5"/>
<text x="807.0" y="339.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#FF6B6B" text-anchor="middle">integer program (NP-hard)</text>
<text x="952.0" y="340.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="26" font-weight="normal" fill="#F5B841" text-anchor="middle">→</text>
<rect x="972.0" y="312.0" width="218.0" height="44.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#48D597" stroke-width="1.5"/>
<text x="1081.0" y="339.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#48D597" text-anchor="middle">linear program</text>
</g>
<g id="cue_s05_c3_standard_relaxation_needs_many_extra"><title>standard relaxation needs many extra variables while their customized reformulation</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="90.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Collective-LP-2: fewer variables</text>
<text x="90.0" y="476.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">The customized reformulation collapses a quadratic term</text>
<text x="90.0" y="500.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">into a single vector, cutting the extra variables and</text>
<text x="90.0" y="524.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">improving both quality and speed.</text>
<rect x="90.0" y="590.0" width="508.0" height="48.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="106.0" y="620.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" font-weight="bold" fill="#F5B841" text-anchor="start">extra variables:   O(rho^2)  →  O(rho)</text>
</g>
<g id="cue_s05_c4_since_linear_program_larger_feasible"><title>since linear program larger feasible region integer one its answer</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<text x="682.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">A sound lower bound</text>
<text x="682.0" y="480.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">The linear program has a larger feasible region than the</text>
<text x="682.0" y="505.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">integer one, so its optimum is always a valid lower</text>
<text x="682.0" y="530.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">bound on the true certified ratio.</text>
<rect x="682.0" y="596.0" width="300.0" height="26.0" rx="13" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/><text x="832.0" y="614.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#08131F" text-anchor="middle">LP answer  &lt;=  true certified ratio</text>
</g>
</svg>
