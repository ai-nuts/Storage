<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">TAKEAWAY</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Certify the set, not one node at a time</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">10 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s10_c1_lesson_simple_but_powerful"><title>lesson simple but powerful</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<circle cx="104.0" cy="166.0" r="18.0" fill="#35D0BA" stroke="#10263B" stroke-width="0"/>
<text x="104.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">1</text>
<text x="136.0" y="162.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">The lesson</text>
<text x="90.0" y="230.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">Simple but powerful: how you frame the certification</text>
<text x="90.0" y="255.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">question changes everything.</text>
</g>
<g id="cue_s10_c2_certifying_whole_set_nodes_together"><title>certifying whole set nodes together instead one time transforms near-useless</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<circle cx="696.0" cy="166.0" r="18.0" fill="#48D597" stroke="#10263B" stroke-width="0"/>
<text x="696.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">2</text>
<text x="728.0" y="162.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Collective certification transforms the</text>
<text x="728.0" y="188.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">guarantee</text>
<text x="682.0" y="250.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">Certifying a whole set of nodes together, instead of one</text>
<text x="682.0" y="275.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">at a time, turns a near-useless zero percent guarantee</text>
<text x="682.0" y="300.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">into an eighty percent certified ratio against graph</text>
<text x="682.0" y="325.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">injection attacks.</text>
</g>
<g id="cue_s10_c3_customized_linear_relaxation_keeps_t"><title>customized linear relaxation keeps tractable solving about minute even large</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<circle cx="104.0" cy="444.0" r="18.0" fill="#4C8DFF" stroke="#10263B" stroke-width="0"/>
<text x="104.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">3</text>
<text x="136.0" y="440.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Kept tractable</text>
<text x="90.0" y="508.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">A customized linear relaxation keeps this efficient,</text>
<text x="90.0" y="533.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">solving in about a minute even for large attacks.</text>
</g>
<g id="cue_s10_c4_concrete_step_toward_provable_defens"><title>concrete step toward provable defenses practical because shares same smoothed</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<circle cx="696.0" cy="444.0" r="18.0" fill="#F5B841" stroke="#10263B" stroke-width="0"/>
<text x="696.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">4</text>
<text x="728.0" y="440.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Practical, and composable</text>
<text x="682.0" y="508.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">A concrete step toward practical provable defenses.</text>
<text x="682.0" y="533.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">Because it shares the same smoothed model, it plugs in</text>
<text x="682.0" y="558.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">alongside existing sample-wise certificates to stay</text>
<text x="682.0" y="583.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">strong across every attack budget.</text>
</g>
<text x="64.0" y="690.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="normal" fill="#9DB2C4" text-anchor="start">Collective Certified Robustness against Graph Injection Attacks  ·  ICML 2024  ·  arxiv.org/abs/2403.01423</text>
</svg>
