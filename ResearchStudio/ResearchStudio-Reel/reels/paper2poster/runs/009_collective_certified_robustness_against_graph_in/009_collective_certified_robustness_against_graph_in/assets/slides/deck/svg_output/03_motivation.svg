<text x="90.0" y="212.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">In the real world an attacker cannot conjure a different</text>
<text x="90.0" y="238.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">graph for every node they want to fool.</text>
