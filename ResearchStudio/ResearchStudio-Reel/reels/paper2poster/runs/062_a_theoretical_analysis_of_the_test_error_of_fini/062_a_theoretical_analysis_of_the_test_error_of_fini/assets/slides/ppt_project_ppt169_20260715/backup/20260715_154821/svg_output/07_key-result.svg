<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">06 · KEY RESULT</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">The bounds bracket the true test error</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- figure 2 -->
  <rect x="64" y="178" width="608" height="452" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
  <text x="88" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#5A6079">FIGURE 2 · COMPARISON OF TEST-ERROR BOUNDS</text>
  <image href="../images/figure2.png" x="88" y="234" width="560" height="288" preserveAspectRatio="xMidYMid meet"/>
  <text x="88" y="560" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">Upper bounds vs N (left) and vs 1/&#955; (right), natural-log</text>
  <text x="88" y="584" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">scale. New bound tracks the true error; Bach's sits far above.</text>

  <!-- c1 -->
  <g id="cue_s07_c1_new_upper_lower_bounds_bracket">
    <title>The new upper and lower bounds bracket the error and squeeze together as samples grow</title>
    <desc>the new upper and lower bounds bracket the error across sample sizes on both kernels and squeeze together as samples grow</desc>
    <rect x="696" y="178" width="520" height="140" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="720" y="214" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">SANDWICHED &amp; TIGHT</text>
    <text x="720" y="250" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Upper &amp; lower bounds bracket the error on</text>
    <text x="720" y="276" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">both kernels &#8212; and squeeze together as N</text>
    <text x="720" y="302" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">grows (the signature of tightness).</text>
  </g>

  <!-- c2 -->
  <g id="cue_s07_c2_against_bach_bound_gain_stark">
    <title>Against Bach's bound the gain is stark: the new bound hugs the true error</title>
    <desc>against Bach's bound the gain is stark the new bound hugs the true error while Bach's floats far above</desc>
    <rect x="696" y="332" width="520" height="140" rx="16" fill="#FFFFFF" stroke="#E0552D" stroke-width="1.5"/>
    <text x="720" y="368" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#E0552D">VS. THE CLOSEST PRIOR BOUND</text>
    <text x="720" y="404" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Stark gain against Bach: the new bound</text>
    <text x="720" y="430" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">hugs the true error while Bach's floats</text>
    <text x="720" y="456" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">far above (orders of magnitude).</text>
  </g>

  <!-- c3 -->
  <g id="cue_s07_c3_ridgeless_limit_bias_reduces_finite">
    <title>In the ridgeless limit, bias reduces to the finite-rank error and variance to the noise</title>
    <desc>in the ridgeless limit bias reduces to the finite-rank error and variance reduces to the noise level</desc>
    <rect x="696" y="486" width="520" height="144" rx="16" fill="#16205C"/>
    <text x="720" y="522" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">RIDGELESS LIMIT</text>
    <image href="../images/f_ridgeless.png" x="720" y="536" width="472" height="30" preserveAspectRatio="xMidYMid meet"/>
    <text x="720" y="596" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#C9D2F5">Bias &#8594; irreducible finite-rank error;</text>
    <text x="720" y="620" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#C9D2F5">variance &#8594; the noise level alone.</text>
  </g>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">07 / 10</text>
</svg>
