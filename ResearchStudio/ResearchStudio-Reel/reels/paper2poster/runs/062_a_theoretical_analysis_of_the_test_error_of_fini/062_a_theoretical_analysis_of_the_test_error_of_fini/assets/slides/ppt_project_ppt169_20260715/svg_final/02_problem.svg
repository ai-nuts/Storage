<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <!-- header -->
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">01 · PROBLEM</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">Tight guarantees are missing for finite-rank KRR</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- left panel: the setup -->
  <g id="cue_s02_c1_kernel_ridge_regression_helps_explai">
    <title>Kernel ridge regression helps explain generalization; last layer is a finite-rank kernel</title>
    <desc>kernel ridge regression helps explain generalization, tuning a network last layer behaves like it with a finite-rank kernel</desc>
    <rect x="64" y="178" width="556" height="452" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="92" y="222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">THE SETUP</text>
    <text x="92" y="258" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#141A33">Last-layer learning = finite-rank KRR</text>
    <text x="92" y="300" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">Kernel ridge regression is a workhorse for</text>
    <text x="92" y="326" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">understanding generalization.</text>
    <text x="92" y="366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">Freeze a pre-trained network and train only its</text>
    <text x="92" y="392" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">last layer &#8594; regression with a finite-rank</text>
    <text x="92" y="418" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">kernel of rank M.</text>
    <!-- pipeline chips -->
    <rect x="92" y="470" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <text x="167" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16205C">Frozen</text>
    <text x="167" y="536" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16205C">backbone</text>
    <text x="262" y="524" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#2540D9">&#8594;</text>
    <rect x="282" y="470" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <text x="357" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16205C">Features</text>
    <text x="357" y="536" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#16205C">&#966;(x) &#8712; &#8477;&#7504;</text>
    <text x="452" y="524" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#2540D9">&#8594;</text>
    <rect x="472" y="470" width="120" height="96" rx="10" fill="#2540D9"/>
    <text x="532" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Finite-rank</text>
    <text x="532" y="536" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">kernel</text>
  </g>

  <!-- right panel: the trouble -->
  <g id="cue_s02_c2_but_classical_bounds_far_too">
    <title>Classical bounds are far too loose here</title>
    <desc>but classical bounds far too loose, they keep the ridge above zero, only upper bounds, go vacuous as regularization vanishes</desc>
    <rect x="660" y="178" width="556" height="452" rx="16" fill="#FFFFFF" stroke="#E0552D" stroke-width="1.5"/>
    <text x="688" y="222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#E0552D">THE TROUBLE</text>
    <text x="688" y="258" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#141A33">Classical bounds are far too loose</text>

    <circle cx="704" cy="316" r="7" fill="#E0552D"/>
    <text x="726" y="323" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#141A33">Require the ridge &#955; bounded away from 0</text>

    <circle cx="704" cy="378" r="7" fill="#E0552D"/>
    <text x="726" y="385" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#141A33">Provide only upper bounds (one-sided)</text>

    <circle cx="704" cy="440" r="7" fill="#E0552D"/>
    <text x="726" y="447" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" fill="#141A33">Become vacuous as &#955; &#8594; 0 (ridgeless)</text>

    <rect x="688" y="500" width="500" height="96" rx="10" fill="#FDECE7"/>
    <text x="712" y="542" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7391A">No tight, two-sided certificate exactly where</text>
    <text x="712" y="570" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#B7391A">last-layer models live.</text>
  </g>

  <!-- footer -->
  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">02 / 10</text>
</svg>
