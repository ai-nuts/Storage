<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">03 · CONTRIBUTION</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">Sharp, two-sided bounds &#8212; valid for any ridge</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- card 1 -->
  <g id="cue_s04_c1_contribution_threefold_first_bounds">
    <title>First contribution: the bounds improve as the ridge goes to zero</title>
    <desc>contribution threefold first the bounds improve as the ridge goes to zero, non-vacuous in the ridgeless limit</desc>
    <rect x="64" y="178" width="368" height="250" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <circle cx="104" cy="222" r="20" fill="#2540D9"/>
    <text x="104" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">1</text>
    <text x="140" y="230" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#141A33">Improve as &#955; &#8594; 0</text>
    <text x="94" y="288" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">Bounds get better toward the</text>
    <text x="94" y="314" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">ridgeless limit &#8212; and stay</text>
    <text x="94" y="340" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">non-vacuous, unlike prior</text>
    <text x="94" y="366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">work.</text>
  </g>

  <!-- card 2 -->
  <g id="cue_s04_c2_second_sharp_lower_bound_matches">
    <title>Second contribution: a sharp lower bound matches the upper bound as samples grow</title>
    <desc>second a sharp lower bound matches the upper bound as samples grow so both are tight</desc>
    <rect x="456" y="178" width="368" height="250" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <circle cx="496" cy="222" r="20" fill="#1F9D6B"/>
    <text x="496" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">2</text>
    <text x="532" y="230" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#141A33">Matching lower bound</text>
    <text x="486" y="288" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">A sharp lower bound provably</text>
    <text x="486" y="314" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">matches the upper bound as N</text>
    <text x="486" y="340" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">grows &#8212; tight in a precise</text>
    <text x="486" y="366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">sense.</text>
  </g>

  <!-- card 3 -->
  <g id="cue_s04_c3_third_experiments_show_large_gain">
    <title>Third contribution: experiments show a large gain over prior work</title>
    <desc>third experiments show a large gain over prior work, dramatically tighter than the closest prior bound</desc>
    <rect x="848" y="178" width="368" height="250" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <circle cx="888" cy="222" r="20" fill="#E0552D"/>
    <text x="888" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">3</text>
    <text x="924" y="230" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#141A33">Large empirical gain</text>
    <text x="878" y="288" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">Dramatically tighter than the</text>
    <text x="878" y="314" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">closest prior bound (Bach) &#8212;</text>
    <text x="878" y="340" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">validated on two finite-rank</text>
    <text x="878" y="366" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">kernels.</text>
  </g>

  <!-- key trick band -->
  <g id="cue_s04_c4_key_trick_work_eigenfunction_basis">
    <title>Key trick: work in the eigenfunction basis, separating spectrum from sampling noise</title>
    <desc>key trick work in the eigenfunction basis separating the spectrum from sampling noise for sharper constants</desc>
    <rect x="64" y="452" width="1152" height="178" rx="16" fill="#16205C"/>
    <text x="92" y="496" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">KEY TECHNICAL TRICK</text>
    <text x="92" y="536" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Analyze the target in the L&#178;&#961; eigenfunction basis &#123;&#968;&#8342;&#125;</text>
    <text x="92" y="576" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#C9D2F5">Decouple the kernel spectrum from the randomness of sampling &#8212; the source of the sharper</text>
    <text x="92" y="604" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#C9D2F5">constants, instead of working in the RKHS basis.</text>
  </g>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">04 / 10</text>
</svg>
