<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">04 · METHOD</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">Bias&#8211;variance split, bounded for any ridge</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- c1: estimator + split -->
  <g id="cue_s05_c1_method_starts_kernel_ridge_estimator">
    <title>Method starts from the kernel-ridge estimator and splits the test error into bias and variance</title>
    <desc>method starts from the kernel-ridge estimator splits the test error into a bias term and a variance term each bounded with high probability</desc>
    <rect x="64" y="178" width="576" height="298" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="92" y="220" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">ESTIMATOR &#8594; SPLIT</text>
    <text x="92" y="252" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#5A6079">Regularized least squares over the RKHS:</text>
    <image href="../images/f_estimator.png" x="92" y="266" width="500" height="76" preserveAspectRatio="xMidYMid meet"/>
    <text x="92" y="378" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#5A6079">Test error splits cleanly into two terms:</text>
    <image href="../images/f_split.png" x="92" y="392" width="512" height="34" preserveAspectRatio="xMidYMid meet"/>
    <text x="92" y="456" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">bias = noiseless error &#160;·&#160; variance = label-noise error &#8212; each bounded w.h.p.</text>
  </g>

  <!-- c2: key ingredients -->
  <g id="cue_s05_c2_key_ingredients_careful_algebra_ridg">
    <title>Key ingredients: careful ridge algebra, sub-Gaussian covariance concentration, Neumann series</title>
    <desc>key ingredients careful algebra on the ridge terms a sub-Gaussian covariance concentration inequality and a Neumann-series expansion</desc>
    <rect x="664" y="178" width="552" height="298" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
    <text x="692" y="220" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">KEY INGREDIENTS</text>

    <rect x="692" y="238" width="496" height="66" rx="10" fill="#F4F6FB"/>
    <text x="712" y="278" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Careful algebra on the ridge terms</text>

    <rect x="692" y="316" width="496" height="66" rx="10" fill="#F4F6FB"/>
    <text x="712" y="356" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Sub-Gaussian covariance concentration</text>

    <rect x="692" y="394" width="496" height="66" rx="10" fill="#F4F6FB"/>
    <text x="712" y="434" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Neumann-series inverse expansion</text>
  </g>

  <!-- c3: holds for any ridge -->
  <g id="cue_s05_c3_lets_bounds_hold_any_ridge">
    <title>That lets the bounds hold for any ridge value</title>
    <desc>that lets the bounds hold for any ridge value chosen independently of the sample size</desc>
    <rect x="64" y="500" width="1152" height="130" rx="16" fill="#16205C"/>
    <text x="92" y="542" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">HOLDS FOR ANY RIDGE VALUE</text>
    <image href="../images/f_variance.png" x="92" y="556" width="560" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="700" y="566" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Valid for &#955; chosen independently of N &#8212;</text>
    <text x="700" y="596" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#C9D2F5">not only for a ridge that shrinks with the sample.</text>
  </g>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">05 / 10</text>
</svg>
