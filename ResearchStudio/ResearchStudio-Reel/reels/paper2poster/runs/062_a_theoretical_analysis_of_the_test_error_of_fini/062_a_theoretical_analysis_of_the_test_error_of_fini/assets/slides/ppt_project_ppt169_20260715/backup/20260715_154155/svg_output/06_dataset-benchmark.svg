<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">05 · DATASET / BENCHMARK</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">Controlled synthetic finite-rank kernels</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- c1 -->
  <g id="cue_s06_c1_being_theory_experiments_controlled">
    <title>Being a theory paper, the experiments use controlled synthetic settings</title>
    <desc>being a theory paper the experiments use controlled synthetic settings where the true spectrum and target decomposition are known</desc>
    <rect x="64" y="178" width="520" height="132" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="88" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">A THEORY PAPER</text>
    <text x="88" y="250" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#141A33">Controlled synthetic settings &#8212; no natural-</text>
    <text x="88" y="276" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#141A33">image data. True spectrum &amp; target</text>
    <text x="88" y="302" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#141A33">decomposition are known.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s06_c2_authors_test_two_finite_rank_kernels">
    <title>They test two finite-rank kernels: a truncated NTK and a constructed low-rank kernel</title>
    <desc>the authors test two finite-rank kernels a truncated neural tangent kernel and a constructed low-rank kernel</desc>
    <rect x="64" y="322" width="520" height="176" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
    <text x="88" y="360" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">TWO FINITE-RANK KERNELS</text>
    <rect x="88" y="376" width="472" height="52" rx="10" fill="#F4F6FB"/>
    <rect x="88" y="376" width="6" height="52" rx="3" fill="#2540D9"/>
    <text x="112" y="399" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#141A33">tNTK &#8212; truncated Neural Tangent Kernel</text>
    <text x="112" y="420" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5A6079">mimics a wide network's last layer</text>
    <rect x="88" y="436" width="472" height="52" rx="10" fill="#F4F6FB"/>
    <rect x="88" y="436" width="6" height="52" rx="3" fill="#1F9D6B"/>
    <text x="112" y="459" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#141A33">LK &#8212; a constructed low-rank kernel</text>
    <text x="112" y="480" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5A6079">a separately built finite-rank kernel</text>
  </g>

  <!-- c3 -->
  <g id="cue_s06_c3_they_sweep_sample_sizes_ten">
    <title>Sweep sample sizes from ten to two hundred and many ridge values, ten trials, quartile bars</title>
    <desc>they sweep sample sizes from ten to two hundred and many ridge values averaging ten trials with median and quartile bars</desc>
    <rect x="64" y="510" width="520" height="120" rx="16" fill="#16205C"/>
    <text x="88" y="548" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">EXPERIMENTAL SWEEP</text>
    <text x="88" y="584" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">N &#8776; 10 &#8594; 200&#160;&#160;·&#160;&#160;many ridge values &#955;</text>
    <text x="88" y="612" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#C9D2F5">10 trials&#160;&#160;·&#160;&#160;median + quartile error bars</text>
  </g>

  <!-- figure 1 -->
  <rect x="608" y="178" width="608" height="452" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
  <text x="632" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#5A6079">FIGURE 1 · KRR ON A FINITE-RANK KERNEL</text>
  <image href="../images/figure1.png" x="632" y="234" width="560" height="288" preserveAspectRatio="xMidYMid meet"/>
  <text x="632" y="560" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">Left: KRR training. Right: test error vs sample size N,</text>
  <text x="632" y="584" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">over 10 iterations; upper/lower quartiles as error bars.</text>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">06 / 10</text>
</svg>
