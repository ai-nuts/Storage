<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="10" fill="#2540D9"/>
  <rect x="0" y="710" width="1280" height="10" fill="#16205C"/>

  <!-- kicker -->
  <text x="80" y="92" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#2540D9">NEURIPS 2023  ·  LEARNING THEORY</text>

  <!-- title -->
  <text x="80" y="164" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#141A33">A Theoretical Analysis of the Test Error</text>
  <text x="80" y="222" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="800" fill="#141A33">of Finite-Rank Kernel Ridge Regression</text>

  <!-- one-line result / c1 -->
  <g id="cue_s01_c1_work_sharply_analyzes_test_error">
    <title>This work sharply analyzes the test error of finite-rank kernel ridge regression</title>
    <desc>work sharply analyzes test error finite-rank kernel ridge regression, the model behind tuning a frozen network last layer</desc>
    <rect x="80" y="266" width="6" height="76" rx="3" fill="#2540D9"/>
    <text x="104" y="296" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#141A33">We sharply analyze the test error of finite-rank KRR — the model behind</text>
    <text x="104" y="330" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#141A33">tuning a frozen pre-trained network's last layer.</text>
  </g>

  <!-- bounds strip / c2 -->
  <g id="cue_s01_c2_derives_matching_upper_lower_bounds">
    <title>Derives matching upper and lower bounds that stay tight for any regularization</title>
    <desc>derives matching upper lower bounds stay tight any regularization including ridgeless limit</desc>
    <rect x="80" y="372" width="1120" height="78" rx="12" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <circle cx="116" cy="411" r="8" fill="#2540D9"/>
    <circle cx="146" cy="411" r="8" fill="#1F9D6B"/>
    <text x="176" y="405" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#16205C">Matching upper &amp; lower bounds</text>
    <text x="176" y="433" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#5A6079">Non-asymptotic and two-sided — tight for any regularization, including the ridgeless limit.</text>
  </g>

  <!-- authors -->
  <text x="80" y="512" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" fill="#141A33">Tin Sum Cheng · Aurélien Lucchi · Ivan Dokmanić · Anastasis Kratsios · David Belius</text>
  <text x="80" y="540" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5A6079">University of Basel · McMaster University · Vector Institute · UniDistance Suisse</text>

  <!-- logos -->
  <image href="../images/logo_basel.png" x="80" y="580" width="150" height="46" preserveAspectRatio="xMidYMid meet"/>
  <image href="../images/logo_mcmaster.png" x="256" y="580" width="150" height="46" preserveAspectRatio="xMidYMid meet"/>
  <image href="../images/logo_vector.png" x="432" y="580" width="150" height="46" preserveAspectRatio="xMidYMid meet"/>
  <image href="../images/logo_unidistance.png" x="608" y="580" width="160" height="46" preserveAspectRatio="xMidYMid meet"/>

  <!-- QR -->
  <rect x="1074" y="512" width="126" height="150" rx="12" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
  <image href="../images/qr_paper.png" x="1090" y="524" width="94" height="94" preserveAspectRatio="xMidYMid meet"/>
  <text x="1137" y="644" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5A6079">PAPER</text>
</svg>
