<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">07 · ABLATION STUDY</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">Which terms matter, and which wash out</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- c1 -->
  <g id="cue_s08_c1_ablates_its_bound">
    <title>The paper ablates its own bound, term by term</title>
    <desc>the paper ablates its bound term by term to see which contributions matter</desc>
    <rect x="64" y="178" width="520" height="88" rx="16" fill="#16205C"/>
    <text x="88" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">SELF-ABLATION</text>
    <text x="88" y="248" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Ablate the bound, term by term</text>
  </g>

  <!-- c2 -->
  <g id="cue_s08_c2_finite_rank_error_irreducible_floor">
    <title>Finite-rank error is an irreducible floor; residue terms shrink and vanish for large N</title>
    <desc>the finite-rank error is an irreducible floor while residue terms shrink at a log-N-over-N rate and vanish for large samples</desc>
    <rect x="64" y="282" width="520" height="164" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <rect x="88" y="306" width="472" height="60" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <rect x="88" y="306" width="6" height="60" rx="3" fill="#E0552D"/>
    <text x="112" y="332" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#141A33">Finite-rank error &#8212; irreducible floor</text>
    <text x="112" y="354" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5A6079">never vanishes, even with infinite data</text>
    <rect x="88" y="376" width="472" height="60" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <rect x="88" y="376" width="6" height="60" rx="3" fill="#1F9D6B"/>
    <text x="112" y="402" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#141A33">Residue terms &#8212; shrink like log N / N</text>
    <text x="112" y="424" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5A6079">negligible for large samples</text>
  </g>

  <!-- c4 -->
  <g id="cue_s08_c4_ridge_sweep_shows_new_bound">
    <title>A ridge sweep shows the new bound improves toward the ridgeless limit while the prior worsens</title>
    <desc>a ridge sweep shows the new bound improves toward the ridgeless limit while the prior bound worsens</desc>
    <rect x="64" y="462" width="520" height="168" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
    <text x="88" y="500" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">RIDGE SWEEP</text>
    <text x="88" y="536" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#2540D9">New bound &#8594; improves toward &#955; = 0</text>
    <text x="88" y="574" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#E0552D">Bach's bound &#8594; worsens</text>
    <text x="88" y="608" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">isolating the ridge-dependence as the source of the gain</text>
  </g>

  <!-- c3: figure 3 -->
  <g id="cue_s08_c3_dropped_simplified_bounds_fail_only">
    <title>Dropping residues, the simplified bounds fail only in the small-sample regime, as predicted</title>
    <desc>dropped the simplified bounds fail only in the small-sample regime as predicted and recover tightness as N grows</desc>
    <rect x="608" y="178" width="608" height="452" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
    <text x="632" y="216" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#5A6079">FIGURE 3 · RESIDUES DROPPED FOR SIMPLICITY</text>
    <image href="../images/figure3.png" x="632" y="234" width="560" height="286" preserveAspectRatio="xMidYMid meet"/>
    <text x="632" y="558" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#141A33">Simplified bounds stop bracketing only for small N &#8212;</text>
    <text x="632" y="584" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#141A33">exactly as predicted &#8212; and recover tightness as N grows.</text>
  </g>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">08 / 10</text>
</svg>
