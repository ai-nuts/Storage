<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">08 · HEADLINE NUMBERS</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">The bounds, in four numbers</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- c1 -->
  <g id="cue_s09_c1_bounds_hold_probability_least_one">
    <title>The bounds hold with probability at least one minus two over N</title>
    <desc>the bounds hold with probability at least one minus two over N so confidence sharpens as the sample grows</desc>
    <rect x="64" y="178" width="560" height="204" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="92" y="222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">CONFIDENCE</text>
    <text x="92" y="300" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="800" fill="#141A33">&#8805; 1 &#8722; 2/N</text>
    <text x="92" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">Holds with high probability &#8212; the</text>
    <text x="92" y="368" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">confidence itself sharpens as N grows.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s09_c2_upper_bound_decays_log_n_over_n_rate">
    <title>The upper bound decays at a log-N-over-N rate, faster than the square-root Rademacher rate</title>
    <desc>the upper bound decays at a log-N-over-N rate faster than the square-root Rademacher-complexity rate</desc>
    <rect x="656" y="178" width="560" height="204" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="684" y="222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">UPPER-BOUND DECAY</text>
    <text x="684" y="300" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="800" fill="#141A33">O(log N / N)</text>
    <text x="684" y="344" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">An order of magnitude faster than the</text>
    <text x="684" y="368" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">&#8730;(log N / N) Rademacher rate.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s09_c3_variance_scales_noise_times_twice">
    <title>Variance scales as noise times twice the rank over N</title>
    <desc>variance scales as the noise variance times twice the rank over N valid when the sample exceeds the kernel rank</desc>
    <rect x="64" y="402" width="560" height="204" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
    <text x="92" y="446" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#1F9D6B">VARIANCE BOUND</text>
    <text x="92" y="524" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="800" fill="#141A33">&#963;&#178; &#183; 2M / N</text>
    <text x="92" y="568" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">M = kernel rank &#8212; valid in the under-</text>
    <text x="92" y="592" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#5A6079">parameterized regime N &gt; M.</text>
  </g>

  <!-- c4 -->
  <g id="cue_s09_c4_these_first_finite_rank_bounds_high">
    <title>These are the first finite-rank bounds with a high-probability lower bound</title>
    <desc>these are the first finite-rank bounds to include a high-probability lower bound where prior work offered none</desc>
    <rect x="656" y="402" width="560" height="204" rx="16" fill="#16205C"/>
    <text x="684" y="446" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">A NEW CAPABILITY</text>
    <text x="684" y="524" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">1st lower bound</text>
    <text x="684" y="568" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#C9D2F5">The first high-probability lower bound for</text>
    <text x="684" y="592" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#C9D2F5">finite-rank KRR &#8212; prior work offered none.</text>
  </g>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">09 / 10</text>
</svg>
