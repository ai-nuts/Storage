<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="64" y="58" width="6" height="34" rx="3" fill="#2540D9"/>
  <text x="84" y="76" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#2540D9">02 · MOTIVATION</text>
  <text x="84" y="120" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">A common recipe, but the theory lags behind</text>
  <line x1="64" y1="146" x2="1216" y2="146" stroke="#DCE1EE" stroke-width="1.5"/>

  <!-- c1: last-layer learning is everywhere -->
  <g id="cue_s03_c1_freezing_pre_trained_backbone_retrai">
    <title>Freezing a pre-trained backbone and retraining only the final layer is everywhere</title>
    <desc>freezing a pre-trained backbone and retraining only the final layer is everywhere and defines a finite-rank kernel</desc>
    <rect x="64" y="178" width="1152" height="184" rx="16" fill="#F4F6FB" stroke="#DCE1EE" stroke-width="1"/>
    <text x="92" y="220" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#2540D9">WHY NOW</text>
    <text x="92" y="256" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#141A33">Freeze the backbone, retrain only the final layer &#8212; and it defines a finite-rank kernel</text>
    <rect x="92" y="286" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <text x="257" y="321" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#16205C">Transfer learning</text>
    <rect x="440" y="286" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <text x="605" y="321" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#16205C">Reservoir computing</text>
    <rect x="788" y="286" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#DCE1EE"/>
    <text x="953" y="321" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#16205C">Few-shot learning</text>
  </g>

  <!-- c2: theory lags -->
  <g id="cue_s03_c2_yet_theory_lags_many_results">
    <title>Yet the theory lags: prior analyses are asymptotic, ridge-scheduled, or one-sided</title>
    <desc>yet the theory lags, many results need the input dimension to grow, others fix how the ridge decays, almost none give a lower bound</desc>
    <rect x="64" y="386" width="1152" height="244" rx="16" fill="#FFFFFF" stroke="#DCE1EE" stroke-width="1"/>
    <text x="92" y="428" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#E0552D">WHAT PRIOR WORK MISSES</text>

    <rect x="92" y="446" width="352" height="88" rx="10" fill="#F4F6FB"/>
    <text x="116" y="486" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Need input dim &#8594; &#8734;</text>
    <text x="116" y="514" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">asymptotic, high-dimensional limits</text>

    <rect x="464" y="446" width="352" height="88" rx="10" fill="#F4F6FB"/>
    <text x="488" y="486" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Fix a ridge schedule &#955;(N)</text>
    <text x="488" y="514" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">hold only for a prescribed decay</text>

    <rect x="836" y="446" width="352" height="88" rx="10" fill="#F4F6FB"/>
    <text x="860" y="486" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#141A33">Bound expected error</text>
    <text x="860" y="514" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5A6079">no high-probability control</text>

    <rect x="92" y="552" width="1096" height="58" rx="10" fill="#FDECE7"/>
    <text x="116" y="588" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#B7391A">Almost none give a lower bound &#8212; so you can never claim your upper bound is tight.</text>
  </g>

  <text x="64" y="694" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#8A90A6">Finite-Rank KRR · NeurIPS 2023</text>
  <text x="1216" y="694" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#8A90A6">03 / 10</text>
</svg>
