<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="80" y="60" width="56" height="6" rx="3" fill="#2540D9"/>

  <text x="80" y="96" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#2540D9">09 · TAKEAWAY</text>

  <!-- c1 hero statement -->
  <g id="cue_s10_c1_takeaway_finite_rank_kernel_ridge_re">
    <title>Takeaway: finite-rank KRR, behind last-layer fine-tuning, now has sharp two-sided bounds</title>
    <desc>the takeaway finite-rank kernel ridge regression behind last-layer fine-tuning has sharp bounds matching upper and lower tight for any regularization including none</desc>
    <text x="80" y="182" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">Finite-rank KRR &#8212; the model behind last-layer</text>
    <text x="80" y="234" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">fine-tuning &#8212; now has <tspan fill="#2540D9">genuinely sharp</tspan> bounds:</text>
    <text x="80" y="286" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#141A33">matching upper and lower, tight for <tspan fill="#2540D9">any ridge</tspan>.</text>

    <rect x="80" y="330" width="360" height="56" rx="28" fill="#F4F6FB" stroke="#DCE1EE"/>
    <text x="260" y="366" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#16205C">Matching U.B. + L.B.</text>
    <rect x="456" y="330" width="300" height="56" rx="28" fill="#F4F6FB" stroke="#DCE1EE"/>
    <text x="606" y="366" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#16205C">Tight for any &#955;</text>
    <rect x="772" y="330" width="320" height="56" rx="28" fill="#F4F6FB" stroke="#DCE1EE"/>
    <text x="932" y="366" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#16205C">Including ridgeless</text>
  </g>

  <!-- c2 key idea -->
  <g id="cue_s10_c2_key_idea_working_eigenfunction_basis">
    <title>The key idea: work in the eigenfunction basis to separate spectrum from sampling noise</title>
    <desc>the key idea working in the eigenfunction basis to separate the spectrum from sampling noise is a template other analyses can borrow</desc>
    <rect x="80" y="436" width="1120" height="176" rx="16" fill="#16205C"/>
    <text x="112" y="480" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#8FA0FF">THE KEY IDEA</text>
    <text x="112" y="524" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Work in the eigenfunction basis, separating spectrum from sampling noise</text>
    <text x="112" y="566" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#C9D2F5">A far more honest certificate of test error than loose, one-sided, asymptotic guarantees &#8212;</text>
    <text x="112" y="594" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" fill="#C9D2F5">and a template other finite-rank analyses can borrow.</text>
  </g>

  <text x="80" y="668" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#5A6079">Cheng, Lucchi, Dokmani&#263;, Kratsios, Belius · NeurIPS 2023 · arXiv:2310.00987</text>
</svg>
