<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1621"/><stop offset="1" stop-color="#0b1119"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4f9dff" stop-opacity="0.16"/><stop offset="1" stop-color="#4f9dff" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgg)"/>
<rect x="64" y="52" width="6" height="30" rx="3" fill="#f2726f"/>
<text x="84" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#f2726f" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text>
<text x="84" y="96" font-family="'Helvetica Neue', Arial, sans-serif" font-size="33" fill="#eef4fa" font-weight="800" text-anchor="start">Diffusion sampling is slow</text>
<line x1="64" y1="118" x2="1216" y2="118" stroke="#30465b" stroke-width="1.2" stroke-linecap="round"/>
<text x="1216" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8fa3b8" font-weight="600" text-anchor="end" letter-spacing="1.5">02 / 10</text>
<g id="cue_s02_c1_central_limitation_diffusion_models"><title>central limitation diffusion models sampling speed</title>
<rect x="64" y="138" width="564" height="258" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="152" width="5" height="230" rx="2.5" fill="#f2726f"/>
<circle cx="103" cy="174" r="15" fill="#f2726f" stroke="none" stroke-width="0"/>
<text x="103" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">1</text>
<text x="128" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">The core limitation</text>
<text x="90" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Sampling speed is the central</text>
<text x="90" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">bottleneck of diffusion models.</text>
<text x="90" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Latency, not quality, blocks</text>
<text x="90" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">interactive real-time use.</text>

</g>
<g id="cue_s02_c2_standard_denoising_diffusion_probabi"><title>standard denoising diffusion probabilistic take thousand sequential passes through neural</title>
<rect x="652" y="138" width="564" height="258" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="652" y="152" width="5" height="230" rx="2.5" fill="#fbbf24"/>
<circle cx="691" cy="174" r="15" fill="#fbbf24" stroke="none" stroke-width="0"/>
<text x="691" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">2</text>
<text x="716" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">1000 sequential passes</text>
<text x="678" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">A standard DDPM runs up to</text>
<text x="678" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">1000 network evaluations,</text>
<text x="678" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">strictly one after another,</text>
<text x="678" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">to make a single sample.</text>

</g>
<g id="cue_s02_c3_popular_fix_simply_fewer_denoising"><title>popular fix simply fewer denoising steps ddim dpmsolver but reducing</title>
<rect x="64" y="420" width="564" height="258" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="434" width="5" height="230" rx="2.5" fill="#4f9dff"/>
<circle cx="103" cy="456" r="15" fill="#4f9dff" stroke="none" stroke-width="0"/>
<text x="103" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">3</text>
<text x="128" y="466" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">The popular fix: fewer steps</text>
<text x="90" y="496" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">DDIM and DPMSolver cut the</text>
<text x="90" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">number of denoising steps to</text>
<text x="90" y="544" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">go faster, but fewer steps</text>
<text x="90" y="568" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">degrades sample quality.</text>

</g>
<g id="cue_s02_c4_field_largely_accepted_quality_for_s"><title>field largely accepted quality-for-speed tradeoff</title>
<rect x="652" y="420" width="564" height="258" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="652" y="434" width="5" height="230" rx="2.5" fill="#a78bfa"/>
<circle cx="691" cy="456" r="15" fill="#a78bfa" stroke="none" stroke-width="0"/>
<text x="691" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">4</text>
<text x="716" y="466" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">An accepted tradeoff</text>
<text x="678" y="496" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">The field has largely accepted</text>
<text x="678" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">this quality-for-speed deal.</text>
<text x="678" y="544" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">This paper questions whether</text>
<text x="678" y="568" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">it is really necessary.</text>

</g>
<text x="64" y="700" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8fa3b8" font-weight="500" text-anchor="start">ParaDiGMS  ·  Shih et al.  ·  NeurIPS 2023</text><text x="1216" y="700" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8fa3b8" font-weight="500" text-anchor="end">arxiv.org/abs/2305.16317</text>
</svg>
