<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1621"/><stop offset="1" stop-color="#0b1119"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4f9dff" stop-opacity="0.16"/><stop offset="1" stop-color="#4f9dff" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgg)"/>
<rect x="64" y="52" width="6" height="30" rx="3" fill="#4f9dff"/>
<text x="84" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4f9dff" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text>
<text x="84" y="96" font-family="'Helvetica Neue', Arial, sans-serif" font-size="33" fill="#eef4fa" font-weight="800" text-anchor="start">Denoising as parallel Picard iteration</text>
<line x1="64" y1="118" x2="1216" y2="118" stroke="#30465b" stroke-width="1.2" stroke-linecap="round"/>
<text x="1216" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8fa3b8" font-weight="600" text-anchor="end" letter-spacing="1.5">05 / 10</text>
<g><rect x="64" y="138" width="1152" height="66" rx="12" ry="12" fill="#1d2d3e" stroke="#30465b" stroke-width="1.5" opacity="1.0"/><text x="88" y="178" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#eef4fa" font-weight="700" text-anchor="start">x</text><text x="102" y="168" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start">k+1</text><text x="102" y="188" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#8fa3b8" font-weight="700" text-anchor="start">t</text><text x="128" y="178" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#eef4fa" font-weight="700" text-anchor="start">=  x</text><text x="178" y="168" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start">k</text><text x="178" y="188" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#8fa3b8" font-weight="700" text-anchor="start">0</text><text x="200" y="178" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#eef4fa" font-weight="700" text-anchor="start">+  (1/T) · Σ  s( x</text><text x="430" y="168" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#2dd4bf" font-weight="700" text-anchor="start">k</text><text x="430" y="188" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#8fa3b8" font-weight="700" text-anchor="start">i</text><text x="446" y="178" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="24" fill="#c6d4e2" font-weight="700" text-anchor="start">,  i/T )    ·  Picard fixed-point update</text><text x="1196" y="176" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8fa3b8" font-weight="600" text-anchor="end">value = start + cumulative drift</text></g>
<g id="cue_s05_c1_method_builds_picard_iterations_clas"><title>method builds picard iterations classic technique solving ordinary differential equations</title>
<rect x="64" y="222" width="564" height="224" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="236" width="5" height="196" rx="2.5" fill="#4f9dff"/>
<circle cx="103" cy="258" r="15" fill="#4f9dff" stroke="none" stroke-width="0"/>
<text x="103" y="264" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">1</text>
<text x="128" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">Built on Picard iterations</text>
<text x="90" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">A classic way to solve ODEs by</text>
<text x="90" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">fixed-point iteration: write each</text>
<text x="90" y="346" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">point as the initial value plus</text>
<text x="90" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">the integral of the drift.</text>

</g>
<g id="cue_s05_c2_starting_full_guess_trajectory_parad"><title>starting full guess trajectory paradigms updates every timestep simultaneously cumulative</title>
<rect x="652" y="222" width="564" height="224" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="652" y="236" width="5" height="196" rx="2.5" fill="#2dd4bf"/>
<circle cx="691" cy="258" r="15" fill="#2dd4bf" stroke="none" stroke-width="0"/>
<text x="691" y="264" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">2</text>
<text x="716" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">Update every step at once</text>
<text x="678" y="298" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">From a full guess of the whole</text>
<text x="678" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">trajectory, refine all timesteps</text>
<text x="678" y="346" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">simultaneously using cumulative</text>
<text x="678" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">drift; repeat until it settles.</text>

</g>
<g id="cue_s05_c3_because_iteration_computed_parallel"><title>because iteration computed parallel across timesteps number iterations converge much</title>
<rect x="64" y="470" width="564" height="224" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="484" width="5" height="196" rx="2.5" fill="#34d399"/>
<circle cx="103" cy="506" r="15" fill="#34d399" stroke="none" stroke-width="0"/>
<text x="103" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">3</text>
<text x="128" y="516" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">Few iterations to converge</text>
<text x="90" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Each iteration is parallel across</text>
<text x="90" y="570" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">timesteps, and convergence needs</text>
<text x="90" y="594" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">far fewer iterations than there</text>
<text x="90" y="618" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">are steps, so it resolves fast.</text>

</g>
<g id="cue_s05_c4_practice_sliding_window_fixed_size"><title>practice sliding window fixed size respect gpu memory advancing window</title>
<rect x="652" y="470" width="564" height="224" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="652" y="484" width="5" height="196" rx="2.5" fill="#a78bfa"/>
<circle cx="691" cy="506" r="15" fill="#a78bfa" stroke="none" stroke-width="0"/>
<text x="691" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">4</text>
<text x="716" y="516" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">Sliding window for GPU memory</text>
<text x="678" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Process a fixed-size batch window,</text>
<text x="678" y="570" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">advancing it forward as soon as</text>
<text x="678" y="594" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">the earliest timesteps converge,</text>
<text x="678" y="618" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">respecting GPU memory limits.</text>

</g>
