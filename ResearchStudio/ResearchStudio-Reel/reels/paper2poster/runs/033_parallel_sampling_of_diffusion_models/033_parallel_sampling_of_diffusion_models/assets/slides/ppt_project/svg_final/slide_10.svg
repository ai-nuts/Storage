<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1621"/><stop offset="1" stop-color="#0b1119"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4f9dff" stop-opacity="0.16"/><stop offset="1" stop-color="#4f9dff" stop-opacity="0"/></radialGradient></defs>
<rect x="0" y="0" width="1280" height="720" fill="url(#bgg)"/>
<rect x="64" y="52" width="6" height="30" rx="3" fill="#2dd4bf"/>
<text x="84" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#2dd4bf" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text>
<text x="84" y="96" font-family="'Helvetica Neue', Arial, sans-serif" font-size="33" fill="#eef4fa" font-weight="800" text-anchor="start">A new axis for faster diffusion</text>
<line x1="64" y1="118" x2="1216" y2="118" stroke="#30465b" stroke-width="1.2" stroke-linecap="round"/>
<text x="1216" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8fa3b8" font-weight="600" text-anchor="end" letter-spacing="1.5">10 / 10</text>
<ellipse cx="640" cy="360" rx="620" ry="300" fill="url(#glow)"/>
<g id="cue_s10_c1_lasting_takeaway_new_axis_accelerati"><title>lasting takeaway new axis accelerating diffusion models</title>
<rect x="64" y="150" width="1152" height="150" rx="18" ry="18" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="166" width="5" height="118" rx="2.5" fill="#2dd4bf"/>
<text x="90" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#eef4fa" font-weight="800" text-anchor="start">A new axis for accelerating diffusion models</text>
<text x="90" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c6d4e2" font-weight="500" text-anchor="start">Not fewer steps at the cost of quality: run every step, in parallel, faster.</text>
<text x="90" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c6d4e2" font-weight="500" text-anchor="start">A dimension of speedup that is complementary to every existing fast sampler.</text>
</g>
<g id="cue_s10_c2_rather_sacrificing_quality_taking_fe"><title>rather sacrificing quality taking fewer steps paradigms spends parallel compute</title>
<rect x="64" y="326" width="564" height="320" rx="18" ry="18" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="342" width="5" height="288" rx="2.5" fill="#4f9dff"/>
<circle cx="94" cy="372" r="14" fill="#4f9dff" stroke="none" stroke-width="0"/>
<text x="94" y="377" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0b1119" font-weight="800" text-anchor="middle">2</text>
<text x="120" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#eef4fa" font-weight="800" text-anchor="start">Spend compute, keep quality</text>
<text x="94" y="422" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">ParaDiGMS spends parallel compute</text>
<text x="94" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">to run all denoising steps faster,</text>
<text x="94" y="482" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">cutting sampling latency 2–4×</text>
<text x="94" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">with no loss in quality, and it</text>
<text x="94" y="542" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">composes with DDIM / DPMSolver.</text>
</g>
<g id="cue_s10_c3_looking_forward_parallel_hardware_ke"><title>looking forward parallel hardware keeps improving sampling time will limited</title>
<rect x="652" y="326" width="564" height="320" rx="18" ry="18" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="652" y="342" width="5" height="288" rx="2.5" fill="#a78bfa"/>
<circle cx="682" cy="372" r="14" fill="#a78bfa" stroke="none" stroke-width="0"/>
<text x="682" y="377" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0b1119" font-weight="800" text-anchor="middle">3</text>
<text x="708" y="378" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#eef4fa" font-weight="800" text-anchor="start">The road ahead</text>
<text x="682" y="422" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">As parallel hardware keeps</text>
<text x="682" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">improving, sampling time is</text>
<text x="682" y="482" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">bounded only by the small number</text>
<text x="682" y="512" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">of Picard iterations, pointing to</text>
<text x="682" y="542" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16.5" fill="#c6d4e2" font-weight="500" text-anchor="start">even faster real-time generation.</text>
</g>
<text x="64" y="700" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8fa3b8" font-weight="500" text-anchor="start">ParaDiGMS  ·  Shih et al.  ·  NeurIPS 2023</text><text x="1216" y="700" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8fa3b8" font-weight="500" text-anchor="end">arxiv.org/abs/2305.16317</text>
</svg>
