<g id="cue_s01_c1_diffusion_models_produce_stunning_sa"><title>diffusion models produce stunning samples but they slow often needing</title>
<rect x="64" y="430" width="280" height="210" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="444" width="5" height="182" rx="2.5" fill="#fbbf24"/>
<circle cx="94" cy="470" r="13" fill="#fbbf24" stroke="none" stroke-width="0"/>
<text x="94" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0b1119" font-weight="800" text-anchor="middle">1</text>
<text x="86" y="522" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#eef4fa" font-weight="800" text-anchor="start">Slow to sample</text>
<text x="86" y="558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c6d4e2" font-weight="500" text-anchor="start">1000 sequential steps per</text>
<text x="86" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c6d4e2" font-weight="500" text-anchor="start">image</text>
</g>
<g id="cue_s01_c2_instead_cutting_number_steps_paying"><title>instead cutting number steps paying sample quality keep every step</title>
<rect x="360" y="430" width="280" height="210" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="360" y="444" width="5" height="182" rx="2.5" fill="#4f9dff"/>
<circle cx="390" cy="470" r="13" fill="#4f9dff" stroke="none" stroke-width="0"/>
<text x="390" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#0b1119" font-weight="800" text-anchor="middle">2</text>
<text x="382" y="522" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#eef4fa" font-weight="800" text-anchor="start">A different question</text>
<text x="382" y="558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c6d4e2" font-weight="500" text-anchor="start">keep every step, run them</text>
