<text x="678" y="522" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#eef4fa" font-weight="800" text-anchor="start">ParaDiGMS</text>
<text x="678" y="558" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c6d4e2" font-weight="500" text-anchor="start">Picard iterations guess &amp;</text>
<text x="678" y="580" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c6d4e2" font-weight="500" text-anchor="start">refine the path</text>
</g>
<g id="cue_s01_c4_delivers_two_to_four_times_faster_sa"><title>delivers two-to-four times faster sampling measurable drop quality</title>
<rect x="952" y="430" width="280" height="210" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="952" y="444" width="5" height="182" rx="2.5" fill="#34d399"/>
<circle cx="982" cy="470" r="13" fill="#34d399" stroke="none" stroke-width="0"/>
