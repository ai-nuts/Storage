<rect x="64" y="434" width="5" height="230" rx="2.5" fill="#4f9dff"/>
<circle cx="103" cy="456" r="15" fill="#4f9dff" stroke="none" stroke-width="0"/>
<text x="103" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">3</text>
<text x="128" y="466" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">Orthogonal &amp; composable</text>
<text x="90" y="496" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Layers on top of DDIM and</text>
<text x="90" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">DPMSolver to give ParaDDIM</text>
<text x="90" y="544" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">and ParaDPMSolver, both</text>
<text x="90" y="568" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">axes of speedup combined.</text>

</g>
<g id="cue_s04_c4_also_compatible_classifier_free_guid"><title>also compatible classifier-free guidance</title>
