<text x="1216" y="66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#8fa3b8" font-weight="600" text-anchor="end" letter-spacing="1.5">04 / 10</text>
<g id="cue_s04_c1_key_contribution_paradigms_short_par"><title>key contribution paradigms short parallel diffusion generative sampling</title>
<rect x="64" y="138" width="564" height="258" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="64" y="152" width="5" height="230" rx="2.5" fill="#2dd4bf"/>
<circle cx="103" cy="174" r="15" fill="#2dd4bf" stroke="none" stroke-width="0"/>
<text x="103" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">1</text>
<text x="128" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">What it is</text>
<text x="90" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">ParaDiGMS = Parallel Diffusion</text>
<text x="90" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Generative Model Sampling.</text>
<text x="90" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">The first general method to</text>
<text x="90" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">trade compute for speed.</text>

</g>
<g id="cue_s04_c2_first_general_method_lets_you"><title>first general method lets you spend extra parallel compute sample</title>
<rect x="652" y="138" width="564" height="258" rx="16" ry="16" fill="#172331" stroke="#30465b" stroke-width="1.5" opacity="1.0"/>
<rect x="652" y="152" width="5" height="230" rx="2.5" fill="#34d399"/>
<circle cx="691" cy="174" r="15" fill="#34d399" stroke="none" stroke-width="0"/>
<text x="691" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">2</text>
<text x="716" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">No retraining needed</text>
<text x="678" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Works on any pretrained</text>
<text x="678" y="238" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">diffusion model out of the box</text>
<text x="678" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">by spending extra parallel</text>
<text x="678" y="286" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">compute at sampling time.</text>

</g>
<g id="cue_s04_c3_crucially_orthogonal_existing_techni"><title>crucially orthogonal existing techniques layered top ddim dpmsolver yield paraddim</title>
