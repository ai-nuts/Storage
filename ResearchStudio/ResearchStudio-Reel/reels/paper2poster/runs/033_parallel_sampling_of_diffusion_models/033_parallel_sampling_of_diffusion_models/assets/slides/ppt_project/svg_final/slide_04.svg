<text x="691" y="462" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#0b1119" font-weight="800" text-anchor="middle">4</text>
<text x="716" y="466" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#eef4fa" font-weight="800" text-anchor="start">Guidance-compatible</text>
<text x="678" y="496" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">Also compatible with</text>
<text x="678" y="520" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#c6d4e2" font-weight="400" text-anchor="start">classifier-free guidance,</text>
