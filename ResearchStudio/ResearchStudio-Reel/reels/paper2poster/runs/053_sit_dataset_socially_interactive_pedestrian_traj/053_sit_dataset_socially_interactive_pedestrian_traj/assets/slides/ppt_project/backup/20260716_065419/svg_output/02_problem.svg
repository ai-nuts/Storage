<g id="cue_s02_c1_robot_navigate_safely_among_people">
<title>Robot must perceive and predict nearby pedestrians in 3D — robot navigate safely among people needs perceive nearby pedestrians individual</title>
<rect x="64" y="150" width="1152" height="60" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="166" width="5" height="28" rx="2" fill="#4F8CFF"/>
<text x="90" y="186" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" fill="#EAF1FF">To move safely among people, a robot must perceive nearby pedestrians as individual 3D entities — and predict where they go next.</text>
</g>
<g id="cue_s02_c2_problem_datasets_used_train_these">
<title>Datasets used to train these models do not reflect the robot&apos;s real situation — problem datasets used train these models don reflect robot real</title>
<rect x="64" y="222" width="1152" height="48" rx="14" fill="#5A2130" stroke="#F87171" stroke-width="1"/>
<text x="90" y="252" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FF">The problem: the datasets used to train these models don&apos;t reflect the robot&apos;s real situation.</text>
</g>
<g id="cue_s02_c3_popular_pedestrian_datasets_like_eth">
<title>ETH UCY SDD fixed rooftop cameras never see interaction — popular pedestrian datasets like eth ucy sdd captured fixed cameras</title>
<rect x="64" y="288" width="560" height="242" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="304" width="5" height="210" rx="2" fill="#A78BFA"/>
<text x="92" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#A78BFA">Fixed top-view cameras</text>
<text x="92" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#9DB0D0">ETH · UCY · SDD</text>
<circle cx="104" cy="380" r="4" fill="#A78BFA"/>
<text x="118" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">Mounted high on rooftops or drones</text>
<circle cx="104" cy="414" r="4" fill="#A78BFA"/>
<text x="118" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">A bird&apos;s-eye view of a plaza or street</text>
<circle cx="104" cy="448" r="4" fill="#A78BFA"/>
<text x="118" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">The device never enters the scene</text>
<circle cx="104" cy="482" r="4" fill="#A78BFA"/>
<text x="118" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">So they never see human-robot interaction</text>
</g>
<g id="cue_s02_c4_large_autonomous_driving_datasets_pr">
<title>Autonomous-driving datasets separate roads rarely close contact — large autonomous-driving datasets provide rich sensor but vehicle pedestrians usually</title>
<rect x="644" y="288" width="572" height="242" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="644" y="304" width="5" height="210" rx="2" fill="#FBBF24"/>
<text x="672" y="324" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FBBF24">Autonomous-driving data</text>
<text x="672" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#9DB0D0">nuScenes · Waymo · Argoverse</text>
<circle cx="684" cy="380" r="4" fill="#FBBF24"/>
<text x="698" y="384" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">Rich multi-sensor data from a moving car</text>
<circle cx="684" cy="414" r="4" fill="#FBBF24"/>
<text x="698" y="418" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">But car and pedestrians use separate roads</text>
<circle cx="684" cy="448" r="4" fill="#FBBF24"/>
<text x="698" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">They rarely come into close contact</text>
<circle cx="684" cy="482" r="4" fill="#FBBF24"/>
<text x="698" y="486" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#EAF1FF">Neither setting matches a robot in a crowd</text>
