<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="0" y="0" width="1280" height="6" fill="#4F8CFF"/></g>
<text x="64" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4F8CFF" letter-spacing="3">TAKEAWAY</text>
<text x="64" y="104" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#EAF1FF">Data From the Crowd, Not the Rooftop</text>
<line x1="64" y1="122" x2="364" y2="122" stroke="#2A3B5C" stroke-width="2" stroke-linecap="round"/>
<text x="1216" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#6E82A6" text-anchor="end" letter-spacing="2">09 / 10</text>
<g id="cue_s10_c1_takeaway_simple">
<title>Takeaway is simple — takeaway simple</title>
<rect x="64" y="150" width="820" height="112" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="166" width="5" height="80" rx="2" fill="#4F8CFF"/>
<text x="92" y="190" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#4F8CFF">The takeaway is simple</text>
<text x="92" y="220" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">Social navigation needs data that shows the robot up close in the crowd —</text>
<text x="92" y="242" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">not a camera bolted to a building.</text>
</g>
<g id="cue_s10_c2_you_want_build_robots_move">
<title>Robots move safely close crowd sensors aligned scene map — you want build robots move safely gracefully among people you</title>
<rect x="64" y="276" width="820" height="112" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="292" width="5" height="80" rx="2" fill="#34D399"/>
<text x="92" y="316" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#34D399">What such data must have</text>
<text x="92" y="346" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">To build robots that move safely and gracefully among people, you need</text>
<text x="92" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">close-crowd trajectories, sensors aligned in time, and the surrounding</text>
<text x="92" y="390" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">scene captured as a map.</text>
</g>
<g id="cue_s10_c3_sit_first_dataset_deliver_combinatio">
<title>SiT first dataset deliver combination benchmark publicly released — sit first dataset deliver combination together benchmark spans detection tracking</title>
<rect x="64" y="402" width="820" height="112" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="418" width="5" height="80" rx="2" fill="#A78BFA"/>
<text x="92" y="442" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#A78BFA">SiT is the first to deliver it</text>
<text x="92" y="472" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">SiT is the first dataset to combine all three, with a benchmark spanning</text>
<text x="92" y="494" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">detection, tracking, prediction, and end-to-end forecasting — all publicly</text>
<text x="92" y="516" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">released.</text>
</g>
<rect x="908" y="150" width="308" height="376" rx="14" fill="#1B2B47" stroke="#2A3B5C" stroke-width="1"/>
<text x="1062" y="196" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#EAF1FF" text-anchor="middle">SiT</text>
<text x="1062" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#9DB0D0" text-anchor="middle">robot in the crowd</text>
<line x1="958" y1="244" x2="1166" y2="244" stroke="#2A3B5C" stroke-width="1" stroke-linecap="round"/>
<text x="958" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#6E82A6">scenes</text>
<text x="1166" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F8CFF" text-anchor="end">60</text>
<line x1="958" y1="306" x2="1166" y2="306" stroke="#2A3B5C" stroke-width="1" stroke-linecap="round"/>
<text x="958" y="344" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#6E82A6">sensors</text>
<text x="1166" y="344" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#34D399" text-anchor="end">LiDAR+cam+RTK</text>
<line x1="958" y1="360" x2="1166" y2="360" stroke="#2A3B5C" stroke-width="1" stroke-linecap="round"/>
<text x="958" y="398" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#6E82A6">maps</text>
<text x="1166" y="398" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#A78BFA" text-anchor="end">12 layers</text>
<line x1="958" y1="414" x2="1166" y2="414" stroke="#2A3B5C" stroke-width="1" stroke-linecap="round"/>
<text x="958" y="452" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#6E82A6">benchmark</text>
<text x="1166" y="452" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="end">4 tasks</text>
<line x1="958" y1="468" x2="1166" y2="468" stroke="#2A3B5C" stroke-width="1" stroke-linecap="round"/>
<text x="1062" y="516" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#6E82A6" text-anchor="middle">github.com/SPALaboratory/SiT-Dataset</text>
</svg>
