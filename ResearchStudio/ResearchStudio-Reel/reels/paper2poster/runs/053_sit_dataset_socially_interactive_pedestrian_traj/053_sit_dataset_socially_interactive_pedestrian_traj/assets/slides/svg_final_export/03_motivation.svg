<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="0" y="0" width="1280" height="6" fill="#4F8CFF"/></g>
<text x="64" y="62" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4F8CFF" letter-spacing="3">MOTIVATION</text>
<text x="64" y="104" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#EAF1FF">Interaction Only Appears Up Close</text>
<line x1="64" y1="122" x2="364" y2="122" stroke="#2A3B5C" stroke-width="2" stroke-linecap="round"/>
<text x="1216" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#6E82A6" text-anchor="end" letter-spacing="2">02 / 10</text>
<g id="cue_s03_c1_studies_human_robot_interaction_show">
<title>Studies show robot motion changes how nearby people walk — studies human-robot interaction show robot motion changes how nearby people</title>
<rect x="64" y="150" width="560" height="190" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="166" width="5" height="158" rx="2" fill="#34D399"/>
<text x="92" y="186" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34D399">Interaction is real</text>
<text x="92" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">Human-robot interaction studies show a robot&apos;s</text>
<text x="92" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">motion changes how nearby people walk — and the</text>
<text x="92" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">effect is strongest when robot and pedestrians</text>
<text x="92" y="288" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">share the same space, up close.</text>
</g>
<g id="cue_s03_c2_study_need_collected_while_robot">
<title>Need data collected from a moving robot inside real crowds — study need collected while robot actually moves through crowds not</title>
<rect x="644" y="150" width="572" height="190" rx="14" fill="#2A4A8A" stroke="#4F8CFF" stroke-width="1"/>
<text x="672" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4F8CFF" letter-spacing="2">WHAT WE NEED</text>
<text x="672" y="216" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FF">To study and model that behavior, we need data</text>
<text x="672" y="241" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FF">collected while a robot actually moves through</text>
<text x="672" y="266" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FF">crowds — not from a camera bolted to a building.</text>
</g>
<g id="cue_s03_c3_earlier_robot_datasets_came_close">
<title>STCrowd fixed position and JRDB no trajectories not synced — earlier robot datasets came close but had gap stcrowd kept</title>
<rect x="64" y="364" width="772" height="150" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="380" width="5" height="118" rx="2" fill="#F87171"/>
<text x="92" y="400" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F87171">Prior robot datasets came close — but each had a gap</text>
<text x="92" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#EAF1FF">STCrowd</text>
<text x="92" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">Sensors kept at a fixed position →</text>
<text x="92" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">scenes barely varied.</text>
<line x1="452" y1="428" x2="452" y2="500" stroke="#2A3B5C" stroke-width="1" stroke-linecap="round"/>
<text x="474" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#EAF1FF">JRDB</text>
<text x="474" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">Not organized into trajectories; sensors</text>
<text x="474" y="484" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">not fully time-synchronized → limits fusion.</text>
</g>
<g id="cue_s03_c4_sit_designed_specifically_fill_these">
<title>SiT designed specifically to fill these gaps — sit designed specifically fill these gaps</title>
<rect x="856" y="364" width="360" height="150" rx="14" fill="#14532D" stroke="#34D399" stroke-width="1"/>
<text x="880" y="404" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#34D399">SiT</text>
<text x="880" y="440" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FF">is designed specifically to</text>
<text x="880" y="464" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#EAF1FF">fill these gaps.</text>
</g>
</svg>
