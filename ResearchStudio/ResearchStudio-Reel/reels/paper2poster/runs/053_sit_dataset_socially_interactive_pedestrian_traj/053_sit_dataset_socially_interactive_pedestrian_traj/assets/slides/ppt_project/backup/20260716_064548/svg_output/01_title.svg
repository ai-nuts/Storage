<text x="64" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#6E82A6" letter-spacing="1">NeurIPS 2023 · Datasets &amp; Benchmarks</text>
<g id="cue_s01_c1_social_navigation_robots_move_safely">
<title>SiT title and social-navigation framing — social navigation robots move safely through crowds means perceiving predicting</title>
<text x="64" y="196" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#EAF1FF">SiT Dataset</text>
<text x="64" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#9DB0D0">Socially Interactive Pedestrian Trajectory</text>
<text x="64" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#9DB0D0">for Social Navigation Robots</text>
<rect x="64" y="286" width="90" height="5" rx="2" fill="#4F8CFF"/>
<text x="64" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#EAF1FF">Trajectories recorded by a robot moving through real crowds —</text>
<text x="64" y="352" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#EAF1FF">perceiving and predicting the people around it, up close.</text>
<text x="64" y="384" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#6E82A6">Bae, Kim, Yun, Kang, Choi, Kim, Lee, Choi, Choi</text>
</g>
<rect x="64" y="452" width="168" height="168" rx="12" fill="#FFFFFF"/>
<image href="data:image/png;base64," x="72" y="460" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>
<text x="256" y="508" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#9DB0D0" letter-spacing="2">SCAN FOR CODE</text>
<text x="256" y="534" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4F8CFF">github.com/SPALaboratory/SiT-Dataset</text>
<text x="256" y="588" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#6E82A6" font-style="italic">Dataset · dev-kit · baselines released publicly.</text>
<g id="cue_s01_c2_introduces_sit_dataset_short_sociall">
<title>SiT dataset introduced short socially interactive — introduces sit dataset short socially interactive pedestrian trajectory</title>
<rect x="676" y="150" width="540" height="150" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="676" y="166" width="5" height="118" rx="2" fill="#4F8CFF"/>
<text x="702" y="186" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4F8CFF" letter-spacing="2">WHAT IT IS</text>
<text x="702" y="216" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">The SiT dataset — Socially Interactive Pedestrian</text>
<text x="702" y="240" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">Trajectory — captures genuine human-robot</text>
<text x="702" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">interaction as a robot navigates crowds.</text>
</g>
<g id="cue_s01_c3_unlike_earlier_trajectory_datasets_c">
<title>Unlike earlier trajectory datasets mobile robot Seoul — unlike earlier trajectory datasets captured fixed rooftop cameras cars driving</title>
<rect x="676" y="318" width="540" height="150" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="676" y="334" width="5" height="118" rx="2" fill="#34D399"/>
<text x="702" y="354" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#34D399" letter-spacing="2">WHY IT IS NEW</text>
<text x="702" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">Unlike fixed rooftop cameras or cars on separate</text>
<text x="702" y="408" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">roads, SiT was recorded by a mobile robot in</text>
<text x="702" y="432" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">densely populated indoor and outdoor Seoul.</text>
</g>
<g id="cue_s01_c4_ships_synchronized_lidar_camera_imu">
<title>Ships synchronized LiDAR camera IMU RTK benchmark — ships synchronized lidar camera imu rtk 2 3 annotations semantic</title>
<rect x="676" y="486" width="540" height="150" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="676" y="502" width="5" height="118" rx="2" fill="#FBBF24"/>
<text x="702" y="522" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" letter-spacing="2">WHAT IT SHIPS</text>
<text x="702" y="552" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">Synchronized LiDAR, camera, IMU and RTK, 2D and 3D</text>
<text x="702" y="576" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">annotations, semantic maps, and a benchmark from</text>
<text x="702" y="600" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#EAF1FF">detection to end-to-end forecasting.</text>
</g>
</svg>
