<g id="cue_s06_c2_clip_twenty_seconds_sequential_sampl">
<title>Twenty-second clips at ten hertz yield nine-second trajectories — clip twenty seconds sequential sampled ten hertz producing nine seconds</title>
<rect x="644" y="150" width="572" height="168" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="644" y="166" width="5" height="136" rx="2" fill="#34D399"/>
<text x="672" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#34D399">Clip structure</text>
<text x="672" y="232" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#34D399">20 s</text>
<text x="760" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1FF">of sequential data at 10 Hz</text>
<text x="672" y="272" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#9DB0D0">→  9 s of trajectory, represented as pose vectors.</text>
<text x="672" y="300" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#6E82A6" font-style="italic">On top of this data, the paper defines four benchmarks.</text>
</g>
<g id="cue_s06_c3_three_d_pedestrian_detection_scored">
<title>3D detection distance-based AP and 3D multi-object tracking — three-d pedestrian detection scored average precision based center distance thresholds</title>
<rect x="64" y="338" width="560" height="192" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="64" y="354" width="5" height="160" rx="2" fill="#4F8CFF"/>
