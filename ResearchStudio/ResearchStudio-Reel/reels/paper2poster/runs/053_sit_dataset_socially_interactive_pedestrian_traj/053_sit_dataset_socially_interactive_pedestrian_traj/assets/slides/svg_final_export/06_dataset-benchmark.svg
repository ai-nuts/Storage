<text x="92" y="410" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#EAF1FF">1 · 3D pedestrian detection</text>
<text x="110" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">AP on center distance @ 0.25 / 0.5 / 1 / 2 m</text>
<text x="92" y="472" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#EAF1FF">2 · 3D multi-object tracking</text>
<text x="110" y="494" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">Standard MOT metrics (sAMOTA, AMOTA, MOTA…)</text>
</g>
<g id="cue_s06_c4_trajectory_prediction_takes_two_seco">
<title>Trajectory prediction two seconds past seven ahead end-to-end — trajectory prediction takes two seconds past motion predicts seven seconds</title>
<rect x="644" y="338" width="572" height="192" rx="14" fill="#152238" stroke="#2A3B5C" stroke-width="1"/>
<rect x="644" y="354" width="5" height="160" rx="2" fill="#A78BFA"/>
<text x="672" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#A78BFA">Forecasting benchmarks</text>
<text x="672" y="410" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#EAF1FF">3 · Trajectory prediction</text>
<text x="690" y="432" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#9DB0D0">2 s of past → 7 s ahead, ADE / FDE over best-of-K</text>
