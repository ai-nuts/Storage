<text x="90" y="184" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#EAF1FF">Dataset scale</text>
<text x="104" y="236" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#4F8CFF">60</text>
<text x="104" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9DB0D0">scenes</text>
<text x="272" y="236" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#34D399">60K</text>
<text x="272" y="258" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#9DB0D0">images</text>
