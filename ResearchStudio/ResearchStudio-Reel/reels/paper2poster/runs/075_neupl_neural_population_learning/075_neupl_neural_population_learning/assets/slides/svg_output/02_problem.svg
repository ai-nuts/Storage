<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">PROBLEM</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Iterative best-response breaks down</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  02 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s02_c1_classical_population_learning_method"><title>classical population-learning methods such policy space response oracles grow set</title><rect x="56" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="82.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Classical PSRO</text><text x="82.0" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Policy Space Response Oracles grow a set of strategies</text><text x="82.0" y="270.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">by repeatedly training a best-response to the current</text><text x="82.0" y="294.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">mixture.</text></g><g id="cue_s02_c2_toy_normal_form_games_works_cleanly"><title>toy normal-form games works cleanly because best-responses solved exactly</title><rect x="654" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="680.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Fine in toy games</text><text x="680.0" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">In toy normal-form games this works cleanly, because a</text><text x="680.0" y="270.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">best-response can be solved for exactly.</text></g><g id="cue_s02_c3_but_real_world_games_temporal_partia"><title>but real-world games temporal partially observed best-responses only approximated expensive</title><rect x="56" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="454" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="82.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">But not in real games</text><text x="82.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Real games are temporal and partially observed, so</text><text x="82.0" y="538.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">best-responses can only be approximated — slowly and</text><text x="82.0" y="562.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">expensively.</text></g><g id="cue_s02_c4_creates_two_failures_under_finite"><title>creates two failures under finite budget you cannot tell truly</title><rect x="654" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="454" width="5" height="30" rx="2.5" fill="#E0655B"/><text x="680.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Two failure modes</text><text x="680.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Under a finite budget you cannot tell a converged</text><text x="680.0" y="538.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">best-response from a stuck one, and each iteration</text><text x="680.0" y="562.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">relearns skills from scratch.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Approximate best-responses truncated on hand-crafted schedules leave under-trained policies in the population.</text></svg>