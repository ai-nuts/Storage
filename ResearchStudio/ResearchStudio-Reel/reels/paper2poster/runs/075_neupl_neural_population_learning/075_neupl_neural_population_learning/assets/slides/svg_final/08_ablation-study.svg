<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">ABLATION STUDY</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Transfer is what makes it work</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  08 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s08_c1_key_ablation_isolates_role_transfer"><title>key ablation isolates role transfer neupl agents re-initialized either scratch</title><rect x="56" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="82.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">The setup</text><text x="82.0" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">NeuPL agents are re-initialized either from scratch</text><text x="82.0" y="270.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">or by transferring encoder and memory from a trained</text><text x="82.0" y="294.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">NeuPL network.</text></g><g id="cue_s08_c2_against_easily_exploitable_two_polic"><title>against easily exploitable two-policy mixture even from-scratch agent eventually finds</title><rect x="654" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="680.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Easy opponents: both win</text><text x="680.0" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Against an easily exploitable two-policy mixture,</text><text x="680.0" y="270.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">even the from-scratch agent eventually finds a</text><text x="680.0" y="294.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">counter — just slower.</text></g><g id="cue_s08_c3_but_against_competent_mixtures_over"><title>but against competent mixtures over four seven policies randomly initialized</title><rect x="56" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="454" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="82.0" y="478.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Hard opponents: scratch collapses</text><rect x="96" y="518" width="46" height="108" rx="4" fill="#E0655B"/><rect x="150" y="512" width="46" height="114" rx="4" fill="#49C08A"/><text x="146.0" y="646.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="middle">n=2</text><rect x="264" y="608" width="46" height="18" rx="4" fill="#E0655B"/><rect x="318" y="524" width="46" height="102" rx="4" fill="#49C08A"/><text x="314.0" y="646.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="middle">n=4</text><rect x="432" y="620" width="46" height="6" rx="4" fill="#E0655B"/><rect x="486" y="530" width="46" height="96" rx="4" fill="#49C08A"/><text x="482.0" y="646.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="middle">n=7</text><line x1="96" y1="626" x2="560" y2="626" stroke="#1E3E5A"/><text x="82.0" y="662.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#E0655B" text-anchor="start">scratch</text><text x="176.0" y="662.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#49C08A" text-anchor="start">transfer</text></g><g id="cue_s08_c4_neupl_most_striking_property_populat"><title>neupl most striking property population expands discovering new strategies becomes</title><rect x="654" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="454" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="680.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">The striking property</text><text x="680.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">As the population expands, discovering new</text><text x="680.0" y="538.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">strategies becomes easier — growth compounds instead</text><text x="680.0" y="562.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">of getting harder.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Against competent mixtures over four or seven policies, the randomly initialized agent fails outright.</text></svg>