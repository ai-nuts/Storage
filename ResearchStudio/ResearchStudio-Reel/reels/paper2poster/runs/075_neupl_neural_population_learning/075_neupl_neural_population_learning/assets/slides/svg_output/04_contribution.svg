<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">CONTRIBUTION</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Three contributions</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  04 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s04_c1_neupl_makes_three_contributions"><title>neupl makes three contributions</title><rect x="56" y="168" width="1168" height="78" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="216.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">NeuPL turns population learning into one shared, conditional model — with three consequences.</text></g><g id="cue_s04_c2_first_single_conditional_represents"><title>first single conditional represents whole population policies conditioned meta-game mixture</title><rect x="56" y="270" width="348" height="280" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="288" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="80.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">1 · One conditional model</text><text x="80.0" y="352.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">A single network represents a</text><text x="80.0" y="377.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">whole population of policies, each</text><text x="80.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">conditioned on a meta-game mixture</text><text x="80.0" y="427.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">over opponents.</text></g><g id="cue_s04_c3_second_unifying_framework_choosing_i"><title>second unifying framework choosing interaction graph you recover self-play fictitious</title><rect x="466" y="270" width="348" height="280" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="466" y="288" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="490.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">2 · A unifying framework</text><text x="490.0" y="352.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Choosing the interaction graph</text><text x="490.0" y="377.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">recovers self-play, fictitious</text><text x="490.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">play, and PSRO as special cases of</text><text x="490.0" y="427.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">one method.</text></g><g id="cue_s04_c4_third_comes_convergence_guarantees_g"><title>third comes convergence guarantees grounded lower-triangular interaction graphs suitable meta-graph</title><rect x="876" y="270" width="348" height="280" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="876" y="288" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="900.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">3 · Convergence guarantees</text><text x="900.0" y="352.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">For grounded, lower-triangular</text><text x="900.0" y="377.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">interaction graphs and a suitable</text><text x="900.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">meta-solver, the population</text><text x="900.0" y="427.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">provably converges.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">The meta-graph solver — not a hand-tuned schedule — decides the effective population size.</text></svg>