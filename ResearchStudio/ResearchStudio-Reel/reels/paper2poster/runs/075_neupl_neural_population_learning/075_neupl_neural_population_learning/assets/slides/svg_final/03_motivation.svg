<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">MOTIVATION</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Policies overlap — so share them</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  03 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s03_c1_need_population_strategies_rooted_ga"><title>need population strategies rooted game theory purely cyclic game like</title><rect x="56" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="82.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Why a population at all</text><text x="82.0" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Game theory demands it: in a cyclic game like</text><text x="82.0" y="270.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">rock-paper-scissors no single policy is unbeatable, so</text><text x="82.0" y="294.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">you need many.</text></g><g id="cue_s03_c2_prior_frameworks_handle_policies_one"><title>prior frameworks handle policies one time discarding shared knowledge between</title><rect x="654" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="186" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="680.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Prior frameworks waste it</text><text x="680.0" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">They train policies one at a time and discard the</text><text x="680.0" y="270.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">knowledge shared between them, relearning perception</text><text x="680.0" y="294.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">each round.</text></g><g id="cue_s03_c3_neupl_insight_these_policies_overlap"><title>neupl insight these policies overlap enormously they share perception memory</title><rect x="56" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="454" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">The key insight</text><text x="82.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">These policies overlap enormously — they share</text><text x="82.0" y="538.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">perception, memory, and motor skills that need not be</text><text x="82.0" y="562.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">relearned.</text></g><g id="cue_s03_c4_single_could_hold_whole_population"><title>single could hold whole population condition its behaviour which opponents</title><rect x="654" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="454" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="680.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">The consequence</text><text x="680.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">If one model held the whole population and conditioned</text><text x="680.0" y="538.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">on which opponent it faces, early skills would</text><text x="680.0" y="562.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">transfer for free.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Empirical successes like StarCraft leagues used ~1000 agents at enormous cost — motivating a far cheaper alternative.</text></svg>