<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">HEADLINE NUMBERS</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">The numbers</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  09 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s09_c1_put_numbers_neupl_population_capped"><title>put numbers neupl population capped eight policies beats psro populations</title><rect x="56" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9FB6CC" text-anchor="start">Population match</text><text x="82.0" y="300.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#2FB6A8" text-anchor="start">8 vs 8</text><text x="82.0" y="344.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">A NeuPL population capped at 8 policies beats PSRO</text><text x="82.0" y="366.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">populations of 8 — while PSRO used 2× the gradient</text><text x="82.0" y="388.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">updates.</text></g><g id="cue_s09_c2_relative_population_performance_clim"><title>relative population performance climbs effective number distinct policies grows five</title><rect x="654" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="186" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="680.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9FB6CC" text-anchor="start">Effective diversity</text><text x="680.0" y="300.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#4C86F0" text-anchor="start">5 → 8</text><text x="680.0" y="344.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">As relative population performance climbs, the</text><text x="680.0" y="366.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">effective number of distinct policies grows from five</text><text x="680.0" y="388.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">to eight.</text></g><g id="cue_s09_c3_transfer_study_spans_nash_mixtures"><title>transfer study spans nash mixtures over two four seven policies</title><rect x="56" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="454" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="82.0" y="482.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9FB6CC" text-anchor="start">Transfer study</text><text x="82.0" y="568.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#E0A93B" text-anchor="start">2 / 4 / 7</text><text x="82.0" y="612.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">Nash mixtures over two, four, and seven policies, each</text><text x="82.0" y="634.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">repeated five times to measure exploiter learning.</text></g><g id="cue_s09_c4_together_these_establish_neupl_more"><title>together these establish neupl more sample-efficient more robust standard iterative</title><rect x="654" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="454" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="680.0" y="482.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#9FB6CC" text-anchor="start">Bottom line</text><text x="680.0" y="568.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#49C08A" text-anchor="start">✓</text><text x="680.0" y="612.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">Together these establish NeuPL as more</text><text x="680.0" y="634.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">sample-efficient and more robust than standard</text><text x="680.0" y="656.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">iterative baselines.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">A population cap greater than 8 yields only marginal extra exploitability; effective size plateaus around 12.</text></svg>