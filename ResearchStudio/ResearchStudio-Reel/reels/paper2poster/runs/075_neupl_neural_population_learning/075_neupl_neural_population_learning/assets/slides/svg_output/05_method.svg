<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">METHOD</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">One opponent-conditioned network</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  05 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s05_c1_concretely_neupl_trains_one_opponent"><title>concretely neupl trains one opponent-conditioned network policy index paired meta-strategy</title><rect x="56" y="168" width="1168" height="176" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="208.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Policy index i  +  meta-strategy σ_i  →  one shared network Πθ</text><rect x="96" y="242" width="150" height="62" rx="9" fill="#0F2236" stroke="#4C86F0" stroke-width="1.6"/><text x="171.0" y="278.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#EAF2FA" text-anchor="middle">observation o</text><line x1="252" y1="273.0" x2="298" y2="273.0" stroke="#9FB6CC" stroke-width="2"/><polygon points="298,268.0 298,278.0 306,273.0" fill="#9FB6CC"/><rect x="304" y="242" width="150" height="62" rx="9" fill="#0F2236" stroke="#E0A93B" stroke-width="1.6"/><text x="379.0" y="278.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#EAF2FA" text-anchor="middle">meta-strategy σ_i</text><line x1="460" y1="273.0" x2="506" y2="273.0" stroke="#9FB6CC" stroke-width="2"/><polygon points="506,268.0 506,278.0 514,273.0" fill="#9FB6CC"/><rect x="512" y="242" width="150" height="62" rx="9" fill="#0F2236" stroke="#2FB6A8" stroke-width="1.6"/><text x="587.0" y="278.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#EAF2FA" text-anchor="middle">shared net Πθ</text><line x1="668" y1="273.0" x2="714" y2="273.0" stroke="#9FB6CC" stroke-width="2"/><polygon points="714,268.0 714,278.0 722,273.0" fill="#9FB6CC"/><rect x="720" y="242" width="150" height="62" rx="9" fill="#0F2236" stroke="#49C08A" stroke-width="1.6"/><text x="795.0" y="278.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#EAF2FA" text-anchor="middle">action aᵢ</text></g><g id="cue_s05_c2_network_maximizes_discounted_return"><title>network maximizes discounted return under double expectation first over sampled</title><rect x="56" y="362" width="570" height="176" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="380" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="82.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Objective: discounted return, double expectation</text><rect x="80" y="420" width="522" height="52" rx="8" fill="#0F2236" stroke="#1E3E5A"/><text x="96.0" y="452.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="19" font-weight="normal" fill="#2FB6A8" text-anchor="start">max_θ  E_{j~σ_i} E_{τ} [ sum_t γ^t r_t ]</text><text x="82.0" y="500.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">First over the sampled opponent j, then over the</text><text x="82.0" y="522.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">trajectory τ that unfolds.</text></g><g id="cue_s05_c3_optimize_reinforcement_learning_neup"><title>optimize reinforcement learning neupl jointly trains opponent-conditioned action-value function additionally</title><rect x="654" y="362" width="570" height="176" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="380" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="680.0" y="406.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Trained by RL</text><text x="680.0" y="440.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">NeuPL jointly trains an opponent-conditioned</text><text x="680.0" y="464.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">action-value function Qθ(o,a|σ_i) to optimize the</text><text x="680.0" y="488.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">objective end-to-end.</text></g><g id="cue_s05_c4_interaction_graph_assigns_opponents"><title>interaction graph assigns opponents fixed matrix reproducing fictitious play adaptive</title><rect x="56" y="556" width="1168" height="128" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="574" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="82.0" y="596.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">The interaction graph Σ assigns who plays whom</text><text x="82.0" y="626.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">A fixed matrix reproduces fictitious play; an adaptive graph Σ←F(U) from a meta-solver (e.g. FPSRO-N) reproduces PSRO</text><text x="82.0" y="650.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">— all inside one network.</text></g></svg>