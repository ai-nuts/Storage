<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="1">ICLR 2022  ·  UNIVERSITY COLLEGE LONDON / DEEPMIND</text><g id="cue_s01_c1_neupl_neural_population_learning_pub"><title>neupl neural population learning published iclr 2022 researchers university college</title><text x="78.0" y="150.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#EAF2FA" text-anchor="start">NeuPL: Neural Population Learning</text><text x="78.0" y="196.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="normal" fill="#9FB6CC" text-anchor="start">One conditional network that holds an entire population of policies</text></g><g id="cue_s01_c2_learning_play_strategy_games_like"><title>learning play strategy games like starcraft poker requires discovering whole</title><rect x="56" y="250" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="268" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="80.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">Why populations</text><text x="80.0" y="332.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Playing StarCraft or poker well</text><text x="80.0" y="357.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">needs a whole population of</text><text x="80.0" y="382.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">diverse policies, not one</text><text x="80.0" y="407.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">strategy.</text></g><g id="cue_s01_c3_usual_recipe_grows_population_iterat"><title>usual recipe grows population iteratively fresh policy beat previous ones</title><rect x="466" y="250" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="466" y="268" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="490.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">The usual recipe</text><text x="490.0" y="332.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Prior work grows the population by</text><text x="490.0" y="357.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">iteratively best-responding to</text><text x="490.0" y="382.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">previous policies — costly and</text><text x="490.0" y="407.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">forgetful.</text></g><g id="cue_s01_c4_neupl_solves_both_problems_represent"><title>neupl solves both problems representing entire population inside single conditional</title><rect x="876" y="250" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="876" y="268" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="900.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">NeuPL&#x27;s answer</text><text x="900.0" y="332.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Represent the entire population</text><text x="900.0" y="357.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">inside a single conditional</text><text x="900.0" y="382.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">network so policies share and</text><text x="900.0" y="407.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">transfer skill.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Liu, Marris, Lanctot, Piliouras, Marecki, Heess, Munos, Perez-Nieves — Neural Population Learning (ICLR 2022)</text></svg>