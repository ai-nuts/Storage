y="346.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Rock-paper-scissors</text><text x="80.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">The classic purely cyclic</text><text x="80.0" y="409.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">normal-form game. The learned</text><text x="80.0" y="434.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">population can be directly</text><text x="80.0" y="459.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">visualized in strategy space.</text></g><g id="cue_s06_c3_running_with_scissors_lifts_spatiote"><title>running-with-scissors lifts spatiotemporal partially observed setting players move grid collect</title><rect x="466" y="262" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="466" y="280" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="490.0" y="306.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#2FB6A8" text-anchor="start">2</text><text x="490.0" y="346.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Running-with-scissors</text><text x="490.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">A spatiotemporal, partially</text><text x="490.0" y="409.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">observed game: players move on a</text><text x="490.0" y="434.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">grid, collect items, and infer a</text><text x="490.0" y="459.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">hidden inventory.</text></g><g id="cue_s06_c4_finally_mujoco_football_large_scale"><title>finally mujoco football large-scale game-of-skills where two-versus-two teams must simultaneously</title><rect x="876" y="262" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="876" y="280" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="900.0" y="306.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#E0A93B" text-anchor="start">3</text><text x="900.0" y="346.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">MuJoCo Football (2v2)</text><text x="900.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">A large-scale Game-of-Skills where</text><text x="900.0" y="409.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">two-versus-two teams must</text><text x="900.0" y="434.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">simultaneously master control and</text><text x="900.0" y="459.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">coordination.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Running-with-scissors gives each player only a 4×4 first-person view and requires inferring the opponent&#x27;s hidden inventory.</text></svg>