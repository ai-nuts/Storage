<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">KEY RESULT</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">More efficient and more robust</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">NeuPL  ·  07 / 10</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s07_c1_headline_result_neupl_both_more"><title>headline result neupl both more efficient more robust comparable psro</title><rect x="56" y="168" width="1168" height="66" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="208.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Headline: with only 8 policies, NeuPL is both more efficient and more robust than comparable PSRO.</text></g><g id="cue_s07_c2_maximum_population_eight_policies_ne"><title>maximum population eight policies neupl population successfully exploits psro populations</title><rect x="56" y="250" width="570" height="292" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="268" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="82.0" y="292.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Population 8: NeuPL exploits PSRO</text><text x="82.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">despite half the gradient updates</text><text x="96.0" y="344.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">NeuPL updates</text><rect x="96" y="350" width="400" height="26" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="96" y="350" width="200" height="26" rx="5" fill="#2FB6A8"/><text x="308.0" y="369.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start">1×</text><text x="96.0" y="400.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">PSRO updates</text><rect x="96" y="406" width="400" height="26" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="96" y="406" width="400" height="26" rx="5" fill="#E0A93B"/><text x="508.0" y="425.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#E0A93B" text-anchor="start">2×</text><text x="82.0" y="512.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#49C08A" text-anchor="start">Outcome: NeuPL beats PSRO on the same 8 policies</text></g><g id="cue_s07_c3_crucially_gain_relative_population_p"><title>crucially gain relative population performance coincides growth effective population size</title><rect x="654" y="250" width="570" height="292" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="268" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="680.0" y="292.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Gains track effective population size</text><line x1="704" y1="330" x2="704" y2="458" stroke="#1E3E5A" stroke-width="1.2"/><line x1="704" y1="458" x2="1164" y2="458" stroke="#1E3E5A" stroke-width="1.2"/><polyline points="704,426 856,394 1008,356 1164,330" fill="none" stroke="#49C08A" stroke-width="3"/><circle cx="704" cy="426" r="4" fill="#49C08A"/><circle cx="856" cy="394" r="4" fill="#49C08A"/><circle cx="1008" cy="356" r="4" fill="#49C08A"/><circle cx="1164" cy="330" r="4" fill="#49C08A"/><text x="694.0" y="430.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="end">5</text><text x="694.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="end">8</text><text x="704.0" y="484.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">training  →  effective policies grow 5 to 8</text><text x="680.0" y="522.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">Relative population performance rises with diversity</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Both continued-training and from-scratch PSRO variants prove equally exploitable — they fail to build on prior skill.</text><g id="cue_s07_c4_both_continued_training_from_scratch"><title>both continued-training from-scratch psro variants prove equally exploitable suggesting they</title><rect x="820" y="556" width="404" height="120" rx="10" fill="#0F2236" stroke="#1E3E5A"/><rect x="820" y="574" width="5" height="30" rx="2.5" fill="#E0655B"/><text x="842.0" y="596.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#EAF2FA" text-anchor="start">Both PSRO variants: equally exploitable</text><text x="842.0" y="624.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Continued-training and from-scratch alike</text><text x="842.0" y="645.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">fail to accumulate skill across</text><text x="842.0" y="666.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">iterations.</text></g></svg>