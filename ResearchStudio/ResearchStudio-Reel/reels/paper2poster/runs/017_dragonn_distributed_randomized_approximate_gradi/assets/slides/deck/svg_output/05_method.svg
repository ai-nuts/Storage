<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Hash gradients straight into a buffer</text><g id="cue_s05_c1_dragonn_works_pre_allocating_small_m"><title>dragonn works pre-allocating small memory buffer sized compression ratio gradient</title><rect x="64" y="158" width="560" height="232" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="232" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Pre-allocate, then hash-and-write</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Allocate a small buffer sized to the compression ratio. For each</text><text x="92" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">gradient whose |value| clears the threshold, hash its index</text><text x="92" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">directly to a slot and write it — no scan for nonzero positions.</text><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="start">two indices hash to one slot — the later write wins</text><rect x="92" y="316" width="58" height="20" rx="6" fill="#16324A" stroke="#34D3C0" stroke-width="1.4"/><text x="121" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#34D3C0" font-weight="800" text-anchor="middle">i=9</text><rect x="92" y="342" width="58" height="20" rx="6" fill="#16324A" stroke="#F2C14E" stroke-width="1.4"/><text x="121" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="800" text-anchor="middle">i=17</text><rect x="186" y="329" width="54" height="20" rx="10" fill="#0E2334" stroke="#4C9BE8" stroke-width="1.2"/><text x="213" y="343" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#4C9BE8" font-weight="800" text-anchor="middle">hash</text><line x1="150" y1="326" x2="186" y2="337" stroke="#34D3C0" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="150" y1="352" x2="186" y2="341" stroke="#F2C14E" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/><text x="386" y="321" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="start">buffer</text><rect x="386" y="329" width="30" height="26" rx="5" fill="#16324A" stroke="#26455F" stroke-width="1"/><rect x="422" y="329" width="30" height="26" rx="5" fill="#16324A" stroke="#26455F" stroke-width="1"/><rect x="458" y="329" width="30" height="26" rx="5" fill="#16324A" stroke="#26455F" stroke-width="1"/><rect x="494" y="329" width="30" height="26" rx="5" fill="#2A2417" stroke="#F2C14E" stroke-width="1.4"/><text x="509.0" y="347" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="middle">17</text><rect x="530" y="329" width="30" height="26" rx="5" fill="#16324A" stroke="#26455F" stroke-width="1"/><rect x="566" y="329" width="30" height="26" rx="5" fill="#16324A" stroke="#26455F" stroke-width="1"/><line x1="240" y1="339" x2="494" y2="342" stroke="#4C9BE8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/></g><g id="cue_s05_c2_two_indices_collide_later_one"><title>two indices collide later one simply overwrites earlier any slot</title><rect x="64" y="404" width="560" height="146" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="404" width="6" height="146" rx="6" fill="#F2C14E"/><text x="92" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Collisions are cheap by design</text><text x="92" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">If two indices hash to the same slot, the later write</text><text x="92" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">overwrites the earlier one; any slot left empty maps to</text><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">zero.</text><rect x="92" y="508" width="504" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344.0" y="532.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">collision -&gt; overwrite      empty slot (-1) -&gt; 0</text></g><g id="cue_s05_c3_because_writing_memory_atomic_operat"><title>because writing memory atomic operation gpus many threads hash write</title><rect x="656" y="158" width="560" height="214" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="656" y="158" width="6" height="214" rx="6" fill="#34D3C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Embarrassingly parallel on the GPU</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Because GPU memory writes are atomic, many threads hash</text><text x="684" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and write at once with no ordering dependency, so the</text><text x="684" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">whole compression needs only d comparisons plus l</text><text x="684" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">hashes.</text><rect x="684" y="308" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="336.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">cost = d comparisons + l hashes  ~ lower bound</text></g><g id="cue_s05_c4_deploy_well_dragonn_adds_two"><title>deploy well dragonn adds two tricks only compresses tensor when</title><rect x="656" y="388" width="560" height="162" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="388" width="6" height="162" rx="6" fill="#48C78E"/><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Two tricks for real deployment</text><rect x="684" y="440" width="252" height="92" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="700" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">Tensor selection</text><text x="700" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="400" text-anchor="start">compress a tensor only when it</text><text x="700" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="400" text-anchor="start">saves more than it costs</text><rect x="952" y="440" width="236" height="92" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="968" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">Sparse decoding</text><text x="968" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="400" text-anchor="start">batch all received tensors</text><text x="968" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="400" text-anchor="start">into one decode; cost ~</text><text x="968" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="400" text-anchor="start">constant in GPUs</text></g></svg>