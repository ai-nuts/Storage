<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Compression cut, throughput multiplied</text><g id="cue_s07_c1_headline_result_dragonn_cuts_compres"><title>headline result dragonn cuts compression time seventy percent compared best</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#34D3C0"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Compression time</text><rect x="92" y="214" width="180" height="78" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="182.0" y="254.56" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#34D3C0" font-weight="800" text-anchor="middle">-70%</text><text x="182.0" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">vs best existing GS</text><text x="292" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">DRAGONN cuts compression time by up to</text><text x="292" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">seventy percent compared with the best</text><text x="292" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">prior sparsification methods.</text></g><g id="cue_s07_c2_reaching_same_level_convergence_deli"><title>reaching same level convergence delivers three-and-a-half times higher total throughput</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#48C78E"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="start">Total training throughput at equal convergence</text><rect x="300" y="384" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="384" width="6" height="26" rx="6" fill="#9DB3C8"/><text x="288" y="402.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">FULL sync</text><text x="316" y="402.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">1x</text><rect x="300" y="420" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="420" width="68" height="26" rx="6" fill="#4C9BE8"/><text x="288" y="438.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">DGC</text><text x="378" y="438.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">~10x</text><rect x="300" y="456" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="456" width="240" height="26" rx="6" fill="#48C78E"/><text x="288" y="474.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">DRAGONN</text><text x="550" y="474.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">up to 35.9x</text><rect x="92" y="496" width="504" height="42" rx="10" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><text x="112" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">Up to 3.52x over DGC — and it matches FULL's test accuracy</text></g><g id="cue_s07_c3_importantly_its_advantage_over_dgc"><title>importantly its advantage over dgc grows more gpus added which</title><rect x="656" y="158" width="560" height="392" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="392" rx="6" fill="#F2C14E"/><text x="684" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#F2C14E" font-weight="800" text-anchor="start">The lead grows with scale</text><text x="684" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">DRAGONN's advantage over DGC widens as more GPUs are</text><text x="684" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">added — evidence of strong scalability.</text><rect x="684" y="296" width="504" height="190" rx="10" fill="#1A1608" stroke="#26455F" stroke-width="1.5"/><line x1="728" y1="314" x2="728" y2="456" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><line x1="728" y1="456" x2="1168" y2="456" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><text x="704" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="start">speedup</text><text x="1168" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="end"># GPUs -&gt;</text><text x="768" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">4</text><circle cx="768" cy="403" r="5" fill="#F2C14E"/><text x="768" y="391" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="middle">1.60x</text><text x="908" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">8</text><circle cx="908" cy="379" r="5" fill="#F2C14E"/><text x="908" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="middle">2.30x</text><text x="1068" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">16</text><circle cx="1068" cy="339" r="5" fill="#F2C14E"/><text x="1068" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="middle">3.52x</text><polyline points="768,403 908,379 1068,339" fill="none" stroke="#F2C14E" stroke-width="2.6"/></g><text x="64" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Faster networks would tilt the balance further toward compression — widening the gains.</text></svg>