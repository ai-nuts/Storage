<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2022</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Rice University  ·  ThirdAI Corp</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="46" fill="#FFFFFF" font-weight="800" text-anchor="start">DRAGONN</text><text x="64" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="start">Distributed Randomized Approximate</text><text x="64" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="start">Gradients of Neural Networks</text><text x="64" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="500" text-anchor="start">Zhuang Wang · Zhaozhuo Xu · Xinyu Crystal Wu · Anshumali Shrivastava · T. S. Eugene Ng</text><g id="cue_s01_c1_dragonn_randomized_hashing_algorithm"><title>dragonn randomized hashing algorithm gradient sparsification data-parallel distributed rice university</title><rect x="64" y="320" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="320" width="6" height="118" rx="6" fill="#4C9BE8"/><text x="92" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">A randomized hashing compressor</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">DRAGONN sparsifies gradients by direct hashing instead of exact</text><text x="92" y="403" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">top-k selection, for data-parallel distributed training.</text></g><g id="cue_s01_c2_distributed_synchronizing_gradients"><title>distributed synchronizing gradients across gpus main efficiency bottleneck gradient sparsification</title><rect x="656" y="320" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="320" width="6" height="118" rx="6" fill="#F2C14E"/><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The moving bottleneck</text><text x="684" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Synchronizing gradients across GPUs dominates cost; sparsification</text><text x="684" y="403" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">was meant to help, but its compression overhead became the new</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">bottleneck.</text></g><g id="cue_s01_c3_dragonn_replaces_exact_parallel_pref"><title>dragonn replaces exact parallel-prefix-sum operations used prior methods direct hashing</title><rect x="64" y="460" width="1152" height="118" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="460" width="6" height="118" rx="6" fill="#34D3C0"/><text x="92" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">The payoff</text><text x="92" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Replacing exact parallel-prefix-sum with direct hashing cuts compression time by up to 70% and speeds up total training by up to 3.5x.</text></g><line x1="64" y1="616" x2="1216" y2="616" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">github.com/zhuangwang93/dragonn</text><text x="420" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Sparsification only needs an approximate set of top gradients — so it should not pay for an exact one.</text></svg>