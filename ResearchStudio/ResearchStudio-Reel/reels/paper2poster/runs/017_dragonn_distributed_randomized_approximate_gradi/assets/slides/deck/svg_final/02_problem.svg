<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">When compression costs more than it saves</text><g id="cue_s02_c1_data_parallel_distributed_standard_w"><title>data-parallel distributed standard way scale deep learning across many gpus</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The dominant cost</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Data-parallel training is the standard way</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">to scale deep learning across many GPUs,</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">but synchronizing gradients between</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">workers is the single largest cost.</text><rect x="92" y="360" width="344" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">gradient all-reduce</text><circle cx="150" cy="446" r="15" fill="#4C9BE8"/><circle cx="230" cy="446" r="15" fill="#4C9BE8"/><circle cx="310" cy="446" r="15" fill="#4C9BE8"/><circle cx="390" cy="446" r="15" fill="#4C9BE8"/><text x="150" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0B1B2B" font-weight="800" text-anchor="middle">g0</text><text x="230" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0B1B2B" font-weight="800" text-anchor="middle">g1</text><text x="310" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0B1B2B" font-weight="800" text-anchor="middle">g2</text><text x="390" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0B1B2B" font-weight="800" text-anchor="middle">g3</text><line x1="165" y1="446" x2="215" y2="446" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"/><line x1="245" y1="446" x2="295" y2="446" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"/><line x1="325" y1="446" x2="375" y2="446" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"/><text x="264" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#F2C14E" font-weight="700" text-anchor="middle">sync every step  =  communication bottleneck</text></g><g id="cue_s02_c2_gradient_sparsification_promised_rel"><title>gradient sparsification promised relief transmitting only small subset gradients yet</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#F2C14E"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Gradient sparsification: promise vs reality</text><rect x="528" y="216" width="332" height="72" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="552" cy="240" r="6" fill="#34D3C0"/><text x="570" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="800" text-anchor="start">Promise</text><text x="570" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">send only a small subset of gradients</text><rect x="880" y="216" width="308" height="72" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="904" cy="240" r="6" fill="#F2685C"/><text x="922" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#F2685C" font-weight="800" text-anchor="start">Reality</text><text x="922" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">compression time cancels the savings</text></g><g id="cue_s02_c3_shows_once_tensor_exceeds_about"><title>shows once tensor exceeds about sixteen megabytes compression overhead becomes</title><rect x="500" y="326" width="716" height="224" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="326" width="6" height="224" rx="6" fill="#F2685C"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Compression overhead dominates past ~16 MB (2^24 bytes)</text><rect x="800" y="378" width="388" height="150" rx="8" fill="#1A1016" stroke="#26455F" stroke-width="1.5"/><line x1="830" y1="502" x2="1174" y2="502" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><text x="824" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="600" text-anchor="start">compression share</text><text x="1174" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="600" text-anchor="end">tensor size -&gt;</text><rect x="840" y="475" width="60" height="27" rx="4" fill="#F2C14E"/><text x="870.0" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="800" text-anchor="middle">28%</text><text x="870.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">1 MB</text><rect x="948" y="442" width="60" height="60" rx="4" fill="#F2C14E"/><text x="978.0" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="800" text-anchor="middle">62%</text><text x="978.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">16 MB</text><rect x="1056" y="414" width="60" height="88" rx="4" fill="#F2685C"/><text x="1086.0" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2685C" font-weight="800" text-anchor="middle">90%</text><text x="1086.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">&gt;16 MB</text><text x="528" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Above the crossover, compression</text><text x="528" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">is the single largest efficiency</text><text x="528" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">bottleneck.</text><text x="528" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6E869C" font-weight="400" text-anchor="start">For small tensors, sparsification</text><text x="528" y="491" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6E869C" font-weight="400" text-anchor="start">can even be slower than sending</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6E869C" font-weight="400" text-anchor="start">everything.</text></g></svg>