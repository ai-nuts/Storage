<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three contributions</text><g id="cue_s04_c1_makes_three_contributions"><title>makes three contributions</title><rect x="64" y="158" width="1152" height="56" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="56" rx="6" fill="#4C9BE8"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The paper contributes one new algorithm, two system-level optimizations, and a broad empirical study.</text></g><g id="cue_s04_c2_first_proposes_dragonn_hashing_based"><title>first proposes dragonn hashing-based sparsification algorithm slashes compression overhead while</title><rect x="64" y="240" width="368" height="310" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="120" cy="312" r="28" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="120" y="323" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">DRAGONN algorithm</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A hashing-based sparsifier that slashes</text><text x="92" y="453" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">compression overhead while keeping the</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">same per-iteration convergence, with</text><text x="92" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">theoretical bounds on compression and</text><text x="92" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">generalization error.</text></g><g id="cue_s04_c3_second_adds_two_system_level_optimiz"><title>second adds two system-level optimizations efficiency-aware tensor selection only compresses</title><rect x="456" y="240" width="368" height="310" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="240" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="512" cy="312" r="28" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="512" y="323" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">2</text><text x="484" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Two system</text><text x="484" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">optimizations</text><text x="484" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Efficiency-aware tensor selection</text><text x="484" y="481" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">compresses only where it pays off;</text><text x="484" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sparse decoding keeps decode cost from</text><text x="484" y="527" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">growing with the number of GPUs.</text></g><g id="cue_s04_c4_third_evaluates_method_broadly_acros"><title>third evaluates method broadly across vision recommendation models demonstrates substantial</title><rect x="848" y="240" width="368" height="310" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="240" width="368" height="6" rx="6" fill="#48C78E"/><circle cx="904" cy="312" r="28" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="904" y="323" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">3</text><text x="876" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Broad evaluation</text><text x="876" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Tested across vision and recommendation</text><text x="876" y="453" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">models, demonstrating large, consistent</text><text x="876" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">end-to-end training speedups.</text></g><text x="64" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">One idea — hash, do not sort — unlocks all three.</text></svg>