<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Match the algorithm to the task</text><g id="cue_s10_c1_lasting_lesson_simple_since_gradient"><title>lasting lesson simple since gradient sparsification only ever needs approximate</title><rect x="64" y="176" width="1152" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="150" rx="6" fill="#4C9BE8"/><circle cx="112" cy="232" r="10" fill="#4C9BE8"/><text x="150" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Do not pay for exactness you do not need</text><text x="150" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Gradient sparsification only ever needs an approximate set of top gradients, so using an</text><text x="150" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">expensive exact selection algorithm to place them is wasted effort.</text></g><g id="cue_s10_c2_swapping_exact_parallel_prefix_sum"><title>swapping exact parallel prefix sum direct randomized hashing dragonn turns</title><rect x="64" y="342" width="1152" height="150" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="342" width="6" height="150" rx="6" fill="#34D3C0"/><circle cx="112" cy="398" r="10" fill="#34D3C0"/><text x="150" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Hashing makes sparsification finally pay off</text><text x="150" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Swapping exact prefix sum for direct randomized hashing turns a sequential, dependency-heavy</text><text x="150" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">step into an embarrassingly parallel one; with tensor selection and sparse decoding it delivers</text><text x="150" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">scalable speedups without hurting accuracy.</text></g><line x1="64" y1="536" x2="1216" y2="536" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">DRAGONN: Distributed Randomized Approximate Gradients of Neural Networks</text><text x="64" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICML 2022  ·  Rice University &amp; ThirdAI  ·  github.com/zhuangwang93/dragonn</text></svg>