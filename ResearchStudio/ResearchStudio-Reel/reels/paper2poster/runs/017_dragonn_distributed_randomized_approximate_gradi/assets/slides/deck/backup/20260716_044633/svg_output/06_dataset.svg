ia_v100_gpus"><title>testbed sixteen nvidia v100 gpus across two machines connected twenty-five</title><rect x="788" y="158" width="428" height="392" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="788" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="816" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">Testbed</text><rect x="816" y="224" width="180" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="906.0" y="271.84000000000003" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#34D3C0" font-weight="800" text-anchor="middle">16</text><text x="906.0" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">V100-32GB GPUs</text><rect x="1012" y="224" width="180" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1102.0" y="271.84000000000003" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#34D3C0" font-weight="800" text-anchor="middle">25 Gbps</text><text x="1102.0" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">network</text><rect x="816" y="332" width="180" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="906.0" y="379.84000000000003" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">2 x 8</text><text x="906.0" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">two machines</text><rect x="1012" y="332" width="180" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1102.0" y="379.84000000000003" font-family="Arial, 'Helv