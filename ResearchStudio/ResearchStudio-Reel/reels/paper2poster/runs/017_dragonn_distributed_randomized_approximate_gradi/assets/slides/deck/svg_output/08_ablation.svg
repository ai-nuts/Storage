<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Each component adds speedup</text><g id="cue_s08_c1_ablation_study_separates_contributio"><title>ablation study separates contributions three components</title><rect x="64" y="158" width="1152" height="54" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="54" rx="6" fill="#4C9BE8"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">A component ablation isolates the three parts of DRAGONN, added one at a time.</text></g><g id="cue_s08_c2_hashing_based_compressor_itself_prov"><title>hashing-based compressor itself provides base improvement layering efficiency-aware tensor selection</title><rect x="64" y="230" width="560" height="320" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="230" width="6" height="320" rx="6" fill="#34D3C0"/><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Speedup builds up (one model)</text><line x1="124" y1="502" x2="554" y2="502" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><text x="118" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="700" text-anchor="start">speedup</text><rect x="130" y="462" width="110" height="40" rx="5" fill="#4C9BE8"/><text x="185.0" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="middle">1.0x</text><text x="185.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">hashing</text><text x="185.0" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">only</text><rect x="280" y="424" width="110" height="78" rx="5" fill="#34D3C0"/><text x="335.0" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="middle">1.92x</text><text x="335.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">+ tensor</text><text x="335.0" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">selection</text><rect x="430" y="326" width="110" height="176" rx="5" fill="#48C78E"/><text x="485.0" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="middle">4.33x</text><text x="485.0" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">+ sparse</text><text x="485.0" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">decoding</text></g><g id="cue_s08_c3_notably_benefit_sparse_decoding_exce"><title>notably benefit sparse decoding exceed number workers because eliminates decode</title><rect x="656" y="230" width="560" height="150" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="230" width="6" height="150" rx="6" fill="#48C78E"/><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">Why the gain exceeds the worker count</text><text x="684" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Sparse decoding removes the decode cost that otherwise</text><text x="684" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">grows linearly with the number of GPUs, so its benefit can</text><text x="684" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">exceed K-fold.</text></g><g id="cue_s08_c4_micro_benchmarks_confirm_dragonn_low"><title>micro-benchmarks confirm dragonn lowest encoding time across all tensor sizes</title><rect x="656" y="396" width="560" height="154" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="396" width="6" height="154" rx="6" fill="#F2C14E"/><text x="684" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Micro-benchmarks confirm it</text><rect x="684" y="448" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="464.0" r="5" fill="#F2C14E"/><text x="718" y="470.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Lowest encoding time across all tensor sizes</text><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="700" text-anchor="start">decode time as GPUs grow:</text><line x1="904" y1="532" x2="1172" y2="500" stroke="#F2685C" stroke-width="2.2" stroke-linecap="round"/><text x="1172" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#F2685C" font-weight="800" text-anchor="end">dense (linear)</text><line x1="904" y1="530" x2="1172" y2="528" stroke="#48C78E" stroke-width="2.2" stroke-linecap="round"/><text x="1172" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#48C78E" font-weight="800" text-anchor="end">sparse (flat)</text></g></svg>