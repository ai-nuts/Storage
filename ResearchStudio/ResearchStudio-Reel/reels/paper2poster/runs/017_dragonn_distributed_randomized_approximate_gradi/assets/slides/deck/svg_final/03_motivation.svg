<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">An exact algorithm doing an approximate job</text><g id="cue_s03_c1_leading_sparsification_method_deep_g"><title>leading sparsification method deep gradient compression selects gradients above estimated</title><rect x="64" y="158" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="180" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">How Deep Gradient Compression (DGC) works</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">DGC keeps gradients whose magnitude clears an estimated</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">threshold — an inherently approximate selection.</text><rect x="92" y="290" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344" y="312" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="middle">select  |g| &gt; threshold   (approximate top-k)</text></g><g id="cue_s03_c2_but_place_those_gradients_memory"><title>but place those gradients memory without conflicts relies parallel prefix</title><rect x="64" y="354" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="354" width="6" height="196" rx="6" fill="#F2685C"/><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">...but placement uses exact parallel prefix sum</text><text x="92" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">To pack kept gradients without conflicts, DGC builds a</text><text x="92" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">balanced binary tree, runs O(log d) sequential steps, and</text><text x="92" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">touches memory ~7x more than the lower bound.</text><text x="328" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">memory accesses vs lower bound</text><rect x="340" y="496" width="240" height="13" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="340" y="496" width="34" height="13" rx="6" fill="#34D3C0"/><text x="328" y="505.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">lower bound</text><text x="384" y="505.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">1x</text><rect x="340" y="516" width="240" height="13" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="340" y="516" width="240" height="13" rx="6" fill="#F2685C"/><text x="328" y="525.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">prefix sum</text><text x="590" y="525.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">~7x</text></g><g id="cue_s03_c3_authors_call_exact_approximate_misma"><title>authors call exact-approximate mismatch since only approximate set top gradients</title><rect x="656" y="158" width="560" height="392" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="392" rx="6" fill="#F2C14E"/><text x="684" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#F2C14E" font-weight="800" text-anchor="start">The exact-approximate mismatch</text><rect x="684" y="232" width="246" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="807" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="middle">What is needed</text><text x="807" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#34D3C0" font-weight="800" text-anchor="middle">approximate</text><text x="807" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">set of top gradients</text><text x="807" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="middle">cheap is fine</text><rect x="942" y="232" width="246" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1065" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#F2685C" font-weight="800" text-anchor="middle">What DGC uses</text><text x="1065" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#F2685C" font-weight="800" text-anchor="middle">exact</text><text x="1065" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">prefix-sum placement</text><text x="1065" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="middle">expensive &amp; sequential</text><text x="684" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Paying for an exact selection algorithm when only an</text><text x="684" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">approximate result is required is wasted effort.</text><text x="684" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#F2C14E" font-weight="800" text-anchor="start">Idea: match the algorithm's exactness to the task.</text></g></svg>