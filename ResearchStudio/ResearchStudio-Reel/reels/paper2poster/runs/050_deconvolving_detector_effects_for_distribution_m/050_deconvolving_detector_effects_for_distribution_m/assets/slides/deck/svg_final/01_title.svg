<text x="72" y="610" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">UC Berkeley  ·  Lawrence Berkeley National Laboratory  ·  MIT  ·  NSF AI Institute (IAIFI)</text>
<text x="72" y="646" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="1.2">NeurIPS 2022 · ML4PS Workshop</text>
<text x="72" y="670" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="500" fill="#6E85AC" text-anchor="start">github.com/hep-lbdl/MomentUnfolding</text>
</svg>
