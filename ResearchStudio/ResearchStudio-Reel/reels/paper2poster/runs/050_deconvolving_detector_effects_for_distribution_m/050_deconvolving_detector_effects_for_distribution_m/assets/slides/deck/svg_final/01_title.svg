  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<g id="cue_s01_c1_comparing_collider_measurements_theo">
  <title>comparing collider measurements theory requires unfolding correcting distortions detectors introduce</title>
  <desc>Comparing collider measurements with theory requires unfolding detector distortions.</desc>
<rect x="72" y="92" width="6" height="30" rx="2.5" fill="#4F9DF7" />
<text x="92" y="104" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="2.5">COLLIDER PHYSICS · UNFOLDING · MACHINE LEARNING</text>
<text x="92" y="134" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#A6BADB" text-anchor="start">Comparing collider data with theory means undoing the distortions detectors imprint on the data.</text>
</g>
<text x="72" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="58" font-weight="800" fill="#EAF1FB" text-anchor="start">Moment Unfolding</text>
<text x="72" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" font-weight="500" fill="#A6BADB" text-anchor="start">Deconvolving Detector Effects for Distribution Moments</text>
<g id="cue_s01_c2_but_most_unfolding_methods_first">
  <title>but most unfolding methods first bin histograms while many theory</title>
  <desc>Most unfolding methods first bin data into histograms while theory predictions live at moments.</desc>
<rect x="72" y="286" width="596" height="118" rx="16" ry="16" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="92" y="308" width="6" height="74" rx="2.5" fill="#F7B84B" />
<text x="112" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="800" fill="#F7B84B" text-anchor="start">The mismatch</text>
<text x="112" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Most unfolding methods first bin the data into</text>
<text x="112" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">histograms — but many theory predictions live at</text>
<text x="112" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">the level of statistical moments.</text>
</g>
<g id="cue_s01_c3_introduces_moment_unfolding_machine">
  <title>introduces moment unfolding machine-learning method directly unfolds distribution moments without</title>
  <desc>This paper introduces Moment Unfolding directly unfolds distribution moments without binning.</desc>
<rect x="692" y="286" width="516" height="118" rx="16" ry="16" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.4" />
<rect x="712" y="308" width="6" height="74" rx="2.5" fill="#37DCC0" />
<text x="732" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="800" fill="#37DCC0" text-anchor="start">Moment Unfolding</text>
<text x="732" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="500" fill="#EAF1FB" text-anchor="start">A machine-learning method that directly</text>
<text x="732" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="500" fill="#EAF1FB" text-anchor="start">unfolds distribution moments —</text>
<text x="732" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="600" fill="#EAF1FB" text-anchor="start">without ever binning the data.</text>
</g>
<g id="cue_s01_c4_inspired_generative_adversarial_netw">
  <title>inspired generative adversarial networks boltzmann approach statistical mechanics recovers moments</title>
  <desc>Inspired by generative adversarial networks and Boltzmann recovers moments sub-percent Gaussian LHC jets.</desc>
<rect x="72" y="424" width="1136" height="96" rx="16" ry="16" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="92" y="446" width="6" height="52" rx="2.5" fill="#57D9A3" />
<text x="112" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#EAF1FB" text-anchor="start">Inspired by GANs and Boltzmann&#x27;s statistical mechanics</text>
<text x="112" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Recovers moments to sub-percent accuracy on both Gaussian toy data and simulated LHC jets.</text>
<text x="1184" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="800" fill="#57D9A3" text-anchor="end">sub-%</text>
<text x="1184" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#A6BADB" text-anchor="end">moment accuracy</text>
</g>
<line x1="72" y1="548" x2="1208" y2="548" stroke="#2B4068" stroke-width="1.2" />
