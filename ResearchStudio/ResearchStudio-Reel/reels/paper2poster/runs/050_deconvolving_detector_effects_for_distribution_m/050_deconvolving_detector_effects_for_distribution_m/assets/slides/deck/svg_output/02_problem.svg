<text x="872.6666666666666" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Binned data on one side,</text>
<text x="872.6666666666666" y="405" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">moment-level theory predictions on</text>
