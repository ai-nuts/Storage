<text x="872.6666666666666" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">mismatch.</text>
<rect x="872.6666666666666" y="476" width="329.3333333333333" height="68" rx="12" ry="12" fill="#16283F" stroke="#4F9DF7" stroke-width="1.2" />
