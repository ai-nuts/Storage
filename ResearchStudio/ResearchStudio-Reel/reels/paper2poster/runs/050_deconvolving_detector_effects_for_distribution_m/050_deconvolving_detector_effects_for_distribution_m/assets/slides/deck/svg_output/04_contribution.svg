<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">CONTRIBUTION</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="800" fill="#EAF1FB" text-anchor="start">What Moment Unfolding delivers</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">04 / 10</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s04_c1_core_contribution_moment_unfolding_n">
  <title>core contribution moment unfolding new unbinned non-iterative reweighting technique</title>
  <desc>A new reweighting technique that never bins the data and does not iterate to convergence.</desc>
<rect x="56" y="160" width="572.0" height="170" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="80" y="188" width="5" height="34" rx="2.5" fill="#4F9DF7" />
<text x="604.0" y="212" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="40" font-weight="800" fill="#4F9DF7" text-anchor="end" opacity="0.55">01</text>
<text x="100" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="700" fill="#EAF1FB" text-anchor="start">Unbinned &amp; non-iterative</text>
<text x="100" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">A new reweighting technique that never bins the data</text>
<text x="100" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">and does not iterate to convergence.</text>
</g>
<g id="cue_s04_c2_learns_reweighting_function_playing">
  <title>learns reweighting function playing role gan generator whose form inspired</title>
  <desc>Learns a reweighting function — a GAN generator — whose trainable parameters ARE the moments.</desc>
<rect x="652.0" y="160" width="572.0" height="170" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="676.0" y="188" width="5" height="34" rx="2.5" fill="#37DCC0" />
<text x="1200.0" y="212" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="40" font-weight="800" fill="#37DCC0" text-anchor="end" opacity="0.55">02</text>
<text x="696.0" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="700" fill="#EAF1FB" text-anchor="start">Boltzmann-form generator</text>
<text x="696.0" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Learns a reweighting function — a GAN generator —</text>
<text x="696.0" y="265" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">whose trainable parameters ARE the moments.</text>
</g>
<g id="cue_s04_c3_discriminator_pushes_reweighted_simu">
  <title>discriminator pushes reweighted simulation match target</title>
  <desc>A discriminator pushes the reweighted simulation to match the target data.</desc>
<rect x="56" y="352" width="572.0" height="170" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="80" y="380" width="5" height="34" rx="2.5" fill="#57D9A3" />
<text x="604.0" y="404" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="40" font-weight="800" fill="#57D9A3" text-anchor="end" opacity="0.55">03</text>
<text x="100" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="700" fill="#EAF1FB" text-anchor="start">Adversarial discriminator</text>
<text x="100" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">A discriminator pushes the reweighted simulation to</text>
<text x="100" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">match the target data.</text>
</g>
<g id="cue_s04_c4_unlike_omnifold_which_trains_fresh">
  <title>unlike omnifold which trains fresh pair networks every iteration moment</title>
  <desc>Unlike OmniFold, which retrains a fresh network pair each iteration, this trains one pair a single time.</desc>
<rect x="652.0" y="352" width="572.0" height="170" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="676.0" y="380" width="5" height="34" rx="2.5" fill="#F7B84B" />
<text x="1200.0" y="404" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="40" font-weight="800" fill="#F7B84B" text-anchor="end" opacity="0.55">04</text>
<text x="696.0" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="700" fill="#EAF1FB" text-anchor="start">Trained once, not per-iteration</text>
<text x="696.0" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Unlike OmniFold, which retrains a fresh network pair</text>
<text x="696.0" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">each iteration, this trains one pair a single time.</text>
</g>
</svg>
