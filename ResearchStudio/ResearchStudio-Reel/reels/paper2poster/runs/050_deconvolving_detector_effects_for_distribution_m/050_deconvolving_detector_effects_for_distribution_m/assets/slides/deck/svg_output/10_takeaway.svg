<text x="1224" y="578" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="600" fill="#4F9DF7" text-anchor="end">github.com/hep-lbdl/MomentUnfolding</text>
</svg>
