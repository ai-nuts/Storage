<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">TAKEAWAY</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="800" fill="#EAF1FB" text-anchor="start">Unfold moments directly — no binning</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">10 / 10</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s10_c1_takeaway_you_unfold_detector_effects">
  <title>takeaway you unfold detector effects directly level moments without ever</title>
  <desc>Takeaway you can unfold detector effects directly level moments without ever binning data.</desc>
<rect x="56" y="160" width="1168" height="70" rx="14" ry="14" fill="#1A2B49" stroke="#37DCC0" stroke-width="1.3" />
<rect x="76" y="180" width="5" height="30" rx="2.5" fill="#37DCC0" />
<text x="96" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="800" fill="#EAF1FB" text-anchor="start">You can unfold detector effects directly at the level of moments.</text>
</g>
<g id="cue_s10_c2_moment_unfolding_does_gan_like_gener">
  <title>moment unfolding does gan-like generator whose parameters moments trains only</title>
  <desc>Moment Unfolding GAN-like generator parameters moments trains once rather iterating recovers true moments better hundredth percent realistic LHC jet.</desc>
<rect x="56" y="250" width="1168" height="108" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<text x="80" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="600" fill="#EAF1FB" text-anchor="start">Moment Unfolding does this with a GAN-like generator whose parameters ARE the moments, trains</text>
<text x="80" y="317" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="600" fill="#EAF1FB" text-anchor="start">only once instead of iterating, and recovers the true moments to better than 0.01% on realistic</text>
<text x="80" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="600" fill="#EAF1FB" text-anchor="start">LHC jet simulations.</text>
</g>
<g id="cue_s10_c3_because_algorithm_agnostic_dataset_s">
  <title>because algorithm agnostic dataset same idea could carry over deconvolution</title>
  <desc>Because algorithm agnostic dataset same idea could carry over deconvolution problems well beyond particle physics.</desc>
<rect x="56" y="378" width="373.3333333333333" height="148" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="78" y="404" width="5" height="30" rx="2.5" fill="#4F9DF7" />
<text x="78" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#EAF1FB" text-anchor="start">Moments, not bins</text>
<text x="78" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">unfold statistical moments without</text>
<text x="78" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">any histogram</text>
<rect x="453.3333333333333" y="378" width="373.3333333333333" height="148" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="475.3333333333333" y="404" width="5" height="30" rx="2.5" fill="#37DCC0" />
<text x="475.3333333333333" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#EAF1FB" text-anchor="start">Train once</text>
<text x="475.3333333333333" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">a single GAN-like network pair, no</text>
<text x="475.3333333333333" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">iteration</text>
<rect x="850.6666666666666" y="378" width="373.3333333333333" height="148" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="872.6666666666666" y="404" width="5" height="30" rx="2.5" fill="#57D9A3" />
<text x="872.6666666666666" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#EAF1FB" text-anchor="start">Beyond particle physics</text>
<text x="872.6666666666666" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">dataset-agnostic — any deconvolution</text>
<text x="872.6666666666666" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">problem</text>
</g>
