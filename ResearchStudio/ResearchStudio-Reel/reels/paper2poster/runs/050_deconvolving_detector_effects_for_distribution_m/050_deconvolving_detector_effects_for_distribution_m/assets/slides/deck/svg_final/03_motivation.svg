<g id="cue_s03_c1_summarizing_distribution_few_moments">
  <title>summarizing distribution few moments makes tractable visualize crucially predict first</title>
  <desc>Summarizing distribution few moments tractable visualize predict from first principles.</desc>
<rect x="56" y="160" width="616" height="168" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="76" y="182" width="5" height="30" rx="2.5" fill="#4F9DF7" />
<text x="96" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EAF1FB" text-anchor="start">A few moments make a distribution tractable</text>
<text x="96" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">Summarizing a distribution by a handful of moments makes it easy</text>
<text x="96" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">to visualize and, crucially, to predict from first principles.</text>
<rect x="96" y="278" width="536" height="34" rx="9" ry="9" fill="#0E1A30" />
<text x="110" y="300" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="600" fill="#37DCC0" text-anchor="start">mean  ·  variance  ·  skewness  ·  …  →  visualize + predict</text>
</g>
<g id="cue_s03_c2_example_full_densities_hadronic_jets">
  <title>example full densities hadronic jets cannot computed perturbative qcd but</title>
  <desc>Full densities hadronic jets cannot computed perturbative QCD energy dependence moments can.</desc>
<rect x="56" y="348" width="616" height="120" rx="14" ry="14" fill="#1A2B49" stroke="#37DCC0" stroke-width="1.3" />
<rect x="76" y="372" width="5" height="72" rx="2.5" fill="#37DCC0" />
<text x="96" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EAF1FB" text-anchor="start">Hadronic jets: densities are out of reach</text>
<text x="96" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">Full jet densities cannot be computed in perturbative QCD — but</text>
<text x="96" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">the energy dependence of their moments can be.</text>
</g>
<g id="cue_s03_c3_unbinned_unfolding_methods_already_e">
  <title>unbinned unfolding methods already exist avoid binning artifacts but they</title>
  <desc>Unbinned unfolding methods already exist avoid binning artifacts entire spectra trade precision moments.</desc>
<rect x="696" y="160" width="528" height="168" rx="14" ry="14" fill="#14223C" stroke="#F2708A" stroke-width="1.2" />
<rect x="716" y="182" width="5" height="30" rx="2.5" fill="#F2708A" />
<text x="736" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F2708A" text-anchor="start">Unbinned methods exist, but…</text>
<text x="716" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">They avoid binning artifacts, yet are built to</text>
<text x="716" y="253" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">unfold entire spectra — so they may trade away</text>
<text x="716" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">precision on the few moments you want.</text>
</g>
<g id="cue_s03_c4_motivates_dedicated_method_unfolds_m">
  <title>motivates dedicated method unfolds moments themselves</title>
  <desc>This motivates dedicated method unfolds moments themselves.</desc>
<rect x="696" y="348" width="528" height="120" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<rect x="716" y="372" width="5" height="72" rx="2.5" fill="#4F9DF7" />
<text x="736" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#4F9DF7" text-anchor="start">A dedicated method</text>
<text x="736" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">This motivates unfolding the moments</text>
<text x="736" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">themselves, rather than reconstructing an</text>
<text x="736" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">entire spectrum first.</text>
</g>
</svg>
