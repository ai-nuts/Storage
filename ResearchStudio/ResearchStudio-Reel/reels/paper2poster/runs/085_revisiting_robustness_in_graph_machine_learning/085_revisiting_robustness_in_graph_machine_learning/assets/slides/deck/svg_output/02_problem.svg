<g id="cue_s02_c1_adversarial_example_supposed_small_c"><title>adversarial example supposed small change does not alter true category</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">What an adversarial example must be</text>
<text x="90.0" y="200.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">A small change that does NOT alter the input&#x27;s true</text>
<text x="90.0" y="225.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">category. For images a human just looks and verifies.</text>
<rect x="90.0" y="318.0" width="250.0" height="26.0" rx="13" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/><text x="215.0" y="336.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#08131F" text-anchor="middle">images: human eyeball verifies</text>
</g>
<g id="cue_s02_c2_graphs_such_visual_check_community"><title>graphs such visual check community settled counting edited edges zero</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<text x="682.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Graphs have no such check</text>
<text x="682.0" y="200.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">So the community settled on a proxy: just count the</text>
<text x="682.0" y="225.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">edited edges with an L-zero budget.</text>
<rect x="682.0" y="298.0" width="508.0" height="52.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="698.0" y="330.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" font-weight="bold" fill="#35D0BA" text-anchor="start">budget  =  # edited edges  &lt;=  L0</text>
</g>
