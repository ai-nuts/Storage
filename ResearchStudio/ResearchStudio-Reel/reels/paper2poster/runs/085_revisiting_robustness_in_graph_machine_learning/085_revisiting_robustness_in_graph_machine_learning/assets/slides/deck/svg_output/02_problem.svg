<text x="534.0" y="538.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="normal" fill="#FF6B6B" text-anchor="middle">after +2: class B</text>
</g>
<g id="cue_s02_c4_raises_fundamental_previously_unansw"><title>raises fundamental previously unanswered question these standard perturbations really keep</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="682.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">The unanswered question</text>
<text x="682.0" y="482.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">Do standard perturbations really keep a node&#x27;s</text>
<text x="682.0" y="509.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">semantic content — or are we attacking nodes whose</text>
