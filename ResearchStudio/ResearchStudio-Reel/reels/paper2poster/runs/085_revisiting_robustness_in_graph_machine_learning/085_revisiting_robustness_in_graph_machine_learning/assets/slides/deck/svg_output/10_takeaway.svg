<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">TAKEAWAY</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Not fragile — over-robust</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">10 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s10_c1_one_line_takeaway_graph_neural_netwo"><title>one-line takeaway graph neural networks not simply fragile they over-robust</title>
<rect x="64.0" y="140.0" width="368.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="140.0" width="368.0" height="8.0" rx="4" fill="#FF6B6B" fill-opacity="1.0" stroke="#FF6B6B" stroke-width="0"/>
<circle cx="106" cy="198" r="18" fill="#FF6B6B"/>
<text x="106.0" y="205.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">1</text>
<text x="138.0" y="192.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">GNNs are over-robust,</text>
<text x="138.0" y="219.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">not just fragile</text>
<text x="98.0" y="308.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">A large part of their measured</text>
<text x="98.0" y="335.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">robustness is stubborn</text>
<text x="98.0" y="362.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">robustness that persists after</text>
<text x="98.0" y="389.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">a node&#x27;s true meaning has</text>
<text x="98.0" y="416.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">already changed — which</text>
<text x="98.0" y="443.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">conventional evaluations</text>
<text x="98.0" y="470.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">wrongly credit as good</text>
<text x="98.0" y="497.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">behaviour.</text>
</g>
<g id="cue_s10_c2_bringing_graph_label_structure_infer"><title>bringing graph label structure inference through label propagation reduces over-robustness</title>
<rect x="456.0" y="140.0" width="368.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="456.0" y="140.0" width="368.0" height="8.0" rx="4" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<circle cx="498" cy="198" r="18" fill="#48D597"/>
<text x="498.0" y="205.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">2</text>
<text x="530.0" y="192.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Label propagation is a</text>
<text x="530.0" y="219.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">free fix</text>
<text x="490.0" y="308.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">Bringing the training graph&#x27;s</text>
<text x="490.0" y="335.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">label structure into inference</text>
<text x="490.0" y="362.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">reduces over-robustness while</text>
<text x="490.0" y="389.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">improving accuracy and real</text>
<text x="490.0" y="416.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">adversarial robustness.</text>
</g>
<g id="cue_s10_c3_semantics_aware_definition_classifyi"><title>semantics-aware definition classifying newly added node carries robustness-accuracy tradeoff all</title>
<rect x="848.0" y="140.0" width="368.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="848.0" y="140.0" width="368.0" height="8.0" rx="4" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<circle cx="890" cy="198" r="18" fill="#35D0BA"/>
<text x="890.0" y="205.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">3</text>
<text x="922.0" y="192.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">No inductive tradeoff</text>
<text x="882.0" y="308.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">With a semantics-aware</text>
<text x="882.0" y="335.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">definition, classifying a newly</text>
<text x="882.0" y="362.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">added node carries no</text>
<text x="882.0" y="389.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">robustness-accuracy tradeoff at</text>
<text x="882.0" y="416.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">all — changing how robustness</text>
<text x="882.0" y="443.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">in graph ML ought to be</text>
<text x="882.0" y="470.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">measured.</text>
</g>
<text x="64.0" y="682.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="normal" fill="#9DB2C4" text-anchor="start">Revisiting Robustness in Graph Machine Learning  ·  ICLR 2023  ·  arxiv.org/abs/2305.00851</text>
</svg>
