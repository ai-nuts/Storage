<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">METHOD</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">A trusted reference that knows the true label</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">05 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s05_c1_key_idea_introduce_trusted_reference"><title>key idea introduce trusted reference classifier knows true semantics contextual</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Bayes-optimal reference g</text>
<text x="90.0" y="200.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">On CSBMs the true generative model is known, so the</text>
<text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Bayes-optimal classifier — the most likely class given the</text>
<text x="90.0" y="248.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">data — is derivable and used as ground-truth reference g.</text>
<rect x="90.0" y="318.0" width="508.0" height="44.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="106.0" y="346.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#35D0BA" text-anchor="start">g  =  argmax_c  P(class = c | data)</text>
</g>
<g id="cue_s05_c2_over_robust_example_perturbed_graph"><title>over-robust example perturbed graph where reference agree clean input perturbation</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#FF6B6B" fill-opacity="1.0" stroke="#FF6B6B" stroke-width="0"/>
<text x="682.0" y="162.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">An over-robust example</text>
<circle cx="694" cy="189" r="6" fill="#48D597"/>
<text x="712.0" y="194.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" font-weight="bold" fill="#E8F0F7" text-anchor="start">model f  =  reference g</text>
<text x="1190.0" y="194.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="normal" fill="#48D597" text-anchor="end">agree</text>
<circle cx="694" cy="241" r="6" fill="#F5B841"/>
<text x="712.0" y="246.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" font-weight="bold" fill="#E8F0F7" text-anchor="start">reference g  flips</text>
<text x="1190.0" y="246.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="normal" fill="#F5B841" text-anchor="end">semantics changed</text>
<circle cx="694" cy="293" r="6" fill="#FF6B6B"/>
<text x="712.0" y="298.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" font-weight="bold" fill="#E8F0F7" text-anchor="start">model f  keeps old prediction</text>
<text x="1190.0" y="298.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="normal" fill="#FF6B6B" text-anchor="end">over-robust</text>
</g>
<g id="cue_s05_c3_they_measure_over_robustness_one_min"><title>they measure over-robustness one minus ratio semantics-aware robustness conventional robustness</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<text x="90.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Measuring over-robustness</text>
<rect x="90.0" y="466.0" width="508.0" height="60.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="108.0" y="503.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" font-weight="bold" fill="#35D0BA" text-anchor="start">OR  =  1  -  ( r_semantic / r_conventional )</text>
<text x="90.0" y="550.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">OR = 0.2 means 20% of the measured robustness lies beyond</text>
<text x="90.0" y="574.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">genuine semantic change — undesirable, stubborn robustness.</text>
</g>
<g id="cue_s05_c4_finally_they_combine_graph_neural"><title>finally they combine graph neural networks label propagation feeding graph</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<text x="682.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" font-weight="bold" fill="#E8F0F7" text-anchor="start">The remedy: GNN + label propagation</text>
<rect x="682.0" y="486.0" width="150.0" height="46.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="2"/><text x="757.0" y="515.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#E8F0F7" text-anchor="middle">GNN f</text>
<text x="846.0" y="515.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="26" font-weight="normal" fill="#9DB2C4" text-anchor="middle">+</text>
<rect x="866.0" y="486.0" width="300.0" height="46.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#48D597" stroke-width="2"/><text x="1016.0" y="515.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#E8F0F7" text-anchor="middle">training-graph labels (propagated)</text>
<text x="936.0" y="590.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="bold" fill="#48D597" text-anchor="middle">→  lower over-robustness, same accuracy</text>
<text x="682.0" y="610.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="normal" fill="#9DB2C4" text-anchor="start">Known labels are fed into inference to cut unwanted</text>
<text x="682.0" y="632.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="normal" fill="#9DB2C4" text-anchor="start">over-robustness.</text>
</g>
</svg>
