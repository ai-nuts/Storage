<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Why CSBMs</text>
<text x="90.0" y="202.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">A controlled generative model whose ground truth is</text>
