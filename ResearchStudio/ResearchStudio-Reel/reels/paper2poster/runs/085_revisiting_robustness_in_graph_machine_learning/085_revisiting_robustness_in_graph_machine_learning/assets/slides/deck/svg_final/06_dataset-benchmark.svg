<g id="cue_s06_c1_controlled_experiments_run_contextua"><title>controlled experiments run contextual stochastic block models which let authors</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
