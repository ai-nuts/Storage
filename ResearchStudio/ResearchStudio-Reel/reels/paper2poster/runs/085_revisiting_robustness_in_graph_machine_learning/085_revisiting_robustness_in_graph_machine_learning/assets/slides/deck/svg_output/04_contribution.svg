<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">CONTRIBUTION</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Four contributions</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">04 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s04_c1_makes_four_contributions"><title>makes four contributions</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="106" cy="166" r="20" fill="#35D0BA"/>
<text x="106.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">1</text>
<text x="142.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Define over-robustness</text>
<line x1="90.0" y1="188.0" x2="598.0" y2="188.0" stroke="#1E3A52" stroke-width="1"/>
<text x="90.0" y="220.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">A semantics-aware notion of adversarial robustness for node</text>
<text x="90.0" y="244.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">predictions — and with it a new concept for graphs:</text>
<text x="90.0" y="268.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">over-robustness, robustness against admissible</text>
<text x="90.0" y="292.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">perturbations whose ground-truth label has already changed.</text>
</g>
<g id="cue_s04_c2_first_defines_semantics_aware_notion"><title>first defines semantics-aware notion adversarial robustness node-level predictions brand new</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="698" cy="166" r="20" fill="#4C8DFF"/>
<text x="698.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">2</text>
<text x="734.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Measure it on CSBMs</text>
<line x1="682.0" y1="188.0" x2="1190.0" y2="188.0" stroke="#1E3A52" stroke-width="1"/>
<text x="682.0" y="220.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Using Contextual Stochastic Block Models, common</text>
<text x="682.0" y="244.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">perturbation sets contain a large fraction of graphs with</text>
<text x="682.0" y="268.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">changed semantics, and every examined GNN is significantly</text>
<text x="682.0" y="292.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">over-robust — matched on real-world graphs.</text>
</g>
<g id="cue_s04_c3_second_contextual_stochastic_block_m"><title>second contextual stochastic block models shows common perturbation sets contain</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="106" cy="444" r="20" fill="#F5B841"/>
<text x="106.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">3</text>
<text x="142.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">A free fix: label propagation</text>
<line x1="90.0" y1="466.0" x2="598.0" y2="466.0" stroke="#1E3A52" stroke-width="1"/>
<text x="90.0" y="498.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Folding the known label structure into inference via label</text>
<text x="90.0" y="522.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">propagation significantly reduces over-robustness at no</text>
<text x="90.0" y="546.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">cost to accuracy or genuine adversarial robustness.</text>
</g>
<g id="cue_s04_c4_third_shows_folding_known_label"><title>third shows folding known label structure inference through label propagation</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="698" cy="444" r="20" fill="#48D597"/>
<text x="698.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">4</text>
<text x="734.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">No inductive tradeoff</text>
<line x1="682.0" y1="466.0" x2="1190.0" y2="466.0" stroke="#1E3A52" stroke-width="1"/>
<text x="682.0" y="498.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Classifying an inductively sampled node carries no</text>
<text x="682.0" y="522.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">robustness-accuracy tradeoff at all.</text>
</g>
</svg>
