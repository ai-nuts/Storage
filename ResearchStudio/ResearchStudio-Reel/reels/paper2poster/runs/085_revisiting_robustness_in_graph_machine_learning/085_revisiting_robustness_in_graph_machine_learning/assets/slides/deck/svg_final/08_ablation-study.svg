<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">ABLATION STUDY</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Label propagation cuts over-robustness — for free</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">08 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s08_c1_most_informative_ablation_concerns_l"><title>most informative ablation concerns label propagation applying top graph neural</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">The key ablation</text>
<text x="90.0" y="204.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">Applying label propagation on top of a GNN sharply</text>
<text x="90.0" y="231.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">lowers over-robustness — and LP on its own achieves</text>
<text x="90.0" y="258.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">the lowest over-robustness of any method.</text>
</g>
<g id="cue_s08_c2_instance_gcn_combined_label_propagat"><title>instance gcn combined label propagation equal zero-point-five drops its over-robustness</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<text x="682.0" y="162.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Over-robustness at K = 0.5</text>
<rect x="746.0" y="286.0" width="150.0" height="56.0" rx="6" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="821.0" y="274.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#F5B841" text-anchor="middle">21%</text>
<text x="821.0" y="366.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#E8F0F7" text-anchor="middle">GCN + LP</text>
<rect x="966.0" y="304.7" width="150.0" height="37.3" rx="6" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<text x="1041.0" y="292.7" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#48D597" text-anchor="middle">14%</text>
<text x="1041.0" y="366.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#E8F0F7" text-anchor="middle">LP only</text>
<line x1="716.0" y1="342.0" x2="1176.0" y2="342.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="682.0" y="192.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="normal" fill="#9DB2C4" text-anchor="start">lower = less stubborn robustness</text>
</g>
<g id="cue_s08_c3_crucially_comes_free_adding_label"><title>crucially comes free adding label propagation does not hurt test</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<text x="90.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">And it comes for free</text>
<circle cx="102" cy="479" r="6" fill="#48D597"/>
<text x="120.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">test accuracy</text>
<text x="598.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#48D597" text-anchor="end">no drop</text>
<circle cx="102" cy="525" r="6" fill="#48D597"/>
<text x="120.0" y="530.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">adversarial robustness</text>
<text x="598.0" y="530.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#48D597" text-anchor="end">often improves</text>
<circle cx="102" cy="571" r="6" fill="#48D597"/>
<text x="120.0" y="576.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">structure still matters</text>
<text x="598.0" y="576.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#48D597" text-anchor="end">preserved</text>
</g>
<g id="cue_s08_c4_effect_robust_stronger_attacks_too"><title>effect robust stronger attacks too though some over-robustness always remains</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#FF6B6B" fill-opacity="1.0" stroke="#FF6B6B" stroke-width="0"/>
<text x="682.0" y="440.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Robust to stronger attacks</text>
<text x="682.0" y="462.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="13" font-weight="normal" fill="#9DB2C4" text-anchor="start">under Nettack, some over-robustness always remains</text>
<text x="682.0" y="523.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#E8F0F7" text-anchor="start">GCN</text>
<rect x="786.0" y="500.0" width="300.0" height="34.0" rx="6" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1"/>
<rect x="786.0" y="500.0" width="136.8" height="34.0" rx="6" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="930.8" y="523.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#F5B841" text-anchor="start">11.4%</text>
<text x="682.0" y="583.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#E8F0F7" text-anchor="start">MLP</text>
<rect x="786.0" y="560.0" width="300.0" height="34.0" rx="6" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1"/>
<rect x="786.0" y="560.0" width="230.4" height="34.0" rx="6" fill="#FF6B6B" fill-opacity="1.0" stroke="#FF6B6B" stroke-width="0"/>
<text x="1024.4" y="583.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="bold" fill="#FF6B6B" text-anchor="start">19.2%</text>
