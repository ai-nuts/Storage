<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0e1729"/><rect x="0" y="0" width="1280" height="4" fill="#38bdf8" opacity="0.0"/><rect x="60" y="52" width="6" height="40" rx="3" fill="#a78bfa"/><text x="80" y="70" font-size="15" fill="#a78bfa" font-weight="bold" letter-spacing="2.5">MOTIVATION</text><text x="80" y="102" font-size="30" fill="#f1f5fb" font-weight="bold" font-family="'Segoe UI Semibold','Segoe UI',Arial,sans-serif">Subtraction pays off — but non-negativity is the obstacle</text><g id="cue_s03_c1_why_revisit_now_because_subtraction" data-cue-label="why revisit now because subtraction pays off mixture cancel mass"><title>why revisit now because subtraction pays off mixture cancel mass</title><desc>Subtraction pays off. why revisit now because subtraction pays off mixture cancel mass</desc><rect x="60" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="170" width="5" height="248" rx="2.5" fill="#34d399"/><text x="88" y="218" font-size="20" fill="#f1f5fb" font-weight="bold">Subtraction pays off</text><text x="88" y="252" font-size="17.5" fill="#9fb0c8">A mixture that can cancel mass</text><text x="88" y="277" font-size="17.5" fill="#9fb0c8">captures complex shapes with</text><text x="88" y="302" font-size="17.5" fill="#9fb0c8">far fewer components than a</text><text x="88" y="327" font-size="17.5" fill="#9fb0c8">purely additive one.</text></g><g id="cue_s03_c2_problem_guaranteeing_result_stays_no" data-cue-label="problem guaranteeing result stays non-negative"><title>problem guaranteeing result stays non-negative</title><desc>The obstacle. problem guaranteeing result stays non-negative</desc><rect x="654" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="654" y="170" width="5" height="248" rx="2.5" fill="#fb7185"/><text x="682" y="218" font-size="20" fill="#f1f5fb" font-weight="bold">The obstacle</text><text x="682" y="252" font-size="17.5" fill="#9fb0c8">The hard part is guaranteeing the</text><text x="682" y="277" font-size="17.5" fill="#9fb0c8">resulting function stays</text><text x="682" y="302" font-size="17.5" fill="#9fb0c8">non-negative everywhere — a valid</text><text x="682" y="327" font-size="17.5" fill="#9fb0c8">probability density.</text></g><g id="cue_s03_c3_energy_based_models_enforce_non_nega" data-cue-label="energy-based models enforce non-negativity exponentiation but lose tractable normalization"><title>energy-based models enforce non-negativity exponentiation but lose tractable normalization</title><desc>Energy-based detour. energy-based models enforce non-negativity exponentiation but lose tractable normalization</desc><rect x="60" y="438" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="438" width="5" height="248" rx="2.5" fill="#fbbf24"/><text x="88" y="486" font-size="20" fill="#f1f5fb" font-weight="bold">Energy-based detour</text><text x="88" y="520" font-size="17.5" fill="#9fb0c8">Energy-based models enforce</text><text x="88" y="545" font-size="17.5" fill="#9fb0c8">non-negativity by exponentiation —</text><text x="88" y="570" font-size="17.5" fill="#9fb0c8">but then lose the ability to</text><text x="88" y="595" font-size="17.5" fill="#9fb0c8">normalize the model tractably.</text></g><g id="cue_s03_c4_meanwhile_several_separate_communiti" data-cue-label="meanwhile several separate communities signal processing kernel methods quantum mechanics"><title>meanwhile several separate communities signal processing kernel methods quantum mechanics</title><desc>Meanwhile several separate communities rediscovered squaring. meanwhile several separate communities signal processing kernel methods quantum mechanics</desc><rect x="654" y="438" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="654" y="438" width="5" height="248" rx="2.5" fill="#38bdf8"/><text x="682" y="482" font-size="20" fill="#f1f5fb" font-weight="bold">Reinvented in many fields</text><text x="682" y="516" font-size="17" fill="#9fb0c8">Several communities each rediscovered</text><text x="682" y="540" font-size="17" fill="#9fb0c8">a squaring trick — with no shared,</text><text x="682" y="564" font-size="17" fill="#9fb0c8">tractable framework tying them together.</text><rect x="682" y="602" width="166" height="52" rx="10" fill="#1b2b47" stroke="#34d399" stroke-width="1.3"/><circle cx="704" cy="628" r="7" fill="#34d399"/><text x="720" y="633" font-size="13.5" fill="#f1f5fb" font-weight="bold">Signal processing</text><rect x="860" y="602" width="166" height="52" rx="10" fill="#1b2b47" stroke="#38bdf8" stroke-width="1.3"/><circle cx="882" cy="628" r="7" fill="#38bdf8"/><text x="898" y="633" font-size="13.5" fill="#f1f5fb" font-weight="bold">Kernel methods</text><rect x="1038" y="602" width="166" height="52" rx="10" fill="#1b2b47" stroke="#a78bfa" stroke-width="1.3"/><circle cx="1060" cy="628" r="7" fill="#a78bfa"/><text x="1076" y="633" font-size="13.5" fill="#f1f5fb" font-weight="bold">Quantum / Born</text></g></svg>