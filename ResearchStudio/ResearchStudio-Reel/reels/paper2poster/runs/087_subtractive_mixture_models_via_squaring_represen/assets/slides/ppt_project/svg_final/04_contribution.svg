<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0e1729"/><rect x="0" y="0" width="1280" height="4" fill="#38bdf8" opacity="0.0"/><rect x="60" y="52" width="6" height="40" rx="3" fill="#38bdf8"/><text x="80" y="70" font-size="15" fill="#38bdf8" font-weight="bold" letter-spacing="2.5">CONTRIBUTION</text><text x="80" y="102" font-size="30" fill="#f1f5fb" font-weight="bold" font-family="'Segoe UI Semibold','Segoe UI',Arial,sans-serif">Four contributions</text><g id="cue_s04_c1_work_makes_four_contributions_first" data-cue-label="work makes four contributions first general framework representing subtractive mixtures"><title>work makes four contributions first general framework representing subtractive mixtures</title><desc>General framework. work makes four contributions first general framework representing subtractive mixtures</desc><rect x="60" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="170" width="5" height="248" rx="2.5" fill="#38bdf8"/><circle cx="100" cy="212" r="17" fill="#38bdf8" fill-opacity="0.16"/><text x="100" y="218" font-size="18" fill="#38bdf8" font-weight="bold" text-anchor="middle">1</text><text x="130" y="218" font-size="20" fill="#f1f5fb" font-weight="bold">General framework</text><text x="88" y="252" font-size="17.5" fill="#9fb0c8">Represent subtractive mixtures by</text><text x="88" y="277" font-size="17.5" fill="#9fb0c8">squaring, in the language of</text><text x="88" y="302" font-size="17.5" fill="#9fb0c8">tensorized probabilistic circuits</text><text x="88" y="327" font-size="17.5" fill="#9fb0c8">(NPC²s).</text></g><g id="cue_s04_c2_second_shows_these_squared_non_monot" data-cue-label="second shows these squared non-monotonic circuits generalize several apparently different"><title>second shows these squared non-monotonic circuits generalize several apparently different</title><desc>A unifying view. second shows these squared non-monotonic circuits generalize several apparently different</desc><rect x="654" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="654" y="170" width="5" height="248" rx="2.5" fill="#a78bfa"/><circle cx="694" cy="212" r="17" fill="#a78bfa" fill-opacity="0.16"/><text x="694" y="218" font-size="18" fill="#a78bfa" font-weight="bold" text-anchor="middle">2</text><text x="724" y="218" font-size="20" fill="#f1f5fb" font-weight="bold">A unifying view</text><text x="682" y="252" font-size="17.5" fill="#9fb0c8">Squared non-monotonic circuits</text><text x="682" y="277" font-size="17.5" fill="#9fb0c8">generalize √-of-density models,</text><text x="682" y="302" font-size="17.5" fill="#9fb0c8">PSD kernel models, and quantum</text><text x="682" y="327" font-size="17.5" fill="#9fb0c8">Born machines.</text></g><g id="cue_s04_c3_third_proves_exponential_lower_bound" data-cue-label="third proves exponential lower bound functions single squared circuit encodes"><title>third proves exponential lower bound functions single squared circuit encodes</title><desc>Exponential separation. third proves exponential lower bound functions single squared circuit encodes</desc><rect x="60" y="438" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="438" width="5" height="248" rx="2.5" fill="#fbbf24"/><circle cx="100" cy="480" r="17" fill="#fbbf24" fill-opacity="0.16"/><text x="100" y="486" font-size="18" fill="#fbbf24" font-weight="bold" text-anchor="middle">3</text><text x="130" y="486" font-size="20" fill="#f1f5fb" font-weight="bold">Exponential separation</text><text x="88" y="520" font-size="17.5" fill="#9fb0c8">A function a single squared circuit</text><text x="88" y="545" font-size="17.5" fill="#9fb0c8">encodes compactly needs</text><text x="88" y="570" font-size="17.5" fill="#9fb0c8">exponentially more units in any</text><text x="88" y="595" font-size="17.5" fill="#9fb0c8">monotonic circuit.</text></g><g id="cue_s04_c4_fourth_backs_experiments_real_world" data-cue-label="fourth backs experiments real-world"><title>fourth backs experiments real-world</title><desc>Broad empirical evidence. fourth backs experiments real-world</desc><rect x="654" y="438" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="654" y="438" width="5" height="248" rx="2.5" fill="#34d399"/><circle cx="694" cy="480" r="17" fill="#34d399" fill-opacity="0.16"/><text x="694" y="486" font-size="18" fill="#34d399" font-weight="bold" text-anchor="middle">4</text><text x="724" y="486" font-size="20" fill="#f1f5fb" font-weight="bold">Broad empirical evidence</text><text x="682" y="520" font-size="17.5" fill="#9fb0c8">Validated on continuous, discrete,</text><text x="682" y="545" font-size="17.5" fill="#9fb0c8">UCI multivariate data, and</text><text x="682" y="570" font-size="17.5" fill="#9fb0c8">language-model distillation.</text></g></svg>