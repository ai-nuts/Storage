<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0e1729"/><rect x="0" y="0" width="1280" height="4" fill="#38bdf8" opacity="0.0"/><rect x="60" y="52" width="6" height="40" rx="3" fill="#34d399"/><text x="80" y="70" font-size="15" fill="#34d399" font-weight="bold" letter-spacing="2.5">METHOD</text><text x="80" y="102" font-size="30" fill="#f1f5fb" font-weight="bold" font-family="'Segoe UI Semibold','Segoe UI',Arial,sans-serif">Square a signed mixture — then go deep, layer by layer</text><g id="cue_s05_c1_core_idea_take_mixture_unconstrained" data-cue-label="core idea take mixture unconstrained real weights components negative coefficients"><title>core idea take mixture unconstrained real weights components negative coefficients</title><desc>Core idea take mixture unconstrained real weights negative. core idea take mixture unconstrained real weights components negative coefficients</desc><rect x="60" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="170" width="5" height="248" rx="2.5" fill="#34d399"/><text x="88" y="214" font-size="20" fill="#f1f5fb" font-weight="bold">Square a signed mixture</text><text x="88" y="248" font-size="16.5" fill="#9fb0c8">Unconstrained real weights let</text><text x="88" y="271" font-size="16.5" fill="#9fb0c8">components be negative; squaring</text><text x="88" y="294" font-size="16.5" fill="#9fb0c8">forces the output non-negative for</text><text x="88" y="317" font-size="16.5" fill="#9fb0c8">any weights.</text><rect x="88" y="356" width="510" height="44" rx="10" fill="#1b2b47" stroke="#2a3c5c" stroke-width="1"/><text x="104" y="384" font-size="17" fill="#34d399" font-family="Consolas,'Courier New',monospace">c²(x) = (Σ wᵢ cᵢ(x))²  ≥ 0 ,  wᵢ ∈ ℝ</text></g><g id="cue_s05_c2_expanding_square_turns_k_component_m" data-cue-label="expanding square turns k-component mixture sum over all pairs components"><title>expanding square turns k-component mixture sum over all pairs components</title><desc>Expanding square turns k-component mixture sum over all pairs. expanding square turns k-component mixture sum over all pairs components</desc><rect x="654" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="654" y="170" width="5" height="248" rx="2.5" fill="#38bdf8"/><text x="682" y="214" font-size="20" fill="#f1f5fb" font-weight="bold">Expand the square</text><text x="682" y="248" font-size="16.5" fill="#9fb0c8">A K-component mixture becomes a</text><text x="682" y="271" font-size="16.5" fill="#9fb0c8">sum over all pairs — a product of</text><text x="682" y="294" font-size="16.5" fill="#9fb0c8">experts whose normalizer Z has a</text><text x="682" y="317" font-size="16.5" fill="#9fb0c8">closed form for many families.</text><rect x="682" y="356" width="510" height="44" rx="10" fill="#1b2b47" stroke="#2a3c5c" stroke-width="1"/><text x="698" y="384" font-size="17" fill="#38bdf8" font-family="Consolas,'Courier New',monospace">Σᵢ Σⱼ wᵢ wⱼ cᵢ(x) cⱼ(x)  /  Z</text></g><g id="cue_s05_c3_deep_authors_square_tensorized_struc" data-cue-label="deep authors square tensorized structured-decomposable circuit layer layer"><title>deep authors square tensorized structured-decomposable circuit layer layer</title><desc>Deep authors square tensorized structured-decomposable circuit layer. deep authors square tensorized structured-decomposable circuit layer layer</desc><rect x="60" y="438" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="438" width="5" height="248" rx="2.5" fill="#a78bfa"/><text x="88" y="482" font-size="20" fill="#f1f5fb" font-weight="bold">Go deep: square each layer</text><text x="88" y="516" font-size="16.5" fill="#9fb0c8">Recursively square a tensorized,</text><text x="88" y="539" font-size="16.5" fill="#9fb0c8">structured-decomposable circuit</text><text x="88" y="562" font-size="16.5" fill="#9fb0c8">layer by layer.</text><rect x="94" y="622" width="104" height="44" rx="9" fill="#1b2b47" stroke="#38bdf8" stroke-width="1.4"/><text x="146" y="650" font-size="14" fill="#38bdf8" font-weight="bold" text-anchor="middle">input</text><line x1="198" y1="644" x2="222" y2="644" stroke="#6b7d99" stroke-width="2"/><polygon points="222.0,644.0 215.0,640.0 215.0,648.0" fill="#6b7d99"/><rect x="222" y="622" width="104" height="44" rx="9" fill="#1b2b47" stroke="#34d399" stroke-width="1.4"/><text x="274" y="650" font-size="14" fill="#34d399" font-weight="bold" text-anchor="middle">⊗ prod</text><line x1="326" y1="644" x2="350" y2="644" stroke="#6b7d99" stroke-width="2"/><polygon points="350.0,644.0 343.0,640.0 343.0,648.0" fill="#6b7d99"/><rect x="350" y="622" width="104" height="44" rx="9" fill="#1b2b47" stroke="#fbbf24" stroke-width="1.4"/><text x="402" y="650" font-size="14" fill="#fbbf24" font-weight="bold" text-anchor="middle">Σ sum</text><line x1="454" y1="644" x2="478" y2="644" stroke="#6b7d99" stroke-width="2"/><polygon points="478.0,644.0 471.0,640.0 471.0,648.0" fill="#6b7d99"/><rect x="478" y="622" width="104" height="44" rx="9" fill="#1b2b47" stroke="#a78bfa" stroke-width="1.4"/><text x="530" y="650" font-size="14" fill="#a78bfa" font-weight="bold" text-anchor="middle">( · )²</text></g><g id="cue_s05_c4_squared_layer_holds_quadratic_number" data-cue-label="squared layer holds quadratic number units but still outputs vector"><title>squared layer holds quadratic number units but still outputs vector</title><desc>Squared layer holds quadratic number units still outputs vector. squared layer holds quadratic number units but still outputs vector</desc><rect x="654" y="438" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="654" y="438" width="5" height="248" rx="2.5" fill="#fbbf24"/><text x="682" y="482" font-size="20" fill="#f1f5fb" font-weight="bold">Still tractable</text><text x="682" y="516" font-size="16.5" fill="#9fb0c8">Each squared layer holds a quadratic</text><text x="682" y="539" font-size="16.5" fill="#9fb0c8">number of units but still outputs a</text><text x="682" y="562" font-size="16.5" fill="#9fb0c8">vector — so the model trains with</text><text x="682" y="585" font-size="16.5" fill="#9fb0c8">gradient descent, computing Z once</text><text x="682" y="608" font-size="16.5" fill="#9fb0c8">per batch.</text><text x="682" y="660" font-size="14.5" fill="#fbbf24" font-family="Consolas,'Courier New',monospace">K units  →  O(K²) units , vector output</text></g></svg>