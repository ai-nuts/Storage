<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0e1729"/><rect x="0" y="0" width="1280" height="4" fill="#38bdf8" opacity="0.0"/><rect x="60" y="52" width="6" height="40" rx="3" fill="#fb7185"/><text x="80" y="70" font-size="15" fill="#fb7185" font-weight="bold" letter-spacing="2.5">PROBLEM</text><text x="80" y="102" font-size="30" fill="#f1f5fb" font-weight="bold" font-family="'Segoe UI Semibold','Segoe UI',Arial,sans-serif">Additive mixtures are wasteful on holey densities</text><g id="cue_s02_c1_traditional_mixture_models_build_com" data-cue-label="traditional mixture models build complex distributions blending simple ones additively"><title>traditional mixture models build complex distributions blending simple ones additively</title><desc>Convex, additive blend. traditional mixture models build complex distributions blending simple ones additively</desc><rect x="60" y="170" width="566" height="248" rx="16" fill="#16223a" stroke="#2a3c5c" stroke-width="1.2"/><rect x="60" y="170" width="5" height="248" rx="2.5" fill="#38bdf8"/><text x="88" y="218" font-size="20" fill="#f1f5fb" font-weight="bold">Convex, additive blend</text><text x="88" y="252" font-size="17.5" fill="#9fb0c8">Classical mixtures build complex</text><text x="88" y="277" font-size="17.5" fill="#9fb0c8">densities by adding simple</text><text x="88" y="302" font-size="17.5" fill="#9fb0c8">components — a convex combination.</text><text x="88" y="327" font-size="17.5" fill="#9fb0c8">Simple, but often wildly inefficient.</text></g><g id="cue_s02_c2_target_distribution_gaps_holes_its" data-cue-label="target distribution gaps holes its domain additive mixture must stack"><title>target distribution gaps holes its domain additive mixture must stack</title><desc>Holes cost many components. target distribution gaps holes its domain additive mixture must stack</desc><rect x="654" y="170" width="566" height="248" rx="16" fill="#16223a