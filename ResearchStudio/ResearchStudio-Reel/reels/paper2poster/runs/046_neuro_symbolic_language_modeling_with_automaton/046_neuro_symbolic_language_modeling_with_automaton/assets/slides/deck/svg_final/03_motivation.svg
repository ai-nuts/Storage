<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#0d1526"/><rect x="0" y="0" width="1280" height="720" fill="none"/><rect x="64.0" y="44.0" width="6.0" height="34.0" rx="3" fill="#f5b642" opacity="1.0"/><text x="88.0" y="60.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#f5b642" font-weight="700" text-anchor="start" letter-spacing="2" style="">03</text><text x="88.0" y="80.0" font-family="Inter, Segoe UI, sans-serif" font-size="30" fill="#e9eef8" font-weight="700" text-anchor="start" style="">Motivation: A Flat Datastore Throws Away Structure</text><line x1="64.0" y1="96.0" x2="1216.0" y2="96.0" stroke="#2c3d63" stroke-width="1.2" stroke-linecap="round"/><g id="cue_s03_c1_key_observation_flat_datastore_throw"><title>key observation flat datastore throws away structure</title><rect x="64.0" y="116.0" width="1152.0" height="86.0" rx="14" fill="#1e2b4a" stroke="#f5b642" stroke-width="1.5" opacity="1.0"/><text x="90.0" y="148.0" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#f5b642" font-weight="700" text-anchor="start" style="">Key observation</text><text x="90.0" y="178.0" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#e9eef8" font-weight="normal" text-anchor="start" style="">kNN-LM treats the datastore as a flat list and searches it token by token, ignoring that consecutive</text><text x="90.0" y="198.0" font-family="Inter, Segoe UI, sans-serif" font-size="16" fill="#e9eef8" font-weight="normal" text-anchor="start" style="">retrieved entries are highly correlated in time and that nearby keys behave alike.</text></g><g id="cue_s03_c2_retrieved_entry_useful_now_entry"><title>retrieved entry useful now entry follows original text very likely</title><rect x="64.0" y="220.0" width="564.0" height="192.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><text x="90.0" y="252.0" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#2dd4bf" font-weight="700" text-anchor="start" style="">1 · Temporal correlation</text><text x="90.0" y="280.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">If a retrieved entry is useful now, the entry</text><text x="90.0" y="301.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">that follows it in the original text is very</text><text x="90.0" y="322.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">likely useful next.</text><circle cx="120.0" cy="376.0" r="13.0" fill="#2dd4bf" stroke="#2dd4bf" stroke-width="1.7"/><text x="120.0" y="381.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2dd4bf" font-weight="normal" text-anchor="middle" style="">e1</text><line x1="135.0" y1="376.0" x2="235.0" y2="376.0" stroke="#f5b642" stroke-width="2.2" stroke-linecap="round"/><polyline points="227.1,380.2 235.0,376.0 227.1,371.8" fill="none" stroke="#f5b642" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250.0" cy="376.0" r="13.0" fill="#1e2b4a" stroke="#2dd4bf" stroke-width="1.7"/><text x="250.0" y="381.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2dd4bf" font-weight="normal" text-anchor="middle" style="">e2</text><line x1="265.0" y1="376.0" x2="365.0" y2="376.0" stroke="#f5b642" stroke-width="2.2" stroke-linecap="round"/><polyline points="357.1,380.2 365.0,376.0 357.1,371.8" fill="none" stroke="#f5b642" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="380.0" cy="376.0" r="13.0" fill="#1e2b4a" stroke="#2dd4bf" stroke-width="1.7"/><text x="380.0" y="381.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2dd4bf" font-weight="normal" text-anchor="middle" style="">e3</text><line x1="395.0" y1="376.0" x2="495.0" y2="376.0" stroke="#f5b642" stroke-width="2.2" stroke-linecap="round"/><polyline points="487.1,380.2 495.0,376.0 487.1,371.8" fill="none" stroke="#f5b642" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="510.0" cy="376.0" r="13.0" fill="#1e2b4a" stroke="#2dd4bf" stroke-width="1.7"/><text x="510.0" y="381.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2dd4bf" font-weight="normal" text-anchor="middle" style="">e4</text></g><g id="cue_s03_c3_entries_whose_key_vectors_close"><title>entries whose key vectors close tend followed same token</title><rect x="652.0" y="220.0" width="564.0" height="192.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><text x="678.0" y="252.0" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#4da3ff" font-weight="700" text-anchor="start" style="">2 · Key-vector locality</text><text x="678.0" y="280.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Entries whose key vectors are close tend to</text><text x="678.0" y="301.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">be followed by the same token, so they can</text><text x="678.0" y="322.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">share their outgoing pointers.</text><circle cx="806.0" cy="376.0" r="8.0" fill="#4da3ff" stroke="#4da3ff" stroke-width="1.5"/><circle cx="780.9" cy="393.0" r="8.0" fill="#4da3ff" stroke="#4da3ff" stroke-width="1.5"/><circle cx="732.9" cy="365.0" r="8.0" fill="#4da3ff" stroke="#4da3ff" stroke-width="1.5"/><circle cx="714.6" cy="366.1" r="8.0" fill="#4da3ff" stroke="#4da3ff" stroke-width="1.5"/><circle cx="745.9" cy="393.4" r="8.0" fill="#1e2b4a" stroke="#4da3ff" stroke-width="1.5"/><circle cx="792.6" cy="374.6" r="8.0" fill="#1e2b4a" stroke="#4da3ff" stroke-width="1.5"/><ellipse cx="770" cy="374" rx="74" ry="26" fill="none" stroke="#4da3ff" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1010.0" y="381.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#4da3ff" font-weight="600" text-anchor="start" style="">same next token</text></g><g id="cue_s03_c4_existing_approaches_like_adaptive_re"><title>existing approaches like adaptive retrieval simply learn when skip search</title><rect x="64.0" y="430.0" width="1152.0" height="186.0" rx="14" fill="#172038" stroke="#f87171" stroke-width="1.4" opacity="1.0"/><text x="90.0" y="462.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#f87171" font-weight="700" text-anchor="start" style="">Prior work · Adaptive Retrieval (AdaptRet)</text><text x="90.0" y="494.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Trains an MLP to learn when to skip the search. But on a skip it backs off to the base LM alone,</text><text x="90.0" y="517.0" font-family="Inter, Segoe UI, sans-serif" font-size="15.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">discarding the retrieval distribution exactly where it helps most, in domains where the base is weak.</text><circle cx="150.0" cy="576.0" r="24.0" fill="#172038" stroke="#4da3ff" stroke-width="2.4"/><text x="150.0" y="581.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#4da3ff" font-weight="700" text-anchor="middle" style="">LM</text><line x1="174.0" y1="576.0" x2="300.0" y2="576.0" stroke="#f87171" stroke-width="2.4" stroke-dasharray="6 5" stroke-linecap="round"/><polyline points="292.1,580.2 300.0,576.0 292.1,571.8" fill="none" stroke="#f87171" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="240.0" y="566.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#f87171" font-weight="normal" text-anchor="middle" style="">skip = lose retrieval</text><rect x="324.0" y="554.0" width="150.0" height="44.0" rx="9" fill="none" stroke="#f87171" stroke-width="1.5" opacity="1.0"/><text x="399.0" y="581.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#f87171" font-weight="600" text-anchor="middle" style="">base LM only</text><text x="520.0" y="582.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">RetoMaton instead keeps the retrieval signal while still skipping the search.</text></g><text x="1216.0" y="694.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#9fb0cc" font-weight="normal" text-anchor="end" style="">RetoMaton · ICML 2022</text></svg>