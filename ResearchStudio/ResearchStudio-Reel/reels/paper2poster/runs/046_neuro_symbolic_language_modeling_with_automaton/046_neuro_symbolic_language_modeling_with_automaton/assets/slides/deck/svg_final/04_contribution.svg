 works whether automaton constructed own</title><rect x="852.0" y="324.0" width="364.0" height="292.0" rx="14" fill="#172038" stroke="#34d399" stroke-width="1.5" opacity="1.0"/><text x="878.0" y="358.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#34d399" font-weight="700" text-anchor="start" style="">Fully unsupervised</text><circle cx="886.0" cy="394.0" r="4.0" fill="#34d399"/><text x="900.0" y="399.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">No extra training data</text><circle cx="886.0" cy="424.0" r="4.0" fill="#34d399"/><text x="900.0" y="429.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Built from the training</text><circle cx="886.0" cy="454.0" r="4.0" fill="#34d399"/><text x="900.0" y="459.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">corpus, or a new domain</text><circle cx="886.0" cy="484.0" r="4.0" fill="#34d399"/><text x="900.0" y="489.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Model-agnostic</text><circle cx="886.0" cy="514.0" r="4.0" fill="#34d399"/><text x="900.0" y="519.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Approximates the next</text><circle cx="886.0" cy="544.0" r="4.0" fill="#34d399"/><text x="900.0" y="549.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">nearest neighbors so most</text><circle cx="886.0" cy="574.0" r="4.0" fill="#34d399"/><text x="900.0" y="579.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">searches are skipped</text></g><text x="1216.0" y="694.0" font-family