<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#0d1526"/><rect x="0" y="0" width="1280" height="720" fill="none"/><rect x="64.0" y="44.0" width="6.0" height="34.0" rx="3" fill="#f87171" opacity="1.0"/><text x="88.0" y="60.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#f87171" font-weight="700" text-anchor="start" letter-spacing="2" style="">02</text><text x="88.0" y="80.0" font-family="Inter, Segoe UI, sans-serif" font-size="30" fill="#e9eef8" font-weight="700" text-anchor="start" style="">The Problem: Search Dominates Inference</text><line x1="64.0" y1="96.0" x2="1216.0" y2="96.0" stroke="#2c3d63" stroke-width="1.2" stroke-linecap="round"/><g id="cue_s02_c1_retrieval_based_language_models_impr"><title>retrieval-based language models improve standard neural models fetching nearest-neighbor examples</title><rect x="64.0" y="118.0" width="564.0" height="300.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><rect x="64.0" y="118.0" width="6.0" height="300.0" rx="3" fill="#2dd4bf" opacity="1.0"/><text x="90.0" y="150.0" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#2dd4bf" font-weight="700" text-anchor="start" style="">Retrieval-based LM</text><text x="90.0" y="180.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Fetches nearest-neighbor examples from an</text><text x="90.0" y="202.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">external datastore and blends them into the</text><text x="90.0" y="224.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">prediction. Better quality than a plain LM.</text><circle cx="150.0" cy="320.0" r="34.0" fill="#172038" stroke="#4da3ff" stroke-width="2.4"/><text x="150.0" y="325.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#4da3ff" font-weight="700" text-anchor="middle" style="">LM</text><line x1="188.0" y1="320.0" x2="262.0" y2="320.0" stroke="#9fb0cc" stroke-width="2.4" stroke-linecap="round"/><polyline points="254.1,324.2 262.0,320.0 254.1,315.8" fill="none" stroke="#9fb0cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="262.0" y="290.0" width="132.0" height="60.0" rx="9" fill="#1e2b4a" stroke="#2dd4bf" stroke-width="1.6" opacity="1.0"/><text x="328.0" y="316.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#2dd4bf" font-weight="600" text-anchor="middle" style="">Datastore</text><text x="328.0" y="336.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#9fb0cc" font-weight="normal" text-anchor="middle" style="">search</text><line x1="394.0" y1="320.0" x2="470.0" y2="320.0" stroke="#9fb0cc" stroke-width="2.4" stroke-linecap="round"/><polyline points="462.1,324.2 470.0,320.0 462.1,315.8" fill="none" stroke="#9fb0cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="470.0" y="290.0" width="132.0" height="60.0" rx="9" fill="#1e2b4a" stroke="#2c3d63" stroke-width="1.4" opacity="1.0"/><text x="536.0" y="316.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#e9eef8" font-weight="600" text-anchor="middle" style="">blended</text><text x="536.0" y="336.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#9fb0cc" font-weight="normal" text-anchor="middle" style="">prediction</text><text x="90.0" y="392.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Accuracy, domain-adaptability and provenance benefits.</text></g><g id="cue_s02_c2_catch_cost_datastore_search_fire"><title>catch cost datastore search fire every single time step far</title><rect x="652.0" y="118.0" width="564.0" height="300.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><rect x="652.0" y="118.0" width="6.0" height="300.0" rx="3" fill="#f87171" opacity="1.0"/><text x="678.0" y="150.0" font-family="Inter, Segoe UI, sans-serif" font-size="20" fill="#f87171" font-weight="700" text-anchor="start" style="">The catch is cost</text><text x="678.0" y="180.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">That datastore search can fire at every single</text><text x="678.0" y="202.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">time step, and it is far slower than the model&#x27;s</text><text x="678.0" y="224.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">own forward pass.</text><text x="678.0" y="266.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Relative cost per token</text><rect x="678.0" y="280.0" width="96.0" height="26.0" rx="6" fill="#4da3ff" opacity="1.0"/><text x="784.0" y="298.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#e9eef8" font-weight="normal" text-anchor="start" style="">LM forward pass</text><rect x="678.0" y="316.0" width="510.0" height="26.0" rx="6" fill="#f87171" opacity="1.0"/><text x="1176.0" y="334.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#0d1526" font-weight="600" text-anchor="end" style="">kNN datastore search</text><text x="678.0" y="384.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Search runs as often as every time step.</text></g><g id="cue_s02_c3_frequent_search_single_most_critical"><title>frequent search single most critical bottleneck keeps these otherwise powerful</title><rect x="64.0" y="436.0" width="1152.0" height="180.0" rx="14" fill="#1e2b4a" stroke="#f87171" stroke-width="1.6" opacity="1.0"/><circle cx="128.0" cy="526.0" r="26.0" fill="none" stroke="#f87171" stroke-width="2.6"/><text x="128.0" y="536.0" font-family="Inter, Segoe UI, sans-serif" font-size="32" fill="#f87171" font-weight="800" text-anchor="middle" style="">!</text><text x="180.0" y="502.0" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#e9eef8" font-weight="800" text-anchor="start" style="">Frequent search is the single most critical bottleneck</text><text x="180.0" y="540.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">It is the dominant computational cost at inference, and it keeps these otherwise powerful</text><text x="180.0" y="564.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">retrieval LMs out of practical, deployable settings despite their accuracy benefits.</text></g><text x="1216.0" y="694.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#9fb0cc" font-weight="normal" text-anchor="end" style="">RetoMaton · ICML 2022</text></svg>