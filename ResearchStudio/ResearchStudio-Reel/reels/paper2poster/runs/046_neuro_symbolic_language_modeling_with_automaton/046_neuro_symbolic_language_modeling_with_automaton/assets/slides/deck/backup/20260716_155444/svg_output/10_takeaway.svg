"Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">A full search fires only when transitions drop below τ.</text></g><g id="cue_s10_c3_unsupervised_works_any_base_transfer"><title>unsupervised works any base transfers across domains unifies token chunk</title><rect x="652.0" y="264.0" width="564.0" height="232.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><text x="678.0" y="298.0" font-family="Inter, Segoe UI, sans-serif" font-size="17" fill="#34d399" font-weight="700" text-anchor="start" style="">Why it matters</text><circle cx="686.0" cy="330.0" r="4.0" fill="#34d399"/><text x="700.0" y="335.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Unsupervised, works with any base model</text><circle cx="686.0" cy="362.0" r="4.0" fill="#34d399"/><text x="700.0" y="367.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Transfers across domains</text><circle cx="686.0" cy="394.0" r="4.0" fill="#34d399"/><text x="700.0" y="399.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Unifies token, chunk and sequence retrieval</text><circle cx="686.0" cy="426.0" r="4.0" fill="#34d399"/><text x="700.0" y="431.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Cuts the dominant cost of retrieval LMs</text><circle cx="686.0" cy="458.0" r="4.0" fill="#34d399"/><text x="700.0" y="463.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Up to 83% fewer searches, or 1.85 lower ppl</text></g><rect x="64.0" y="516.0" width="1152.0" height="72.0" rx="12" fill="#172038" stroke="#2c3d63" stroke-width="1.2" opacity="1.0"/><text x="90