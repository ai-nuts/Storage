<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720"><rect x="0" y="0" width="1280" height="720" fill="#0d1526"/><rect x="0" y="0" width="1280" height="720" fill="none"/><rect x="64.0" y="44.0" width="6.0" height="34.0" rx="3" fill="#4da3ff" opacity="1.0"/><text x="88.0" y="60.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#4da3ff" font-weight="700" text-anchor="start" letter-spacing="2" style="">05</text><text x="88.0" y="80.0" font-family="Inter, Segoe UI, sans-serif" font-size="30" fill="#e9eef8" font-weight="700" text-anchor="start" style="">Method: Traverse the Automaton Alongside the LM</text><line x1="64.0" y1="96.0" x2="1216.0" y2="96.0" stroke="#2c3d63" stroke-width="1.2" stroke-linecap="round"/><g id="cue_s05_c1_retomaton_stores_datastore_entry_tri"><title>retomaton stores datastore entry triple key value pointer where pointer</title><rect x="64.0" y="116.0" width="564.0" height="238.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><text x="90.0" y="148.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#2dd4bf" font-weight="700" text-anchor="start" style="">Entry = (key, value, pointer)</text><rect x="90.0" y="168.0" width="448.0" height="34.0" rx="7" fill="#1e2b4a" stroke="#2c3d63" stroke-width="1" opacity="1.0"/><rect x="96.0" y="174.0" width="52.0" height="22.0" rx="5" fill="none" stroke="#2dd4bf" stroke-width="1.3" opacity="1.0"/><text x="122.0" y="190.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="middle" style="">kᵢ</text><text x="160.0" y="190.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#e9eef8" font-weight="600" text-anchor="start" style="">value wᵢ</text><text x="524.0" y="190.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#f5b642" font-weight="600" text-anchor="end" style="">→ successor</text><rect x="90.0" y="210.0" width="448.0" height="34.0" rx="7" fill="#1e2b4a" stroke="#2c3d63" stroke-width="1" opacity="1.0"/><rect x="96.0" y="216.0" width="52.0" height="22.0" rx="5" fill="none" stroke="#2dd4bf" stroke-width="1.3" opacity="1.0"/><text x="122.0" y="232.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="middle" style="">kⱼ</text><text x="160.0" y="232.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#e9eef8" font-weight="600" text-anchor="start" style="">value wⱼ</text><text x="524.0" y="232.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#f5b642" font-weight="600" text-anchor="end" style="">→ successor</text><rect x="90.0" y="252.0" width="448.0" height="34.0" rx="7" fill="#1e2b4a" stroke="#2c3d63" stroke-width="1" opacity="1.0"/><rect x="96.0" y="258.0" width="52.0" height="22.0" rx="5" fill="none" stroke="#2dd4bf" stroke-width="1.3" opacity="1.0"/><text x="122.0" y="274.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="middle" style="">kₗ</text><text x="160.0" y="274.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#e9eef8" font-weight="600" text-anchor="start" style="">value wₗ</text><text x="524.0" y="274.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#f5b642" font-weight="600" text-anchor="end" style="">→ successor</text><text x="90.0" y="318.0" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">The pointer references the entry that followed it in the corpus.</text></g><g id="cue_s05_c2_entries_close_keys_clustered_states"><title>entries close keys clustered states state inherits all pointers its</title><rect x="652.0" y="116.0" width="564.0" height="238.0" rx="14" fill="#172038" stroke="#2c3d63" stroke-width="1.5" opacity="1.0"/><text x="678.0" y="148.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#4da3ff" font-weight="700" text-anchor="start" style="">Keep a small set of active states</text><text x="678.0" y="176.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Close-key entries are clustered into a state; the</text><text x="678.0" y="197.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">state inherits all pointers of its members.</text><circle cx="730.0" cy="270.0" r="30.0" fill="#172038" stroke="#4da3ff" stroke-width="2.4"/><text x="730.0" y="275.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#4da3ff" font-weight="700" text-anchor="middle" style="">S₁</text><circle cx="850.0" cy="270.0" r="30.0" fill="#172038" stroke="#2dd4bf" stroke-width="2.4"/><text x="850.0" y="275.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#2dd4bf" font-weight="700" text-anchor="middle" style="">S₂</text><circle cx="970.0" cy="270.0" r="30.0" fill="#172038" stroke="#f5b642" stroke-width="2.4"/><text x="970.0" y="275.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#f5b642" font-weight="700" text-anchor="middle" style="">S₃</text><line x1="760.0" y1="270.0" x2="820.0" y2="270.0" stroke="#f5b642" stroke-width="2" stroke-linecap="round"/><polyline points="812.1,274.2 820.0,270.0 812.1,265.8" fill="none" stroke="#f5b642" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="880.0" y1="270.0" x2="940.0" y2="270.0" stroke="#f5b642" stroke-width="2" stroke-linecap="round"/><polyline points="932.1,274.2 940.0,270.0 932.1,265.8" fill="none" stroke="#f5b642" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="678.0" y="330.0" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Traversed in parallel with LM inference, visiting a set of states each step.</text></g><g id="cue_s05_c3_move_forward_just_follows_pointers"><title>move forward just follows pointers entries whose value matches generated</title><rect x="64.0" y="372.0" width="564.0" height="244.0" rx="14" fill="#1e2b4a" stroke="#f5b642" stroke-width="1.5" opacity="1.0"/><text x="90.0" y="404.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#f5b642" font-weight="700" text-anchor="start" style="">Move forward = follow pointers</text><text x="90.0" y="434.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Follow the pointers of entries whose value</text><text x="90.0" y="455.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">matches the generated token. Essentially free.</text><circle cx="150.0" cy="520.0" r="30.0" fill="#172038" stroke="#4da3ff" stroke-width="2.4"/><text x="150.0" y="525.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#4da3ff" font-weight="700" text-anchor="middle" style="">S</text><line x1="180.0" y1="520.0" x2="360.0" y2="520.0" stroke="#34d399" stroke-width="3" stroke-linecap="round"/><polyline points="352.1,524.2 360.0,520.0 352.1,515.8" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="270.0" y="508.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#34d399" font-weight="normal" text-anchor="middle" style="">free transition</text><circle cx="390.0" cy="520.0" r="30.0" fill="#172038" stroke="#2dd4bf" stroke-width="2.4"/><text x="390.0" y="525.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#2dd4bf" font-weight="700" text-anchor="middle" style="">S′</text><text x="90.0" y="586.0" font-family="Inter, Segoe UI, sans-serif" font-size="13.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">No search needed while valid transitions remain.</text></g><g id="cue_s05_c4_automaton_transition_weights_compute"><title>automaton transition weights computed dynamically distance between current hidden state</title><rect x="652.0" y="372.0" width="564.0" height="244.0" rx="14" fill="#172038" stroke="#f87171" stroke-width="1.4" opacity="1.0"/><text x="678.0" y="404.0" font-family="Inter, Segoe UI, sans-serif" font-size="18" fill="#f87171" font-weight="700" text-anchor="start" style="">Search only when transitions &lt; τ</text><text x="678.0" y="434.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">A full kNN search is triggered, and restarts the</text><text x="678.0" y="455.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">traversal, only when valid onward transitions</text><text x="678.0" y="476.0" font-family="Inter, Segoe UI, sans-serif" font-size="14.5" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">drop below threshold τ.</text><text x="678.0" y="510.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">Transition weights are dynamic (hidden-state</text><text x="678.0" y="531.0" font-family="Inter, Segoe UI, sans-serif" font-size="14" fill="#9fb0cc" font-weight="normal" text-anchor="start" style="">distances), interpolated with the base LM by λ:</text><rect x="678.0" y="548.0" width="510.0" height="34.0" rx="8" fill="#1e2b4a" stroke="#2c3d63" stroke-width="1" opacity="1.0"/><text x="688.0" y="570.0" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#e9eef8" font-weight="600" text-anchor="start" style="">p = λ · p_auto(w | c,S) + (1−λ) · p_LM(w | c)</text><text x="678.0" y="606.0" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#f5b642" font-weight="normal" text-anchor="start" style="">τ trades accuracy (more searches) against speed (fewer).</text></g><text x="1216.0" y="694.0" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#9fb0cc" font-weight="normal" text-anchor="end" style="">RetoMaton · ICML 2022</text></svg>