<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Segoe UI&quot;, &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F9"/>

  <g id="header">
    <text x="64" y="76" font-size="15" font-weight="700" fill="#1E63E9" letter-spacing="2.5">KEY RESULT</text>
    <text x="64" y="120" font-size="40" font-weight="700" fill="#0E1B2B">Presence lifts short-horizon discrimination</text>
    <rect x="64" y="140" width="120" height="3" fill="#1E63E9"/>
  </g>

  <g id="chart-frame">
    <rect x="64" y="172" width="740" height="466" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
  </g>

  <g id="cue_s07_c1_random_population_split_three_propos" data-cue-label="cue_s07_c1_random_population_split_three_propos">
    <desc>random, population, split, three, proposed, methods, deliver, competitive-to-best, discrimination, against</desc>
    <text x="88" y="212" font-size="20" font-weight="700" fill="#0E1B2B">1-day C-index · same-input models</text>
    <text x="88" y="240" font-size="15" fill="#6B7787">Random population split — three proposed methods are competitive-to-best.</text>
  </g>

  <g id="bars-baseline">
    <line x1="300" y1="270" x2="300" y2="560" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="300" y="288" width="153" height="36" rx="2" fill="#B7C0CC"/>
    <text x="88" y="311" font-size="15" font-weight="500" fill="#3A4658">Ignore-LSTM</text>
    <text x="461" y="311" font-size="20" font-weight="700" fill="#6B7787">0.853</text>
    <rect x="300" y="350" width="176" height="36" rx="2" fill="#B7C0CC"/>
    <text x="88" y="373" font-size="15" font-weight="500" fill="#3A4658">GRU-D</text>
    <text x="484" y="373" font-size="20" font-weight="700" fill="#6B7787">0.855</text>
  </g>

  <g id="cue_s07_c2_strikingly_deepjoint_which_sees_only" data-cue-label="cue_s07_c2_strikingly_deepjoint_which_sees_only">
    <desc>strikingly, deepjoint, which, sees, only, laboratory, values, already, outperforms, both</desc>
    <rect x="300" y="412" width="259" height="36" rx="2" fill="#1E63E9"/>
    <text x="88" y="435" font-size="15" font-weight="700" fill="#0E1B2B">DeepJoint</text>
    <text x="88" y="456" font-size="13" fill="#6B7787">labs only</text>
    <text x="567" y="435" font-size="20" font-weight="700" fill="#1E63E9">0.862</text>
  </g>

  <g id="cue_s07_c4_fine_tuning_adds_further_edge_reachi" data-cue-label="cue_s07_c4_fine_tuning_adds_further_edge_reachi">
    <desc>fine-tuning, adds, further, edge, reaching, one-day, c-index, 0.878</desc>
    <rect x="300" y="474" width="447" height="36" rx="2" fill="#E4572E"/>
    <text x="88" y="497" font-size="15" font-weight="700" fill="#0E1B2B">DeepJointFineTune</text>
    <text x="755" y="497" font-size="20" font-weight="700" fill="#E4572E">0.878</text>
    <rect x="88" y="510" width="52" height="20" rx="3" fill="#FBE9E3"/>
    <text x="114" y="524" font-size="13" font-weight="700" fill="#E4572E" text-anchor="middle" letter-spacing="1">BEST</text>
  </g>

  <g id="chart-axis">
    <text x="300" y="588" font-size="13" fill="#6B7787" text-anchor="middle">0.84</text>
    <text x="770" y="588" font-size="13" fill="#6B7787" text-anchor="end">0.88</text>
    <text x="88" y="616" font-size="13" fill="#6B7787">1-day time-dependent C-index — higher is better (axis starts at 0.84)</text>
  </g>

  <g id="cue_s07_c3_modelling_observation_process_even_w" data-cue-label="cue_s07_c3_modelling_observation_process_even_w">
    <desc>modelling, observation, process, even, without, feeding, yields, more, predictive, embedding</desc>
    <rect x="828" y="172" width="388" height="466" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="828" y="172" width="4" height="466" fill="#0FA3A3"/>
    <text x="852" y="222" font-size="24" font-weight="700" fill="#0E1B2B">Why it matters</text>
    <text x="852" y="272" font-size="20" fill="#3A4658">DeepJoint sees only lab</text>
    <text x="852" y="300" font-size="20" fill="#3A4658">values, yet beats Ignore-LSTM</text>
    <text x="852" y="328" font-size="20" fill="#3A4658">and GRU-D — which takes</text>
    <text x="852" y="356" font-size="20" fill="#3A4658">missingness as an input.</text>
    <line x1="852" y1="396" x2="1192" y2="396" stroke="#DCE2EA" stroke-width="1"/>
    <text x="852" y="446" font-size="20" fill="#3A4658">Modelling the observation</text>
    <text x="852" y="474" font-size="20" fill="#3A4658">process — even without</text>
    <text x="852" y="502" font-size="20" fill="#3A4658">feeding it in — yields a</text>
    <text x="852" y="530" font-size="20" font-weight="700" fill="#0E1B2B">more predictive embedding.</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-size="13" fill="#6B7787">07 / 10</text>
    <text x="1216" y="700" font-size="13" fill="#6B7787" text-anchor="end">DeepJoint · NeurIPS 2022</text>
