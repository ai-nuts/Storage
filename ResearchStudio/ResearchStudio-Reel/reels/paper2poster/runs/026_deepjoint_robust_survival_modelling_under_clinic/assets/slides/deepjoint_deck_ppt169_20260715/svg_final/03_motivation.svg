<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Segoe UI&quot;, &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F9"/>

  <g id="header">
    <text x="64" y="76" font-size="15" font-weight="700" fill="#1E63E9" letter-spacing="2.5">MOTIVATION</text>
    <text x="64" y="120" font-size="40" font-weight="700" fill="#0E1B2B">Clinical presence shifts — and models break</text>
    <rect x="64" y="140" width="120" height="3" fill="#1E63E9"/>
  </g>

  <g id="cue_s03_c1_key_challenge_heterogeneity_same_pat" data-cue-label="cue_s03_c1_key_challenge_heterogeneity_same_pat">
    <desc>key, challenge, heterogeneity, same, patient, population, appear, very, differently, depending</desc>
    <rect x="64" y="182" width="560" height="340" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="64" y="182" width="4" height="340" fill="#0FA3A3"/>
    <text x="88" y="228" font-size="24" font-weight="700" fill="#0E1B2B">Heterogeneity is the key challenge</text>
    <text x="88" y="268" font-size="20" fill="#3A4658">The same patient population can look</text>
    <text x="88" y="296" font-size="20" fill="#3A4658">very different depending on the observation</text>
    <text x="88" y="324" font-size="20" fill="#3A4658">process — it shifts across countries, over</text>
    <text x="88" y="352" font-size="20" fill="#3A4658">time, and between weekdays and weekends.</text>
    <text x="88" y="398" font-size="13" font-weight="700" fill="#6B7787" letter-spacing="1.5">OBSERVATION DENSITY, SAME COHORT</text>
    <rect x="100" y="446" width="18" height="42" fill="#0FA3A3"/>
    <rect x="124" y="432" width="18" height="56" fill="#0FA3A3"/>
    <rect x="148" y="452" width="18" height="36" fill="#0FA3A3"/>
    <rect x="172" y="424" width="18" height="64" fill="#0FA3A3"/>
    <rect x="196" y="440" width="18" height="48" fill="#0FA3A3"/>
    <rect x="220" y="456" width="18" height="32" fill="#0FA3A3"/>
    <text x="100" y="508" font-size="13" fill="#6B7787">Weekday</text>
    <rect x="372" y="472" width="18" height="16" fill="#B7C0CC"/>
    <rect x="396" y="466" width="18" height="22" fill="#B7C0CC"/>
    <rect x="420" y="476" width="18" height="12" fill="#B7C0CC"/>
    <rect x="444" y="470" width="18" height="18" fill="#B7C0CC"/>
    <rect x="468" y="478" width="18" height="10" fill="#B7C0CC"/>
    <rect x="492" y="474" width="18" height="14" fill="#B7C0CC"/>
    <text x="372" y="508" font-size="13" fill="#6B7787">Weekend</text>
  </g>

  <g id="cue_s03_c2_literature_studied_covariate_label_s" data-cue-label="cue_s03_c2_literature_studied_covariate_label_s">
    <desc>literature, studied, covariate, label, shift, but, shift, observation, process, itself</desc>
    <rect x="648" y="182" width="568" height="158" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="648" y="182" width="4" height="158" fill="#0FA3A3"/>
    <text x="672" y="226" font-size="24" font-weight="700" fill="#0E1B2B">A gap in the literature</text>
    <text x="672" y="266" font-size="20" fill="#3A4658">ML has studied covariate and label shift.</text>
    <text x="672" y="294" font-size="20" fill="#3A4658">Shift in the observation process itself</text>
    <text x="672" y="322" font-size="20" fill="#3A4658">remains under-explored.</text>
  </g>

  <g id="cue_s03_c3_deepjoint_asks_how_explicitly_modell" data-cue-label="cue_s03_c3_deepjoint_asks_how_explicitly_modell">
    <desc>deepjoint, asks, how, explicitly, modelling, clinical, presence, makes, survival, models</desc>
    <rect x="648" y="364" width="568" height="158" rx="4" fill="#1E63E9"/>
    <text x="672" y="404" font-size="13" font-weight="700" fill="#CFE0FC" letter-spacing="2">DEEPJOINT'S QUESTION</text>
    <text x="672" y="440" font-size="24" font-weight="700" fill="#FFFFFF">Does explicitly modelling</text>
    <text x="672" y="470" font-size="24" font-weight="700" fill="#FFFFFF">clinical presence make survival</text>
    <text x="672" y="500" font-size="24" font-weight="700" fill="#FFFFFF">models robust to this shift?</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-size="13" fill="#6B7787">03 / 10</text>
    <text x="1216" y="700" font-size="13" fill="#6B7787" text-anchor="end">DeepJoint · NeurIPS 2022</text>
  </g>
</svg>
