<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Segoe UI&quot;, &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F9"/>

  <g id="header">
    <text x="64" y="76" font-size="15" font-weight="700" fill="#1E63E9" letter-spacing="2.5">TAKEAWAY</text>
    <text x="64" y="120" font-size="40" font-weight="700" fill="#0E1B2B">Clinical presence is signal, not noise</text>
    <rect x="64" y="140" width="120" height="3" fill="#1E63E9"/>
  </g>

  <g id="cue_s10_c1_takeaway_way_clinical_sampled_itself" data-cue-label="cue_s10_c1_takeaway_way_clinical_sampled_itself">
    <desc>takeaway, way, clinical, sampled, itself, informative, jointly, modelling, observation, process</desc>
    <rect x="64" y="182" width="1152" height="210" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="64" y="182" width="4" height="210" fill="#0FA3A3"/>
    <text x="100" y="228" font-size="13" font-weight="700" fill="#1E63E9" letter-spacing="2">THE TAKEAWAY</text>
    <text x="100" y="276" font-size="26" font-weight="500" fill="#0E1B2B">The way clinical data are sampled is itself informative. Jointly modelling the</text>
    <text x="100" y="314" font-size="26" font-weight="500" fill="#0E1B2B">observation process with survival gives predictions that are both more accurate</text>
    <text x="100" y="352" font-size="26" font-weight="500" fill="#0E1B2B">and markedly more robust when clinical practice changes.</text>
  </g>

  <g id="cue_s10_c2_clinical_presence_signal_not_noise" data-cue-label="cue_s10_c2_clinical_presence_signal_not_noise">
    <desc>clinical, presence, signal, not, noise, modelling, makes, medical, predictions, transportable</desc>
    <rect x="64" y="416" width="1152" height="108" rx="4" fill="#1E63E9"/>
    <text x="100" y="466" font-size="26" font-weight="700" fill="#FFFFFF">Model clinical presence →</text>
    <text x="424" y="466" font-size="26" font-weight="400" fill="#CFE0FC">transportable medical predictions.</text>
    <text x="100" y="500" font-size="15" fill="#CFE0FC">Signal, not noise: it improves both discrimination and robustness under shift.</text>
  </g>

  <g id="references">
    <text x="64" y="576" font-size="13" font-weight="700" fill="#1E63E9" letter-spacing="2">PAPER · CODE</text>
    <text x="64" y="608" font-size="18" fill="#3A4658">arXiv 2205.13481</text>
    <text x="64" y="636" font-size="18" fill="#3A4658">github.com/Jeanselme/ClinicalPresence</text>
  </g>

