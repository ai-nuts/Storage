<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Segoe UI&quot;, &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F9"/>

  <g id="header">
    <text x="64" y="76" font-size="15" font-weight="700" fill="#1E63E9" letter-spacing="2.5">METHOD</text>
    <text x="64" y="120" font-size="40" font-weight="700" fill="#0E1B2B">Architecture: one embedding, four heads</text>
    <rect x="64" y="140" width="120" height="3" fill="#1E63E9"/>
  </g>

  <g id="architecture-figure">
    <rect x="64" y="172" width="720" height="366" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <image href="../images/arch_fig1.png" x="72" y="182" width="704" height="342" preserveAspectRatio="xMidYMid meet"/>
    <text x="76" y="530" font-size="13" fill="#6B7787">Fig 1 · DeepJoint — LSTM embedding h feeding heads L, I, M (clinical presence) and S (survival)</text>
  </g>

  <g id="cue_s05_c1_long_short_term_memory_network" data-cue-label="cue_s05_c1_long_short_term_memory_network">
    <desc>long, short, term, memory, network, extracts, embedding, patient, irregular, sequence</desc>
    <rect x="808" y="172" width="408" height="100" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="808" y="172" width="4" height="100" fill="#1E63E9"/>
    <text x="832" y="204" font-size="20" font-weight="700" fill="#0E1B2B">LSTM encoder</text>
    <text x="832" y="232" font-size="15" fill="#3A4658">Encodes each patient's irregular lab-test</text>
    <text x="832" y="254" font-size="15" fill="#3A4658">sequence into a single embedding h.</text>
  </g>

  <g id="cue_s05_c2_embedding_drives_three_clinical_pres" data-cue-label="cue_s05_c2_embedding_drives_three_clinical_pres">
    <desc>embedding, drives, three, clinical-presence, heads, longitudinal, head, predicting, next, test</desc>
    <rect x="808" y="288" width="408" height="150" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="808" y="288" width="4" height="150" fill="#0FA3A3"/>
    <text x="832" y="320" font-size="20" font-weight="700" fill="#0E1B2B">Three clinical-presence heads</text>
    <text x="832" y="352" font-size="15" fill="#3A4658">L — next test values (Gaussian)</text>
    <text x="832" y="378" font-size="15" fill="#3A4658">M — which tests appear (Bernoulli)</text>
    <text x="832" y="404" font-size="15" fill="#3A4658">I — inter-observation intensity (timing)</text>
  </g>

  <g id="cue_s05_c3_deepsurv_head_models_survival_under" data-cue-label="cue_s05_c3_deepsurv_head_models_survival_under">
    <desc>deepsurv, head, models, survival, under, cox, proportional, hazards</desc>
    <rect x="808" y="454" width="408" height="84" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="808" y="454" width="4" height="84" fill="#E4572E"/>
    <text x="832" y="486" font-size="20" font-weight="700" fill="#0E1B2B">DeepSurv head (S)</text>
    <text x="832" y="516" font-size="15" fill="#3A4658">Models survival under Cox proportional hazards.</text>
  </g>

  <g id="cue_s05_c4_four_losses_combined_dynamic_weighti" data-cue-label="cue_s05_c4_four_losses_combined_dynamic_weighti">
    <desc>four, losses, combined, dynamic, weighting, balanced, hyperparameter, alpha, optimised, end</desc>
    <rect x="64" y="552" width="1152" height="116" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="64" y="552" width="4" height="116" fill="#1E63E9"/>
    <text x="100" y="584" font-size="13" font-weight="700" fill="#1E63E9" letter-spacing="2">TRAINING OBJECTIVE — DYNAMIC WEIGHTING</text>
    <text x="100" y="622" font-size="24" font-weight="500" fill="#0E1B2B">ℓ(e) = (1 − α) · ℓ_S  +  α · Σ w_task(e) · ℓ_task(e)      task ∈ {L, I, M}</text>
    <text x="100" y="652" font-size="15" fill="#6B7787">Four losses combined, balanced by the hyperparameter α, and optimised end-to-end.</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-size="13" fill="#6B7787">05 / 10</text>
    <text x="1216" y="700" font-size="13" fill="#6B7787" text-anchor="end">DeepJoint · NeurIPS 2022</text>
  </g>
</svg>
