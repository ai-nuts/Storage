    <text x="64" y="120" font-size="40" font-weight="700" fill="#0E1B2B">A joint model of clinical presence + survival</text>
    <rect x="64" y="140" width="120" height="3" fill="#1E63E9"/>
  </g>

  <g id="cue_s04_c1_contributes_deep_joint_treats_clinic" data-cue-label="cue_s04_c1_contributes_deep_joint_treats_clinic">
