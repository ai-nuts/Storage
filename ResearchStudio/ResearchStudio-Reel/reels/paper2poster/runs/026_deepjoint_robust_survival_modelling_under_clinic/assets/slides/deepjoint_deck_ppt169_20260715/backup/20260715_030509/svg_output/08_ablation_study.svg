<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Segoe UI&quot;, &quot;Inter&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#F4F6F9"/>

  <g id="header">
    <text x="64" y="76" font-size="15" font-weight="700" fill="#1E63E9" letter-spacing="2.5">ABLATION STUDY</text>
    <text x="64" y="120" font-size="40" font-weight="700" fill="#0E1B2B">Variants × baselines: discrimination and robustness</text>
    <rect x="64" y="140" width="120" height="3" fill="#1E63E9"/>
  </g>

  <g id="cue_s08_c1_approach_decomposes_three_variants_a" data-cue-label="cue_s08_c1_approach_decomposes_three_variants_a">
    <desc>approach, decomposes, three, variants, against, six, baselines</desc>
    <rect x="64" y="182" width="536" height="132" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="64" y="182" width="4" height="132" fill="#0FA3A3"/>
    <text x="88" y="220" font-size="20" font-weight="700" fill="#0E1B2B">3 variants vs 6 baselines</text>
    <text x="88" y="252" font-size="15" fill="#3A4658">Variants: DeepJoint · DeepJointFeature · DeepJointFineTune</text>
    <text x="88" y="278" font-size="15" fill="#3A4658">Baselines: Last · Count · Ignore · Resample · Feature · GRU-D</text>
    <text x="88" y="304" font-size="15" fill="#6B7787">Same inputs, compared on discrimination and transfer.</text>
  </g>

  <g id="cue_s08_c2_deepjointfeature_which_adds_clinical" data-cue-label="cue_s08_c2_deepjointfeature_which_adds_clinical">
    <desc>deepjointfeature, which, adds, clinical-presence, features, joint, improves, over, plain, deepjoint</desc>
    <rect x="64" y="330" width="536" height="132" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="64" y="330" width="4" height="132" fill="#1E63E9"/>
    <text x="88" y="368" font-size="20" font-weight="700" fill="#0E1B2B">DeepJointFeature improves</text>
    <text x="88" y="400" font-size="15" fill="#3A4658">Adding clinical-presence features to the joint model</text>
    <text x="88" y="426" font-size="15" fill="#3A4658">beats plain DeepJoint and matches the strong</text>
    <text x="88" y="452" font-size="15" fill="#3A4658">Feature baseline.</text>
  </g>

  <g id="cue_s08_c3_fine_tuned_variant_reaches_highest_p" data-cue-label="cue_s08_c3_fine_tuned_variant_reaches_highest_p">
    <desc>fine-tuned, variant, reaches, highest, population-level, discrimination, but, overfits, when, observation</desc>
    <rect x="64" y="478" width="536" height="134" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <rect x="64" y="478" width="4" height="134" fill="#E4572E"/>
    <text x="88" y="516" font-size="20" font-weight="700" fill="#0E1B2B">DeepJointFineTune overfits</text>
    <text x="88" y="548" font-size="15" fill="#3A4658">Highest population-level discrimination internally,</text>
    <text x="88" y="574" font-size="15" fill="#3A4658">but degrades when the observation process shifts —</text>
    <text x="88" y="600" font-size="15" fill="#3A4658">strong discrimination does not guarantee transfer.</text>
  </g>

  <g id="cue_s08_c4_across_robustness_experiment_deepjoi" data-cue-label="cue_s08_c4_across_robustness_experiment_deepjoi">
    <desc>across, robustness, experiment, deepjointfeature, best, combines, strong, discrimination, proximity, diagonal</desc>
    <rect x="624" y="182" width="592" height="430" rx="4" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/>
    <text x="648" y="220" font-size="20" font-weight="700" fill="#0E1B2B">Robustness — closeness to the diagonal</text>
    <text x="648" y="246" font-size="13" fill="#6B7787">Transferred vs internal (oracle) C-index · y = x means perfect transfer</text>
    <line x1="712" y1="290" x2="712" y2="560" stroke="#B7C0CC" stroke-width="1.5"/>
    <line x1="712" y1="560" x2="1160" y2="560" stroke="#B7C0CC" stroke-width="1.5"/>
    <line x1="712" y1="560" x2="1160" y2="300" stroke="#1E63E9" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="1150" y="322" font-size="13" font-weight="700" fill="#1E63E9" text-anchor="end">y = x</text>
    <circle cx="980" cy="392" r="7" fill="#E4572E"/>
    <text x="994" y="388" font-size="15" font-weight="700" fill="#0E1B2B">DeepJointFeature</text>
    <text x="994" y="408" font-size="13" fill="#6B7787">closest to diagonal → best transfer</text>
    <circle cx="900" cy="470" r="6" fill="#B7C0CC"/>
    <text x="912" y="474" font-size="13" fill="#6B7787">DeepJointFineTune</text>
    <circle cx="820" cy="512" r="6" fill="#B7C0CC"/>
    <text x="832" y="516" font-size="13" fill="#6B7787">baselines</text>
    <text x="712" y="592" font-size="13" fill="#6B7787">internal (oracle) C-index →</text>
    <text x="648" y="300" font-size="13" fill="#6B7787">transferred ↑</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-size="13" fill="#6B7787">08 / 10</text>
    <text x="1216" y="700" font-size="13" fill="#6B7787" text-anchor="end">DeepJoint · NeurIPS 2022</text>
  </g>
</svg>
