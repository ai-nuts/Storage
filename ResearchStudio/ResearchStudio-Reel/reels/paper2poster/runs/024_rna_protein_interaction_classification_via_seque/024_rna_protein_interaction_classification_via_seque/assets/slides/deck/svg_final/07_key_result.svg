<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Real signal where baselines hit chance</text><g id="cue_s07_c1_hardest_test_tsfam_where_rna"><title>hardest test tsfam where rna family overlaps rpiembeddor reaches 1</title><rect x="64" y="152" width="1152" height="140" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="152" width="6" height="140" rx="6" fill="#48C78E"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">On TSfam, where no RNA family overlaps training</text><rect x="92" y="204" width="220" height="74" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="202.0" y="242.48000000000002" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.16" fill="#48C78E" font-weight="800" text-anchor="middle">0.586</text><text x="202.0" y="263.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">F1 on TSfam</text><rect x="332" y="204" width="220" height="74" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="442.0" y="242.48000000000002" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.16" fill="#34D3C0" font-weight="800" text-anchor="middle">0.667</text><text x="442.0" y="263.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">accuracy</text><rect x="576" y="204" width="300" height="74" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="592" y1="262" x2="864" y2="262" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><line x1="592" y1="262" x2="592" y2="218" stroke="#26455F" stroke-width="1.2" stroke-linecap="round"/><line x1="592" y1="262" x2="864" y2="218" stroke="#F2685C" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/><polyline points="592.0,262.0 605.6,257.9142089517787 619.2,254.0174900128853 632.8,250.31086876412544 646.4,246.7954355409902 660.0,243.47235372187782 673.6,240.34286968566636 687.2,237.40832491478238 700.8,234.670170901719 714.4,232.12998778866353 728.0,229.7895080878992 741.6,227.65064749574412 755.2,225.71554591375192 768.8,223.98662370150095 782.4,222.46666169710178 796.0,221.15892047624186 809.6,220.0673293398349 823.2,219.19681236827026 836.8,218.55392718118944 850.4,218.1484211132441 864.0,218.0" fill="none" stroke="#48C78E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="862" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#48C78E" font-weight="800" text-anchor="end">AUC .70</text><text x="862" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#F2685C" font-weight="700" text-anchor="end">chance</text><text x="594" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#6E869C" font-weight="600" text-anchor="start">FPR -&gt;</text><rect x="900" y="204" width="300" height="74" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="920" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Best of all methods on the</text><text x="920" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">homology-separated test set.</text></g><g id="cue_s07_c2_its_roc_area_under_curve"><title>its roc area under curve zero-point-seven-zero while competing tools xrpi</title><rect x="64" y="308" width="560" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="210" rx="6" fill="#4C9BE8"/><text x="92" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">AUC 0.70 vs baselines at chance</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Its ROC area under the curve is 0.70, while XRPI and</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">IPMiner sit at 0.48 and 0.50, essentially chance.</text><rect x="300" y="428" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="428" width="175" height="22" rx="6" fill="#48C78E"/><text x="288" y="445.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">RPIembeddor</text><text x="485" y="445.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">0.70</text><rect x="300" y="456" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="456" width="125" height="22" rx="6" fill="#F2C14E"/><text x="288" y="473.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">IPMiner</text><text x="435" y="473.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">0.50</text><rect x="300" y="484" width="250" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="484" width="120" height="22" rx="6" fill="#F2685C"/><text x="288" y="501.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">XRPI</text><text x="430" y="501.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">0.48</text></g><g id="cue_s07_c3_concrete_terms_rpiembeddor_correctly"><title>concrete terms rpiembeddor correctly labels nearly three thousand positive interactions</title><rect x="656" y="308" width="560" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="308" width="6" height="210" rx="6" fill="#F2C14E"/><text x="684" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Concretely, it separates the classes</text><text x="684" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RPIembeddor correctly labels nearly 3,000 positive</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">interactions and over 5,000 negatives, whereas XRPI</text><text x="684" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">predicts almost everything as interacting.</text><rect x="684" y="452" width="164" height="58" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="766.0" y="482.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19.720000000000002" fill="#48C78E" font-weight="800" text-anchor="middle">2,971</text><text x="766.0" y="498.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">true positives</text><rect x="864" y="452" width="164" height="58" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="946.0" y="482.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19.720000000000002" fill="#34D3C0" font-weight="800" text-anchor="middle">5,586</text><text x="946.0" y="498.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">true negatives</text><rect x="1044" y="452" width="144" height="58" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1116.0" y="482.16" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19.720000000000002" fill="#F2685C" font-weight="800" text-anchor="middle">~91%</text><text x="1116.0" y="498.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">XRPI all-pos</text></g><g id="cue_s07_c4_clearly_learns_real_signal_generaliz"><title>clearly learns real signal generalizes unseen rna families</title><rect x="64" y="534" width="1152" height="64" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="534" width="6" height="64" rx="6" fill="#F2C14E"/><text x="92" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">The verdict</text><text x="210" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">The model clearly learns real signal that generalizes to unseen RNA families,</text><text x="210" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">rather than memorizing the families it trained on.</text></g></svg>