<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">University of Freiburg  ·  ELLIS Institute Tuebingen  ·  Sequence-only RPI</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">RNA-Protein Interaction Classification</text><text x="64" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#4C9BE8" font-weight="800" text-anchor="start">via Sequence Embeddings   —   RPIembeddor  +  RNAInterAct</text><polyline points="946.0,140.0 951.9,141.63411754699135 957.8,143.17793349817683 963.7,144.54613633831127 969.6,145.66311896062464 975.5,146.467156727579 981.4,146.91381838416595 987.3,146.9784213361319 993.2,146.65739561406608 999.1,145.96848115047865 1005.0,144.94974746830584 1010.9,143.65748995301163 1016.8,142.16311896062464 1022.7,140.54921367009493 1028.6,138.90495874471839 1034.5,137.32121597344437 1040.4,135.88550323395268 1046.3,134.6771582407998 1052.2,133.76295433068142 1058.1,133.19341055721625 1064.0,133.0 1069.9,133.19341055721625 1075.8,133.76295433068142 1081.7,134.67715824079977 1087.6,135.88550323395268 1093.5,137.32121597344437 1099.4,138.90495874471839 1105.3,140.54921367009493 1111.2,142.16311896062464 1117.1,143.65748995301163 1123.0,144.94974746830584 1128.9,145.96848115047865 1134.8,146.65739561406608 1140.7,146.9784213361319 1146.6,146.91381838416598 1152.5,146.467156727579 1158.4,145.66311896062464 1164.3,144.5461363383113 1170.2,143.17793349817683 1176.1,141.63411754699135 1182.0,140.0" fill="none" stroke="#34D3C0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="959.1111111111111" cy="143.5" r="3.1" fill="#34D3C0"/><circle cx="985.3333333333334" cy="147.0" r="3.1" fill="#34D3C0"/><circle cx="1011.5555555555555" cy="143.5" r="3.1" fill="#34D3C0"/><circle cx="1037.7777777777778" cy="136.5" r="3.1" fill="#34D3C0"/><circle cx="1064.0" cy="133.0" r="3.1" fill="#34D3C0"/><circle cx="1090.2222222222222" cy="136.5" r="3.1" fill="#34D3C0"/><circle cx="1116.4444444444443" cy="143.5" r="3.1" fill="#34D3C0"/><circle cx="1142.6666666666667" cy="147.0" r="3.1" fill="#34D3C0"/><circle cx="1168.888888888889" cy="143.5" r="3.1" fill="#34D3C0"/><polyline points="946.0,172 985.3333333333334,188 1024.6666666666667,172 1064.0,188 1103.3333333333333,172 1142.6666666666667,188 1182.0,172" fill="none" stroke="#4C9BE8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="946.0" cy="172" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="985.3333333333334" cy="188" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="1024.6666666666667" cy="172" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="1064.0" cy="188" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="1103.3333333333333" cy="172" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="1142.6666666666667" cy="188" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="1182.0" cy="172" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><line x1="1064.0" y1="148" x2="1064.0" y2="172" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="1064.0" cy="160" r="4.0" fill="#F2C14E"/><text x="1064" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="middle">RNA  x  protein  -&gt;  interact?</text><text x="64" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="500" text-anchor="start">D. Matus  ·  F. Runge  ·  J. Franke  ·  L. Gerne  ·  M. Uhl  ·  F. Hutter  ·  R. Backofen</text><g id="cue_s01_c1_rna_protein_interactions_drive_gene"><title>rna-protein interactions drive gene regulation yet measuring them lab slow</title><rect x="64" y="296" width="373" height="232" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="296" width="373" height="6" rx="6" fill="#F2685C"/><text x="88" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Slow to measure</text><text x="88" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RNA-protein interactions drive gene regulation,</text><text x="88" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">but measuring them in the lab is slow and costly,</text><text x="88" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and existing predictors lean on small,</text><text x="88" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">protein-specific datasets.</text><rect x="88" y="484" width="325" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="106" cy="499.0" r="5" fill="#F2685C"/><text x="122" y="505.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">lab assay</text></g><g id="cue_s01_c2_work_introduces_rnainteract_large_cu"><title>work introduces rnainteract large curated dataset non-coding rna-protein interactions rpiembeddor</title><rect x="455" y="296" width="373" height="232" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="455" y="296" width="373" height="6" rx="6" fill="#4C9BE8"/><text x="479" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">A dataset + a model</text><text x="479" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">This work releases RNAInterAct, a large curated</text><text x="479" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">set of non-coding RNA-protein interactions, and</text><text x="479" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RPIembeddor, a transformer that classifies any</text><text x="479" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RNA-protein pair from sequence alone.</text><rect x="479" y="484" width="325" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="497" cy="499.0" r="5" fill="#4C9BE8"/><text x="513" y="505.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">RNAInterAct + RPIembeddor</text></g><g id="cue_s01_c3_feeding_embeddings_two_foundation_mo"><title>feeding embeddings two foundation models rna-fm rna esm-2 proteins attention-based</title><rect x="846" y="296" width="373" height="232" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="846" y="296" width="373" height="6" rx="6" fill="#48C78E"/><text x="870" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Two foundation models</text><text x="870" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Feeding embeddings from RNA-FM for RNA and ESM-2</text><text x="870" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">for proteins into an attention network beats prior</text><text x="870" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">state of the art and generalizes to unseen RNA</text><text x="870" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">families.</text><rect x="870" y="484" width="325" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="888" cy="499.0" r="5" fill="#48C78E"/><text x="904" y="505.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">RNA-FM + ESM-2</text></g><line x1="64" y1="560" x2="1216" y2="560" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="596" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#4C9BE8" font-weight="700" text-anchor="start">biorxiv.org/content/10.1101/2024.11.08.622607</text><text x="1216" y="596" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Decide if any RNA and protein interact, from sequence alone.</text></svg>