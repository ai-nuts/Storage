<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two embeddings, symmetric attention, one probability</text><g id="cue_s05_c1_rpiembeddor_turns_sequences_knowledg"><title>rpiembeddor turns sequences knowledge leaning two pre-trained foundation models</title><rect x="64" y="158" width="568" height="204" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="204" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Embed with two foundation models</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RNA sequences are embedded with RNA-FM, trained on 23M</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">non-coding RNAs; proteins with ESM-2, which predicts folding</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">without multiple sequence alignments.</text><rect x="92" y="304" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="332.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">RNA -&gt; RNA-FM;   protein -&gt; ESM-2 (150M)</text></g><g id="cue_s05_c2_rna_sequences_embedded_rna_fm_traine"><title>rna sequences embedded rna-fm trained twenty-three million non-coding rnas protein</title><rect x="64" y="378" width="568" height="172" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#34D3C0"/><text x="92" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Normalize both to a shared size</text><text x="92" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Both produce embeddings of size N by 640. Two parallel</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">feed-forward layers normalize their sizes before the</text><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">encoders.</text><rect x="92" y="506" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="534.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">RNA-FM, ESM-2  -&gt;  [N x 640]  -&gt; FF norm</text></g><g id="cue_s05_c3_two_parallel_feed_forward_layers_nor"><title>two parallel feed-forward layers normalize their sizes encoder layers process</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Process both symmetrically</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Encoder layers process the RNA and protein embeddings</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">symmetrically, so attention can focus on the parts of each</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sequence most relevant to interaction and each modality</text><text x="684" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">has equal influence.</text><text x="684" y="336" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">attention over RNA &lt;-&gt; protein positions</text></g><g id="cue_s05_c4_latent_representations_concatenated"><title>latent representations concatenated passed through further feed-forward layers ending linear</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#48C78E"/><text x="684" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Concatenate, then a sigmoid head</text><text x="684" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Latent representations are concatenated, passed through</text><text x="684" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">feed-forward layers, and a linear layer with sigmoid</text><text x="684" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">outputs the interaction probability. Just 1.4M parameters.</text><rect x="684" y="510" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="538.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">p = sigmoid(W h + b)   |   1.4M params</text></g></svg>