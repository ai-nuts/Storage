<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Both embeddings are the model</text><g id="cue_s08_c1_test_whether_two_embeddings_really"><title>test whether two embeddings really matter authors retrain after swapping</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Swap the embeddings out</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">To test whether the two embeddings really matter, the</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">authors retrain after replacing the RNA embedding, the</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">protein embedding, or both, with random vectors or</text><text x="92" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">one-hot encodings.</text></g><g id="cue_s08_c2_every_one_these_variants_stops"><title>every one these variants stops working predicting only negative class</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#2A1A1A" stroke="#F2685C" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#F2685C"/><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Every variant collapses</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">In every one of these variants the model stops working,</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">predicting only the negative class: F1 falls to zero and</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">accuracy merely reflects the fraction of negatives.</text><rect x="300" y="472" width="250" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="472" width="2" height="24" rx="6" fill="#F2685C"/><text x="288" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">F1 (ablated)</text><text x="312" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">0.00</text><rect x="300" y="506" width="250" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="506" width="156" height="24" rx="6" fill="#F2C14E"/><text x="288" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">accuracy</text><text x="466" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">0.624 = neg frac</text></g><g id="cue_s08_c3_only_when_both_rna_fm_esm_2"><title>only when both rna-fm esm-2 embeddings present does classify correctly</title><rect x="656" y="158" width="560" height="150" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="150" rx="6" fill="#48C78E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Only both together classify</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Only when both the RNA-FM and ESM-2 embeddings are</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">present does the model classify correctly, at F1 0.605</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">and accuracy 0.678.</text><rect x="684" y="268" width="504" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="282.0" r="5" fill="#48C78E"/><text x="718" y="288.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">RNA-FM  +  ESM-2  -&gt;  F1 0.605 / acc 0.678</text></g><g id="cue_s08_c4_confirms_foundation_model_embeddings"><title>confirms foundation-model embeddings carry structural functional information task depends</title><rect x="656" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="684" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">The embeddings carry the signal</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">This confirms the foundation-model embeddings carry the</text><text x="684" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">structural and functional information the task depends</text><text x="684" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">on; neither can be dropped or simplified.</text><rect x="684" y="468" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="483.0" r="5" fill="#F2685C"/><text x="718" y="489.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">random / one-hot  -&gt;  breaks the model</text><rect x="684" y="506" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="521.0" r="5" fill="#34D3C0"/><text x="718" y="527.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">RNA-FM + ESM-2  -&gt;  essential, not add-ons</text></g></svg>