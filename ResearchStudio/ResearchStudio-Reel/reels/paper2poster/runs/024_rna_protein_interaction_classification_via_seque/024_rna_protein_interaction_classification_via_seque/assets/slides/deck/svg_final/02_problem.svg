<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">No general predictor from sequence alone</text><g id="cue_s02_c1_non_coding_rnas_regulate_cell_largel"><title>non-coding rnas regulate cell largely through their interactions proteins but</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">ncRNAs act through proteins</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Non-coding RNAs regulate the cell largely</text><text x="92" y="263" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">through their interactions with proteins,</text><text x="92" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">but mapping these interactions</text><text x="92" y="309" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">experimentally is slow and costly.</text><rect x="92" y="356" width="344" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">an RNA-protein binding pair</text><polyline points="112.0,420.0 119.6,421.6341175469913 127.2,423.1779334981768 134.8,424.54613633831127 142.4,425.6631189606246 150.0,426.467156727579 157.6,426.91381838416595 165.2,426.9784213361319 172.8,426.6573956140661 180.4,425.9684811504786 188.0,424.9497474683058 195.60000000000002,423.65748995301163 203.2,422.1631189606246 210.8,420.5492136700949 218.39999999999998,418.9049587447184 226.0,417.3212159734444 233.60000000000002,415.8855032339527 241.2,414.67715824079977 248.8,413.76295433068145 256.4,413.1934105572163 264.0,413.0 271.6,413.1934105572163 279.20000000000005,413.76295433068145 286.79999999999995,414.67715824079977 294.4,415.8855032339527 302.0,417.3212159734444 309.6,418.9049587447184 317.20000000000005,420.5492136700949 324.79999999999995,422.1631189606246 332.4,423.65748995301163 340.0,424.9497474683058 347.6,425.9684811504786 355.20000000000005,426.65739561406605 362.79999999999995,426.9784213361319 370.4,426.91381838416595 378.0,426.467156727579 385.6,425.6631189606246 393.2,424.54613633831127 400.8,423.1779334981768 408.4,421.6341175469913 416.0,420.0" fill="none" stroke="#34D3C0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128.88888888888889" cy="423.5" r="3.1" fill="#34D3C0"/><circle cx="162.66666666666666" cy="427.0" r="3.1" fill="#34D3C0"/><circle cx="196.44444444444446" cy="423.5" r="3.1" fill="#34D3C0"/><circle cx="230.22222222222223" cy="416.5" r="3.1" fill="#34D3C0"/><circle cx="264.0" cy="413.0" r="3.1" fill="#34D3C0"/><circle cx="297.7777777777778" cy="416.5" r="3.1" fill="#34D3C0"/><circle cx="331.55555555555554" cy="423.5" r="3.1" fill="#34D3C0"/><circle cx="365.33333333333337" cy="427.0" r="3.1" fill="#34D3C0"/><circle cx="399.1111111111111" cy="423.5" r="3.1" fill="#34D3C0"/><polyline points="112.0,452 162.66666666666666,468 213.33333333333331,452 264.0,468 314.66666666666663,452 365.33333333333337,468 416.0,452" fill="none" stroke="#4C9BE8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112.0" cy="452" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="162.66666666666666" cy="468" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="213.33333333333331" cy="452" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="264.0" cy="468" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="314.66666666666663" cy="452" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="365.33333333333337" cy="468" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="416.0" cy="452" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><line x1="264.0" y1="428" x2="264.0" y2="452" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="264.0" cy="440" r="4.0" fill="#F2C14E"/><text x="244" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="middle">SELEX / CLIP-seq: expensive</text></g><g id="cue_s02_c2_most_computational_predictors_sidest"><title>most computational predictors sidestep general problem one per protein which</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Today: one model per protein</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Most computational predictors sidestep the general problem</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">by training a separate model for each protein, which needs</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">a large interaction dataset for that specific protein.</text><rect x="528" y="278" width="660" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="546" cy="291.0" r="5" fill="#F2685C"/><text x="562" y="297.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">protein A -&gt; model A     protein B -&gt; model B     ...</text></g><g id="cue_s02_c3_such_datasets_exist_only_few"><title>such datasets exist only few hundred roughly two thousand human</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F2C14E"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Data covers only a few hundred</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Such datasets exist for only a few hundred of the roughly two thousand</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">human RNA-binding proteins.</text></g><g id="cue_s02_c4_what_missing_method_decides_any"><title>what missing method decides any given rna protein pair whether</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#34D3C0"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Missing: decide any pair, any sequence</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">What is missing is a method that decides, for any RNA and protein pair,</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">whether they interact using nothing but their sequences.</text></g></svg>