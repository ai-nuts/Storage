<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Learn across tasks, stand on foundation models</text><g id="cue_s03_c1_recent_progress_shows_two_useful"><title>recent progress shows two useful ideas</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Two ideas point the way</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Recent progress suggests two useful ideas that together</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">enable a broad, sequence-only predictor of RNA-protein</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">interaction.</text><rect x="92" y="300" width="248" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="317.0" r="5" fill="#34D3C0"/><text x="126" y="323.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">idea 1: learn across many tasks</text><rect x="348" y="300" width="248" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="366" cy="317.0" r="5" fill="#48C78E"/><text x="382" y="323.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">idea 2: foundation models</text></g><g id="cue_s03_c2_first_learning_across_many_tasks"><title>first learning across many tasks rather one protein time help</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#34D3C0"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Learn across many tasks</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Learning across many interaction types at once, rather</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">than one protein at a time, helps precisely when labeled</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">data is scarce.</text><rect x="92" y="504" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="519.0" r="5" fill="#34D3C0"/><text x="126" y="525.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">many proteins  -&gt;  one shared model</text></g><g id="cue_s03_c3_second_foundation_models_trained_hug"><title>second foundation models trained huge unlabeled biological corpora capture structural</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#48C78E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Foundation models expose signal</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Foundation models trained on huge unlabeled biological</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">corpora capture structural and functional signal that</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">raw sequences do not expose directly.</text><text x="676" y="318" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">AUGC... -&gt; RNA-FM -&gt; rich embedding</text></g><g id="cue_s03_c4_combining_these_ideas_single_could"><title>combining these ideas single could learn general rules rna-protein binding</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#F2C14E"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Combine: general rules, unseen types</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Combined, a single model can learn general rules of</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">RNA-protein binding and apply them to interaction types it</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">has never seen.</text><text x="676" y="522" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">general binding rules  -&gt;  unseen RNA families</text></g></svg>