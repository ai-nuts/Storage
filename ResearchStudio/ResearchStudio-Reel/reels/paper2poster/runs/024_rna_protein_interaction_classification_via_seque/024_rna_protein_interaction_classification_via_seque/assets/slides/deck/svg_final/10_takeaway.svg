<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Sequence-only, general, and reproducible</text><g id="cue_s10_c1_lasting_message_general_rna_protein"><title>lasting message general rna-protein interaction prediction sequence alone achievable when</title><rect x="64" y="170" width="1152" height="86" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="170" width="6" height="86" rx="6" fill="#4C9BE8"/><circle cx="108" cy="213" r="9" fill="#4C9BE8"/><text x="140" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">General prediction is achievable</text><text x="140" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">General RNA-protein interaction prediction from sequence alone is achievable when you stand on the shoulders</text><text x="140" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">of foundation models.</text></g><g id="cue_s10_c2_compact_attention_network_fed_rna_fm"><title>compact attention network fed rna-fm esm-2 embeddings outperforms specialized tools</title><rect x="64" y="268" width="1152" height="86" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="268" width="6" height="86" rx="6" fill="#48C78E"/><circle cx="108" cy="311" r="9" fill="#48C78E"/><text x="140" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Small net beats specialists</text><text x="140" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A compact attention network fed RNA-FM and ESM-2 embeddings outperforms specialized tools and, unlike them,</text><text x="140" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">generalizes to RNA families it has never seen.</text></g><g id="cue_s10_c3_companion_rnainteract_dataset_split"><title>companion rnainteract dataset split remove homology bias gives community fair</title><rect x="64" y="366" width="1152" height="86" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="366" width="6" height="86" rx="6" fill="#34D3C0"/><circle cx="108" cy="409" r="9" fill="#34D3C0"/><text x="140" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">A fair, homology-aware benchmark</text><text x="140" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The companion RNAInterAct dataset, split to remove homology bias, gives the community a fair benchmark to</text><text x="140" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">drive further progress.</text></g><g id="cue_s10_c4_both_embeddings_essential_authors_po"><title>both embeddings essential authors point toward adding rna-structure models longer</title><rect x="64" y="464" width="1152" height="86" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="464" width="6" height="86" rx="6" fill="#F2C14E"/><circle cx="108" cy="507" r="9" fill="#F2C14E"/><text x="140" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Both embeddings, then structure next</text><text x="140" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Both embeddings are essential, and the authors point toward adding RNA-structure models and longer sequences</text><text x="140" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">next.</text></g><line x1="64" y1="584" x2="1216" y2="584" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><polyline points="64.0,600.0 69.0,601.6341175469913 74.0,603.1779334981768 79.0,604.5461363383113 84.0,605.6631189606246 89.0,606.467156727579 94.0,606.913818384166 99.0,606.9784213361319 104.0,606.6573956140661 109.0,605.9684811504786 114.0,604.9497474683059 119.0,603.6574899530117 124.0,602.1631189606246 129.0,600.5492136700949 134.0,598.9049587447183 139.0,597.3212159734444 144.0,595.8855032339527 149.0,594.6771582407998 154.0,593.7629543306814 159.0,593.1934105572162 164.0,593.0 169.0,593.1934105572162 174.0,593.7629543306814 179.0,594.6771582407998 184.0,595.8855032339527 189.0,597.3212159734444 194.0,598.9049587447183 199.0,600.5492136700949 204.0,602.1631189606246 209.0,603.6574899530117 214.0,604.9497474683059 219.0,605.9684811504786 224.0,606.6573956140661 229.0,606.9784213361319 234.0,606.913818384166 239.0,606.467156727579 244.0,605.6631189606246 249.0,604.5461363383113 254.0,603.1779334981768 259.0,601.6341175469913 264.0,600.0" fill="none" stroke="#34D3C0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75.11111111111111" cy="603.5" r="3.1" fill="#34D3C0"/><circle cx="97.33333333333333" cy="607.0" r="3.1" fill="#34D3C0"/><circle cx="119.55555555555556" cy="603.5" r="3.1" fill="#34D3C0"/><circle cx="141.77777777777777" cy="596.5" r="3.1" fill="#34D3C0"/><circle cx="164.0" cy="593.0" r="3.1" fill="#34D3C0"/><circle cx="186.22222222222223" cy="596.5" r="3.1" fill="#34D3C0"/><circle cx="208.44444444444443" cy="603.5" r="3.1" fill="#34D3C0"/><circle cx="230.66666666666669" cy="607.0" r="3.1" fill="#34D3C0"/><circle cx="252.88888888888889" cy="603.5" r="3.1" fill="#34D3C0"/><polyline points="64.0,632 97.33333333333333,648 130.66666666666666,632 164.0,648 197.33333333333331,632 230.66666666666669,648 264.0,632" fill="none" stroke="#4C9BE8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64.0" cy="632" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="97.33333333333333" cy="648" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="130.66666666666666" cy="632" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="164.0" cy="648" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="197.33333333333331" cy="632" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="230.66666666666669" cy="648" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><circle cx="264.0" cy="632" r="4.4" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><line x1="164.0" y1="608" x2="164.0" y2="632" stroke="#F2C14E" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="164.0" cy="620" r="4.0" fill="#F2C14E"/><text x="1216" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">RPIembeddor  ·  RNAInterAct  ·  RNA-Protein Interaction from Sequence  ·  ICLR 2024</text></svg>