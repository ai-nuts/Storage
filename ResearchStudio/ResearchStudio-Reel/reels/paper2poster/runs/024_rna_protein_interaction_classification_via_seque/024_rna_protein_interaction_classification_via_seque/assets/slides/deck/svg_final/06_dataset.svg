<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">RNAInterAct: curated, homology-split</text><g id="cue_s06_c1_dataset_backbone_study_starting_rnai"><title>dataset backbone study starting rnainter over forty-seven million rna interactions</title><rect x="64" y="158" width="1152" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="132" rx="6" fill="#4C9BE8"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Built from RNAInter, sequences and families recovered</text><rect x="112" y="222" width="196" height="52" rx="10" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><rect x="112" y="222" width="5" height="52" rx="2" fill="#4C9BE8"/><text x="128" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">RNAInter</text><text x="128" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">47M interactions</text><text x="320" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="348" y="222" width="196" height="52" rx="10" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><rect x="348" y="222" width="5" height="52" rx="2" fill="#34D3C0"/><text x="364" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">NCBI / UniProt / Ensembl</text><text x="364" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">sequences</text><text x="632" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="660" y="222" width="232" height="52" rx="10" fill="#16324A" stroke="#48C78E" stroke-width="1.5"/><rect x="660" y="222" width="5" height="52" rx="2" fill="#48C78E"/><text x="676" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Rfam / Pfam</text><text x="676" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="600" text-anchor="start">families + clans</text></g><g id="cue_s06_c2_those_annotations_let_them_generate"><title>those annotations let them generate negatives biologically meaningful rather random</title><rect x="64" y="306" width="560" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="306" width="6" height="140" rx="6" fill="#48C78E"/><text x="92" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Biologically meaningful negatives</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Family and clan annotations let the authors generate</text><text x="92" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">negatives that are biologically plausible rather than</text><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">random.</text></g><g id="cue_s06_c3_final_rnainteract_set_holds_about"><title>final rnainteract set holds about one hundred twenty-two thousand interactions</title><rect x="656" y="306" width="560" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="306" width="6" height="140" rx="6" fill="#34D3C0"/><text x="684" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">122,217 interactions</text><rect x="684" y="364" width="164" height="72" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="766.0" y="401.44" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24.48" fill="#34D3C0" font-weight="800" text-anchor="middle">122K</text><text x="766.0" y="421.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">interactions</text><rect x="864" y="364" width="164" height="72" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="946.0" y="401.44" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24.48" fill="#4C9BE8" font-weight="800" text-anchor="middle">1:2</text><text x="946.0" y="421.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">pos : neg</text><rect x="1044" y="364" width="144" height="72" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1116.0" y="401.44" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24.48" fill="#48C78E" font-weight="800" text-anchor="middle">976</text><text x="1116.0" y="421.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">RNA families</text></g><g id="cue_s06_c4_homology_aware_split_plus_evaluation"><title>homology-aware split plus evaluation external rpi2825 dataset tests true generalization</title><rect x="64" y="462" width="1152" height="88" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="462" width="6" height="88" rx="6" fill="#F2C14E"/><text x="92" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Split by RNA family</text><text x="300" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">No family appears in both train and test (TRinter / TSfam), and models are also tested on external RPI2825,</text><text x="300" y="521" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">so the benchmark rewards generalization, not memorization.</text></g></svg>