<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="720" fill="#2563EB"/>
  </g>

  <g id="header">
    <text x="80" y="86" font-size="20" font-weight="bold" letter-spacing="3" fill="#2563EB">02 · PROBLEM</text>
    <text x="1200" y="86" font-size="16" text-anchor="end" fill="#5A6473">2 / 10</text>
    <text x="80" y="150" font-size="44" font-weight="bold" fill="#14264C">A four-decade open problem</text>
    <rect x="80" y="176" width="1120" height="1.5" fill="#DCE2EC"/>
  </g>

  <g id="goal-panel" data-cue-label="cue_s02_c1_classic_problem_auction_theory_desig">
    <title>classic problem auction theory designing mechanism maximizes seller revenue incentive-compatible</title>
    <desc data-cue-label="cue_s02_c1_classic_problem_auction_theory_desig">A classic problem in auction theory is designing a mechanism that maximizes the seller's revenue while staying incentive-compatible.</desc>
    <rect id="cue_s02_c1_classic_problem_auction_theory_desig" data-cue-label="cue_s02_c1_classic_problem_auction_theory_desig" x="80" y="212" width="540" height="430" rx="16" fill="#F3F6FB" stroke="#DCE2EC" stroke-width="1"/>
    <text x="112" y="266" font-size="17" font-weight="bold" letter-spacing="2" fill="#2563EB">THE GOAL</text>
    <text x="112" y="318" font-size="30" font-weight="bold" fill="#14264C">Design one auction that</text>
    <text x="112" y="376" font-size="30" font-weight="bold" fill="#D98A0B">maximizes revenue</text>
    <text x="112" y="424" font-size="30" font-weight="bold" fill="#14264C">and stays truthful.</text>
    <rect x="112" y="470" width="476" height="1" fill="#DCE2EC"/>
    <text x="112" y="516" font-size="19" fill="#5A6473">Incentive-compatible (IC): no bidder</text>
    <text x="112" y="544" font-size="19" fill="#5A6473">ever gains by lying about valuations.</text>
    <text x="112" y="600" font-size="19" fill="#5A6473">Revenue is the seller's expected</text>
    <text x="112" y="628" font-size="19" fill="#5A6473">payment across the auction.</text>
  </g>

  <g id="status-panel">
    <title>Myerson solved single-item 1981 multi-item case remains open prior deep methods fixed symmetric</title>
    <desc data-cue-label="cue_s02_c2_myerson_solved_single_item_case_1981">Myerson solved the single-item case in 1981, but the multi-item case remains open, and prior deep methods assume fixed or symmetric auctions.</desc>
    <g id="milestone-myerson" data-cue-label="cue_s02_c2_myerson_solved_single_item_case_1981">
      <rect x="660" y="212" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="1.5"/>
      <circle cx="704" cy="272" r="10" fill="#2563EB"/>
      <text x="740" y="262" font-size="24" font-weight="bold" fill="#14264C">Myerson, 1981</text>
      <text x="740" y="296" font-size="19" fill="#5A6473">Single-item optimal auction — solved.</text>
      <text x="1168" y="284" font-size="34" font-weight="bold" text-anchor="end" fill="#2563EB">✓</text>
    </g>
    <g id="milestone-open" >
      <rect id="cue_s02_c2_myerson_solved_single_item_case_1981" data-cue-label="cue_s02_c2_myerson_solved_single_item_case_1981" x="660" y="348" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="1.5"/>
      <circle cx="704" cy="408" r="10" fill="#D98A0B"/>
      <text x="740" y="398" font-size="24" font-weight="bold" fill="#14264C">Multi-item, still open</text>
      <text x="740" y="432" font-size="19" fill="#5A6473">Unsolved even for 2 bidders × 2 items.</text>
      <text x="1168" y="420" font-size="30" font-weight="bold" text-anchor="end" fill="#D98A0B">?</text>
    </g>
    <g id="prior-methods">
      <rect x="660" y="484" width="540" height="158" rx="14" fill="#14264C"/>
      <text x="692" y="532" font-size="17" font-weight="bold" letter-spacing="2" fill="#8FB4F5">PRIOR DEEP METHODS</text>
      <text x="692" y="574" font-size="21" fill="#FFFFFF">Handle only a fixed number of</text>
      <text x="692" y="602" font-size="21" fill="#FFFFFF">bidders and items, or force the</text>
      <text x="692" y="630" font-size="21" fill="#FFFFFF">auction to be symmetric.</text>
    </g>
  </g>
</svg>
