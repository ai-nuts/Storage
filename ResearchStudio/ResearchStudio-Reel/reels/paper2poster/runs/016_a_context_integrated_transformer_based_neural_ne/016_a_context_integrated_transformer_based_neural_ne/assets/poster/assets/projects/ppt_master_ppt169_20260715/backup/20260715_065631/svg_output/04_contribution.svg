<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="720" fill="#2563EB"/>
  </g>

  <g id="header">
    <text x="80" y="86" font-size="20" font-weight="bold" letter-spacing="3" fill="#2563EB">04 · CONTRIBUTION</text>
    <text x="1200" y="86" font-size="16" text-anchor="end" fill="#5A6473">4 / 10</text>
    <text x="80" y="150" font-size="44" font-weight="bold" fill="#14264C">Two contributions</text>
    <rect x="80" y="176" width="1120" height="1.5" fill="#DCE2EC"/>
    <g id="lead-two" data-cue-label="cue_s04_c1_makes_two_contributions">
      <title>the paper makes two contributions</title>
      <desc data-cue-label="cue_s04_c1_makes_two_contributions">The paper makes two contributions.</desc>
      <rect id="cue_s04_c1_makes_two_contributions" data-cue-label="cue_s04_c1_makes_two_contributions" x="820" y="118" width="380" height="42" rx="8" fill="#FFFFFF" fill-opacity="0"/>
      <text x="1200" y="150" font-size="26" text-anchor="end" fill="#5A6473">A framework <tspan font-weight="bold" fill="#14264C">+</tspan> a network</text>
    </g>
  </g>

  <g id="contrib-1" data-cue-label="cue_s04_c2_extends_regretnet_framework_contextu">
    <title>extends RegretNet framework contextual setting proves sample-complexity bound</title>
    <desc data-cue-label="cue_s04_c2_extends_regretnet_framework_contextu">It extends the RegretNet framework to the contextual setting and proves a sample-complexity bound.</desc>
    <rect id="cue_s04_c2_extends_regretnet_framework_contextu" data-cue-label="cue_s04_c2_extends_regretnet_framework_contextu" x="80" y="212" width="545" height="430" rx="16" fill="#F3F6FB" stroke="#DCE2EC" stroke-width="1"/>
    <text x="112" y="288" font-size="64" font-weight="bold" fill="#2563EB">01</text>
    <text x="112" y="342" font-size="28" font-weight="bold" fill="#14264C">A contextual learning</text>
    <text x="112" y="378" font-size="28" font-weight="bold" fill="#14264C">framework</text>
    <rect x="112" y="410" width="481" height="1" fill="#DCE2EC"/>
    <text x="112" y="458" font-size="21" fill="#5A6473">Extends the RegretNet framework to</text>
    <text x="112" y="488" font-size="21" fill="#5A6473">the contextual setting: optimal design</text>
    <text x="112" y="518" font-size="21" fill="#5A6473">as constrained optimization.</text>
    <g id="badge-bound">
      <rect x="112" y="552" width="360" height="60" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <text x="132" y="590" font-size="20" font-weight="bold" fill="#2563EB">Sample-complexity bound proved</text>
    </g>
  </g>

  <g id="contrib-2" data-cue-label="cue_s04_c3_introduces_citransnet_permutation_eq">
    <title>introduces CITransNet permutation-equivariant bids contexts not restricted symmetric parameter count independent auction scale</title>
    <desc data-cue-label="cue_s04_c3_introduces_citransnet_permutation_eq">And it introduces CITransNet, permutation-equivariant over bids and contexts, not restricted to symmetric auctions, with a parameter count independent of auction scale.</desc>
    <rect id="cue_s04_c3_introduces_citransnet_permutation_eq" data-cue-label="cue_s04_c3_introduces_citransnet_permutation_eq" x="655" y="212" width="545" height="430" rx="16" fill="#14264C"/>
    <text x="687" y="288" font-size="64" font-weight="bold" fill="#D98A0B">02</text>
    <text x="687" y="342" font-size="28" font-weight="bold" fill="#FFFFFF">CITransNet, the network</text>
    <rect x="687" y="372" width="481" height="1" fill="#33507C"/>
    <g id="prop-equivariant">
      <text x="687" y="424" font-size="22" fill="#FFFFFF">▸ Permutation-equivariant over</text>
      <text x="713" y="454" font-size="22" fill="#BFD4FB">both bids and contexts</text>
    </g>
    <g id="prop-asymmetric">
      <text x="687" y="502" font-size="22" fill="#FFFFFF">▸ Not restricted to symmetric</text>
      <text x="713" y="532" font-size="22" fill="#BFD4FB">auctions</text>
    </g>
    <g id="prop-scale">
      <text x="687" y="580" font-size="22" fill="#FFFFFF">▸ Parameter count independent</text>
      <text x="713" y="610" font-size="22" fill="#BFD4FB">of auction scale</text>
    </g>
  </g>
</svg>
