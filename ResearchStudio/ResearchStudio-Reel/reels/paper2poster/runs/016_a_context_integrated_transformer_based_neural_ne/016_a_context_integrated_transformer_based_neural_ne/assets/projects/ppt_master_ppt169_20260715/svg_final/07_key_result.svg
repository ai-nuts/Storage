<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="720" fill="#2563EB"/>
  </g>

  <g id="header">
    <text x="80" y="86" font-size="20" font-weight="bold" letter-spacing="3" fill="#2563EB">07 · KEY RESULT</text>
    <text x="1200" y="86" font-size="16" text-anchor="end" fill="#5A6473">7 / 10</text>
    <text x="80" y="150" font-size="44" font-weight="bold" fill="#14264C">It works — in two parts</text>
    <rect x="80" y="176" width="1120" height="1.5" fill="#DCE2EC"/>
    <g id="two-parts" data-cue-label="cue_s07_c1_results_come_two_parts">
      <title>results come in two parts</title>
      <desc data-cue-label="cue_s07_c1_results_come_two_parts">Results come in two parts.</desc>
      <rect id="cue_s07_c1_results_come_two_parts" data-cue-label="cue_s07_c1_results_come_two_parts" x="900" y="118" width="300" height="42" rx="8" fill="#FFFFFF" fill-opacity="0"/>
      <text x="1200" y="150" font-size="24" text-anchor="end" fill="#5A6473">Known optima, then hard cases</text>
    </g>
  </g>

  <g id="part1-single" data-cue-label="cue_s07_c2_single_item_settings_citransnet_near">
    <title>single-item settings CITransNet nearly recovers Myerson optimal revenue 0.593 against 0.594 regret below one thousandth context-blind baselines fall short</title>
    <desc data-cue-label="cue_s07_c2_single_item_settings_citransnet_near">On single-item settings, CITransNet nearly recovers Myerson's optimal revenue, 0.593 against 0.594, with regret below one thousandth, while context-blind baselines fall short.</desc>
    <rect id="cue_s07_c2_single_item_settings_citransnet_near" data-cue-label="cue_s07_c2_single_item_settings_citransnet_near" x="80" y="212" width="545" height="430" rx="16" fill="#F3F6FB" stroke="#DCE2EC" stroke-width="1"/>
    <text x="112" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#2563EB">PART 1 · SINGLE-ITEM</text>
    <text x="112" y="292" font-size="24" font-weight="bold" fill="#14264C">Recovers the known optimum</text>
    <g id="p1-numbers">
      <text x="112" y="392" font-size="72" font-weight="bold" fill="#14264C">0.593</text>
      <text x="112" y="424" font-size="20" fill="#5A6473">CITransNet revenue</text>
      <text x="356" y="392" font-size="72" font-weight="bold" fill="#5A6473">0.594</text>
      <text x="356" y="424" font-size="20" fill="#5A6473">Myerson-optimal</text>
    </g>
    <rect x="112" y="452" width="481" height="1" fill="#DCE2EC"/>
    <g id="p1-regret">
      <text x="112" y="500" font-size="21" fill="#14264C">Regret <tspan font-weight="bold" fill="#2563EB">&lt; 0.001</tspan> — genuinely near-optimal.</text>
    </g>
    <g id="p1-baselines">
      <rect x="112" y="524" width="481" height="94" rx="10" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="1"/>
      <text x="132" y="562" font-size="19" font-weight="bold" fill="#14264C">Context-blind baselines fall short</text>
      <text x="132" y="594" font-size="18" fill="#5A6473">RegretNet &amp; EquivariantNet miss the optimum —</text>
      <text x="132" y="614" font-size="18" fill="#5A6473">integrating context is essential.</text>
    </g>
  </g>

  <g id="part2-multi" data-cue-label="cue_s07_c3_harder_multi_item_settings_beats_ite">
    <title>harder multi-item settings beats Item-wise Myerson baseline all six configurations gains reaching ten percent</title>
    <desc data-cue-label="cue_s07_c3_harder_multi_item_settings_beats_ite">On the harder multi-item settings, it beats the Item-wise Myerson baseline in all six configurations, with gains reaching ten percent.</desc>
    <rect id="cue_s07_c3_harder_multi_item_settings_beats_ite" data-cue-label="cue_s07_c3_harder_multi_item_settings_beats_ite" x="655" y="212" width="545" height="430" rx="16" fill="#14264C"/>
    <text x="687" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#8FB4F5">PART 2 · MULTI-ITEM</text>
    <text x="687" y="292" font-size="24" font-weight="bold" fill="#FFFFFF">Beats the strong baseline</text>
    <g id="p2-wins">
      <text x="687" y="404" font-size="86" font-weight="bold" fill="#FFFFFF">6/6</text>
      <text x="687" y="440" font-size="21" fill="#BFD4FB">wins vs Item-wise Myerson</text>
    </g>
    <g id="p2-gain">
      <rect x="960" y="316" width="208" height="132" rx="12" fill="#D98A0B"/>
      <text x="1064" y="384" font-size="56" font-weight="bold" text-anchor="middle" fill="#FFFFFF">+10%</text>
      <text x="1064" y="420" font-size="19" text-anchor="middle" fill="#FFFFFF">revenue gain, peak</text>
    </g>
    <rect x="687" y="474" width="481" height="1" fill="#33507C"/>
    <text x="687" y="522" font-size="21" fill="#FFFFFF">Also outperforms the context-integrated</text>
    <text x="687" y="552" font-size="21" fill="#FFFFFF">versions of RegretNet and EquivariantNet,</text>
    <text x="687" y="582" font-size="21" fill="#FFFFFF">where no analytical solution exists.</text>
  </g>
</svg>
