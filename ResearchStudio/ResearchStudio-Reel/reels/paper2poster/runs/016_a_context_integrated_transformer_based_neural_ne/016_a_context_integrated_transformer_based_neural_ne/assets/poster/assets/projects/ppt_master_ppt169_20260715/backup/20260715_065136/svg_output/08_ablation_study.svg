<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="720" fill="#2563EB"/>
  </g>

  <g id="header">
    <text x="80" y="86" font-size="20" font-weight="bold" letter-spacing="3" fill="#2563EB">08 · ABLATION STUDY</text>
    <text x="1200" y="86" font-size="16" text-anchor="end" fill="#5A6473">8 / 10</text>
    <text x="80" y="150" font-size="44" font-weight="bold" fill="#14264C">What actually drives the gain?</text>
    <rect x="80" y="176" width="1120" height="1.5" fill="#DCE2EC"/>
  </g>

  <g id="swap-panel" data-cue-label="cue_s08_c1_isolate_why_works_authors_replace">
    <title>isolate why works authors replace transformer layers RegretNet fully-connected EquivariantNet equivariant layers giving CIRegretNet CIEquivariantNet</title>
    <desc data-cue-label="cue_s08_c1_isolate_why_works_authors_replace">To isolate why it works, the authors replace the transformer layers with RegretNet's fully-connected and EquivariantNet's equivariant layers, giving CIRegretNet and CIEquivariantNet.</desc>
    <rect id="cue_s08_c1_isolate_why_works_authors_replace" data-cue-label="cue_s08_c1_isolate_why_works_authors_replace" x="80" y="212" width="545" height="430" rx="16" fill="#F3F6FB" stroke="#DCE2EC" stroke-width="1"/>
    <text x="112" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#2563EB">SWAP THE LAYERS</text>
    <text x="112" y="294" font-size="22" fill="#5A6473">Keep the context, replace only</text>
    <text x="112" y="322" font-size="22" fill="#5A6473">CITransNet's transformer layers:</text>
    <g id="variant-ciregretnet">
      <rect x="112" y="346" width="481" height="120" rx="12" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="1.5"/>
      <text x="136" y="388" font-size="25" font-weight="bold" fill="#14264C">CIRegretNet</text>
      <text x="136" y="420" font-size="19" fill="#5A6473">Transformer → RegretNet's</text>
      <text x="136" y="446" font-size="19" fill="#5A6473">fully-connected layers</text>
    </g>
    <g id="variant-ciequivariantnet">
      <rect x="112" y="482" width="481" height="120" rx="12" fill="#FFFFFF" stroke="#DCE2EC" stroke-width="1.5"/>
      <text x="136" y="524" font-size="25" font-weight="bold" fill="#14264C">CIEquivariantNet</text>
      <text x="136" y="556" font-size="19" fill="#5A6473">Transformer → EquivariantNet's</text>
      <text x="136" y="582" font-size="19" fill="#5A6473">equivariant layers</text>
    </g>
  </g>

  <g id="finding-transformer" data-cue-label="cue_s08_c2_both_still_get_context_yet">
    <title>both still get context yet earn less revenue everywhere pinning gain transformer layers</title>
    <desc data-cue-label="cue_s08_c2_both_still_get_context_yet">Both still get context, yet earn less revenue everywhere, pinning the gain on the transformer layers.</desc>
    <rect id="cue_s08_c2_both_still_get_context_yet" data-cue-label="cue_s08_c2_both_still_get_context_yet" x="655" y="212" width="545" height="252" rx="16" fill="#14264C"/>
    <text x="687" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#8FB4F5">THE FINDING</text>
    <text x="687" y="308" font-size="30" font-weight="bold" fill="#FFFFFF">Both earn <tspan fill="#D98A0B">less revenue</tspan></text>
    <text x="687" y="348" font-size="30" font-weight="bold" fill="#FFFFFF">everywhere.</text>
    <rect x="687" y="374" width="481" height="1" fill="#33507C"/>
    <text x="687" y="416" font-size="21" fill="#BFD4FB">Across every multi-item setting — which</text>
    <text x="687" y="444" font-size="21" fill="#BFD4FB">pins the improvement on the transformer.</text>
  </g>

  <g id="finding-context" data-cue-label="cue_s08_c3_removing_context_hurts_even_easy">
    <title>removing context hurts even easy settings</title>
    <desc data-cue-label="cue_s08_c3_removing_context_hurts_even_easy">Removing context hurts even easy settings.</desc>
    <rect id="cue_s08_c3_removing_context_hurts_even_easy" data-cue-label="cue_s08_c3_removing_context_hurts_even_easy" x="655" y="482" width="545" height="160" rx="16" fill="#FFFFFF" stroke="#D98A0B" stroke-width="2"/>
    <text x="687" y="524" font-size="17" font-weight="bold" letter-spacing="2" fill="#D98A0B">AND GOING FURTHER</text>
    <text x="687" y="568" font-size="24" font-weight="bold" fill="#14264C">Removing context altogether</text>
    <text x="687" y="600" font-size="24" font-weight="bold" fill="#14264C">hurts even the easy single-item</text>
    <text x="687" y="632" font-size="24" font-weight="bold" fill="#14264C">settings.</text>
  </g>
</svg>
