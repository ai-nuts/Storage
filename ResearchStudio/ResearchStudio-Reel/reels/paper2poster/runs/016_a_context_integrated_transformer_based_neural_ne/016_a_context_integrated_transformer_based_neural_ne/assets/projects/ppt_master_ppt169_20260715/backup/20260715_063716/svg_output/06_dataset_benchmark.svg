    <text x="862" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#D98A0B">THE HARD CASES</text>
    <text x="862" y="306" font-size="30" font-weight="bold" fill="#14264C">Multi-item (6)</text>
    <g id="chips-defghi">
      <rect x="862" y="336" width="50" height="50" rx="9" fill="#D98A0B"/>
      <text x="887" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">D</text>
      <rect x="920" y="336" width="50" height="50" rx="9" fill="#D98A0B"/>
      <text x="945" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">E</text>
      <rect x="978" y="336" width="50" height="50" rx="9" fill="#D98A0B"/>
      <text x="1003" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">F</text>
      <rect x="1036" y="336" width="50" height="50" rx="9" fill="#D98A0B"/>
      <text x="1061" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">G</text>
      <rect x="1094" y="336" width="50" height="50" rx="9" fill="#D98A0B"/>
      <text x="1119" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">H</text>
      <rect x="1152" y="336" width="34" height="50" rx="9" fill="#D98A0B"/>
      <text x="1169" y="370" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">I</text>
    </g>
    <rect x="862" y="420" width="306" height="1" fill="#DCE2EC"/>
    <g id="scale-badge">
      <text x="862" y="480" font-size="21" fill="#5A6473">Up to</text>
      <text x="862" y="540" font-size="52" font-weight="bold" fill="#14264C">5 × 10</text>
      <text x="862" y="576" font-size="21" fill="#5A6473">bidders × items — the largest</text>
      <text x="862" y="606" font-size="21" fill="#5A6473">size studied in the literature.</text>
    </g>
