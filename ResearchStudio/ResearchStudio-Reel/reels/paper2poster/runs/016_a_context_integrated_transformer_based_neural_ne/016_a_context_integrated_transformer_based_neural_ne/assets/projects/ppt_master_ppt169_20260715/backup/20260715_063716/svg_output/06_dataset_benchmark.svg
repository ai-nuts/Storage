<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="720" fill="#2563EB"/>
  </g>

  <g id="header">
    <text x="80" y="86" font-size="20" font-weight="bold" letter-spacing="3" fill="#2563EB">06 · DATASET / BENCHMARK</text>
    <text x="1200" y="86" font-size="16" text-anchor="end" fill="#5A6473">6 / 10</text>
    <text x="80" y="150" font-size="44" font-weight="bold" fill="#14264C">Nine synthetic settings</text>
    <rect x="80" y="176" width="1120" height="1.5" fill="#DCE2EC"/>
  </g>

  <g id="count-card">
    <title>they evaluate nine synthetic settings</title>
    <desc data-cue-label="cue_s06_c1_they_evaluate_nine_synthetic_setting">They evaluate on nine synthetic settings.</desc>
    <rect id="cue_s06_c1_they_evaluate_nine_synthetic_setting" data-cue-label="cue_s06_c1_they_evaluate_nine_synthetic_setting" x="80" y="212" width="330" height="430" rx="16" fill="#14264C"/>
    <text x="112" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#8FB4F5">EVALUATION</text>
    <text x="108" y="392" font-size="150" font-weight="bold" fill="#FFFFFF">9</text>
    <text x="112" y="440" font-size="24" font-weight="bold" fill="#FFFFFF">synthetic</text>
    <text x="112" y="470" font-size="24" font-weight="bold" fill="#FFFFFF">auction settings</text>
    <rect x="112" y="502" width="266" height="1" fill="#33507C"/>
    <text x="112" y="548" font-size="20" fill="#BFD4FB">Every number is</text>
    <text x="112" y="576" font-size="20" fill="#BFD4FB">averaged over</text>
    <text x="112" y="616" font-size="34" font-weight="bold" fill="#D98A0B">5 runs</text>
  </g>

  <g id="single-item-card">
    <title>three single-item cases A through C known Myerson-optimal solutions sanity check</title>
    <desc data-cue-label="cue_s06_c2_three_single_item_cases_through_know">Three single-item cases, A through C, have known Myerson-optimal solutions as a sanity check.</desc>
    <rect id="cue_s06_c2_three_single_item_cases_through_know" data-cue-label="cue_s06_c2_three_single_item_cases_through_know" x="440" y="212" width="360" height="430" rx="16" fill="#F3F6FB" stroke="#DCE2EC" stroke-width="1"/>
    <text x="472" y="256" font-size="17" font-weight="bold" letter-spacing="2" fill="#2563EB">SANITY CHECK</text>
    <text x="472" y="306" font-size="30" font-weight="bold" fill="#14264C">Single-item (3)</text>
    <g id="chips-abc">
      <rect x="472" y="336" width="86" height="64" rx="10" fill="#2563EB"/>
      <text x="515" y="378" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFFFFF">A</text>
      <rect x="570" y="336" width="86" height="64" rx="10" fill="#2563EB"/>
      <text x="613" y="378" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFFFFF">B</text>
      <rect x="668" y="336" width="86" height="64" rx="10" fill="#2563EB"/>
      <text x="711" y="378" font-size="34" font-weight="bold" text-anchor="middle" fill="#FFFFFF">C</text>
    </g>
    <rect x="472" y="436" width="296" height="1" fill="#DCE2EC"/>
    <text x="472" y="486" font-size="21" fill="#5A6473">Optimal solutions known</text>
    <text x="472" y="516" font-size="21" fill="#5A6473">analytically from Myerson's</text>
    <text x="472" y="546" font-size="21" fill="#5A6473">theory — used to verify the</text>
    <text x="472" y="576" font-size="21" fill="#5A6473">learned mechanism is right.</text>
  </g>

  <g id="multi-item-card">
    <title>other six D through I multi-item auctions five bidders ten items largest size auction-design literature</title>
    <desc data-cue-label="cue_s06_c3_other_six_through_multi_item_auction">The other six, D through I, are multi-item auctions up to five bidders and ten items, the largest size in the auction-design literature.</desc>
