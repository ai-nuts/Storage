<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, sans-serif">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="14" height="720" fill="#2563EB"/>
  </g>

  <g id="header">
    <text x="80" y="86" font-size="20" font-weight="bold" letter-spacing="3" fill="#2563EB">03 · MOTIVATION</text>
    <text x="1200" y="86" font-size="16" text-anchor="end" fill="#5A6473">3 / 10</text>
    <text x="80" y="150" font-size="44" font-weight="bold" fill="#14264C">Real auctions are <tspan fill="#D98A0B">richer</tspan></text>
    <rect x="80" y="176" width="1120" height="1.5" fill="#DCE2EC"/>
  </g>

  <g id="lead-statement">
    <title>real auctions are richer</title>
    <desc data-cue-label="cue_s03_c1_real_auctions_richer">Real auctions are richer.</desc>
    <rect id="cue_s03_c1_real_auctions_richer" data-cue-label="cue_s03_c1_real_auctions_richer" x="80" y="212" width="1120" height="88" rx="14" fill="#14264C"/>
    <text x="112" y="266" font-size="26" fill="#FFFFFF">The simple settings prior work assumed do not match markets like <tspan font-weight="bold" fill="#8FB4F5">e-commerce ads</tspan>.</text>
  </g>

  <g id="ecommerce-panel">
    <title>e-commerce advertising many bidders compete many ad slots described features different number participants</title>
    <desc data-cue-label="cue_s03_c2_e_commerce_advertising_many_bidders">In e-commerce advertising, many bidders compete for many ad slots described by features, and every round has a different number of participants.</desc>
    <rect id="cue_s03_c2_e_commerce_advertising_many_bidders" data-cue-label="cue_s03_c2_e_commerce_advertising_many_bidders" x="80" y="330" width="720" height="312" rx="16" fill="#F3F6FB" stroke="#DCE2EC" stroke-width="1"/>
    <text x="112" y="382" font-size="17" font-weight="bold" letter-spacing="2" fill="#2563EB">E-COMMERCE ADVERTISING</text>
    <g id="fact-bidders">
      <text x="112" y="440" font-size="46" font-weight="bold" fill="#14264C">Many × Many</text>
      <text x="112" y="474" font-size="20" fill="#5A6473">Many bidders compete for many ad slots.</text>
    </g>
    <rect x="112" y="500" width="656" height="1" fill="#DCE2EC"/>
    <g id="fact-features">
      <text x="112" y="546" font-size="21" font-weight="bold" fill="#14264C">Public features</text>
      <text x="112" y="576" font-size="20" fill="#5A6473">Each bidder and item carries descriptive context.</text>
    </g>
    <g id="fact-varying">
      <text x="112" y="618" font-size="21" font-weight="bold" fill="#14264C">Varying size</text>
      <text x="112" y="648" font-size="20" fill="#5A6473">A different number of participants every round.</text>
    </g>
  </g>

  <g id="need-panel">
    <title>need architecture absorbs context handles varying auction sizes</title>
    <desc data-cue-label="cue_s03_c3_need_architecture_absorbs_context_ha">We need an architecture that absorbs context and handles varying auction sizes.</desc>
    <rect id="cue_s03_c3_need_architecture_absorbs_context_ha" data-cue-label="cue_s03_c3_need_architecture_absorbs_context_ha" x="820" y="330" width="380" height="312" rx="16" fill="#2563EB"/>
    <text x="852" y="382" font-size="17" font-weight="bold" letter-spacing="2" fill="#BFD4FB">WHAT WE NEED</text>
    <text x="852" y="440" font-size="26" font-weight="bold" fill="#FFFFFF">An architecture that</text>
    <text x="852" y="500" font-size="24" fill="#FFFFFF">▸ absorbs public</text>
    <text x="878" y="532" font-size="24" fill="#FFFFFF">features as context</text>
    <text x="852" y="588" font-size="24" fill="#FFFFFF">▸ handles varying</text>
