g_opposite_proble"><title>contrastive learning opposite problem comparing whole series similarity tends ignore</title><rect x="500" y="324" width="716" height="132" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="500" y="324" width="6" height="132" rx="6" fill="#F2C14E"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Contrastive ignores fine-grained detail</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Comparing whole series for similarity ignores the fine-grained</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">correlations inside them, and hinges on augmentations that are hard to</text><text x="528" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">design for temporal data.</text></g><g id="cue_s02_c4_gap_addresses_clear_existing_recipes"><title>gap addresses clear existing recipes fail emphasize temporal correlations make</title><rect x="500" y="472" width="716" height="78" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="472" width="6" height="78" rx="6" fill="#34D3C0"/><text x="528" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The gap this paper addresses</text><text x="528" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Existing recipes fail to emphasize the temporal correlations that make time</text><text x="528" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">series what they are.</text></g></svg>