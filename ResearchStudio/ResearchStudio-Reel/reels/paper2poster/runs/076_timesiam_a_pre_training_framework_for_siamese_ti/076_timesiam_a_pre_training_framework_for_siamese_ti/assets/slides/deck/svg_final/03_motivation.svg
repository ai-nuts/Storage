ting timesiam time series carry special kind information</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">The prior prior methods throw away</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">The key insight: time series carry a special information</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">prior methods discard, the correlation between what</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">happened in the past and what is happening now.</text><text x="676" y="326" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#34D3C0" font-weight="800" text-anchor="start">past  ~~&gt;  now :  correlation across time</text></g><g id="cue_s03_c4_instead_treating_window_isolation_wh"><title>instead treating window isolation why not build pre-training task explicitly</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#48C78E"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">So relate distant moments directly</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of treating each window in isolation, build a</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">pre-training task that explicitly asks the model to</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">relate distant moments in time to each other.</text><rect x="676" y="494" width="512" height="40" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="991.52" y="500" width="138.88000000000002" height="28" rx="4" fill="#F2C14E" opacity="0.2"/><line x1="991.52" y1="500" x2="991.52" y2="528" stroke="#F2C14E" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="1130.4" y1="500" x2="1130.4" y2="528" stroke="#F2C14E" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><polyline points="684.0,506.1 691.8,507.4 699.5,508.8 707.2,510.1 715.0,511.4 722.8,512.4 730.5,513.2 738.2,513.7 746.0,514.0 753.8,514.1 761.5,514.1 769.2,514.1 777.0,514.2 784.8,514.5 792.5,515.1 800.2,515.9 808.0,517.0 815.8,518.3 823.5,519.7 831.2,521.0 839.0,522.2 846.8,523.1 854.5,523.7 862.2,523.8 870.0,523.3 877.8,522.4 885.5,521.0 893.2,519.3 901.0,517.4 908.8,515.3 916.5,513.3 924.2,511.5 932.0,510.1 939.8,508.9 947.5,508.2 955.2,507.9 963.0,507.9 970.8,508.2 978.5,508.6 986.2,509.1 994.0,509.5 1001.8,509.8 1009.5,509.9 1017.2,509.8 1025.0,509.5 1032.8,509.1 1040.5,508.6 1048.2,508.2 1056.0,508.0 1063.8,508.1 1071.5,508.5 1079.2,509.3 1087.0,510.6 1094.8,512.2 1102.5,514.0 1110.2,516.0 1118.0,518.0 1125.8,519.9 1133.5,521.5 1141.2,522.8 1149.0,523.6 1156.8,523.8 1164.5,523.6 1172.2,522.9 1180.0,521.9" fill="none" stroke="#48C78E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></svg>