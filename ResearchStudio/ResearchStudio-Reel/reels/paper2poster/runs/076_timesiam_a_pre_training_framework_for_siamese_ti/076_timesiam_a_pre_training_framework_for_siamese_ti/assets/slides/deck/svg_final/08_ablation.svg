<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Which design choices carry the weight</text><g id="cue_s08_c1_careful_ablations_traffic_benchmark"><title>careful ablations traffic benchmark tell which design choices matter</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Controlled study on Traffic</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Careful ablations on the Traffic benchmark isolate which</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">design choices actually matter for TimeSiam.</text><rect x="92" y="268" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="282.0" r="5" fill="#4C9BE8"/><text x="126" y="288.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Traffic benchmark  ·  one factor at a time</text></g><g id="cue_s08_c2_reconstructing_current_window_past_o"><title>reconstructing current window past one clearly beats plain self-reconstruction validating</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#48C78E"/><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Past-to-current beats self-recon</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Reconstructing the current window from a past one</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">clearly beats plain self-reconstruction, validating the</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">core Siamese idea.</text><rect x="320" y="472" width="220" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="472" width="198" height="24" rx="6" fill="#48C78E"/><text x="308" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">past -&gt; current</text><text x="528" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">best</text><rect x="320" y="506" width="220" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="506" width="121" height="24" rx="6" fill="#F2685C"/><text x="308" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">self-recon</text><text x="451" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">worse</text></g><g id="cue_s08_c3_masking_ratio_sweet_spot_around"><title>masking ratio sweet spot around twenty-five percent masking only fifteen</title><rect x="656" y="158" width="560" height="150" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Masking ratio sweet spot ~25%</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Masking only 15% makes the task too easy to teach</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">anything; masking 75% makes it too hard. Around 25% is</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">best.</text><text x="684" y="296" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="800" text-anchor="start">15% too easy   |   25% best   |   75% too hard</text></g><g id="cue_s08_c4_lineage_embeddings_deliver_consisten"><title>lineage embeddings deliver consistent gains over random initialization adding more</title><rect x="656" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="684" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">More lineage embeddings, more gain</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Lineage embeddings deliver consistent gains over random</text><text x="684" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">initialization, and adding more keeps improving</text><text x="684" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Electricity and Traffic up to a point.</text><rect x="884" y="472" width="300" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="884" y="472" width="120" height="24" rx="6" fill="#9DB3C8"/><text x="872" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">random init</text><text x="1014" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">base</text><rect x="884" y="506" width="300" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="884" y="506" width="255" height="24" rx="6" fill="#34D3C0"/><text x="872" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+ lineage embeds</text><text x="1149" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">better</text></g></svg>