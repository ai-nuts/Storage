<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Thirteen benchmarks, plus two new corpora</text><g id="cue_s06_c1_evaluation_deliberately_broad_spanni"><title>evaluation deliberately broad spanning thirteen benchmarks two mainstream tasks</title><rect x="64" y="158" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">A deliberately broad evaluation</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The study spans thirteen benchmarks and two mainstream tasks: forecasting and classification.</text><rect x="980" y="168" width="110" height="76" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1035.0" y="207.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.840000000000003" fill="#4C9BE8" font-weight="800" text-anchor="middle">13</text><text x="1035.0" y="228.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">benchmarks</text><rect x="1100" y="168" width="110" height="76" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1155.0" y="207.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.840000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="1155.0" y="228.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">tasks</text></g><g id="cue_s06_c2_forecasting_four_ett_subsets_plus"><title>forecasting four ett subsets plus weather electricity traffic exchange classification</title><rect x="64" y="270" width="560" height="152" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="270" width="6" height="152" rx="6" fill="#34D3C0"/><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Established benchmarks</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Forecasting: four ETT subsets, Weather, Electricity,</text><text x="92" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Traffic, Exchange. Classification: EEG (AD, TDBrain) and</text><text x="92" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">ECG (PTB).</text><rect x="92" y="398" width="504" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="411.0" r="5" fill="#34D3C0"/><text x="126" y="417.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">forecasting  +  classification  =  11 established</text></g><g id="cue_s06_c3_top_these_eleven_established_benchma"><title>top these eleven established benchmarks authors construct two new large-scale</title><rect x="656" y="270" width="560" height="152" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="270" width="6" height="152" rx="6" fill="#48C78E"/><text x="684" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Two new multi-domain corpora</text><text x="684" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">On top of the eleven established benchmarks, the authors</text><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">construct two new large-scale, multi-domain datasets.</text><rect x="684" y="392" width="504" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="405.0" r="5" fill="#48C78E"/><text x="718" y="411.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">TSLD-500M    and    TSLD-1G</text></g><g id="cue_s06_c4_larger_one_packs_nearly_fourteen"><title>larger one packs nearly fourteen million examples drawn diverse non-overlapping</title><rect x="64" y="438" width="1152" height="112" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="438" width="6" height="112" rx="6" fill="#F2C14E"/><text x="92" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">TSLD-1G: built for cross-domain stress tests</text><text x="92" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">The larger corpus packs nearly fourteen million examples from diverse, non-overlapping</text><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">domains, so pre-training and fine-tuning data can come from entirely different</text><text x="92" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">sources.</text><rect x="980" y="452" width="230" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1095.0" y="495.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#F2C14E" font-weight="800" text-anchor="middle">~14M</text><text x="1095.0" y="519.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">examples, TSLD-1G</text></g></svg>