y="172" width="246" height="88" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1093.0" y="217.76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="29.92" fill="#34D3C0" font-weight="800" text-anchor="middle">8 / 8</text><text x="1093.0" y="242.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">beats SSL baselines</text></g><g id="cue_s07_c2_in_domain_forecasting_timesiam_cuts"><title>in-domain forecasting timesiam cuts average mean squared error five point</title><rect x="64" y="290" width="560" height="258" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="290" width="6" height="258" rx="6" fill="#4C9BE8"/><text x="92" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">In-domain forecasting: lower MSE</text><text x="92" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">TimeSiam cuts average mean squared error on strong</text><text x="92" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">backbones that already forecast well from scratch.</text><rect x="300" y="432" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="432" width="195" height="26" rx="6" fill="#48C78E"/><text x="288" y="452.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">PatchTST</text><text x="505" y="452.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">-5.7%</text><rect x="300" y="470" width="240" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="470" width="85" height="26" rx="6" fill="#34D3C0"/><text x="288" y="490.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">iTransformer</text><text x="395" y="490.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">-2.5%</text><text x="92" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">average MSE reduction vs training from scratch</text></g><g id="cue_s07_c3_in_domain_classification_lifts_avera"><title>in-domain classification lifts average accuracy eleven point five percent over</title><rect x="656" y="290" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="290" width="6" height="120" rx="6" fill="#34D3C0"/><text x="684" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">In-domain classification: +11.5% acc</text><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Average accuracy rises 11.5% over random initialization,</text><text x="684" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">beating eight strong self-supervised baselines.</text><text x="684" y="398" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="start">+11.5% over random init  ·  beats 8 SSL baselines</text></g><g id="cue_s07_c4_perhaps_most_striking_finding_cross"><title>perhaps most striking finding cross-domain transfer pre-training large diverse tsld-1g</title><rect x="656" y="426" width="560" height="122" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="426" width="6" height="122" rx="6" fill="#F2C14E"/><text x="684" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Cross-domain can beat in-domain</text><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">The most striking finding: pre-training on the large,</text><text x="684" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">diverse TSLD-1G and fine-tuning elsewhere sometimes beats</text><text x="684" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">even in-domain pre-training.</text></g></svg>