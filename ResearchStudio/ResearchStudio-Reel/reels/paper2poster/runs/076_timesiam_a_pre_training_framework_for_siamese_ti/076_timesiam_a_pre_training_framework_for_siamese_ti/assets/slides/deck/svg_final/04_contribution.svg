<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One framework, three contributions</text><g id="cue_s04_c1_makes_three_main_contributions_first"><title>makes three main contributions first proposes timesiam simple but effective</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#4C9BE8" font-weight="800" text-anchor="middle">TS</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">TimeSiam framework</text><text x="88" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A simple but effective</text><text x="88" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">pre-training framework that</text><text x="88" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">uses Siamese networks to</text><text x="88" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">capture correlations among</text><text x="88" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">temporally distanced</text><text x="88" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">subseries.</text></g><g id="cue_s04_c2_second_introduces_learnable_lineage"><title>second introduces learnable lineage embeddings lightweight mechanism lets one represent</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="410" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#34D3C0" font-weight="800" text-anchor="middle">L</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Lineage embeddings</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Learnable lineage embeddings:</text><text x="384" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">a lightweight mechanism that</text><text x="384" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">lets one model represent many</text><text x="384" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">different past-to-current time</text><text x="384" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">distances.</text></g><g id="cue_s04_c3_third_through_extensive_experiments"><title>third through extensive experiments shows timesiam achieves consistent state-of-the-art results</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="706" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="706" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#48C78E" font-weight="800" text-anchor="middle">*</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">SOTA on both tasks</text><text x="680" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Extensive experiments show</text><text x="680" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">consistent state-of-the-art</text><text x="680" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">when fine-tuned on forecasting</text><text x="680" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and classification, in-domain</text><text x="680" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and cross-domain.</text></g><g id="cue_s04_c4_crucially_framework_backbone_agnosti"><title>crucially framework backbone-agnostic dropping cleanly onto modern encoders like itransformer</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="1002" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#F2C14E" font-weight="800" text-anchor="middle">+</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Backbone-agnostic</text><text x="976" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The framework drops cleanly</text><text x="976" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">onto modern encoders like</text><text x="976" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">iTransformer, PatchTST, and</text><text x="976" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">TCN.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Pose pre-training as past-to-current reconstruction, span time distances, and stay backbone-agnostic.</text></svg>