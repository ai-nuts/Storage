<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="86" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#14264A">Ablations that sharpen the picture</text>
    <text x="84" y="114" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">ABLATION · PROMPT COLOR · SHUFFLING · KD AT 80M</text>
  </g>

  <g id="cue_s07_c1_several_ablations_sharpen_picture">
    <title>Several ablations sharpen the picture</title>
    <desc>several ablations sharpen picture — prompt color, shuffling, distillation at 80M</desc>
    <rect x="60" y="140" width="1160" height="62" rx="12" fill="#F4F6FB"/>
    <rect x="60" y="140" width="6" height="62" rx="3" fill="#14264A"/>
    <text x="92" y="178" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-weight="700" fill="#14264A">Several ablations sharpen the picture — from prompt design to training order to model size.</text>
  </g>

  <g id="cue_s07_c2_changing_prompt_colour_generated">
    <title>Changing the prompt backdrop color changes the generated backdrop; black-backdrop prompts ease post-processing</title>
    <desc>changing prompt backdrop color changes generated backdrop black-backdrop prompts makes simple grayscale-threshold post-processing reliable</desc>
    <rect x="60" y="216" width="580" height="342" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <rect x="60" y="216" width="6" height="342" rx="3" fill="#2563EB"/>
    <text x="88" y="250" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">PROMPT BACKDROP COLOR</text>
    <image href="../images/figure5.png" x="88" y="264" width="250" height="272" preserveAspectRatio="xMidYMid meet"/>
    <text x="358" y="300" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">The prompt backdrop</text>
    <text x="358" y="322" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">color controls the</text>
    <text x="358" y="344" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">generated backdrop.</text>
    <rect x="358" y="366" width="258" height="86" rx="8" fill="#14264A"/>
    <text x="374" y="394" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Black-backdrop prompts</text>
    <text x="374" y="416" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#C7D2E6">make a simple grayscale-</text>
    <text x="374" y="436" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#C7D2E6">threshold step reliable.</text>
    <text x="88" y="552" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-style="italic" fill="#55617A">Figure 5 · Generated output + foreground segmentation after post-processing.</text>
  </g>

  <g id="cue_s07_c3_without_shuffling_task_triggers_cata">
    <title>Training without shuffling triggers catastrophic forgetting: perplexity on earlier tasks explodes into the thousands</title>
    <desc>without shuffling task triggers catastrophic forgetting model becomes proficient only its most recently seen task perplexity earlier tasks exploding thousands shuffling essential multi-task lvms</desc>
    <rect x="660" y="216" width="560" height="342" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <rect x="660" y="216" width="6" height="342" rx="3" fill="#C2410C"/>
    <text x="688" y="250" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.5">NO SHUFFLING → CATASTROPHIC FORGETTING</text>
    <image href="../images/figure6.png" x="688" y="264" width="176" height="272" preserveAspectRatio="xMidYMid meet"/>
    <text x="884" y="296" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">Train tasks in sequence</text>
    <text x="884" y="318" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">without shuffling and the</text>
    <text x="884" y="340" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">model stays good only at its</text>
    <text x="884" y="362" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">most recent task.</text>
    <rect x="884" y="384" width="308" height="70" rx="8" fill="#FEF3EC"/>
    <text x="900" y="414" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#C2410C">1000+ perplexity</text>
    <text x="900" y="440" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">on earlier tasks — shuffling is essential.</text>
    <text x="688" y="552" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-style="italic" fill="#55617A">Figure 6 · Inference across training stages (no shuffling).</text>
  </g>

  <g id="cue_s07_c4_finally_even_just_eighty_million">
    <title>Finally, even at just 80M parameters, knowledge distillation still improves validation perplexity on all three tasks</title>
    <desc>finally even just eighty million parameters knowledge distillation still improves validation perplexity across segmentation pose estimation deraining</desc>
    <rect x="60" y="574" width="1160" height="80" rx="12" fill="#E4F6F5"/>
    <rect x="60" y="574" width="6" height="80" rx="3" fill="#0EA5A4"/>
    <text x="92" y="606" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#0EA5A4" letter-spacing="1.5">EVEN AT 80M PARAMETERS</text>
    <text x="92" y="636" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-weight="700" fill="#14264A">Knowledge distillation still improves validation perplexity across segmentation, pose, and deraining.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">DeLVM · ICML 2024 — ablations (Figures 5–6)</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">07</text>
  </g>
</svg>
