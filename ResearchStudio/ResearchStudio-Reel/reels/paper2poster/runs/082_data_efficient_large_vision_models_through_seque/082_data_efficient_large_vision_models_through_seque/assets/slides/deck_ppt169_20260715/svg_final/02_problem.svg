<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="86" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#14264A">Powerful, but heavy — and blind to rare tasks</text>
    <text x="84" y="114" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">THE PROBLEM · MASSIVE SCALE + LONG-TAILED DATA</text>
  </g>

  <g id="cue_s02_c1_language_modeling_autoregressive_mod">
    <title>In language modeling autoregressive models like GPT thrive on a universal token interface</title>
    <desc>language modeling autoregressive models like gpt thrive universal token interface — recent work treats images and annotations as visual sentences</desc>
    <rect x="60" y="146" width="1160" height="92" rx="12" fill="#F4F6FB"/>
    <rect x="60" y="146" width="6" height="92" rx="3" fill="#14264A"/>
    <text x="88" y="180" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">FROM LANGUAGE TO VISION</text>
    <text x="88" y="208" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#16233B">Autoregressive models like GPT thrive on a universal token interface. Recent work extends this to vision —</text>
    <text x="88" y="230" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#16233B">treating images and their annotations as &quot;visual sentences&quot; predicted token by token.</text>
  </g>

  <g id="cue_s02_c2_but_leading_large_vision_needs">
    <title>But the leading large vision model needs over three billion parameters and roughly 400 billion visual tokens</title>
    <desc>but leading large vision needs over three billion parameters roughly four hundred billion visual tokens more than a billion images</desc>
    <rect x="60" y="262" width="720" height="196" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <text x="88" y="296" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">WHAT THE LEADING LVM DEMANDS</text>
    <g id="stat-params">
      <text x="150" y="380" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="46" font-weight="700" fill="#14264A">3B+</text>
      <text x="150" y="410" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">parameters</text>
      <text x="150" y="432" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">in the model</text>
    </g>
    <line x1="270" y1="322" x2="270" y2="422" stroke="#E2E8F2" stroke-width="1.5"/>
    <g id="stat-tokens">
      <text x="420" y="380" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="46" font-weight="700" fill="#2563EB">~400B</text>
      <text x="420" y="410" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">visual tokens</text>
      <text x="420" y="432" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">to train on</text>
    </g>
    <line x1="560" y1="322" x2="560" y2="422" stroke="#E2E8F2" stroke-width="1.5"/>
    <g id="stat-images">
      <text x="670" y="380" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="46" font-weight="700" fill="#14264A">1B+</text>
      <text x="670" y="410" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">source</text>
      <text x="670" y="432" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">images</text>
    </g>
  </g>

  <g id="cue_s02_c3_scale_expensive_impractical_edge_dep">
    <title>That scale is expensive and impractical for edge deployment</title>
    <desc>scale expensive impractical edge deployment — costly to train and hard to run on devices</desc>
    <rect x="800" y="262" width="420" height="196" rx="12" fill="#FEF3EC" stroke="#F6D2BC" stroke-width="1.5"/>
    <rect x="800" y="262" width="6" height="196" rx="3" fill="#C2410C"/>
    <text x="828" y="296" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#C2410C" letter-spacing="1.5">THE COST</text>
    <text x="828" y="336" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#14264A">Expensive to train,</text>
    <text x="828" y="366" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#14264A">impractical at the edge</text>
    <text x="828" y="402" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">This scale is out of reach for most labs and</text>
    <text x="828" y="424" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">cannot be deployed on-device.</text>
  </g>

  <g id="cue_s02_c4_worse_visual_world_long_tailed_some">
    <title>Worse, the visual world is long-tailed: segmentation abundant while pose estimation is starved</title>
    <desc>worse visual world long-tailed some tasks like segmentation abundant while pose estimation starved raw mixture rare tasks unlearned</desc>
    <rect x="60" y="478" width="1160" height="176" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <text x="88" y="512" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">WORSE — THE VISUAL WORLD IS LONG-TAILED</text>
    <g id="bar-seg">
      <text x="88" y="556" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#16233B">Segmentation</text>
      <rect x="300" y="540" width="640" height="24" rx="4" fill="#2563EB"/>
      <text x="956" y="558" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">abundant data</text>
    </g>
    <g id="bar-pose">
      <text x="88" y="606" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#16233B">Pose estimation</text>
      <rect x="300" y="590" width="70" height="24" rx="4" fill="#97A1B5"/>
      <text x="386" y="608" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#C2410C">starved</text>
    </g>
    <text x="88" y="642" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-style="italic" fill="#55617A">Train on the raw mixture and the model never learns the rare tasks at all.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">DeLVM · ICML 2024 — the scale and imbalance problem</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">02</text>
  </g>
</svg>
