<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="86" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#14264A">Three contributions</text>
    <text x="84" y="114" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">CONTRIBUTION · AUGMENTATION + FIRST-EVER KD + A PRACTICAL 80M MODEL</text>
  </g>

  <g id="cue_s04_c1_authors_make_three_main_contribution">
    <title>The authors make three main contributions</title>
    <desc>authors make three main contributions — framework overview of data-efficient LVM via augmentation and distillation</desc>
    <rect x="60" y="140" width="1160" height="234" rx="12" fill="#F4F6FB"/>
    <text x="88" y="172" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">FRAMEWORK OVERVIEW — THREE MAIN CONTRIBUTIONS</text>
    <image href="../images/figure1.png" x="88" y="184" width="1104" height="158" preserveAspectRatio="xMidYMid meet"/>
    <text x="640" y="362" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-style="italic" fill="#55617A">Figure 1 · Autoregressive LVM encodes images to a 1D sequence, made data-efficient via augmentation + distillation.</text>
  </g>

  <g id="cue_s04_c2_first_they_show_simple_augmentation">
    <title>First: simple augmentation (random crop and flip) rebalances long-tailed data as well as new samples</title>
    <desc>first they show simple augmentation random crop flip rebalances long-tailed multi-task data as effectively as collecting more real samples</desc>
    <rect x="60" y="390" width="360" height="264" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <rect x="60" y="390" width="360" height="8" rx="4" fill="#2563EB"/>
    <circle cx="98" cy="438" r="18" fill="#2563EB"/>
    <text x="98" y="445" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="130" y="445" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#14264A">Augmentation</text>
    <text x="88" y="486" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">Simple random crop and flip</text>
    <text x="88" y="510" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">rebalance long-tailed multi-task</text>
    <text x="88" y="534" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">data — improving the model just</text>
    <text x="88" y="558" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">as effectively as collecting more</text>
    <text x="88" y="582" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">real samples.</text>
    <rect x="88" y="606" width="304" height="30" rx="6" fill="#EAF1FE"/>
    <text x="104" y="626" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#2563EB">crop + flip ≈ adding real data</text>
  </g>

  <g id="cue_s04_c3_second_they_bring_knowledge_distilla">
    <title>Second: they bring knowledge distillation to autoregressive LVMs for the first time</title>
    <desc>second they bring knowledge distillation autoregressive large vision models first time LLaMA one-billion teacher lift compact three-hundred-million student single multi-task</desc>
    <rect x="452" y="390" width="360" height="264" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <rect x="452" y="390" width="360" height="8" rx="4" fill="#0EA5A4"/>
    <circle cx="490" cy="438" r="18" fill="#0EA5A4"/>
    <text x="490" y="445" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="522" y="445" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#14264A">First-ever KD</text>
    <text x="480" y="486" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">Knowledge distillation for AR</text>
    <text x="480" y="510" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">large vision models for the very</text>
    <text x="480" y="534" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">first time — lifting the student on</text>
    <text x="480" y="558" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#16233B">single- and multi-task benchmarks.</text>
    <g id="kd-teacher-student">
      <rect x="480" y="606" width="120" height="30" rx="6" fill="#14264A"/>
      <text x="540" y="626" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">LLaMA-1B</text>
      <text x="614" y="626" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="700" fill="#0EA5A4">→</text>
      <rect x="636" y="606" width="120" height="30" rx="6" fill="#E4F6F5" stroke="#0EA5A4" stroke-width="1.5"/>
      <text x="696" y="626" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#0EA5A4">300M</text>
    </g>
  </g>

  <g id="cue_s04_c4_third_they_build_practical_eighty_mi">
    <title>Third: a practical 80M model reaching 83% ImageNet top-1 by combining both techniques</title>
    <desc>third they build practical eighty-million-parameter model combining both techniques surprisingly reaches eighty-three percent top-one accuracy imagenet generation understanding together</desc>
    <rect x="844" y="390" width="376" height="264" rx="12" fill="#14264A"/>
    <rect x="844" y="390" width="376" height="8" rx="4" fill="#2563EB"/>
    <circle cx="882" cy="438" r="18" fill="#2563EB"/>
    <text x="882" y="445" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="914" y="445" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#FFFFFF">Practical 80M</text>
    <text x="872" y="512" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="40" font-weight="700" fill="#FFFFFF">83%</text>
    <text x="1010" y="500" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#EAF1FE">ImageNet</text>
    <text x="1010" y="520" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#EAF1FE">top-1 accuracy</text>
    <text x="872" y="556" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#C7D2E6">An 80M model combining both</text>
    <text x="872" y="578" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#C7D2E6">techniques — hinting generation</text>
    <text x="872" y="600" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#C7D2E6">and understanding can be</text>
    <text x="872" y="622" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#C7D2E6">learned together.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">DeLVM · ICML 2024 — contributions</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">04</text>
  </g>
</svg>
