<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#14264A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="700" y="0" width="580" height="720" fill="#F4F6FB"/>
    <rect x="0" y="0" width="1280" height="6" fill="#14264A"/>
    <rect x="0" y="0" width="360" height="6" fill="#2563EB"/>
  </g>

  <g id="cover-kicker">
    <rect x="80" y="82" width="54" height="5" fill="#2563EB"/>
    <text x="80" y="120" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#2563EB" letter-spacing="2.5">PAPER DEEP-READ · ICML 2024 · arXiv 2402.04841</text>
  </g>

  <g id="cover-title">
    <text x="80" y="205" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="54" font-weight="700" fill="#14264A">Data-efficient Large</text>
    <text x="80" y="267" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="54" font-weight="700" fill="#14264A">Vision Models</text>
    <text x="80" y="312" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="27" font-style="italic" fill="#2563EB">through Sequential Autoregression — DeLVM</text>
  </g>

  <g id="cover-authors">
    <line x1="80" y1="346" x2="200" y2="346" stroke="#14264A" stroke-width="1.5"/>
    <text x="80" y="382" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#16233B">Jianyuan Guo · Zhiwei Hao · Chengcheng Wang · Yehui Tang</text>
    <text x="80" y="406" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#16233B">Han Wu · Han Hu · Kai Han · Chang Xu</text>
    <text x="80" y="436" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">University of Sydney · Beijing Institute of Technology · Huawei Noah's Ark Lab</text>
  </g>

  <g id="cue_s01_c2_icml_2024_delvm_asks_whether">
    <title>ICML 2024 DeLVM asks whether we really need all that scale</title>
    <desc>icml 2024 delvm asks whether really need all — do we really need 3B parameters and 400B visual tokens</desc>
    <rect x="80" y="486" width="600" height="150" rx="14" fill="#EAF1FE"/>
    <rect x="80" y="486" width="6" height="150" rx="3" fill="#2563EB"/>
    <text x="108" y="522" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="2">THE QUESTION</text>
    <text x="108" y="562" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" font-style="italic" fill="#14264A">Do we really need 3B parameters</text>
    <text x="108" y="594" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" font-style="italic" fill="#14264A">and 400B visual tokens?</text>
    <text x="108" y="622" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">DeLVM asks whether all that scale is really necessary.</text>
  </g>

  <g id="cue_s01_c1_large_vision_models_trained_autoregr">
    <title>Large vision models trained by autoregression promise a single generalist model</title>
    <desc>large vision models trained autoregression promise single generalist many visual tasks — images and annotations encoded into one 1D token sequence</desc>
    <rect x="740" y="132" width="470" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="766" y="168" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">AUTOREGRESSIVE LVM</text>
    <text x="766" y="200" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="21" font-weight="700" fill="#14264A">One generalist model, many tasks</text>
    <text x="766" y="230" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">Images and annotations are encoded into a</text>
    <text x="766" y="252" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">single 1D sequence, then predicted token by</text>
    <text x="766" y="274" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">token — like a language model for vision.</text>
  </g>

  <g id="cue_s01_c3_authors_show_two_simple_classical">
    <title>The authors show two simple classical ideas: augmentation and knowledge distillation</title>
    <desc>authors show two simple classical ideas augmentation knowledge distillation let compact model reach strong performance</desc>
    <text x="740" y="326" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#14264A" letter-spacing="1.5">TWO SIMPLE, CLASSICAL IDEAS</text>
    <g id="idea-chip-aug">
      <rect x="740" y="340" width="228" height="118" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
      <rect x="740" y="340" width="228" height="34" rx="12" fill="#2563EB"/>
      <rect x="740" y="356" width="228" height="18" fill="#2563EB"/>
      <text x="758" y="363" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Data Augmentation</text>
      <text x="758" y="402" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B">Random crop &amp; flip to</text>
      <text x="758" y="422" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B">rebalance long-tailed</text>
      <text x="758" y="442" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B">multi-task data.</text>
    </g>
    <g id="idea-chip-kd">
      <rect x="982" y="340" width="228" height="118" rx="12" fill="#FFFFFF" stroke="#0EA5A4" stroke-width="1.5"/>
      <rect x="982" y="340" width="228" height="34" rx="12" fill="#0EA5A4"/>
      <rect x="982" y="356" width="228" height="18" fill="#0EA5A4"/>
      <text x="1000" y="363" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Knowledge Distillation</text>
      <text x="1000" y="402" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B">Compress a large</text>
      <text x="1000" y="422" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B">teacher into a compact</text>
      <text x="1000" y="442" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B">student model.</text>
    </g>
  </g>

