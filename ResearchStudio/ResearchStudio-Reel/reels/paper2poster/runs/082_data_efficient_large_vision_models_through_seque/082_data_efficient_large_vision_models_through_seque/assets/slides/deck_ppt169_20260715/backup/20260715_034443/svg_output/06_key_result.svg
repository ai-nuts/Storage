<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="86" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#14264A">The recipe consistently wins</text>
    <text x="84" y="114" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1.5">KEY RESULT · BALANCING · DISTILLATION · DATA-SCALING</text>
  </g>

  <g id="cue_s06_c1_results_consistently_favor_proposed">
    <title>Balancing the data through augmentation beats the raw mixture and naive re-sampling</title>
    <desc>results consistently favor proposed recipe mixed three-task benchmark balancing through augmentation beats raw unbalanced mixture naive re-sampling collapses scarce tasks</desc>
    <rect x="60" y="146" width="592" height="250" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <text x="84" y="178" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">BALANCING THE 3-TASK MIXTURE</text>
    <image href="../images/figure3.png" x="84" y="188" width="544" height="150" preserveAspectRatio="xMidYMid meet"/>
    <text x="84" y="360" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#16233B"><tspan font-weight="700" fill="#C2410C">Re-sampling collapses</tspan> on scarce tasks · <tspan font-weight="700" fill="#15803D">augmentation balances best</tspan></text>
    <text x="84" y="384" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-style="italic" fill="#55617A">Figure 3 · Inference results under unbalanced / re-sampled / augmented data.</text>
  </g>

  <g id="cue_s06_c4_scaling_segmentation_one_ten_percent">
    <title>Scaling segmentation 1 to 10 percent lowers validation loss by ~0.2 and perplexity by over 22; augmentation reproduces it</title>
    <desc>scaling segmentation one ten percent lowers validation loss nearly two tenths perplexity over twenty-two points augmentation reproduces no new data</desc>
    <rect x="668" y="146" width="552" height="250" rx="12" fill="#F4F6FB"/>
    <text x="692" y="178" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">SCALING DATA — REPRODUCED BY AUGMENTATION</text>
    <image href="../images/figure2.png" x="692" y="190" width="196" height="196" preserveAspectRatio="xMidYMid meet"/>
    <g id="scale-stats">
      <text x="912" y="216" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#55617A">SA-1B segmentation 1% → 10%</text>
      <text x="912" y="258" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="30" font-weight="700" fill="#14264A">−0.19</text>
      <text x="1010" y="258" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">validation loss</text>
      <text x="912" y="300" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="30" font-weight="700" fill="#2563EB">−22.4</text>
      <text x="1010" y="300" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#55617A">perplexity</text>
      <rect x="912" y="322" width="286" height="44" rx="8" fill="#EAF1FE"/>
      <text x="928" y="349" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#2563EB">Augmentation reproduces it — no new data</text>
    </g>
    <text x="692" y="393" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" font-style="italic" fill="#55617A">Figure 2</text>
  </g>

  <g id="cue_s06_c2_knowledge_distillation_improves_comp">
    <title>Knowledge distillation improves the compact student on segmentation, pose, and deraining, single- and multi-task</title>
    <desc>knowledge distillation improves compact student segmentation pose estimation deraining both single-task multi-task training</desc>
    <rect x="60" y="412" width="592" height="242" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <rect x="60" y="412" width="6" height="242" rx="3" fill="#0EA5A4"/>
    <text x="88" y="446" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#0EA5A4" letter-spacing="1.5">DISTILLATION LIFTS THE STUDENT</text>
    <text x="88" y="482" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#16233B">KD improves the compact student on every task —</text>
    <text x="88" y="506" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#16233B">in both single-task and multi-task training.</text>
    <g id="kd-task-row">
      <rect x="88" y="528" width="170" height="46" rx="8" fill="#E4F6F5"/>
      <text x="173" y="551" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="700" fill="#0EA5A4">✓ Segmentation</text>
      <rect x="270" y="528" width="120" height="46" rx="8" fill="#E4F6F5"/>
      <text x="330" y="551" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="700" fill="#0EA5A4">✓ Pose</text>
      <rect x="402" y="528" width="150" height="46" rx="8" fill="#E4F6F5"/>
      <text x="477" y="551" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="700" fill="#0EA5A4">✓ Deraining</text>
    </g>
    <text x="88" y="612" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-style="italic" fill="#55617A">The 300M student trained with a LLaMA-1B teacher</text>
    <text x="88" y="634" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-style="italic" fill="#55617A">tracks the teacher far more closely than from scratch.</text>
  </g>

  <g id="cue_s06_c3_pascal_five_i_foreground_segmentatio">
    <title>On Pascal-5i, the distilled and fine-tuned 300M model clearly surpasses the same model trained from scratch</title>
    <desc>pascal five-i foreground segmentation benchmark distilled fine-tuned three-hundred-million clearly surpasses same model trained from scratch mean intersection over union</desc>
    <rect x="668" y="412" width="552" height="242" rx="12" fill="#FFFFFF" stroke="#E2E8F2" stroke-width="1.5"/>
    <rect x="668" y="412" width="6" height="242" rx="3" fill="#2563EB"/>
    <text x="696" y="446" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">PASCAL-5i FOREGROUND SEGMENTATION</text>
    <text x="696" y="482" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#16233B">Distilled + fine-tuned 300M clearly surpasses the</text>
    <text x="696" y="506" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#16233B">same model trained from scratch.</text>
    <text x="696" y="546" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" font-weight="700" fill="#55617A" letter-spacing="1">DISTILLED 300M mIoU · SPLITS 0–3</text>
    <g id="pascal-miou">
      <rect x="696" y="560" width="120" height="60" rx="8" fill="#EAF1FE"/>
      <text x="756" y="596" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#14264A">18.58</text>
      <rect x="824" y="560" width="120" height="60" rx="8" fill="#EAF1FE"/>
      <text x="884" y="596" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#14264A">21.32</text>
      <rect x="952" y="560" width="120" height="60" rx="8" fill="#EAF1FE"/>
      <text x="1012" y="596" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#14264A">19.90</text>
      <rect x="1080" y="560" width="120" height="60" rx="8" fill="#EAF1FE"/>
      <text x="1140" y="596" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#14264A">21.08</text>
    </g>
    <text x="696" y="642" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" font-weight="700" fill="#15803D">All four splits beat the from-scratch baseline.</text>
  </g>

  <g id="footer">
    <text x="60" y="702" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">DeLVM · ICML 2024 — key results (Figures 2–4)</text>
    <text x="1220" y="702" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="11" fill="#97A1B5">06</text>
  </g>
</svg>
