<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Why RL breaks randomized smoothing</text><g id="cue_s03_c1_core_motivation_trust_you_cannot"><title>core motivation trust you cannot prove policy robust passing today</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#3E9BFF" font-weight="800" text-anchor="start">The core motivation is trust</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">If you cannot prove a policy is robust, then passing</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">today's attacks tells you little about tomorrow's</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">stronger, unseen adversary.</text><rect x="92" y="300" width="504" height="44" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="344.0" y="328.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">pass known attacks  =/=  robust</text></g><g id="cue_s03_c2_randomized_smoothing_become_leading"><title>randomized smoothing become leading tool certifying image classifiers but reinforcement</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#33D6C0"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Smoothing certifies classifiers</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Randomized smoothing has become a leading tool for</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">certified robustness in image classification, but</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reinforcement learning does not fit its mold.</text><rect x="92" y="516" width="468" height="28" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="110" cy="530.0" r="5" fill="#33D6C0"/><text x="126" y="536.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">add noise  ·  average outputs  ·  certified radius</text></g><g id="cue_s03_c3_classification_confidence_output_liv"><title>classification confidence output lives known zero-to-one range behaves like probability</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#F4C24C"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F4C24C" font-weight="800" text-anchor="start">Q-values are not probabilities</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Classifier confidence lives in a known 0-1 range and acts like a</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">probability; a Q-value's range is unknown, and it is not a</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">probability.</text><rect x="676" y="282" width="248.0" height="52" rx="8" fill="#173049" stroke="#3E9BFF" stroke-width="1.2"/><text x="692" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#3E9BFF" font-weight="800" text-anchor="start">classifier</text><text x="692" y="326" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="start">prob in [0, 1]</text><rect x="940.0" y="282" width="248.0" height="52" rx="8" fill="#173049" stroke="#F2685C" stroke-width="1.2"/><text x="956.0" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2685C" font-weight="800" text-anchor="start">Q-value</text><text x="956.0" y="326" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="start">range [Vmin, Vmax] ?</text></g><g id="cue_s03_c4_top_single_action_decision_not"><title>top single action decision not whole story what ultimately matters</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#46C98B"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">Reward, not a single action</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">A single action decision is not the whole story: what</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">ultimately matters is the reward accumulated along an</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">entire trajectory. CROP overcomes both obstacles.</text><text x="676" y="524" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#46C98B" font-weight="800" text-anchor="start">certify action AND cumulative reward</text></g></svg>