ill="#9DB3C8" font-weight="400" text-anchor="start">radius across every smoothing level.</text><rect x="92" y="448" width="312" height="88" rx="10" fill="#173049" stroke="#33D6C0" stroke-width="1.4"/><text x="110" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#33D6C0" font-weight="800" text-anchor="start">RadialRL</text><text x="110" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="400" text-anchor="start">optimizes against worst-case perturbations</text></g><g id="cue_s07_c3_encouragingly_these_certified_rankin"><title>encouragingly these certified rankings largely agree what people had observed</title><rect x="456" y="324" width="368" height="224" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="456" y="324" width="6" height="224" rx="6" fill="#3E9BFF"/><text x="484" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#3E9BFF" font-weight="800" text-anchor="start">Pong</text><text x="484" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">SA-MDP with the convex relaxation is the</text><text x="484" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">most certifiably robust.</text><rect x="484" y="448" width="312" height="88" rx="10" fill="#173049" stroke="#3E9BFF" stroke-width="1.4"/><text x="502" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#3E9BFF" font-weight="800" text-anchor="start">SA-MDP (CVX)</text><text x="502" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="400" text-anchor="start">certified ranking matches empirical results</text></g><g id="cue_s07_c4_analysis_also_surfaces_new_structure"><title>analysis also surfaces new structure pong every method shows periodic</title><rect x="848" y="324" width="368" height="224" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="848" y="324" width="6" height="224" rx="6" fill="#F4C24C"/><text x="876" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">A periodic pattern on Pong</text><text x="876" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Every method shows a periodic certified</text><text x="876" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">radius over time, peaking at confident</text><text x="876" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">states such as when the ball flies toward</text><text x="876" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">the paddle.</text><rect x="876" y="502" width="316" height="32" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="894" cy="518.0" r="5" fill="#F4C24C"/><text x="910" y="524.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">an insight to guide robust training</text></g></svg>