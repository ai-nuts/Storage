<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Functional smoothing of the Q-function</text><g id="cue_s05_c1_engine_crop_functional_smoothing_sta"><title>engine crop functional smoothing state action method adds gaussian noise</title><rect x="64" y="158" width="1152" height="168" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="168" rx="6" fill="#3E9BFF"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The engine: functional smoothing</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">At each state and action, add Gaussian noise to the state and</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">average the trained Q-network's output, producing a smoothed</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">value function.</text><rect x="92" y="272" width="560" height="40" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="372.0" y="298.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Q~(s,a) = E[ Q(s+D, a) ],  D ~ N(0, s^2 I)</text><rect x="676" y="200" width="540" height="110" rx="8" fill="#0E2334" stroke="#284A66" stroke-width="1.5"/><line x1="692" y1="290" x2="1202" y2="290" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><polyline points="692.0,289.22237024232305 704.75,288.7940770081855 717.5,288.1715013102257 730.25,287.2891960753835 743.0,286.07056660161066 755.75,284.43083438972405 768.5,282.282463228686 781.25,279.54327573247076 794.0,276.147091064147 806.75,272.05618940094485 819.5,267.2743272849155 832.25,261.8585031833742 845.0,255.927342082802 857.75,249.663964842974 870.5,243.3116232399068 883.25,237.1612278607695 896.0,231.53108520121094 908.75,226.7405045488763 921.5,223.080176271683 934.25,220.7830868772137 947.0,220.0 959.75,220.7830868772137 972.5,223.080176271683 985.25,226.74050454887626 998.0,231.53108520121094 1010.75,237.1612278607695 1023.5,243.3116232399068 1036.25,249.66396484297402 1049.0,255.92734208280197 1061.75,261.8585031833742 1074.5,267.2743272849155 1087.25,272.05618940094485 1100.0,276.147091064147 1112.75,279.5432757324707 1125.5,282.282463228686 1138.25,284.43083438972405 1151.0,286.07056660161066 1163.75,287.2891960753835 1176.5,288.1715013102257 1189.25,288.7940770081855 1202.0,289.22237024232305" fill="none" stroke="#3E9BFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="845.0" cy="284" r="3" fill="#33D6C0" opacity="0.8"/><circle cx="896.0" cy="284" r="3" fill="#33D6C0" opacity="0.8"/><circle cx="947.0" cy="284" r="3" fill="#33D6C0" opacity="0.8"/><circle cx="998.0" cy="284" r="3" fill="#33D6C0" opacity="0.8"/><circle cx="1049.0" cy="284" r="3" fill="#33D6C0" opacity="0.8"/><circle cx="947.0" cy="220" r="4.5" fill="#F4C24C"/><text x="947.0" y="218" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#F4C24C" font-weight="800" text-anchor="middle">E[ Q(s+D) ]</text><text x="1202" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">s + Delta</text></g><g id="cue_s05_c2_key_lemma_shows_smoothed_function"><title>key lemma shows smoothed function lipschitz continuous constant shrinks smoothing</title><rect x="64" y="342" width="560" height="208" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="342" width="6" height="208" rx="6" fill="#33D6C0"/><text x="92" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Smoothed =&gt; Lipschitz =&gt; radius</text><text x="92" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A key lemma shows the smoothed function is Lipschitz</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">continuous, with a constant that shrinks as the variance</text><text x="92" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">grows. Theorem 1 turns this into a certified radius on the</text><text x="92" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">action.</text><rect x="92" y="508" width="504" height="44" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="344.0" y="536.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">|delta| &lt; r  =&gt;  action unchanged</text></g><g id="cue_s05_c3_radius_depends_gap_between_best"><title>radius depends gap between best runner-up smoothed action-values revealing trade-off</title><rect x="656" y="342" width="560" height="102" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="342" width="6" height="102" rx="6" fill="#F4C24C"/><text x="684" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">Radius = margin trade-off</text><text x="684" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">The radius grows with the gap between the top-two smoothed</text><text x="684" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="400" text-anchor="start">values; more smoothing narrows that margin.</text></g><g id="cue_s05_c4_cumulative_reward_global_smoothing_t"><title>cumulative reward global smoothing treats whole trajectory function bound expected</title><rect x="656" y="460" width="560" height="90" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="460" width="6" height="90" rx="6" fill="#46C98B"/><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Reward: global smoothing + tree</text><text x="684" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Global smoothing bounds expected and percentile reward, while CROP-LoRe</text><text x="684" y="535" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">grows a trajectory tree for a tight absolute lower bound.</text></g></svg>