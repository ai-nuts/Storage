<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Provable robustness for RL</text><g id="cue_s10_c1_lasting_message_crop_robustness_rein"><title>lasting message crop robustness reinforcement learning need not matter hope</title><rect x="64" y="176" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="176" width="6" height="180" rx="6" fill="#3E9BFF"/><circle cx="98" cy="216" r="10" fill="#3E9BFF"/><text x="122" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Robustness need not be hope</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">By smoothing the value function, you can prove an agent's</text><text x="92" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">action stays fixed within a certified radius, not merely hope</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">it does.</text></g><g id="cue_s10_c2_smoothing_value_function_you_prove"><title>smoothing value function you prove agent action stays fixed within</title><rect x="656" y="176" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="176" width="6" height="180" rx="6" fill="#33D6C0"/><circle cx="690" cy="216" r="10" fill="#33D6C0"/><text x="714" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">A provable reward floor</text><text x="684" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">You can also prove a lower bound on the reward the agent will</text><text x="684" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">collect under any bounded attack, across a whole trajectory.</text></g><g id="cue_s10_c3_applied_nine_methods_across_four"><title>applied nine methods across four environments these certificates not only</title><rect x="64" y="374" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="374" width="6" height="180" rx="6" fill="#46C98B"/><circle cx="98" cy="414" r="10" fill="#46C98B"/><text x="122" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Correct, and often tight</text><text x="92" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Applied to nine methods across four environments, these</text><text x="92" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">certificates are not only correct but often tight, matching</text><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">what attacks achieve.</text></g><g id="cue_s10_c4_crop_turns_robust_something_you"><title>crop turns robust something you measure compare common provable leaderboard</title><rect x="656" y="374" width="560" height="180" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="374" width="6" height="180" rx="6" fill="#F4C24C"/><circle cx="690" cy="414" r="10" fill="#F4C24C"/><text x="714" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">A common, provable leaderboard</text><text x="684" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CROP turns robust RL into something you can measure and</text><text x="684" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">compare, inviting the community to certify more methods and</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">environments.</text></g><line x1="64" y1="584" x2="1216" y2="584" stroke="#284A66" stroke-width="1" stroke-linecap="round"/><circle cx="112" cy="628" r="19" fill="none" stroke="#3E9BFF" stroke-width="2.2"/><circle cx="112" cy="628" r="29" fill="none" stroke="#3E9BFF" stroke-width="1.0" opacity="0.35"/><circle cx="112" cy="628" r="5" fill="#F4C24C"/><line x1="112" y1="628" x2="131" y2="628" stroke="#F4C24C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><text x="121.5" y="620" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#F4C24C" font-weight="800" text-anchor="middle">r</text><text x="112" y="593" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33D6C0" font-weight="800" text-anchor="middle">action fixed</text><text x="112" y="669" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">state  s</text><text x="1216" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">CROP  ·  Certified Robust RL via Functional Smoothing  ·  ICLR 2022</text></svg>