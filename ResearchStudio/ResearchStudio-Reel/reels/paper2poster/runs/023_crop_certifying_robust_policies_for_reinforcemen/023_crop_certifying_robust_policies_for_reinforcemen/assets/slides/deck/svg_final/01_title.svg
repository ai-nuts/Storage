<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="800" text-anchor="start" letter-spacing="2">ICLR 2022</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">Certified Robustness  ·  Reinforcement Learning</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#284A66" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">CROP</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">Certifying Robust Policies for Reinforcement Learning</text><text x="64" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">through Functional Smoothing</text><circle cx="1116" cy="176" r="46" fill="none" stroke="#3E9BFF" stroke-width="2.2"/><circle cx="1116" cy="176" r="56" fill="none" stroke="#3E9BFF" stroke-width="1.0" opacity="0.35"/><circle cx="1116" cy="176" r="5" fill="#F4C24C"/><line x1="1116" y1="176" x2="1162" y2="176" stroke="#F4C24C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><text x="1139.0" y="168" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#F4C24C" font-weight="800" text-anchor="middle">r</text><text x="1116" y="114" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#33D6C0" font-weight="800" text-anchor="middle">action fixed</text><text x="1116" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">state  s</text><text x="64" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Fan Wu · Linyi Li · Zijian Huang · Yevgeniy Vorobeychik · Ding Zhao · Bo Li</text><text x="64" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">UIUC   ·   Washington University in St. Louis   ·   Carnegie Mellon University</text><g id="cue_s01_c1_reinforcement_learning_now_drives_sa"><title>reinforcement learning now drives safety-critical systems like autonomous vehicles but</title><rect x="64" y="306" width="276" height="224" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="306" width="276" height="6" rx="6" fill="#3E9BFF"/><circle cx="90" cy="348" r="7" fill="#3E9BFF"/><text x="108" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">RL in safety-critical</text><text x="108" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">systems</text><text x="88" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Reinforcement learning now drives</text><text x="88" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">systems like autonomous vehicles,</text><text x="88" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">where adversarial perturbations to</text><text x="88" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">a policy's input states can</text><text x="88" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">quietly steer it toward disaster.</text></g><g id="cue_s01_c2_many_defenses_improve_robustness_emp"><title>many defenses improve robustness empirically yet almost none certify guarantees</title><rect x="356" y="306" width="276" height="224" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="356" y="306" width="276" height="6" rx="6" fill="#F2685C"/><circle cx="382" cy="348" r="7" fill="#F2685C"/><text x="400" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Empirical is not</text><text x="400" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">enough</text><text x="380" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Many defenses improve robustness</text><text x="380" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">empirically, yet almost none can</text><text x="380" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">certify it with theoretical</text><text x="380" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">guarantees against every bounded</text><text x="380" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">attack.</text></g><g id="cue_s01_c3_crop_certifies_robustness_two_levels"><title>crop certifies robustness two levels stability action taken state provable</title><rect x="648" y="306" width="276" height="224" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="648" y="306" width="276" height="6" rx="6" fill="#33D6C0"/><circle cx="674" cy="348" r="7" fill="#33D6C0"/><text x="692" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Certify at two levels</text><text x="672" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">CROP is the first unified</text><text x="672" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">framework to certify RL robustness</text><text x="672" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">at two levels: the per-state</text><text x="672" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">action, and a lower bound on</text><text x="672" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">cumulative reward.</text></g><g id="cue_s01_c4_authors_benchmark_nine_existing_robu"><title>authors benchmark nine existing robust algorithms across four environments show</title><rect x="940" y="306" width="276" height="224" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="940" y="306" width="276" height="6" rx="6" fill="#46C98B"/><circle cx="966" cy="348" r="7" fill="#46C98B"/><text x="984" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">9 methods, 4</text><text x="984" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">environments</text><text x="964" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">The authors benchmark nine</text><text x="964" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">existing robust RL algorithms</text><text x="964" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">across four environments and show</text><text x="964" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">their certificates are often</text><text x="964" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">tight.</text></g><line x1="64" y1="556" x2="1216" y2="556" stroke="#284A66" stroke-width="1" stroke-linecap="round"/><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="700" text-anchor="start">arXiv:2106.09292</text><text x="300" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">crop-leaderboard.github.io</text><text x="1216" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Prove robustness, don't just observe it.</text></svg>