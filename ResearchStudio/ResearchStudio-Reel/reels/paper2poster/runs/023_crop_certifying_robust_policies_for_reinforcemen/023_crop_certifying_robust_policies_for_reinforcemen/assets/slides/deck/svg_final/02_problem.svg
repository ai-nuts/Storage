<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Certify robustness, don't just observe it</text><g id="cue_s02_c1_reinforcement_learning_moved_domains"><title>reinforcement learning moved domains where failure costly such autonomous driving</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#3E9BFF"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">RL where failure is costly</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Reinforcement learning has moved into</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">domains such as autonomous driving and</text><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">trading, where a single wrong decision can</text><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">be catastrophic.</text><rect x="92" y="352" width="344" height="146" rx="10" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="112" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">the deployed decision loop</text><rect x="112" y="398" width="304" height="40" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="264.0" y="424.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">observe s -&gt; pick action a</text><text x="112" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">one bad action can cascade</text></g><g id="cue_s02_c2_but_researchers_shown_adversary_who"><title>but researchers shown adversary who slightly perturbs state observations fed</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">A small perturbation flips the action</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">An adversary who slightly perturbs the state</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">observations fed to an agent can reliably change</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">its decisions; empirical defenses keep falling to</text><text x="528" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">newer adaptive attacks.</text><rect x="930" y="220" width="272" height="74" rx="8" fill="#0E2334" stroke="#284A66" stroke-width="1.5"/><circle cx="970" cy="257.0" r="7" fill="#33D6C0"/><text x="970" y="241.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#33D6C0" font-weight="800" text-anchor="middle">state s</text><line x1="986" y1="257.0" x2="1071.44" y2="257.0" stroke="#F2685C" stroke-width="2.2" stroke-linecap="round"/><polyline points="1062.44,252.0 1071.44,257.0 1062.44,262.0" fill="#F2685C" stroke="#F2685C" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1028.72" y="275.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10" fill="#F2685C" font-weight="800" text-anchor="middle">|| delta || &lt;= eps</text><circle cx="1098.6399999999999" cy="257.0" r="7" fill="#F2685C" stroke="#F4C24C" stroke-width="1.5"/><text x="1098.6399999999999" y="241.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#F2685C" font-weight="800" text-anchor="middle">s + delta</text><text x="1188" y="261.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#F4C24C" font-weight="800" text-anchor="end">action flips</text><text x="1188" y="279.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="600" text-anchor="end">empirical defense breaks</text></g><g id="cue_s02_c3_what_been_missing_certification_way"><title>what been missing certification way prove rather just observe trained</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F4C24C"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">What is missing: certification</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A way to prove, not just observe, that a trained policy stays reliable</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">under every perturbation within a bounded budget.</text></g><g id="cue_s02_c4_tackles_exactly_gap_reinforcement_le"><title>tackles exactly gap reinforcement learning</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#46C98B"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">CROP tackles exactly this gap</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">This paper delivers the first certification of robustness for</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reinforcement learning, turning a hope into a provable guarantee.</text></g></svg>