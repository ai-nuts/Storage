<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The scope in one place</text><g id="cue_s09_c1_few_numbers_capture_scope_crop"><title>few numbers capture scope crop first unified certification framework reinforcement</title><rect x="64" y="166" width="1152" height="132" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="166" width="6" height="132" rx="6" fill="#46C98B"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#46C98B" font-weight="800" text-anchor="start">First unified robustness certification for RL</text><rect x="92" y="220" width="300" height="66" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="242.0" y="254.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22.44" fill="#46C98B" font-weight="800" text-anchor="middle">action + reward</text><text x="242.0" y="272.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">two certified levels</text><rect x="410" y="220" width="806" height="66" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="430" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">CROP works at both the per-state action level and the cumulative-reward level, the first</text><t