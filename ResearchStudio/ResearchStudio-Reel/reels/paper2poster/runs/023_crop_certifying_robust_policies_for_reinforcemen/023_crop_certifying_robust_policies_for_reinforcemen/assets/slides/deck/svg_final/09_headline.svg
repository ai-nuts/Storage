"14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="314" width="6" height="150" rx="6" fill="#F4C24C"/><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">Algorithms &amp; smoothing</text><rect x="684" y="368" width="236" height="80" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="802.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#F4C24C" font-weight="800" text-anchor="middle">3</text><text x="802.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">CROP algorithms</text><rect x="938" y="368" width="236" height="80" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="1056.0" y="409.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#33D6C0" font-weight="800" text-anchor="middle">sigma &lt;= 1.0</text><text x="1056.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">on Freeway</text><text x="704" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">CROP-LoAct · CROP-GRe · CROP-LoRe</text></g><g id="cue_s09_c4_smoothing_variance_pushed_high_one"><title>smoothing variance pushed high one point zero freeway reward robustness</title><rect x="64" y="480" width="1152" height="70" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="480" width="6" height="70" rx="6" fill="#46C98B"/><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Three reward bounds</text><text x="92" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">expectation JE  ·  percentile Jp (p = 50%)  ·  absolute lower bound J</text><rect x="864" y="492" width="352" height="46" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="1040.0" y="521.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">J = sum gamma^t R(s_t)</text></g></svg>