" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">sigma -&gt;</text></g><g id="cue_s08_c2_pong_story_differs_too_much"><title>pong story differs too much smoothing hurts moderate sigma between</title><rect x="64" y="378" width="560" height="172" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#F4C24C"/><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F4C24C" font-weight="800" text-anchor="start">Pong prefers a moderate sigma</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">On Pong the story differs: too much smoothing hurts, and a</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">moderate sigma between about 0.01 and 0.03 works best for</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">nearly all methods.</text><rect x="92" y="512" width="468" height="28" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="110" cy="526.0" r="5" fill="#F4C24C"/><text x="126" y="532.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">sigma ~ 0.01 - 0.03  best on Pong</text></g><g id="cue_s08_c3_authors_also_compare_their_three"><title>authors also compare their three reward bounds</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#33D6C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Three reward bounds compared</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The percentile bound Jp is far tighter</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">than the loose expectation bound JE,</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sharpening the certified reward.</text><rect x="984" y="206" width="220" height="146" rx="8" fill="#0E2334" stroke="#284A66" stroke-width="1.5"/><line x1="1026" y1="330" x2="1026" y2="224" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><line x1="1026" y1="330" x2="1188" y2="330" stroke="#284A66" stroke-width="1.2" stroke-linecap="round"/><line x1="1026" y1="234.6" x2="1188" y2="234.6" stroke="#6E869C" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="6 5"/><text x="1188" y="229.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="700" text-anchor="end">empirical PGD</text><rect x="1041.0" y="293.96" width="34" height="36.04000000000002" rx="4" fill="#F2685C" opacity="0.9"/><text x="1058.0" y="344" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#F2685C" font-weight="800" text-anchor="middle">JE</text><rect x="1090.0" y="264.28" width="34" height="65.72000000000003" rx="4" fill="#F4C24C" opacity="0.9"/><text x="1107.0" y="344" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#F4C24C" font-weight="800" text-anchor="middle">Jp</text><rect x="1139.0" y="236.72" width="34" height="93.28" rx="4" fill="#46C98B" opacity="0.9"/><text x="1156.0" y="344" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#46C98B" font-weight="800" text-anchor="middle">J</text><text x="1020" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">reward</text></g><g id="cue_s08_c4_percentile_bound_far_tighter_loose"><title>percentile bound far tighter loose expectation bound absolute lower bound</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#46C98B"/><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Absolute lower bound is tight</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">The absolute lower bound from CROP-LoRe often matches the</text><text x="684" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">empirical reward under PGD exactly, a zero gap over a wide</text><text x="684" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">range of attacks.</text><rect x="684" y="512" width="508" height="28" rx="8" fill="#173049" stroke="#284A66" stroke-width="1.5"/><circle cx="702" cy="526.0" r="5" fill="#46C98B"/><text x="718" y="532.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">zero gap to empirical PGD  -&gt;  certificates are tight</text></g></svg>