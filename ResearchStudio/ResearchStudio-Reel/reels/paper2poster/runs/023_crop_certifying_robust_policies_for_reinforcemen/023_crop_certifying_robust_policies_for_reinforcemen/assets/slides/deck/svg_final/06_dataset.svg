73049" stroke="#33D6C0" stroke-width="1.6"/><rect x="369.5" y="244" width="263.5" height="5" rx="3" fill="#33D6C0"/><text x="501.25" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Freeway</text><text x="501.25" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">Atari</text><rect x="647.0" y="244" width="263.5" height="64" rx="10" fill="#173049" stroke="#F4C24C" stroke-width="1.6"/><rect x="647.0" y="244" width="263.5" height="5" rx="3" fill="#F4C24C"/><text x="778.75" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">CartPole</text><text x="778.75" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">control</text><rect x="924.5" y="244" width="263.5" height="64" rx="10" fill="#173049" stroke="#F2685C" stroke-width="1.6"/><rect x="924.5" y="244" width="263.5" height="5" rx="3" fill="#F2685C"/><text x="1056.25" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Highway</text><text x="1056.25" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">driving</text></g><g id="cue_s06_c2_pong_freeway_high_dimensional_atari"><title>pong freeway high-dimensional atari games cartpole classic low-dimensional control task</title><rect x="64" y="324" width="560" height="124" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="324" width="6" height="124" rx="6" fill="#33D6C0"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33D6C0" font-weight="800" text-anchor="start">High-dim games to control &amp; driving</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Pong and Freeway are high-dimensional Atari games; CartPole</text><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">is classic low-dimensional control; Highway simulates</text><text x="92" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">autonomous driving.</text></g><g id="cue_s06_c3_these_they_certify_nine_existing"><title>these they certify nine existing reinforcement learning methods ranging standard</title><rect x="656" y="324" width="560" height="124" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="324" width="6" height="124" rx="6" fill="#F2685C"/><text x="684" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Nine robust RL methods certified</text><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">StdTrain, GaussAug, AdvTrain, SA-MDP (PGD), SA-MDP (CVX),</text><text x="684" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">RadialRL, CARRL, NoisyNet, and GradDQN.</text></g><g id="cue_s06_c4_makes_crop_not_just_single"><title>makes crop not just single certificate but benchmark places many</title><rect x="64" y="464" width="1152" height="86" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="464" width="6" height="86" rx="6" fill="#46C98B"/><text x="92" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Not one certificate, but a benchmark</text><rect x="640" y="472" width="168" height="68" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="724.0" y="507.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.12" fill="#3E9BFF" font-weight="800" text-anchor="middle">4</text><text x="724.0" y="526.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">environments</text><rect x="822" y="472" width="168" height="68" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="906.0" y="507.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.12" fill="#33D6C0" font-weight="800" text-anchor="middle">9</text><text x="906.0" y="526.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">methods</text><rect x="1004" y="472" width="168" height="68" rx="12" fill="#173049" stroke="#284A66" stroke-width="1.5"/><text x="1088.0" y="507.36" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23.12" fill="#F4C24C" font-weight="800" text-anchor="middle">3</text><text x="1088.0" y="526.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">algorithms</text><text x="92" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">many robust RL methods on a common, provable footing</text></g></svg>