<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1826"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two criteria, three algorithms</text><g id="cue_s04_c1_crop_makes_three_main_contributions"><title>crop makes three main contributions first defines two certification criteria</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#3E9BFF"/><circle cx="114" cy="246" r="26" fill="none" stroke="#3E9BFF" stroke-width="2.5"/><text x="114" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#3E9BFF" font-weight="800" text-anchor="middle">2</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Two certification</text><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">criteria</text><text x="88" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CROP defines two criteria for</text><text x="88" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">RL: robustness of the</text><text x="88" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">per-state action, and a lower</text><text x="88" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">bound on the cumulative</text><text x="88" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reward.</text></g><g id="cue_s04_c2_second_turns_criterion_algorithm_cro"><title>second turns criterion algorithm crop-loact local randomized smoothing certify radius</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#33D6C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#33D6C0" stroke-width="2.5"/><text x="410" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#33D6C0" font-weight="800" text-anchor="middle">1</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">1 CROP-LoAct</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Local randomized smoothing</text><text x="384" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">certifies a radius around each</text><text x="384" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">state within which the chosen</text><text x="384" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">action cannot change.</text></g><g id="cue_s04_c3_crop_gre_global_smoothing_bound_expe"><title>crop-gre global smoothing bound expected percentile reward crop-lore performs adaptive</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#46C98B"/><circle cx="706" cy="246" r="26" fill="none" stroke="#46C98B" stroke-width="2.5"/><text x="706" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#46C98B" font-weight="800" text-anchor="middle">2</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">2 CROP-GRe &amp; LoRe</text><text x="680" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Global smoothing bounds</text><text x="680" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">expected and percentile</text><text x="680" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reward; an adaptive tree</text><text x="680" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">search gives a much tighter</text><text x="680" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">absolute lower bound.</text></g><g id="cue_s04_c4_third_authors_apply_these_tools"><title>third authors apply these tools nine existing robust algorithms across</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#122539" stroke="#284A66" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#F4C24C"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#F4C24C" stroke-width="2.5"/><text x="1002" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F4C24C" font-weight="800" text-anchor="middle">9</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">3 Benchmark &amp;</text><text x="976" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">leaderboard</text><text x="976" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The tools certify nine</text><text x="976" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">existing robust RL algorithms</text><text x="976" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">across four environments,</text><text x="976" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">released as an open</text><text x="976" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">leaderboard.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="700" text-anchor="start">The first unified framework to certify RL robustness at both the action and the cumulative-reward level.</text></svg>