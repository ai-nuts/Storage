<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">03 <tspan fill="#9AA4B2" font-weight="700">/ MOTIVATION</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">Hand-built modules don't generalize</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 -->
  <g id="cue_s03_c1_trouble_existing_geometric_models_th">
    <title>trouble existing geometric models largely built by hand designers craft specialized modules</title>
    <rect x="72" y="152" width="360" height="300" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <circle cx="108" cy="192" r="18" fill="#FDEEF3"/>
    <text x="108" y="198" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">01</text>
    <text x="140" y="198" font-size="21" font-weight="800" fill="#14213D">Built by hand</text>
    <text x="96" y="248" font-size="18" fill="#5B6472">Most geometric networks are</text>
    <text x="96" y="272" font-size="18" fill="#5B6472">designed heuristically, one</text>
    <text x="96" y="296" font-size="18" fill="#5B6472">specialized module at a time,</text>
    <text x="96" y="320" font-size="18" fill="#5B6472">rather than from general</text>
    <text x="96" y="344" font-size="18" fill="#5B6472">principles.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s03_c2_designers_craft_specialized_equivari">
    <title>designers craft specialized equivariant modules expensive scale constrained sacrifice expressive power complex architectures</title>
    <rect x="460" y="152" width="360" height="300" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <circle cx="496" cy="192" r="18" fill="#FDEEF3"/>
    <text x="496" y="198" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">02</text>
    <text x="528" y="198" font-size="21" font-weight="800" fill="#14213D">Scale vs. power</text>
    <text x="484" y="248" font-size="18" fill="#5B6472">Equivariant modules are either</text>
    <text x="484" y="272" font-size="18" fill="#5B6472">expensive to scale or so</text>
    <text x="484" y="296" font-size="18" fill="#5B6472">constrained they lose expressive</text>
    <text x="484" y="320" font-size="18" fill="#5B6472">power — inflating architecture</text>
    <text x="484" y="344" font-size="18" fill="#5B6472">complexity.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s03_c3_more_importantly_real_applications_i">
    <title>more importantly real applications demand single model both invariant equivariant prediction strong accuracy</title>
    <rect x="848" y="152" width="360" height="300" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <circle cx="884" cy="192" r="18" fill="#EAF2FB"/>
    <text x="884" y="198" font-size="16" font-weight="800" fill="#1C6DD0" text-anchor="middle">03</text>
    <text x="916" y="198" font-size="21" font-weight="800" fill="#14213D">One model, both</text>
    <text x="872" y="248" font-size="18" fill="#5B6472">Applications increasingly need</text>
    <text x="872" y="272" font-size="18" fill="#5B6472">strong <tspan font-weight="700" fill="#C81E5A">invariant</tspan> and <tspan font-weight="700" fill="#1C6DD0">equivariant</tspan></text>
    <text x="872" y="296" font-size="18" fill="#5B6472">prediction from the <tspan font-weight="700" fill="#14213D">same</tspan></text>
    <text x="872" y="320" font-size="18" fill="#5B6472">model, with high accuracy.</text>
  </g>

  <!-- c4 banner -->
  <g id="cue_s03_c4_clear_need_general_flexible_framewor">
    <title>clear need general flexible framework well-understood standard components rather one-off heuristic modules</title>
    <rect x="72" y="472" width="1136" height="132" rx="14" fill="#14213D"/>
    <text x="100" y="514" font-size="16" font-weight="800" letter-spacing="2" fill="#8FB6E6">THE NEED</text>
    <text x="100" y="550" font-size="22" font-weight="700" fill="#FFFFFF">A <tspan font-weight="800">general, flexible framework</tspan> built on well-understood, standard components —</text>
    <text x="100" y="580" font-size="22" font-weight="700" fill="#FFFFFF">instead of one-off, heuristic equivariant modules.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">03 / 10</text>
</svg>
