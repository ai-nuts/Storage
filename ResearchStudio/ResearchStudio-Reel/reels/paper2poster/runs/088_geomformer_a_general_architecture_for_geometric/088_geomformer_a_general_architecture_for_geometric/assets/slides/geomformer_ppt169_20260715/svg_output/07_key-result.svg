<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">07 <tspan fill="#9AA4B2" font-weight="700">/ KEY RESULT</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">State-of-the-art on both task types</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 OC20 -->
  <g id="cue_s07_c1_geomformer_delivers_strong_results_e">
    <title>GeoMFormer delivers strong results everywhere Open Catalyst energy prediction outperforms prior invariant models structure prediction excels equivariant</title>
    <rect x="72" y="152" width="360" height="300" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="96" y="190" font-size="14" font-weight="800" letter-spacing="1.5" fill="#5B6472">OPEN CATALYST 2020</text>
    <rect x="96" y="212" width="312" height="104" rx="10" fill="#FDEEF3"/>
    <text x="112" y="242" font-size="17" font-weight="800" fill="#C81E5A">Energy · IS2RE</text>
    <text x="112" y="270" font-size="16" fill="#14213D">Outperforms prior</text>
    <text x="112" y="292" font-size="16" fill="#14213D"><tspan font-weight="700">invariant</tspan> models.</text>
    <rect x="96" y="328" width="312" height="104" rx="10" fill="#EAF2FB"/>
    <text x="112" y="358" font-size="17" font-weight="800" fill="#1C6DD0">Structure · IS2RS</text>
    <text x="112" y="386" font-size="16" fill="#14213D">Excels at <tspan font-weight="700">equivariant</tspan></text>
    <text x="112" y="408" font-size="16" fill="#14213D">structure modeling.</text>
  </g>

  <!-- c2 PCQM4Mv2 -->
  <g id="cue_s07_c2_pcqm4mv2_benchmark_reaches_lowest_er">
    <title>PCQM4Mv2 benchmark reaches lowest error models quadratic complexity six point seven percent relative reduction previous best efficient scale</title>
    <rect x="460" y="152" width="360" height="300" rx="14" fill="#FFFFFF" stroke="#C81E5A" stroke-width="2"/>
    <text x="484" y="190" font-size="14" font-weight="800" letter-spacing="1.5" fill="#C81E5A">PCQM4Mv2 · HOMO–LUMO</text>
    <text x="484" y="288" font-size="82" font-weight="800" fill="#C81E5A">−6.7%</text>
    <text x="484" y="322" font-size="18" font-weight="700" fill="#14213D">relative error reduction</text>
    <text x="484" y="360" font-size="17" fill="#5B6472">Lowest error among all</text>
    <text x="484" y="384" font-size="17" fill="#5B6472">O(n²)-complexity models —</text>
    <text x="484" y="408" font-size="17" fill="#5B6472">and it still scales efficiently.</text>
  </g>

  <!-- c3 Molecule3D + N-body -->
  <g id="cue_s07_c3_molecule3d_improves_error_sixteen_po">
    <title>Molecule3D improves error sixteen point three percent random split eleven point six percent scaffold split N-body simulation cuts mean squared error thirty-three point eight percent</title>
    <rect x="848" y="152" width="360" height="300" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="872" y="190" font-size="14" font-weight="800" letter-spacing="1.5" fill="#5B6472">MORE BENCHMARKS</text>
    <rect x="872" y="212" width="312" height="104" rx="10" fill="#FDEEF3"/>
    <text x="888" y="242" font-size="17" font-weight="800" fill="#C81E5A">Molecule3D</text>
    <text x="888" y="278" font-size="30" font-weight="800" fill="#C81E5A">−16.3% <tspan font-size="18" fill="#8A5567">random</tspan></text>
    <text x="888" y="304" font-size="20" font-weight="800" fill="#C81E5A">−11.6% <tspan font-size="16" fill="#8A5567">scaffold</tspan></text>
    <rect x="872" y="328" width="312" height="104" rx="10" fill="#EAF2FB"/>
    <text x="888" y="358" font-size="17" font-weight="800" fill="#1C6DD0">N-body simulation</text>
    <text x="888" y="398" font-size="34" font-weight="800" fill="#1C6DD0">−33.8% <tspan font-size="17" fill="#4A6E96">MSE</tspan></text>
  </g>

  <!-- c4 banner -->
  <g id="cue_s07_c4_single_architecture_built_standard_t">
    <title>single architecture built standard Transformer parts achieves state-of-the-art performance both invariant equivariant tasks</title>
    <rect x="72" y="476" width="1136" height="128" rx="14" fill="#14213D"/>
    <text x="100" y="518" font-size="16" font-weight="800" letter-spacing="2" fill="#8FB6E6">ONE ARCHITECTURE</text>
    <text x="100" y="554" font-size="23" font-weight="700" fill="#FFFFFF">Built from <tspan font-weight="800">standard Transformer parts</tspan> — yet state-of-the-art on <tspan font-weight="800" fill="#F4B8CE">invariant</tspan></text>
    <text x="100" y="584" font-size="23" font-weight="700" fill="#FFFFFF">and <tspan font-weight="800" fill="#8FB6E6">equivariant</tspan> tasks alike.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">07 / 10</text>
</svg>
