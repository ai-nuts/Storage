<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">06 <tspan fill="#9AA4B2" font-weight="700">/ DATASET &amp; BENCHMARK</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">Stressing both invariant and equivariant ability</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 strip -->
  <g id="cue_s06_c1_authors_evaluate_geomformer_across_b">
    <title>authors evaluate GeoMFormer across broad suite tasks together stress both invariant equivariant abilities scalar vector prediction</title>
    <rect x="72" y="152" width="1136" height="76" rx="14" fill="#14213D"/>
    <text x="100" y="184" font-size="15" font-weight="800" letter-spacing="2" fill="#8FB6E6">A BROAD SUITE</text>
    <text x="100" y="212" font-size="21" font-weight="700" fill="#FFFFFF">One architecture judged on both <tspan font-weight="800" fill="#F4B8CE">scalar (invariant)</tspan> and <tspan font-weight="800" fill="#8FB6E6">vector (equivariant)</tspan> prediction.</text>
  </g>

  <!-- c2 OC20 -->
  <g id="cue_s06_c2_open_catalyst_2020_dataset_spanning">
    <title>Open Catalyst 2020 dataset spanning four hundred sixty thousand adsorbate-catalyst complexes IS2RE relaxed energy invariant IS2RS relaxed structure equivariant</title>
    <rect x="72" y="248" width="360" height="356" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="96" y="286" font-size="14" font-weight="800" letter-spacing="1.5" fill="#5B6472">CATALYSIS</text>
    <text x="96" y="318" font-size="24" font-weight="800" fill="#14213D">Open Catalyst 2020</text>
    <text x="96" y="366" font-size="46" font-weight="800" fill="#C81E5A">460,328</text>
    <text x="96" y="392" font-size="16" fill="#5B6472">adsorbate–catalyst complexes</text>
    <rect x="96" y="418" width="312" height="72" rx="10" fill="#FDEEF3"/>
    <text x="112" y="446" font-size="16" font-weight="800" fill="#C81E5A">IS2RE → Relaxed Energy</text>
    <text x="112" y="472" font-size="15" fill="#8A5567">invariant · scalar target</text>
    <rect x="96" y="500" width="312" height="72" rx="10" fill="#EAF2FB"/>
    <text x="112" y="528" font-size="16" font-weight="800" fill="#1C6DD0">IS2RS → Relaxed Structure</text>
    <text x="112" y="554" font-size="15" fill="#4A6E96">equivariant · vector target</text>
  </g>

  <!-- c3 quantum chemistry -->
  <g id="cue_s06_c3_large_quantum_chemistry_datasets_pcq">
    <title>large quantum chemistry datasets PCQM4Mv2 Molecule3D millions molecules predict HOMO-LUMO energy gap invariant</title>
    <rect x="460" y="248" width="360" height="356" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="484" y="286" font-size="14" font-weight="800" letter-spacing="1.5" fill="#5B6472">QUANTUM CHEMISTRY</text>
    <text x="484" y="318" font-size="24" font-weight="800" fill="#14213D">PCQM4Mv2 · Molecule3D</text>
    <text x="484" y="366" font-size="46" font-weight="800" fill="#C81E5A">millions</text>
    <text x="484" y="392" font-size="16" fill="#5B6472">of molecules (≈3.37M · ≈2.34M)</text>
    <rect x="484" y="418" width="312" height="72" rx="10" fill="#FDEEF3"/>
    <text x="500" y="446" font-size="16" font-weight="800" fill="#C81E5A">Predict HOMO–LUMO gap</text>
    <text x="500" y="472" font-size="15" fill="#8A5567">invariant · energy target</text>
    <text x="484" y="522" font-size="15" fill="#5B6472">Molecule3D uses random and</text>
    <text x="484" y="546" font-size="15" fill="#5B6472">scaffold splits for generalization.</text>
  </g>

  <!-- c4 dynamics -->
  <g id="cue_s06_c4_they_further_synthetic_five_particle">
    <title>they further synthetic five-particle N-body simulation equivariant position prediction MD17 force-field modeling ablation studies</title>
    <rect x="848" y="248" width="360" height="356" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="872" y="286" font-size="14" font-weight="800" letter-spacing="1.5" fill="#5B6472">DYNAMICS &amp; FORCES</text>
    <text x="872" y="318" font-size="24" font-weight="800" fill="#14213D">N-body · MD17</text>
    <text x="872" y="366" font-size="46" font-weight="800" fill="#1C6DD0">5-body</text>
    <text x="872" y="392" font-size="16" fill="#5B6472">synthetic particle simulation</text>
    <rect x="872" y="418" width="312" height="72" rx="10" fill="#EAF2FB"/>
    <text x="888" y="446" font-size="16" font-weight="800" fill="#1C6DD0">Position prediction</text>
    <text x="888" y="472" font-size="15" fill="#4A6E96">equivariant · vector target</text>
    <rect x="872" y="500" width="312" height="72" rx="10" fill="#EAF2FB"/>
    <text x="888" y="528" font-size="16" font-weight="800" fill="#1C6DD0">MD17 force fields</text>
    <text x="888" y="554" font-size="15" fill="#4A6E96">used in the ablation studies</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">06 / 10</text>
</svg>
