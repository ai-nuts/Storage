<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">10 <tspan fill="#9AA4B2" font-weight="700">/ TAKEAWAY</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">One general principle for geometric molecules</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 -->
  <g id="cue_s10_c1_lasting_message_work_you_not">
    <title>lasting message work you do not need bespoke heuristic modules model molecules under physical constraints</title>
    <rect x="72" y="152" width="812" height="120" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <circle cx="122" cy="212" r="22" fill="#FDEEF3"/>
    <text x="122" y="220" font-size="20" font-weight="800" fill="#C81E5A" text-anchor="middle">1</text>
    <text x="164" y="200" font-size="23" font-weight="800" fill="#14213D">No bespoke modules needed</text>
    <text x="164" y="234" font-size="18" fill="#5B6472">You don't need heuristic, hand-crafted modules to model molecules under</text>
    <text x="164" y="258" font-size="18" fill="#5B6472">physical constraints.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s10_c2_running_two_standard_transformer_str">
    <title>running two standard Transformer streams parallel invariant equivariant connecting simple cross-attention learns both once outperforms specialized architectures</title>
    <rect x="72" y="288" width="812" height="120" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <circle cx="122" cy="348" r="22" fill="#F3EDFC"/>
    <text x="122" y="356" font-size="20" font-weight="800" fill="#7C3AED" text-anchor="middle">2</text>
    <text x="164" y="336" font-size="23" font-weight="800" fill="#14213D">Two streams + cross-attention</text>
    <text x="164" y="370" font-size="18" fill="#5B6472">Two standard Transformer streams bridged by simple cross-attention learn both</text>
    <text x="164" y="394" font-size="18" fill="#5B6472">representations at once — and outperform specialized architectures.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s10_c3_because_many_earlier_models_special">
    <title>because many earlier models special cases framework GeoMFormer clean general scalable design principle geometric molecular representation learning</title>
    <rect x="72" y="424" width="812" height="120" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <circle cx="122" cy="484" r="22" fill="#EAF2FB"/>
    <text x="122" y="492" font-size="20" font-weight="800" fill="#1C6DD0" text-anchor="middle">3</text>
    <text x="164" y="472" font-size="23" font-weight="800" fill="#14213D">A unifying design principle</text>
    <text x="164" y="506" font-size="18" fill="#5B6472">Because prior models are special cases, GeoMFormer is a clean, general and</text>
    <text x="164" y="530" font-size="18" fill="#5B6472">scalable principle for geometric molecular representation learning.</text>
  </g>

  <!-- right closing panel -->
  <rect x="916" y="152" width="292" height="392" rx="16" fill="#0E1B33"/>
  <text x="940" y="212" font-size="34" font-weight="800" fill="url(#wordmark)">GeoMFormer</text>
  <text x="940" y="242" font-size="14" fill="#8FB6E6">ICML 2024</text>
  <line x1="940" y1="264" x2="1184" y2="264" stroke="#274063"/>
  <image href="data:image/png;base64," x="940" y="292" width="86" height="86"/>
  <text x="983" y="396" font-size="13" font-weight="600" fill="#C9D6E8" text-anchor="middle">Paper</text>
  <image href="data:image/png;base64," x="1064" y="292" width="86" height="86"/>
  <text x="1107" y="396" font-size="13" font-weight="600" fill="#C9D6E8" text-anchor="middle">Code</text>
  <text x="940" y="446" font-size="14" fill="#8FB6E6">arXiv:2406.16853</text>
  <text x="940" y="472" font-size="14" fill="#8FB6E6">github.com/c-tl/GeoMFormer</text>
  <text x="940" y="516" font-size="14" fill="#6E8AB0">Peking University ·</text>
  <text x="940" y="534" font-size="14" fill="#6E8AB0">Microsoft Research AI4Science</text>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">10 / 10</text>
</svg>
