<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">09 <tspan fill="#9AA4B2" font-weight="700">/ HEADLINE NUMBERS</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">The numbers that matter</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 PCQM4Mv2 -->
  <g id="cue_s09_c1_few_numbers_capture_impact_pcqm4mv2">
    <title>few numbers capture impact PCQM4Mv2 GeoMFormer validation error zero point zero seven three four best quadratic-complexity model six point seven percent relative reduction</title>
    <rect x="72" y="152" width="556" height="216" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="72" y="152" width="6" height="216" rx="3" fill="#C81E5A"/>
    <text x="104" y="192" font-size="15" font-weight="800" letter-spacing="1.5" fill="#5B6472">PCQM4Mv2 · VALIDATION MAE</text>
    <text x="104" y="272" font-size="72" font-weight="800" fill="#14213D">0.0734</text>
    <rect x="104" y="296" width="150" height="40" rx="8" fill="#FDEEF3"/>
    <text x="179" y="323" font-size="20" font-weight="800" fill="#C81E5A" text-anchor="middle">−6.7%</text>
    <text x="272" y="316" font-size="16" fill="#5B6472">best of any</text>
    <text x="272" y="336" font-size="16" fill="#5B6472">O(n²) model</text>
  </g>

  <!-- c2 N-body -->
  <g id="cue_s09_c2_n_body_simulation_achieves_mean_squa">
    <title>N-body simulation achieves mean squared error zero point zero zero four seven thirty-three point eight percent reduction previous best</title>
    <rect x="652" y="152" width="556" height="216" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="652" y="152" width="6" height="216" rx="3" fill="#1C6DD0"/>
    <text x="684" y="192" font-size="15" font-weight="800" letter-spacing="1.5" fill="#5B6472">N-BODY SIMULATION · MSE</text>
    <text x="684" y="272" font-size="72" font-weight="800" fill="#14213D">0.0047</text>
    <rect x="684" y="296" width="160" height="40" rx="8" fill="#EAF2FB"/>
    <text x="764" y="323" font-size="20" font-weight="800" fill="#1C6DD0" text-anchor="middle">−33.8%</text>
    <text x="862" y="316" font-size="16" fill="#5B6472">largest gain,</text>
    <text x="862" y="336" font-size="16" fill="#5B6472">vs previous best</text>
  </g>

  <!-- c3 Molecule3D -->
  <g id="cue_s09_c3_molecule3d_records_errors_zero_point">
    <title>Molecule3D records errors zero point zero two five two random split zero point one zero four five scaffold split improvements sixteen point three eleven point six percent</title>
    <rect x="72" y="388" width="556" height="216" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="72" y="388" width="6" height="216" rx="3" fill="#C81E5A"/>
    <text x="104" y="428" font-size="15" font-weight="800" letter-spacing="1.5" fill="#5B6472">MOLECULE3D · MAE</text>
    <text x="104" y="498" font-size="50" font-weight="800" fill="#14213D">0.0252 <tspan font-size="24" fill="#8A93A3">random</tspan></text>
    <text x="104" y="546" font-size="50" font-weight="800" fill="#14213D">0.1045 <tspan font-size="24" fill="#8A93A3">scaffold</tspan></text>
    <rect x="104" y="566" width="100" height="30" rx="7" fill="#FDEEF3"/>
    <text x="154" y="587" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">−16.3%</text>
    <rect x="216" y="566" width="100" height="30" rx="7" fill="#FDEEF3"/>
    <text x="266" y="587" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">−11.6%</text>
  </g>

  <!-- c4 ablation -->
  <g id="cue_s09_c4_ablations_adding_cross_attention_yie">
    <title>ablations adding cross-attention yields up to sixty point eight percent relative improvement force prediction central bridge</title>
    <rect x="652" y="388" width="556" height="216" rx="14" fill="#14213D"/>
    <rect x="652" y="388" width="6" height="216" rx="3" fill="#7C3AED"/>
    <text x="684" y="428" font-size="15" font-weight="800" letter-spacing="1.5" fill="#C6A8F5">CROSS-ATTENTION ABLATION</text>
    <text x="684" y="512" font-size="82" font-weight="800" fill="#FFFFFF">+60.8%</text>
    <text x="684" y="556" font-size="19" font-weight="700" fill="#FFFFFF">peak gain on MD17 force prediction</text>
    <text x="684" y="584" font-size="16" fill="#B9C4D6">underscoring how central the bridge is</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">09 / 10</text>
</svg>
