<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
    <marker id="mGray" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#8A93A3"/>
    </marker>
    <marker id="mInv" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#C81E5A"/>
    </marker>
    <marker id="mEqu" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#1C6DD0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">05 <tspan fill="#9AA4B2" font-weight="700">/ METHOD</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">Two parallel streams, bridged by cross-attention</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- diagram panel -->
  <rect x="72" y="150" width="712" height="470" rx="16" fill="#FBFCFE" stroke="#E2E8F0"/>
  <text x="96" y="180" font-size="15" font-weight="800" letter-spacing="1.5" fill="#5B6472">ONE GEOMFORMER BLOCK  (×L)</text>

  <!-- column headers / inputs (c1) -->
  <g id="cue_s05_c1_geomformer_keeps_two_representations">
    <title>GeoMFormer keeps two representations every atom invariant feature vector equivariant three-dimensional feature parallel streams</title>
    <rect x="112" y="196" width="290" height="58" rx="10" fill="#FDEEF3" stroke="#C81E5A"/>
    <text x="257" y="222" font-size="18" font-weight="800" fill="#C81E5A" text-anchor="middle">Zᴵ · Invariant stream</text>
    <text x="257" y="243" font-size="14" fill="#8A5567" text-anchor="middle">scalar feature per atom</text>
    <rect x="454" y="196" width="290" height="58" rx="10" fill="#EAF2FB" stroke="#1C6DD0"/>
    <text x="599" y="222" font-size="18" font-weight="800" fill="#1C6DD0" text-anchor="middle">Zᴱ · Equivariant stream</text>
    <text x="599" y="243" font-size="14" fill="#4A6E96" text-anchor="middle">3D vector feature per atom</text>
  </g>

  <!-- self-attn row -->
  <line x1="257" y1="254" x2="257" y2="282" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
  <line x1="599" y1="254" x2="599" y2="282" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
  <rect x="112" y="284" width="290" height="48" rx="10" fill="#FFFFFF" stroke="#C81E5A" stroke-width="1.5"/>
  <text x="257" y="314" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">Inv Self-Attention</text>
  <rect x="454" y="284" width="290" height="48" rx="10" fill="#FFFFFF" stroke="#1C6DD0" stroke-width="1.5"/>
  <text x="599" y="314" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">Equ Self-Attention</text>

  <!-- cross-attn row (c3, key innovation) -->
  <g id="cue_s05_c3_key_innovation_cross_attention_modul">
    <title>key innovation cross-attention module each stream query the other invariant attends equivariant vice versa fusing geometric information</title>
    <rect x="96" y="352" width="664" height="70" rx="12" fill="#F3EDFC" stroke="#7C3AED" stroke-dasharray="5 4"/>
    <line x1="257" y1="332" x2="257" y2="360" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
    <line x1="599" y1="332" x2="599" y2="360" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
    <rect x="112" y="366" width="290" height="42" rx="10" fill="#FFFFFF" stroke="#C81E5A" stroke-width="1.5"/>
    <text x="257" y="393" font-size="17" font-weight="800" fill="#C81E5A" text-anchor="middle">Inv ← Cross-Attention</text>
    <rect x="454" y="366" width="290" height="42" rx="10" fill="#FFFFFF" stroke="#1C6DD0" stroke-width="1.5"/>
    <text x="599" y="393" font-size="17" font-weight="800" fill="#1C6DD0" text-anchor="middle">Equ ← Cross-Attention</text>
    <!-- crossing exchange arrows -->
    <path d="M402,378 C424,378 432,396 452,396" fill="none" stroke="#1C6DD0" stroke-width="2" marker-end="url(#mEqu)"/>
    <path d="M452,382 C432,382 424,400 404,400" fill="none" stroke="#C81E5A" stroke-width="2" marker-end="url(#mInv)"/>
    <rect x="612" y="356" width="134" height="22" rx="6" fill="#7C3AED"/>
    <text x="679" y="372" font-size="12" font-weight="800" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">KEY INNOVATION</text>
  </g>

  <!-- FFN row (c4) -->
  <g id="cue_s05_c4_feed_forward_network_completes_block">
    <title>feed-forward network completes each block blocks stacked standard Transformer components many earlier geometric networks special cases</title>
    <line x1="257" y1="422" x2="257" y2="448" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
    <line x1="599" y1="422" x2="599" y2="448" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
    <rect x="112" y="450" width="290" height="46" rx="10" fill="#FFFFFF" stroke="#C81E5A" stroke-width="1.5"/>
    <text x="257" y="479" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">Inv-FFN</text>
    <rect x="454" y="450" width="290" height="46" rx="10" fill="#FFFFFF" stroke="#1C6DD0" stroke-width="1.5"/>
    <text x="599" y="479" font-size="18" font-weight="700" fill="#14213D" text-anchor="middle">Equ-FFN</text>
    <line x1="257" y1="496" x2="257" y2="524" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
    <line x1="599" y1="496" x2="599" y2="524" stroke="#8A93A3" stroke-width="1.6" marker-end="url(#mGray)"/>
    <text x="257" y="546" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">Zᴵ, l+1</text>
    <text x="599" y="546" font-size="16" font-weight="800" fill="#1C6DD0" text-anchor="middle">Zᴱ, l+1</text>
    <text x="428" y="600" font-size="14" fill="#8A93A3" text-anchor="middle">Self-Attn · Cross-Attn · FFN + residual — stacked ×L, all standard Transformer parts</text>
  </g>

  <!-- right column: formula (c2) -->
  <g id="cue_s05_c2_equivariant_stream_standard_attentio">
    <title>equivariant stream standard attention modified score summing dot products three-dimensional Query Key vectors provably preserves equivariance</title>
    <rect x="808" y="150" width="400" height="212" rx="16" fill="#0E1B33"/>
    <text x="832" y="186" font-size="15" font-weight="800" letter-spacing="1.5" fill="#8FB6E6">EQUIVARIANT ATTENTION SCORE</text>
    <text x="832" y="242" font-size="26" font-weight="800" fill="#FFFFFF">α</text>
    <text x="852" y="248" font-size="16" font-weight="700" fill="#FFFFFF">ij</text>
    <text x="874" y="242" font-size="24" font-weight="700" fill="#FFFFFF">=  Σₖ  ⟨ Qᴱ</text>
    <text x="1006" y="248" font-size="15" fill="#8FB6E6">i,·,k</text>
    <text x="1044" y="242" font-size="24" font-weight="700" fill="#FFFFFF">, Kᴱ</text>
    <text x="1092" y="248" font-size="15" fill="#8FB6E6">j,·,k</text>
    <text x="1128" y="242" font-size="24" font-weight="700" fill="#FFFFFF">⟩</text>
    <text x="832" y="292" font-size="17" fill="#C9D6E8">Score sums dot products over the 3D</text>
    <text x="832" y="316" font-size="17" fill="#C9D6E8">Query / Key vectors — this <tspan font-weight="800" fill="#FFFFFF">provably</tspan></text>
    <text x="832" y="340" font-size="17" fill="#C9D6E8"><tspan font-weight="800" fill="#FFFFFF">preserves equivariance</tspan>.</text>
  </g>

  <!-- right column: generality note (part of c4 concept) -->
  <rect x="808" y="380" width="400" height="240" rx="16" fill="#F4F6FA" stroke="#E2E8F0"/>
  <text x="832" y="416" font-size="15" font-weight="800" letter-spacing="1.5" fill="#5B6472">WHY IT MATTERS</text>
  <text x="832" y="454" font-size="19" font-weight="700" fill="#14213D">Only standard components</text>
  <text x="832" y="484" font-size="17" fill="#5B6472">Self-attention, cross-attention, FFN,</text>
  <text x="832" y="508" font-size="17" fill="#5B6472">and layer-norm — nothing bespoke.</text>
  <line x1="832" y1="528" x2="1184" y2="528" stroke="#E2E8F0"/>
  <text x="832" y="562" font-size="19" font-weight="700" fill="#14213D">Prior nets fall out as</text>
  <text x="832" y="588" font-size="19" font-weight="700" fill="#14213D">special cases</text>
  <text x="832" y="612" font-size="15" fill="#8A93A3">of this single framework.</text>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">05 / 10</text>
</svg>
