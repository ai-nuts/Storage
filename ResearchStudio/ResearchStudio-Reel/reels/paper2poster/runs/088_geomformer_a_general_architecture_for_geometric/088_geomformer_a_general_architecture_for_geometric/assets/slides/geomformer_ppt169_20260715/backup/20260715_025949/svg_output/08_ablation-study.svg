<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">08 <tspan fill="#9AA4B2" font-weight="700">/ ABLATION STUDY</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">Cross-attention is the heart of the design</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 insight banner -->
  <g id="cue_s08_c1_understand_where_gains_come_authors">
    <title>understand where gains come authors ablate each building block cross-attention modules bridge invariant equivariant streams removing them hurts sharply</title>
    <rect x="72" y="152" width="1136" height="64" rx="12" fill="#F3EDFC" stroke="#7C3AED"/>
    <text x="100" y="180" font-size="15" font-weight="800" letter-spacing="1.5" fill="#7C3AED">ABLATING EACH BLOCK</text>
    <text x="100" y="203" font-size="19" font-weight="700" fill="#14213D">Removing the <tspan font-weight="800" fill="#7C3AED">cross-attention</tspan> bridge hurts sharply — relative improvement when each module is added:</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="828" y="232" width="14" height="14" rx="3" fill="#C81E5A"/><text x="848" y="244" font-size="14" fill="#5B6472">Inv Cross-Attn</text>
    <rect x="968" y="232" width="14" height="14" rx="3" fill="#1C6DD0"/><text x="988" y="244" font-size="14" fill="#5B6472">Equ Cross-Attn</text>
    <rect x="1108" y="232" width="14" height="14" rx="3" fill="#7C3AED"/><text x="1128" y="244" font-size="14" fill="#5B6472">Both</text>
  </g>

  <!-- card c2: MD17 energy -->
  <g id="cue_s08_c2_md17_energy_prediction_task_adding">
    <title>MD17 energy prediction task adding invariant cross-attention eighteen point seven percent equivariant cross-attention nine point eight percent both twenty point eight percent</title>
    <rect x="72" y="264" width="360" height="356" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="96" y="300" font-size="20" font-weight="800" fill="#14213D">MD17 · Energy</text>
    <text x="96" y="322" font-size="14" fill="#8A93A3">relative improvement</text>
    <line x1="96" y1="560" x2="408" y2="560" stroke="#E2E8F0"/>
    <rect x="122" y="510" width="56" height="50" rx="4" fill="#C81E5A"/>
    <text x="150" y="500" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">18.7%</text>
    <rect x="222" y="533" width="56" height="27" rx="4" fill="#1C6DD0"/>
    <text x="250" y="523" font-size="16" font-weight="800" fill="#1C6DD0" text-anchor="middle">9.8%</text>
    <rect x="322" y="504" width="56" height="56" rx="4" fill="#7C3AED"/>
    <text x="350" y="494" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="middle">20.8%</text>
    <text x="150" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Inv</text>
    <text x="250" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Equ</text>
    <text x="350" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Both</text>
  </g>

  <!-- card c3: MD17 force (highlight) -->
  <g id="cue_s08_c3_harder_md17_force_prediction_task">
    <title>harder MD17 force prediction task effect even larger sixty point eight percent relative improvement both cross-attention modules used</title>
    <rect x="460" y="264" width="360" height="356" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="484" y="300" font-size="20" font-weight="800" fill="#14213D">MD17 · Force</text>
    <text x="484" y="322" font-size="14" fill="#8A93A3">the effect is even larger</text>
    <line x1="484" y1="560" x2="796" y2="560" stroke="#E2E8F0"/>
    <rect x="510" y="484" width="56" height="76" rx="4" fill="#C81E5A"/>
    <text x="538" y="474" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">28.0%</text>
    <rect x="610" y="441" width="56" height="119" rx="4" fill="#1C6DD0"/>
    <text x="638" y="431" font-size="16" font-weight="800" fill="#1C6DD0" text-anchor="middle">43.9%</text>
    <rect x="710" y="396" width="56" height="164" rx="4" fill="#7C3AED"/>
    <text x="738" y="386" font-size="18" font-weight="800" fill="#7C3AED" text-anchor="middle">60.8%</text>
    <text x="538" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Inv</text>
    <text x="638" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Equ</text>
    <text x="738" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Both</text>
  </g>

  <!-- card c4: N-body -->
  <g id="cue_s08_c4_n_body_simulation_combined_improveme">
    <title>N-body simulation combined improvement seventeen point five percent self-attention feed-forward layer-normalization modules each contribute cross-attention bridge heart</title>
    <rect x="848" y="264" width="360" height="356" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <text x="872" y="300" font-size="20" font-weight="800" fill="#14213D">N-body</text>
    <text x="872" y="322" font-size="14" fill="#8A93A3">combined improvement</text>
    <line x1="872" y1="560" x2="1184" y2="560" stroke="#E2E8F0"/>
    <rect x="898" y="539" width="56" height="21" rx="4" fill="#C81E5A"/>
    <text x="926" y="529" font-size="16" font-weight="800" fill="#C81E5A" text-anchor="middle">7.8%</text>
    <rect x="998" y="525" width="56" height="35" rx="4" fill="#1C6DD0"/>
    <text x="1026" y="515" font-size="16" font-weight="800" fill="#1C6DD0" text-anchor="middle">13.0%</text>
    <rect x="1098" y="513" width="56" height="47" rx="4" fill="#7C3AED"/>
    <text x="1126" y="503" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="middle">17.5%</text>
    <text x="926" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Inv</text>
    <text x="1026" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Equ</text>
    <text x="1126" y="582" font-size="13" fill="#5B6472" text-anchor="middle">Both</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024 — self-attn, FFN and layer-norm also contribute; the cross-attention bridge dominates.</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">08 / 10</text>
</svg>
