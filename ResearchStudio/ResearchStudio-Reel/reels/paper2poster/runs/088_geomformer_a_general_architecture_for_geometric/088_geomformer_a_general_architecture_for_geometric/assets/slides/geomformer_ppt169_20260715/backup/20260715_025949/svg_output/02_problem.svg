<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <!-- header -->
  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">02 <tspan fill="#9AA4B2" font-weight="700">/ PROBLEM</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">Strict physical constraints, no unified solution</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1: DL for molecular science -->
  <g id="cue_s02_c1_deep_learning_become_powerful_tool">
    <title>deep learning powerful tool molecular science predicting properties three-dimensional coordinates simulating atoms move</title>
    <rect x="72" y="152" width="544" height="158" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="72" y="152" width="6" height="158" rx="3" fill="#14213D"/>
    <text x="100" y="192" font-size="21" font-weight="800" fill="#14213D">Deep learning for molecular science</text>
    <text x="100" y="228" font-size="18" fill="#5B6472">Predicts molecular properties directly from</text>
    <text x="100" y="252" font-size="18" fill="#5B6472">3D atomic coordinates, and simulates how</text>
    <text x="100" y="276" font-size="18" fill="#5B6472">atoms move over time.</text>
  </g>

  <!-- c2: physical constraints -->
  <g id="cue_s02_c2_but_these_tasks_impose_strict">
    <title>but these tasks impose strict physical constraints prediction transform correctly rotated translated coordinate system</title>
    <rect x="664" y="152" width="544" height="158" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="664" y="152" width="6" height="158" rx="3" fill="#C81E5A"/>
    <text x="692" y="192" font-size="21" font-weight="800" fill="#14213D">Predictions must obey symmetry</text>
    <text x="692" y="228" font-size="18" fill="#5B6472">When the coordinate frame is rotated or</text>
    <text x="692" y="252" font-size="18" fill="#5B6472">translated, the model output must transform</text>
    <text x="692" y="276" font-size="18" fill="#5B6472">in the physically correct way.</text>
  </g>

  <!-- c3: definition strip -->
  <g id="cue_s02_c3_prediction_must_transform_correctly">
    <title>prediction transform correctly coordinate rotated translated invariance scalar quantities equivariance vector quantities</title>
    <rect x="72" y="328" width="1136" height="150" rx="14" fill="#F4F6FA" stroke="#E2E8F0"/>
    <rect x="96" y="352" width="536" height="102" rx="10" fill="#FDEEF3" stroke="#C81E5A"/>
    <text x="120" y="388" font-size="20" font-weight="800" fill="#C81E5A">Invariance</text>
    <text x="120" y="416" font-size="17" fill="#14213D">Scalar outputs (e.g. energy) stay</text>
    <text x="120" y="438" font-size="17" fill="#14213D"><tspan font-weight="700">unchanged</tspan> under rotation / translation.</text>
    <rect x="648" y="352" width="536" height="102" rx="10" fill="#EAF2FB" stroke="#1C6DD0"/>
    <text x="672" y="388" font-size="20" font-weight="800" fill="#1C6DD0">Equivariance</text>
    <text x="672" y="416" font-size="17" fill="#14213D">Vector outputs (e.g. positions, forces)</text>
    <text x="672" y="438" font-size="17" fill="#14213D"><tspan font-weight="700">transform with</tspan> the input frame.</text>
  </g>

  <!-- c4: gap -->
  <g id="cue_s02_c4_existing_methods_handle_these_constr">
    <title>existing methods handle constraints heuristic costly modules few general framework both invariant equivariant same time</title>
    <rect x="72" y="496" width="1136" height="110" rx="14" fill="#14213D"/>
    <text x="100" y="540" font-size="16" font-weight="800" letter-spacing="2" fill="#F4B8CE">THE GAP</text>
    <text x="100" y="574" font-size="21" font-weight="600" fill="#FFFFFF">Existing methods rely on <tspan font-weight="800" fill="#FFFFFF">heuristic, costly modules</tspan> — few learn both invariant</text>
    <text x="100" y="600" font-size="21" font-weight="600" fill="#FFFFFF">and equivariant representations well within a single general framework.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">02 / 10</text>
</svg>
