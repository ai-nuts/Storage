<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C81E5A"/>
      <stop offset="1" stop-color="#1C6DD0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentBar)"/>

  <text x="72" y="64" font-size="16" font-weight="800" letter-spacing="3" fill="#C81E5A">04 <tspan fill="#9AA4B2" font-weight="700">/ CONTRIBUTION</tspan></text>
  <text x="72" y="104" font-size="36" font-weight="800" fill="#14213D">Three contributions, one architecture</text>
  <line x1="72" y1="124" x2="1208" y2="124" stroke="#E2E8F0"/>

  <!-- c1 summary tile -->
  <g id="cue_s04_c1_makes_three_main_contributions">
    <title>paper makes three main contributions GeoMFormer novel Transformer-based molecular model</title>
    <rect x="72" y="152" width="300" height="452" rx="16" fill="url(#tileGrad)"/>
    <text x="98" y="300" font-size="150" font-weight="800" fill="#FFFFFF">3</text>
    <text x="100" y="352" font-size="30" font-weight="800" fill="#FFFFFF">Contributions</text>
    <text x="100" y="392" font-size="18" fill="#FBE4EC">A single, general design —</text>
    <text x="100" y="416" font-size="18" fill="#FBE4EC">standard Transformer parts,</text>
    <text x="100" y="440" font-size="18" fill="#FBE4EC">two representation streams,</text>
    <text x="100" y="464" font-size="18" fill="#FBE4EC">bridged by cross-attention.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s04_c2_first_introduces_geomformer_novel_tr">
    <title>first introduces GeoMFormer novel Transformer-based model two separate streams invariant equivariant standard building blocks</title>
    <rect x="400" y="152" width="808" height="140" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="400" y="152" width="6" height="140" rx="3" fill="#C81E5A"/>
    <text x="432" y="196" font-size="15" font-weight="800" letter-spacing="1.5" fill="#C81E5A">01 · MODEL</text>
    <text x="432" y="230" font-size="23" font-weight="800" fill="#14213D">Two-stream Transformer</text>
    <text x="432" y="262" font-size="18" fill="#5B6472">Maintains separate <tspan font-weight="700" fill="#C81E5A">invariant</tspan> and <tspan font-weight="700" fill="#1C6DD0">equivariant</tspan> streams using only standard Transformer blocks.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s04_c3_second_designs_cross_attention_modul">
    <title>second designs cross-attention modules bridge two streams draw contextual information each other enhance geometric modeling</title>
    <rect x="400" y="308" width="808" height="140" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="400" y="308" width="6" height="140" rx="3" fill="#7C3AED"/>
    <text x="432" y="352" font-size="15" font-weight="800" letter-spacing="1.5" fill="#7C3AED">02 · BRIDGE</text>
    <text x="432" y="386" font-size="23" font-weight="800" fill="#14213D">Cross-attention modules</text>
    <text x="432" y="418" font-size="18" fill="#5B6472">Bridge the two streams so each draws contextual information from the other.</text>
  </g>

  <!-- c4 -->
  <g id="cue_s04_c4_third_shows_framework_general_enough">
    <title>third shows framework general enough many previously proposed architectures special instantiations strong empirical results diverse tasks</title>
    <rect x="400" y="464" width="808" height="140" rx="14" fill="#FBFCFE" stroke="#E2E8F0"/>
    <rect x="400" y="464" width="6" height="140" rx="3" fill="#1C6DD0"/>
    <text x="432" y="508" font-size="15" font-weight="800" letter-spacing="1.5" fill="#1C6DD0">03 · GENERALITY</text>
    <text x="432" y="542" font-size="23" font-weight="800" fill="#14213D">Prior models as special cases</text>
    <text x="432" y="574" font-size="18" fill="#5B6472">Many earlier architectures are instances of it — backed by strong results across tasks.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#9AA4B2">GeoMFormer · ICML 2024</text>
  <text x="1208" y="700" font-size="13" fill="#9AA4B2" text-anchor="end">04 / 10</text>
</svg>
