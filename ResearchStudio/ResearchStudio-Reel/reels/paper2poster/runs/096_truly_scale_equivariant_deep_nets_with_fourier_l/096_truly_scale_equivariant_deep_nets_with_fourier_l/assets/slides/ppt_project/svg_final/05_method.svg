<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One frequency rule, every layer redesigned</text><g id="cue_s05_c1_method_starts_precise_definition_dow"><title>method starts precise definition down-scaling ideal downsampling which first applies</title><rect x="64" y="158" width="568" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="190" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Ideal downsampling</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">First an ideal low-pass filter zeros every frequency above</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the new Nyquist limit, then subsample.</text><rect x="92" y="282" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="310" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="middle">D_R(x) = Sub_R( h * x )</text></g><g id="cue_s05_c2_authors_derive_their_central_conditi"><title>authors derive their central condition claim 1 deep net truly</title><rect x="648" y="158" width="568" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="190" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">Claim 1  ·  the equivariance condition</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Truly scale-equivariant iff every output frequency depends</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">only on equal-or-lower input frequencies.</text><rect x="676" y="282" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="310" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="middle">Y[k] = G_k( X[-k : k] )   for all k</text></g><g id="cue_s05_c3_they_redesign_network_component_sati"><title>they redesign network component satisfy rule spatially-local fourier layer constrains</title><rect x="64" y="360" width="568" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="360" width="6" height="190" rx="6" fill="#F2C14E"/><text x="92" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Every module obeys the rule</text><rect x="92" y="424" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="441" r="5" fill="#4C9BE8"/><text x="126" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Spatially-local Fourier conv</text><rect x="92" y="470" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="487" r="5" fill="#34D3C0"/><text x="126" y="493" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Frequency-band ReLU non-linearity</text><rect x="92" y="516" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="533" r="5" fill="#F2C14E"/><text x="126" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Fourier pooling (same dependency)</text></g><g id="cue_s05_c4_top_equivariant_feature_extractor_th"><title>top equivariant feature extractor they add classifier predicts once per</title><rect x="648" y="360" width="568" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="360" width="6" height="190" rx="6" fill="#F2685C"/><text x="676" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Per-scale classifier + consistency loss</text><text x="676" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">One MLP shared across scales via Fourier padding; a hinge</text><text x="676" y="449" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">loss penalizes a high-res prediction that is worse than its</text><text x="676" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">low-res one.</text><rect x="676" y="492" width="512" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="518" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">sum  max( L(y[k]) - L(y[k-1]), 0 )</text></g></svg>