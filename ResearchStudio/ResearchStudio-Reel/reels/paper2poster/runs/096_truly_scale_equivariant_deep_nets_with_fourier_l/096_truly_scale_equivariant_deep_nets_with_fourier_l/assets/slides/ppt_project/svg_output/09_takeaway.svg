<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Get the signal processing right</text><g id="cue_s09_c1_lasting_takeaway_scale_equivariance"><title>lasting takeaway scale-equivariance should treated signal-processing problem</title><rect x="64" y="170" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="170" width="6" height="116" rx="6" fill="#4C9BE8"/><circle cx="112" cy="228" r="10" fill="#4C9BE8"/><text x="150" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Reframe the problem</text><text x="150" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Treat scale-equivariance as a signal-processing problem — down-scaling is ideal,</text><text x="150" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">anti-aliased downsampling of a discrete signal.</text></g><g id="cue_s09_c2_once_you_formulate_down_scaling_idea"><title>once you formulate down-scaling ideal anti-aliased downsampling require every output</title><rect x="64" y="306" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="306" width="6" height="116" rx="6" fill="#34D3C0"/><circle cx="112" cy="364" r="10" fill="#34D3C0"/><text x="150" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Provably zero error</text><text x="150" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Require every output frequency to depend only on equal-or-lower input frequencies, and</text><text x="150" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Fourier layers become exactly scale-equivariant — zero error, not a small residual.</text></g><g id="cue_s09_c3_theoretical_guarantee_comes_practica"><title>theoretical guarantee comes practical cost matches beats prior scale-equivariant cnns</title><rect x="64" y="442" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="442" width="6" height="116" rx="6" fill="#48C78E"/><circle cx="112" cy="500" r="10" fill="#48C78E"/><text x="150" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">No practical cost</text><text x="150" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The guarantee is free: the model matches or beats prior scale-equivariant CNNs on</text><text x="150" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">accuracy and is more data-efficient, especially on natural images.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">Truly Scale-Equivariant Deep Nets with Fourier Layers</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">NeurIPS 2023  ·  arXiv:2311.02922  ·  github.com/ashiq24/Scale_Equivarinat_Fourier_Layer</text></svg>