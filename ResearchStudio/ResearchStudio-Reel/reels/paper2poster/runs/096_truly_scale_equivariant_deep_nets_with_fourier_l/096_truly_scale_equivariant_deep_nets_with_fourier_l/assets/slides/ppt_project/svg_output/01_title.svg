<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">NEURIPS 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Purdue University</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="168" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">Truly Scale-Equivariant Deep Nets</text><text x="64" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#4C9BE8" font-weight="800" text-anchor="start">with Fourier Layers</text><text x="64" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9DB3C8" font-weight="500" text-anchor="start">Md Ashiqur Rahman   ·   Raymond A. Yeh      —   Dept. of Computer Science, Purdue University</text><g id="cue_s01_c1_computer_vision_models_should_adapt"><title>computer vision models should adapt gracefully when image resolution changes</title><rect x="64" y="310" width="368" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="310" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="92" cy="354" r="7" fill="#4C9BE8"/><text x="112" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">Scale-Equivariance</text><text x="88" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Resize an object and the network's</text><text x="88" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">features transform consistently while its</text><text x="88" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">label stays the same.</text></g><g id="cue_s01_c2_purdue_university_points_out_existin"><title>purdue university points out existing scale-equivariant cnns not truly scale-equivariant</title><rect x="452" y="310" width="368" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="452" y="310" width="368" height="6" rx="6" fill="#F2685C"/><circle cx="480" cy="354" r="7" fill="#F2685C"/><text x="500" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">The gap</text><text x="476" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Prior scale-equivariant CNNs are only</text><text x="476" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">approximately equivariant: derived in the</text><text x="476" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">continuous domain, blind to anti-aliasing.</text></g><g id="cue_s01_c3_authors_instead_formulate_down_scali"><title>authors instead formulate down-scaling directly discrete domain anti-aliasing build new</title><rect x="840" y="310" width="368" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="840" y="310" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="868" cy="354" r="7" fill="#34D3C0"/><text x="888" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">This work</text><text x="864" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Formulate down-scaling in the discrete</text><text x="864" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">domain with anti-aliasing, via Fourier</text><text x="864" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">layers → absolute zero equivariance error.</text></g><line x1="64" y1="548" x2="1216" y2="548" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">Zero equivariance error — in theory and in practice — while staying competitive on classification accuracy.</text><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2311.02922</text><text x="300" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/ashiq24/Scale_Equivarinat_Fourier_Layer</text></svg>