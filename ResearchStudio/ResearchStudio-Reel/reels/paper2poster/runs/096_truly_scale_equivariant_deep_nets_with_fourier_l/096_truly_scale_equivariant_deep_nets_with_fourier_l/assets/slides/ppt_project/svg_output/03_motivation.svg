<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Down-scaling is a signal-processing problem</text><g id="cue_s03_c1_key_insight_down_scaling_discrete_si"><title>key insight down-scaling discrete signal fundamentally signal-processing operation</title><rect x="64" y="158" width="1152" height="84" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="84" rx="6" fill="#34D3C0"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1.5">Key insight</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">Down-scaling a discrete signal is fundamentally a signal-processing operation — not a continuous re-parameterization.</text></g><g id="cue_s03_c2_nyquist_sampling_theorem_tells_befor"><title>nyquist sampling theorem tells before subsampling must apply anti-aliasing filter</title><rect x="64" y="258" width="560" height="292" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><text x="92" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Nyquist: filter before you subsample</text><line x1="104" y1="470" x2="584" y2="470" stroke="#9DB3C8" stroke-width="2" stroke-linecap="round"/><text x="584" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="end">freq</text><polygon points="104,470 104,342 114,343 124,343 134,345 144,346 154,348 164,350 174,353 184,356 194,360 204,363 214,367 224,371 234,375 244,380 254,384 264,389 274,393 284,397 294,402 304,406 314,410 324,414 334,418 344,422 354,426 364,429 374,432 384,435 394,438 404,441 414,443 424,445 434,447 444,449 454,451 464,452 474,453 484,455 494,456 504,457 514,457 524,458 534,459 544,459 554,460 564,460 574,461 584,461 584,470" fill="#4C9BE8" opacity="0.35"/><polyline points="104,342 114,343 124,343 134,345 144,346 154,348 164,350 174,353 184,356 194,360 204,363 214,367 224,371 234,375 244,380 254,384 264,389 274,393 284,397 294,402 304,406 314,410 324,414 334,418 344,422 354,426 364,429 374,432 384,435 394,438 404,441 414,443 424,445 434,447 444,449 454,451 464,452 474,453 484,455 494,456 504,457 514,457 524,458 534,459 544,459 554,460 564,460 574,461 584,461" fill="none" stroke="#4C9BE8" stroke-width="2"/><line x1="364" y1="330" x2="364" y2="470" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="364" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="700" text-anchor="middle">Nyquist limit</text><rect x="364" y="332" width="220" height="138" rx="0" fill="#F2685C" opacity="0.10"/><text x="474" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2685C" font-weight="700" text-anchor="middle">zeroed by</text><text x="474" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2685C" font-weight="700" text-anchor="middle">low-pass</text><text x="92" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Skip the filter and high frequencies fold into low ones —</text><text x="92" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">aliasing (the wagon-wheel effect).</text></g><g id="cue_s03_c3_prior_scale_equivariant_networks_bec"><title>prior scale-equivariant networks because they formulated continuous domain simply had</title><rect x="648" y="258" width="568" height="138" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="648" y="258" width="6" height="138" rx="6" fill="#F2685C"/><text x="676" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Why prior methods have no filter</text><text x="676" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Formulated in the continuous domain, prior scale-equivariant</text><text x="676" y="351" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">networks simply have no place to put an anti-aliasing</text><text x="676" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">filter.</text></g><g id="cue_s03_c4_authors_argue_truly_scale_equivarian"><title>authors argue truly scale-equivariant you must formulate down-scaling directly discrete</title><rect x="648" y="412" width="568" height="138" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="648" y="412" width="6" height="138" rx="6" fill="#34D3C0"/><text x="676" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The fix</text><text x="676" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">To be truly scale-equivariant, formulate down-scaling</text><text x="676" y="505" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">directly in the discrete domain, with anti-aliasing built in</text><text x="676" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">from the start.</text></g></svg>