<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two standard scale benchmarks</text><g id="cue_s06_c1_authors_follow_prior_work_evaluate"><title>authors follow prior work evaluate two benchmarks</title><rect x="64" y="158" width="1152" height="60" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="60" rx="6" fill="#4C9BE8"/><text x="92" y="195" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Following prior work, the model is evaluated on two benchmarks built by randomly downsampling images across scales.</text></g><g id="cue_s06_c2_mnist_scale_built_randomly_downsampl"><title>mnist-scale built randomly downsampling mnist digits every resolution eight-by-eight twenty-eight-by-twenty-eight</title><rect x="64" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#4C9BE8" font-weight="800" text-anchor="start">MNIST-scale</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Randomly downsampled MNIST digits, with every resolution</text><text x="92" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">equally represented.</text><rect x="92" y="352" width="150" height="26" rx="13" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="108" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">8×8</text><text x="150" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="700" text-anchor="start">→</text><text x="174" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">28×28</text><text x="262" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">resolutions</text></g><g id="cue_s06_c3_stl10_scale_applies_same_constructio"><title>stl10-scale applies same construction natural color images spanning resolutions forty-eight</title><rect x="656" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="240" width="6" height="150" rx="6" fill="#34D3C0"/><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#34D3C0" font-weight="800" text-anchor="start">STL10-scale</text><text x="684" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The same construction applied to natural color images.</text><rect x="684" y="352" width="150" height="26" rx="13" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="700" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">48</text><text x="742" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="700" text-anchor="start">→</text><text x="766" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">97</text><text x="854" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">resolutions</text></g><g id="cue_s06_c4_they_study_performance_under_ideal"><title>they study performance under ideal downsampling where theory exactly matches</title><rect x="64" y="410" width="1152" height="140" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="410" width="6" height="140" rx="6" fill="#F2C14E"/><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Four evaluation settings</text><rect x="92" y="470" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="470" width="5" height="58" rx="2" fill="#4C9BE8"/><text x="112" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Ideal downsampling</text><text x="112" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">theory = practice</text><rect x="376" y="470" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="376" y="470" width="5" height="58" rx="2" fill="#34D3C0"/><text x="396" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Unseen scales</text><text x="396" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">generalization</text><rect x="660" y="470" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="660" y="470" width="5" height="58" rx="2" fill="#F2C14E"/><text x="680" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Data efficiency</text><text x="680" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">5k · 2.5k · 1k samples</text><rect x="944" y="470" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="944" y="470" width="5" height="58" rx="2" fill="#F2685C"/><text x="964" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Non-ideal downsampling</text><text x="964" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">imperfect filter</text></g></svg>