<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three contributions</text><g id="cue_s04_c1_makes_three_contributions"><title>makes three contributions</title><rect x="64" y="158" width="1152" height="66" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="66" rx="6" fill="#4C9BE8"/><text x="92" y="199" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">A new formulation, a new family of layers, and experiments that prove exact scale-equivariance at no accuracy cost.</text></g><g id="cue_s04_c2_first_formulates_down_scaling_operat"><title>first formulates down-scaling operation directly discrete domain ideal downsampling properly</title><rect x="64" y="250" width="368" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="250" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="318" r="27" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Discrete-domain</text><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">down-scaling</text><text x="92" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Define down-scaling as ideal</text><text x="92" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">downsampling — an ideal low-pass</text><text x="92" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">(anti-aliasing) filter, then subsampling</text><text x="92" y="519" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">— directly in the discrete domain.</text></g><g id="cue_s04_c3_second_proposes_whole_family_deep"><title>second proposes whole family deep nets truly scale-equivariant rethinking every</title><rect x="456" y="250" width="368" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="250" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="508" cy="318" r="27" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="508" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="484" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A family of Fourier</text><text x="484" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">layers</text><text x="484" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Rethink every component — convolution,</text><text x="484" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">non-linearity, pooling — as Fourier</text><text x="484" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">layers obeying one simple</text><text x="484" y="519" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">frequency-dependency rule.</text></g><g id="cue_s04_c4_third_through_extensive_experiments"><title>third through extensive experiments mnist-scale stl-10 shows attains absolute zero</title><rect x="848" y="250" width="368" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="250" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="318" r="27" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Zero error,</text><text x="876" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">competitive accuracy</text><text x="876" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">On MNIST-scale and STL-10: absolute zero</text><text x="876" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">end-to-end equivariance error,</text><text x="876" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">competitive accuracy, and better data</text><text x="876" y="519" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">efficiency.</text></g></svg>