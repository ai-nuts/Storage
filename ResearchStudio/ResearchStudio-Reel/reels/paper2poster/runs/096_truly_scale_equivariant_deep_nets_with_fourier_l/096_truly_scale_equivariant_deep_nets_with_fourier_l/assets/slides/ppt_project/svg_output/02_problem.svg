<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Approximately equivariant, not truly so</text><g id="cue_s02_c1_scale_equivariance_means_when_object"><title>scale-equivariance means when object image resized network features should transform</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="404" height="6" rx="6" fill="#4C9BE8"/><text x="92" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">What is scale-equivariance?</text><text x="92" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="400" text-anchor="start">When an object in an image is resized,</text><text x="92" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="400" text-anchor="start">the network's features should transform</text><text x="92" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="400" text-anchor="start">consistently — and its predicted label</text><text x="92" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="400" text-anchor="start">should not change.</text><rect x="92" y="352" width="120" height="120" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="152" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="54" fill="#4C9BE8" font-weight="800" text-anchor="middle">8</text><text x="230" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">resize</text><line x1="224" y1="404" x2="320" y2="404" stroke="#4C9BE8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="320" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#4C9BE8" font-weight="800" text-anchor="start">→</text><rect x="336" y="376" width="72" height="72" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="372" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#4C9BE8" font-weight="800" text-anchor="middle">8</text><text x="92" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="700" text-anchor="start">features transform consistently  ·  label stays “8”</text></g><g id="cue_s02_c2_recent_scale_equivariant_convolution"><title>recent scale-equivariant convolutional networks pursue through weight-sharing kernel resizing same</title><rect x="500" y="158" width="716" height="108" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">1  ·  How prior scale-equivariant CNNs work</text><text x="528" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">They share weights and resize the same kernel across scales — one</text><text x="528" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">kernel, re-scaled for every resolution.</text></g><g id="cue_s02_c3_trouble_these_methods_derived_contin"><title>trouble these methods derived continuous domain discretized when implemented</title><rect x="500" y="278" width="716" height="108" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><text x="528" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">2  ·  Where it breaks</text><text x="528" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">The resizing is derived in the continuous domain, then discretized when</text><text x="528" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">it is actually implemented in code.</text></g><g id="cue_s02_c4_discretization_step_introduces_non_n"><title>discretization step introduces non-negligible equivariance error networks only approximately scale-equivariant</title><rect x="500" y="398" width="716" height="152" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="398" width="6" height="152" rx="6" fill="#F2685C"/><text x="528" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2685C" font-weight="800" text-anchor="start">3  ·  The cost: a non-negligible equivariance error</text><text x="528" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">That discretization step injects a residual error, so the networks are</text><text x="528" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">only approximately scale-equivariant — never truly so.</text><text x="528" y="536" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Equivariance error  &gt;  0</text></g></svg>