<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Best accuracy, zero equivariance error</text><g id="cue_s07_c1_results_striking"><title>results striking</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Best on every metric — and, by construction, an absolute zero equivariance error.</text></g><g id="cue_s07_c2_mnist_scale_ideal_downsampling_achie"><title>mnist-scale ideal downsampling achieves highest accuracy ninety-eight point nine percent</title><rect x="64" y="214" width="560" height="336" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="336" rx="6" fill="#4C9BE8"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">MNIST-scale  ·  ideal downsampling</text><rect x="92" y="268" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="176" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#48C78E" font-weight="800" text-anchor="middle">98.9%</text><text x="176" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">accuracy</text><rect x="272" y="268" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="356" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#48C78E" font-weight="800" text-anchor="middle">97.0%</text><text x="356" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">scale-consistency</text><rect x="452" y="268" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="536" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#34D3C0" font-weight="800" text-anchor="middle">0.00</text><text x="536" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">equi-error</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">End-to-end equivariance error (lower is better)</text><rect x="240" y="404" width="320" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="404" width="2" height="22" rx="6" fill="#34D3C0"/><text x="228" y="419.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Ours</text><text x="252" y="419.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">0.00</text><rect x="240" y="436" width="320" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="436" width="179" height="22" rx="6" fill="#F2C14E"/><text x="228" y="451.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Fourier CNN</text><text x="429" y="451.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">0.28</text><rect x="240" y="468" width="320" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="468" width="281" height="22" rx="6" fill="#F2685C"/><text x="228" y="483.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">DISCO</text><text x="531" y="483.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">0.44</text><text x="92" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">Ours drives the residual error to exactly zero.</text></g><g id="cue_s07_c3_advantage_largest_harder_stl10_scale"><title>advantage largest harder stl10-scale natural-image benchmark where reaches seventy-three percent</title><rect x="656" y="214" width="560" height="336" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="336" rx="6" fill="#34D3C0"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">STL10-scale  ·  natural images</text><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">Accuracy (higher is better)</text><rect x="860" y="300" width="300" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="860" y="300" width="274" height="26" rx="6" fill="#48C78E"/><text x="848" y="318.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Ours</text><text x="1144" y="318.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">73.3%</text><rect x="860" y="340" width="300" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="860" y="340" width="219" height="26" rx="6" fill="#F2C14E"/><text x="848" y="358.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Fourier CNN</text><text x="1089" y="358.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">58.4%</text><rect x="860" y="380" width="300" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="860" y="380" width="210" height="26" rx="6" fill="#9DB3C8"/><text x="848" y="398.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Wide ResNet</text><text x="1080" y="398.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">56.0%</text><rect x="684" y="424" width="532" height="44" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="700" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">≈ +15 points over the strongest baseline · equi-error 0.00</text><text x="684" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">The gain is largest on the harder natural-image benchmark.</text></g><g id="cue_s07_c4_also_degrades_gracefully_even_under"><title>also degrades gracefully even under non-ideal downsampling remains best low-data</title><rect x="64" y="564" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="564" width="6" height="116" rx="6" fill="#F2C14E"/><text x="92" y="598" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Degrades gracefully</text><rect x="92" y="616" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="616" width="5" height="58" rx="2" fill="#4C9BE8"/><text x="112" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Non-ideal downsampling</text><text x="112" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">still best: 98.8% acc · err 0.05</text><rect x="452" y="616" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="452" y="616" width="5" height="58" rx="2" fill="#34D3C0"/><text x="472" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Low-data regime</text><text x="472" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">most data-efficient of all methods</text><rect x="812" y="616" width="260" height="58" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="812" y="616" width="5" height="58" rx="2" fill="#F2C14E"/><text x="832" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">1k training samples</text><text x="832" y="662" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">96.06% vs DISCO 94.57%</text></g></svg>