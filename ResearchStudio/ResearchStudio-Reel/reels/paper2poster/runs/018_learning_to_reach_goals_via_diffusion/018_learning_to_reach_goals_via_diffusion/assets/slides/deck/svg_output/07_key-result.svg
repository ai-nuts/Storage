<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">KEY RESULT</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Best rank, an order of magnitude faster</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">Merlin  ·  07 / 09</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s07_c1_results_strong_across_board_basic"><title>results strong across board basic version merlin already outperforms baselines</title><rect x="56" y="168" width="1168" height="66" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="208.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Base Merlin already beats most baselines; Merlin-P and Merlin-NP get the highest returns on most tasks.</text></g><g id="cue_s07_c2_measured_average_rank_across_all"><title>measured average rank across all ten methods ten tasks merlin-np</title><rect x="56" y="250" width="570" height="292" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="268" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="82.0" y="292.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#EAF2FA" text-anchor="start">Average rank across 10 methods (lower is better)</text><text x="82.0" y="350.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Merlin-NP  state</text><rect x="206" y="332" width="300" height="26" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="206" y="332" width="85" height="26" rx="5" fill="#2FB6A8"/><text x="303.0" y="351.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2FB6A8" text-anchor="start">1.70</text><text x="82.0" y="406.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Merlin-NP  pixel</text><rect x="206" y="388" width="300" height="26" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="206" y="388" width="62" height="26" rx="5" fill="#49C08A"/><text x="280.5" y="407.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#49C08A" text-anchor="start">1.25</text><text x="82.0" y="462.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Best baseline</text><rect x="206" y="444" width="300" height="26" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="206" y="444" width="225" height="26" rx="5" fill="#E0A93B"/><text x="443.0" y="463.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#E0A93B" text-anchor="start">4.50</text><text x="82.0" y="512.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#49C08A" text-anchor="start">Merlin-NP takes the top average rank on both input types</text></g><g id="cue_s07_c3_crucially_because_merlin_performs_on"><title>crucially because merlin performs only single denoising step per environment</title><rect x="654" y="250" width="570" height="292" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="268" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="680.0" y="292.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#EAF2FA" text-anchor="start">Single denoising step → ~10× faster</text><text x="694.0" y="328.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Merlin (1 step)</text><rect x="694" y="334" width="360" height="24" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="694" y="334" width="36" height="24" rx="5" fill="#2FB6A8"/><text x="694.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Decision Diffuser</text><rect x="694" y="390" width="360" height="24" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="694" y="390" width="360" height="24" rx="5" fill="#E0655B"/><text x="694.0" y="440.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">BESO</text><rect x="694" y="446" width="360" height="24" rx="5" fill="#0F2236" stroke="#1E3E5A"/><rect x="694" y="446" width="324" height="24" rx="5" fill="#E0A93B"/><text x="680.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">Log inference/training time vs other diffusion RL methods</text></g><g id="cue_s07_c4_high_dimensional_pixel_observations"><title>high-dimensional pixel observations efficiency gap becomes even more pronounced</title><rect x="820" y="556" width="404" height="120" rx="10" fill="#0F2236" stroke="#1E3E5A"/><rect x="820" y="574" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="842.0" y="596.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#EAF2FA" text-anchor="start">Pixels: the gap widens</text><text x="842.0" y="624.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">With high-dimensional pixel observations,</text><text x="842.0" y="643.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">the efficiency advantage over diffusion</text><text x="842.0" y="662.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">baselines becomes even more pronounced.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Baselines span GCRL (GCSL, WGCSL, AM, GoFAR) and diffusion methods (Decision Diffuser, g-DQL, BESO).</text></svg>