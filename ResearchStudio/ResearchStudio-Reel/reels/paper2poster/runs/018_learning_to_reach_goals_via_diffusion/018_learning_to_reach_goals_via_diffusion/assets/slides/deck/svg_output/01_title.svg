<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="1">ICML 2024  ·  McGILL UNIVERSITY / MILA</text><g id="cue_s01_c1_what_reaching_goal_just_reverse"><title>what reaching goal just reverse diffusion process</title><text x="78.0" y="150.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="50" font-weight="bold" fill="#EAF2FA" text-anchor="start">Learning to Reach Goals via Diffusion</text><text x="78.0" y="196.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="normal" fill="#9FB6CC" text-anchor="start">What if reaching a goal were just the reverse of a diffusion process?</text></g><g id="cue_s01_c2_icml_2024_vineet_jain_siamak"><title>icml 2024 vineet jain siamak ravanbakhsh mcgill university mila reframe</title><rect x="56" y="250" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="268" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="80.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">Authors &amp; venue</text><text x="80.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Vineet Jain and Siamak Ravanbakhsh</text><text x="80.0" y="359.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">(McGill / Mila) reframe</text><text x="80.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">goal-conditioned RL through</text><text x="80.0" y="409.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">denoising diffusion. ICML 2024.</text></g><g id="cue_s01_c3_their_method_called_merlin_builds"><title>their method called merlin builds trajectories drift away goal states</title><rect x="466" y="250" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="466" y="268" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="490.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">Merlin, in one idea</text><text x="490.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Build trajectories that drift away</text><text x="490.0" y="359.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">from goal states, then train a</text><text x="490.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">policy to reverse that drift, like</text><text x="490.0" y="409.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">a diffusion denoiser.</text></g><g id="cue_s01_c4_result_value_function_free_approach"><title>result value-function-free approach reaches goals arbitrary starting states needs only</title><rect x="876" y="250" width="348" height="300" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="876" y="268" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="900.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">Why it matters</text><text x="900.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">A value-function-free method that</text><text x="900.0" y="359.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">reaches goals from any start, using</text><text x="900.0" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">a single denoising step per</text><text x="900.0" y="409.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">environment step.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Jain &amp; Ravanbakhsh — Learning to Reach Goals via Diffusion (ICML 2024)  ·  arXiv:2310.02505  ·  code: github.com/vineetjain96/merlin</text></svg>