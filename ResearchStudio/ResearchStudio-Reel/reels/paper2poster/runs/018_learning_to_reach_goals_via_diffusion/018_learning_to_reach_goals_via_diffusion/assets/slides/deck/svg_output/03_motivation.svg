or="start">Noise walks away from the data manifold; in GCRL we</text><text x="82.0" y="540.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">can construct trajectories that walk away from</text><text x="82.0" y="564.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">potential goals.</text></g><g id="cue_s03_c4_learning_reverse_those_deviations_di"><title>learning reverse those deviations directly analogous learning score function sidesteps</title><rect x="654" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="454" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="680.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Why it helps</text><text x="680.0" y="516.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Learning to reverse those deviations mirrors</text><text x="680.0" y="540.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">learning the score function — sidestepping the value</text><text x="680.0" y="564.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">estimation that plagues offline methods.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Prior fixes add policy constraints or conservative value updates, which compromise performance and hurt generalization.</text></svg>