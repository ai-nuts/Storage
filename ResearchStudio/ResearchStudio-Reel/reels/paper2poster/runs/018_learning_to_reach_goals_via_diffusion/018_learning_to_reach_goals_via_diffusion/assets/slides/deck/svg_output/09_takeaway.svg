<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">TAKEAWAY</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Takeaway</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">Merlin  ·  09 / 09</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s09_c1_big_takeaway_goal_conditioned_reinfo"><title>big takeaway goal-conditioned reinforcement learning reframed reverse diffusion process reframing</title><rect x="56" y="178" width="570" height="380" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="196" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="226.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#2FB6A8" text-anchor="start">The one line</text><text x="82.0" y="272.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#EAF2FA" text-anchor="start">Reframe goal-conditioned RL as the</text><text x="82.0" y="303.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#EAF2FA" text-anchor="start">reverse of a diffusion process — and</text><text x="82.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="normal" fill="#EAF2FA" text-anchor="start">goal-reaching becomes remarkably simple.</text><text x="82.0" y="430.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Construct trajectories that walk away from</text><text x="82.0" y="455.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">goals, learn to reverse them, and the whole</text><text x="82.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">problem collapses to behavior cloning.</text></g><g id="cue_s09_c2_constructing_trajectories_walk_away"><title>constructing trajectories walk away goals learning reverse them merlin reduces</title><rect x="654" y="194" width="570" height="112" rx="10" fill="#122A40" stroke="#1E3E5A"/><rect x="654" y="210" width="5" height="30" rx="2.5" fill="#49C08A"/><text x="680.0" y="222.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">No value function</text><text x="680.0" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">Merlin reduces goal-reaching to plain behavior</text><text x="680.0" y="272.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">cloning — nothing to estimate, no instability to</text><text x="680.0" y="294.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">fight.</text></g><g id="cue_s09_c3_matches_beats_state_of_the_art_metho"><title>matches beats state-of-the-art methods across ten tasks yet runs order</title><rect x="654" y="322" width="570" height="112" rx="10" fill="#122A40" stroke="#1E3E5A"/><rect x="654" y="338" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="680.0" y="350.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Matches or beats SOTA</text><text x="680.0" y="378.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">Competitive with state-of-the-art across ten tasks,</text><text x="680.0" y="400.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">yet an order of magnitude faster than other</text><text x="680.0" y="422.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">diffusion methods.</text></g><g id="cue_s09_c4_suggests_diffusion_state_space_simpl"><title>suggests diffusion state space simple scalable practical new direction sequential</title><rect x="654" y="450" width="570" height="112" rx="10" fill="#122A40" stroke="#1E3E5A"/><rect x="654" y="466" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="680.0" y="478.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">A new direction</text><text x="680.0" y="506.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">Diffusion in the state space is a simple, scalable,</text><text x="680.0" y="528.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">practical direction for sequential decision making.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Merlin — Learning to Reach Goals via Diffusion  ·  ICML 2024  ·  value-free, single-step, state-space diffusion for GCRL.</text></svg>