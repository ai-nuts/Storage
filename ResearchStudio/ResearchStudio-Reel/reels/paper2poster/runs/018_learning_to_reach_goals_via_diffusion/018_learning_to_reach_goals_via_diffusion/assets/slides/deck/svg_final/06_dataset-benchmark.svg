<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">DATASET / BENCHMARK</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Ten offline goal-conditioned tasks</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">Merlin  ·  06 / 09</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s06_c1_authors_evaluate_merlin_standard_off"><title>authors evaluate merlin standard offline goal-conditioned benchmark ten control tasks</title><rect x="56" y="168" width="1168" height="118" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="206.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Standard offline GCRL benchmark (Yang et al., 2021) — 10 control tasks, easy to hard</text><rect x="82" y="232" width="98" height="26" rx="13" fill="#122A40" stroke="#4C86F0" stroke-width="1.3"/><text x="131.0" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">PointReach</text><rect x="192.0" y="232" width="98" height="26" rx="13" fill="#122A40" stroke="#4C86F0" stroke-width="1.3"/><text x="241.0" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">PointRooms</text><rect x="302.0" y="232" width="72" height="26" rx="13" fill="#122A40" stroke="#4C86F0" stroke-width="1.3"/><text x="338.1" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">Reacher</text><rect x="386.2" y="232" width="107" height="26" rx="13" fill="#122A40" stroke="#4C86F0" stroke-width="1.3"/><text x="439.5" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">SawyerReach</text><rect x="504.79999999999995" y="232" width="98" height="26" rx="13" fill="#122A40" stroke="#4C86F0" stroke-width="1.3"/><text x="553.8" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">SawyerDoor</text><rect x="614.8" y="232" width="98" height="26" rx="13" fill="#122A40" stroke="#4C86F0" stroke-width="1.3"/><text x="663.8" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">FetchReach</text><rect x="724.8" y="232" width="89" height="26" rx="13" fill="#122A40" stroke="#E0A93B" stroke-width="1.3"/><text x="769.5" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">FetchPush</text><rect x="826.1999999999999" y="232" width="89" height="26" rx="13" fill="#122A40" stroke="#E0A93B" stroke-width="1.3"/><text x="870.9" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">FetchPick</text><rect x="927.5999999999999" y="232" width="98" height="26" rx="13" fill="#122A40" stroke="#E0A93B" stroke-width="1.3"/><text x="976.6" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">FetchSlide</text><rect x="1037.6" y="232" width="89" height="26" rx="13" fill="#122A40" stroke="#E0A93B" stroke-width="1.3"/><text x="1082.3" y="250.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#EAF2FA" text-anchor="middle">HandReach</text></g><g id="cue_s06_c2_every_task_sparse_binary_reward"><title>every task sparse binary reward maximum trajectory length fifty steps</title><rect x="56" y="308" width="348" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="326" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="80.0" y="352.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Task setup</text><text x="80.0" y="390.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Every task uses a sparse binary</text><text x="80.0" y="415.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">reward and a maximum trajectory</text><text x="80.0" y="440.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">length of T = 50 steps.</text></g><g id="cue_s06_c3_task_comes_two_flavors_expert"><title>task comes two flavors expert dataset collected trained policy added</title><rect x="466" y="308" width="348" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="466" y="326" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="490.0" y="352.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Two dataset flavors</text><text x="490.0" y="390.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">An expert dataset from a trained</text><text x="490.0" y="415.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">policy (with noise for diversity),</text><text x="490.0" y="440.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">and a random dataset from random</text><text x="490.0" y="465.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">actions.</text></g><g id="cue_s06_c4_they_test_both_low_dimensional_state"><title>they test both low-dimensional state observations high-dimensional pixel observations average</title><rect x="876" y="308" width="348" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="876" y="326" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="900.0" y="352.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">State and pixels</text><text x="900.0" y="390.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Both low-dimensional state</text><text x="900.0" y="415.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">observations and high-dimensional</text><text x="900.0" y="440.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">pixel observations, averaged over</text><text x="900.0" y="465.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">10 seeds.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Easier tasks (PointReach … FetchReach) use 2,000 trajectories each; harder tasks (FetchPush … HandReach) use 40,000.</text></svg>