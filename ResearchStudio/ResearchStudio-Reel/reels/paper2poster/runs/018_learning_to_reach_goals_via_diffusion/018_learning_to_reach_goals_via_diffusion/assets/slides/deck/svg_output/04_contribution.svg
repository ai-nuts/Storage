<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">CONTRIBUTION</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Three contributions</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">Merlin  ·  04 / 09</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s04_c1_makes_three_main_contributions"><title>makes three main contributions</title><rect x="56" y="168" width="1168" height="78" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="216.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#EAF2FA" text-anchor="start">Merlin recasts goal-conditioned RL as reverse diffusion — with three main consequences.</text></g><g id="cue_s04_c2_first_presents_merlin_fresh_perspect"><title>first presents merlin fresh perspective casts goal-conditioned reinforcement learning reverse</title><rect x="56" y="270" width="348" height="280" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="288" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="80.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">1 · A fresh perspective</text><text x="80.0" y="354.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Merlin casts goal-conditioned RL as</text><text x="80.0" y="379.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">a reverse diffusion process</text><text x="80.0" y="404.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">operating directly over the</text><text x="80.0" y="429.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">environment&#x27;s state space.</text></g><g id="cue_s04_c3_second_proves_reverse_process_learne"><title>second proves reverse process learned simple goal-conditioned behavior cloning hindsight</title><rect x="466" y="270" width="348" height="280" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="466" y="288" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="490.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">2 · Just behavior cloning</text><text x="490.0" y="354.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">It proves the reverse process can</text><text x="490.0" y="379.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">be learned by goal-conditioned</text><text x="490.0" y="404.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">behavior cloning with hindsight</text><text x="490.0" y="429.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">relabeling — no value function.</text></g><g id="cue_s04_c4_third_develops_three_ways_construct"><title>third develops three ways construct forward goal-departing trajectories fixed heuristic</title><rect x="876" y="270" width="348" height="280" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="876" y="288" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="900.0" y="316.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">3 · Three variants</text><text x="900.0" y="354.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Three ways to build the</text><text x="900.0" y="379.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">goal-departing trajectories: a</text><text x="900.0" y="404.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">fixed rule, a parametric forward</text><text x="900.0" y="429.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">model (Merlin-P), and Merlin-NP</text><text x="900.0" y="454.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">with stitching.</text></g><text x="56.0" y="706.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#6E869C" text-anchor="start">Merlin is the first method to perform diffusion directly in the state space — one denoising iteration per environment step.</text></svg>