="start">policy aims each step.</text></g><g id="cue_s08_c2_best_value_depends_task_easier"><title>best value depends task easier tasks like pointreach well short</title><rect x="654" y="168" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="680.0" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#EAF2FA" text-anchor="start">Task-dependent horizon</text><text x="680.0" y="248.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">Easier tasks like PointReach do best with a short</text><text x="680.0" y="272.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">horizon (h=1 or 5); harder tasks need longer</text><text x="680.0" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#9FB6CC" text-anchor="start">horizons to reach the goal.</text></g><g id="cue_s08_c3_handreach_task_particularly_sensitiv"><title>handreach task particularly sensitive working dramatically better horizon one any</title><rect x="56" y="436" width="570" height="250" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="454" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="82.0" y="478.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">HandReach is especially sensitive</text><rect x="102" y="519" width="60" height="103" rx="4" fill="#49C08A"/><text x="132.0" y="642.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="middle">h=1</text><rect x="224" y="573" width="60" height="49" rx="4" fill="#E0A93B"/><text x="254.0" y="642.