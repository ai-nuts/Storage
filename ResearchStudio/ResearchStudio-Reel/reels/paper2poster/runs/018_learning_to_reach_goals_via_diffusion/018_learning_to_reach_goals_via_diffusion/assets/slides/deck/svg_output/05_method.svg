<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="56" y="52" width="7" height="34" rx="3" fill="#2FB6A8"/><text x="78.0" y="66.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FB6A8" text-anchor="start" letter-spacing="2">METHOD</text><text x="78.0" y="104.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#EAF2FA" text-anchor="start">Reverse a goal-departing trajectory</text><text x="1224.0" y="92.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="end">Merlin  ·  05 / 09</text><line x1="56" y1="128" x2="1224" y2="128" stroke="#1E3E5A" stroke-width="1"/><g id="cue_s05_c1_how_merlin_works_take_trajectory"><title>how merlin works take trajectory offline dataset read backwards starting</title><rect x="56" y="168" width="1168" height="172" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="186" width="5" height="30" rx="2.5" fill="#2FB6A8"/><text x="82.0" y="208.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#EAF2FA" text-anchor="start">Read an offline trajectory backwards, starting from its goal state</text><circle cx="116" cy="276" r="10" fill="#0F2236" stroke="#4C86F0" stroke-width="2"/><text x="116.0" y="310.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#4C86F0" text-anchor="middle">s₀ (start)</text><line x1="270" y1="260" x2="130" y2="260" stroke="#E0655B" stroke-width="2" stroke-dasharray="5 4"/><line x1="130" y1="292" x2="270" y2="292" stroke="#49C08A" stroke-width="2.4"/><polygon points="270,292 262,287 262,297" fill="#49C08A"/><circle cx="284" cy="276" r="10" fill="#0F2236" stroke="#9FB6CC" stroke-width="2"/><text x="284.0" y="310.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="middle">s₁</text><line x1="438" y1="260" x2="298" y2="260" stroke="#E0655B" stroke-width="2" stroke-dasharray="5 4"/><line x1="298" y1="292" x2="438" y2="292" stroke="#49C08A" stroke-width="2.4"/><polygon points="438,292 430,287 430,297" fill="#49C08A"/><circle cx="452" cy="276" r="10" fill="#0F2236" stroke="#9FB6CC" stroke-width="2"/><text x="452.0" y="310.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="middle">s₂</text><line x1="606" y1="260" x2="466" y2="260" stroke="#E0655B" stroke-width="2" stroke-dasharray="5 4"/><line x1="466" y1="292" x2="606" y2="292" stroke="#49C08A" stroke-width="2.4"/><polygon points="606,292 598,287 598,297" fill="#49C08A"/><circle cx="620" cy="276" r="10" fill="#0F2236" stroke="#9FB6CC" stroke-width="2"/><text x="620.0" y="310.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="middle">s_T</text><line x1="774" y1="260" x2="634" y2="260" stroke="#E0655B" stroke-width="2" stroke-dasharray="5 4"/><line x1="634" y1="292" x2="774" y2="292" stroke="#49C08A" stroke-width="2.4"/><polygon points="774,292 766,287 766,297" fill="#49C08A"/><polygon points="788,263 792,272 801,272 794,279 797,288 788,282 779,288 782,279 775,272 784,272" fill="#49C08A"/><text x="788.0" y="310.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#49C08A" text-anchor="middle">goal g</text><text x="82.0" y="326.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">red dashed = forward drift q(s_t | s_t+1)   ·   green = learned reverse policy πθ</text></g><g id="cue_s05_c2_applying_forward_diffusion_transform"><title>applying forward diffusion transformation step produces states drift progressively away</title><rect x="56" y="360" width="570" height="178" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="378" width="5" height="30" rx="2.5" fill="#E0A93B"/><text x="82.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Forward diffusion in state space</text><text x="82.0" y="434.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">Each forward step pushes states progressively away from</text><text x="82.0" y="457.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">the goal — exactly like adding noise in an image diffusion</text><text x="82.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">model. Merlin then learns to reverse the drift, one step</text><text x="82.0" y="503.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#9FB6CC" text-anchor="start">at a time.</text></g><g id="cue_s05_c3_key_theoretical_result_maximizing_li"><title>key theoretical result maximizing likelihood goal states under reverse process</title><rect x="654" y="360" width="570" height="178" rx="12" fill="#122A40" stroke="#1E3E5A" stroke-width="1.2"/><rect x="654" y="378" width="5" height="30" rx="2.5" fill="#4C86F0"/><text x="680.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#EAF2FA" text-anchor="start">Likelihood of goals  =  behavior cloning</text><rect x="678" y="418" width="522" height="46" rx="8" fill="#0F2236" stroke="#1E3E5A"/><text x="694.0" y="447.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" font-weight="normal" fill="#2FB6A8" text-anchor="start">max_θ  E[ log πθ(a | s, g) ]</text><text x="680.0" y="488.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">Maximizing the log-likelihood of goal states under the</text><text x="680.0" y="509.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">reverse process reduces to plain behavior cloning — so no</text><text x="680.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#9FB6CC" text-anchor="start">value function is ever needed.</text></g><g id="cue_s05_c4_authors_offer_three_ways_build"><title>authors offer three ways build goal-departing trajectories fixed construction learned</title><rect x="56" y="556" width="1168" height="128" rx="12" fill="#0F2236" stroke="#1E3E5A" stroke-width="1.2"/><rect x="56" y="574" width="5" height="30" rx="2.5" fill="#9B7BE0"/><text x="82.0" y="594.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#EAF2FA" text-anchor="start">Three ways to build the goal-departing trajectories  ·  one denoising step per environment step</text><rect x="82" y="614" width="360" height="52" rx="8" fill="#122A40" stroke="#1E3E5A"/><text x="98.0" y="638.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9B7BE0" text-anchor="start">Fixed</text><text x="98.0" y="656.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">a hand-designed construction rule</text><rect x="470" y="614" width="360" height="52" rx="8" fill="#122A40" stroke="#1E3E5A"/><text x="486.0" y="638.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9B7BE0" text-anchor="start">Merlin-P</text><text x="486.0" y="656.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">a learned parametric forward model</text><rect x="858" y="614" width="360" height="52" rx="8" fill="#122A40" stroke="#1E3E5A"/><text x="874.0" y="638.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#9B7BE0" text-anchor="start">Merlin-NP</text><text x="874.0" y="656.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">non-parametric nearest-neighbor stitching in</text><text x="874.0" y="672.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#9FB6CC" text-anchor="start">latent space</text></g></svg>