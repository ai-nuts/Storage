<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">Temperature sampling over-repeats the tail</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">03 / 10</text><g id="cue_s03_c1_temperature_sampling_reshapes_distri" data-cue-label="cue_s03_c1_temperature_sampling_reshapes_distri"><title>temperature sampling reshapes distribution single exponent tau but catch</title><desc>Temperature sampling reshapes the data distribution using a single exponent, tau. But there is a catch.</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">TEMPERATURE SAMPLING</text><text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Reshapes the data mix with a single</text><text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">exponent, tau. Simple, but there is a</text><text x="90.0" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">catch.</text></g><g id="cue_s03_c2_when_you_tune_tau_give" data-cue-label="cue_s03_c2_when_you_tune_tau_give"><title>when you tune tau give head languages more presence you</title><desc>When you tune tau to give the head languages more presence, you end up over-repeating the tail.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">TUNE HEAD, HURT TAIL</text><text x="679.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Boosting the head languages forces heavy</text><text x="679.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">over-repetition of the long tail.</text></g><g id="cue_s03_c3_tau_equals_three_point_three" data-cue-label="cue_s03_c3_tau_equals_three_point_three"><title>tau equals three point three three trillion-token budget lowest-resource languages</title><desc>At tau equals three point three three, with a trillion-token budget, the lowest-resource languages get repeated more than a hundred times.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">TAIL REPEATS AT τ=3.33</text><text x="90.0" y="520.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8EEF7" text-anchor="start">&gt;100×</text><text x="90.0" y="546.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9FB2C6" text-anchor="start">with a 1T-token budget</text><text x="90.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">The lowest-resource languages are seen</text><text x="90.0" y="592.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">over a hundred times.</text></g><g id="cue_s03_c4_much_repetition_causes_overfitting_h" data-cue-label="cue_s03_c4_much_repetition_causes_overfitting_h"><title>much repetition causes overfitting hurts downstream tasks raises risk memorizing</title><desc>That much repetition causes overfitting that hurts downstream tasks, it raises the risk of memorizing private content, and it wastes compute on duplicate examples, and every one of</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">THE COST</text><text x="679.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Over-repetition drives overfitting,</text><text x="679.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">memorized private content, and wasted</text><text x="679.0" y="548.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">compute, all worse at scale.</text></g>
</svg>
