<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">Multilingual data is wildly imbalanced</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">02 / 10</text><g id="cue_s02_c1_why_does_language_sampling_matter" data-cue-label="cue_s02_c1_why_does_language_sampling_matter"><title>why does language sampling matter much massively multilingual corpora wildly</title><desc>So why does language sampling matter so much? Massively multilingual corpora are wildly imbalanced.</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">WHY SAMPLING MATTERS</text><text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">The mix you train on is a design choice.</text><text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Massively multilingual corpora are</text><text x="90.0" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">anything but balanced.</text></g><g id="cue_s02_c2_mc4_dataset_english_alone_about" data-cue-label="cue_s02_c2_mc4_dataset_english_alone_about"><title>mc4 dataset english alone about nine point seven trillion characters</title><desc>In the mC4 dataset, English alone has about nine point seven trillion characters, more than ninety-two thousand times the data available for the lowest-resource language, Yoruba.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">ENGLISH vs YORUBA</text><text x="679.0" y="240.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8EEF7" text-anchor="start">92,000×</text><text x="679.0" y="266.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9FB2C6" text-anchor="start">gap in mC4 (≈9.7T vs the tail)</text><text x="679.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">English dwarfs the lowest-resource</text><text x="679.0" y="312.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">language.</text><text x="679.0" y="328.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#63788F" text-anchor="start">mC4 characters (log)</text><text x="679.0" y="347.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">English</text><rect x="807.0" y="334.0" width="323.0" height="16.0" rx="8.0" fill="#22304A"/><rect x="807.0" y="334.0" width="313.3" height="16.0" rx="8.0" fill="#4EA1FF"/><text x="1130.31" y="347.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">97</text><text x="679.0" y="375.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">Yoruba</text><rect x="807.0" y="362.0" width="323.0" height="16.0" rx="8.0" fill="#22304A"/><rect x="807.0" y="362.0" width="9.7" height="16.0" rx="8.0" fill="#F87171"/><text x="826.69" y="375.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">3</text></g><g id="cue_s02_c3_you_train_proportion_raw_tail" data-cue-label="cue_s02_c3_you_train_proportion_raw_tail"><title>you train proportion raw tail languages barely register all</title><desc>If you train in proportion to the raw data, the tail languages barely register at all.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">TRAIN ON RAW DATA?</text><text x="90.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Sample in proportion to raw size and the</text><text x="90.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">tail languages barely register at all.</text></g><g id="cue_s02_c4_deciding_how_balance_them_open" data-cue-label="cue_s02_c4_deciding_how_balance_them_open"><title>deciding how balance them open expensive question field default answer</title><desc>Deciding how to balance them is an open and expensive question, and the field&#x27;s default answer, temperature-based sampling, had never actually been evaluated systematically across </desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">OPEN &amp; EXPENSIVE</text><text x="679.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Balancing languages is unsolved, and the</text><text x="679.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">default fix, temperature sampling, was</text><text x="679.0" y="548.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">never tested across scales.</text></g>
</svg>
