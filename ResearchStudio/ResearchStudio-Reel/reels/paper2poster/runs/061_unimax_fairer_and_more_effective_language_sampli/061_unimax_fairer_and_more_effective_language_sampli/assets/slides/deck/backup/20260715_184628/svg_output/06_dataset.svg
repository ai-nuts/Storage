<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">DATASET AND BENCHMARK</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">Refreshed mC4 + a broad evaluation sweep</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">06 / 10</text><g id="cue_s06_c1_evaluation_pretraining_refreshed_mc4" data-cue-label="cue_s06_c1_evaluation_pretraining_refreshed_mc4"><title>evaluation pretraining refreshed mc4 corpus twenty-nine trillion characters across one</title><desc>For evaluation, pretraining uses that refreshed mC4 corpus, twenty-nine trillion characters across one hundred seven languages.</desc><rect x="64.0" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="498.0" rx="2.5" fill="#FBBF24"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">PRETRAINING CORPUS</text><text x="90.0" y="240.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8EEF7" text-anchor="start">29T</text><text x="90.0" y="266.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9FB2C6" text-anchor="start">characters · 107 languages</text><text x="90.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">The refreshed mC4 used for</text><text x="90.0" y="312.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">pretraining.</text></g><g id="cue_s06_c2_trained_models_tested_broad_suite" data-cue-label="cue_s06_c2_trained_models_tested_broad_suite"><title>trained models tested broad suite tasks tydi goldp wmt21 multilingual</title><desc>The trained models are then tested on a broad suite of tasks: TyDi QA GoldP, WMT21 multilingual translation, XNLI, XQuAD, MLQA, and PAWS-X.</desc><rect x="456.6666666666667" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="456.6666666666667" y="168.0" width="5" height="498.0" rx="2.5" fill="#4EA1FF"/><text x="482.6666666666667" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">EVALUATION SUITE</text><text x="482.6666666666667" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">TyDi QA GoldP, WMT21 translation,</text><text x="482.6666666666667" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">XNLI, XQuAD, MLQA, and PAWS-X.</text></g><g id="cue_s06_c3_crucially_every_sampling_strategy_co" data-cue-label="cue_s06_c3_crucially_every_sampling_strategy_co"><title>crucially every sampling strategy compared while sweeping scale small all</title><desc>Crucially, every sampling strategy is compared while sweeping the model scale from Small all the way up to XXL, so the study can isolate whether the benefits actually persist as th</desc><rect x="849.3333333333334" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="849.3333333333334" y="168.0" width="5" height="498.0" rx="2.5" fill="#6EE7B7"/><text x="875.3333333333334" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">SWEEP THE SCALE</text><text x="875.3333333333334" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Compare every strategy from Small</text><text x="875.3333333333334" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">up to XXL to see whether the gains</text><text x="875.3333333333334" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">persist.</text></g>
</svg>
