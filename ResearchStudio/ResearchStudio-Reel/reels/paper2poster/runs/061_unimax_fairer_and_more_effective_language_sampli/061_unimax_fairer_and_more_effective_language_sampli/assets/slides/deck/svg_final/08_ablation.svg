<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">How much does the max-epoch cap matter?</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">08 / 10</text><g id="cue_s08_c1_what_about_max_epoch_parameter_ablat" data-cue-label="cue_s08_c1_what_about_max_epoch_parameter_ablat"><title>what about max-epoch parameter ablating over one five ten large</title><desc>What about that max-epoch parameter, N? Ablating N over one, five, and ten on Large models gives TyDi QA scores of eighty-two point two, eighty-one point five, and eighty-one point</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">MAX-EPOCH N</text><text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Ablate N over 1, 5, and 10 on Large</text><text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">models.</text><text x="90.0" y="278.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#63788F" text-anchor="start">TyDi QA on Large by max-epoch N</text><text x="90.0" y="303.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">N=1</text><rect x="218.0" y="286.0" width="323.0" height="24.0" rx="12.0" fill="#22304A"/><rect x="218.0" y="286.0" width="319.9" height="24.0" rx="12.0" fill="#6EE7B7"/><text x="547.8867469879518" y="303.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">82.2</text><text x="90.0" y="339.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">N=5</text><rect x="218.0" y="322.0" width="323.0" height="24.0" rx="12.0" fill="#22304A"/><rect x="218.0" y="322.0" width="317.2" height="24.0" rx="12.0" fill="#4EA1FF"/><text x="545.1626506024097" y="339.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">81.5</text><text x="90.0" y="375.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">N=10</text><rect x="218.0" y="358.0" width="323.0" height="24.0" rx="12.0" fill="#22304A"/><rect x="218.0" y="358.0" width="318.3" height="24.0" rx="12.0" fill="#4EA1FF"/><text x="546.3301204819277" y="375.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">81.8</text></g><g id="cue_s08_c2_disallowing_repeats_entirely_equals" data-cue-label="cue_s08_c2_disallowing_repeats_entirely_equals"><title>disallowing repeats entirely equals one comes out best though effect</title><desc>Disallowing repeats entirely, N equals one, comes out best, though the effect is small.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#6EE7B7"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">N=1 WINS</text><text x="679.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Disallowing repeats entirely is best,</text><text x="679.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">though the margin is small.</text></g><g id="cue_s08_c3_four_times_larger_budget_unimax_scor" data-cue-label="cue_s08_c3_four_times_larger_budget_unimax_scor"><title>four-times-larger budget unimax scores eighty-three point one versus eighty-two point</title><desc>At a four-times-larger budget, UniMax scores eighty-three point one, versus eighty-two point eight for temperature and eighty-one point two for tau equals one.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">4× LARGER BUDGET</text><text x="90.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">UniMax 83.1 versus 82.8 for tau=3.33 and</text><text x="90.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">81.2 for tau=1.</text></g><g id="cue_s08_c4_loss_curves_tell_story_high_temperat" data-cue-label="cue_s08_c4_loss_curves_tell_story_high_temperat"><title>loss curves tell story high-temperature overfitting grows more severe scale</title><desc>The loss curves tell the story: high-temperature overfitting grows more severe with scale, while UniMax stays stable.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">LOSS CURVES</text><text x="679.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">High-temperature overfitting worsens</text><text x="679.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">with scale, while UniMax stays stable.</text></g>
