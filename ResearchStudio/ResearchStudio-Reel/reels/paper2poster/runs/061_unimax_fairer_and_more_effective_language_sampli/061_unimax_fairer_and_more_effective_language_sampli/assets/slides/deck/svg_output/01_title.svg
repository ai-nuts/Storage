<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="784" y="150" width="432" height="300" rx="20" fill="#1A2438" stroke="#2B3B57"/><text x="816" y="190" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#63788F" text-anchor="start" letter-spacing="2">SAMPLING SHAPE</text><text x="816" y="210" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#F87171" text-anchor="start">Temperature</text><rect x="816" y="228" width="42" height="72" rx="4" fill="#F87171" opacity="0.8"/><rect x="878" y="248" width="42" height="52" rx="4" fill="#F87171" opacity="0.8"/><rect x="940" y="268" width="42" height="32" rx="4" fill="#F87171" opacity="0.8"/><rect x="1002" y="282" width="42" height="18" rx="4" fill="#F87171" opacity="0.8"/><rect x="1064" y="290" width="42" height="10" rx="4" fill="#F87171" opacity="0.8"/><rect x="1126" y="295" width="42" height="5" rx="4" fill="#F87171" opacity="0.8"/><line x1="816" y1="300" x2="1184" y2="300" stroke="#2B3B57"/><text x="816" y="336" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#6EE7B7" text-anchor="start">UniMax</text><rect x="816" y="358" width="42" height="52" rx="4" fill="#6EE7B7" opacity="0.85"/><rect x="878" y="358" width="42" height="52" rx="4" fill="#6EE7B7" opacity="0.85"/><rect x="940" y="358" width="42" height="52" rx="4" fill="#6EE7B7" opacity="0.85"/><rect x="1002" y="358" width="42" height="52" rx="4" fill="#6EE7B7" opacity="0.85"/><rect x="1064" y="366" width="42" height="44" rx="4" fill="#6EE7B7" opacity="0.85"/><rect x="1126" y="380" width="42" height="30" rx="4" fill="#6EE7B7" opacity="0.85"/><line x1="816" y1="410" x2="1184" y2="410" stroke="#2B3B57"/><text x="816" y="432" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#63788F" text-anchor="start">high-resource  →  low-resource</text><g id="cue_s01_c1_multilingual_language_models_must_de" data-cue-label="cue_s01_c1_multilingual_language_models_must_de"><title>multilingual language models must decide how much train language standard</title><desc>Multilingual language models must decide how much to train on each language, and the standard answer has been temperature-based sampling.</desc><rect x="64" y="150" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">GOOGLE RESEARCH · ICLR 2023</text><text x="64" y="268" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="96" font-weight="800" fill="#E8EEF7" text-anchor="start">UniMax</text><text x="64" y="320" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#E8EEF7" text-anchor="start">Fairer and More Effective Language Sampling</text><text x="64" y="356" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#E8EEF7" text-anchor="start">for Large-Scale Multilingual Pretraining</text><text x="64" y="402" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#9FB2C6" text-anchor="start">Uniform budget allocation with a hard cap on per-language repeats</text></g><text x="64" y="452" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#63788F" text-anchor="start">Chung, Constant, Garcia, Roberts, Tay, Narang, Firat · Google Research</text><g id="cue_s01_c2_google_research_introduces_unimax_si" data-cue-label="cue_s01_c2_google_research_introduces_unimax_si"><title>google research introduces unimax simple sampling method gives more uniform</title><desc>This paper from Google Research introduces UniMax, a simple sampling method that gives more uniform coverage to high-resource languages while explicitly capping how many times any </desc><rect x="64.0" y="500.0" width="366.6666666666667" height="184.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="518.0" width="5" height="148.0" rx="2.5" fill="#4EA1FF"/><text x="88.0" y="536.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">METHOD</text><text x="88.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#E8EEF7" text-anchor="start">Uniform + Max</text><text x="88.0" y="598.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9FB2C6" text-anchor="start">Spread budget evenly; cap how</text><text x="88.0" y="617.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9FB2C6" text-anchor="start">often any language repeats.</text></g><g id="cue_s01_c3_across_many_benchmarks_scales_unimax" data-cue-label="cue_s01_c3_across_many_benchmarks_scales_unimax"><title>across many benchmarks scales unimax beats temperature sampling gains persist</title><desc>Across many benchmarks and model scales, UniMax beats temperature sampling, and the gains persist as models grow.</desc><rect x="456.6666666666667" y="500.0" width="366.6666666666667" height="184.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="456.6666666666667" y="518.0" width="5" height="148.0" rx="2.5" fill="#6EE7B7"/><text x="480.6666666666667" y="536.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">RESULT</text><text x="480.6666666666667" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#E8EEF7" text-anchor="start">Beats temperature</text><text x="480.6666666666667" y="598.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9FB2C6" text-anchor="start">Wins across benchmarks and every</text><text x="480.6666666666667" y="617.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9FB2C6" text-anchor="start">model scale, gains grow with size.</text></g><g id="cue_s01_c4_authors_also_release_refreshed_mc4" data-cue-label="cue_s01_c4_authors_also_release_refreshed_mc4"><title>authors also release refreshed mc4 corpus twenty-nine trillion characters across</title><desc>The authors also release a refreshed mC4 corpus of twenty-nine trillion characters across one hundred seven languages, along with umT5 checkpoints trained with UniMax.</desc><rect x="849.3333333333334" y="500.0" width="366.6666666666667" height="184.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="849.3333333333334" y="518.0" width="5" height="148.0" rx="2.5" fill="#FBBF24"/><text x="873.3333333333334" y="536.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">RELEASE</text><text x="873.3333333333334" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#E8EEF7" text-anchor="start">29T-char mC4</text><text x="873.3333333333334" y="598.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9FB2C6" text-anchor="start">Refreshed corpus of 107 languages</text><text x="873.3333333333334" y="617.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#9FB2C6" text-anchor="start">+ umT5 checkpoints.</text></g>
</svg>
