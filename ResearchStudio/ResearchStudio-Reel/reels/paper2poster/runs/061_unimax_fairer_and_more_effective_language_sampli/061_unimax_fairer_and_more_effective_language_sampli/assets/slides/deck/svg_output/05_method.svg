<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">UniMax = uniform allocation + max-epoch cap</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">05 / 10</text><g id="cue_s05_c1_how_unimax_works_name_means" data-cue-label="cue_s05_c1_how_unimax_works_name_means"><title>how unimax works name means uniform plus max you start</title><desc>Here is how UniMax works. The name means uniform plus max. You start from a fixed character budget, C, and distribute it as uniformly as possible across the languages, processing t</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><circle cx="106.0" cy="192.0" r="20" fill="none" stroke="#4EA1FF" stroke-width="2"/><text x="106.0" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#4EA1FF" text-anchor="middle">1</text><text x="142.0" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">UNIFORM + MAX</text><text x="142.0" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">Start from a fixed character budget C;</text><text x="142.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">spread it as uniformly as possible,</text><text x="142.0" y="258.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">low to high resource.</text></g><g id="cue_s05_c2_step_algorithm_checks_whether_remain" data-cue-label="cue_s05_c2_step_algorithm_checks_whether_remain"><title>step algorithm checks whether remaining per-language budget still split evenly</title><desc>At each step, the algorithm checks whether the remaining per-language budget can still be split evenly.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><circle cx="695.0" cy="192.0" r="20" fill="none" stroke="#4EA1FF" stroke-width="2"/><text x="695.0" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#4EA1FF" text-anchor="middle">2</text><text x="731.0" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">CHECK EACH STEP</text><text x="731.0" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">At each language, test whether the</text><text x="731.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">remaining budget still splits evenly.</text></g><g id="cue_s05_c3_language_would_exceed_epochs_over" data-cue-label="cue_s05_c3_language_would_exceed_epochs_over"><title>language would exceed epochs over its own corpus capped epochs</title><desc>If a language would exceed N epochs over its own corpus, it is capped at N epochs, and the freed budget is redistributed uniformly among the languages that remain.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><circle cx="106.0" cy="472.0" r="20" fill="none" stroke="#FBBF24" stroke-width="2"/><text x="106.0" y="479.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#FBBF24" text-anchor="middle">3</text><text x="142.0" y="466.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">CAP AT N EPOCHS</text><text x="142.0" y="492.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">If a language would exceed N epochs,</text><text x="142.0" y="515.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">cap it and redistribute the freed</text><text x="142.0" y="538.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">budget uniformly.</text></g><g id="cue_s05_c4_result_more_uniform_coverage_head" data-cue-label="cue_s05_c4_result_more_uniform_coverage_head"><title>result more uniform coverage head languages while tail language ever</title><desc>The result is more uniform coverage of the head languages, while no tail language is ever repeated more than N times. With the default of N equals one, nothing repeats at all.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#6EE7B7"/><circle cx="695.0" cy="472.0" r="20" fill="none" stroke="#6EE7B7" stroke-width="2"/><text x="695.0" y="479.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#6EE7B7" text-anchor="middle">4</text><text x="731.0" y="466.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">THE RESULT</text><text x="731.0" y="492.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">More uniform head coverage; no tail</text><text x="731.0" y="515.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">repeated over N times (default N=1</text><text x="731.0" y="538.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">means no repeats).</text></g>
</svg>
