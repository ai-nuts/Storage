<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">Cap repeats, spread the rest uniformly</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">10 / 10</text><g id="cue_s10_c1_takeaway_simple" data-cue-label="cue_s10_c1_takeaway_simple"><title>takeaway simple</title><desc>The takeaway is simple.</desc><rect x="64.0" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="498.0" rx="2.5" fill="#4EA1FF"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">THE TAKEAWAY</text><text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">One idea: cap per-language</text><text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">repeats, and distribute the</text><text x="90.0" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">remaining budget uniformly.</text></g><g id="cue_s10_c2_capping_per_language_repeats_spreadi" data-cue-label="cue_s10_c2_capping_per_language_repeats_spreadi"><title>capping per-language repeats spreading rest budget uniformly beats temperature sampling</title><desc>Capping per-language repeats, and spreading the rest of the budget uniformly, beats temperature sampling for multilingual pretraining, and that advantage holds as models scale.</desc><rect x="456.6666666666667" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="456.6666666666667" y="168.0" width="5" height="498.0" rx="2.5" fill="#6EE7B7"/><text x="482.6666666666667" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">BEATS TEMPERATURE</text><text x="482.6666666666667" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Outperforms temperature sampling</text><text x="482.6666666666667" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">for multilingual pretraining, and</text><text x="482.6666666666667" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">the edge holds as models scale.</text></g><g id="cue_s10_c3_unimax_drop_in_hyperparameter_light" data-cue-label="cue_s10_c3_unimax_drop_in_hyperparameter_light"><title>unimax drop-in hyperparameter-light replacement temperature sampling ships refreshed corpus umt5</title><desc>UniMax is a drop-in, hyperparameter-light replacement for temperature sampling, and it ships with a refreshed corpus and umT5 checkpoints you can use today.</desc><rect x="849.3333333333334" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="849.3333333333334" y="168.0" width="5" height="498.0" rx="2.5" fill="#FBBF24"/><text x="875.3333333333334" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">DROP-IN REPLACEMENT</text><text x="875.3333333333334" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Hyperparameter-light; ships with</text><text x="875.3333333333334" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">the refreshed mC4 and umT5</text><text x="875.3333333333334" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">checkpoints you can use today.</text></g>
</svg>
