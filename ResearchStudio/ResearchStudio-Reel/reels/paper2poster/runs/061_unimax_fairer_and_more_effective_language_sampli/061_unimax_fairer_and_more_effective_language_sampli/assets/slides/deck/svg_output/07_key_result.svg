perature settings, tau equals one and tau equals three point three three, on average TyDi QA across all three model sizes, and it beats temperature sampl</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#6EE7B7"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">TyDi QA &amp; WMT21</text><text x="679.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Wins average TyDi QA at all three sizes,</text><text x="679.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">and WMT21 at every scale.</text><text x="679.0" y="278.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#63788F" text-anchor="start">TyDi QA (½ budget, Large)</text><text x="679.0" y="303.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">UniMax</text><rect x="807.0" y="286.0" width="323.0" height="24.0" rx="12.0" fill="#22304A"/><rect x="807.0" y="286.0" width="319.5" height="24.0" rx="12.0" fill="#6EE7B7"/><text x="1136.5392857142856" y="303.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">83.1</text><text x="679.0" y="339.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">τ=3.33</text><rect x="807.0" y="322.0" width="323.0" height="24.0" rx="12.0" fill="#22304A"/><rect x="807.0" y="322.0" width="318.4" height="24.0" rx="12.0" fill="#4EA1FF"/><text x="1135.3857142857141" y="339.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">82.8</text><text x="679.0" y="375.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#9FB2C6" text-anchor="start">τ=1</text><rect x="807.0" y="358.0" width="323.0" height="24.0" rx="12.0" fill="#22304A"/><rect x="807.0" y="358.0" width="312.2" height="24.0" rx="12.0" fill="#63788F"/><text x="1129.2333333333333" y="375.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="800" fill="#E8EEF7" text-anchor="start">81.2</text></g><g id="cue_s07_c3_high_resource_languages_beats_tau_eq" data-cue-label="cue_s07_c3_high_resource_languages_beats_tau_eq"><title>high-resource languages beats tau equals three point three three only</title><desc>On high-resource languages it beats tau equals three point three three, and only trails tau equals one at the very largest scale.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">HIGH-RESOURCE</text><text x="90.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Beats tau=3.33, and only trails tau=1 at</text><text x="90.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">the very largest scale.</text></g><g id="cue_s07_c4_low_resource_languages_wins_outright" data-cue-label="cue_s07_c4_low_resource_languages_wins_outright"><title>low-resource languages wins outright even outperforming tau equals three point</title><desc>On low-resource languages it wins outright, even outperforming tau equals three point three three on Swahili despite seeing fewer Swahili examples.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#6EE7B7"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">LOW-RESOURCE</text><text x="679.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Wins outright, e.g. beats tau=3.33 on</text><text x="679.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Swahili despite seeing fewer Swahili</text><text x="679.0" y="548.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">examples.</text></g>
