d mC4 has twenty-nine trillion characters across one hundred seven languages, a thirty-five percent size increase.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">REFRESHED mC4</text><text x="679.0" y="240.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8EEF7" text-anchor="start">29T</text><text x="679.0" y="266.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9FB2C6" text-anchor="start">chars · 107 languages</text><text x="679.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">+35% larger, about 9.0 billion</text><text x="679.0" y="312.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">documents.</text></g><g id="cue_s09_c3_tydi_larger_budget_unimax_scores" data-cue-label="cue_s09_c3_tydi_larger_budget_unimax_scores"><title>tydi larger budget unimax scores eighty-three point one ahead both</title><desc>On TyDi QA at the larger budget, UniMax scores eighty-three point one, ahead of both baselines. The umT5 XXL checkpoint beats the earlier mT5 XXL on TyDi QA.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#6EE7B7"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">TyDi QA (½ budget)</text><text x="90.0" y="520.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8EEF7" text-anchor="start">83.1</text><text x="90.0" y="546.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9FB2C6" text-anchor="start">UniMax vs 82.8 (τ=3.33) vs 81.2 (τ=1)</text><text x="90.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">umT5-XXL also beats mT5-XXL on TyDi QA.</text></g><g id="cue_s09_c4_remember_tau_equals_three_point" data-cue-label="cue_s09_c4_remember_tau_equals_three_point"><title>remember tau equals three point three three lowest-resource languages being</title><desc>And remember, at tau equals three point three three, the lowest-resource languages were being repeated more than a hundred times over.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">WHAT THE CAP REMOVES</text><text x="679.0" y="520.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8EEF7" text-anchor="start">&gt;100×</text><text x="679.0" y="546.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9FB2C6" text-anchor="start">tail repeats at τ=3.33</text><text x="679.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">Exactly what UniMax&#x27;s per-language cap</text><text x="679.0" y="592.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9FB2C6" text-anchor="start">eliminates.</text></g>
