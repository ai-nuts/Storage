<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0F1626"/><rect x="64" y="126" width="1152" height="1.5" fill="#2B3B57"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#4EA1FF"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8EEF7" text-anchor="start">Four contributions</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#63788F" text-anchor="end" letter-spacing="1.5">04 / 10</text><g id="cue_s04_c1_unimax_makes_four_contributions_firs" data-cue-label="cue_s04_c1_unimax_makes_four_contributions_firs"><title>unimax makes four contributions first method itself which allocates budget</title><desc>UniMax makes four contributions. First, the method itself, which allocates the training budget uniformly while capping how many times any single language repeats.</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><circle cx="106.0" cy="192.0" r="20" fill="none" stroke="#4EA1FF" stroke-width="2"/><text x="106.0" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#4EA1FF" text-anchor="middle">1</text><text x="142.0" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">THE METHOD</text><text x="142.0" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">UniMax: allocate the budget uniformly</text><text x="142.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">while capping per-language repeats.</text></g><g id="cue_s04_c2_second_extensive_ablation_sampling_s" data-cue-label="cue_s04_c2_second_extensive_ablation_sampling_s"><title>second extensive ablation sampling strategies run across scales systematic study</title><desc>Second, an extensive ablation of sampling strategies run across model scales, the systematic study the field had been missing.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#6EE7B7"/><circle cx="695.0" cy="192.0" r="20" fill="none" stroke="#6EE7B7" stroke-width="2"/><text x="695.0" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#6EE7B7" text-anchor="middle">2</text><text x="731.0" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#6EE7B7" text-anchor="start" letter-spacing="2">SYSTEMATIC STUDY</text><text x="731.0" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">Extensive ablation of sampling</text><text x="731.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">strategies run across model scales.</text></g><g id="cue_s04_c3_third_refreshed_mc4_corpus_twenty_ni" data-cue-label="cue_s04_c3_third_refreshed_mc4_corpus_twenty_ni"><title>third refreshed mc4 corpus twenty-nine trillion characters spanning one hundred</title><desc>Third, a refreshed mC4 corpus of twenty-nine trillion characters spanning one hundred seven languages.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><circle cx="106.0" cy="472.0" r="20" fill="none" stroke="#FBBF24" stroke-width="2"/><text x="106.0" y="479.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#FBBF24" text-anchor="middle">3</text><text x="142.0" y="466.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">REFRESHED CORPUS</text><text x="142.0" y="492.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">A new mC4 of 29 trillion characters</text><text x="142.0" y="515.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">across 107 languages.</text></g><g id="cue_s04_c4_fourth_released_umt5_checkpoints_tra" data-cue-label="cue_s04_c4_fourth_released_umt5_checkpoints_tra"><title>fourth released umt5 checkpoints trained unimax practitioners build work directly</title><desc>And fourth, released umT5 checkpoints trained with UniMax, so practitioners can build on this work directly.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#1A2438" stroke="#2B3B57" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#4EA1FF"/><circle cx="695.0" cy="472.0" r="20" fill="none" stroke="#4EA1FF" stroke-width="2"/><text x="695.0" y="479.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#4EA1FF" text-anchor="middle">4</text><text x="731.0" y="466.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#4EA1FF" text-anchor="start" letter-spacing="2">OPEN CHECKPOINTS</text><text x="731.0" y="492.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">Released umT5 checkpoints trained with</text><text x="731.0" y="515.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8EEF7" text-anchor="start">UniMax to build on directly.</text></g>
