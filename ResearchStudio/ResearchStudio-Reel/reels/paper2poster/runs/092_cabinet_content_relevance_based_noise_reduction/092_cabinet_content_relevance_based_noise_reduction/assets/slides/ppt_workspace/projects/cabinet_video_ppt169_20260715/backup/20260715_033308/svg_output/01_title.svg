<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>

  <!-- Kicker -->
  <text x="70" y="86" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#0F766E">ICLR 2024  ·  ADOBE MDSR LAB  ×  IIT KHARAGPUR  ×  IIT ROORKEE</text>

  <!-- Title block -->
  <g id="cue_s01_c1_cabinet_framework_table_question_ans">
    <title>CABINET framework for table question answering</title>
    <desc>CABINET framework table question answering published ICLR 2024 researchers Adobe MDSR IIT Kharagpur Roorkee</desc>
    <text x="68" y="196" font-family="Arial, sans-serif" font-size="82" font-weight="800" fill="#16305B">CABINET</text>
    <text x="72" y="238" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#52627A">Content Relevance-Based Noise Reduction for Table Question Answering</text>
  </g>

  <!-- Tagline points -->
  <g id="cue_s01_c2_large_language_models_reason_over">
    <title>Large language models reason over tables but only a few cells matter</title>
    <desc>large language models reason over tables but only a few cells matter irrelevant cells act as noise hurts accuracy</desc>
    <rect x="70" y="300" width="34" height="34" rx="8" fill="#EEF3FA"/>
    <path d="M78 317 L86 325 L98 308" stroke="#16305B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="315" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">LLMs reason over tables, but only a few cells matter</text>
    <text x="120" y="341" font-family="Arial, sans-serif" font-size="17" fill="#52627A">the irrelevant cells act as noise that hurts accuracy</text>
  </g>

  <g id="cue_s01_c3_cabinet_tackles_teaching_focus_relev">
    <title>CABINET teaches the model to focus on relevant content and suppress the rest</title>
    <desc>cabinet tackles teaching model focus relevant table content suppress rest rather than deleting parts outright</desc>
    <rect x="70" y="368" width="34" height="34" rx="8" fill="#FDF3E0"/>
    <path d="M78 385 L86 393 L98 376" stroke="#F59E0B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="383" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0F172A">Focus on relevant cells, suppress the rest</text>
    <text x="120" y="409" font-family="Arial, sans-serif" font-size="17" fill="#52627A">soft relevance weighting instead of deleting parts of the table</text>
  </g>

  <g id="cue_s01_c4_sets_new_state_art_three">
    <title>Sets new state of the art on three challenging table QA benchmarks</title>
    <desc>sets new state of the art three challenging table QA benchmarks WikiTQ FeTaQA WikiSQL</desc>
    <rect x="70" y="440" width="470" height="52" rx="10" fill="#16305B"/>
    <text x="94" y="473" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">New state of the art on 3 table QA benchmarks</text>
  </g>

  <!-- Right hero: relevance meter -->
  <rect x="864" y="118" width="352" height="392" rx="16" fill="#F5F8FC" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="890" y="156" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#16305B">UNSUPERVISED RELEVANCE SCORE</text>
  <text x="890" y="180" font-family="Arial, sans-serif" font-size="13" fill="#52627A">high = relevant   ·   low = noise</text>
  <!-- rows -->
  <g id="relevance_meter_rows" font-family="Arial, sans-serif">
    <rect x="890" y="200" width="120" height="20" rx="4" fill="#E4EAF2"/>
    <rect x="1018" y="200" width="172" height="20" rx="10" fill="#E4EAF2"/><rect x="1018" y="200" width="150" height="20" rx="10" fill="url(#amberBar)"/>
    <rect x="890" y="230" width="120" height="20" rx="4" fill="#E4EAF2"/>
    <rect x="1018" y="230" width="172" height="20" rx="10" fill="#E4EAF2"/><rect x="1018" y="230" width="40" height="20" rx="10" fill="#C7D2DE"/>
    <rect x="890" y="260" width="120" height="20" rx="4" fill="#FDF3E0"/>
    <rect x="1018" y="260" width="172" height="20" rx="10" fill="#E4EAF2"/><rect x="1018" y="260" width="164" height="20" rx="10" fill="url(#amberBar)"/>
    <rect x="890" y="290" width="120" height="20" rx="4" fill="#E4EAF2"/>
    <rect x="1018" y="290" width="172" height="20" rx="10" fill="#E4EAF2"/><rect x="1018" y="290" width="30" height="20" rx="10" fill="#C7D2DE"/>
    <rect x="890" y="320" width="120" height="20" rx="4" fill="#FDF3E0"/>
    <rect x="1018" y="320" width="172" height="20" rx="10" fill="#E4EAF2"/><rect x="1018" y="320" width="140" height="20" rx="10" fill="url(#amberBar)"/>
    <rect x="890" y="350" width="120" height="20" rx="4" fill="#E4EAF2"/>
    <rect x="1018" y="350" width="172" height="20" rx="10" fill="#E4EAF2"/><rect x="1018" y="350" width="52" height="20" rx="10" fill="#C7D2DE"/>
  </g>
  <text x="890" y="404" font-family="Arial, sans-serif" font-size="13" fill="#52627A">Every cell kept — relevant rows weighted higher,</text>
  <text x="890" y="424" font-family="Arial, sans-serif" font-size="13" fill="#52627A">noise softly suppressed, nothing deleted.</text>
  <!-- QR tiles -->
  <image href="../images/qr_paper.png" x="892" y="440" width="52" height="52"/>
  <text x="952" y="458" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#16305B">Paper</text>
  <text x="952" y="474" font-family="Arial, sans-serif" font-size="11" fill="#52627A">arxiv.org/abs/2402.01155</text>
  <image href="../images/qr_code.png" x="1060" y="440" width="52" height="52"/>
  <text x="1120" y="458" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#16305B">Code</text>
  <text x="1120" y="474" font-family="Arial, sans-serif" font-size="11" fill="#52627A">github.com/</text>
  <text x="1120" y="488" font-family="Arial, sans-serif" font-size="11" fill="#52627A">Sohanpatnaik106</text>

  <!-- Authors + logos footer -->
  <text x="70" y="556" font-family="Arial, sans-serif" font-size="16" fill="#52627A">Sohan Patnaik, Heril Changwal, Milan Aggarwal, Sumit Bhatia, Yaman Kumar Singla, Balaji Krishnamurthy</text>
  <line x1="70" y1="592" x2="1210" y2="592" stroke="#DCE3ED" stroke-width="1.5"/>
  <image href="../images/logo_adobe.png" x="70" y="612" width="52" height="72"/>
  <image href="../images/logo_iitkgp.png" x="150" y="632" width="220" height="44"/>
  <image href="../images/logo_iitr.png" x="400" y="640" width="180" height="37"/>
  <text x="1210" y="672" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · ICLR 2024      01 / 10</text>
</svg>
