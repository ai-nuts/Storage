<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">ABLATION STUDY</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">Both Parts Matter</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <g id="cue_s08_c1_ablations_confirm_both_components_ne">
    <title>Ablations confirm both components are needed</title>
    <desc>ablations confirm both components are needed unsupervised scorer and parsing statement module</desc>
    <rect x="60" y="146" width="1150" height="58" rx="12" fill="#16305B"/>
    <text x="86" y="183" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Ablations confirm both components are needed (accuracy on WikiTQ)</text>
  </g>

  <!-- c2: URS losses -->
  <g id="cue_s08_c2_unsupervised_relevance_scorer_applyi">
    <title>Applying clustering, separation and sparsification losses together lifts accuracy from 60.8 to 65.6</title>
    <desc>unsupervised relevance scorer applying clustering centroid-separation sparsification losses together lifts wikitq accuracy sixty point eight to sixty-five point six any subset little benefit only help in combination</desc>
    <rect x="60" y="224" width="356" height="436" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="60" y="224" width="356" height="8" rx="4" fill="#F59E0B"/>
    <text x="86" y="268" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#16305B">URS structuring losses</text>
    <text x="86" y="292" font-family="Arial, sans-serif" font-size="14" fill="#52627A">clustering + separation + sparsification</text>
    <!-- bar chart -->
    <text x="150" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627A">no losses</text>
    <rect x="110" y="470" width="80" height="118" rx="6" fill="#C7D2DE"/>
    <text x="150" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#52627A">60.8</text>
    <text x="326" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#B45309">all three</text>
    <rect x="286" y="360" width="80" height="228" rx="6" fill="#F59E0B"/>
    <text x="326" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#B45309">65.6</text>
    <path d="M200 420 L280 372" stroke="#15803D" stroke-width="2.5" fill="none"/>
    <text x="86" y="636" font-family="Arial, sans-serif" font-size="14" fill="#334155">Any subset gives little benefit &#8212; the</text>
    <text x="86" y="654" font-family="Arial, sans-serif" font-size="14" fill="#334155">three only help in combination.</text>
  </g>

  <!-- c3: fusion weights -->
  <g id="cue_s08_c3_two_relevance_signals_fusing_unsuper">
    <title>Fusing unsupervised score at 0.7 with cell-based at 0.3 is optimal, reaching 69.1</title>
    <desc>two relevance signals fusing unsupervised score weight zero point seven cell-based score weight zero point three optimal giving sixty-nine point one percent wikitq beats either alone</desc>
    <rect x="440" y="224" width="356" height="436" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="440" y="224" width="356" height="8" rx="4" fill="#0F766E"/>
    <text x="466" y="268" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#16305B">Fusing the two signals</text>
    <text x="466" y="292" font-family="Arial, sans-serif" font-size="14" fill="#52627A">optimal mix of relevance scores</text>
    <!-- ratio bar -->
    <rect x="466" y="330" width="304" height="44" rx="8" fill="#0F766E"/>
    <rect x="466" y="330" width="213" height="44" rx="8" fill="#F59E0B"/>
    <text x="572" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">&#955;_uns = 0.7</text>
    <text x="724" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">0.3</text>
    <text x="466" y="400" font-family="Arial, sans-serif" font-size="13" fill="#52627A">unsupervised &#183; cell-based</text>
    <rect x="466" y="424" width="304" height="120" rx="12" fill="#F5F8FC"/>
    <text x="618" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="800" fill="#16305B">69.1</text>
    <text x="618" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52627A">best WikiTQ accuracy</text>
    <text x="466" y="592" font-family="Arial, sans-serif" font-size="14" fill="#334155">Beats using either relevance</text>
    <text x="466" y="610" font-family="Arial, sans-serif" font-size="14" fill="#334155">signal on its own.</text>
  </g>

  <!-- c4: cell-only collapse -->
  <g id="cue_s08_c4_relying_cell_based_signal_alone_coll">
    <title>Relying on the cell-based signal alone collapses accuracy to 37.6</title>
    <desc>relying on cell-based signal alone lambda uns zero collapses accuracy thirty-seven point six percent confirming unsupervised scorer primary driver parsing-statement complementary aid</desc>
    <rect x="820" y="224" width="390" height="436" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="820" y="224" width="390" height="8" rx="4" fill="#DC2626"/>
    <text x="846" y="268" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#16305B">Cell-based signal alone</text>
    <text x="846" y="292" font-family="Arial, sans-serif" font-size="14" fill="#52627A">&#955;_uns = 0 &#8212; drop the URS</text>
    <rect x="846" y="330" width="338" height="150" rx="12" fill="#FCEBEA"/>
    <text x="1015" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="800" fill="#DC2626">37.6</text>
    <text x="1015" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#B91C1C">accuracy collapses</text>
    <text x="846" y="520" font-family="Arial, sans-serif" font-size="15" fill="#334155">The unsupervised scorer is the</text>
    <text x="846" y="542" font-family="Arial, sans-serif" font-size="15" fill="#334155">primary driver; the parsing-</text>
    <text x="846" y="564" font-family="Arial, sans-serif" font-size="15" fill="#334155">statement module is a</text>
    <text x="846" y="586" font-family="Arial, sans-serif" font-size="15" fill="#334155">complementary aid.</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">08 / 10</text>
</svg>
