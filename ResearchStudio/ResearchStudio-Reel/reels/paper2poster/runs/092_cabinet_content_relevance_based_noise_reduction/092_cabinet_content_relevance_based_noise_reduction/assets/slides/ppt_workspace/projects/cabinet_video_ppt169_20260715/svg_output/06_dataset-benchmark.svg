<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">DATASET / BENCHMARK</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">Benchmarks &amp; Data</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <g id="cue_s06_c1_cabinet_evaluated_three_challenging">
    <title>CABINET is evaluated on three challenging table question-answering benchmarks</title>
    <desc>cabinet evaluated on three challenging table question-answering benchmarks WikiTQ WikiSQL FeTaQA</desc>
    <rect x="60" y="146" width="1150" height="60" rx="12" fill="#16305B"/>
    <text x="86" y="184" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Evaluated on three challenging table QA benchmarks</text>
  </g>

  <!-- WikiTQ card (c2) -->
  <g id="cue_s06_c2_wikitablequestions_wikitq_requires_c">
    <title>WikiTQ requires compositional reasoning with short answers scored by exact-match accuracy</title>
    <desc>wikitablequestions wikitq requires compositional reasoning over tables short one-to-two-word answers scored by exact-match accuracy most complex</desc>
    <rect x="60" y="230" width="366" height="220" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="60" y="230" width="366" height="8" rx="4" fill="#16305B"/>
    <text x="86" y="282" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#16305B">WikiTQ</text>
    <rect x="86" y="298" width="180" height="30" rx="15" fill="#EEF3FA"/>
    <text x="176" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16305B">Exact-Match Accuracy</text>
    <text x="86" y="360" font-family="Arial, sans-serif" font-size="15" fill="#334155">Compositional reasoning over</text>
    <text x="86" y="382" font-family="Arial, sans-serif" font-size="15" fill="#334155">tables; short 1&#8211;2 word answers.</text>
    <text x="86" y="420" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F766E">Among the most complex table QA sets</text>
  </g>

  <!-- WikiSQL + FeTaQA (c3) -->
  <g id="cue_s06_c3_wikisql_similarly_exact_match_accura">
    <title>WikiSQL uses exact-match accuracy; FeTaQA uses Sacre-BLEU for long free-form answers</title>
    <desc>wikisql similarly uses exact-match accuracy fetaqa asks long free-form descriptive answers scored with sacre-bleu</desc>
    <rect x="444" y="230" width="366" height="220" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="444" y="230" width="366" height="8" rx="4" fill="#0F766E"/>
    <text x="470" y="282" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#16305B">WikiSQL</text>
    <rect x="470" y="298" width="180" height="30" rx="15" fill="#E4F1EF"/>
    <text x="560" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F766E">Exact-Match Accuracy</text>
    <text x="470" y="360" font-family="Arial, sans-serif" font-size="15" fill="#334155">Large-scale SQL-style</text>
    <text x="470" y="382" font-family="Arial, sans-serif" font-size="15" fill="#334155">table questions.</text>

    <rect x="828" y="230" width="382" height="220" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="828" y="230" width="382" height="8" rx="4" fill="#F59E0B"/>
    <text x="854" y="282" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#16305B">FeTaQA</text>
    <rect x="854" y="298" width="150" height="30" rx="15" fill="#FDF3E0"/>
    <text x="929" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">Sacre-BLEU</text>
    <text x="854" y="360" font-family="Arial, sans-serif" font-size="15" fill="#334155">Long, free-form descriptive</text>
    <text x="854" y="382" font-family="Arial, sans-serif" font-size="15" fill="#334155">answers over tables.</text>
  </g>

  <!-- Released data (c4) -->
  <g id="cue_s06_c4_authors_additionally_release_small_d">
    <title>Authors release about 300 manually written parsing statements to bootstrap the weakly-supervised module</title>
    <desc>authors additionally release small dataset about three hundred manually written parsing statements used to bootstrap weakly-supervised cell-highlighting module</desc>
    <rect x="60" y="470" width="1150" height="132" rx="14" fill="#F5F8FC" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="84" y="494" width="150" height="84" rx="12" fill="#16305B"/>
    <text x="159" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#FBBF24">~300</text>
    <text x="159" y="564" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#BFD0E8">annotations</text>
    <text x="262" y="524" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#16305B">A released dataset of manually written parsing statements</text>
    <text x="262" y="556" font-family="Arial, sans-serif" font-size="16" fill="#52627A">Used to bootstrap the weakly-supervised cell-highlighting module — a small, one-time labeling cost.</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">06 / 10</text>
</svg>
