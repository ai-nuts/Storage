<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">KEY RESULT</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">New State of the Art</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <g id="cue_s07_c1_cabinet_establishes_new_state_art">
    <title>CABINET establishes new state of the art on all three benchmarks</title>
    <desc>cabinet establishes new state of the art on all three benchmarks WikiTQ FeTaQA WikiSQL</desc>
    <rect x="60" y="146" width="1150" height="58" rx="12" fill="#16305B"/>
    <text x="86" y="183" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">New state of the art on all three benchmarks &#8212; with a compact 560M model</text>
  </g>

  <!-- WikiTQ hero + baselines (c2) -->
  <g id="cue_s07_c2_wikitq_reaches_sixty_nine_point_one">
    <title>WikiTQ reaches 69.1% exact-match accuracy, beating OmniTab, DATER and Flan T5-xl</title>
    <desc>wikitq reaches sixty-nine point one percent exact-match accuracy outperforming strongest baseline omnitab dater fine-tuned flan t5-xl by six point four three point two four point seven beats gpt-3 codex in-context learning</desc>
    <rect x="60" y="224" width="560" height="436" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="86" y="264" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#52627A">WikiTQ &#183; exact-match accuracy</text>
    <text x="86" y="344" font-family="Arial, sans-serif" font-size="86" font-weight="800" fill="#16305B">69.1%</text>
    <rect x="360" y="300" width="150" height="34" rx="17" fill="#E7F2EC"/>
    <text x="435" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#15803D">new SoTA</text>
    <text x="86" y="392" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#94A3B8">ABSOLUTE GAIN OVER BEST BASELINES</text>
    <!-- delta bars -->
    <text x="86" y="424" font-family="Arial, sans-serif" font-size="15" fill="#334155">OmniTab</text>
    <rect x="230" y="410" width="300" height="18" rx="9" fill="#EEF3FA"/><rect x="230" y="410" width="256" height="18" rx="9" fill="#F59E0B"/>
    <text x="540" y="424" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">+6.4</text>
    <text x="86" y="456" font-family="Arial, sans-serif" font-size="15" fill="#334155">Flan T5-xl</text>
    <rect x="230" y="442" width="300" height="18" rx="9" fill="#EEF3FA"/><rect x="230" y="442" width="188" height="18" rx="9" fill="#F59E0B"/>
    <text x="540" y="456" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">+4.7</text>
    <text x="86" y="488" font-family="Arial, sans-serif" font-size="15" fill="#334155">DATER</text>
    <rect x="230" y="474" width="300" height="18" rx="9" fill="#EEF3FA"/><rect x="230" y="474" width="128" height="18" rx="9" fill="#F59E0B"/>
    <text x="540" y="488" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B45309">+3.2</text>
    <rect x="86" y="516" width="508" height="120" rx="12" fill="#F5F8FC"/>
    <text x="106" y="552" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16305B">Beats the strongest baseline in every category</text>
    <text x="106" y="580" font-family="Arial, sans-serif" font-size="15" fill="#52627A">including much larger GPT-3 and Codex based</text>
    <text x="106" y="602" font-family="Arial, sans-serif" font-size="15" fill="#52627A">in-context learning methods.</text>
  </g>

  <!-- FeTaQA + WikiSQL (c3) -->
  <g id="cue_s07_c3_fetaqa_achieves_sacre_bleu_forty_poi">
    <title>FeTaQA reaches 40.5 Sacre-BLEU and WikiSQL reaches 89.5% accuracy</title>
    <desc>fetaqa achieves sacre-bleu forty point five wikisql reaches eighty-nine point five percent accuracy pushing past previous best</desc>
    <rect x="648" y="224" width="562" height="270" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="674" y="252" width="238" height="212" rx="12" fill="#FDF3E0"/>
    <text x="793" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#B45309">FeTaQA</text>
    <text x="793" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#92400E"></text>
    <text x="793" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#16305B">40.5</text>
    <text x="793" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#92400E">Sacre-BLEU</text>
    <text x="793" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">new SoTA</text>
    <rect x="946" y="252" width="238" height="212" rx="12" fill="#E4F1EF"/>
    <text x="1065" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">WikiSQL</text>
    <text x="1065" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#16305B">89.5%</text>
    <text x="1065" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#115E59">accuracy</text>
    <text x="1065" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">new SoTA</text>
  </g>

  <!-- 560M (c4) -->
  <g id="cue_s07_c4_notably_all_achieved_compact_five">
    <title>All achieved with a compact 560M parameter model</title>
    <desc>notably all of this achieved compact five hundred sixty million parameter model</desc>
    <rect x="648" y="512" width="562" height="148" rx="14" fill="#16305B"/>
    <text x="674" y="566" font-family="Arial, sans-serif" font-size="60" font-weight="800" fill="#FBBF24">560M</text>
    <text x="924" y="556" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">parameters</text>
    <text x="924" y="586" font-family="Arial, sans-serif" font-size="15" fill="#BFD0E8">OmniTab backbone — beats far</text>
    <text x="924" y="608" font-family="Arial, sans-serif" font-size="15" fill="#BFD0E8">larger GPT-3 / Codex methods</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">07 / 10</text>
</svg>
