<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">PROBLEM</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">Noise in Table Question Answering</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <!-- Left: table illustration -->
  <g id="cue_s02_c1_tables_organize_information_across_r">
    <title>Tables organize rows and columns but only a few cells contain the answer</title>
    <desc>tables organize information across rows columns but any single question only small number cells contain the answer</desc>
    <rect x="60" y="150" width="548" height="304" rx="14" fill="#F5F8FC" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="84" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#16305B">Q: Highest points an opponent scored in a lost game?</text>
    <!-- header -->
    <rect x="84" y="200" width="500" height="40" fill="#16305B"/>
    <text x="98" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">week</text>
    <text x="176" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">opponent</text>
    <text x="424" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">score</text>
    <text x="512" y="225" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">result</text>
    <!-- rows -->
    <rect x="84" y="240" width="500" height="40" fill="#FFFFFF"/>
    <text x="98" y="265" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">1</text>
    <text x="176" y="265" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">toronto argonauts</text>
    <text x="424" y="265" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">13-6</text>
    <text x="512" y="265" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">win</text>
    <rect x="84" y="280" width="500" height="40" fill="#E7F2EC"/>
    <text x="98" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">6</text>
    <text x="176" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">hamilton tiger-cats</text>
    <text x="424" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">45-0</text>
    <text x="512" y="305" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">loss</text>
    <rect x="84" y="320" width="500" height="40" fill="#FFFFFF"/>
    <text x="98" y="345" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">7</text>
    <text x="176" y="345" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">montreal alouettes</text>
    <text x="424" y="345" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">25-11</text>
    <text x="512" y="345" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">loss</text>
    <rect x="84" y="360" width="500" height="40" fill="#FFFFFF"/>
    <text x="98" y="385" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">13</text>
    <text x="176" y="385" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">montreal alouettes</text>
    <text x="424" y="385" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">14-12</text>
    <text x="512" y="385" font-family="Arial, sans-serif" font-size="14" fill="#C7D2DE">win</text>
    <rect x="84" y="200" width="500" height="200" fill="none" stroke="#C7D2DE" stroke-width="1"/>
    <text x="84" y="430" font-family="Arial, sans-serif" font-size="15" fill="#15803D" font-weight="700">1 answer cell</text>
    <text x="230" y="430" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">· dozens of irrelevant cells</text>
  </g>

  <g id="cue_s02_c2_everything_else_irrelevant_question">
    <title>Everything else is irrelevant to the question and behaves like noise</title>
    <desc>everything else irrelevant to that question behaves like noise distracting content</desc>
    <rect x="60" y="472" width="548" height="58" rx="12" fill="#FDF3E0" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="84" y="498" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#B45309">Everything else = noise</text>
    <text x="84" y="519" font-family="Arial, sans-serif" font-size="14" fill="#92400E">irrelevant cells distract the model away from the answer</text>
  </g>

  <!-- Right column -->
  <g id="cue_s02_c3_large_language_models_known_suscepti">
    <title>LLMs are susceptible to distracting information and degrade as tables grow larger</title>
    <desc>large language models known susceptible distracting information table reasoning degrades worse as tables grow larger more irrelevant content</desc>
    <rect x="648" y="150" width="562" height="256" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="676" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#16305B">LLMs are vulnerable to noise</text>
    <text x="676" y="216" font-family="Arial, sans-serif" font-size="16" fill="#52627A">Reasoning quality drops with distracting cells —</text>
    <text x="676" y="238" font-family="Arial, sans-serif" font-size="16" fill="#52627A">and the drop worsens as tables grow larger.</text>
    <!-- accuracy vs table size bars -->
    <text x="676" y="276" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#94A3B8">ACCURACY  vs  TABLE SIZE</text>
    <rect x="676" y="290" width="120" height="80" rx="6" fill="#E4EAF2"/><rect x="676" y="290" width="120" height="80" rx="6" fill="#16305B"/>
    <text x="736" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">high</text>
    <text x="736" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627A">small table</text>
    <rect x="816" y="322" width="120" height="48" rx="6" fill="#94A3B8"/>
    <text x="876" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">lower</text>
    <text x="876" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#52627A">large table</text>
    <path d="M956 300 L1180 300" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
    <path d="M956 300 L1120 360" stroke="#DC2626" stroke-width="3" fill="none"/>
    <text x="1076" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#DC2626">degrades</text>
  </g>

  <g id="cue_s02_c4_cabinet_built_address_exactly_vulner">
    <title>CABINET is built to address exactly this vulnerability</title>
    <desc>cabinet built to address exactly this vulnerability irrelevant table content noise</desc>
    <rect x="648" y="430" width="562" height="100" rx="14" fill="#16305B"/>
    <text x="676" y="474" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">CABINET is built to address this vulnerability</text>
    <text x="676" y="504" font-family="Arial, sans-serif" font-size="16" fill="#BFD0E8">teach the model what to focus on — without deleting the table</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">02 / 10</text>
</svg>
