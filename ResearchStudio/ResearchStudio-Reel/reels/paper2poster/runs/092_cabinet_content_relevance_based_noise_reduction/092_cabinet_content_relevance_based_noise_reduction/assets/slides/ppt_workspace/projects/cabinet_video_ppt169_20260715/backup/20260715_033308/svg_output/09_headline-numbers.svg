<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">HEADLINE NUMBERS</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">By the Numbers</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <g id="cue_s09_c1_headline_numbers_sixty_nine_point_on">
    <title>69.1% on WikiTQ, 40.5 Sacre-BLEU on FeTaQA, 89.5% on WikiSQL, each new SoTA with 560M parameters</title>
    <desc>headline numbers sixty-nine point one percent accuracy wikitq sacre-bleu forty point five fetaqa eighty-nine point five percent accuracy wikisql each new state of the art just five hundred sixty million parameters</desc>
    <rect x="60" y="150" width="268" height="200" rx="14" fill="#16305B"/>
    <text x="194" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">69.1%</text>
    <text x="194" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FBBF24">WikiTQ</text>
    <text x="194" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#BFD0E8">exact-match accuracy</text>
    <text x="194" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#93B4E0">new SoTA</text>

    <rect x="354" y="150" width="268" height="200" rx="14" fill="#F5F8FC" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="488" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#16305B">40.5</text>
    <text x="488" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#B45309">FeTaQA</text>
    <text x="488" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627A">Sacre-BLEU</text>
    <text x="488" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#15803D">new SoTA</text>

    <rect x="648" y="150" width="268" height="200" rx="14" fill="#F5F8FC" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="782" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#16305B">89.5%</text>
    <text x="782" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">WikiSQL</text>
    <text x="782" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627A">exact-match accuracy</text>
    <text x="782" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#15803D">new SoTA</text>

    <rect x="942" y="150" width="268" height="200" rx="14" fill="#0F766E"/>
    <text x="1076" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">560M</text>
    <text x="1076" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#FBBF24">parameters</text>
    <text x="1076" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#CFF0EA">OmniTab backbone</text>
    <text x="1076" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#CFF0EA">compact model</text>
  </g>

  <g id="cue_s09_c2_beyond_raw_accuracy_cabinet_markedly">
    <title>CABINET is markedly more robust to table perturbations, with ~11.5% smaller drop than OmniTab, and holds its lead as tables grow</title>
    <desc>beyond raw accuracy cabinet markedly more robust under table perturbations row column permutation cell replacement degrades far less than baselines roughly eleven and a half percent smaller performance drop than omnitab wikitq holds advantage as tables grow larger</desc>
    <rect x="60" y="372" width="1150" height="288" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="86" y="414" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#16305B">Not just accurate &#8212; markedly more robust</text>
    <text x="86" y="444" font-family="Arial, sans-serif" font-size="16" fill="#52627A">Under row/column permutation and cell replacement, CABINET degrades far less than baselines.</text>
    <!-- perturbation drop comparison -->
    <text x="86" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#94A3B8">PERFORMANCE DROP UNDER PERTURBATION (WikiTQ) &#8212; smaller is better</text>
    <text x="86" y="528" font-family="Arial, sans-serif" font-size="16" fill="#334155">OmniTab</text>
    <rect x="230" y="514" width="720" height="24" rx="12" fill="#EEF3FA"/><rect x="230" y="514" width="560" height="24" rx="12" fill="#DC2626"/>
    <text x="806" y="532" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B91C1C">larger drop</text>
    <text x="86" y="568" font-family="Arial, sans-serif" font-size="16" fill="#334155">CABINET</text>
    <rect x="230" y="554" width="720" height="24" rx="12" fill="#EEF3FA"/><rect x="230" y="554" width="330" height="24" rx="12" fill="#15803D"/>
    <text x="576" y="572" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15803D">~11.5% smaller drop</text>
    <rect x="986" y="486" width="200" height="150" rx="12" fill="#F5F8FC"/>
    <text x="1086" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#16305B">Scales with size</text>
    <text x="1086" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627A">Holds its advantage</text>
    <text x="1086" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627A">as tables grow</text>
    <text x="1086" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#52627A">larger.</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">09 / 10</text>
</svg>
