<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748B"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#DC2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#15803D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">MOTIVATION</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">Why Not Just Shrink the Table?</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <!-- Shared input -->
  <rect x="70" y="318" width="168" height="112" rx="14" fill="#F5F8FC" stroke="#16305B" stroke-width="2"/>
  <text x="154" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#16305B">Question</text>
  <text x="154" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#16305B">+ full Table</text>
  <path d="M238 350 C 268 300, 268 240, 300 226" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#arrGray)"/>
  <path d="M238 400 C 268 452, 268 494, 300 480" stroke="#15803D" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/>

  <!-- TOP LANE: DATER -->
  <text x="300" y="168" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#DC2626">HARD DECOMPOSITION  (e.g. DATER)</text>
  <g id="cue_s03_c1_natural_way_reduce_noise_shrink">
    <title>Shrink the table first by decomposing it into a smaller sub-table</title>
    <desc>natural way reduce noise shrink table before answering methods like DATER decomposing table into smaller sub-table</desc>
    <rect x="300" y="186" width="300" height="86" rx="12" fill="#FCEBEA" stroke="#DC2626" stroke-width="1.5"/>
    <text x="316" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#B91C1C">Decompose &#8594; sub-table</text>
    <text x="316" y="248" font-family="Arial, sans-serif" font-size="15" fill="#7F1D1D">cut the table down before answering</text>
  </g>
  <path d="M600 229 L646 229" stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="648" y="196" width="120" height="66" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <text x="708" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#B91C1C">Reasoner</text>
  <path d="M768 229 L806 229" stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#arrRed)"/>
  <g id="cue_s03_c2_trouble_hard_decomposition_unforgivi">
    <title>Hard decomposition is unforgiving: wrong sub-table loses information and answers incorrectly</title>
    <desc>trouble hard decomposition unforgiving wrong sub-table extracted useful information permanently lost reasoner answers incorrectly no way to recover</desc>
    <rect x="808" y="176" width="352" height="106" rx="12" fill="#16305B"/>
    <text x="832" y="216" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#FCA5A5">Answer 38</text>
    <text x="980" y="216" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#DC2626">&#10007;</text>
    <text x="832" y="246" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">Wrong sub-table &#8594; useful information</text>
    <text x="832" y="266" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">permanently lost, no way to recover.</text>
  </g>

  <!-- BOTTOM LANE: CABINET -->
  <text x="300" y="418" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#15803D">SOFT RELEVANCE WEIGHTING  (CABINET)</text>
  <g id="cue_s03_c3_cabinet_argues_softer_approach_weigh">
    <title>CABINET weighs relevant parts higher without removing content, keeping the whole table</title>
    <desc>cabinet argues softer approach weighs relevant parts higher without ever explicitly removing content answering model retains access whole table steered toward what matters</desc>
    <rect x="300" y="436" width="300" height="86" rx="12" fill="#E7F2EC" stroke="#15803D" stroke-width="1.5"/>
    <text x="316" y="472" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#166534">Weight relevance, keep all</text>
    <text x="316" y="498" font-family="Arial, sans-serif" font-size="15" fill="#14532D">nothing removed &#8212; steer toward what matters</text>
  </g>
  <path d="M600 479 L646 479" stroke="#15803D" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="648" y="446" width="120" height="66" rx="12" fill="#FFFFFF" stroke="#15803D" stroke-width="1.5"/>
  <text x="708" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#166534">QA LLM</text>
  <path d="M768 479 L806 479" stroke="#15803D" stroke-width="2.5" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="808" y="426" width="352" height="106" rx="12" fill="#16305B"/>
  <text x="832" y="466" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#86EFAC">Answer 45</text>
  <text x="980" y="466" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#22C55E">&#10003;</text>
  <text x="832" y="496" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">Relevant rows weighted higher; the whole</text>
  <text x="832" y="516" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">table stays available to the model.</text>

  <text x="70" y="600" font-family="Arial, sans-serif" font-size="16" fill="#52627A">Hard decomposition can throw away the answer. Soft weighting never removes content — so the model can always recover it.</text>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">03 / 10</text>
</svg>
