<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="mA" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#64748B"/>
    </marker>
    <marker id="mAmber" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#F59E0B"/>
    </marker>
    <marker id="mTeal" markerWidth="9" markerHeight="9" refX="6.5" refY="4" orient="auto">
      <polygon points="0 0, 7 4, 0 8" fill="#0F766E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">METHOD</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">How CABINET Works</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <!-- Pipeline diagram -->
  <rect x="60" y="266" width="146" height="86" rx="12" fill="#F5F8FC" stroke="#16305B" stroke-width="1.5"/>
  <text x="133" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16305B">Question +</text>
  <text x="133" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16305B">flattened Table</text>
  <path d="M206 309 L232 309" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  <rect x="234" y="278" width="104" height="62" rx="12" fill="#EEF3FA" stroke="#16305B" stroke-width="1.5"/>
  <text x="286" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16305B">Shared</text>
  <text x="286" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#16305B">Embedding</text>
  <path d="M338 296 C 356 250, 356 232, 372 232" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  <path d="M338 322 C 356 388, 356 402, 372 402" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>

  <!-- URS (cue c1) -->
  <g id="cue_s05_c1_cabinet_works_sequence_steps_table">
    <title>Unsupervised Relevance Scorer: a transformer encoder predicts a relevance score for each table token</title>
    <desc>cabinet works sequence steps table flattened linear string header row markers embedded question unsupervised relevance scorer transformer encoder relevance score each table token</desc>
    <rect x="372" y="198" width="238" height="76" rx="12" fill="#FDF3E0" stroke="#F59E0B" stroke-width="2"/>
    <text x="386" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#B45309">Unsupervised Relevance Scorer</text>
    <text x="386" y="254" font-family="Arial, sans-serif" font-size="13" fill="#92400E">transformer encoder &#8594; score per token</text>
  </g>
  <!-- Parsing branch (cue c4) -->
  <g id="cue_s05_c4_parallel_weakly_supervised_parsing_s">
    <title>In parallel a Parsing Statement Generator (Flan T5-xl) and cell highlighter produce a cell-based relevance score</title>
    <desc>parallel weakly-supervised parsing statement generator fine-tuned flan t5-xl bootstrapped about three hundred manual annotations cell highlighter cell-based relevance score linearly combined final weight</desc>
    <rect x="372" y="366" width="238" height="76" rx="12" fill="#E4F1EF" stroke="#0F766E" stroke-width="2"/>
    <text x="386" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0F766E">Parsing Statement Generator</text>
    <text x="386" y="418" font-family="Arial, sans-serif" font-size="13" fill="#115E59">Flan T5-xl · ~300 annotations</text>
    <path d="M610 404 L636 404" stroke="#0F766E" stroke-width="2.5" fill="none" marker-end="url(#mTeal)"/>
    <rect x="638" y="368" width="132" height="72" rx="12" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <text x="704" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0F766E">Cell Highlighter</text>
    <text x="704" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#115E59">&#8594; cell score</text>
  </g>

  <!-- Fuse / weight / QA -->
  <path d="M610 236 C 660 250, 700 300, 796 306" stroke="#F59E0B" stroke-width="2.5" fill="none" marker-end="url(#mAmber)"/>
  <path d="M770 404 C 800 400, 790 340, 796 322" stroke="#0F766E" stroke-width="2.5" fill="none" marker-end="url(#mTeal)"/>
  <rect x="798" y="286" width="120" height="64" rx="12" fill="#16305B"/>
  <text x="858" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Fuse</text>
  <text x="858" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#BFD0E8">relevance</text>
  <path d="M918 318 L944 318" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  <rect x="946" y="286" width="120" height="64" rx="12" fill="#F59E0B"/>
  <text x="1006" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Weight &#8857;</text>
  <text x="1006" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7C2D12">soft-suppress</text>
  <path d="M1066 318 L1092 318" stroke="#64748B" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  <rect x="1094" y="286" width="116" height="64" rx="12" fill="#F5F8FC" stroke="#16305B" stroke-width="1.5"/>
  <text x="1152" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#16305B">QA LLM</text>
  <text x="1152" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#52627A">&#8594; Answer</text>

  <!-- Bottom: losses (c2) + equations (c3) -->
  <g id="cue_s05_c2_because_ground_truth_annotations_whi">
    <title>Relevance is a latent variable estimated via variational inference, shaped by clustering, separation, and sparsification losses</title>
    <desc>because no ground-truth annotations which cells relevant relevance treated latent variable variational inference clustering loss separation loss sparsification loss relevant non-relevant centroids apart scores toward zero one</desc>
    <rect x="60" y="452" width="560" height="192" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="84" y="486" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#16305B">Training URS: relevance as a latent variable</text>
    <text x="84" y="510" font-family="Arial, sans-serif" font-size="13" fill="#52627A">No cell labels &#8212; estimated by variational inference; three losses shape the space:</text>
    <rect x="84" y="524" width="510" height="34" rx="8" fill="#FDF3E0"/>
    <text x="98" y="546" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#92400E">Clustering &#8212; group tokens into relevant vs non-relevant</text>
    <rect x="84" y="564" width="510" height="34" rx="8" fill="#FDF3E0"/>
    <text x="98" y="586" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#92400E">Separation &#8212; push the two cluster centroids apart</text>
    <rect x="84" y="604" width="510" height="34" rx="8" fill="#FDF3E0"/>
    <text x="98" y="626" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#92400E">Sparsification &#8212; noise scores &#8594; 0, relevant &#8594; 1</text>
  </g>

  <g id="cue_s05_c3_table_token_embedding_multiplied_its">
    <title>Each token embedding is multiplied by its relevance score, softly suppressing noise, trained end-to-end</title>
    <desc>each table token embedding multiplied by its relevance score noisy cells softly suppressed rather than deleted whole system trains end-to-end answer-generation cross-entropy loss fused final weight</desc>
    <rect x="648" y="452" width="562" height="192" rx="14" fill="#0F172A"/>
    <text x="674" y="486" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#FBBF24">Fuse, weight, and train end-to-end</text>
    <text x="674" y="524" font-family="Consolas, monospace" font-size="16" fill="#E2E8F0">&#951; = &#955;_uns &#183; &#951;_uns  +  &#955;_cell &#183; &#951;_cell</text>
    <text x="674" y="556" font-family="Consolas, monospace" font-size="16" fill="#7DD3FC">e' = &#951; &#183; e     (soft-suppress, never delete)</text>
    <text x="674" y="596" font-family="Consolas, monospace" font-size="15" fill="#E2E8F0">L = L_CE + &#955;_clu L_clu + &#955;_sep L_sep + &#955;_spar L_spar</text>
    <text x="674" y="628" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">backbone: OmniTab (560M) · everything trains through the answer cross-entropy</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">05 / 10</text>
</svg>
