<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="720" fill="#16305B"/>
  <rect x="0" y="0" width="1280" height="6" fill="#F59E0B"/>
  <text x="70" y="60" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#0F766E">CONTRIBUTION</text>
  <text x="68" y="104" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#16305B">The CABINET Framework</text>
  <line x1="70" y1="122" x2="1210" y2="122" stroke="#DCE3ED" stroke-width="1.5"/>

  <g id="cue_s04_c1_contributes_cabinet_short_content_re">
    <title>CABINET, short for Content Relevance-Based Noise Reduction, has two cooperating parts</title>
    <desc>paper contributes cabinet short for content relevance-based noise reduction two cooperating parts trained end-to-end with QA LLM</desc>
    <rect x="60" y="146" width="1150" height="92" rx="14" fill="#16305B"/>
    <text x="86" y="188" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">CABINET = Content Relevance-Based Noise Reduction</text>
    <text x="86" y="216" font-family="Arial, sans-serif" font-size="16" fill="#BFD0E8">Two cooperating relevance signals, trained end-to-end with the question-answering model — suppress noise, never delete content.</text>
  </g>

  <!-- Component 1: URS -->
  <g id="cue_s04_c2_first_unsupervised_relevance_scorer">
    <title>Unsupervised Relevance Scorer assigns a soft relevance weight to every table token, trained differentiably</title>
    <desc>first unsupervised relevance scorer assigns soft relevance weight every table token trained differentiably alongside question-answering model</desc>
    <rect x="60" y="258" width="562" height="230" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="60" y="258" width="562" height="8" rx="4" fill="#F59E0B"/>
    <circle cx="98" cy="308" r="20" fill="#FDF3E0"/>
    <text x="98" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#B45309">1</text>
    <text x="132" y="304" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#16305B">Unsupervised Relevance</text>
    <text x="132" y="330" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#16305B">Scorer (URS)</text>
    <text x="88" y="376" font-family="Arial, sans-serif" font-size="16" fill="#334155">· Soft relevance weight for every table token</text>
    <text x="88" y="404" font-family="Arial, sans-serif" font-size="16" fill="#334155">· Differentiable, trained with the QA model</text>
    <text x="88" y="432" font-family="Arial, sans-serif" font-size="16" fill="#334155">· No cell-level labels needed (latent signal)</text>
    <text x="88" y="460" font-family="Arial, sans-serif" font-size="16" fill="#B45309" font-weight="700">Primary relevance signal</text>
  </g>

  <!-- Component 2: Parsing statement -->
  <g id="cue_s04_c3_second_weakly_supervised_module_gene">
    <title>Weakly-supervised module generates a parsing statement and highlights the relevant cells</title>
    <desc>second weakly-supervised module generates parsing statement describing which rows columns matter highlights corresponding cells cell-based relevance signal</desc>
    <rect x="648" y="258" width="562" height="230" rx="14" fill="#FFFFFF" stroke="#DCE3ED" stroke-width="1.5"/>
    <rect x="648" y="258" width="562" height="8" rx="4" fill="#0F766E"/>
    <circle cx="686" cy="308" r="20" fill="#E4F1EF"/>
    <text x="686" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#0F766E">2</text>
    <text x="720" y="304" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#16305B">Weakly-Supervised</text>
    <text x="720" y="330" font-family="Arial, sans-serif" font-size="21" font-weight="800" fill="#16305B">Parsing-Statement Module</text>
    <text x="676" y="376" font-family="Arial, sans-serif" font-size="16" fill="#334155">· Describes which rows &amp; columns matter</text>
    <text x="676" y="404" font-family="Arial, sans-serif" font-size="16" fill="#334155">· Highlights the corresponding cells</text>
    <text x="676" y="432" font-family="Arial, sans-serif" font-size="16" fill="#334155">· Yields a cell-based relevance score</text>
    <text x="676" y="460" font-family="Arial, sans-serif" font-size="16" fill="#0F766E" font-weight="700">Complementary aid</text>
  </g>

  <g id="cue_s04_c4_together_they_let_focus_without">
    <title>Together they let the model focus without discarding content, delivering new SoTA and robustness</title>
    <desc>together they let model focus without discarding content deliver new state of the art three benchmarks stronger robustness to noise and large tables</desc>
    <rect x="60" y="508" width="1150" height="104" rx="14" fill="#F5F8FC" stroke="#DCE3ED" stroke-width="1.5"/>
    <text x="86" y="548" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#16305B">Focus without discarding &#8594; new state of the art on 3 benchmarks + robustness</text>
    <text x="86" y="580" font-family="Arial, sans-serif" font-size="16" fill="#52627A">The two scores are fused, applied to the table, and the whole system trains end-to-end — stronger against noise and large tables.</text>
  </g>

  <line x1="70" y1="678" x2="1210" y2="678" stroke="#DCE3ED" stroke-width="1.5"/>
  <text x="70" y="700" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">CABINET · Content Relevance-Based Noise Reduction</text>
  <text x="1210" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">04 / 10</text>
</svg>
