<g id="cue_s10_c1_lasting_message_twofold">
  <title>lasting message twofold</title>
  <desc>Lasting message twofold.</desc>
<rect x="56" y="160" width="1168" height="52" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="76" y="175" width="5" height="24" rx="2.5" fill="#4F9DF7" />
<text x="96" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EAF1FB" text-anchor="start">The lasting message is twofold — one practical, one methodological.</text>
</g>
<g id="cue_s10_c2_practically_explanation_generation_a">
  <title>practically explanation generation added state-of-the-art vqa backbone almost loss answer</title>
  <desc>Practically explanation generation added state-of-the-art VQA backbone almost no loss answer accuracy human-readable reason.</desc>
<rect x="56" y="232" width="572.0" height="158" rx="14" ry="14" fill="#1A2B49" stroke="#57D9A3" stroke-width="1.3" />
<rect x="78" y="256" width="5" height="30" rx="2.5" fill="#57D9A3" />
<text x="98" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#57D9A3" text-anchor="start">Practically</text>
<text x="78" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">Explanation generation can be bolted onto a</text>
<text x="78" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">state-of-the-art VQA backbone with almost no</text>
<text x="78" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">loss in answer accuracy — a human-readable</text>
<text x="78" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">reason with every answer.</text>
</g>
<g id="cue_s10_c3_but_methodologically_shows_through_c">
  <title>but methodologically shows through concrete examples string-matching metrics like bleu</title>
  <desc>But methodologically shows through concrete examples string-matching metrics BLEU ROUGE reward wrong penalize valid unreliable.</desc>
<rect x="652.0" y="232" width="572.0" height="158" rx="14" ry="14" fill="#1A2B49" stroke="#F2708A" stroke-width="1.3" />
<rect x="674.0" y="256" width="5" height="30" rx="2.5" fill="#F2708A" />
<text x="694.0" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F2708A" text-anchor="start">Methodologically</text>
<text x="674.0" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">Concrete examples show BLEU and ROUGE can reward</text>
<text x="674.0" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">a wrong explanation and penalize a valid one —</text>
<text x="674.0" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">they are unreliable for this task.</text>
</g>
<g id="cue_s10_c4_authors_therefore_argue_real_bottlen">
  <title>authors therefore argue real bottleneck explainable vqa not generator but</title>
  <desc>Authors therefore argue real bottleneck explainable VQA not generator evaluation urge reasoning-aware metrics judging.</desc>
<rect x="56" y="408" width="1168" height="96" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<rect x="76" y="430" width="5" height="52" rx="2.5" fill="#4F9DF7" />
<text x="96" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="800" fill="#EAF1FB" text-anchor="start">The real bottleneck is not the generator — it is the evaluation.</text>
<text x="96" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">The authors urge the community to develop proper reasoning-aware metrics for judging explanations.</text>
</g>
