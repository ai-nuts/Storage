<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">PROBLEM</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="800" fill="#EAF1FB" text-anchor="start">Right answers, but no visible reasoning</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">02 / 10</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s02_c1_classic_visual_question_answering_ta">
  <title>classic visual question answering task takes image question returns answer</title>
  <desc>Classic visual question answering task takes image question returns answer field poured effort accuracy.</desc>
<rect x="56" y="160" width="1168" height="92" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="76" y="182" width="5" height="48" rx="2.5" fill="#4F9DF7" />
<text x="96" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#EAF1FB" text-anchor="start">Classic VQA: an image + a question in, an answer out</text>
<text x="96" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">The field has poured enormous effort into raising accuracy with large pre-trained vision-language models</text>
</g>
<g id="cue_s02_c2_result_black_box_prediction_right">
  <title>result black box prediction right yet evidence explaining reasoning behind</title>
  <desc>Result black box prediction may be right yet no evidence explaining the reasoning behind it.</desc>
<rect x="56" y="272" width="380" height="300" rx="14" ry="14" fill="#1A2B49" stroke="#F2708A" stroke-width="1.3" />
<rect x="78" y="298" width="5" height="30" rx="2.5" fill="#F2708A" />
<text x="78" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#EAF1FB" text-anchor="start">The result is a black box</text>
<text x="78" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">The prediction may be right, yet</text>
<text x="78" y="405" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">there is no evidence explaining</text>
<text x="78" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">the reasoning behind it.</text>
<rect x="78" y="472" width="336" height="78" rx="12" ry="12" fill="#301B27" stroke="#F2708A" stroke-width="1.2" />
<text x="94" y="508" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="18" font-weight="800" fill="#EAF1FB" text-anchor="start">answer  ✓</text>
<text x="94" y="534" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="16" font-weight="800" fill="#F2708A" text-anchor="start">reasoning  ?</text>
</g>
<g id="cue_s02_c3_authors_distinguish_three_kinds_mode">
  <title>authors distinguish three kinds models those give only answer those</title>
  <desc>Authors distinguish three kinds models those give only answer those add generic caption rare third.</desc>
<rect x="460" y="272" width="764" height="300" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="482" y="298" width="5" height="30" rx="2.5" fill="#4F9DF7" />
<text x="500" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#EAF1FB" text-anchor="start">Three kinds of models</text>
<rect x="482" y="348" width="720" height="54" rx="10" ry="10" fill="#1A2B49" stroke="#6E85AC" stroke-width="1.1" />
<text x="500" y="382" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="800" fill="#6E85AC" text-anchor="start">Type 1</text>
<text x="590" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#EAF1FB" text-anchor="start">Answer only</text>
<text x="590" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A6BADB" text-anchor="start">no supporting evidence</text>
<rect x="482" y="414" width="720" height="54" rx="10" ry="10" fill="#1A2B49" stroke="#F7B84B" stroke-width="1.1" />
<text x="500" y="448" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="800" fill="#F7B84B" text-anchor="start">Type 2</text>
<text x="590" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#EAF1FB" text-anchor="start">Answer + generic caption</text>
<text x="590" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A6BADB" text-anchor="start">describes the image, not the logic</text>
<rect x="482" y="480" width="720" height="54" rx="10" ry="10" fill="#1A2B49" stroke="#57D9A3" stroke-width="1.1" />
<text x="500" y="514" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="800" fill="#57D9A3" text-anchor="start">Type 3</text>
<text x="590" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="700" fill="#EAF1FB" text-anchor="start">Answer + self-contained explanation</text>
<text x="590" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="400" fill="#A6BADB" text-anchor="start">logically matches the answer</text>
</g>
<g id="cue_s02_c4_almost_all_state_of_the_art_vqa_mode">
  <title>almost all state-of-the-art vqa models fall first two categories which</title>
  <desc>Almost all state-of-the-art VQA models fall into first two categories which motivates this work.</desc>
<rect x="56" y="590" width="1168" height="52" rx="12" ry="12" fill="#1A2B49" stroke="#F7B84B" stroke-width="1.2" />
<rect x="76" y="605" width="5" height="24" rx="2.5" fill="#F7B84B" />
<text x="96" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="600" fill="#EAF1FB" text-anchor="start">Almost all state-of-the-art VQA models fall into the first two categories — this work targets the third.</text>
</g>
</svg>
