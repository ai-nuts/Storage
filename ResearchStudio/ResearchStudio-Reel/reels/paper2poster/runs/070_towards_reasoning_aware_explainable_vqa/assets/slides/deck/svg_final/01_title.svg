<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<defs>
  <radialGradient id="bgv" cx="18%" cy="8%" r="100%">
    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<g id="cue_s01_c1_most_visual_question_answering_model">
  <title>most visual question answering models black boxes they output answer</title>
  <desc>Most visual question answering models are black boxes outputting an answer but not the reasoning.</desc>
<rect x="72" y="74" width="6" height="30" rx="2.5" fill="#4F9DF7" />
<text x="92" y="86" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="2.5">VISUAL QUESTION ANSWERING  ·  EXPLAINABILITY</text>
<text x="92" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="400" fill="#A6BADB" text-anchor="start">Most VQA models are black boxes: they output an answer, but not the reasoning that produced it.</text>
</g>
<text x="72" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="60" font-weight="800" fill="#EAF1FB" text-anchor="start">Reasoning-Aware</text>
<text x="72" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="60" font-weight="800" fill="#EAF1FB" text-anchor="start">Explainable VQA</text>
<text x="600" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" font-weight="600" fill="#4F9DF7" text-anchor="start" font-style="italic">Towards</text>
<g id="cue_s01_c2_towards_reasoning_aware_explainable">
  <title>towards reasoning-aware explainable vqa university illinois amazon alexa augments state-of-the-art</title>
  <desc>Towards reasoning-aware explainable VQA augments coarse-to-fine backbone end-to-end explanation module human-readable.</desc>
<rect x="72" y="292" width="600" height="150" rx="16" ry="16" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="92" y="316" width="6" height="102" rx="2.5" fill="#37DCC0" />
<text x="112" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" font-weight="800" fill="#37DCC0" text-anchor="start">Answer  +  Explanation</text>
<text x="112" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Augments a state-of-the-art coarse-to-fine VQA</text>
<text x="112" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">backbone with an end-to-end explanation module, so</text>
<text x="112" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">it emits a human-readable explanation with every</text>
<text x="112" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">answer.</text>
</g>
<g id="cue_s01_c3_compares_lstm_transformer_decoders_e">
  <title>compares lstm transformer decoders explanation generator crucially shows through large</title>
  <desc>Compares LSTM Transformer decoders explanation generator large human study shows BLEU ROUGE unreliable.</desc>
<rect x="712" y="292" width="496" height="150" rx="16" ry="16" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.4" />
<rect x="732" y="316" width="6" height="102" rx="2.5" fill="#F7B84B" />
<text x="752" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" font-weight="800" fill="#F7B84B" text-anchor="start">The evaluation problem</text>
<text x="752" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">Compares LSTM vs Transformer explanation</text>
<text x="752" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">generators; a large human study shows BLEU</text>
<text x="752" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">and ROUGE are unreliable for judging</text>
<text x="752" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#A6BADB" text-anchor="start">explanations.</text>
</g>
<line x1="72" y1="486" x2="1208" y2="486" stroke="#2B4068" stroke-width="1.2" />
<text x="72" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" font-weight="700" fill="#EAF1FB" text-anchor="start">Rakesh Vaideeswaran   ·   Feng Gao   ·   Abhinav Mathur   ·   Govind Thattai</text>
<text x="72" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">University of Illinois, Urbana-Champaign   ·   Amazon Alexa AI</text>
<text x="72" y="590" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="1.5">NeurIPS 2022</text>
<text x="72" y="616" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="500" fill="#6E85AC" text-anchor="start">arxiv.org/abs/2211.05190</text>
</svg>
