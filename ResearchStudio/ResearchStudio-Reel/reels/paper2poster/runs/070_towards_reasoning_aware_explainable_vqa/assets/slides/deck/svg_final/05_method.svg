<text x="78" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Removes noisy region information</text>
<text x="78" y="379" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">before fusion.</text>
<rect x="452.6666666666667" y="276" width="374.6666666666667" height="176" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="474.6666666666667" y="302" width="5" height="28" rx="2.5" fill="#37DCC0" />
<text x="492.6666666666667" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#37DCC0" text-anchor="start">2  Multimodal learning</text>
<text x="474.6666666666667" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Bilinear attention networks fuse image</text>
<text x="474.6666666666667" y="379" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">+ question at coarse and fine</text>
<text x="474.6666666666667" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">granularity.</text>
<rect x="849.3333333333334" y="276" width="374.6666666666667" height="176" rx="14" ry="14" fill="#14223C" stroke="#2B4068" stroke-width="1.2" />
<rect x="871.3333333333334" y="302" width="5" height="28" rx="2.5" fill="#B98CF0" />
<text x="889.3333333333334" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B98CF0" text-anchor="start">3  Semantic reasoning</text>
<text x="871.3333333333334" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">Combines both levels into one joint</text>
<text x="871.3333333333334" y="379" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="400" fill="#A6BADB" text-anchor="start">embedding.</text>
<text x="441.6666666666667" y="370.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="800" fill="#6E85AC" text-anchor="middle">→</text>
<text x="838.3333333333334" y="370.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" font-weight="800" fill="#6E85AC" text-anchor="middle">→</text>
</g>
<g id="cue_s05_c3_joint_embedding_sent_both_multi_laye">
  <title>joint embedding sent both multi-layer perceptron answer prediction explanation generator</title>
  <desc>Joint embedding sent both multi-layer perceptron answer prediction explanation generator two-layer LSTM eight-head Transformer.</desc>
