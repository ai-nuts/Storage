<text x="76" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#EAF1FB" text-anchor="start">Joint embedding feeds two heads</text>
<rect x="76" y="524" width="268.0" height="50" rx="10" ry="10" fill="#1A2B49" stroke="#57D9A3" stroke-width="1.1" />
<text x="210.0" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#EAF1FB" text-anchor="middle">MLP  →  answer</text>
<text x="210.0" y="564" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="400" fill="#A6BADB" text-anchor="middle">answer prediction</text>
<rect x="364.0" y="524" width="268.0" height="50" rx="10" ry="10" fill="#1A2B49" stroke="#F7B84B" stroke-width="1.1" />
<text x="498.0" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#EAF1FB" text-anchor="middle">2-layer LSTM  /  8-head Transformer</text>
<text x="498.0" y="564" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" font-weight="400" fill="#A6BADB" text-anchor="middle">explanation generator</text>
</g>
<g id="cue_s05_c4_whole_system_trained_end_to_end_comb">
  <title>whole system trained end-to-end combined loss balances answer term explanation</title>
  <desc>Whole system trained end-to-end combined loss balances answer term explanation term factor alpha teacher forcing.</desc>
<rect x="676" y="472" width="548" height="120" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="696" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start">Trained end-to-end</text>
<text x="696" y="546" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="16" font-weight="700" fill="#EAF1FB" text-anchor="start">L = alpha * L_ans + (1 - alpha) * L_expl</text>
<text x="696" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#A6BADB" text-anchor="start">answer term + explanation term, balanced by alpha</text>
</g>
