<g id="cue_s05_c1_architecture_two_major_parts_coarse">
  <title>architecture two major parts coarse-to-fine visual-language reasoning answer explanation generation</title>
  <desc>Architecture two major parts coarse-to-fine visual-language reasoning answer explanation generation Faster-RCNN GloVe GRU.</desc>
<rect x="56" y="160" width="1168" height="96" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="76" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#4F9DF7" text-anchor="start">Two parts: coarse-to-fine visual-language reasoning for the answer + an explanation generator</text>
<text x="76" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#A6BADB" text-anchor="start">Faster-RCNN region features &amp; image predicates (GloVe)   ·   question via GloVe + GRU   ·   question predicates via stop-word filter</text>
<text x="76" y="242" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#EAF1FB" text-anchor="start">f_I , p_I , f_Q , p_Q   -&gt;   CFR backbone</text>
</g>
<g id="cue_s05_c2_these_signals_flow_through_three">
  <title>these signals flow through three modules information filtering which removes</title>
  <desc>These signals flow through three modules information filtering multimodal learning bilinear attention semantic reasoning joint.</desc>
