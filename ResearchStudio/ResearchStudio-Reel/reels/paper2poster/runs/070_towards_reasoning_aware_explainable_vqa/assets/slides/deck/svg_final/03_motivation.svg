    <stop offset="0%" stop-color="#0E1A30" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#0B1220" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="warmg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F7B84B"/>
    <stop offset="100%" stop-color="#E8892E"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#0B1220" />
<rect x="0" y="0" width="1280" height="720" fill="url(#bgv)" />
<rect x="56" y="50" width="6" height="22" rx="2.5" fill="#4F9DF7" />
<text x="74" y="68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4F9DF7" text-anchor="start" letter-spacing="3">MOTIVATION</text>
<text x="56" y="116" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" font-weight="800" fill="#EAF1FB" text-anchor="start">Two open questions — and a metric problem</text>
<text x="1224" y="68" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14" font-weight="700" fill="#6E85AC" text-anchor="end" letter-spacing="1">03 / 10</text>
<line x1="56" y1="138" x2="1224" y2="138" stroke="#2B4068" stroke-width="1.2" />
<g id="cue_s03_c1_two_open_questions_drive_first">
  <title>two open questions drive first vqa generate human-readable explanation while</title>
  <desc>Two open questions drive first can VQA model generate human-readable explanation maintaining answer accuracy.</desc>
<rect x="56" y="160" width="596" height="200" rx="14" ry="14" fill="#1A2B49" stroke="#4F9DF7" stroke-width="1.3" />
<text x="76" y="212" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="34" font-weight="800" fill="#4F9DF7" text-anchor="start">Q1</text>
<text x="140" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#EAF1FB" text-anchor="start">Can a VQA model generate a</text>
<text x="140" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#EAF1FB" text-anchor="start">human-readable explanation...</text>
<text x="76" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">...while still maintaining its answer accuracy? The</text>
<text x="76" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">explanation should never cost the model its correctness.</text>
</g>
<g id="cue_s03_c2_second_how_good_those_generated">
  <title>second how good those generated explanations how should even evaluate</title>
  <desc>Second how good those generated explanations how should we even evaluate them.</desc>
<rect x="56" y="382" width="596" height="196" rx="14" ry="14" fill="#1A2B49" stroke="#37DCC0" stroke-width="1.3" />
<text x="76" y="434" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="34" font-weight="800" fill="#37DCC0" text-anchor="start">Q2</text>
<text x="140" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#EAF1FB" text-anchor="start">How good are those explanations,</text>
<text x="140" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#EAF1FB" text-anchor="start">and how do we even evaluate them?</text>
<text x="76" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">Explanation quality has no agreed, reliable measure to</text>
<text x="76" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">judge whether it genuinely supports the answer.</text>
</g>
<g id="cue_s03_c3_existing_explainable_vqa_datasets_su">
  <title>existing explainable-vqa datasets suggest conventional natural language metrics such bleu</title>
  <desc>Existing explainable-VQA datasets suggest conventional natural language metrics BLEU ROUGE designed string matching n-grams.</desc>
<rect x="676" y="160" width="548" height="270" rx="14" ry="14" fill="#14223C" stroke="#F2708A" stroke-width="1.2" />
<rect x="696" y="186" width="5" height="32" rx="2.5" fill="#F2708A" />
<text x="718" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#EAF1FB" text-anchor="start">BLEU / ROUGE were built for</text>
<text x="718" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="700" fill="#EAF1FB" text-anchor="start">string matching, not reasoning</text>
<text x="696" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">These metrics score overlapping n-grams;</text>
<text x="696" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">they say nothing about whether an</text>
<text x="696" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#A6BADB" text-anchor="start">explanation truly supports an answer.</text>
<rect x="696" y="372" width="508" height="40" rx="10" ry="10" fill="#301B27" stroke="#F2708A" stroke-width="1.2" />
<text x="714" y="398" font-family="Consolas, 'SF Mono', 'Courier New', monospace" font-size="14.5" font-weight="700" fill="#F2708A" text-anchor="start">n-gram overlap  is not  valid reasoning</text>
</g>
<g id="cue_s03_c4_authors_argue_reasoning_problems_vqa">
  <title>authors argue reasoning problems vqa grow more complex having interpretable</title>
  <desc>Authors argue reasoning problems VQA grow more complex interpretable well-evaluated explanation urgent.</desc>
<rect x="676" y="452" width="548" height="126" rx="14" ry="14" fill="#1A2B49" stroke="#F7B84B" stroke-width="1.2" />
<rect x="696" y="478" width="5" height="74" rx="2.5" fill="#F7B84B" />
<text x="718" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="600" fill="#EAF1FB" text-anchor="start">As reasoning problems in VQA grow more</text>
<text x="718" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="600" fill="#EAF1FB" text-anchor="start">complex, an interpretable, well-evaluated</text>
<text x="718" y="548" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="600" fill="#EAF1FB" text-anchor="start">explanation is no longer optional but</text>
<text x="718" y="574" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" font-weight="600" fill="#EAF1FB" text-anchor="start">urgent.</text>
</g>
</svg>
