<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">09 · HEADLINE NUMBERS</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">The study in <tspan fill="#0B6E9E">four numbers</tspan></text>

  <!-- Cue 1 -->
  <g id="cue_s09_c1_few_numbers_capture_study_self_super">
    <title>Almost three million unlabeled images</title>
    <desc>few numbers capture study self-supervised training used almost three million unlabeled radar images</desc>
    <rect x="72" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">SELF-SUPERVISED TRAINING</text>
    <text x="104" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="76" font-weight="700" fill="#0B6E9E">&#8776; 3M</text>
    <text x="104" y="360" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">unlabeled radar images</text>
  </g>

  <!-- Cue 2 -->
  <g id="cue_s09_c2_labeled_benchmark_held_twenty_three">
    <title>2,300 expert vignettes across four classes</title>
    <desc>labeled benchmark held twenty-three hundred expert vignettes across four classes</desc>
    <rect x="660" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="180" width="8" height="205" rx="4" fill="#1E8E5A"/>
    <text x="692" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">LABELED BENCHMARK</text>
    <text x="692" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="76" font-weight="700" fill="#1E8E5A">2,300</text>
    <text x="692" y="360" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">expert vignettes across 4 classes</text>
  </g>

  <!-- Cue 3 -->
  <g id="cue_s09_c3_best_fine_tuned_reached_micro_averag">
    <title>Best fine-tuned AUROC about 0.93</title>
    <desc>best fine-tuned model reached micro-averaged auroc about zero point nine three</desc>
    <rect x="72" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="405" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="447" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">BEST FINE-TUNED MODEL</text>
    <text x="104" y="543" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="76" font-weight="700" fill="#0B6E9E">0.93</text>
    <text x="104" y="585" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">micro-averaged AUROC</text>
  </g>

  <!-- Cue 4 -->
  <g id="cue_s09_c4_toughest_classes_wind_streaks_convec">
    <title>Toughest classes jumped into the mid-eighties</title>
    <desc>toughest classes wind streaks convection cells new models jumped cmwv roughly zero point seven three zero point seven nine mid eighties detection improvement</desc>
    <rect x="660" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="405" width="8" height="205" rx="4" fill="#1E8E5A"/>
    <text x="692" y="447" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">HARDEST CLASSES</text>
    <text x="692" y="522" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#1E8E5A">into the mid-.80s</text>
    <text x="692" y="562" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">wind streaks &amp; convection cells,</text>
    <text x="692" y="590" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">up from CmWV 0.73 / 0.79</text>
  </g>
</svg>
