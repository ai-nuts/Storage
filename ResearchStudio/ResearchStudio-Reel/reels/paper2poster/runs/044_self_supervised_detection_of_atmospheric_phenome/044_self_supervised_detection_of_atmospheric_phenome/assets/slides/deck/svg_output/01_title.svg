<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="cover">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="10" fill="#0B6E9E"/>

  <!-- Kicker + institute logo -->
  <text x="72" y="78" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">NEURIPS 2022  ·  ML4PS WORKSHOP</text>
  <image xlink:href="../images/logo_hawaii.png" x="1012" y="46" width="196" height="96" preserveAspectRatio="xMidYMid meet"/>

  <!-- Title -->
  <text x="72" y="132" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#12212B"><tspan fill="#0B6E9E">Self-supervised</tspan> detection of</text>
  <text x="72" y="184" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="46" font-weight="700" fill="#12212B">atmospheric phenomena from SAR</text>
  <text x="72" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#5E6E7A">Yannik Glaser · Peter Sadowski · Justin E. Stopa  —  University of Hawai&#699;i at M&#257;noa</text>

  <!-- Cue 1: SAR hero strip -->
  <g id="cue_s01_c1_satellite_radar_sees_ocean_day">
    <title>Satellite radar sees the ocean day and night</title>
    <desc>satellite radar sees ocean day night through any cloud cover wind streaks convective cells sea surface</desc>
    <rect x="72" y="256" width="1136" height="196" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <text x="96" y="290" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#0B6E9E">Radar reads the sea surface — day or night, through any cloud</text>
    <image xlink:href="../images/sar_strip.png" x="96" y="302" width="1088" height="138" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Cue 2: the bottleneck -->
  <g id="cue_s01_c2_but_teaching_machines_read_these">
    <title>Teaching machines to read radar is hard</title>
    <desc>but teaching machines read these images hard because expert labels scarce trained experts annotate</desc>
    <rect x="72" y="476" width="548" height="176" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="476" width="8" height="176" rx="4" fill="#D2492A"/>
    <text x="104" y="518" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">The labeling bottleneck</text>
    <text x="104" y="558" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">Teaching machines to read radar is hard —</text>
    <text x="104" y="587" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">only trained experts can label it, so</text>
    <text x="104" y="616" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">expert labels stay scarce.</text>
  </g>

  <!-- Cue 3: this work asks -->
  <g id="cue_s01_c3_work_asks_whether_self_supervised_le">
    <title>Can self-supervised learning help</title>
    <desc>work asks whether self-supervised learning three million unlabeled sentinel-1 radar images labeling bottleneck</desc>
    <rect x="660" y="476" width="548" height="176" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="476" width="8" height="176" rx="4" fill="#0B6E9E"/>
    <text x="692" y="518" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">This work asks</text>
    <text x="692" y="558" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">Can self-supervised learning on 3 million</text>
    <text x="692" y="587" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">unlabeled Sentinel-1 images overcome that</text>
    <text x="692" y="616" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">bottleneck? An honest, preliminary study.</text>
  </g>
</svg>
