<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">03 · MOTIVATION</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">Contrastive learning, meet <tspan fill="#0B6E9E">remote sensing</tspan></text>

  <!-- Cue 1 -->
  <g id="cue_s03_c1_contrastive_self_supervised_learning">
    <title>Contrastive learning transformed vision</title>
    <desc>contrastive self-supervised learning transformed computer vision training networks huge pools unlabeled data embeddings transfer downstream tasks</desc>
    <rect x="72" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="220" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">A proven idea</text>
    <text x="104" y="260" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Contrastive self-supervised learning has</text>
    <text x="104" y="289" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">transformed computer vision: train on huge</text>
    <text x="104" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">pools of unlabeled data to learn embeddings</text>
    <text x="104" y="347" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">that transfer to downstream tasks.</text>
  </g>

  <!-- Cue 2 -->
  <g id="cue_s03_c2_worked_natural_images_medical_images">
    <title>Rare in remote sensing</title>
    <desc>worked natural images medical images but rarely been applied remote sensing</desc>
    <rect x="660" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="692" y="220" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Rare in remote sensing</text>
    <text x="692" y="260" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">It works for natural and medical images,</text>
    <text x="692" y="289" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">but has rarely been applied to remote</text>
    <text x="692" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">sensing — exactly where unlabeled data is</text>
    <text x="692" y="347" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">most abundant.</text>
  </g>

  <!-- Cue 3 : hero number -->
  <g id="cue_s03_c3_gap_matters_because_sentinel_1_alone">
    <title>120,000 Wave-mode images per month</title>
    <desc>gap matters because sentinel-1 alone collects roughly hundred twenty thousand wave-mode ocean images every single month</desc>
    <rect x="72" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="405" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="442" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">WHY IT MATTERS HERE</text>
    <text x="104" y="512" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="58" font-weight="700" fill="#0B6E9E">120,000</text>
    <text x="104" y="552" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" fill="#12212B">Wave-mode ocean images every month</text>
    <text x="104" y="586" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#5E6E7A">from Sentinel-1 alone</text>
  </g>

  <!-- Cue 4 -->
  <g id="cue_s03_c4_study_tests_hypothesis_contrastive_l">
    <title>The hypothesis under test</title>
    <desc>study tests hypothesis contrastive learning unlabeled stream overcome scarcity expert labels SAR analysis</desc>
    <rect x="660" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="405" width="8" height="205" rx="4" fill="#1E8E5A"/>
    <text x="692" y="445" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">The hypothesis</text>
    <text x="692" y="485" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Can contrastive learning on that unlabeled</text>
    <text x="692" y="514" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">stream overcome the scarcity of expert</text>
    <text x="692" y="543" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">labels for SAR analysis? That is the</text>
    <text x="692" y="572" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">question this study tests.</text>
  </g>
</svg>
