<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">02 · PROBLEM</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">A firehose of images, almost <tspan fill="#D2492A">no labels</tspan></text>

  <!-- Cue 1 -->
  <g id="cue_s02_c1_european_space_agency_sentinel_1_rad">
    <title>Sentinel-1 images the global ocean</title>
    <desc>european space agency sentinel-1 radar satellites image global ocean unprecedented scale waves turbulence fronts biological slicks</desc>
    <rect x="72" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="220" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Sentinel-1 at global scale</text>
    <text x="104" y="260" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">ESA's Sentinel-1 radar satellites image the</text>
    <text x="104" y="289" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">global ocean at unprecedented scale —</text>
    <text x="104" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">waves, turbulence, fronts, and biological</text>
    <text x="104" y="347" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">slicks all leave signatures.</text>
  </g>

  <!-- Cue 2 -->
  <g id="cue_s02_c2_computer_vision_process_these_images">
    <title>Vision is ready but labels are not</title>
    <desc>computer vision process these images but machine learning held back lack labeled data trained experts annotate radar vignettes</desc>
    <rect x="660" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="692" y="220" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Vision is ready, labels are not</text>
    <text x="692" y="260" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Computer vision can process these images,</text>
    <text x="692" y="289" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">but machine learning is held back by a lack</text>
    <text x="692" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">of labeled data — only trained experts can</text>
    <text x="692" y="347" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">annotate radar vignettes.</text>
  </g>

  <!-- Cue 3 -->
  <g id="cue_s02_c3_earlier_work_also_relied_biased">
    <title>A biased legacy dataset</title>
    <desc>earlier work also relied biased dataset picked only exemplary images forced single label per image phenomena coexist</desc>
    <rect x="72" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="405" width="8" height="205" rx="4" fill="#D2492A"/>
    <text x="104" y="445" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">A biased legacy dataset</text>
    <text x="104" y="485" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Earlier work relied on a biased set that</text>
    <text x="104" y="514" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">picked only exemplary images and forced a</text>
    <text x="104" y="543" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">single label per image — even though</text>
    <text x="104" y="572" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">phenomena usually coexist.</text>
  </g>

  <!-- Cue 4 -->
  <g id="cue_s02_c4_result_set_did_not_reflect">
    <title>Not the real ocean distribution</title>
    <desc>result set did not reflect real distribution ocean conditions training set</desc>
    <rect x="660" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="405" width="8" height="205" rx="4" fill="#D2492A"/>
    <text x="692" y="445" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Not the real ocean</text>
    <text x="692" y="485" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">The result was a training set that did not</text>
    <text x="692" y="514" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">reflect the real distribution of ocean</text>
    <text x="692" y="543" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">conditions the models must face.</text>
  </g>
</svg>
