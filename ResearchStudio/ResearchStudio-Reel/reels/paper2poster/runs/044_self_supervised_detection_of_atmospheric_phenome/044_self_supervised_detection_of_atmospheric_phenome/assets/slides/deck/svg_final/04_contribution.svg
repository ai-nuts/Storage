<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">04 · CONTRIBUTION</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">Three <tspan fill="#0B6E9E">contributions</tspan></text>

  <!-- Cue 1 : lead banner -->
  <g id="cue_s04_c1_makes_three_contributions">
    <title>This paper makes three contributions</title>
    <desc>makes three contributions paper</desc>
    <rect x="72" y="172" width="1136" height="82" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="172" width="8" height="82" rx="4" fill="#0B6E9E"/>
    <text x="104" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#12212B">This paper makes <tspan fill="#0B6E9E">three</tspan> contributions — a dataset, a representation, and a fair comparison.</text>
  </g>

  <!-- Cue 2 -->
  <g id="cue_s04_c2_first_builds_new_hand_labeled_datase">
    <title>New hand-labeled benchmark</title>
    <desc>first builds new hand-labeled dataset about twenty-three hundred randomly sampled multi-label radar observations real ocean population</desc>
    <rect x="72" y="286" width="362" height="324" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="286" width="362" height="8" rx="4" fill="#0B6E9E"/>
    <text x="100" y="356" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#0B6E9E">01</text>
    <text x="100" y="398" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="23" font-weight="700" fill="#12212B">New labeled benchmark</text>
    <text x="100" y="436" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">~2,300 randomly sampled,</text>
    <text x="100" y="463" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">multi-label radar</text>
    <text x="100" y="490" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">observations that better</text>
    <text x="100" y="517" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">represent the real ocean</text>
    <text x="100" y="544" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">population.</text>
  </g>

  <!-- Cue 3 -->
  <g id="cue_s04_c3_second_leverages_three_years_unlabel">
    <title>SwAV contrastive embedding</title>
    <desc>second leverages three years unlabeled sentinel-1 imagery roughly three million images train swav contrastive embedding SAR scenes</desc>
    <rect x="459" y="286" width="362" height="324" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="459" y="286" width="362" height="8" rx="4" fill="#0B6E9E"/>
    <text x="487" y="356" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#0B6E9E">02</text>
    <text x="487" y="398" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="23" font-weight="700" fill="#12212B">SwAV embedding</text>
    <text x="487" y="436" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">~3 million unlabeled</text>
    <text x="487" y="463" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">Sentinel-1 images over</text>
    <text x="487" y="490" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">three years train a SwAV</text>
    <text x="487" y="517" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">contrastive embedding of</text>
    <text x="487" y="544" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">SAR scenes.</text>
  </g>

  <!-- Cue 4 -->
  <g id="cue_s04_c4_third_rigorously_compares_self_super">
    <title>Rigorous three-way comparison</title>
    <desc>third rigorously compares self-supervised representation against standard transfer learning imagenet previous state-of-the-art cmwv classifier three downstream evaluation protocols</desc>
    <rect x="846" y="286" width="362" height="324" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="846" y="286" width="362" height="8" rx="4" fill="#0B6E9E"/>
    <text x="874" y="356" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="40" font-weight="700" fill="#0B6E9E">03</text>
    <text x="874" y="398" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="23" font-weight="700" fill="#12212B">Rigorous comparison</text>
    <text x="874" y="436" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">Benchmarked against</text>
    <text x="874" y="463" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">ImageNet transfer and the</text>
    <text x="874" y="490" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">prior CmWV classifier —</text>
    <text x="874" y="517" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">across three downstream</text>
    <text x="874" y="544" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">evaluation protocols.</text>
  </g>
</svg>
