<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">06 · DATASET / BENCHMARK</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">Two datasets: a <tspan fill="#0B6E9E">firehose</tspan> and a <tspan fill="#1E8E5A">benchmark</tspan></text>

  <!-- Cue 1 : lead banner -->
  <g id="cue_s06_c1_two_datasets_drive_study">
    <title>Two datasets drive the study</title>
    <desc>two datasets drive study pretraining pool labeled benchmark</desc>
    <rect x="72" y="172" width="1136" height="72" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="172" width="8" height="72" rx="4" fill="#0B6E9E"/>
    <text x="104" y="216" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Two datasets drive the study — one huge unlabeled pool, one small labeled set.</text>
  </g>

  <!-- Cue 2 : pretraining pool -->
  <g id="cue_s06_c2_pretraining_pool_nearly_three_millio">
    <title>Unlabeled pretraining pool of three million images</title>
    <desc>pretraining pool nearly three million unlabeled wave-mode images sentinel-1 A B 2017 2019 twenty by twenty kilometer patch five meter resolution ninety percent training ten percent validation</desc>
    <rect x="72" y="264" width="548" height="230" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="264" width="8" height="230" rx="4" fill="#0B6E9E"/>
    <text x="104" y="298" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">UNLABELED PRETRAINING POOL</text>
    <text x="104" y="358" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="48" font-weight="700" fill="#0B6E9E">&#8776; 3 million</text>
    <text x="104" y="392" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">unlabeled Wave-mode ocean images</text>
    <text x="104" y="432" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">Sentinel-1 A &amp; B · 2017–2019 · 20 × 20 km · 5 m</text>
    <text x="104" y="464" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="19" fill="#12212B">90% training · 10% validation</text>
  </g>

  <!-- Cue 4 : split -->
  <g id="cue_s06_c4_set_stratified_split_sixty_twenty">
    <title>Stratified 60 / 20 / 20 split</title>
    <desc>set stratified split sixty twenty twenty training validation held-out test data</desc>
    <rect x="72" y="510" width="548" height="100" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="510" width="8" height="100" rx="4" fill="#1E8E5A"/>
    <text x="104" y="552" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#12212B">Stratified split <tspan fill="#1E8E5A">60 / 20 / 20</tspan></text>
    <text x="104" y="584" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#5E6E7A">training · validation · held-out test</text>
  </g>

  <!-- Cue 3 : labeled benchmark with SAR class panels -->
  <g id="cue_s06_c3_labeled_benchmark_contains_twenty_th">
    <title>Labeled benchmark of 2,300 vignettes across four classes</title>
    <desc>labeled benchmark contains twenty-three hundred vignettes annotated experts consensus multi-label ground truth four classes mesoscale convection cells wind streaks negligible variability other</desc>
    <rect x="660" y="264" width="548" height="346" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="264" width="8" height="346" rx="4" fill="#1E8E5A"/>
    <text x="692" y="304" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Labeled benchmark</text>
    <text x="692" y="334" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" fill="#5E6E7A">2,300 expert vignettes · 4 consensus multi-label classes</text>
    <image xlink:href="../images/sar_mc.png" x="692" y="356" width="116" height="176" preserveAspectRatio="xMidYMid slice"/>
    <image xlink:href="../images/sar_ws.png" x="816" y="356" width="116" height="176" preserveAspectRatio="xMidYMid slice"/>
    <image xlink:href="../images/sar_nv.png" x="940" y="356" width="116" height="176" preserveAspectRatio="xMidYMid slice"/>
    <image xlink:href="../images/sar_ot.png" x="1064" y="356" width="116" height="176" preserveAspectRatio="xMidYMid slice"/>
    <text x="750" y="562" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#12212B">MC</text>
    <text x="874" y="562" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#12212B">WS</text>
    <text x="998" y="562" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#12212B">NV</text>
    <text x="1122" y="562" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="700" fill="#12212B">OT</text>
    <text x="692" y="596" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#5E6E7A">MC · WS · NV · Other  (multiple labels can co-occur)</text>
  </g>
</svg>
