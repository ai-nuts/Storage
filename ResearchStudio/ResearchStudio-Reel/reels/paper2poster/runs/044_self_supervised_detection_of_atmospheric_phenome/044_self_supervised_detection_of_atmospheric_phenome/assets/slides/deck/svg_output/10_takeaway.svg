<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="ending">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">10 · TAKEAWAY</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">Honest verdict, <tspan fill="#1E8E5A">real progress</tspan></text>

  <!-- Cue 1 : marginal gains -->
  <g id="cue_s10_c1_honest_takeaway_self_supervised_cont">
    <title>Self-supervised gains are only marginal and costly</title>
    <desc>honest takeaway self-supervised contrastive learning least preliminary study offers only marginal gains simply transferring features model trained natural images costing far more compute</desc>
    <rect x="72" y="180" width="548" height="236" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="180" width="8" height="236" rx="4" fill="#D2492A"/>
    <text x="104" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#D2492A">&#10007; Only marginal gains</text>
    <text x="104" y="262" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">In this preliminary study, self-supervised</text>
    <text x="104" y="291" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">contrastive learning gives only marginal</text>
    <text x="104" y="320" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">gains over simply transferring features</text>
    <text x="104" y="349" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">from a model trained on natural images —</text>
    <text x="104" y="378" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#12212B">while costing far more compute.</text>
  </g>

  <!-- Cue 2 : dramatic improvement -->
  <g id="cue_s10_c2_yet_both_approaches_deliver_dramatic">
    <title>Both approaches leap over the prior CmWV classifier</title>
    <desc>yet both approaches deliver dramatic improvement over previous state-of-the-art classifier reading atmospheric phenomena ocean radar</desc>
    <rect x="660" y="180" width="548" height="236" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="180" width="8" height="236" rx="4" fill="#1E8E5A"/>
    <text x="692" y="222" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#1E8E5A">&#10003; A real leap over prior work</text>
    <text x="692" y="262" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Yet both approaches deliver a dramatic</text>
    <text x="692" y="291" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">improvement over the previous state-of-</text>
    <text x="692" y="320" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">the-art CmWV classifier for reading</text>
    <text x="692" y="349" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">atmospheric phenomena from ocean radar.</text>
  </g>

  <!-- Cue 3 : outlook banner -->
  <g id="cue_s10_c3_authors_argue_idea_still_holds">
    <title>The idea still holds promise for future work</title>
    <desc>authors argue idea still holds promise longer training better tuning pretext tasks designed remote sensing deserve exploration final conclusions</desc>
    <rect x="72" y="440" width="720" height="200" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="440" width="8" height="200" rx="4" fill="#0B6E9E"/>
    <text x="112" y="500" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#12212B">The idea still holds <tspan fill="#0B6E9E">promise</tspan> — longer training,</text>
    <text x="112" y="532" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#12212B">better tuning, and remote-sensing-specific</text>
    <text x="112" y="564" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#12212B">pretext tasks deserve exploration first.</text>
    <text x="112" y="606" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#5E6E7A">Glaser · Sadowski · Stopa — University of Hawai&#699;i at M&#257;noa</text>
  </g>

  <!-- QR utility tile -->
  <rect x="812" y="440" width="396" height="200" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
  <image xlink:href="../images/qr_paper.png" x="836" y="445" width="190" height="190" preserveAspectRatio="xMidYMid meet"/>
  <text x="1054" y="512" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#5E6E7A">READ THE</text>
  <text x="1054" y="536" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#5E6E7A">PAPER</text>
  <text x="1054" y="566" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" fill="#5E6E7A">NeurIPS 2022</text>
</svg>
