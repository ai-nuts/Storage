<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">05 · METHOD</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B"><tspan fill="#0B6E9E">SwAV</tspan>: cluster, then predict</text>

  <!-- Cue 1 -->
  <g id="cue_s05_c1_core_method_swav_contrastive_framewo">
    <title>SwAV swaps cluster assignments between views</title>
    <desc>core method swav contrastive framework assigns image representations clusters trains network predict cluster assignment one augmented view from another</desc>
    <rect x="72" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="220" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Swap clusters between views</text>
    <text x="104" y="260" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">SwAV assigns image representations to</text>
    <text x="104" y="289" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">clusters, then trains the network to predict</text>
    <text x="104" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">the cluster assignment of one augmented</text>
    <text x="104" y="347" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">view from another.</text>
  </g>

  <!-- Cue 2 -->
  <g id="cue_s05_c2_unlike_methods_such_simclr_swav">
    <title>No giant batches thanks to a queue</title>
    <desc>unlike methods such simclr swav avoids prohibitively large batches storing recent cluster assignments queue</desc>
    <rect x="660" y="180" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="180" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="692" y="220" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">No giant batches</text>
    <text x="692" y="260" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Unlike SimCLR, SwAV avoids prohibitively</text>
    <text x="692" y="289" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">large batches by storing recent cluster</text>
    <text x="692" y="318" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">assignments in a queue — keeping training</text>
    <text x="692" y="347" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">tractable.</text>
  </g>

  <!-- Cue 3 : training config -->
  <g id="cue_s05_c3_authors_train_standard_resnet_50_bac">
    <title>Training setup for SwAV pretraining</title>
    <desc>authors train standard resnet-50 backbone swav batch size one thousand twenty-four eight v100 gpus queue sixteen batches one thousand cluster centroids sixty-five epochs ten days compute</desc>
    <rect x="72" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="405" width="8" height="205" rx="4" fill="#0B6E9E"/>
    <text x="104" y="445" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Training setup</text>
    <text x="104" y="485" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Backbone: standard ResNet-50</text>
    <text x="104" y="514" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Batch 1,024 · 8× V100 GPUs</text>
    <text x="104" y="543" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Queue 16 batches · 1,000 centroids</text>
    <text x="104" y="572" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">65 epochs · ~10 days compute</text>
  </g>

  <!-- Cue 4 : three protocols -->
  <g id="cue_s05_c4_measure_representation_quality_they">
    <title>Three downstream evaluation protocols</title>
    <desc>measure representation quality they three downstream protocols weighted k-nearest-neighbor classifier linear evaluation freezes backbone softmax full end-to-end fine-tuning labeled data</desc>
    <rect x="660" y="405" width="548" height="205" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="405" width="8" height="205" rx="4" fill="#1E8E5A"/>
    <text x="692" y="445" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">Three eval protocols</text>
    <text x="692" y="478" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#5E6E7A">Measuring representation quality three ways:</text>
    <text x="692" y="512" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">• Weighted k-nearest-neighbor</text>
    <text x="692" y="541" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">• Linear eval (frozen + softmax)</text>
    <text x="692" y="570" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">• Full end-to-end fine-tuning</text>
  </g>
</svg>
