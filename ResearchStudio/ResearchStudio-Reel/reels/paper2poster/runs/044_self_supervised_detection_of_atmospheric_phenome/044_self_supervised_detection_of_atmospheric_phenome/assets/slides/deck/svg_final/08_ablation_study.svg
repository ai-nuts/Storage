<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">08 · ABLATION STUDY</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">The gap <tspan fill="#D2492A">closes</tspan> when you fine-tune</text>

  <!-- Cue 1 : lead banner -->
  <g id="cue_s08_c1_most_informative_comparison_across_t">
    <title>Most informative comparison across three protocols</title>
    <desc>most informative comparison across three evaluation protocols</desc>
    <rect x="72" y="172" width="1136" height="72" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="172" width="8" height="72" rx="4" fill="#0B6E9E"/>
    <text x="104" y="216" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="24" font-weight="700" fill="#12212B">The most informative comparison is across the three evaluation protocols.</text>
  </g>

  <!-- Cue 2 : frozen backbone -->
  <g id="cue_s08_c2_when_backbone_frozen_self_supervised">
    <title>Frozen backbone: self-supervised holds a small edge</title>
    <desc>when backbone frozen self-supervised contrastive weights hold small edge zero point eight six four versus zero point eight five nine nearest-neighbor zero point eight four one versus zero point eight three six linear evaluation</desc>
    <rect x="72" y="264" width="548" height="250" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="264" width="8" height="250" rx="4" fill="#1E8E5A"/>
    <text x="104" y="302" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="23" font-weight="700" fill="#12212B">Backbone FROZEN</text>
    <text x="104" y="330" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" fill="#1E8E5A">Self-supervised holds a small edge</text>
    <text x="104" y="378" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5E6E7A">PROTOCOL</text>
    <text x="410" y="378" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5E6E7A">SSL</text>
    <text x="540" y="378" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5E6E7A">IMAGENET</text>
    <line x1="104" y1="390" x2="588" y2="390" stroke="#D5DEE5" stroke-width="1"/>
    <text x="104" y="428" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">k-NN</text>
    <text x="410" y="428" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#1E8E5A">0.864</text>
    <text x="540" y="428" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#5E6E7A">0.859</text>
    <text x="104" y="470" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Linear eval</text>
    <text x="410" y="470" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#1E8E5A">0.841</text>
    <text x="540" y="470" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#5E6E7A">0.836</text>
  </g>

  <!-- Cue 3 : fine-tuned -->
  <g id="cue_s08_c3_but_once_all_weights_fine_tuned">
    <title>Fine-tuned end-to-end: the edge vanishes and reverses</title>
    <desc>but once all weights fine-tuned end to end gap disappears slightly reverses imagenet initialization zero point nine three one against contrastive zero point nine two nine</desc>
    <rect x="660" y="264" width="548" height="250" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="660" y="264" width="8" height="250" rx="4" fill="#D2492A"/>
    <text x="692" y="302" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="23" font-weight="700" fill="#12212B">All weights FINE-TUNED</text>
    <text x="692" y="330" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" fill="#D2492A">The edge vanishes — even reverses</text>
    <text x="692" y="378" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5E6E7A">PROTOCOL</text>
    <text x="998" y="378" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5E6E7A">SSL</text>
    <text x="1128" y="378" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#5E6E7A">IMAGENET</text>
    <line x1="692" y1="390" x2="1176" y2="390" stroke="#D5DEE5" stroke-width="1"/>
    <text x="692" y="432" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#12212B">Fine-tune all</text>
    <text x="998" y="432" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" fill="#5E6E7A">0.929</text>
    <text x="1128" y="432" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#D2492A">0.931</text>
    <text x="692" y="482" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" fill="#5E6E7A">Gap ≈ 0 — ImageNet now edges ahead</text>
  </g>

  <!-- Cue 4 : takeaway banner -->
  <g id="cue_s08_c4_other_words_benefit_self_supervised">
    <title>Self-supervised benefit vanishes after full fine-tuning</title>
    <desc>other words benefit self-supervised pretraining vanishes once whole network allowed adapt</desc>
    <rect x="72" y="530" width="1136" height="80" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="530" width="8" height="80" rx="4" fill="#D2492A"/>
    <text x="640" y="578" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="23" font-weight="700" fill="#12212B">The benefit of self-supervised pretraining <tspan fill="#D2492A">vanishes</tspan> once the whole network can adapt.</text>
  </g>
</svg>
