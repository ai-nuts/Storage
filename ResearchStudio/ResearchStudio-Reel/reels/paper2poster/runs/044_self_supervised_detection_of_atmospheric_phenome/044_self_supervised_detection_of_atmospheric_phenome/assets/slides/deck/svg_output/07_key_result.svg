<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <text x="72" y="80" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#5E6E7A">07 · KEY RESULT</text>
  <rect x="72" y="92" width="44" height="4" fill="#0B6E9E"/>
  <text x="72" y="140" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="42" font-weight="700" fill="#12212B">Big jumps on the <tspan fill="#0B6E9E">hardest classes</tspan></text>

  <!-- Cue 1 : hero AUROC -->
  <g id="cue_s07_c1_headline_result_fine_tuned_models_re">
    <title>Best micro-averaged AUROC about 0.93</title>
    <desc>headline result fine-tuned models reach best micro-averaged area under roc curve about zero point nine three</desc>
    <rect x="72" y="176" width="360" height="134" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="176" width="8" height="134" rx="4" fill="#0B6E9E"/>
    <text x="104" y="212" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#5E6E7A">BEST MICRO-AVG AUROC</text>
    <text x="104" y="278" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="56" font-weight="700" fill="#0B6E9E">0.93</text>
    <text x="270" y="278" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#5E6E7A">fine-tuned models</text>
  </g>

  <!-- Cue 2 : both beat CmWV -->
  <g id="cue_s07_c2_both_contrastive_imagenet_pretrained">
    <title>Both models beat the earlier CmWV classifier</title>
    <desc>both contrastive imagenet-pretrained models comfortably beat earlier cmwv classifier two hardest atmospheric classes</desc>
    <rect x="72" y="324" width="360" height="134" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="324" width="8" height="134" rx="4" fill="#1E8E5A"/>
    <text x="104" y="360" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#12212B">Both beat CmWV</text>
    <text x="104" y="394" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#12212B">Contrastive and ImageNet models</text>
    <text x="104" y="418" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#12212B">comfortably beat the old CmWV</text>
    <text x="104" y="442" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#12212B">on the two hardest classes.</text>
  </g>

  <!-- Cue 4 : NV tie -->
  <g id="cue_s07_c4_negligible_variability_class_all_thr">
    <title>Negligible variability class near 0.95 for all</title>
    <desc>negligible-variability class all three models perform about equally well near zero point nine five</desc>
    <rect x="72" y="472" width="360" height="138" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <rect x="72" y="472" width="8" height="138" rx="4" fill="#5E6E7A"/>
    <text x="104" y="508" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#12212B">Easy class: a tie</text>
    <text x="104" y="542" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#12212B">On negligible variability, all</text>
    <text x="104" y="566" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" fill="#12212B">three models land near</text>
    <text x="104" y="592" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="700" fill="#12212B">0.95.</text>
  </g>

  <!-- Cue 3 : grouped bar chart on the two hard classes -->
  <g id="cue_s07_c3_wind_streaks_new_models_score">
    <title>Wind streaks and convection cells: new models vs CmWV</title>
    <desc>wind streaks new models score mid eighties compared cmwv zero point seven three convection cells about zero point eight seven versus zero point seven nine</desc>
    <rect x="456" y="176" width="752" height="434" rx="14" fill="#F3F6F9" stroke="#D5DEE5" stroke-width="1"/>
    <text x="488" y="214" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="700" fill="#12212B">Detection on the two hardest classes — AUROC</text>
    <!-- legend row below title -->
    <rect x="740" y="240" width="18" height="18" rx="3" fill="#9AA7B1"/>
    <text x="764" y="255" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#12212B">CmWV (prior)</text>
    <rect x="980" y="240" width="18" height="18" rx="3" fill="#0B6E9E"/>
    <text x="1004" y="255" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" fill="#12212B">New models</text>
    <!-- axis baseline -->
    <line x1="540" y1="560" x2="1180" y2="560" stroke="#C2CCD4" stroke-width="2"/>
    <text x="524" y="566" text-anchor="end" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" fill="#5E6E7A">0.5</text>
    <!-- WS bars -->
    <rect x="640" y="402" width="90" height="158" fill="#9AA7B1"/>
    <rect x="744" y="319" width="90" height="241" fill="#0B6E9E"/>
    <text x="685" y="392" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#5E6E7A">0.73</text>
    <text x="789" y="309" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#0B6E9E">~0.85</text>
    <text x="737" y="588" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#12212B">Wind streaks</text>
    <!-- MC bars -->
    <rect x="968" y="360" width="90" height="200" fill="#9AA7B1"/>
    <rect x="1072" y="305" width="90" height="255" fill="#0B6E9E"/>
    <text x="1013" y="350" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#5E6E7A">0.79</text>
    <text x="1117" y="295" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#0B6E9E">~0.87</text>
    <text x="1065" y="588" text-anchor="middle" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#12212B">Convection cells</text>
  </g>
</svg>
