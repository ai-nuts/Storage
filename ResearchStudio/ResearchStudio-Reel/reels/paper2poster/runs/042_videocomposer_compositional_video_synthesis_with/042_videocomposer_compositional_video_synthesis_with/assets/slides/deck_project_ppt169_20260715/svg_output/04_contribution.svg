<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">04 · CONTRIBUTION</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">What VideoComposer contributes</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 intro banner -->
  <g id="cue_s04_c1_videocomposer_makes_three_contributi">
    <title>videocomposer makes three contributions one model arbitrary combinations conditions</title>
    <desc>VideoComposer makes three contributions.</desc>
    <rect filter="url(#cardShadow)" x="72" y="158" width="1136" height="72" rx="14" fill="#EEF2F7" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="100" y="192" font-size="23" font-weight="800" fill="#0F172A">Three contributions</text>
    <text x="100" y="216" font-size="16" fill="#64748B">One model handles text · image · sketch · depth · mask · motion vectors · style, composed arbitrarily.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s04_c2_first_frames_video_generation_compos">
    <title>first frames video generation compositional user supplies any subset conditions recomposes</title>
    <desc>First, it frames video generation as compositional: a user supplies any subset of textual, spatial, and temporal conditions, and the model recomposes a video obeying all of them.</desc>
    <rect filter="url(#cardShadow)" x="72" y="250" width="360" height="292" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="72" y="250" width="360" height="8" rx="4" fill="#2563EB"/>
    <text x="104" y="308" font-size="40" font-weight="800" fill="#DBEAFE">01</text>
    <text x="104" y="352" font-size="22" font-weight="700" fill="#0F172A">Compositional</text>
    <text x="104" y="380" font-size="22" font-weight="700" fill="#0F172A">framework</text>
    <text x="104" y="418" font-size="17" fill="#334155">A user supplies any subset</text>
    <text x="104" y="442" font-size="17" fill="#334155">of textual, spatial and</text>
    <text x="104" y="466" font-size="17" fill="#334155">temporal conditions — the</text>
    <text x="104" y="490" font-size="17" fill="#334155">model recomposes a video</text>
    <text x="104" y="514" font-size="17" font-weight="700" fill="#1D4ED8">obeying all of them.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s04_c3_second_introduces_motion_vectors_com">
    <title>second introduces motion vectors compressed video explicit temporal control signal</title>
    <desc>Second, it introduces motion vectors from compressed video as an explicit temporal control signal.</desc>
    <rect filter="url(#cardShadow)" x="460" y="250" width="360" height="292" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect x="460" y="250" width="360" height="8" rx="4" fill="#EA580C"/>
    <text x="492" y="308" font-size="40" font-weight="800" fill="#FDBA74">02</text>
    <text x="492" y="352" font-size="22" font-weight="700" fill="#0F172A">Motion vectors as</text>
    <text x="492" y="380" font-size="22" font-weight="700" fill="#0F172A">temporal control</text>
    <text x="492" y="418" font-size="17" fill="#334155">Motion vectors from</text>
    <text x="492" y="442" font-size="17" fill="#334155">compressed video become</text>
    <text x="492" y="466" font-size="17" fill="#334155">an <tspan font-weight="700" fill="#EA580C">explicit temporal</tspan></text>
    <text x="492" y="490" font-size="17" font-weight="700" fill="#EA580C">control signal</text>
    <text x="492" y="514" font-size="17" fill="#334155">for guiding dynamics.</text>
  </g>

  <!-- c4 -->
  <g id="cue_s04_c4_third_proposes_spatio_temporal_condi">
    <title>third proposes spatio-temporal condition encoder STC lightweight module shared representation temporal consistency</title>
    <desc>Third, it proposes the Spatio-Temporal Condition encoder, a lightweight module that turns every sequential condition into a shared representation while boosting temporal consistency.</desc>
    <rect filter="url(#cardShadow)" x="848" y="250" width="360" height="292" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="848" y="250" width="360" height="8" rx="4" fill="#059669"/>
    <text x="880" y="308" font-size="40" font-weight="800" fill="#A7F3D0">03</text>
    <text x="880" y="352" font-size="22" font-weight="700" fill="#0F172A">STC-encoder</text>
    <text x="880" y="380" font-size="16" fill="#64748B">Spatio-Temporal Condition</text>
    <text x="880" y="418" font-size="17" fill="#334155">A lightweight module that</text>
    <text x="880" y="442" font-size="17" fill="#334155">turns every sequential</text>
    <text x="880" y="466" font-size="17" fill="#334155">condition into a <tspan font-weight="700" fill="#059669">shared</tspan></text>
    <text x="880" y="490" font-size="17" font-weight="700" fill="#059669">representation</text>
    <text x="880" y="514" font-size="17" fill="#334155">— boosting consistency.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">04 / 10</text>
</svg>
