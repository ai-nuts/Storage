<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <linearGradient id="heroWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#heroWash)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="1208" y="60" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">NeurIPS 2023</text>

  <!-- c1: title / brand / authors -->
  <g id="cue_s01_c1_videocomposer_alibaba_ant_group_make">
    <title>videocomposer alibaba ant group makes video generation controllable composition</title>
    <desc>VideoComposer, from Alibaba and Ant Group, makes video generation controllable through composition.</desc>
    <text x="72" y="150" font-size="20" font-weight="700" fill="#2563EB" letter-spacing="4">COMPOSITIONAL VIDEO SYNTHESIS</text>
    <text x="70" y="228" font-size="66" font-weight="800" fill="#0F172A">VideoComposer</text>
    <text x="72" y="272" font-size="25" font-weight="600" fill="#334155">Controllable video synthesis with motion controllability</text>
    <text x="72" y="318" font-size="16" fill="#64748B">Wang, Yuan, Zhang, Chen, Wang, Zhang, Shen, Zhao, Zhou</text>
    <text x="72" y="342" font-size="16" font-weight="700" fill="#475569">Alibaba Group  ·  Ant Group</text>
  </g>

  <!-- c2: three condition families -->
  <g id="cue_s01_c2_users_combine_textual_spatial_tempor">
    <title>users combine textual spatial temporal conditions at once composition</title>
    <desc>Users combine textual, spatial, and temporal conditions at once.</desc>
    <text x="72" y="400" font-size="15" font-weight="700" fill="#64748B" letter-spacing="2">COMPOSE FROM THREE CONDITION FAMILIES</text>
    <g>
      <rect filter="url(#cardShadow)" x="72" y="414" width="196" height="70" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
      <rect x="72" y="414" width="196" height="70" rx="12" fill="#2563EB" opacity="0.06"/>
      <text x="170" y="446" text-anchor="middle" font-size="20" font-weight="700" fill="#1D4ED8">Textual</text>
      <text x="170" y="469" text-anchor="middle" font-size="14" fill="#64748B">caption · style</text>
    </g>
    <g>
      <rect filter="url(#cardShadow)" x="284" y="414" width="196" height="70" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="2"/>
      <rect x="284" y="414" width="196" height="70" rx="12" fill="#0891B2" opacity="0.06"/>
      <text x="382" y="446" text-anchor="middle" font-size="20" font-weight="700" fill="#0891B2">Spatial</text>
      <text x="382" y="469" text-anchor="middle" font-size="14" fill="#64748B">sketch · depth · image</text>
    </g>
    <g>
      <rect filter="url(#cardShadow)" x="496" y="414" width="196" height="70" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="2"/>
      <rect x="496" y="414" width="196" height="70" rx="12" fill="#EA580C" opacity="0.06"/>
      <text x="594" y="446" text-anchor="middle" font-size="20" font-weight="700" fill="#EA580C">Temporal</text>
      <text x="594" y="469" text-anchor="middle" font-size="14" fill="#64748B">motion vectors · mask</text>
    </g>
  </g>

  <!-- c3: two key ideas -->
  <g id="cue_s01_c3_its_key_ideas_motion_vectors">
    <title>key ideas motion vectors compressed video explicit temporal signal STC-encoder</title>
    <desc>Key ideas: motion vectors from compressed video as an explicit temporal signal, and a unified Spatio-Temporal Condition encoder.</desc>
    <g>
      <rect filter="url(#cardShadow)" x="72" y="506" width="620" height="96" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <rect x="72" y="506" width="8" height="96" rx="4" fill="#2563EB"/>
      <text x="102" y="540" font-size="15" font-weight="700" fill="#2563EB" letter-spacing="1">TWO KEY IDEAS</text>
      <text x="102" y="568" font-size="18" fill="#1E293B"><tspan font-weight="700">Motion vectors</tspan> from compressed video = explicit temporal signal</text>
      <text x="102" y="592" font-size="18" fill="#1E293B"><tspan font-weight="700">STC-encoder</tspan> fuses diverse controls, keeps frames consistent</text>
    </g>
  </g>

  <!-- right: teaser figure + utility cluster -->
  <g>
    <rect filter="url(#cardShadow)" x="756" y="150" width="452" height="352" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <image xlink:href="../images/figure1.png" x="772" y="166" width="420" height="320" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="982" y="486" text-anchor="middle" font-size="13" fill="#94A3B8">Text, sketch, depth, motion &amp; strokes → coherent video</text>

  <g>
    <image xlink:href="../images/alibaba-group.png" x="756" y="524" width="150" height="44" preserveAspectRatio="xMidYMid meet"/>
    <image xlink:href="../images/ant-group.png" x="924" y="524" width="150" height="44" preserveAspectRatio="xMidYMid meet"/>
    <g>
      <rect x="1104" y="516" width="104" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
      <image xlink:href="../images/code.png" x="1110" y="520" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>
      <text x="1170" y="540" font-size="12" font-weight="700" fill="#475569">Code</text>
      <text x="1170" y="558" font-size="11" fill="#94A3B8">GitHub</text>
    </g>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · Alibaba &amp; Ant Group</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">01 / 10</text>
</svg>
