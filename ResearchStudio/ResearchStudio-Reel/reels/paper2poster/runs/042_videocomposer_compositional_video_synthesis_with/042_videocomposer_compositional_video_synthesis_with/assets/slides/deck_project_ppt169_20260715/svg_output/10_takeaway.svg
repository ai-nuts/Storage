<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="takeWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">10 · TAKEAWAY</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Motion becomes a control dimension</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 headline takeaway -->
  <g id="cue_s10_c1_takeaway_video_generation_becomes_mo">
    <title>takeaway video generation becomes more controllable treat video composition conditions give motion explicit signal</title>
    <desc>Video generation becomes more controllable when you treat a video as a composition of conditions and give motion an explicit signal.</desc>
    <rect filter="url(#cardShadow)" x="72" y="158" width="1136" height="150" rx="16" fill="url(#takeWash)"/>
    <text x="104" y="212" font-size="15" font-weight="700" fill="#BFDBFE" letter-spacing="2">THE LASTING TAKEAWAY</text>
    <text x="104" y="256" font-size="28" font-weight="800" fill="#FFFFFF">Treat a video as a composition of conditions —</text>
    <text x="104" y="292" font-size="28" font-weight="800" fill="#FFFFFF">and give motion its own explicit signal.</text>
  </g>

  <!-- c2 how + versatility -->
  <g id="cue_s10_c2_videocomposer_combines_compressed_vi">
    <title>videocomposer combines compressed-video motion vectors spatio-temporal condition encoder steer content motion together text sketches depth masks reference videos two strokes frames consistent</title>
    <desc>VideoComposer combines compressed-video motion vectors with a Spatio-Temporal Condition encoder, so users steer content and motion together, from text, sketches, and depth to masks, reference videos, or two strokes, while keeping frames consistent.</desc>
    <rect filter="url(#cardShadow)" x="72" y="328" width="620" height="256" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="72" y="328" width="8" height="256" rx="4" fill="#2563EB"/>
    <text x="104" y="366" font-size="19" fill="#334155">Compressed-video <tspan font-weight="700" fill="#1D4ED8">motion vectors</tspan> + one</text>
    <text x="104" y="392" font-size="19" fill="#334155"><tspan font-weight="700" fill="#059669">STC-encoder</tspan> → steer content and motion together.</text>
    <text x="104" y="432" font-size="14" font-weight="700" fill="#64748B" letter-spacing="1">DRIVE THE SAME MODEL WITH</text>
    <g font-size="15" font-weight="700">
      <rect x="104" y="444" width="86" height="34" rx="17" fill="#DBEAFE"/><text x="147" y="466" text-anchor="middle" fill="#1D4ED8">Text</text>
      <rect x="198" y="444" width="104" height="34" rx="17" fill="#DBEAFE"/><text x="250" y="466" text-anchor="middle" fill="#1D4ED8">Sketches</text>
      <rect x="310" y="444" width="90" height="34" rx="17" fill="#E0F2FE"/><text x="355" y="466" text-anchor="middle" fill="#0891B2">Depth</text>
      <rect x="408" y="444" width="92" height="34" rx="17" fill="#E0F2FE"/><text x="454" y="466" text-anchor="middle" fill="#0891B2">Masks</text>
      <rect x="104" y="486" width="150" height="34" rx="17" fill="#FFF7ED"/><text x="179" y="508" text-anchor="middle" fill="#EA580C">Reference video</text>
      <rect x="262" y="486" width="132" height="34" rx="17" fill="#FFF7ED"/><text x="328" y="508" text-anchor="middle" fill="#EA580C">Two strokes</text>
    </g>
    <text x="104" y="554" font-size="17" fill="#334155">…all while <tspan font-weight="700" fill="#0F172A">keeping frames consistent</tspan> and text-to-video</text>
    <text x="104" y="576" font-size="17" fill="#334155">quality intact.</text>
  </g>

  <!-- right: hand-crafted motion figure -->
  <text x="716" y="352" font-size="15" font-weight="700" fill="#64748B" letter-spacing="1">HAND-CRAFTED MOTION</text>
  <g>
    <rect filter="url(#cardShadow)" x="716" y="366" width="492" height="218" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <image xlink:href="../images/figure9.png" x="732" y="392" width="460" height="150" preserveAspectRatio="xMidYMid meet"/>
    <text x="962" y="566" text-anchor="middle" font-size="14" fill="#64748B">Two simple strokes drive coherent, controllable motion.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · Alibaba &amp; Ant Group · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">10 / 10</text>
</svg>
