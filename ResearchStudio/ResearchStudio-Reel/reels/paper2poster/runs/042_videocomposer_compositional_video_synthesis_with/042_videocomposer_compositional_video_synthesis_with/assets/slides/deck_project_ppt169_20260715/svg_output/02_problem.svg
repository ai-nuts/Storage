<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">02 · THE PROBLEM</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Controlling video is far harder than images</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>
  <text x="72" y="164" font-size="19" fill="#64748B">Customizable image generation is mature — steering how a video <tspan font-weight="700" fill="#475569">moves over time</tspan> is the open frontier.</text>

  <!-- c1 -->
  <g id="cue_s02_c1_diffusion_models_made_image_generati">
    <title>diffusion models made image generation highly controllable images solved</title>
    <desc>Diffusion models made image generation highly controllable.</desc>
    <rect filter="url(#cardShadow)" x="72" y="192" width="360" height="360" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="72" y="192" width="360" height="8" rx="4" fill="#2563EB"/>
    <circle cx="116" cy="248" r="24" fill="#DBEAFE"/>
    <text x="116" y="256" text-anchor="middle" font-size="24" font-weight="800" fill="#1D4ED8">1</text>
    <text x="160" y="256" font-size="22" font-weight="700" fill="#0F172A">Images: solved</text>
    <text x="104" y="312" font-size="19" fill="#334155">Diffusion models made</text>
    <text x="104" y="340" font-size="19" fill="#334155">image generation</text>
    <text x="104" y="368" font-size="19" font-weight="700" fill="#1D4ED8">highly controllable.</text>
    <text x="104" y="410" font-size="16" fill="#64748B">Text, layout, subject and</text>
    <text x="104" y="434" font-size="16" fill="#64748B">style are all steerable in</text>
    <text x="104" y="458" font-size="16" fill="#64748B">a single generated frame.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s02_c2_video_adds_temporal_axis_motion">
    <title>video adds temporal axis motion patterns vary frames consistent neighbours</title>
    <desc>Video adds a temporal axis: motion patterns vary enormously across clips, and every frame must stay consistent with its neighbours.</desc>
    <rect filter="url(#cardShadow)" x="460" y="192" width="360" height="360" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect x="460" y="192" width="360" height="8" rx="4" fill="#EA580C"/>
    <circle cx="504" cy="248" r="24" fill="#FDBA74" opacity="0.5"/>
    <text x="504" y="256" text-anchor="middle" font-size="24" font-weight="800" fill="#EA580C">2</text>
    <text x="548" y="256" font-size="22" font-weight="700" fill="#0F172A">Video adds time</text>
    <text x="492" y="312" font-size="19" fill="#334155">A new <tspan font-weight="700" fill="#EA580C">temporal axis</tspan>:</text>
    <text x="492" y="340" font-size="19" fill="#334155">motion patterns vary</text>
    <text x="492" y="368" font-size="19" fill="#334155">enormously across clips.</text>
    <text x="492" y="410" font-size="16" fill="#64748B">And every generated frame</text>
    <text x="492" y="434" font-size="16" fill="#64748B">must stay consistent with</text>
    <text x="492" y="458" font-size="16" fill="#64748B">its neighbouring frames.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s02_c3_reusing_spatial_controls_designed_im">
    <title>reusing spatial controls designed images no reliable handle temporal dynamics</title>
    <desc>Reusing the spatial controls designed for images gives no reliable handle on temporal dynamics.</desc>
    <rect filter="url(#cardShadow)" x="848" y="192" width="360" height="360" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="848" y="192" width="360" height="8" rx="4" fill="#64748B"/>
    <circle cx="892" cy="248" r="24" fill="#E2E8F0"/>
    <text x="892" y="256" text-anchor="middle" font-size="24" font-weight="800" fill="#475569">3</text>
    <text x="936" y="256" font-size="22" font-weight="700" fill="#0F172A">Controls don't</text>
    <text x="936" y="282" font-size="22" font-weight="700" fill="#0F172A">transfer</text>
    <text x="880" y="330" font-size="19" fill="#334155">Reusing spatial controls</text>
    <text x="880" y="358" font-size="19" fill="#334155">built for images gives</text>
    <text x="880" y="386" font-size="19" fill="#334155"><tspan font-weight="700" fill="#0F172A">no reliable handle</tspan> on</text>
    <text x="880" y="414" font-size="19" fill="#334155">temporal dynamics.</text>
    <text x="880" y="470" font-size="16" font-style="italic" fill="#64748B">→ controllable video stayed</text>
    <text x="880" y="494" font-size="16" font-style="italic" fill="#64748B">an open challenge.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">02 / 10</text>
</svg>
