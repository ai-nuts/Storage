<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">09 · HEADLINE NUMBERS</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">The impact, in numbers</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 intro -->
  <g id="cue_s09_c1_few_numbers_capture_impact">
    <title>a few numbers capture the impact</title>
    <desc>A few numbers capture the impact.</desc>
    <rect filter="url(#cardShadow)" x="72" y="158" width="1136" height="58" rx="14" fill="#EEF2F7" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="100" y="194" font-size="20" font-weight="700" fill="#334155">A few numbers capture the impact of compositional, motion-aware video generation.</text>
  </g>

  <!-- c2 quality -->
  <g id="cue_s09_c2_msr_vtt_videocomposer_scores_chet_vi">
    <title>msr-vtt videocomposer scores frechet video distance 580 clip similarity 0.2932</title>
    <desc>On MSR-VTT, VideoComposer scores a Frechet Video Distance of 580 and a CLIP similarity of 0.2932.</desc>
    <rect filter="url(#cardShadow)" x="72" y="236" width="360" height="304" rx="16" fill="#F8FAFC" stroke="#DBEAFE" stroke-width="1.5"/>
    <rect x="72" y="236" width="360" height="8" rx="4" fill="#2563EB"/>
    <text x="104" y="286" font-size="15" font-weight="700" fill="#2563EB" letter-spacing="1">MSR-VTT · QUALITY</text>
    <text x="252" y="372" text-anchor="middle" font-size="76" font-weight="800" fill="#1D4ED8">580</text>
    <text x="252" y="402" text-anchor="middle" font-size="16" fill="#64748B">FVD (zero-shot)</text>
    <line x1="120" y1="426" x2="384" y2="426" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="252" y="480" text-anchor="middle" font-size="44" font-weight="800" fill="#0891B2">0.2932</text>
    <text x="252" y="508" text-anchor="middle" font-size="16" fill="#64748B">CLIP similarity</text>
  </g>

  <!-- c3 motion control -->
  <g id="cue_s09_c3_its_motion_control_error_falls_two">
    <title>its motion-control error falls two point one eight versus four point zero three text-only baseline</title>
    <desc>Its motion-control error falls to 2.18, versus 4.03 for a text-only baseline.</desc>
    <rect filter="url(#cardShadow)" x="460" y="236" width="360" height="304" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="460" y="236" width="360" height="8" rx="4" fill="#059669"/>
    <text x="492" y="286" font-size="15" font-weight="700" fill="#059669" letter-spacing="1">MOTION-CONTROL ERROR</text>
    <text x="640" y="376" text-anchor="middle" font-size="76" font-weight="800" fill="#059669">2.18</text>
    <text x="640" y="406" text-anchor="middle" font-size="16" fill="#64748B">full VideoComposer</text>
    <line x1="508" y1="430" x2="772" y2="430" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="640" y="474" text-anchor="middle" font-size="22" font-weight="700" fill="#475569">from 4.03</text>
    <text x="640" y="504" text-anchor="middle" font-size="16" fill="#64748B">text-only baseline · 46% lower</text>
  </g>

  <!-- c4 data -->
  <g id="cue_s09_c4_all_learned_two_datasets_webvid_10m">
    <title>all learned two public datasets webvid-10m laion-400m ten million pairs</title>
    <desc>And all is learned from two datasets, WebVid-10M and LAION-400M.</desc>
    <rect filter="url(#cardShadow)" x="848" y="236" width="360" height="304" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <rect x="848" y="236" width="360" height="8" rx="4" fill="#EA580C"/>
    <text x="880" y="286" font-size="15" font-weight="700" fill="#EA580C" letter-spacing="1">TRAINING DATA</text>
    <text x="1028" y="360" text-anchor="middle" font-size="76" font-weight="800" fill="#EA580C">2</text>
    <text x="1028" y="390" text-anchor="middle" font-size="16" fill="#64748B">public datasets</text>
    <line x1="896" y1="414" x2="1160" y2="414" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="1028" y="452" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">WebVid-10M</text>
    <text x="1028" y="478" text-anchor="middle" font-size="15" fill="#64748B">10.3M video–caption pairs</text>
    <text x="1028" y="512" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">+ LAION-400M</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">09 / 10</text>
</svg>
