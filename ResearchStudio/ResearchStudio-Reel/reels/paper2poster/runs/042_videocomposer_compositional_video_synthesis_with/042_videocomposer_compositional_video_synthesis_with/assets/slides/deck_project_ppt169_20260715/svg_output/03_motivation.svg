<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">03 · MOTIVATION</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Give motion its own explicit signal</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 thesis banner -->
  <g id="cue_s03_c1_control_video_you_must_control">
    <title>to control video you must control its motion not only appearance</title>
    <desc>To control a video, you must control its motion, not only its appearance.</desc>
    <rect filter="url(#cardShadow)" x="72" y="160" width="688" height="86" rx="14" fill="#2563EB"/>
    <text x="100" y="200" font-size="24" font-weight="800" fill="#FFFFFF">Control the motion, not just the appearance</text>
    <text x="100" y="230" font-size="17" fill="#DBEAFE">A video is defined by how things move across frames.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s03_c2_authors_insight_motion_vectors_compu">
    <title>insight motion vectors computed inside compressed video cheap explicit temporal dynamics</title>
    <desc>Motion vectors, computed inside compressed video to encode inter-frame change, are a cheap, explicit description of temporal dynamics.</desc>
    <rect filter="url(#cardShadow)" x="72" y="266" width="332" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="72" y="266" width="8" height="164" rx="4" fill="#0891B2"/>
    <text x="100" y="300" font-size="15" font-weight="700" fill="#0891B2" letter-spacing="1">THE INSIGHT</text>
    <text x="100" y="330" font-size="19" font-weight="700" fill="#0F172A">Motion vectors</text>
    <text x="100" y="358" font-size="17" fill="#334155">already live inside</text>
    <text x="100" y="382" font-size="17" fill="#334155">compressed video to encode</text>
    <text x="100" y="406" font-size="17" fill="#334155">inter-frame change — cheap,</text>
    <text x="100" y="424" font-size="14" font-weight="700" fill="#0891B2">explicit temporal dynamics.</text>
  </g>

  <!-- c3 -->
  <g id="cue_s03_c3_turning_them_control_signal_lets">
    <title>turning them into control signal lets users prescribe how things move</title>
    <desc>Turning them into a control signal lets users prescribe how things move.</desc>
    <rect filter="url(#cardShadow)" x="420" y="266" width="340" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="420" y="266" width="8" height="164" rx="4" fill="#2563EB"/>
    <text x="448" y="300" font-size="15" font-weight="700" fill="#2563EB" letter-spacing="1">THE HANDLE</text>
    <text x="448" y="330" font-size="19" font-weight="700" fill="#0F172A">A control signal</text>
    <text x="448" y="358" font-size="17" fill="#334155">Feed motion vectors in as</text>
    <text x="448" y="382" font-size="17" fill="#334155">conditioning, and users can</text>
    <text x="448" y="406" font-size="17" font-weight="700" fill="#1D4ED8">prescribe how things move</text>
    <text x="448" y="424" font-size="14" fill="#64748B">— directly and predictably.</text>
  </g>

  <!-- c4 tension banner -->
  <g id="cue_s03_c4_but_mixing_them_sketches_depth">
    <title>but mixing them sketches depth images hurts consistency motivating unified encoder space time</title>
    <desc>But mixing them with sketches, depth, and images naively hurts consistency, motivating a unified encoder for space and time.</desc>
    <rect filter="url(#cardShadow)" x="72" y="452" width="688" height="100" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="100" y="488" font-size="19" fill="#7C2D12"><tspan font-weight="800" fill="#EA580C">But</tspan> mixing motion vectors with sketches, depth and images</text>
    <text x="100" y="514" font-size="19" fill="#7C2D12">naively <tspan font-weight="700">hurts frame-to-frame consistency</tspan>.</text>
    <text x="100" y="540" font-size="16" font-weight="700" fill="#EA580C">→ motivates one unified encoder for space and time.</text>
  </g>

  <!-- right: motion vector figure -->
  <text x="792" y="180" font-size="15" font-weight="700" fill="#64748B" letter-spacing="1">EXAMPLES OF MOTION VECTORS</text>
  <g>
    <rect filter="url(#cardShadow)" x="792" y="196" width="416" height="356" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <image xlink:href="../images/figure3.png" x="808" y="230" width="384" height="248" preserveAspectRatio="xMidYMid meet"/>
    <text x="1000" y="512" text-anchor="middle" font-size="15" fill="#475569">Per-pixel arrows encode how content</text>
    <text x="1000" y="534" text-anchor="middle" font-size="15" fill="#475569">moves between adjacent frames.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">03 / 10</text>
</svg>
