<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">05 · METHOD</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Inside VideoComposer</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- left: architecture figure -->
  <text x="72" y="176" font-size="15" font-weight="700" fill="#64748B" letter-spacing="1">OVERALL ARCHITECTURE</text>
  <g>
    <rect filter="url(#cardShadow)" x="72" y="188" width="620" height="326" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <image xlink:href="../images/figure2.png" x="86" y="200" width="592" height="286" preserveAspectRatio="xMidYMid meet"/>
    <text x="382" y="502" text-anchor="middle" font-size="13" fill="#94A3B8">Decompose → STC-encode → fuse with noisy latent → denoise</text>
  </g>
  <!-- key equation -->
  <g>
    <rect filter="url(#cardShadow)" x="72" y="524" width="620" height="52" rx="12" fill="#0F172A"/>
    <text x="92" y="556" font-size="19" fill="#E2E8F0" font-style="italic">L</text>
    <text x="104" y="561" font-size="12" fill="#94A3B8">VLDM</text>
    <text x="150" y="556" font-size="19" fill="#E2E8F0" font-style="italic">= 𝔼 [ ‖ ε − ε</text>
    <text x="288" y="561" font-size="12" fill="#94A3B8">θ</text>
    <text x="296" y="556" font-size="19" fill="#E2E8F0" font-style="italic">( z</text>
    <text x="320" y="561" font-size="12" fill="#94A3B8">t</text>
    <text x="326" y="556" font-size="19" fill="#E2E8F0" font-style="italic">, c, t ) ‖²₂ ]</text>
    <text x="672" y="556" text-anchor="end" font-size="13" fill="#64748B">latent denoising loss</text>
  </g>

  <!-- c1 -->
  <g id="cue_s05_c1_videocomposer_latent_diffusion_denoi">
    <title>videocomposer latent diffusion denoises video compressed latent space decomposed three families</title>
    <desc>VideoComposer is a latent diffusion model that denoises video in a compressed latent space. Each training video is decomposed into three families of conditions, combined freely.</desc>
    <rect filter="url(#cardShadow)" x="716" y="158" width="492" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="716" y="158" width="8" height="96" rx="4" fill="#2563EB"/>
    <text x="744" y="188" font-size="19" font-weight="700" fill="#0F172A">Latent diffusion backbone</text>
    <text x="744" y="214" font-size="16" fill="#334155">Denoises video in a compressed latent space;</text>
    <text x="744" y="238" font-size="16" fill="#334155">each video splits into <tspan font-weight="700" fill="#1D4ED8">three condition families</tspan>.</text>
  </g>

  <!-- c2 -->
  <g id="cue_s05_c2_sequential_conditions_like_motion_ve">
    <title>sequential conditions motion vectors depth maps masks sketches shared STC-encoder convolutions pooling temporal transformer frames</title>
    <desc>Sequential conditions like motion vectors, depth maps, masks, and sketches all pass through one shared STC-encoder: two convolutions and pooling capture local spatial structure, then a temporal Transformer models change across frames.</desc>
    <rect filter="url(#cardShadow)" x="716" y="266" width="492" height="140" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <rect x="716" y="266" width="8" height="140" rx="4" fill="#059669"/>
    <text x="744" y="296" font-size="19" font-weight="700" fill="#0F172A">The shared STC-encoder</text>
    <text x="744" y="322" font-size="16" fill="#334155">Motion vectors, depth, masks &amp; sketches all enter</text>
    <text x="744" y="344" font-size="16" fill="#334155">one module:</text>
    <text x="744" y="372" font-size="16" fill="#334155">• 2 convolutions + pooling → local spatial structure</text>
    <text x="744" y="396" font-size="16" fill="#334155">• temporal Transformer → change across frames</text>
  </g>

  <!-- c3 -->
  <g id="cue_s05_c3_encoded_conditions_summed_concatenat">
    <title>encoded conditions summed concatenated noisy latent text style cross-attention</title>
    <desc>Encoded conditions are summed and concatenated with the noisy latent, while text and style enter through cross-attention.</desc>
    <rect filter="url(#cardShadow)" x="716" y="418" width="492" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="716" y="418" width="8" height="74" rx="4" fill="#0891B2"/>
    <text x="744" y="446" font-size="19" font-weight="700" fill="#0F172A">Fusion</text>
    <text x="744" y="472" font-size="16" fill="#334155">Sum &amp; concat with the noisy latent; text + style via <tspan font-weight="700" fill="#0891B2">cross-attention</tspan>.</text>
  </g>

  <!-- c4 -->
  <g id="cue_s05_c4_runs_two_stages_inference_ddim">
    <title>training runs two stages inference DDIM sampling classifier-free guidance</title>
    <desc>Training runs in two stages, and inference uses DDIM sampling with classifier-free guidance.</desc>
    <rect filter="url(#cardShadow)" x="716" y="504" width="492" height="66" rx="14" fill="#EEF2F7" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="716" y="504" width="8" height="66" rx="4" fill="#475569"/>
    <text x="744" y="532" font-size="19" font-weight="700" fill="#0F172A">Training &amp; inference</text>
    <text x="744" y="556" font-size="16" fill="#334155">Two-stage training; DDIM sampling + classifier-free guidance.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">05 / 10</text>
</svg>
