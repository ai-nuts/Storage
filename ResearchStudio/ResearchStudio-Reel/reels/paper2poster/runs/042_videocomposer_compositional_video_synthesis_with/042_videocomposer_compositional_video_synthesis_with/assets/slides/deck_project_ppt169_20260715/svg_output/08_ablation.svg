<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">08 · ABLATION STUDY</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Where does the control come from?</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 intro -->
  <g id="cue_s08_c1_ablations_isolate_where_control_orig">
    <title>ablations isolate where control originates motion-control error lower better</title>
    <desc>The ablations isolate where control originates.</desc>
    <rect filter="url(#cardShadow)" x="72" y="158" width="1136" height="60" rx="14" fill="#EEF2F7" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="100" y="184" font-size="20" font-weight="800" fill="#0F172A">Isolating the source of temporal control</text>
    <text x="100" y="206" font-size="15" fill="#64748B">Metric: motion-control error on 1,000 caption–video pairs — lower is better.</text>
  </g>

  <!-- c2 text only -->
  <g id="cue_s08_c2_only_text_gives_motion_control_error">
    <title>only text gives motion-control error four point zero three baseline</title>
    <desc>Using only text gives a motion-control error of 4.03.</desc>
    <rect filter="url(#cardShadow)" x="72" y="234" width="568" height="92" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="96" y="266" font-size="18" font-weight="700" fill="#475569">① Text only</text>
    <rect x="96" y="280" width="360" height="30" rx="6" fill="#94A3B8"/>
    <text x="470" y="302" font-size="24" font-weight="800" fill="#475569">4.03</text>
    <text x="540" y="266" text-anchor="end" font-size="14" fill="#94A3B8">baseline</text>
  </g>

  <!-- c3 add motion vectors + STC -->
  <g id="cue_s08_c3_adding_motion_vectors_temporal_condi">
    <title>adding motion vectors temporal condition drops two point six seven enabling STC-encoder lowers two point one eight</title>
    <desc>Adding motion vectors as a temporal condition drops it to 2.67, and enabling the Spatio-Temporal Condition encoder lowers it to 2.18.</desc>
    <rect filter="url(#cardShadow)" x="72" y="338" width="568" height="176" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="96" y="372" font-size="18" font-weight="700" fill="#0F172A">② + Motion vectors</text>
    <rect x="96" y="384" width="238" height="30" rx="6" fill="#EA580C"/>
    <text x="348" y="406" font-size="24" font-weight="800" fill="#EA580C">2.67</text>
    <text x="540" y="406" text-anchor="end" font-size="14" fill="#059669">−1.36</text>

    <text x="96" y="452" font-size="18" font-weight="700" fill="#0F172A">③ + STC-encoder</text>
    <rect x="96" y="464" width="195" height="30" rx="6" fill="#059669"/>
    <text x="305" y="486" font-size="24" font-weight="800" fill="#059669">2.18</text>
    <text x="540" y="486" text-anchor="end" font-size="14" fill="#059669">best</text>
  </g>

  <!-- c4 conclusion -->
  <g id="cue_s08_c4_both_matter_motion_vectors_supply">
    <title>both matter motion vectors supply signal STC-encoder makes model use it</title>
    <desc>Both matter: motion vectors supply the signal, and the STC-encoder makes the model use it.</desc>
    <rect filter="url(#cardShadow)" x="72" y="526" width="568" height="58" rx="14" fill="#2563EB"/>
    <text x="96" y="552" font-size="16" fill="#FFFFFF"><tspan font-weight="800">Both matter:</tspan> motion vectors supply the temporal signal,</text>
    <text x="96" y="574" font-size="16" fill="#DBEAFE">and the STC-encoder makes the model actually use it.</text>
  </g>

  <!-- right qualitative -->
  <text x="688" y="252" font-size="15" font-weight="700" fill="#64748B" letter-spacing="1">QUALITATIVE ABLATION</text>
  <g>
    <rect filter="url(#cardShadow)" x="688" y="266" width="520" height="248" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <image xlink:href="../images/figure10.png" x="704" y="300" width="488" height="168" preserveAspectRatio="xMidYMid meet"/>
    <text x="948" y="496" text-anchor="middle" font-size="14" fill="#64748B">Without the STC-encoder, temporal structure and consistency degrade.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">08 / 10</text>
</svg>
