<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">06 · DATA &amp; BENCHMARK</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Trained public, evaluated standard</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 training data -->
  <g id="cue_s06_c1_videocomposer_trained_two_public_dat">
    <title>videocomposer trained two public datasets webvid-10m ten million video-caption pairs laion-400m clip-filtered image-caption</title>
    <desc>VideoComposer is trained on two public datasets: WebVid-10M, about ten million video-caption pairs from the web, and LAION-400M, CLIP-filtered image-caption pairs for visual quality.</desc>
    <rect filter="url(#cardShadow)" x="72" y="172" width="548" height="380" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="72" y="172" width="548" height="8" rx="4" fill="#2563EB"/>
    <text x="104" y="222" font-size="15" font-weight="700" fill="#2563EB" letter-spacing="1">TRAINING · TWO PUBLIC DATASETS</text>

    <rect x="104" y="244" width="484" height="132" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <text x="128" y="286" font-size="26" font-weight="800" fill="#1D4ED8">WebVid-10M</text>
    <text x="128" y="318" font-size="18" fill="#334155">≈ 10.3M video–caption pairs</text>
    <text x="128" y="346" font-size="16" fill="#64748B">scraped from the web — the</text>
    <text x="128" y="366" font-size="16" fill="#64748B">source of temporal dynamics.</text>

    <rect x="104" y="392" width="484" height="132" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <text x="128" y="434" font-size="26" font-weight="800" fill="#0891B2">LAION-400M</text>
    <text x="128" y="466" font-size="18" fill="#334155">CLIP-filtered image–caption pairs</text>
    <text x="128" y="494" font-size="16" fill="#64748B">added for visual quality and</text>
    <text x="128" y="514" font-size="16" fill="#64748B">per-frame appearance.</text>
  </g>

  <!-- c2 evaluation -->
  <g id="cue_s06_c2_evaluation_authors_report_text_to_vi">
    <title>evaluation report text-to-video msr-vtt frechet video distance clip similarity motion controllability thousand caption-video pairs motion-control error</title>
    <desc>For evaluation, the authors report text-to-video on MSR-VTT using Frechet Video Distance and CLIP similarity, and measure motion controllability on a thousand caption-video pairs with a dedicated motion-control error.</desc>
    <rect filter="url(#cardShadow)" x="660" y="172" width="548" height="380" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="660" y="172" width="548" height="8" rx="4" fill="#EA580C"/>
    <text x="692" y="222" font-size="15" font-weight="700" fill="#EA580C" letter-spacing="1">EVALUATION</text>

    <rect x="692" y="244" width="484" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="716" y="286" font-size="24" font-weight="800" fill="#0F172A">MSR-VTT</text>
    <text x="716" y="316" font-size="18" fill="#334155">Text-to-video generation quality,</text>
    <text x="716" y="344" font-size="18" fill="#334155">measured with <tspan font-weight="700" fill="#1D4ED8">FVD</tspan> and</text>
    <text x="716" y="366" font-size="18" fill="#334155"><tspan font-weight="700" fill="#0891B2">CLIP similarity (CLIPSIM)</tspan>.</text>

    <rect x="692" y="392" width="484" height="132" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
    <text x="716" y="434" font-size="24" font-weight="800" fill="#EA580C">Motion controllability</text>
    <text x="716" y="466" font-size="18" fill="#334155">1,000 caption–video pairs, scored</text>
    <text x="716" y="494" font-size="18" fill="#334155">with a dedicated</text>
    <text x="716" y="514" font-size="18" font-weight="700" fill="#EA580C">motion-control error.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">06 / 10</text>
</svg>
