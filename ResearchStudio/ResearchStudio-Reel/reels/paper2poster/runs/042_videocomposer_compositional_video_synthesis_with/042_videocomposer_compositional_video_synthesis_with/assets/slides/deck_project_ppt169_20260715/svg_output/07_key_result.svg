<svg data-pptx-page-role="content" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', 'Liberation Sans', sans-serif">
  <defs>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#2563EB"/>
  <text x="72" y="66" font-size="18" font-weight="700" fill="#2563EB" letter-spacing="3">07 · KEY RESULT</text>
  <text x="1208" y="66" text-anchor="end" font-size="16" font-weight="700" fill="#1D4ED8">VideoComposer</text>
  <text x="72" y="110" font-size="40" font-weight="800" fill="#0F172A">Control at no cost to quality</text>
  <line x1="72" y1="132" x2="1208" y2="132" stroke="#E2E8F0" stroke-width="2"/>

  <!-- c1 headline metrics -->
  <g id="cue_s07_c1_msr_vtt_videocomposer_achieves_chet">
    <title>msr-vtt videocomposer achieves frechet video distance 580 clip similarity 0.2932 zero-shot</title>
    <desc>On MSR-VTT, VideoComposer achieves a Frechet Video Distance of 580 and a CLIP similarity of 0.2932, zero-shot.</desc>
    <rect filter="url(#cardShadow)" x="72" y="172" width="568" height="150" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="96" y="204" font-size="15" font-weight="700" fill="#64748B" letter-spacing="1">MSR-VTT · ZERO-SHOT</text>
    <rect x="96" y="216" width="256" height="86" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <text x="224" y="264" text-anchor="middle" font-size="46" font-weight="800" fill="#1D4ED8">580</text>
    <text x="224" y="290" text-anchor="middle" font-size="15" fill="#64748B">FVD · lower is better</text>
    <rect x="360" y="216" width="256" height="86" rx="12" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <text x="488" y="264" text-anchor="middle" font-size="46" font-weight="800" fill="#0891B2">0.2932</text>
    <text x="488" y="290" text-anchor="middle" font-size="15" fill="#64748B">CLIPSIM · higher is better</text>
  </g>

  <!-- c2 comparison vs pre-training -->
  <g id="cue_s07_c2_competitive_leading_text_to_video_sy">
    <title>competitive leading text-to-video systems improves over first-stage pre-training scored 803</title>
    <desc>That is competitive with leading text-to-video systems, and it improves over the model's first-stage pre-training, which scored 803.</desc>
    <rect filter="url(#cardShadow)" x="72" y="338" width="568" height="212" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="96" y="372" font-size="19" font-weight="700" fill="#0F172A">Better than its own text-to-video pre-training</text>
    <text x="96" y="396" font-size="15" fill="#64748B">Compositional training does not hurt raw quality (FVD, lower = better)</text>

    <text x="96" y="440" font-size="15" fill="#475569">Stage-1 T2V pre-training</text>
    <rect x="96" y="448" width="460" height="26" rx="6" fill="#CBD5E1"/>
    <text x="566" y="467" font-size="16" font-weight="700" fill="#475569">803</text>

    <text x="96" y="500" font-size="15" fill="#475569">Full VideoComposer</text>
    <rect x="96" y="508" width="332" height="26" rx="6" fill="#059669"/>
    <text x="438" y="527" font-size="16" font-weight="800" fill="#059669">580</text>
    <text x="470" y="440" font-size="15" font-weight="700" fill="#059669">competitive with SOTA T2V</text>
  </g>

  <!-- c3 qualitative -->
  <g id="cue_s07_c3_adding_compositional_multi_condition">
    <title>adding compositional multi-condition control costs nothing quality videos follow sketches depth motion styles</title>
    <desc>Adding compositional, multi-condition control costs nothing in quality, while videos follow the sketches, depth, motion, and styles users provide.</desc>
    <rect filter="url(#cardShadow)" x="668" y="172" width="540" height="378" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="668" y="172" width="540" height="8" rx="4" fill="#2563EB"/>
    <text x="692" y="214" font-size="19" font-weight="700" fill="#0F172A">Videos faithfully follow the conditions</text>
    <image xlink:href="../images/figure4.png" x="686" y="228" width="504" height="278" preserveAspectRatio="xMidYMid meet"/>
    <text x="938" y="534" text-anchor="middle" font-size="14" fill="#64748B">Compositional image-to-video: outputs track the supplied controls.</text>
  </g>

  <text x="72" y="700" font-size="13" fill="#94A3B8">VideoComposer · NeurIPS 2023</text>
  <text x="1208" y="700" text-anchor="end" font-size="13" fill="#94A3B8">07 / 10</text>
</svg>
