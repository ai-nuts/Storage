<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#9B8CFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A5AECF" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF0FB" font-weight="800" text-anchor="start">The first slice of a bigger picture</text><g id="cue_s10_c1_takeaway_simple"><title>takeaway simple</title><rect x="64" y="176" width="560" height="180" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="176" width="6" height="180" rx="6" fill="#9B8CFF"/><circle cx="98" cy="216" r="10" fill="#9B8CFF"/><text x="122" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">The idea in one line</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Guidance has more structure than a single scalar knob suggests</text><text x="92" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">- and that structure is usable.</text></g><g id="cue_s10_c2_classifier_free_guidance_just_first"><title>classifier-free guidance just first-order slice richer picture</title><rect x="656" y="176" width="560" height="180" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="656" y="176" width="6" height="180" rx="6" fill="#33D6C0"/><circle cx="690" cy="216" r="10" fill="#33D6C0"/><text x="714" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">CFG is only first order</text><text x="684" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Classifier-free guidance is just the first-order slice of a</text><text x="684" y="291" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">much richer Taylor picture of the guided score.</text></g><g id="cue_s10_c3_treat_guided_score_taylor_expansion"><title>treat guided score taylor expansion guidance strength single extra second-order</title><rect x="64" y="374" width="560" height="180" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="374" width="6" height="180" rx="6" fill="#46C98B"/><circle cx="98" cy="414" r="10" fill="#46C98B"/><text x="122" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">One extra term, for free</text><text x="92" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Add a single second-order term to the expansion in guidance</text><text x="92" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">strength and you buy a better fidelity-diversity trade-off.</text></g><g id="cue_s10_c4_needs_retraining_only_scaled_conditi"><title>needs retraining only scaled condition few lines code points toward</title><rect x="656" y="374" width="560" height="180" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="656" y="374" width="6" height="180" rx="6" fill="#F4C24C"/><circle cx="690" cy="414" r="10" fill="#F4C24C"/><text x="714" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">Exploit the condition space</text><text x="684" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">No retraining - just a scaled condition and a few lines of</text><text x="684" y="489" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">code - pointing toward the continuous structure plain CFG</text><text x="684" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">throws away.</text></g><line x1="64" y1="584" x2="1216" y2="584" stroke="#343A70" stroke-width="1" stroke-linecap="round"/><line x1="109.96000000000001" y1="652.68" x2="190.04000000000002" y2="652.68" stroke="#343A70" stroke-width="1.4" stroke-linecap="round"/><line x1="109.96000000000001" y1="652.68" x2="109.96000000000001" y2="611.3199999999999" stroke="#343A70" stroke-width="1.4" stroke-linecap="round"/><polyline points="109.96000000000001,646.0623999999999 113.29666666666668,646.0078277777777 116.63333333333334,645.844111111111 119.97000000000001,645.57125 123.30666666666667,645.1892444444444 126.64333333333335,644.6980944444445 129.98000000000002,644.0978 133.31666666666666,643.3883611111111 136.65333333333334,642.5697777777777 139.99,641.6420499999999 143.32666666666668,640.6051777777777 146.66333333333336,639.459161111111 150.0,638.204 153.33666666666667,636.8396944444444 156.67333333333335,635.3662444444444 160.01,633.78365 163.34666666666666,632.091911111111 166.68333333333334,630.2910277777777 170.02,628.381 173.35666666666668,626.3618277777778 176.69333333333333,624.233511111111 180.03,621.99605 183.36666666666667,619.6494444444444 186.70333333333335,617.1936944444444 190.04000000000002,614.6288" fill="none" stroke="#9B8CFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="117.968" y1="650.77744" x2="188.4384" y2="623.115872" stroke="#F4C24C" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/><circle cx="150.0" cy="638.204" r="4.6" fill="#F4C24C"/><line x1="182.032" y1="625.63056" x2="182.032" y2="620.601184" stroke="#33D6C0" stroke-width="2.2" stroke-linecap="round"/><text x="189.032" y="627.115872" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="4" fill="#33D6C0" font-weight="800" text-anchor="start">2nd</text><text x="119.56960000000001" y="642.1487679999999" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="4" fill="#F4C24C" font-weight="800" text-anchor="start">CFG (1st order)</text><text x="133.984" y="622.601184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="4" fill="#9B8CFF" font-weight="800" text-anchor="start">ICFG</text><text x="190.04000000000002" y="666.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="4" fill="#727BA0" font-weight="700" text-anchor="end">beta</text><text x="1216" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="600" text-anchor="end">ICFG  ·  Inner Classifier-Free Guidance &amp; its Taylor Expansion  ·  ICLR 2024</text></svg>