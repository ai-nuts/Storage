<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#9B8CFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A5AECF" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF0FB" font-weight="800" text-anchor="start">Move along the condition space</text><g id="cue_s03_c1_two_main_ways_inject_guidance"><title>two main ways inject guidance diffusion models external trained classifier</title><rect x="64" y="158" width="560" height="192" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#9B8CFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9B8CFF" font-weight="800" text-anchor="start">Two ways to guide a diffusion model</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">There are two main routes to inject guidance: an external</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">trained classifier, or classifier-free guidance a single</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">model learns jointly.</text><rect x="92" y="300" width="468" height="34" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><circle cx="110" cy="317.0" r="5" fill="#9B8CFF"/><text x="126" y="323.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="600" text-anchor="start">external classifier   vs   classifier-free guidance</text></g><g id="cue_s03_c2_both_work_well_but_neither"><title>both work well but neither says anything about shape condition</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#33D6C0"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Neither knows the shape</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Both routes work well in practice, but neither says</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">anything about the shape of the condition space they are</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">steering through.</text><rect x="92" y="506" width="504" height="44" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="344.0" y="534.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF0FB" font-weight="800" text-anchor="middle">guidance strength  !=  geometry of c</text></g><g id="cue_s03_c3_authors_insight_text_encoder_maps"><title>authors insight text encoder maps prompts continuous space structure you</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#F4C24C"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F4C24C" font-weight="800" text-anchor="start">A text encoder has real structure</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF0FB" font-weight="400" text-anchor="start">The authors' insight: a text encoder maps prompts into a</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF0FB" font-weight="400" text-anchor="start">continuous space with genuine structure - and if you can</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF0FB" font-weight="400" text-anchor="start">identify it, you can move along it.</text><rect x="676" y="296" width="512" height="44" rx="8" fill="#0E1330" stroke="#343A70" stroke-width="1.5"/><polyline points="694.0,324.0 709.9333333333333,323.08014952324464 725.8666666666667,322.1703771208037 741.8,321.28065044950046 757.7333333333333,320.42071754093297 773.6666666666666,319.6 789.6,318.82748977982624 805.5333333333333,318.11165066404203 821.4666666666667,317.4603255357989 837.4,316.8806504495005 853.3333333333333,316.3789764466969 869.2666666666667,315.9607999727451 885.2,315.63070265660264 901.1333333333333,315.3923011135425 917.0666666666666,315.2482073207592 933.0,315.2 948.9333333333334,315.2482073207592 964.8666666666667,315.3923011135425 980.8,315.63070265660264 996.7333333333333,315.9607999727451 1012.6666666666666,316.3789764466969 1028.6,316.8806504495005 1044.5333333333333,317.4603255357989 1060.4666666666667,318.11165066404203 1076.4,318.82748977982624 1092.3333333333335,319.6 1108.2666666666667,320.42071754093297 1124.2,321.28065044950046 1140.1333333333332,322.1703771208037 1156.0666666666666,323.08014952324464 1172.0,324.0" fill="none" stroke="#9B8CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1028.6" cy="316.8806504495005" r="5" fill="#F4C24C"/><text x="1028.6" y="306.8806504495005" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#F4C24C" font-weight="800" text-anchor="middle">c</text><circle cx="846.96" cy="316.56991425558226" r="5" fill="#33D6C0"/><text x="846.96" y="306.56991425558226" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#33D6C0" font-weight="800" text-anchor="middle">m*c</text><text x="690" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#A5AECF" font-weight="700" text-anchor="start">continuous condition space</text><text x="1174" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#9B8CFF" font-weight="800" text-anchor="end">move along structure</text></g><g id="cue_s03_c4_motivates_inner_classifier_free_guid"><title>motivates inner classifier-free guidance</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#46C98B"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">That opening is inner CFG</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF0FB" font-weight="400" text-anchor="start">Following that structure from inside the condition space,</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF0FB" font-weight="400" text-anchor="start">rather than treating it as a flat label, is exactly what</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF0FB" font-weight="400" text-anchor="start">inner classifier-free guidance does.</text><text x="676" y="524" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#46C98B" font-weight="800" text-anchor="start">guide from within the condition space</text></g></svg>