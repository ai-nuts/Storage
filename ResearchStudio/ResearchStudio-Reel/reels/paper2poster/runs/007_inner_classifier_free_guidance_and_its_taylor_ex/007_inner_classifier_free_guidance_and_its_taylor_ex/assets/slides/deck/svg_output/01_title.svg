<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9B8CFF" font-weight="800" text-anchor="start" letter-spacing="2">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="600" text-anchor="end">Diffusion Models  ·  Guidance  ·  Taylor Expansion</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#343A70" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">ICFG</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#9B8CFF" font-weight="800" text-anchor="start">Inner Classifier-Free Guidance and Its</text><text x="64" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#9B8CFF" font-weight="800" text-anchor="start">Taylor Expansion for Diffusion Models</text><line x1="1021.0" y1="223.0" x2="1203.0" y2="223.0" stroke="#343A70" stroke-width="1.4" stroke-linecap="round"/><line x1="1021.0" y1="223.0" x2="1021.0" y2="129.0" stroke="#343A70" stroke-width="1.4" stroke-linecap="round"/><polyline points="1021.0,207.96 1028.5833333333333,207.8359722222222 1036.1666666666667,207.4638888888889 1043.75,206.84375 1051.3333333333333,205.97555555555556 1058.9166666666667,204.85930555555555 1066.5,203.495 1074.0833333333333,201.8826388888889 1081.6666666666667,200.0222222222222 1089.25,197.91375 1096.8333333333333,195.5572222222222 1104.4166666666667,192.95263888888888 1112.0,190.1 1119.5833333333333,186.99930555555557 1127.1666666666667,183.65055555555554 1134.75,180.05374999999998 1142.3333333333333,176.2088888888889 1149.9166666666667,172.1159722222222 1157.5,167.775 1165.0833333333333,163.18597222222223 1172.6666666666667,158.3488888888889 1180.25,153.26375 1187.8333333333333,147.93055555555554 1195.4166666666667,142.34930555555553 1203.0,136.51999999999998" fill="none" stroke="#9B8CFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="1039.2" y1="218.67600000000002" x2="1199.36" y2="155.80880000000002" stroke="#F4C24C" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/><circle cx="1112.0" cy="190.1" r="4.6" fill="#F4C24C"/><line x1="1184.8" y1="161.524" x2="1184.8" y2="150.09359999999998" stroke="#33D6C0" stroke-width="2.2" stroke-linecap="round"/><text x="1191.8" y="159.8088" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33D6C0" font-weight="800" text-anchor="start">2nd</text><text x="1042.84" y="209.2472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#F4C24C" font-weight="800" text-anchor="start">CFG (1st order)</text><text x="1075.6" y="152.09359999999998" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9B8CFF" font-weight="800" text-anchor="start">ICFG</text><text x="1203.0" y="237.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#727BA0" font-weight="700" text-anchor="end">beta</text><text x="64" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="500" text-anchor="start">Shikun Sun · Longhui Wei · Zhicai Wang · Zixuan Wang · Junliang Xing · Jia Jia · Qi Tian</text><text x="64" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#727BA0" font-weight="600" text-anchor="start">Tsinghua University   ·   Univ. of Science and Technology of China   ·   Huawei</text><g id="cue_s01_c1_classifier_free_guidance_cfg_workhor"><title>classifier-free guidance cfg workhorse lets conditional diffusion models trade sample</title><rect x="64" y="306" width="276" height="224" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="306" width="276" height="6" rx="6" fill="#9B8CFF"/><circle cx="90" cy="348" r="7" fill="#9B8CFF"/><text x="108" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">CFG: the control knob</text><text x="88" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">Classifier-free guidance lets</text><text x="88" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">conditional diffusion models trade</text><text x="88" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">sample diversity against fidelity</text><text x="88" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">- the standard control every model</text><text x="88" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">uses.</text></g><g id="cue_s01_c2_but_when_condition_continuous_like"><title>but when condition continuous like text embedding cfg ignores structure</title><rect x="356" y="306" width="276" height="224" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="356" y="306" width="276" height="6" rx="6" fill="#F2685C"/><circle cx="382" cy="348" r="7" fill="#F2685C"/><text x="400" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">But it ignores</text><text x="400" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">structure</text><text x="380" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">When the condition is continuous,</text><text x="380" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">like a text embedding, plain CFG</text><text x="380" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">treats it as an opaque label and</text><text x="380" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">ignores that structure entirely.</text></g><g id="cue_s01_c3_iclr_2024_tsinghua_university_huawei"><title>iclr 2024 tsinghua university huawei introduces inner classifier-free guidance icfg</title><rect x="648" y="306" width="276" height="224" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="648" y="306" width="276" height="6" rx="6" fill="#33D6C0"/><circle cx="674" cy="348" r="7" fill="#33D6C0"/><text x="692" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">CFG is just first</text><text x="692" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">order</text><text x="672" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">This ICLR 2024 paper from Tsinghua</text><text x="672" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">and Huawei recasts standard CFG as</text><text x="672" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">the first-order term of a broader</text><text x="672" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">Taylor expansion: inner CFG.</text></g><g id="cue_s01_c4_adding_second_order_term_change_auth"><title>adding second-order term change authors get better balance between fidelity</title><rect x="940" y="306" width="276" height="224" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="940" y="306" width="276" height="6" rx="6" fill="#46C98B"/><circle cx="966" cy="348" r="7" fill="#46C98B"/><text x="984" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">One extra term, no</text><text x="984" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF0FB" font-weight="800" text-anchor="start">retraining</text><text x="964" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">Adding a second-order term, with</text><text x="964" y="421" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">no change to training, buys a</text><text x="964" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">better fidelity-diversity balance</text><text x="964" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">for Stable Diffusion in a few</text><text x="964" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#A5AECF" font-weight="400" text-anchor="start">lines of code.</text></g><line x1="64" y1="556" x2="1216" y2="556" stroke="#343A70" stroke-width="1" stroke-linecap="round"/><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9B8CFF" font-weight="700" text-anchor="start">openreview.net/forum?id=0QAzIMq32X</text><text x="1216" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="600" text-anchor="end">One extra term. No retraining.</text></svg>