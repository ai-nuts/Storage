<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#9B8CFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A5AECF" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF0FB" font-weight="800" text-anchor="start">CFG is only the first order</text><g id="cue_s04_c1_central_contribution_reframing_stand"><title>central contribution reframing standard cfg not whole story just first-order</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#9B8CFF"/><circle cx="114" cy="246" r="26" fill="none" stroke="#9B8CFF" stroke-width="2.5"/><text x="114" y="255" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="20" fill="#9B8CFF" font-weight="800" text-anchor="middle">Sum</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">CFG is just first</text><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">order</text><text x="88" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Standard CFG is not the whole</text><text x="88" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">story - it is only the</text><text x="88" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">first-order term of a broader</text><text x="88" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">expansion the authors call</text><text x="88" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">inner CFG.</text></g><g id="cue_s04_c2_writing_guided_score_taylor_series"><title>writing guided score taylor series guidance strength around one they</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#33D6C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#33D6C0" stroke-width="2.5"/><text x="410" y="255" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="20" fill="#33D6C0" font-weight="800" text-anchor="middle">beta</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">A Taylor series in</text><text x="384" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">strength</text><text x="384" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Write the guided score as a</text><text x="384" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Taylor series in the guidance</text><text x="384" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">strength around one: first</text><text x="384" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">order recovers CFG, then add a</text><text x="384" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">second-order term.</text></g><g id="cue_s04_c3_term_computed_existing_pretrained_re"><title>term computed existing pretrained retraining needed</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#46C98B"/><circle cx="706" cy="246" r="26" fill="none" stroke="#46C98B" stroke-width="2.5"/><text x="706" y="255" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="20" fill="#46C98B" font-weight="800" text-anchor="middle">0</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">No retraining</text><text x="680" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">needed</text><text x="680" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">That new second-order term is</text><text x="680" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">computed entirely from the</text><text x="680" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">existing pretrained model, so</text><text x="680" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">nothing has to be retrained.</text></g><g id="cue_s04_c4_they_also_provide_policy_two"><title>they also provide policy two sampling algorithms convergence analysis</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#F4C24C"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#F4C24C" stroke-width="2.5"/><text x="1002" y="255" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="20" fill="#F4C24C" font-weight="800" text-anchor="middle">3</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">Theory and</text><text x="976" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF0FB" font-weight="800" text-anchor="start">algorithms</text><text x="976" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">They also give a training</text><text x="976" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">policy, two sampling</text><text x="976" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">algorithms, and a convergence</text><text x="976" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">analysis backing the</text><text x="976" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">expansion.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="700" text-anchor="start">The same pretrained model, reinterpreted as the leading term of a principled Taylor expansion.</text></svg>