<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#9B8CFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A5AECF" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF0FB" font-weight="800" text-anchor="start">Choosing m and the step budget</text><g id="cue_s08_c1_two_ablations_illuminate_design_choi"><title>two ablations illuminate design choices</title><rect x="64" y="158" width="1152" height="104" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="158" width="6" height="104" rx="6" fill="#46C98B"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">Two ablations pin down the design</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">Two studies fix the key knobs of second-order inner CFG: the middle point m used to estimate the term, and the number of</text><text x="92" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">sampling steps.</text></g><g id="cue_s08_c2_first_middle_point_used_estimate"><title>first middle point used estimate second-order term produces u-shaped fid</title><rect x="64" y="286" width="560" height="264" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="286" width="6" height="264" rx="6" fill="#9B8CFF"/><text x="92" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9B8CFF" font-weight="800" text-anchor="start">Middle point m: a U-shaped FID</text><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">If the two points are too close, the</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">estimate can't capture long-term change;</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">drift too near 0 or 1 and the model</text><text x="92" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">struggles to score them. Best around m =</text><text x="92" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">1.1.</text><rect x="332" y="432" width="268" height="100" rx="8" fill="#0E1330" stroke="#343A70" stroke-width="1.5"/><line x1="366" y1="506" x2="586" y2="506" stroke="#343A70" stroke-width="1.2" stroke-linecap="round"/><line x1="366" y1="506" x2="366" y2="448" stroke="#343A70" stroke-width="1.2" stroke-linecap="round"/><polyline points="366.0,452.64 371.5,454.434375 377.0,458.15 382.5,461.684375 388.0,465.03749999999997 393.5,468.209375 399.0,471.2 404.5,474.009375 410.0,476.6375 415.5,479.084375 421.0,481.35 426.5,483.434375 432.0,485.3375 437.5,487.059375 443.0,488.6 448.5,489.959375 454.0,491.1375 459.5,492.134375 465.0,492.95 470.5,493.584375 476.0,494.0375 481.5,494.309375 487.0,494.4 492.5,494.309375 498.0,494.0375 503.5,493.584375 509.0,492.95 514.5,492.134375 520.0,491.1375 525.5,489.959375 531.0,488.6 536.5,487.059375 542.0,485.3375 547.5,483.434375 553.0,481.35 558.5,479.084375 564.0,476.6375 569.5,474.009375 575.0,471.2 580.5,468.209375 586.0,465.0375" fill="none" stroke="#9B8CFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="487.0" y1="494.4" x2="487.0" y2="506" stroke="#F4C24C" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="487.0" cy="494.4" r="4.6" fill="#F4C24C"/><text x="487.0" y="521" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F4C24C" font-weight="800" text-anchor="middle">m=1.1</text><text x="362" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#727BA0" font-weight="700" text-anchor="end">FID</text><text x="586" y="521" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#727BA0" font-weight="700" text-anchor="end">middle point m</text></g><g id="cue_s08_c3_second_varying_sampling_steps_shows"><title>second varying sampling steps shows method already produces well-matched images</title><rect x="656" y="286" width="560" height="264" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="656" y="286" width="6" height="264" rx="6" fill="#33D6C0"/><text x="684" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Sampling steps: good even at 10</text><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">Varying the number of sampling steps</text><text x="684" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">shows the method already produces</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">well-matched images at just ten steps,</text><text x="684" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">improving only modestly out to fifty.</text><rect x="924" y="432" width="268" height="100" rx="8" fill="#0E1330" stroke="#343A70" stroke-width="1.5"/><line x1="958" y1="506" x2="1178" y2="506" stroke="#343A70" stroke-width="1.2" stroke-linecap="round"/><line x1="958" y1="506" x2="958" y2="448" stroke="#343A70" stroke-width="1.2" stroke-linecap="round"/><polyline points="958.0,451.48 963.5,454.24967878273316 969.0,456.85806402973196 974.5,459.3145487452799 980.0,461.6279789276747 985.5,463.8066854243775 991.0,465.8585139320618 996.5,467.7908532495959 1002.0,469.6106618856999 1007.5,471.3244931170931 1013.0,472.9385185873681 1018.5,474.4585505315748 1024.0,475.89006270654374 1029.5,477.2382101023236 1035.0,478.50784750571296 1040.5,479.7035469827371 1046.0,480.82961434302365 1051.5,481.8901046453684 1057.0,482.8888368003267 1062.5,483.8294073224166 1068.0,484.7152032814557 1073.5,485.54941449967095 1079.0,486.3350450385042 1084.5,487.074924016478 1090.0,487.7717157970783 1095.5,488.4279295833407 1101.0,489.04592845369166 1106.5,489.6279378715833 1112.0,490.17605369956567 1117.5,490.69224974665565 1123.0,491.1783848761813 1128.5,491.63620969969804 1134.0,492.06737288108053 1139.5,492.47342707349395 1145.0,492.85583451062206 1150.5,493.2159722722882 1156.0,493.5551372434297 1161.5,493.874550784285 1167.0,494.17536312860904 1172.5,494.45865752575776 1178.0,494.72545414155553" fill="none" stroke="#33D6C0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="991.0" cy="465.8585139320618" r="4.6" fill="#F4C24C"/><text x="998.0" y="459.8585139320618" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F4C24C" font-weight="800" text-anchor="start">10 steps</text><text x="1178" y="488.72545414155553" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#33D6C0" font-weight="800" text-anchor="end">50</text><text x="954" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#727BA0" font-weight="700" text-anchor="end">FID</text><text x="1178" y="521" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#727BA0" font-weight="700" text-anchor="end">sampling steps -&gt;</text></g></svg>