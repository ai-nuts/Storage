ial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33D6C0" font-weight="800" text-anchor="middle">condition c</text><line x1="974" y1="257.0" x2="1049.68" y2="257.0" stroke="#A5AECF" stroke-width="2.0" stroke-linecap="round"/><polyline points="1041.68,252.0 1049.68,257.0 1041.68,262.0" fill="#A5AECF" stroke="#A5AECF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="1060.56" y="239.0" width="87.04" height="36" rx="6" fill="#1E2450" stroke="#F2685C" stroke-width="1.4"/><text x="1104.08" y="262.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#F2685C" font-weight="800" text-anchor="middle">[ label ]</text><text x="1190" y="288.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F4C24C" font-weight="700" text-anchor="end">structure ignored</text></g><g id="cue_s02_c3_when_space_continuous_like_text"><title>when space continuous like text prompt embedding all continuity goes</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F4C24C"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">But that space is continuous</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="400" text-anchor="start">A text-prompt embedding lives in a genuinely continuous space - so all of</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="400" text-anchor="start">that continuity and structure simply goes to waste.</text></g><g id="cue_s02_c4_authors_ask_pointed_question_conditi"><title>authors ask pointed question condition lives structured continuous space better</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#46C98B"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">The question this paper asks</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A5AECF" font-weight="400" text-anchor="start">If the condition lives in a structured, continuous space, can we do better</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A5AECF" font-weight="400" text-anchor="start">than plain classifier-free guidance?</text></g></svg>