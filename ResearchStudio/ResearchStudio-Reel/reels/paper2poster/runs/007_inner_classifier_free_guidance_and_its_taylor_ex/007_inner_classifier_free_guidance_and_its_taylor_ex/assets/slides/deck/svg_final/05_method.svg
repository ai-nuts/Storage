<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#9B8CFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A5AECF" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF0FB" font-weight="800" text-anchor="start">A second-order term, gained for free</text><g id="cue_s05_c1_mechanism_authors_write_guided_distr"><title>mechanism authors write guided distribution unconditional distribution times ratio conditional</title><rect x="64" y="158" width="1152" height="168" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="158" width="6" height="168" rx="6" fill="#9B8CFF"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF0FB" font-weight="800" text-anchor="start">The guided distribution, raised to beta</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">Write the guided intermediate distribution as the unconditional</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">one times the conditional-to-unconditional ratio, raised to a</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">power beta.</text><rect x="92" y="272" width="560" height="40" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="372.0" y="298.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF0FB" font-weight="800" text-anchor="middle">p_b ~ p_u * (p_c / p_u)^beta,  beta = w+1</text><rect x="676" y="196" width="540" height="116" rx="8" fill="#0E1330" stroke="#343A70" stroke-width="1.5"/><text x="692" y="220" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF0FB" font-weight="800" text-anchor="start">score ~ e0 + w*e1 + v*e2</text><rect x="692" y="234" width="158.75" height="26" rx="4" fill="#A5AECF" opacity="0.92"/><text x="771.375" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0C1024" font-weight="800" text-anchor="middle">base</text><rect x="850.75" y="234" width="232.83333333333334" height="26" rx="4" fill="#F4C24C" opacity="0.92"/><text x="967.1666666666666" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0C1024" font-weight="800" text-anchor="middle">CFG</text><rect x="1083.5833333333333" y="234" width="116.41666666666667" height="26" rx="4" fill="#46C98B" opacity="0.92"/><text x="1141.7916666666665" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#0C1024" font-weight="800" text-anchor="middle">ICFG</text><circle cx="698" cy="282" r="5" fill="#F4C24C"/><text x="710" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#A5AECF" font-weight="700" text-anchor="start">w e1 = first order (CFG)</text><circle cx="926" cy="282" r="5" fill="#46C98B"/><text x="938" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#46C98B" font-weight="800" text-anchor="start">v e2 = new 2nd order</text></g><g id="cue_s05_c2_they_take_taylor_expansion_score"><title>they take taylor expansion score predictor beta evaluated beta equals</title><rect x="64" y="342" width="560" height="208" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="342" width="6" height="208" rx="6" fill="#33D6C0"/><text x="92" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Taylor-expand, recover CFG</text><text x="92" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF0FB" font-weight="400" text-anchor="start">Take a Taylor expansion of the score predictor in beta,</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF0FB" font-weight="400" text-anchor="start">evaluated at beta equals one. The first-order term is</text><text x="92" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF0FB" font-weight="400" text-anchor="start">exactly classifier-free guidance.</text><rect x="92" y="508" width="504" height="44" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="344.0" y="536.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF0FB" font-weight="800" text-anchor="middle">first-order term  =  CFG</text></g><g id="cue_s05_c3_second_order_term_new_estimated_midd"><title>second-order term new estimated middle point between zero one needs</title><rect x="656" y="342" width="560" height="102" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="342" width="6" height="102" rx="6" fill="#F4C24C"/><text x="684" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">The new second-order term</text><text x="684" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF0FB" font-weight="400" text-anchor="start">Estimated with a middle point m in (0,1) - just one extra score</text><text x="684" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF0FB" font-weight="400" text-anchor="start">evaluation at the scaled condition m times c.</text></g><g id="cue_s05_c4_because_everything_comes_already_tra"><title>because everything comes already-trained network second-order icfg drops pretrained stable</title><rect x="656" y="460" width="560" height="90" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="656" y="460" width="6" height="90" rx="6" fill="#46C98B"/><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">A few lines on Stable Diffusion</text><text x="684" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="400" text-anchor="start">Everything comes from the trained network, so second-order ICFG drops into</text><text x="684" y="535" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="400" text-anchor="start">pretrained SD, tuned by weights w and v.</text></g></svg>