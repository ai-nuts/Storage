<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0C1024"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#9B8CFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A5AECF" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF0FB" font-weight="800" text-anchor="start">MS-COCO, measured by FID and CLIP</text><g id="cue_s06_c1_main_evaluation_text_to_image_ms_coc"><title>main evaluation text-to-image ms-coco validation set</title><rect x="64" y="158" width="1152" height="150" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#9B8CFF"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF0FB" font-weight="800" text-anchor="start">Text-to-image on MS-COCO</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">The main evaluation is text-to-image generation on the</text><text x="92" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">MS-COCO validation set, the standard prompt-to-image</text><text x="92" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A5AECF" font-weight="400" text-anchor="start">benchmark.</text><text x="92" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#727BA0" font-weight="400" text-anchor="start">pretrained Stable Diffusion, no fine-tuning of the base model</text><rect x="852" y="176" width="340" height="112" rx="8" fill="#0E1330" stroke="#343A70" stroke-width="1.5"/><text x="937.0" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9B8CFF" font-weight="800" text-anchor="middle">FID</text><line x1="937.0" y1="214" x2="937.0" y2="256" stroke="#9B8CFF" stroke-width="2.4" stroke-linecap="round"/><polyline points="931.0,248 937.0,258 943.0,248" fill="#9B8CFF" stroke="#9B8CFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="937.0" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#A5AECF" font-weight="700" text-anchor="middle">lower better</text><line x1="1022.0" y1="190" x2="1022.0" y2="274" stroke="#343A70" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><text x="1107.0" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33D6C0" font-weight="800" text-anchor="middle">CLIP</text><line x1="1107.0" y1="256" x2="1107.0" y2="214" stroke="#33D6C0" stroke-width="2.4" stroke-linecap="round"/><polyline points="1101.0,222 1107.0,212 1113.0,222" fill="#33D6C0" stroke="#33D6C0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1107.0" y="275" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#A5AECF" font-weight="700" text-anchor="middle">higher better</text></g><g id="cue_s06_c2_two_metrics_carry_story_fid"><title>two metrics carry story fid which measures image fidelity where</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#33D6C0"/><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Two metrics tell the story</text><text x="92" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">FID measures image fidelity, where lower is better; CLIP</text><text x="92" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">Score measures how well the image matches the prompt,</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">where higher is better.</text><rect x="92" y="466" width="254" height="66" rx="12" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="219.0" y="500.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22.44" fill="#9B8CFF" font-weight="800" text-anchor="middle">FID</text><text x="219.0" y="518.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="600" text-anchor="middle">fidelity  (lower better)</text><rect x="362" y="466" width="254" height="66" rx="12" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="489.0" y="500.32" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22.44" fill="#33D6C0" font-weight="800" text-anchor="middle">CLIP</text><text x="489.0" y="518.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="600" text-anchor="middle">alignment  (higher better)</text></g><g id="cue_s06_c3_authors_run_these_pretrained_stable"><title>authors run these pretrained stable diffusion add class-conditional experiment u-vit</title><rect x="656" y="324" width="560" height="226" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="656" y="324" width="6" height="226" rx="6" fill="#F2685C"/><text x="684" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Three experimental settings</text><text x="684" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">Beyond MS-COCO, the authors add a class-conditional study</text><text x="684" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">and a few-shot fine-tuning study.</text><rect x="684" y="432" width="504" height="32" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><circle cx="702" cy="448.0" r="5" fill="#9B8CFF"/><text x="718" y="454.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="600" text-anchor="start">Stable Diffusion   ·   text-to-image on MS-COCO</text><rect x="684" y="470" width="504" height="32" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><circle cx="702" cy="486.0" r="5" fill="#33D6C0"/><text x="718" y="492.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="600" text-anchor="start">U-ViT   ·   class-conditional generation</text><rect x="684" y="508" width="504" height="32" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><circle cx="702" cy="524.0" r="5" fill="#F4C24C"/><text x="718" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="600" text-anchor="start">Stable Diffusion 1.5   ·   few-shot fine-tuning</text></g></svg>