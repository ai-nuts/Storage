236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#727BA0" font-weight="700" text-anchor="end">CLIP</text><text x="1200" y="283" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#727BA0" font-weight="700" text-anchor="end">FID -&gt;</text><line x1="1045.8" y1="254.12" x2="854.2" y2="248.48" stroke="#F4C24C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4"/><text x="956.0" y="241.3" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F4C24C" font-weight="800" text-anchor="start">better</text><circle cx="1048.8" cy="257.12" r="6" fill="#9B8CFF"/><text x="1057.8" y="268.12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9B8CFF" font-weight="800" text-anchor="start">CFG</text><circle cx="847.2" cy="241.48" r="6.5" fill="#46C98B"/><text x="856.2" y="245.48" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#46C98B" font-weight="800" text-anchor="start">ICFG</text></g><g id="cue_s07_c2_ms_coco_guidance_strength_two_second"><title>ms-coco guidance strength two second-order weight quarter icfg reaches fid</title><rect x="64" y="324" width="368" height="224" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="64" y="324" width="6" height="224" rx="6" fill="#33D6C0"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">ICFG  @  w=2, v=1/4</text><text x="92" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">On MS-COCO, second-order inner CFG</text><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">reaches:</text><rect x="92" y="430" width="150" height="102" rx="12" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="167.0" y="483.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#33D6C0" font-weight="800" text-anchor="middle">15.28</text><text x="167.0" y="511.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="600" text-anchor="middle">FID</text><rect x="254" y="430" width="150" height="102" rx="12" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="329.0" y="483.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#33D6C0" font-weight="800" text-anchor="middle">26.11</text><text x="329.0" y="511.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="600" text-anchor="middle">CLIP</text></g><g id="cue_s07_c3_beats_classifier_free_guidance_same"><title>beats classifier-free guidance same setting worse fid fifteen point four</title><rect x="456" y="324" width="368" height="224" rx="14" fill="#161A38" stroke="#343A70" stroke-width="1.5"/><rect x="456" y="324" width="6" height="224" rx="6" fill="#9B8CFF"/><text x="484" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9B8CFF" font-weight="800" text-anchor="start">vs CFG, same setting</text><text x="484" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">Plain CFG is worse on both - ICFG wins</text><text x="484" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A5AECF" font-weight="400" text-anchor="start">fidelity and alignment:</text><rect x="484" y="430" width="150" height="102" rx="12" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="559.0" y="483.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#9B8CFF" font-weight="800" text-anchor="middle">15.42</text><text x="559.0" y="511.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="600" text-anchor="middle">FID  (CFG)</text><rect x="646" y="430" width="150" height="102" rx="12" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><text x="721.0" y="483.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#9B8CFF" font-weight="800" text-anchor="middle">25.80</text><text x="721.0" y="511.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A5AECF" font-weight="600" text-anchor="middle">CLIP  (CFG)</text></g><g id="cue_s07_c4_authors_identify_sweet_spot_equals"><title>authors identify sweet spot equals two equals one quarter note</title><rect x="848" y="324" width="368" height="224" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="848" y="324" width="6" height="224" rx="6" fill="#F4C24C"/><text x="876" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">A more favorable geometry</text><text x="876" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF0FB" font-weight="400" text-anchor="start">The sweet spot is w = 2, v = 1/4. The full</text><text x="876" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF0FB" font-weight="400" text-anchor="start">condition space trades off the two metrics</text><text x="876" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF0FB" font-weight="400" text-anchor="start">more favorably than plain CFG can.</text><rect x="876" y="502" width="316" height="32" rx="8" fill="#1E2450" stroke="#343A70" stroke-width="1.5"/><circle cx="894" cy="518.0" r="5" fill="#F4C24C"/><text x="910" y="524.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF0FB" font-weight="600" text-anchor="start">no change to training</text></g></svg>