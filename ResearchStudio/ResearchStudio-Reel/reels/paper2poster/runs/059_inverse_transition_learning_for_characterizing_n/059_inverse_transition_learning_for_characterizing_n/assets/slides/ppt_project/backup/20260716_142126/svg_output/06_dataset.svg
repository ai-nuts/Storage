<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A controlled synthetic tabular MDP</text><g id="cue_s06_c1_all_experiments_run_synthetic_tabula"><title>all experiments run synthetic tabular markov decision process fifteen states</title><rect x="64" y="158" width="560" height="232" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="232" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Synthetic tabular MDP</text><text x="92" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A fully controlled Markov decision process where the</text><text x="92" y="249" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">true dynamics are known for evaluation.</text><rect x="92" y="282" width="152" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="168.0" y="331.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">15 +1</text><text x="168.0" y="357.44" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">states (+terminal)</text><rect x="260" y="282" width="152" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="336.0" y="331.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">6</text><text x="336.0" y="357.44" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">actions</text><rect x="428" y="282" width="168" height="92" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="512.0" y="331.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">0.95</text><text x="512.0" y="357.44" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">discount factor</text></g><g id="cue_s06_c2_true_dynamics_deliberately_mixed_som"><title>true dynamics deliberately mixed sometimes uniform sometimes highly skewed toward</title><rect x="656" y="158" width="560" height="232" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="232" rx="6" fill="#34D3C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">Deliberately mixed dynamics</text><text x="684" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Transition distributions are sometimes uniform and</text><text x="684" y="249" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">sometimes highly skewed toward a few states, to create</text><text x="684" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rich, varied behavior.</text><rect x="704" y="320" width="13" height="18" rx="1" fill="#4C9BE8"/><rect x="721" y="320" width="13" height="18" rx="1" fill="#4C9BE8"/><rect x="738" y="320" width="13" height="18" rx="1" fill="#4C9BE8"/><rect x="755" y="320" width="13" height="18" rx="1" fill="#4C9BE8"/><rect x="772" y="320" width="13" height="18" rx="1" fill="#4C9BE8"/><text x="746" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">uniform</text><rect x="944" y="333" width="13" height="5" rx="1" fill="#F2C14E"/><rect x="961" y="328" width="13" height="10" rx="1" fill="#F2C14E"/><rect x="978" y="300" width="13" height="38" rx="1" fill="#F2C14E"/><rect x="995" y="326" width="13" height="12" rx="1" fill="#F2C14E"/><rect x="1012" y="332" width="13" height="6" rx="1" fill="#F2C14E"/><text x="986" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">skewed</text><line x1="848" y1="300" x2="848" y2="346" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="1176" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="end">known true T</text></g><g id="cue_s06_c3_study_two_coverage_regimes_low"><title>study two coverage regimes low setting fifteen episodes high setting</title><rect x="64" y="406" width="1152" height="144" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="406" width="6" height="144" rx="6" fill="#F2C14E"/><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Two coverage regimes  x  three expert-optimality levels</text><rect x="92" y="462" width="344" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="480.0" r="5" fill="#4C9BE8"/><text x="126" y="485.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Low data:  K = 15 episodes</text><rect x="456" y="462" width="344" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="474" cy="480.0" r="5" fill="#4C9BE8"/><text x="490" y="485.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">High data:  K = 300 episodes</text><rect x="820" y="462" width="396" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="838" cy="480.0" r="5" fill="#F2C14E"/><text x="854" y="485.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">epsilon = 0 / 3 / 4  -&gt;  0 / 3 / 6 uncertain states</text><text x="92" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">coverage and expert-optimality are varied independently to stress-test every method</text></g><g id="cue_s06_c4_every_reported_number_averaged_over"><title>every reported number averaged over one thousand independently generated datasets</title><rect x="64" y="566" width="1152" height="58" rx="14" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="566" width="6" height="58" rx="6" fill="#48C78E"/><text x="92" y="601" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">Every reported number is averaged over 1,000 independently generated datasets.</text></g></svg>