<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Harvard University   ·   Imperial College London</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">Bayesian Inverse Transition Learning</text><text x="64" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#4C9BE8" font-weight="700" text-anchor="start">Safe, gradient-free offline RL from a near-optimal expert</text><text x="64" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Leo Benac   ·   Sonali Parbhoo   ·   Finale Doshi-Velez      —   Harvard, Imperial College London</text><g id="cue_s01_c1_offline_reinforcement_learning_domai"><title>offline reinforcement learning domains like healthcare education must estimate environment</title><rect x="64" y="280" width="370" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="280" width="370" height="6" rx="6" fill="#F2685C"/><circle cx="92" cy="324" r="7" fill="#F2685C"/><text x="110" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The failure mode</text><text x="86" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Offline RL must estimate transition</text><text x="86" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">dynamics from fixed data — plain maximum</text><text x="86" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">likelihood gives high-variance policies</text><text x="86" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">that act unsafely where data is thin.</text></g><g id="cue_s01_c2_introduces_bayesian_inverse_transiti"><title>introduces bayesian inverse transition learning gradient free constraint based method</title><rect x="455" y="280" width="370" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="455" y="280" width="370" height="6" rx="6" fill="#4C9BE8"/><circle cx="483" cy="324" r="7" fill="#4C9BE8"/><text x="501" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Inverse Transition Learning</text><text x="477" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A gradient-free, constraint-based method:</text><text x="477" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">use a near-optimal expert's demonstrations</text><text x="477" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">to CLIP a Bayesian posterior over the</text><text x="477" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">dynamics.</text></g><g id="cue_s01_c3_result_distribution_dynamics_guarant"><title>result distribution dynamics guarantees safe high performing policies recovering one</title><rect x="846" y="280" width="370" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="846" y="280" width="370" height="6" rx="6" fill="#48C78E"/><circle cx="874" cy="324" r="7" fill="#48C78E"/><text x="892" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Safe by construction</text><text x="868" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Every sampled model yields a safe,</text><text x="868" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">high-performing policy — 100% accuracy</text><text x="868" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">where the best action is known, with</text><text x="868" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">dramatically lower variance.</text></g><line x1="64" y1="528" x2="1216" y2="528" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="568" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">A distribution of dynamics guaranteed to induce safe, high-performing offline policies.</text><text x="64" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2308.05075</text><rect x="864" y="556" width="150" height="58" rx="8" fill="#FFFFFF"/><image x="874" y="564" width="130" height="42" href="/datadisk/project/ResearchStudio/benchmarks/paper2poster/runs/059_inverse_transition_learning_for_characterizing_n/059_inverse_transition_learning_for_characterizing_n/assets/logos/harvard-university.png" preserveAspectRatio="xMidYMid meet"/><rect x="1026" y="556" width="110" height="58" rx="8" fill="#FFFFFF"/><image x="1034" y="564" width="94" height="42" href="/datadisk/project/ResearchStudio/benchmarks/paper2poster/runs/059_inverse_transition_learning_for_characterizing_n/059_inverse_transition_learning_for_characterizing_n/assets/logos/imperial-college-london.png" preserveAspectRatio="xMidYMid meet"/><rect x="1148" y="556" width="68" height="84" rx="8" fill="#FFFFFF"/><image x="1156" y="562" width="52" height="52" href="/datadisk/project/ResearchStudio/benchmarks/paper2poster/runs/059_inverse_transition_learning_for_characterizing_n/059_inverse_transition_learning_for_characterizing_n/assets/qr/paper.png" preserveAspectRatio="xMidYMid meet"/><text x="1182" y="630" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="middle">Paper</text></svg>