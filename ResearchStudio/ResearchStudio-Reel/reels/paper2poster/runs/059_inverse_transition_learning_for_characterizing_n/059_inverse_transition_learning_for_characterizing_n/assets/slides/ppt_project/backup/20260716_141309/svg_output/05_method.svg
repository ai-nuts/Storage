<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">From expert constraints to a clipped posterior</text><g id="cue_s05_c1_given_rewards_epsilon_optimal_expert"><title>given rewards epsilon optimal expert policy batch closed form bellman</title><rect x="64" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">1 · Constraints from the Bellman equations</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Given rewards R, an epsilon-optimal expert policy, and batch</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">data, the closed-form Bellman equations demand expert-taken</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">actions out-value never-taken ones.</text><rect x="92" y="298" width="512" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="323" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">V = (I - gamma T)^-1 R    -&gt;    Q(expert) &gt; Q(other)</text></g><g id="cue_s05_c2_any_dynamics_satisfying_these_constr"><title>any dynamics satisfying these constraints recovers what call expert epsilon</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">2 · Recover the expert's epsilon-ball</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Any dynamics satisfying the constraints recovers the</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">expert's epsilon-ball structure: the set of actions the</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">expert would consider acceptable in each state.</text><circle cx="738" cy="313" r="26" fill="none" stroke="#34D3C0" stroke-width="2"/><circle cx="738" cy="313" r="6" fill="#48C78E"/><text x="778" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">good actions inside the ball</text><text x="778" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6E869C" font-weight="600" text-anchor="start">bad actions strictly outside</text></g><g id="cue_s05_c3_place_dirichlet_multinomial_posterio"><title>place dirichlet multinomial posterior over dynamics rejection sampling keeping only</title><rect x="64" y="362" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="362" width="6" height="192" rx="6" fill="#48C78E"/><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">3 · Clip a Bayesian posterior</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Place a Dirichlet-Multinomial posterior over the dynamics,</text><text x="92" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">then reject every sample that violates a constraint. The</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">survivors form the clipped posterior.</text><rect x="92" y="502" width="512" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="527" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#48C78E" font-weight="800" text-anchor="middle">P(T | D)   --reject--&gt;   P(T | D, expert)</text></g><g id="cue_s05_c4_separate_constraint_sets_handle_full"><title>separate constraint sets handle fully optimal expert partially uncertain one</title><rect x="648" y="362" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="362" width="6" height="192" rx="6" fill="#F2C14E"/><text x="676" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">4 · Two experts, plus a slack term</text><text x="676" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Separate constraint sets handle a fully optimal expert and a</text><text x="676" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">partially uncertain one. A tunable slack delta enforces the</text><text x="676" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">structure even under action non-linearity.</text><rect x="676" y="500" width="248.0" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="520.0" r="5" fill="#34D3C0"/><text x="710" y="525.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">optimal expert</text><rect x="940.0" y="500" width="248.0" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="958.0" cy="520.0" r="5" fill="#F2C14E"/><text x="974.0" y="525.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">uncertain + slack</text></g></svg>