<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The clipped posterior dominates every baseline</text><g id="cue_s07_c1_clipped_posterior_dominates_both_max"><title>clipped posterior dominates both maximum likelihood clipped bayesian posterior</title><rect x="64" y="150" width="1152" height="52" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="52" rx="6" fill="#48C78E"/><text x="92" y="183" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">On the Q*metric, P(T | D, expert) beats both maximum likelihood and the un-clipped posterior P(T | D).</text></g><g id="cue_s07_c2_guarantees_one_hundred_percent_accur"><title>guarantees one hundred percent accuracy states where expert knows single</title><rect x="64" y="214" width="560" height="336" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="336" rx="6" fill="#48C78E"/><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">100% accuracy on decided states</text><text x="92" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Where the expert knows a single best action, our method</text><text x="92" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">picks it every time, in every data and optimality</text><text x="92" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">setting.</text><text x="92" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">Accuracy on deterministic-policy states</text><rect x="300" y="372" width="236" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="372" width="236" height="26" rx="6" fill="#48C78E"/><text x="288" y="390.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Ours</text><text x="546" y="390.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">100%</text><rect x="300" y="412" width="236" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="412" width="217" height="26" rx="6" fill="#4C9BE8"/><text x="288" y="430.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MLE best</text><text x="527" y="430.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">92%</text><rect x="300" y="452" width="236" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="452" width="158" height="26" rx="6" fill="#F2685C"/><text x="288" y="470.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MLE worst</text><text x="468" y="470.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">67%</text><text x="92" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">MLE ranges 67-92% and is never guaranteed; ours is a constant 100%.</text></g><g id="cue_s07_c3_also_never_selects_action_outside"><title>also never selects action outside expert epsilon ball makes truly</title><rect x="656" y="214" width="560" height="336" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="336" rx="6" fill="#4C9BE8"/><text x="684" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Never a truly bad mistake</text><text x="684" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Our policies never pick an action outside the expert's</text><text x="684" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">epsilon-ball. Lower Q*metric is better (0 = optimal).</text><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">Q*metric at epsilon = 0, high data (lower is better)</text><rect x="876" y="372" width="300" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="876" y="372" width="4" height="26" rx="6" fill="#48C78E"/><text x="864" y="390.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Ours</text><text x="890" y="390.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">0</text><rect x="876" y="412" width="300" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="876" y="412" width="120" height="26" rx="6" fill="#4C9BE8"/><text x="864" y="430.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MLE</text><text x="1006" y="430.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">59.75</text><rect x="876" y="452" width="300" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="876" y="452" width="284" height="26" rx="6" fill="#F2C14E"/><text x="864" y="470.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">P(T|D)</text><text x="1170" y="470.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">142</text><text x="684" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">the plain posterior is even worse than MLE here.</text></g><g id="cue_s07_c4_strikingly_even_though_constraints_s"><title>strikingly even though constraints say nothing explicit about which action</title><rect x="64" y="564" width="1152" height="116" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="564" width="6" height="116" rx="6" fill="#34D3C0"/><text x="92" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">A surprise on the uncertain states</text><text x="92" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">Even though the constraints say nothing explicit about which action to pick when the expert is unsure, our method is</text><text x="92" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">still more accurate there than the baselines — the constraints implicitly transfer the expert's uncertainty structure.</text></g></svg>