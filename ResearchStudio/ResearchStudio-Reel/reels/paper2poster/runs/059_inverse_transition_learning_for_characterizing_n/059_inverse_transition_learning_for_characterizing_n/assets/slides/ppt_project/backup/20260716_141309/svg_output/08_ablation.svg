<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">More data does not rescue maximum likelihood</text><g id="cue_s08_c1_central_finding_analysis_more_does"><title>central finding analysis more does not rescue maximum likelihood</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#F2685C"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="600" text-anchor="start">A central finding: simply collecting more episodes does NOT fix MLE's unsafe behavior.</text></g><g id="cue_s08_c2_even_high_regime_keeps_making"><title>even high regime keeps making bad mistakes choosing actions outside</title><rect x="64" y="238" width="680" height="312" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="238" width="6" height="312" rx="6" fill="#F2685C"/><text x="92" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Bad mistakes persist even with abundant data</text><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Expert-only data leaves large parts of the state-action space</text><text x="92" y="327" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">unexplored no matter how many episodes we collect — an</text><text x="92" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">irreducible, aleatoric gap.</text><text x="92" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">Rate of bad mistakes (actions outside the epsilon-ball)</text><rect x="300" y="398" width="360" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="398" width="264" height="30" rx="6" fill="#F2685C"/><text x="288" y="419.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MLE · low data</text><text x="574" y="419.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">high</text><rect x="300" y="444" width="360" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="444" width="228" height="30" rx="6" fill="#F2C14E"/><text x="288" y="465.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">MLE · high data</text><text x="538" y="465.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">still high</text><rect x="300" y="490" width="360" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="490" width="12" height="30" rx="6" fill="#48C78E"/><text x="288" y="511.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Ours · any data</text><text x="322" y="511.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">none</text><text x="92" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">only the constraints — not more data — eliminate the unsafe actions</text></g><g id="cue_s08_c3_sweeping_optimality_level_zero_throu"><title>sweeping optimality level zero through four confirms our method holds</title><rect x="764" y="238" width="452" height="312" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="764" y="238" width="6" height="312" rx="6" fill="#48C78E"/><text x="792" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Robust across expert optimality</text><text x="792" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Sweeping epsilon from 0 through 4 confirms</text><text x="792" y="329" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the method holds across every degree of</text><text x="792" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">expert optimality.</text><rect x="792" y="368" width="396" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="810" cy="386.0" r="5" fill="#4C9BE8"/><text x="826" y="391.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Holds for epsilon = 0, 1, 2, 3, 4</text><rect x="792" y="412" width="396" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="810" cy="430.0" r="5" fill="#48C78E"/><text x="826" y="435.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Can even beat the demonstrating expert</text><rect x="792" y="462" width="396" height="60" rx="10" fill="#16324A" stroke="#48C78E" stroke-width="1.5"/><text x="812" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">policy variance</text><text x="1168" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#48C78E" font-weight="800" text-anchor="end">~ 0</text><text x="812" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="start">kept close to zero throughout the sweep</text></g></svg>