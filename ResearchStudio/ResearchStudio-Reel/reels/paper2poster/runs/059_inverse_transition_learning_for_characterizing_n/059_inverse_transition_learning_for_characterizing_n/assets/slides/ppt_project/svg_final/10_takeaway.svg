<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Clip the posterior — get safe, expert-beating policies</text><g id="cue_s10_c1_clipping_bayesian_posterior_over_tra"><title>clipping bayesian posterior over transition dynamics constraints derived near optimal</title><rect x="64" y="176" width="1152" height="188" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="188" rx="6" fill="#48C78E"/><circle cx="112" cy="228" r="10" fill="#48C78E"/><text x="150" y="234" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">Provably safe, gradient-free, low-variance</text><text x="150" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">By clipping a Bayesian posterior over the transition dynamics with constraints derived from a</text><text x="150" y="293" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">near-optimal expert, you obtain gradient-free offline policies that are provably safe, can</text><text x="150" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">outperform the expert who generated the data, and carry dramatically lower variance than maximum</text><text x="150" y="343" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">likelihood.</text></g><g id="cue_s10_c2_same_recipe_constraints_plus_uncerta"><title>same recipe constraints plus uncertainty also yields ranking actions uncertain</title><rect x="64" y="386" width="1152" height="163" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="386" width="6" height="163" rx="6" fill="#34D3C0"/><circle cx="112" cy="438" r="10" fill="#34D3C0"/><text x="150" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">Uncertainty becomes an action ranking</text><text x="150" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The same recipe of constraints plus uncertainty also yields a ranking of actions in the</text><text x="150" y="503" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">uncertain states, making the learned policies more informative for high-stakes planning such as</text><text x="150" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">clinical decision making.</text></g><line x1="64" y1="579" x2="1216" y2="579" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="615" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">Bayesian Inverse Transition Learning for Offline Settings</text><text x="64" y="641" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICML 2023  ·  arXiv:2308.05075  ·  Benac, Parbhoo, Doshi-Velez</text></svg>