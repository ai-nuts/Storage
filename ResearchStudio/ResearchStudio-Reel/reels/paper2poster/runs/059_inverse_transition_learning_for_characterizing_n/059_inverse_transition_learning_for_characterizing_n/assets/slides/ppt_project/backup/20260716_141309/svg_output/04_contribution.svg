<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Inverse Transition Learning: constraints meet a posterior</text><g id="cue_s04_c1_work_introduces_inverse_transition_l"><title>work introduces inverse transition learning gradient free constraint based approach</title><rect x="64" y="176" width="368" height="374" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="246" r="27" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Gradient-free &amp;</text><text x="92" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">constraint-based</text><text x="92" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">We introduce Inverse Transition Learning</text><text x="92" y="411" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">(ITL) — a gradient-free,</text><text x="92" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">constraint-based approach to estimating</text><text x="92" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">offline dynamics.</text></g><g id="cue_s04_c2_converts_near_optimal_expert_policy"><title>converts near optimal expert policy set constraints transition dynamics clips</title><rect x="456" y="176" width="368" height="374" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="176" width="368" height="6" rx="6" fill="#48C78E"/><circle cx="508" cy="246" r="27" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="508" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">2</text><text x="484" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Clip the Bayesian</text><text x="484" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">posterior</text><text x="484" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Convert a near-optimal expert policy</text><text x="484" y="411" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">into constraints on the dynamics, then</text><text x="484" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">clip a Bayesian posterior so every</text><text x="484" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">sampled model yields a safe,</text><text x="484" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">high-performing policy.</text></g><g id="cue_s04_c3_beyond_method_itself_carefully_analy"><title>beyond method itself carefully analyzes when why maximum likelihood estimation</title><rect x="848" y="176" width="368" height="374" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="176" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="246" r="27" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Analysis of when MLE</text><text x="876" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">fails</text><text x="876" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">We analyze exactly when and why MLE</text><text x="876" y="411" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">breaks under uneven coverage, and show</text><text x="876" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">constraints plus uncertainty rank</text><text x="876" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">actions even where the expert is unsure.</text></g></svg>