<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact, in the numbers</text><g id="cue_s09_c1_numbers_tell_clear_story"><title>numbers tell clear story</title><rect x="64" y="158" width="1152" height="56" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="56" rx="6" fill="#4C9BE8"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="600" text-anchor="start">The numbers tell a clear story — lower Q*metric is better, and zero is optimal.</text></g><g id="cue_s09_c2_fully_optimal_expert_our_method"><title>fully optimal expert our method reaches star metric exactly zero</title><rect x="64" y="238" width="370" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="238" width="6" height="300" rx="6" fill="#48C78E"/><text x="94" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#48C78E" font-weight="800" text-anchor="start">0 ± 0</text><text x="94" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Q*metric at epsilon = 0</text><text x="94" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Exactly optimal with zero variance, in</text><text x="94" y="433" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">both low and high data — vs MLE 59.75 and</text><text x="94" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the plain posterior 142.</text></g><g id="cue_s09_c3_hardest_setting_epsilon_equals_four"><title>hardest setting epsilon equals four high score eight point seven</title><rect x="455" y="238" width="370" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="455" y="238" width="6" height="300" rx="6" fill="#4C9BE8"/><text x="485" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#4C9BE8" font-weight="800" text-anchor="start">8.79</text><text x="485" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">hardest setting, eps = 4</text><text x="485" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Beats MLE's 20.11 and roughly matches the</text><text x="485" y="433" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">near-optimal expert's 9.4 in the high-data</text><text x="485" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">regime.</text></g><g id="cue_s09_c4_accuracy_deterministic_states_consta"><title>accuracy deterministic states constant one hundred percent policy variance collapses</title><rect x="846" y="238" width="370" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="846" y="238" width="6" height="300" rx="6" fill="#F2C14E"/><text x="876" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#F2C14E" font-weight="800" text-anchor="start">52 -&gt; 0</text><text x="876" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">policy std. deviation</text><text x="876" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Deterministic-state accuracy is a constant</text><text x="876" y="433" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">100%; policy variance collapses from about</text><text x="876" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">52 down to essentially zero.</text></g><line x1="64" y1="572" x2="1216" y2="572" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Averaged over 1,000 datasets per setting.</text></svg>