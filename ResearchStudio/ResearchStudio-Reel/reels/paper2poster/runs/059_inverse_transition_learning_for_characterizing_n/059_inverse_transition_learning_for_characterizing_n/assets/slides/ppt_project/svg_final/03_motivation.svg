<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The expert who logged the data already knows a lot</text><g id="cue_s03_c1_key_insight_people_who_generate"><title>key insight people who generate offline such clinicians usually acting</title><rect x="64" y="158" width="1152" height="84" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="84" rx="6" fill="#34D3C0"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1.5">Key insight</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">The people who generate offline data — clinicians, teachers — are usually acting near-optimally.</text></g><g id="cue_s03_c2_their_choices_quietly_encode_which"><title>their choices quietly encode which actions good which bad yet</title><rect x="64" y="262" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="262" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Their choices are a hidden signal</text><text x="92" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Each expert decision quietly encodes which actions are</text><text x="92" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">good and which are bad — yet a plain MLE fit of the</text><text x="92" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">dynamics throws that information away.</text><text x="92" y="400" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#34D3C0" font-weight="700" text-anchor="start">expert action  =  implicit label on quality</text></g><g id="cue_s03_c3_earlier_gradient_based_inverse_reinf"><title>earlier gradient based inverse reinforcement learning methods try recover expert</title><rect x="648" y="262" width="568" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="262" width="6" height="150" rx="6" fill="#F2C14E"/><text x="676" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Prior gradient-based inverse RL</text><text x="676" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Earlier methods estimate an expert's belief of the</text><text x="676" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">dynamics, but never tie it back to the true</text><text x="676" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">environment — and inherit the fragility of gradient</text><text x="676" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">optimization.</text><text x="676" y="400" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="700" text-anchor="start">estimated T  =/=  true T   ·   gradients are brittle</text></g><g id="cue_s03_c4_want_exploit_expert_signal_directly"><title>want exploit expert signal directly without gradients</title><rect x="64" y="432" width="1152" height="118" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="432" width="6" height="118" rx="6" fill="#34D3C0"/><text x="92" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1.5">Our goal</text><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Exploit the expert signal directly, and without any gradients.</text><text x="92" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">turn near-optimal demonstrations into hard constraints on the dynamics</text></g></svg>