<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">You cannot experiment — you only have a fixed batch</text><g id="cue_s02_c1_fields_like_healthcare_education_can"><title>fields like healthcare education cannot experiment freely offline reinforcement learning</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="404" height="6" rx="6" fill="#4C9BE8"/><text x="92" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">No new interactions allowed</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">In healthcare and education we cannot</text><text x="92" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">experiment on people. Offline RL must</text><text x="92" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">learn the transition dynamics T purely</text><text x="92" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">from a fixed batch of logged experience.</text><rect x="120" y="360" width="292" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="266" y="392" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="middle">fixed batch  D</text><line x1="140" y1="410" x2="392" y2="410" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="160" cy="440" r="7" fill="#4C9BE8"/><circle cx="210" cy="440" r="7" fill="#4C9BE8"/><circle cx="260" cy="440" r="7" fill="#26455F"/><circle cx="310" cy="440" r="7" fill="#4C9BE8"/><circle cx="360" cy="440" r="7" fill="#26455F"/><circle cx="160" cy="478" r="7" fill="#26455F"/><circle cx="210" cy="478" r="7" fill="#4C9BE8"/><circle cx="260" cy="478" r="7" fill="#26455F"/><circle cx="310" cy="478" r="7" fill="#26455F"/><circle cx="360" cy="478" r="7" fill="#4C9BE8"/><text x="266" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="middle">logged (s, a) pairs — no queries</text></g><g id="cue_s02_c2_trouble_only_covers_actions_original"><title>trouble only covers actions original users actually took leaving much</title><rect x="500" y="158" width="716" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="176" rx="6" fill="#F2C14E"/><text x="528" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">The data only covers what users did</text><text x="528" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Logged trajectories reveal only the actions the original users</text><text x="528" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">actually took. Vast parts of the state-action space are simply</text><text x="528" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">never seen.</text><rect x="528" y="286" width="660" height="32" rx="6" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="544" y="307" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2C14E" font-weight="700" text-anchor="start">covered state-action pairs  &lt;&lt;  full state-action space</text></g><g id="cue_s02_c3_standard_maximum_likelihood_estimate"><title>standard maximum likelihood estimates dynamics therefore produce policies swing wildly</title><rect x="500" y="350" width="716" height="200" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="350" width="6" height="200" rx="6" fill="#F2685C"/><text x="528" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2685C" font-weight="800" text-anchor="start">Maximum likelihood breaks down</text><text x="528" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">An MLE fit of the dynamics yields policies that swing wildly from</text><text x="528" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">one dataset to the next, and recommend genuinely unsafe actions</text><text x="528" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">exactly where data is thin.</text><text x="528" y="512" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#F2685C" font-weight="800" text-anchor="start">high variance  +  unsafe actions  where coverage is poor</text></g></svg>