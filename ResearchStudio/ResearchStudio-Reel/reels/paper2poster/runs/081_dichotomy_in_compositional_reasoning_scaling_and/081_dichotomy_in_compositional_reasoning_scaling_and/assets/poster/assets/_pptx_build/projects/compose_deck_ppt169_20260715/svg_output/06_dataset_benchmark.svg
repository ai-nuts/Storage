<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="80" y="52" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="76" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">TEST SUITE</text>
    <text x="100" y="106" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">A purpose-built suite of composite tasks</text>
  </g>

  <g id="cue_s06_c1_suite_pairs_simple_building_blocks" data-cue-label="cue_s06_c1_suite_pairs_simple_building_blocks suite pairs simple building blocks">
    <rect x="80" y="128" width="1120" height="56" rx="12" fill="#1E293B"/>
    <text x="104" y="163" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">Each composite is built from two simple building-block tasks.</text>
  </g>

  <g id="cue_s06_c2_linguistic_tasks_include_capitalizat" data-cue-label="cue_s06_c2_linguistic_tasks_include_capitalizat linguistic tasks capitalization swapping translations phrase recombination passive active">
    <rect x="80" y="202" width="545" height="196" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="202" width="6" height="196" rx="3" fill="#0EA5E9"/>
    <text x="110" y="234" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0EA5E9" letter-spacing="1">LINGUISTIC TASKS</text>
    <g id="ling-chips">
      <rect x="110" y="248" width="150" height="40" rx="8" fill="#E0F2FE"/>
      <text x="185" y="273" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Capitalization</text>
      <rect x="272" y="248" width="90" height="40" rx="8" fill="#E0F2FE"/>
      <text x="317" y="273" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Swap</text>
      <rect x="374" y="248" width="230" height="40" rx="8" fill="#F1F5F9"/>
      <text x="489" y="273" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#475569">Phrase Recombination</text>
    </g>
    <g id="ling-chips2">
      <rect x="110" y="298" width="250" height="40" rx="8" fill="#F1F5F9"/>
      <text x="235" y="323" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#475569">Passive → Active</text>
      <rect x="372" y="298" width="232" height="40" rx="8" fill="#F1F5F9"/>
      <text x="488" y="323" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#475569">Object → Subject</text>
    </g>
    <text x="110" y="372" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#94A3B8">Word-level operations and longer-chain translations.</text>
  </g>

  <g id="cue_s06_c3_logical_tasks_combine_arithmetic_wor" data-cue-label="cue_s06_c3_logical_tasks_combine_arithmetic_wor logical tasks combine arithmetic word operations two sum modular plus one">
    <rect x="655" y="202" width="545" height="196" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="655" y="202" width="6" height="196" rx="3" fill="#4F46E5"/>
    <text x="685" y="234" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="1">LOGICAL TASKS</text>
    <g id="log-chips">
      <rect x="685" y="248" width="130" height="40" rx="8" fill="#EEF2FF"/>
      <text x="750" y="273" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Two Sum</text>
      <rect x="827" y="248" width="130" height="40" rx="8" fill="#EEF2FF"/>
      <text x="892" y="273" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Modular</text>
      <rect x="969" y="248" width="130" height="40" rx="8" fill="#EEF2FF"/>
      <text x="1034" y="273" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#1E293B">Plus One</text>
    </g>
    <rect x="685" y="298" width="414" height="40" rx="8" fill="#F1F5F9"/>
    <text x="892" y="323" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" font-weight="600" fill="#475569">combined with word-level operations</text>
    <text x="685" y="372" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#94A3B8">Arithmetic rules paired with a linguistic operation.</text>
  </g>

  <g id="cue_s06_c4_tasks_split_separable_composites_act" data-cue-label="cue_s06_c4_tasks_split_separable_composites_act tasks split separable composites different input parts compose-by-step chained reasoning">
    <rect x="80" y="414" width="1120" height="212" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="104" y="446" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#1E293B" letter-spacing="1">TWO FAMILIES — THE HEART OF THE STUDY</text>
    <g id="fam-separable">
      <rect x="104" y="462" width="536" height="146" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
      <text x="128" y="494" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="700" fill="#059669">Separable composites</text>
      <text x="128" y="524" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">The two operations act on different parts</text>
      <text x="128" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">of the input.</text>
      <rect x="128" y="562" width="380" height="34" rx="8" fill="#FFFFFF"/>
      <text x="144" y="585" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" fill="#059669">e.g. Capitalization &amp; Plus One</text>
    </g>
    <g id="fam-step">
      <rect x="656" y="462" width="536" height="146" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
      <text x="680" y="494" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="700" fill="#DC2626">Compose-by-step composites</text>
      <text x="680" y="524" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">The operations must be chained through</text>
      <text x="680" y="548" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">shared, multi-step reasoning.</text>
      <rect x="680" y="562" width="360" height="34" rx="8" fill="#FFFFFF"/>
      <text x="696" y="585" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="16" fill="#DC2626">e.g. Capitalization &amp; Swap</text>
    </g>
  </g>

  <g id="footer">
    <text x="80" y="660" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Scoring: exact-match accuracy (logical) · word error rate (translation)</text>
    <text x="1200" y="660" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">06</text>
  </g>
</svg>
