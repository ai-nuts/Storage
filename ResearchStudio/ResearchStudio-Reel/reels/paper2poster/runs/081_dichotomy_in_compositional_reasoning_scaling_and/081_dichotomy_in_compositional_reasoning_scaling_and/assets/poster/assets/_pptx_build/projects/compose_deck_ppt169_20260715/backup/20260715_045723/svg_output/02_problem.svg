<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="80" y="56" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="80" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">THE PROBLEM</text>
    <text x="100" y="110" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">Each skill alone is easy — together they break</text>
  </g>

  <g id="cue_s02_c1_suppose_learned_two_simple_tasks" data-cue-label="cue_s02_c1_suppose_learned_two_simple_tasks suppose model learned two simple tasks capitalizing swapping words">
    <rect x="80" y="150" width="560" height="164" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="150" width="6" height="164" rx="3" fill="#059669"/>
    <text x="108" y="182" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="1">TWO SIMPLE TASKS, IN-CONTEXT</text>
    <g id="ex-cap">
      <rect x="108" y="198" width="240" height="94" rx="8" fill="#ECFDF5"/>
      <text x="124" y="222" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Capitalize  ( * )</text>
      <text x="124" y="252" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" fill="#475569">* apple</text>
      <text x="124" y="278" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#059669">→ APPLE</text>
    </g>
    <g id="ex-swap">
      <rect x="372" y="198" width="244" height="94" rx="8" fill="#ECFDF5"/>
      <text x="388" y="222" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Swap  ( )</text>
      <text x="388" y="252" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" fill="#475569">( ball book )</text>
      <text x="388" y="278" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" font-weight="700" fill="#059669">→ book ball</text>
    </g>
  </g>

  <g id="cue_s02_c2_given_input_needing_both_combine" data-cue-label="cue_s02_c2_given_input_needing_both_combine given input needing both combine skills composite">
    <rect x="80" y="330" width="560" height="104" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="330" width="6" height="104" rx="3" fill="#4F46E5"/>
    <text x="108" y="360" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="1">NOW COMBINE BOTH AT ONCE</text>
    <text x="108" y="392" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" fill="#475569">( * pie * sports )</text>
    <text x="108" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#1E293B">must swap <tspan font-style="italic">and</tspan> capitalize — a task never shown as an example</text>
  </g>

  <g id="cue_s02_c3_humans_trivial_yet_even_gpt_4" data-cue-label="cue_s02_c3_humans_trivial_yet_even_gpt_4 humans trivial yet gpt-4 claude 3 often fail">
    <rect x="80" y="450" width="560" height="92" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="120" cy="496" r="18" fill="#DC2626"/>
    <text x="120" y="503" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="20" font-weight="700" fill="#FFFFFF">✗</text>
    <text x="154" y="486" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Trivial for humans — yet models stumble</text>
    <text x="154" y="512" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">Even GPT-4 and Claude 3 often fail this composite.</text>
  </g>

  <g id="figure">
    <rect x="680" y="150" width="520" height="392" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="700" y="180" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="1">FIGURE 1 · COMPOSITIONAL IN-CONTEXT LEARNING</text>
    <image href="../images/figure1.png" x="700" y="196" width="480" height="266" preserveAspectRatio="xMidYMid meet"/>
    <text x="700" y="492" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#475569">Simple tasks are solved (✓ ✓); the composite that needs</text>
    <text x="700" y="514" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#475569">both operations at once produces a wrong output (✗).</text>
  </g>

  <g id="footer">
    <text x="80" y="694" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Xu, Shi &amp; Liang · COLM 2024 · Figure 1</text>
    <text x="1200" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">02</text>
  </g>
</svg>
