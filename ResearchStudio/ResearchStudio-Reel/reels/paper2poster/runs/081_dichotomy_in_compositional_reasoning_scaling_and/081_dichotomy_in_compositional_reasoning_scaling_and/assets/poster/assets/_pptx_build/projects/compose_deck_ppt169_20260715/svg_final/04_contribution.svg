      <rect x="460" y="182" width="360" height="8" rx="4" fill="#0EA5E9"/>
      <text x="492" y="252" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="44" font-weight="700" fill="#E0F2FE">02</text>
      <text x="492" y="300" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#1E293B">An empirical dichotomy</text>
