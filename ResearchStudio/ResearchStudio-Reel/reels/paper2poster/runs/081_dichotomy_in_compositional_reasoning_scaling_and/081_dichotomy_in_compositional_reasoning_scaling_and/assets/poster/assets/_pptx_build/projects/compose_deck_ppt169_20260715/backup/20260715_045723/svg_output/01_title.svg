<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="10" fill="#1E293B"/>
  </g>

  <g id="header">
    <rect x="80" y="66" width="6" height="42" fill="#4F46E5"/>
    <text x="100" y="86" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">COLM 2024  ·  UNIVERSITY OF WISCONSIN–MADISON</text>
    <text x="100" y="106" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="400" fill="#94A3B8" letter-spacing="1">Compositional in-context learning · arXiv 2407.15720</text>
  </g>

  <g id="cue_s01_c1_large_language_models_combine_skills" data-cue-label="cue_s01_c1_large_language_models_combine_skills large language models combine skills already know">
    <rect x="80" y="140" width="720" height="60" rx="30" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <circle cx="118" cy="170" r="15" fill="#4F46E5"/>
    <text x="118" y="176" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="17" font-weight="700" fill="#FFFFFF">?</text>
    <text x="146" y="177" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="600" fill="#1E293B">Can a model combine two skills it already knows?</text>
  </g>

  <g id="cue_s01_c2_colm_2024_tests_whether_models" data-cue-label="cue_s01_c2_colm_2024_tests_whether_models colm 2024 paper tests unseen composite task fusing two simple tasks">
    <text x="80" y="288" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="56" font-weight="700" fill="#1E293B">Do LLMs Have</text>
    <text x="80" y="352" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="56" font-weight="700" fill="#4F46E5">Compositional Ability?</text>
    <text x="82" y="392" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="22" fill="#475569">Solving an unseen composite task by fusing two simple tasks seen only separately —</text>
    <text x="82" y="420" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="22" fill="#475569">an investigation into its limitations and scalability.</text>
  </g>

  <g id="cue_s01_c3_across_llama_gpt_sharp_dichotomy" data-cue-label="cue_s01_c3_across_llama_gpt_sharp_dichotomy across llama gpt sharp dichotomy emerges">
    <g id="chip-separable">
      <rect x="80" y="470" width="530" height="96" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="80" y="470" width="6" height="96" rx="3" fill="#059669"/>
      <text x="106" y="502" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="1">SEPARABLE  ✓</text>
      <text x="106" y="530" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="600" fill="#1E293B">Sub-tasks on separate inputs</text>
      <text x="106" y="553" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">compose well and improve with scale</text>
    </g>
    <g id="chip-compose">
      <rect x="632" y="470" width="530" height="96" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="632" y="470" width="6" height="96" rx="3" fill="#DC2626"/>
      <text x="658" y="502" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#DC2626" letter-spacing="1">COMPOSE-BY-STEP  ✗</text>
      <text x="658" y="530" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="600" fill="#1E293B">Chained multi-step reasoning</text>
      <text x="658" y="553" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">fails — and scaling up does not help</text>
    </g>
  </g>

  <g id="utility">
    <image href="../images/logo_uw.png" x="1096" y="150" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>
    <g id="qr-paper">
      <rect x="1064" y="612" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <image href="../images/qr_paper.png" x="1069" y="617" width="50" height="50" preserveAspectRatio="xMidYMid meet"/>
      <text x="1094" y="686" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Paper</text>
    </g>
    <g id="qr-code">
      <rect x="1140" y="612" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <image href="../images/qr_code.png" x="1145" y="617" width="50" height="50" preserveAspectRatio="xMidYMid meet"/>
      <text x="1170" y="686" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Code</text>
    </g>
  </g>

  <g id="footer">
    <text x="80" y="648" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="600" fill="#475569">Zhuoyan Xu  ·  Zhenmei Shi  ·  Yingyu Liang</text>
    <text x="80" y="674" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">University of Wisconsin–Madison</text>
  </g>
</svg>
