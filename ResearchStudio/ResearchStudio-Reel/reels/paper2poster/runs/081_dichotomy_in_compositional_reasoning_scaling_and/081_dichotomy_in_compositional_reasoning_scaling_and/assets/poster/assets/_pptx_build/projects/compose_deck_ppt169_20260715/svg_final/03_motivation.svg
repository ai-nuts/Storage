<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="80" y="66" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="90" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">MOTIVATION</text>
    <text x="100" y="120" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">Why compositional ability, and why now</text>
  </g>

  <g id="cue_s03_c1_models_increasingly_asked_chain_skil" data-cue-label="cue_s03_c1_models_increasingly_asked_chain_skil models increasingly asked chain skills real reasoning lack account">
    <rect x="80" y="176" width="552" height="392" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="132" cy="232" r="26" fill="#4F46E5"/>
    <text x="132" y="241" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#FFFFFF">⛓</text>
    <text x="178" y="228" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#1E293B">Real reasoning means</text>
    <text x="178" y="256" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#1E293B">chaining skills</text>
    <text x="112" y="312" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" fill="#334155">LLMs are increasingly asked to combine</text>
    <text x="112" y="340" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" fill="#334155">skills for real tasks, not just repeat one</text>
    <text x="112" y="368" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" fill="#334155">operation.</text>
    <g id="chain-motif">
      <rect x="112" y="410" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
      <text x="177" y="442" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="700" fill="#1E293B">Skill A</text>
      <text x="262" y="442" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#4F46E5">+</text>
      <rect x="282" y="410" width="130" height="52" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
      <text x="347" y="442" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="700" fill="#1E293B">Skill B</text>
      <text x="432" y="442" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="22" font-weight="700" fill="#4F46E5">→</text>
      <rect x="452" y="410" width="150" height="52" rx="10" fill="#4F46E5"/>
      <text x="527" y="442" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Composite</text>
    </g>
    <text x="112" y="512" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">Yet we lack a clear account of exactly</text>
    <text x="112" y="536" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">when that chaining actually works.</text>
  </g>

  <g id="cue_s03_c2_prior_studies_narrow_little_theory" data-cue-label="cue_s03_c2_prior_studies_narrow_little_theory prior studies narrow little theory failure reproduces frontier models">
    <rect x="648" y="176" width="552" height="392" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="700" cy="232" r="26" fill="#1E293B"/>
    <text x="700" y="241" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#FFFFFF">!</text>
    <text x="746" y="228" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#1E293B">A gap prior work</text>
    <text x="746" y="256" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#1E293B">left open</text>
    <text x="680" y="312" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" fill="#334155">Earlier studies of compositional</text>
    <text x="680" y="340" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" fill="#334155">generalization are narrow and offer</text>
    <text x="680" y="368" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" fill="#334155">little theory.</text>
    <rect x="680" y="404" width="490" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="702" y="436" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#DC2626" letter-spacing="1">EASY TO REPRODUCE</text>
    <text x="702" y="466" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#1E293B">Show a frontier model two simple rules,</text>
    <text x="702" y="492" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#1E293B">then test both together — and it stumbles,</text>
    <text x="702" y="518" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#1E293B">even though each rule alone is easy.</text>
  </g>

  <g id="footer">
    <text x="80" y="694" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Xu, Shi &amp; Liang · COLM 2024</text>
    <text x="1200" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">03</text>
  </g>
</svg>
