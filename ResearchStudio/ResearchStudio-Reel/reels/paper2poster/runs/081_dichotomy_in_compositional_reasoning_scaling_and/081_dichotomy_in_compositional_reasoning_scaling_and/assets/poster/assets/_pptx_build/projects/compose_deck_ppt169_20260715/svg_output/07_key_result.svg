<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="80" y="52" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="76" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">KEY RESULT</text>
    <text x="100" y="106" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">Composition works — or collapses — by task type</text>
  </g>

  <g id="cue_s07_c1_sharp_split" data-cue-label="cue_s07_c1_sharp_split a sharp split">
    <rect x="80" y="122" width="300" height="46" rx="23" fill="#1E293B"/>
    <text x="230" y="151" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">A sharp split in behavior</text>
  </g>

  <g id="cue_s07_c3_compose_by_step_tasks_they_collapse" data-cue-label="cue_s07_c3_compose_by_step_tasks_they_collapse compose-by-step collapse llama ninety percent composite below twenty percent scaling doesnt help">
    <rect x="80" y="188" width="770" height="392" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="188" width="6" height="392" rx="3" fill="#DC2626"/>
    <text x="108" y="220" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#DC2626" letter-spacing="1">FIGURE 2 · CAPITALIZATION &amp; SWAP (COMPOSE-BY-STEP) · ACCURACY vs SCALE</text>
    <image href="../images/figure2.png" x="104" y="236" width="724" height="170" preserveAspectRatio="xMidYMid meet"/>
    <g id="legend-note">
      <rect x="104" y="418" width="724" height="146" rx="10" fill="#FEF2F2"/>
      <circle cx="126" cy="448" r="6" fill="#DC2626"/>
      <text x="142" y="454" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#1E293B"><tspan font-weight="700" fill="#DC2626">composite</tspan> (red) collapses to ~20% or below and stays flat as the model grows.</text>
      <circle cx="126" cy="486" r="6" fill="#2563EB"/>
      <text x="142" y="492" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#1E293B"><tspan font-weight="700">capital / swap</tspan> stay near 90–100% on each simple task alone.</text>
      <circle cx="126" cy="524" r="6" fill="#EA9A2B"/>
      <text x="142" y="530" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#1E293B"><tspan font-weight="700" fill="#EA9A2B">composite in-context</tspan> recovers — so the ability is there, unused.</text>
    </g>
  </g>

  <g id="cue_s07_c2_separable_composite_tasks_models_com" data-cue-label="cue_s07_c2_separable_composite_tasks_models_com separable composite tasks models compose well improve with scale approaching gold standard">
    <rect x="870" y="188" width="330" height="392" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="898" y="224" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="1">THE OTHER SIDE</text>
    <text x="898" y="262" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#1E293B">Separable tasks</text>
    <g id="up-motif">
      <path d="M900 470 L960 410 L1010 440 L1090 350" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1090 350 L1066 356 M1090 350 L1084 374" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="898" y="316" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">Models compose the two</text>
    <text x="898" y="342" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">skills well.</text>
    <text x="898" y="510" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">Accuracy climbs with scale,</text>
    <text x="898" y="536" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">approaching the composite</text>
    <text x="898" y="562" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" fill="#334155">in-context gold standard.</text>
  </g>

  <g id="footer">
    <text x="80" y="618" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">The models have the representational power — what they lack is composing it from simple-task demos alone.</text>
    <text x="80" y="694" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Xu, Shi &amp; Liang · COLM 2024 · Figure 2</text>
    <text x="1200" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">07</text>
  </g>
</svg>
