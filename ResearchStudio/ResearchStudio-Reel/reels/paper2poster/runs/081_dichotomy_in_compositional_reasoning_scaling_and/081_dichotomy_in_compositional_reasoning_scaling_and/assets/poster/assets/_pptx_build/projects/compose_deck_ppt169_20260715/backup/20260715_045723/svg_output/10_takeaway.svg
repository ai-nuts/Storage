<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="ending">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="10" fill="#1E293B"/>
  </g>

  <g id="header">
    <rect x="80" y="60" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="84" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">TAKEAWAY</text>
    <text x="100" y="114" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">Composition follows the shape of the task</text>
  </g>

  <g id="cue_s10_c1_takeaway_models_combine_two_skills" data-cue-label="cue_s10_c1_takeaway_models_combine_two_skills takeaway models combine two skills only when act on separate parts of input">
    <rect x="80" y="150" width="552" height="300" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="132" cy="204" r="26" fill="#059669"/>
    <text x="132" y="213" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#FFFFFF">✓</text>
    <text x="178" y="214" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#059669">When composition works</text>
    <text x="112" y="272" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="21" fill="#334155">Models can combine two learned skills</text>
    <text x="112" y="302" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="21" fill="#334155">only when those skills act on separate</text>
    <text x="112" y="332" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="21" fill="#334155">parts of the input.</text>
    <rect x="112" y="368" width="480" height="52" rx="10" fill="#FFFFFF"/>
    <text x="132" y="401" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#059669">Separable → composes, and scales.</text>
  </g>

  <g id="cue_s10_c2_when_task_needs_genuinely_chained" data-cue-label="cue_s10_c2_when_task_needs_genuinely_chained when task needs genuinely chained multi-step reasoning they fail more parameters wont help">
    <rect x="648" y="150" width="552" height="300" rx="14" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="700" cy="204" r="26" fill="#DC2626"/>
    <text x="700" y="213" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#FFFFFF">✗</text>
    <text x="746" y="214" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#DC2626">When it fails</text>
    <text x="680" y="272" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="21" fill="#334155">When a task demands genuinely chained,</text>
    <text x="680" y="302" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="21" fill="#334155">multi-step reasoning, the models fail</text>
    <text x="680" y="332" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="21" fill="#334155">to compose.</text>
    <rect x="680" y="368" width="490" height="52" rx="10" fill="#FFFFFF"/>
    <text x="700" y="401" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#DC2626">More parameters will not rescue them.</text>
  </g>

  <g id="cue_s10_c3_task_structure_predicts_whether_scal" data-cue-label="cue_s10_c3_task_structure_predicts_whether_scal task structure predicts whether scaling helps">
    <rect x="80" y="472" width="1120" height="104" rx="14" fill="#1E293B"/>
    <rect x="80" y="472" width="8" height="104" rx="4" fill="#4F46E5"/>
    <text x="120" y="512" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#818CF8" letter-spacing="2">THE PRACTICAL RULE</text>
    <text x="120" y="542" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="24" font-weight="700" fill="#FFFFFF">Task structure predicts whether scaling helps:</text>
    <text x="120" y="566" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" fill="#CBD5E1">separable tasks scale · entangled multi-step tasks do not.</text>
  </g>

  <g id="utility">
    <g id="qr-paper">
      <rect x="1010" y="606" width="52" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <image href="../images/qr_paper.png" x="1015" y="611" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
      <text x="1036" y="672" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Paper</text>
    </g>
    <g id="qr-code">
      <rect x="1080" y="606" width="52" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
      <image href="../images/qr_code.png" x="1085" y="611" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
      <text x="1106" y="672" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Code</text>
    </g>
    <image href="../images/logo_uw.png" x="1150" y="606" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="footer">
    <text x="80" y="648" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="600" fill="#475569">Do LLMs Have Compositional Ability?  ·  Xu, Shi &amp; Liang</text>
    <text x="80" y="674" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">COLM 2024 · University of Wisconsin–Madison · arXiv 2407.15720</text>
  </g>
</svg>
