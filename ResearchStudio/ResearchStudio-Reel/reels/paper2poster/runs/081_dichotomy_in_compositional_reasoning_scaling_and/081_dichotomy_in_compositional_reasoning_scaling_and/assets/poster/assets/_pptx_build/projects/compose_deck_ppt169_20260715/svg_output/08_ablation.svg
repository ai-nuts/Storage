<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="80" y="52" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="76" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">ABLATION</text>
    <text x="100" y="106" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">What scale changes — and what it does not</text>
  </g>

  <g id="cue_s08_c1_scale_sweep_key_ablation" data-cue-label="cue_s08_c1_scale_sweep_key_ablation scale sweep is the key ablation">
    <rect x="80" y="122" width="400" height="46" rx="23" fill="#1E293B"/>
    <text x="280" y="151" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">The scale sweep is the key ablation</text>
  </g>

  <g id="cue_s08_c2_separable_tasks_accuracy_rises_scale" data-cue-label="cue_s08_c2_separable_tasks_accuracy_rises_scale separable tasks accuracy rises with scale compose-by-step flat or degrades">
    <rect x="80" y="188" width="620" height="410" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="188" width="6" height="410" rx="3" fill="#059669"/>
    <text x="108" y="220" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="1">FIGURE 3 · TRANSLATION COMPOSITES · WER vs SCALE</text>
    <image href="../images/figure3.png" x="108" y="236" width="560" height="322" preserveAspectRatio="xMidYMid meet"/>
    <text x="108" y="582" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#475569">On these separable translation tasks, error falls steadily as the model scales.</text>
  </g>

  <g id="cue_s08_c3_swapping_simple_task_demos_composite" data-cue-label="cue_s08_c3_swapping_simple_task_demos_composite swapping simple-task demos for composite ones recovers performance isolating composition not capability bottleneck">
    <rect x="720" y="188" width="480" height="410" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="720" y="188" width="6" height="410" rx="3" fill="#4F46E5"/>
    <text x="748" y="220" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="1">SWAP THE DEMONSTRATIONS</text>
    <text x="748" y="256" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" fill="#334155">Replace simple-task demos with</text>
    <text x="748" y="282" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" fill="#334155">composite ones — and performance</text>
    <text x="748" y="308" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" fill="#334155">recovers.</text>
    <g id="swap-motif">
      <rect x="748" y="332" width="200" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.4"/>
      <text x="848" y="360" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#DC2626">simple-task demos</text>
      <text x="848" y="386" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#DC2626">composite fails</text>
      <text x="972" y="374" text-anchor="middle" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="26" font-weight="700" fill="#4F46E5">→</text>
      <rect x="996" y="332" width="180" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
      <text x="1086" y="360" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#059669">composite demos</text>
      <text x="1086" y="386" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#059669">recovers</text>
    </g>
    <rect x="748" y="424" width="428" height="150" rx="10" fill="#EEF2FF"/>
    <text x="770" y="456" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="1">WHAT THIS ISOLATES</text>
    <text x="770" y="488" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Composition — not capability —</text>
    <text x="770" y="514" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#1E293B">is the bottleneck.</text>
    <text x="770" y="546" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" fill="#475569">Larger models help only when the simple</text>
    <text x="770" y="568" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="16" fill="#475569">tasks improve too — as the theory predicts.</text>
  </g>

  <g id="footer">
    <text x="80" y="694" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Xu, Shi &amp; Liang · COLM 2024 · Figure 3</text>
    <text x="1200" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">08</text>
  </g>
</svg>
