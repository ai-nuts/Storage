<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feFlood flood-color="#1E293B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="80" y="52" width="6" height="40" fill="#4F46E5"/>
    <text x="100" y="76" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#4F46E5" letter-spacing="2">METHOD</text>
    <text x="100" y="106" font-family="Georgia, &quot;Microsoft YaHei&quot;, serif" font-size="34" font-weight="700" fill="#1E293B">How the study is built — in two halves</text>
  </g>

  <g id="cue_s05_c1_two_halves" data-cue-label="cue_s05_c1_two_halves two halves empirical theoretical">
    <rect x="80" y="130" width="1120" height="46" rx="23" fill="#1E293B"/>
    <text x="640" y="159" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Two complementary halves  ·  Empirical evaluation  +  Theoretical explanation</text>
  </g>

  <g id="cue_s05_c2_empirically_composite_task_tested_fo" data-cue-label="cue_s05_c2_empirically_composite_task_tested_fo empirically composite task four settings ten in-context examples simple alone composite gold standard">
    <rect x="80" y="196" width="552" height="466" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="80" y="196" width="6" height="466" rx="3" fill="#0EA5E9"/>
    <text x="110" y="228" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#0EA5E9" letter-spacing="1">EMPIRICAL · FOUR IN-CONTEXT SETTINGS (K = 10)</text>
    <g id="setting-1">
      <rect x="110" y="244" width="492" height="88" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="128" y="276" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#1E293B">1 · Simple task A alone</text>
      <text x="128" y="304" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">demos and test both from sub-task A</text>
    </g>
    <g id="setting-2">
      <rect x="110" y="342" width="492" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <text x="128" y="374" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#1E293B">2 · Simple task B alone</text>
      <text x="128" y="398" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#475569">demos and test both from sub-task B</text>
    </g>
    <g id="setting-3">
      <rect x="110" y="422" width="492" height="88" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.6"/>
      <text x="128" y="454" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#4F46E5">3 · Composite  ← the real test</text>
      <text x="128" y="482" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#334155">simple-task demos, but a composite test input</text>
    </g>
    <g id="setting-4">
      <rect x="110" y="520" width="492" height="88" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.4"/>
      <text x="128" y="552" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="19" font-weight="700" fill="#059669">4 · Composite in-context</text>
      <text x="128" y="580" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#334155">all composite — a gold-standard upper bound</text>
    </g>
    <text x="110" y="638" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" fill="#94A3B8">Tested across Llama-1/2/3 and GPT families at many scales.</text>
  </g>

  <g id="cue_s05_c3_theoretically_linear_self_attention" data-cue-label="cue_s05_c3_theoretically_linear_self_attention theoretically linear self-attention model composition succeeds confined support separate embedding subspaces">
    <rect x="648" y="196" width="552" height="466" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="648" y="196" width="6" height="466" rx="3" fill="#059669"/>
    <text x="678" y="228" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="13" font-weight="700" fill="#059669" letter-spacing="1">THEORETICAL · LINEAR SELF-ATTENTION</text>
    <rect x="678" y="244" width="492" height="70" rx="10" fill="#0F172A"/>
    <text x="924" y="278" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="17" fill="#E2E8F0">f(E) = E + W_pv · E · (Eᵀ W_kq E) / N</text>
    <text x="924" y="300" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" fill="#94A3B8">one-layer, single-head linear self-attention</text>
    <text x="678" y="352" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Composition succeeds under confined support</text>

    <g id="confined-ok">
      <rect x="678" y="372" width="240" height="150" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
      <text x="798" y="398" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#059669">SEPARATE SUBSPACES ✓</text>
      <rect x="706" y="416" width="86" height="86" rx="8" fill="#059669" fill-opacity="0.20" stroke="#059669" stroke-width="1.5"/>
      <text x="749" y="466" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#059669">A</text>
      <rect x="806" y="416" width="86" height="86" rx="8" fill="#0EA5E9" fill-opacity="0.20" stroke="#0EA5E9" stroke-width="1.5"/>
      <text x="849" y="466" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#0EA5E9">B</text>
    </g>
    <g id="confined-bad">
      <rect x="930" y="372" width="240" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
      <text x="1050" y="398" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14" font-weight="700" fill="#DC2626">OVERLAPPING ✗</text>
      <rect x="978" y="416" width="86" height="86" rx="8" fill="#DC2626" fill-opacity="0.18" stroke="#DC2626" stroke-width="1.5"/>
      <rect x="1024" y="416" width="86" height="86" rx="8" fill="#DC2626" fill-opacity="0.18" stroke="#DC2626" stroke-width="1.5"/>
      <text x="1044" y="466" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="15" font-weight="700" fill="#DC2626">A∩B</text>
    </g>
    <text x="678" y="556" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#334155">Each task in its own embedding subspace →</text>
    <text x="678" y="582" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#334155">the model can combine them. When the</text>
    <text x="678" y="608" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="17" fill="#334155">subspaces overlap, composition breaks down.</text>
  </g>

  <g id="footer">
    <text x="80" y="694" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">Xu, Shi &amp; Liang · COLM 2024 · §3–4</text>
    <text x="1200" y="694" text-anchor="end" font-family="Arial, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="12" fill="#94A3B8">05</text>
  </g>
</svg>
