<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p04-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">Contributions</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">04 · CONTRIBUTION</text>
  </g>

  <!-- Two contributions header -->
  <g id="cue_s04_c1_two_contributions" data-cue-label="cue_s04_c1_two_contributions">
    <title>Two contributions</title>
    <desc>two contributions main</desc>
    <rect x="96" y="150" width="360" height="52" rx="26" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="126" y="184" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E3A8A">Two main contributions</text>
  </g>

  <!-- Contribution 1: ALD -->
  <g id="cue_s04_c2_first_amortized_langevin_dynamics_mc" data-cue-label="cue_s04_c2_first_amortized_langevin_dynamics_mc">
    <title>Amortized Langevin Dynamics: an MCMC algorithm updating a shared encoder, keeping the true posterior stationary</title>
    <desc>first amortized langevin dynamics mcmc algorithm removes per-datapoint iterations updates shared encoder parameters proven true posterior stationary</desc>
    <rect x="96" y="228" width="544" height="404" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="96" y="228" width="544" height="8" rx="4" fill="#1E3A8A"/>
    <circle cx="140" cy="290" r="24" fill="#1E3A8A"/>
    <text x="140" y="299" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="180" y="284" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="bold" fill="#0F172A">Amortized Langevin</text>
    <text x="180" y="316" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="bold" fill="#0F172A">Dynamics (ALD)</text>
    <text x="128" y="372" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">A new MCMC algorithm that removes</text>
    <text x="128" y="402" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">per-datapoint sampling iterations entirely,</text>
    <text x="128" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">running Langevin updates on the</text>
    <text x="128" y="462" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">parameters of a shared encoder.</text>
    <rect x="128" y="500" width="480" height="104" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="148" y="536" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#1E3A8A">GUARANTEE</text>
    <text x="148" y="568" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">Proven to keep the true posterior as</text>
    <text x="148" y="594" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">its stationary distribution.</text>
  </g>

  <!-- Contribution 2: LAE -->
  <g id="cue_s04_c3_second_langevin_autoencoder_generati" data-cue-label="cue_s04_c3_second_langevin_autoencoder_generati">
    <title>The Langevin Autoencoder: a generative framework that is a small tweak of a standard autoencoder</title>
    <desc>second langevin autoencoder generative framework built on it small tweak standard autoencoder special cases</desc>
    <rect x="664" y="228" width="520" height="404" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="664" y="228" width="520" height="8" rx="4" fill="#0E7490"/>
    <circle cx="708" cy="290" r="24" fill="#0E7490"/>
    <text x="708" y="299" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="748" y="284" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="bold" fill="#0F172A">The Langevin</text>
    <text x="748" y="316" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="bold" fill="#0F172A">Autoencoder (LAE)</text>
    <text x="696" y="372" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">A framework for training deep generative</text>
    <text x="696" y="402" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">models built on ALD that, remarkably,</text>
    <text x="696" y="432" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">amounts to only a small modification of</text>
    <text x="696" y="462" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">a traditional autoencoder.</text>
    <rect x="696" y="500" width="456" height="104" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="716" y="536" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E7490">SPECIAL CASES</text>
    <text x="716" y="568" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">Ordinary Langevin dynamics and the plain</text>
    <text x="716" y="594" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">autoencoder both fall out of it.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">4 / 10</text>
</svg>
