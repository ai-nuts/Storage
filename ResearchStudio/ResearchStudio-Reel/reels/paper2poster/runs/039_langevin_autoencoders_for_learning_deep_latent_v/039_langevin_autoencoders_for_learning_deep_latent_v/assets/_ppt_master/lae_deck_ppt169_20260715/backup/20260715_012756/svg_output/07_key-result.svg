<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p07-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">Key Result: it captures the true posterior</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">07 · KEY RESULT</text>
  </g>

  <!-- Figure 3 hero -->
  <g id="p07-figure">
    <rect x="150" y="130" width="980" height="286" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <image href="../images/fig3_toy.png" x="164" y="150" width="952" height="248" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="640" y="436" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" fill="#64748B">Fig. 3 — Only ALD (right) reproduces the multimodal ground-truth posterior; mean-field and full VI collapse it.</text>

  <!-- Result cards -->
  <g id="cue_s07_c1_toy_problems_amortized_langevin_dyna" data-cue-label="cue_s07_c1_toy_problems_amortized_langevin_dyna">
    <title>On toy problems ALD reproduces multimodal correlated posteriors that VI misses</title>
    <desc>toy problems amortized langevin dynamics reproduces multimodal correlated posteriors variational inference misses</desc>
    <rect x="96" y="456" width="352" height="176" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="96" y="456" width="352" height="6" rx="3" fill="#0E7490"/>
    <text x="120" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#0E7490">TOY PROBLEMS</text>
    <text x="120" y="524" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#0F172A">Faithful posteriors</text>
    <text x="120" y="558" font-family="Arial, sans-serif" font-size="18" fill="#334155">ALD reproduces multimodal,</text>
    <text x="120" y="582" font-family="Arial, sans-serif" font-size="18" fill="#334155">correlated shapes that mean-</text>
    <text x="120" y="606" font-family="Arial, sans-serif" font-size="18" fill="#334155">field and full VI miss.</text>
  </g>

  <g id="cue_s07_c2_images_langevin_autoencoder_achieves" data-cue-label="cue_s07_c2_images_langevin_autoencoder_achieves">
    <title>On images the Langevin autoencoder achieves the lowest negative ELBO on all four datasets</title>
    <desc>images langevin autoencoder achieves lowest negative elbo all four datasets beats vae flow baseline</desc>
    <rect x="464" y="456" width="352" height="176" rx="10" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="464" y="456" width="352" height="6" rx="3" fill="#1E3A8A"/>
    <text x="488" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#1E3A8A">IMAGE DATASETS</text>
    <text x="488" y="524" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#0F172A">Lowest ELBO on all 4</text>
    <text x="488" y="558" font-family="Arial, sans-serif" font-size="18" fill="#334155">LAE beats the VAE, its flow</text>
    <text x="488" y="582" font-family="Arial, sans-serif" font-size="18" fill="#334155">extension, and the encoder-</text>
    <text x="488" y="606" font-family="Arial, sans-serif" font-size="18" fill="#334155">initialized Langevin method.</text>
  </g>

  <g id="cue_s07_c3_lesson_more_accurate_posterior_sampl" data-cue-label="cue_s07_c3_lesson_more_accurate_posterior_sampl">
    <title>The lesson: more accurate posterior sampling yields better generative models</title>
    <desc>lesson more accurate posterior sampling yields better generative models</desc>
    <rect x="832" y="456" width="352" height="176" rx="10" fill="#1E3A8A"/>
    <text x="856" y="492" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#93C5FD">THE LESSON</text>
    <text x="856" y="530" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#FFFFFF">Better sampling &#8594;</text>
    <text x="856" y="560" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#FFFFFF">better models</text>
    <text x="856" y="596" font-family="Arial, sans-serif" font-size="18" fill="#DBEAFE">More accurate posteriors train</text>
    <text x="856" y="620" font-family="Arial, sans-serif" font-size="18" fill="#DBEAFE">better generative models.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">7 / 10</text>
