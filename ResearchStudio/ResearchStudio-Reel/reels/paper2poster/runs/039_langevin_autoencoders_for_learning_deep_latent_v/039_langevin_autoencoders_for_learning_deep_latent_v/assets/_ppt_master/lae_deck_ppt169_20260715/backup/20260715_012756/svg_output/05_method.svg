<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p05-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">Method: move the noise into the encoder</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">05 · METHOD</text>
  </g>

  <!-- Figure 1 hero band -->
  <g id="p05-figure">
    <rect x="140" y="132" width="1000" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <image href="../images/fig1_comparison.png" x="150" y="140" width="980" height="236" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="640" y="404" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" fill="#64748B">Fig. 1 — From (a) variational inference and (b, c) per-point Langevin to (d) ALD, which updates the encoder itself.</text>

  <!-- Four method-step cards -->
  <g id="cue_s05_c1_key_idea_move_randomness_latent" data-cue-label="cue_s05_c1_key_idea_move_randomness_latent">
    <title>Key idea: move randomness from latent space to encoder parameters</title>
    <desc>key idea move randomness from latent space to encoder parameters</desc>
    <rect x="96" y="424" width="260" height="208" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="96" y="424" width="260" height="6" rx="3" fill="#1E3A8A"/>
    <text x="116" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#1E3A8A">KEY IDEA</text>
    <text x="116" y="492" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">Randomness moves</text>
    <text x="116" y="516" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">to the encoder</text>
    <text x="116" y="552" font-family="Arial, sans-serif" font-size="16" fill="#334155">Instead of noising each</text>
    <text x="116" y="574" font-family="Arial, sans-serif" font-size="16" fill="#334155">latent, run Langevin on the</text>
    <text x="116" y="596" font-family="Arial, sans-serif" font-size="16" fill="#334155">encoder&#8217;s parameters.</text>
  </g>

  <g id="cue_s05_c2_deterministic_encoder_maps_observati" data-cue-label="cue_s05_c2_deterministic_encoder_maps_observati">
    <title>A deterministic encoder maps observations to latents; its outputs become posterior samples</title>
    <desc>deterministic encoder maps observations latents langevin dynamics runs parameters outputs become posterior samples</desc>
    <rect x="372" y="424" width="260" height="208" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="372" y="424" width="260" height="6" rx="3" fill="#0E7490"/>
    <text x="392" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#0E7490">ENCODER AS SAMPLER</text>
    <text x="392" y="492" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">Outputs are the</text>
    <text x="392" y="516" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">samples</text>
    <text x="392" y="552" font-family="Arial, sans-serif" font-size="16" fill="#334155">The encoder maps x &#8594; z;</text>
    <text x="392" y="574" font-family="Arial, sans-serif" font-size="16" fill="#334155">updating its parameters</text>
    <text x="392" y="596" font-family="Arial, sans-serif" font-size="16" fill="#334155">moves the latents.</text>
  </g>

  <g id="cue_s05_c3_convergence_guaranteed_when_fixed_fe" data-cue-label="cue_s05_c3_convergence_guaranteed_when_fixed_fe">
    <title>Convergence guaranteed when a fixed feature extractor feeds a linear layer wider than the batch</title>
    <desc>convergence guaranteed when fixed feature extractor feeds trainable linear layer exceeding batch size true posterior</desc>
    <rect x="648" y="424" width="260" height="208" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="648" y="424" width="260" height="6" rx="3" fill="#1E3A8A"/>
    <text x="668" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#1E3A8A">THEOREM</text>
    <text x="668" y="492" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">Provable</text>
    <text x="668" y="516" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">convergence</text>
    <text x="668" y="552" font-family="Arial, sans-serif" font-size="16" fill="#334155">A fixed feature extractor +</text>
    <text x="668" y="574" font-family="Arial, sans-serif" font-size="16" fill="#334155">a trainable linear layer</text>
    <text x="668" y="596" font-family="Arial, sans-serif" font-size="16" fill="#334155">wider than the batch.</text>
  </g>

  <g id="cue_s05_c4_autoencoder_runs_few_steps_before" data-cue-label="cue_s05_c4_autoencoder_runs_few_steps_before">
    <title>The autoencoder runs a few steps before each decoder update, with optional Metropolis-Hastings</title>
    <desc>autoencoder runs few steps before each decoder update optional metropolis-hastings correction</desc>
    <rect x="924" y="424" width="260" height="208" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="924" y="424" width="260" height="6" rx="3" fill="#0E7490"/>
    <text x="944" y="460" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#0E7490">IN PRACTICE</text>
    <text x="944" y="492" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">A tiny tweak to</text>
    <text x="944" y="516" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#0F172A">the AE loop</text>
    <text x="944" y="552" font-family="Arial, sans-serif" font-size="16" fill="#334155">A few update steps before</text>
    <text x="944" y="574" font-family="Arial, sans-serif" font-size="16" fill="#334155">each decoder step, with</text>
    <text x="944" y="596" font-family="Arial, sans-serif" font-size="16" fill="#334155">optional M-H correction.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">5 / 10</text>
</svg>
