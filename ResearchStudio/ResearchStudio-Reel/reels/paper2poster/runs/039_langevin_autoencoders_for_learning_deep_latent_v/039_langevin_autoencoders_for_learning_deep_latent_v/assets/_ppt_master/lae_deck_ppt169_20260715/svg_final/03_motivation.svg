<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p03-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">Motivation: efficiency vs. flexibility</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">03 · MOTIVATION</text>
  </g>

  <!-- LEFT: Variational Inference -->
  <rect x="96" y="150" width="520" height="356" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="128" y="192" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#1E3A8A">VARIATIONAL INFERENCE (VAE)</text>

  <g id="cue_s03_c1_variational_inference_dominates_than" data-cue-label="cue_s03_c1_variational_inference_dominates_than">
    <title>VI dominates thanks to amortization: a shared encoder predicts latents for all data</title>
    <desc>variational inference dominates thanks amortization shared encoder predicts latents all data variational autoencoder</desc>
    <rect x="120" y="210" width="472" height="130" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="140" y="244" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22" font-weight="bold" fill="#0F172A">Amortization = efficiency</text>
    <text x="140" y="278" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">One shared encoder predicts the latents</text>
    <text x="140" y="304" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">for all data points at once, instead of</text>
    <text x="140" y="330" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">per-point optimization.</text>
  </g>

  <g id="cue_s03_c2_but_relies_tractable_gaussians_limit" data-cue-label="cue_s03_c2_but_relies_tractable_gaussians_limit">
    <title>But VI relies on tractable Gaussians, limiting accuracy</title>
    <desc>but relies tractable gaussians limiting accuracy approximation power</desc>
    <rect x="120" y="352" width="472" height="132" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="140" y="386" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22" font-weight="bold" fill="#B91C1C">But: limited flexibility</text>
    <text x="140" y="420" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">VI relies on tractable distributions like</text>
    <text x="140" y="446" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">Gaussians, so its approximation power is</text>
    <text x="140" y="472" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">fundamentally capped.</text>
  </g>

  <!-- RIGHT: MCMC -->
  <rect x="664" y="150" width="520" height="356" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="696" y="192" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E7490">MCMC / LANGEVIN</text>

  <g id="cue_s03_c3_mcmc_such_limit_yet_nobody" data-cue-label="cue_s03_c3_mcmc_such_limit_yet_nobody">
    <title>MCMC has no such limit, yet nobody truly amortized it; hybrids only warm-started chains</title>
    <desc>mcmc such limit yet nobody truly amortized earlier hybrids only warm-started per-datapoint chains</desc>
    <rect x="688" y="210" width="472" height="274" rx="8" fill="#ECFEFF" stroke="#67E8F9" stroke-width="1.5"/>
    <text x="708" y="248" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="22" font-weight="bold" fill="#0E7490">Flexible, but never amortized</text>
    <text x="708" y="288" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">MCMC has no tractability limit: it can</text>
    <text x="708" y="314" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">capture any posterior shape.</text>
    <text x="708" y="356" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">Yet no one had truly amortized it. Earlier</text>
    <text x="708" y="382" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">hybrids only used an encoder to warm-start</text>
    <text x="708" y="408" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" fill="#334155">sampling, still running one chain per point.</text>
    <text x="708" y="456" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" font-style="italic" fill="#0E7490">Flexibility without amortization&#8217;s speed.</text>
  </g>

  <!-- Goal banner -->
  <g id="cue_s03_c4_goal_amortized_efficiency_mcmc_flexi" data-cue-label="cue_s03_c4_goal_amortized_efficiency_mcmc_flexi">
    <title>The goal: amortized efficiency with MCMC flexibility</title>
    <desc>goal amortized efficiency mcmc flexibility bring together</desc>
    <rect x="96" y="528" width="1088" height="104" rx="12" fill="#1E3A8A"/>
    <text x="128" y="574" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#93C5FD">THE GOAL</text>
    <text x="128" y="608" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="27" font-weight="bold" fill="#FFFFFF">Amortization&#8217;s efficiency  +  MCMC&#8217;s flexibility.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">3 / 10</text>
</svg>
