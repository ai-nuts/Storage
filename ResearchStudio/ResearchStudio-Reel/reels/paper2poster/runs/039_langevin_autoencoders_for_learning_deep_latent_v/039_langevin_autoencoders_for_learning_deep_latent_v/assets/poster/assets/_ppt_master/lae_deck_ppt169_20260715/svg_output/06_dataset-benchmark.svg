<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p06-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">How it is evaluated</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">06 · BENCHMARK</text>
  </g>

  <!-- Two-stage header -->
  <g id="cue_s06_c1_validation_comes_two_stages" data-cue-label="cue_s06_c1_validation_comes_two_stages">
    <title>Validation comes in two stages</title>
    <desc>validation comes two stages</desc>
    <rect x="96" y="150" width="330" height="52" rx="26" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="126" y="184" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E3A8A">Validation in two stages</text>
  </g>

  <!-- Stage 1: toy -->
  <g id="cue_s06_c2_first_toy_problems_known_answers" data-cue-label="cue_s06_c2_first_toy_problems_known_answers">
    <title>Stage 1: toy problems with known answers, a bivariate-Gaussian posterior and a random-network posterior</title>
    <desc>first toy problems known answers conjugate bivariate gaussian posterior harder posterior random network</desc>
    <rect x="96" y="228" width="544" height="404" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="96" y="228" width="544" height="8" rx="4" fill="#0E7490"/>
    <text x="128" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E7490">STAGE 1 · SANITY CHECK</text>
    <text x="128" y="316" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#0F172A">Toy problems, known answers</text>
    <rect x="128" y="344" width="480" height="118" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="148" y="380" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#0F172A">Conjugate bivariate Gaussian</text>
    <text x="148" y="410" font-family="Arial, sans-serif" font-size="20" fill="#334155">A posterior with a known</text>
    <text x="148" y="436" font-family="Arial, sans-serif" font-size="20" fill="#334155">closed-form solution.</text>
    <rect x="128" y="478" width="480" height="128" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="148" y="514" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#0F172A">Random-network posterior</text>
    <text x="148" y="544" font-family="Arial, sans-serif" font-size="20" fill="#334155">A harder, multimodal posterior</text>
    <text x="148" y="570" font-family="Arial, sans-serif" font-size="20" fill="#334155">defined by a randomly</text>
    <text x="148" y="596" font-family="Arial, sans-serif" font-size="20" fill="#334155">initialized neural network.</text>
  </g>

  <!-- Stage 2: images -->
  <g id="cue_s06_c3_image_generation_mnist_s_v_h_n_cifar" data-cue-label="cue_s06_c3_image_generation_mnist_s_v_h_n_cifar">
    <title>Stage 2: image generation on MNIST, SVHN, CIFAR-10, CelebA, negative ELBO per dimension over three seeds</title>
    <desc>image generation mnist svhn cifar-10 celeba shared architectures quality negative elbo per dimension three seeds</desc>
    <rect x="664" y="228" width="520" height="404" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="664" y="228" width="520" height="8" rx="4" fill="#1E3A8A"/>
    <text x="696" y="280" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#1E3A8A">STAGE 2 · REAL IMAGES</text>
    <text x="696" y="316" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#0F172A">Four standard datasets</text>
    <g font-family="Arial, sans-serif" font-size="21" font-weight="bold">
      <rect x="696" y="344" width="222" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="807" y="379" text-anchor="middle" fill="#1E3A8A">MNIST</text>
      <rect x="930" y="344" width="222" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="1041" y="379" text-anchor="middle" fill="#1E3A8A">SVHN</text>
      <rect x="696" y="412" width="222" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="807" y="447" text-anchor="middle" fill="#1E3A8A">CIFAR-10</text>
      <rect x="930" y="412" width="222" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="1041" y="447" text-anchor="middle" fill="#1E3A8A">CelebA</text>
    </g>
    <rect x="696" y="490" width="456" height="116" rx="8" fill="#0E7490"/>
    <text x="716" y="522" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#A5F3FC">METRIC</text>
    <text x="716" y="552" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF">Negative ELBO per dimension (lower is</text>
    <text x="716" y="578" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF">better), over 3 seeds, shared architectures.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">6 / 10</text>
</svg>
