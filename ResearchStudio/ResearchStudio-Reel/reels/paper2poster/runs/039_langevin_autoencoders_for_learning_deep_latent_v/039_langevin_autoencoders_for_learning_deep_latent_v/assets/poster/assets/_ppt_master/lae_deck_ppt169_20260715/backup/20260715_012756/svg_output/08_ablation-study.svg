<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p08-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">Ablations: what actually matters</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">08 · ABLATION</text>
  </g>

  <!-- Two ablations chip -->
  <g id="cue_s08_c1_two_ablations" data-cue-label="cue_s08_c1_two_ablations">
    <title>Two ablations</title>
    <desc>two ablations probe what matters</desc>
    <rect x="96" y="146" width="270" height="50" rx="25" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="126" y="179" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1E3A8A">Two ablations</text>
  </g>

  <!-- Figure 2 hero -->
  <g id="p08-figure">
    <rect x="390" y="210" width="794" height="204" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <image href="../images/fig2_capacity.png" x="402" y="224" width="770" height="150" preserveAspectRatio="xMidYMid meet"/>
    <text x="787" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Fig. 2 — When d &#8805; n the samples match ground truth; at d &lt; n some points collapse.</text>
  </g>

  <!-- Card c2: encoder capacity -->
  <g id="cue_s08_c2_encoder_capacity_confirms_theory_whe" data-cue-label="cue_s08_c2_encoder_capacity_confirms_theory_whe">
    <title>Encoder capacity confirms the theory: linear layer at least the batch size matches the posterior; smaller collapses</title>
    <desc>encoder capacity confirms theory when final linear layer at least batch size samples match true posterior smaller collapse</desc>
    <rect x="96" y="228" width="270" height="404" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="96" y="228" width="270" height="8" rx="4" fill="#1E3A8A"/>
    <text x="120" y="272" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#1E3A8A">ENCODER CAPACITY</text>
    <text x="120" y="306" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#0F172A">Theory,</text>
    <text x="120" y="332" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#0F172A">confirmed</text>
    <text x="120" y="374" font-family="Arial, sans-serif" font-size="18" fill="#334155">When the last linear</text>
    <text x="120" y="398" font-family="Arial, sans-serif" font-size="18" fill="#334155">layer&#8217;s width d is at</text>
    <text x="120" y="422" font-family="Arial, sans-serif" font-size="18" fill="#334155">least the batch size n,</text>
    <text x="120" y="446" font-family="Arial, sans-serif" font-size="18" fill="#334155">samples match the true</text>
    <text x="120" y="470" font-family="Arial, sans-serif" font-size="18" fill="#334155">posterior.</text>
    <rect x="120" y="500" width="222" height="106" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="140" y="534" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#B91C1C">If d &lt; n:</text>
    <text x="140" y="562" font-family="Arial, sans-serif" font-size="18" fill="#334155">samples for some data</text>
    <text x="140" y="586" font-family="Arial, sans-serif" font-size="18" fill="#334155">points collapse.</text>
  </g>

  <!-- Card c3: MH + iterations -->
  <g id="cue_s08_c3_images_metropolis_hastings_step_stab" data-cue-label="cue_s08_c3_images_metropolis_hastings_step_stab">
    <title>On images the Metropolis-Hastings step stabilizes training; iteration count barely matters beyond two</title>
    <desc>images metropolis-hastings step stabilizes training while iteration count barely matters beyond two experiments use two</desc>
    <rect x="390" y="440" width="794" height="192" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="390" y="440" width="794" height="8" rx="4" fill="#0E7490"/>
    <text x="414" y="484" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="1" fill="#0E7490">ON IMAGE DATASETS</text>
    <rect x="414" y="502" width="366" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="434" y="536" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0F172A">M&#8211;H step is important</text>
    <text x="434" y="566" font-family="Arial, sans-serif" font-size="18" fill="#334155">The Metropolis&#8211;Hastings rejection</text>
    <text x="434" y="590" font-family="Arial, sans-serif" font-size="18" fill="#334155">step stabilizes training.</text>
    <rect x="794" y="502" width="366" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="814" y="536" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#0F172A">Iterations barely matter</text>
    <text x="814" y="566" font-family="Arial, sans-serif" font-size="18" fill="#334155">As long as it is &#8805; 2 &#8212; so the</text>
    <text x="814" y="590" font-family="Arial, sans-serif" font-size="18" fill="#334155">experiments use just two steps.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">8 / 10</text>
</svg>
