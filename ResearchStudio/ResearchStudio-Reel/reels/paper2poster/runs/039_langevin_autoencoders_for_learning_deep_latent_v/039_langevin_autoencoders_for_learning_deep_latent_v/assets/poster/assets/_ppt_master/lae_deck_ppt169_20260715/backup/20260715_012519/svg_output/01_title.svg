<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover">
  <defs>
    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="16" height="720" fill="#1E3A8A"/>
  <rect x="820" y="0" width="460" height="720" fill="#F1F5F9"/>

  <!-- Eyebrow / venue -->
  <g id="p01-eyebrow">
    <rect x="96" y="80" width="22" height="22" fill="#B91C1C"/>
    <text x="130" y="98" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="20" font-weight="bold" letter-spacing="2" fill="#B91C1C">NeurIPS 2022</text>
  </g>

  <!-- Title + venue anchor -->
  <g id="cue_s01_c1_university_tokyo_neurips_2022_langev" data-cue-label="cue_s01_c1_university_tokyo_neurips_2022_langev">
    <title>University of Tokyo, NeurIPS 2022, Langevin autoencoder</title>
    <desc>university tokyo neurips 2022 langevin autoencoder title</desc>
    <text x="96" y="185" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="46" font-weight="bold" fill="#1E3A8A">Langevin Autoencoders</text>
    <text x="96" y="243" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="46" font-weight="bold" fill="#1E3A8A">for Learning Deep Latent</text>
    <text x="96" y="301" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="46" font-weight="bold" fill="#1E3A8A">Variable Models</text>
    <rect x="96" y="328" width="150" height="5" rx="2.5" fill="url(#accentRule)"/>
  </g>

  <!-- Problem one-liner anchor -->
  <g id="cue_s01_c2_langevin_dynamics_samples_intractabl" data-cue-label="cue_s01_c2_langevin_dynamics_samples_intractabl">
    <title>Langevin dynamics samples intractable posteriors but is slow</title>
    <desc>langevin dynamics samples intractable posteriors deep latent models but slow fresh chain</desc>
    <text x="96" y="378" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" fill="#475569">Langevin dynamics samples the intractable posteriors of deep latent</text>
    <text x="96" y="408" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" fill="#475569">models accurately, but is slow: a fresh chain for every data point.</text>
  </g>

  <!-- Contribution badge anchor -->
  <g id="cue_s01_c3_authors_amortize_shared_encoder_prov" data-cue-label="cue_s01_c3_authors_amortize_shared_encoder_prov">
    <title>Amortize into a shared encoder, provably valid MCMC, beats VAEs</title>
    <desc>authors amortize shared encoder prove valid mcmc beat variational autoencoders</desc>
    <rect x="96" y="440" width="672" height="96" rx="10" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="96" y="440" width="8" height="96" rx="4" fill="#0E7490"/>
    <text x="126" y="482" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0F172A">Idea: amortize sampling into a shared encoder network.</text>
    <text x="126" y="512" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#475569">A provably valid MCMC method that beats variational autoencoders.</text>
  </g>

  <!-- Authors -->
  <g id="p01-authors">
    <text x="96" y="600" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#0F172A">Shohei Taniguchi · Yusuke Iwasawa · Wataru Kumagai · Yutaka Matsuo</text>
    <text x="96" y="628" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="19" fill="#475569">The University of Tokyo</text>
  </g>

  <!-- Right utility cluster: logo + QR -->
  <g id="p01-utility">
    <image href="../images/logo_utokyo.png" x="900" y="96" width="300" height="72" preserveAspectRatio="xMidYMid meet"/>
    <g>
      <rect x="900" y="360" width="130" height="158" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <image href="../images/qr_paper.png" x="915" y="374" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
      <text x="965" y="502" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#475569">Paper</text>
    </g>
    <g>
      <rect x="1058" y="360" width="130" height="158" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <image href="../images/qr_code.png" x="1073" y="374" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
      <text x="1123" y="502" text-anchor="middle" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#475569">Code</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="96" y="690" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">arXiv:2209.07036 · github.com/iShohei220/LAE</text>
</svg>
