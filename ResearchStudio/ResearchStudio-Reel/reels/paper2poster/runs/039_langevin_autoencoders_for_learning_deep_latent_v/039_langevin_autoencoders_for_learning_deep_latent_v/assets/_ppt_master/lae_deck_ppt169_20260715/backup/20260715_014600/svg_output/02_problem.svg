<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <!-- Title band -->
  <g id="p02-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">The Problem: an intractable posterior</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">02 · PROBLEM</text>
  </g>

  <!-- Card 1: intractable expectation -->
  <g id="cue_s02_c1_deep_latent_variable_models_maximum" data-cue-label="cue_s02_c1_deep_latent_variable_models_maximum">
    <title>Maximum-likelihood training needs an intractable posterior expectation</title>
    <desc>deep latent variable models maximum likelihood needs expectation over hidden variables posterior intractable</desc>
    <rect x="96" y="160" width="544" height="470" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="96" y="160" width="544" height="8" rx="4" fill="#1E3A8A"/>
    <text x="128" y="212" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#1E3A8A">MAXIMUM-LIKELIHOOD TRAINING</text>
    <text x="128" y="256" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26" font-weight="bold" fill="#0F172A">The gradient is an expectation</text>
    <text x="128" y="286" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26" font-weight="bold" fill="#0F172A">over the latent posterior.</text>

    <rect x="128" y="322" width="480" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="368" y="360" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="19" fill="#1E3A8A">&#8711;&#952; log p(x) =</text>
    <text x="368" y="388" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="18" fill="#1E3A8A">E&#8202;p(z|x)&#8202;[ &#8711;&#952; log p(x,z) ]</text>

    <text x="128" y="452" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">Deep latent variable models explain data</text>
    <text x="128" y="482" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">through hidden variables z. Learning by</text>
    <text x="128" y="512" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">maximum likelihood requires averaging over</text>
    <text x="128" y="542" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">the posterior p(z | x).</text>
    <text x="128" y="596" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#B91C1C">That posterior is intractable.</text>
  </g>

  <!-- Card 2: Langevin is slow -->
  <g id="cue_s02_c2_langevin_dynamics_samples_posterior" data-cue-label="cue_s02_c2_langevin_dynamics_samples_posterior">
    <title>Langevin dynamics is accurate but slow: a fresh chain per data point</title>
    <desc>langevin dynamics samples posterior accurately but runs fresh chain iterations per data point converges slowly rarely practical</desc>
    <rect x="664" y="160" width="520" height="470" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="664" y="160" width="520" height="8" rx="4" fill="#0E7490"/>
    <text x="696" y="212" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E7490">MCMC / LANGEVIN DYNAMICS</text>
    <text x="696" y="256" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26" font-weight="bold" fill="#0F172A">Accurate sampling,</text>
    <text x="696" y="286" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="26" font-weight="bold" fill="#0F172A">but painfully slow.</text>

    <!-- per-datapoint chains motif -->
    <g>
      <rect x="696" y="322" width="456" height="120" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="716" y="352" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#64748B">One separate chain per data point:</text>
      <circle cx="740" cy="392" r="10" fill="#0E7490"/><text x="740" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF">x&#8321;</text>
      <line x1="756" y1="392" x2="800" y2="392" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="814" cy="392" r="10" fill="#94A3B8"/>
      <line x1="828" y1="392" x2="872" y2="392" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
      <circle cx="886" cy="392" r="10" fill="#94A3B8"/>
      <text x="930" y="397" font-family="Arial, sans-serif" font-size="15" fill="#64748B">… × n points</text>
    </g>

    <text x="696" y="482" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">Traditional Langevin dynamics runs a fresh</text>
    <text x="696" y="512" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">chain of iterations for every single data</text>
    <text x="696" y="542" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="21" fill="#334155">point, and converges slowly.</text>
    <text x="696" y="596" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#B91C1C">Rarely practical for deep models.</text>
  </g>

  <!-- Footer -->
  <text x="96" y="694" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022</text>
  <text x="1184" y="694" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">2 / 10</text>
</svg>
