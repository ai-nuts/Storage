<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="closing">
  <defs>
    <linearGradient id="closeRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="16" height="720" fill="#1E3A8A"/>

  <!-- Title band -->
  <g id="p10-title">
    <text x="96" y="96" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="36" font-weight="bold" fill="#1E3A8A">Takeaway</text>
    <rect x="96" y="116" width="120" height="5" rx="2.5" fill="url(#closeRule)"/>
    <text x="1184" y="90" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">10 · TAKEAWAY</text>
  </g>

  <!-- c1: efficient + flexible -->
  <g id="cue_s10_c1_takeaway_elegant_move_langevin_noise" data-cue-label="cue_s10_c1_takeaway_elegant_move_langevin_noise">
    <title>Move Langevin noise from the latents to the encoder parameters: sampling becomes efficient and flexible</title>
    <desc>takeaway elegant move langevin noise latents encoder parameters sampling both efficient amortized flexible genuine mcmc</desc>
    <text x="96" y="188" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0F172A">Move the Langevin noise from the latents to the encoder&#8217;s parameters &#8212;</text>
    <text x="96" y="224" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#0F172A">and posterior sampling becomes both efficient and flexible.</text>

    <rect x="96" y="260" width="544" height="150" rx="12" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="128" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#1E3A8A">EFFICIENT</text>
    <text x="128" y="338" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#0F172A">Amortized across all data</text>
    <text x="128" y="374" font-family="Arial, sans-serif" font-size="20" fill="#334155">One shared encoder replaces</text>
    <text x="128" y="398" font-family="Arial, sans-serif" font-size="20" fill="#334155">per-datapoint sampling chains.</text>

    <rect x="664" y="260" width="520" height="150" rx="12" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.5"/>
    <text x="696" y="300" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E7490">FLEXIBLE</text>
    <text x="696" y="338" font-family="Georgia, serif" font-size="23" font-weight="bold" fill="#0F172A">Genuine MCMC</text>
    <text x="696" y="374" font-family="Arial, sans-serif" font-size="20" fill="#334155">Not a constrained Gaussian &#8212; it</text>
    <text x="696" y="398" font-family="Arial, sans-serif" font-size="20" fill="#334155">can capture any posterior shape.</text>
  </g>

  <!-- c2: provably valid, beats VAE -->
  <g id="cue_s10_c2_provably_valid_looks_almost_like" data-cue-label="cue_s10_c2_provably_valid_looks_almost_like">
    <title>Provably valid MCMC, looks almost like a standard autoencoder, yet consistently beats VAEs on test likelihood</title>
    <desc>provably valid looks almost like standard autoencoder yet consistently beats variational autoencoders test likelihood</desc>
    <rect x="96" y="438" width="1088" height="150" rx="12" fill="#1E3A8A"/>
    <text x="128" y="480" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#93C5FD">THE RESULT</text>
    <text x="128" y="520" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#FFFFFF">Provably valid as MCMC. Almost identical to a standard autoencoder in code.</text>
    <text x="128" y="558" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#A5F3FC">Yet it consistently beats variational autoencoders on test likelihood.</text>
  </g>

  <text x="96" y="636" font-family="Arial, sans-serif" font-size="20" font-style="italic" fill="#475569">In effect: the ordinary autoencoder, reframed as bias-corrected, sampling-based inference.</text>

  <!-- Footer -->
  <text x="96" y="690" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Langevin Autoencoders · NeurIPS 2022 · arXiv:2209.07036</text>
  <text x="1184" y="690" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="15" fill="#94A3B8">10 / 10</text>
</svg>
