  <!-- Title band -->
  <g id="p09-title">
    <text x="96" y="86" font-family="Georgia, &quot;Times New Roman&quot;, serif" font-size="34" font-weight="bold" fill="#1E3A8A">The numbers</text>
    <rect x="96" y="104" width="90" height="4" rx="2" fill="#B91C1C"/>
    <text x="1184" y="80" text-anchor="end" font-family="Arial, &quot;Helvetica Neue&quot;, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" fill="#94A3B8">09 · HEADLINE NUMBERS</text>
  </g>

  <!-- c1 chip -->
  <g id="cue_s09_c1_gains_consistent_but_modest" data-cue-label="cue_s09_c1_gains_consistent_but_modest">
    <title>The gains are consistent but modest</title>
    <desc>gains consistent but modest small absolute</desc>
    <rect x="96" y="140" width="410" height="50" rx="25" fill="#EFF6FF" stroke="#1E3A8A" stroke-width="1.5"/>
    <text x="126" y="173" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E3A8A">Consistent, but modest, gains</text>
  </g>

  <text x="96" y="228" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Negative ELBO per dimension &#8212; lower is better. LAE = Langevin autoencoder (ours).</text>

  <!-- Table -->
  <!-- header -->
  <g font-family="Arial, sans-serif">
    <rect x="96" y="244" width="640" height="46" fill="#1E3A8A"/>
    <text x="120" y="274" font-size="19" font-weight="bold" fill="#FFFFFF">Dataset</text>
    <text x="470" y="274" text-anchor="middle" font-size="19" font-weight="bold" fill="#BFDBFE">VAE</text>
    <text x="650" y="274" text-anchor="middle" font-size="19" font-weight="bold" fill="#FFFFFF">LAE (ours)</text>
  </g>

  <!-- MNIST row (c2) -->
  <g id="cue_s09_c2_mnist_negative_elbo_drops_one" data-cue-label="cue_s09_c2_mnist_negative_elbo_drops_one">
    <title>On MNIST negative ELBO drops to 1.177 versus 1.189 for the VAE</title>
    <desc>mnist negative elbo drops one point one seven seven per dimension versus one point one eight nine vae</desc>
    <rect x="96" y="290" width="640" height="60" fill="#FEF9C3" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="560" y="290" width="176" height="60" fill="#DBEAFE"/>
    <text x="120" y="327" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">MNIST</text>
    <text x="470" y="327" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#475569">1.189</text>
    <text x="650" y="327" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#1E3A8A">1.177</text>
  </g>

  <!-- other datasets (c3) -->
  <g id="cue_s09_c3_cifar_10_celeba_s_v_h_n_show_similar" data-cue-label="cue_s09_c3_cifar_10_celeba_s_v_h_n_show_similar">
    <title>CIFAR-10, CelebA and SVHN show similar small improvements</title>
    <desc>cifar-10 celeba s-v-h-n show similar small improvements lower elbo</desc>
    <g font-family="Arial, sans-serif">
      <rect x="96" y="350" width="640" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="560" y="350" width="176" height="58" fill="#EFF6FF"/>
