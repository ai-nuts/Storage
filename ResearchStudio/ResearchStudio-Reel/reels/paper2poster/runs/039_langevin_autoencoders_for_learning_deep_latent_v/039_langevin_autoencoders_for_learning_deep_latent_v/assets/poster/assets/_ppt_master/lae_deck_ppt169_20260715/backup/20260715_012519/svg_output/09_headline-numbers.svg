  <!-- Cost banner (c4) -->
  <g id="cue_s09_c4_cost_about_two_and_a_quarter_times_s" data-cue-label="cue_s09_c4_cost_about_two_and_a_quarter_times_s">
    <title>The cost: about 2.25x slower than a VAE, same speed as the encoder-initialized Langevin baseline</title>
    <desc>cost about two and a quarter times slower than vae same speed encoder-initialized langevin baseline training time</desc>
    <rect x="96" y="546" width="1088" height="96" rx="12" fill="#0F172A"/>
    <text x="128" y="586" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#94A3B8">THE COST</text>
    <text x="128" y="620" font-family="Arial, sans-serif" font-size="22" fill="#E2E8F0">Training is about </text>
    <text x="330" y="620" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FCA5A5">2.25&#215; slower</text>
    <text x="530" y="620" font-family="Arial, sans-serif" font-size="22" fill="#E2E8F0">than a VAE &#8212; but as fast as the encoder-initialized Langevin baseline.</text>
  </g>

