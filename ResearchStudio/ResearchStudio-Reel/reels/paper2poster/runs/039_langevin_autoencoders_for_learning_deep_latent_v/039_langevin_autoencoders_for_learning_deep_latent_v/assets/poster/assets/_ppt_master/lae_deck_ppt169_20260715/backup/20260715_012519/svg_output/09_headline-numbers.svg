      <text x="470" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#475569">4.82</text>
      <text x="650" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#1E3A8A">4.77</text>

      <rect x="96" y="408" width="640" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="560" y="408" width="176" height="58" fill="#EFF6FF"/>
      <text x="120" y="444" font-size="20" font-weight="bold" fill="#0F172A">CelebA</text>
      <text x="470" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#475569">4.67</text>
      <text x="650" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#1E3A8A">4.64</text>

      <rect x="96" y="466" width="640" height="58" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <rect x="560" y="466" width="176" height="58" fill="#EFF6FF"/>
      <text x="120" y="502" font-size="20" font-weight="bold" fill="#0F172A">SVHN</text>
      <text x="470" y="502" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#475569">4.44</text>
      <text x="650" y="502" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#1E3A8A">4.41</text>
    </g>
  </g>

  <!-- Right: samples -->
  <g id="p09-samples">
    <rect x="772" y="230" width="412" height="294" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
