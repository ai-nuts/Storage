<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Why look past value-based RL?</text><g id="cue_s03_c1_value_based_methods_dominate_offline"><title>value-based methods dominate offline off-policy they come appealing theoretical guarantees</title><rect x="64" y="158" width="564" height="168" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="168" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Value-based methods dominate</text><text x="92" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">They rule offline and off-policy RL and come with</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">appealing theoretical guarantees on optimality and</text><text x="92" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">convergence.</text><rect x="92" y="286" width="508" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="301.0" r="5" fill="#4C9BE8"/><text x="126" y="306.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Strong theory  ·  well-studied</text></g><g id="cue_s03_c2_but_practice_they_difficult_apply"><title>but practice they difficult apply they require complex tricks stabilize</title><rect x="652" y="158" width="564" height="168" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="652" y="158" width="6" height="168" rx="6" fill="#F2685C"/><text x="680" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">But hard to apply in practice</text><text x="680" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">They need complex tricks to stabilize learning and</text><text x="680" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">careful tuning of many interacting hyperparameters.</text><rect x="680" y="286" width="508" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="698" cy="301.0" r="5" fill="#F2685C"/><text x="714" y="306.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Fragile training  ·  many knobs</text></g><g id="cue_s03_c3_attractive_alternative_convert_reinf"><title>attractive alternative convert reinforcement learning problem conditional filtered weighted imitation</title><rect x="64" y="346" width="1152" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="346" width="6" height="120" rx="6" fill="#34D3C0"/><text x="92" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">An attractive alternative: turn RL into conditional imitation</text><text x="92" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Convert the RL problem into a conditional, filtered, or weighted imitation-learning problem — using the</text><text x="92" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">insight that experience suboptimal for one task may be optimal for another.</text></g><g id="cue_s03_c4_minimal_supervised_recipe_match_thes"><title>minimal supervised recipe match these complex value-based methods would give</title><rect x="64" y="486" width="1152" height="120" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="486" width="6" height="120" rx="6" fill="#34D3C0"/><text x="92" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">Why it is worth doing</text><text x="92" y="554" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">If a minimal supervised recipe can match these complex value-based methods, it gives practitioners a</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">dependable field guide — and reveals exactly where supervised methods still break down.</text></g><text x="64" y="652" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="600" text-anchor="start">Simplicity that matches the state of the art is itself a finding.</text></svg>