<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Three contributions</text><g id="cue_s04_c1_makes_three_contributions"><title>makes three contributions</title><rect x="64" y="158" width="1152" height="66" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="66" rx="6" fill="#4C9BE8"/><text x="92" y="199" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">Not a new algorithm — a unifying framework, a minimal recipe, and an honest map of what matters.</text></g><g id="cue_s04_c2_first_does_not_propose_brand_new"><title>first does not propose brand-new algorithm instead places many existing</title><rect x="64" y="250" width="368" height="320" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="250" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="318" r="27" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">One unifying framework</text><text x="92" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Place many existing goal-conditioned and</text><text x="92" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reward-conditioned methods under a</text><text x="92" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">single view the authors call RvS:</text><text x="92" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reinforcement learning via supervised</text><text x="92" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">learning.</text></g><g id="cue_s04_c3_second_through_extensive_experiments"><title>second through extensive experiments boils these methods down their essential</title><rect x="456" y="250" width="368" height="320" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="250" width="368" height="6" rx="6" fill="#48C78E"/><circle cx="508" cy="318" r="27" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="508" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">2</text><text x="484" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A minimal recipe</text><text x="484" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Through extensive experiments, boil</text><text x="484" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">these methods down to essentials: a</text><text x="484" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">two-layer feedforward network trained to</text><text x="484" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">maximize likelihood is competitive with</text><text x="484" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">far more complex methods.</text></g><g id="cue_s04_c4_third_identifies_exactly_which_desig"><title>third identifies exactly which design choices matter namely capacity regularization</title><rect x="848" y="250" width="368" height="320" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="250" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="318" r="27" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">What matters, and the</text><text x="876" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">limits</text><text x="876" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Identify the choices that matter — model</text><text x="876" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">capacity, regularization, and what to</text><text x="876" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">condition on — and honestly show RvS is</text><text x="876" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">comparatively weak on purely random</text><text x="876" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">data.</text></g><text x="64" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="600" text-anchor="start">A field guide, not a new state-of-the-art claim.</text></svg>