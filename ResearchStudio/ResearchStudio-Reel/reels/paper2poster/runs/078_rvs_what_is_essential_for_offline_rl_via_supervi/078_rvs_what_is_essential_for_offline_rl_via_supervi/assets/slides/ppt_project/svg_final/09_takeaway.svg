<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A practitioner's field guide</text><g id="cue_s09_c1_takeaway_essentially_practitioner_fi"><title>takeaway essentially practitioner field guide you not need advantage weighting</title><rect x="64" y="158" width="1152" height="72" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="72" rx="6" fill="#48C78E"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">You do not need advantage weighting or a Transformer</text><text x="92" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="500" text-anchor="start">Plain supervised learning, done right, is competitive with the state of the art for offline RL.</text></g><g id="cue_s09_c2_plain_two_layer_feedforward_network"><title>plain two-layer feedforward network trained simply maximize likelihood competitive state</title><rect x="64" y="246" width="564" height="168" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="246" width="6" height="168" rx="6" fill="#4C9BE8"/><text x="92" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Get two things right</text><rect x="92" y="302" width="508" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="321.0" r="5" fill="#4C9BE8"/><text x="126" y="326.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">Tune model capacity &amp; regularization</text><rect x="92" y="348" width="508" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="367.0" r="5" fill="#34D3C0"/><text x="126" y="372.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">Choose what to condition on: goals or rewards</text><text x="92" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">A two-layer MLP trained by max-likelihood does the rest.</text></g><g id="cue_s09_c3_concrete_recipe_grow_network_width"><title>concrete recipe grow network width until performance saturates add little</title><rect x="652" y="246" width="564" height="168" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="652" y="246" width="6" height="168" rx="6" fill="#34D3C0"/><text x="680" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The concrete recipe</text><circle cx="693" cy="309" r="13" fill="none" stroke="#34D3C0" stroke-width="1.8"/><text x="693" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="middle">1</text><text x="716" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Grow network width until performance saturates</text><circle cx="693" cy="355" r="13" fill="none" stroke="#34D3C0" stroke-width="1.8"/><text x="693" y="361" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="716" y="361" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Then add a little dropout</text><text x="680" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Simple, reproducible, and cheap to tune.</text></g><g id="cue_s09_c4_honest_caveat_purely_random_temporal"><title>honest caveat purely random temporal-difference methods still win which authors</title><rect x="64" y="434" width="1152" height="120" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="64" y="434" width="6" height="120" rx="6" fill="#F2685C"/><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F2685C" font-weight="800" text-anchor="start" letter-spacing="1">The honest caveat</text><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="400" text-anchor="start">On purely random data, temporal-difference methods still win — which the authors flag as an open problem for</text><text x="92" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="400" text-anchor="start">future work.</text></g><line x1="64" y1="584" x2="1216" y2="584" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="616" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">RvS: What is Essential for Offline RL via Supervised Learning?</text><text x="64" y="644" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICLR 2022  ·  arXiv:2112.10751  ·  github.com/scottemmons/rvs</text></svg>