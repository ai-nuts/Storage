<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">What actually makes supervised offline RL work?</text><g id="cue_s02_c1_recent_work_showed_plain_supervised"><title>recent work showed plain supervised learning temporal-difference bootstrapping all remarkably</title><rect x="64" y="158" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Plain supervised learning already works — but the picture is muddy</text><text x="92" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Recent work showed supervised learning, with no temporal-difference bootstrapping at all, can be</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">remarkably effective for offline RL. Yet it was unclear why.</text></g><g id="cue_s02_c2_different_papers_reached_contradicto"><title>different papers reached contradictory conclusions about what actually makes these</title><rect x="64" y="274" width="564" height="166" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="274" width="6" height="166" rx="6" fill="#F2C14E"/><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Contradictory conclusions</text><text x="92" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Different papers disagreed about what makes these methods</text><text x="92" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">work:</text><rect x="92" y="372" width="508" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="386.0" r="5" fill="#F2C14E"/><text x="126" y="391.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Some emphasized advantage weighting</text><rect x="92" y="406" width="508" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="420.0" r="5" fill="#F2685C"/><text x="126" y="425.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Others reached for large Transformer models</text></g><g id="cue_s02_c3_core_question_asks_simple_yet"><title>core question asks simple yet still unanswered</title><rect x="652" y="274" width="564" height="166" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="652" y="274" width="6" height="166" rx="6" fill="#34D3C0"/><text x="680" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">A simple, unanswered question</text><text x="680" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Stripped of the disagreements, one question remains open</text><text x="680" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">— and this paper sets out to answer it directly,</text><text x="680" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">component by component.</text></g><g id="cue_s02_c4_when_does_supervised_learning_offlin"><title>when does supervised learning offline actually work which its many</title><rect x="64" y="460" width="1152" height="116" rx="14" fill="#0F2A2E" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="460" width="6" height="116" rx="6" fill="#34D3C0"/><text x="92" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">The question</text><text x="92" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="400" text-anchor="start">When does supervised learning for offline RL actually work, and which algorithmic components are truly</text><text x="92" y="554" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="400" text-anchor="start">essential versus merely incidental complexity that could be stripped away without cost?</text></g><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="600" text-anchor="start">The goal is not a new algorithm, but a clear account of what is essential.</text></svg>