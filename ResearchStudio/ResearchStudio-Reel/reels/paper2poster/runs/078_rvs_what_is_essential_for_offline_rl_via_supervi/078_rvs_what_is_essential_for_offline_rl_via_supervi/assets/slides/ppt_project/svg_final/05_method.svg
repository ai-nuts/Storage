e x1="404" y1="522.0" x2="534" y2="514.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="404" y1="522.0" x2="534" y2="530.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="404" y1="538.0" x2="534" y2="514.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="404" y1="538.0" x2="534" y2="530.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><circle cx="104" cy="498.0" r="5" fill="#4C9BE8"/><circle cx="104" cy="514.0" r="5" fill="#4C9BE8"/><circle cx="104" cy="530.0" r="5" fill="#4C9BE8"/><circle cx="104" cy="546.0" r="5" fill="#4C9BE8"/><circle cx="254" cy="506.0" r="5" fill="#34D3C0"/><circle cx="254" cy="522.0" r="5" fill="#34D3C0"/><circle cx="254" cy="538.0" r="5" fill="#34D3C0"/><circle cx="404" cy="506.0" r="5" fill="#34D3C0"/><circle cx="404" cy="522.0" r="5" fill="#34D3C0"/><circle cx="404" cy="538.0" r="5" fill="#34D3C0"/><circle cx="534" cy="514.0" r="5" fill="#F2C14E"/><circle cx="534" cy="530.0" r="5" fill="#F2C14E"/></g><g id="cue_s05_c4_maximizes_log_likelihood_observed_ac"><title>maximizes log-likelihood observed actions under conditioned policy advantage weighting temporal-difference</title><rect x="648" y="366" width="568" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="366" width="6" height="214" rx="6" fill="#48C78E"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Maximize log-likelihood — nothing else</text><rect x="676" y="424" width="512" height="46" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="452" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="middle">max_theta   E[ log pi_theta( a | s, omega ) ]</text><circle cx="684" cy="494" r="7" fill="none" stroke="#F2685C" stroke-width="1.6"/><line x1="679.5" y1="498.5" x2="688.5" y2="489.5" stroke="#F2685C" stroke-width="1.6" stroke-linecap="round"/><text x="700" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">no advantage weighting</text><circle cx="684" cy="528" r="7" fill="none" stroke="#F2685C" stroke-width="1.6"/><line x1="679.5" y1="532.5" x2="688.5" y2="523.5" stroke="#F2685C" stroke-width="1.6" stroke-linecap="round"/><text x="700" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">no temporal-difference bootstrapping</text><circle cx="956" cy="494" r="7" fill="none" stroke="#F2685C" stroke-width="1.6"/><line x1="951.5" y1="498.5" x2="960.5" y2="489.5" stroke="#F2685C" stroke-width="1.6" stroke-linecap="round"/><text x="972" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">no Transformer</text><circle cx="956" cy="528" r="7" fill="none" stroke="#F2685C" stroke-width="1.6"/><line x1="951.5" y1="532.5" x2="960.5" y2="523.5" stroke="#F2685C" stroke-width="1.6" stroke-linecap="round"/><text x="972" y="533" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">only max-likelihood</text></g><text x="64" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="600" text-anchor="start">Relabeled experience turns offline RL into ordinary supervised learning.</text></svg>