<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Condition, relabel, and maximize likelihood</text><g id="cue_s05_c1_method_deliberately_simple_rvs_assum"><title>method deliberately simple rvs assumes agent markov decision process trains</title><rect x="64" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Condition the policy on an outcome</text><text x="92" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">In a Markov decision process, train a policy conditioned</text><text x="92" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">on an outcome omega — either a future goal state or an</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">average future return.</text><rect x="92" y="300" width="248" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="317.0" r="5" fill="#34D3C0"/><text x="126" y="322.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">omega = future goal state</text><rect x="360" y="300" width="248" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="378" cy="317.0" r="5" fill="#F2C14E"/><text x="394" y="322.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">omega = average return</text></g><g id="cue_s05_c2_given_offline_dataset_trajectories_a"><title>given offline dataset trajectories applies hindsight relabeling every observed action</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Hindsight relabeling</text><text x="676" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Given offline trajectories, every observed action becomes</text><text x="676" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">a demonstration for whatever outcome actually occurred</text><text x="676" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">later in that same trajectory.</text><text x="676" y="318" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#EAF2FB" font-weight="700" text-anchor="start">(s, a)  →  demonstration for outcome that followed</text></g><g id="cue_s05_c3_policy_itself_just_feedforward_multi"><title>policy itself just feedforward multilayer perceptron two fully connected layers</title><rect x="64" y="366" width="568" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="366" width="6" height="214" rx="6" fill="#F2C14E"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Just a two-layer MLP</text><text x="92" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A feedforward network with two fully connected layers; the</text><text x="92" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">outcome is fed in simply by concatenating it onto the</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">input state.</text><text x="104" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="700" text-anchor="middle">s | omega</text><text x="254" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="700" text-anchor="middle">FC 1</text><text x="404" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="700" text-anchor="middle">FC 2</text><text x="534" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="700" text-anchor="middle">a</text><line x1="104" y1="498.0" x2="254" y2="506.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="104" y1="498.0" x2="254" y2="522.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="104" y1="498.0" x2="254" y2="538.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="104" y1="514.0" x2="254" y2="506.0" stroke="#26455F" stroke-width="0.7" stroke-linecap="round"/><line x1="104" y1=