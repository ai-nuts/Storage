<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A two-layer MLP reaches state of the art</text><g id="cue_s07_c1_headline_result_striking_nothing_but"><title>headline result striking nothing but two-layer feedforward network trained maximum</title><rect x="64" y="150" width="1152" height="50" rx="12" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Nothing but a two-layer network trained with maximum likelihood — state of the art across several suites.</text></g><g id="cue_s07_c2_antmaze_goal_conditioned_rvs_scores"><title>antmaze goal-conditioned rvs scores fifty-three point five average edging out</title><rect x="64" y="214" width="564" height="182" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="182" rx="6" fill="#4C9BE8"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">AntMaze  ·  goal-conditioned</text><text x="92" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">Average normalized score (higher is better)</text><rect x="240" y="296" width="300" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="296" width="267" height="28" rx="6" fill="#48C78E"/><text x="228" y="315.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">RvS-G</text><text x="517" y="315.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">53.5</text><rect x="240" y="338" width="300" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="338" width="253" height="28" rx="6" fill="#F2C14E"/><text x="228" y="357.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">best value-based</text><text x="503" y="357.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">50.6</text><text x="92" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="700" text-anchor="start">A plain MLP edges out the strongest value-based baseline.</text></g><g id="cue_s07_c3_franka_kitchen_reaches_fifty_four_gc"><title>franka kitchen reaches fifty-four gcsl suite scores sixty-two beating online</title><rect x="652" y="214" width="564" height="182" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="652" y="214" width="6" height="182" rx="6" fill="#34D3C0"/><text x="680" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Franka Kitchen  &amp;  GCSL suite</text><rect x="680" y="266" width="150" height="96" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="755.0" y="319.76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="32" fill="#48C78E" font-weight="800" text-anchor="middle">54</text><text x="755.0" y="344.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">Kitchen score</text><rect x="940" y="300" width="232" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="940" y="300" width="205" height="26" rx="6" fill="#48C78E"/><text x="928" y="318.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">RvS</text><text x="1155" y="318.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">62</text><rect x="940" y="340" width="232" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="940" y="340" width="192" height="26" rx="6" fill="#F2C14E"/><text x="928" y="358.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">online GCSL</text><text x="1142" y="358.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">58</text><text x="848" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="700" text-anchor="start">RvS wins on GCSL using only offline data.</text></g><g id="cue_s07_c4_gym_locomotion_reward_conditioned_rv"><title>gym locomotion reward-conditioned rvs matches decision transformer while simple multilayer</title><rect x="64" y="412" width="1152" height="208" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="412" width="6" height="208" rx="6" fill="#F2C14E"/><text x="92" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Gym Locomotion  &amp;  stitching</text><rect x="92" y="470" width="520" height="132" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Reward-conditioned RvS  ≈  Decision Transformer</text><text x="112" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Matched performance — but with a simple multilayer</text><text x="112" y="550" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">perceptron instead of a large Transformer sequence</text><text x="112" y="572" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">model.</text><text x="112" y="588" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">MLP  ==  Transformer   (on locomotion)</text><rect x="640" y="470" width="536" height="132" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="660" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Even on stitching tasks</text><text x="660" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Long thought to demand dynamic programming, yet</text><text x="660" y="550" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">goal-conditioned RvS keeps pace with value-based methods.</text><text x="660" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">No dynamic programming required to stay competitive.</text></g></svg>