<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">What actually matters</text><g id="cue_s08_c1_ablations_pin_down_what_actually"><title>ablations pin down what actually matters first capacity best architectures</title><rect x="64" y="158" width="564" height="448" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="448" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">1  ·  Capacity: bigger is better</text><text x="92" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The best networks are notably larger than those used in</text><text x="92" y="251" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">standard online RL or imitation learning. Widening the</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">network up to about a thousand hidden units generally</text><text x="92" y="297" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">helps.</text><line x1="152" y1="510" x2="582" y2="510" stroke="#9DB3C8" stroke-width="1.5" stroke-linecap="round"/><line x1="152" y1="510" x2="152" y2="360" stroke="#9DB3C8" stroke-width="1.5" stroke-linecap="round"/><text x="582" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="end">hidden units</text><text x="142" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="end">perf</text><polyline points="152,510 164,499 176,489 188,480 200,471 212,463 224,456 236,449 248,443 260,437 272,432 284,428 296,423 308,419 320,416 332,412 344,409 356,407 368,404 380,402 392,399 404,397 416,396 428,394 440,392 452,391 464,390 476,389 488,387 500,386 512,386 524,385 536,384 548,383 560,383 572,382" fill="none" stroke="#4C9BE8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="461" cy="390" r="5" fill="#48C78E"/><line x1="461" y1="390" x2="461" y2="510" stroke="#48C78E" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="461" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#48C78E" font-weight="800" text-anchor="middle">~1000 units</text><text x="92" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">More policy capacity is the single most consistent win.</text></g><g id="cue_s08_c2_second_regularization_dropout_not_un"><title>second regularization dropout not universally good boosts performance small human-demonstration</title><rect x="652" y="158" width="564" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="652" y="158" width="6" height="190" rx="6" fill="#F2C14E"/><text x="680" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">2  ·  Regularization: dropout is not universal</text><circle cx="691" cy="225" r="11" fill="none" stroke="#48C78E" stroke-width="1.8"/><text x="691" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="middle">+</text><text x="712" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">helps kitchen-complete (small human demos)</text><circle cx="691" cy="261" r="11" fill="none" stroke="#F2685C" stroke-width="1.8"/><text x="691" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="middle">-</text><text x="712" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">hurts hopper-medium-expert</text><circle cx="691" cy="297" r="11" fill="none" stroke="#F2685C" stroke-width="1.8"/><text x="691" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="middle">-</text><text x="712" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">hurts antmaze-medium-play</text><text x="680" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">Add a little dropout, and only where it helps.</text></g><g id="cue_s08_c3_third_output_distribution_categorica"><title>third output distribution categorical distribution over discretized actions matches beats</title><rect x="652" y="364" width="564" height="124" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="652" y="364" width="6" height="124" rx="6" fill="#34D3C0"/><text x="680" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">3  ·  Output distribution</text><text x="680" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A categorical distribution over discretized actions</text><text x="680" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">matches or beats a unimodal Gaussian across the GCSL tasks</text><text x="680" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">— more capacity again.</text></g><g id="cue_s08_c4_finally_validation_loss_correlates_o"><title>finally validation loss correlates only loosely final performance not reliable</title><rect x="652" y="504" width="564" height="102" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="652" y="504" width="6" height="102" rx="6" fill="#F2C14E"/><text x="680" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">4  ·  Validation loss is a weak signal</text><text x="680" y="570" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">It correlates only loosely with final performance — not</text><text x="680" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">reliable for tuning on its own.</text></g></svg>