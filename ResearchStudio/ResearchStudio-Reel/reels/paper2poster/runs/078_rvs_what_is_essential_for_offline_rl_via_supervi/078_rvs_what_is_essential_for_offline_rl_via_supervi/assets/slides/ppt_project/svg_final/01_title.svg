<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="2.5">ICLR 2022  ·  OFFLINE RL</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">UC Berkeley  ·  CMU</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><g id="cue_s01_c1_what_actually_essential_offline_rein"><title>what actually essential offline reinforcement learning done via supervised learning</title><text x="64" y="168" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="46" fill="#FFFFFF" font-weight="800" text-anchor="start">RvS: What is Essential for Offline RL</text><text x="64" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="46" fill="#4C9BE8" font-weight="800" text-anchor="start">via Supervised Learning?</text></g><g id="cue_s01_c2_iclr_2022_scott_emmons_benjamin"><title>iclr 2022 scott emmons benjamin eysenbach ilya kostrikov sergey levine</title><rect x="64" y="262" width="1152" height="64" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="262" width="6" height="64" rx="6" fill="#34D3C0"/><text x="92" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">Scott Emmons  ·  Benjamin Eysenbach  ·  Ilya Kostrikov  ·  Sergey Levine</text><text x="92" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="500" text-anchor="start">RvS = Reinforcement learning via Supervised learning — a unifying view of conditional imitation for offline RL.</text></g><g id="cue_s01_c3_their_surprising_finding_plain_two_l"><title>their surprising finding plain two-layer feedforward network trained simply maximize</title><rect x="64" y="352" width="564" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="352" width="6" height="190" rx="6" fill="#48C78E"/><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#48C78E" font-weight="800" text-anchor="start">The surprising finding</text><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">A plain two-layer feedforward network, trained just to</text><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">maximize likelihood, matches state-of-the-art methods</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">built on temporal-difference learning or Transformer</text><text x="92" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">sequence models.</text></g><g id="cue_s01_c4_two_things_really_matter_they"><title>two things really matter they show choosing capacity carefully choosing</title><rect x="652" y="352" width="564" height="190" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="652" y="352" width="6" height="190" rx="6" fill="#F2C14E"/><text x="680" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Only two things really matter</text><rect x="680" y="412" width="508" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="698" cy="432.0" r="5" fill="#4C9BE8"/><text x="714" y="437.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">1  ·  Model capacity  —  tune width &amp; regularization</text><rect x="680" y="460" width="508" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="698" cy="480.0" r="5" fill="#34D3C0"/><text x="714" y="485.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">2  ·  What you condition on  —  goals or rewards</text><text x="680" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="600" text-anchor="start">Everything else turns out to be optional.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">A minimal recipe that is competitive with far more complex RL machinery.</text><text x="64" y="644" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2112.10751</text><text x="320" y="644" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/scottemmons/rvs</text></svg>