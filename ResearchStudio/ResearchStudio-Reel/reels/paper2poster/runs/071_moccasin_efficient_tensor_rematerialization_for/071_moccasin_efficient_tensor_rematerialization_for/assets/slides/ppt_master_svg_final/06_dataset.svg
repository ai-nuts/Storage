<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">06 · DATASET / BENCHMARK</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">How Moccasin is evaluated</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s06_c1_evaluation_range_compute_graphs_main">
    <title>evaluation range compute graphs main scaling study four random layered graphs g1 through g4 sizes grow one hundred nodes couple hundred edges up one thousand nodes nearly six thousand edges</title>
    <desc>The evaluation uses a range of compute graphs. The main scaling study is on four random layered graphs, G1 through G4, whose sizes grow from about one hundred nodes and a couple hundred edges up to one thousand nodes and nearly six thousand edges.</desc>
    <rect x="80" y="182" width="620" height="288" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="182" width="6" height="288" rx="3" fill="#2453D6"/>
    <text x="108" y="214" font-size="19" font-weight="bold" fill="#12172A">Scaling study: four layered graphs G1–G4</text>
    <!-- table header -->
    <line x1="108" y1="232" x2="672" y2="232" stroke="#E2E7EF" stroke-width="1"/>
    <text x="120" y="264" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">GRAPH</text>
    <text x="340" y="264" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675" text-anchor="end">NODES</text>
    <text x="640" y="264" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675" text-anchor="end">EDGES</text>
    <line x1="108" y1="278" x2="672" y2="278" stroke="#E2E7EF" stroke-width="1"/>
    <text x="120" y="310" font-size="17" font-weight="bold" fill="#2453D6">G1</text>
    <text x="340" y="310" font-size="17" fill="#12172A" text-anchor="end">~100</text>
    <text x="640" y="310" font-size="17" fill="#12172A" text-anchor="end">~200</text>
    <text x="120" y="344" font-size="17" font-weight="bold" fill="#2453D6">G2</text>
    <text x="340" y="344" font-size="17" fill="#8A97A8" text-anchor="end">growing ↓</text>
    <text x="640" y="344" font-size="17" fill="#8A97A8" text-anchor="end">growing ↓</text>
    <text x="120" y="378" font-size="17" font-weight="bold" fill="#2453D6">G3</text>
    <text x="340" y="378" font-size="17" fill="#8A97A8" text-anchor="end">growing ↓</text>
    <text x="640" y="378" font-size="17" fill="#8A97A8" text-anchor="end">growing ↓</text>
    <line x1="108" y1="396" x2="672" y2="396" stroke="#E2E7EF" stroke-width="1"/>
    <text x="120" y="428" font-size="17" font-weight="bold" fill="#2453D6">G4</text>
    <text x="340" y="428" font-size="17" font-weight="bold" fill="#12172A" text-anchor="end">1,000</text>
    <text x="640" y="428" font-size="17" font-weight="bold" fill="#12172A" text-anchor="end">~5,900</text>
    <text x="108" y="456" font-size="14" fill="#5A6675">Sizes span an order of magnitude, stressing scalability.</text>
  </g>

  <g id="cue_s06_c4_all_experiments_run_sixteen_core_wor">
    <title>all experiments run sixteen-core workstation thirty-two gigabytes ram</title>
    <desc>All experiments run on a sixteen-core workstation with thirty-two gigabytes of RAM.</desc>
    <rect x="80" y="486" width="620" height="152" rx="12" fill="#F3F5FA"/>
    <text x="108" y="522" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">HARDWARE</text>
    <rect x="108" y="538" width="278" height="82" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="247" y="576" font-size="34" font-weight="bold" fill="#2453D6" text-anchor="middle">16 cores</text>
    <text x="247" y="602" font-size="15" fill="#5A6675" text-anchor="middle">CPU workstation</text>
    <rect x="398" y="538" width="278" height="82" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="537" y="576" font-size="34" font-weight="bold" fill="#2453D6" text-anchor="middle">32 GB</text>
    <text x="537" y="602" font-size="15" fill="#5A6675" text-anchor="middle">system RAM</text>
  </g>

  <g id="cue_s06_c2_also_real_world_compute_graph_four">
    <title>also real-world compute graph four hundred forty-two nodes over twelve hundred edges used headline comparison</title>
    <desc>There is also a real-world compute graph with four hundred forty-two nodes and over twelve hundred edges used for the headline comparison.</desc>
    <rect x="680" y="182" width="520" height="198" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="680" y="182" width="6" height="198" rx="3" fill="#0E9E8F"/>
    <text x="708" y="216" font-size="19" font-weight="bold" fill="#12172A">A real-world compute graph</text>
    <text x="708" y="248" font-size="16" fill="#5A6675">Used for the headline comparison against</text>
    <text x="708" y="270" font-size="16" fill="#5A6675">Checkmate.</text>
    <rect x="708" y="290" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#B7E2DA" stroke-width="1"/>
    <text x="823" y="326" font-size="30" font-weight="bold" fill="#0E9E8F" text-anchor="middle">442</text>
    <text x="823" y="350" font-size="14" fill="#5A6675" text-anchor="middle">nodes</text>
    <rect x="950" y="290" width="230" height="72" rx="8" fill="#FFFFFF" stroke="#B7E2DA" stroke-width="1"/>
    <text x="1065" y="326" font-size="30" font-weight="bold" fill="#0E9E8F" text-anchor="middle">1,200+</text>
    <text x="1065" y="350" font-size="14" fill="#5A6675" text-anchor="middle">edges</text>
  </g>

  <g id="cue_s06_c3_every_graph_memory_budget_set">
    <title>every graph memory budget set eighty ninety percent peak memory initial schedule without rematerialization solver forced actually recompute tensors</title>
    <desc>For every graph the memory budget is set to eighty and ninety percent of the peak memory of the initial schedule without rematerialization, so the solver is forced to actually recompute tensors.</desc>
    <rect x="680" y="396" width="520" height="242" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="680" y="396" width="6" height="242" rx="3" fill="#E4572E"/>
    <text x="708" y="430" font-size="19" font-weight="bold" fill="#12172A">Tight memory budgets force recompute</text>
    <text x="708" y="462" font-size="16" fill="#5A6675">Budget = a fraction of the peak memory of the</text>
    <text x="708" y="484" font-size="16" fill="#5A6675">initial schedule (no rematerialization).</text>
    <rect x="708" y="502" width="222" height="78" rx="8" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <text x="819" y="544" font-size="36" font-weight="bold" fill="#E4572E" text-anchor="middle">80%</text>
    <text x="819" y="568" font-size="14" fill="#5A6675" text-anchor="middle">of peak memory</text>
    <rect x="942" y="502" width="222" height="78" rx="8" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <text x="1053" y="544" font-size="36" font-weight="bold" fill="#E4572E" text-anchor="middle">90%</text>
    <text x="1053" y="568" font-size="14" fill="#5A6675" text-anchor="middle">of peak memory</text>
    <text x="708" y="612" font-size="15" fill="#5A6675">Both settings force the solver to recompute tensors, not just store them.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">06 / 10</text>
  </g>
</svg>
