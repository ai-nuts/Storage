<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">09 · HEADLINE NUMBERS</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">The impact in four numbers</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s09_c1_few_numbers_capture_impact_moccasin">
    <title>few numbers capture impact moccasin needs only linear number integer variables graph size compared quadratic number boolean variables prior state art</title>
    <desc>A few numbers capture the impact. Moccasin needs only a linear number of integer variables in the graph size, compared to a quadratic number of Boolean variables for the prior state of the art.</desc>
    <rect x="80" y="182" width="552" height="228" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="182" width="6" height="228" rx="3" fill="#2453D6"/>
    <text x="108" y="218" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">VARIABLE COUNT</text>
    <text x="108" y="286" font-size="46" font-weight="bold" fill="#2453D6">linear vs quadratic</text>
    <text x="108" y="332" font-size="17" fill="#5A6675">Moccasin needs only a linear number of integer</text>
    <text x="108" y="356" font-size="17" fill="#5A6675">variables in graph size, versus a quadratic</text>
    <text x="108" y="380" font-size="17" fill="#5A6675">number of Boolean variables in prior work.</text>
  </g>

  <g id="cue_s09_c2_translates_solve_times_order_magnitu">
    <title>translates solve times up to order magnitude roughly ten times faster large graphs</title>
    <desc>This translates into solve times up to an order of magnitude, roughly ten times, faster on large graphs.</desc>
    <rect x="660" y="182" width="540" height="228" rx="12" fill="#12172A"/>
    <rect x="660" y="182" width="6" height="228" rx="3" fill="#7CA0EC"/>
    <text x="688" y="218" font-size="15" font-weight="bold" letter-spacing="1" fill="#7CA0EC">SOLVE-TIME SPEEDUP</text>
    <text x="688" y="300" font-size="72" font-weight="bold" fill="#FFFFFF">~10×</text>
    <text x="688" y="344" font-size="17" fill="#C7CFDA">Up to an order of magnitude faster</text>
    <text x="688" y="368" font-size="17" fill="#C7CFDA">on large compute graphs.</text>
  </g>

  <g id="cue_s09_c3_solutions_finds_high_quality_total">
    <title>solutions finds high quality total duration increase from rematerialization stays consistently below five percent</title>
    <desc>And the solutions it finds are high quality: the total duration increase from rematerialization stays consistently below five percent.</desc>
    <rect x="80" y="426" width="552" height="212" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="80" y="426" width="6" height="212" rx="3" fill="#0E9E8F"/>
    <text x="108" y="462" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">SOLUTION QUALITY</text>
    <text x="108" y="536" font-size="60" font-weight="bold" fill="#0E9E8F">&lt; 5%</text>
    <text x="108" y="578" font-size="17" fill="#5A6675">Total duration increase from</text>
    <text x="108" y="602" font-size="17" fill="#5A6675">rematerialization stays consistently</text>
    <text x="108" y="626" font-size="17" fill="#5A6675">below five percent.</text>
  </g>

  <g id="cue_s09_c4_crucially_moccasin_scales_graphs_one">
    <title>crucially moccasin scales graphs up to one thousand nodes nearly six thousand edges regime competing method simply times out runs out memory</title>
    <desc>Crucially, Moccasin scales to graphs with up to one thousand nodes and nearly six thousand edges, a regime where the competing method simply times out or runs out of memory.</desc>
    <rect x="660" y="426" width="540" height="212" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="660" y="426" width="6" height="212" rx="3" fill="#2453D6"/>
    <text x="688" y="462" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">SCALE REACHED</text>
    <text x="688" y="524" font-size="46" font-weight="bold" fill="#2453D6">1,000 nodes</text>
    <text x="688" y="556" font-size="19" font-weight="bold" fill="#12172A">~6,000 edges</text>
    <text x="688" y="590" font-size="17" fill="#5A6675">A regime where the competing method</text>
    <text x="688" y="614" font-size="17" fill="#5A6675">simply times out or runs out of memory.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">09 / 10</text>
  </g>
</svg>
