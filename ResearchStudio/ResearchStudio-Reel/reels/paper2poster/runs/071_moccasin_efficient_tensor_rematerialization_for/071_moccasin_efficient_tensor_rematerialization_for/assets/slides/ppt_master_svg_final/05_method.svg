<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">05 · METHOD</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">How the model is built — intervals, objective, constraints, solver</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s05_c1_moccasin_represents_schedule_retenti">
    <title>moccasin represents schedule retention intervals each node small constant number intervals integer start event end event when output tensor computed how long stays memory</title>
    <desc>Moccasin represents the schedule with retention intervals. For each node the method allows up to a small constant number of intervals, each specified by an integer start event and end event, indicating when that node's output tensor is computed and how long it stays in memory.</desc>
    <rect x="80" y="182" width="552" height="224" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="182" width="6" height="224" rx="3" fill="#2453D6"/>
    <text x="108" y="214" font-size="19" font-weight="bold" fill="#12172A">1 · Retention intervals per node</text>
    <text x="108" y="244" font-size="16" fill="#5A6675">Each node gets a small constant number of</text>
    <text x="108" y="266" font-size="16" fill="#5A6675">intervals — integer start and end events —</text>
    <text x="108" y="288" font-size="16" fill="#5A6675">marking when its tensor lives in memory.</text>
    <!-- event timeline -->
    <line x1="108" y1="360" x2="600" y2="360" stroke="#C6CED9" stroke-width="1.5"/>
    <text x="108" y="392" font-size="13" fill="#8A97A8">events →</text>
    <rect x="150" y="330" width="150" height="22" rx="5" fill="#2453D6"/>
    <text x="225" y="346" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">interval 1</text>
    <rect x="400" y="330" width="120" height="22" rx="5" fill="#7CA0EC"/>
    <text x="460" y="346" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">interval 2</text>
    <circle cx="150" cy="360" r="4" fill="#12172A"/>
    <circle cx="300" cy="360" r="4" fill="#12172A"/>
    <circle cx="400" cy="360" r="4" fill="#12172A"/>
    <circle cx="520" cy="360" r="4" fill="#12172A"/>
  </g>

  <g id="cue_s05_c2_boolean_flag_marks_whether_interval">
    <title>boolean flag marks whether each interval actually active node need not recomputed fixed number times objective minimizes total duration weighted sum active compute events weights node execution times</title>
    <desc>A Boolean flag marks whether each interval is actually active, so a node need not be recomputed a fixed number of times. The objective minimizes total duration, a weighted sum over the active compute events where the weights are node execution times.</desc>
    <rect x="660" y="182" width="540" height="224" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="660" y="182" width="6" height="224" rx="3" fill="#0E9E8F"/>
    <text x="688" y="214" font-size="19" font-weight="bold" fill="#12172A">2 · Active flag &amp; objective</text>
    <text x="688" y="244" font-size="16" fill="#5A6675">A Boolean flag marks each interval active or</text>
    <text x="688" y="266" font-size="16" fill="#5A6675">not — so recompute count is flexible, not fixed.</text>
    <rect x="688" y="286" width="484" height="100" rx="8" fill="#FFFFFF" stroke="#B7E2DA" stroke-width="1"/>
    <text x="708" y="316" font-size="15" font-weight="bold" letter-spacing="1" fill="#0E9E8F">OBJECTIVE</text>
    <text x="708" y="348" font-size="18" font-weight="bold" fill="#12172A">minimize total duration</text>
    <text x="708" y="374" font-size="15" fill="#5A6675">= weighted sum over active compute events</text>
    <text x="1030" y="374" font-size="15" fill="#5A6675">(weights = exec times)</text>
  </g>

  <g id="cue_s05_c3_memory_budget_enforced_through_const">
    <title>memory budget enforced through constraint programming cumulative constraint tensor sizes resource demands budget capacity data dependencies predecessors successors handled reservoir constraint</title>
    <desc>The memory budget is enforced through the CP cumulative constraint, treating tensor sizes as resource demands and the budget as capacity, while data dependencies between predecessors and successors are handled with the reservoir constraint.</desc>
    <rect x="80" y="422" width="552" height="216" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="422" width="6" height="216" rx="3" fill="#2453D6"/>
    <text x="108" y="454" font-size="19" font-weight="bold" fill="#12172A">3 · Two CP constraints</text>
    <rect x="108" y="474" width="242" height="140" rx="8" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <text x="129" y="504" font-size="17" font-weight="bold" fill="#2453D6">cumulative</text>
    <text x="129" y="532" font-size="15" fill="#5A6675">memory budget:</text>
    <text x="129" y="554" font-size="15" fill="#5A6675">tensor sizes =</text>
    <text x="129" y="576" font-size="15" fill="#5A6675">resource demands,</text>
    <text x="129" y="598" font-size="15" fill="#5A6675">budget = capacity</text>
    <rect x="362" y="474" width="242" height="140" rx="8" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <text x="383" y="504" font-size="17" font-weight="bold" fill="#2453D6">reservoir</text>
    <text x="383" y="532" font-size="15" fill="#5A6675">data dependencies</text>
    <text x="383" y="554" font-size="15" fill="#5A6675">between predecessors</text>
    <text x="383" y="576" font-size="15" fill="#5A6675">and successors are</text>
    <text x="383" y="598" font-size="15" fill="#5A6675">respected</text>
  </g>

  <g id="cue_s05_c4_whole_handed_google_or_tools_cp_sat">
    <title>whole model handed google or-tools cp-sat solver each node small constant number intervals total number integer variables stays linear graph size</title>
    <desc>The whole model is handed to Google OR-Tools' CP-SAT solver. Because each node uses only a small constant number of intervals, the total number of integer variables stays linear in the graph size.</desc>
    <rect x="660" y="422" width="540" height="216" rx="12" fill="#12172A"/>
    <rect x="660" y="422" width="6" height="216" rx="3" fill="#7CA0EC"/>
    <text x="688" y="454" font-size="19" font-weight="bold" fill="#FFFFFF">4 · Solve &amp; scale</text>
    <rect x="688" y="474" width="484" height="66" rx="8" fill="#1E2740"/>
    <text x="708" y="504" font-size="15" font-weight="bold" letter-spacing="1" fill="#7CA0EC">SOLVER</text>
    <text x="708" y="530" font-size="18" font-weight="bold" fill="#FFFFFF">Google OR-Tools · CP-SAT</text>
    <text x="688" y="574" font-size="16" fill="#C7CFDA">Constant intervals per node keep the total</text>
    <text x="688" y="596" font-size="16" fill="#C7CFDA">number of integer variables</text>
    <text x="962" y="596" font-size="16" font-weight="bold" fill="#0E9E8F">linear in graph size.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">05 / 10</text>
  </g>
</svg>
