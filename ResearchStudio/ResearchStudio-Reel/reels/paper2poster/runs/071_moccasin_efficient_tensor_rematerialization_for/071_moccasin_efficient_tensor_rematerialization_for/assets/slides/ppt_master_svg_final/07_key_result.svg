<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">07 · KEY RESULT</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">Up to an order of magnitude faster than Checkmate</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s07_c1_across_board_moccasin_solves_remater">
    <title>across board moccasin solves rematerialization problem substantially faster than checkmate up to order magnitude larger graphs</title>
    <desc>Across the board, Moccasin solves the rematerialization problem substantially faster than Checkmate, up to an order of magnitude on the larger graphs.</desc>
    <rect x="80" y="182" width="552" height="456" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <text x="108" y="214" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">SOLVE TIME vs GRAPH SIZE (lower is better)</text>
    <line x1="132" y1="560" x2="608" y2="560" stroke="#C6CED9" stroke-width="1.5"/>
    <line x1="132" y1="250" x2="132" y2="560" stroke="#C6CED9" stroke-width="1.5"/>
    <text x="120" y="405" font-size="13" fill="#5A6675" text-anchor="middle" transform="rotate(-90 120 405)">solve time →</text>
    <!-- group 100 -->
    <rect x="168" y="512" width="40" height="48" fill="#8A97A8"/>
    <rect x="212" y="520" width="40" height="40" fill="#2453D6"/>
    <text x="210" y="584" font-size="13" fill="#5A6675" text-anchor="middle">~100</text>
    <!-- group 250 -->
    <rect x="288" y="400" width="40" height="160" fill="#8A97A8"/>
    <rect x="332" y="524" width="40" height="36" fill="#2453D6"/>
    <text x="330" y="584" font-size="13" fill="#5A6675" text-anchor="middle">250</text>
    <!-- group 500 -->
    <rect x="408" y="290" width="40" height="270" fill="#E4572E"/>
    <text x="428" y="280" font-size="12" font-weight="bold" fill="#E4572E" text-anchor="middle">timeout</text>
    <rect x="452" y="500" width="40" height="60" fill="#2453D6"/>
    <text x="450" y="584" font-size="13" fill="#5A6675" text-anchor="middle">500</text>
    <!-- group 1000 -->
    <rect x="528" y="290" width="40" height="270" fill="#E4572E"/>
    <text x="548" y="280" font-size="12" font-weight="bold" fill="#E4572E" text-anchor="middle">OOM</text>
    <rect x="572" y="486" width="40" height="74" fill="#2453D6"/>
    <text x="570" y="584" font-size="13" fill="#5A6675" text-anchor="middle">1,000</text>
    <text x="370" y="612" font-size="14" fill="#5A6675" text-anchor="middle">number of nodes  →</text>
    <!-- legend -->
    <rect x="360" y="212" width="14" height="14" fill="#8A97A8"/>
    <text x="380" y="224" font-size="13" fill="#5A6675">Checkmate</text>
    <rect x="470" y="212" width="14" height="14" fill="#2453D6"/>
    <text x="490" y="224" font-size="13" fill="#5A6675">Moccasin</text>
  </g>

  <g id="cue_s07_c2_smallest_graph_two_comparable_but">
    <title>smallest graph two comparable but gap widens quickly</title>
    <desc>On the smallest graph the two are comparable, but the gap widens quickly.</desc>
    <rect x="660" y="182" width="540" height="118" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="660" y="182" width="6" height="118" rx="3" fill="#8A97A8"/>
    <text x="688" y="216" font-size="19" font-weight="bold" fill="#12172A">Small graphs: a close race</text>
    <text x="688" y="248" font-size="16" fill="#5A6675">On the smallest graph the two are comparable —</text>
    <text x="688" y="270" font-size="16" fill="#5A6675">but the gap widens quickly as graphs grow.</text>
  </g>

  <g id="cue_s07_c3_graph_two_hundred_fifty_nodes">
    <title>graph two hundred fifty nodes tight memory budget checkmate fails find any feasible solution within thirty minutes loosest budget takes ten minutes moccasin finishes seconds</title>
    <desc>For the graph with two hundred fifty nodes and a tight memory budget, Checkmate fails to find any feasible solution within thirty minutes, and at the loosest budget it takes ten minutes, while Moccasin finishes in seconds.</desc>
    <rect x="660" y="316" width="540" height="154" rx="12" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <rect x="660" y="316" width="6" height="154" rx="3" fill="#E4572E"/>
    <text x="688" y="350" font-size="19" font-weight="bold" fill="#12172A">250 nodes: Checkmate stalls</text>
    <text x="688" y="382" font-size="16" fill="#5A6675">Tight budget: no feasible solution in 30 min.</text>
    <text x="688" y="404" font-size="16" fill="#5A6675">Loosest budget: 10 min.</text>
    <text x="688" y="436" font-size="16" fill="#5A6675">Moccasin finishes in</text>
    <text x="878" y="436" font-size="18" font-weight="bold" fill="#0E9E8F">seconds.</text>
    <text x="688" y="458" font-size="15" fill="#8A97A8">Same problem, orders of magnitude apart.</text>
  </g>

  <g id="cue_s07_c4_five_hundred_one_thousand_node">
    <title>five hundred one thousand node graphs checkmate times out entirely no solution given three hours exits out-of-memory error moccasin converges good low-duration-increase solution under hour</title>
    <desc>For the five hundred and one thousand node graphs, Checkmate times out entirely, finding no solution even given three hours and exiting with an out-of-memory error, whereas Moccasin converges to a good, low-duration-increase solution in under an hour.</desc>
    <rect x="660" y="486" width="540" height="152" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="660" y="486" width="6" height="152" rx="3" fill="#0E9E8F"/>
    <text x="688" y="520" font-size="19" font-weight="bold" fill="#12172A">500 &amp; 1,000 nodes: only Moccasin finishes</text>
    <text x="688" y="552" font-size="16" fill="#5A6675">Checkmate finds no solution in 3 hours and</text>
    <text x="688" y="574" font-size="16" fill="#5A6675">exits out-of-memory.</text>
    <text x="688" y="606" font-size="16" fill="#5A6675">Moccasin converges to a good, low-overhead</text>
    <text x="688" y="628" font-size="16" fill="#5A6675">solution in under an hour.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">07 / 10</text>
  </g>
</svg>
