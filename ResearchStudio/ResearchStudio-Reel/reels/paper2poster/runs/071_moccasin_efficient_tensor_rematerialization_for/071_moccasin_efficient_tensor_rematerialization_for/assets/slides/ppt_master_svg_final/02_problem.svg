<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">02 · PROBLEM</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">Fit a big model in small memory — without paying too much time</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s02_c1_neural_networks_running_edge_devices">
    <title>neural networks running edge devices constrained above all by memory</title>
    <desc>Neural networks running on edge devices are constrained above all by memory.</desc>
    <rect x="80" y="182" width="552" height="120" rx="12" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <rect x="80" y="182" width="6" height="120" rx="3" fill="#E4572E"/>
    <text x="108" y="218" font-size="19" font-weight="bold" fill="#12172A">The binding constraint is memory</text>
    <text x="108" y="250" font-size="16" fill="#5A6675">Neural networks running on edge devices are</text>
    <text x="108" y="272" font-size="16" fill="#5A6675">constrained, above all else, by available memory.</text>
  </g>

  <g id="cue_s02_c3_core_problem_scheduling_one_given">
    <title>core problem scheduling given compute graph fixed memory budget decide retain recompute minimize execution time peak memory never exceeds budget</title>
    <desc>The core problem is a scheduling one: for a given compute graph and a fixed memory budget, decide which tensors to retain and which to recompute so that total execution time is as small as possible while peak memory never exceeds the budget.</desc>
    <rect x="80" y="318" width="552" height="320" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="318" width="6" height="320" rx="3" fill="#2453D6"/>
    <text x="108" y="354" font-size="19" font-weight="bold" fill="#2453D6">It is really a scheduling problem</text>
    <text x="108" y="388" font-size="16" fill="#5A6675">Given a compute graph and a fixed memory</text>
    <text x="108" y="410" font-size="16" fill="#5A6675">budget, decide which tensors to keep and</text>
    <text x="108" y="432" font-size="16" fill="#5A6675">which to recompute.</text>
    <rect x="108" y="456" width="496" height="72" rx="8" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <text x="128" y="486" font-size="15" font-weight="bold" fill="#0E9E8F">minimize</text>
    <text x="210" y="486" font-size="15" fill="#12172A">total execution time</text>
    <text x="128" y="512" font-size="15" font-weight="bold" fill="#E4572E">subject to</text>
    <text x="220" y="512" font-size="15" fill="#12172A">peak memory ≤ budget, always</text>
    <text x="108" y="560" font-size="16" fill="#5A6675">Keeping a tensor spends memory; recomputing</text>
    <text x="108" y="582" font-size="16" fill="#5A6675">it spends time. The schedule balances the two</text>
    <text x="108" y="604" font-size="16" fill="#5A6675">across the whole graph.</text>
  </g>

  <g id="cue_s02_c2_one_way_fit_large_small">
    <title>one way fit large model small memory footprint rematerialization instead storing every intermediate tensor recompute some on demand catch recomputation costs time</title>
    <desc>One way to fit a large model into a small memory footprint is rematerialization: instead of storing every intermediate tensor, you recompute some of them on demand. The catch is that recomputation costs time.</desc>
    <rect x="660" y="182" width="540" height="252" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <text x="688" y="216" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">STORE  vs  RECOMPUTE</text>
    <rect x="688" y="238" width="238" height="170" rx="8" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <text x="708" y="270" font-size="17" font-weight="bold" fill="#0E9E8F">Store everything</text>
    <text x="708" y="300" font-size="15" fill="#5A6675">Keep every intermediate</text>
    <text x="708" y="322" font-size="15" fill="#5A6675">tensor in memory.</text>
    <text x="708" y="358" font-size="14" font-weight="bold" fill="#12172A">+ fast</text>
    <text x="708" y="382" font-size="14" font-weight="bold" fill="#E4572E">− high peak memory</text>
    <rect x="934" y="238" width="238" height="170" rx="8" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <text x="954" y="270" font-size="17" font-weight="bold" fill="#E4572E">Recompute some</text>
    <text x="954" y="300" font-size="15" fill="#5A6675">Rebuild tensors on demand</text>
    <text x="954" y="322" font-size="15" fill="#5A6675">instead of storing them.</text>
    <text x="954" y="358" font-size="14" font-weight="bold" fill="#0E9E8F">+ low peak memory</text>
    <text x="954" y="382" font-size="14" font-weight="bold" fill="#E4572E">− extra compute time</text>
  </g>

  <g id="cue_s02_c4_hard_combinatorial_optimization_gene">
    <title>hard combinatorial optimization general pspace-complete</title>
    <desc>This is a hard combinatorial optimization, in general PSPACE-complete.</desc>
    <rect x="660" y="450" width="540" height="188" rx="12" fill="#12172A"/>
    <text x="688" y="490" font-size="15" font-weight="bold" letter-spacing="1" fill="#7CA0EC">WHY IT IS HARD</text>
    <text x="688" y="540" font-size="40" font-weight="bold" fill="#FFFFFF">PSPACE-complete</text>
    <text x="688" y="578" font-size="16" fill="#C7CFDA">A hard combinatorial optimization in general —</text>
    <text x="688" y="600" font-size="16" fill="#C7CFDA">the search space explodes with graph size, so</text>
    <text x="688" y="622" font-size="16" fill="#C7CFDA">brute force is hopeless on real models.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">02 / 10</text>
  </g>
</svg>
