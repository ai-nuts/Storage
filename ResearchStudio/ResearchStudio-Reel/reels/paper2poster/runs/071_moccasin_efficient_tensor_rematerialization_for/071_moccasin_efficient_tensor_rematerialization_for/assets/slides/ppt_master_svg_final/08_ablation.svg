<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">08 · ABLATION STUDY</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">What the key knobs do</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s08_c1_studies_few_key_knobs">
    <title>paper studies few key knobs</title>
    <desc>The paper studies a few key knobs.</desc>
    <rect x="80" y="182" width="1120" height="70" rx="12" fill="#F3F5FA"/>
    <rect x="80" y="182" width="6" height="70" rx="3" fill="#2453D6"/>
    <text x="112" y="225" font-size="18" font-weight="bold" fill="#12172A">The paper studies a few key knobs — the topological-ordering option, the interval budget C, and the variable-count complexity.</text>
  </g>

  <g id="cue_s08_c2_most_important_optional_topological">
    <title>most important optional topological-ordering restriction enforcing input ordering enlarges variable domain slightly shrinks overall search space reducing solve time compared fully unrestricted formulation</title>
    <desc>The most important is the optional topological-ordering restriction: enforcing an input ordering enlarges the variable domain slightly but shrinks the overall search space, reducing solve time compared to the fully unrestricted formulation.</desc>
    <rect x="80" y="268" width="552" height="202" rx="12" fill="#E1F3F0" stroke="#B7E2DA" stroke-width="1"/>
    <rect x="80" y="268" width="6" height="202" rx="3" fill="#0E9E8F"/>
    <text x="108" y="302" font-size="19" font-weight="bold" fill="#12172A">Topological-ordering restriction</text>
    <text x="108" y="334" font-size="16" fill="#5A6675">Enforcing an input ordering trades a slightly</text>
    <text x="108" y="356" font-size="16" fill="#5A6675">larger variable domain for a much smaller</text>
    <text x="108" y="378" font-size="16" fill="#5A6675">search space.</text>
    <rect x="108" y="396" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#B7E2DA" stroke-width="1"/>
    <text x="223" y="420" font-size="14" fill="#5A6675" text-anchor="middle">domain</text>
    <text x="223" y="442" font-size="17" font-weight="bold" fill="#E4572E" text-anchor="middle">slightly larger</text>
    <rect x="350" y="396" width="254" height="56" rx="8" fill="#FFFFFF" stroke="#B7E2DA" stroke-width="1"/>
    <text x="477" y="420" font-size="14" fill="#5A6675" text-anchor="middle">search space + solve time</text>
    <text x="477" y="442" font-size="17" font-weight="bold" fill="#0E9E8F" text-anchor="middle">smaller / faster</text>
  </g>

  <g id="cue_s08_c3_per_node_interval_budget_called_fixe">
    <title>per-node interval budget called c fixed at two throughout experiments authors note every plot legend</title>
    <desc>The per-node interval budget, called C, is fixed at two throughout the experiments, which the authors note in every plot legend.</desc>
    <rect x="660" y="268" width="540" height="202" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="660" y="268" width="6" height="202" rx="3" fill="#2453D6"/>
    <text x="688" y="302" font-size="19" font-weight="bold" fill="#12172A">Interval budget C</text>
    <text x="688" y="334" font-size="16" fill="#5A6675">The per-node interval budget C is held fixed</text>
    <text x="688" y="356" font-size="16" fill="#5A6675">across every experiment (noted in each legend).</text>
    <rect x="688" y="378" width="484" height="74" rx="8" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <text x="740" y="428" font-size="40" font-weight="bold" fill="#2453D6">C = 2</text>
    <text x="860" y="414" font-size="16" fill="#5A6675">two retention intervals</text>
    <text x="860" y="436" font-size="16" fill="#5A6675">allowed per node</text>
  </g>

  <g id="cue_s08_c4_complexity_table_makes_contrast_conc">
    <title>complexity table makes contrast concrete checkmate boolean variable count grows quadratically number nodes plus node-edge term moccasin integer variable count grows only linearly number nodes constant factor c</title>
    <desc>The complexity table makes the contrast concrete: Checkmate's Boolean variable count grows quadratically in the number of nodes plus a node-edge term, while Moccasin's integer variable count grows only linearly in the number of nodes, with a constant factor C.</desc>
    <rect x="80" y="486" width="1120" height="152" rx="12" fill="#12172A"/>
    <text x="112" y="522" font-size="15" font-weight="bold" letter-spacing="1" fill="#7CA0EC">VARIABLE-COUNT COMPLEXITY</text>
    <rect x="112" y="536" width="530" height="86" rx="8" fill="#1E2740"/>
    <text x="136" y="568" font-size="17" font-weight="bold" fill="#F2A488">Checkmate</text>
    <text x="136" y="600" font-size="24" font-weight="bold" fill="#FFFFFF">O(n² + n·e) Booleans</text>
    <rect x="658" y="536" width="530" height="86" rx="8" fill="#1E2740"/>
    <text x="682" y="568" font-size="17" font-weight="bold" fill="#7CA0EC">Moccasin</text>
    <text x="682" y="600" font-size="24" font-weight="bold" fill="#FFFFFF">O(C·n) integers</text>
    <text x="1100" y="600" font-size="15" fill="#C7CFDA" text-anchor="end">C = 2</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">08 / 10</text>
  </g>
</svg>
