<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="86" width="46" height="4" fill="#2453D6"/>
    <text x="138" y="94" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">10 · TAKEAWAY</text>
  </g>

  <g id="cue_s10_c1_lasting_takeaway_right_problem_formu">
    <title>lasting takeaway right problem formulation changes what is tractable</title>
    <desc>The lasting takeaway is that the right problem formulation changes what is tractable.</desc>
    <text x="78" y="220" font-size="52" font-weight="bold" fill="#12172A">The right formulation</text>
    <text x="78" y="284" font-size="52" font-weight="bold" fill="#2453D6">changes what is tractable.</text>
    <rect x="82" y="322" width="520" height="120" rx="12" fill="#F3F5FA"/>
    <text x="108" y="360" font-size="17" fill="#5A6675">Moccasin does not use a faster solver or a</text>
    <text x="108" y="384" font-size="17" fill="#5A6675">bigger machine — it re-expresses the same</text>
    <text x="108" y="408" font-size="17" fill="#5A6675">rematerialization problem so that a standard CP</text>
    <text x="108" y="432" font-size="17" fill="#5A6675">solver can reach far larger graphs.</text>
  </g>

  <g id="cue_s10_c2_expressing_rematerialization_decisio">
    <title>expressing rematerialization decisions small set retention intervals constraint program moccasin reduces number discrete variables quadratic linear graph size</title>
    <desc>By expressing rematerialization decisions as a small set of retention intervals in a constraint program, Moccasin reduces the number of discrete variables from quadratic to linear in the graph size.</desc>
    <rect x="648" y="150" width="552" height="150" rx="12" fill="#FFFFFF" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="648" y="150" width="6" height="150" rx="3" fill="#2453D6"/>
    <text x="680" y="188" font-size="19" font-weight="bold" fill="#12172A">One change: retention intervals</text>
    <text x="680" y="222" font-size="16" fill="#5A6675">Expressing decisions as a small set of retention</text>
    <text x="680" y="244" font-size="16" fill="#5A6675">intervals in a constraint program reduces</text>
    <text x="680" y="266" font-size="16" fill="#5A6675">discrete variables</text>
    <text x="866" y="266" font-size="16" font-weight="bold" fill="#2453D6">from quadratic to linear.</text>
  </g>

  <g id="cue_s10_c3_single_change_lets_scale_compute">
    <title>single change lets scale compute graphs far larger prior methods could handle solving up to ten times faster keeping added runtime overhead under five percent</title>
    <desc>That single change lets it scale to compute graphs far larger than prior methods could handle, solving them up to ten times faster while keeping the added runtime overhead under five percent.</desc>
    <rect x="648" y="316" width="552" height="150" rx="12" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <rect x="648" y="316" width="6" height="150" rx="3" fill="#2453D6"/>
    <text x="680" y="354" font-size="19" font-weight="bold" fill="#12172A">Bigger graphs, faster, cheap overhead</text>
    <rect x="680" y="372" width="150" height="72" rx="8" fill="#FFFFFF"/>
    <text x="755" y="410" font-size="26" font-weight="bold" fill="#2453D6" text-anchor="middle">~10×</text>
    <text x="755" y="432" font-size="13" fill="#5A6675" text-anchor="middle">faster solve</text>
    <rect x="844" y="372" width="150" height="72" rx="8" fill="#FFFFFF"/>
    <text x="919" y="410" font-size="26" font-weight="bold" fill="#0E9E8F" text-anchor="middle">&lt; 5%</text>
    <text x="919" y="432" font-size="13" fill="#5A6675" text-anchor="middle">added runtime</text>
    <rect x="1008" y="372" width="160" height="72" rx="8" fill="#FFFFFF"/>
    <text x="1088" y="410" font-size="26" font-weight="bold" fill="#2453D6" text-anchor="middle">1,000</text>
    <text x="1088" y="432" font-size="13" fill="#5A6675" text-anchor="middle">nodes reached</text>
  </g>

  <g id="cue_s10_c4_because_output_just_execution_sequen">
    <title>because output just execution sequence resulting schedule can run any cpu gpu</title>
    <desc>And because the output is just an execution sequence, the resulting schedule can run on any CPU or GPU.</desc>
    <rect x="648" y="482" width="552" height="150" rx="12" fill="#12172A"/>
    <rect x="648" y="482" width="6" height="150" rx="3" fill="#0E9E8F"/>
    <text x="680" y="520" font-size="19" font-weight="bold" fill="#FFFFFF">Portable output</text>
    <text x="680" y="554" font-size="16" fill="#C7CFDA">The result is just an execution sequence, so the</text>
    <text x="680" y="576" font-size="16" fill="#C7CFDA">schedule can run on</text>
    <rect x="680" y="592" width="150" height="30" rx="6" fill="#1E2740"/>
    <text x="755" y="613" font-size="15" font-weight="bold" fill="#7CA0EC" text-anchor="middle">any CPU</text>
    <rect x="844" y="592" width="150" height="30" rx="6" fill="#1E2740"/>
    <text x="919" y="613" font-size="15" font-weight="bold" fill="#0E9E8F" text-anchor="middle">or GPU</text>
  </g>

  <!-- footer -->
  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023 · arxiv.org/abs/2304.14463</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">10 / 10</text>
  </g>
</svg>
