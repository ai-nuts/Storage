<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', sans-serif">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="deco_head">
    <rect x="80" y="62" width="40" height="4" fill="#2453D6"/>
    <text x="132" y="72" font-size="14" font-weight="bold" letter-spacing="2" fill="#2453D6">03 · MOTIVATION</text>
    <text x="80" y="120" font-size="33" font-weight="bold" fill="#12172A">Prior art hits a quadratic wall</text>
    <line x1="80" y1="150" x2="1200" y2="150" stroke="#E2E7EF" stroke-width="1"/>
  </g>

  <g id="cue_s03_c1_leading_prior_method_checkmate_casts">
    <title>leading prior method checkmate casts rematerialization mixed-integer linear program milp</title>
    <desc>The leading prior method, Checkmate, casts rematerialization as a mixed-integer linear program.</desc>
    <rect x="80" y="182" width="520" height="130" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <rect x="80" y="182" width="6" height="130" rx="3" fill="#8A97A8"/>
    <text x="108" y="216" font-size="19" font-weight="bold" fill="#12172A">Baseline: Checkmate</text>
    <text x="108" y="248" font-size="16" fill="#5A6675">The leading prior method casts rematerialization</text>
    <text x="108" y="270" font-size="16" fill="#5A6675">as a mixed-integer linear program (MILP) —</text>
    <text x="108" y="292" font-size="16" fill="#5A6675">expressive and general.</text>
  </g>

  <g id="cue_s03_c2_expressive_but_its_number_boolean">
    <title>expressive but number boolean decision variables grows square number nodes graph quadratic</title>
    <desc>It is expressive, but its number of Boolean decision variables grows with the square of the number of nodes in the graph.</desc>
    <rect x="80" y="328" width="520" height="146" rx="12" fill="#FBE9E2" stroke="#F2C6B4" stroke-width="1"/>
    <rect x="80" y="328" width="6" height="146" rx="3" fill="#E4572E"/>
    <text x="108" y="362" font-size="19" font-weight="bold" fill="#12172A">Boolean variables blow up</text>
    <text x="108" y="396" font-size="30" font-weight="bold" fill="#E4572E">O(n²) Booleans</text>
    <text x="380" y="392" font-size="15" fill="#5A6675">grows with the square</text>
    <text x="380" y="412" font-size="15" fill="#5A6675">of the node count n.</text>
    <text x="108" y="448" font-size="16" fill="#5A6675">More nodes means quadratically more decisions.</text>
  </g>

  <g id="cue_s03_c4_because_trend_toward_on_device_stric">
    <title>because trend toward on-device training stricter latency targets keeps enlarging graphs need formulation complexity grows slowly acceptable compile time</title>
    <desc>Because the trend toward on-device training and stricter latency targets keeps enlarging these graphs, we need a formulation whose complexity grows much more slowly, so realistic graphs can be solved within an acceptable compile time.</desc>
    <rect x="80" y="490" width="520" height="148" rx="12" fill="#E7EEFF" stroke="#C6D6FB" stroke-width="1"/>
    <rect x="80" y="490" width="6" height="148" rx="3" fill="#2453D6"/>
    <text x="108" y="524" font-size="19" font-weight="bold" fill="#2453D6">The graphs keep growing</text>
    <text x="108" y="556" font-size="16" fill="#5A6675">On-device training and stricter latency targets</text>
    <text x="108" y="578" font-size="16" fill="#5A6675">keep enlarging compute graphs. We need a</text>
    <text x="108" y="600" font-size="16" fill="#5A6675">formulation whose complexity grows much more</text>
    <text x="108" y="622" font-size="16" fill="#5A6675">slowly to stay within an acceptable compile time.</text>
  </g>

  <g id="cue_s03_c3_quadratic_growth_becomes_wall_graphs">
    <title>quadratic growth becomes wall graphs few hundred nodes few thousand edges checkmate times out runs out memory solve</title>
    <desc>That quadratic growth becomes a wall: for graphs with a few hundred nodes and a few thousand edges, Checkmate either times out or runs out of memory during the solve.</desc>
    <rect x="640" y="182" width="560" height="456" rx="12" fill="#F7F9FC" stroke="#E2E7EF" stroke-width="1"/>
    <text x="668" y="214" font-size="15" font-weight="bold" letter-spacing="1" fill="#5A6675">BOOLEAN VARIABLES vs GRAPH SIZE</text>
    <!-- axes -->
    <line x1="704" y1="560" x2="1160" y2="560" stroke="#C6CED9" stroke-width="1.5"/>
    <line x1="704" y1="250" x2="704" y2="560" stroke="#C6CED9" stroke-width="1.5"/>
    <text x="932" y="600" font-size="14" fill="#5A6675" text-anchor="middle">number of nodes  →</text>
    <text x="686" y="405" font-size="14" fill="#5A6675" text-anchor="middle" transform="rotate(-90 686 405)">variables  →</text>
    <!-- quadratic curve for Checkmate -->
    <path d="M704 556 Q980 548 1044 430 T1120 262" fill="none" stroke="#E4572E" stroke-width="4"/>
    <text x="1088" y="300" font-size="15" font-weight="bold" fill="#E4572E" text-anchor="end">Checkmate O(n²)</text>
    <!-- linear reference for Moccasin -->
    <line x1="704" y1="556" x2="1150" y2="512" stroke="#2453D6" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="1150" y="500" font-size="15" font-weight="bold" fill="#2453D6" text-anchor="end">Moccasin O(n)</text>
    <!-- wall -->
    <line x1="1008" y1="250" x2="1008" y2="560" stroke="#12172A" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="1012" y="330" width="140" height="86" rx="8" fill="#12172A"/>
    <text x="1082" y="360" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">the wall</text>
    <text x="1082" y="382" font-size="12" fill="#C7CFDA" text-anchor="middle">few hundred nodes,</text>
    <text x="1082" y="400" font-size="12" fill="#C7CFDA" text-anchor="middle">few thousand edges</text>
    <text x="704" y="628" font-size="15" fill="#5A6675">Beyond the wall, Checkmate times out or runs out of memory during the solve.</text>
  </g>

  <g id="deco_footer">
    <text x="80" y="700" font-size="12" fill="#8A97A8">Moccasin · ICML 2023</text>
    <text x="1200" y="700" font-size="12" fill="#8A97A8" text-anchor="end">03 / 10</text>
  </g>
</svg>
