<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#37D3A6"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">07 · KEY RESULTS</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">A new zero-shot state of the art</text>
  </g>

  <g id="cue_s07_c1_results_striking_label_free_method" data-cue-label="results striking for a label-free method">
    <title>the results are striking for a label-free method that uses no labels at all</title>
    <rect x="64" y="150" width="1150" height="86" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="150" width="6" height="86" rx="3" fill="#37D3A6"/>
    <text x="94" y="203" font-size="22" font-weight="bold" fill="#FFFFFF">Striking results for a method that uses no labels at all</text>
  </g>

  <g id="cue_s07_c2_mvtec_musc_reaches_ninety_seven_poin" data-cue-label="on mvtec ad musc reaches ninety-seven point eight percent image auroc plus twenty-one points per-region overlap">
    <title>on mvtec ad musc reaches ninety-seven point eight percent image auroc and lifts per-region overlap by over twenty-one points</title>
    <rect x="64" y="256" width="370" height="402" rx="14" fill="#172236" stroke="#2B3B57"/>
    <text x="92" y="300" font-size="22" font-weight="bold" fill="#4DA3FF">MVTec AD</text>
    <text x="92" y="378" font-size="56" font-weight="bold" fill="#37D3A6">97.8%</text>
    <text x="92" y="410" font-size="19" fill="#93A4BD">image-level AUROC</text>
    <line x1="92" y1="446" x2="406" y2="446" stroke="#2B3B57" stroke-width="1.5"/>
    <text x="92" y="512" font-size="40" font-weight="bold" fill="#FFB454">+21 pts</text>
    <text x="92" y="548" font-size="19" fill="#DBE4F0">per-region overlap for</text>
    <text x="92" y="574" font-size="19" fill="#DBE4F0">segmentation, over the</text>
    <text x="92" y="600" font-size="19" fill="#DBE4F0">best prior zero-shot method.</text>
  </g>

  <g id="cue_s07_c3_visa_gains_over_ten_points" data-cue-label="on visa musc gains over ten points in both tasks">
    <title>on visa musc gains over ten points in both classification and segmentation</title>
    <rect x="454" y="256" width="370" height="402" rx="14" fill="#172236" stroke="#2B3B57"/>
    <text x="482" y="300" font-size="22" font-weight="bold" fill="#37D3A6">VisA</text>
    <text x="482" y="378" font-size="56" font-weight="bold" fill="#37D3A6">+10 pts</text>
    <text x="482" y="410" font-size="19" fill="#93A4BD">over the best zero-shot</text>
    <line x1="482" y1="446" x2="796" y2="446" stroke="#2B3B57" stroke-width="1.5"/>
    <text x="482" y="500" font-size="19" fill="#DBE4F0">Gained in both</text>
    <text x="482" y="526" font-size="19" fill="#DBE4F0">classification and</text>
    <text x="482" y="552" font-size="19" fill="#DBE4F0">segmentation — a large</text>
    <text x="482" y="578" font-size="19" fill="#DBE4F0">jump on a harder</text>
    <text x="482" y="604" font-size="19" fill="#DBE4F0">benchmark.</text>
  </g>

  <g id="cue_s07_c4_even_beats_most_four_shot_methods" data-cue-label="even beats most four-shot methods and rivals full-shot approaches">
    <title>it even beats most four-shot methods outperforms a thirty-two-shot baseline and rivals full-shot approaches</title>
    <rect x="844" y="256" width="370" height="402" rx="14" fill="#172236" stroke="#2B3B57"/>
    <text x="872" y="300" font-size="22" font-weight="bold" fill="#FFB454">Few-shot free</text>
    <text x="872" y="360" font-size="19" fill="#DBE4F0">With zero reference images,</text>
    <text x="872" y="386" font-size="19" fill="#DBE4F0">MuSc still:</text>
    <text x="872" y="440" font-size="20" font-weight="bold" fill="#FFFFFF">• beats most 4-shot methods</text>
    <text x="872" y="486" font-size="20" font-weight="bold" fill="#FFFFFF">• outperforms a 32-shot</text>
    <text x="900" y="512" font-size="20" font-weight="bold" fill="#FFFFFF">baseline</text>
    <text x="872" y="558" font-size="20" font-weight="bold" fill="#FFFFFF">• rivals full-shot methods</text>
    <text x="900" y="584" font-size="19" fill="#DBE4F0">that use the entire normal</text>
    <text x="900" y="610" font-size="19" fill="#DBE4F0">training set.</text>
  </g>
</svg>
