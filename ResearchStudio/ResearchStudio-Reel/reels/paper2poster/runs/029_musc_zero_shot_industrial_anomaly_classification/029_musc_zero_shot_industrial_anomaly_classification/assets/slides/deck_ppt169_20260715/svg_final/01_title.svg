  <!-- Three cue anchor cards -->
  <g id="cue_s01_c1_musc_zero_shot_method_industrial_ano" data-cue-label="musc zero-shot method industrial anomaly detection segmentation no prompts normal reference images">
    <title>musc zero-shot method industrial anomaly detection segmentation no training prompts reference images</title>
    <rect x="64" y="500" width="368" height="164" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="500" width="6" height="164" rx="3" fill="#4DA3FF"/>
    <text x="92" y="546" font-size="22" font-weight="bold" fill="#FFFFFF">Training-free method</text>
    <text x="92" y="586" font-size="18" fill="#DBE4F0">No training, no prompts, and</text>
    <text x="92" y="612" font-size="18" fill="#DBE4F0">no normal reference images.</text>
  </g>
  <g id="cue_s01_c2_its_insight_unlabeled_test_images" data-cue-label="its insight unlabeled test images hold enough cues score one another">
