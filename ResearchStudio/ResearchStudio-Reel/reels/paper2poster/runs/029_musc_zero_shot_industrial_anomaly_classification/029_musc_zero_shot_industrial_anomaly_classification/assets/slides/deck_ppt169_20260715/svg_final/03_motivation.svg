<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#37D3A6"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">03 · MOTIVATION</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">A signal already hiding in the test set</text>
  </g>

  <g id="cue_s03_c1_authors_make_simple_observation" data-cue-label="the authors make a simple observation">
    <title>the authors make a simple observation about unlabeled test images</title>
    <rect x="64" y="150" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="150" width="6" height="250" rx="3" fill="#37D3A6"/>
    <text x="94" y="200" font-size="22" font-weight="bold" fill="#FFFFFF">A simple observation</text>
    <text x="94" y="252" font-size="19" fill="#DBE4F0">The unlabeled test images themselves</text>
    <text x="94" y="282" font-size="19" fill="#DBE4F0">already carry the normal and abnormal</text>
    <text x="94" y="312" font-size="19" fill="#DBE4F0">cues we need — no extra data required.</text>
  </g>

  <g id="cue_s03_c2_batch_unlabeled_test_images_one" data-cue-label="batch of unlabeled test images of one product normal patch finds many similar patches">
    <title>batch of unlabeled test images of one product a normal patch finds many similar patches</title>
    <rect x="656" y="150" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="656" y="150" width="6" height="250" rx="3" fill="#4DA3FF"/>
    <text x="686" y="200" font-size="22" font-weight="bold" fill="#FFFFFF">Normal appearance repeats</text>
    <text x="686" y="252" font-size="19" fill="#DBE4F0">In a batch of one product, a normal</text>
    <text x="686" y="282" font-size="19" fill="#DBE4F0">patch finds many similar patches</text>
    <text x="686" y="312" font-size="19" fill="#DBE4F0">across the other test images.</text>
  </g>

  <g id="cue_s03_c3_abnormal_patch_finds_only_few" data-cue-label="abnormal patch finds only a few matches since defects are rare">
    <title>an abnormal patch finds only a few matches since defects are rare and idiosyncratic</title>
    <rect x="64" y="418" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="418" width="6" height="250" rx="3" fill="#FF6B6B"/>
    <text x="94" y="468" font-size="22" font-weight="bold" fill="#FFFFFF">Anomalies are rare</text>
    <text x="94" y="520" font-size="19" fill="#DBE4F0">An abnormal patch, by contrast, finds</text>
    <text x="94" y="550" font-size="19" fill="#DBE4F0">only a few matches — defects are rare</text>
    <text x="94" y="580" font-size="19" fill="#DBE4F0">and idiosyncratic across the batch.</text>
  </g>

  <g id="cue_s03_c4_asymmetry_signal_already_inside_test" data-cue-label="that asymmetry is a signal already inside the test set">
    <title>that asymmetry is a discriminative signal already sitting inside the test set</title>
    <rect x="656" y="418" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="656" y="418" width="6" height="250" rx="3" fill="#37D3A6"/>
    <text x="686" y="468" font-size="22" font-weight="bold" fill="#FFFFFF">Free supervision</text>
    <text x="686" y="520" font-size="19" fill="#DBE4F0">That match asymmetry is a discriminative</text>
    <text x="686" y="550" font-size="19" fill="#DBE4F0">signal already sitting inside the test</text>
    <text x="686" y="580" font-size="19" fill="#DBE4F0">set — usable with no labels at all.</text>
  </g>
</svg>
