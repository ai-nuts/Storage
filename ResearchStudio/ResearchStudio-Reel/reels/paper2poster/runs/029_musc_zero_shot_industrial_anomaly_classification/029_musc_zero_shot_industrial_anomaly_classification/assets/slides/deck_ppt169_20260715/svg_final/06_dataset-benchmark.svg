<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#37D3A6"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">06 · BENCHMARKS</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">Evaluated on MVTec AD and VisA</text>
  </g>

  <g id="cue_s06_c1_musc_evaluated_two_most_used_industr" data-cue-label="musc evaluated on the two most-used industrial benchmarks">
    <title>musc is evaluated on the two most-used industrial anomaly benchmarks</title>
    <rect x="64" y="150" width="1150" height="96" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="150" width="6" height="96" rx="3" fill="#37D3A6"/>
    <text x="94" y="192" font-size="22" font-weight="bold" fill="#FFFFFF">Two standard industrial benchmarks</text>
    <text x="94" y="224" font-size="19" fill="#DBE4F0">Both benchmarks mix normal and defective test images, at the image and pixel level.</text>
  </g>

  <g id="cue_s06_c2_mvtec_spans_fifteen_categories_ten" data-cue-label="mvtec ad spans fifteen categories ten objects and five textures">
    <title>mvtec ad spans fifteen categories ten objects and five textures at high resolution</title>
    <rect x="64" y="262" width="566" height="230" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="262" width="6" height="230" rx="3" fill="#4DA3FF"/>
    <text x="94" y="312" font-size="26" font-weight="bold" fill="#4DA3FF">MVTec AD</text>
    <text x="94" y="360" font-size="20" fill="#DBE4F0">15 categories — 10 objects and</text>
    <text x="94" y="392" font-size="20" fill="#DBE4F0">5 textures.</text>
    <text x="94" y="440" font-size="20" fill="#DBE4F0">High-resolution industrial images.</text>
  </g>

  <g id="cue_s06_c3_visa_covers_twelve_object_categories" data-cue-label="visa covers twelve object categories across three domains">
    <title>visa covers twelve object categories across three domains</title>
    <rect x="648" y="262" width="566" height="230" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="648" y="262" width="6" height="230" rx="3" fill="#37D3A6"/>
    <text x="678" y="312" font-size="26" font-weight="bold" fill="#37D3A6">VisA</text>
    <text x="678" y="360" font-size="20" fill="#DBE4F0">12 object categories.</text>
    <text x="678" y="392" font-size="20" fill="#DBE4F0">Spread across three domains.</text>
    <text x="678" y="440" font-size="20" fill="#DBE4F0">Normal and anomalous test sets.</text>
  </g>

  <g id="cue_s06_c4_classification_auroc_f1_max_segmenta" data-cue-label="classification auroc f1-max segmentation adds pixel-level metrics per-region overlap">
    <title>classification uses auroc and f1-max segmentation adds pixel-level metrics and per-region overlap</title>
    <rect x="64" y="508" width="1150" height="150" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="508" width="6" height="150" rx="3" fill="#FFB454"/>
    <text x="94" y="552" font-size="22" font-weight="bold" fill="#FFFFFF">Metrics</text>
    <text x="94" y="592" font-size="19" fill="#DBE4F0">Classification is scored with AUROC, average precision, and F1-max.</text>
    <text x="94" y="624" font-size="19" fill="#DBE4F0">Segmentation adds pixel-level AUROC, F1-max, AP, and per-region overlap (PRO).</text>
  </g>
</svg>
