<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#4DA3FF"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">04 · CONTRIBUTION</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">A three-part zero-shot pipeline</text>
  </g>

  <g id="cue_s04_c1_musc_training_free_prompt_free_pipel" data-cue-label="musc training-free prompt-free pipeline built from three pieces">
    <title>musc is a training-free prompt-free pipeline built from three pieces</title>
    <rect x="64" y="150" width="1150" height="108" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="150" width="6" height="108" rx="3" fill="#37D3A6"/>
    <text x="94" y="196" font-size="22" font-weight="bold" fill="#FFFFFF">Training-free and prompt-free</text>
    <text x="94" y="230" font-size="19" fill="#DBE4F0">MuSc is assembled from three modules — needing no training, no prompts, and no reference images.</text>
  </g>

  <g id="cue_s04_c2_first_local_neighborhood_aggregation" data-cue-label="first local neighborhood aggregation multiple degrees representing each patch several scales">
    <title>first local neighborhood aggregation with multiple degrees representing each patch at several scales</title>
    <rect x="64" y="284" width="370" height="384" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="284" width="370" height="60" rx="14" fill="#1C2942"/>
    <text x="92" y="323" font-size="24" font-weight="bold" fill="#4DA3FF">1 · LNAMD</text>
    <text x="92" y="392" font-size="20" font-weight="bold" fill="#FFFFFF">Local neighborhood</text>
    <text x="92" y="418" font-size="20" font-weight="bold" fill="#FFFFFF">aggregation</text>
    <text x="92" y="466" font-size="19" fill="#DBE4F0">Aggregates patches at</text>
    <text x="92" y="492" font-size="19" fill="#DBE4F0">multiple degrees, so each</text>
    <text x="92" y="518" font-size="19" fill="#DBE4F0">patch is represented at</text>
    <text x="92" y="544" font-size="19" fill="#DBE4F0">several spatial scales —</text>
    <text x="92" y="570" font-size="19" fill="#DBE4F0">tiny and large defects alike.</text>
  </g>

  <g id="cue_s04_c3_second_mutual_scoring_where_every" data-cue-label="second mutual scoring where every test image scores every other">
    <title>second the mutual scoring mechanism where every test image scores every other image</title>
    <rect x="454" y="284" width="370" height="384" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="454" y="284" width="370" height="60" rx="14" fill="#1C2942"/>
    <text x="482" y="323" font-size="24" font-weight="bold" fill="#37D3A6">2 · MSM</text>
    <text x="482" y="392" font-size="20" font-weight="bold" fill="#FFFFFF">Mutual scoring</text>
    <text x="482" y="418" font-size="20" font-weight="bold" fill="#FFFFFF">mechanism</text>
    <text x="482" y="466" font-size="19" fill="#DBE4F0">Every unlabeled test image</text>
    <text x="482" y="492" font-size="19" fill="#DBE4F0">assigns anomaly scores to</text>
    <text x="482" y="518" font-size="19" fill="#DBE4F0">every other image, turning</text>
    <text x="482" y="544" font-size="19" fill="#DBE4F0">the batch into its own</text>
    <text x="482" y="570" font-size="19" fill="#DBE4F0">supervision signal.</text>
  </g>

  <g id="cue_s04_c4_third_re_scoring_constrained_image_l" data-cue-label="third re-scoring with constrained image-level neighborhood cleans final decision">
    <title>third re-scoring with a constrained image-level neighborhood cleans the final decision</title>
    <rect x="844" y="284" width="370" height="384" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="844" y="284" width="370" height="60" rx="14" fill="#1C2942"/>
    <text x="872" y="323" font-size="24" font-weight="bold" fill="#FFB454">3 · RsCIN</text>
    <text x="872" y="392" font-size="20" font-weight="bold" fill="#FFFFFF">Re-scoring with a</text>
    <text x="872" y="418" font-size="20" font-weight="bold" fill="#FFFFFF">constrained neighborhood</text>
    <text x="872" y="466" font-size="19" fill="#DBE4F0">Refines the image-level</text>
    <text x="872" y="492" font-size="19" fill="#DBE4F0">decision — and drops into</text>
    <text x="872" y="518" font-size="19" fill="#DBE4F0">existing methods as a</text>
    <text x="872" y="544" font-size="19" fill="#DBE4F0">plug-in that boosts them</text>
    <text x="872" y="570" font-size="19" fill="#DBE4F0">too.</text>
  </g>
</svg>
