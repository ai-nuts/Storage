<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#4DA3FF"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">05 · METHOD</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">Frozen ViT → mutual scoring → re-scoring</text>
  </g>

  <g id="flow_arrows">
    <polygon points="331,398 349,410 331,422" fill="#4DA3FF"/>
    <polygon points="625,398 643,410 625,422" fill="#37D3A6"/>
    <polygon points="919,398 937,410 919,422" fill="#FFB454"/>
  </g>

  <g id="cue_s05_c1_backbone_frozen_vision_transformer" data-cue-label="the backbone is a frozen vision transformer">
    <title>the backbone is a frozen vision transformer with no fine-tuning</title>
    <rect x="64" y="176" width="260" height="452" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="176" width="260" height="56" rx="14" fill="#1C2942"/>
    <text x="88" y="212" font-size="21" font-weight="bold" fill="#4DA3FF">Frozen ViT</text>
    <text x="88" y="284" font-size="18" fill="#DBE4F0">A pretrained vision</text>
    <text x="88" y="310" font-size="18" fill="#DBE4F0">transformer backbone,</text>
    <text x="88" y="336" font-size="18" fill="#DBE4F0">used frozen with no</text>
    <text x="88" y="362" font-size="18" fill="#DBE4F0">fine-tuning at all.</text>
  </g>

  <g id="cue_s05_c2_patch_tokens_several_stages_aggregat" data-cue-label="patch tokens several stages aggregated multiple neighborhood degrees defect sizes">
    <title>patch tokens from several stages are aggregated at multiple neighborhood degrees to represent defect sizes</title>
    <rect x="358" y="176" width="260" height="452" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="358" y="176" width="260" height="56" rx="14" fill="#1C2942"/>
    <text x="382" y="212" font-size="21" font-weight="bold" fill="#4DA3FF">LNAMD</text>
    <text x="382" y="284" font-size="18" fill="#DBE4F0">Patch tokens from</text>
    <text x="382" y="310" font-size="18" fill="#DBE4F0">several stages are</text>
    <text x="382" y="336" font-size="18" fill="#DBE4F0">aggregated at multiple</text>
    <text x="382" y="362" font-size="18" fill="#DBE4F0">degrees, to represent</text>
    <text x="382" y="388" font-size="18" fill="#DBE4F0">every defect size.</text>
  </g>

  <g id="cue_s05_c3_mutual_scoring_patch_scored_its" data-cue-label="mutual scoring each patch scored by its nearest match in every other image smallest interval averaged">
    <title>in mutual scoring each patch is scored by its nearest match in every other image only the smallest interval averaged</title>
    <rect x="652" y="176" width="260" height="452" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="652" y="176" width="260" height="56" rx="14" fill="#1C2942"/>
    <text x="676" y="212" font-size="21" font-weight="bold" fill="#37D3A6">Mutual scoring</text>
    <text x="676" y="284" font-size="18" fill="#DBE4F0">Each patch is scored</text>
    <text x="676" y="310" font-size="18" fill="#DBE4F0">by its nearest match</text>
    <text x="676" y="336" font-size="18" fill="#DBE4F0">in every other image;</text>
    <text x="676" y="362" font-size="18" fill="#DBE4F0">only the smallest score</text>
    <text x="676" y="388" font-size="18" fill="#DBE4F0">interval is averaged,</text>
    <text x="676" y="414" font-size="18" fill="#DBE4F0">sharpening the gap.</text>
  </g>

  <g id="cue_s05_c4_image_score_refined_constrained_neig" data-cue-label="image score refined with constrained neighborhood graph on class tokens">
    <title>the image score is refined with a constrained neighborhood graph on the class tokens</title>
    <rect x="946" y="176" width="260" height="452" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="946" y="176" width="260" height="56" rx="14" fill="#1C2942"/>
    <text x="970" y="212" font-size="21" font-weight="bold" fill="#FFB454">RsCIN refine</text>
    <text x="970" y="284" font-size="18" fill="#DBE4F0">The image score is</text>
    <text x="970" y="310" font-size="18" fill="#DBE4F0">refined with a</text>
    <text x="970" y="336" font-size="18" fill="#DBE4F0">constrained neighbor-</text>
    <text x="970" y="362" font-size="18" fill="#DBE4F0">hood graph built on</text>
    <text x="970" y="388" font-size="18" fill="#DBE4F0">the class tokens.</text>
  </g>
</svg>
