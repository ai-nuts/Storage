<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#4DA3FF"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">08 · ABLATIONS</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">Every design choice earns its place</text>
  </g>

  <g id="cue_s08_c1_ablations_confirm_choice" data-cue-label="ablations confirm each design choice">
    <title>ablations confirm each design choice in musc</title>
    <rect x="64" y="150" width="1150" height="86" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="150" width="6" height="86" rx="3" fill="#4DA3FF"/>
    <text x="94" y="203" font-size="22" font-weight="bold" fill="#FFFFFF">Ablations confirm each design choice pays off</text>
  </g>

  <g id="cue_s08_c2_combining_three_aggregation_degrees" data-cue-label="combining three aggregation degrees works best small neighborhoods catch tiny defects">
    <title>combining three aggregation degrees works best small neighborhoods catch tiny defects large ones catch big defects</title>
    <rect x="64" y="256" width="370" height="402" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="256" width="370" height="56" rx="14" fill="#1C2942"/>
    <text x="92" y="292" font-size="21" font-weight="bold" fill="#4DA3FF">Three degrees</text>
    <text x="92" y="360" font-size="19" fill="#DBE4F0">Combining three aggregation</text>
    <text x="92" y="386" font-size="19" fill="#DBE4F0">degrees works best.</text>
    <text x="92" y="440" font-size="19" fill="#DBE4F0">Small neighborhoods catch</text>
    <text x="92" y="466" font-size="19" fill="#DBE4F0">tiny VisA defects; large ones</text>
    <text x="92" y="492" font-size="19" fill="#DBE4F0">catch big MVTec defects.</text>
    <text x="92" y="546" font-size="19" fill="#93A4BD">One scale never fits all</text>
    <text x="92" y="572" font-size="19" fill="#93A4BD">defect sizes.</text>
  </g>

  <g id="cue_s08_c3_averaging_smallest_thirty_percent_in" data-cue-label="averaging the smallest thirty percent interval beats max or full range">
    <title>averaging the smallest thirty percent interval beats the maximum or the full range lifting auroc to ninety-seven point eight</title>
    <rect x="454" y="256" width="370" height="402" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="454" y="256" width="370" height="56" rx="14" fill="#1C2942"/>
    <text x="482" y="292" font-size="21" font-weight="bold" fill="#37D3A6">30% interval</text>
    <text x="482" y="352" font-size="19" fill="#DBE4F0">Averaging the smallest 30%</text>
    <text x="482" y="378" font-size="19" fill="#DBE4F0">interval beats max or range.</text>
    <text x="482" y="424" font-size="15" fill="#93A4BD">MVTec AD image AUROC</text>
    <rect x="548" y="446" width="168" height="26" rx="4" fill="#FF6B6B"/>
    <text x="482" y="464" font-size="16" fill="#DBE4F0">max</text>
    <text x="724" y="465" font-size="16" font-weight="bold" fill="#DBE4F0">83.8</text>
    <rect x="548" y="500" width="196" height="26" rx="4" fill="#37D3A6"/>
    <text x="482" y="518" font-size="16" fill="#DBE4F0">30%</text>
    <text x="752" y="519" font-size="16" font-weight="bold" fill="#DBE4F0">97.8</text>
    <text x="482" y="576" font-size="19" fill="#93A4BD">A +14 point lift from the</text>
    <text x="482" y="602" font-size="19" fill="#93A4BD">right interval alone.</text>
  </g>

  <g id="cue_s08_c4_re_scoring_raises_visa_image_auroc" data-cue-label="re-scoring raises visa image auroc from ninety to ninety-two point eight">
    <title>re-scoring raises visa image auroc from ninety to ninety-two point eight</title>
    <rect x="844" y="256" width="370" height="402" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="844" y="256" width="370" height="56" rx="14" fill="#1C2942"/>
    <text x="872" y="292" font-size="21" font-weight="bold" fill="#FFB454">RsCIN gain</text>
    <text x="872" y="360" font-size="19" fill="#DBE4F0">The re-scoring module lifts</text>
    <text x="872" y="386" font-size="19" fill="#DBE4F0">VisA image-level AUROC.</text>
    <text x="872" y="466" font-size="34" font-weight="bold" fill="#93A4BD">90.0</text>
    <text x="978" y="466" font-size="30" fill="#DBE4F0">→</text>
    <text x="1018" y="466" font-size="34" font-weight="bold" fill="#37D3A6">92.8</text>
    <text x="872" y="530" font-size="19" fill="#93A4BD">A clean image-level boost,</text>
    <text x="872" y="556" font-size="19" fill="#93A4BD">and a drop-in plug-in for</text>
    <text x="872" y="582" font-size="19" fill="#93A4BD">other methods too.</text>
  </g>
</svg>
