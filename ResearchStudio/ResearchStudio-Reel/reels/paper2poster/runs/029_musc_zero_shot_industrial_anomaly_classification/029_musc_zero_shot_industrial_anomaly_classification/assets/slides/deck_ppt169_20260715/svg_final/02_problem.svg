<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E1420"/>
  <g id="slide_header">
    <rect x="64" y="52" width="5" height="52" rx="2" fill="#4DA3FF"/>
    <text x="86" y="76" font-size="15" fill="#93A4BD" letter-spacing="2">02 · PROBLEM</text>
    <text x="86" y="106" font-size="30" font-weight="bold" fill="#FFFFFF">Why zero-shot anomaly detection is hard</text>
  </g>

  <g id="cue_s02_c1_detecting_defects_core_vision_task" data-cue-label="detecting defects core vision task but existing methods demanding">
    <title>detecting defects core vision task but existing methods are demanding</title>
    <rect x="64" y="150" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="150" width="6" height="250" rx="3" fill="#4DA3FF"/>
    <rect x="92" y="176" width="40" height="40" rx="10" fill="#4DA3FF"/>
    <text x="112" y="203" font-size="20" font-weight="bold" fill="#0E1420" text-anchor="middle">1</text>
    <text x="146" y="204" font-size="22" font-weight="bold" fill="#FFFFFF">A core computer-vision task</text>
    <text x="94" y="256" font-size="19" fill="#DBE4F0">Detecting product defects is central to</text>
    <text x="94" y="286" font-size="19" fill="#DBE4F0">industrial inspection — yet the standard</text>
    <text x="94" y="316" font-size="19" fill="#DBE4F0">methods all come with heavy requirements.</text>
  </g>

  <g id="cue_s02_c2_one_class_approaches_need_bank_norma" data-cue-label="one-class approaches need bank normal images per product clip-based zero-shot prompts">
    <title>one-class approaches need bank of normal images per product clip-based zero-shot methods rely on prompts</title>
    <rect x="656" y="150" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="656" y="150" width="6" height="250" rx="3" fill="#FFB454"/>
    <rect x="684" y="176" width="40" height="40" rx="10" fill="#FFB454"/>
    <text x="704" y="203" font-size="20" font-weight="bold" fill="#0E1420" text-anchor="middle">2</text>
    <text x="738" y="204" font-size="22" font-weight="bold" fill="#FFFFFF">Heavy prerequisites</text>
    <text x="686" y="256" font-size="19" fill="#DBE4F0">One-class methods need a bank of normal</text>
    <text x="686" y="286" font-size="19" fill="#DBE4F0">images per product; CLIP-based zero-shot</text>
    <text x="686" y="316" font-size="19" fill="#DBE4F0">methods rely on hand-written prompts.</text>
  </g>

  <g id="cue_s02_c3_many_factories_neither" data-cue-label="many factories have neither normal references nor prompts">
    <title>many factories have neither references nor prompts available</title>
    <rect x="64" y="418" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="64" y="418" width="6" height="250" rx="3" fill="#FF6B6B"/>
    <rect x="92" y="444" width="40" height="40" rx="10" fill="#FF6B6B"/>
    <text x="112" y="471" font-size="20" font-weight="bold" fill="#0E1420" text-anchor="middle">3</text>
    <text x="146" y="472" font-size="22" font-weight="bold" fill="#FFFFFF">Real factories have neither</text>
    <text x="94" y="524" font-size="19" fill="#DBE4F0">On many production lines there is no</text>
    <text x="94" y="554" font-size="19" fill="#DBE4F0">curated reference set and no reliable</text>
    <text x="94" y="584" font-size="19" fill="#DBE4F0">text prompt to describe every defect.</text>
  </g>

  <g id="cue_s02_c4_goal_segment_anomalies_prompts_refer" data-cue-label="goal segment anomalies with no training prompts or references">
    <title>the goal segment anomalies with no training no prompts no references</title>
    <rect x="656" y="418" width="560" height="250" rx="14" fill="#172236" stroke="#2B3B57"/>
    <rect x="656" y="418" width="6" height="250" rx="3" fill="#37D3A6"/>
    <rect x="684" y="444" width="40" height="40" rx="10" fill="#37D3A6"/>
    <text x="704" y="471" font-size="22" font-weight="bold" fill="#0E1420" text-anchor="middle">→</text>
    <text x="738" y="472" font-size="22" font-weight="bold" fill="#FFFFFF">The goal</text>
    <text x="686" y="524" font-size="19" fill="#DBE4F0">Classify and segment anomalies with</text>
    <text x="686" y="554" font-size="19" fill="#DBE4F0">no training, no prompts, and</text>
    <text x="686" y="584" font-size="19" fill="#DBE4F0">no reference images at all.</text>
  </g>
</svg>
