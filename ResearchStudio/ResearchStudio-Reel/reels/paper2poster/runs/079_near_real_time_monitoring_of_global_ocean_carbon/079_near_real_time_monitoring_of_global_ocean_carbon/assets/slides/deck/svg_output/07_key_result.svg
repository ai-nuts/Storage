icrosoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">trained on earlier data, then predicted</text><text x="90.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">the withheld period.</text></g><g id="cue_s07_c2_predictions_track_originals_remarkab" data-cue-label="cue_s07_c2_predictions_track_originals_remarkab"><title>predictions track originals remarkably well most ten models eight products</title><desc>The predictions track the originals remarkably well: for most of the ten models and eight products, the correlation exceeds an R-squared of point nine, and even the global monthly </desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#34D399"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2">STRONG AGREEMENT</text><text x="679.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">For most of the 10 models and 8 products</text><text x="679.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">the correlation exceeds R squared of</text><text x="679.0" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">0.9; global aggregates stay above 0.85.</text><text x="679.0" y="280.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#5F7A93" text-anchor="start">Prediction vs original correlation (R squared)</text><text x="679.0" y="304.6666666666667" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#9DB6CC" text-anchor="start">Best GOBMs</text><rect x="811.0" y="288.0" width="313.0" height="23.333333333333332" rx="11.666666666666666" fill="#1C374F"/><rect x="811.0" y="288.0" width="303.6" height="23.333333333333332" rx="11.666666666666666" fill="#34D399"/><text x="1124.6100000000001" y="304.6666666666667" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="800" fill="#E8F1FA" text-anchor="start">0.97</text><text x="679.0" y="340.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#9DB6CC" text-anchor="start">Most sources</text><rect x="811.0" y="323.3333333333333" width="313.0" height="23.333333333333332" rx="11.666666666666666" fill="#1C374F"/><rect x="811.0" y="323.3333333333333" width="281.7" height="23.333333333333332" rx="11.666666666666666" fill="#38BDF8"/><text x="1102.7" y="340.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="800" fill="#E8F1FA" text-anchor="start">0.90</text><text x="679.0" y="375.3333333333333" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#9DB6CC" text-anchor="start">Global aggregate</text><rect x="811.0" y="358.66666666666663" width="313.0" height="23.333333333333332" rx="11.666666666666666" fill="#1C374F"/><rect x="811.0" y="358.66666666666663" width="266.1" height="23.333333333333332" rx="11.666666666666666" fill="#38BDF8"/><text x="1087.05" y="375.3333333333333" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="800" fill="#E8F1FA" text-anchor="start">0.85</text></g><g id="cue_s07_c3_global_averages_predictions_run_just" data-cue-label="cue_s07_c3_global_averages_predictions_run_just"><title>global averages predictions run just sli