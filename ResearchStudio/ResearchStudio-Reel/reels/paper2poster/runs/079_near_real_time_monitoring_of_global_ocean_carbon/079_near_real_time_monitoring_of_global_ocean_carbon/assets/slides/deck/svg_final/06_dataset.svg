y="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Global surface-ocean CO2 fugacity and air-sea</text><text x="90.0" y="312.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">flux, built by updating 10 biogeochemical</text><text x="90.0" y="334.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">models and 8 data products of the Global</text><text x="90.0" y="356.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Carbon Budget 2022.</text></g><g id="cue_s06_c2_its_inputs_draw_satellite_reanalysis" data-cue-label="cue_s06_c2_its_inputs_draw_satellite_reanalysis"><title>its inputs draw satellite reanalysis products chlorophyll temperature sea ice</title><desc>Its inputs draw on satellite and reanalysis products for chlorophyll, temperature, sea ice, mixed-layer depth, salinity, sea-surface height, pressure and wind, and the whole datase</desc><rect x="653.0" y="150.0" width="563.0" height="534.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="498.0" rx="2.5" fill="#34D399"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2">THE INPUTS</text><text x="679.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Satellite and reanalysis products:</text><text x="679.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">chlorophyll, sea-surface temperature, sea ice,</text><text x="679.0" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">mixed-layer depth, salinity, sea-surface</text><text x="679.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">height, pressure and wind.</text></g>
