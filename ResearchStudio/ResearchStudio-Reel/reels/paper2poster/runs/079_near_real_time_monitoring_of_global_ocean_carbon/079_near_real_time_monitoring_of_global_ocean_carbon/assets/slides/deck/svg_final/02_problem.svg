<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0B1A2A"/><rect x="64" y="126" width="1152" height="1.5" fill="#244461"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#38BDF8"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8F1FA" text-anchor="start">Our picture of the ocean sink is always a year old</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#5F7A93" text-anchor="end" letter-spacing="1.5">02 / 10</text><g id="cue_s02_c1_ocean_one_largest_buffers_against" data-cue-label="cue_s02_c1_ocean_one_largest_buffers_against"><title>ocean one largest buffers against climate change soaking big fraction</title><desc>The ocean is one of the largest buffers against climate change, soaking up a big fraction of the carbon dioxide we emit.</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#38BDF8"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2">A CLIMATE BUFFER</text><text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">The ocean is one of the largest buffers</text><text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">against climate change, soaking up a big</text><text x="90.0" y="268.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">fraction of the CO2 we emit.</text></g><g id="cue_s02_c2_but_our_best_official_accounting" data-cue-label="cue_s02_c2_but_our_best_official_accounting"><title>but our best official accounting how much absorbs annual global</title><desc>But our best official accounting of how much it absorbs, the annual Global Carbon Budget, always trails reality by about a year.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">ALWAYS BEHIND</text><text x="679.0" y="240.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8F1FA" text-anchor="start">~1 yr</text><text x="679.0" y="266.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9DB6CC" text-anchor="start">lag of the annual Global Carbon Budget</text><text x="679.0" y="318.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#5F7A93" text-anchor="start">Reporting latency of the ocean sink</text><text x="679.0" y="341.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#9DB6CC" text-anchor="start">Annual GCB</text><rect x="811.0" y="326.0" width="313.0" height="20.0" rx="10.0" fill="#1C374F"/><rect x="811.0" y="326.0" width="313.0" height="20.0" rx="10.0" fill="#F87171"/><text x="1134.0" y="341.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="800" fill="#E8F1FA" text-anchor="start">12 mo</text><text x="679.0" y="373.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="600" fill="#9DB6CC" text-anchor="start">CMO-NRT</text><rect x="811.0" y="358.0" width="313.0" height="20.0" rx="10.0" fill="#1C374F"/><rect x="811.0" y="358.0" width="26.1" height="20.0" rx="10.0" fill="#34D399"/><text x="847.0833333333334" y="373.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="800" fill="#E8F1FA" text-anchor="start">1 mo</text></g><g id="cue_s02_c3_means_when_ocean_uptake_shifts" data-cue-label="cue_s02_c3_means_when_ocean_uptake_shifts"><title>means when ocean uptake shifts simply cannot see until long</title><desc>That means when the ocean&#x27;s uptake shifts, we simply cannot see it until long after the fact.</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">WE CANNOT SEE IT</text><text x="90.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">When the ocean&#x27;s uptake shifts, we</text><text x="90.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">simply cannot see the change until long</text><text x="90.0" y="548.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">after the fact.</text></g><g id="cue_s02_c4_lag_baked_biogeochemical_models_comp" data-cue-label="cue_s02_c4_lag_baked_biogeochemical_models_comp"><title>lag baked biogeochemical models computationally heavy surface-ocean observations they rely</title><desc>This lag is baked in: the biogeochemical models are computationally heavy, and the surface-ocean observations they rely on are themselves delayed by roughly a year.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#F87171"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F87171" text-anchor="start" letter-spacing="2">WHY THE LAG</text><text x="679.0" y="504.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Biogeochemical models are computationally</text><text x="679.0" y="526.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">heavy, and the surface-ocean observations</text><text x="679.0" y="548.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">they rely on are themselves delayed.</text></g>
</svg>
