arge_share_humanity"><title>ocean absorbs large share humanity carbon emissions yet our official</title><desc>The ocean absorbs a large share of humanity&#x27;s carbon emissions, yet our official picture of how much it takes up always lags reality by about a year.</desc><rect x="64" y="150" width="34" height="6" rx="3" fill="#38BDF8"/><text x="108" y="160" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="1.5">TSINGHUA  ·  MICROSOFT RESEARCH  ·  ICLR 2024</text><text x="64" y="250" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="800" fill="#E8F1FA" text-anchor="start">Carbon Monitor Ocean</text><text x="64" y="300" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#E8F1FA" text-anchor="start">Near-real-time monitoring of the global ocean carbon sink</text><text x="64" y="344" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#9DB6CC" text-anchor="start">The ocean absorbs a large share of our carbon emissions, yet the</text><text x="64" y="368" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" fill="#9DB6CC" text-anchor="start">official picture of its uptake always lags reality by about a year.</text></g><text x="64" y="410" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#5F7A93" text-anchor="start">Ke, Gui, Cao, Wang, Ciais, Friedlingstein, Liu  ·  arXiv:2312.01637</text><g id="cue_s01_c2_work_introduces_carbon_monitor_ocean" data-cue-label="cue_s01_c2_work_introduces_carbon_monitor_ocean"><title>work introduces carbon monitor ocean cmo-nrt near-real-time monthly gridded dataset</title><desc>This work introduces Carbon Monitor Ocean, or CMO-NRT, a near-real-time, monthly, gridded dataset of global surface ocean fugacity of CO2 and air-sea CO2 flux.</desc><rect x="64.0" y="470.0" width="563.0" height="214.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="488.0" width="5" height="178.0" rx="2.5" fill="#38BDF8"/><text x="88.0" y="506.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2">THE DATASET</text><text x="88.0" y="542.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" fill="#E8F1FA" text-anchor="start">CMO-NRT</text><text x="88.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400" fill="#9DB6CC" text-anchor="start">A near-real-time, monthly, gridded dataset of</text><text x="88.0" y="590.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400" fill="#9DB6CC" text-anchor="start">surface-ocean CO2 fugacity and air-sea flux.</text></g><g id="cue_s01_c3_convolutional_neural_networks_semi_s" data-cue-label="cue_s01_c3_convolutional_neural_networks_semi_s"><title>convolutional neural networks semi-supervised learning update estimates ten ocean biogeochemical</title><desc>By using convolutional neural networks and semi-supervised learning to update the estimates from ten ocean biogeochemical models and eight data products, the authors extend the glo</desc><rect x="653.0" y="470.0" width="563.0" height="214.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="488.0" width="5" height="178.0" rx="2.5" fill="#34D399"/><text x="677.0" y="506.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2">THE METHOD</text><text x="677.0" y="542.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="800" fill="#E8F1FA" text-anchor="start">CNN + semi-supervised</text><text x="677.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400" fill="#9DB6CC" text-anchor="start">Updates 10 biogeochemical models and 8 data products</text><text x="677.0" y="590.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14.5" font-weight="400" fill="#9DB6CC" text-anchor="start">to the present month.</text></g>
