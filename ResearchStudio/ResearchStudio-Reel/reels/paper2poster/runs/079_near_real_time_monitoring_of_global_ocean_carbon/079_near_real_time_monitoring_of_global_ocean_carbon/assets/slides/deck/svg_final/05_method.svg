neural network reproduces each model or</text><text x="142.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">product from year, month, lat, lon and 9</text><text x="142.0" y="258.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">environmental variables (SST, salinity,</text><text x="142.0" y="281.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">chlorophyll, wind).</text></g><g id="cue_s05_c2_global_grids_cut_small_eighteen_by_e" data-cue-label="cue_s05_c2_global_grids_cut_small_eighteen_by_e"><title>global grids cut small eighteen-by-eighteen patches fed through stacked convolutional</title><desc>Global grids are cut into small eighteen-by-eighteen patches and fed through stacked convolutional and linear layers.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#38BDF8"/><circle cx="695.0" cy="192.0" r="20" fill="none" stroke="#38BDF8" stroke-width="2"/><text x="695.0" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#38BDF8" text-anchor="middle">2</text><text x="731.0" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2">PATCH AND CONVOLVE</text><text x="731.0" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">Global grids are cut into small 18x18</text><text x="731.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">patches, then fed through stacked</text><text x="731.0" y="258.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">convolutional and linear layers.</text><text x="679.0" y="328.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#5F7A93" text-anchor="start">conv + linear stack</text><rect x="679.0" y="340.0" width="52" height="30" rx="6" fill="#1C374F" stroke="#9DB6CC" stroke-width="1.5"/><text x="705.0" y="360.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#9DB6CC" text-anchor="middle">9</text><line x1="731.0" y1="355.0" x2="771.0" y2="355.0" stroke="#5F7A93" stroke-width="1.5"/><polygon points="771.0,355.0 764.0,351.0 764.0,359.0" fill="#5F7A93"/><rect x="771.0" y="340.0" width="52" height="30" rx="6" fill="#1C374F" stroke="#38BDF8" stroke-width="1.5"/><text x="797.0" y="360.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#38BDF8" text-anchor="middle">64</text><line x1="823.0" y1="355.0" x2="863.0" y2="355.0" stroke="#5F7A93" stroke-width="1.5"/><polygon points="863.0,355.0 856.0,351.0 856.0,359.0" fill="#5F7A93"/><rect x="863.0" y="340.0" width="52" height="30" rx="6" fill="#1C374F" stroke="#38BDF8" stroke-width="1.5"/><text x="889.0" y="360.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#38BDF8" text-anchor="middle">64</text><line x1="915.0" y1="355.0" x2="955.0" y2="355.0" stroke="#5F7A93" stroke-width="1.5"/><polygon points="955.0,355.0 948.0,351.0 948.0,359.0" fill="#5F7A93"/><rect x="955.0" y="340.0" width="52" height="30" rx="6" fill="#1C374F" stroke="#34D399" stroke-width="1.5"/><text x="981.0" y="360.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="800" fill="#34D399" text-anchor="middle">1</text></g><g id="cue_s05_c3_clever_part_semi_supervised_learning" data-cue-label="cue_s05_c3_clever_part_semi_supervised_learning"><title>clever part semi-supervised learning alongside standard supervised error labeled points</title><desc>The clever part is semi-supervised learning: alongside a standard supervised error on labeled points, the model adds an unsupervised consistency loss that forces its predictions to</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#34D399"/><circle cx="106.0" cy="472.0" r="20" fill="none" stroke="#34D399" stroke-width="2"/><text x="106.0" y="479.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">3</text><text x="142.0" y="466.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2">SEMI-SUPERVISED</text><text x="142.0" y="492.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">A supervised error on labeled points plus an</text><text x="142.0" y="515.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">unsupervised consistency loss that forces</text><text x="142.0" y="538.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">agreement between 10% and 30% feature</text><text x="142.0" y="561.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">masking.</text><rect x="90.0" y="608.0" width="511.0" height="52" rx="8" fill="#1C374F" stroke="#244461"/><text x="106.0" y="640.0" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#E8F1FA" text-anchor="start">L = w * L_u + L_s</text><text x="601.0" y="637.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="600" fill="#5F7A93" text-anchor="end">supervised + consistency</text></g><g id="cue_s05_c4_combining_two_losses_makes_markedly" data-cue-label="cue_s05_c4_combining_two_losses_makes_markedly"><title>combining two losses makes markedly more stable</title><desc>Combining the two losses makes the model markedly more stable.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><circle cx="695.0" cy="472.0" r="20" fill="none" stroke="#FBBF24" stroke-width="2"/><text x="695.0" y="479.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#FBBF24" text-anchor="middle">4</text><text x="731.0" y="466.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">MORE STABLE</text><text x="731.0" y="492.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">Combining the two losses makes the model</text><text x="731.0" y="515.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">markedly more stable.</text></g>
</svg>
