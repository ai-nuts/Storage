 font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">largest residual gaps in the Arctic</text><text x="679.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Ocean and the equatorial Pacific.</text></g>
