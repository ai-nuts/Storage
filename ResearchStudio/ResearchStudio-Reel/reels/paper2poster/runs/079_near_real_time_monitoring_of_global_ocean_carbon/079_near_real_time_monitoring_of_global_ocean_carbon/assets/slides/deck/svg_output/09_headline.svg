<rect width="1280" height="720" fill="#0B1A2A"/><rect x="64" y="126" width="1152" height="1.5" fill="#244461"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#38BDF8"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8F1FA" text-anchor="start">The numbers that matter</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#5F7A93" text-anchor="end" letter-spacing="1.5">09 / 10</text><g id="cue_s09_c1_few_numbers_capture_impact" data-cue-label="cue_s09_c1_few_numbers_capture_impact"><title>few numbers capture impact</title><desc>A few numbers capture the impact.</desc><rect x="64.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#38BDF8"/><text x="90.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2">AT A GLANCE</text><text x="90.0" y="224.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Four figures that capture the impact of</text><text x="90.0" y="246.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Carbon Monitor Ocean.</text></g><g id="cue_s09_c2_method_collapses_roughly_one_year_re" data-cue-label="cue_s09_c2_method_collapses_roughly_one_year_re"><title>method collapses roughly one-year reporting delay down monthly near-real-time coverage</title><desc>The method collapses the roughly one-year reporting delay down to monthly, near-real-time coverage, here spanning January 2022 through July 2023.</desc><rect x="653.0" y="150.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="168.0" width="5" height="218.0" rx="2.5" fill="#34D399"/><text x="679.0" y="190.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2">LATENCY COLLAPSED</text><text x="679.0" y="240.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8F1FA" text-anchor="start">1 yr to 1 mo</text><text x="679.0" y="266.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9DB6CC" text-anchor="start">near-real-time, Jan 2022 to Jul 2023</text><text x="679.0" y="290.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">The reporting delay drops from about a</text><text x="679.0" y="312.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">year to monthly.</text></g><g id="cue_s09_c3_validation_correlations_exceed_r_squ" data-cue-label="cue_s09_c3_validation_correlations_exceed_r_squ"><title>validation correlations exceed r-squared point nine most eighteen source estimates</title><desc>Validation correlations exceed an R-squared of point nine for most of the eighteen source estimates, global aggregates stay above point eight five, and global monthly differences a</desc><rect x="64.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#38BDF8"/><text x="90.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2">VALIDATION</text><text x="90.0" y="520.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8F1FA" text-anchor="start">R2 &gt; 0.9</text><text x="90.0" y="546.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9DB6CC" text-anchor="start">for most of 18 sources; aggregate &gt; 0.85</text><text x="90.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">Global monthly differences mostly under</text><text x="90.0" y="592.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">3 microatmospheres.</text></g><g id="cue_s09_c4_even_auxiliary_near_real_time_atmosp" data-cue-label="cue_s09_c4_even_auxiliary_near_real_time_atmosp"><title>even auxiliary near-real-time atmospheric carbon dioxide achieves root-mean-square error just</title><desc>Even the auxiliary near-real-time atmospheric carbon dioxide model achieves a root-mean-square error of just one point seven four, about a half-percent error.</desc><rect x="653.0" y="430.0" width="563.0" height="254.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="653.0" y="448.0" width="5" height="218.0" rx="2.5" fill="#FBBF24"/><text x="679.0" y="470.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">AUXILIARY xCO2 MODEL</text><text x="679.0" y="520.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="800" fill="#E8F1FA" text-anchor="start">1.74</text><text x="679.0" y="546.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#9DB6CC" text-anchor="start">near-real-time xCO2 RMSE (~0.5% error)</text><text x="679.0" y="570.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">The atmospheric CO2 model is highly</text><text x="679.0" y="592.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#9DB6CC" text-anchor="start">accurate too.</text></g>
