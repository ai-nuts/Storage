<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect width="1280" height="720" fill="#0B1A2A"/><rect x="64" y="126" width="1152" height="1.5" fill="#244461"/><rect x="64" y="52" width="34" height="6" rx="3" fill="#38BDF8"/><text x="108" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="104" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="800" fill="#E8F1FA" text-anchor="start">Carbon Monitor Ocean, updated to the present</text><text x="1216" y="62" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#5F7A93" text-anchor="end" letter-spacing="1.5">04 / 10</text><g id="cue_s04_c1_core_contribution_carbon_monitor_oce" data-cue-label="cue_s04_c1_core_contribution_carbon_monitor_oce"><title>core contribution carbon monitor ocean cmo-nrt near-real-time monthly gridded dataset</title><desc>The core contribution is Carbon Monitor Ocean, or CMO-NRT: a near-real-time, monthly, gridded dataset of global surface ocean carbon dioxide fugacity and air-sea flux, together wit</desc><rect x="64.0" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="64.0" y="168.0" width="5" height="498.0" rx="2.5" fill="#38BDF8"/><circle cx="106.0" cy="192.0" r="20" fill="none" stroke="#38BDF8" stroke-width="2"/><text x="106.0" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#38BDF8" text-anchor="middle">1</text><text x="142.0" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="start" letter-spacing="2">THE DATASET</text><text x="142.0" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">CMO-NRT: a near-real-time, monthly,</text><text x="142.0" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">gridded dataset of surface-ocean CO2</text><text x="142.0" y="258.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">fugacity and air-sea flux.</text></g><g id="cue_s04_c2_rather_replace_trusted_community_mod" data-cue-label="cue_s04_c2_rather_replace_trusted_community_mod"><title>rather replace trusted community models updates all ten ocean biogeochemical</title><desc>Rather than replace the trusted community models, it updates all ten ocean biogeochemical models and eight data products from the Global Carbon Budget 2022 into a near-real-time fr</desc><rect x="456.6666666666667" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="456.6666666666667" y="168.0" width="5" height="498.0" rx="2.5" fill="#34D399"/><circle cx="498.6666666666667" cy="192.0" r="20" fill="none" stroke="#34D399" stroke-width="2"/><text x="498.6666666666667" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#34D399" text-anchor="middle">2</text><text x="534.6666666666667" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="start" letter-spacing="2">UPDATE, NOT REPLACE</text><text x="534.6666666666667" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">Extends all 10 biogeochemical models and 8</text><text x="534.6666666666667" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">data products of the Global Carbon Budget</text><text x="534.6666666666667" y="258.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">2022 into a real-time framework.</text></g><g id="cue_s04_c3_dataset_code_released_openly_figshar" data-cue-label="cue_s04_c3_dataset_code_released_openly_figshar"><title>dataset code released openly figshare project website</title><desc>The dataset and the code are released openly, on Figshare and on the project website.</desc><rect x="849.3333333333334" y="150.0" width="366.6666666666667" height="534.0" rx="16" fill="#12283D" stroke="#244461" stroke-width="1"/><rect x="849.3333333333334" y="168.0" width="5" height="498.0" rx="2.5" fill="#FBBF24"/><circle cx="891.3333333333334" cy="192.0" r="20" fill="none" stroke="#FBBF24" stroke-width="2"/><text x="891.3333333333334" y="199.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="800" fill="#FBBF24" text-anchor="middle">3</text><text x="927.3333333333334" y="186.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="2">OPEN RELEASE</text><text x="927.3333333333334" y="212.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">Dataset and code released openly, on</text><text x="927.3333333333334" y="235.0" font-family="Arial, 'Helvetica Neue', 'Microsoft YaHei', sans-serif" font-size="15.5" font-weight="500" fill="#E8F1FA" text-anchor="start">Figshare and on the project website.</text></g>
</svg>
