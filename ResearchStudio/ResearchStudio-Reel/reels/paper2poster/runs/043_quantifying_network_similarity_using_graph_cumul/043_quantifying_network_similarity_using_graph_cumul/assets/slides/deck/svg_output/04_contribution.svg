<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">CONTRIBUTION</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Swap moments for cumulants</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">04 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s04_c1_central_contribution_simple_drop_in"><title>central contribution simple drop-in two-sample test networks swaps graph moments</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="106.0" cy="166.0" r="20" fill="#35D0BA" stroke="none" stroke-width="0"/>
<text x="106.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">1</text>
<text x="142.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">A drop-in swap</text>
<line x1="90.0" y1="188.0" x2="598.0" y2="188.0" stroke="#1E3A52" stroke-width="1"/>
<text x="90.0" y="220.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">The central contribution is a simple, drop-in two-sample</text>
<text x="90.0" y="244.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">test for networks that swaps graph moments for graph</text>
<text x="90.0" y="268.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">cumulants — nothing else in the pipeline changes.</text>
</g>
<g id="cue_s04_c2_theory_controlled_simulation_real_bi"><title>theory controlled simulation real biological networks authors show swap consistently</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="698.0" cy="166.0" r="20" fill="#4C8DFF" stroke="none" stroke-width="0"/>
<text x="698.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">2</text>
<text x="734.0" y="173.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">More power, same cost</text>
<line x1="682.0" y1="188.0" x2="1190.0" y2="188.0" stroke="#1E3A52" stroke-width="1"/>
<text x="682.0" y="220.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Across theory, controlled simulation, and real biological</text>
<text x="682.0" y="244.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">networks, this swap consistently increases statistical</text>
<text x="682.0" y="268.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">power without changing the computational cost.</text>
</g>
<g id="cue_s04_c3_they_further_show_cumulant_test"><title>they further show cumulant test statistic tracks known chi-squared distribution</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="106.0" cy="444.0" r="20" fill="#F5B841" stroke="none" stroke-width="0"/>
<text x="106.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">3</text>
<text x="142.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Analytic chi-squared null</text>
<line x1="90.0" y1="466.0" x2="598.0" y2="466.0" stroke="#1E3A52" stroke-width="1"/>
<text x="90.0" y="498.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">The cumulant test statistic tracks a known chi-squared</text>
<text x="90.0" y="522.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">distribution remarkably well, even with only a handful of</text>
<text x="90.0" y="546.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">graphs, so false-positive rates can be controlled</text>
<text x="90.0" y="570.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">analytically.</text>
</g>
<g id="cue_s04_c4_strikingly_cumulant_test_even_works"><title>strikingly cumulant test even works when just one graph observed</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<circle cx="698.0" cy="444.0" r="20" fill="#48D597" stroke="none" stroke-width="0"/>
<text x="698.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#08131F" text-anchor="middle">4</text>
<text x="734.0" y="451.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Works with a single graph</text>
<line x1="682.0" y1="466.0" x2="1190.0" y2="466.0" stroke="#1E3A52" stroke-width="1"/>
<text x="682.0" y="498.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">Strikingly, the cumulant test even works when just one</text>
<text x="682.0" y="522.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">graph is observed per sample — a regime where the moment</text>
<text x="682.0" y="546.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">test is entirely undefined.</text>
</g>
</svg>
