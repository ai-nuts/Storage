<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">METHOD</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Same recipe, better coordinates</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">05 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s05_c1_both_tests_follow_same_three_step"><title>both tests follow same three-step recipe choose maximum subgraph order</title>
<rect x="64.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">A shared three-step recipe</text>
<rect x="90.0" y="218.0" width="152.0" height="84.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="2"/>
<text x="166.0" y="254.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#E8F0F7" text-anchor="middle">1. choose max</text>
<text x="166.0" y="274.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#E8F0F7" text-anchor="middle">subgraph order</text>
<text x="249.0" y="266.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#9DB2C4" text-anchor="middle">&gt;</text>
<rect x="256.0" y="218.0" width="152.0" height="84.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#F5B841" stroke-width="2"/>
<text x="332.0" y="254.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#E8F0F7" text-anchor="middle">2. estimate each</text>
<text x="332.0" y="274.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#E8F0F7" text-anchor="middle">distribution</text>
<text x="415.0" y="266.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="22" font-weight="bold" fill="#9DB2C4" text-anchor="middle">&gt;</text>
<rect x="422.0" y="218.0" width="152.0" height="84.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#35D0BA" stroke-width="2"/>
<text x="498.0" y="254.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#E8F0F7" text-anchor="middle">3. measure the</text>
<text x="498.0" y="274.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#E8F0F7" text-anchor="middle">distance</text>
<text x="90.0" y="346.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="normal" fill="#9DB2C4" text-anchor="start">Identical for both tests — only the coordinates differ.</text>
</g>
<g id="cue_s05_c2_distance_squared_mahalanobis_distanc"><title>distance squared mahalanobis distance which weights differences analytically computed covariance</title>
<rect x="656.0" y="122.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="122.0" width="6.0" height="258.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<text x="682.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Squared Mahalanobis distance</text>
<rect x="682.0" y="184.0" width="508.0" height="52.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="698.0" y="216.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" font-weight="bold" fill="#35D0BA" text-anchor="start">d^2 = (k_A - k_B)^T (S_A + S_B)^-1 (k_A - k_B)</text>
<text x="682.0" y="262.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">It weights differences by an analytically computed</text>
<text x="682.0" y="286.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">covariance. The only choice: raw graph moments</text>
<text x="682.0" y="310.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">(injective-homomorphism densities) versus graph cumulants.</text>
</g>
<g id="cue_s05_c3_cumulants_obtained_moments_combinato"><title>cumulants obtained moments combinatorial bius transform over all connectivity-respecting partitions</title>
<rect x="64.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="90.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Cumulants via a Mobius transform</text>
<rect x="90.0" y="462.0" width="508.0" height="48.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="106.0" y="492.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="15" font-weight="bold" fill="#F5B841" text-anchor="start">mu_g  =  sum over partitions pi   product_b  k_(g_b)</text>
<text x="90.0" y="534.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">A combinatorial sum over all connectivity-respecting</text>
<text x="90.0" y="558.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">partitions of a subgraph&#x27;s edges. Cumulants capture the</text>
<text x="90.0" y="582.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">excess propensity of a structure beyond what its smaller</text>
<text x="90.0" y="606.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#9DB2C4" text-anchor="start">pieces predict.</text>
</g>
<g id="cue_s05_c4_because_computing_covariances_only_n"><title>because computing covariances only needs subgraph counts twice chosen order</title>
<rect x="656.0" y="400.0" width="560.0" height="258.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="400.0" width="6.0" height="258.0" rx="3" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<text x="682.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">The swap is free</text>
<text x="682.0" y="480.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">Computing the covariances only needs subgraph counts up</text>
<text x="682.0" y="505.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">to twice the chosen order. So both tests share the same</text>
<text x="682.0" y="530.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">computational complexity.</text>
<rect x="682.0" y="580.0" width="508.0" height="52.0" rx="14" fill="#12314A" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<text x="936.0" y="612.0" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" font-weight="bold" fill="#48D597" text-anchor="middle">moments  and  cumulants :  same  O(n^w)</text>
</g>
</svg>
