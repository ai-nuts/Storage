<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">TAKEAWAY</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">Use graph cumulants</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">10 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s10_c1_bottom_line_practical_one"><title>bottom line practical one</title>
<rect x="64.0" y="122.0" width="1152.0" height="70.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="122.0" width="6.0" height="70.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="92.0" y="166.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">The bottom line is a practical one - and it costs you nothing.</text>
</g>
<g id="cue_s10_c2_whenever_you_find_yourself_analyzing"><title>whenever you find yourself analyzing networks through subgraph motif densities</title>
<rect x="64.0" y="214.0" width="368.0" height="400.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="214.0" width="368.0" height="8.0" rx="4" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<circle cx="106.0" cy="272.0" r="18" fill="#35D0BA" stroke="none" stroke-width="0"/>
<text x="106.0" y="279.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">1</text>
<text x="138.0" y="266.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Convert densities to</text>
<text x="138.0" y="293.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">cumulants</text>
<text x="98.0" y="364.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">Whenever you analyze networks</text>
<text x="98.0" y="391.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">through subgraph or motif</text>
<text x="98.0" y="418.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">densities, take one extra step</text>
<text x="98.0" y="445.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">and convert them into the</text>
<text x="98.0" y="472.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">corresponding graph cumulants.</text>
</g>
<g id="cue_s10_c3_you_lose_nothing_computational_cost"><title>you lose nothing computational cost but you gain sharply higher</title>
<rect x="456.0" y="214.0" width="368.0" height="400.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="456.0" y="214.0" width="368.0" height="8.0" rx="4" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<circle cx="498.0" cy="272.0" r="18" fill="#48D597" stroke="none" stroke-width="0"/>
<text x="498.0" y="279.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">2</text>
<text x="530.0" y="266.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">Gain power for free</text>
<text x="490.0" y="364.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">You lose nothing in</text>
<text x="490.0" y="391.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">computational cost, but gain</text>
<text x="490.0" y="418.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">sharply higher statistical</text>
<text x="490.0" y="445.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">power, a trustworthy</text>
<text x="490.0" y="472.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">chi-squared null for</text>
<text x="490.0" y="499.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">controlling error, and the</text>
<text x="490.0" y="526.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">ability to test even a single</text>
<text x="490.0" y="553.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">observed graph.</text>
</g>
<g id="cue_s10_c4_short_graph_cumulants_offer_principl"><title>short graph cumulants offer principled more natural first layer features</title>
<rect x="848.0" y="214.0" width="368.0" height="400.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="848.0" y="214.0" width="368.0" height="8.0" rx="4" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<circle cx="890.0" cy="272.0" r="18" fill="#F5B841" stroke="none" stroke-width="0"/>
<text x="890.0" y="279.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#08131F" text-anchor="middle">3</text>
<text x="922.0" y="266.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">A more natural feature</text>
<text x="922.0" y="293.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="21" font-weight="bold" fill="#E8F0F7" text-anchor="start">set</text>
<text x="882.0" y="364.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">Graph cumulants offer a</text>
<text x="882.0" y="391.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">principled, more natural first</text>
<text x="882.0" y="418.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">layer of features for comparing</text>
<text x="882.0" y="445.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">the local structure of</text>
<text x="882.0" y="472.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#9DB2C4" text-anchor="start">networks.</text>
</g>
<text x="64.0" y="660.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="normal" fill="#9DB2C4" text-anchor="start">Quantifying Network Similarity using Graph Cumulants  ·  JMLR 2023  ·  arxiv.org/abs/2107.11403</text>
</svg>
