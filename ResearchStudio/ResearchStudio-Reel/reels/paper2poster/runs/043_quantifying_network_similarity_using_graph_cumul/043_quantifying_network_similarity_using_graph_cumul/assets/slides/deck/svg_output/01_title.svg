<text x="84.0" y="150.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="54" font-weight="bold" fill="#E8F0F7" text-anchor="start">Quantifying Network Similarity</text>
<text x="84.0" y="212.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="54" font-weight="bold" fill="#E8F0F7" text-anchor="start">using Graph Cumulants</text>
