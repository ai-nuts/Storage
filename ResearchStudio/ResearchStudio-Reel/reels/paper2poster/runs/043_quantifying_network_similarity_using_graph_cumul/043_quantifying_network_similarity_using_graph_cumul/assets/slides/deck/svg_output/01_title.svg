<g id="cue_s01_c1_how_tell_whether_two_networks"><title>how tell whether two networks drawn same underlying distribution compares</title>
<rect x="64.0" y="360.0" width="278.0" height="250.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="360.0" width="278.0" height="6.0" rx="3" fill="#4C8DFF" fill-opacity="1.0" stroke="#4C8DFF" stroke-width="0"/>
<text x="84.0" y="404.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#4C8DFF" text-anchor="start" letter-spacing="1">THE QUESTION</text>
<text x="84.0" y="436.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">Were two collections of</text>
<text x="84.0" y="460.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">networks drawn from the same</text>
<text x="84.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">distribution? Compare them</text>
<text x="84.0" y="508.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">through subgraph counts.</text>
</g>
<g id="cue_s01_c2_first_raw_subgraph_densities_graph"><title>first raw subgraph densities graph moments second converts them graph</title>
<rect x="360.0" y="360.0" width="278.0" height="250.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="360.0" y="360.0" width="278.0" height="6.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="380.0" y="404.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="1">TWO TESTS</text>
<text x="380.0" y="436.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">Graph moments (raw subgraph</text>
<text x="380.0" y="460.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">densities) versus graph</text>
<text x="380.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">cumulants — the network</text>
<text x="380.0" y="508.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">analogue of mean, variance,</text>
<text x="380.0" y="532.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">and skew.</text>
</g>
<g id="cue_s01_c3_through_theory_simulation_real_genet"><title>through theory simulation real genetic-interaction networks authors show graph cumulants</title>
<rect x="656.0" y="360.0" width="278.0" height="250.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="656.0" y="360.0" width="278.0" height="6.0" rx="3" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="676.0" y="404.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#F5B841" text-anchor="start" letter-spacing="1">THE EVIDENCE</text>
<text x="676.0" y="436.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">Theory, simulation, and real</text>
<text x="676.0" y="460.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">gene networks: cumulants</text>
<text x="676.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">give markedly higher power,</text>
<text x="676.0" y="508.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">at no extra cost, even from</text>
<text x="676.0" y="532.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="16" font-weight="normal" fill="#E8F0F7" text-anchor="start">one graph.</text>
</g>
