<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
<rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/>
<rect x="64.0" y="44.0" width="6.0" height="40.0" rx="3" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="86.0" y="62.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#35D0BA" text-anchor="start" letter-spacing="2">HEADLINE NUMBERS</text>
<text x="86.0" y="90.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="30" font-weight="bold" fill="#E8F0F7" text-anchor="start">The impact in four numbers</text>
<text x="1216.0" y="68.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="15" font-weight="bold" fill="#9DB2C4" text-anchor="end">09 / 10</text>
<line x1="64.0" y1="104.0" x2="1216.0" y2="104.0" stroke="#1E3A52" stroke-width="1.5"/>
<g id="cue_s09_c1_few_numbers_capture_impact_moment"><title>few numbers capture impact moment test needs least four graphs</title>
<rect x="64.0" y="140.0" width="273.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="64.0" y="140.0" width="273.0" height="8.0" rx="4" fill="#FF6B6B" fill-opacity="1.0" stroke="#FF6B6B" stroke-width="0"/>
<text x="200.5" y="300.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="50" font-weight="bold" fill="#FF6B6B" text-anchor="middle">s: 4 -&gt; 1</text>
<line x1="92.0" y1="336.0" x2="309.0" y2="336.0" stroke="#1E3A52" stroke-width="1"/>
<text x="90.0" y="380.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">The moment test needs at</text>
<text x="90.0" y="406.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">least four graphs per</text>
<text x="90.0" y="432.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">sample to be defined;</text>
<text x="90.0" y="458.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">the cumulant test works</text>
<text x="90.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">with as few as one.</text>
</g>
<g id="cue_s09_c2_both_connected_subgraphs_three_edges"><title>both connected subgraphs three edges share same order-n-to-the-omega computational complexity</title>
<rect x="357.0" y="140.0" width="273.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="357.0" y="140.0" width="273.0" height="8.0" rx="4" fill="#48D597" fill-opacity="1.0" stroke="#48D597" stroke-width="0"/>
<text x="493.5" y="300.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="50" font-weight="bold" fill="#48D597" text-anchor="middle">free</text>
<line x1="385.0" y1="336.0" x2="602.0" y2="336.0" stroke="#1E3A52" stroke-width="1"/>
<text x="383.0" y="380.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">Both use connected</text>
<text x="383.0" y="406.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">subgraphs up to three</text>
<text x="383.0" y="432.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">edges and share the same</text>
<text x="383.0" y="458.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">O(n^w) complexity, so</text>
<text x="383.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">the extra power costs</text>
<text x="383.0" y="510.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">nothing.</text>
</g>
<g id="cue_s09_c3_under_null_hypothesis_cumulant_stati"><title>under null hypothesis cumulant statistic hugs chi-squared distribution five degrees</title>
<rect x="650.0" y="140.0" width="273.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="650.0" y="140.0" width="273.0" height="8.0" rx="4" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/>
<text x="786.5" y="300.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="50" font-weight="bold" fill="#35D0BA" text-anchor="middle">chi^2, 5 df</text>
<line x1="678.0" y1="336.0" x2="895.0" y2="336.0" stroke="#1E3A52" stroke-width="1"/>
<text x="676.0" y="380.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">Under the null, the</text>
<text x="676.0" y="406.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">cumulant statistic hugs</text>
<text x="676.0" y="432.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">a chi-squared with five</text>
<text x="676.0" y="458.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">degrees of freedom even</text>
<text x="676.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">for small samples; the</text>
<text x="676.0" y="510.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">moment statistic visibly</text>
<text x="676.0" y="536.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">deviates.</text>
</g>
<g id="cue_s09_c4_real_networks_tested_range_about"><title>real networks tested range about eleven thousand sixteen thousand nodes</title>
<rect x="943.0" y="140.0" width="273.0" height="470.0" rx="14" fill="#10263B" fill-opacity="1.0" stroke="#1E3A52" stroke-width="1.5"/>
<rect x="943.0" y="140.0" width="273.0" height="8.0" rx="4" fill="#F5B841" fill-opacity="1.0" stroke="#F5B841" stroke-width="0"/>
<text x="1079.5" y="300.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="50" font-weight="bold" fill="#F5B841" text-anchor="middle">11k - 16k</text>
<line x1="971.0" y1="336.0" x2="1188.0" y2="336.0" stroke="#1E3A52" stroke-width="1"/>
<text x="969.0" y="380.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">Real gene networks</text>
<text x="969.0" y="406.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">tested span about eleven</text>
<text x="969.0" y="432.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">to sixteen thousand</text>
<text x="969.0" y="458.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">nodes and hundreds of</text>
<text x="969.0" y="484.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">thousands of edges, all</text>
<text x="969.0" y="510.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#E8F0F7" text-anchor="start">density-matched.</text>
</g>
</svg>
