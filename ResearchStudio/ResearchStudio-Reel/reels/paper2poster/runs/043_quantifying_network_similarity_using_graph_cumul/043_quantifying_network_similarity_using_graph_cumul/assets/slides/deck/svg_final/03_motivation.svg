<text x="90.0" y="442.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">Weak tests, costly workarounds</text>
<text x="90.0" y="482.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="17" font-weight="normal" fill="#9DB2C4" text-anchor="start">This redundancy weakens any test built directly on the</text>
