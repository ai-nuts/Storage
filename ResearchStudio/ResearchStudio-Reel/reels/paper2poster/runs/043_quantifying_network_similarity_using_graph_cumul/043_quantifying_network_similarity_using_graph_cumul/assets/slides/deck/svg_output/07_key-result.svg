<text x="90.0" y="258.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">gap grows exactly where testing is hardest.</text>
<rect x="90.0" y="322.0" width="300.0" height="26.0" rx="13" fill="#35D0BA" fill-opacity="1.0" stroke="#35D0BA" stroke-width="0"/><text x="240.0" y="340.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="14" font-weight="bold" fill="#08131F" text-anchor="middle">cumulants  &gt;=  moments, everywhere</text>
</g>
