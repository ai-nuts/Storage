<text x="90.0" y="164.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="20" font-weight="bold" fill="#E8F0F7" text-anchor="start">The results are decisive</text>
<text x="90.0" y="204.0" font-family="Arial, 'Helvetica Neue', sans-serif" font-size="18" font-weight="normal" fill="#E8F0F7" text-anchor="start">Across every setting tested, the test built on graph</text>
