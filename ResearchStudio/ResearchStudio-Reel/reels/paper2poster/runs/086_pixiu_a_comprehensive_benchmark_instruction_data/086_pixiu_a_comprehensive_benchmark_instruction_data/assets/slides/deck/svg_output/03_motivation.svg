<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two gaps hold financial AI back</text><g id="cue_s03_c1_two_gaps_motivate_work_first"><title>two gaps motivate work first instruction tuning proven essential improving</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">Gap 1  ·  no financial instructions</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Instruction tuning is essential for a model's</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">zero-shot ability on downstream tasks, yet no</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">financial instruction data exists to enable it.</text><rect x="92" y="338" width="504" height="86" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#4C9BE8" font-weight="800" text-anchor="start">instruction tuning</text><text x="112" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="500" text-anchor="start">stronger zero-shot on new tasks</text><text x="560" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="end">MISSING</text><rect x="92" y="440" width="504" height="90" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="800" text-anchor="start">The prize</text><text x="112" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Open instruction data would unlock financial LLMs for</text><text x="112" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">everyone.</text></g><g id="cue_s03_c2_second_existing_financial_benchmarks"><title>second existing financial benchmarks such flue cover only natural language</title><rect x="648" y="158" width="568" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="116" rx="6" fill="#F2C14E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Gap 2  ·  NLP-only benchmarks</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Existing financial benchmarks such as FLUE cover only</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">natural language processing tasks.</text></g><g id="cue_s03_c3_they_ignore_financial_prediction_tas"><title>they ignore financial prediction tasks like stock movement prediction which</title><rect x="648" y="286" width="568" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="286" width="6" height="120" rx="6" fill="#F2685C"/><text x="676" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">They ignore financial prediction</text><text x="676" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Tasks like stock movement prediction need both text and</text><text x="676" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">time-series data, and are far closer to real-world finance.</text></g><g id="cue_s03_c4_pixiu_built_close_both_gaps"><title>pixiu built close both gaps open resources multi-task coverage multi-modal</title><rect x="648" y="418" width="568" height="132" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="648" y="418" width="6" height="132" rx="6" fill="#48C78E"/><text x="676" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">PIXIU closes both gaps</text><text x="676" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Open resources, multi-task coverage, multi-modal data, and</text><text x="676" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">greater task diversity.</text><text x="676" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">open  ·  multi-task  ·  multi-modal</text></g></svg>