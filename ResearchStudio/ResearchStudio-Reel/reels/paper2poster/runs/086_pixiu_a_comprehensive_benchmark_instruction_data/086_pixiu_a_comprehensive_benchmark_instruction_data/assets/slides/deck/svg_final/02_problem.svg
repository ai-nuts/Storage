<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">No open resources for financial LLMs</text><g id="cue_s02_c1_financial_technology_advanced_rapidl"><title>financial technology advanced rapidly nlp but highly technical nature financial</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Finance needs domain models</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">FinTech has advanced fast with NLP, but</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">the highly technical nature of financial</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">text demands domain-specific models.</text><rect x="92" y="352" width="320" height="150" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">General LLM</text><text x="112" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="500" text-anchor="start">generic text</text><text x="252" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#F2C14E" font-weight="800" text-anchor="start">-&gt;</text><text x="300" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#4C9BE8" font-weight="700" text-anchor="start">Financial LLM</text><text x="300" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="500" text-anchor="start">reports · filings · tickers</text><text x="112" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#34D3C0" font-weight="700" text-anchor="start">Jargon, numbers, and time-series break generic models.</text></g><g id="cue_s02_c2_existing_financial_pre_trained_model"><title>existing financial pre-trained models like finbert flang small below one</title><rect x="500" y="158" width="716" height="110" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="110" rx="6" fill="#F2C14E"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Existing financial models are small</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">finBERT and FLANG stay below one billion parameters, which limits their</text><text x="528" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">generalization to new financial tasks.</text></g><g id="cue_s02_c3_one_large_financial_fifty_billion_pa"><title>one large financial fifty-billion-parameter bloomberggpt proprietary neither its weights nor</title><rect x="500" y="282" width="716" height="110" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="282" width="6" height="110" rx="6" fill="#F2685C"/><text x="528" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">BloombergGPT is a closed 50B model</text><text x="528" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The one large financial model releases neither weights nor training data,</text><text x="528" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and it is not instruction-following.</text></g><g id="cue_s02_c4_critically_open_financial_instructio"><title>critically open financial instruction datasets standardized benchmarks comprehensively assessing financial</title><rect x="500" y="406" width="716" height="144" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="406" width="6" height="144" rx="6" fill="#F2685C"/><text x="528" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">The core gap</text><text x="528" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">No open financial instruction datasets and no standardized benchmark for</text><text x="528" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">comprehensively assessing financial LLMs.</text><text x="528" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#F2685C" font-weight="800" text-anchor="start">no open data   ·   no open model   ·   no open benchmark</text></g></svg>