<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Data diversity over raw scale</text><g id="cue_s08_c1_comparing_variants_revealing"><title>comparing variants revealing</title><rect x="64" y="158" width="560" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Comparing model variants</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">How much does parameter count actually help across</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">financial tasks?</text></g><g id="cue_s08_c2_finma_30b_shows_significantly_better"><title>finma-30b shows significantly better performance finma-7b most nlp tasks stock</title><rect x="64" y="270" width="560" height="280" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="270" width="6" height="280" rx="6" fill="#34D3C0"/><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">30B vs 7B  ·  most NLP &amp; stock tasks</text><rect x="300" y="336" width="240" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="336" width="228" height="30" rx="6" fill="#4C9BE8"/><text x="288" y="357.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">FinMA-7B</text><text x="538" y="357.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">similar</text><rect x="300" y="384" width="240" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="384" width="228" height="30" rx="6" fill="#34D3C0"/><text x="288" y="405.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">FinMA-30B</text><text x="538" y="405.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">similar</text><rect x="92" y="430" width="504" height="100" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">Scaling barely moves the needle</text><text x="112" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Instruction-data quality and diversity matter more than</text><text x="112" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sheer parameter count.</text></g><g id="cue_s08_c3_scale_does_help_complex_quantitative"><title>scale does help complex quantitative question answering like convfinqa mirroring</title><rect x="656" y="158" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="180" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Where scale does help</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">On complex quantitative QA like ConvFinQA, the larger</text><text x="684" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">model improves, mirroring LLaMA's better math at scale.</text><rect x="684" y="290" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936" y="312" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#F2C14E" font-weight="800" text-anchor="middle">ConvFinQA:  30B &gt; 7B   (still trails GPT-4)</text></g><g id="cue_s08_c4_notably_finma_7b_full_fine_tuned_bot"><title>notably finma-7b-full fine-tuned both nlp prediction tasks achieves best performance</title><rect x="656" y="354" width="560" height="196" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="354" width="6" height="196" rx="6" fill="#48C78E"/><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Task-specific tuning wins</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">FinMA-7B-full, fine-tuned on both NLP and prediction</text><text x="684" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">tasks, is the best of all models on ACL18 stock</text><text x="684" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">prediction.</text><rect x="684" y="494" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="511.0" r="5" fill="#48C78E"/><text x="718" y="517.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Best on ACL18: FinMA-7B-full</text></g></svg>