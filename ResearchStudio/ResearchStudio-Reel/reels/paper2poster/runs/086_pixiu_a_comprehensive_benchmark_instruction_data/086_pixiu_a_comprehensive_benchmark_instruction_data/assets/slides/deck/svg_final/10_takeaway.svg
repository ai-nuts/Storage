<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Open resources move finance forward</text><g id="cue_s10_c1_takeaway_simple"><title>takeaway simple</title><rect x="64" y="176" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="116" rx="6" fill="#4C9BE8"/><circle cx="112" cy="234" r="10" fill="#4C9BE8"/><text x="150" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A simple takeaway</text><text x="150" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">PIXIU gives the financial AI community open resources it never had before.</text></g><g id="cue_s10_c2_pixiu_provides_financial_community_i"><title>pixiu provides financial community its first fully open triad instruction-following</title><rect x="64" y="308" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="116" rx="6" fill="#34D3C0"/><circle cx="112" cy="366" r="10" fill="#34D3C0"/><text x="150" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">The first fully open triad</text><text x="150" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">An instruction-following financial LLM (FinMA), a large multi-task instruction dataset</text><text x="150" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">(FIT), and a holistic benchmark (FLARE).</text></g><g id="cue_s10_c3_shows_careful_domain_instruction_tun"><title>shows careful domain instruction tuning let relatively small open beat</title><rect x="64" y="440" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="116" rx="6" fill="#48C78E"/><circle cx="112" cy="498" r="10" fill="#48C78E"/><text x="150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Small, open, and competitive</text><text x="150" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Careful domain instruction tuning lets a relatively small open model beat far larger</text><text x="150" y="542" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">general systems on financial language, while quantitative reasoning and stock prediction</text><text x="150" y="566" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">remain open challenges.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">PIXIU: A Comprehensive Benchmark, Instruction Dataset &amp; Large Language Model for Finance</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">NeurIPS 2023  ·  Xie et al.  ·  arXiv:2306.05443  ·  github.com/chancefocus/PIXIU</text></svg>