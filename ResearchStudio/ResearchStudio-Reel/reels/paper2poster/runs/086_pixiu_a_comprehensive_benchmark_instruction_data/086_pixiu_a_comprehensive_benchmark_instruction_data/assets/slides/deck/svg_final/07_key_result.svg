<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">FinMA beats far larger models</text><g id="cue_s07_c1_flare_benchmark_fine_tuned_finma_mod"><title>flare benchmark fine-tuned finma models significantly outperform other large language</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">On FLARE, fine-tuned FinMA significantly outperforms other LLMs on most financial NLP tasks.</text></g><g id="cue_s07_c2_example_financial_phrase_bank_sentim"><title>example financial phrase bank sentiment dataset finma-30b outperforms gpt-4 ten</title><rect x="64" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="264" rx="6" fill="#34D3C0"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Financial Phrase Bank  ·  weighted F1</text><rect x="320" y="278" width="230" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="278" width="130" height="30" rx="6" fill="#F2685C"/><text x="308" y="299.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">BloombergGPT</text><text x="460" y="299.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">0.51</text><rect x="320" y="326" width="230" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="326" width="199" height="30" rx="6" fill="#F2C14E"/><text x="308" y="347.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">GPT-4</text><text x="529" y="347.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">0.78</text><rect x="320" y="374" width="230" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="374" width="224" height="30" rx="6" fill="#48C78E"/><text x="308" y="395.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">FinMA-30B</text><text x="554" y="395.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">0.88</text><rect x="92" y="418" width="504" height="44" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">FinMA-30B: +10% F1 vs GPT-4, +37% vs BloombergGPT</text></g><g id="cue_s07_c3_however_finma_underperforms_question"><title>however finma underperforms question answering tasks demand quantitative reasoning limitation</title><rect x="656" y="214" width="560" height="128" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="128" rx="6" fill="#F2C14E"/><text x="684" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Limitation  ·  quantitative QA</text><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">FinMA underperforms on question answering that demands</text><text x="684" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">quantitative reasoning, inherited from LLaMA's weak math</text><text x="684" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">ability.</text></g><g id="cue_s07_c4_across_all_models_stock_movement"><title>across all models stock movement prediction remains challenging leaving clear</title><rect x="656" y="358" width="560" height="120" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="358" width="6" height="120" rx="6" fill="#F2685C"/><text x="684" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Open challenge  ·  stock prediction</text><text x="684" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Across all models, stock movement prediction stays hard,</text><text x="684" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">leaving clear room for future work.</text></g><text x="64" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Tailoring an open LLM to finance via instruction tuning pays off on language tasks.</text><text x="64" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">Higher is better on the Financial Phrase Bank sentiment benchmark; values are weighted F1.</text></svg>