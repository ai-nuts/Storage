<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Networks rely on color, yet colors shift</text><g id="cue_s02_c1_convolutional_neural_networks_lean_h"><title>convolutional neural networks lean heavily color recognize objects but real-world</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">CNNs lean heavily on color</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Convolutional networks use color as a</text><text x="92" y="263" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">strong cue to recognize objects, but</text><text x="92" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">real-world data rarely contains every</text><text x="92" y="309" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">color a class can take.</text><rect x="92" y="352" width="344" height="140" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">Training colors seen</text><rect x="112" y="398" width="30" height="30" rx="7" fill="#F2685C"/><rect x="156" y="398" width="30" height="30" rx="7" fill="#F2A24E"/><rect x="200" y="398" width="30" height="30" rx="7" fill="#F2C14E"/><rect x="244" y="398" width="30" height="30" rx="7" fill="#48C78E"/><rect x="288" y="398" width="30" height="30" rx="7" fill="#34D3C0"/><text x="112" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#F2C14E" font-weight="700" text-anchor="start">Test colors can be anything</text></g><g id="cue_s02_c2_when_trained_mostly_red_cars"><title>when trained mostly red cars sees blue one accuracy collapses</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Trained on red cars, tested on a blue one</text><rect x="540" y="246" width="148" height="30" rx="8" fill="#F2685C"/><rect x="570" y="228" width="78" height="26" rx="8" fill="#F2685C"/><circle cx="574" cy="278" r="13" fill="#0B1B2B" stroke="#F2685C" stroke-width="3"/><circle cx="654" cy="278" r="13" fill="#0B1B2B" stroke="#F2685C" stroke-width="3"/><text x="618" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="middle">train</text><text x="690" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="736" y="246" width="148" height="30" rx="8" fill="#4C9BE8"/><rect x="766" y="228" width="78" height="26" rx="8" fill="#4C9BE8"/><circle cx="770" cy="278" r="13" fill="#0B1B2B" stroke="#4C9BE8" stroke-width="3"/><circle cx="850" cy="278" r="13" fill="#0B1B2B" stroke="#4C9BE8" stroke-width="3"/><text x="814" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="middle">test</text><rect x="900" y="224" width="288" height="52" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1044" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">accuracy</text><text x="1044" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="middle">collapses</text></g><g id="cue_s02_c3_classic_remedy_color_invariance_side"><title>classic remedy color invariance sidesteps problem removing color entirely but</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F2C14E"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">The classic remedy overshoots</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Color invariance sidesteps the issue by removing color entirely, throwing</text><text x="528" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">away a genuinely useful signal.</text></g><g id="cue_s02_c4_frames_real_challenge_keeping_color"><title>frames real challenge keeping color information while still generalizing across</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#34D3C0"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">The real challenge</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Keep color information while still generalizing across colors that were</text><text x="528" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">rare or absent during training.</text></g></svg>