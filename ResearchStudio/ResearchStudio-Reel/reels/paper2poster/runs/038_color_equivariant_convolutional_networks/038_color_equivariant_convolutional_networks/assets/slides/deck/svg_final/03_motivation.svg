<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Color is a natural axis for equivariance</text><g id="cue_s03_c1_group_equivariant_convolutions_taugh"><title>group equivariant convolutions taught networks share parameters across rotations flips</title><rect x="64" y="158" width="560" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="200" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Equivariance paid off for geometry</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Group equivariant convolutions share parameters across</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rotations and flips, dramatically improving data</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">efficiency for geometric transformations.</text><circle cx="150" cy="300" r="20" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><path d="M 168 294 L 168 284 L 158 284" fill="none" stroke="#4C9BE8" stroke-width="2.5" stroke-linecap="round"/><circle cx="280" cy="300" r="20" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><path d="M 298 294 L 298 284 L 288 284" fill="none" stroke="#4C9BE8" stroke-width="2.5" stroke-linecap="round"/><circle cx="410" cy="300" r="20" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><path d="M 428 294 L 428 284 L 418 284" fill="none" stroke="#4C9BE8" stroke-width="2.5" stroke-linecap="round"/><text x="510" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">rotations, flips</text></g><g id="cue_s03_c2_yet_photometric_changes_such_shifts"><title>yet photometric changes such shifts hue had been left aside</title><rect x="64" y="374" width="560" height="176" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="374" width="6" height="176" rx="6" fill="#F2C14E"/><text x="92" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Photometric changes were left aside</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Hue shifts and other photometric transformations had gone</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">largely unexplored, even as geometry got all the</text><text x="92" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">attention.</text><rect x="92" y="494" width="26" height="26" rx="6" fill="#F2685C"/><rect x="128" y="494" width="26" height="26" rx="6" fill="#F2A24E"/><rect x="164" y="494" width="26" height="26" rx="6" fill="#F2C14E"/><rect x="200" y="494" width="26" height="26" rx="6" fill="#48C78E"/><rect x="236" y="494" width="26" height="26" rx="6" fill="#34D3C0"/><rect x="272" y="494" width="26" height="26" rx="6" fill="#4C9BE8"/><rect x="308" y="494" width="26" height="26" rx="6" fill="#9B7BE8"/></g><g id="cue_s03_c3_studies_trained_cnns_show_early"><title>studies trained cnns show early layers learn strongly color-selective neurons</title><rect x="648" y="158" width="568" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="200" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Early CNN layers are color-selective</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Studies of trained CNNs show that early layers learn</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">strongly color-selective neurons.</text><circle cx="718" cy="318" r="15" fill="#F2685C"/><circle cx="788" cy="318" r="15" fill="#F2C14E"/><circle cx="858" cy="318" r="15" fill="#48C78E"/><circle cx="928" cy="318" r="15" fill="#4C9BE8"/><text x="1008" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">color-tuned filters</text></g><g id="cue_s03_c4_motivates_treating_hue_shift_same"><title>motivates treating hue shift same way prior work treated rotation</title><rect x="648" y="374" width="568" height="176" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="648" y="374" width="6" height="176" rx="6" fill="#34D3C0"/><text x="676" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Treat a hue shift like a rotation</text><text x="676" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Make hue a symmetry the network respects by design, rather</text><text x="676" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">than something it must relearn from data.</text><text x="676" y="528" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">rotation  ~=  hue shift</text></g></svg>