<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Hue shift as a rotation, shared by design</text><g id="cue_s05_c1_hue_shift_hsv_space_becomes"><title>hue shift hsv space becomes rgb space rotation around gray</title><rect x="64" y="158" width="568" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="200" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Hue shift = rotation about gray axis</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">In RGB space a hue shift is a rotation around the</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">black-to-white diagonal. This is the group H-n of n</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">discrete rotations about that axis.</text><rect x="92" y="314" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="342.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">H_n = { n rotations about [1,1,1] in RGB }</text></g><g id="cue_s05_c2_color_equivariant_convolution_correl"><title>color equivariant convolution correlates input hue-rotated copies filter producing feature</title><rect x="64" y="374" width="568" height="176" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="374" width="6" height="176" rx="6" fill="#34D3C0"/><text x="92" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Correlate hue-rotated filter copies</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Each filter is applied in every hue rotation, adding a</text><text x="92" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">group dimension k that indexes the hue rotation in the</text><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">feature map.</text><rect x="92" y="502" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="530.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">[f * psi](x,k) = sum f_c(y) H_n(k) psi_c(y-x)</text></g><g id="cue_s05_c3_hidden_layers_filters_cyclically_per"><title>hidden layers filters cyclically permuted across dimension equivariance preserved throughout</title><rect x="656" y="158" width="560" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="200" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Hidden layers: cyclic permutation</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Filters are cyclically permuted across the color</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">dimension, so equivariance is preserved layer after</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">layer throughout the network.</text><rect x="684.0" y="300" width="30" height="30" rx="6" fill="#F2685C"/><text x="776.6666666666666" y="321.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="839.3333333333333" y="300" width="30" height="30" rx="6" fill="#F2C14E"/><text x="931.9999999999999" y="321.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="994.6666666666666" y="300" width="30" height="30" rx="6" fill="#34D3C0"/><text x="1087.3333333333333" y="321.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="1150.0" y="300" width="30" height="30" rx="6" fill="#9B7BE8"/><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">color dimension k  ·  cyclic shift preserves equivariance</text></g><g id="cue_s05_c4_because_extra_dimension_multiplies_n"><title>because extra dimension multiplies number feature maps authors decompose filters</title><rect x="656" y="374" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="374" width="6" height="176" rx="6" fill="#48C78E"/><text x="684" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Keep the cost in check</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The extra dimension multiplies feature maps, so filters</text><text x="684" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">split into spatial and pointwise parts; hybrids use color</text><text x="684" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">equivariance only in early stages.</text><rect x="684" y="502" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="530.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">MACs +|H_n|/k^2 + |H_n|   (small overhead)</text></g></svg>