<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">What makes it work</text><g id="cue_s08_c1_ablations_clarify_design_choices_inc"><title>ablations clarify design choices increasing number discrete hue rotations makes</title><rect x="64" y="158" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="180" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">More hue rotations -&gt; more robust</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Increasing the number of discrete rotations raises</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">test-time robustness, with a slight capacity cost as</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">channels shrink to keep parameters fixed.</text><rect x="360" y="286" width="236" height="40" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><polyline points="360,318 370,315 380,313 390,311 400,310 410,308 420,307 430,305 440,304 450,303 460,302 470,302 480,301 490,300 500,300 510,299 520,299 530,298 540,298 550,298 560,297 570,297 580,297 590,297" fill="none" stroke="#4C9BE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#6E869C" font-weight="600" text-anchor="end">n rotations -&gt;</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">robustness -&gt;</text></g><g id="cue_s08_c2_group_coset_pooling_turns_out"><title>group coset pooling turns out mechanism yields hue invariance remove</title><rect x="64" y="354" width="560" height="196" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="354" width="6" height="196" rx="6" fill="#48C78E"/><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Coset pooling drives invariance</text><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Group coset pooling is the mechanism that yields hue</text><text x="92" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">invariance. Remove it, and the network behaves like a</text><text x="92" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">regular one.</text><text x="92" y="510" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#48C78E" font-weight="800" text-anchor="start">no coset pool  =  ordinary CNN</text></g><g id="cue_s08_c3_finally_color_equivariance_color_jit"><title>finally color equivariance color-jitter augmentation complementary equivariant network needs lower</title><rect x="656" y="158" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="180" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Complements color-jitter</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Equivariance and color-jitter augmentation are</text><text x="684" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">complementary: an equivariant network needs a lower</text><text x="684" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">intensity of augmentation to reach the same robustness.</text></g><g id="cue_s08_c4_color_selectivity_analysis_further_e"><title>color-selectivity analysis further explains when method helps showing datasets more</title><rect x="656" y="354" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="354" width="6" height="196" rx="6" fill="#34D3C0"/><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Color-selectivity predicts benefit</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Datasets with more color-selective neurons benefit from</text><text x="684" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">equivariance up to later stages.</text><rect x="684" y="494" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="511.0" r="5" fill="#34D3C0"/><text x="718" y="517.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Flowers-102 color selectivity = 0.70  -&gt;  big gains</text></g></svg>