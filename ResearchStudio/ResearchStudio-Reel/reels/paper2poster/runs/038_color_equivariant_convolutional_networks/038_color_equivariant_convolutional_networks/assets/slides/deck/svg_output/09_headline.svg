<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact in one place</text><g id="cue_s09_c1_few_numbers_capture_impact_flowers_1"><title>few numbers capture impact flowers-102 under hue shifts accuracy nearly</title><rect x="64" y="168" width="1152" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="150" rx="6" fill="#48C78E"/><text x="92" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Flowers-102 under hue shifts  ·  accuracy nearly triples</text><rect x="92" y="226" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="202.0" y="267.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#F2685C" font-weight="800" text-anchor="middle">13.4%</text><text x="202.0" y="290.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">vanilla ResNet</text><text x="330" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#9DB3C8" font-weight="800" text-anchor="middle">-&gt;</text><rect x="360" y="226" width="220" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="470.0" y="267.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#48C78E" font-weight="800" text-anchor="middle">33.3%</text><text x="470.0" y="290.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">CEConv</text><rect x="612" y="226" width="230" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="727.0" y="267.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">~2.5x</text><text x="727.0" y="290.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">robustness gain</text><rect x="864" y="226" width="352" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="884" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A large jump on hue-shifted tests, with</text><text x="884" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">clean accuracy unchanged.</text></g><g id="cue_s09_c2_long_tailed_color_experiment_equivar"><title>long-tailed color experiment equivariant network gains almost twenty points over</title><rect x="64" y="334" width="560" height="174" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="334" width="6" height="174" rx="6" fill="#48C78E"/><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Long-tailed color experiment</text><rect x="92" y="392" width="220" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="202.0" y="435.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#48C78E" font-weight="800" text-anchor="middle">91.4%</text><text x="202.0" y="459.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">CE network</text><rect x="360" y="392" width="220" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="470.0" y="435.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#F2685C" font-weight="800" text-anchor="middle">71.6%</text><text x="470.0" y="459.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">vanilla CNN</text><text x="92" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Almost +20 points over the baseline.</text></g><g id="cue_s09_c3_cifar_100_improves_fifteen_points_st"><title>cifar-100 improves fifteen points stanford cars roughly thirteen points hue-shifted</title><rect x="656" y="334" width="560" height="174" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="334" width="6" height="174" rx="6" fill="#4C9BE8"/><text x="684" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Hue-shifted gains on harder sets</text><rect x="684" y="392" width="250" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="809.0" y="435.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#4C9BE8" font-weight="800" text-anchor="middle">+15.1</text><text x="809.0" y="459.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">CIFAR-100 pts</text><rect x="962" y="392" width="250" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1087.0" y="435.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#34D3C0" font-weight="800" text-anchor="middle">+12.6</text><text x="1087.0" y="459.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">Stanford Cars pts</text><text x="684" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Consistent lifts on realistic benchmarks.</text></g><g id="cue_s09_c4_all_comes_modest_compute_overhead"><title>all comes modest compute overhead since filter decomposition keeps increase</title><rect x="64" y="524" width="1152" height="72" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="524" width="6" height="72" rx="6" fill="#F2C14E"/><text x="92" y="554" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Modest compute overhead</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Filter decomposition keeps the increase small.</text><rect x="720" y="536" width="472" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="956.0" y="566.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">MACs +|H_n|/k^2 + |H_n|   ·   params +|H_n|/k^2 + 1</text></g></svg>