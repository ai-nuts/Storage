<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two scales, one robustness protocol</text><g id="cue_s06_c1_evaluation_spans_two_scales"><title>evaluation spans two scales</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The evaluation spans two scales: controlled synthetic toys and eight realistic image benchmarks.</text></g><g id="cue_s06_c2_first_two_synthetic_mnist_variants"><title>first two synthetic mnist variants isolate phenomenon long-tailed colormnist strong</title><rect x="64" y="240" width="560" height="168" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="6" height="168" rx="6" fill="#34D3C0"/><text x="92" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">Synthetic ColorMNIST</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Two variants isolate the phenomenon under controlled color</text><text x="92" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">statistics.</text><rect x="92" y="346" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="360.0" r="5" fill="#34D3C0"/><text x="126" y="366.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Long-tailed  ·  30 classes, strong imbalance</text><rect x="92" y="378" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="392.0" r="5" fill="#F2C14E"/><text x="126" y="398.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Biased  ·  10 classes, tunable hue spread</text></g><g id="cue_s06_c3_eight_standard_image_classification"><title>eight standard image classification benchmarks cifar stl-10 flowers-102 stanford cars</title><rect x="656" y="240" width="560" height="168" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="240" width="6" height="168" rx="6" fill="#4C9BE8"/><text x="684" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Eight natural-image benchmarks</text><text x="684" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Realistic classification, ResNet-18 / ResNet-44 on a single</text><text x="684" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A40 GPU.</text><rect x="684" y="346" width="504" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="360.0" r="5" fill="#4C9BE8"/><text x="718" y="366.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">CIFAR-10/100  ·  STL-10  ·  Flowers-102  ·  Pet</text><rect x="684" y="378" width="504" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="392.0" r="5" fill="#4C9BE8"/><text x="718" y="398.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Caltech-101  ·  Stanford Cars  ·  ImageNet</text></g><g id="cue_s06_c4_probe_robustness_every_test_image"><title>probe robustness every test image re-rendered under gradual hue shift</title><rect x="64" y="428" width="1152" height="122" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="428" width="6" height="122" rx="6" fill="#F2C14E"/><text x="92" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Robustness protocol: sweep the hue</text><text x="92" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Every test image is re-rendered under a gradual hue shift from -180 to +180 degrees,</text><text x="92" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">and accuracy is averaged across the full sweep.</text><rect x="830" y="470" width="26" height="26" rx="6" fill="#F2685C"/><rect x="866" y="470" width="26" height="26" rx="6" fill="#F2A24E"/><rect x="902" y="470" width="26" height="26" rx="6" fill="#F2C14E"/><rect x="938" y="470" width="26" height="26" rx="6" fill="#48C78E"/><rect x="974" y="470" width="26" height="26" rx="6" fill="#34D3C0"/><rect x="1010" y="470" width="26" height="26" rx="6" fill="#4C9BE8"/><rect x="1046" y="470" width="26" height="26" rx="6" fill="#9B7BE8"/></g></svg>