<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">NeurIPS 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Computer Vision Lab  ·  Delft University of Technology</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="152" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">Color Equivariant</text><text x="64" y="200" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#4C9BE8" font-weight="800" text-anchor="start">Convolutional Networks</text><rect x="690" y="168" width="30" height="30" rx="7" fill="#F2685C"/><rect x="732" y="168" width="30" height="30" rx="7" fill="#F2A24E"/><rect x="774" y="168" width="30" height="30" rx="7" fill="#F2C14E"/><rect x="816" y="168" width="30" height="30" rx="7" fill="#48C78E"/><rect x="858" y="168" width="30" height="30" rx="7" fill="#34D3C0"/><rect x="900" y="168" width="30" height="30" rx="7" fill="#4C9BE8"/><rect x="942" y="168" width="30" height="30" rx="7" fill="#9B7BE8"/><text x="64" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Lengyel  ·  Strafforello  ·  Bruintjes  ·  Gielisse  ·  van Gemert     —   TU Delft, Computer Vision Lab</text><g id="cue_s01_c1_color_powerful_cue_convolutional_net"><title>color powerful cue convolutional networks readily exploit object recognition but</title><rect x="64" y="290" width="373" height="250" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="290" width="373" height="6" rx="6" fill="#F2685C"/><rect x="90" y="324" width="18" height="18" rx="5" fill="#F2685C"/><rect x="116" y="324" width="18" height="18" rx="5" fill="#F2A24E"/><rect x="142" y="324" width="18" height="18" rx="5" fill="#F2C14E"/><rect x="168" y="324" width="18" height="18" rx="5" fill="#48C78E"/><rect x="194" y="324" width="18" height="18" rx="5" fill="#34D3C0"/><text x="90" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Color: a cue and a liability</text><text x="90" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CNNs readily exploit color for object</text><text x="90" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">recognition, but it becomes a liability</text><text x="90" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">when test-time colors differ from those</text><text x="90" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">seen in training.</text></g><g id="cue_s01_c2_introduces_color_equivariant_convolu"><title>introduces color equivariant convolutions ceconvs new building block shares shape</title><rect x="454" y="290" width="373" height="250" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="454" y="290" width="373" height="6" rx="6" fill="#34D3C0"/><rect x="480" y="324" width="18" height="18" rx="5" fill="#F2685C"/><rect x="506" y="324" width="18" height="18" rx="5" fill="#F2A24E"/><rect x="532" y="324" width="18" height="18" rx="5" fill="#F2C14E"/><rect x="558" y="324" width="18" height="18" rx="5" fill="#48C78E"/><rect x="584" y="324" width="18" height="18" rx="5" fill="#34D3C0"/><text x="480" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Color Equivariant Convolutions</text><text x="480" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A new building block, CEConv, that shares</text><text x="480" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">shape features across the color spectrum</text><text x="480" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">while preserving discriminative color</text><text x="480" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">information.</text></g><g id="cue_s01_c3_hard_wiring_parameter_sharing_over_d"><title>hard-wiring parameter sharing over discrete hue shifts ceconvs let networks</title><rect x="844" y="290" width="373" height="250" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="844" y="290" width="373" height="6" rx="6" fill="#4C9BE8"/><rect x="870" y="324" width="18" height="18" rx="5" fill="#F2685C"/><rect x="896" y="324" width="18" height="18" rx="5" fill="#F2A24E"/><rect x="922" y="324" width="18" height="18" rx="5" fill="#F2C14E"/><rect x="948" y="324" width="18" height="18" rx="5" fill="#48C78E"/><rect x="974" y="324" width="18" height="18" rx="5" fill="#34D3C0"/><text x="870" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Parameter sharing over hue</text><text x="870" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">By hard-wiring sharing over discrete hue</text><text x="870" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">shifts, CEConvs let ResNets generalize to</text><text x="870" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">rare colors and stay robust, without</text><text x="870" y="499" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">discarding color.</text></g><line x1="64" y1="570" x2="1216" y2="570" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2310.19368</text><text x="280" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/Attila94/CEConv</text><text x="1216" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Share shape across colors — keep color in its own dimension.</text></svg>