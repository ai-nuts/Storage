<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Robust to hue shifts, free on clean data</text><g id="cue_s07_c1_headline_finding_robustness_without"><title>headline finding robustness without cost clean accuracy original unshifted test</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">On original, unshifted test sets, color-equivariant ResNets match vanilla ResNets — no clean-accuracy cost.</text></g><g id="cue_s07_c2_but_when_test_images_hue_shifted"><title>but when test images hue-shifted gap opens dramatically</title><rect x="64" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="264" rx="6" fill="#34D3C0"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Flowers-102  ·  avg over hue shifts</text><rect x="300" y="286" width="250" height="32" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="286" width="83" height="32" rx="6" fill="#F2685C"/><text x="288" y="310.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">vanilla ResNet</text><text x="393" y="310.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">13.4%</text><rect x="300" y="340" width="250" height="32" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="340" width="208" height="32" rx="6" fill="#48C78E"/><text x="288" y="364.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">CEConv</text><text x="518" y="364.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">33.3%</text><rect x="92" y="398" width="504" height="60" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#34D3C0" font-weight="800" text-anchor="start">Nearly 2.5x higher when the test hue shifts</text><text x="112" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">...while clean accuracy stays on par</text></g><g id="cue_s07_c3_flowers_102_average_accuracy_across"><title>flowers-102 average accuracy across hue shifts jumps about thirteen percent</title><rect x="656" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="264" rx="6" fill="#F2C14E"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Same story on harder sets</text><rect x="892" y="286" width="250" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="286" width="146" height="28" rx="6" fill="#F2685C"/><text x="880" y="307.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">CIFAR-100 base</text><text x="1048" y="307.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">47.0%</text><rect x="892" y="330" width="250" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="330" width="194" height="28" rx="6" fill="#48C78E"/><text x="880" y="351.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">CIFAR-100 CE</text><text x="1096" y="351.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">62.1%</text><rect x="892" y="382" width="250" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="382" width="173" height="28" rx="6" fill="#F2685C"/><text x="880" y="403.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Cars base</text><text x="1075" y="403.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">55.6%</text><rect x="892" y="426" width="250" height="28" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="892" y="426" width="213" height="28" rx="6" fill="#4C9BE8"/><text x="880" y="447.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Cars CE</text><text x="1115" y="447.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">68.2%</text></g><g id="cue_s07_c4_controlled_long_tailed_experiment_eq"><title>controlled long-tailed experiment equivariant network reaches ninety-one percent against baseline</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#4C9BE8"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Controlled long-tailed ColorMNIST</text><rect x="900" y="506" width="150" height="88" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="975.0" y="551.76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="29.92" fill="#48C78E" font-weight="800" text-anchor="middle">91.4%</text><text x="975.0" y="576.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">CE network</text><rect x="1058" y="506" width="150" height="88" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1133.0" y="551.76" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="29.92" fill="#F2685C" font-weight="800" text-anchor="middle">71.6%</text><text x="1133.0" y="576.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">vanilla CNN</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The equivariant network reaches 91% versus 72%, with</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the biggest gains exactly on the rare classes that</text><text x="92" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">shape sharing is meant to help.</text></g><text x="64" y="648" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Biggest improvements land on the rare, underrepresented colors.</text></svg>