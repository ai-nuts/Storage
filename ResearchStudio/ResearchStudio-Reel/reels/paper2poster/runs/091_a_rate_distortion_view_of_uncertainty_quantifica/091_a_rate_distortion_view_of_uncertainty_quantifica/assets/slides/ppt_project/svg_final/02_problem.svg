<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
<rect x="0" y="0" width="1280" height="720" fill="#0e131f"/>
<rect x="0" y="0" width="1280" height="720" fill="#0e131f"/>
<rect x="64.0" y="44.0" width="6.0" height="34.0" rx="3" fill="#33d6c6"/>
<text x="84.0" y="58.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33d6c6" font-weight="bold" letter-spacing="2.5">PROBLEM</text>
<text x="83.0" y="90.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#eaf1fb" font-weight="bold">Confident, even when far from the data</text>
<g id="cue_s02_c1_trustworthy_should_know_when_operati" data-cue-label="cue_s02_c1_trustworthy_should_know_when_operati"><title>trustworthy should know when operating far what seen</title>
<rect x="64.0" y="150.0" width="369.3" height="430.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="64.0" y="166.0" width="4.5" height="398.0" rx="2.2" fill="#33d6c6"/>
<text x="86.0" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#eaf1fb" font-weight="bold">Know your limits</text>
<text x="86.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">A trustworthy model</text>
<text x="86.0" y="239.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">should know when it is</text>
<text x="86.0" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">operating far from what</text>
<text x="86.0" y="289.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">it has seen.</text>
<text x="86.0" y="314.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc"></text>
<text x="86.0" y="339.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Reliable uncertainty is</text>
<text x="86.0" y="364.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">the missing signal.</text>
</g>
<g id="cue_s02_c2_deep_neural_networks_however_often" data-cue-label="cue_s02_c2_deep_neural_networks_however_often"><title>deep neural networks however often make confident predictions even inputs</title>
<rect x="455.3" y="150.0" width="369.3" height="430.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="455.3" y="166.0" width="4.5" height="398.0" rx="2.2" fill="#ff6b6b"/>
<text x="477.3" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#eaf1fb" font-weight="bold">But deep nets don&#x27;t</text>
<text x="477.3" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Deep neural networks</text>
<text x="477.3" y="239.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">often make highly</text>
<text x="477.3" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">confident predictions</text>
<text x="477.3" y="289.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">even on inputs wildly</text>
<text x="477.3" y="314.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">different from their</text>
<text x="477.3" y="339.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">training data.</text>
<text x="477.3" y="364.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc"></text>
<text x="477.3" y="389.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Overconfidence = risk.</text>
</g>
<g id="cue_s02_c3_classical_probabilistic_models_such" data-cue-label="cue_s02_c3_classical_probabilistic_models_such"><title>classical probabilistic models such gaussian processes built-in sense distance set</title>
<rect x="846.7" y="150.0" width="369.3" height="430.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="846.7" y="166.0" width="4.5" height="398.0" rx="2.2" fill="#4f7cff"/>
<text x="868.7" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#eaf1fb" font-weight="bold">GPs vs deep nets</text>
<text x="868.7" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Gaussian Processes have</text>
<text x="868.7" y="239.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">a built-in sense of</text>
<text x="868.7" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">distance from the</text>
<text x="868.7" y="289.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">training set.</text>
<text x="868.7" y="314.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc"></text>
<text x="868.7" y="339.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Standard deep networks</text>
<text x="868.7" y="364.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">do not — efficient UQ</text>
<text x="868.7" y="389.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">stays an open problem.</text>
</g>
</svg>
