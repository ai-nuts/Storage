<rect x="0" y="0" width="1280" height="720" fill="#0e131f"/>
<rect x="64.0" y="44.0" width="6.0" height="34.0" rx="3" fill="#33d6c6"/>
<text x="84.0" y="58.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#33d6c6" font-weight="bold" letter-spacing="2.5">TAKEAWAY</text>
<text x="83.0" y="90.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#eaf1fb" font-weight="bold">A unified, distance-aware view</text>
<g id="cue_s10_c1_takeaway_recasting_uncertainty_probl" data-cue-label="cue_s10_c1_takeaway_recasting_uncertainty_probl"><title>takeaway recasting uncertainty problem compressing learned codebook gives single deterministic</title>
<rect x="64.0" y="150.0" width="564.0" height="300.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="64.0" y="166.0" width="4.5" height="268.0" rx="2.2" fill="#4f7cff"/>
<text x="86.0" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#eaf1fb" font-weight="bold">Compression buys distance</text>
<text x="86.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Recast uncertainty as compressing training data into</text>
<text x="86.0" y="239.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">a learned codebook, and a single deterministic network</text>
<text x="86.0" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">gains a genuine sense of distance from what it has seen —</text>
<text x="86.0" y="289.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">matching or beating expensive ensembles at a fraction</text>
<text x="86.0" y="314.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">of the cost.</text>
</g>
<g id="cue_s10_c2_because_notion_distance_statistical" data-cue-label="cue_s10_c2_because_notion_distance_statistical"><title>because notion distance statistical rather geometric dab offers unified gaussian-process-like</title>
<rect x="652.0" y="150.0" width="564.0" height="300.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="652.0" y="166.0" width="4.5" height="268.0" rx="2.2" fill="#33d6c6"/>
<text x="674.0" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#eaf1fb" font-weight="bold">Statistical, not geometric</text>
<text x="674.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">Because distance is statistical rather than geometric,</text>
<text x="674.0" y="239.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">DAB gives a unified, Gaussian-Process-like view of</text>
<text x="674.0" y="264.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">uncertainty — for both classification and regression —</text>
<text x="674.0" y="289.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">and can even be attached after the fact to large</text>
<text x="674.0" y="314.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9db0cc">pre-trained models.</text>
</g>
<rect x="64.0" y="480.0" width="1152.0" height="70.0" rx="14" fill="#152239" stroke="#2f4160" stroke-width="1"/>
<text x="90.0" y="524.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#eaf1fb" font-weight="bold">Distance Aware Bottleneck — principled uncertainty in one forward pass.</text>
<circle cx="1176.0" cy="515.0" r="8.0" fill="#33d6c6"/>
</svg>
