<text x="672.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9db0cc">Closely analogous to a GP: the codebook plays the role</text>
<text x="672.0" y="237.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9db0cc">of inducing points, and statistical distance replaces</text>
<text x="672.0" y="260.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9db0cc">Euclidean distance.</text>
</g>
