<text x="86.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9db0cc">Builds on the Information Bottleneck, but replaces its</text>
<text x="86.0" y="237.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9db0cc">rate term with an achievable rate from rate–distortion</text>
