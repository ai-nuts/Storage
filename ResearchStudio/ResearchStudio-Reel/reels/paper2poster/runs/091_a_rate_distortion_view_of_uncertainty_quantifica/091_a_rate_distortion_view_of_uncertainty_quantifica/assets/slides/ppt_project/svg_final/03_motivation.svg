<rect x="651.0" y="384.0" width="4.5" height="168.0" rx="2.2" fill="#33d6c6"/>
<text x="673.0" y="408.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#33d6c6" font-weight="bold">The question</text>
<text x="673.0" y="454.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#eaf1fb" font-weight="bold">Can a single deterministic</text>
<text x="673.0" y="484.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#eaf1fb" font-weight="bold">model be distance-aware</text>
<text x="673.0" y="514.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#9db0cc">without any of these drawbacks?</text>
</g>
