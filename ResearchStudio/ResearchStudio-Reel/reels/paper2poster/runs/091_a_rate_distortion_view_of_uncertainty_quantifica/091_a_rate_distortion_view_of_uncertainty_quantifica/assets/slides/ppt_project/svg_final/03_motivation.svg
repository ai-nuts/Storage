<rect x="64.0" y="166.0" width="4.5" height="168.0" rx="2.2" fill="#4f7cff"/>
<text x="86.0" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#eaf1fb" font-weight="bold">Single-pass tricks</text>
<text x="86.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">Fast one-forward-pass methods lean on architectural</text>
<text x="86.0" y="238.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">tricks — e.g. spectral normalization — to stop the</text>
<text x="86.0" y="262.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">network&#x27;s features from collapsing.</text>
</g>
<g id="cue_s03_c2_those_constraints_quietly_damage_cal" data-cue-label="cue_s03_c2_those_constraints_quietly_damage_cal"><title>those constraints quietly damage calibration awkward bolt onto large pre-trained</title>
<rect x="651.0" y="150.0" width="565.0" height="200.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="651.0" y="166.0" width="4.5" height="168.0" rx="2.2" fill="#f4b451"/>
<text x="673.0" y="184.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#eaf1fb" font-weight="bold">Hidden costs</text>
<text x="673.0" y="214.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">Those constraints can quietly damage calibration and</text>
<text x="673.0" y="238.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">are awkward to bolt onto large pre-trained models.</text>
</g>
<g id="cue_s03_c3_alternative_deep_ensembles_bayesian" data-cue-label="cue_s03_c3_alternative_deep_ensembles_bayesian"><title>alternative deep ensembles bayesian networks naturally distance-aware but require many</title>
<rect x="64.0" y="368.0" width="565.0" height="200.0" rx="16" fill="#1a2536" stroke="#2f4160" stroke-width="1.2"/>
<rect x="64.0" y="384.0" width="4.5" height="168.0" rx="2.2" fill="#ff6b6b"/>
<text x="86.0" y="402.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#eaf1fb" font-weight="bold">Ensembles are pricey</text>
<text x="86.0" y="432.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">Deep ensembles and Bayesian nets are naturally</text>
<text x="86.0" y="456.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">distance-aware — but need many forward passes,</text>
<text x="86.0" y="480.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9db0cc">which is expensive at scale.</text>
</g>
<g id="cue_s03_c4_authors_ask_whether_single_determini" data-cue-label="cue_s03_c4_authors_ask_whether_single_determini"><title>authors ask whether single deterministic distance-aware without these drawbacks</title>
