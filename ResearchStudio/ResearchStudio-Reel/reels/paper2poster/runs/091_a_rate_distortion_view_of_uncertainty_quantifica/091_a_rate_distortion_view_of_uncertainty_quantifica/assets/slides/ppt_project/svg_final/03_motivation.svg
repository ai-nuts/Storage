<text x="83.0" y="90.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#eaf1fb" font-weight="bold">Fast or distance-aware — why not both?</text>
<g id="cue_s03_c1_today_fast_single_forward_pass_uncer" data-cue-label="cue_s03_c1_today_fast_single_forward_pass_uncer"><title>today fast single-forward-pass uncertainty methods usually depend special architectural tricks</title>
