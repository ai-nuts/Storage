" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">samples.</text></g><g id="cue_s04_c4_third_proposes_principled_way_choose"><title>third proposes principled way choose kernel lengthscales principal components which</title><rect x="848" y="240" width="368" height="320" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="240" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="310" r="27" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">PCA lengthscales</text><text x="876" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Chooses the kernel lengthscales from the</text><text x="876" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">principal components of the data,</text><text x="876" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">emphasizing high-variance features for</text><text x="876" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">corruption robustness.</text></g></svg>