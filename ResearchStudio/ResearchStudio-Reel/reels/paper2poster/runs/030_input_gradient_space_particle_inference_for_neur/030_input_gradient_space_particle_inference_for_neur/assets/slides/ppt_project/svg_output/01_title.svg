<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Aalto · Helsinki · Manchester</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">Input-Gradient Space Particle Inference</text><text x="64" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#4C9BE8" font-weight="800" text-anchor="start">for Neural Network Ensembles</text><rect x="64" y="232" width="150" height="30" rx="15" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="139" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="middle">FoRDE</text><text x="232" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#9DB3C8" font-weight="600" text-anchor="start">First-order Repulsive Deep Ensembles</text><text x="64" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6E869C" font-weight="500" text-anchor="start">Trung Trinh · Markus Heinonen · Luigi Acerbi · Samuel Kaski</text><g id="cue_s01_c1_introduces_first_order_repulsive_dee"><title>introduces first-order repulsive deep ensembles forde new way train neural</title><rect x="64" y="316" width="274" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="316" width="274" height="6" rx="6" fill="#4C9BE8"/><circle cx="92" cy="362" r="7" fill="#4C9BE8"/><text x="110" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">The method</text><text x="86" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">FoRDE trains an ensemble by</text><text x="86" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">repelling members in the space</text><text x="86" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">of their input gradients.</text></g><g id="cue_s01_c2_deep_ensembles_work_well_because"><title>deep ensembles work well because their members learn diverse functions</title><rect x="356" y="316" width="274" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="316" width="274" height="6" rx="6" fill="#F2C14E"/><circle cx="384" cy="362" r="7" fill="#F2C14E"/><text x="402" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Why it's new</text><text x="378" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Weight-space and function-space</text><text x="378" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">repulsion had failed to beat</text><text x="378" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">plain deep ensembles.</text></g><g id="cue_s01_c3_because_input_gradients_uniquely_cha"><title>because input gradients uniquely characterize function translation far smaller weights</title><rect x="648" y="316" width="274" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="316" width="274" height="6" rx="6" fill="#34D3C0"/><circle cx="676" cy="362" r="7" fill="#34D3C0"/><text x="694" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Why it works</text><text x="670" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Input gradients characterize a</text><text x="670" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">function up to translation, and</text><text x="670" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">are far smaller than weights.</text></g><g id="cue_s01_c4_result_ensemble_markedly_more_robust"><title>result ensemble markedly more robust better calibrated under input corruptions</title><rect x="940" y="316" width="274" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="316" width="274" height="6" rx="6" fill="#48C78E"/><circle cx="968" cy="362" r="7" fill="#48C78E"/><text x="986" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">The payoff</text><text x="962" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A markedly more robust and</text><text x="962" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">better-calibrated ensemble under</text><text x="962" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">input corruptions.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2306.02775</text><text x="280" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/AaltoPML/FoRDE</text><text x="1216" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="700" text-anchor="end">Repel where it matters: input-gradient space</text></svg>