<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact in four numbers</text><g id="cue_s09_c1_few_numbers_capture_impact"><title>few numbers capture impact</title><rect x="64" y="152" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">A few numbers capture what repelling input gradients buys you.</text></g><g id="cue_s09_c2_under_input_corruptions_forde_pca"><title>under input corruptions forde pca lengthscales improves accuracy about two</title><rect x="64" y="236" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="236" width="368" height="6" rx="6" fill="#48C78E"/><text x="248.0" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#48C78E" font-weight="800" text-anchor="middle">+2.4% / +1.3%</text><text x="248.0" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">accuracy on CIFAR-10-C / -100-C</text><text x="248.0" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">over the next-best method</text></g><g id="cue_s09_c3_its_diversity_efficient_too_ten_memb"><title>its diversity efficient too ten-member forde reaches same corruption robustness</title><rect x="456" y="236" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="236" width="368" height="6" rx="6" fill="#34D3C0"/><text x="640.0" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="38" fill="#34D3C0" font-weight="800" text-anchor="middle">10  ≈  30</text><text x="640.0" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">members match a deep ensemble</text><text x="640.0" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">3× fewer models, same robustness</text></g><g id="cue_s09_c4_these_gains_hold_across_demanding"><title>these gains hold across demanding benchmark nineteen corruption types five</title><rect x="848" y="236" width="368" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="236" width="368" height="6" rx="6" fill="#F2C14E"/><text x="1032.0" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="38" fill="#F2C14E" font-weight="800" text-anchor="middle">19 × 5</text><text x="1032.0" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">corruption types × severity levels</text><text x="1032.0" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="middle">a demanding robustness grid</text></g><rect x="64" y="464" width="1152" height="86" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="92" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Ensemble size 10  ·  ResNet18 backbone  ·  input-gradient kernel with linear cost in the number of training samples</text><text x="92" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#34D3C0" font-weight="700" text-anchor="start">Gains hold across CIFAR-10-C, CIFAR-100-C and TinyImageNet-C.</text></svg>