<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Where you repel members matters</text><g id="cue_s02_c1_ensembles_neural_networks_powerful_b"><title>ensembles neural networks powerful because different members capture different explanations</title><rect x="64" y="152" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Particle-based inference makes diversity explicit</text><text x="92" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Ensemble members capture different explanations of the data; a repulsion term pushes particles</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">apart. But the space you repel in decides whether it helps.</text></g><g id="cue_s02_c2_repelling_weight_space_wasteful_beca"><title>repelling weight space wasteful because neural networks heavily over-parameterized many</title><rect x="64" y="268" width="560" height="192" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="64" y="268" width="6" height="192" rx="6" fill="#F2685C"/><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2685C" font-weight="800" text-anchor="start">Weight space  ✗</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="700" text-anchor="start">wasteful</text><text x="92" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Networks are heavily over-parameterized, so many different</text><text x="92" y="387" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">weight vectors encode the very same function. Repelling</text><text x="92" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">weights mostly moves redundant coordinates.</text></g><g id="cue_s02_c3_repelling_directly_function_space_so"><title>repelling directly function space sounds appealing but requires comparing entire</title><rect x="656" y="268" width="560" height="192" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="268" width="6" height="192" rx="6" fill="#F2C14E"/><text x="684" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Function space  ✗</text><text x="684" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="700" text-anchor="start">intractable</text><text x="684" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Comparing whole functions is computationally hard; the</text><text x="684" y="387" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">shortcuts in prior work compared outputs only on training</text><text x="684" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">inputs and led to underfitting.</text></g><g id="cue_s02_c4_neither_weight_space_nor_function_sp"><title>neither weight-space nor function-space repulsion had delivered meaningful gains over</title><rect x="64" y="478" width="1152" height="72" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="478" width="6" height="72" rx="6" fill="#9DB3C8"/><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="800" text-anchor="start" letter-spacing="1.5">The gap</text><text x="92" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">Neither weight-space nor function-space repulsion delivered meaningful gains over standard deep ensembles.</text></g></svg>