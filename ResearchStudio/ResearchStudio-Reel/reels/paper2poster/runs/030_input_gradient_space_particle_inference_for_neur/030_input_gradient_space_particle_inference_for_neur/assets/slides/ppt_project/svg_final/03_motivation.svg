<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A third view: input gradients</text><g id="cue_s03_c1_authors_take_third_view_neural"><title>authors take third view neural network beyond its weights its</title><rect x="64" y="152" width="1152" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="120" rx="6" fill="#34D3C0"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">Represent a network a third way</text><text x="92" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">Beyond its weights and its function values, a model is characterized up to a translation by its</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">first-order input gradients — the derivatives of the output with respect to the input.</text><text x="92" y="262" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#4C9BE8" font-weight="700" text-anchor="start">grad_x f(x)   —  derivative of the output w.r.t. the input</text></g><g id="cue_s03_c2_representation_two_attractive_proper"><title>representation two attractive properties first input gradients same size input</title><rect x="64" y="290" width="368" height="260" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="290" width="368" height="6" rx="6" fill="#4C9BE8"/><text x="92" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Property 1  ·  compact</text><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Input gradients are the same size as the</text><text x="92" y="385" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">input — far smaller than the enormous</text><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">weight vector — so they are cheap to</text><text x="92" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">compare with a kernel.</text><text x="92" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">size to compare</text><rect x="92" y="488" width="312" height="20" rx="5" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="92" y="488" width="312" height="20" rx="5" fill="#F2685C"/><text x="104" y="503" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="start">weights</text><rect x="92" y="516" width="44" height="20" rx="5" fill="#4C9BE8"/><text x="144" y="531" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="700" text-anchor="start">input gradient</text></g><g id="cue_s03_c3_second_forcing_members_different_inp"><title>second forcing members different input gradients means forcing them depend</title><rect x="456" y="290" width="368" height="260" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="290" width="368" height="6" rx="6" fill="#34D3C0"/><text x="484" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Property 2  ·  distinct features</text><text x="484" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Forcing members to have different input</text><text x="484" y="385" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">gradients forces them to depend on</text><text x="484" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">different input features of the data.</text><rect x="484" y="458" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="502" cy="474.0" r="5" fill="#4C9BE8"/><text x="518" y="479.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Member A  →  features {edges}</text><rect x="484" y="498" width="312" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="502" cy="514.0" r="5" fill="#34D3C0"/><text x="518" y="519.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Member B  →  features {texture}</text></g><g id="cue_s03_c4_intuitively_should_make_ensemble_mor"><title>intuitively should make ensemble more robust because members react complementary</title><rect x="848" y="290" width="368" height="260" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="848" y="290" width="368" height="6" rx="6" fill="#48C78E"/><text x="876" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">The intuition  ·  robustness</text><text x="876" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">If members react to complementary</text><text x="876" y="385" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">patterns, corrupting one pattern will</text><text x="876" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">not fool all of them at once — the</text><text x="876" y="431" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">ensemble stays reliable.</text><text x="876" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">corrupt one feature  →</text><text x="876" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">others still classify correctly</text></g></svg>