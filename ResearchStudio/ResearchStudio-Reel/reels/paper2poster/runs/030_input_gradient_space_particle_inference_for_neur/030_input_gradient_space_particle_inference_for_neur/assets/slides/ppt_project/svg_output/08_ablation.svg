<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Lengthscales trade clean vs. robust</text><g id="cue_s08_c1_carefully_ablates_kernel_lengthscale"><title>carefully ablates kernel lengthscales which govern how repulsion distributed across</title><rect x="64" y="152" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The kernel lengthscales govern how repulsion is distributed across input dimensions — the key design knob.</text></g><g id="cue_s08_c2_pca_lengthscales_give_best_robustnes"><title>pca lengthscales give best robustness corruptions because they emphasize high-variance</title><rect x="64" y="230" width="368" height="150" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="230" width="6" height="150" rx="6" fill="#34D3C0"/><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">FoRDE-PCA</text><text x="92" y="296" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="700" text-anchor="start">best robustness</text><text x="92" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Emphasizes high-variance features, giving</text><text x="92" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the strongest corruption robustness.</text></g><g id="cue_s08_c3_identity_lengthscales_instead_give_b"><title>identity lengthscales instead give best clean accuracy cifar-100 best likelihood</title><rect x="456" y="230" width="760" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="230" width="6" height="150" rx="6" fill="#F2C14E"/><text x="484" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">FoRDE-Identity  &amp;  FoRDE-Tuned</text><text x="484" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Identity lengthscales give the best clean accuracy on CIFAR-100 and best likelihood on</text><text x="484" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CIFAR-10, but sacrifice some robustness.</text><text x="484" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">Tuning between the two extremes → best of both worlds in most cases.</text></g><g id="cue_s08_c4_separate_study_varies_ensemble_size"><title>separate study varies ensemble size finds forde ten members matches</title><rect x="64" y="398" width="1152" height="152" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="398" width="6" height="152" rx="6" fill="#4C9BE8"/><text x="92" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Diversity is efficient  ·  corruption robustness vs. ensemble size</text><rect x="360" y="452" width="760" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="360" y="452" width="253" height="26" rx="6" fill="#34D3C0"/><text x="348" y="470.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">FoRDE (10 members)</text><text x="623" y="470.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">10 members  →  matches</text><rect x="360" y="492" width="760" height="26" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="360" y="492" width="760" height="26" rx="6" fill="#9DB3C8"/><text x="348" y="510.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Deep Ensemble (30)</text><text x="1130" y="510.72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">30 members</text><text x="92" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">A 10-member FoRDE matches or exceeds the corruption robustness of a 30-member deep ensemble.</text></g></svg>