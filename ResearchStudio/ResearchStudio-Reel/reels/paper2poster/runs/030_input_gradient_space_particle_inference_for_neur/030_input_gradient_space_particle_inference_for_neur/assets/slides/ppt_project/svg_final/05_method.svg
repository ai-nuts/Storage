<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Wasserstein descent, input-gradient kernel</text><g id="cue_s05_c1_forde_built_wasserstein_gradient_des"><title>forde built wasserstein gradient descent particle-based variational inference method network</title><rect x="64" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="198" rx="6" fill="#4C9BE8"/><text x="92" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Wasserstein gradient descent</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Each network in the ensemble is a particle. Its update</text><text x="92" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">combines two forces at every step.</text><rect x="92" y="264" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="281.0" r="5" fill="#4C9BE8"/><text x="126" y="286.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Driving force  →  toward the Bayesian posterior</text><rect x="92" y="306" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="323.0" r="5" fill="#34D3C0"/><text x="126" y="328.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Repulsion force  →  pushes particles apart</text></g><g id="cue_s05_c2_driving_force_pulls_particle_toward"><title>driving force pulls particle toward high-density regions bayesian posterior just</title><rect x="648" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="152" width="6" height="198" rx="6" fill="#34D3C0"/><text x="676" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">The particle update</text><text x="676" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Driving term climbs the log-posterior; the kernel-weighted</text><text x="676" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">repulsion term spreads members out.</text><rect x="676" y="270" width="512" height="58" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="294" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">theta+ = theta + eta ( grad log pi(theta)</text><text x="932.0" y="316" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">          −  sum grad k / sum k )</text></g><g id="cue_s05_c3_instead_comparing_weights_outputs_fo"><title>instead comparing weights outputs forde compares input gradients true label</title><rect x="64" y="362" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="362" width="6" height="198" rx="6" fill="#F2C14E"/><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">The kernel  ·  the crucial choice</text><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Compare the true-label input gradients, normalized to the</text><text x="92" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">unit sphere, with an RBF kernel. Directions matter because</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">magnitudes shrink as training converges.</text><rect x="92" y="510" width="512" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="534" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">s = grad_x f(x)_y / || grad_x f(x)_y ||</text></g><g id="cue_s05_c4_finally_lengthscales_kernel_chosen_p"><title>finally lengthscales kernel chosen principal components repulsion strongest along most</title><rect x="648" y="362" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="362" width="6" height="198" rx="6" fill="#F2685C"/><text x="676" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">PCA lengthscales</text><text x="676" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Kernel lengthscales are set from the principal components of</text><text x="676" y="451" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the data, so repulsion is strongest along the most</text><text x="676" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">informative input directions.</text><line x1="688" y1="538" x2="798" y2="512" stroke="#4C9BE8" stroke-width="3" stroke-linecap="round"/><text x="804" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#4C9BE8" font-weight="700" text-anchor="start">PC1 (high variance)</text><line x1="688" y1="538" x2="740" y2="518" stroke="#34D3C0" stroke-width="2.5" stroke-linecap="round"/><text x="804" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#34D3C0" font-weight="700" text-anchor="start">PC2 (lower variance)</text></g></svg>