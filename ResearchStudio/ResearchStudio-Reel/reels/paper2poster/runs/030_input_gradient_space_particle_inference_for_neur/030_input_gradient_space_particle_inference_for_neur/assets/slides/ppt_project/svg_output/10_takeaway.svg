<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The space of diversity is the lever</text><g id="cue_s10_c1_lasting_message_space_which_you"><title>lasting message space which you enforce diversity matters much amount</title><rect x="64" y="168" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="118" rx="6" fill="#4C9BE8"/><circle cx="112" cy="227" r="10" fill="#4C9BE8"/><text x="150" y="216" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Where, not just how much</text><text x="150" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The space in which you enforce ensemble diversity matters as much as the amount of repulsion</text><text x="150" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">you apply.</text></g><g id="cue_s10_c2_repelling_ensemble_members_compact_s"><title>repelling ensemble members compact space their input gradients forde guarantees</title><rect x="64" y="304" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="304" width="6" height="118" rx="6" fill="#34D3C0"/><circle cx="112" cy="363" r="10" fill="#34D3C0"/><text x="150" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Input gradients are the sweet spot</text><text x="150" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Repelling in this compact space makes members genuinely different functions — without the</text><text x="150" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">waste of weights or the intractability of functions.</text></g><g id="cue_s10_c3_combined_data_driven_lengthscales_pr"><title>combined data-driven lengthscales principal component analysis yields ensembles more robust</title><rect x="64" y="440" width="1152" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="118" rx="6" fill="#48C78E"/><circle cx="112" cy="499" r="10" fill="#48C78E"/><text x="150" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Data-driven and robust</text><text x="150" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">With PCA lengthscales from principal component analysis, the ensembles are more robust and</text><text x="150" y="544" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">better calibrated under real-world input corruptions.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">FoRDE  ·  Input-gradient space particle inference for neural network ensembles</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICLR 2024  ·  arXiv:2306.02775  ·  github.com/AaltoPML/FoRDE</text></svg>