<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">LVLMs that reason, plus a wealth of game clues</text><g id="cue_s03_c1_why_now_why_approach"><title>why now why approach</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Why now, and why this approach?</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Two trends converge to make interpretable,</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">knowledge-driven geo-localization newly feasible.</text><rect x="92" y="266" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="281.0" r="5" fill="#4C9BE8"/><text x="126" y="287.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">capable LVLMs  +  untapped human clues</text></g><g id="cue_s03_c2_large_vision_language_models_shown_t"><title>large vision-language models shown they fuse images text follow step-by-step</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">LVLMs fuse image + text, and reason</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Large vision-language models can jointly process images</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and text and follow step-by-step reasoning, and prior</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">work shows a reasoning process makes language models</text><text x="92" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">stronger.</text><rect x="92" y="486" width="504" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344.0" y="512.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">image + text + reasoning  -&gt;  stronger model</text></g><g id="cue_s03_c3_meanwhile_huge_untapped_resource_exi"><title>meanwhile huge untapped resource exists communities behind geo-localization games spent</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#F2C14E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">A huge untapped resource</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Communities behind geo-localization games have spent</text><text x="676" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">years assembling textual clues that pinpoint countries</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">and cities from subtle visual details.</text><rect x="676" y="306" width="512" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="321.0" r="5" fill="#F2C14E"/><text x="710" y="327.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">GeoGuessr  +  Tuxun  -&gt;  human inference knowledge</text></g><g id="cue_s03_c4_georeasoner_insight_harvest_human_in"><title>georeasoner insight harvest human inference knowledge pair high-quality street views</title><rect x="648" y="366" width="568" height="184" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="648" y="366" width="6" height="184" rx="6" fill="#48C78E"/><text x="676" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">The insight: harvest and pair</text><text x="676" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Harvest that human inference knowledge and pair it with</text><text x="676" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">high-quality street views, so the model learns not just</text><text x="676" y="476" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">to guess a location but to justify it.</text><text x="676" y="528" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">guess a location  -&gt;  justify it</text></g></svg>