<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact in one place</text><g id="cue_s09_c1_numbers_matter_georeasoner_improves"><title>numbers matter georeasoner improves best comparable vision-language twenty-five point zero</title><rect x="64" y="166" width="1152" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="166" width="6" height="150" rx="6" fill="#48C78E"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Margins over the best comparable VLM (Qwen-VL), in F1</text><rect x="92" y="220" width="300" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="242.0" y="261.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#48C78E" font-weight="800" text-anchor="middle">+25.02%</text><text x="242.0" y="284.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">country-level F1</text><rect x="412" y="220" width="300" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="562.0" y="261.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.200000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">+38.61%</text><text x="562.0" y="284.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">city-level F1</text><rect x="732" y="220" width="484" height="80" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="752" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Full-model F1: 0.9033 country, 0.8585 city - a new</text><text x="752" y="269" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">state of the art.</text></g><g id="cue_s09_c2_its_full_model_1_scores_zero"><title>its full-model 1 scores zero point nine zero country zero</title><rect x="64" y="332" width="560" height="218" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="332" width="6" height="218" rx="6" fill="#34D3C0"/><text x="92" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">State of the art on far less data</text><text x="92" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Just 70K training images versus the 1.1M used by</text><text x="92" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">StreetCLIP, which GeoReasoner nonetheless surpasses.</text><rect x="92" y="470" width="236" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="210.0" y="503.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21.76" fill="#34D3C0" font-weight="800" text-anchor="middle">70K</text><text x="210.0" y="521.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">GeoReasoner images</text><rect x="348" y="470" width="236" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="466.0" y="503.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21.76" fill="#9DB3C8" font-weight="800" text-anchor="middle">1.1M</text><text x="466.0" y="521.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">StreetCLIP images</text></g><g id="cue_s09_c3_underlying_comes_more_one_hundred"><title>underlying comes more one hundred thirty thousand raw street views</title><rect x="656" y="332" width="560" height="218" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="332" width="6" height="218" rx="6" fill="#F2C14E"/><text x="684" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">The data behind it</text><text x="684" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">130K+ raw street views across 72 cities and 48 countries,</text><text x="684" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">filtered to 70K, plus 3K human-written reasoning clues.</text><rect x="684" y="470" width="160" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="764.0" y="503.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21.76" fill="#F2C14E" font-weight="800" text-anchor="middle">130K+</text><text x="764.0" y="521.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">raw views</text><rect x="858" y="470" width="160" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="938.0" y="503.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21.76" fill="#4C9BE8" font-weight="800" text-anchor="middle">72 / 48</text><text x="938.0" y="521.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">cities / ctys</text><rect x="1032" y="470" width="156" height="64" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1110.0" y="503.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21.76" fill="#48C78E" font-weight="800" text-anchor="middle">3K</text><text x="1110.0" y="521.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">game clues</text></g><g id="cue_s09_c4_open_im2gps_benchmarks_only_ten"><title>open im2gps benchmarks only ten thousand flickr images enough rival</title><rect x="64" y="566" width="1152" height="54" rx="10" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="566" width="6" height="54" rx="6" fill="#4C9BE8"/><text x="92" y="599" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="700" text-anchor="start">On open Im2GPS benchmarks, only 10K Flickr images rival models trained on millions.</text></g></svg>