<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two fine-tuning stages, each pulling its weight</text><g id="cue_s08_c1_ablation_isolates_contribution_fine"><title>ablation isolates contribution fine-tuning stage starting qwen-vl baseline adding only</title><rect x="64" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">From baseline, add reasoning tuning</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Starting at the Qwen-VL baseline (0.72 / 0.53 F1),</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reasoning tuning alone lifts both levels modestly to 0.82</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">/ 0.58.</text><rect x="92" y="268" width="468" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="282.0" r="5" fill="#4C9BE8"/><text x="126" y="288.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">baseline 0.72/0.53  -&gt;  +reasoning 0.82/0.58</text></g><g id="cue_s08_c2_adding_only_location_tuning_produces"><title>adding only location tuning produces much larger jump especially fine-grained</title><rect x="64" y="324" width="560" height="226" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#48C78E"/><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Location tuning: the big city-level jump</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Adding location tuning alone produces a much larger</text><text x="92" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">jump, especially at the fine-grained city level -</text><text x="92" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">essential for pinpointing cities.</text><rect x="320" y="472" width="220" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="472" width="116" height="24" rx="6" fill="#9DB3C8"/><text x="308" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">baseline city</text><text x="446" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">0.53</text><rect x="320" y="506" width="220" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="320" y="506" width="182" height="24" rx="6" fill="#48C78E"/><text x="308" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+location city</text><text x="512" y="524.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">0.83</text></g><g id="cue_s08_c3_but_full_both_stages_stacked"><title>but full both stages stacked strongest all reaching country 1</title><rect x="656" y="158" width="560" height="150" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Both stages stacked = strongest</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">The full two-stage model is best of all, reaching country</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">F1 0.90 and city F1 0.86.</text><text x="684" y="296" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="800" text-anchor="start">full model  -&gt;  0.90 country · 0.86 city</text></g><g id="cue_s08_c4_two_stages_complementary_location_tu"><title>two stages complementary location tuning supplies precision reasoning tuning supplies</title><rect x="656" y="324" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="324" width="6" height="226" rx="6" fill="#34D3C0"/><text x="684" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">The two stages are complementary</text><text x="684" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Location tuning supplies precision; reasoning tuning</text><text x="684" y="409" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">supplies explanations and a further lift.</text><rect x="852" y="442" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="852" y="442" width="159" height="20" rx="6" fill="#9DB3C8"/><text x="840" y="458.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">baseline</text><text x="1021" y="458.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">0.53</text><rect x="852" y="472" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="852" y="472" width="174" height="20" rx="6" fill="#4C9BE8"/><text x="840" y="488.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+reason</text><text x="1036" y="488.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">0.58</text><rect x="852" y="502" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="852" y="502" width="249" height="20" rx="6" fill="#48C78E"/><text x="840" y="518.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+location</text><text x="1111" y="518.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">0.83</text><rect x="852" y="532" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="852" y="532" width="258" height="20" rx="6" fill="#34D3C0"/><text x="840" y="548.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">full model</text><text x="1120" y="548.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">0.86</text></g></svg>