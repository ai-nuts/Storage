<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Bad training data, and models that can't explain</text><g id="cue_s02_c1_predicting_where_street_view_photo_t"><title>predicting where street-view photo taken useful urban planning navigation social</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Predicting where a photo was taken</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Locating a street-view photo is useful for</text><text x="92" y="263" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">urban planning, navigation, and social</text><text x="92" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">studies. But today's approaches have two</text><text x="92" y="309" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">blind spots.</text><rect x="92" y="360" width="176" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="375.0" r="5" fill="#4C9BE8"/><text x="126" y="381.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">urban planning</text><rect x="280" y="360" width="156" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="298" cy="375.0" r="5" fill="#34D3C0"/><text x="314" y="381.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">navigation</text><rect x="92" y="402" width="176" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="417.0" r="5" fill="#48C78E"/><text x="126" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">social studies</text><rect x="280" y="402" width="156" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="298" cy="417.0" r="5" fill="#F2685C"/><text x="314" y="423.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">two blind spots</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#6E869C" font-weight="700" text-anchor="start">useful, yet held back by data and opacity</text></g><g id="cue_s02_c2_first_problem_street_view_datasets_s"><title>first problem street-view datasets stuffed images captured tunnels against blank</title><rect x="500" y="158" width="716" height="164" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="164" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">1. The data problem: no visual clues</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Street-view datasets are stuffed with images captured in</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">tunnels, against blank walls, or of generic vegetation -</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">none carrying clues a model could use to locate them.</text><rect x="528" y="290" width="60" height="22" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="533" y="295" width="50" height="12" rx="4" fill="#161E28"/><line x1="546.0" y1="289.0" x2="570.0" y2="313.0" stroke="#F2685C" stroke-width="3.0" stroke-linecap="round"/><line x1="546.0" y1="313.0" x2="570.0" y2="289.0" stroke="#F2685C" stroke-width="3.0" stroke-linecap="round"/><text x="800" y="296" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#F2685C" font-weight="800" text-anchor="start">tunnels · blank walls · vegetation  -&gt;  no signal</text></g><g id="cue_s02_c3_second_reasoning_problem_retrieval_c"><title>second reasoning problem retrieval classification models operate black boxes handing</title><rect x="500" y="338" width="716" height="120" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="500" y="338" width="6" height="120" rx="6" fill="#F2C14E"/><text x="528" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">2. The reasoning problem: black boxes</text><text x="528" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Retrieval and classification models hand back a coordinate with no</text><text x="528" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">explanation a person could inspect or trust.</text></g><g id="cue_s02_c4_argues_both_quality_interpretability"><title>argues both quality interpretability must fixed together</title><rect x="500" y="472" width="716" height="78" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="500" y="472" width="6" height="78" rx="6" fill="#34D3C0"/><text x="528" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Both must be fixed together</text><text x="528" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">This paper argues that data quality and interpretability cannot be solved in</text><text x="528" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">isolation.</text></g></svg>