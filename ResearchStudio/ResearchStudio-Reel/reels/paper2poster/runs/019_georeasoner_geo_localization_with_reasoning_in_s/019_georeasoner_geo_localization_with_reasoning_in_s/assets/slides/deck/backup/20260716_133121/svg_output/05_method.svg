<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Curate locatable data, then fine-tune in two stages</text><g id="cue_s05_c1_method_two_halves_first_curation"><title>method two halves first curation georeasoner introduces locatability metric maskformer</title><rect x="64" y="158" width="560" height="168" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="168" rx="6" fill="#4C9BE8"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Step 1: a locatability metric</text><text x="92" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">MaskFormer segments each street view into semantic classes,</text><text x="92" y="237" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">producing a vector of class-area ratios.</text><text x="92" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6E869C" font-weight="700" text-anchor="start">MaskFormer class-area ratios</text><text x="92" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="600" text-anchor="start">building</text><rect x="172" y="268" width="220" height="9" rx="3" fill="#0E2334" stroke="#26455F" stroke-width="0.8"/><rect x="172" y="268" width="158.4" height="9" rx="3" fill="#4C9BE8"/><text x="92" y="289" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="600" text-anchor="start">sky</text><rect x="172" y="281" width="220" height="9" rx="3" fill="#0E2334" stroke="#26455F" stroke-width="0.8"/><rect x="172" y="281" width="121.00000000000001" height="9" rx="3" fill="#34D3C0"/><text x="92" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="600" text-anchor="start">road</text><rect x="172" y="294" width="220" height="9" rx="3" fill="#0E2334" stroke="#26455F" stroke-width="0.8"/><rect x="172" y="294" width="88.0" height="9" rx="3" fill="#9DB3C8"/><text x="92" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="600" text-anchor="start">vehicle</text><rect x="172" y="307" width="220" height="9" rx="3" fill="#0E2334" stroke="#26455F" stroke-width="0.8"/><rect x="172" y="307" width="66.0" height="9" rx="3" fill="#F2C14E"/></g><g id="cue_s05_c2_sentence_bert_measures_how_relevant"><title>sentence-bert measures how relevant class textual clues mined geo-games producing</title><rect x="656" y="158" width="560" height="168" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="158" width="6" height="168" rx="6" fill="#F2C14E"/><text x="684" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Step 2: weight classes by relevance</text><text x="684" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Sentence-BERT measures how relevant each class is to the</text><text x="684" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">textual clues mined from geo-games, producing an importance</text><text x="684" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">weight vector w_loc.</text><rect x="684" y="286" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="307.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Sentence-BERT( class, clues )  -&gt;  w_loc</text></g><g id="cue_s05_c4_built_qwen_vl_vision_encoder_vision"><title>built qwen-vl vision encoder vision-language adapter pre-trained language georeasoner fine-tuned</title><rect x="64" y="344" width="732" height="206" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="344" width="6" height="206" rx="6" fill="#48C78E"/><text x="92" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">The model: Qwen-VL + two LoRA stages</text><rect x="92" y="388" width="676" height="158" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="110" y="418" width="86" height="58" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="115" y="423" width="76" height="23.200000000000003" rx="4" fill="#1C3A54"/><rect x="118.6" y="437.71999999999997" width="17.2" height="29.0" rx="2" fill="#24506E"/><rect x="139.24" y="430.76" width="13.76" height="35.96" rx="2" fill="#2C5C80"/><rect x="171.92" y="440.03999999999996" width="15.479999999999999" height="26.68" rx="2" fill="#24506E"/><polygon points="144.4,470.0 161.6,470.0 157.3,443.5 148.7,443.5" fill="#33597A"/><polygon points="159.1,440.7 167.5,440.7 163.3,450.0" fill="#48C78E"/><circle cx="163.32" cy="437.72" r="7" fill="#48C78E"/><circle cx="163.32" cy="437.72" r="2.8000000000000003" fill="#0B1B2B"/><text x="110" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="start">street view</text><rect x="226" y="418" width="118" height="58" rx="8" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><text x="285.0" y="443.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Vision</text><text x="285.0" y="460.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Encoder</text><rect x="378" y="418" width="118" height="58" rx="8" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><text x="437.0" y="443.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">VL</text><text x="437.0" y="460.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Adapter</text><rect x="530" y="418" width="118" height="58" rx="8" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><text x="589.0" y="443.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">Pre-trained</text><text x="589.0" y="460.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">LLM</text><line x1="198" y1="447" x2="222" y2="447.0" stroke="#9DB3C8" stroke-width="2.0" stroke-linecap="round"/><polyline points="213.0,451.3 222,447.0 213.0,442.7" fill="none" stroke="#9DB3C8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="346" y1="447.0" x2="374" y2="447.0" stroke="#9DB3C8" stroke-width="2.0" stroke-linecap="round"/><polyline points="365.0,451.3 374,447.0 365.0,442.7" fill="none" stroke="#9DB3C8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="498" y1="447.0" x2="526" y2="447.0" stroke="#9DB3C8" stroke-width="2.0" stroke-linecap="round"/><polyline points="517.0,451.3 526,447.0 517.0,442.7" fill="none" stroke="#9DB3C8" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><line x1="650" y1="447.0" x2="674" y2="447.0" stroke="#48C78E" stroke-width="2.0" stroke-linecap="round"/><polyline points="665.0,451.3 674,447.0 665.0,442.7" fill="none" stroke="#48C78E" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="452.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#48C78E" font-weight="800" text-anchor="start">reasoning + city</text><rect x="226" y="494" width="250" height="44" rx="8" fill="#2A2417" stroke="#F2C14E" stroke-width="1.2"/><text x="240" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="800" text-anchor="start">Stage 1  LoRA: Reasoning tuning</text><text x="240" y="529" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="600" text-anchor="start">3K game clue pairs  -&gt;  country</text><rect x="492" y="494" width="250" height="44" rx="8" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.2"/><text x="506" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#48C78E" font-weight="800" text-anchor="start">Stage 2  LoRA: Location tuning</text><text x="506" y="529" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="600" text-anchor="start">70K street views  -&gt;  city</text></g><g id="cue_s05_c3_locatability_image_simply_weighted_s"><title>locatability image simply weighted sum its class ratios against these</title><rect x="820" y="344" width="396" height="206" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="820" y="344" width="6" height="206" rx="6" fill="#34D3C0"/><text x="848" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Locatability = weighted sum</text><rect x="848" y="398" width="368" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1032.0" y="423.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">loc = sum_k  I_seg(k) * w_k^loc</text><text x="848" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Keep images scoring above 0.4; this filters</text><text x="848" y="481" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">130K raw down to 70K.</text><rect x="848" y="516" width="300" height="18" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="848" y="516" width="186.0" height="18" rx="6" fill="#48C78E"/><line x1="968.0" y1="510" x2="968.0" y2="540" stroke="#F2C14E" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3"/><text x="968.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2C14E" font-weight="700" text-anchor="middle">threshold 0.4</text><text x="1156" y="530.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#48C78E" font-weight="800" text-anchor="start">0.62</text></g></svg>