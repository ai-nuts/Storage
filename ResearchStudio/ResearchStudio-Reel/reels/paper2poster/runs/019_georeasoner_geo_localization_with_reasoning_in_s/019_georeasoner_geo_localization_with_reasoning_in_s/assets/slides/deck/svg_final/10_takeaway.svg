<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The right images and the right knowledge</text><g id="cue_s10_c1_takeaway_simple_but_powerful_you"><title>takeaway simple but powerful you not need millions street-view images</title><rect x="64" y="176" width="570" height="148" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="148" rx="6" fill="#48C78E"/><circle cx="104" cy="216" r="10" fill="#48C78E"/><text x="128" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">You don't need millions of images</text><text x="92" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">You do not need millions of street-view images to build a</text><text x="92" y="279" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">state-of-the-art geo-localization model.</text></g><g id="cue_s10_c2_you_need_right_images_right"><title>you need right images right knowledge</title><rect x="646" y="176" width="570" height="148" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="646" y="176" width="6" height="148" rx="6" fill="#4C9BE8"/><circle cx="686" cy="216" r="10" fill="#4C9BE8"/><text x="710" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The right images + the right knowledge</text><text x="674" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">What you need instead is the right images and the right</text><text x="674" y="279" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reasoning knowledge to interpret them.</text></g><g id="cue_s10_c3_quantifying_which_street_views_actua"><title>quantifying which street views actually locatable borrowing reasoning strategies humans</title><rect x="64" y="340" width="570" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="340" width="6" height="210" rx="6" fill="#F2C14E"/><circle cx="104" cy="380" r="10" fill="#F2C14E"/><text x="128" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Locatability + geo-game reasoning</text><text x="92" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">By quantifying which street views are actually locatable and</text><text x="92" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">borrowing the reasoning strategies humans use to win</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">geo-games, GeoReasoner matches or beats specialists - and</text><text x="92" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">explains every prediction.</text></g><g id="cue_s10_c4_case_study_how_quality_human"><title>case study how quality human inference knowledge stand brute-force scale</title><rect x="646" y="340" width="570" height="210" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="646" y="340" width="6" height="210" rx="6" fill="#34D3C0"/><circle cx="686" cy="380" r="10" fill="#34D3C0"/><text x="710" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Quality can stand in for scale</text><text x="674" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A case study in how data quality and human inference</text><text x="674" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">knowledge substitute for brute-force scale, opening a path</text><text x="674" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">to interpretable, resource-efficient geo-localization.</text></g><line x1="64" y1="576" x2="1216" y2="576" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><polygon points="78.0,604.2 90.0,604.2 84.0,617.5" fill="#48C78E"/><circle cx="84" cy="600" r="10" fill="#48C78E"/><circle cx="84" cy="600" r="4.0" fill="#0B1B2B"/><text x="104" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">Interpretable, resource-efficient geo-localization</text><text x="1216" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">GeoReasoner · Geo-localization with Reasoning · ICML 2024</text></svg>