nt-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Surpasses a geo-specialist trained on 1.1M street views.</text><text x="684" y="392" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2C14E" font-weight="800" text-anchor="start">70K images  vs  1.1M  ·  and still wins</text></g><g id="cue_s07_c4_authors_also_show_fraction_high_loca"><title>authors also show fraction high-locatability images rises zero one hundred</title><rect x="656" y="420" width="560" height="128" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="420" width="6" height="128" rx="6" fill="#34D3C0"/><text x="684" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">More high-locatability data -&gt; higher acc.</text><text x="684" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">As the fraction of high-locatability images rises 0% -&gt; 100%,</text><text x="684" y="501" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">accuracy climbs steadily: quality, not quantity, drives the</text><text x="684" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">gains.</text><text x="684" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.8" fill="#34D3C0" font-weight="800" text-anchor="start">country 0.63-&gt;0.72   city 0.47-&gt;0.51</text></g></svg>