e="14" fill="#9DB3C8" font-weight="400" text-anchor="start">offering detailed reasoning</text><text x="976" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">for every prediction.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Pair an LVLM with human reasoning knowledge, quantify locatability, and explain every prediction.</text></svg>