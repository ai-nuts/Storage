t-weight="400" text-anchor="start">knowledge learned from online</text><text x="384" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">games, enabling</text><text x="384" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">geo-localization with</text><text x="384" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">explanation.</text></g><g id="cue_s04_c3_defines_concept_locatability_metric"><title>defines concept locatability metric how findable image location builds clip-based</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="706" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="706" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#34D3C0" font-weight="800" text-anchor="middle">L</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Locatability</text><text x="680" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">metric</text><text x="680" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Defines locatability - a</text><text x="680" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">metric for how findable an</text><text x="680" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" 