<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Built from scratch: 130K street views + 3K clues</text><g id="cue_s06_c1_builds_its_scratch_openstreetmap_roa"><title>builds its scratch openstreetmap road networks google street view api</title><rect x="64" y="158" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Sampled from OpenStreetMap + Google Street View</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Sample points every 4000 m across top global cities, collecting geo-tagged</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">street views.</text><rect x="980" y="168" width="110" height="76" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1035.0" y="207.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.840000000000003" fill="#4C9BE8" font-weight="800" text-anchor="middle">72</text><text x="1035.0" y="228.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">cities</text><rect x="1100" y="168" width="110" height="76" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1155.0" y="207.52" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="25.840000000000003" fill="#34D3C0" font-weight="800" text-anchor="middle">48</text><text x="1155.0" y="228.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">countries</text></g><g id="cue_s06_c2_applying_locatability_filter_thresho"><title>applying locatability filter threshold zero point four yields roughly seventy</title><rect x="64" y="270" width="560" height="152" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="270" width="6" height="152" rx="6" fill="#48C78E"/><text x="92" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Filter at locatability 0.4</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Applying the locatability filter yields roughly 70K</text><text x="92" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">high-quality images.</text><rect x="92" y="368" width="236" height="40" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="210.0" y="388.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.600000000000001" fill="#9DB3C8" font-weight="800" text-anchor="middle">130K+</text><text x="210.0" y="400.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">raw GSV images</text><text x="340" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#48C78E" font-weight="800" text-anchor="start">-&gt;</text><rect x="380" y="368" width="236" height="40" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="498.0" y="388.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.600000000000001" fill="#48C78E" font-weight="800" text-anchor="middle">~70K</text><text x="498.0" y="400.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">high-locatability</text></g><g id="cue_s06_c3_separately_they_scrape_over_three"><title>separately they scrape over three thousand textual clues two geo-localization</title><rect x="656" y="270" width="560" height="152" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="270" width="6" height="152" rx="6" fill="#F2C14E"/><text x="684" y="306" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">3K reasoned text-image clues</text><text x="684" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Scrape 3K+ textual clues from two geo-games, clean them</text><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">with a BERT-based entity recognizer, and pair each with a</text><text x="684" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">street view.</text><rect x="684" y="392" width="504" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="405.0" r="5" fill="#F2C14E"/><text x="718" y="411.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">GeoGuessr  +  Tuxun  ·  BERT-NER cleaned</text></g><g id="cue_s06_c4_evaluation_they_held_out_set_thousan"><title>evaluation they held-out set thousand images test generalization standard im2gps</title><rect x="64" y="438" width="1152" height="112" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="438" width="6" height="112" rx="6" fill="#34D3C0"/><text x="92" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Evaluation: held-out set + open benchmarks</text><text x="92" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A held-out set of 1K images measures country/city accuracy; the open Im2GPS and</text><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Im2GPS3k Flickr benchmarks test generalization.</text><rect x="980" y="452" width="230" height="84" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1095.0" y="495.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28.560000000000002" fill="#34D3C0" font-weight="800" text-anchor="middle">Im2GPS</text><text x="1095.0" y="519.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">+ Im2GPS3k</text></g></svg>