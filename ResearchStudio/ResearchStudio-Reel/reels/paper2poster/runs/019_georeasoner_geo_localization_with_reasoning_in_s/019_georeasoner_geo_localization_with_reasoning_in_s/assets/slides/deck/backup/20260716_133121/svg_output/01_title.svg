<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">HKUST (GZ) · Tongji · Info. Eng. University</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="42" fill="#FFFFFF" font-weight="800" text-anchor="start">GeoReasoner</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#4C9BE8" font-weight="800" text-anchor="start">Geo-localization with Reasoning in Street Views via a Large VLM</text><rect x="980" y="108" width="150" height="86" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="985" y="113" width="140" height="34.4" rx="4" fill="#1C3A54"/><rect x="995.0" y="137.24" width="30.0" height="43.0" rx="2" fill="#24506E"/><rect x="1031.0" y="126.92" width="24.0" height="53.32" rx="2" fill="#2C5C80"/><rect x="1088.0" y="140.68" width="27.0" height="39.56" rx="2" fill="#24506E"/><polygon points="1040.0,188.0 1070.0,188.0 1062.5,145.8 1047.5,145.8" fill="#33597A"/><polygon points="1068.8,140.2 1077.2,140.2 1073.0,149.5" fill="#48C78E"/><circle cx="1073.0" cy="137.24" r="7" fill="#48C78E"/><circle cx="1073.0" cy="137.24" r="2.8000000000000003" fill="#0B1B2B"/><text x="980" y="104" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="start">high-locatability</text><line x1="1134" y1="150" x2="1176" y2="150" stroke="#F2C14E" stroke-width="2.0" stroke-linecap="round"/><polyline points="1167.0,154.3 1176,150 1167.0,145.7" fill="none" stroke="#F2C14E" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1190.0,154.2 1202.0,154.2 1196.0,167.5" fill="#48C78E"/><circle cx="1196" cy="150" r="10" fill="#48C78E"/><circle cx="1196" cy="150" r="4.0" fill="#0B1B2B"/><text x="64" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Ling Li · Yu Ye · Yao Zhou · Bingchuan Jiang · Wei Zeng</text><g id="cue_s01_c1_what_could_not_only_tell"><title>what could not only tell you where street photo taken</title><rect x="64" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="290" width="276" height="6" rx="6" fill="#4C9BE8"/><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Where the photo was taken</text><text x="88" y="363" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">- and how</text><text x="88" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">GeoReasoner not only predicts the</text><text x="88" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">country and city of a street photo,</text><text x="88" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">it explains the visual clues behind</text><text x="88" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">each guess.</text></g><g id="cue_s01_c2_authors_tackle_two_long_standing_obs"><title>authors tackle two long-standing obstacles street-view full low-quality images visual</title><rect x="356" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="290" width="276" height="6" rx="6" fill="#F2685C"/><text x="380" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Two long-standing</text><text x="380" y="363" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">obstacles</text><text x="380" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">Street-view training data is full</text><text x="380" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">of low-quality images with no</text><text x="380" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">visual clues, and existing</text><text x="380" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">localization models are opaque</text><text x="380" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">black boxes.</text></g><g id="cue_s01_c3_georeasoner_solves_both_quantifying"><title>georeasoner solves both quantifying how locatable image borrowing human inference</title><rect x="648" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="290" width="276" height="6" rx="6" fill="#F2C14E"/><text x="672" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Locatability + human game</text><text x="672" y="363" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">clues</text><text x="672" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">It quantifies how locatable each</text><text x="672" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">image is, borrows human inference</text><text x="672" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">knowledge from geo-games, and</text><text x="672" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">fine-tunes in two stages.</text></g><g id="cue_s01_c4_result_beats_comparable_vision_langu"><title>result beats comparable vision-language models over twenty-five percent country level</title><rect x="940" y="290" width="276" height="246" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="290" width="276" height="6" rx="6" fill="#48C78E"/><text x="964" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">+25% country, +38% city</text><text x="964" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">Beats comparable vision-language</text><text x="964" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">models by over 25% at country and</text><text x="964" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">38% at city level, matching a</text><text x="964" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">specialist trained on 15x more</text><text x="964" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.8" fill="#9DB3C8" font-weight="400" text-anchor="start">data.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2406.18572</text><text x="280" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/lingli1996/GeoReasoner</text><text x="1216" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Interpretable geo-localization with a fraction of the data.</text></svg>