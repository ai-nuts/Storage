<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard5" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="46" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="78" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">Method: two convex losses, one angle</text>
    <text x="84" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">METHOD  ·  LOGISTIC + HINGE  ·  LOWER BOUND  ·  TWO-PHASE ALGORITHM</text>
  </g>

  <g id="cue_s05_c1_technical_core_rests_two_convex" data-cue-label="technical core rests two convex surrogate losses logistic loss log one plus e minus margin hinge loss positive part empirical average samples">
    <title>Two convex surrogate losses</title>
    <desc>the technical core rests on two convex surrogate losses the logistic loss is the log of one plus e to the minus margin the hinge loss is the positive part of the negative margin both minimized as empirical averages</desc>
    <rect x="60" y="124" width="1160" height="98" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="124" width="6" height="98" rx="3" fill="#12233B"/>
    <text x="88" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE TECHNICAL CORE — TWO CONVEX SURROGATES</text>
    <rect x="88" y="162" width="352" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="104" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2563EB">LOGISTIC LOSS</text>
    <text x="104" y="202" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#12233B">ℓ_log(z) = ln(1 + e^(−z))</text>
    <rect x="456" y="162" width="330" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="472" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#059669">HINGE LOSS</text>
    <text x="472" y="202" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#12233B">ℓ_h(z) = max{−z, 0}</text>
    <rect x="802" y="162" width="396" height="48" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="818" y="182" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#55606E">EMPIRICAL RISK</text>
    <text x="818" y="202" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#12233B">R̂_ℓ(w) = (1/n) Σᵢ ℓ(yᵢ⟨w, xᵢ⟩)</text>
  </g>

  <g id="cue_s05_c2_lower_bound_authors_hand_design_dist" data-cue-label="lower bound authors hand-design distribution Q plane four parts valid OPT one sixteenth optimal halfspace wrong small noisy region logistic minimizer pulled misclassifies square-root OPT">
    <title>Lower bound — a hand-designed 4-part distribution Q</title>
    <desc>for the lower bound the authors hand-design a distribution Q on the plane with four parts valid when OPT at most one over sixteen the optimal halfspace is only wrong on a small noisy region yet the logistic minimizer is pulled into a direction that misclassifies a square-root OPT fraction</desc>
    <rect x="60" y="238" width="373" height="422" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard5)"/>
    <rect x="60" y="238" width="373" height="6" rx="3" fill="#DC2626"/>
    <text x="84" y="272" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">LOWER BOUND — CONSTRUCT Q</text>
    <text x="84" y="294" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#12233B">A 4-part distribution on R²</text>
    <g id="lb-diagram">
      <rect x="84" y="308" width="325" height="196" rx="10" fill="#F9FAFB" stroke="#E2E8F0" stroke-width="1"/>
      <line x1="110" y1="406" x2="384" y2="406" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="247" y1="330" x2="247" y2="486" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="150" y1="486" x2="344" y2="330" stroke="#059669" stroke-width="2.5"/>
      <text x="352" y="332" font-family="Arial, sans-serif" font-size="11" fill="#059669">ū (optimal)</text>
      <line x1="176" y1="486" x2="330" y2="344" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="5 4"/>
      <text x="300" y="470" font-family="Arial, sans-serif" font-size="11" fill="#DC2626">logistic w*</text>
      <path d="M 300 406 A 30 30 0 0 1 292 386" fill="none" stroke="#12233B" stroke-width="1.5"/>
      <text x="306" y="398" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#12233B">angle</text>
      <circle cx="300" cy="360" r="4" fill="#2563EB"/><circle cx="320" cy="372" r="4" fill="#2563EB"/>
      <circle cx="200" cy="452" r="4" fill="#94A3B8"/><circle cx="180" cy="440" r="4" fill="#94A3B8"/>
      <circle cx="264" cy="430" r="4" fill="#DC2626"/><circle cx="250" cy="446" r="4" fill="#DC2626"/>
      <text x="96" y="326" font-family="Arial, sans-serif" font-size="10" fill="#55606E">Q₁ Q₂ Q₃ Q₄ — small noisy region</text>
    </g>
    <text x="84" y="530" font-family="Arial, sans-serif" font-size="13.5" fill="#1A202C">Valid when OPT ≤ 1/16. The optimal</text>
    <text x="84" y="550" font-family="Arial, sans-serif" font-size="13.5" fill="#1A202C">halfspace errs only on a tiny region,</text>
    <text x="84" y="570" font-family="Arial, sans-serif" font-size="13.5" fill="#1A202C">yet the logistic minimizer is pulled</text>
    <text x="84" y="590" font-family="Arial, sans-serif" font-size="13.5" fill="#1A202C">off-axis and misclassifies a</text>
    <text x="84" y="610" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#DC2626">√OPT</text>
    <text x="130" y="610" font-family="Arial, sans-serif" font-size="13.5" fill="#1A202C">fraction of points.</text>
  </g>

  <g id="cue_s05_c3_upper_bound_algorithm_key_object" data-cue-label="upper bound algorithm key object angle between learned direction ground-truth direction phase one projected gradient descent logistic risk ball radius one over square-root epsilon angle square-root OPT">
    <title>Phase 1 — projected GD, key object is the angle</title>
    <desc>for the upper bound and the algorithm the key object is the angle between the learned direction and the ground-truth direction phase one runs projected gradient descent on the logistic risk inside a ball of radius one over square-root epsilon returning a direction within angle order square-root OPT of the truth</desc>
    <rect x="453" y="238" width="373" height="422" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard5)"/>
    <rect x="453" y="238" width="373" height="6" rx="3" fill="#2563EB"/>
    <circle cx="491" cy="284" r="18" fill="#2563EB"/>
    <text x="491" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
    <text x="521" y="278" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">PHASE 1 — LOGISTIC GD</text>
    <text x="521" y="298" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#12233B">Key object: the angle to ū</text>
    <rect x="477" y="316" width="325" height="70" rx="10" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.25"/>
    <text x="493" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2563EB">PROJECTED GRADIENT DESCENT</text>
    <text x="493" y="366" font-family="Consolas, monospace" font-size="13.5" font-weight="700" fill="#12233B">w_{t+1}=Π_B(1/√ε)[w_t − η∇R̂_log]</text>
    <text x="477" y="416" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Minimize the logistic risk inside a</text>
    <text x="477" y="437" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">ball of radius 1/√ε. On well-behaved</text>
    <text x="477" y="458" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">data this returns a direction v with:</text>
    <rect x="477" y="474" width="325" height="60" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="639" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#12233B">∠(v, ū) = Õ(√OPT + ε)</text>
    <text x="477" y="566" font-family="Arial, sans-serif" font-size="14" fill="#55606E">A good warm start — but still only</text>
    <text x="477" y="587" font-family="Arial, sans-serif" font-size="14" fill="#55606E">√OPT accurate on its own. The angle</text>
    <text x="477" y="608" font-family="Arial, sans-serif" font-size="14" fill="#55606E">is the quantity the next phase sharpens.</text>
  </g>

  <g id="cue_s05_c4_phase_two_runs_projected_stochastic" data-cue-label="phase two runs projected stochastic gradient descent hinge loss classical perceptron update warm start restricted domain sharpens angle drives zero-one error order OPT">
    <title>Phase 2 — projected hinge SGD is the perceptron</title>
    <desc>phase two runs projected stochastic gradient descent on the hinge loss which is exactly the classical perceptron update starting from the warm start confined to a restricted domain sharpening the angle and driving the zero-one error down to near order OPT</desc>
    <rect x="846" y="238" width="374" height="422" rx="12" fill="#12233B" filter="url(#softCard5)"/>
    <rect x="846" y="238" width="374" height="6" rx="3" fill="#059669"/>
    <circle cx="884" cy="284" r="18" fill="#059669"/>
    <text x="884" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
    <text x="914" y="278" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">PHASE 2 — HINGE SGD</text>
    <text x="914" y="298" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#FFFFFF">= the classical perceptron</text>
    <rect x="870" y="316" width="326" height="70" rx="10" fill="#123A2C"/>
    <text x="886" y="340" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#7FE0B6">PROJECTED HINGE SGD</text>
    <text x="886" y="366" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#FFFFFF">w_{t+1}=Π_D[w_t − η ℓ_h′(·) y_t x_t]</text>
    <text x="870" y="416" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">This SGD update on the hinge loss is</text>
    <text x="870" y="437" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">exactly the perceptron update, run from</text>
    <text x="870" y="458" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">the Phase-1 warm start on a restricted</text>
    <text x="870" y="479" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">domain D.</text>
    <rect x="870" y="496" width="326" height="64" rx="10" fill="#123A2C" stroke="#059669" stroke-width="1.25"/>
    <text x="1033" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#7FE0B6">sharpens the angle →</text>
    <text x="1033" y="548" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#FFFFFF">Õ(OPT) error</text>
    <text x="870" y="592" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">One extra convex step drives the</text>
    <text x="870" y="613" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">zero-one error to near order OPT.</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">05</text>
  </g>
</svg>
