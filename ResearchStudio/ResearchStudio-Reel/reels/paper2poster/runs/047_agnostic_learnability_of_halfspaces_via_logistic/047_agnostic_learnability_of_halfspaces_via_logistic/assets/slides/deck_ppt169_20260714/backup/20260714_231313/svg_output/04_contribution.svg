<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard4" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">Three contributions that resolve the gap</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">CONTRIBUTION  ·  A LOWER BOUND, A CONDITION, AND AN ALGORITHM</text>
  </g>

  <g id="cue_s04_c1_makes_three_contributions_together_r" data-cue-label="makes three contributions resolve gap first constructs explicit two-dimensional isotropic well-behaved distribution global minimizer logistic risk square-root OPT matching upper bound">
    <title>Contribution 1 — matching lower bound</title>
    <desc>first constructs an explicit two-dimensional isotropic well-behaved distribution on which the global minimizer of the logistic risk attains square-root OPT zero-one error matching the known upper bound proving logistic regression alone cannot do better</desc>
    <rect x="60" y="150" width="373" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard4)"/>
    <rect x="60" y="150" width="373" height="6" rx="3" fill="#DC2626"/>
    <circle cx="98" cy="196" r="18" fill="#DC2626"/>
    <text x="98" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="128" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">A MATCHING LOWER BOUND</text>
    <text x="128" y="212" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#12233B">√OPT is unavoidable</text>
    <text x="84" y="256" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">An explicit 2-D, isotropic,</text>
    <text x="84" y="278" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">well-behaved distribution on</text>
    <text x="84" y="300" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">which the global logistic-risk</text>
    <text x="84" y="322" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">minimizer provably suffers:</text>
    <rect x="84" y="340" width="325" height="72" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
    <text x="246" y="386" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#DC2626">√OPT error</text>
    <text x="84" y="446" font-family="Arial, sans-serif" font-size="14" fill="#55606E">Matches the known upper bound</text>
    <text x="84" y="466" font-family="Arial, sans-serif" font-size="14" fill="#55606E">exactly — so logistic regression</text>
    <text x="84" y="486" font-family="Arial, sans-serif" font-size="14" fill="#55606E">alone cannot do better.</text>
  </g>

  <g id="cue_s04_c2_second_identifies_clean_sufficient_c" data-cue-label="second identifies clean sufficient condition radial Lipschitzness density under which logistic regression reaches near-optimal order OPT rate">
    <title>Contribution 2 — a clean sufficient condition</title>
    <desc>second identifies a clean sufficient condition radial Lipschitzness of the density under which logistic regression does reach the near-optimal order OPT rate</desc>
    <rect x="453" y="150" width="373" height="380" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard4)"/>
    <rect x="453" y="150" width="373" height="6" rx="3" fill="#2563EB"/>
    <circle cx="491" cy="196" r="18" fill="#2563EB"/>
    <text x="491" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="521" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">A SUFFICIENT CONDITION</text>
    <text x="521" y="212" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#12233B">Radial Lipschitzness</text>
    <text x="477" y="256" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">A clean condition on the</text>
    <text x="477" y="278" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">feature density: radial</text>
    <text x="477" y="300" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">Lipschitzness.</text>
    <rect x="477" y="320" width="325" height="92" rx="10" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.25"/>
    <text x="497" y="352" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Under it, logistic regression</text>
    <text x="497" y="374" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">alone already reaches:</text>
    <text x="639" y="400" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#059669">Õ(OPT)</text>
    <text x="477" y="446" font-family="Arial, sans-serif" font-size="14" fill="#55606E">The near-optimal order-OPT rate —</text>
    <text x="477" y="466" font-family="Arial, sans-serif" font-size="14" fill="#55606E">no algorithmic change needed when</text>
    <text x="477" y="486" font-family="Arial, sans-serif" font-size="14" fill="#55606E">the density is radially smooth.</text>
  </g>

  <g id="cue_s04_c3_third_most_usefully_introduces_simpl" data-cue-label="third most usefully introduces simple two-phase algorithm run logistic regression then perceptron-style hinge-loss step warm start restricted domain">
    <title>Contribution 3 — the two-phase algorithm</title>
    <desc>third and most usefully introduces a simple two-phase algorithm run logistic regression then a perceptron-style hinge-loss step from that warm start on a restricted domain</desc>
    <rect x="846" y="150" width="374" height="380" rx="12" fill="#12233B" filter="url(#softCard4)"/>
    <rect x="846" y="150" width="374" height="6" rx="3" fill="#059669"/>
    <circle cx="884" cy="196" r="18" fill="#059669"/>
    <text x="884" y="202" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="914" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">THE ALGORITHM</text>
    <text x="914" y="212" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#FFFFFF">Two-phase, simple</text>
    <g id="phase-a">
      <rect x="870" y="244" width="326" height="82" rx="10" fill="#1B3252"/>
      <rect x="870" y="244" width="8" height="82" rx="4" fill="#2563EB"/>
      <text x="892" y="272" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8FB6FF" letter-spacing="1">PHASE 1</text>
      <text x="892" y="298" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Logistic regression</text>
      <text x="892" y="318" font-family="Arial, sans-serif" font-size="13" fill="#DCE3EC">warm-start direction v ≈ ū</text>
    </g>
    <text x="1033" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7FE0B6">↓</text>
    <g id="phase-b">
      <rect x="870" y="352" width="326" height="82" rx="10" fill="#123A2C"/>
      <rect x="870" y="352" width="8" height="82" rx="4" fill="#059669"/>
      <text x="892" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1">PHASE 2</text>
      <text x="892" y="406" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Perceptron / hinge step</text>
      <text x="892" y="426" font-family="Arial, sans-serif" font-size="13" fill="#DCE3EC">SGD on a restricted domain</text>
    </g>
    <text x="870" y="466" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">Warm-started at the logistic solution,</text>
    <text x="870" y="486" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">confined to a bounded domain.</text>
  </g>

  <g id="cue_s04_c4_attains_near_optimal_error_every_wel" data-cue-label="attains near-optimal error every well-behaved distribution without radial Lipschitz one extra convex optimization far simpler prior algorithms logarithmic minimization problems">
    <title>The payoff — near-optimal for all, far simpler</title>
    <desc>attains near-optimal error for every well-behaved distribution without the radial-Lipschitz assumption at the cost of just one additional convex optimization far simpler than prior algorithms that solved a logarithmic number of minimization problems</desc>
    <rect x="60" y="546" width="1160" height="112" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="546" width="6" height="112" rx="3" fill="#059669"/>
    <text x="88" y="576" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="1.5">THE PAYOFF</text>
    <text x="88" y="606" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12233B">Near-optimal error for every well-behaved distribution — no radial-Lipschitz assumption needed.</text>
    <text x="88" y="636" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">Cost: one extra convex optimization. Prior order-OPT methods solved O(log(1/OPT)) minimization problems.</text>
    <rect x="980" y="566" width="220" height="74" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="1090" y="596" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#059669">2 convex steps</text>
    <text x="1090" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#55606E">vs O(log(1/OPT)) before</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">04</text>
  </g>
</svg>
