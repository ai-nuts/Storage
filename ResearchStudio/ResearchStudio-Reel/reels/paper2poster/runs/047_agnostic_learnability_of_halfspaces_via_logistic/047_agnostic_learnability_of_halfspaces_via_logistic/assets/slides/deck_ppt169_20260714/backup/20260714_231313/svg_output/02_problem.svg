<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard2" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">The problem: agnostically learning halfspaces</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">PROBLEM  ·  A FUNDAMENTAL QUESTION IN LEARNING THEORY</text>
  </g>

  <g id="cue_s02_c1_studies_agnostic_learning_homogeneou" data-cue-label="studies agnostic learning homogeneous halfspaces one most fundamental problems machine learning">
    <title>Agnostic learning of homogeneous halfspaces</title>
    <desc>studies agnostic learning of homogeneous halfspaces one of the most fundamental problems in machine learning</desc>
    <rect x="60" y="140" width="1160" height="62" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="140" width="6" height="62" rx="3" fill="#12233B"/>
    <text x="86" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE SETTING</text>
    <text x="86" y="190" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">Agnostically learning homogeneous halfspaces — a linear classifier w through the origin — is one of the most fundamental problems in machine learning.</text>
  </g>

  <g id="cue_s02_c2_given_samples_unknown_distribution_o" data-cue-label="given samples unknown distribution feature-label pairs want linear classifier zero-one error close OPT">
    <title>Formal goal: compete with OPT</title>
    <desc>given samples from unknown distribution over feature-label pairs want a linear classifier whose zero-one error is close to OPT best achievable by any homogeneous halfspace</desc>
    <rect x="60" y="224" width="562" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard2)"/>
    <rect x="60" y="224" width="6" height="200" rx="3" fill="#2563EB"/>
    <text x="86" y="256" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE GOAL</text>
    <text x="86" y="286" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">Given samples (x, y) from an unknown</text>
    <text x="86" y="308" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">distribution over feature–label pairs, output</text>
    <text x="86" y="330" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">a halfspace with small zero-one error.</text>
    <rect x="86" y="348" width="510" height="56" rx="8" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1"/>
    <text x="104" y="372" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#12233B">OPT = min over halfspaces of R₀₋₁(w)</text>
    <text x="104" y="393" font-family="Arial, sans-serif" font-size="13" fill="#55606E">the best zero-one error achievable by any homogeneous halfspace.</text>
  </g>

  <g id="cue_s02_c3_equivalently_adversary_allowed_flip" data-cue-label="equivalently adversary allowed flip OPT fraction labels perfectly linearly separable dataset logistic regression heuristic">
    <title>Adversary flips an OPT fraction of labels</title>
    <desc>equivalently an adversary is allowed to flip an OPT fraction of the labels of an otherwise perfectly linearly separable dataset logistic regression natural ubiquitous heuristic</desc>
    <rect x="658" y="224" width="562" height="200" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard2)"/>
    <text x="684" y="256" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">EQUIVALENTLY — AN ADVERSARY FLIPS OPT LABELS</text>
    <line x1="936" y1="270" x2="1150" y2="356" stroke="#12233B" stroke-width="2"/>
    <text x="1156" y="352" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#55606E">wᵀx=0</text>
    <g id="pos-dots" fill="#2563EB">
      <circle cx="1010" cy="292" r="6"/><circle cx="1050" cy="310" r="6"/><circle cx="1088" cy="300" r="6"/>
      <circle cx="1108" cy="332" r="6"/><circle cx="1060" cy="344" r="6"/><circle cx="1130" cy="312" r="6"/>
    </g>
    <g id="neg-dots" fill="#94A3B8">
      <circle cx="944" cy="360" r="6"/><circle cx="980" cy="386" r="6"/><circle cx="1016" cy="374" r="6"/>
      <circle cx="960" cy="330" r="6"/><circle cx="1000" cy="404" r="6"/><circle cx="920" cy="392" r="6"/>
    </g>
    <g id="flipped-dots">
      <circle cx="1044" cy="356" r="6.5" fill="#DC2626"/><circle cx="1044" cy="356" r="10" fill="none" stroke="#DC2626" stroke-width="1.5"/>
      <circle cx="988" cy="352" r="6.5" fill="#DC2626"/><circle cx="988" cy="352" r="10" fill="none" stroke="#DC2626" stroke-width="1.5"/>
    </g>
    <text x="684" y="410" font-family="Arial, sans-serif" font-size="13" fill="#1A202C"><tspan fill="#DC2626" font-weight="700">Red</tspan> = corrupted labels on the wrong side. Logistic regression is the ubiquitous heuristic here.</text>
  </g>

  <g id="cue_s02_c4_prior_results_left_frustrating_gap" data-cue-label="prior results left frustrating gap lower bound convex surrogate upper bound square-root OPT which reflects truth">
    <title>A frustrating gap between two bounds</title>
    <desc>prior results left a frustrating gap lower bound no convex surrogate can beat order OPT upper bound logistic regression reaches only order square-root OPT which of these reflects the truth</desc>
    <rect x="60" y="446" width="1160" height="212" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="86" y="480" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="1.5">PRIOR RESULTS LEFT A FRUSTRATING GAP</text>
    <rect x="86" y="498" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="106" y="528" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#12233B">Lower bound — every convex surrogate</text>
    <text x="106" y="566" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#DC2626">Ω̃(OPT)</text>
    <text x="106" y="600" font-family="Arial, sans-serif" font-size="13" fill="#55606E">no convex surrogate loss can</text>
    <text x="106" y="620" font-family="Arial, sans-serif" font-size="13" fill="#55606E">beat order-OPT error.</text>
    <rect x="466" y="498" width="360" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="486" y="528" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#12233B">Upper bound — logistic regression</text>
    <text x="486" y="566" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#12233B">Õ(√OPT)</text>
    <text x="486" y="600" font-family="Arial, sans-serif" font-size="13" fill="#55606E">achieved on well-behaved</text>
    <text x="486" y="620" font-family="Arial, sans-serif" font-size="13" fill="#55606E">distributions.</text>
    <rect x="846" y="498" width="352" height="140" rx="10" fill="#12233B"/>
    <text x="866" y="528" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">CENTRAL QUESTION</text>
    <text x="866" y="562" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#FFFFFF">Which bound reflects</text>
    <text x="866" y="588" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#FFFFFF">the truth for logistic</text>
    <text x="866" y="614" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#FFFFFF">regression?</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">02</text>
  </g>
</svg>
