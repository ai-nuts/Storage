<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard7" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">The headline: a matching pair of bounds</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">KEY RESULT  ·  √OPT IS TIGHT, THEN RECOVERED TO OPT</text>
  </g>

  <g id="cue_s07_c1_headline_finding_matching_pair_bound" data-cue-label="headline finding matching pair bounds tight rate logistic regression closes long-standing gap">
    <title>Headline finding — a matching pair of bounds</title>
    <desc>the headline finding is a matching pair of bounds pinning the tight rate for logistic regression and closing the long-standing gap</desc>
    <rect x="60" y="140" width="1160" height="64" rx="10" fill="#12233B"/>
    <rect x="60" y="140" width="6" height="64" rx="3" fill="#2563EB"/>
    <text x="88" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">THE HEADLINE FINDING</text>
    <text x="88" y="191" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">A matching pair of bounds: logistic regression alone is stuck at √OPT — and a tiny change recovers near-optimal OPT.</text>
  </g>

  <g id="cue_s07_c2_constructed_well_behaved_distributio" data-cue-label="constructed well-behaved distribution global minimizer population logistic risk zero-one error at least square-root OPT sixty pi matches best known upper bound true rate logistic alone">
    <title>Lower bound on the constructed distribution</title>
    <desc>on the constructed well-behaved distribution the global minimizer of the population logistic risk has zero-one error at least square-root OPT divided by sixty pi matching the best known upper bound and proving square-root OPT is the true rate for logistic regression alone</desc>
    <rect x="60" y="224" width="373" height="436" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard7)"/>
    <rect x="60" y="224" width="373" height="6" rx="3" fill="#DC2626"/>
    <text x="84" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">LOWER BOUND — LOGISTIC ALONE</text>
    <text x="84" y="288" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">√OPT error is forced</text>
    <text x="84" y="312" font-family="Arial, sans-serif" font-size="14" fill="#55606E">on the constructed distribution.</text>
    <rect x="84" y="330" width="325" height="96" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
    <text x="246" y="368" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#12233B">R₀₋₁(w*) ≥</text>
    <text x="246" y="404" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="#DC2626">√OPT / (60π)</text>
    <text x="84" y="456" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">The global minimizer of the</text>
    <text x="84" y="477" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">population logistic risk cannot</text>
    <text x="84" y="498" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">do better than this.</text>
    <rect x="84" y="516" width="325" height="120" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="102" y="544" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#12233B">Matches Frei et al.&apos;s Õ(√OPT)</text>
    <text x="102" y="566" font-family="Arial, sans-serif" font-size="13" fill="#55606E">upper bound asymptotically —</text>
    <text x="102" y="586" font-family="Arial, sans-serif" font-size="13" fill="#55606E">so √OPT is the true rate for</text>
    <text x="102" y="606" font-family="Arial, sans-serif" font-size="13" fill="#55606E">logistic regression alone.</text>
    <text x="102" y="628" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#DC2626">valid when OPT ≤ 1/100</text>
  </g>

  <g id="cue_s07_c3_sense_which_closes_long_standing_gap" data-cue-label="sense which closes long-standing gap adding radial Lipschitzness logistic minimizer jumps near-optimal order OPT constant C-kappa bounded density Lipschitz">
    <title>Closing the gap, then jumping to OPT</title>
    <desc>that is the sense in which the paper closes the long-standing gap then by adding radial Lipschitzness of the density the same logistic minimizer jumps to near-optimal error of order OPT up to a constant C-kappa that is bounded whenever the density is Lipschitz</desc>
    <rect x="453" y="224" width="373" height="436" rx="12" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.5" filter="url(#softCard7)"/>
    <rect x="453" y="224" width="373" height="6" rx="3" fill="#2563EB"/>
    <text x="477" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">GAP CLOSED → THEN RECOVERED</text>
    <text x="477" y="288" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">Add radial Lipschitzness</text>
    <text x="477" y="312" font-family="Arial, sans-serif" font-size="14" fill="#55606E">and the same minimizer jumps to:</text>
    <rect x="477" y="330" width="325" height="96" rx="10" fill="#FFFFFF" stroke="#BFD4FE" stroke-width="1.25"/>
    <text x="639" y="368" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#12233B">R₀₋₁(w*) =</text>
    <text x="639" y="404" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#059669">O((1 + Cκ)·OPT)</text>
    <text x="477" y="456" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Near-optimal order-OPT error —</text>
    <text x="477" y="477" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">no algorithmic change, just a</text>
    <text x="477" y="498" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">condition on the density.</text>
    <rect x="477" y="516" width="325" height="120" rx="10" fill="#FFFFFF" stroke="#BFD4FE" stroke-width="1.25"/>
    <text x="495" y="544" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB">The constant Cκ</text>
    <text x="495" y="566" font-family="Arial, sans-serif" font-size="13" fill="#55606E">is an integral of the radial-</text>
    <text x="495" y="586" font-family="Arial, sans-serif" font-size="13" fill="#55606E">Lipschitzness modulus. It stays</text>
    <text x="495" y="606" font-family="Arial, sans-serif" font-size="13" fill="#55606E">bounded whenever the density is</text>
    <text x="495" y="626" font-family="Arial, sans-serif" font-size="13" fill="#55606E">Lipschitz; vanishes if radial.</text>
  </g>

  <g id="cue_s07_c4_without_any_such_assumption_two_phas" data-cue-label="without any such assumption two-phase algorithm achieves order OPT plus epsilon bounded order OPT times log one over OPT sub-exponential expectation over run">
    <title>Two-phase algorithm — no assumption needed</title>
    <desc>without any such assumption the two-phase algorithm achieves order OPT plus epsilon error for bounded distributions and order OPT times log one over OPT for sub-exponential ones in expectation over the run</desc>
    <rect x="846" y="224" width="374" height="436" rx="12" fill="#12233B" filter="url(#softCard7)"/>
    <rect x="846" y="224" width="374" height="6" rx="3" fill="#059669"/>
    <text x="870" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">TWO-PHASE — NO ASSUMPTION</text>
    <text x="870" y="288" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">Near-optimal for all</text>
    <text x="870" y="312" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">well-behaved distributions — no radial-</text>
    <text x="870" y="332" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">Lipschitz assumption required.</text>
    <rect x="870" y="350" width="326" height="92" rx="10" fill="#1B3252"/>
    <rect x="870" y="350" width="8" height="92" rx="4" fill="#2563EB"/>
    <text x="892" y="376" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#8FB6FF" letter-spacing="1">BOUNDED</text>
    <text x="892" y="410" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#FFFFFF">O(OPT + ε)</text>
    <text x="892" y="432" font-family="Arial, sans-serif" font-size="12" fill="#DCE3EC">in expectation over the run.</text>
    <rect x="870" y="454" width="326" height="92" rx="10" fill="#123A2C"/>
    <rect x="870" y="454" width="8" height="92" rx="4" fill="#059669"/>
    <text x="892" y="480" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1">SUB-EXPONENTIAL</text>
    <text x="892" y="514" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#FFFFFF">O(OPT·ln(1/OPT)+ε)</text>
    <text x="892" y="536" font-family="Arial, sans-serif" font-size="12" fill="#DCE3EC">only an extra log factor.</text>
    <text x="870" y="580" font-family="Arial, sans-serif" font-size="13.5" fill="#DCE3EC">The logistic + perceptron pair reaches</text>
    <text x="870" y="601" font-family="Arial, sans-serif" font-size="13.5" fill="#DCE3EC">order-OPT error where logistic regression</text>
    <text x="870" y="622" font-family="Arial, sans-serif" font-size="13.5" fill="#DCE3EC">alone provably could not.</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">07</text>
  </g>
</svg>
