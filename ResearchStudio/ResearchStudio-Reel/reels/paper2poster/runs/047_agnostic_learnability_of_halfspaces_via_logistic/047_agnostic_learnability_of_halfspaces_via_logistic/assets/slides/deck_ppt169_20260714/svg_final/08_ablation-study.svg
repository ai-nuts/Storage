<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard8" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">Analysis: which assumption buys which rate</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">ABLATION IN THEORY  ·  ONE VERSATILE ARGUMENT, ISOLATED FACTORS</text>
  </g>

  <g id="cue_s08_c1_although_theory_without_experimental" data-cue-label="although theory paper without experimental ablations analysis structured expose which assumptions buy which guarantees plays role ablation">
    <title>The analysis plays the role of an ablation</title>
    <desc>although this is a theory paper without experimental ablations the analysis is structured to expose which assumptions buy which guarantees playing the role an ablation would</desc>
    <rect x="60" y="140" width="1160" height="64" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="140" width="6" height="64" rx="3" fill="#12233B"/>
    <text x="88" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">NO EXPERIMENTS — BUT AN ABLATION IN STRUCTURE</text>
    <text x="88" y="191" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">The analysis is built to expose which assumptions buy which guarantees — exactly the job an ablation would do.</text>
  </g>

  <g id="cue_s08_c2_single_upper_bound_argument_versatil" data-cue-label="single upper-bound argument versatile recovers earlier square-root OPT rate general well-behaved special case applies hinge loss enables perceptron second phase">
    <title>One versatile upper-bound argument</title>
    <desc>the single upper-bound argument is versatile enough to recover the earlier square-root OPT rate for general well-behaved distributions as a special case and crucially it also goes through for the hinge loss not just the logistic loss which enables the perceptron second phase</desc>
    <rect x="60" y="224" width="373" height="436" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard8)"/>
    <rect x="60" y="224" width="373" height="6" rx="3" fill="#2563EB"/>
    <text x="84" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">ONE VERSATILE ARGUMENT</text>
    <text x="84" y="288" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">The same proof does double duty</text>
    <g id="versatile-1">
      <rect x="84" y="308" width="325" height="118" rx="10" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.25"/>
      <text x="102" y="336" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB">Recovers prior work</text>
      <text x="102" y="362" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">As a special case it re-derives</text>
      <text x="102" y="384" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Frei et al.&apos;s Õ(√OPT) rate for</text>
      <text x="102" y="406" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">general well-behaved distributions.</text>
    </g>
    <g id="versatile-2">
      <rect x="84" y="440" width="325" height="196" rx="10" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.25"/>
      <text x="102" y="468" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#059669">Also applies to the hinge loss</text>
      <text x="102" y="494" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Crucially, the argument goes</text>
      <text x="102" y="516" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">through for the hinge loss, not</text>
      <text x="102" y="538" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">just the logistic loss.</text>
      <line x1="102" y1="554" x2="391" y2="554" stroke="#A7F3D0" stroke-width="1"/>
      <text x="102" y="580" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#12233B">This dual applicability is exactly</text>
      <text x="102" y="602" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#12233B">what makes the perceptron</text>
      <text x="102" y="624" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#12233B">second phase possible.</text>
    </g>
  </g>

  <g id="cue_s08_c3_theorem_cleanly_separates_bounded_su" data-cue-label="theorem cleanly separates bounded sub-exponential regimes only price heavier tails extra logarithmic factor one over OPT">
    <title>Theorem 3.4 separates the two regimes</title>
    <desc>the theorem cleanly separates the bounded and sub-exponential regimes showing that the only price of moving from bounded to heavier sub-exponential tails is an extra logarithmic factor in one over OPT</desc>
    <rect x="453" y="224" width="373" height="436" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard8)"/>
    <rect x="453" y="224" width="373" height="6" rx="3" fill="#2563EB"/>
    <text x="477" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THEOREM 3.4 — SEPARATES REGIMES</text>
    <text x="477" y="288" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">The cost of heavier tails</text>
    <rect x="477" y="306" width="325" height="88" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="493" y="332" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#12233B">BOUNDED</text>
    <text x="493" y="362" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#12233B">O((1 + Cκ)·OPT)</text>
    <text x="493" y="384" font-family="Arial, sans-serif" font-size="12" fill="#55606E">Cκ = ∫₀ᴮ κ(r) dr</text>
    <text x="639" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2563EB">↓  add ln(1/OPT)</text>
    <rect x="477" y="430" width="325" height="88" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="493" y="456" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#12233B">SUB-EXPONENTIAL</text>
    <text x="493" y="486" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#12233B">O((1+Cκ)·OPT·ln(1/OPT))</text>
    <text x="493" y="508" font-family="Arial, sans-serif" font-size="12" fill="#55606E">integral taken to 3α₂·ln(1/OPT)</text>
    <rect x="477" y="534" width="325" height="102" rx="10" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.25"/>
    <text x="495" y="562" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB">The only price of heavier tails</text>
    <text x="495" y="586" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">is a single extra logarithmic</text>
    <text x="495" y="608" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">factor ln(1/OPT) — isolated</text>
    <text x="495" y="630" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">cleanly by the theorem.</text>
  </g>

  <g id="cue_s08_c4_likewise_constant_integral_radial_li" data-cue-label="likewise constant C-kappa integral radial-Lipschitzness modulus isolates how much density radial smoothness matters vanishes density radially symmetric">
    <title>The constant Cκ isolates the role of smoothness</title>
    <desc>likewise the constant C-kappa an integral of the radial-Lipschitzness modulus isolates exactly how much the density radial smoothness matters vanishing when the density is radially symmetric</desc>
    <rect x="846" y="224" width="374" height="436" rx="12" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.5" filter="url(#softCard8)"/>
    <rect x="846" y="224" width="374" height="6" rx="3" fill="#2563EB"/>
    <text x="870" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE CONSTANT Cκ — ISOLATED</text>
    <text x="870" y="288" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">How much smoothness matters</text>
    <rect x="870" y="306" width="326" height="86" rx="10" fill="#FFFFFF" stroke="#BFD4FE" stroke-width="1.25"/>
    <text x="1033" y="342" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#2563EB">Cκ = ∫₀ᴮ κ(r) dr</text>
    <text x="1033" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#55606E">an integral of the radial-Lipschitzness modulus</text>
    <text x="870" y="424" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Cκ isolates exactly how much the</text>
    <text x="870" y="445" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">density&apos;s radial smoothness affects</text>
    <text x="870" y="466" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">the guarantee.</text>
    <g id="ckappa-vanish">
      <rect x="870" y="486" width="326" height="150" rx="10" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.25"/>
      <text x="888" y="514" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#059669">Vanishes when radially symmetric</text>
      <text x="888" y="542" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#059669">Cκ → 0</text>
      <text x="888" y="574" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">If the density is radially</text>
      <text x="888" y="595" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">symmetric, the smoothness cost</text>
      <text x="888" y="616" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">disappears entirely.</text>
    </g>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">08</text>
  </g>
</svg>
