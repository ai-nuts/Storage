<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard6" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">No datasets — distribution classes and theorems</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">SETTING  ·  WHAT PLAYS THE ROLE OF DATA IN A THEORY PAPER</text>
  </g>

  <g id="cue_s06_c1_because_learning_theory_benchmark_da" data-cue-label="because learning theory no benchmark datasets empirical tables data are distribution classes results theorems explicit constants">
    <title>A learning-theory paper — the data are distribution classes</title>
    <desc>because this is a learning-theory paper there are no benchmark datasets or empirical tables the data are distribution classes and the results are theorems with explicit constants</desc>
    <rect x="60" y="140" width="1160" height="64" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="60" y="140" width="6" height="64" rx="3" fill="#12233B"/>
    <text x="88" y="168" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">NO EMPIRICAL BENCHMARKS</text>
    <text x="88" y="191" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">There are no datasets or tables. The "data" are distribution classes; the results are theorems with explicit constants.</text>
  </g>

  <g id="cue_s06_c2_positive_results_hold_standard_famil" data-cue-label="positive results hold standard family well-behaved distributions isotropic marginal soft-margin sub-exponential regularity conditions prior work">
    <title>Positive results — the well-behaved family</title>
    <desc>the positive results hold for the standard family of well-behaved distributions used in prior work the marginal on features is isotropic and satisfies soft-margin and sub-exponential regularity conditions</desc>
    <rect x="60" y="224" width="373" height="436" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard6)"/>
    <rect x="60" y="224" width="373" height="6" rx="3" fill="#059669"/>
    <text x="84" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#059669" letter-spacing="1.5">POSITIVE RESULTS HOLD FOR</text>
    <text x="84" y="286" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#12233B">Well-behaved distributions</text>
    <text x="84" y="312" font-family="Arial, sans-serif" font-size="14" fill="#55606E">the standard family used in prior work.</text>
    <g id="wb-props">
      <rect x="84" y="330" width="325" height="60" rx="9" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.25"/>
      <text x="102" y="356" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#12233B">Isotropic marginal</text>
      <text x="102" y="378" font-family="Arial, sans-serif" font-size="13" fill="#55606E">e.g. isotropic log-concave features.</text>
      <rect x="84" y="400" width="325" height="60" rx="9" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.25"/>
      <text x="102" y="426" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#12233B">Soft-margin condition</text>
      <text x="102" y="448" font-family="Arial, sans-serif" font-size="13" fill="#55606E">controls mass near the boundary.</text>
      <rect x="84" y="470" width="325" height="60" rx="9" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1.25"/>
      <text x="102" y="496" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#12233B">Sub-exponential regularity</text>
      <text x="102" y="518" font-family="Arial, sans-serif" font-size="13" fill="#55606E">tail control on the feature norm.</text>
    </g>
    <text x="84" y="558" font-family="Arial, sans-serif" font-size="13" fill="#55606E">Following Diakonikolas et al. (2020d)</text>
    <text x="84" y="578" font-family="Arial, sans-serif" font-size="13" fill="#55606E">and Frei et al. (2021b) — the settings</text>
    <text x="84" y="598" font-family="Arial, sans-serif" font-size="13" fill="#55606E">that matter for isotropic log-concave data.</text>
  </g>

  <g id="cue_s06_c3_negative_result_carried_concrete_cou" data-cue-label="negative result carried concrete counterexample explicit distribution Q two-dimensional plane four parts figure fully well-behaved defeats logistic regression">
    <title>Negative result — one concrete counterexample</title>
    <desc>the negative result is carried by a concrete counterexample an explicit distribution Q on the two-dimensional plane built from four parts illustrated in the single figure that is fully well-behaved yet defeats logistic regression</desc>
    <rect x="453" y="224" width="373" height="436" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard6)"/>
    <rect x="453" y="224" width="373" height="6" rx="3" fill="#DC2626"/>
    <text x="477" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">NEGATIVE RESULT — A COUNTEREXAMPLE</text>
    <text x="477" y="286" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#12233B">The distribution Q on R²</text>
    <g id="q-figure">
      <rect x="477" y="304" width="325" height="212" rx="10" fill="#F9FAFB" stroke="#E2E8F0" stroke-width="1"/>
      <text x="493" y="326" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#55606E">FIGURE 1 — FOUR PARTS Q₁–Q₄</text>
      <line x1="639" y1="340" x2="639" y2="496" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="503" y1="418" x2="775" y2="418" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="700" cy="372" r="26" fill="#2563EB" fill-opacity="0.14" stroke="#2563EB" stroke-width="1.5"/>
      <text x="700" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB">Q₁</text>
      <circle cx="578" cy="464" r="26" fill="#94A3B8" fill-opacity="0.18" stroke="#94A3B8" stroke-width="1.5"/>
      <text x="578" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#55606E">Q₂</text>
      <circle cx="694" cy="470" r="18" fill="#DC2626" fill-opacity="0.16" stroke="#DC2626" stroke-width="1.5"/>
      <text x="694" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#DC2626">Q₃</text>
      <circle cx="566" cy="368" r="18" fill="#DC2626" fill-opacity="0.16" stroke="#DC2626" stroke-width="1.5"/>
      <text x="566" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#DC2626">Q₄</text>
      <text x="493" y="508" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#55606E">fully well-behaved, yet defeats logistic regression</text>
    </g>
    <text x="477" y="546" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">An explicit, fully well-behaved</text>
    <text x="477" y="567" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">distribution built from four parts —</text>
    <text x="477" y="588" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">the single counterexample that carries</text>
    <text x="477" y="609" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">the whole lower bound.</text>
  </g>

  <g id="cue_s06_c4_upper_bounds_stated_two_regimes" data-cue-label="upper bounds stated two regimes bounded feature distributions norm at most B sub-exponential feature distributions isotropic log-concave">
    <title>Upper bounds — two regimes</title>
    <desc>the upper bounds are stated in two regimes one for bounded feature distributions where the norm is at most B and one for sub-exponential feature distributions spanning the settings that matter for isotropic log-concave data</desc>
    <rect x="846" y="224" width="374" height="436" rx="12" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.5" filter="url(#softCard6)"/>
    <rect x="846" y="224" width="374" height="6" rx="3" fill="#2563EB"/>
    <text x="870" y="262" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">UPPER BOUNDS — TWO REGIMES</text>
    <text x="870" y="286" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#12233B">Where the guarantees hold</text>
    <g id="regime-1">
      <rect x="870" y="306" width="326" height="150" rx="10" fill="#FFFFFF" stroke="#BFD4FE" stroke-width="1.25"/>
      <text x="890" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1">REGIME A · BOUNDED</text>
      <text x="890" y="366" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#12233B">‖x‖ ≤ B</text>
      <text x="890" y="398" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Feature norm is bounded by B.</text>
      <text x="890" y="420" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Gives the cleanest O(OPT + ε)</text>
      <text x="890" y="440" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">guarantee for the algorithm.</text>
    </g>
    <g id="regime-2">
      <rect x="870" y="472" width="326" height="164" rx="10" fill="#FFFFFF" stroke="#BFD4FE" stroke-width="1.25"/>
      <text x="890" y="500" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1">REGIME B · SUB-EXPONENTIAL</text>
      <text x="890" y="532" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#12233B">(α₁, α₂)-sub-exp.</text>
      <text x="890" y="562" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Heavier tails — covers isotropic</text>
      <text x="890" y="582" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">log-concave features.</text>
      <text x="890" y="608" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Costs only an extra ln(1/OPT)</text>
      <text x="890" y="628" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">factor (see next slides).</text>
    </g>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">06</text>
  </g>
</svg>
