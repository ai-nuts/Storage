<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1280" height="10" fill="#12233B"/>
    <rect x="0" y="0" width="430" height="10" fill="#2563EB"/>
  </g>

  <g id="cover-kicker">
    <rect x="60" y="70" width="46" height="4" fill="#2563EB"/>
    <text x="60" y="104" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="2.5">ICML 2022  ·  LEARNING THEORY  ·  arXiv:2201.13419</text>
  </g>

  <g id="cover-title">
    <text x="60" y="176" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#12233B">Agnostic Learnability of</text>
    <text x="60" y="238" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#12233B">Halfspaces via <tspan fill="#2563EB">Logistic Loss</tspan></text>
  </g>

  <g id="cover-authors">
    <line x1="62" y1="278" x2="150" y2="278" stroke="#12233B" stroke-width="1.5"/>
    <text x="60" y="312" font-family="Georgia, serif" font-size="19" font-style="italic" fill="#1A202C">Ziwei Ji · Kwangjun Ahn · Pranjal Awasthi · Satyen Kale · Stefani Karp</text>
    <text x="60" y="338" font-family="Arial, sans-serif" font-size="14" fill="#55606E">UIUC · MIT · Google Research · Carnegie Mellon University</text>
  </g>

  <g id="cover-utility">
    <rect x="1006" y="60" width="214" height="232" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5"/>
    <image href="../images/paper_qr.png" x="1018" y="72" width="190" height="190" preserveAspectRatio="xMidYMid meet"/>
    <text x="1113" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#12233B" letter-spacing="1.5">SCAN · PAPER · arXiv:2201.13419</text>
  </g>

  <g id="cover-logos">
    <rect x="782" y="306" width="438" height="74" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.25"/>
    <text x="802" y="328" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#55606E" letter-spacing="1.5">INSTITUTIONS</text>
    <image href="../images/logo_uiuc.png" x="802" y="342" width="120" height="26" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/logo_mit.png" x="946" y="336" width="46" height="38" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/logo_google.png" x="1016" y="342" width="70" height="26" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/logo_cmu.png" x="1112" y="348" width="94" height="14" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="glance-label">
    <text x="60" y="404" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" letter-spacing="2">AT A GLANCE</text>
  </g>

  <g id="cue_s01_c1_asks_fundamental_question_learning_t" data-cue-label="asks fundamental question learning theory how well plain logistic regression halfspaces OPT">
    <title>The core question — agnostically learning halfspaces</title>
    <desc>asks fundamental question learning theory how well does plain logistic regression halfspaces adversary OPT fraction labels zero-one error</desc>
    <rect x="60" y="424" width="270" height="220" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard)"/>
    <rect x="60" y="424" width="270" height="6" rx="3" fill="#2563EB"/>
    <text x="82" y="462" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE QUESTION</text>
    <text x="82" y="494" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">How good is plain</text>
    <text x="82" y="518" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#12233B">logistic regression?</text>
    <text x="82" y="550" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Learn a halfspace whose</text>
    <text x="82" y="570" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">error is close to OPT, with</text>
    <text x="82" y="590" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">an adversary flipping an</text>
    <text x="82" y="610" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">OPT fraction of labels.</text>
  </g>

  <g id="cue_s01_c2_prior_work_left_wide_gap" data-cue-label="prior work left wide gap lower bound convex surrogate upper bound square-root OPT">
    <title>Prior work left a wide gap</title>
    <desc>prior work left wide gap lower bound saying no convex surrogate can beat order OPT upper bound logistic regression square-root OPT</desc>
    <rect x="357" y="424" width="270" height="220" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard)"/>
    <rect x="357" y="424" width="270" height="6" rx="3" fill="#DC2626"/>
    <text x="379" y="462" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">THE GAP</text>
    <text x="379" y="496" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Lower bound (all convex</text>
    <text x="379" y="516" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">surrogates):</text>
    <text x="379" y="544" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#12233B">Ω̃(OPT)</text>
    <text x="379" y="578" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Upper bound (logistic</text>
    <text x="379" y="598" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">regression):</text>
    <text x="379" y="626" font-family="Consolas, monospace" font-size="19" font-weight="700" fill="#12233B">Õ(√OPT)</text>
  </g>

  <g id="cue_s01_c3_authors_close_gap_they_construct" data-cue-label="authors close gap construct well-behaved distribution global minimizer logistic risk square-root OPT radial Lipschitz">
    <title>Closing the gap</title>
    <desc>authors close gap they construct well-behaved distribution global minimizer logistic risk square-root OPT radial Lipschitzness near-optimal order OPT</desc>
    <rect x="654" y="424" width="270" height="220" rx="12" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard)"/>
    <rect x="654" y="424" width="270" height="6" rx="3" fill="#2563EB"/>
    <text x="676" y="462" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">GAP CLOSED</text>
    <text x="676" y="494" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">A well-behaved distribution</text>
    <text x="676" y="514" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">forces the logistic minimizer</text>
    <text x="676" y="534" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">to √OPT error — tight.</text>
    <text x="676" y="570" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Add radial-Lipschitzness</text>
    <text x="676" y="590" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">and logistic regression</text>
    <text x="676" y="610" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">reaches near-optimal</text>
    <text x="676" y="630" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#059669">Õ(OPT) error.</text>
  </g>

  <g id="cue_s01_c4_finally_they_give_strikingly_simple" data-cue-label="finally give strikingly simple two-phase algorithm logistic regression followed perceptron step near-optimal">
    <title>A strikingly simple two-phase algorithm</title>
    <desc>finally they give strikingly simple two-phase algorithm logistic regression followed by perceptron step near-optimal error every well-behaved distribution</desc>
    <rect x="951" y="424" width="269" height="220" rx="12" fill="#12233B" stroke="#12233B" stroke-width="1.5" filter="url(#softCard)"/>
    <rect x="951" y="424" width="269" height="6" rx="3" fill="#059669"/>
    <text x="973" y="462" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">THE SIMPLE FIX</text>
    <text x="973" y="496" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF">Two-phase algorithm</text>
    <text x="973" y="528" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">1 · Logistic regression</text>
    <text x="973" y="552" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">2 · Perceptron (hinge) step</text>
    <text x="973" y="586" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">Near-optimal error for any</text>
    <text x="973" y="606" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">well-behaved distribution —</text>
    <text x="973" y="626" font-family="Arial, sans-serif" font-size="14" fill="#DCE3EC">just one extra convex step.</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">01</text>
  </g>
</svg>
