<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard3" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.06"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">Why the exact rate matters</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">MOTIVATION  ·  A DEFAULT ALGORITHM WITH UNKNOWN GUARANTEES</text>
  </g>

  <g id="cue_s03_c1_logistic_regression_arguably_most_wi" data-cue-label="logistic regression arguably most widely deployed classification algorithm understanding statistical guarantees not merely academic">
    <title>Logistic regression is the default classifier</title>
    <desc>logistic regression is arguably the most widely deployed classification algorithm so understanding its statistical guarantees is not merely academic</desc>
    <rect x="60" y="140" width="1160" height="66" rx="10" fill="#12233B"/>
    <rect x="60" y="140" width="6" height="66" rx="3" fill="#2563EB"/>
    <text x="88" y="170" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">A DEFAULT ALGORITHM IN PRACTICE</text>
    <text x="88" y="194" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Logistic regression is arguably the most widely deployed classifier — so understanding its statistical guarantees is not merely academic.</text>
  </g>

  <g id="cue_s03_c2_worry_logistic_regression_behave_ter" data-cue-label="worry logistic regression behave terribly worst case earlier work risk minimizer wrong one-minus-OPT fraction adversarial">
    <title>Worst case: risk minimizer nearly always wrong</title>
    <desc>the worry is logistic regression can behave terribly in the worst case earlier work showed its risk minimizer can be wrong on nearly a one-minus-OPT fraction of examples on an adversarially built distribution</desc>
    <rect x="60" y="226" width="373" height="404" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard3)"/>
    <rect x="60" y="226" width="373" height="6" rx="3" fill="#DC2626"/>
    <text x="84" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">THE WORRY — WORST CASE</text>
    <text x="84" y="298" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">On an adversarially built</text>
    <text x="84" y="320" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">distribution, the logistic risk</text>
    <text x="84" y="342" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">minimizer can be wrong on</text>
    <text x="84" y="364" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">almost every example.</text>
    <rect x="84" y="386" width="325" height="120" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.25"/>
    <text x="246" y="446" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="700" fill="#DC2626">1 − OPT</text>
    <text x="246" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#55606E">zero-one error in the worst case</text>
    <text x="84" y="536" font-family="Arial, sans-serif" font-size="13" fill="#55606E">Ben-David et al. (2012): the pathology</text>
    <text x="84" y="556" font-family="Arial, sans-serif" font-size="13" fill="#55606E">can be arbitrarily bad without</text>
    <text x="84" y="576" font-family="Arial, sans-serif" font-size="13" fill="#55606E">structural assumptions on the data.</text>
  </g>

  <g id="cue_s03_c3_rule_out_such_pathologies_community" data-cue-label="rule out pathologies community focuses well-behaved distributions isotropic log-concave precise error rate unknown between OPT square-root OPT">
    <title>Well-behaved distributions — but the rate is unknown</title>
    <desc>to rule out such pathologies the community focuses on well-behaved distributions such as isotropic log-concave ones precise error rate of logistic regression was unknown sitting between order OPT and order square-root OPT</desc>
    <rect x="453" y="226" width="373" height="404" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard3)"/>
    <rect x="453" y="226" width="373" height="6" rx="3" fill="#2563EB"/>
    <text x="477" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">THE FIX — WELL-BEHAVED DATA</text>
    <text x="477" y="298" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">To rule out pathologies, restrict</text>
    <text x="477" y="320" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">to well-behaved distributions —</text>
    <text x="477" y="342" font-family="Arial, sans-serif" font-size="15" fill="#1A202C">isotropic, log-concave marginals.</text>
    <text x="477" y="378" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#12233B">But the precise rate stays open:</text>
    <rect x="477" y="398" width="325" height="132" rx="10" fill="#F4F6FA" stroke="#E2E8F0" stroke-width="1.25"/>
    <line x1="505" y1="470" x2="775" y2="470" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="505" cy="470" r="5" fill="#059669"/>
    <circle cx="775" cy="470" r="5" fill="#DC2626"/>
    <text x="505" y="452" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#059669">OPT</text>
    <text x="775" y="452" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#DC2626">√OPT</text>
    <text x="640" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-style="italic" fill="#55606E">true rate = ? somewhere in between</text>
    <text x="477" y="560" font-family="Arial, sans-serif" font-size="13" fill="#55606E">The exact error rate logistic</text>
    <text x="477" y="580" font-family="Arial, sans-serif" font-size="13" fill="#55606E">regression achieves here was unknown.</text>
  </g>

  <g id="cue_s03_c4_pinning_down_rate_tells_whether" data-cue-label="pinning down rate tells whether logistic regression near-optimal agnostic learner leaves accuracy on table minimal fix recovers optimality">
    <title>Pinning down the rate</title>
    <desc>pinning down this rate tells us whether logistic regression is a near-optimal agnostic learner or whether it fundamentally leaves accuracy on the table and what minimal fix recovers optimality</desc>
    <rect x="846" y="226" width="374" height="404" rx="12" fill="#EEF4FF" stroke="#BFD4FE" stroke-width="1.5" filter="url(#softCard3)"/>
    <rect x="846" y="226" width="374" height="6" rx="3" fill="#2563EB"/>
    <text x="870" y="264" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">WHAT&apos;S AT STAKE</text>
    <text x="870" y="300" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12233B">Pinning down the rate</text>
    <text x="870" y="324" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#12233B">answers two things:</text>
    <g id="stake-1">
      <circle cx="888" cy="366" r="14" fill="#2563EB"/>
      <text x="888" y="371" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
      <text x="914" y="360" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#12233B">Is it near-optimal?</text>
      <text x="914" y="382" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">Or does it leave accuracy</text>
      <text x="914" y="402" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">on the table?</text>
    </g>
    <g id="stake-2">
      <circle cx="888" cy="452" r="14" fill="#2563EB"/>
      <text x="888" y="457" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
      <text x="914" y="446" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#12233B">What minimal fix</text>
      <text x="914" y="468" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">recovers optimality if it</text>
      <text x="914" y="488" font-family="Arial, sans-serif" font-size="14" fill="#1A202C">falls short?</text>
    </g>
    <rect x="870" y="516" width="326" height="92" rx="10" fill="#12233B"/>
    <text x="886" y="546" font-family="Arial, sans-serif" font-size="13" fill="#DCE3EC">A principled recommendation to</text>
    <text x="886" y="566" font-family="Arial, sans-serif" font-size="13" fill="#DCE3EC">use — or repair — logistic regression</text>
    <text x="886" y="586" font-family="Arial, sans-serif" font-size="13" fill="#DCE3EC">hinges on this exact rate.</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">03</text>
  </g>
</svg>
