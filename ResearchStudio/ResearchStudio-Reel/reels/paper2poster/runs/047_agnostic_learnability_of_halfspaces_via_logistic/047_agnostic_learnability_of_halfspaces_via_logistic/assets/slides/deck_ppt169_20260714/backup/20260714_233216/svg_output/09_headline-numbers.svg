<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="softCard9" x="-8%" y="-20%" width="116%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2"/>
      <feFlood flood-color="#12233B" flood-opacity="0.07"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g id="bg"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>

  <g id="header">
    <rect x="60" y="52" width="6" height="42" fill="#2563EB"/>
    <text x="84" y="84" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#12233B">By the numbers</text>
    <text x="84" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#55606E" letter-spacing="1.5">HEADLINE NUMBERS  ·  FOUR FIGURES THAT CAPTURE THE IMPACT</text>
  </g>

  <g id="cue_s09_c1_few_numbers_capture_impact_lower" data-cue-label="few numbers capture impact lower bound zero-one error at least square-root OPT over sixty pi logistic minimizer valid OPT at most one one-hundredth">
    <title>Lower bound number</title>
    <desc>a few numbers capture the impact the lower bound gives a zero-one error of at least square-root OPT over sixty pi for the logistic minimizer valid whenever OPT is at most one one-hundredth</desc>
    <rect x="60" y="150" width="570" height="238" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard9)"/>
    <rect x="60" y="150" width="6" height="238" rx="3" fill="#DC2626"/>
    <text x="88" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#DC2626" letter-spacing="1.5">LOWER BOUND — LOGISTIC ALONE</text>
    <text x="88" y="268" font-family="Consolas, monospace" font-size="52" font-weight="700" fill="#DC2626">√OPT / 60π</text>
    <text x="88" y="308" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">Zero-one error the logistic-risk minimizer</text>
    <text x="88" y="330" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">provably suffers on the constructed distribution.</text>
    <rect x="88" y="348" width="180" height="26" rx="13" fill="#FEF2F2"/>
    <text x="178" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#DC2626">valid when OPT ≤ 1/100</text>
  </g>

  <g id="cue_s09_c2_under_radial_lipschitzness_logistic" data-cue-label="under radial Lipschitzness logistic regression reaches near-optimal order OPT error">
    <title>Radial-Lipschitz rate</title>
    <desc>under radial Lipschitzness logistic regression reaches near-optimal order OPT error</desc>
    <rect x="650" y="150" width="570" height="238" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard9)"/>
    <rect x="650" y="150" width="6" height="238" rx="3" fill="#2563EB"/>
    <text x="678" y="188" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">WITH RADIAL LIPSCHITZNESS</text>
    <text x="678" y="268" font-family="Consolas, monospace" font-size="52" font-weight="700" fill="#059669">Õ(OPT)</text>
    <text x="678" y="308" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">Add radial Lipschitzness of the density and</text>
    <text x="678" y="330" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">logistic regression alone becomes near-optimal.</text>
    <rect x="678" y="348" width="260" height="26" rx="13" fill="#F0FDF4"/>
    <text x="808" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#059669">from √OPT down to order OPT</text>
  </g>

  <g id="cue_s09_c3_does_sample_complexity_order_over" data-cue-label="does sample complexity order d over epsilon squared quadratic improvement d over epsilon fourth prior nonconvex methods">
    <title>Sample complexity</title>
    <desc>it does so with a sample complexity of order d over epsilon squared a quadratic improvement over the d over epsilon to the fourth required by prior nonconvex methods</desc>
    <rect x="60" y="410" width="570" height="238" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softCard9)"/>
    <rect x="60" y="410" width="6" height="238" rx="3" fill="#2563EB"/>
    <text x="88" y="448" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.5">SAMPLE COMPLEXITY</text>
    <text x="88" y="528" font-family="Consolas, monospace" font-size="52" font-weight="700" fill="#12233B">Õ(d/ε²)</text>
    <text x="360" y="514" font-family="Arial, sans-serif" font-size="18" fill="#94A3B8" text-decoration="line-through">Õ(d/ε⁴)</text>
    <text x="360" y="536" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">prior nonconvex</text>
    <text x="88" y="568" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">A quadratic improvement over the Õ(d/ε⁴)</text>
    <text x="88" y="590" font-family="Arial, sans-serif" font-size="16" fill="#1A202C">samples required by prior nonconvex approaches.</text>
    <rect x="88" y="608" width="150" height="26" rx="13" fill="#EEF4FF"/>
    <text x="163" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB">ε² instead of ε⁴</text>
  </g>

  <g id="cue_s09_c4_structurally_whereas_earlier_algorit" data-cue-label="structurally whereas earlier algorithms order OPT error solve logarithmic number minimization problems guessing OPT binary search this method needs only two convex steps">
    <title>Structural simplicity — two convex steps</title>
    <desc>structurally whereas earlier algorithms that hit order OPT error had to solve a logarithmic number of minimization problems while guessing OPT by binary search this method needs only two convex steps</desc>
    <rect x="650" y="410" width="570" height="238" rx="12" fill="#12233B" filter="url(#softCard9)"/>
    <rect x="650" y="410" width="6" height="238" rx="3" fill="#059669"/>
    <text x="678" y="448" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7FE0B6" letter-spacing="1.5">STRUCTURAL SIMPLICITY</text>
    <text x="678" y="528" font-family="Consolas, monospace" font-size="52" font-weight="700" fill="#FFFFFF">2 steps</text>
    <text x="920" y="512" font-family="Consolas, monospace" font-size="18" fill="#8FB6FF">O(log(1/OPT))</text>
    <text x="920" y="534" font-family="Arial, sans-serif" font-size="13" fill="#8FB6FF">prior — + binary search</text>
    <text x="678" y="568" font-family="Arial, sans-serif" font-size="16" fill="#DCE3EC">Prior order-OPT methods solved O(log(1/OPT))</text>
    <text x="678" y="590" font-family="Arial, sans-serif" font-size="16" fill="#DCE3EC">minimizations while guessing OPT by binary search.</text>
    <rect x="678" y="608" width="330" height="26" rx="13" fill="#123A2C"/>
    <text x="843" y="626" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7FE0B6">just logistic regression + one perceptron phase</text>
  </g>

  <g id="footer">
    <line x1="60" y1="690" x2="104" y2="690" stroke="#A0AEC0" stroke-width="1"/>
    <text x="112" y="694" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">Agnostic Learnability of Halfspaces via Logistic Loss</text>
    <text x="1220" y="694" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#A0AEC0">09</text>
  </g>
</svg>
