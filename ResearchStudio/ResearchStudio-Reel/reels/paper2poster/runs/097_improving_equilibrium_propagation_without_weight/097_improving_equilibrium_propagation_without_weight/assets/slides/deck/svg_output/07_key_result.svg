<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The homeostatic loss unlocks scale</text><g id="cue_s07_c1_headline_result_striking_cifar_10_as"><title>headline result striking cifar-10 asymmetric network trained but without homeostatic</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">On CIFAR-10, asymmetric EP without the homeostatic loss reaches only 60.4% accuracy.</text></g><g id="cue_s07_c2_add_homeostatic_loss_accuracy_jumps"><title>add homeostatic loss accuracy jumps eighty-four point three percent just</title><rect x="64" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="264" rx="6" fill="#34D3C0"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">CIFAR-10 accuracy  ·  higher is better</text><rect x="300" y="278" width="250" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="278" width="167" height="30" rx="6" fill="#F2685C"/><text x="288" y="299.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">EP, no homeo</text><text x="477" y="299.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">60.4%</text><rect x="300" y="326" width="250" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="326" width="234" height="30" rx="6" fill="#48C78E"/><text x="288" y="347.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">EP + homeo</text><text x="544" y="347.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">84.3%</text><rect x="300" y="374" width="250" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="374" width="246" height="30" rx="6" fill="#4C9BE8"/><text x="288" y="395.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Symmetric</text><text x="556" y="395.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">88.6%</text><rect x="92" y="418" width="504" height="44" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">+23.9 points  ·  only a 4.3-point gap to symmetric</text></g><g id="cue_s07_c3_even_more_importantly_first_time"><title>even more importantly first time family methods trains all imagenet</title><rect x="656" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="264" rx="6" fill="#F2C14E"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">ImageNet 32x32  ·  first EP result ever</text><rect x="684" y="272" width="250" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="809.0" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">31.4%</text><text x="809.0" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">Top-1 accuracy</text><rect x="962" y="272" width="250" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1087.0" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">55.2%</text><text x="1087.0" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">Top-5 accuracy</text><rect x="684" y="394" width="528" height="68" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="704" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The first time this family of methods trains at all at ImageNet</text><text x="704" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">scale.</text></g><g id="cue_s07_c4_throughout_homeostatic_loss_steadily"><title>throughout homeostatic loss steadily raises jacobian symmetry tightens alignment between</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#4C9BE8"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Throughout training</text><rect x="560" y="506" width="360" height="88" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><polyline points="560,582 572,577 584,572 596,568 608,564 620,561 632,558 644,555 656,552 668,550 680,548 692,546 704,544 716,542 728,541 740,540 752,539 764,538 776,537 788,536 800,535 812,534 824,534 836,533 848,533 860,532 872,532 884,531 896,531 908,531 920,530" fill="none" stroke="#34D3C0" stroke-width="2.5"/><polyline points="560,570 572,566 584,562 596,558 608,555 620,553 632,550 644,548 656,546 668,544 680,542 692,541 704,539 716,538 728,537 740,536 752,535 764,534 776,533 788,532 800,532 812,531 824,531 836,530 848,530 860,529 872,529 884,529 896,529 908,528 920,528" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="912" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#34D3C0" font-weight="700" text-anchor="end">Jacobian symmetry</text><text x="912" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#4C9BE8" font-weight="700" text-anchor="end">error alignment</text><text x="570" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="start">training -&gt;</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The homeostatic loss steadily raises the Jacobian's</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">symmetry and tightens the alignment between EP's error</text><text x="92" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">signals and true backprop.</text></g><text x="64" y="648" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Approximate weight symmetry is enough — functional symmetry does the work.</text></svg>