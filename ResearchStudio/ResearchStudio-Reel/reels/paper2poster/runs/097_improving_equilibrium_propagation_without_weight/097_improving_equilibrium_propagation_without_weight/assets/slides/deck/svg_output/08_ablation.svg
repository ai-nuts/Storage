<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Each bias, measured on its own</text><g id="cue_s08_c1_ablations_cleanly_separate_two_biase"><title>ablations cleanly separate two biases fashion mnist when nudge made</title><rect x="64" y="158" width="560" height="110" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="110" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Isolating finite-nudge bias</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">On Fashion MNIST with a large nudge, classic one-sided</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">EP falls apart while the Cauchy estimate holds.</text></g><g id="cue_s08_c2_holomorphic_cauchy_integral_estimate"><title>holomorphic cauchy-integral estimate six points instead stays fourteen point three</title><rect x="64" y="284" width="560" height="266" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="284" width="6" height="266" rx="6" fill="#34D3C0"/><text x="92" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Fashion MNIST error at large nudge |b|=0.5  ·  lower is better</text><rect x="330" y="346" width="200" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="330" y="346" width="192" height="30" rx="6" fill="#F2685C"/><text x="318" y="367.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">one-sided EP</text><text x="532" y="367.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">38.4%</text><rect x="330" y="394" width="200" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="330" y="394" width="71" height="30" rx="6" fill="#34D3C0"/><text x="318" y="415.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Cauchy, N=6</text><text x="411" y="415.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">14.3%</text><rect x="330" y="442" width="200" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="330" y="442" width="73" height="30" rx="6" fill="#4C9BE8"/><text x="318" y="463.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">true derivative</text><text x="413" y="463.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">14.7%</text><rect x="92" y="490" width="504" height="44" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="112" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">N=6 estimate matches the true derivative: nudge bias removed</text></g><g id="cue_s08_c3_separately_dropping_exact_derivative"><title>separately dropping exact derivative coarse two-point estimate costs about three</title><rect x="656" y="158" width="560" height="180" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="180" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Quantifying the residual</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Dropping from the exact derivative to a coarse two-point</text><text x="684" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">(N=2) estimate costs about 3 points on CIFAR-10.</text><rect x="684" y="290" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936" y="312" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#F2C14E" font-weight="800" text-anchor="middle">N=2  vs  exact   =   about -3 pts (CIFAR-10)</text></g><g id="cue_s08_c4_architecture_whose_output_feeds_stra"><title>architecture whose output feeds straight back first layer reciprocal connections</title><rect x="656" y="354" width="560" height="196" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="354" width="6" height="196" rx="6" fill="#48C78E"/><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Functional, not weight, symmetry</text><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">An architecture whose output feeds straight back to the</text><text x="684" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">first layer, with no reciprocal connections, benefits</text><text x="684" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">just as much.</text><rect x="684" y="494" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="511.0" r="5" fill="#48C78E"/><text x="718" y="517.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Confirms the loss targets functional symmetry</text></g></svg>