<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two strict demands EP cannot escape</text><g id="cue_s02_c1_equilibrium_propagation_appealing_wa"><title>equilibrium propagation appealing way train neural networks directly physical substrates</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">What makes EP appealing</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">EP computes gradients using only the</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">network's own relaxation dynamics, with no</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">separate backward pass.</text><rect x="92" y="346" width="144" height="120" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="164" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="middle">free phase</text><circle cx="128" cy="406" r="9" fill="#4C9BE8"/><circle cx="164" cy="388" r="9" fill="#4C9BE8"/><circle cx="200" cy="414" r="9" fill="#4C9BE8"/><line x1="128" y1="406" x2="164" y2="388" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><line x1="164" y1="388" x2="200" y2="414" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><text x="252" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="700" text-anchor="start">nudge</text><line x1="244" y1="404" x2="300" y2="404" stroke="#F2C14E" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><text x="300" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#F2C14E" font-weight="800" text-anchor="start">-&gt;</text><rect x="316" y="346" width="120" height="120" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="376" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="middle">nudged</text><circle cx="352" cy="406" r="9" fill="#34D3C0"/><circle cx="388" cy="392" r="9" fill="#34D3C0"/><circle cx="412" cy="414" r="9" fill="#34D3C0"/><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">Gradient read off from how the state moves.</text></g><g id="cue_s02_c2_but_comes_two_strict_requirements"><title>but comes two strict requirements weights must perfectly symmetric nudge</title><rect x="500" y="158" width="716" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Two strict requirements</text><rect x="528" y="214" width="320" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="552" cy="238" r="6" fill="#F2685C"/><text x="570" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Perfectly symmetric weights</text><rect x="868" y="214" width="320" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="892" cy="238" r="6" fill="#F2685C"/><text x="910" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Infinitesimally small nudge</text></g><g id="cue_s02_c3_both_very_hard_satisfy_real"><title>both very hard satisfy real physical hardware</title><rect x="500" y="290" width="716" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="290" width="6" height="96" rx="6" fill="#F2C14E"/><text x="528" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Both are very hard on real hardware</text><text x="528" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Physical and neuromorphic substrates cannot deliver exact weight</text><text x="528" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">transposes or vanishingly small teaching signals.</text></g><g id="cue_s02_c4_crucially_whether_weight_asymmetry_a"><title>crucially whether weight asymmetry actually harms learning had never been</title><rect x="500" y="398" width="716" height="152" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="398" width="6" height="152" rx="6" fill="#F2685C"/><text x="528" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">The open question</text><text x="528" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Does weight asymmetry actually harm learning? It had never been pinned</text><text x="528" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">down, because its effect is tangled up with the error from a finite nudge.</text><text x="528" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#F2685C" font-weight="800" text-anchor="start">asymmetry bias  +  finite-nudge bias  =  ?</text></g></svg>