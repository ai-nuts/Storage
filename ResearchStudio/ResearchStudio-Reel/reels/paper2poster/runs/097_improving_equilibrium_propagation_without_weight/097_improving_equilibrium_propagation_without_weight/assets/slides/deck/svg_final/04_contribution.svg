<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Four contributions</text><g id="cue_s04_c1_makes_four_contributions_first_analy"><title>makes four contributions first analytically separates two sources bias generalized</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Separate the two</text><text x="88" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">biases</text><text x="88" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Analytically isolate</text><text x="88" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">generalized EP's two error</text><text x="88" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">sources: the finite nudge, and</text><text x="88" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the asymmetry of the network's</text><text x="88" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Jacobian.</text></g><g id="cue_s04_c2_second_extends_holomorphic_asymmetri"><title>second extends holomorphic asymmetric complex-differentiable systems exact error recovered even</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="410" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Holomorphic EP,</text><text x="384" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">asymmetric</text><text x="384" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Extend holomorphic EP to</text><text x="384" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">asymmetric,</text><text x="384" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">complex-differentiable</text><text x="384" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">systems, recovering the exact</text><text x="384" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">error without weight symmetry.</text></g><g id="cue_s04_c3_third_most_practically_introduces_ne"><title>third most practically introduces new homeostatic loss reduces asymmetry jacobian</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="706" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="706" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">A homeostatic</text><text x="680" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">loss</text><text x="680" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Introduce a loss that reduces</text><text x="680" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the asymmetry of the Jacobian</text><text x="680" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">directly, rather than forcing</text><text x="680" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the weights to be symmetric.</text></g><g id="cue_s04_c4_fourth_demonstrates_loss_finally_sca"><title>fourth demonstrates loss finally scales all way imagenet thirty-two thirty-two</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="1002" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">4</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Scale to ImageNet</text><text x="976" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">32x32</text><text x="976" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Show that with this loss, EP</text><text x="976" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">finally scales all the way up</text><text x="976" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">to ImageNet at 32 by 32</text><text x="976" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">resolution.</text></g><text x="64" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Two biases, cleanly separated  —  then each one removed.</text></svg>