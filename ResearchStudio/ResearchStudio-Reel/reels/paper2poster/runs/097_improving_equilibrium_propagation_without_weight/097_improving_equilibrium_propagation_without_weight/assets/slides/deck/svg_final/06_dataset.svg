<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Four datasets of rising difficulty</text><g id="cue_s06_c1_experiments_span_four_datasets_incre"><title>experiments span four datasets increasing difficulty</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">Experiments span four datasets of increasing difficulty, from bias-isolation MLPs up to large-scale image classification.</text></g><g id="cue_s06_c2_fashion_mnist_small_multilayer_netwo"><title>fashion mnist small multilayer networks used cleanly isolate measure source</title><rect x="64" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#4C9BE8" font-weight="800" text-anchor="start">Fashion MNIST  ·  small MLPs</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Small multilayer networks used to cleanly isolate and</text><text x="92" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">measure each source of bias.</text><rect x="92" y="350" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="365.0" r="5" fill="#4C9BE8"/><text x="126" y="371.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Purpose: separate finite-nudge vs asymmetry bias</text></g><g id="cue_s06_c3_recurrent_convolutional_architecture"><title>recurrent convolutional architecture genuinely asymmetric feedback weights trained cifar-10 cifar-100</title><rect x="656" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="240" width="6" height="150" rx="6" fill="#34D3C0"/><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">Recurrent conv net  ·  asymmetric feedback</text><text x="684" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Genuinely asymmetric feedback weights, trained on</text><text x="684" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">progressively harder image sets.</text><rect x="684" y="350" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="365.0" r="5" fill="#34D3C0"/><text x="718" y="371.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">CIFAR-10   ·   CIFAR-100   ·   ImageNet 32x32</text></g><g id="cue_s06_c4_authors_also_confirm_appendix_same"><title>authors also confirm appendix same loss helps predictive coding networks</title><rect x="64" y="410" width="1152" height="140" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="410" width="6" height="140" rx="6" fill="#F2C14E"/><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Beyond reciprocal networks (Appendix)</text><text x="92" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">The same homeostatic loss also helps predictive coding networks, which have no reciprocal connections at all,</text><text x="92" y="503" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">confirming it targets functional symmetry rather than tied weights.</text></g></svg>