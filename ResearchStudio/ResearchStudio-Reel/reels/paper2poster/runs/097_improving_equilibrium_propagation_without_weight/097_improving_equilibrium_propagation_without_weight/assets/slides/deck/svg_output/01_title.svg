<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Friedrich Miescher Institute  ·  University of Basel</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="158" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">Improving Equilibrium Propagation</text><text x="64" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#4C9BE8" font-weight="800" text-anchor="start">without Weight Symmetry</text><text x="64" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#34D3C0" font-weight="800" text-anchor="start">through Jacobian Homeostasis</text><text x="64" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="500" text-anchor="start">Axel Laborieux   ·   Friedemann Zenke      —   Friedrich Miescher Institute &amp; University of Basel</text><g id="cue_s01_c1_equilibrium_propagation_promising_en"><title>equilibrium propagation promising energy-based alternative backpropagation neural networks brains neuromorphic</title><rect x="64" y="316" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="316" width="6" height="118" rx="6" fill="#4C9BE8"/><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Equilibrium propagation (EP)</text><text x="92" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">An energy-based, backprop-free way to train networks on brains or</text><text x="92" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">neuromorphic chips using only relaxation dynamics.</text></g><g id="cue_s01_c2_iclr_2024_friedrich_miescher_institu"><title>iclr 2024 friedrich miescher institute university basel axel laborieux friedemann</title><rect x="656" y="316" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="316" width="6" height="118" rx="6" fill="#F2C14E"/><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Two classical demands</text><text x="684" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">EP needs perfectly symmetric weights and an infinitesimally small</text><text x="684" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">nudge, both hard for real physical substrates.</text></g><g id="cue_s01_c3_finite_nudge_bias_eliminated_exactly"><title>finite-nudge bias eliminated exactly cauchy integral while weight-asymmetry bias tamed</title><rect x="64" y="456" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="456" width="6" height="118" rx="6" fill="#34D3C0"/><text x="92" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Remove both biases</text><text x="92" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Cauchy integral erases finite-nudge bias exactly; a homeostatic loss</text><text x="92" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">tames weight-asymmetry bias on the Jacobian.</text></g><g id="cue_s01_c4_payoff_first_time_equilibrium_propag"><title>payoff first time equilibrium propagation trains asymmetric networks imagenet 32</title><rect x="656" y="456" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="456" width="6" height="118" rx="6" fill="#48C78E"/><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The payoff</text><text x="684" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">For the first time, asymmetric EP trains on ImageNet 32x32, with</text><text x="684" y="539" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">only a small gap to the ideal symmetric case.</text></g><line x1="64" y1="616" x2="1216" y2="616" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2309.02214</text><text x="300" y="650" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Functional symmetry, not weight symmetry, is what EP really needs.</text></svg>