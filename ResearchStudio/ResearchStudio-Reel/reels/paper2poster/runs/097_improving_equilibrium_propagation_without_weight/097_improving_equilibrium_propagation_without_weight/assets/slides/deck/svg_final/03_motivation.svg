<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Why train on physical substrates at all</text><g id="cue_s03_c1_reason_matters_energy_physical_neura"><title>reason matters energy physical neural systems whether biological brains neuromorphic</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">It comes down to energy</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Brains and neuromorphic chips could train networks</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">at a tiny fraction of digital hardware's energy</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">cost.</text><text x="92" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">Relative training energy (illustrative)</text><rect x="300" y="338" width="280" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="338" width="280" height="30" rx="6" fill="#F2C14E"/><text x="288" y="359.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Digital / backprop</text><text x="590" y="359.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">high</text><rect x="300" y="384" width="280" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="384" width="16" height="30" rx="6" fill="#34D3C0"/><text x="288" y="405.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Physical substrate</text><text x="326" y="405.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">tiny</text><rect x="92" y="440" width="504" height="90" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="470" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="800" text-anchor="start">The prize</text><text x="112" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A biologically plausible, low-energy route to training large</text><text x="112" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">networks.</text></g><g id="cue_s03_c2_but_backpropagation_workhorse_deep_l"><title>but backpropagation workhorse deep learning needs separate linear backward pass</title><rect x="648" y="158" width="568" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="116" rx="6" fill="#F2685C"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Backprop is biologically implausible</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It needs a separate linear backward pass and the exact</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">transpose of every weight matrix, neither of which</text><text x="676" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">substrates provide.</text></g><g id="cue_s03_c3_sidesteps_yet_its_own_symmetry"><title>sidesteps yet its own symmetry assumption nearly demanding</title><rect x="648" y="286" width="568" height="108" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="286" width="6" height="108" rx="6" fill="#4C9BE8"/><text x="676" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">EP sidesteps this</text><text x="676" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">But its own weight-symmetry assumption is nearly as</text><text x="676" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">demanding as backprop's transpose.</text></g><g id="cue_s03_c4_warning_sign_asymmetric_version_had"><title>warning sign asymmetric version had only ever worked toy tasks</title><rect x="648" y="406" width="568" height="144" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="648" y="406" width="6" height="144" rx="6" fill="#F2C14E"/><text x="676" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">A warning sign</text><text x="676" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Asymmetric EP had only ever worked on toy tasks like MNIST,</text><text x="676" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">and outright failed on CIFAR-10.</text><text x="676" y="536" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#F2C14E" font-weight="800" text-anchor="start">MNIST  ok      ·      CIFAR-10  fails  (why?)</text></g></svg>