<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">EP does not need symmetric weights</text><g id="cue_s10_c1_takeaway_equilibrium_propagation_doe"><title>takeaway equilibrium propagation does not actually need perfectly symmetric weights</title><rect x="64" y="176" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="116" rx="6" fill="#4C9BE8"/><circle cx="112" cy="234" r="10" fill="#4C9BE8"/><text x="150" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Drop the hard assumption</text><text x="150" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Equilibrium propagation does not actually need perfectly symmetric weights to learn</text><text x="150" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">well.</text></g><g id="cue_s10_c2_removing_finite_nudge_bias_exactly_c"><title>removing finite-nudge bias exactly cauchy integral encouraging functional symmetry jacobian</title><rect x="64" y="308" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="116" rx="6" fill="#34D3C0"/><circle cx="112" cy="366" r="10" fill="#34D3C0"/><text x="150" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Two fixes, one payoff</text><text x="150" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A Cauchy integral removes finite-nudge bias exactly; a homeostatic loss encourages</text><text x="150" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">functional Jacobian symmetry, so asymmetric nets scale to ImageNet-level tasks.</text></g><g id="cue_s10_c3_because_functional_symmetry_weaker_m"><title>because functional symmetry weaker more achievable condition weight symmetry opens</title><rect x="64" y="440" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="116" rx="6" fill="#48C78E"/><circle cx="112" cy="498" r="10" fill="#48C78E"/><text x="150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">A biologically plausible path</text><text x="150" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Functional symmetry is weaker and more achievable than weight symmetry, hinting brains</text><text x="150" y="542" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">might rely on similar homeostatic mechanisms.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Improving Equilibrium Propagation without Weight Symmetry through Jacobian Homeostasis</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICLR 2024  ·  Laborieux &amp; Zenke  ·  arXiv:2309.02214</text></svg>