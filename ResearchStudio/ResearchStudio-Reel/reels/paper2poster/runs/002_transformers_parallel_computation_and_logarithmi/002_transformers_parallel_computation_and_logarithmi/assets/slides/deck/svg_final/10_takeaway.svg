<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Transformers are, in a precise sense, parallel computers</text><g id="cue_s10_c1_one_thing_remember_transformers_prec"><title>one thing remember transformers precise sense parallel computers</title><rect x="64" y="150" width="1152" height="72" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="150" width="6" height="72" rx="6" fill="#34D3C0"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">The one thing to remember</text><text x="92" y="210" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">A transformer is, in a precise sense, a parallel computer.</text></g><g id="cue_s10_c2_pins_intuition_down_proving_logarith"><title>pins intuition down proving logarithmic-depth transformers equivalent constant-round massively parallel</title><rect x="64" y="238" width="1152" height="100" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="238" width="6" height="100" rx="6" fill="#4C9BE8"/><circle cx="112" cy="288" r="10" fill="#4C9BE8"/><text x="150" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Log-depth = constant-round MPC</text><text x="150" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">This paper pins the intuition down: logarithmic-depth transformers are equivalent to constant-round</text><text x="150" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Massively Parallel Computation.</text></g><g id="cue_s10_c3_equivalence_explains_both_their_powe"><title>equivalence explains both their power their limits predicts sharp separation</title><rect x="64" y="350" width="1152" height="100" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="350" width="6" height="100" rx="6" fill="#F2C14E"/><circle cx="112" cy="400" r="10" fill="#F2C14E"/><text x="150" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">A sharp, predicted separation</text><text x="150" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">On k-hop, transformers succeed with depth logarithmic in k, while RNNs, state-space models like Mamba,</text><text x="150" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and efficient attention all need depth linear in k.</text></g><g id="cue_s10_c4_trained_transformers_obey_predicted"><title>trained transformers obey predicted threshold layer real edge transformer not</title><rect x="64" y="462" width="1152" height="100" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="462" width="6" height="100" rx="6" fill="#48C78E"/><circle cx="112" cy="512" r="10" fill="#48C78E"/><text x="150" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Verified to the layer</text><text x="150" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Trained transformers obey the predicted threshold to the layer. The real edge is not scale, it is the</text><text x="150" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">ability to do many things at once.</text></g><line x1="64" y1="588" x2="1216" y2="588" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="620" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Transformers, Parallel Computation, and Logarithmic Depth</text><text x="64" y="646" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">ICML 2024  ·  arXiv:2402.09268  ·  Columbia University  ·  Courant Institute, NYU</text></svg>