<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Logarithmic, where the alternatives are linear</text><g id="cue_s09_c1_few_numbers_capture_solving_k_hop"><title>few numbers capture solving k-hop needs depth equal floor log</title><rect x="64" y="152" width="1152" height="74" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="74" rx="6" fill="#4C9BE8"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Depth to solve k-hop, in proof and in trained networks</text><rect x="92" y="192" width="470" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="207.0" r="5" fill="#34D3C0"/><text x="126" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">L  =  floor(log2 k) + 2</text><rect x="576" y="192" width="470" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="594" cy="207.0" r="5" fill="#F2C14E"/><text x="610" y="212.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">+1 layer  ~  2x k    (6 layers -&gt; k &lt;= 16)</text></g><g id="cue_s09_c2_simulation_constants_clean_too_r_rou"><title>simulation constants clean too r-round parallel protocol becomes transformer depth</title><rect x="64" y="246" width="560" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="246" width="560" height="6" rx="6" fill="#34D3C0"/><text x="92" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Simulation constants are clean</text><rect x="92" y="304" width="504" height="54" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="344.0" y="328" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="middle">R-round MPC  -&gt;  depth R + 1</text><text x="344.0" y="348" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="middle">depth-L transformer  -&gt;  O(L)-round MPC</text></g><g id="cue_s09_c3_contrast_other_architectures_stark_m"><title>contrast other architectures stark multi-layer recurrent networks extension state-space models</title><rect x="648" y="246" width="560" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="246" width="560" height="6" rx="6" fill="#F2685C"/><text x="676" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Competitors need depth L &gt;= k</text><rect x="676" y="304" width="504" height="24" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="316.0" r="5" fill="#F2685C"/><text x="710" y="321.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">multi-layer RNN / Mamba   (Cor. 5.2)</text><rect x="676" y="336" width="504" height="24" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="348.0" r="5" fill="#F2C14E"/><text x="710" y="353.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">sub-quadratic attention / Performer   (Cor. 5.3)</text></g><g id="cue_s09_c4_where_transformer_logarithmic_altern"><title>where transformer logarithmic alternatives linear</title><rect x="64" y="398" width="1152" height="152" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="398" width="6" height="152" rx="6" fill="#34D3C0"/><text x="92" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Where the transformer is logarithmic in k, the alternatives are linear</text><line x1="730" y1="420" x2="730" y2="516" stroke="#26455F" stroke-width="1.4" stroke-linecap="round"/><line x1="730" y1="516" x2="1156" y2="516" stroke="#26455F" stroke-width="1.4" stroke-linecap="round"/><polyline points="756.625,510.75 783.25,505.5 809.875,500.25 836.5,495.0 863.125,489.75 889.75,484.5 916.375,479.25 943.0,474.0 969.625,468.75 996.25,463.5 1022.875,458.25 1049.5,453.0 1076.125,447.75 1102.75,442.5 1129.375,437.25 1156.0,432.0" fill="none" stroke="#F2685C" stroke-width="2.6"/><polyline points="756.625,505.5 783.25,500.25 809.875,497.17894687121395 836.5,495.0 863.125,493.30987750184136 889.75,491.92894687121395 916.375,490.76138665919757 943.0,489.75 969.625,488.85789374242785 996.25,488.05987750184136 1022.875,487.3379840021542 1049.5,486.67894687121395 1076.125,486.07269147975927 1102.75,485.51138665919757 1129.375,484.98882437305525 1156.0,484.5" fill="none" stroke="#34D3C0" stroke-width="2.6"/><text x="1156.0" y="434.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2685C" font-weight="800" text-anchor="end">RNN / Mamba / Performer  ~ k</text><text x="1156.0" y="486.5" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#34D3C0" font-weight="800" text-anchor="end">transformer  ~ log k</text><text x="943.0" y="536" font-family