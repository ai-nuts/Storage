<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A single attention layer routes one MPC round</text><g id="cue_s05_c1_heart_forward_simulation_routing_gad"><title>heart forward simulation routing gadget mpc round ends machines sending</title><rect x="64" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="198" rx="6" fill="#4C9BE8"/><text x="92" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">The routing gadget</text><text x="92" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">In MPC each round ends with machines sending addressed</text><text x="92" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">messages. One self-attention layer performs exactly this</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">routing.</text><line x1="146" y1="280" x2="352" y2="304" stroke="#34D3C0" stroke-width="1.4" stroke-linecap="round"/><line x1="146" y1="304" x2="352" y2="328" stroke="#34D3C0" stroke-width="1.4" stroke-linecap="round"/><line x1="146" y1="328" x2="352" y2="280" stroke="#34D3C0" stroke-width="1.4" stroke-linecap="round"/><circle cx="140" cy="280" r="7" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><circle cx="358" cy="280" r="7" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><circle cx="140" cy="304" r="7" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><circle cx="358" cy="304" r="7" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><circle cx="140" cy="328" r="7" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><circle cx="358" cy="328" r="7" fill="#16324A" stroke="#34D3C0" stroke-width="1.5"/><text x="140" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">machines</text><text x="358" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">routed msgs</text><text x="484" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#4C9BE8" font-weight="800" text-anchor="middle">= 1 attention layer</text></g><g id="cue_s05_c2_trick_captured_lemma_3_2_encode"><title>trick captured lemma 3.2 encode message redundantly multiple fixed locations</title><rect x="648" y="152" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="152" width="6" height="198" rx="6" fill="#F2C14E"/><text x="676" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Lemma 3.2  ·  keep it tall and skinny</text><text x="676" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Encode each message redundantly with multiple hashing, and</text><text x="676" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">move it with sparse propagation.</text><rect x="676" y="266" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="282.0" r="5" fill="#F2C14E"/><text x="710" y="287.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">multiple hashing  +  sparse propagation</text><rect x="676" y="306" width="512" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="694" cy="322.0" r="5" fill="#34D3C0"/><text x="710" y="327.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="600" text-anchor="start">tall-skinny Q/K/V  -&gt;  small embedding dim</text></g><g id="cue_s05_c3_put_one_such_layer_per"><title>put one such layer per communication round protocol rounds becomes</title><rect x="64" y="362" width="568" height="198" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="362" width="6" height="198" rx="6" fill="#34D3C0"/><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Stack the layers</text><rect x="92" y="420" width="512" height="46" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="448" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">R communication rounds  -&gt;  depth R + 1</text><text x="92" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The reverse direction packs a whole transformer layer into one</text><text x="92" y="509" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">MPC round, so transformers are no stronger than the model.</text></g><g id="cue_s05_c4_k_hop_task_specifically_they_give"><title>k-hop task specifically they give tailored causally-masked construction constant width</title><rect x="648" y="362" width="568" height="198" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="648" y="362" width="6" height="198" rx="6" fill="#48C78E"/><text x="676" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">The k-hop construction</text><text x="676" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A tailored, causally-masked construction of constant width,</text><text x="676" y="449" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">with depth exactly:</text><rect x="676" y="470" width="512" height="58" rx="10" fill="#16324A" stroke="#48C78E" stroke-width="1.5"/><text x="932.0" y="506" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="20" fill="#48C78E" font-weight="800" text-anchor="middle">L  =  floor( log2 k )  +  2</text></g></svg>