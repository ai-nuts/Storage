<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">It is really about depth, not size</text><g id="cue_s08_c1_experiments_include_several_ablation"><title>experiments include several ablations stress core claim sweeping depth two</title><rect x="64" y="152" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The depth sweep (L = 2..6) is the main ablation: it cleanly traces out the logarithmic threshold.</text></g><g id="cue_s08_c2_when_they_widen_models_going"><title>when they widen models going embedding dimension one hundred twenty-eight</title><rect x="64" y="230" width="560" height="164" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="230" width="6" height="164" rx="6" fill="#F2C14E"/><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Widen the model  ·  boundary barely moves</text><rect x="92" y="288" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="305.0" r="5" fill="#F2C14E"/><text x="126" y="310.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">m=128, H=4   -&gt;   m=256, H=8</text><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The depth-versus-k boundary hardly shifts: the dependence is about</text><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">depth, not sheer size.</text></g><g id="cue_s08_c3_finite_sample_regime_where_overfitti"><title>finite-sample regime where overfitting risk deeper models generalize better hinting</title><rect x="656" y="230" width="560" height="164" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="230" width="6" height="164" rx="6" fill="#34D3C0"/><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Finite-sample regime</text><text x="684" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Where overfitting is a risk, deeper models generalize</text><text x="684" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">better, hinting at an inductive bias suited to</text><text x="684" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">compositional tasks.</text><rect x="684" y="356" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="371.0" r="5" fill="#34D3C0"/><text x="718" y="376.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">deeper  -&gt;  better generalization</text></g><g id="cue_s08_c4_when_they_crack_open_trained"><title>when they crack open trained networks attention matrices line intermediate</title><rect x="64" y="414" width="1152" height="136" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="414" width="6" height="136" rx="6" fill="#48C78E"/><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Crack open the trained network</text><text x="92" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">The attention matrices line up with the intermediate pointer computations from the proof: the learned</text><text x="92" y="501" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">solution mechanistically resembles the theoretical construction.</text><rect x="92" y="520" width="1096" height="24" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="532.0" r="5" fill="#48C78E"/><text x="126" y="537.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">learned attention heads  ==  the find^j pointers used in the proof</text></g></svg>