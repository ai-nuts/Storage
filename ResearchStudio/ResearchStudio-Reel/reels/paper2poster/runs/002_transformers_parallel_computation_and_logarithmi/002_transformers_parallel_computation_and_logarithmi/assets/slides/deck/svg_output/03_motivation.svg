<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Self-attention is fundamentally parallel</text><g id="cue_s03_c1_authors_insight_self_attention_funda"><title>authors insight self-attention fundamentally parallel operation</title><rect x="64" y="152" width="1152" height="74" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="74" rx="6" fill="#4C9BE8"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="1">The authors' insight</text><text x="92" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Self-attention is fundamentally a parallel operation, not a serial one.</text></g><g id="cue_s03_c2_every_pair_tokens_interact_one"><title>every pair tokens interact one layer through inner product between</title><rect x="64" y="244" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="244" width="6" height="196" rx="6" fill="#34D3C0"/><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">All pairs interact in one layer</text><path d="M130,318 Q180.0,294 230,318" fill="none" stroke="#34D3C0" stroke-width="1.2" opacity="0.75"/><path d="M130,318 Q230.0,288 330,318" fill="none" stroke="#34D3C0" stroke-width="1.2" opacity="0.75"/><path d="M130,318 Q280.0,282 430,318" fill="none" stroke="#34D3C0" stroke-width="1.2" opacity="0.75"/><path d="M230,318 Q280.0,294 330,318" fill="none" stroke="#34D3C0" stroke-width="1.2" opacity="0.75"/><path d="M230,318 Q330.0,288 430,318" fill="none" stroke="#34D3C0" stroke-width="1.2" opacity="0.75"/><path d="M330,318 Q380.0,294 430,318" fill="none" stroke="#34D3C0" stroke-width="1.2" opacity="0.75"/><circle cx="130" cy="318" r="9" fill="#16324A" stroke="#34D3C0" stroke-width="1.6"/><circle cx="230" cy="318" r="9" fill="#16324A" stroke="#34D3C0" stroke-width="1.6"/><circle cx="330" cy="318" r="9" fill="#16324A" stroke="#34D3C0" stroke-width="1.6"/><circle cx="430" cy="318" r="9" fill="#16324A" stroke="#34D3C0" stroke-width="1.6"/><text x="280" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="700" text-anchor="middle">attention  ·  parallel</text><line x1="139" y1="392" x2="221" y2="392" stroke="#F2C14E" stroke-width="1.6" stroke-linecap="round"/><path d="M221,392 l-6,-3 l0,6 z" fill="#F2C14E"/><line x1="239" y1="392" x2="321" y2="392" stroke="#F2C14E" stroke-width="1.6" stroke-linecap="round"/><path d="M321,392 l-6,-3 l0,6 z" fill="#F2C14E"/><line x1="339" y1="392" x2="421" y2="392" stroke="#F2C14E" stroke-width="1.6" stroke-linecap="round"/><path d="M421,392 l-6,-3 l0,6 z" fill="#F2C14E"/><circle cx="130" cy="392" r="9" fill="#16324A" stroke="#F2C14E" stroke-width="1.6"/><circle cx="230" cy="392" r="9" fill="#16324A" stroke="#F2C14E" stroke-width="1.6"/><circle cx="330" cy="392" r="9" fill="#16324A" stroke="#F2C14E" stroke-width="1.6"/><circle cx="430" cy="392" r="9" fill="#16324A" stroke="#F2C14E" stroke-width="1.6"/><text x="280" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#F2C14E" font-weight="700" text-anchor="middle">recurrence  ·  one step at a time</text></g><g id="cue_s03_c3_parallelism_looks_lot_like_massively"><title>parallelism looks lot like massively parallel computation mpc abstraction theorists</title><rect x="656" y="244" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="244" width="6" height="196" rx="6" fill="#B79CF0"/><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#B79CF0" font-weight="800" text-anchor="start">That looks like MPC</text><text x="684" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Massively Parallel Computation, the theory behind</text><text x="684" y="334" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">MapReduce-style systems: many machines each hold a little</text><text x="684" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">data and exchange messages in synchronous rounds.</text><rect x="684" y="398" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="414.0" r="5" fill="#B79CF0"/><text x="718" y="419.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">attention layer  &lt;-&gt;  one MPC round</text></g><g id="cue_s03_c4_bet_you_make_connection_between"><title>bet you make connection between attention layers mpc rounds precise</title><rect x="64" y="456" width="1152" height="94" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="456" width="6" height="94" rx="6" fill="#48C78E"/><text x="92" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#48C78E" font-weight="800" text-anchor="start" letter-spacing="1">The paper's bet</text><text x="92" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">Make the connection between attention layers and MPC rounds precise, and you get a single lens that explains both</text><text x="92" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">what transformers can do and what they cannot.</text></g></svg>