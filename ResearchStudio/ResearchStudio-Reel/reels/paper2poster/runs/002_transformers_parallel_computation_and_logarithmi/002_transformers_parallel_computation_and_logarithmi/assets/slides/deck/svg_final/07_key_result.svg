<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Each layer doubles the reachable hop count</text><g id="cue_s07_c1_headline_result_ties_theory_experime"><title>headline result ties theory experiment together theory side they prove</title><rect x="64" y="152" width="560" height="138" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="138" rx="6" fill="#34D3C0"/><text x="92" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Theory  ·  log depth is necessary</text><text x="92" y="218" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Logarithmic depth is not just sufficient but necessary:</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">any transformer solving k-hop needs depth on the order of</text><text x="92" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">log k.</text><rect x="92" y="256" width="504" height="28" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="270.0" r="5" fill="#34D3C0"/><text x="126" y="275.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">depth  =  Theta( log k )</text></g><g id="cue_s07_c2_experimental_side_they_train_transfo"><title>experimental side they train transformers depths two through six measure</title><rect x="64" y="304" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="304" width="6" height="120" rx="6" fill="#4C9BE8"/><text x="92" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Experiment  ·  train depths 2 - 6</text><text x="92" y="370" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Train transformers of depths two through six and measure</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">token-wise error as k grows. The picture is remarkably</text><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">clean.</text></g><g id="cue_s07_c4_empirical_threshold_sits_right_floor"><title>empirical threshold sits right floor log base two plus two</title><rect x="64" y="438" width="560" height="112" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="438" width="6" height="112" rx="6" fill="#48C78E"/><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">Threshold matches to the layer</text><text x="92" y="502" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#48C78E" font-weight="800" text-anchor="start">empirical boundary  =  floor(log2 k) + 2</text><text x="92" y="530" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">learned attention patterns mirror the hand-designed proof</text></g><g id="cue_s07_c3_extra_layer_roughly_doubles_largest"><title>extra layer roughly doubles largest hop count learn six-layer network</title><rect x="656" y="152" width="560" height="398" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="152" width="6" height="398" rx="6" fill="#F2C14E"/><text x="684" y="188" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">+1 layer  ~  2x the largest learnable k</text><rect x="700" y="212" width="486" height="300" rx="10" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="752" y1="226" x2="752" y2="472" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="752" y1="472" x2="1154" y2="472" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="752" y1="472.0" x2="1154" y2="472.0" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="742" y="476.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">0</text><line x1="752" y1="414.5" x2="1154" y2="414.5" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="742" y="418.5" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">4</text><line x1="752" y1="357.0" x2="1154" y2="357.0" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="742" y="361.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">8</text><line x1="752" y1="299.5" x2="1154" y2="299.5" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="742" y="303.5" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">12</text><line x1="752" y1="242.0" x2="1154" y2="242.0" stroke="#26455F" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 5"/><text x="742" y="246.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">16</text><rect x="771.296" y="457.625" width="41.80800000000001" height="14.375" rx="5" fill="#6E869C"/><text x="792.2" y="449.625" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="800" text-anchor="middle">k&lt;=1</text><text x="792.2" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">L=2</text><rect x="851.696" y="443.25" width="41.80800000000001" height="28.75" rx="5" fill="#9DB3C8"/><text x="872.6" y="435.25" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="800" text-anchor="middle">k&lt;=2</text><text x="872.6" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">L=3</text><rect x="932.096" y="414.5" width="41.80800000000001" height="57.5" rx="5" fill="#4C9BE8"/><text x="953.0" y="406.5" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#4C9BE8" font-weight="800" text-anchor="middle">k&lt;=4</text><text x="953.0" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">L=4</text><rect x="1012.4960000000001" y="357.0" width="41.80800000000001" height="115.0" rx="5" fill="#34D3C0"/><text x="1033.4" y="349.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="800" text-anchor="middle">k&lt;=8</text><text x="1033.4" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">L=5</text><rect x="1092.896" y="242.0" width="41.80800000000001" height="230.0" rx="5" fill="#48C78E"/><text x="1113.8" y="234.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#48C78E" font-weight="800" text-anchor="middle">k&lt;=16</text><text x="1113.8" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">L=6</text><text x="943.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">transformer depth L   -&gt;   largest solvable k = 2^(L-2)</text><text x="1148" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="800" text-anchor="end">each step doubles</text></g></svg>