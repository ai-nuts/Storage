<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Theory has not said what makes transformers special</text><g id="cue_s02_c1_transformers_dominate_sequence_model"><title>transformers dominate sequence modeling yet theory explaining why been unsatisfying</title><rect x="64" y="152" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="196" rx="6" fill="#F2C14E"/><text x="92" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Line 1  ·  universality</text><text x="92" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Transformers dominate sequence modeling, yet the theory of</text><text x="92" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">why is unsatisfying. One line proves universality, but</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">only for enormous models.</text><rect x="92" y="300" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="316.0" r="5" fill="#F2C14E"/><text x="126" y="321.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">tells us nothing about size-efficient tasks</text></g><g id="cue_s02_c2_second_line_studies_constant_depth_r"><title>second line studies constant-depth regime where context length grows many</title><rect x="656" y="152" width="560" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="152" width="6" height="196" rx="6" fill="#F2685C"/><text x="684" y="190" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Line 2  ·  constant depth, growing context</text><text x="684" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A second line fixes depth and grows context length. There,</text><text x="684" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">many basic algorithmic tasks are simply impossible.</text><rect x="684" y="300" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="316.0" r="5" fill="#F2685C"/><text x="718" y="321.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">matching parentheses  -&gt;  provably out of reach</text></g><g id="cue_s02_c3_neither_picture_isolates_property_ac"><title>neither picture isolates property actually sets transformers apart recurrent networks</title><rect x="64" y="364" width="1152" height="84" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="364" width="6" height="84" rx="6" fill="#4C9BE8"/><text x="92" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Neither picture isolates the distinguishing property</text><text x="92" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Neither view pins down what actually sets transformers apart from recurrent networks or other architectures.</text></g><g id="cue_s02_c4_asks_single_clean_computational_prop"><title>asks single clean computational property captures strengths limits transformers same</title><rect x="64" y="464" width="1152" height="86" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="464" width="6" height="86" rx="6" fill="#34D3C0"/><text x="92" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1">This paper asks</text><text x="92" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">Is there a single, clean computational property that captures the strengths AND the limits of transformers at once?</text></g></svg>