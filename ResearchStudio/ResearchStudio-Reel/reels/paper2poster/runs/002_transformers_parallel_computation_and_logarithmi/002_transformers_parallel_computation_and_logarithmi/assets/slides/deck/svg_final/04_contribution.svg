<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A correspondence, and a task that proves it</text><g id="cue_s04_c1_makes_two_main_contributions_first"><title>makes two main contributions first establishes tight correspondence any r-round</title><rect x="64" y="152" width="1152" height="104" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="104" rx="6" fill="#4C9BE8"/><text x="92" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Contribution 1  ·  a tight two-way correspondence</text><rect x="300" y="196" width="300" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="450" y="223" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="middle">R-round MPC  -&gt;  depth R+1</text><rect x="620" y="196" width="300" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="770" y="223" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="middle">depth-L  -&gt;  O(L)-round MPC</text><text x="950" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">both directions</text></g><g id="cue_s04_c2_algorithmic_power_logarithmic_depth"><title>algorithmic power logarithmic-depth transformers captured constants mpc</title><rect x="64" y="272" width="368" height="278" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="272" width="368" height="6" rx="6" fill="#34D3C0"/><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">Power = MPC</text><text x="92" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">So the algorithmic power of</text><text x="92" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">logarithmic-depth transformers is</text><text x="92" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">captured, up to constants, exactly by</text><text x="92" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the MPC model.</text><rect x="92" y="482" width="312" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="499.0" r="5" fill="#34D3C0"/><text x="126" y="504.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">log-depth transformer  ==  const-round MPC</text></g><g id="cue_s04_c3_instantly_gives_log_depth_transforme"><title>instantly gives log-depth transformers classic parallel problems like graph connectivity</title><rect x="456" y="272" width="368" height="278" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="272" width="368" height="6" rx="6" fill="#F2C14E"/><text x="484" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Free algorithms</text><text x="484" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The connection instantly yields</text><text x="484" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">log-depth transformers for classic</text><text x="484" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">parallel problems like graph</text><text x="484" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">connectivity.</text><rect x="484" y="482" width="312" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="502" cy="499.0" r="5" fill="#F2C14E"/><text x="518" y="504.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">near-optimal under an MPC conjecture</text></g><g id="cue_s04_c4_second_authors_introduce_concrete_sy"><title>second authors introduce concrete synthetic task k-hop induction heads prove</title><rect x="848" y="272" width="368" height="278" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="848" y="272" width="368" height="6" rx="6" fill="#48C78E"/><text x="876" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">Contribution 2  ·  k-hop</text><text x="876" y="350" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A concrete synthetic task, k-hop</text><text x="876" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">induction heads: log-depth transformers</text><text x="876" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">solve it while competing architectures</text><text x="876" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">cannot do so efficiently.</text><rect x="876" y="482" width="312" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="894" cy="499.0" r="5" fill="#48C78E"/><text x="910" y="504.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="600" text-anchor="start">trained models obey the threshold</text></g></svg>