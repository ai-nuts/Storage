<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Columbia University  ·  Courant Institute, NYU</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#FFFFFF" font-weight="800" text-anchor="start">Transformers, Parallel Computation,</text><text x="64" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="34" fill="#4C9BE8" font-weight="800" text-anchor="start">and Logarithmic Depth</text><rect x="64" y="216" width="150" height="30" rx="15" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="139" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="middle">Parallelism</text><text x="230" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="600" text-anchor="start">is what makes the transformer special</text><text x="64" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#6E869C" font-weight="500" text-anchor="start">Clayton Sanford  ·  Daniel Hsu  ·  Matus Telgarsky</text><g id="cue_s01_c1_what_makes_transformer_special_clayt"><title>what makes transformer special clayton sanford daniel hsu matus telgarsky</title><rect x="64" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="300" width="274" height="6" rx="6" fill="#4C9BE8"/><circle cx="92" cy="348" r="7" fill="#4C9BE8"/><text x="110" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The answer: parallelism</text><text x="86" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Self-attention lets every token</text><text x="86" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">interact at once. This paper</text><text x="86" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">argues that parallelism, not</text><text x="86" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">scale, is the transformer's</text><text x="86" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">defining strength.</text></g><g id="cue_s01_c2_authors_prove_tight_two_way_correspo"><title>authors prove tight two-way correspondence between transformers massively parallel computation</title><rect x="356" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="356" y="300" width="274" height="6" rx="6" fill="#34D3C0"/><circle cx="384" cy="348" r="7" fill="#34D3C0"/><text x="402" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Transformers = MPC</text><text x="378" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A tight, two-way correspondence</text><text x="378" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">between transformers and the</text><text x="378" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Massively Parallel Computation</text><text x="378" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">model used to study distributed</text><text x="378" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">algorithms.</text></g><g id="cue_s01_c3_upshot_striking_transformer_only_log"><title>upshot striking transformer only logarithmic depth solve basic reasoning tasks</title><rect x="648" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="300" width="274" height="6" rx="6" fill="#F2C14E"/><circle cx="676" cy="348" r="7" fill="#F2C14E"/><text x="694" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Log depth beats serial</text><text x="670" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A log-depth transformer solves</text><text x="670" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reasoning tasks that RNNs,</text><text x="670" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">state-space models like Mamba,</text><text x="670" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and sub-quadratic attention</text><text x="670" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">provably cannot do efficiently.</text></g><g id="cue_s01_c4_they_back_theory_clean_synthetic"><title>they back theory clean synthetic task k-hop induction heads problem</title><rect x="940" y="300" width="274" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="940" y="300" width="274" height="6" rx="6" fill="#48C78E"/><circle cx="968" cy="348" r="7" fill="#48C78E"/><text x="986" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Verified empirically</text><text x="962" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">On the synthetic k-hop induction</text><text x="962" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">heads task, trained transformers</text><text x="962" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">obey exactly the logarithmic</text><text x="962" y="460" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">depth threshold the theory</text><text x="962" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">predicts.</text></g><line x1="64" y1="570" x2="1216" y2="570" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2402.09268</text><text x="320" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/chsanford/hop-induction-heads</text><text x="1216" y="606" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="700" text-anchor="end">Log-depth transformers  =  constant-round parallel computation</text></svg>