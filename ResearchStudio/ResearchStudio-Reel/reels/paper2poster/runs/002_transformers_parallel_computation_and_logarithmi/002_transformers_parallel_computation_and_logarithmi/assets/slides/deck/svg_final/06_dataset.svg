<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The k-hop induction heads task</text><g id="cue_s06_c1_make_everything_concrete_authors_des"><title>make everything concrete authors design k-hop induction heads task standard</title><rect x="64" y="152" width="1152" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="152" width="6" height="96" rx="6" fill="#4C9BE8"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Start from standard induction heads</text><text x="92" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Complete a bigram: predict the token that followed the last occurrence</text><text x="92" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">of the current token.</text><text x="700" y="196" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="start">... a  b ...  c  d ...  a  -&gt;  ?</text><text x="700" y="224" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#34D3C0" font-weight="700" text-anchor="start">last 'a' was followed by 'b'  -&gt;  predict b</text></g><g id="cue_s06_c2_k_hop_version_chains_one_completion"><title>k-hop version chains one completion decide which bigram complete next</title><rect x="64" y="264" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="264" width="6" height="150" rx="6" fill="#F2C14E"/><text x="92" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">k-hop chains the lookup</text><text x="92" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Use one completion to decide which bigram to complete</text><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">next, k times over.</text><rect x="92" y="372" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="388.0" r="5" fill="#F2C14E"/><text x="126" y="393.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">hop_k  =  find, then find again, k times</text></g><g id="cue_s06_c3_composition_exactly_what_makes_task"><title>composition exactly what makes task interesting stress test because intuitively</title><rect x="656" y="264" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="264" width="6" height="150" rx="6" fill="#34D3C0"/><text x="684" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Why it is a stress test</text><text x="684" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It looks like it needs k sequential steps, yet a parallel</text><text x="684" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">architecture can fold it into logarithmically many.</text><rect x="684" y="372" width="504" height="32" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="388.0" r="5" fill="#34D3C0"/><text x="718" y="393.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">k serial steps  -&gt;  log k parallel depth</text></g><g id="cue_s06_c4_they_train_evaluate_sequences_length"><title>they train evaluate sequences length one hundred over four-symbol alphabet</title><rect x="64" y="430" width="1152" height="120" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="430" width="6" height="120" rx="6" fill="#48C78E"/><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Training / evaluation setup</text><rect x="92" y="478" width="262" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="223.0" y="509.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">N = 100</text><text x="223.0" y="526.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">sequence length</text><rect x="366" y="478" width="262" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="497.0" y="509.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">|Sigma| = 4</text><text x="497.0" y="526.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">symbol alphabet</text><rect x="640" y="478" width="262" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="771.0" y="509.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">k = 0 .. 16</text><text x="771.0" y="526.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">hop counts swept</text><rect x="914" y="478" width="262" height="60" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1045.0" y="509.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#48C78E" font-weight="800" text-anchor="middle">multi-task</text><text x="1045.0" y="526.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="middle">one model, random k</text></g></svg>