<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Accurate on the sphere, but far too costly</text><g id="cue_s02_c1_spherical_cnns_replace_plane_sphere"><title>spherical cnns replace plane sphere domain signal which exactly right</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="404" height="6" rx="6" fill="#4C9BE8"/><text x="92" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">The domain is the sphere</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Spherical CNNs swap the plane for the</text><text x="92" y="269" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sphere as the domain of the signal -</text><text x="92" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">exactly right for molecules and the</text><text x="92" y="319" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">atmosphere.</text><circle cx="266" cy="410" r="74" fill="#16324A" stroke="#4C9BE8" stroke-width="2"/><line x1="192" y1="410" x2="340" y2="410" stroke="#4C9BE8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/><ellipse cx="266" cy="410" rx="74" ry="26" fill="none" stroke="#4C9BE8" stroke-width="1" opacity="0.6"/><ellipse cx="266" cy="410" rx="30" ry="74" fill="none" stroke="#4C9BE8" stroke-width="1" opacity="0.45"/><text x="266" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#34D3C0" font-weight="700" text-anchor="middle">signal lives on S^2</text></g><g id="cue_s02_c2_catch_their_core_operation_spherical"><title>catch their core operation spherical convolution most accurate spectral domain</title><rect x="500" y="158" width="716" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">1  ·  The core operation is expensive</text><text x="528" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Spherical convolution is most accurate in the spectral domain - far</text><text x="528" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">costlier than an ordinary planar convolution.</text><rect x="528" y="244" width="660" height="26" rx="6" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="544" y="262" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2C14E" font-weight="700" text-anchor="start">spectral-domain convolution  &gt;&gt;  planar convolution   (cost)</text></g><g id="cue_s02_c3_because_cost_spherical_cnns_had"><title>because cost spherical cnns had been limited small low-resolution problems</title><rect x="500" y="286" width="716" height="104" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><text x="528" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">2  ·  So the models stayed small</text><text x="528" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">That cost confined spherical CNNs to small, low-resolution problems with</text><text x="528" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">modest model capacity.</text></g><g id="cue_s02_c4_simply_large_scale_spherical_archite"><title>simply large-scale spherical architecture analogous deep planar networks power modern</title><rect x="500" y="402" width="716" height="148" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="402" width="6" height="148" rx="6" fill="#F2685C"/><text x="528" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2685C" font-weight="800" text-anchor="start">3  ·  No large-scale spherical architecture</text><text x="528" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">There was simply no spherical network analogous to the deep planar nets</text><text x="528" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">- VGG-19 scale - that power modern computer vision.</text><text x="528" y="534" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#F2685C" font-weight="800" text-anchor="start">spherical CNNs  &lt;&lt;  VGG-19-scale planar CNNs</text></g></svg>