<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">State of the art on molecules and weather</text><g id="cue_s07_c1_results_strong_both_fronts"><title>results strong both fronts</title><rect x="64" y="150" width="1152" height="50" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="50" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="700" text-anchor="start">The scaled spherical CNN is strong on both fronts - molecular regression and weather forecasting.</text></g><g id="cue_s07_c2_qm9_scaled_spherical_cnn_reaches"><title>qm9 scaled spherical cnn reaches state art beating previously dominant</title><rect x="64" y="214" width="560" height="336" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="214" width="6" height="336" rx="6" fill="#4C9BE8"/><text x="92" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">QM9  ·  molecular regression</text><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Reaches state of the art, beating the previously</text><text x="92" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">dominant graph neural nets and transformers.</text><rect x="92" y="326" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="176" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">8 / 12</text><text x="176" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">targets, Split 1</text><rect x="272" y="326" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="356" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">9 / 12</text><text x="356" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">targets, Split 2</text><text x="534" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="24" fill="#48C78E" font-weight="800" text-anchor="middle">SOTA</text><text x="534" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">vs GNNs &amp;</text><text x="534" y="396" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">transformers</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="700" text-anchor="start">State-of-the-art targets (higher is better)</text><rect x="240" y="480" width="300" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="480" width="225" height="22" rx="6" fill="#48C78E"/><text x="228" y="495.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Split 2</text><text x="475" y="495.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">9 / 12</text><rect x="240" y="512" width="300" height="22" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="240" y="512" width="200" height="22" rx="6" fill="#4C9BE8"/><text x="228" y="527.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Split 1</text><text x="450" y="527.84" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">8 / 12</text></g><g id="cue_s07_c3_weather_outperforms_weatherbench_bas"><title>weather outperforms weatherbench baseline every metric simpler two-predictor setting even</title><rect x="656" y="214" width="560" height="336" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="336" rx="6" fill="#34D3C0"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">WeatherBench  ·  forecasting</text><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Beats the WeatherBench baseline on every metric in the</text><text x="684" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">simpler two-predictor setting.</text><rect x="684" y="330" width="504" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="350.0" r="5" fill="#48C78E"/><text x="718" y="355.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">Outperforms baseline on ALL 2-predictor metrics</text><rect x="684" y="382" width="504" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="402.0" r="5" fill="#4C9BE8"/><text x="718" y="407.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">Beats simulation-pretrained models on temperature</text><rect x="684" y="442" width="504" height="50" rx="10" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><text x="700" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">First viable spherical neural weather model</text><text x="684" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6E869C" font-weight="600" text-anchor="start">even rivaling models trained on large simulated datasets</text></g><g id="cue_s07_c4_first_demonstration_spherical_cnns_v"><title>first demonstration spherical cnns viable neural weather models</title><rect x="64" y="564" width="1152" height="116" rx="14" fill="#0F2E2B" stroke="#34D3C0" stroke-width="1.5"/><rect x="64" y="564" width="6" height="116" rx="6" fill="#34D3C0"/><text x="92" y="600" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">A first for the field</text><text x="92" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">This is the first demonstration that spherical CNNs are viable neural weather models - a domain long dominated by</text><text x="92" y="656" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#EAF2FB" font-weight="400" text-anchor="start">other architectures.</text></g></svg>