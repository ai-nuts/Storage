<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">New spectral-domain components</text><g id="cue_s05_c1_method_builds_spin_weighted_spherica"><title>method builds spin-weighted spherical cnns its centerpiece set new components</title><rect x="64" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="192" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Everything lives in spectral space</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Building on spin-weighted spherical CNNs, the centerpiece</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">is a set of new components that all operate in the</text><text x="92" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">spectral domain.</text><rect x="92" y="286" width="512" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="306.0" r="5" fill="#4C9BE8"/><text x="126" y="311.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="600" text-anchor="start">spin-weighted spherical harmonic transform</text></g><g id="cue_s05_c2_phase_collapse_nonlinearity_takes_mo"><title>phase collapse nonlinearity takes modulus features collapse their phase which</title><rect x="648" y="158" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="192" rx="6" fill="#34D3C0"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Phase collapse nonlinearity</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Take the modulus to collapse phase - restoring rotation</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">invariance while losing no information in the nonzero</text><text x="676" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">spins.</text><rect x="676" y="286" width="512" height="42" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="313" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="middle">x0  &lt;-  W1 x0  +  W2 |x|  +  b</text></g><g id="cue_s05_c3_batch_normalization_pooling_also_mov"><title>batch normalization pooling also moved spectral domain residual block adds</title><rect x="64" y="362" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="362" width="6" height="192" rx="6" fill="#F2C14E"/><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Norm, pool and residual - all spectral</text><rect x="92" y="420" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="437.0" r="5" fill="#4C9BE8"/><text x="126" y="442.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Spectral batch normalization</text><rect x="92" y="462" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="479.0" r="5" fill="#34D3C0"/><text x="126" y="484.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Spectral pooling</text><rect x="92" y="504" width="512" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="521.0" r="5" fill="#F2C14E"/><text x="126" y="526.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Residual skip between Fourier coefficients</text></g><g id="cue_s05_c4_implementation_side_authors_compute"><title>implementation side authors compute fourier transforms dense matrix multiplications rather</title><rect x="648" y="362" width="568" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="362" width="6" height="192" rx="6" fill="#F2685C"/><text x="676" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">DFT as dense matmul, not FFT</text><text x="676" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Compute Fourier transforms as dense matrix multiplications:</text><text x="676" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">on TPUs matmul is extremely fast, while memory reshuffling</text><text x="676" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">is the bottleneck.</text><rect x="676" y="504" width="512" height="38" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="932.0" y="529" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">FFT reshuffle  -&gt;  matmul on TPU</text></g></svg>