<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A recipe to scale spherical CNNs 10x</text><g id="cue_s04_c1_authors_contribute_systematic_recipe"><title>authors contribute systematic recipe scaling spherical cnns order magnitude three</title><rect x="64" y="158" width="1152" height="66" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="66" rx="6" fill="#4C9BE8"/><text x="92" y="199" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">A systematic approach to scale spherical CNNs one order of magnitude larger - in three parts.</text></g><g id="cue_s04_c2_first_efficient_implementation_spin"><title>first efficient implementation spin-weighted spherical harmonic transforms jax tuned run</title><rect x="64" y="250" width="368" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="250" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="316" r="27" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Fast transforms on TPUs</text><text x="92" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">An efficient JAX implementation of</text><text x="92" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">spin-weighted spherical harmonic</text><text x="92" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">transforms, tuned to run fast and</text><text x="92" y="491" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">distributed across TPUs.</text></g><g id="cue_s04_c3_second_new_general_purpose_layers_ac"><title>second new general-purpose layers activations improve both expressivity efficiency third</title><rect x="456" y="250" width="368" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="250" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="508" cy="316" r="27" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="508" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="484" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">New layers and inputs</text><text x="484" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">New general-purpose layers and</text><text x="484" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">activations for expressivity and</text><text x="484" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">efficiency, plus application-specific</text><text x="484" y="491" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">input representations for molecules and</text><text x="484" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">weather.</text></g><g id="cue_s04_c4_key_finding_naive_scaling_just"><title>key finding naive scaling just adding depth width not enough</title><rect x="848" y="250" width="368" height="300" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="250" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="316" r="27" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="326" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Redesign, don't just</text><text x="876" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">enlarge</text><text x="876" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">A key finding: naive scaling - just</text><text x="876" y="469" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">adding depth and width - is not enough.</text><text x="876" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">The core components themselves had to be</text><text x="876" y="519" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">redesigned.</text></g></svg>