<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Each redesigned component earns its place</text><g id="cue_s08_c1_careful_ablation_isolates_effect_cha"><title>careful ablation isolates effect change</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="600" text-anchor="start">A careful ablation isolates the effect of each change on a QM9 model - error and speed together.</text></g><g id="cue_s08_c2_starting_jax_implementation_phase_co"><title>starting jax implementation phase collapse activation cuts error eight percent</title><rect x="64" y="238" width="680" height="312" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="238" width="6" height="312" rx="6" fill="#34D3C0"/><text x="92" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Cumulative RMSE reduction (from the JAX baseline)</text><text x="104" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">JAX baseline</text><rect x="284" y="320" width="420" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="284" y="320" width="3" height="30" rx="6" fill="#9DB3C8"/><text x="299" y="341" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="start">baseline</text><text x="104" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">+ Phase collapse</text><rect x="284" y="372" width="420" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="284" y="372" width="258" height="30" rx="6" fill="#4C9BE8"/><text x="554" y="393" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">-8.0%</text><text x="104" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">+ Spectral batch-norm</text><rect x="284" y="424" width="420" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="284" y="424" width="303" height="30" rx="6" fill="#34D3C0"/><text x="599" y="445" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">-9.4%</text><text x="104" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">+ Efficient residual</text><rect x="284" y="476" width="420" height="30" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="284" y="476" width="381" height="30" rx="6" fill="#F2C14E"/><text x="677" y="497" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">-11.8%</text><text x="104" y="546" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#48C78E" font-weight="700" text-anchor="start">all while improving training speed</text></g><g id="cue_s08_c3_separate_comparison_confirms_phase_c"><title>separate comparison confirms phase collapse activation spectral pooling new spherical</title><rect x="764" y="238" width="452" height="312" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="764" y="238" width="6" height="312" rx="6" fill="#F2C14E"/><text x="792" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Beats prior alternatives</text><text x="792" y="308" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A separate comparison confirms each new</text><text x="792" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">piece beats earlier work.</text><rect x="792" y="352" width="396" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="810" cy="369.0" r="5" fill="#4C9BE8"/><text x="826" y="374.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Phase collapse  &gt;  prior nonlinearity</text><rect x="792" y="392" width="396" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="810" cy="409.0" r="5" fill="#34D3C0"/><text x="826" y="414.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Spectral pooling  &gt;  prior pooling</text><rect x="792" y="432" width="396" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="810" cy="449.0" r="5" fill="#48C78E"/><text x="826" y="454.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Spherical molecule rep  &gt;  prior input</text><rect x="792" y="480" width="396" height="50" rx="10" fill="#16324A" stroke="#F2C14E" stroke-width="1.5"/><text x="812" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">QM9 enthalpy MAE</text><text x="1168" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#F2C14E" font-weight="800" text-anchor="end">15.25 meV</text><text x="812" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#6E869C" font-weight="600" text-anchor="start">driven down together by the new components</text></g></svg>