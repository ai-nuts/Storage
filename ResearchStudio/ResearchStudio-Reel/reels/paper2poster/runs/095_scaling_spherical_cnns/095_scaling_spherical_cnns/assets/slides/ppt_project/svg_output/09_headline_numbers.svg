<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The impact in four numbers</text><g id="cue_s09_c1_numbers_summarize_impact_models_scal"><title>numbers summarize impact models scale one full order magnitude both</title><rect x="64" y="168" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="176" rx="6" fill="#4C9BE8"/><text x="94" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#4C9BE8" font-weight="800" text-anchor="start">10x</text><text x="94" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">order of magnitude</text><text x="94" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Scaled up in both operations and feature resolution versus prior</text><text x="94" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">spherical CNNs.</text></g><g id="cue_s09_c2_they_set_state_art_eight"><title>they set state art eight twelve qm9 targets first split</title><rect x="656" y="168" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="168" width="6" height="176" rx="6" fill="#48C78E"/><text x="686" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#48C78E" font-weight="800" text-anchor="start">8/12 · 9/12</text><text x="686" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">QM9 state-of-the-art targets</text><text x="686" y="310" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">SOTA on 8 of 12 targets in Split 1 and 9 of 12 in Split 2.</text></g><g id="cue_s09_c3_new_jax_implementation_about_three"><title>new jax implementation about three times faster original running distributed</title><rect x="64" y="360" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="360" width="6" height="176" rx="6" fill="#34D3C0"/><text x="94" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#34D3C0" font-weight="800" text-anchor="start">3x -&gt; 100x</text><text x="94" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">faster</text><text x="94" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">About 3x faster than the original in JAX; up to 100x on 32 TPUs,</text><text x="94" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">distributed.</text></g><g id="cue_s09_c4_phase_collapse_nonlinearity_alone_re"><title>phase collapse nonlinearity alone reduces qm9 error eight percent</title><rect x="656" y="360" width="560" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="360" width="6" height="176" rx="6" fill="#F2C14E"/><text x="686" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#F2C14E" font-weight="800" text-anchor="start">-8.0%</text><text x="686" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">QM9 error</text><text x="686" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The phase collapse nonlinearity alone reduces QM9 error by eight</text><text x="686" y="524" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">percent.</text></g></svg>