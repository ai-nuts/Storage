<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Spherical science problems demand scale</text><g id="cue_s03_c1_two_scientific_problems_motivate_wor"><title>two scientific problems motivate work predicting molecular properties forecasting weather</title><rect x="64" y="158" width="1152" height="88" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="88" rx="6" fill="#34D3C0"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start" letter-spacing="1.5">Two motivating problems</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="600" text-anchor="start">Molecular property prediction and weather forecasting are both intrinsically spherical and tied to rotations.</text></g><g id="cue_s03_c2_molecule_properties_don_change_when"><title>molecule properties don change when you rotate space earth atmosphere</title><rect x="64" y="266" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="266" width="6" height="150" rx="6" fill="#4C9BE8"/><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">Rotations everywhere</text><text x="92" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A molecule's properties don't change when you</text><text x="92" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rotate it; the Earth's atmosphere is naturally a</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">signal on a sphere.</text><circle cx="150" cy="392" r="8" fill="#34D3C0"/><circle cx="190" cy="376" r="8" fill="#4C9BE8"/><circle cx="215" cy="404" r="8" fill="#F2C14E"/><line x1="150" y1="392" x2="190" y2="376" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="376" x2="215" y2="404" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><text x="250" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">rotation-invariant properties</text></g><g id="cue_s03_c3_rotation_equivariant_spherical_cnns"><title>rotation-equivariant spherical cnns should perfect match but standard benchmarks large</title><rect x="648" y="266" width="568" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="266" width="6" height="150" rx="6" fill="#F2C14E"/><text x="676" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">A perfect match - at a price</text><text x="676" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Rotation-equivariant spherical CNNs should excel</text><text x="676" y="359" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">here. But the standard benchmarks are large and</text><text x="676" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">high-resolution.</text><text x="676" y="400" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#34D3C0" font-weight="700" text-anchor="start">equivariance  +  scale  =  the real challenge</text></g><g id="cue_s03_c4_qm9_one_hundred_thirty_four"><title>qm9 one hundred thirty four thousand molecules over eighteen times</title><rect x="64" y="436" width="1152" height="114" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="436" width="6" height="114" rx="6" fill="#4C9BE8"/><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">The benchmarks earlier spherical CNNs could not touch</text><rect x="92" y="490" width="272" height="44" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="92" y="490" width="5" height="44" rx="2" fill="#4C9BE8"/><text x="112" y="511" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#4C9BE8" font-weight="800" text-anchor="start">QM9</text><text x="112" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">134,000 molecules</text><rect x="392" y="490" width="272" height="44" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="392" y="490" width="5" height="44" rx="2" fill="#F2C14E"/><text x="412" y="511" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F2C14E" font-weight="800" text-anchor="start">18x bigger</text><text x="412" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">than QM7 (7,165)</text><rect x="692" y="490" width="272" height="44" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><rect x="692" y="490" width="5" height="44" rx="2" fill="#34D3C0"/><text x="712" y="511" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">ERA5 weather</text><text x="712" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">high-resolution grids</text><text x="1000" y="516" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="700" text-anchor="start">-&gt; the models had to scale</text></g></svg>