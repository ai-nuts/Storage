<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Two very different spherical domains</text><g id="cue_s06_c1_experiments_span_two_very_different"><title>experiments span two very different domains</title><rect x="64" y="158" width="1152" height="64" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="64" rx="6" fill="#4C9BE8"/><text x="92" y="197" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="600" text-anchor="start">The experiments span two very different domains: small molecules and the global atmosphere.</text></g><g id="cue_s06_c2_molecules_benchmark_qm9_one_hundred"><title>molecules benchmark qm9 one hundred thirty four thousand molecules twenty</title><rect x="64" y="244" width="560" height="306" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="244" width="6" height="306" rx="6" fill="#4C9BE8"/><text x="92" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#4C9BE8" font-weight="800" text-anchor="start">QM9  ·  molecular property regression</text><text x="92" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Small organic molecules, each mapped onto the sphere</text><text x="92" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">for rotation-equivariant regression.</text><rect x="92" y="362" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="176" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">134K</text><text x="176" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">molecules</text><rect x="272" y="362" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="356" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">&lt;=29</text><text x="356" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">atoms each</text><rect x="452" y="362" width="168" height="100" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="536" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">12</text><text x="536" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">regression targets</text><rect x="92" y="478" width="504" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="507" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">targets: energetic  ·  electronic  ·  thermodynamic properties</text></g><g id="cue_s06_c3_weather_models_trained_era5_reanalys"><title>weather models trained era5 reanalysis through weatherbench benchmark forecasting quantities</title><rect x="656" y="244" width="560" height="306" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="244" width="6" height="306" rx="6" fill="#34D3C0"/><text x="684" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">WeatherBench / ERA5  ·  forecasting</text><text x="684" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Models train on ERA5 reanalysis data through the</text><text x="684" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">WeatherBench benchmark.</text><rect x="684" y="372" width="504" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="390.0" r="5" fill="#4C9BE8"/><text x="718" y="395.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Geopotential Z500 and temperature T850, T2M</text><rect x="684" y="416" width="504" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="434.0" r="5" fill="#34D3C0"/><text x="718" y="439.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">3- and 5-day horizons, out to 28 days</text><rect x="684" y="460" width="504" height="36" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="478.0" r="5" fill="#F2C14E"/><text x="718" y="483.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="600" text-anchor="start">Iterative high-resolution forecasting</text><text x="684" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6E869C" font-weight="600" text-anchor="start">from short-range nowcasts to long-range global forecasts</text></g></svg>