<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Google Research   ·   MIT</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="168" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="46" fill="#FFFFFF" font-weight="800" text-anchor="start">Scaling Spherical CNNs</text><text x="64" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#4C9BE8" font-weight="700" text-anchor="start">Rotation-equivariant deep nets, scaled by an order of magnitude</text><text x="64" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="500" text-anchor="start">Carlos Esteves   ·   Jean-Jacques Slotine   ·   Ameesh Makadia      —   Google Research, MIT</text><g id="cue_s01_c1_spherical_cnns_generalize_convolutio"><title>spherical cnns generalize convolutional networks signals living sphere which makes</title><rect x="64" y="292" width="272" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="292" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="90" cy="334" r="7" fill="#4C9BE8"/><text x="108" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Signals on the sphere</text><text x="86" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Spherical CNNs generalize</text><text x="86" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">convnets to data on a sphere —</text><text x="86" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">a natural fit for molecules</text><text x="86" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and weather.</text></g><g id="cue_s01_c2_but_until_now_they_stuck"><title>but until now they stuck low resolutions shallow depths they</title><rect x="352" y="292" width="272" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="352" y="292" width="272" height="6" rx="6" fill="#F2685C"/><circle cx="378" cy="334" r="7" fill="#F2685C"/><text x="396" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Stuck small</text><text x="374" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Until now: low resolutions and</text><text x="374" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">shallow depth. They never</text><text x="374" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">competed on large real</text><text x="374" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">problems.</text></g><g id="cue_s01_c3_scaling_spherical_cnns_google_resear"><title>scaling spherical cnns google research mit shows how scale these</title><rect x="640" y="292" width="272" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="640" y="292" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="666" cy="334" r="7" fill="#34D3C0"/><text x="684" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Scaled x10</text><text x="662" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Google Research and MIT scale</text><text x="662" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">these models by a full order</text><text x="662" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">of magnitude.</text></g><g id="cue_s01_c4_new_activations_normalization_residu"><title>new activations normalization residual blocks tpu-optimized implementation authors reach state</title><rect x="928" y="292" width="272" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="928" y="292" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="954" cy="334" r="7" fill="#F2C14E"/><text x="972" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">New recipe, SOTA</text><text x="950" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">New activations,</text><text x="950" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">normalization, residual blocks</text><text x="950" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and TPU-tuned JAX -&gt; SOTA on</text><text x="950" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">QM9, competitive weather.</text></g><line x1="64" y1="548" x2="1216" y2="548" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">State of the art on the QM9 molecular benchmark; the first viable spherical neural weather model.</text><text x="64" y="628" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2306.05420</text><text x="232" y="628" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/google-research/spherical-cnn</text><rect x="1064" y="566" width="68" height="84" rx="8" fill="#FFFFFF"/><image x="1072" y="572" width="52" height="52" href="/datadisk/project/ResearchStudio/benchmarks/paper2poster/runs/095_scaling_spherical_cnns/095_scaling_spherical_cnns/assets/qr/paper.png" preserveAspectRatio="xMidYMid meet"/><text x="1098" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="middle">Paper</text><rect x="1148" y="566" width="68" height="84" rx="8" fill="#FFFFFF"/><image x="1156" y="572" width="52" height="52" href="/datadisk/project/ResearchStudio/benchmarks/paper2poster/runs/095_scaling_spherical_cnns/095_scaling_spherical_cnns/assets/qr/code.png" preserveAspectRatio="xMidYMid meet"/><text x="1182" y="640" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="middle">Code</text></svg>