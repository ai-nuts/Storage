<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Not limited - just poorly scaled</text><g id="cue_s10_c1_takeaway_spherical_cnns_never_fundam"><title>takeaway spherical cnns never fundamentally limited they just poorly scaled</title><rect x="64" y="168" width="1152" height="88" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="168" width="6" height="88" rx="6" fill="#4C9BE8"/><circle cx="112" cy="212.0" r="10" fill="#4C9BE8"/><text x="150" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Never fundamentally limited</text><text x="150" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Spherical CNNs were not held back by any inherent ceiling - they were simply poorly scaled.</text></g><g id="cue_s10_c2_redesign_nonlinearity_normalization"><title>redesign nonlinearity normalization residual block plus implementation tuned modern accelerators</title><rect x="64" y="274" width="1152" height="136" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="274" width="6" height="136" rx="6" fill="#34D3C0"/><circle cx="112" cy="342.0" r="10" fill="#34D3C0"/><text x="150" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Redesign plus hardware-tuning</text><text x="150" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Redesigning the nonlinearity, normalization and residual block, plus an implementation tuned</text><text x="150" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">to modern accelerators, lets them finally scale - state of the art on molecular property</text><text x="150" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">prediction and genuinely competitive as neural weather models.</text></g><g id="cue_s10_c3_authors_release_their_jax_implementa"><title>authors release their jax implementation platform further research spherical</title><rect x="64" y="428" width="1152" height="112" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="428" width="6" height="112" rx="6" fill="#48C78E"/><circle cx="112" cy="484.0" r="10" fill="#48C78E"/><text x="150" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">An open platform</text><text x="150" y="498" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The authors release their JAX implementation as a platform for further research on spherical</text><text x="150" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">data.</text></g><line x1="64" y1="564" x2="1216" y2="564" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="598" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="700" text-anchor="start">Scaling Spherical CNNs</text><text x="64" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICML 2023  ·  arXiv:2306.05420  ·  github.com/google-research/spherical-cnn</text></svg>