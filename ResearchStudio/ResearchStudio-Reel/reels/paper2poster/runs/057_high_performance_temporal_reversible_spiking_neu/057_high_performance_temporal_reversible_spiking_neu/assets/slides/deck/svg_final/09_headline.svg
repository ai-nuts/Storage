<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">HEADLINE NUMBERS</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">The results in one place</text><g id="cue_s09_c1_summarize_numbers_matter_most_agains"><title>summarize numbers matter most against leading spiking transformer comparable accuracy</title><rect x="64" y="168" width="1152" height="182" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="168" width="6" height="182" rx="6" fill="#F2C14E"/><text x="92" y="208" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">vs a leading spiking Transformer, at comparable accuracy</text><rect x="120" y="232" width="336" height="98" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="288.0" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">8.6x</text><text x="288.0" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">better memory efficiency</text><rect x="472" y="232" width="336" height="98" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="640.0" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">2.0x</text><text x="640.0" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">faster training</text><rect x="824" y="232" width="336" height="98" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="992.0" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">1.6x</text><text x="992.0" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">lower inference energy</text></g><g id="cue_s09_c2_reaches_73_2_percent_top_1_accuracy"><title>reaches 73.2 percent top-1 accuracy imagenet-1k just 85.7 megabytes memory</title><rect x="64" y="366" width="560" height="184" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="366" width="6" height="184" rx="6" fill="#48C78E"/><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#48C78E" font-weight="800" text-anchor="start">ImageNet-1K</text><rect x="92" y="424" width="164" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="174.0" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#48C78E" font-weight="800" text-anchor="middle">73.2%</text><text x="174.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">top-1 accuracy</text><rect x="272" y="424" width="164" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="354.0" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">85.7 MB</text><text x="354.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">memory / image</text><rect x="452" y="424" width="156" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="530.0" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">2.8 mJ</text><text x="530.0" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">per inference</text></g><g id="cue_s09_c3_achieves_all_order_memory_order"><title>achieves all order memory order one inference cost</title><rect x="656" y="366" width="560" height="184" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="366" width="6" height="184" rx="6" fill="#4C9BE8"/><text x="684" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#4C9BE8" font-weight="800" text-anchor="start">And the complexity that makes it possible</text><rect x="684" y="432" width="504" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="462.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="middle">training memory   =   O(L)</text><rect x="684" y="492" width="504" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="522.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="middle">inference cost   =   O(1)</text></g></svg>