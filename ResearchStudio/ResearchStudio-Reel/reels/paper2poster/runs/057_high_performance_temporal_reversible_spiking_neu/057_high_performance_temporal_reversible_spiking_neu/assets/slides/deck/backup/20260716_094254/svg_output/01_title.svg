<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Peking University  ·  Institute of Automation, CAS</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="152" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="39" fill="#FFFFFF" font-weight="800" text-anchor="start">High-Performance Temporal Reversible</text><text x="64" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="39" fill="#4C9BE8" font-weight="800" text-anchor="start">Spiking Neural Networks</text><text x="64" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#34D3C0" font-weight="800" text-anchor="start">O(L) Training Memory   ·   O(1) Inference Cost</text><text x="64" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="500" text-anchor="start">Jiakui Hu, Man Yao, Xuerui Qiu, ... Guoqi Li   —   Peking University &amp; Institute of Automation, CAS</text><g id="cue_s01_c1_spiking_neural_networks_promise_low"><title>spiking neural networks promise low-power but them over many timesteps</title><rect x="64" y="316" width="365" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="316" width="365" height="6" rx="6" fill="#F2C14E"/><text x="90" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The steep cost of spiking nets</text><text x="90" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Spiking networks promise low-power AI, but</text><text x="90" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">they are simulated over many timesteps:</text><text x="90" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">training memory grows with L times T, and</text><text x="90" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">inference repeats work at every step.</text></g><g id="cue_s01_c2_icml_2024_introduces_t_revsnn_tempor"><title>icml 2024 introduces t-revsnn temporal reversible architecture turns off temporal</title><rect x="457" y="316" width="365" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="457" y="316" width="365" height="6" rx="6" fill="#4C9BE8"/><text x="483" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">T-RevSNN</text><text x="483" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Turn off the temporal dynamics of most</text><text x="483" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">spiking neurons, and make the few</text><text x="483" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">remaining temporal connections reversible.</text></g><g id="cue_s01_c3_result_memory_1_inference_cost"><title>result memory 1 inference cost state-of-the-art accuracy among cnn-based snns</title><rect x="850" y="316" width="365" height="214" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="850" y="316" width="365" height="6" rx="6" fill="#48C78E"/><text x="876" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The payoff</text><text x="876" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">O(L) training memory and O(1) inference</text><text x="876" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">cost, state-of-the-art accuracy among</text><text x="876" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CNN-based SNNs on ImageNet, up to 8.6x</text><text x="876" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">better memory.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">arXiv:2405.16466</text><text x="300" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">You do not need full temporal dynamics everywhere to build a capable spiking network.</text><text x="64" y="648" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="600" text-anchor="start">github.com/BICLab/T-RevSNN</text></svg>