<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One architecture, both costs solved</text><g id="cue_s04_c1_their_answer_t_revsnn_temporal_rever"><title>their answer t-revsnn temporal reversible architecture spiking networks core idea</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#4C9BE8"/><circle cx="114" cy="246" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="114" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Turn off most</text><text x="88" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">temporal dynamics</text><text x="88" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Keep temporal dynamics on only</text><text x="88" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">at a few key positions, where</text><text x="88" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">the temporal connections are</text><text x="88" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">made reversible.</text></g><g id="cue_s04_c2_reversibility_means_network_recomput"><title>reversibility means network recompute activations during backward pass instead storing</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#34D3C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="410" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Reversible -&gt; O(L)</text><text x="384" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">memory</text><text x="384" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Reversibility lets the network</text><text x="384" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">recompute activations in the</text><text x="384" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">backward pass instead of</text><text x="384" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">storing them, cutting training</text><text x="384" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">memory to order L.</text></g><g id="cue_s04_c3_top_they_encode_input_image"><title>top they encode input image only once split both features</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#F2C14E"/><circle cx="706" cy="246" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="706" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Encode once -&gt; O(1)</text><text x="680" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">inference</text><text x="680" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Encode the image only once and</text><text x="680" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">split features and network</text><text x="680" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">into independent sub-networks,</text><text x="680" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">so inference cost becomes</text><text x="680" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">constant.</text></g><g id="cue_s04_c4_make_sparse_temporal_design_actually"><title>make sparse temporal design actually train well they also redesign</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#48C78E"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#48C78E" stroke-width="2.5"/><text x="1002" y="256" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#48C78E" font-weight="800" text-anchor="middle">4</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">ConvNeXt block +</text><text x="976" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">scaled residual</text><text x="976" y="376" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Redesign the basic SNN block</text><text x="976" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">in a ConvNeXt style and add a</text><text x="976" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">scaled residual so the sparse</text><text x="976" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">temporal design still trains</text><text x="976" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">well.</text></g><text x="64" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Sparse temporal dynamics + reversibility  =  low memory and low inference cost at once.</text></svg>