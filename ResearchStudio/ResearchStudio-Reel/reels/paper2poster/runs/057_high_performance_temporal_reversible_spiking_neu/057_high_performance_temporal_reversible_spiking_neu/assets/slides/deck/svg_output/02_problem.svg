<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A training-memory and inference-energy dilemma</text><g id="cue_s02_c1_spiking_neural_networks_appealing_be"><title>spiking neural networks appealing because they promise brain-inspired low-power computation</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Appealing, but simulated over time</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">SNNs promise brain-inspired, low-power</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">computation. But to work well they are</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">unfolded over many timesteps, and that</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">comes at a steep cost.</text><rect x="92" y="352" width="344" height="118" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">one input, unrolled over T steps</text><circle cx="126" cy="424" r="10" fill="#4C9BE8"/><circle cx="186" cy="424" r="10" fill="#4C9BE8"/><circle cx="246" cy="424" r="10" fill="#4C9BE8"/><circle cx="306" cy="424" r="10" fill="#4C9BE8"/><line x1="136" y1="424" x2="176" y2="424" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><line x1="196" y1="424" x2="236" y2="424" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><line x1="256" y1="424" x2="296" y2="424" stroke="#26455F" stroke-width="2" stroke-linecap="round"/><text x="126" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">t1</text><text x="186" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">t2</text><text x="246" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">t3</text><text x="306" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="600" text-anchor="middle">t4</text><text x="360" y="430" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="800" text-anchor="start">...</text><text x="92" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#4C9BE8" font-weight="700" text-anchor="start">Cost grows with every timestep.</text></g><g id="cue_s02_c2_during_memory_grows_both_number"><title>during memory grows both number layers number timesteps order times</title><rect x="500" y="158" width="716" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="120" rx="6" fill="#F2685C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2685C" font-weight="800" text-anchor="start">Training: memory blows up</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Memory grows with both the number of layers and the number</text><text x="528" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">of timesteps.</text><rect x="930" y="196" width="258" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1059.0" y="222.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">train mem ~ O(L * T)</text></g><g id="cue_s02_c3_inference_repeating_input_over_steps"><title>inference repeating input over steps makes energy scale well</title><rect x="500" y="290" width="716" height="96" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="290" width="6" height="96" rx="6" fill="#F2C14E"/><text x="528" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Inference: energy scales with T</text><text x="528" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Repeating the input over T steps makes inference</text><text x="528" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">energy scale with T too.</text><rect x="970" y="318" width="218" height="40" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1079.0" y="344.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">infer energy ~ O(T)</text></g><g id="cue_s02_c4_frustrating_part_current_methods_rel"><title>frustrating part current methods relieve one these pressures but not</title><rect x="500" y="398" width="716" height="152" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="398" width="6" height="152" rx="6" fill="#F2685C"/><text x="528" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">The dilemma</text><text x="528" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Current training methods can relieve one of these pressures, but not the</text><text x="528" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">other at the same time, leaving SNNs stuck.</text><text x="528" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#F2685C" font-weight="800" text-anchor="start">save memory  XOR  save energy   =   pick one</text></g></svg>