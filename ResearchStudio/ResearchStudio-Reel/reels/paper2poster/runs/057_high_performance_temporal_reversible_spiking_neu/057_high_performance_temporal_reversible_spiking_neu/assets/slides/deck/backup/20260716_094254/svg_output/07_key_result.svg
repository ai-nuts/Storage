<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">State-of-the-art accuracy at the lowest cost</text><g id="cue_s07_c1_results_imagenet_strong_about_30"><title>results imagenet strong about 30 million parameters four timesteps t-revsnn</title><rect x="64" y="150" width="1152" height="86" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="150" width="6" height="86" rx="6" fill="#48C78E"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">ImageNet-1K  ·  ~30M params, T=4</text><rect x="360" y="160" width="196" height="66" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="458.0" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#48C78E" font-weight="800" text-anchor="middle">73.2%</text><text x="458.0" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">top-1 accuracy</text><rect x="572" y="160" width="196" height="66" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="670.0" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#34D3C0" font-weight="800" text-anchor="middle">85.7 MB</text><text x="670.0" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">memory / image</text><rect x="784" y="160" width="196" height="66" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="882.0" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="22" fill="#4C9BE8" font-weight="800" text-anchor="middle">2.8 mJ</text><text x="882.0" y="215" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">inference energy</text><text x="998" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">best-in-class</text><text x="998" y="206" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">CNN-based SNN</text></g><g id="cue_s07_c2_best_accuracy_among_convolutional_sp"><title>best accuracy among convolutional spiking resnets comes lowest memory fastest</title><rect x="64" y="252" width="560" height="226" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="252" width="6" height="226" rx="6" fill="#34D3C0"/><text x="92" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="800" text-anchor="start">Best among convolutional spiking ResNets</text><text x="92" y="320" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Highest accuracy in its class, and it arrives with the</text><text x="92" y="342" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">lowest training memory, fastest training, and lowest</text><text x="92" y="364" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">inference energy.</text><rect x="92" y="392" width="504" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="405.0" r="5" fill="#34D3C0"/><text x="126" y="411.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">lowest training memory</text><rect x="92" y="424" width="504" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="437.0" r="5" fill="#34D3C0"/><text x="126" y="443.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">fastest training time</text><rect x="92" y="456" width="504" height="26" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="469.0" r="5" fill="#34D3C0"/><text x="126" y="475.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">lowest inference energy</text></g><g id="cue_s07_c3_compared_against_leading_spiking_tra"><title>compared against leading spiking transformer similar accuracy t-revsnn 8.6 times</title><rect x="656" y="252" width="560" height="226" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="656" y="252" width="6" height="226" rx="6" fill="#F2C14E"/><text x="684" y="290" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">vs a leading spiking Transformer</text><text x="684" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">at similar accuracy</text><rect x="684" y="330" width="166" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="767.0" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">8.6x</text><text x="767.0" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">less memory</text><rect x="866" y="330" width="166" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="949.0" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">2.0x</text><text x="949.0" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">faster training</text><rect x="1048" y="330" width="166" height="104" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1131.0" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F2C14E" font-weight="800" text-anchor="middle">1.6x</text><text x="1131.0" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">less energy</text></g><g id="cue_s07_c4_lighter_15_million_parameter_version"><title>lighter 15 million parameter version still reaches nearly 70 percent</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#4C9BE8"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">A lighter model</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A 15 million parameter version still reaches nearly 70 percent top-1</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">accuracy, at under 60 megabytes of memory per image.</text><rect x="940" y="506" width="126" height="88" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1003.0" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#4C9BE8" font-weight="800" text-anchor="middle">~70%</text><text x="1003.0" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">15M params</text><rect x="1082" y="506" width="126" height="88" rx="12" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="1145.0" y="562" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#34D3C0" font-weight="800" text-anchor="middle">&lt;60 MB</text><text x="1145.0" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">per image</text></g><text x="64" y="648" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Best accuracy, lowest memory, fastest training, lowest energy: all at the same time.</text></svg>