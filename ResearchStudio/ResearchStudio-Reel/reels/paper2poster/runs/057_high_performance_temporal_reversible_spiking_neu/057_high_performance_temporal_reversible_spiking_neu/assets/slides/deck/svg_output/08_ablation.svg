<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Each design choice earns its place</text><g id="cue_s08_c1_ablations_show_design_choice_earns"><title>ablations show design choice earns its place simply applying temporal</title><rect x="64" y="158" width="560" height="262" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="262" rx="6" fill="#34D3C0"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#34D3C0" font-weight="800" text-anchor="start">Temporal reversibility alone</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Adding temporal reversibility to a standard MS-ResNet-34,</text><text x="92" y="245" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">at a cost of only about 1.5 accuracy points:</text><text x="112" y="286" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">Training memory per image  ·  lower is better</text><rect x="300" y="300" width="236" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="300" width="236" height="24" rx="6" fill="#F2685C"/><text x="288" y="317.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">baseline</text><text x="546" y="317.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">267 MB</text><rect x="300" y="332" width="236" height="24" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="300" y="332" width="77" height="24" rx="6" fill="#34D3C0"/><text x="288" y="349.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">+ reversible</text><text x="387" y="349.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#34D3C0" font-weight="800" text-anchor="start">88 MB</text><text x="92" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#6E869C" font-weight="700" text-anchor="start">Epoch time:</text><text x="200" y="392" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#34D3C0" font-weight="800" text-anchor="start">11.2 min  -&gt;  7.4 min</text><text x="430" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">(-1.5 acc pts)</text></g><g id="cue_s08_c2_multi_level_temporal_fusion_between"><title>multi-level temporal fusion between stages worth roughly 1.2 points accuracy</title><rect x="64" y="436" width="560" height="114" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="436" width="6" height="114" rx="6" fill="#4C9BE8"/><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Multi-level temporal fusion</text><text x="92" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Fusing temporal information between stages is worth</text><text x="92" y="521" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">roughly 1.2 accuracy points on its own.</text><text x="544" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#4C9BE8" font-weight="800" text-anchor="end">+1.2</text><text x="544" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="end">pts</text></g><g id="cue_s08_c3_varying_number_timesteps_trades_accu"><title>varying number timesteps trades accuracy against cost scaled residual connection</title><rect x="656" y="158" width="560" height="192" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="192" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2C14E" font-weight="800" text-anchor="start">Scaled residual speeds convergence</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Varying the number of timesteps trades accuracy against</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">cost; the scaled residual reaches 60% accuracy in fewer</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">epochs.</text><text x="684" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">epochs to reach 60% accuracy  ·  fewer is better</text><rect x="830" y="300" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="830" y="300" width="300" height="20" rx="6" fill="#F2685C"/><text x="818" y="314.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">no scale</text><text x="1140" y="314.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="start">32 ep</text><rect x="830" y="326" width="300" height="20" rx="6" fill="#0E2334" stroke="#26455F" stroke-width="1"/><rect x="830" y="326" width="234" height="20" rx="6" fill="#F2C14E"/><text x="818" y="340.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">scaled res</text><text x="1074" y="340.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">25 ep</text></g><g id="cue_s08_c4_authors_also_confirm_temporal_spatia"><title>authors also confirm temporal spatial reversibility orthogonal stacked together</title><rect x="656" y="366" width="560" height="184" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="366" width="6" height="184" rx="6" fill="#48C78E"/><text x="684" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#48C78E" font-weight="800" text-anchor="start">Temporal and spatial are orthogonal</text><text x="684" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Temporal and spatial reversibility are independent and</text><text x="684" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">can be stacked together for even greater savings.</text><rect x="684" y="500" width="504" height="34" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="517.0" r="5" fill="#48C78E"/><text x="718" y="523.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">temporal + spatial reversibility  -&gt;  stackable</text></g></svg>