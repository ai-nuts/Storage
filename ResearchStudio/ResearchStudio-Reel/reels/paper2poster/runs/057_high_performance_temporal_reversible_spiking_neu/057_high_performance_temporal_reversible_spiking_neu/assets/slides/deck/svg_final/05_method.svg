<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Encode once, split by time, reverse the key links</text><g id="cue_s05_c1_how_works_practice_instead_feeding"><title>how works practice instead feeding same image network every timestep</title><rect x="64" y="158" width="568" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="200" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Encode once, one group per step</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of feeding the same image at every timestep,</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">T-RevSNN encodes it once and divides the features into T</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">groups, one per step.</text><rect x="92" y="300" width="72" height="48" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="128" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">image</text><text x="184" y="330.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="800" text-anchor="start">-&gt;</text><rect x="210" y="300" width="86" height="48" rx="8" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><text x="253" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#4C9BE8" font-weight="800" text-anchor="middle">encode</text><text x="306" y="330.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#9DB3C8" font-weight="800" text-anchor="start">-&gt;</text><rect x="338.0" y="300" width="61.0" height="48" rx="6" fill="#0E2334" stroke="#4C9BE8" stroke-width="1.5"/><text x="368.5" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#4C9BE8" font-weight="800" text-anchor="middle">t1</text><rect x="405.0" y="300" width="61.0" height="48" rx="6" fill="#0E2334" stroke="#34D3C0" stroke-width="1.5"/><text x="435.5" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#34D3C0" font-weight="800" text-anchor="middle">t2</text><rect x="472.0" y="300" width="61.0" height="48" rx="6" fill="#0E2334" stroke="#F2C14E" stroke-width="1.5"/><text x="502.5" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#F2C14E" font-weight="800" text-anchor="middle">t3</text><rect x="539.0" y="300" width="61.0" height="48" rx="6" fill="#0E2334" stroke="#48C78E" stroke-width="1.5"/><text x="569.5" y="329.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#48C78E" font-weight="800" text-anchor="middle">t4</text></g><g id="cue_s05_c2_whole_network_likewise_split_sub_net"><title>whole network likewise split sub-networks share parameters exchange temporal information</title><rect x="64" y="374" width="568" height="176" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="374" width="6" height="176" rx="6" fill="#34D3C0"/><text x="92" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Split into T sub-networks</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The network is split into T sub-networks that share</text><text x="92" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">parameters and exchange temporal information only at the</text><text x="92" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">key, turned-on neurons.</text><text x="92" y="528" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#34D3C0" font-weight="800" text-anchor="start">temporal info exchanged only at key neurons</text></g><g id="cue_s05_c3_those_key_connections_follow_multi_l"><title>those key connections follow multi-level temporal-reversible rule membrane potential one</title><rect x="656" y="158" width="560" height="200" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="200" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Multi-level temporal-reversible rule</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The membrane potential at one timestep can be exactly</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reconstructed from the next timestep's state and the</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">incoming spikes.</text><rect x="684" y="314" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="342.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">u[t] = h( u[t+1], s[t] )   (exact)</text></g><g id="cue_s05_c4_because_forward_pass_reversible_back"><title>because forward pass reversible backward pass only needs membrane potentials</title><rect x="656" y="374" width="560" height="176" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="656" y="374" width="6" height="176" rx="6" fill="#48C78E"/><text x="684" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Backward needs only the last step</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A reversible forward pass means the backward pass stores</text><text x="684" y="463" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">no intermediate activations, only the final-step</text><text x="684" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">potentials.</text><rect x="684" y="502" width="504" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="936.0" y="530.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">store u[T] only   -&gt;   O(L*T) -&gt; O(L)</text></g></svg>