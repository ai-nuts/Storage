<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Most temporal gradients barely matter</text><g id="cue_s03_c1_key_insight_behind_work_surprisingly"><title>key insight behind work surprisingly simple when authors examined gradients</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">A surprisingly simple observation</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Examining the gradients that flow backward through</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">time, the authors find that for most neurons those</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">temporal gradients barely matter.</text><text x="92" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#6E869C" font-weight="700" text-anchor="start">Temporal gradient magnitude per neuron</text><rect x="104" y="340" width="502" height="166" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><rect x="112" y="484" width="21" height="14" rx="2" fill="#26455F"/><rect x="139" y="487" width="21" height="11" rx="2" fill="#26455F"/><rect x="166" y="481" width="21" height="17" rx="2" fill="#26455F"/><rect x="193" y="489" width="21" height="9" rx="2" fill="#26455F"/><rect x="220" y="371" width="21" height="127" rx="2" fill="#34D3C0"/><rect x="247" y="486" width="21" height="12" rx="2" fill="#26455F"/><rect x="274" y="483" width="21" height="15" rx="2" fill="#26455F"/><rect x="301" y="490" width="21" height="8" rx="2" fill="#26455F"/><rect x="328" y="487" width="21" height="11" rx="2" fill="#26455F"/><rect x="355" y="484" width="21" height="14" rx="2" fill="#26455F"/><rect x="382" y="382" width="21" height="116" rx="2" fill="#34D3C0"/><rect x="409" y="489" width="21" height="9" rx="2" fill="#26455F"/><rect x="436" y="481" width="21" height="17" rx="2" fill="#26455F"/><rect x="463" y="486" width="21" height="12" rx="2" fill="#26455F"/><rect x="490" y="484" width="21" height="14" rx="2" fill="#26455F"/><rect x="517" y="392" width="21" height="106" rx="2" fill="#34D3C0"/><rect x="544" y="487" width="21" height="11" rx="2" fill="#26455F"/><rect x="571" y="483" width="21" height="15" rx="2" fill="#26455F"/><text x="112" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="start">neurons -&gt;</text><text x="92" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">Only a few positions carry real temporal signal.</text></g><g id="cue_s03_c2_only_neurons_few_key_positions"><title>only neurons few key positions carry temporal information actually important</title><rect x="648" y="158" width="568" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="116" rx="6" fill="#4C9BE8"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">So why pay the full temporal cost?</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">If only neurons at a few key positions carry important</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">temporal information, most neurons need not pay for it at</text><text x="676" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">all.</text></g><g id="cue_s03_c3_prior_methods_either_decouple_timest"><title>prior methods either decouple timestep save memory shrink number inference</title><rect x="648" y="286" width="568" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="286" width="6" height="120" rx="6" fill="#F2C14E"/><text x="676" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Prior methods each solve half</text><text x="676" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Decouple training from the timestep to save memory, or</text><text x="676" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">shrink inference steps to save energy, but not both.</text><text x="676" y="394" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">memory  OR  energy  (never both)</text></g><g id="cue_s03_c4_asks_whether_both_halves_solved"><title>asks whether both halves solved together</title><rect x="648" y="418" width="568" height="132" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="648" y="418" width="6" height="132" rx="6" fill="#48C78E"/><text x="676" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">This paper's question</text><text x="676" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Can both halves, training memory and inference energy, be</text><text x="676" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">solved together?</text><text x="676" y="534" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#48C78E" font-weight="800" text-anchor="start">memory  AND  energy  -&gt;  together</text></g></svg>