<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Static and neuromorphic vision, measured on real cost</text><g id="cue_s06_c1_method_evaluated_both_static_neuromo"><title>method evaluated both static neuromorphic vision static images they imagenet-1k</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">Static images: ImageNet-1K at 224 by 224 resolution, the main large-scale benchmark.</text></g><g id="cue_s06_c2_event_based_they_cifar10_dvs_dvs128"><title>event-based they cifar10-dvs dvs128 gesture dataset</title><rect x="64" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="6" height="150" rx="6" fill="#34D3C0"/><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#34D3C0" font-weight="800" text-anchor="start">Event-based / neuromorphic</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Spiking, event-driven vision datasets that stress temporal</text><text x="92" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">processing directly.</text><rect x="92" y="350" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="365.0" r="5" fill="#34D3C0"/><text x="126" y="371.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">CIFAR10-DVS   ·   DVS128 Gesture</text></g><g id="cue_s06_c3_crucially_they_report_not_just"><title>crucially they report not just accuracy but real cost measuring</title><rect x="656" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="240" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Not just accuracy: real cost</text><text x="684" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Peak GPU memory per image and per-epoch time, on six A100</text><text x="684" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">GPUs under mixed precision.</text><rect x="684" y="350" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="365.0" r="5" fill="#F2C14E"/><text x="718" y="371.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">6x NVIDIA A100   ·   mixed precision</text></g><g id="cue_s06_c4_they_compare_against_broad_set"><title>they compare against broad set baselines including spiking resnets spiking</title><rect x="64" y="410" width="1152" height="140" rx="14" fill="#2A2417" stroke="#F2C14E" stroke-width="1.5"/><rect x="64" y="410" width="6" height="140" rx="6" fill="#F2C14E"/><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Compared against a broad set of baselines</text><text x="92" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Spiking ResNets and spiking Transformers, plus training-optimization methods, so the memory and speed gains</text><text x="92" y="503" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">are measured against strong prior work.</text><text x="92" y="536" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#F2C14E" font-weight="800" text-anchor="start">OTTT   ·   SLTT   ·   spatially-reversible S-RevSNN</text></g></svg>