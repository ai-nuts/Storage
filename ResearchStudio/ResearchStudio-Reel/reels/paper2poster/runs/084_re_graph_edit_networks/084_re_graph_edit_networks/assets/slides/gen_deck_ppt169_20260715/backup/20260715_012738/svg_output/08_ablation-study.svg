<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="46" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="80" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">How robust are the results?</text>
    <text x="88" y="105" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">ABLATION STUDY · ROBUSTNESS</text>
  </g>

  <g id="checks">
    <title>cue_s08_c1_two_robustness_checks_swapping_ad_ho</title>
    <desc>two robustness checks swapping the ad-hoc initialisation for erdos-renyi and configuration-model generators barely changes any metric and adding a proper held-out test set lowers scores slightly</desc>
    <rect x="64" y="128" width="560" height="212" rx="12" fill="#EAF6EE" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="92" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2E7D32">Check 1 · Swap the graph initialisation</text>
    <text x="92" y="204" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Ad-hoc random init → Erdős–Rényi and</text>
    <text x="92" y="228" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">configuration-model generators.</text>
    <rect x="92" y="252" width="504" height="64" rx="8" fill="#FFFFFF"/>
    <text x="112" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">Barely moves any metric — within 0.05.</text>

    <rect x="656" y="128" width="560" height="212" rx="12" fill="#EAF6EE" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="684" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2E7D32">Check 2 · Proper held-out test set</text>
    <text x="684" y="204" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">100 unseen graphs, so the model is not</text>
    <text x="684" y="228" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">scored on transitions seen in training.</text>
    <rect x="684" y="252" width="504" height="64" rx="8" fill="#FFFFFF"/>
    <text x="704" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">Scores drop only slightly.</text>
  </g>

  <g id="diagnostic">
    <title>cue_s08_c2_but_deeper_diagnostic_finds_tree</title>
    <desc>but a deeper diagnostic finds the tree generators mostly produce unsimplifiable trees only thirteen percent of boolean and twenty-six percent of peano samples are usable undercutting those tasks</desc>
    <rect x="64" y="360" width="1152" height="266" rx="12" fill="#FBEBEB" stroke="#C62828" stroke-width="1.5"/>
    <text x="92" y="404" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#C62828">But a deeper diagnostic: the tree benchmarks are too easy</text>
    <text x="92" y="436" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">The generators overwhelmingly produce trees that cannot be simplified at all — so few samples truly test the model.</text>

    <g id="boolean-stat">
      <text x="92" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">Boolean Formulae</text>
      <rect x="92" y="502" width="440" height="34" rx="6" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
      <rect x="92" y="502" width="57" height="34" rx="6" fill="#C62828"/>
      <text x="548" y="527" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#C62828">13%</text>
      <text x="92" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6776">of samples are usable (simplifiable)</text>
    </g>
    <g id="peano-stat">
      <text x="684" y="486" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">Peano addition</text>
      <rect x="684" y="502" width="440" height="34" rx="6" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
      <rect x="684" y="502" width="114" height="34" rx="6" fill="#E8743B"/>
      <text x="1140" y="527" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#E8743B">26%</text>
      <text x="684" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5B6776">of samples are usable — undercuts perfect accuracy</text>
    </g>
  </g>

  <g id="footer">
    <text x="64" y="700" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">Source: [Re] Graph Edit Networks · §4 Robustness &amp; diagnostics</text>
    <text x="1216" y="700" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">08 / 09</text>
  </g>
</svg>
