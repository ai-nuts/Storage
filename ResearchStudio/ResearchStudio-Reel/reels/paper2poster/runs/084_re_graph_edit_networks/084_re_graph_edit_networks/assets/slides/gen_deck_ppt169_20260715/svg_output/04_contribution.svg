  <g id="contributions">
    <title>cue_s04_c1_reproduction_contributes_four_things</title>
    <desc>the reproduction contributes four things re-runs the model and baseline documents synthetic data generators adds cleaner train test setup shows benchmarks let the model win by memorising seen transitions</desc>

    <rect x="64" y="158" width="560" height="222" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="64" y="158" width="6" height="222" rx="3" fill="#3E7CB1"/>
    <text x="92" y="206" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3E7CB1">1</text>
    <text x="130" y="206" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#16324F">Re-run &amp; verify</text>
    <text x="92" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Re-implements the graph edit network</text>
    <text x="92" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">and its baseline, checking each of the</text>
    <text x="92" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">four experimental claims directly.</text>

    <rect x="656" y="158" width="560" height="222" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="656" y="158" width="6" height="222" rx="3" fill="#3E7CB1"/>
    <text x="684" y="206" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3E7CB1">2</text>
    <text x="722" y="206" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#16324F">Document the generators</text>
    <text x="684" y="248" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Provides the thorough description of</text>
    <text x="684" y="272" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">the synthetic data generators that the</text>
    <text x="684" y="296" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">original paper omitted.</text>

    <rect x="64" y="398" width="560" height="222" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="64" y="398" width="6" height="222" rx="3" fill="#3E7CB1"/>
    <text x="92" y="446" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#3E7CB1">3</text>
    <text x="130" y="446" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#16324F">Cleaner evaluation</text>
    <text x="92" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Adds a risk-estimation setup that</text>
    <text x="92" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">properly separates training and test</text>
    <text x="92" y="536" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">series, and repeats the experiments.</text>

    <rect x="656" y="398" width="560" height="222" rx="12" fill="#FBF0E9" stroke="#E8743B" stroke-width="1.5"/>
    <rect x="656" y="398" width="6" height="222" rx="3" fill="#E8743B"/>
    <text x="684" y="446" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#E8743B">4</text>
    <text x="722" y="446" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#16324F">Critical benchmark audit</text>
    <text x="684" y="488" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Shows several benchmarks let the</text>
    <text x="684" y="512" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">model win by memorising transitions</text>
    <text x="684" y="536" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">it has already seen.</text>
  </g>

