<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="56" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">The verdict is nuanced</text>
    <text x="88" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">TAKEAWAY</text>
  </g>

  <g id="holds">
    <title>cue_s09_c1_verdict_nuanced_graph_edit_networks</title>
    <desc>the verdict is nuanced graph edit networks are reproducible elegant and interpretable and most of the original claims hold</desc>
    <rect x="64" y="152" width="560" height="378" rx="12" fill="#EAF6EE" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="92" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2E7D32">What holds up</text>
    <g id="hp1"><polygon points="100,244 112,258 136,228 130,222 111,244 104,236" fill="#2E7D32"/><text x="152" y="252" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#16324F">Reproducible</text></g>
    <g id="hp2"><polygon points="100,300 112,314 136,284 130,278 111,300 104,292" fill="#2E7D32"/><text x="152" y="308" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#16324F">Elegant and interpretable</text></g>
    <g id="hp3"><polygon points="100,356 112,370 136,340 130,334 111,356 104,348" fill="#2E7D32"/><text x="152" y="364" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#16324F">Most original claims hold</text></g>
    <text x="92" y="440" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">An elegant, interpretable architecture</text>
    <text x="92" y="464" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">that stands up to independent testing.</text>
    <text x="92" y="502" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">The detailed write-up of the generators</text>
  </g>

  <g id="caveats">
    <title>cue_s09_c2_but_one_scaling_claim_wrong</title>
    <desc>but one scaling claim is wrong backward passes are super-linear and several benchmarks reward memorising seen transitions rather than genuine generalisation</desc>
    <rect x="656" y="152" width="560" height="378" rx="12" fill="#FBF0E9" stroke="#E8743B" stroke-width="1.5"/>
    <text x="684" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#E8743B">The caveats</text>
    <rect x="684" y="224" width="504" height="122" rx="10" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="704" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#C62828">One scaling claim is wrong</text>
    <text x="704" y="290" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Backward passes are super-linear,</text>
    <text x="704" y="314" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">not linear as reported.</text>
    <rect x="684" y="360" width="504" height="146" rx="10" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <text x="704" y="396" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#E8743B">Benchmarks reward memorising</text>
    <text x="704" y="426" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">Several let the model win by revisiting</text>
    <text x="704" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">transitions it already learned —</text>
    <text x="704" y="474" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1D2733">rather than genuinely generalising.</text>
  </g>

  <g id="closing">
    <rect x="64" y="556" width="1152" height="80" rx="12" fill="#16324F"/>
    <text x="92" y="592" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">The authors call for more rigorous, practical evaluation of an otherwise promising architecture —</text>
    <text x="92" y="618" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#CBD8E6">and their detailed documentation of the data generators is a lasting contribution in its own right.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">Source: [Re] Graph Edit Networks · Conclusion</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">09 / 09</text>
  </g>
</svg>
