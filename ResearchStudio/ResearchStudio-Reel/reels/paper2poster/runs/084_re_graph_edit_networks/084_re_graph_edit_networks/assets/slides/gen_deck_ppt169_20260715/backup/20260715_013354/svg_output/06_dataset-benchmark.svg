<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="56" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">Three families of benchmarks</text>
    <text x="88" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">DATASET / BENCHMARK</text>
  </g>

  <g id="families">
    <title>cue_s06_c1_benchmarks_span_three_families_dynam</title>
    <desc>benchmarks span three families dynamical graph systems tree systems and an arxiv citation network of twenty-seven thousand papers fifteen hundred sub-graphs up to nearly three thousand nodes</desc>

    <rect x="64" y="158" width="360" height="472" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="64" y="158" width="360" height="70" rx="12" fill="#3E7CB1"/>
    <rect x="64" y="196" width="360" height="32" fill="#3E7CB1"/>
    <text x="88" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Dynamical graphs</text>
    <text x="88" y="266" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">Small evolving graphs</text>
    <text x="88" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">• Edit Cycles</text>
    <text x="88" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">• Degree Rules</text>
    <text x="88" y="392" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">• Conway's Game</text>
    <text x="102" y="418" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">of Life process</text>

    <rect x="460" y="158" width="360" height="472" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="460" y="158" width="360" height="70" rx="12" fill="#2E7D32"/>
    <rect x="460" y="196" width="360" height="32" fill="#2E7D32"/>
    <text x="484" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Tree systems</text>
    <text x="484" y="266" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">Trees, richer one-hot attrs</text>
    <text x="484" y="316" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">• Boolean Formulae</text>
    <text x="498" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">simplification</text>
    <text x="484" y="380" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">• Peano addition</text>

    <rect x="856" y="158" width="360" height="472" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="856" y="158" width="360" height="70" rx="12" fill="#E8743B"/>
    <rect x="856" y="196" width="360" height="32" fill="#E8743B"/>
    <text x="880" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Scaling: citations</text>
    <text x="880" y="266" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">arXiv hep-th network</text>
    <text x="880" y="316" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#E8743B">≈ 27,000</text>
    <text x="880" y="342" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">papers</text>
    <text x="880" y="392" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#16324F">1,500</text>
    <text x="880" y="418" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">rolling-window sub-graphs</text>
    <text x="880" y="468" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">100 → ~3,000 nodes each</text>
  </g>

  <g id="note">
    <text x="88" y="600" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">The reproduction documents every generator in detail and counts how many distinct graphs each can actually produce.</text>
  </g>

