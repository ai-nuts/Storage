<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="56" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">An elegant idea, on shaky evidence</text>
    <text x="88" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">MOTIVATION · WHY REPRODUCE IT</text>
  </g>

  <g id="idea">
    <title>cue_s03_c1_graph_edit_networks_close_gap</title>
    <desc>graph edit networks close this gap by predicting an explicit human-readable edit script</desc>
    <rect x="64" y="150" width="560" height="486" rx="12" fill="#EAF0F6"/>
    <text x="92" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#16324F">Graph Edit Networks close the gap</text>
    <text x="92" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">Predict an explicit, human-readable</text>
    <text x="92" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">edit script that rewrites the graph.</text>
    <rect x="92" y="286" width="504" height="300" rx="10" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="1.5"/>
    <text x="116" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#8A94A1" letter-spacing="1">EDIT SCRIPT · Gₜ → Gₜ₊₁</text>
    <text x="116" y="366" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#2E7D32">insert node  v</text>
    <text x="116" y="404" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#C62828">delete edge  (a, b)</text>
    <text x="116" y="442" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#3E7CB1">replace lbl  u → w</text>
    <text x="116" y="480" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#3E7CB1">insert edge  (v, c)</text>
    <text x="116" y="540" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">Interpretable — you can read exactly</text>
    <text x="116" y="562" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">what the model changed.</text>
  </g>

  <g id="claims">
    <title>cue_s03_c2_original_work_claims_beats_every</title>
    <desc>the original work claims it beats every baseline reaches perfect accuracy on trees and scales to large graphs on briefly described benchmarks where reproduction adds value</desc>
    <rect x="656" y="150" width="560" height="486" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <text x="684" y="198" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#E8743B">The original paper's headline claims</text>

    <circle cx="700" cy="252" r="13" fill="#3E7CB1"/><text x="700" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">1</text>
    <text x="726" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">Beats every baseline on all tasks</text>

    <circle cx="700" cy="308" r="13" fill="#3E7CB1"/><text x="700" y="314" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">2</text>
    <text x="726" y="314" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">Perfect accuracy on tree problems</text>

    <circle cx="700" cy="364" r="13" fill="#3E7CB1"/><text x="700" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
    <text x="726" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">Scales to large real-world graphs</text>

    <rect x="684" y="410" width="504" height="196" rx="10" fill="#FBF0E9"/>
    <text x="708" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">But these rest on custom, only</text>
    <text x="708" y="476" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">briefly-described benchmarks.</text>
    <text x="708" y="522" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">Strong results on under-documented</text>
    <text x="708" y="546" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">setups are exactly where independent</text>
    <text x="708" y="570" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">reproduction adds the most value.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">Source: [Re] Graph Edit Networks · §1–§2</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">03 / 09</text>
  </g>
</svg>
