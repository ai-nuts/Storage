<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="56" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">Three claims hold — one does not</text>
    <text x="88" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">KEY RESULT · CLAIM AUDIT</text>
  </g>

  <g id="confirmed">
    <title>cue_s07_c1_three_four_original_claims_hold</title>
    <desc>three of the four original claims hold the model beats the variational-autoencoder baseline on every dynamical task reaches near-perfect accuracy on trees and forward pass grows sub-quadratically</desc>
    <rect x="64" y="158" width="688" height="472" rx="12" fill="#EAF6EE" stroke="#2E7D32" stroke-width="1.5"/>
    <text x="92" y="204" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#2E7D32">3 / 4 claims confirmed</text>

    <g id="row1">
      <polygon points="100,258 112,272 136,242 130,236 111,258 104,250" fill="#2E7D32"/>
      <text x="152" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#16324F">Beats the VAE baseline</text>
      <text x="152" y="284" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">on every dynamical graph task</text>
    </g>
    <g id="row2">
      <polygon points="100,344 112,358 136,328 130,322 111,344 104,336" fill="#2E7D32"/>
      <text x="152" y="344" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#16324F">Near-perfect accuracy</text>
      <text x="152" y="370" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">on the tree-structured tasks</text>
    </g>
    <g id="row3">
      <polygon points="100,430 112,444 136,414 130,408 111,430 104,422" fill="#2E7D32"/>
      <text x="152" y="430" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#16324F">Forward-pass runtime</text>
      <text x="152" y="456" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5B6776">grows sub-quadratically with size</text>
    </g>
    <text x="92" y="574" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">The core method reproduces cleanly across</text>
    <text x="92" y="598" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">accuracy and forward-pass scaling.</text>
  </g>

  <g id="failed">
    <title>cue_s07_c2_fourth_fails_backward_passes_claimed</title>
    <desc>the fourth claim fails backward passes were claimed to scale linearly but the fitted growth exponent is clearly above one super-linear</desc>
    <rect x="776" y="158" width="440" height="472" rx="12" fill="#FBEBEB" stroke="#C62828" stroke-width="1.5"/>
    <text x="804" y="204" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#C62828">Claim 4 fails ✗</text>
    <text x="804" y="244" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">Backward-pass scaling</text>
    <text x="804" y="272" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">Reported: approximately linear.</text>

    <rect x="804" y="292" width="384" height="176" rx="10" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1"/>
    <line x1="828" y1="446" x2="1164" y2="446" stroke="#8A94A1" stroke-width="1.5"/>
    <line x1="828" y1="446" x2="828" y2="312" stroke="#8A94A1" stroke-width="1.5"/>
    <line x1="828" y1="446" x2="1150" y2="356" stroke="#3E7CB1" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M828 446 Q1010 430 1150 320" fill="none" stroke="#C62828" stroke-width="3"/>
    <text x="1050" y="386" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#3E7CB1">linear (claimed)</text>
    <text x="900" y="336" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#C62828">fitted: exponent &gt; 1</text>

    <text x="804" y="502" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1D2733">Fitted exponent well above 1 for</text>
    <text x="804" y="526" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1D2733">every filtering scheme.</text>
    <text x="804" y="562" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C62828">Sub-quadratic, but clearly</text>
    <text x="804" y="586" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#C62828">super-linear — not linear.</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">Source: [Re] Graph Edit Networks · §4 Results</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">07 / 09</text>
