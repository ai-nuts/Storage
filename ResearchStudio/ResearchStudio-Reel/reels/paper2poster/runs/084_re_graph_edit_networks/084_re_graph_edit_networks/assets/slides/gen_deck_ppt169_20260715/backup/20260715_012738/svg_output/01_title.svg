<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A5C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F2238" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <g id="bg">
    <rect width="1280" height="720" fill="#0F2238"/>
    <rect width="1280" height="720" fill="url(#coverGlow)"/>
    <!-- decorative graph-edit motif (non-content) -->
    <g opacity="0.5">
      <line x1="960" y1="150" x2="1080" y2="120" stroke="#3E7CB1" stroke-width="2"/>
      <line x1="960" y1="150" x2="1030" y2="250" stroke="#3E7CB1" stroke-width="2"/>
      <line x1="1080" y1="120" x2="1160" y2="210" stroke="#3E7CB1" stroke-width="2"/>
      <line x1="1030" y1="250" x2="1160" y2="210" stroke="#E8743B" stroke-width="2" stroke-dasharray="5 5"/>
      <circle cx="960" cy="150" r="13" fill="#3E7CB1"/>
      <circle cx="1080" cy="120" r="13" fill="#3E7CB1"/>
      <circle cx="1030" cy="250" r="13" fill="#3E7CB1"/>
      <circle cx="1160" cy="210" r="13" fill="#E8743B"/>
    </g>
  </g>

  <g id="cover-title">
    <title>cue_s01_c1_reproducibility_study_graph_edit_net</title>
    <desc>reproducibility study graph edit networks graph neural network output layer interpretable edits</desc>
    <rect x="80" y="238" width="72" height="6" rx="3" fill="#E8743B"/>
    <text x="80" y="322" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF">[Re] Graph Edit Networks</text>
    <text x="80" y="372" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#CBD8E6">A reproducibility study of a graph-neural-network output layer</text>
    <text x="80" y="406" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#CBD8E6">that predicts graph change as a sequence of interpretable edits</text>
  </g>

  <g id="cover-audit">
    <title>cue_s01_c2_reproduction_re_implements_re_tests</title>
    <desc>reproduction re-implements the model and re-tests the paper four experimental claims</desc>
    <rect x="80" y="470" width="720" height="92" rx="10" fill="#16324F" stroke="#3E7CB1" stroke-width="1.5"/>
    <rect x="104" y="494" width="44" height="44" rx="8" fill="#E8743B"/>
    <text x="126" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">4</text>
    <text x="172" y="509" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Re-implements the model and re-tests all four</text>
    <text x="172" y="536" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">experimental claims of the original paper</text>
  </g>

  <g id="cover-meta">
    <text x="80" y="628" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#9FB2C6">Vid Stropnik · Maruša Oražem — University of Ljubljana</text>
    <text x="80" y="656" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#E8743B">ReScience C · 2022 · DOI 10.5281/zenodo.6574701</text>
  </g>

  <g id="cover-assets">
    <image href="../images/logo_ul.png" x="1040" y="72" width="168" height="63" preserveAspectRatio="xMidYMid meet"/>
    <rect x="1086" y="470" width="122" height="122" rx="8" fill="#FFFFFF"/>
    <image href="../images/qr_code.png" x="1094" y="478" width="106" height="106" preserveAspectRatio="xMidYMid meet"/>
    <text x="1147" y="608" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#9FB2C6">Code</text>
  </g>
</svg>
