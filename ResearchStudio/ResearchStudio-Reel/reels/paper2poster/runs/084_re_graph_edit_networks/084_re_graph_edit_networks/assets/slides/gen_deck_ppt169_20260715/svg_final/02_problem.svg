<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="56" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">Predicting how a graph evolves</text>
    <text x="88" y="115" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">PROBLEM · GRAPH TIME-SERIES PREDICTION</text>
  </g>

  <g id="task-statement">
    <title>cue_s02_c1_graph_time_series_prediction_asks_fo</title>
    <desc>graph time-series prediction asks a model to forecast the next graph in a sequence not just a label</desc>
    <rect x="64" y="150" width="1152" height="150" rx="12" fill="#EAF0F6"/>
    <text x="92" y="205" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#16324F">Forecast the next graph in a sequence — not just a label.</text>
    <text x="92" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">Given G₀, G₁, …, Gₜ, the model must predict the whole structure of Gₜ₊₁.</text>
    <!-- sequence-of-graphs glyph -->
    <g id="seq-glyph">
      <circle cx="812" cy="272" r="6" fill="#3E7CB1"/><circle cx="842" cy="256" r="6" fill="#3E7CB1"/><circle cx="836" cy="286" r="6" fill="#3E7CB1"/>
      <line x1="812" y1="272" x2="842" y2="256" stroke="#3E7CB1" stroke-width="2"/><line x1="812" y1="272" x2="836" y2="286" stroke="#3E7CB1" stroke-width="2"/>
      <text x="880" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8A94A1">→</text>
      <circle cx="932" cy="272" r="6" fill="#3E7CB1"/><circle cx="962" cy="256" r="6" fill="#3E7CB1"/><circle cx="956" cy="286" r="6" fill="#E8743B"/>
      <line x1="932" y1="272" x2="962" y2="256" stroke="#3E7CB1" stroke-width="2"/><line x1="932" y1="272" x2="956" y2="286" stroke="#E8743B" stroke-width="2"/><line x1="962" y1="256" x2="956" y2="286" stroke="#E8743B" stroke-width="2"/>
      <text x="1000" y="278" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8A94A1">→</text>
      <text x="1044" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#16324F">Gₜ₊₁ ?</text>
    </g>
  </g>

  <g id="gap">
    <title>cue_s02_c2_standard_graph_networks_emit_node</title>
    <desc>standard graph networks emit node or edge probabilities which cannot naturally express the structural operations that transform one graph into the next</desc>
    <rect x="64" y="336" width="560" height="300" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <text x="92" y="384" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#3E7CB1">Standard graph neural networks</text>
    <text x="92" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">Emit per-node and per-edge</text>
    <text x="92" y="446" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">probabilities or labels.</text>
    <rect x="92" y="478" width="504" height="52" rx="8" fill="#F4F7FA"/>
    <text x="112" y="510" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="17" fill="#5B6776">P(node), P(edge) …</text>
    <text x="92" y="580" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6776">A soft distribution, not an action.</text>

    <rect x="656" y="336" width="560" height="300" rx="12" fill="#FBEBEB" stroke="#C62828" stroke-width="1.5"/>
    <text x="684" y="384" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#C62828">The missing piece ✗</text>
    <text x="684" y="420" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">They cannot naturally express the</text>
    <text x="684" y="446" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">structural operations that transform</text>
    <text x="684" y="472" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1D2733">one graph into the next:</text>
    <text x="684" y="516" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">insert a node · delete an edge</text>
    <text x="684" y="544" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#16324F">relabel a vertex</text>
  </g>

  <g id="footer">
    <text x="64" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">Source: [Re] Graph Edit Networks · §1 Introduction</text>
    <text x="1216" y="694" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">02 / 09</text>
  </g>
</svg>
