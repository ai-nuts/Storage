<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <g id="bg">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <rect x="64" y="46" width="6" height="52" rx="3" fill="#E8743B"/>
    <text x="86" y="80" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#16324F">How a graph edit network works</text>
    <text x="88" y="105" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#8A94A1" letter-spacing="1">METHOD</text>
  </g>

  <g id="backbone">
    <title>cue_s05_c1_graph_edit_network_attaches_standard</title>
    <desc>a graph edit network attaches to a standard gnn backbone and predicts a script of edits insert delete or replace a node or insert or delete an edge</desc>
    <rect x="64" y="128" width="1152" height="146" rx="12" fill="#EAF0F6"/>
    <text x="92" y="168" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#16324F">Attach to a standard GNN backbone — then, instead of scoring nodes or edges, predict a script of edits:</text>
    <g id="edit-vocab">
      <rect x="92" y="196" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><text x="190" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">insert node</text>
      <rect x="304" y="196" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.5"/><text x="402" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#C62828">delete node</text>
      <rect x="516" y="196" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#3E7CB1" stroke-width="1.5"/><text x="614" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#3E7CB1">replace node</text>
      <rect x="728" y="196" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.5"/><text x="826" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#2E7D32">insert edge</text>
      <rect x="940" y="196" width="196" height="52" rx="8" fill="#FFFFFF" stroke="#C62828" stroke-width="1.5"/><text x="1038" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#C62828">delete edge</text>
    </g>
  </g>

  <g id="apply-pipeline">
    <title>cue_s05_c2_applying_them_sequence_maps_current</title>
    <desc>applying them in sequence maps the current graph to the next markovian assumption</desc>
    <rect x="64" y="292" width="1152" height="140" rx="12" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
    <rect x="104" y="322" width="150" height="80" rx="10" fill="#F4F7FA" stroke="#3E7CB1" stroke-width="1.5"/>
    <text x="179" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#16324F">Gₜ</text>
    <text x="179" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6776">current graph</text>
    <text x="284" y="368" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#8A94A1">→</text>
    <rect x="330" y="322" width="240" height="80" rx="10" fill="#EAF0F6"/>
    <text x="450" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#16324F">GNN + edit head</text>
    <text x="450" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6776">predict edit script</text>
    <text x="600" y="368" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#8A94A1">→</text>
    <rect x="646" y="322" width="260" height="80" rx="10" fill="#FBF0E9"/>
    <text x="776" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#E8743B">apply edits in sequence</text>
    <text x="776" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6776">Markovian: Gₜ ⟶ Gₜ₊₁</text>
    <text x="936" y="368" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#8A94A1">→</text>
    <rect x="982" y="322" width="150" height="80" rx="10" fill="#F4F7FA" stroke="#E8743B" stroke-width="1.5"/>
    <text x="1057" y="356" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#16324F">Gₜ₊₁</text>
    <text x="1057" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5B6776">next graph</text>
  </g>

  <g id="training">
    <title>cue_s05_c3_reference_mappings_graph_edit_distan</title>
    <desc>training uses reference mappings from graph-edit-distance approximators with two loss variants hinge and cross-entropy and edge-filtering for citation graphs</desc>
    <rect x="64" y="450" width="1152" height="176" rx="12" fill="#16324F"/>
    <text x="92" y="490" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Training signal: reference mappings between time-adjacent graphs</text>
    <text x="92" y="518" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#CBD8E6">from graph-edit-distance approximators — exact GED is NP-hard.</text>
    <rect x="92" y="540" width="336" height="66" rx="8" fill="#1B3A5C"/>
    <text x="112" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#E8743B">Two loss variants</text>
    <text x="112" y="590" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF">adapted hinge · adapted cross-entropy</text>
    <rect x="448" y="540" width="688" height="66" rx="8" fill="#1B3A5C"/>
    <text x="468" y="566" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#3E7CB1">Edge-filtering (large citation graphs)</text>
    <text x="468" y="590" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF">caps how many edge edits each node may propose</text>
  </g>

  <g id="footer">
    <text x="64" y="700" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">Source: [Re] Graph Edit Networks · §2 Method</text>
    <text x="1216" y="700" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A94A1">05 / 09</text>
  </g>
</svg>
