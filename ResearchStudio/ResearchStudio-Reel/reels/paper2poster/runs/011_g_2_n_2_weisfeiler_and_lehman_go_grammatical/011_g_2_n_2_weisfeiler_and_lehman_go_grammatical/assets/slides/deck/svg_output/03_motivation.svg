<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A bridge from combinatorics to algebra</text><g id="cue_s03_c1_seed_idea_comes_groundbreaking_obser"><title>seed idea comes groundbreaking observation 1 w-l 3 w-l tests</title><rect x="64" y="158" width="560" height="214" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="214" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#3E9BFF" font-weight="800" text-anchor="start">WL tests are MATLANG fragments</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A groundbreaking observation: the 1-W-L and 3-W-L tests can</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">each be rewritten as a fragment of a matrix language called</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">MATLANG.</text><rect x="92" y="286" width="504" height="74" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><rect x="116" y="308.0" width="151" height="34" rx="7" fill="#173453" stroke="#33D6C0" stroke-width="1.4"/><text x="191.5" y="330.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#33D6C0" font-weight="800" text-anchor="middle">1-WL</text><rect x="421" y="308.0" width="151" height="34" rx="7" fill="#173453" stroke="#33D6C0" stroke-width="1.4"/><text x="496.5" y="330.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#33D6C0" font-weight="800" text-anchor="middle">ML(L1)</text><line x1="275" y1="325.0" x2="413" y2="325.0" stroke="#33D6C0" stroke-width="1.6" stroke-linecap="round"/><polygon points="275,325.0 283,321.0 283,329.0" fill="#33D6C0"/><polygon points="413,325.0 405,321.0 405,329.0" fill="#33D6C0"/><text x="344.0" y="317.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">same value</text><rect x="116" y="325.0" width="151" height="34" rx="7" fill="#173453" stroke="#3E9BFF" stroke-width="1.4"/><text x="191.5" y="347.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#3E9BFF" font-weight="800" text-anchor="middle">3-WL</text><rect x="421" y="325.0" width="151" height="34" rx="7" fill="#173453" stroke="#3E9BFF" stroke-width="1.4"/><text x="496.5" y="347.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#3E9BFF" font-weight="800" text-anchor="middle">ML(L3)</text><line x1="275" y1="342.0" x2="413" y2="342.0" stroke="#3E9BFF" stroke-width="1.6" stroke-linecap="round"/><polygon points="275,342.0 283,338.0 283,346.0" fill="#3E9BFF"/><polygon points="413,342.0 405,338.0 405,346.0" fill="#3E9BFF"/><text x="344.0" y="334.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">same value</text></g><g id="cue_s03_c2_two_graphs_look_same_3"><title>two graphs look same 3 w-l only every sentence you</title><rect x="64" y="388" width="560" height="162" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="388" width="6" height="162" rx="6" fill="#33D6C0"/><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="800" text-anchor="start">Equal on every sentence</text><text x="92" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Two graphs look the same to 3-W-L exactly when every</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sentence of the fragment ML-of-L-three gives them the same</text><text x="92" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">value: a beautiful bridge between combinatorics and</text><text x="92" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">algebra. But a bridge is not a road.</text></g><g id="cue_s03_c3_turning_one_these_fragments_actual"><title>turning one these fragments actual trainable network had been done</title><rect x="648" y="158" width="568" height="214" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="648" y="158" width="6" height="214" rx="6" fill="#F4C24C"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">Built only case by case</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Turning one of these fragments into an actual, trainable</text><text x="676" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">network had been done only case by case, and the resulting</text><text x="676" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">models could not claim the full 3-W-L guarantee.</text><rect x="676" y="320" width="512" height="38" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="932.0" y="345.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F4C24C" font-weight="800" text-anchor="middle">hand-built fragment  =&gt;  no full 3-WL claim</text></g><g id="cue_s03_c4_motivation_pave_road_once_all"><title>motivation pave road once all</title><rect x="648" y="388" width="568" height="162" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="648" y="388" width="6" height="162" rx="6" fill="#46C98B"/><text x="676" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Goal: pave the road once</text><text x="676" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">The motivation is to replace the case-by-case craft with one</text><text x="676" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">general procedure that turns an expressive fragment into a</text><text x="676" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">matching network, once and for all.</text><text x="676" y="532" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#46C98B" font-weight="800" text-anchor="start">one procedure  -&gt;  every fragment</text></g></svg>