<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Expressiveness by construction</text><g id="cue_s10_c1_lasting_message_change_workflow"><title>lasting message change workflow</title><rect x="64" y="166" width="1152" height="74" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="166" width="6" height="74" rx="6" fill="#3E9BFF"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">The lasting message is a change of workflow</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">stop proving expressiveness after the fact - build it in from the start</text></g><g id="cue_s10_c2_instead_designing_graph_network_hopi"><title>instead designing graph network hoping prove expressive you start language</title><rect x="64" y="264" width="368" height="278" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="264" width="368" height="6" rx="6" fill="#33D6C0"/><circle cx="98" cy="316" r="11" fill="#33D6C0"/><text x="92" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">Read the network off the</text><text x="92" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">grammar</text><text x="92" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Start from a language whose</text><text x="92" y="443" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">expressive power you already know,</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reduce it to a clean grammar, and</text><text x="92" y="485" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">read the network's inputs and</text><text x="92" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">layers straight off the surviving</text><text x="92" y="527" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rules.</text></g><g id="cue_s10_c3_g2n2_concrete_payoff_idea_provably"><title>g2n2 concrete payoff idea provably 3 w-l faster more accurate</title><rect x="456" y="264" width="368" height="278" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="264" width="368" height="6" rx="6" fill="#46C98B"/><circle cx="490" cy="316" r="11" fill="#46C98B"/><text x="484" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">G2N2 is the payoff</text><text x="484" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">G2N2 is the concrete result: a</text><text x="484" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">provably 3-W-L model that is also</text><text x="484" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">faster and more accurate than its</text><text x="484" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">predecessors.</text></g><g id="cue_s10_c4_because_framework_generic_same_gramm"><title>because framework generic same grammatical route could turn other algebraic</title><rect x="848" y="264" width="368" height="278" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="264" width="368" height="6" rx="6" fill="#F4C24C"/><circle cx="882" cy="316" r="11" fill="#F4C24C"/><text x="876" y="360" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF2FB" font-weight="800" text-anchor="start">A generic route</text><text x="876" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Because the framework is generic,</text><text x="876" y="419" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">the same grammatical route could</text><text x="876" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">turn other algebraic fragments</text><text x="876" y="461" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">into other networks, each carrying</text><text x="876" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">its expressive power by design.</text></g><line x1="64" y1="560" x2="1216" y2="560" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><rect x="85.5" y="608.0" width="35" height="16" rx="8" fill="#173453" stroke="#3E9BFF" stroke-width="1.6"/><text x="103.0" y="621.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="5.28" fill="#3E9BFF" font-weight="800" text-anchor="middle">ML(L3)</text><rect x="132.5" y="608.0" width="35" height="16" rx="8" fill="#173453" stroke="#F4C24C" stroke-width="1.6"/><text x="150.0" y="621.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="5.28" fill="#F4C24C" font-weight="800" text-anchor="middle">grammar</text><rect x="179.5" y="608.0" width="35" height="16" rx="8" fill="#173453" stroke="#46C98B" stroke-width="1.6"/><text x="197.0" y="621.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="5.28" fill="#46C98B" font-weight="800" text-anchor="middle">G2N2</text><line x1="123.5" y1="616" x2="129.5" y2="616" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><polygon points="129.5,616 116.3569220667674,619.3559787702294 116.3569220667674,612.6440212297706" fill="#2A4D6E"/><line x1="170.5" y1="616" x2="176.5" y2="616" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><polygon points="176.5,616 163.3569220667674,619.3559787702294 163.3569220667674,612.6440212297706" fill="#2A4D6E"/><text x="150" y="596.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="4.62" fill="#9DB3C8" font-weight="700" text-anchor="middle">expressive language</text><text x="150" y="642.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="4.62" fill="#9DB3C8" font-weight="700" text-anchor="middle">provably 3-WL network</text><text x="1216" y="620" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">G2N2  ·  Weisfeiler and Lehman Go Grammatical  ·  ICLR 2024</text></svg>