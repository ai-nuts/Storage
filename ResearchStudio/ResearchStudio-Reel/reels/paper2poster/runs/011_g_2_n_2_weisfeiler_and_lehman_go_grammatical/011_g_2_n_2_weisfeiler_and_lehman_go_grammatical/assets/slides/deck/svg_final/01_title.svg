<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="800" text-anchor="start" letter-spacing="2">ICLR 2024</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">Provable Expressiveness  ·  Grammar-Built GNN</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><text x="64" y="152" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="46" fill="#FFFFFF" font-weight="800" text-anchor="start">G2N2</text><text x="210" y="152" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#3E9BFF" font-weight="800" text-anchor="start">Grammatical Graph Neural Network</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#33D6C0" font-weight="800" text-anchor="start">Weisfeiler and Lehman Go Grammatical</text><rect x="882.0" y="149.0" width="80" height="38" rx="8" fill="#173453" stroke="#3E9BFF" stroke-width="1.6"/><text x="922.0" y="173.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" fill="#3E9BFF" font-weight="800" text-anchor="middle">ML(L3)</text><rect x="990.0" y="149.0" width="80" height="38" rx="8" fill="#173453" stroke="#F4C24C" stroke-width="1.6"/><text x="1030.0" y="173.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" fill="#F4C24C" font-weight="800" text-anchor="middle">grammar</text><rect x="1098.0" y="149.0" width="80" height="38" rx="8" fill="#173453" stroke="#46C98B" stroke-width="1.6"/><text x="1138.0" y="173.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" fill="#46C98B" font-weight="800" text-anchor="middle">G2N2</text><line x1="965.0" y1="168" x2="987.0" y2="168" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><polygon points="987.0,168 973.8569220667674,171.35597877022943 973.8569220667674,164.64402122977057" fill="#2A4D6E"/><line x1="1073.0" y1="168" x2="1095.0" y2="168" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><polygon points="1095.0,168 1081.8569220667673,171.35597877022943 1081.8569220667673,164.64402122977057" fill="#2A4D6E"/><text x="1030" y="137.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">expressive language</text><text x="1030" y="205.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">provably 3-WL network</text><text x="64" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="500" text-anchor="start">J. Piquenot · A. Moscatelli · M. Berar · P. Heroux · J.-Y. Ramel · R. Raveaux · S. Adam</text><text x="64" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">LITIS Lab, University of Rouen Normandy   ·   LIFAT Lab, University of Tours</text><g id="cue_s01_c1_g2n2_presented_iclr_2024_asks"><title>g2n2 presented iclr 2024 asks deceptively simple question design graph</title><rect x="64" y="298" width="273" height="232" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="298" width="273" height="6" rx="6" fill="#3E9BFF"/><circle cx="92" cy="340" r="7" fill="#3E9BFF"/><text x="108" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">A question of</text><text x="108" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">expressiveness</text><text x="88" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Can we design a graph neural</text><text x="88" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">network whose expressive power</text><text x="88" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">is guaranteed by construction,</text><text x="88" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">rather than proved after the</text><text x="88" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">fact?</text></g><g id="cue_s01_c2_authors_give_recipe"><title>authors give recipe</title><rect x="357" y="298" width="273" height="232" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="357" y="298" width="273" height="6" rx="6" fill="#33D6C0"/><circle cx="385" cy="340" r="7" fill="#33D6C0"/><text x="401" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">The answer is a recipe</text><text x="381" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Instead of a one-off,</text><text x="381" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">hand-crafted proof, the authors</text><text x="381" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">give a single repeatable recipe.</text></g><g id="cue_s01_c3_they_take_fragment_algebraic_matrix"><title>they take fragment algebraic matrix language known match third-order weisfeiler-lehman</title><rect x="650" y="298" width="273" height="232" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="650" y="298" width="273" height="6" rx="6" fill="#F4C24C"/><circle cx="678" cy="340" r="7" fill="#F4C24C"/><text x="694" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Grammar becomes layers</text><text x="674" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">Take a matrix-language fragment</text><text x="674" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">matched to 3-W-L, write it as a</text><text x="674" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">context-free grammar, prune it</text><text x="674" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">to essential rules, and</text><text x="674" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">translate those rules into</text><text x="674" y="493" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">network layers.</text></g><g id="cue_s01_c4_result_provably_three_w_l_graph_neur"><title>result provably three-w-l graph neural network both principled practice faster</title><rect x="943" y="298" width="273" height="232" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="943" y="298" width="273" height="6" rx="6" fill="#46C98B"/><circle cx="971" cy="340" r="7" fill="#46C98B"/><text x="987" y="346" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">Provably 3-WL, and</text><text x="987" y="367" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="800" text-anchor="start">faster</text><text x="967" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">The result is a provably</text><text x="967" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">three-W-L graph neural network</text><text x="967" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">that is, in practice, both</text><text x="967" y="455" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">faster and more accurate than</text><text x="967" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">its competitors.</text></g><line x1="64" y1="552" x2="1216" y2="552" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><text x="64" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="700" text-anchor="start">arXiv:2303.01590</text><text x="316" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/JPiquenot/Wesfeiler-and-Lehman-go-grammatical</text><text x="1216" y="588" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Expressiveness guaranteed by construction.</text></svg>