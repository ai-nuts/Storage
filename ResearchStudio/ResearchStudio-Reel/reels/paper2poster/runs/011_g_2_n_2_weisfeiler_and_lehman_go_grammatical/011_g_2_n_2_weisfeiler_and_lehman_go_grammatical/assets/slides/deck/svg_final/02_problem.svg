<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Expressiveness proved after the fact</text><g id="cue_s02_c1_how_expressive_graph_neural_network"><title>how expressive graph neural network years field answered weisfeiler-lehman hierarchy</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#3E9BFF"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">The Weisfeiler-Lehman yardstick</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">For years the field has measured a graph</text><text x="92" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">network's power on the Weisfeiler-Lehman</text><text x="92" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">hierarchy. The gold standard: design a</text><text x="92" y="301" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">model, then prove it matches, say, the</text><text x="92" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">third-order test.</text><rect x="92" y="368" width="344" height="130" rx="10" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="112" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">the usual workflow</text><rect x="112" y="414" width="304" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="264.0" y="440.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#3E9BFF" font-weight="800" text-anchor="middle">design model  -&gt;  then prove k-WL</text><text x="112" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">the proof trails the design</text></g><g id="cue_s02_c2_but_proof_comes_after_design"><title>but proof comes after design almost afterthought</title><rect x="500" y="158" width="716" height="110" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="500" y="158" width="6" height="110" rx="6" fill="#F4C24C"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F4C24C" font-weight="800" text-anchor="start">The proof is an afterthought</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">Expressiveness is established after the design, almost as an afterthought,</text><text x="528" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="400" text-anchor="start">never as the thing that drives the architecture.</text></g><g id="cue_s02_c3_what_been_missing_systematic_way"><title>what been missing systematic way other direction start language already</title><rect x="500" y="284" width="716" height="158" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="500" y="284" width="6" height="158" rx="6" fill="#33D6C0"/><text x="528" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Missing: the reverse direction</text><text x="528" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">What has been missing is a systematic way to go the other way:</text><text x="528" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">start from a language we already know is exactly as powerful as</text><text x="528" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">3-W-L, and mechanically build a network that inherits that</text><text x="528" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">power.</text><rect x="528" y="404" width="660" height="30" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="858.0" y="425.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#33D6C0" font-weight="800" text-anchor="middle">language known = 3-WL   =&gt;   build the network</text></g><g id="cue_s02_c4_without_such_recipe_every_expressive"><title>without such recipe every expressive architecture fresh hand-crafted proof</title><rect x="500" y="458" width="716" height="92" rx="14" fill="#3A2020" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="458" width="6" height="92" rx="6" fill="#F2685C"/><text x="528" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Otherwise: reinvent the proof each time</text><text x="528" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Without such a recipe, every expressive architecture is a fresh, hand-crafted proof.</text></g></svg>