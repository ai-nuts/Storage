<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One framework, one network</text><g id="cue_s04_c1_makes_four_contributions_first_gener"><title>makes four contributions first generic framework turns any fragment algebraic</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#3E9BFF"/><circle cx="114" cy="246" r="26" fill="none" stroke="#3E9BFF" stroke-width="2.5"/><text x="114" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#3E9BFF" font-weight="800" text-anchor="middle">1</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Generic framework</text><text x="88" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A generic procedure that</text><text x="88" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">turns any fragment of an</text><text x="88" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">algebraic language into a</text><text x="88" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">graph neural network through</text><text x="88" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">context-free grammars.</text></g><g id="cue_s04_c2_second_runs_framework_ml_of_l_three"><title>second runs framework ml-of-l-three fragment out comes g2n2 network provably</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#33D6C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#33D6C0" stroke-width="2.5"/><text x="410" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#33D6C0" font-weight="800" text-anchor="middle">2</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">G2N2</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Run the framework on the</text><text x="384" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">ML-of-L-three fragment and</text><text x="384" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">out comes G2N2, a network</text><text x="384" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">that is provably 3-W-L.</text></g><g id="cue_s04_c3_third_validates_rule_set_experimenta"><title>third validates rule set experimentally showing grammar reduction keeps expressiveness</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#F4C24C"/><circle cx="706" cy="246" r="26" fill="none" stroke="#F4C24C" stroke-width="2.5"/><text x="706" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F4C24C" font-weight="800" text-anchor="middle">3</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Rule set validated</text><text x="680" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Experiments confirm the</text><text x="680" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">grammar reduction keeps</text><text x="680" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">expressiveness while trimming</text><text x="680" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">redundant rules.</text></g><g id="cue_s04_c4_fourth_across_broad_battery_downstre"><title>fourth across broad battery downstream tasks g2n2 beats existing 3</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#46C98B"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#46C98B" stroke-width="2.5"/><text x="1002" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#46C98B" font-weight="800" text-anchor="middle">4</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Beats prior 3-WL</text><text x="976" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Across a broad battery of</text><text x="976" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">downstream tasks, G2N2 beats</text><text x="976" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">existing 3-W-L networks,</text><text x="976" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">often while running faster.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="700" text-anchor="start">From an expressive language to a provably expressive network - by construction.</text></svg>