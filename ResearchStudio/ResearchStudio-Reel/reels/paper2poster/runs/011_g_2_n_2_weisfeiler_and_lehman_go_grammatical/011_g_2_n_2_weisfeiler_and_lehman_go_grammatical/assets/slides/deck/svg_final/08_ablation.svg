<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Grammar reduction keeps the power</text><g id="cue_s08_c1_most_instructive_experiment_grammar"><title>most instructive experiment grammar-reduction ablation authors compare full grammar intermediate</title><rect x="64" y="158" width="560" height="214" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="214" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#3E9BFF" font-weight="800" text-anchor="start">Compare full, intermediate, reduced</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">The key experiment compares the full grammar, an</text><text x="92" y="243" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">intermediate one, and the reduced grammar r-G-of-L-three</text><text x="92" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">on the QM9 R-squared target.</text><rect x="340" y="280" width="264" height="84" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><line x1="370" y1="334" x2="588" y2="334" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><rect x="380.9" y="326.8" width="32.699999999999996" height="7.199999999999999" rx="4" fill="#33D6C0"/><text x="397.25" y="349" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">G(L3)</text><rect x="435.4" y="326.8" width="32.699999999999996" height="7.199999999999999" rx="4" fill="#33D6C0"/><text x="451.75" y="349" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">interm.</text><rect x="489.9" y="326.56" width="32.699999999999996" height="7.4399999999999995" rx="4" fill="#46C98B"/><text x="506.25" y="349" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">r-G(L3)</text><rect x="544.4" y="313.36" width="32.699999999999996" height="20.64" rx="4" fill="#F2685C"/><text x="560.75" y="349" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">over-red.</text><text x="368" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#6E869C" font-weight="600" text-anchor="start">QM9 R2 error (lower better)</text><text x="451.75" y="318.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#46C98B" font-weight="800" text-anchor="middle">same error</text></g><g id="cue_s08_c2_their_errors_essentially_same_which"><title>their errors essentially same which confirms reduction throws away redundancy</title><rect x="64" y="388" width="560" height="162" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="388" width="6" height="162" rx="6" fill="#46C98B"/><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#46C98B" font-weight="800" text-anchor="start">Same error =&gt; only redundancy removed</text><text x="92" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Their errors are essentially the same, which confirms that</text><text x="92" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">the reduction throws away redundancy without ever touching</text><text x="92" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">expressive power.</text></g><g id="cue_s08_c3_but_when_you_push_past"><title>but when you push past reduced grammar start deleting essential</title><rect x="656" y="158" width="560" height="214" rx="14" fill="#3A2020" stroke="#F2685C" stroke-width="1.5"/><rect x="656" y="158" width="6" height="214" rx="6" fill="#F2685C"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F2685C" font-weight="800" text-anchor="start">Delete essentials =&gt; it degrades</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">But push past the reduced grammar and start deleting</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">essential rules, and performance degrades in a clear,</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">measurable way.</text><rect x="684" y="312" width="504" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="936.0" y="338.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#F2685C" font-weight="800" text-anchor="middle">remove essential rule  -&gt;  error rises</text></g><g id="cue_s08_c4_degradation_actually_useful_informat"><title>degradation actually useful information tells you how much operation contributes</title><rect x="656" y="388" width="560" height="162" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="656" y="388" width="6" height="162" rx="6" fill="#9C86F0"/><text x="684" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9C86F0" font-weight="800" text-anchor="start">Degradation is useful signal</text><text x="684" y="452" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">That degradation is information: it shows how much each</text><text x="684" y="472" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">operation contributes, so you can prune the model</text><text x="684" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">deliberately when a task does not demand full 3-W-L</text><text x="684" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">strength.</text></g></svg>