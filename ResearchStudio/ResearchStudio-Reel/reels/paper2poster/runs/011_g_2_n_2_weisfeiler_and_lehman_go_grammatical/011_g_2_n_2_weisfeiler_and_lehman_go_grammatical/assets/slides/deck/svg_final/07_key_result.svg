<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Dominates in practice</text><g id="cue_s07_c1_headline_result_g2n2_does_not"><title>headline result g2n2 does not just match theory dominates practice</title><rect x="64" y="158" width="1152" height="150" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#46C98B"/><text x="92" y="194" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#46C98B" font-weight="800" text-anchor="start">Best QM9 error on every target - and faster than PPGN</text><rect x="92" y="210" width="640" height="82" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="112" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">G2N2 does not just match the theory. Learning QM9 targets one at a time,</text><text x="112" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">it posts the best error on every single target while training faster</text><text x="112" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">than PPGN.</text><rect x="760" y="210" width="214" height="82" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="867.0" y="252.64" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.880000000000003" fill="#46C98B" font-weight="800" text-anchor="middle">12 / 12</text><text x="867.0" y="275.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">best QM9 targets</text><rect x="994" y="210" width="222" height="82" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="1105.0" y="252.64" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="27.880000000000003" fill="#3E9BFF" font-weight="800" text-anchor="middle">faster</text><text x="1105.0" y="275.6" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">than PPGN / epoch</text></g><g id="cue_s07_c2_notoriously_hard_r_squared_target_it"><title>notoriously hard r-squared target its error drops zero-point-three-four-two where ppgn</title><rect x="64" y="324" width="368" height="226" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="324" width="6" height="226" rx="6" fill="#3E9BFF"/><text x="92" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#3E9BFF" font-weight="800" text-anchor="start">The hardest target: R-squared</text><text x="92" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Error drops to 0.342 where PPGN sits at 3.78</text><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">- a ten-fold-plus improvement; the gap</text><text x="92" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">widens further when all twelve targets are</text><text x="92" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">learned at once.</text><rect x="92" y="452" width="312" height="90" rx="10" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><rect x="142.0" y="512" width="76" height="6" rx="5" fill="#46C98B"/><text x="180.0" y="504" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#46C98B" font-weight="800" text-anchor="middle">0.342</text><text x="180.0" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">G2N2</text><rect x="278.0" y="486.0" width="76" height="32.0" rx="5" fill="#9DB3C8"/><text x="316.0" y="478.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="800" text-anchor="middle">3.780</text><text x="316.0" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#9DB3C8" font-weight="700" text-anchor="middle">PPGN</text><rect x="196.0" y="460" width="104" height="20" rx="7" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.1"/><text x="248.0" y="474" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#46C98B" font-weight="800" text-anchor="middle">~11x lower MAE</text></g><g id="cue_s07_c3_graph_classification_beats_second_be"><title>graph classification beats second-best network five six tud datasets</title><rect x="456" y="324" width="368" height="226" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="456" y="324" width="6" height="226" rx="6" fill="#F4C24C"/><text x="484" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#F4C24C" font-weight="800" text-anchor="start">Graph classification</text><text x="484" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="400" text-anchor="start">On the TUD suite, G2N2 beats the second-best</text><text x="484" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF2FB" font-weight="400" text-anchor="start">network on five of the six datasets.</text><rect x="484" y="444" width="150" height="90" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="559.0" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#F4C24C" font-weight="800" text-anchor="middle">5 / 6</text><text x="559.0" y="516.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">TUD datasets</text><rect x="646" y="444" width="150" height="90" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="721.0" y="490.8" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#33D6C0" font-weight="800" text-anchor="middle">92.5%</text><text x="721.0" y="516.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">MUTAG accuracy</text></g><g id="cue_s07_c4_spectral_test_cleanly_learns_band_pa"><title>spectral test cleanly learns band-pass filters where ppgn starved memory</title><rect x="848" y="324" width="368" height="226" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="324" width="6" height="226" rx="6" fill="#46C98B"/><text x="876" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#46C98B" font-weight="800" text-anchor="start">Spectral band-pass</text><text x="876" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It cleanly learns band-pass filters where</text><text x="876" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">PPGN, starved of 