<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">From operations to grammar to layers</text><g id="cue_s05_c1_recipe_three_moves_start_operation"><title>recipe three moves start operation set l-three matrix product transpose</title><rect x="64" y="158" width="1152" height="150" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="150" rx="6" fill="#3E9BFF"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Move 1: pick the operations, write the grammar</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Start from the operation set L-three, then write an exhaustive</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">grammar whose sentences are exactly the fragment ML-of-L-three.</text><rect x="92.0" y="262" width="132.0" height="30" rx="7" fill="#173453" stroke="#3E9BFF" stroke-width="1.3"/><circle cx="105.0" cy="277" r="4" fill="#3E9BFF"/><text x="164.0" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">MatMul</text><rect x="234.0" y="262" width="132.0" height="30" rx="7" fill="#173453" stroke="#33D6C0" stroke-width="1.3"/><circle cx="247.0" cy="277" r="4" fill="#33D6C0"/><text x="306.0" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">Transpose</text><rect x="376.0" y="262" width="132.0" height="30" rx="7" fill="#173453" stroke="#F4C24C" stroke-width="1.3"/><circle cx="389.0" cy="277" r="4" fill="#F4C24C"/><text x="448.0" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">All-ones</text><rect x="518.0" y="262" width="132.0" height="30" rx="7" fill="#173453" stroke="#9C86F0" stroke-width="1.3"/><circle cx="531.0" cy="277" r="4" fill="#9C86F0"/><text x="590.0" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">Diagonal</text><rect x="660.0" y="262" width="132.0" height="30" rx="7" fill="#173453" stroke="#46C98B" stroke-width="1.3"/><circle cx="673.0" cy="277" r="4" fill="#46C98B"/><text x="732.0" y="281" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">Hadamard</text><text x="812" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#3E9BFF" font-weight="800" text-anchor="start">exhaustive grammar</text><rect x="812" y="278" width="404" height="26" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="1014.0" y="297.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#3E9BFF" font-weight="800" text-anchor="middle">sentences  =  ML(L3)</text></g><g id="cue_s05_c2_reduce_grammar_stripping_away_redund"><title>reduce grammar stripping away redundant rules variables until only essential</title><rect x="64" y="322" width="560" height="228" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="322" width="6" height="228" rx="6" fill="#33D6C0"/><text x="92" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="800" text-anchor="start">Move 2: reduce, then read off the net</text><text x="92" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Strip away redundant rules and variables until only the</text><text x="92" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">essential productions remain - proving each step keeps the</text><text x="92" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">3-W-L guarantee. The surviving variables become the network</text><text x="92" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">inputs; each surviving rule becomes a piece of a layer.</text><rect x="92" y="478" width="504" height="64" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><text x="180.5" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">G(L3) exhaustive</text><rect x="110" y="500" width="141" height="24" rx="6" fill="#122A42" stroke="#3E9BFF" stroke-width="1.0"/><rect x="118" y="506.0" width="125" height="3.5" rx="2" fill="#3E9BFF"/><rect x="118" y="509.5" width="125" height="3.5" rx="2" fill="#3E9BFF"/><rect x="118" y="513.0" width="125" height="3.5" rx="2" fill="#3E9BFF"/><rect x="118" y="516.5" width="125" height="3.5" rx="2" fill="#3E9BFF"/><text x="313.0" y="492" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#F4C24C" font-weight="800" text-anchor="middle">reduce</text><line x1="263" y1="512.0" x2="363" y2="512.0" stroke="#F4C24C" stroke-width="2.0" stroke-linecap="round"/><polygon points="363,512.0 347.97933950487703,515.8354043088336 347.97933950487703,508.16459569116637" fill="#F4C24C"/><text x="313.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="8.5" fill="#F4C24C" font-weight="700" text-anchor="middle">keep 3-WL</text><text x="452.5" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#46C98B" font-weight="800" text-anchor="middle">r-G(L3) reduced</text><rect x="377" y="500" width="151" height="24" rx="6" fill="#122A42" stroke="#46C98B" stroke-width="1.2"/><rect x="385" y="508.0" width="135" height="5" rx="2" fill="#46C98B"/><rect x="385" y="513.0" width="135" height="5" rx="2" fill="#46C98B"/><text x="544" y="508.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#33D6C0" font-weight="800" text-anchor="start">inputs</text><text x="544" y="525.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#33D6C0" font-weight="800" text-anchor="start">&amp; layers</text></g><g id="cue_s05_c3_concretely_layer_carries_edge_memory"><title>concretely layer carries edge memory node memory learnable linear blocks</title><rect x="656" y="322" width="560" height="160" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="322" width="6" height="160" rx="6" fill="#F4C24C"/><text x="684" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Move 3: rules become one layer</text><text x="684" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#EAF2FB" font-weight="400" text-anchor="start">A layer carries edge memory C and node memory H; linear blocks combine</text><text x="684" y="397" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#EAF2FB" font-weight="400" text-anchor="start">slices, the reduced rules are computed, and two MLPs merge them.</text><rect x="684" y="422" width="504" height="52" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><text x="719.0" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#3E9BFF" font-weight="800" text-anchor="middle">C</text><rect x="704" y="437.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="714" y="437.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="724" y="437.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="704" y="447.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="714" y="447.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="724" y="447.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="704" y="457.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="714" y="457.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><rect x="724" y="457.0" width="8" height="8" rx="2" fill="#173453" stroke="#3E9BFF" stroke-width="0.7"/><text x="754" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#33D6C0" font-weight="800" text-anchor="middle">H</text><rect x="750" y="437.0" width="8" height="8" rx="2" fill="#173453" stroke="#33D6C0" stroke-width="0.7"/><rect x="750" y="447.0" width="8" height="8" rx="2" fill="#173453" stroke="#33D6C0" stroke-width="0.7"/><rect x="750" y="457.0" width="8" height="8" rx="2" fill="#173453" stroke="#33D6C0" stroke-width="0.7"/><line x1="777" y1="452.0" x2="788" y2="452.0" stroke="#2A4D6E" stroke-width="1.4" stroke-linecap="round"/><polygon points="788,452.0 776.7345046286578,454.8765532316252 776.7345046286578,449.1234467683748" fill="#2A4D6E"/><rect x="790" y="430.0" width="70" height="12" rx="4" fill="#173453" stroke="#3E9BFF" stroke-width="1.0"/><text x="825" y="440.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#3E9BFF" font-weight="800" text-anchor="middle">M*M</text><rect x="790" y="445.0" width="70" height="12" rx="4" fill="#173453" stroke="#F4C24C" stroke-width="1.0"/><text x="825" y="455.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#F4C24C" font-weight="800" text-anchor="middle">M o M</text><rect x="790" y="460.0" width="70" height="12" rx="4" fill="#173453" stroke="#9C86F0" stroke-width="1.0"/><text x="825" y="470.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="9" fill="#9C86F0" font-weight="800" text-anchor="middle">diag</text><line x1="864" y1="452.0" x2="874" y2="452.0" stroke="#2A4D6E" stroke-width="1.4" stroke-linecap="round"/><polygon points="874,452.0 862.7345046286578,454.8765532316252 862.7345046286578,449.1234467683748" fill="#2A4D6E"/><rect x="876" y="433.0" width="48" height="38" rx="6" fill="#173453" stroke="#FFFFFF" stroke-width="1.4"/><text x="900" y="456.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">MLP</text><line x1="926" y1="452.0" x2="944" y2="452.0" stroke="#2A4D6E" stroke-width="1.4" stroke-linecap="round"/><polygon points="944,452.0 932.7345046286578,454.8765532316252 932.7345046286578,449.1234467683748" fill="#2A4D6E"/><text x="964" y="449.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#3E9BFF" font-weight="800" text-anchor="middle">C'</text><text x="964" y="467.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#33D6C0" font-weight="800" text-anchor="middle">H'</text></g><g id="cue_s05_c4_stack_these_layers_add_permutation_e"><title>stack these layers add permutation-equivariant readouts you g2n2</title><rect x="656" y="494" width="560" height="56" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="656" y="494" width="6" height="56" rx="6" fill="#46C98B"/><text x="684" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#46C98B" font-weight="800" text-anchor="start">Stack + equivariant readouts = G2N2</text><text x="684" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="start">permutation-equivariant readouts on H and on C</text></g></svg>