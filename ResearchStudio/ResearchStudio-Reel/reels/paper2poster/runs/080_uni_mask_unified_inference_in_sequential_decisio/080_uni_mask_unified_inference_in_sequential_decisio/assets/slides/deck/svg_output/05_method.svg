<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#5B9BF0"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">Tokenize the trajectory, then mask</text><g id="cue_s05_c1_uni_mask_represents_trajectory_seque"><title>uni-mask represents trajectory sequence per-timestep tokens state action optionally property</title><rect x="64" y="148" width="1152" height="132" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="148" width="6" height="132" rx="6" fill="#5B9BF0"/><text x="92" y="182" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#5B9BF0" font-weight="800" text-anchor="start">A trajectory becomes per-timestep tokens: state, action, property (return-to-go)</text><rect x="100" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="121.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#35D0C4" font-weight="700" text-anchor="middle">s0</text><rect x="146" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#F3C24B" stroke-width="1.4"/><text x="167.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#F3C24B" font-weight="700" text-anchor="middle">a0</text><rect x="192" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A487F0" stroke-width="1.4"/><text x="213.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A487F0" font-weight="700" text-anchor="middle">p0</text><rect x="238" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="259.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#35D0C4" font-weight="700" text-anchor="middle">s1</text><rect x="284" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#F3C24B" stroke-width="1.4"/><text x="305.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#F3C24B" font-weight="700" text-anchor="middle">a1</text><rect x="330" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A487F0" stroke-width="1.4"/><text x="351.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A487F0" font-weight="700" text-anchor="middle">p1</text><rect x="376" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="397.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#35D0C4" font-weight="700" text-anchor="middle">s2</text><rect x="422" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#F3C24B" stroke-width="1.4"/><text x="443.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#F3C24B" font-weight="700" text-anchor="middle">a2</text><rect x="468" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A487F0" stroke-width="1.4"/><text x="489.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A487F0" font-weight="700" text-anchor="middle">p2</text><text x="518" y="228" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#A0B4CE" font-weight="800" text-anchor="middle">…</text><rect x="528" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="549.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#35D0C4" font-weight="700" text-anchor="middle">sT</text><rect x="560" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#F3C24B" stroke-width="1.4"/><text x="581.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#F3C24B" font-weight="700" text-anchor="middle">aT</text><rect x="606" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A487F0" stroke-width="1.4"/><text x="627.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A487F0" font-weight="700" text-anchor="middle">pT</text><text x="100" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#35D0C4" font-weight="700" text-anchor="start">state</text><text x="238" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#F3C24B" font-weight="700" text-anchor="start">action</text><text x="392" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A487F0" font-weight="700" text-anchor="start">return-to-go</text></g><g id="cue_s05_c2_masking_scheme_specifies_two_things"><title>masking scheme specifies two things which input tokens visible which</title><rect x="64" y="298" width="560" height="158" rx="14" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="298" width="6" height="158" rx="6" fill="#35D0C4"/><text x="92" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#35D0C4" font-weight="800" text-anchor="start">A masking scheme sets two things</text><rect x="92" y="350" width="240" height="30" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="109" cy="365.0" r="5" fill="#5B9BF0"/><text x="124" y="370.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" font-weight="600" text-anchor="start">which inputs are visible</text><rect x="348" y="350" width="236" height="30" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="365" cy="365.0" r="5" fill="#F3C24B"/><text x="380" y="370.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF1FB" font-weight="600" text-anchor="start">which outputs are scored</text><text x="92" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Different visible / predicted splits recover</text><text x="92" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">different inference tasks from one model.</text></g><g id="cue_s05_c3_behavior_cloning_conditions_past_sta"><title>behavior cloning conditions past states actions predicts next action goal</title><rect x="648" y="298" width="568" height="158" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="648" y="298" width="6" height="158" rx="6" fill="#F3C24B"/><text x="676" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F3C24B" font-weight="800" text-anchor="start">Reveal / predict = choose the task</text><text x="676" y="362" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#EAF1FB" font-weight="700" text-anchor="start">BC:  see s_0:t , a_0:t-1  →  predict a_t</text><text x="676" y="388" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#EAF1FB" font-weight="700" text-anchor="start">Goal:  additionally reveal a future state</text><text x="676" y="414" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13.5" fill="#EAF1FB" font-weight="700" text-anchor="start">Reward:  reveal return-to-go token</text><text x="676" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#5B9BF0" font-weight="700" text-anchor="start">backbone: bidirectional BERT-style encoder</text></g><g id="cue_s05_c4_authors_compare_four_regimes_single"><title>authors compare four regimes single-task multi-task random scheme per snippet</title><rect x="64" y="472" width="1152" height="86" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="472" width="6" height="86" rx="6" fill="#45C88A"/><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#45C88A" font-weight="800" text-anchor="start">Four training regimes compared</text><rect x="420" y="484" width="180" height="54" rx="10" fill="#1A2942" stroke="#F0655C" stroke-width="1.4"/><text x="510" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F0655C" font-weight="800" text-anchor="middle">Single-task</text><text x="510" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">one task only</text><rect x="616" y="484" width="180" height="54" rx="10" fill="#1A2942" stroke="#F3C24B" stroke-width="1.4"/><text x="706" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F3C24B" font-weight="800" text-anchor="middle">Multi-task</text><text x="706" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">random scheme</text><rect x="812" y="484" width="180" height="54" rx="10" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="902" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#35D0C4" font-weight="800" text-anchor="middle">Random-mask</text><text x="902" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">arbitrary masking</text><rect x="1008" y="484" width="180" height="54" rx="10" fill="#1A2942" stroke="#45C88A" stroke-width="1.4"/><text x="1098" y="510" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#45C88A" font-weight="800" text-anchor="middle">Fine-tune</text><text x="1098" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">pretrain + finetune</text></g><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="start">Random masking during pretraining, then task-specific fine-tuning, is the strongest recipe.</text></svg>