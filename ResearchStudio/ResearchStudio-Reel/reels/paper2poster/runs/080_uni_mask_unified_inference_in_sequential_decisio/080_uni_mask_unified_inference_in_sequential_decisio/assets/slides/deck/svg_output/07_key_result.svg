<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#5B9BF0"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">KEY RESULT</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">Train on many, win on each</text><g id="cue_s07_c1_minigrid_environment_single_trained"><title>minigrid environment single trained random masking outperforms single-task models all</title><rect x="64" y="150" width="560" height="150" rx="14" fill="#141F33" stroke="#35D0C4" stroke-width="1.5"/><rect x="64" y="150" width="6" height="150" rx="6" fill="#35D0C4"/><text x="92" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#35D0C4" font-weight="800" text-anchor="start">MiniGrid</text><text x="92" y="214" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Random-mask training beats single-task on</text><text x="92" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">all tasks. Adding fine-tuning is best of all</text><text x="92" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">— winning on every task except behavior</text><text x="92" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">cloning.</text><rect x="92" y="268" width="236" height="28" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="109" cy="282.0" r="5" fill="#35D0C4"/><text x="124" y="287.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" font-weight="600" text-anchor="start">random-mask &gt; single-task (all)</text><rect x="340" y="268" width="180" height="28" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="357" cy="282.0" r="5" fill="#45C88A"/><text x="372" y="287.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" font-weight="600" text-anchor="start">+ finetune = best</text></g><g id="cue_s07_c2_means_even_you_only_care"><title>means even you only care about one inference task first</title><rect x="648" y="150" width="568" height="150" rx="14" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><rect x="648" y="150" width="6" height="150" rx="6" fill="#F3C24B"/><text x="676" y="184" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F3C24B" font-weight="800" text-anchor="start">Why it matters</text><text x="676" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">Even if you care about only one inference</text><text x="676" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">task, first training on many tasks generally</text><text x="676" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">helps that one task.</text></g><g id="cue_s07_c3_harder_maze2d_environment_fine_tunin"><title>harder maze2d environment fine-tuning becomes critical fine-tuned uni-mask models reach</title><rect x="64" y="318" width="1152" height="204" rx="14" fill="#141F33" stroke="#F3C24B" stroke-width="1.5"/><rect x="64" y="318" width="6" height="204" rx="6" fill="#F3C24B"/><text x="92" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F3C24B" font-weight="800" text-anchor="start">Maze2D reward — fine-tuning is critical (context length 5)</text><rect x="340" y="372" width="720" height="22" rx="6" fill="#0E1B2E" stroke="#2B3D5A" stroke-width="1"/><rect x="340" y="372" width="655.1999999999999" height="22" rx="6" fill="#45C88A"/><text x="326" y="387.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="end">Uni[MASK] multi-task + finetune</text><text x="1005.1999999999999" y="387.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#45C88A" font-weight="800" text-anchor="start">2.73</text><rect x="340" y="400" width="720" height="22" rx="6" fill="#0E1B2E" stroke="#2B3D5A" stroke-width="1"/><rect x="340" y="400" width="657.6" height="22" rx="6" fill="#35D0C4"/><text x="326" y="415.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="end">Uni[MASK] random-mask + finetune</text><text x="1007.6" y="415.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#35D0C4" font-weight="800" text-anchor="start">2.74</text><rect x="340" y="428" width="720" height="22" rx="6" fill="#0E1B2E" stroke="#2B3D5A" stroke-width="1"/><rect x="340" y="428" width="357.59999999999997" height="22" rx="6" fill="#5B9BF0"/><text x="326" y="443.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="end">Decision Transformer</text><text x="707.5999999999999" y="443.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#5B9BF0" font-weight="800" text-anchor="start">1.49</text><rect x="340" y="456" width="720" height="22" rx="6" fill="#0E1B2E" stroke="#2B3D5A" stroke-width="1"/><rect x="340" y="456" width="384.0" height="22" rx="6" fill="#A0B4CE"/><text x="326" y="471.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="end">Feedforward</text><text x="734.0" y="471.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="800" text-anchor="start">1.60</text><rect x="340" y="484" width="720" height="22" rx="6" fill="#0E1B2E" stroke="#2B3D5A" stroke-width="1"/><rect x="340" y="484" width="271.2" height="22" rx="6" fill="#F0655C"/><text x="326" y="499.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="end">Decision Transformer (BC)</text><text x="621.2" y="499.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#F0655C" font-weight="800" text-anchor="start">1.13</text><line x1="820.0" y1="368" x2="820.0" y2="508" stroke="#6B819C" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="820.0" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6B819C" font-weight="600" text-anchor="middle">2.0</text></g><text x="64" y="552" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="600" text-anchor="start">Fine-tuned Uni[MASK] reaches ~2.7, outperforming every baseline at context length 5.</text></svg>