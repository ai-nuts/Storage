<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#5B9BF0"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">One trajectory, many siloed models</text><g id="cue_s02_c1_sequential_decision_making_tasks_lik"><title>sequential decision making tasks like behavior cloning offline reinforcement learning</title><rect x="64" y="150" width="1152" height="150" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="150" width="6" height="150" rx="6" fill="#F0655C"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F0655C" font-weight="800" text-anchor="start">Every inference task gets its own specially trained model</text><rect x="104" y="214" width="236" height="70" rx="10" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><text x="222" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF1FB" font-weight="700" text-anchor="middle">Behavior</text><text x="222" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">cloning</text><text x="222" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B819C" font-weight="600" text-anchor="middle">separate model</text><rect x="376" y="214" width="236" height="70" rx="10" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><text x="494" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF1FB" font-weight="700" text-anchor="middle">Offline</text><text x="494" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">RL</text><text x="494" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B819C" font-weight="600" text-anchor="middle">separate model</text><rect x="648" y="214" width="236" height="70" rx="10" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><text x="766" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF1FB" font-weight="700" text-anchor="middle">Inverse</text><text x="766" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">dynamics</text><text x="766" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B819C" font-weight="600" text-anchor="middle">separate model</text><rect x="920" y="214" width="236" height="70" rx="10" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><text x="1038" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF1FB" font-weight="700" text-anchor="middle">Goal / waypoint</text><text x="1038" y="262" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="600" text-anchor="middle">conditioning</text><text x="1038" y="298" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#6B819C" font-weight="600" text-anchor="middle">separate model</text></g><g id="cue_s02_c2_yet_all_these_tasks_operate"><title>yet all these tasks operate over very same object trajectory</title><rect x="64" y="318" width="720" height="132" rx="14" fill="#141F33" stroke="#35D0C4" stroke-width="1.5"/><rect x="64" y="318" width="6" height="132" rx="6" fill="#35D0C4"/><text x="92" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#35D0C4" font-weight="800" text-anchor="start">Yet all operate on the very same object</text><text x="92" y="398" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="16" fill="#EAF1FB" font-weight="700" text-anchor="start">trajectory  =  ( s0 , a0 , p0 )  ( s1 , a1 , p1 )  …  ( sT , aT , pT )</text><text x="92" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="600" text-anchor="start">states, actions, and returns — shared across every task</text></g><g id="cue_s02_c3_distinct_per_task_ignores_shared"><title>distinct per task ignores shared structure misses chance build richer</title><rect x="800" y="318" width="416" height="132" rx="14" fill="#2A1720" stroke="#F0655C" stroke-width="1.5"/><rect x="800" y="318" width="6" height="132" rx="6" fill="#F0655C"/><text x="828" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F0655C" font-weight="800" text-anchor="start">The cost of siloing</text><text x="828" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">A distinct model per task ignores this</text><text x="828" y="411" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">shared structure and misses reusable,</text><text x="828" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">richer representations.</text></g><line x1="64" y1="486" x2="1216" y2="486" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><text x="64" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="600" text-anchor="start">The waste: shared trajectory structure is thrown away by per-task training.</text></svg>