<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#5B9BF0" font-weight="800" text-anchor="start" letter-spacing="3">NeurIPS 2022</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="600" text-anchor="end">UC Berkeley  ·  Microsoft Research  ·  CMU</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><text x="64" y="156" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="39" fill="#FFFFFF" font-weight="800" text-anchor="start">Uni[MASK]: Unified Inference in</text><text x="64" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="39" fill="#5B9BF0" font-weight="800" text-anchor="start">Sequential Decision Problems</text><rect x="64" y="228" width="232" height="30" rx="15" fill="#241A34" stroke="#A487F0" stroke-width="1.5"/><text x="180" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A487F0" font-weight="800" text-anchor="middle">one masked model, many tasks</text><text x="64" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#6B819C" font-weight="500" text-anchor="start">Carroll · Paradise · Lin · Georgescu · Sun · Bignell · Milani · Hofmann · Hausknecht · Dragan · Devlin</text><g id="cue_s01_c1_randomly_masking_predicting_tokens_p"><title>randomly masking predicting tokens powered pretraining language modeling</title><rect x="64" y="312" width="274" height="214" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="312" width="274" height="6" rx="6" fill="#5B9BF0"/><circle cx="92" cy="360" r="7" fill="#5B9BF0"/><text x="110" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF1FB" font-weight="800" text-anchor="start">The idea</text><text x="86" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Predicting randomly masked</text><text x="86" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">tokens is what powers</text><text x="86" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">pretraining in language</text><text x="86" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">modeling.</text></g><g id="cue_s01_c2_uni_mask_shows_same_idea_applies"><title>uni-mask shows same idea applies naturally sequential decision making</title><rect x="356" y="312" width="274" height="214" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="356" y="312" width="274" height="6" rx="6" fill="#A487F0"/><circle cx="384" cy="360" r="7" fill="#A487F0"/><text x="402" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF1FB" font-weight="800" text-anchor="start">The transfer</text><text x="378" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Uni[MASK] shows the very same</text><text x="378" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">recipe applies to sequential</text><text x="378" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">decision making.</text></g><g id="cue_s01_c3_many_well_studied_tasks_behavior_clo"><title>many well-studied tasks behavior cloning offline reinforcement learning inverse dynamics</title><rect x="648" y="312" width="274" height="214" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="648" y="312" width="274" height="6" rx="6" fill="#35D0C4"/><circle cx="676" cy="360" r="7" fill="#35D0C4"/><text x="694" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF1FB" font-weight="800" text-anchor="start">The tasks</text><text x="670" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Behavior cloning, offline RL,</text><text x="670" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">inverse dynamics, and waypoint</text><text x="670" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">conditioning are all studied</text><text x="670" y="473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">here.</text></g><g id="cue_s01_c4_uni_mask_unifies_them_one_framework"><title>uni-mask unifies them one framework single trained way often matches</title><rect x="940" y="312" width="274" height="214" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="940" y="312" width="274" height="6" rx="6" fill="#45C88A"/><circle cx="968" cy="360" r="7" fill="#45C88A"/><text x="986" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#EAF1FB" font-weight="800" text-anchor="start">The payoff</text><text x="962" y="404" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">One framework unifies them; a</text><text x="962" y="427" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">single model matches or beats</text><text x="962" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">specialized ones.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><text x="64" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#5B9BF0" font-weight="700" text-anchor="start">arXiv:2211.10869</text><text x="300" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="600" text-anchor="start">github.com/micahcarroll/uniMASK</text><text x="1216" y="602" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#35D0C4" font-weight="700" text-anchor="end">Tasks are just maskings of one trajectory</text></svg>