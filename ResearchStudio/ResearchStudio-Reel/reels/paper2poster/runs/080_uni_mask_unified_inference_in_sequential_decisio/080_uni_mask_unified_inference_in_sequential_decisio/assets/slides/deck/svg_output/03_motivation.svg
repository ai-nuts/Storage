<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#A487F0"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">Masked prediction, borrowed from BERT</text><g id="cue_s03_c1_masked_language_modeling_technique_b"><title>masked language modeling technique behind bert trains models predict randomly</title><rect x="64" y="150" width="560" height="150" rx="14" fill="#141F33" stroke="#A487F0" stroke-width="1.5"/><rect x="64" y="150" width="6" height="150" rx="6" fill="#A487F0"/><text x="92" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#A487F0" font-weight="800" text-anchor="start">Masked language modeling (BERT)</text><rect x="92" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A0B4CE" stroke-width="1.4"/><text x="113.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A0B4CE" font-weight="700" text-anchor="middle">the</text><rect x="140" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A0B4CE" stroke-width="1.4"/><text x="161.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A0B4CE" font-weight="700" text-anchor="middle">cat</text><rect x="188" y="204" width="42" height="34" rx="6" fill="#241A34" stroke="#A487F0" stroke-width="1.6"/><text x="209.0" y="227.12" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#A487F0" font-weight="800" text-anchor="middle">?</text><rect x="236" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#A0B4CE" stroke-width="1.4"/><text x="257.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#A0B4CE" font-weight="700" text-anchor="middle">on</text><rect x="284" y="204" width="42" height="34" rx="6" fill="#241A34" stroke="#A487F0" stroke-width="1.6"/><text x="305.0" y="227.12" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#A487F0" font-weight="800" text-anchor="middle">?</text><text x="92" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Predict randomly masked tokens; the model</text><text x="92" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">learns bidirectional representations that</text><text x="92" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">transfer widely.</text></g><g id="cue_s03_c2_authors_observe_idea_maps_directly"><title>authors observe idea maps directly onto decision making</title><rect x="648" y="150" width="568" height="150" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="648" y="150" width="6" height="150" rx="6" fill="#5B9BF0"/><text x="676" y="186" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#5B9BF0" font-weight="800" text-anchor="start">The same idea maps onto decisions</text><rect x="676" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="697.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#35D0C4" font-weight="700" text-anchor="middle">s0</text><rect x="724" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#F3C24B" stroke-width="1.4"/><text x="745.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#F3C24B" font-weight="700" text-anchor="middle">a0</text><rect x="772" y="204" width="42" height="34" rx="6" fill="#1A2942" stroke="#35D0C4" stroke-width="1.4"/><text x="793.0" y="226.44" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="13" fill="#35D0C4" font-weight="700" text-anchor="middle">s1</text><rect x="820" y="204" width="42" height="34" rx="6" fill="#241A34" stroke="#A487F0" stroke-width="1.6"/><text x="841.0" y="227.12" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="18" fill="#A487F0" font-weight="800" text-anchor="middle">?</text><text x="880" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="start">mask the last action</text><text x="676" y="272" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">Treat states and actions as tokens; the</text><text x="676" y="294" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">authors observe decision tasks are just</text><text x="676" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">maskings.</text></g><g id="cue_s03_c3_you_treat_states_actions_tokens"><title>you treat states actions tokens mask last action predicting exactly</title><rect x="64" y="318" width="720" height="138" rx="14" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="318" width="6" height="138" rx="6" fill="#F3C24B"/><text x="92" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F3C24B" font-weight="800" text-anchor="start">Mask the last action  =  a behavior-cloning inference</text><text x="92" y="398" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#EAF1FB" font-weight="800" text-anchor="start">predict  a_t   given   s_0:t , a_0:t-1</text><text x="92" y="428" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">So one masked-prediction objective can, in principle, express</text><text x="92" y="450" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="400" text-anchor="start">the entire family of tasks.</text></g><g id="cue_s03_c4_different_tasks_simply_different_mas"><title>different tasks simply different masking patterns over same trajectory single</title><rect x="800" y="318" width="416" height="138" rx="14" fill="#141F33" stroke="#35D0C4" stroke-width="1.5"/><rect x="800" y="318" width="6" height="138" rx="6" fill="#35D0C4"/><text x="828" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#35D0C4" font-weight="800" text-anchor="start">One objective, many tasks</text><text x="828" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">Different tasks are simply different</text><text x="828" y="411" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">masking patterns over the same</text><text x="828" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">trajectory of tokens.</text></g><line x1="64" y1="492" x2="1216" y2="492" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><text x="64" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A487F0" font-weight="700" text-anchor="start">Insight: decision-making inferences are different maskings of one trajectory.</text></svg>