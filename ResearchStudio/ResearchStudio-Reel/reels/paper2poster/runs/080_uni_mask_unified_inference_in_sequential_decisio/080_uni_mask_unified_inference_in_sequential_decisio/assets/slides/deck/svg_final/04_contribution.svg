<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#5B9BF0"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">Uni[MASK]: inference tasks as maskings</text><g id="cue_s04_c1_main_contribution_uni_mask_framework"><title>main contribution uni-mask framework unified way specify models sequential decision</title><rect x="64" y="152" width="1152" height="100" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="152" width="6" height="100" rx="6" fill="#5B9BF0"/><circle cx="112" cy="202.0" r="10" fill="#5B9BF0"/><text x="150" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF1FB" font-weight="800" text-anchor="start">A unifying framework</text><text x="150" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">Cast each inference task as a masking scheme over a trajectory of state, action, and reward-to-go</text><text x="150" y="242" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">tokens.</text></g><g id="cue_s04_c2_because_tasks_just_maskings_single"><title>because tasks just maskings single trained perform behavior cloning reward</title><rect x="64" y="265" width="1152" height="100" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="265" width="6" height="100" rx="6" fill="#35D0C4"/><circle cx="112" cy="315.0" r="10" fill="#35D0C4"/><text x="150" y="305" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF1FB" font-weight="800" text-anchor="start">One model, many tasks</text><text x="150" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">Because tasks are just maskings, a single model trains on behavior cloning, reward conditioning,</text><text x="150" y="355" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">dynamics, and goal / waypoint conditioning together.</text></g><g id="cue_s04_c3_authors_show_single_often_matches"><title>authors show single often matches exceeds specialized single-task models consistently</title><rect x="64" y="378" width="1152" height="100" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="378" width="6" height="100" rx="6" fill="#45C88A"/><circle cx="112" cy="428.0" r="10" fill="#45C88A"/><text x="150" y="418" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF1FB" font-weight="800" text-anchor="start">Matches and beats specialists</text><text x="150" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">The single model often matches or exceeds specialized single-task models, and consistently wins</text><text x="150" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">after fine-tuning.</text></g><g id="cue_s04_c4_along_way_they_also_introduce"><title>along way they also introduce decision-gpt improved gpt-based baseline</title><rect x="64" y="491" width="1152" height="100" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="491" width="6" height="100" rx="6" fill="#F3C24B"/><circle cx="112" cy="541.0" r="10" fill="#F3C24B"/><text x="150" y="531" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF1FB" font-weight="800" text-anchor="start">Decision-GPT baseline</text><text x="150" y="559" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#A0B4CE" font-weight="400" text-anchor="start">Along the way, the authors introduce Decision-GPT, an improved GPT-based baseline for comparison.</text></g><text x="64" y="626" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#5B9BF0" font-weight="700" text-anchor="start">A single masked model replaces a zoo of task-specific ones.</text></svg>