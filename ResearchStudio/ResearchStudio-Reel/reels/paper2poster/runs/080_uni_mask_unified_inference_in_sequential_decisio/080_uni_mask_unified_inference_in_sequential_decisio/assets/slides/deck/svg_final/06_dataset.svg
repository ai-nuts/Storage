<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#5B9BF0"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">Two decision-making environments</text><g id="cue_s06_c1_framework_evaluated_two_environments"><title>framework evaluated two environments</title><rect x="64" y="150" width="1152" height="60" rx="12" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="150" width="6" height="60" rx="6" fill="#5B9BF0"/><text x="92" y="187" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#5B9BF0" font-weight="800" text-anchor="start">The framework is evaluated on two environments — one discrete, one continuous</text></g><g id="cue_s06_c2_first_minigrid_gridworld_where_agent"><title>first minigrid gridworld where agent must reach fixed goal behind</title><rect x="64" y="228" width="560" height="236" rx="14" fill="#141F33" stroke="#35D0C4" stroke-width="1.5"/><rect x="64" y="228" width="6" height="236" rx="6" fill="#35D0C4"/><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#35D0C4" font-weight="800" text-anchor="start">MiniGrid</text><text x="214" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="start">discrete gridworld</text><rect x="92" y="286" width="150" height="150" rx="8" fill="#0E1B2E" stroke="#2B3D5A" stroke-width="1.5"/><line x1="117" y1="311" x2="217" y2="311" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><line x1="117" y1="336" x2="217" y2="336" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><line x1="117" y1="361" x2="217" y2="361" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><line x1="117" y1="386" x2="217" y2="386" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><line x1="142" y1="286" x2="142" y2="436" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><line x1="167" y1="286" x2="167" y2="436" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><line x1="192" y1="286" x2="192" y2="436" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><rect x="97" y="291" width="40" height="40" rx="4" fill="#5B9BF0" opacity="0.9"/><text x="117" y="316" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">A</text><rect x="172" y="391" width="40" height="40" rx="4" fill="#45C88A" opacity="0.9"/><text x="192" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">G</text><rect x="147" y="341" width="20" height="20" rx="3" fill="#F3C24B"/><text x="262" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">Agent must reach a fixed goal</text><text x="262" y="335" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">behind a locked door. Used to</text><text x="262" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">show the many inference tasks</text><text x="262" y="377" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">one model can do, and to compare</text><text x="262" y="398" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">task-specific validation losses.</text></g><g id="cue_s06_c3_second_maze2d_continuous_control_maz"><title>second maze2d continuous-control maze mujoco-based d4rl benchmark where authors measure</title><rect x="648" y="228" width="568" height="236" rx="14" fill="#141F33" stroke="#F3C24B" stroke-width="1.5"/><rect x="648" y="228" width="6" height="236" rx="6" fill="#F3C24B"/><text x="676" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#F3C24B" font-weight="800" text-anchor="start">Maze2D</text><text x="806" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="start">continuous control · D4RL</text><text x="676" y="300" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">A MuJoCo-physics maze. Test-time reward over</text><text x="676" y="321" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="400" text-anchor="start">1000 rollouts across 5 seeds.</text><text x="676" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF1FB" font-weight="800" text-anchor="start">Baselines</text><rect x="676" y="364" width="168" height="30" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="693" cy="379.0" r="5" fill="#A0B4CE"/><text x="708" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" font-weight="600" text-anchor="start">Feedforward net</text><rect x="852" y="364" width="196" height="30" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="869" cy="379.0" r="5" fill="#5B9BF0"/><text x="884" y="384.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" font-weight="600" text-anchor="start">Decision Transformer</text><rect x="676" y="402" width="168" height="30" rx="8" fill="#1A2942" stroke="#2B3D5A" stroke-width="1.5"/><circle cx="693" cy="417.0" r="5" fill="#45C88A"/><text x="708" y="422.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#EAF1FB" font-weight="600" text-anchor="start">Decision-GPT (ours)</text><text x="860" y="423" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#A0B4CE" font-weight="600" text-anchor="start">context lengths 5 and 10</text></g><line x1="64" y1="488" x2="1216" y2="488" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><text x="64" y="522" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#A0B4CE" font-weight="600" text-anchor="start">MiniGrid probes task breadth; Maze2D measures reward against strong sequence baselines.</text></svg>