<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5B9BF0"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#0B1220"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#35D0C4"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF1FB" font-weight="800" text-anchor="start">Many tasks, one masked model</text><g id="cue_s10_c1_lasting_takeaway_simple_powerful_man"><title>lasting takeaway simple powerful many seemingly distinct sequential-decision tasks just</title><rect x="64" y="160" width="1152" height="118" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="160" width="6" height="118" rx="6" fill="#35D0C4"/><circle cx="112" cy="219.0" r="10" fill="#35D0C4"/><text x="150" y="204" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF1FB" font-weight="800" text-anchor="start">Tasks are maskings</text><text x="150" y="236" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">Many seemingly distinct sequential-decision tasks are just different maskings of the same</text><text x="150" y="259" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">trajectory — so one masked-prediction model can replace a zoo of specialized ones.</text></g><g id="cue_s10_c2_many_masking_schemes_fine_tuning_gen"><title>many masking schemes fine-tuning generally does better any single task</title><rect x="64" y="292" width="1152" height="118" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="292" width="6" height="118" rx="6" fill="#45C88A"/><circle cx="112" cy="351.0" r="10" fill="#45C88A"/><text x="150" y="336" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF1FB" font-weight="800" text-anchor="start">Pretrain on many, then fine-tune</text><text x="150" y="368" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">Training on many masking schemes and then fine-tuning generally beats training on any single</text><text x="150" y="391" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">task alone — even when you only care about that one task.</text></g><g id="cue_s10_c3_main_caveat_architectural_bert_style"><title>main caveat architectural bert-style models shine short contexts but struggle</title><rect x="64" y="424" width="1152" height="118" rx="14" fill="#141F33" stroke="#2B3D5A" stroke-width="1.5"/><rect x="64" y="424" width="6" height="118" rx="6" fill="#F3C24B"/><circle cx="112" cy="483.0" r="10" fill="#F3C24B"/><text x="150" y="468" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18.5" fill="#EAF1FB" font-weight="800" text-anchor="start">The caveat is architectural</text><text x="150" y="500" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">BERT-style backbones shine at short contexts but struggle to generate over longer sequences;</text><text x="150" y="523" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#A0B4CE" font-weight="400" text-anchor="start">combining GPT-style backbones with random masking is a promising next step.</text></g><line x1="64" y1="564" x2="1216" y2="564" stroke="#2B3D5A" stroke-width="1" stroke-linecap="round"/><text x="64" y="596" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF1FB" font-weight="700" text-anchor="start">Uni[MASK]  ·  Unified Inference in Sequential Decision Problems</text><text x="1216" y="596" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#A0B4CE" font-weight="600" text-anchor="end">NeurIPS 2022  ·  arXiv:2211.10869</text></svg>