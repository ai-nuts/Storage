<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Why non-stationarity matters now</text><g id="cue_s03_c1_why_does_matter_now_consider"><title>why does matter now consider intern health study year-long mobile-health</title><rect x="64" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#34D3C0"/><text x="92" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#34D3C0" font-weight="800" text-anchor="start">The Intern Health Study</text><text x="92" y="230" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A year-long mobile-health trial that nudges</text><text x="92" y="252" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">first-year physicians toward healthier habits with</text><text x="92" y="274" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">push notifications.</text><rect x="92" y="318" width="504" height="150" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="108" y1="448" x2="584" y2="448" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="108" y1="332" x2="108" y2="448" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><polyline points="114.0,340.0 124.0,344.9 134.0,349.5 144.0,353.9 154.0,358.1 164.0,362.1 174.0,365.9 184.0,369.6 194.0,373.1 204.0,376.4 214.0,379.5 224.0,382.5 234.0,385.4 244.0,388.2 254.0,390.8 264.0,393.2 274.0,395.6 284.0,397.9 294.0,400.0 304.0,402.1 314.0,404.0 324.0,405.9 334.0,407.7 344.0,409.4 354.0,411.0 364.0,412.5 374.0,414.0 384.0,415.4 394.0,416.7 404.0,418.0 414.0,419.2 424.0,420.4 434.0,421.5 444.0,422.5 454.0,423.5 464.0,424.5 474.0,425.4 484.0,426.3 494.0,427.1 504.0,427.9 514.0,428.6 524.0,429.4 534.0,430.0 544.0,430.7 554.0,431.3 564.0,431.9 574.0,432.5" fill="none" stroke="#F2C14E" stroke-width="2.6"/><line x1="367" y1="334" x2="367" y2="448" stroke="#F2685C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/><text x="367" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2685C" font-weight="700" text-anchor="middle">change</text><text x="114" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="700" text-anchor="start">nudge effect</text><text x="582" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">weeks -&gt;</text><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#34D3C0" font-weight="700" text-anchor="start">A textbook case of drift over a long horizon.</text></g><g id="cue_s03_c2_effect_those_nudges_wanes_over"><title>effect those nudges wanes over time textbook case non-stationarity similar</title><rect x="648" y="158" width="568" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="158" width="6" height="120" rx="6" fill="#F2C14E"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">The effect wanes over time</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Nudge effectiveness fades as the year goes on.</text><text x="676" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Traffic-signal control shows the same drift, swinging</text><text x="676" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">between peak and off-peak flow.</text></g><g id="cue_s03_c3_ignoring_these_shifts_leads_policies"><title>ignoring these shifts leads policies send prompts wrong moments erode</title><rect x="648" y="290" width="568" height="116" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="648" y="290" width="6" height="116" rx="6" fill="#F2685C"/><text x="676" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Ignoring the shift is costly</text><text x="676" y="358" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A stationary policy sends prompts at the wrong moments and</text><text x="676" y="380" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">steadily erodes the long-term reward it was meant to raise.</text></g><g id="cue_s03_c4_prior_stationarity_tests_either_dema"><title>prior stationarity tests either demand knowledge true fall back linear</title><rect x="648" y="418" width="568" height="132" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="648" y="418" width="6" height="132" rx="6" fill="#4C9BE8"/><text x="676" y="456" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">Prior tests leave a gap</text><text x="676" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Prior tests either need a fully known model, or lean on linear</text><text x="676" y="508" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">approximations that break in high dimensions.</text><text x="676" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#4C9BE8" font-weight="800" text-anchor="start">known model  X      linear approx  X  (high-dim)</text></g></svg>