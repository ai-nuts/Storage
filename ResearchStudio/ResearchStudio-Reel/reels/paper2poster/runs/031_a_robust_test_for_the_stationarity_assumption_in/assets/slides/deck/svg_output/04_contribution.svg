<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">A doubly robust stationarity test</text><g id="cue_s04_c1_core_contribution_model_based_doubly"><title>core contribution model-based doubly robust procedure tests stationarity assumption locates</title><rect x="64" y="180" width="368" height="360" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="180" width="368" height="6" rx="6" fill="#4C9BE8"/><circle cx="116" cy="250" r="26" fill="none" stroke="#4C9BE8" stroke-width="2.5"/><text x="116" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#4C9BE8" font-weight="800" text-anchor="middle">1</text><text x="92" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">Test and detect</text><text x="92" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">A model-based, doubly robust procedure</text><text x="92" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">that tests the stationarity assumption</text><text x="92" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">and locates change points in offline</text><text x="92" y="435" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">reinforcement learning.</text></g><g id="cue_s04_c2_doubly_robust_means_test_controls"><title>doubly robust means test controls type-one error long either transition</title><rect x="456" y="180" width="368" height="360" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="456" y="180" width="368" height="6" rx="6" fill="#34D3C0"/><circle cx="508" cy="250" r="26" fill="none" stroke="#34D3C0" stroke-width="2.5"/><text x="508" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#34D3C0" font-weight="800" text-anchor="middle">2</text><text x="484" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">Double robustness</text><text x="484" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Type-I error stays controlled as long as</text><text x="484" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">either the transition function or the</text><text x="484" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">marginal state-action distribution is</text><text x="484" y="435" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">correctly specified.</text></g><g id="cue_s04_c3_top_method_authors_prove_size"><title>top method authors prove size control double robustness under bidirectional</title><rect x="848" y="180" width="368" height="360" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="848" y="180" width="368" height="6" rx="6" fill="#F2C14E"/><circle cx="900" cy="250" r="26" fill="none" stroke="#F2C14E" stroke-width="2.5"/><text x="900" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="28" fill="#F2C14E" font-weight="800" text-anchor="middle">3</text><text x="876" y="322" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#EAF2FB" font-weight="800" text-anchor="start">Theory + p-values</text><text x="876" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Size control and double robustness under</text><text x="876" y="389" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">a bidirectional asymptotic framework (N</text><text x="876" y="412" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">or T may diverge), with a Gaussian</text><text x="876" y="435" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">multiplier bootstrap for honest</text><text x="876" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">p-values.</text></g><text x="64" y="584" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#34D3C0" font-weight="700" text-anchor="start">Valid inference even when one nuisance model is wrong  —  that is what doubly robust buys you.</text></svg>