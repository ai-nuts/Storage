<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start" letter-spacing="3">ICML 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">University of Michigan  ·  LSE</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#FFFFFF" font-weight="800" text-anchor="start">A Robust Test for the Stationarity</text><text x="64" y="198" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="40" fill="#4C9BE8" font-weight="800" text-anchor="start">Assumption in Sequential Decision Making</text><text x="64" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="21" fill="#34D3C0" font-weight="700" text-anchor="start">A doubly robust change-point test for offline reinforcement learning</text><text x="64" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="500" text-anchor="start">Jitao Wang   ·   Chengchun Shi   ·   Zhenke Wu      —   U-M Biostatistics  &amp;  LSE Statistics</text><g id="cue_s01_c1_reinforcement_learning_promises_opti"><title>reinforcement learning promises optimal decisions but almost every algorithm quietly</title><rect x="64" y="312" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="312" width="6" height="118" rx="6" fill="#4C9BE8"/><text x="92" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">The hidden assumption</text><text x="92" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Almost every RL algorithm assumes the world never changes. In mobile</text><text x="92" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">health, traffic, and robotics that stationarity quietly breaks and</text><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">poisons the policy.</text></g><g id="cue_s01_c2_introduces_doubly_robust_statistical"><title>introduces doubly robust statistical test checks whether offline markov decision</title><rect x="656" y="312" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="312" width="6" height="118" rx="6" fill="#34D3C0"/><text x="684" y="348" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">A doubly robust test</text><text x="684" y="374" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A statistical test checks whether an offline Markov decision process is</text><text x="684" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">actually stationary, and pinpoints where the dynamics change.</text></g><g id="cue_s01_c3_test_pairs_modern_machine_learning"><title>test pairs modern machine learning estimators semiparametric statistics controls false</title><rect x="64" y="452" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="452" width="6" height="118" rx="6" fill="#F2C14E"/><text x="92" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">ML meets semiparametrics</text><text x="92" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It pairs flexible ML estimators with semiparametric statistics, so it</text><text x="92" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">controls false alarms yet stays powerful even in high dimensions.</text></g><g id="cue_s01_c4_across_four_simulations_real_intern"><title>across four simulations real intern health study detects change points</title><rect x="656" y="452" width="560" height="118" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="452" width="6" height="118" rx="6" fill="#48C78E"/><text x="684" y="488" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">Detect, then recover</text><text x="684" y="514" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Across four simulations and a real intern health study, it finds change</text><text x="684" y="534" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">points others miss and lets policies recover lost reward.</text></g><line x1="64" y1="606" x2="1216" y2="606" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#4C9BE8" font-weight="700" text-anchor="start">github.com/jtwang95/Double_CUSUM_RL</text><text x="560" y="642" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Is your offline MDP really stationary?  Test it before you trust the policy.</text></svg>