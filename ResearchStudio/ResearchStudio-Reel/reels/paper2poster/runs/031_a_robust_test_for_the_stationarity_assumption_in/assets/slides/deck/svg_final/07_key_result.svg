erif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="middle">OK</text><rect x="316" y="354" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="364.0" y="383.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text><rect x="420" y="354" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="468.0" y="383.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text><rect x="524" y="354" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="572.0" y="383.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text><text x="100" y="433.28" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="800" text-anchor="start">ODCP</text><rect x="212" y="406" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="260.0" y="435.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text><rect x="316" y="406" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="364.0" y="435.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text><rect x="420" y="406" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="468.0" y="435.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text><rect x="524" y="406" width="96" height="44" rx="8" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="572.0" y="435.04" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">fail</text></g><g id="cue_s07_c3_contrast_cusum_rl_baseline_only_reco"><title>contrast cusum-rl baseline only recovers change point when state one-dimensional</title><rect x="656" y="214" width="560" height="264" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="214" width="6" height="264" rx="6" fill="#F2685C"/><text x="684" y="250" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Where the baselines break</text><text x="684" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">CUSUM-RL recovers the change point only when the state</text><text x="684" y="303" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">is one-dimensional. ODCP fails to control the type-I</text><text x="684" y="324" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">error at all in high dimensions.</text><rect x="684" y="352" width="504" height="50" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="710" cy="377" r="6" fill="#F2C14E"/><text x="726" y="382" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">CUSUM-RL: works only at dim = 1</text><rect x="684" y="410" width="504" height="50" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="710" cy="435" r="6" fill="#F2685C"/><text x="726" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="700" text-anchor="start">ODCP: type-I error uncontrolled in high dim</text></g><g id="cue_s07_c4_toy_example_confirms_double_robustne"><title>toy example confirms double robustness action size power hold long</title><rect x="64" y="492" width="1152" height="116" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="492" width="6" height="116" rx="6" fill="#48C78E"/><text x="92" y="526" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#48C78E" font-weight="800" text-anchor="start">Toy example  ·  double robustness in action</text><text x="92" y="556" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Size and power hold as long as at least one of the two nuisance models is</text><text x="92" y="578" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">correctly specified, with the strongest power when both are right.</text><text x="880" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="700" text-anchor="start">M1 / M2 spec</text><rect x="880" y="520" width="150" height="30" rx="7" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.2"/><text x="955" y="540" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#48C78E" font-weight="800" text-anchor="middle">either correct = valid</text><rect x="880" y="556" width="150" height="30" rx="7" fill="#16324A" stroke="#4C9BE8" stroke-width="1.2"/><text x="955" y="576" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#4C9BE8" font-weight="800" text-anchor="middle">both correct = best power</text></g><text x="64" y="646" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="start">Detection survives to state dimension 30, where the closest competitor only works at dimension one.</text></svg>