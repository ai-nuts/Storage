<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Test stationarity, then trust the policy</text><g id="cue_s10_c1_takeaway_simple"><title>takeaway simple</title><rect x="64" y="176" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="176" width="6" height="116" rx="6" fill="#4C9BE8"/><circle cx="112" cy="234" r="10" fill="#4C9BE8"/><text x="150" y="222" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">The idea in one line</text><text x="150" y="254" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A doubly robust CUSUM test tells you, reliably, when an offline RL environment has stopped</text><text x="150" y="278" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">being stationary.</text></g><g id="cue_s10_c2_marrying_flexibility_modern_machine"><title>marrying flexibility modern machine learning rigor semiparametric statistics doubly robust</title><rect x="64" y="308" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="308" width="6" height="116" rx="6" fill="#34D3C0"/><circle cx="112" cy="366" r="10" fill="#34D3C0"/><text x="150" y="354" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">ML flexibility, valid inference</text><text x="150" y="386" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It marries flexible machine-learning estimators with semiparametric rigor, so it stays valid</text><text x="150" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">even in high dimensions, and policies can be relearned on the correct, stationary segment of</text><text x="150" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">data.</text></g><g id="cue_s10_c3_when_some_homogeneity_present_detect"><title>when some homogeneity present detecting adapting change points recovers near-oracle</title><rect x="64" y="440" width="1152" height="116" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="440" width="6" height="116" rx="6" fill="#48C78E"/><circle cx="112" cy="498" r="10" fill="#48C78E"/><text x="150" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Recover the reward left on the table</text><text x="150" y="518" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">When some homogeneity is present, detecting and adapting to change points recovers</text><text x="150" y="542" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#9DB3C8" font-weight="400" text-anchor="start">near-oracle reward that stationary or sliding-window strategies simply give up.</text></g><line x1="64" y1="596" x2="1216" y2="596" stroke="#26455F" stroke-width="1" stroke-linecap="round"/><text x="64" y="632" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#EAF2FB" font-weight="700" text-anchor="start">A Robust Test for the Stationarity Assumption in Sequential Decision Making</text><text x="64" y="660" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">ICML 2023  ·  Wang, Shi &amp; Wu  ·  github.com/jtwang95/Double_CUSUM_RL</text></svg>