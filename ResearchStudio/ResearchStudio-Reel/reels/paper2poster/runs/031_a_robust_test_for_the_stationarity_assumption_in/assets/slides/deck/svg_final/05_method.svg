<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">CUSUM comparison, made doubly robust</text><g id="cue_s05_c1_how_test_works_candidate_change"><title>how test works candidate change point compares pooled transition dynamics</title><rect x="64" y="158" width="568" height="196" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="196" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Step 1  ·  compare before vs after</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">At each candidate change point t, compare the pooled</text><text x="92" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">transition dynamics before and after t with a CUSUM-style</text><text x="92" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">statistic.</text><line x1="92" y1="334" x2="484" y2="334" stroke="#26455F" stroke-width="3" stroke-linecap="round"/><line x1="92" y1="334" x2="307" y2="334" stroke="#4C9BE8" stroke-width="4" stroke-linecap="round"/><line x1="307" y1="334" x2="484" y2="334" stroke="#F2C14E" stroke-width="4" stroke-linecap="round"/><line x1="307" y1="298" x2="307" y2="340" stroke="#F2685C" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="307" cy="334" r="5" fill="#F2685C"/><text x="197.84" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#4C9BE8" font-weight="800" text-anchor="middle">P before</text><text x="397.76" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#F2C14E" font-weight="800" text-anchor="middle">P after</text><text x="307" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2685C" font-weight="700" text-anchor="middle">candidate t</text><text x="500" y="338" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="start">same?</text></g><g id="cue_s05_c2_naively_plugging_modern_machine_lear"><title>naively plugging modern machine-learning estimators comparison introduces heavy bias authors</title><rect x="64" y="370" width="568" height="180" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="64" y="370" width="6" height="180" rx="6" fill="#F2685C"/><text x="92" y="408" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Step 2  ·  kill the plug-in bias</text><text x="92" y="438" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Naively plugging ML estimators into the comparison</text><text x="92" y="459" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">introduces heavy bias, so add a mean-zero augmentation</text><text x="92" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">term to get a doubly robust estimating function psi.</text><rect x="92" y="506" width="512" height="44" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="348.0" y="534.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">psi = naive  +  mean-zero correction   (E psi = 0 under H0)</text></g><g id="cue_s05_c3_lets_flexible_models_like_neural"><title>lets flexible models like neural networks random forests estimate transition</title><rect x="656" y="158" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="150" rx="6" fill="#34D3C0"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#34D3C0" font-weight="800" text-anchor="start">Step 3  ·  plug in flexible ML</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The correction lets neural nets, random forests, or</text><text x="684" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">lasso estimate the transition and state-action</text><text x="684" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">distributions without spoiling the inference.</text><rect x="684" y="282" width="504" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="297.0" r="5" fill="#34D3C0"/><text x="718" y="303.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">neural nets  ·  random forests  ·  lasso</text></g><g id="cue_s05_c4_sample_splitting_cross_fitting_norma"><title>sample splitting cross-fitting normalize statistic across candidate points test functions</title><rect x="656" y="324" width="560" height="130" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="324" width="6" height="130" rx="6" fill="#F2C14E"/><text x="684" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2C14E" font-weight="800" text-anchor="start">Step 4  ·  normalize, then bootstrap</text><text x="684" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Sample splitting and cross-fitting normalize the</text><text x="684" y="413" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">statistic across candidate points and test functions; a</text><text x="684" y="434" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Gaussian multiplier bootstrap gives the p-value.</text></g><rect x="656" y="470" width="560" height="80" rx="12" fill="#16324A" stroke="#4C9BE8" stroke-width="1.5"/><rect x="656" y="470" width="6" height="80" rx="6" fill="#4C9BE8"/><text x="684" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Test statistic</text><text x="936.0" y="528" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#EAF2FB" font-weight="800" text-anchor="middle">Gamma = max_t max_h  sqrt( t(T-t)/T^2 )  S(t,h)</text></svg>