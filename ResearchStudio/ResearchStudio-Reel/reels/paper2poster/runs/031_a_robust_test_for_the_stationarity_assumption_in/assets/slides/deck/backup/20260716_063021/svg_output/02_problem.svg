<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One fragile assumption under every policy</text><g id="cue_s02_c1_reinforcement_learning_agents_traine"><title>reinforcement learning agents trained find optimal policy but nearly every</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#4C9BE8"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="18" fill="#EAF2FB" font-weight="800" text-anchor="start">RL chases the optimal policy</text><text x="92" y="240" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">Agents are trained to find the best</text><text x="92" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">possible policy, but nearly every</text><text x="92" y="288" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="400" text-anchor="start">algorithm leans on one fragile premise.</text><rect x="92" y="336" width="344" height="120" rx="10" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><text x="112" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">Assumed: a frozen MDP</text><circle cx="140" cy="412" r="12" fill="#4C9BE8"/><text x="140" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#0B1B2B" font-weight="800" text-anchor="middle">s</text><line x1="156" y1="412" x2="232" y2="412" stroke="#4C9BE8" stroke-width="2" stroke-linecap="round"/><text x="194" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">P, R fixed</text><circle cx="252" cy="412" r="12" fill="#4C9BE8"/><text x="252" y="417" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#0B1B2B" font-weight="800" text-anchor="middle">s'</text><line x1="268" y1="412" x2="344" y2="412" stroke="#4C9BE8" stroke-width="2" stroke-linecap="round"/><circle cx="364" cy="412" r="12" fill="#4C9BE8"/><text x="92" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#4C9BE8" font-weight="700" text-anchor="start">Transition P and reward R never change with time.</text></g><g id="cue_s02_c2_stationarity_assumption_requiring_st"><title>stationarity assumption requiring state transition reward functions stay fixed over</title><rect x="500" y="158" width="716" height="124" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="158" width="6" height="124" rx="6" fill="#F2C14E"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">The stationarity assumption</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">It requires the state-transition function and the reward function to</text><text x="528" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">stay exactly the same at every time step over the whole horizon.</text><text x="528" y="272" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5" fill="#F2C14E" font-weight="800" text-anchor="start">P_t = P  and  R_t = R   for all t</text></g><g id="cue_s02_c3_robotics_healthcare_digital_marketin"><title>robotics healthcare digital marketing all drift over long horizons policy</title><rect x="500" y="294" width="716" height="110" rx="14" fill="#2A1720" stroke="#F2685C" stroke-width="1.5"/><rect x="500" y="294" width="6" height="110" rx="6" fill="#F2685C"/><text x="528" y="332" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">In the real world it rarely holds</text><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Robotics, healthcare, and digital marketing all drift over long horizons,</text><text x="528" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">so a frozen policy turns suboptimal, even harmful.</text></g><g id="cue_s02_c4_problem_tackles_how_reliably_tell"><title>problem tackles how reliably tell whether offline decision-making system actually</title><rect x="500" y="416" width="716" height="134" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="500" y="416" width="6" height="134" rx="6" fill="#4C9BE8"/><text x="528" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#4C9BE8" font-weight="800" text-anchor="start">The question this paper answers</text><text x="528" y="484" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Before you trust the policy an offline system produced, can you reliably</text><text x="528" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">tell whether that system was actually stationary in the first place?</text><text x="528" y="540" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" fill="#4C9BE8" font-weight="800" text-anchor="start">Test stationarity  -&gt;  then trust (or relearn) the policy</text></g></svg>