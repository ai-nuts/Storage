<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">ABLATION STUDY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Double robustness, sweep by sweep</text><g id="cue_s08_c1_most_informative_ablation_varies_mis"><title>most informative ablation varies misspecification level mild severe across five</title><rect x="64" y="158" width="560" height="120" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="120" rx="6" fill="#4C9BE8"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#4C9BE8" font-weight="800" text-anchor="start">Sweep 1  ·  vary misspecification</text><text x="92" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Vary the model misspecification level lambda from mild</text><text x="92" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">to severe across five hundred replications.</text><text x="92" y="268" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#4C9BE8" font-weight="800" text-anchor="start">lambda in {0.1, 0.3, 0.5, 0.7, 0.9}   ·   500 reps</text></g><g id="cue_s08_c2_shows_empirical_size_staying_pinned"><title>shows empirical size staying pinned nominal level whenever least one</title><rect x="64" y="294" width="560" height="256" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="294" width="6" height="256" rx="6" fill="#48C78E"/><text x="92" y="330" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#EAF2FB" font-weight="800" text-anchor="start">Empirical size stays at nominal if either model is right</text><text x="162" y="390.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="end">M1 ok</text><text x="162" y="462.4" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="end">M1 wrong</text><text x="263.0" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">M2 ok</text><text x="441.0" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">M2 wrong</text><rect x="178" y="352" width="170" height="64" rx="9" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.4"/><text x="263.0" y="391.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="middle">valid+ (best)</text><rect x="356" y="352" width="170" height="64" rx="9" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.4"/><text x="441.0" y="391.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="middle">valid</text><rect x="178" y="424" width="170" height="64" rx="9" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.4"/><text x="263.0" y="463.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#48C78E" font-weight="800" text-anchor="middle">valid</text><rect x="356" y="424" width="170" height="64" rx="9" fill="#2A1720" stroke="#F2685C" stroke-width="1.4"/><text x="441.0" y="463.68" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#F2685C" font-weight="800" text-anchor="middle">invalid</text></g><g id="cue_s08_c3_second_sweep_varies_kappa_length"><title>second sweep varies kappa length tested interval actually locate single</title><rect x="656" y="158" width="560" height="392" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="158" width="6" height="392" rx="6" fill="#F2C14E"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#F2C14E" font-weight="800" text-anchor="start">Sweep 2  ·  locate the change point</text><text x="684" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Sweep kappa, the length of the tested interval. The test</text><text x="684" y="248" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">holds its size while the null is true, then its power</text><text x="684" y="270" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">climbs once the interval crosses the true change point at</text><text x="684" y="292" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">25.</text><rect x="684" y="318" width="504" height="180" rx="8" fill="#0E2334" stroke="#26455F" stroke-width="1.5"/><line x1="708" y1="476" x2="1176" y2="476" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="708" y1="330" x2="708" y2="476" stroke="#26455F" stroke-width="1.5" stroke-linecap="round"/><line x1="708" y1="467.0" x2="1176" y2="467.0" stroke="#4C9BE8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/><polyline points="708.0,467.0 716.0,467.0 724.0,467.0 732.0,467.0 740.0,467.0 748.0,467.0 756.0,467.0 764.0,467.0 772.0,467.0 780.0,467.0 788.0,467.0 796.0,467.0 804.0,467.0 812.0,467.0 820.0,467.0 828.0,467.0 836.0,467.0 844.0,467.0 852.0,467.0 860.0,467.0 868.0,467.0 876.0,467.0 884.0,467.0 892.0,467.0 900.0,467.0 908.0,467.0 916.0,467.0 924.0,467.0 932.0,467.0 940.0,463.8 948.0,451.6 956.0,440.6 964.0,430.8 972.0,421.9 980.0,413.9 988.0,406.6 996.0,400.1 1004.0,394.3 1012.0,389.0 1020.0,384.2 1028.0,380.0 1036.0,376.1 1044.0,372.6 1052.0,369.5 1060.0,366.7 1068.0,364.1 1076.0,361.8 1084.0,359.8 1092.0,357.9 1100.0,356.2 1108.0,354.7 1116.0,353.4 1124.0,352.1 1132.0,351.0 1140.0,350.0 1148.0,349.1 1156.0,348.3 1164.0,347.6" fill="none" stroke="#F2C14E" stroke-width="2.8"/><line x1="940" y1="332" x2="940" y2="476" stroke="#F2685C" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 4"/><text x="940" y="328" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#F2685C" font-weight="700" text-anchor="middle">kappa=25</text><text x="714" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#F2C14E" font-weight="700" text-anchor="start">rejection rate</text><text x="1174" y="490" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#6E869C" font-weight="600" text-anchor="end">kappa -&gt;</text><text x="1174" y="463.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#4C9BE8" font-weight="700" text-anchor="end">alpha=0.05</text><text x="684" y="528" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#F2C14E" font-weight="800" text-anchor="start">Correct size for kappa &lt;= 25  ·  rising power for kappa &gt; 25</text></g></svg>