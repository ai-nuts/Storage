<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1B2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#4C9BE8"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">DATASET / BENCHMARK</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Four simulations and one real trial</text><g id="cue_s06_c1_method_stress_tested_across_four_num"><title>method stress-tested across four numerical studies one real dataset discrete-state</title><rect x="64" y="158" width="1152" height="58" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="158" width="6" height="58" rx="6" fill="#4C9BE8"/><text x="92" y="193" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#EAF2FB" font-weight="600" text-anchor="start">The method is stress-tested across four numerical studies of rising difficulty, plus one real mobile-health dataset.</text></g><g id="cue_s06_c2_high_dimensional_synthetic_pushes_st"><title>high-dimensional synthetic pushes state dimension one thirty pits test against</title><rect x="64" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="64" y="240" width="6" height="150" rx="6" fill="#34D3C0"/><text x="92" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#34D3C0" font-weight="800" text-anchor="start">Toy example + high-dim synthetic</text><text x="92" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A discrete-state toy shows double robustness; synthetic data</text><text x="92" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">pushes the state dimension from 1 up to 30.</text><rect x="92" y="352" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="110" cy="367.0" r="5" fill="#34D3C0"/><text x="126" y="373.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">vs ODCP   ·   vs CUSUM-RL     state dim 1 -&gt; 30</text></g><g id="cue_s06_c3_four_by_four_grid_world_shows_how"><title>four-by-four grid world shows how detecting change point improves policy</title><rect x="656" y="240" width="560" height="150" rx="14" fill="#12293D" stroke="#26455F" stroke-width="1.5"/><rect x="656" y="240" width="6" height="150" rx="6" fill="#F2C14E"/><text x="684" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#F2C14E" font-weight="800" text-anchor="start">Grid world + batch-online</text><text x="684" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">A 4x4 grid world shows change detection improving policy</text><text x="684" y="333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">learning; a batch-online study mimics the real trial.</text><rect x="684" y="352" width="468" height="30" rx="8" fill="#16324A" stroke="#26455F" stroke-width="1.5"/><circle cx="702" cy="367.0" r="5" fill="#F2C14E"/><text x="718" y="373.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">4x4 grid world   ·   semi-synthetic online study</text></g><g id="cue_s06_c4_finally_authors_apply_test_intern"><title>finally authors apply test intern health study twenty-one-week mobile-health micro-randomized</title><rect x="64" y="410" width="1152" height="140" rx="14" fill="#0F2E2B" stroke="#48C78E" stroke-width="1.5"/><rect x="64" y="410" width="6" height="140" rx="6" fill="#48C78E"/><text x="92" y="448" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" fill="#48C78E" font-weight="800" text-anchor="start">Real data  ·  the Intern Health Study (IHS)</text><text x="92" y="480" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">A 21-week micro-randomized mobile-health trial of first-year medical interns in the United States, the study</text><text x="92" y="503" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">that motivated the whole method.</text><text x="92" y="536" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#48C78E" font-weight="800" text-anchor="start">21 weeks   ·   micro-randomized trial   ·   Internal Medicine &amp; Family Practice</text></g></svg>