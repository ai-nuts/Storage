<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">MOTIVATION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Five properties of flexible learning</text><g id="cue_s03_c1_authors_summarize_five_properties_ef"><title>authors summarize five properties efficient flexible human learning being knowledge-acquirable</title><rect x="64" y="158" width="560" height="204" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="204" rx="6" fill="#3E9BFF"/><text x="92" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#3E9BFF" font-weight="800" text-anchor="start">What efficient human learning needs</text><text x="92" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The authors distill five properties of efficient, flexible</text><text x="92" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">human learning.</text><rect x="92.0" y="264" width="92.8" height="52" rx="9" fill="#173453" stroke="#3E9BFF" stroke-width="1.5"/><circle cx="138.4" cy="282" r="7" fill="#3E9BFF"/><text x="138.4" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">acquirable</text><rect x="194.8" y="264" width="92.8" height="52" rx="9" fill="#173453" stroke="#33D6C0" stroke-width="1.5"/><circle cx="241.20000000000002" cy="282" r="7" fill="#33D6C0"/><text x="241.20000000000002" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">efficient</text><rect x="297.6" y="264" width="92.8" height="52" rx="9" fill="#173453" stroke="#46C98B" stroke-width="1.5"/><circle cx="344.0" cy="282" r="7" fill="#46C98B"/><text x="344.0" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle"></text><text x="344.0" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">generalizable</text><rect x="400.4" y="264" width="92.8" height="52" rx="9" fill="#173453" stroke="#F4C24C" stroke-width="1.5"/><circle cx="446.79999999999995" cy="282" r="7" fill="#F4C24C"/><text x="446.79999999999995" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle"></text><text x="446.79999999999995" y="315" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">compositional</text><rect x="503.2" y="264" width="92.8" height="52" rx="9" fill="#173453" stroke="#9C86F0" stroke-width="1.5"/><circle cx="549.6" cy="282" r="7" fill="#9C86F0"/><text x="549.6" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10.5" fill="#EAF2FB" font-weight="700" text-anchor="middle">incremental</text><text x="92" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">existing methods satisfy some, but stumble on flexibility</text></g><g id="cue_s03_c2_existing_knowledge_guided_reinforcem"><title>existing knowledge-guided reinforcement learning methods satisfy some these but stumble</title><rect x="64" y="378" width="560" height="172" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="64" y="378" width="6" height="172" rx="6" fill="#F4C24C"/><text x="92" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#F4C24C" font-weight="800" text-anchor="start">Fusion tied to number &amp; ordering</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">When fusion depends on the count or ordering of external</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">policies, rearranging the set or swapping a policy means</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">rebuilding or retraining large parts of the model.</text></g><g id="cue_s03_c3_when_their_fusion_mechanism_depends"><title>when their fusion mechanism depends number ordering external policies rearranging</title><rect x="648" y="158" width="568" height="204" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="648" y="158" width="6" height="204" rx="6" fill="#F2685C"/><text x="676" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F2685C" font-weight="800" text-anchor="start">Swapping a policy breaks the model</text><text x="676" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Prior actors such as KoGuN and A2T tie fusion to fixed input</text><text x="676" y="246" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">orderings or per-policy parameters, so adding or removing</text><text x="676" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">one policy forces architectural changes.</text><rect x="676" y="312" width="512" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="932.0" y="338.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#F2685C" font-weight="800" text-anchor="middle">add / remove policy  =&gt;  retrain</text></g><g id="cue_s03_c4_motivation_design_actor_whose_struct"><title>motivation design actor whose structure lets knowledge policies freely rearranged</title><rect x="648" y="378" width="568" height="172" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="648" y="378" width="6" height="172" rx="6" fill="#46C98B"/><text x="676" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Design goal: a reorderable actor</text><text x="676" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Design an actor whose structure lets knowledge policies be</text><text x="676" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">freely rearranged, added, or replaced, so one trained agent</text><text x="676" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">can carry its skills into new tasks.</text><text x="676" y="524" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#46C98B" font-weight="800" text-anchor="start">one trained agent  -&gt;  many new tasks</text></g></svg>