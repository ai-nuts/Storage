15" fill="#F4C24C" font-weight="800" text-anchor="start">Worst on the demanding tasks</text><text x="92" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">The collapse bites hardest on dynamic obstacles,</text><text x="92" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">multi-room mazes, and the robotic manipulation tasks like</text><text x="92" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Push, Slide, and Pick-and-Place.</text></g><g id="cue_s08_c3_switching_modified_policy_distributi"><title>switching modified policy distributions restores efficient exploration recovers strong performance</title><rect x="656" y="158" width="560" height="204" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="656" y="158" width="6" height="204" rx="6" fill="#46C98B"/><text x="684" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">Modified distributions fix it</text><text x="684" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Switching on the modified policy</text><text x="684" y="244" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">distributions restores efficient</text><text x="684" y="264" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">exploration and recovers strong</text><text x="684" y="284" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">performance.</text><rect x="972" y="206" width="232" height="140" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><text x="986" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#46C98B" font-weight="800" text-anchor="start">weights balanced</text><text x="1020" y="251.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10" fill="#33D6C0" font-weight="800" text-anchor="end">pi_in</text><rect x="1030" y="240.0" width="148" height="14" rx="4" fill="#0A1A2C" stroke="#2A4D6E" stroke-width="0.8"/><rect x="1030" y="240.0" width="59" height="14" rx="4" fill="#33D6C0"/><text x="1097" y="251.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#33D6C0" font-weight="800" text-anchor="start">0.40</text><text x="1020" y="282.3333333333333" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10" fill="#F4C24C" font-weight="800" text-anchor="end">pi_g1</text><rect x="1030" y="271.3333333333333" width="148" height="14" rx="4" fill="#0A1A2C" stroke="#2A4D6E" stroke-width="0.8"/><rect x="1030" y="271.3333333333333" width="50" height="14" rx="4" fill="#F4C24C"/><text x="1088" y="282.3333333333333" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F4C24C" font-weight="800" text-anchor="start">0.34</text><text x="1020" y="313.6666666666667" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10" fill="#F2685C" font-weight="800" text-anchor="end">pi_g2</text><rect x="1030" y="302.6666666666667" width="148" height="14" rx="4" fill="#0A1A2C" stroke="#2A4D6E" stroke-width="0.8"/><rect x="1030" y="302.6666666666667" width="38" height="14" rx="4" fill="#F2685C"/><text x="1076" y="313.6666666666667" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#F2685C" font-weight="800" text-anchor="start">0.26</text></g><g id="cue_s08_c4_separate_compositional_incremental_e"><title>separate compositional incremental experiments confirm modular design pays off kian</title><rect x="656" y="378" width="560" height="172" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="656" y="378" width="6" height="172" rx="6" fill="#33D6C0"/><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="800" text-anchor="start">Modular reuse pays off</text><text x="684" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Compositional and incremental experiments confirm KIAN</text><text x="684" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">reuses its keys and inner policy to acquire new tasks</text><text x="684" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">sequentially with fewer samples than training from</text><text x="684" y="502" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">scratch.</text></g></svg>