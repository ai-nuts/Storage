<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">METHOD</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Query-key attention over policies</text><g id="cue_s05_c1_kian_knowledge_inclusive_attention_n"><title>kian knowledge-inclusive attention network built three components inner actor normal</title><rect x="64" y="158" width="1152" height="182" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="182" rx="6" fill="#3E9BFF"/><text x="92" y="192" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#EAF2FB" font-weight="800" text-anchor="start">KIAN = inner actor + keys + query</text><text x="92" y="220" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">An inner learnable actor lets the agent form its own</text><text x="92" y="239" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">strategy, so even if every external policy is useless it</text><text x="92" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" fill="#9DB3C8" font-weight="400" text-anchor="start">can still solve the task.</text><rect x="92" y="286" width="536" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="360.0" y="312.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#EAF2FB" font-weight="800" text-anchor="middle">w_i = Phi(s).k_i / c_i    ;    pi = sum_i softmax(w)_i * pi_i</text><rect x="652" y="196" width="564" height="128" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><circle cx="686" cy="260.0" r="15" fill="#3E9BFF"/><text x="686" y="265.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#0B1A2B" font-weight="800" text-anchor="middle">q</text><text x="686" y="236.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">query</text><text x="686" y="290.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#9DB3C8" font-weight="700" text-anchor="middle">Phi(s)</text><line x1="702" y1="260.0" x2="832.12" y2="228.0" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><text x="822.12" y="233.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="800" text-anchor="middle">·</text><rect x="838.12" y="218.0" width="58" height="20" rx="5" fill="#173453" stroke="#33D6C0" stroke-width="1.3"/><text x="867.12" y="232.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#33D6C0" font-weight="800" text-anchor="middle">k_in</text><line x1="702" y1="260.0" x2="832.12" y2="270.0" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><text x="822.12" y="275.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="800" text-anchor="middle">·</text><rect x="838.12" y="260.0" width="58" height="20" rx="5" fill="#173453" stroke="#F4C24C" stroke-width="1.3"/><text x="867.12" y="274.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#F4C24C" font-weight="800" text-anchor="middle">k_g1</text><line x1="702" y1="260.0" x2="832.12" y2="312.0" stroke="#2A4D6E" stroke-width="1.2" stroke-linecap="round"/><text x="822.12" y="317.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="800" text-anchor="middle">·</text><rect x="838.12" y="302.0" width="58" height="20" rx="5" fill="#173453" stroke="#F2685C" stroke-width="1.3"/><text x="867.12" y="316.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#F2685C" font-weight="800" text-anchor="middle">k_g2</text><text x="1025.94" y="211" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#3E9BFF" font-weight="800" text-anchor="middle">softmax w^</text><line x1="896.12" y1="228.0" x2="977.94" y2="228.0" stroke="#2A4D6E" stroke-width="1.0" stroke-linecap="round"/><rect x="981.94" y="220.0" width="57" height="16" rx="4" fill="#33D6C0"/><line x1="896.12" y1="270.0" x2="977.94" y2="269.0" stroke="#2A4D6E" stroke-width="1.0" stroke-linecap="round"/><rect x="981.94" y="261.0" width="36" height="16" rx="4" fill="#F4C24C"/><line x1="896.12" y1="312.0" x2="977.94" y2="310.0" stroke="#2A4D6E" stroke-width="1.0" stroke-linecap="round"/><rect x="981.94" y="302.0" width="25" height="16" rx="4" fill="#F2685C"/><line x1="1093.94" y1="260.0" x2="1150" y2="260.0" stroke="#2A4D6E" stroke-width="1.4" stroke-linecap="round"/><polygon points="1150,260.0 1136.8569220667673,263.3559787702294 1136.8569220667673,256.6440212297706" fill="#2A4D6E"/><circle cx="1170" cy="260.0" r="20" fill="none" stroke="#46C98B" stroke-width="2.4"/><text x="1170" y="266.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#46C98B" font-weight="800" text-anchor="middle">pi</text><text x="1170" y="232.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#46C98B" font-weight="800" text-anchor="middle">fused</text><text x="1170" y="296.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="9" fill="#9DB3C8" font-weight="600" text-anchor="middle">sample a</text></g><g id="cue_s05_c2_knowledge_policy_including_inner_one"><title>knowledge policy including inner one given learnable embedding vector called</title><rect x="64" y="356" width="560" height="194" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="356" width="6" height="194" rx="6" fill="#33D6C0"/><text x="92" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Every policy gets a learnable key</text><text x="92" y="424" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Each knowledge policy, including the inner one, is given a</text><text x="92" y="444" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">learnable embedding vector, its key, which represents the</text><text x="92" y="464" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">whole policy independent of any state or action.</text><rect x="92" y="508" width="504" height="30" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="344.0" y="529.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#EAF2FB" font-weight="800" text-anchor="middle">key k_i : one vector per policy</text></g><g id="cue_s05_c3_state_dependent_query_produces_vecto"><title>state-dependent query produces vector compared every key dot product softmax</title><rect x="656" y="356" width="560" height="90" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="656" y="356" width="6" height="90" rx="6" fill="#F4C24C"/><text x="684" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Query, dot-product, softmax, fuse</text><text x="684" y="414" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A state-dependent query meets each key by a dot product; softmax turns the scores</text><text x="684" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">into fusion weights over the policies.</text></g><g id="cue_s05_c4_because_key_independent_policies_uno"><title>because key independent policies unordered rearranged any one replaced just</title><rect x="656" y="462" width="560" height="88" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="656" y="462" width="6" height="88" rx="6" fill="#46C98B"/><text x="684" y="494" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">Independent keys =&gt; swappable</text><text x="684" y="520" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Each key is independent, so policies are unordered and any one is swapped just by</text><text x="684" y="538" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="400" text-anchor="start">replacing its key, no retraining needed.</text></g></svg>