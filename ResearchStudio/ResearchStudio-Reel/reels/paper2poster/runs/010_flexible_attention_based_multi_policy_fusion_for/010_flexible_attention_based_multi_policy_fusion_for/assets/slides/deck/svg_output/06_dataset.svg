B" stroke-width="1.5"/><rect x="64" y="474" width="6" height="76" rx="6" fill="#46C98B"/><text x="92" y="506" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#46C98B" font-weight="800" text-anchor="start">A rigorous protocol</text><rect x="560" y="482" width="168" height="60" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="644.0" y="513.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20.400000000000002" fill="#3E9BFF" font-weight="800" text-anchor="middle">2</text><text x="644.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">benchmark suites</text><rect x="742" y="482" width="168" height="60" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="826.0" y="513.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20.400000000000002" fill="#33D6C0" font-weight="800" text-anchor="middle">10</text><text x="826.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">random seeds</text><rect x="924" y="482" width="168" height="60" rx="12" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="1008.0" y="513.2" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20.400000000000002" fill="#F4C24C" font-weight="800" text-anchor="middle">95%</text><text x="1008.0" y="530.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="middle">conf. intervals</text><text x="92" y="532" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#9DB3C8" font-weight="600" text-anchor="start">learning curves averaged with error bands</text></g></svg>