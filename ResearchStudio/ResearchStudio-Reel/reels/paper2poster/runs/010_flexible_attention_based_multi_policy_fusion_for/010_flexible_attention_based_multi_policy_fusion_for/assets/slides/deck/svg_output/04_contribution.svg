<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">CONTRIBUTION</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">One paradigm, one actor, one fix</text><g id="cue_s04_c1_makes_three_main_contributions_first"><title>makes three main contributions first defines knowledge-grounded reinforcement learning paradigm</title><rect x="64" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="180" width="272" height="6" rx="6" fill="#3E9BFF"/><circle cx="114" cy="246" r="26" fill="none" stroke="#3E9BFF" stroke-width="2.5"/><text x="114" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#3E9BFF" font-weight="800" text-anchor="middle">1</text><text x="88" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">KGRL</text><text x="88" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Knowledge-Grounded RL: a</text><text x="88" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">paradigm that fuses an inner,</text><text x="88" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">self-learned policy with</text><text x="88" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">multiple external knowledge</text><text x="88" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">policies.</text></g><g id="cue_s04_c2_second_introduces_knowledge_inclusiv"><title>second introduces knowledge-inclusive attention network kian whose embedding-based attention lets</title><rect x="360" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="360" y="180" width="272" height="6" rx="6" fill="#33D6C0"/><circle cx="410" cy="246" r="26" fill="none" stroke="#33D6C0" stroke-width="2.5"/><text x="410" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#33D6C0" font-weight="800" text-anchor="middle">2</text><text x="384" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">KIAN</text><text x="384" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The Knowledge-Inclusive</text><text x="384" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Attention Network, whose</text><text x="384" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">embedding-based attention</text><text x="384" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">lets policies be freely</text><text x="384" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rearranged, added, or</text><text x="384" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">replaced without touching the</text><text x="384" y="478" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">rest of the network.</text></g><g id="cue_s04_c3_third_uncovers_problem_called_entrop"><title>third uncovers problem called entropy imbalance arises when maximizing entropy</title><rect x="656" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="656" y="180" width="272" height="6" rx="6" fill="#F4C24C"/><circle cx="706" cy="246" r="26" fill="none" stroke="#F4C24C" stroke-width="2.5"/><text x="706" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#F4C24C" font-weight="800" text-anchor="middle">3</text><text x="680" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Entropy imbalance</text><text x="680" y="352" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">A newly uncovered problem</text><text x="680" y="373" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">when maximizing entropy for</text><text x="680" y="394" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">exploration; the paper proves</text><text x="680" y="415" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">when it happens and proposes</text><text x="680" y="436" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">modified policy distributions</text><text x="680" y="457" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">that fix it.</text></g><g id="cue_s04_c4_together_these_give_agent_efficient"><title>together these give agent efficient generalizable truly modular its knowledge</title><rect x="952" y="180" width="272" height="372" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="952" y="180" width="272" height="6" rx="6" fill="#46C98B"/><circle cx="1002" cy="246" r="26" fill="none" stroke="#46C98B" stroke-width="2.5"/><text x="1002" y="255" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="26" fill="#46C98B" font-weight="800" text-anchor="middle">+</text><text x="976" y="314" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Efficient &amp;</text><text x="976" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">modular</text><text x="976" y="378" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Together these give an agent</text><text x="976" y="399" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">that is efficient,</text><text x="976" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">generalizable, and truly</text><text x="976" y="441" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">modular in its use of</text><text x="976" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">external knowledge.</text></g><text x="64" y="586" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15.5" fill="#33D6C0" font-weight="700" text-anchor="start">An agent that is efficient, generalizable, and modular in how it reuses knowledge.</text></svg>