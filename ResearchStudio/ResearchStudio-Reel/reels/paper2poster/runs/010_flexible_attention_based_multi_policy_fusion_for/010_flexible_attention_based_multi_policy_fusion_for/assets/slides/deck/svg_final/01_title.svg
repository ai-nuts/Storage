<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><text x="64" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="800" text-anchor="start" letter-spacing="2">NeurIPS 2023</text><text x="1216" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="end">Knowledge-Grounded RL  ·  Attention-Based Policy Fusion</text><line x1="64" y1="88" x2="1216" y2="88" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><text x="64" y="150" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="44" fill="#FFFFFF" font-weight="800" text-anchor="start">KIAN</text><text x="64" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">Flexible Attention-Based Multi-Policy Fusion</text><text x="64" y="224" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="23" fill="#3E9BFF" font-weight="800" text-anchor="start">for Efficient Deep Reinforcement Learning</text><line x1="1112" y1="182" x2="1052" y2="131.0" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><line x1="1112" y1="182" x2="1052" y2="239.0" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><line x1="1112" y1="182" x2="1172" y2="131.0" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><line x1="1112" y1="182" x2="1172" y2="239.0" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><circle cx="1052" cy="131.0" r="9" fill="#33D6C0"/><circle cx="1052" cy="239.0" r="9" fill="#3E9BFF"/><circle cx="1172" cy="131.0" r="9" fill="#F4C24C"/><circle cx="1172" cy="239.0" r="9" fill="#F2685C"/><circle cx="1112" cy="182" r="18" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><circle cx="1112" cy="182" r="7" fill="#FFFFFF"/><text x="1112" y="108" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33D6C0" font-weight="800" text-anchor="middle">keys = policies</text><text x="1112" y="266" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">attention fusion</text><text x="64" y="258" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="500" text-anchor="start">Zih-Yun Chiu · Yi-Lin Tuan · William Yang Wang · Michael C. Yip</text><text x="64" y="280" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="600" text-anchor="start">UC San Diego   ·   UC Santa Barbara</text><g id="cue_s01_c1_reinforcement_learning_agents_still"><title>reinforcement learning agents still learn far less efficiently humans who</title><rect x="64" y="306" width="368" height="224" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="306" width="368" height="6" rx="6" fill="#3E9BFF"/><circle cx="92" cy="350" r="7" fill="#3E9BFF"/><text x="110" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Humans reuse strategies</text><text x="90" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Reinforcement learning agents still learn</text><text x="90" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">far less efficiently than humans, who</text><text x="90" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">freely borrow strategies from many sources</text><text x="90" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">and rearrange them at will.</text></g><g id="cue_s01_c2_work_presented_neurips_2023_introduc"><title>work presented neurips 2023 introduces knowledge-grounded reinforcement learning paradigm fuses</title><rect x="456" y="306" width="368" height="224" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="306" width="368" height="6" rx="6" fill="#33D6C0"/><circle cx="484" cy="350" r="7" fill="#33D6C0"/><text x="502" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">KGRL + the KIAN actor</text><text x="482" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Presented at NeurIPS 2023, this work</text><text x="482" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">introduces Knowledge-Grounded RL, fusing</text><text x="482" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">many external knowledge policies, and a</text><text x="482" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">new actor, the Knowledge-Inclusive</text><text x="482" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Attention Network.</text></g><g id="cue_s01_c3_kian_lets_agent_add_remove"><title>kian lets agent add remove recombine knowledge policies without retraining</title><rect x="848" y="306" width="368" height="224" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="306" width="368" height="6" rx="6" fill="#46C98B"/><circle cx="876" cy="350" r="7" fill="#46C98B"/><text x="894" y="356" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">Add, drop, recombine</text><text x="874" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">KIAN lets an agent add, remove, and</text><text x="874" y="426" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">recombine knowledge policies without</text><text x="874" y="446" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">retraining, fixes an exploration pathology</text><text x="874" y="466" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">called entropy imbalance, and learns more</text><text x="874" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">efficiently.</text></g><line x1="64" y1="556" x2="1216" y2="556" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><text x="64" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#3E9BFF" font-weight="700" text-anchor="start">arXiv:2210.03729</text><text x="310" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="600" text-anchor="start">github.com/Pascalson/KGRL</text><text x="1216" y="592" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">Modular knowledge for sample-efficient RL.</text></svg>