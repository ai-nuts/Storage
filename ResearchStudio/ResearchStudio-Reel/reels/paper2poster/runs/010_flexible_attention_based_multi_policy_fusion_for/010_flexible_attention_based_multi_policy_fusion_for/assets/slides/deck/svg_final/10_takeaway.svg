<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">TAKEAWAY</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Knowledge as modular building blocks</text><g id="cue_s10_c1_lasting_message_treating_knowledge_p"><title>lasting message treating knowledge policy independent attention-addressable key turns external</title><rect x="64" y="176" width="368" height="360" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="176" width="368" height="6" rx="6" fill="#3E9BFF"/><circle cx="98" cy="230" r="11" fill="#3E9BFF"/><text x="92" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Each policy is a key</text><text x="92" y="318" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Treating each knowledge policy</text><text x="92" y="340" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">as an independent,</text><text x="92" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">attention-addressable key turns</text><text x="92" y="384" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">external knowledge into truly</text><text x="92" y="406" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">modular building blocks.</text></g><g id="cue_s10_c2_agent_add_drop_reorder_its"><title>agent add drop reorder its policies any time without retraining</title><rect x="456" y="176" width="368" height="360" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="176" width="368" height="6" rx="6" fill="#33D6C0"/><circle cx="490" cy="230" r="11" fill="#33D6C0"/><text x="484" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Add, drop, reorder</text><text x="484" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">freely</text><text x="484" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">An agent can add, drop, or</text><text x="484" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">reorder its policies at any time</text><text x="484" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">without retraining the network,</text><text x="484" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">and the entropy-imbalance fix</text><text x="484" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">keeps exploration efficient when</text><text x="484" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">many are fused.</text></g><g id="cue_s10_c3_result_reinforcement_learning_actor"><title>result reinforcement learning actor learns faster generalizes better stays flexible</title><rect x="848" y="176" width="368" height="360" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="848" y="176" width="368" height="6" rx="6" fill="#46C98B"/><circle cx="882" cy="230" r="11" fill="#46C98B"/><text x="876" y="276" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">Faster, more</text><text x="876" y="302" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="19" fill="#EAF2FB" font-weight="800" text-anchor="start">flexible RL</text><text x="876" y="344" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">The result is an RL actor that</text><text x="876" y="366" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">learns faster, generalizes</text><text x="876" y="388" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">better, and stays flexible,</text><text x="876" y="410" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">moving agents closer to the</text><text x="876" y="432" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">efficiency and adaptability of</text><text x="876" y="454" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">human learning.</text></g><line x1="64" y1="566" x2="1216" y2="566" stroke="#2A4D6E" stroke-width="1" stroke-linecap="round"/><line x1="120" y1="624" x2="95" y2="602.75" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><line x1="120" y1="624" x2="95" y2="647.75" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><line x1="120" y1="624" x2="145" y2="602.75" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><line x1="120" y1="624" x2="145" y2="647.75" stroke="#2A4D6E" stroke-width="1.6" stroke-linecap="round"/><circle cx="95" cy="602.75" r="9" fill="#33D6C0"/><circle cx="95" cy="647.75" r="9" fill="#3E9BFF"/><circle cx="145" cy="602.75" r="9" fill="#F4C24C"/><circle cx="145" cy="647.75" r="9" fill="#F2685C"/><circle cx="120" cy="624" r="18" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><circle cx="120" cy="624" r="7" fill="#FFFFFF"/><text x="120" y="585" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11" fill="#33D6C0" font-weight="800" text-anchor="middle">keys = policies</text><text x="120" y="673" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="11.5" fill="#9DB3C8" font-weight="800" text-anchor="middle">attention fusion</text><text x="1216" y="624" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="600" text-anchor="end">KIAN  ·  Attention-Based Multi-Policy Fusion  ·  NeurIPS 2023</text></svg>