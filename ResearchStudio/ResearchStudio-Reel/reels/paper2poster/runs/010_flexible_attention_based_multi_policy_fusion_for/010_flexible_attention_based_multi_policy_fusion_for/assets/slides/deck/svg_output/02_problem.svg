<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif"><rect x="0" y="0" width="1280" height="720" fill="#0B1A2B"/><rect x="64" y="52" width="5" height="26" rx="2" fill="#3E9BFF"/><text x="82" y="72" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9DB3C8" font-weight="700" text-anchor="start" letter-spacing="2.5">PROBLEM</text><text x="64" y="110" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="30" fill="#EAF2FB" font-weight="800" text-anchor="start">Agents can't freely reuse what they know</text><g id="cue_s02_c1_reinforcement_learning_succeeded_acr"><title>reinforcement learning succeeded across physics robotics yet agents still need</title><rect x="64" y="158" width="404" height="392" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="158" width="6" height="392" rx="6" fill="#3E9BFF"/><text x="92" y="202" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17.5" fill="#EAF2FB" font-weight="800" text-anchor="start">RL is sample-hungry</text><text x="92" y="238" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Reinforcement learning has succeeded</text><text x="92" y="260" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">across physics and robotics, yet agents</text><text x="92" y="282" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">still need enormous numbers of samples to</text><text x="92" y="304" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">solve tasks that humans master quickly.</text><rect x="92" y="360" width="344" height="138" rx="10" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="112" y="390" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12.5" fill="#6E869C" font-weight="700" text-anchor="start">the efficiency gap</text><rect x="112" y="406" width="304" height="40" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><text x="264.0" y="432.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#F2685C" font-weight="800" text-anchor="middle">agent samples  &gt;&gt;  human samples</text><text x="112" y="486" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="12" fill="#9DB3C8" font-weight="600" text-anchor="start">tasks humans master quickly</text></g><g id="cue_s02_c2_part_gap_humans_learn_observing"><title>part gap humans learn observing others freely reuse combine swap</title><rect x="500" y="158" width="716" height="150" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="500" y="158" width="6" height="150" rx="6" fill="#33D6C0"/><text x="528" y="196" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" fill="#33D6C0" font-weight="800" text-anchor="start">Humans reuse, combine, and swap</text><text x="528" y="226" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">Part of the gap is that humans learn by observing</text><text x="528" y="247" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">others and freely reuse, combine, and swap the</text><text x="528" y="268" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" fill="#9DB3C8" font-weight="400" text-anchor="start">strategies they already know.</text><rect x="904" y="214" width="290" height="84" rx="8" fill="#0E223A" stroke="#2A4D6E" stroke-width="1.5"/><text x="918" y="232" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="10" fill="#9DB3C8" font-weight="700" text-anchor="start">add · swap · reorder</text><rect x="918.0" y="250.0" width="59.5" height="30" rx="7" fill="#173453" stroke="#33D6C0" stroke-width="1.4"/><text x="947.75" y="269.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#33D6C0" font-weight="800" text-anchor="middle">k_in</text><rect x="985.5" y="250.0" width="59.5" height="30" rx="7" fill="#173453" stroke="#F4C24C" stroke-width="1.4"/><text x="1015.25" y="269.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#F4C24C" font-weight="800" text-anchor="middle">k_g1</text><rect x="1053.0" y="250.0" width="59.5" height="30" rx="7" fill="#173453" stroke="#F2685C" stroke-width="1.4"/><text x="1082.75" y="269.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#F2685C" font-weight="800" text-anchor="middle">k_g2</text><rect x="1120.5" y="250.0" width="59.5" height="30" rx="7" fill="none" stroke="#46C98B" stroke-width="1.4"/><text x="1150.25" y="269.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#46C98B" font-weight="800" text-anchor="middle">+ new</text></g><g id="cue_s02_c3_earlier_reinforcement_learning_metho"><title>earlier reinforcement learning methods did incorporate external knowledge policies improve</title><rect x="500" y="324" width="716" height="104" rx="14" fill="#2A2417" stroke="#F4C24C" stroke-width="1.5"/><rect x="500" y="324" width="6" height="104" rx="6" fill="#F4C24C"/><text x="528" y="362" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#F4C24C" font-weight="800" text-anchor="start">Prior knowledge-guided RL was rigid</text><text x="528" y="392" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">Earlier methods did inject external knowledge policies to improve efficiency, but they</text><text x="528" y="416" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="400" text-anchor="start">made arbitrary combinations and replacements of those policies hard.</text></g><g id="cue_s02_c4_rigidity_exactly_property_set_out"><title>rigidity exactly property set out fix</title><rect x="500" y="444" width="716" height="106" rx="14" fill="#0F2E2B" stroke="#46C98B" stroke-width="1.5"/><rect x="500" y="444" width="6" height="106" rx="6" fill="#46C98B"/><text x="528" y="482" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#46C98B" font-weight="800" text-anchor="start">This paper fixes that rigidity</text><text x="528" y="512" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">The goal is an actor whose knowledge policies can be freely rearranged, added, or</text><text x="528" y="536" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#9DB3C8" font-weight="400" text-anchor="start">replaced. That rigidity is exactly what this work set out to fix.</text></g></svg>