ica, sans-serif" font-size="15.5" fill="#F4C24C" font-weight="800" text-anchor="start">Continuous control holds up</text><text x="876" y="402" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">In continuous control, competing methods</text><text x="876" y="422" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">that ignore the exploration issue</text><text x="876" y="442" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">collapse, whereas KIAN keeps learning</text><text x="876" y="462" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#EAF2FB" font-weight="400" text-anchor="start">efficiently.</text><rect x="876" y="504" width="316" height="32" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><circle cx="894" cy="520.0" r="5" fill="#F4C24C"/><text x="910" y="526.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">baselines collapse  ·  KIAN keeps learning</text></g></svg>