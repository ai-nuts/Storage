l, 'Helvetica Neue', Helvetica, sans-serif" font-size="9.5" fill="#6E869C" font-weight="600" text-anchor="end">samples -&gt;</text></g><g id="cue_s07_c2_zero_shot_generalization_where_polic"><title>zero-shot generalization where policy trained one task tested different one</title><rect x="64" y="336" width="368" height="214" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="64" y="336" width="6" height="214" rx="6" fill="#33D6C0"/><text x="92" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" fill="#33D6C0" font-weight="800" text-anchor="start">Best zero-shot transfer</text><text x="92" y="400" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">Train on one task, test on another: KIAN</text><text x="92" y="420" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">beats all baselines in most transfers,</text><text x="92" y="440" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" fill="#9DB3C8" font-weight="400" text-anchor="start">with noticeably smaller variance.</text><rect x="92" y="502" width="312" height="32" rx="8" fill="#173453" stroke="#2A4D6E" stroke-width="1.5"/><circle cx="110" cy="518.0" r="5" fill="#33D6C0"/><text x="126" y="524.0" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14.5" fill="#EAF2FB" font-weight="600" text-anchor="start">outperforms all  ·  lower variance</text></g><g id="cue_s07_c3_hardest_simple_to_complex_grid_task"><title>hardest simple-to-complex grid task kian reached reward about 0.93 while</title><rect x="456" y="336" width="368" height="214" rx="14" fill="#122A42" stroke="#2A4D6E" stroke-width="1.5"/><rect x="456" y="336" width="6" height="214" rx="6" fill="#3E9BFF"/><text x="484" y="372" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#3E