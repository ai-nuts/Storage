<g id="cue_s04_c3_third_feeds_2_tocs_maps" data-cue-label="third feeds 2 tocs maps purely geometric conditioning signal stylegan-based"><title>third feeds 2 tocs maps purely geometric conditioning signal stylegan-based</title><desc>third feeds 2 tocs maps purely geometric conditioning signal stylegan-based</desc><rect x="60" y="416" width="568" height="264" rx="14" fill="#1a2236" stroke="#2e3d5e" stroke-width="1.5"/><rect x="78" y="438" width="5" height="26" rx="3" fill="#ffcf5c"/><text x="96" y="458" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="20" fill="#eaf0fb" font-weight="700" text-anchor="start">3 · Geometry-conditioned renderer</text><text x="82" y="496" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" fill="#9db0d0" font-weight="400" text-anchor="start">Feeds 2D TOCS maps as a purely geometric</text>
